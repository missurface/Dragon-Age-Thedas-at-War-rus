l_russian:
 saxon_elective_succession_law:1 "Landsmeet"
 saxon_elective_succession_law_subname:0 "Elective"
 saxon_elective_succession_law_effects:1 "The [ruler|E] and all direct, adult [de_jure|E] vassals of one or two [ranks|E] below the [title|E] can nominate a [title_heir|E] from the most [powerful_vassal|E] amongst them, the ruler's [legitimate|E] children, and any other valid [claimant|E]."
 tooltip_landsmeet_diplomacy_vote_strength:0 "Persuasion $VALUE|=+0$"
 tooltip_landsmeet_martial_vote_strength:0 "Might $VALUE|=+0$"
 tooltip_landsmeet_intrigue_vote_strength:0 "Coercion $VALUE|=+0$"

 saxon_elective_candidates:0 "Close Family, Claimants, and Vassals"
 saxon_elective_candidates_tooltip:1 "In order to be a valid Candidate under the Landsmeet, a character must fulfill one of the following conditions:\n$EFFECT_LIST_BULLET$Be a [close_family|E] member of the current ruler, who is not in line to inherit a Theocracy or Republic\n$EFFECT_LIST_BULLET$Be a [claimant|E] to the title, who is not in line to inherit a Theocracy or Republic. Children of a candidate cannot be nominated\n$EFFECT_LIST_BULLET$Be a [powerful_vassal_powerful|E] [de_jure] Feudal Vassal of the title"
 saxon_elective_electors:0 "$feudal_elective_electors$"
 saxon_elective_electors_tooltip:0 "In order to be a valid [elector|E] under the Landsmeet, a vassal must fulfill all the following conditions:\n$EFFECT_LIST_BULLET$Be a de jure vassal of the title\n$EFFECT_LIST_BULLET$NOT be a Baron\n$EFFECT_LIST_BULLET$NOT be Incapable"