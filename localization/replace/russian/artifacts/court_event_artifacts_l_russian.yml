l_russian:

#court.4500 Fake artifacts and trinkets
 blood_brooch_name:0 "Кровавая брошь"
 blood_brooch_description:0 "В этой броши есть стеклянный шарик с кровью персонажа [ROOT.GetCharacter.GetTitledFirstName]."
 cuckoldry_psalter_name:0 "Псалтырь адюльтера"
 cuckoldry_psalter_description:0 "Этот том, веками переходящий от одного чудака к другому, считается лучшим подарком супругу. Во всяком случае, фигурки из слоновой кости на его обложке выглядят довольными своим браком."
 chastity_belt_name:0 "Пояс верности"
 chastity_belt_description:0 "Этот пояс верности покрыт шипами снаружи и изнутри и защищает вас и окружающих."
 holy_needle_name:0 "Священная игла Антиохии"
 holy_needle_description:0 "Ею можно прекрасно вышить сцену Распятия."
 finger_bones_name:0 "Кости пальцев святого"
 finger_bones_description:0 "Все одиннадцать!"
 dead_chicken_name:0 "Щит труса"
 dead_chicken_description:0 "Никто, даже ваши враги, не захочет оказаться рядом с вами, когда вы начнете размахивать этим дохлым цыпленком."
 worm_on_a_string_name:0 "Червяк на веревке"
 worm_on_a_string_description:0 "Игрушка, способная впечатлить ребенка."

 #court.4750 Book commissions
 pope_joan_book_name:0 "Наставления Верховного жреца Иоанна"
 pope_joan_book_desc:0 "Книга, где [ROOT.Char.GetTitledFirstNameNoTooltip] предстаёт в образе Верховного жреца Иоанна. Благочестие, богохульство или соблазн?"
 lady_godiva_book_name:0 "Неприкрытые приключения Андрасте"
 lady_godiva_book_desc:0 "По крайней мере, на иллюстрации, где [ROOT.Char.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'изображена обнажённой', 'изображён обнажённым' )], приятно смотреть."
 caligula_book_name:0 "Пикантные плети Архонта"
 caligula_book_desc:0 "Книга, в которой Архонт Тевинтера подвергает [ROOT.Char.GetTitledFirstNameNoTooltip] порке весьма необычным способом."
 nasreddin_book_name:0 "Злополучные похождения Филиппа"
 nasreddin_book_desc:0 "Книга, в которой Филипп Дурак критикует [ROOT.Char.GetTitledFirstNameNoTooltip]. Шутки всегда смешнее, когда их мишенью становится кто-то другой."
 valmiki_book_name:0 "Стихи Тариуса"
 valmiki_book_desc:0 "Поэма, написанная в стиле знаменитого Тариуса: [ROOT.Char.GetTitledFirstNameNoTooltip] случайно сочиняет стихи, как некогда начинал сам маг-поэт."
 ruler_hero_book_name:0 "[ROOT.Char.GetTitledFirstNameNoTooltip]: история"
 ruler_hero_book_desc:0 "В первой строке [ROOT.Char.GetTitledFirstNameNoTooltip] обращается ко двору со словами: «Вы меня утомили, мне надо присесть»."
 sinbad_book_name:0 "Путешествия Веренаса, Владыки Удачи"
 sinbad_book_desc:0 "Книга о многочисленных приключениях Веренаса, Владыки Удачи, в которых [ROOT.Char.GetTitledFirstNameNoTooltip] встречается ему несколько раз в образе разных персонажей."

 #court.4806 fan relics
 purple_underwear_name:0 "Нижнее белье цвета императорского пурпура"
 purple_underwear_description:0 "Подходит лишь тому, кто носит императорский титул.\n\nSic itur ad astra?.."
 fake_reichskrone_name:0 "Поддельная Имперская корона"
 fake_reichskrone_description:0 "Носите, чтобы по-настоящему стать #EMP [Select_CString(ROOT.Char.IsFemale, 'претенденткой', 'претендентом' )]#! на трон"
