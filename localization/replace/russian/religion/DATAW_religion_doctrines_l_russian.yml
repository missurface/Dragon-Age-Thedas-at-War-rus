l_russian:
  doctrine_clerical_function_taxation_desc:1 "[ROOT.Faith.AltPriestTermPlural|U] получают власть от [ROOT.Faith.HighGodNamePossessive] и по исконному праву могут властвовать на Тедасе."
  doctrine_clerical_gender_either_desc: "В [ROOT.Faith.PriestNeuterPlural] может пойти любой, кто слышит божественный зов: в делах духовных пол не имеет значения."

  doctrine_chantry_succession_name: "Церковное преемство"
  chantry_succession_orlesian_doctrine_name: "Орлейская власть"
  chantry_succession_orlesian_doctrine_desc: "Мы верим, что именно Орлейская Церковь является истинной преемницей учения Андрасте."
  chantry_succession_imperial_doctrine_name: "Имперская власть"
  chantry_succession_imperial_doctrine_desc: "Мы верим, что именно Имперская Церковь является истинной преемницей учения Андрасте."
  chantry_succession_none_doctrine_name: "Самостоятельная власть"
  chantry_succession_none_doctrine_desc: "Мы верим, что ни одна из ветвей Церкви не является истинной преемницей учения Андрасте."

  doctrine_parameter_hostility_override_chantry_succession_orlesian_doctrine: "Другие [Concept('faiths', 'конфессии')|E] с этой доктриной воспринимаются как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
  doctrine_parameter_hostility_override_chantry_succession_imperial_doctrine: "Другие [Concept('faiths', 'конфессии')|E] с этой доктриной воспринимаются как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
  doctrine_parameter_hostility_override_chantry_succession_none_doctrine: "Другие [Concept('faiths', 'конфессии')|E] с этой доктриной воспринимаются как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"

  tenet_tree_sepulture_name: "Хранители живых гробниц"
  tenet_tree_sepulture_desc: "Леса полны деревьев, в которых многие поколения хоронили усопших. Тела запечатывают внутри стволов, оберегая их от вселения демонов. Каждое встреченное дерево может оказаться усыпальницей давно утраченного предка, а потому лес следует взращивать и защищать от всякого вреда."
  doctrine_funeral_tree_burial_active_name: "Погребение под деревом"
  doctrine_funeral_tree_burial_active_desc: "С дубовым посохом, который поможет им в странствиях по загробному миру, и кедровой ветвью, отгоняющей воронов Диртамена, мы предаём усопших земле. Над останками мы сажаем дерево — их Валласдален, — чтобы хранить память о них и с каждой нашей смертью питать новую жизнь. Ступайте под этими деревьями с благоговением и помните: у каждого из них когда-то было имя."
  doctrine_parameter_tree_burial_active: "[Concept('rulers','Правители')|E] могут устроить своим предкам погребение под деревом, получив [Concept('piety','благочестие')|E] и порадовав своих [Concept('vassals','вассалов')|E]"
  
  doctrine_funeral_tree_sepulture_active_name: "Погребение в дереве"
  doctrine_funeral_tree_sepulture_active_desc: "Леса полны опасных духов, способных мучить наших почивших предков. Чтобы защитить их души и тела, мы запечатываем останки в самой плоти леса: могучая жизнь дерева скрывает их от духов и служит им защитой. Так наши предки могут присоединиться к духам среди слуг Владычицы Леса, зная, что их останки никто не потревожит."
  doctrine_parameter_tree_sepulture_active: "[Concept('rulers','Правители')|E] могут упокоить своих предков в дереве, получив [Concept('piety','благочестие')|E] и порадовав своих [Concept('vassals','вассалов')|E]"

  doctrine_view_on_magic_name: "Отношение к магии"
  doctrine_circle_system_name: "Система Кругов"
  doctrine_circle_system_desc: "[Concept('mage','Магов')|E] необходимо отправлять в [Concept('circle','Круг')|E], где их обучат владеть [Concept('dataw_magic','магией')|E] и сопротивляться [Concept('demonic_possession','одержимости')|E]. Отказ подчиниться сделает мага #TOOLTIP:GAME_TRAIT,apostate, #L отступником#!#!. Если же случится худшее, [Concept('templar','храмовники')|E] позаботятся, чтобы [Concept('abomination','одержимый')|E] был уничтожен."
  doctrine_mage_rule_name: "Власть магов"
  doctrine_mage_rule_desc: "[Concept('dataw_magic','Магия')|E] — это дар и привилегия избранных, подобно власти [Concept('rulers','правителей')|E] над самой землёй. Поэтому вполне естественно, чтобы маги и правители были одними и теми же людьми."
  doctrine_forced_conscription_name: "Принудительный призыв"
  doctrine_forced_conscription_desc: "[Concept('dataw_magic','Магия')|E] — сокрушительное оружие [Concept('war','войны')|E], и относиться к ней следует соответственно."
  doctrine_tranquil_solution_name: "Поголовное усмирение"
  doctrine_tranquil_solution_desc: "Ради безопасности как [Concept('mage','магов')|E], так и людей, не являющихся [Concept('mage','магами')|E], каждый владеющий [Concept('dataw_magic','магией')|E] должен пройти ритуал, исключающий [Concept('demonic_possession','одержимость')|E] и возможное злоупотребление силой. Подавление эмоций — прискорбный побочный эффект."
  doctrine_unlanded_sages_name: "Безземельные мудрецы"
  doctrine_unlanded_sages_desc: "[Concept('mage','Магов')|E] принимают и даже почитают как мудрецов и советников, способных явить простому народу мудрость и связь с [Concept('fade','Тенью')|E]. Однако им запрещено владеть [Concept('land','землёй')|E] и соответствующими [Concept('titles','титулами')|E], ведь [Concept('dataw_magic','магии')|E] не место на престоле."
  doctrine_persecution_name: "Преследование"
  doctrine_persecution_desc: "[Concept('mage','Магов')|E] преследуют, вынуждая скрывать свои способности."
  doctrine_unregulated_magic_name: "Неконтролируемая магия"
  doctrine_unregulated_magic_desc: "Эта вера гласит, что [dataw_magic|El] должна свободно использоваться и применяться без каких-либо ограничений."
  court_enchanter_allowed_name: "Придворный чародей разрешён"
  court_enchanter_disallowed_name: "Придворный чародей запрещён"
  doctrine_parameter_circle_system_active: "Действует форма правления [Concept('circle','Круга')|E]."
  doctrine_parameter_persecution_active: "Магов преследуют, и при возможности они бегут"
  doctrine_parameter_tranquil_solution_active: "Магов принуждают разорвать связь с [Concept('fade','Тенью')|E]"
  tranquil_solution_active_name: "Магов принудят разорвать связь с [Concept('fade','Тенью')|E]"
  mages_cannot_hold_titles_name: "Маги не могут владеть [Concept('title','титулами')|E]"
  doctrine_parameter_mages_cannot_hold_titles: "Это конфессия запрещает магам владеть [Concept('title','титулами')|E]"