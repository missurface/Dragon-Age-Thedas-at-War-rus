 reformed_ciriane_paganism_desc:0 "Стремясь заслужить признание соседних правителей, некоторые цирианские язычники стали прославлять охотницу Андрасте в маске как одну из своих многочисленных богинь. Эти варвары ещё не приняли свет Создателя, однако их обычаи достаточно безобидны, чтобы Церковь не замечала столь незначительной ереси."

