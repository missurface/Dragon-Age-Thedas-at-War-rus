 tenet_elven_paganism_religion_syncretic_name: "Синкретизм эльфийского язычества"
 tenet_elven_paganism_religion_syncretic_desc: "Пусть многочисленные боги эльвенов и кажутся чуждыми, предания о них несут великую добродетель и мудрость. Это следует признать, каковы бы ни были наши сомнения в прочих вопросах."
 doctrine_parameter_hostility_override_special_doctrine_is_elven_paganism_faith:2 "Считает, что [Concept('faiths', 'конфессии')|E] эльфийского язычества — [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V], а не $hostility_evil_tooltippable$. $game_concept_faiths$ эльфийского язычества отвечают тем же"
 doctrine_parameter_elven_paganism_religion_syncretic_actor_opinion_active:1 "Взаимный бонус [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] к [Concept('opinion', 'мнению')|E] персонажей, принадлежащих к [Concept('faiths', 'конфессиям')|E] эльфийского язычества"
 doctrine_parameter_opinion_of_elven_paganism_religion_syncretic_recipient_opinion_active: ""
 doctrine_parameter_elven_paganism_religion_syncretic_recipient_opinion_active:1 "Взаимный бонус [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] к [Concept('opinion', 'мнению')|E] персонажей, принадлежащих к [Concept('faiths', 'конфессиям')|E] с [Concept('core_tenet', 'догматом')|E] «$tenet_elven_paganism_religion_syncretic_name$»"
