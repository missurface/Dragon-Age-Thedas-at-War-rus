 tenet_way_of_cinders_name: "Жертва Пеплу"
 tenet_way_of_cinders_desc: "Мы верим, что, когда человек становится слишком стар и слаб, чтобы приносить пользу общине, ему дозволено и даже предписано совершить ритуальное самоубийство и стать духом праха.\nВ рот кладут безупречную чёрную жемчужину, чтобы удержать дух по эту сторону Завесы, а тело неделями готовят молитвой и воздержанием, прежде чем предать огню.\nПрах наших предков странствует по горам и дюнам Тедаса, который мы зовём домом, и их мудрость по-прежнему направляет нас."