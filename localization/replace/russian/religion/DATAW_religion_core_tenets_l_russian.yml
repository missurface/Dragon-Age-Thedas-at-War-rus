 tenet_alamarri_paganism_religion_syncretic_name: "Аламаррский синкретизм"
 tenet_alamarri_paganism_religion_syncretic_desc: "В старых обычаях по-прежнему много мудрости и добродетели, ведь они хранят знания и традиции нашего прошлого. Эти обычаи заслуживают уважения."
 doctrine_parameter_hostility_override_special_doctrine_is_alamarri_faith:2 "Считает, что аламаррские [Concept('faiths', 'конфессии')|E] — [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V], а не $hostility_evil_tooltippable$. Аламаррские $game_concept_faiths$ отвечают тем же"
 doctrine_parameter_alamarri_paganism_religion_syncretic_actor_opinion_active:1 "Взаимный бонус [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] к [Concept('opinion', 'мнению')|E] персонажей, принадлежащих к аламаррским [Concept('faiths', 'конфессиям')|E]"
 doctrine_parameter_opinion_of_alamarri_syncretic_recipient_opinion_active: ""
 doctrine_parameter_alamarri_syncretic_recipient_opinion_active:1 "Взаимный бонус [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] к [Concept('opinion', 'мнению')|E] персонажей, принадлежащих к [Concept('faiths', 'конфессиям')|E] с [Concept('core_tenet', 'догматом')|E] «$tenet_alamarri_paganism_religion_syncretic_name$»"
 doctrine_parameter_opinion_of_alamarri_paganism_religion_syncretic_actor_opinion_active: ""

 tenet_andrastianism_religion_syncretic_name: "Андрастианский синкретизм"
 tenet_andrastianism_religion_syncretic_desc: "Пусть мы и не согласны с тем, что [Concept('maker','Создатель')|E] — единственный творец мира, [Concept('chant_of_light','Песнь Света')|E] всё же несёт [Concept('thedas','Тедасу')|E] великую мудрость, а потому не должна подвергаться хуле."
 doctrine_parameter_hostility_override_special_doctrine_is_andrastian_faith:2 "Считает, что андрастианские [Concept('faiths', 'конфессии')|E] — [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V], а не $hostility_evil_tooltippable$. Андрастианские $game_concept_faiths$ отвечают тем же"
 doctrine_parameter_andrastianism_religion_syncretic_actor_opinion_active:1 "Взаимный бонус [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] к [Concept('opinion', 'мнению')|E] персонажей, принадлежащих к андрастианским [Concept('faiths', 'конфессиям')|E]"
