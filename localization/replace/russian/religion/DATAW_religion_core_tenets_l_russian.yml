 doctrine_parameter_andrastianism_religion_syncretic_recipient_opinion_active:1 "Взаимный бонус [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] к [Concept('opinion', 'мнению')|E] персонажей, принадлежащих к [Concept('faiths', 'конфессиям')|E] с [Concept('core_tenet', 'догматом')|E] «$tenet_andrastianism_religion_syncretic_name$»"
