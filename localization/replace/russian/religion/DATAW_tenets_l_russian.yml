l_russian:
 tenet_alamarri_paganism_religion_syncretic_name: "Аламаррский синкретизм"
 tenet_alamarri_paganism_religion_syncretic_desc: "В старых обычаях по-прежнему много мудрости и добродетели, ведь они хранят знания и традиции нашего прошлого. Эти обычаи заслуживают уважения"
 doctrine_parameter_alamarri_paganism_religion_syncretic_actor_opinion_active: "Взаимный бонус [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] к [Concept('opinion', 'мнению')|E] персонажей, принадлежащих к аламаррским [Concept('faiths', 'конфессиям')|E]"
 doctrine_parameter_is_alamarri_paganism_religion_faith_bilateral_loc_override: "Считает, что аламаррские [Concept('faiths', 'конфессии')|E] — [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V], а не $hostility_evil_tooltippable$. Аламаррские $game_concept_faiths$ отвечают тем же"
 doctrine_parameter_hostility_override_alamarri_paganism_hostility_doctrine: ""
 doctrine_parameter_opinion_of_alamarri_paganism_religion_syncretic_recipient_opinion_active: ""
 doctrine_parameter_hostility_override_alamarri_hostility_doctrine: ""
 
