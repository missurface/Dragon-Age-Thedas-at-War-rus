l_russian:

 game_concept_fereldan_struggle:1 "Ферелденская борьба"
 game_concept_fereldan_struggle_desc:2 "$game_concept_fereldan_struggle$ отражает многовековую историю раздоров в Ферелдене. [Concept('struggle_phase_phases', 'Фазы')|E] этой [Concept('struggle', 'борьбы')|E] сменяются от вызванного ненавистью насилия до непрочных перемирий и практичного сотрудничества. Крепкие союзы в подобной ситуации возникают редко, и [Concept('rulers', 'правителям')|E] следует помнить, что общая [faith|El] или [culture|El] ничего не гарантируют."

 game_concept_struggle_phase_ferelden_opportunity:1 "Фаза возможности"
 game_concept_struggle_phase_ferelden_opportunity_desc:2 "В результате долгого и относительно мирного сосуществования в [Concept('struggle_phase_ferelden_conciliation', 'фазе примирения')|E] начинает расти удовлетворенность. И крестьяне, и дворянство рады, что всё #EMP в порядке#!, что дает более практичным [Concept('characters', 'персонажам')|E] возможность воспользоваться их наивностью.\n\nСо временем или новые злоупотребления приведут к эскалации [Concept('struggle_phase_ferelden_hostility', 'враждебности')|E], или разумные политические решения помогут достичь хрупкого равновесия благодаря [Concept('struggle_phase_ferelden_conciliation', 'примирению')|E]."

 game_concept_struggle_phase_ferelden_hostility:1 "Фаза враждебности"
 game_concept_struggle_phase_ferelden_hostility_desc:2 "В этой [Concept('struggle_phase_phase', 'фазе')|E] кипение страстей достигает апогея. Постоянные проявления злобы и растущее взаимное непонимание в [Concept('struggle_phase_ferelden_opportunity', 'фазе возможности')|E] привели к усилению взаимной ненависти [Concept('characters', 'персонажей')|E] разных [Concept('cultures', 'культур')|E], [Concept('faiths', 'конфессий')|E], а то и #EMP хуже#!: и того и другого.\n\nНо подобное кровопролитие не может длиться вечно. Со временем здравомыслие или банальное истощение помогут долине достичь [Concept('struggle_phase_ferelden_compromise', 'компромисса')|E]."

 game_concept_struggle_phase_ferelden_compromise:1 "Фаза компромисса"
 game_concept_struggle_phase_ferelden_compromise_desc:2 "Утомление от конфликтов в [Concept('struggle_phase_ferelden_hostility', 'фазе враждебности')|E] или искусная деэскалация в [Concept('struggle_phase_ferelden_conciliation', 'фазе примирения')|E] приводят к достижению компромисса. $game_concept_struggle_phase_ferelden_compromise$ — это растущее согласие между народами Ферелдена. Разногласия утихают и теряют значимость, зато общее наследие и история превращаются в крепкие узы, объединяющие былых противников.\n\nДолина на перепутье: если конфликты вспыхнут вновь, может начаться [Concept('struggle_phase_ferelden_opportunity', 'фаза возможности')|E]."

 game_concept_struggle_phase_ferelden_conciliation:1 "Фаза примирения"
 game_concept_struggle_phase_ferelden_conciliation_desc:1 "Если участники Ферелденской борьбы достигают значительного [Concept('struggle_phase_ferelden_compromise', 'компромисса')|E], наступает эта [Concept('struggle_phase_phase', 'фаза')|E] — их отношения становятся столь благоприятными и близкими, что чужакам нелегко это понять. Особенно часто заключаются [Concept('faith', 'межконфессиональные')|E] [Concept('marriages', 'браки')|E].\n\nОднако это длится не вечно, и чье-то обманутое доверие со временем возвращает [Concept('fereldan_struggle', 'Ферелденскую борьбу')|E] в [Concept('struggle_phase_ferelden_compromise', 'фазу компромисса')|E]."

 game_concept_improve_city_province_decision:0 "$improve_city_province_decision_name$"
 game_concept_improve_city_province_decision_desc:0 "Это [decision|El] позволяет увеличить количество [Concept( 'buildings', 'зданий' )|E], доступных в [Concept( 'city_holding', 'городском владении' )|E]."

 game_concept_border_raid:0 "Вылазка"
 game_concept_border_raids:0 "Вылазки"
 game_concept_border_raiding:0 "Совершение вылазок"
 game_concept_border_raid_desc:3 "Особая разновидность [Concept('war', 'войны')|E] [Concept('struggle_involved', 'вовлеченных в борьбу')|E] [Concept('rulers', 'правителей')|E]-участников Ферелденской [Concept('struggle', 'борьбы')|E]. Нападающий старается [Concept('siege', 'взять в осаду')|E] определенное [Concept('county', 'графство')|E] врага, граничащее с его [Concept('realm', 'державой')|E].\n\nЗа захват [Concept('war_target', 'цели войны')|E] [war_leader|El] получает [gold|El]. Сама же цель теряет [development|El] и [control|El]. При этом могут разрушаться [buildings|El], а победитель получает больше золота — вероятность этого зависит от развития и размера осаждающей [Concept('army', 'армии')|E].\n\nАтакующий быстро повышает [Concept('war_score', 'боевой счет')|E], если цель войны [Concept('occupying', 'оккупирована')|E]."

 game_concept_bargain_fealty:0 "Договориться о верности"
 game_concept_bargained_fealty:0 "Договорная верность"
 game_concept_bargain_fealty_desc:3 "Это особое [interaction|El] доступно [Concept( 'struggle_involved', 'вовлеченным в борьбу' )|E] [Concept( 'rulers', 'правителям' )|E], участвующим в оборонительной [Concept( 'war', 'войне' )|E].\n\n[war_leader|E] просит соседнего [Concept( 'ruler', 'правителя' )|E] более высокого [Concept( 'rank', 'ранга' )|E] присоединиться к войне, пообещав стать [Concept( 'vassal', 'вассалом' )|E] этого правителя."

 game_concept_contract_assistance:0 "Военная помощь"
 game_concept_contract_assisting: "Оказывает военную помощь"
 game_concept_contract_assistance_desc:2 "Особое [interaction|El], доступное [Concept('struggle_involved', 'вовлеченным')|E] в Ферелденскую [Concept('struggle', 'борьбу')|E] [Concept('rulers', 'правителям')|E], которое позволяет им присоединяться к [Concept('wars', 'войнам')|E] других [Concept('struggle_involved', 'вовлеченных')|E] [Concept('rulerpossessive', 'правителей')|E] в обмен на [gold|El].\n\nОплата производится по завершении [Concept('war', 'войны')|E], независимо от ее итогов, если [Concept('war_contribution', 'вклад')|E] исполнителя контракта достигнет 100."
 
 game_concept_iberian_reclamation:0 "Ферелденская рекламация"
 game_concept_iberian_reclaiming:0 "Возвращение ферелденских территорий"
 game_concept_iberian_reclamations:0 "Ферелденские рекламации"
 game_concept_iberian_reclamation_desc:2 "Особый тип [Concept('war', 'войны')|E], доступный [Concept('struggle_involved', 'вовлеченным')|E] в [Concept('fereldan_struggle', 'Ферелденскую борьбу')|E] [Concept('rulers', 'правителям')|E].\n\nАтакующий старается завоевать [duchy|El], где присутствуют любые [Concept('struggle_involved', 'вовлеченные')|E] [counties|El], которыми владеет [ruler|El], [Concept('struggle_interloper', 'вмешивающийся в борьбу')|E], или [Concept('struggle_uninvolved', 'не вовлеченный в нее')|E]. Также атакующий может попытаться сделать правителя своим [Concept('vassalize', 'вассалом')|E], если не владеет землями за пределами герцогства."

