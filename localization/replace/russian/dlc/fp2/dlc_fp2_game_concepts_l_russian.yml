l_russian:

 game_concept_fereldan_struggle:1 "Fereldan Struggle"
 game_concept_fereldan_struggle_desc:2 "The $game_concept_fereldan_struggle$ depicts the centuries of fractious relationships in Fereldan. The [struggle|E] shifts between [struggle_phase_phases|E] of hate-fueled violence, wary truces, and pragmatic cooperation. There are few permanent allies in such a situation, and [rulers|E] should be wary of relying purely on a shared [faith|E] or [culture|E]."

 game_concept_struggle_phase_ferelden_opportunity:1 "Opportunity Phase"
 game_concept_struggle_phase_ferelden_opportunity_desc:2 "After a long period of relatively peaceful coexistence during the [struggle_phase_ferelden_conciliation|E], complacency begins to set in. Peasantry and nobility alike are comfortable that things just #EMP work#!, allowing more shrewd [characters|E] to take advantage of their naivety.\n\nEventually, fresh abuses will either cause an escalation into the [struggle_phase_ferelden_hostility|E], or else savvy politicking reaches an uneasy equilibrium through the [struggle_phase_ferelden_conciliation|E]."

 game_concept_struggle_phase_ferelden_hostility:1 "Hostility Phase"
 game_concept_struggle_phase_ferelden_hostility_desc:2 "Tensions flare and tempers fray in this $game_concept_struggle_phase_phase$. Repeated acts of malice and escalated misunderstandings during the [struggle_phase_ferelden_opportunity|E] have lead to rising hatred of [characters|E] with differing [cultures|E], [faiths|E], or #EMP worse#!: both.\n\nSuch bloodshed cannot persist forever, though. Eventually, either cooler heads or simple exhaustion bring the valley to the [struggle_phase_ferelden_compromise|E]."

 game_concept_struggle_phase_ferelden_compromise:1 "Compromise Phase"
 game_concept_struggle_phase_ferelden_compromise_desc:2 "Whether through sickness with the strife of the [struggle_phase_ferelden_hostility|E] or deft escalation during the [struggle_phase_ferelden_conciliation|E], the $game_concept_struggle_phase_ferelden_compromise$ represents a growing accommodation between the peoples of Fereldan. Differences fall by the wayside and shared history and heritage binds former foes together.\n\nThe valley stands at a cross-roads: if conflicts reappear, then the [struggle_phase_ferelden_opportunity|E] awaits."

 game_concept_struggle_phase_ferelden_conciliation:1 "Conciliation Phase"
 game_concept_struggle_phase_ferelden_conciliation_desc:1 "The product of a notable [struggle_phase_ferelden_compromise|E], during this $game_concept_struggle_phase_phase$, relations between the peoples of Fereldan grow so cordial that outsiders find their permissiveness difficult to parse. Inter-[faith|E] [marriages|E] are particularly common.\n\nThis can't last forever, though, and abuses of trust will eventually bring the [fereldan_struggle|E] back around to the [struggle_phase_ferelden_compromise|E]."

 game_concept_improve_city_province_decision:0 "$improve_city_province_decision_name$ Decision"
 game_concept_improve_city_province_decision_desc:0 "A [decision|E] that enables you to increase the number of [buildings|E] available in a [city_holding|E]."

 game_concept_border_raid:0 "Border Raid"
 game_concept_border_raids:0 "Border Raids"
 game_concept_border_raiding:0 "Border Raiding"
 game_concept_border_raid_desc:3 "This is a special type of [war|E] available between [struggle_involved|E] [rulers|E] of the Fereldan [struggle|E] where the attacker aims to [siege|E] a specific enemy [county|E] bordering their [realm|E].\n\nThe [war_leader|E] gains [gold|E] for capturing the [war_target|E], which will lose [development|E] and [control|E]. [buildings|E] may also be destroyed, yielding more [gold|E], the chance increasing with [development|E] and [siege|E] [army|E] size.\n\n[war_score|E] will be gained rapidly by the attacker upon [occupying|E] the [war_target|E]."

 game_concept_bargain_fealty:0 "Bargain Fealty"
 game_concept_bargained_fealty:0 "Bargained Fealty"
 game_concept_bargain_fealty_desc:3 "This special [interaction|E] is available to [struggle_involved|E] [rulers|E] who are in a defensive [war|E].\n\nThe [war_leader|E] asks a neighboring higher-[rank|E] [ruler|E] to join their war in exchange for becoming their [vassal|E]."

 game_concept_contract_assistance:0 "Military Assistance"
 game_concept_contract_assisting: "Assisting Militarily"
 game_concept_contract_assistance_desc:2 "This is a special type of [interaction|E] available to [struggle_involved|E] [rulers|E] of the Fereldan [struggle|E], allowing them to join other [struggle_involved|E] [rulerpossessive|E] [wars|E] in exchange for [gold|E].\n\nPayment is made on conclusion of the [war|E], whatever the outcome, as long as the contractor made a [war_contribution|E] of at least 100."
 
 game_concept_iberian_reclamation:0 "Fereldan Reclamation"
 game_concept_iberian_reclaiming:0 "Fereldan Reclaiming"
 game_concept_iberian_reclamations:0 "Fereldan Reclamations"
 game_concept_iberian_reclamation_desc:2 "This is a special type of [war|E] available to [struggle_involved|E] [rulers|E] of the [fereldan_struggle|E].\n\nThe attacker aims to conquer a [duchy|E] which contains any [struggle_involved|E] [counties|E] held by an [struggle_interloper|E] or [struggle_uninvolved|E] [ruler|E], or [vassalize|E] them if they hold no land outside that Duchy."

