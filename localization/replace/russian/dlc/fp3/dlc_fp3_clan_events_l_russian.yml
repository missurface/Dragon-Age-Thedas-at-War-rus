l_russian: 
### FP3 CLAN EVENTS
 fp3_clan.8015.t: "Скандальный отпрыск"
 fp3_clan.8015.desc: "[concerned_parent.GetName] входит в мой чертог, волоча за собой [Select_CString(scandalous_scion.IsFemale, 'свою дочь', 'своего сына' )], [scandalous_scion.GetFirstName], чей вид выражает явное недовольство.\n\n«[Select_CString(ROOT.Char.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.GetTitleTierName], — обращается ко мне [concerned_parent.GetFirstNameNoTooltip], — вам, возможно, уже известно, как ведет себя [Select_CString(scandalous_scion.IsFemale, 'эта моя дочь', 'этот мой сын' )]: водит дружбу с бродячими воинами, собирающимися в #EMP домах гильдий#!, пьет с ними в подозрительных тавернах и слоняется по городу». [Select_CString(concerned_parent.IsFemale, 'Посетительница тяжело вздыхает', 'Посетитель тяжело вздыхает' )].\n\n«Нужно защитить [Select_CString(scandalous_scion.IsFemale, 'ее', 'его' )] репутацию, пока дело не обернулось публичным скандалом. [Select_CString(concerned_parent.IsFemale, 'Я подумала', 'Я подумал' )], что [Select_CString(scandalous_scion.IsFemale, 'она могла', 'он мог' )] бы остаться здесь и поучиться манерам при вашем дворе»." 
 fp3_clan.8015.a: "Хорошо, пусть [Select_CString(scandalous_scion.IsFemale, 'она', 'он' )] будет при моем дворе."
 fp3_clan.8015.b: "[Select_CString(scandalous_scion.IsFemale, 'Она', 'Он' )] — порождение твоих чресел, не моих."