l_russian:


 epidemic_events.1020.t: "Дурной воздух над владением [epidemic_county.GetNameNoTierNoTooltip|U]"
 epidemic_events.1020.desc: "[epidemic_scope.GetName|U] опустошает земли и губит жителей владения [epidemic_county.GetNameNoTier]. [miasma_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] сообщает, что торговля и производство полностью иссякли: люди лежат в домах и прямо на улицах, ожидая зова [ROOT.Char.GetFaith.DeathDeityNamePossessive|U].\n\n[Select_CString(miasma_courtier.IsFemale, 'Она', 'Он' )] винит во всём дурной воздух, окружающий мёртвых и умирающих, и предлагает разбить огромное поле, где будут расти [epidemic_province.Custom('get_region_flower_type_plural')]. Их аромат якобы рассеет зловоние и замедлит распространение болезни."
 epidemic_events.1020.a: "Стоит попробовать."
 epidemic_events.1020.b: "Пустая трата золота."
 epidemic_events.1030.t: "Пиявки!"
 epidemic_events.1030.desc: "Некоторые учёные при [ROOT.Char.Custom('GetCourt')] уверяют меня, что пиявки — надёжное и проверенное средство от нарушения равновесия гуморов и всякой порчи. Но когда [leeched_courtier.GetFirstName] приближается с мертвенной ухмылкой, протягивая пригоршню пиявок, я невольно задумываюсь, не зашло ли всё слишком далеко.\n\n«Пиявки! Только пиявки могут остановить [epidemic_scope.GetName]!»\n\nОбщепринятое учение велит применять пиявок лишь под надзором опытного лекаря, но можем ли мы позволить себе ждать в столь отчаянные времена?"
 epidemic_events.1030.a: "Раздать всем пиявок!"
 epidemic_events.1030.a.success: "Лечение пиявками оказывается успешным"
 epidemic_events.1030.a.failure: "Пиявки причиняют вред"
 epidemic_events.1030.b: "Последуем совету лекарей."


