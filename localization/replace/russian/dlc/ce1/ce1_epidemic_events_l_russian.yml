 epidemic_events.5010.denerim: "Теперь ласковые воды реки Дракон несут не только ил и торговые суда. Вниз по течению плывут раздутые, выбеленные солнцем тела; искажённые мукой лица застыли в безмолвном оскале, а лопнувшие бубоны багровеют на бледной коже.\n\nСтарые стены, столько раз защищавшие город от нашествий живых, теперь подпирают мертвецы. Извилистые узкие улицы превратились в лабиринт из груд тел, где крысы находят и убежище, и пропитание."
 epidemic_events.5010.minrathous: "Минратос! Славный Минратос. Столица мира. По этим почтенным дорогам прошли бесчисленные поколения, но ряды мёртвых с каждым днём множатся всё быстрее. Мор ползёт по улицам, оскверняя прекрасные площади и величественные арки. Древний мрамор безмолвно взирает на муки живых, бессильный им помочь. Умирающие издают последний хрип, произнося слова, о которых в лучшие времена не смели и помыслить:\n\n«Так ли вечен Вечный город?»"
 epidemic_events.5010.val_royeaux: "Передо мной Вал Руайо — прекрасная столица Кордилиуса Драккона, основателя Орлея. Золотые украшения и мрамор покрывают затейливые здания, и кажется, будто каждый камень здесь неповторим.\n\nЭту красоту омрачают лишь горы тел, которым словно не будет конца. Повозки непрерывно вывозят мертвецов из золотого города к огромным погребальным кострам: отчаянная попытка замедлить смертоносное поветрие."
 epidemic_events.5010.halamshiral: "Когда этот великий город был основан, его назвали «Концом пути»: эльфы верили, что после Долгого пути обрели новую родину. Но болезнь не желает останавливаться — повсюду люди застывают в сладких объятиях смерти.\n\nДля эльфов здесь завершилось странствие, однако у хвори явно более широкие замыслы, чем остаться в тесных улочках города.\n\n\nУкрытый среди Морозных гор Эджхолл некогда был заставой наземных гномов, пока разрушения Первого Мора не отрезали поселение от Глубинных троп. Увы, запустение добралось и до этого дальнего уголка гор. [epidemic_scope.GetName|U] оставляет след на жителях Эджхолла, доказывая: как бы далеко место ни находилось от общества, ему не укрыться от хватки болезни."
 epidemic_events.5010.tombigbee: "Скрытый в Диких землях Коркари Томбигби — единственное крупное поселение среди болот, основанное хасиндами. Долгие годы путь к нему знали лишь мужчины и женщины Диких земель, но все их старания оказались тщетны: костлявые пальцы поветрия [epidemic_scope.GetName|U] сомкнулись на горле уединённого города."
 epidemic_events.5010.redcliffe: "Смерть пришла в Редклиф. Торговые пути, некогда приносившие деревне процветание, теперь несут её жителям страшную заразу. На берегах озера Каленхад беспрерывно горят погребальные костры, но мёртвым и умирающим нет конца. Крепкие стены твердыни [capital.GetNameNoTierNoTooltip], способные остановить людские клинки и стрелы, почти не защищают от болезни, которая теперь расползается по державе [capital_region.GetDeJureLiege.GetTierAsNameNoTooltip|l]. Скоро выживших может не хватить даже для того, чтобы поддерживать здесь жизнь. Неужели пробил последний час Редклифа?"
 epidemic_events.5010.nevarra_city: "Плач больных и умирающих разносится от Каструм Драконис до берегов реки Минантер. Обычно яркая и полная жизни твердыня [capital.GetNameNoTierNoTooltip] превратилась в склеп. Статуи давно умерших героев бесстрастно взирают на страдания потомков, а их высеченные из камня лица словно насмехаются над теми, кто молит их о помощи, простирая руки. Дозорные Скорби безмолвно шествуют по улицам в тёмных одеяниях и костяных масках, доставляя тела к последнему пристанищу. Их мрачный вид внушает не утешение, а ужас: будто это нечестивые призраки смерти. Великий Некрополь переполнен, его гробницы не готовы принять такой поток тел. Сколько осталось до того дня, когда хоронить их будет уже некому?"
 epidemic_events.5010.montsimmard: "Здесь родилась первая Верховная Жрица. Великая Олесса Монтсиммарская появилась на свет в этом городе, и с тех пор он тянулся ввысь во славу державы [orlesian_chantry.GetName]. По всему Тедасу ходят рассказы о его великой Церкви и бесчисленных статуях первой Верховной Жрицы, преклонившей колени перед Невестой Создателя. Но меня ждала здесь не слава, а запустение. Над городом, полным больных, развевается знамя династии [capital_region.GetHolder.GetDynasty.GetName]. Горный ветер треплет его, но не может унести смрад смерти. Болезнь в столь святом городе — настоящее кощунство."
 epidemic_events.5010.andorals_reach_ruined: "Эта тевинтерская крепость, названная в честь Андорала — древнего бога Единства, — лежит в руинах с тех пор, как Андрасте и её последователи-аламарри выступили в Священный поход против Империи. Некогда грозные зубчатые стены с шипами пребывают в упадке и напоминают лишь тень былого величия Тевинтера. Под разрушенными сводами укрываются умирающие и те, кто оплакивает друзей и близких; их стоны не умолкают. Они присоединяются к древним мертвецам, павшим за свои убеждения, но живым от этой мысли не легче."
 epidemic_events.5010.andorals_reach_restored: "Эта крепость, названная в честь Андорала — древнего бога Единства, — была разграблена, когда Андрасте и её последователи-аламарри выступили в Священный поход против Империи. Некогда разрушенные стены, напоминавшие лишь тень былого Тевинтера, восстановлены и укрывают сотни людей. Но в воздухе стоят стоны умирающих и тех, кто оплакивает друзей и близких, а надежда на спасение обращается пеплом на их устах. Жертвы поветрия [epidemic_scope.GetName|U] присоединяются к древним мертвецам, павшим за свои убеждения, но оставшимся в живых от этой мысли не легче."
 epidemic_events.5010.ghislain: "Я стою в самом сердце житницы державы [capital_region.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetTierAsName] — в твердыне [capital.GetNameNoTierNoTooltip]. Вокруг бесчисленные украшения прославляют плодородные поля, дарующие краю немыслимое богатство. Это скорее собрание прекрасных, достойных королей поместий с небольшими домами простолюдинов, чем настоящий город.\nНо теперь я вижу лишь больных: одни стыдливо прячутся в домах, другим недоступна даже такая роскошь. Слава твердыни [capital.GetNameNoTierNoTooltip] меркнет в объятиях смерти."
 epidemic_events.5010.adamant: "Передо мной высятся могучие стены крепости Адамант, подобные грифонам, которых Серые Стражи изображали на знамёнах и высекали в статуях вдоль гордых укреплений. Этот внушительный бастион возведён с одной целью — отражать натиск порождений тьмы.\n\nТолстые ворота и стены гномьей кладки способны остановить почти любого врага, но даже им не сдержать болезнь. «В смерти — жертва». Эти слова звучат пусто, пока тела громоздятся в ожидании погребального огня. Мужчины и женщины всех сословий смотрят на меня глазами, обведёнными следами усталости и слёз. Теперь по залам бродят лишь духи да воспоминания о тех, кто отдал жизнь, защищая всех нас от тьмы."
 epidemic_events.5010.serault: "Страшное запустение постигло владение [capital_region.GetNameNoTierNoTooltip]. Город, прославленный своим стеклом, — один из редких очагов цивилизации на границе Тирашана наряду с прекрасным Алионом. Но болезнь добралась и сюда, и куда ни взгляни — повсюду смерть. Стеклодувы продолжают работу, а больных и мёртвых уносят из домов и с улиц, словно само продолжение жизни стало вызовом природе. Быть может, природа считает владение [capital_region.GetNameNoTierNoTooltip] мерзостью. Лишь время покажет, сумеет ли цивилизация одолеть грозный лес."
 epidemic_events.5010.skyhold: "Немногие решаются подняться к высоко стоящей крепости на канатном подъёмнике. Те же, кто отваживается, держатся подальше друг от друга и обмениваются подозрительными взглядами. Во дворе стоит зловещая тишина, а на месте привычных торговых прилавков зияют ямы для сожжения мертвецов. Большинство жителей боится отходить далеко от своих комнат: болезнь может подстерегать их в любом дальнем коридоре."
 epidemic_events.5010.amaranthine.base: "Каменные стены твердыни [capital.GetNameNoTierNoTooltip] вновь сдерживают целую армию — на этот раз из больных и немощных. Стража не находит себе места, глядя, как заражённые крестьяне молят об укрытии и умирают у ворот. Пещеры под крепостью превратились в катакомбы, заваленные жертвами поветрия."
 epidemic_events.5010.amaranthine.non_avvar: "$epidemic_events.5010.amaranthine.base$\n\nНекоторые клянутся, что тела утаскивают всё глубже в пещеры, но, конечно же, они просто исчезают там, чтобы сгнить и стать пищей падальщиков."
 epidemic_events.5010.amaranthine.avvar: "$epidemic_events.5010.amaranthine.base$\n\nТела медленно исчезают, возвращаясь к Отцу Корту по бесконечным катакомбам, которые он вырыл под крепостью."

 epidemic_events.5900.t: "Черная смерть"

 epidemic_events.5900.t: "Моровая болезнь"

 epidemic_events.5900.desc: "Зараза ширится по земле.\n\nЖуткие бубоны растут на телах жертв, чьи слабые стоны о помощи стихают, когда они захлебываются собственным гноем.\n\nВсе, от нищего попрошайки до самого прославленного императора, боятся безразличной косы безжалостного морового поветрия. Выжившие могут лишь беспомощно смотреть, как все вокруг них гибнут.\n\nВерующие ищут защиты у божественных сил, а могущественные в своих богатствах, но никому нет спасения. Жуткие щупальца стелются по земле и удушают ее, пока она не перестанет дышать.\n\nЧерная смерть пришла к нам. Храни нас [ROOT.Char.GetFaith.HighGodName]."
 epidemic_events.5900.christian: "«Отче наш, сущий на небесах! да святится имя Твое...»"
 epidemic_events.5900.fallback: "Надеюсь, мы переживем это мрачное время."

