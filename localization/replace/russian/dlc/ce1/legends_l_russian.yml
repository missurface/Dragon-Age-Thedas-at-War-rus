l_russian:
 legend_luthias_dwarfson: "Первый берсерк"
 legend_luthias_dwarfson_desc: "Гномья княжна обучила Лутиаса Дварфсона искусству берсерка, но прославила его многолетняя вражда с Морриган'нан — возлюбленной, ставшей соперницей. В решающем поединке у Красных Водопадов они убили друг друга и навеки вошли в легенды."
 legend_morrighannan: "Ярость отвергнутой"
 legend_morrighannan_desc: "Морриган'нан недолго была возлюбленной Лутиаса Дварфсона, но, отвергнутая им, стала его соперницей на всю жизнь. Она вела свой народ от победы к победе, пока старые враги не сразили друг друга у Красных Водопадов и не вошли в легенды."
 legend_daughter_of_andraste: "Дочь Андрасте"
 legend_daughter_of_andraste_desc: "От предавшего её мужа Андрасте родила двух дочерей — Эбрис и Вивиал. Священный род продолжился лишь через Вивиал и её тевинтерского возлюбленного, но подробности его истории, как полагают, затерялись в хаосе Второго Мора."
 legend_harvard_aegis: "Хавард Щит"
 legend_harvard_aegis_desc: "Тяжело раненный при защите благословенной Андрасте, Хавард дополз до ворот Минратоса, надеясь предотвратить её казнь. Он нашёл лишь прах Пророчицы, но одно прикосновение исцелило его раны, и Хавард тайно унёс останки в земли аламарри."
 legend_jeshavis: "Мать Орлея"
 legend_jeshavis_desc: "Джешавис, жена двух Сынов Предательства и невестка Андрасте, первой начала играть в Великую Игру. Убийствами и интригами она безжалостно перекраивала мир вокруг себя, закладывая основы самого Орлея."
 legend_drakon_i: "Первый император"
 legend_drakon_i_desc: "Кордилиус Драккон I — основатель Орлесианской империи, Церкви, Кругов и ордена храмовников. Он создал самое могущественное государство Тедаса и обратил континент в веру Песни Света."
 legend_shartan: "Освободитель"
 legend_shartan_desc: "У подножия Солитариоса, Одинокого холма, встретились Шартан и Андрасте. Вместе они двинулись на Минратос, где Шартан погиб, пытаясь спасти Владычицу Нашу от костра. Благодаря его борьбе элвены обрели свободу."
 legend_justinia_i: "Первая Верховная Жрица"
 legend_justinia_i_desc: "Олесса Монтсиммарская была единственной женщиной-генералом в войске Кордилиуса Драккона. Она в равной мере оставалась воительницей и служительницей веры, словно вторя самой Андрасте, и потому была избрана Джустинией I — первой Верховной Жрицей."
 legend_teyrn_hafter: "Тэйрн Хафтер"
 legend_teyrn_hafter_desc: "Сын великого Дейна, Хафтер и сам был могучим воином. Во время Второго Мора он объединил аламарри и отбросил полчища порождений тьмы. Среди доблестных бойцов той эпохи он не знал равных."
 legend_last_inquisitor: "Последний Инквизитор"
 legend_last_inquisitor_desc: "Друг Кордилиуса Драккона, долийский эльф Америдан стал последним предводителем Инквизиции. Пылкость его натуры не уступала глубине веры, а таинственное исчезновение лишь раздувает пламя его легенды."
 legend_trefir: "Трефир Первый"
 legend_trefir_desc: "Андрасте вручила скромному рабу Трефиру Клинок Гессариана и сказала: «Возьми сей меч, и пусть поможет он тебе творить правосудие во имя моё». Трефир принял клинок и навеки стал орудием её справедливости."
 legend_first_emerald_knight: "Первый Изумрудный рыцарь"
 legend_first_emerald_knight_desc: "Маталин первым удостоился титула Изумрудного рыцаря. Он владел легендарным клинком Эванурой, который Верховный Хранитель Джуна выковал для него в Халамширале."
 legend_sindri: "Синдри Рассекающий Небо"
 legend_sindri_desc: "В древние времена Корт Отец Гор жил на вершине Беленаса. Молодые аввары состязались, пытаясь взойти на гору, и первым успеха добился сам Синдри. Он вернулся с рассказами о щедрости Корта и вдохновил новых смельчаков повторить восхождение."
 legend_prince_that_sang: "Князь, воспевший Долы"
 legend_prince_that_sang_desc: "Хассандриэль принёс долийцам веру в Создателя, и имя его известно всем, ибо благодаря ему Долы запели Песнь Света с ещё большим рвением."
 legend_emperor_tomb_restoration: "Восстановление императорской гробницы"
 legend_emperor_tomb_restoration_desc: "Преодолев множество испытаний и невзгод, [ROOT.Legend.GetOwner.GetNameNoTooltip] [Select_CString(ROOT.Legend.GetOwner.IsFemale, 'вернула', 'вернул' )] один за другим все артефакты, похищенные при разграблении Вал Руайо, разыскав их во всех уголках Тедаса, и [Select_CString(ROOT.Legend.GetOwner.IsFemale, 'восстановила', 'восстановил' )] гробницу императора Кордилиуса ещё прекраснее прежнего."


