l_russian:
  legend_luthias_dwarfson: "The First Berserker"
  legend_luthias_dwarfson_desc: "Taught the art of the Berserker by a Dwarven Princess, Luthias Dwarfson is famed for his decades long feud with his lover turned rival Morrighan'nan. Each killed the other in a climactic duel at Red Falls, cementing their legends."
  legend_morrighannan: "Fury of the Spurned"
  legend_morrighannan_desc: "Brief lover of Luthias Dwarfson, Morrighan'nan became his lifelong rival after he spurned her advances. In battle after battle she led her people to victory, until the old rivals slew one another at Red Falls, cementing their legends."
  legend_daughter_of_andraste: "Andraste's Daughter"
  legend_daughter_of_andraste_desc: "Andraste did beget two daughters with her betrayer, named Ebris and Vival. Only through Vival and her Tevinter lover did this holy bloodline continue, the details thought lost to the chaos of the Second Blight."
  legend_harvard_aegis: "Havard the Aegis"
  legend_harvard_aegis_desc: "Gravely wounded in defense of blessed Andraste, Havard crawled to the gates of Minrathous to stay her execution. Finding instead her ashes, a single touch healed his wounds, and he spirited them away to the lands of the Alamarri."
  legend_jeshavis: "The Mother of Orlais"
  legend_jeshavis_desc: "Wife to two Sons of Betrayal and daughter-in-law to Andraste, Jeshavis was the first player of the Grand Game. Through murder and intrigue, she ruthlessly reshaped the world around her, laying the foundations for Orlais itself."
  legend_drakon_i: "The First Emperor"
  legend_drakon_i_desc: "Kordillus I Drakon. Founder of the Orlesian Empire, the Chantry itself, the Circles and the Templars. Responsible for creating the most powerful nation on Thedas, and converting the continent to the Chant of Light."
  legend_shartan: "The Liberator"
  legend_shartan_desc: "At the foot of Solitarios, the Lonely Hill, Shartan and Andraste met. Together they marched as one on Minrathous, where he died attempting to free Our Lady from the pyre. Through his efforts, the Elvhen became free."
  legend_justinia_i: "The First Divine"
  legend_justinia_i_desc: "Olessa of Montsimmard was the only female general in Kordillus Drakon's armies. As much a soldier as she was a priest, and as such an echo of Andraste herself, she was selected to be Justinia I, the First Divine."
  legend_teyrn_hafter: "Teyrn Hafter"
  legend_teyrn_hafter_desc: "Son of the great Dane, Hafter was a mighty warrior in his own right. During the Second Blight, he unified the Alamarri to drive back the Darkspawn hordes. He was the ablest soldier of an able time."
  legend_last_inquisitor: "The Last Inquisitor"
  legend_last_inquisitor_desc: "A friend to Kordillus Drakon, Ameridan was a Dalish Elf who rose to become the final leader of the Inquisition. A man of passion in equal measure to his faith, his disappearance only fans the flames of his legend."
  legend_trefir: "Trefir, the First"
  legend_trefir_desc: "Andraste did give unto Trefir, a lowly slave, the Blade of Hessarian. To him she said: "Take this sword and with it bring my judgment to the world." He took the sword, and became an instrument of her justice ever after."
  legend_first_emerald_knight: "The First Emerald Knight"
  legend_first_emerald_knight_desc: "Mathalin was the first to bear the title Emerald Knight. He wielded the legendary blade Evanura, which was forged for his hand in Halamshiral by the High Keeper of June."
  legend_sindri: "Sindri Sky-Breaker"
  legend_sindri_desc: "In ancient times, Korth Mountain-Father lived atop Belenas. Young Avvar challenged each other to climb the mountain, and the first to succeed was Sindri himself. He returned with tales of Korth's generosity, inspiring more attempts."
  legend_prince_that_sang: "The Prince that Sang for the Dales"
  legend_prince_that_sang_desc: "Hassandriel brought to the Dalish the Maker, and everyone knows him, for he made the Dales sing the Chant with evermore fervour."
  legend_emperor_tomb_restoration: "The Restoration of the Imperial Tomb"
  legend_emperor_tomb_restoration_desc: "Through trials and tribulations, [ROOT.Legend.GetOwner.GetNameNoTooltip] has worked to regain, one by one, every artefact that was stolen during the Sack of Val Royeaux, hunting them to the ends of Thedas, and rebuilt the tomb of Emperor Kordillus even more beautifully than before."


