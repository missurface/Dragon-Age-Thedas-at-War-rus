 bp1_yearly.5704.t:0 "В гневе [seduced_rival.GetSheHe] [Select_CString(seduced_rival.IsFemale, 'прекрасна', 'прекрасен' )]"
 # DATAW CHANGED [ROOT.Char.GetChamber] -> [ROOT.Char.Custom('GetChamber')] vanilla fix - stocky
 bp1_yearly.5704.desc:0 "[seduced_rival.GetFirstName] снова у меня в [ROOT.Char.Custom('GetChamber_RU_Prep')] и несет какую-то чушь о том, как нехорошо я с [Select_CString(seduced_rival.IsFemale, 'ней', 'ним' )] поступаю. [Select_CString(seduced_rival.IsFemale, 'Ее', 'Его' )] глаза горят, когда [Select_CString(seduced_rival.IsFemale, 'она', 'он' )] меня проклинает, и гнев только усиливается, когда я отвечаю на упреки лишь презрительным покачиванием головы.\n\n[Select_CString(seduced_rival.IsFemale, 'Она', 'Он' )] продолжает буйствовать, а я внезапно замечаю, что не могу оторваться от [Select_CString(seduced_rival.IsFemale, 'ее', 'его' )] глаз. А стоит мне стряхнуть эти грезы, на их место немедленно приходит восхищение [Select_CString(seduced_rival.IsFemale, 'ее', 'его' )] линией подбородка — как выразительно натягивается на ней кожа от ярости. Продолжая неосознанно глазеть, я замечаю, как [Select_CString(seduced_rival.IsFemale, 'ее', 'его' )] грудь зазывно вздымается, когда [Select_CString(seduced_rival.IsFemale, 'она', 'он' )] продолжает тираду, и...\n\n#EMP Куда#! это меня понесло?"
 bp1_yearly.5704.a:0 "Надеюсь, мы узнаем друг друга #EMP гораздо#! лучше, [seduced_rival.GetFirstNameNoTooltip]."
 bp1_yearly.5704.b:0 "Это просто нелепо!"