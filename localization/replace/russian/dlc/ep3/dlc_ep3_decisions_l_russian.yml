l_russian: 
 #Varangian Guard
 found_varangian_guard_decision: "Учредить Имперских храмовников"
 found_varangian_guard_decision_desc: "Много лет храмовники из отдалённых провинций стекались в нашу столицу, привлечённые её богатством. Они предлагают себя в качестве стражей и изрядно преуспели в этом ремесле, ведомые лишь жаждой наживы и собственной гордостью. Если объединить их вокруг архонта, в нашем личном распоряжении окажется непобедимое войско!"
 found_varangian_guard_decision_tooltip: "$found_varangian_guard_decision$"
 found_varangian_guard_decision_confirm: "Начать вербовку"
 unlocked_varangian_guard_desc: "[GetTitleByKey('h_tevinter').GetName] открывает [Concept('court_position', 'придворную должность')|E] «$akolouthos_court_position$» и [Concept('men_at_arms', 'профессиональные войска')|E] [GetMaA('imperial_templars').GetName|l]."
 unlocked_varangian_guard_desc_tt: "Имперские храмовники учреждены"
