l_russian:
 #Storyteller
 ep3_laamp_decision_event.1031.return.tt: "Вы возвращаетесь ко входу в [THIS.Char.Custom('GetTavernDwelling_RU_Acc')]"
 ep3_laamp_decision_event.1031.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: рассказчик"
 ep3_laamp_decision_event.1031.desc_01: "#EMP «…и тогда Эльгарнан, охваченный неугасимой яростью, наконец низверг солнце, бросив его в великую бездну».#!"
 ep3_laamp_decision_event.1031.desc_02: "#EMP «…и тогда Гессариан, исполнившись раскаяния и новой веры, принял [Concept('chant_of_light', 'Песнь Света')|E] и предал огласке предательство Маферата».#!"
 ep3_laamp_decision_event.1031.desc_03: "#EMP «…и там пали оковы. Шартан поднял меч и двинулся вперед, чтобы вместе с [Concept('andraste', 'Андрасте')|E] нести освобождение всем народам».#!"
 ep3_laamp_decision_event.1031.desc_04: "#EMP «…и со смертью великого императора Орлей лишился своего первого и, возможно, величайшего правителя: он не только объединил большую часть [Concept('thedas', 'Тедаса')|E] одной верой, но и спас ее от [Concept('blight', 'Второго Мора')|E]».#!"
 ep3_laamp_decision_event.1031.desc_05: "#EMP «…и на рассвете тридцатого дня ей впервые явился [maker|E] и сделал ее своей Невестой».#!"
 ep3_laamp_decision_event.1031.desc_06: "#EMP «…и Францис покинул Бездонный Разлом, потеряв друзей и состояние, а вскоре лишившись и жизни: он еще не знал, что [Concept('blight', 'Мор')|E] овладел и им».#!"
 ep3_laamp_decision_event.1031.desc_07: "#EMP «…и, войдя в великую гробницу, она не увидела урны. Перед ней был иссохший старый труп, следивший за каждым ее движением, ибо Великий Некрополь полон тел мертвых, сохраненных и одержимых духами».#!"
 ep3_laamp_decision_event.1031.desc_08: "#EMP «…и в конце пути, который позднее назовут Долгим, Ашалле рассмеялась: повернувшие обратно в Тевинтер уже никогда не увидят величайшую красоту Долов — только что возведенный Халамширал».#!"
 ep3_laamp_decision_event.1031.desc_09: "#EMP «…и куропатка преуспела. Освободив сердце Корта и вновь соединив его с богом, птица этим подвигом возвысилась над всеми прочими».#!"
 ep3_laamp_decision_event.1031.desc_10: "#EMP «…и, готовясь навсегда покинуть Томбигби, Конрад узнал от своей возлюбленной-хасиндки последнее: сколь жестока Волчья Королева, Владычица Всего и Войны, и что племена делают с теми, кто позорно бежал с поля боя. Его прах так и не нашли; быть может, он до сих пор покоится в глубинах Диких земель Коркари».#!"
 ep3_laamp_decision_event.1031.desc_11: "#EMP «…и, сразив чудовище, таившееся под Лаванделем, [Concept('grey_warden', 'Серые Стражи')|E] спасли молодой город от [Concept('darkspawn', 'порождений тьмы')|E]».#!"
 ep3_laamp_decision_event.1031.desc_12: "#EMP «…и вина в ту ночь пролилось столько, что даже орлесианский посол дивился: воды Минантера покраснели от разгульного празднества в Вайкоме».#!"
 ep3_laamp_decision_event.1031.desc_13: "#EMP «…и, впервые увидев собственными глазами, как пожилая женщина содрогается, добровольно приняв в себя духа, я [Select_CString(ROOT.Char.IsFemale, 'поняла', 'понял' )], что делает Ривейн столь неповторимым».#!"
 ep3_laamp_decision_event.1031.desc_14: "#EMP «…и со смертью Берегранда Антива потеряла того, кто научил ее народ ремеслам, позволившим выковать государство. Антиванцы и поныне чтут его как героя, а гномы — как предателя».#!"
 ep3_laamp_decision_event.1031.desc_15: "#EMP «…и, когда пролилась кровь последнего господина, Эмериус разбил свои цепи и преобразился в город Киркволл».#!"
 ep3_laamp_decision_event.1031.desc_16: "#EMP «…и, отвернувшись от [Concept('maker', 'Создателя')|E] ради [Concept('old_god', 'Древних богов')|E], планасенцы поливали поля кровью нероменианцев, пока сам Пнемоикс не окрасился красным».#!"
 ep3_laamp_decision_event.1031.desc_17: "#EMP «…и, когда [andraste|E] высадилась близ нынешнего Оствика, господа и рабы Герцинии вместе разбили свои цепи и последовали за Пророчицей в ее [Concept('exalted_march', 'Священном походе')|E], ибо считали себя уже не тевинтерцами, а совершенно новым народом, рожденным многовековым смешением».#!"
 ep3_laamp_decision_event.1031.desc_18: "#EMP «…и, когда лорд Ваэль отказался от королевского титула, Старкхевен провозгласил его князем и положил конец правлению короля Железного Кулака».#!"
 ep3_laamp_decision_event.1031.desc_outro: "\n\n«Но это уже, как говорится, совсем другая история», — пригубив из чаши, на дне которой еще остается [laamp_storyteller.Custom('RegionalDrink')|l], [Select_CString(laamp_storyteller.IsFemale, 'рассказчица', 'рассказчик' )] загадочно улыбается и устраивается поближе к очагу."