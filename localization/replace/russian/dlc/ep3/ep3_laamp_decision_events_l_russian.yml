l_russian:
 #Storyteller
 ep3_laamp_decision_event.1031.return.tt: "You return to the [THIS.Char.Custom('GetTavernDwelling')] entrance"
 ep3_laamp_decision_event.1031.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: the Storyteller"
 ep3_laamp_decision_event.1031.desc_01: "#EMP "...and Elgar’nan, filled with unending rage, finally overthrew the sun by casting him into a great abyss."#!"
 ep3_laamp_decision_event.1031.desc_02: "#EMP "...and Hessarian, filled with remorse and renewed fervor, adopted the [chant_of_light|E] and brought forward’s Maferath’s treachery for all to see."#!"
 ep3_laamp_decision_event.1031.desc_03: "#EMP "...and there, the shackles were broken. Shartan lifted his sword, and marched forward, for he would march alongside [andraste|E] in her liberation of all."#!"
 ep3_laamp_decision_event.1031.desc_04: "#EMP "...and with the great Emperor’s death, Orlais left behind its first and perhaps greatest ruler, who not only united most of [thedas|E] under one faith, but also saved them from the Second [blight|E]."#!"
 ep3_laamp_decision_event.1031.desc_05: "#EMP "...and, with the dawn of the Thirtieth day came her first vision of the [maker|E], who made her his Bride."#!"
 ep3_laamp_decision_event.1031.desc_06: "#EMP "...and Francis left the Abyssal Rift, having lost his friends, his fortune and soon, his life, as he didn’t knew, but the [blight|E] had taken hold of him as well."#!"
 ep3_laamp_decision_event.1031.desc_07: "#EMP "...and, when she entered the great tomb, she could not see an urn. She saw a dry, old corpse watching her every move, for the Grand Necropolis is filled with the bodies of the dead, preserved and possessed."#!"
 ep3_laamp_decision_event.1031.desc_08: "#EMP "...and at the end of what we would later call the Long Walk, Ashalle laughed, for the ones that turned back to Tevinter would never see the newly built, greatest beauty of the Dales: Halamshiral."#!"
 ep3_laamp_decision_event.1031.desc_09: "#EMP "...and the ptarmigan succeeded. With the heart of Korth freed and bound to the god once again, the bird was elevated has the greatest amongst all for its deed."#!"
 ep3_laamp_decision_event.1031.desc_10: "#EMP "...and at this moment as he prepared to leave Tombigbee for the last time, Conrad learned of one last thing from his Chasind lover: the brutality of The Wolf-Queen, She of All and War, and what the tribes do to those who shamefully fled from battle. To this day, his ashes have never been recovered, perhaps still deep in the Korcari Wilds."#!"
 ep3_laamp_decision_event.1031.desc_11: "#EMP "...and with the slaying of what lurked below Lavendel, the [grey_warden|E]s saved the fledgling town from the [darkspawn|E]."#!"
 ep3_laamp_decision_event.1031.desc_12: "#EMP "...and the amount of wine spilled that night surprised even the Orlesian ambassador, for the Minanter ran red with the revelry of Wycome’s celebration."#!"
 ep3_laamp_decision_event.1031.desc_13: "#EMP "...and seeing this elderly woman jerk as a willing possession happened before my eyes for the first time, I understood what made Rivain so unique."#!"
 ep3_laamp_decision_event.1031.desc_14: "#EMP "...and with the death of Beregrand, Antiva lost the one that gave the skill to forge the nation of Antiva, and is still remembered as a hero by them, as well as a traitor to the dwarves."#!"
 ep3_laamp_decision_event.1031.desc_15: "#EMP "...and, with the blood of the last master spilled, Emerius broke their chains, and transformed into the city of Kirkwall."#!"
 ep3_laamp_decision_event.1031.desc_16: "#EMP "...and, by turning their back on the [maker|E] to accept the [old_god|E]s, the Planasene watered their fields with the blood of Neromenian, until the Pnemoix itself turned red."#!"
 ep3_laamp_decision_event.1031.desc_17: "#EMP "...and, when [andraste|E] landed near today’s Ostwick, masters and slaves alike in Hercinia broke their chains and followed the prophetess in her [exalted_march|E], for they considered themselves no longer Tevinter, but an entirely new culture, born from their mingling through the centuries."#!"
 ep3_laamp_decision_event.1031.desc_18: "#EMP "...and, when Lord Vael refused the title of King, Starkhaven named him Prince, and ended the rule of King Ironfist."#!"
 ep3_laamp_decision_event.1031.desc_outro: "\n\n"But that story is for another time." The storyteller gives me a mysterious smile, leans back in [laamp_storyteller.GetHerHis] fireplace-seat and takes another sip of [laamp_storyteller.Custom('RegionalDrink')]."