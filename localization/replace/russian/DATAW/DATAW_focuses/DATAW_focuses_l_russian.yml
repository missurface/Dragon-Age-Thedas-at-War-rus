 action_lifestyle_magic_label: "$action_can_spend_perk_point_label$"
 action_lifestyle_magic_desc: "$action_can_spend_perk_point_desc$"
 action_lifestyle_magic_click: "$action_can_spend_perk_point_click$"
 
