 magic_lifestyle_highlight_desc: "Из-за того, что вы [Concept( 'education', 'обучались' )|E] магии, ваш прирост [Concept( 'experience', 'опыта' )|El] для этого образа жизни увеличен на #P [GetPlayer.Custom('GetEducationLifestylePercentageBoost')]#!"
