 ompot_du_patronage_tax_collector: "Impôt du Mécène"
 ompot_du_patronage_tax_collector_desc: "This tax status, desired by many nobles is one of leisure. In exchange of increased levies, the vassal is given a personal charter, which, in the liege's name, forces every artisan and architect to be required by law to assist the lord in planning activities, at a reduced price covered by the liege. This has generally resulted in the vassal's land slowly becoming a lively and luxurious place for the nobles of Orlais. However, this has also usually results in the liege gaining a favourable reputation of a patron of the arts, attracting many desiring to finally get their place in the Game of the nobles courts."
