l_russian:
 default_orlesian_tax_collector: "Милость Империи"
 droits_de_la_frontiere_tax_collector: "Право рубежа"
 demande_de_l_empereur_tax_collector: "Приказ Империи"
 tribut_de_l_ombre_tax_collector: "Дань Тени"
 respect_du_chant_tax_collector: "Почтение к Песни"
 taxe_de_la_cite_tax_collector: "Городской налог"
 vaeu_de_la_lance_tax_collector: "Клятва копья"
 default_orlesian_tax_collector_desc: "Налоговый статус, введённый в первые годы существования Империи для мятежных вассалов: он предусматривает многочисленные налоговые льготы и послабления в обмен на гарантии стабильности."
 droits_de_la_frontiere_tax_collector_desc: "Налоговый статус, связанный с рядом прав и обязанностей и основанный на системе налогообложения, которую Исорат применял в Джейдере. Обычно его получают вассалы, чьи владения лежат на рубеже державы: им предоставляются значительные налоговые льготы, но взамен они обязаны обучать местных солдат и создавать из них отборные войска на службе сюзерена."
 demande_de_l_empereur_tax_collector_desc: "Этот обычай обычно служит наказанием вассалу — как за провал, так и за чрезмерный успех в Великой игре. Получение такого статуса считается унижением, и сверстники нередко сторонятся вассала, не сумевшего его избежать."
 tribut_de_l_ombre_tax_collector_desc: "Этот почётный статус подразумевает привилегии, о которых никогда не говорят при свете дня. По обычаю вассал должен вместе с обычными налогами покупать дорогие дары и преподносить их сюзерену. Если сюзерен принимает подношение и вручает в ответ нож, вассал может рассчитывать на поддержку в тайных делах — пока выбирает правильные цели."
 respect_du_chant_tax_collector_desc: "Эта уникальная налоговая система предназначена для редких случаев, когда религиозные разногласия вассала с господствующей верой кажутся непримиримыми. Пока он признаёт власть Орлея над Песнью или власть Верховной Жрицы, местные обычаи могут сохраняться. Однако вассал обязан отправлять на службу сюзерену больше солдат, доказывая, что иная вера не мешает его верности."
 taxe_de_la_cite_tax_collector_desc: "Этот налоговый статус — наследие древних городов-государств, некогда господствовавших в Орлее. Он предусматривает призыв большого числа солдат для участия в городском строительстве. В наши дни его могут даровать вассалу в обмен на повышенные налоги, однако архаичная система обычно оставляет сельскую местность без внимания и плохо подходит для управления обширными владениями."
 vaeu_de_la_lance_tax_collector_desc: "Этот статус восходит к клятве, которую многие орлесианские дворяне принесли в разгар Второго Мора. В обмен на налоговые льготы правитель обязан обучать опытные войска и предоставлять их для наступательных походов сюзерена."
 default_orlesian_tax_collector_flavor_desc: "Налоговый статус, введённый в первые годы существования Империи для мятежных вассалов: он предусматривает многочисленные налоговые льготы и послабления в обмен на гарантии стабильности."
