l_russian:
 default_orlesian_tax_collector: "Grâce de l’Empire"
 droits_de_la_frontiere_tax_collector: "Droit du Front"
 demande_de_l_empereur_tax_collector: "Ordre de l’Empire"
 tribut_de_l_ombre_tax_collector: "Tribut de l’Ombre"
 respect_du_chant_tax_collector: "Respect du Chant"
 taxe_de_la_cite_tax_collector: "Taxe de la Cité"
 vaeu_de_la_lance_tax_collector: "Vœu de la Lance"
 default_orlesian_tax_collector_desc: "A tax status installed in the early days of the Empire for rebellious vassals, which gives numerous tax breaks and incentives in exchange for assurance of stability."
 droits_de_la_frontiere_tax_collector_desc: "A tax status attached to a collection of rights and duties, based on Isorath's taxing practices regarding Jader. Typically given to vassals with domains on the frontier of the realm, this status gives them greater tax privileges in exchange of a duty to train local soldiers into an elite military force at the liege's service."
 demande_de_l_empereur_tax_collector_desc: "A practice typically used to punish a vassal, either for their poor or excellent performance in the Game. Getting attributed this status is seen as humiliation, causing the vassal to generally be shunned by their peers for their failure to avoid this status"
 tribut_de_l_ombre_tax_collector_desc: "This status is one of courtesy, of implied privileges never revealed to the light of day. The custom dictates that for the status to hold, expensive gifts need to be bought and offered to the liege alongside the regular payment of taxes. If the liege accepts and gives in return a knife, the vassal can expect support in covert activities, so long as they target the right people"
 respect_du_chant_tax_collector_desc: "This tax system, unique and reserved to some peculiar cases, is sometimes used for vassals with religious differences from expected worship that may prove irreconciliable. So long as they recognize Orlesian authority over the Chant or the Divine's authority, local practices may be respected. However, the vassal will be expected to send a greater amount of soldiers to the liege's service, to prove their differing faith is not an obstacle."
 taxe_de_la_cite_tax_collector_desc: "A relic of the old city-states that once dominated Orlais, this tax status entails the conscription of a large amount of soldiers to assist construction efforts of the city. Today, this system can be bestoyed upon a vassal in exchange for greater taxes, although the archaic system typically leaves the countryside neglected, unfit for the ruling of large domains"
 vaeu_de_la_lance_tax_collector_desc: "Born from a vow that many orlesian nobles vowed in the peak of the Second Blight, the lord is expected under this oath to train and provide experienced troops to aid the liege's offensive campaigns, in exchange for tax breaks."
