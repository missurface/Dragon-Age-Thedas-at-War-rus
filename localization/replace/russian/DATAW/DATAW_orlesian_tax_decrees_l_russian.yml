 grace_de_l_empereur_tax_collector: "Императорская милость"
 grace_de_l_empereur_tax_collector_desc: "Налоговый статус, введённый в первые годы существования Империи для мятежных вассалов: он предусматривает многочисленные налоговые льготы и послабления в обмен на гарантии стабильности."
 grace_de_l_empereur_tax_collector_flavor_desc: "$grace_de_l_empereur_tax_collector_desc$"
 ompot_du_patronage_tax_collector: "Налог мецената"
 ompot_du_patronage_tax_collector_desc: "Многие дворяне мечтают об этом необременительном налоговом статусе. В обмен на увеличенное ополчение вассал получает личную грамоту, которая от имени сюзерена обязывает ремесленников и архитекторов помогать ему в подготовке мероприятий по сниженной цене, а разницу покрывает казна сюзерена. Благодаря этому земли вассала постепенно превращаются в оживлённое и роскошное место отдыха орлесианской знати. Сюзерен же приобретает славу покровителя искусств и привлекает многих желающих наконец занять своё место в придворной Великой игре."
 ompot_du_patronage_tax_collector_flavor_desc: "Многие дворяне мечтают об этом необременительном налоговом статусе. В обмен на увеличенное ополчение вассал получает личную грамоту, которая от имени сюзерена обязывает ремесленников и архитекторов помогать ему в подготовке мероприятий по сниженной цене, а разницу покрывает казна сюзерена. Благодаря этому земли вассала постепенно превращаются в оживлённое и роскошное место отдыха орлесианской знати. Сюзерен же приобретает славу покровителя искусств и привлекает многих желающих наконец занять своё место в придворной Великой игре."

