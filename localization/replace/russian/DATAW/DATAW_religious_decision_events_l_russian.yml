l_russian:
 give_tree_burial_decision: "[ROOT.Char.Custom2('RelationToMe', ROOT.Var('ancestor_to_bury').Char)|U] удостоится погребения в дереве"
 give_tree_burial_decision_tooltip: "Похороните своего предка и получите [Concept( 'piety', 'благочестие' )|E] и [opinion|El] [Concept( 'vassal', 'вассалов' )|E]"
 give_tree_burial_decision_desc: "#F [ROOT.Var('ancestor_to_bury').Char.Custom2('MyCharacterIntroduction', ROOT.Char)|U] больше не с нами. По традиции, [ROOT.Var('ancestor_to_bury').Char.GetHerHim] полагается погребение в дереве: [ROOT.Var('ancestor_to_bury').Char.GetHerHis] останки станут пищей для духов. Пусть [ROOT.Var('ancestor_to_bury').Char.GetSheHe] накормит мир, что когда-то кормил [ROOT.Var('ancestor_to_bury').Char.GetHerHis].#!"
 give_tree_burial_decision_confirm: "Устроить погребение в дереве"
 give_tree_burial_vassals: "Все вассалы, верящие в погребение в деревьях"

 DATAW_minor_decision.0702.t: "Погребение в дереве"
 DATAW_minor_decision.0702.desc.wilderness: "Я иду сквозь древние рощи; священные ветви шелестят и звучат подобно невиданному инструменту.\nЗдесь темно: листья заслоняют солнце, и на обряд падает ровно столько света, сколько ему подобает.\nПод кронами и над ними я слышу ветер — а может быть, призраков и духов, ведь в этой роще обитают мёртвые.\nЯ следую за друидами. Они напевают и покачиваются, а позади идут скорбящие. Найдя дерево, друиды творят заклинание, очищают его от плесени и выдалбливают в стволе полость.\nДерево не погибнет. Мы по одному подходим к отверстию и произносим последние слова — прощание, а быть может, проклятие. Эти слова принадлежат скорбящим и мёртвым. Скоро наступает мой черёд, но мне требуется время, чтобы поверить в случившееся.\nНесмотря на песни, которые мы пели по пути, и дни, потраченные на очищение тела от грехов и злых сил, я долго не могу решить, что сказать.\nКогда я заканчиваю, друиды закрывают полость новым заклинанием, навеки запечатывая останки в дереве.\n«[Select_CString(ROOT.Var('ancestor_to_bury').Char.IsFemale, 'Наша родичка, наша подруга, наша возлюбленная, наша незнакомка ушла', 'Наш родич, наш друг, наш возлюбленный, наш незнакомец ушёл' )]. [ROOT.Var('ancestor_to_bury').Char.GetSheHe|U] будет покоиться здесь, среди деревьев и древесины, от которых мы отрекаемся при жизни, но которые принимаем в смерти».\nМы уходим. Без напевов друидов ветер крепчает, лес вновь погружается во тьму, а шёпот ветра становится громче и гонит нас прочь. Прежде чем навсегда отвернуться, я делаю глубокий вдох и вздыхаю."
 DATAW_minor_decision.0702.a: "Прощай, [ROOT.Char.Custom2('RelationToMe', ROOT.Var('ancestor_to_bury').Char)]."

 DATAW_minor_decision.9401.t: "Духи, даруйте мне помощь"
 DATAW_minor_decision.9401.desc: "Я прибываю к месту ритуала, залитому прекрасным светом Белой Госпожи, и вижу, что друиды умело начертили жертвенной кровью все необходимые знаки. Благодаря заключённой в крови магической силе я призову духов на помощь и попрошу их даровать мне одних из самых страшных воинов, когда-либо ступавших по лесу, — сильванов.\n\n Я встаю посреди наполненного кровью круга. Тела жертв привязаны к окружающим деревьям, а я взываю к духам: к Владычице Леса, Белой Госпоже и нашим предкам. В моей мольбе не забыт ни один дух, способный защитить самых преданных почитателей от надвигающейся бури.\n\n Во время молитвы кровь вокруг меня вновь и вновь извивается и взмывает в воздух, складываясь в непрестанно меняющуюся массу из десятков образов. Одни кажутся человеческими, другие настолько искажены и чужды, что я не могу заставить себя описать их.\n\n Духи услышали мой зов и теперь ждут последнего подношения."
 DATAW_minor_decision.9401.a: "О духи, я отдам вам собственную драгоценную кровь."
 DATAW_minor_decision.9401.aa: "О духи, я отдаю вам свою ногу!"
 DATAW_minor_decision.9401.aaa: "Вы получите [Concept( 'trait', 'свойство' )|E] «[GetTrait('one_legged').GetName( GetNullCharacter )|V]»"
 DATAW_minor_decision.9401.ab: "О духи, я отдаю вам свой глаз!"
 DATAW_minor_decision.9401.aba: "Вы получите [Concept( 'trait', 'свойство' )|E] «[GetTrait('one_eyed').GetName( GetNullCharacter )|V]»"
 DATAW_minor_decision.9401.ac: "О духи, я отдаю вам свою способность продолжить род!"
 DATAW_minor_decision.9401.aca: "Вы получите [Concept( 'trait', 'свойство' )|E] «[GetTrait('eunuch_1').GetName( GetNullCharacter )|V]»"
 DATAW_minor_decision.9401.ad: "О духи, я отдаю вам плоть со своего лица!"
 DATAW_minor_decision.9401.ada: "Вы получите [Concept( 'trait', 'свойство' )|E] «[GetTrait('disfigured').GetName( GetNullCharacter )|V]»"
 DATAW_minor_decision.9401.ae: "О духи, я отдаю вам свой последний глаз!"
 DATAW_minor_decision.9401.aea: "Вы получите [Concept( 'trait', 'свойство' )|E] «[GetTrait('blind').GetName( GetNullCharacter )|V]»"
 DATAW_minor_decision.9401.af: "О духи, я отдаю вам свою кровь!"
 DATAW_minor_decision.9401.afa: "Вы получите [Concept( 'trait', 'свойство' )|E] «[GetTrait('wounded_2').GetName( GetNullCharacter )|V]»"
 DATAW_minor_decision.9401.b: "О духи, я принесу вам кровь ближайшего родственника."
 DATAW_minor_decision.9401.c: "О духи, я принесу вам неиссякаемую кровь множества людей."
 DATAW_minor_decision.9401.d: "Это уже слишком. Я не могу."
 DATAW_minor_decision.9401.d.flavor: "Духи могут не простить легкомысленного призыва."
 DATAW_minor_decision.9401.da: "За это прегрешение духи пошлют своего поборника"
 DATAW_minor_decision.9401.db: "Духи позволят вам уйти"
 spirits_summon_fail: "Вы отказываетесь от призыва"
 spirits_angered: "Духи разгневаны бессмысленным призывом и посылают своего поборника наказать вас!"
 spirits_care_not: "Несмотря на бессмысленный призыв, духи позволяют вам уйти."
