l_russian:
 give_tree_burial_decision: "Give Your [ROOT.Char.Custom2('RelationToMe', ROOT.Var('ancestor_to_bury').Char)|U] a Tree Burial"
 give_tree_burial_decision_tooltip: "Put your ancestor to rest and gain [piety|E] and [vassal|E] [opinion|E]"
 give_tree_burial_decision_desc: "#F [ROOT.Var('ancestor_to_bury').Char.Custom2('MyCharacterIntroduction', ROOT.Char)|U] has passed away. Tradition dictates that [ROOT.Var('ancestor_to_bury').Char.GetSheHe] should be given a tree burial, [ROOT.Var('ancestor_to_bury').Char.GetHerHis] remains left for the spirits to feast upon so that [ROOT.Var('ancestor_to_bury').Char.GetSheHe] may feed the world which once fed [ROOT.Var('ancestor_to_bury').Char.GetHerHim].#!"
 give_tree_burial_decision_confirm: "Give Tree Burial"
 give_tree_burial_vassals: "Every Vassal who believes in Tree Burial"

 DATAW_minor_decision.0702.t: "Tree Burial"
 DATAW_minor_decision.0702.desc.wilderness: "I walk through the old groves; sacred branches rustle and play unlike any instrument.\nIt is also dark here; the leaves block out the sun and bring as much light upon the event as is warranted.\nBelow the trees and above them I can hear the wind, or perhaps the ghosts and spirits, for in this place, this grove, the dead dwell.\nI follow the druids, they hum and sway as the mourners follow behind, the druids find a tree, they cast a spell and remove mold and hollow out a part of the tree.\nThe tree will not die though; we each approach the hole and say our final words, a goodbye, a curse maybe, it belongs to mourners and the dead, it is my turn soon, it takes a moment to believe what has happened.\nDespite the songs we sung along our way here, despite the days we spent curing the body of any sins and malevolent forces; it takes me some time to decide what to say.\nThey close it after I am done; they cast another spell, sealing the remains within the tree\n“Our kinsmen, our friend, our lover, our stranger is gone, [ROOT.Var('ancestor_to_bury').Char.GetSheHe] shall dwell here amidst the trees and wood that we forsake as the living, but we embrace at death."\nWe then leave, the winds pick up without the druids and their humming, and the forest goes dark again, and the whispers of the wind no longer are soft, they sound louder, they shepherd us away, and before my back is turned forever I breath in and sigh."
 DATAW_minor_decision.0702.a: "Goodbye [ROOT.Char.Custom2('RelationToMe', ROOT.Var('ancestor_to_bury').Char)]."

 DATAW_minor_decision.9401.t: "Spirits, lend me your aid"
 DATAW_minor_decision.9401.desc: "As I arrive on the site of the ritual, bathed in the beautiful light of the White Lady, I notice that my druids have expertly used the blood of the sacrifices to set up the ritual site. Thanks to the inherent magical power present within blood, I will call upon the spirits for aid, in the hope that they give me some of the most dreadful warriors that ever walked the forest : the Sylvans.\n\n As I set myself in the middle of the blood-filled circle, with the various bodies of the sacrifices attached on the trees surrounding me, I call upon the Spirits for aid. The Lady of the Forest, The White Lady, Our Ancestors. No spirit is forgotten in my call for aid, a call to defend their most devout followers against the coming storm.\n\n Multiple times during my prayer, I see the blood all around me twist, float around me as it forms an ever-moving mass seemingly composed of dozens of forms, some seemingly human, others being so deformed and alien I cannot bring myself to describe them.\n\n The spirits have heard my call, and they now await the final offering."
 DATAW_minor_decision.9401.a: "Oh Spirits, I shall offer you my own dearest blood."
 DATAW_minor_decision.9401.aa: "Oh spirits, I give my leg to you!"
 DATAW_minor_decision.9401.aaa: "You gain the [trait|E] [GetTrait('one_legged').GetName( GetNullCharacter )|V]"
 DATAW_minor_decision.9401.ab: "Oh spirits, I give my eye to you!"
 DATAW_minor_decision.9401.aba: "You gain the [trait|E] [GetTrait('one_eyed').GetName( GetNullCharacter )|V]"
 DATAW_minor_decision.9401.ac: "Oh spirits, I give that what makes me man to you!"
 DATAW_minor_decision.9401.aca: "You gain the [trait|E] [GetTrait('eunuch_1').GetName( GetNullCharacter )|V]"
 DATAW_minor_decision.9401.ad: "Oh spirits, I give the flesh of my face to you!"
 DATAW_minor_decision.9401.ada: "You gain the [trait|E] [GetTrait('disfigured').GetName( GetNullCharacter )|V]"
 DATAW_minor_decision.9401.ae: "Oh spirits, I give my remaining eye to you!"
 DATAW_minor_decision.9401.aea: "You gain the [trait|E] [GetTrait('blind').GetName( GetNullCharacter )|V]"
 DATAW_minor_decision.9401.af: "Oh spirits, I give my blood to you!"
 DATAW_minor_decision.9401.afa: "You gain the [trait|E] [GetTrait('wounded_2').GetName( GetNullCharacter )|V]"
 DATAW_minor_decision.9401.b: "Oh Spirits, I offer you the blood of my closest kin."
 DATAW_minor_decision.9401.c: "Oh Spirits, I shall offer you the endless blood of the masses."
 DATAW_minor_decision.9401.d: "This too much. I can’t do it."
 DATAW_minor_decision.9401.d.flavor: "The spirits may not take careless summons well."
 DATAW_minor_decision.9401.da: "The spirits will send their champion for such transgression"
 DATAW_minor_decision.9401.db: "The spirits will allow you to leave"
 spirits_summon_fail: "You back out from the summoning"
 spirits_angered: "The spirits are angered by your pointless summoning and send their champion to punish you!"
 spirits_care_not: "The spirits allow you to leave despite your pointless summoning."
