l_russian:
# EVENT 1
 DATAW_morreau_events.001.tit: "Украденная и разорённая родина"
 DATAW_morreau_events.001.desc: "Минуло десять лет с тех пор, как дом Симмар в последний раз правил Монтсиммаром. После того как порождения тьмы напали на Столицу Юга и прорвались в город, а эльфы бросили его на произвол судьбы, дом Симмар угас. Теперь родиной Первой Верховной Жрицы правит [Concept('house','дом')|E] [percivale.GetHouse.GetName], заявляющий о ближайшем родстве с прежними властителями по браку: [Select_CString(percivale.IsFemale, 'нынешняя глава', 'нынешний глава' )], [percivale.GetName], является [Select_CString(percivale.IsFemale, 'дочерью', 'сыном' )] одного из последних представителей дома Симмар. \n\n«Но им не сравниться с домом [ROOT.Char.GetHouse.GetName]!» — восклицает [jean.GetName], прерывая мой урок. «Аврелиены лишь вступали в браки с Симмарами, тогда как мы происходим от них по прямой линии. Мы — младшая ветвь дома Симмар, истинные наследники Монтсиммара, и город со всеми землями принадлежит нам по праву рождения». \n\nМы смирились с нынешним положением дел, но многие в доме Морро по-прежнему чувствуют себя обманутыми и мечтают вернуться в город, некогда бывший гордостью нашей династии. В юном взгляде смешались гнев и отвага. [Select_CString(jean.IsFemale, 'Она способна', 'Он способен' )] посвятить мечте всю жизнь."

 DATAW_morreau_events.001.opt.a: "Шаг за шагом, [Select_CString(jean.IsFemale, 'юная леди', 'юноша' )]."
 DATAW_morreau_events.001.opt.a.tooltip: "Эдинель возьмёт под своё крыло персонажа [jean.GetName] и постарается направить [Select_CString(jean.IsFemale, 'её', 'его' )] к возвращению наследия Симмаров."

# Event 2
 DATAW_morreau_events.002.tit: "Возрождение династии"
 DATAW_morreau_events.002.desc: "Наконец родина Первой Верховной Жрицы оказалась в руках дома [ROOT.Char.GetHouse.GetName]. Истинные наследники династии [ROOT.Char.GetDynasty.GetName] вновь правят городом, который мы должны были унаследовать по праву. \n\nЭто лишь первый шаг к возвращению положения, которое дом Симмар занимал до разрушения Монтсиммара. Однажды мы вновь станем правителями Довина. Но сегодня мы уже вернули владения и родину Симмаров, а теперь настало время возродить имя, которым не пользовались десятилетиями."

 DATAW_morreau_events.002.opt.a: "Мы снова Симмары!"
 DATAW_morreau_events.002.opt.a.tooltip: "Вы и ваши прямые потомки станете членами дома Симмар."