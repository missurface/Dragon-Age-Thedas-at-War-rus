l_russian:
 DATAW_building_decision.0001.tit: "Ужасы фанатизма..."
 DATAW_building_decision.0001.desc: "Могилы. \n\nВойдя в приют Дюкарма, я вижу лишь бесчисленные могилы. После нескольких отказов администрации допустить проверку на месте двери пришлось выбить самодельным тараном. \n\nТеперь понятно почему. \n\nПовсюду эльфийские сироты: одни выглядят так, будто много дней не видели ни света, ни пищи, спины других сплошь покрыты кровавыми следами от плетей. Удивительно, но все они на безупречном орлесианском взывают к Создателю. Трудно сказать, порождено ли это глубокое знание Песни страхом наказания или искренней верой. В подвале здания обнаружили клетки, где многих держали взаперти — якобы ради «исправления». \n\nНо самое страшное открылось, когда раскопали могилы. \n\nВсе погибшие были долийцами. У всех часть лица, а порой и всё лицо целиком покрывали чудовищные шрамы. Ко мне с трудом подошёл ослабевший эльф с такими же отметинами и дрожащим голосом объяснил их происхождение. \n\n«Они говорили, что валласлин делает нас рабами богов и не позволяет следовать за Создателем. Говорили, что, если мы не дадим им удалить его, нас не будут кормить. В могилах лежат те, кто не пережил этого». \n\nТакого не должно было случиться ни с кем."
 DATAW_building_decision.0001.opt.a: "Снести это место до основания. Виновные дорого заплатят за такой позор."
 DATAW_building_decision.0001.opt.b: "Никто не должен узнать, что здесь произошло. Всё скрыть."
 DATAW_building_decision.0001.opt.c: "Немедленно установить надзор, чтобы подобные зверства не повторились."

 DATAW_building_decision.0002.tit: "...И красота любви"
 DATAW_building_decision.0002.desc: "Месяц назад зверства в приюте Дюкарма вышли на свет. Несмотря на непрестанную вражду между людьми и эльфами, никто не оспорил решение разобрать здание до последнего кирпича, чтобы заведение и творившиеся в нём ужасы канули в забвение. \n\nНикто, кроме жителей владения [GetTitleByKey('c_verchiel').GetNameNoTier]. \n\nНеожиданно местные начали давать кров оставшимся без дома эльфам. Многие сироты вошли в человеческие семьи: делят с ними пищу и быт, трудятся рядом. Возможно, людьми движет чувство вины, но столь редкое равенство между народами не может не удивлять. Некоторые эльфы даже сумели приобрести дома и основать небольшой квартал. \n\nВладение [GetTitleByKey('c_verchiel').GetNameNoTier] стало местом великого преступления против эльфов, но теперь, по иронии судьбы, здесь возник едва ли не величайший в истории Орлея пример равенства между народами. Эти новые обычаи едва ли распространятся на весь край, однако местным жителям удалось вырастить нечто прекрасное на пепелище зла."
 DATAW_building_decision.0002.opt.a: "Радостная весть."

 DATAW_building_decision.0003.tit: "Пылающая месть Эльгарнана..."
 DATAW_building_decision.0003.desc: "Могилы. \n\nВойдя в приют Дюкарма, двери которого нашим воинам пришлось выбить силой, я вижу лишь бесчисленные могилы. \n\nРаскопки показали, что все погибшие были долийцами. \n\nУ всех часть лица, а порой и всё лицо целиком покрывали чудовищные шрамы. Несколько воинов заметили, что отметины повторяют узоры валласлина, и один из дрожащих сирот подошёл ко мне, чтобы подтвердить их догадку. \n\n«Они говорили, что валласлин делает нас рабами богов и не позволяет следовать за Создателем. Говорили, что, если мы не дадим им удалить его, нас не будут кормить. В могилах лежат те, кто не пережил этого». \n\nПовсюду эльфы: одни выглядят так, будто много дней не видели ни света, ни пищи, спины других сплошь покрыты кровавыми следами от плетей. Все они взывают к презренному богу людей и повторяют Песнь, принёсшую элвенам столько страданий. Увидев их муки, наши воины пришли в ярость и требуют устроить резню во имя божества [ROOT.Char.GetFaith.WarGodName]."
 DATAW_building_decision.0003.opt.a: "Последуем примеру божества [ROOT.Char.GetFaith.WarGodName]. Убить всех виновных и спасти наш народ."
 DATAW_building_decision.0003.opt.b: "Эта земля больше не увидит крови. Заключить виновных в темницу и предать суду."  

 DATAW_building_decision.0004.tit: "...Укрощённая объятиями Митал"
 DATAW_building_decision.0004.desc: "Прошёл месяц с тех пор, как тайны приюта Дюкарма вышли на свет, и теперь здание наконец снесено до основания. Виновных в страданиях постигло правосудие, и остались лишь могилы. \n\nМогилы и сироты. \n\nЗа минувший месяц местные жители вместе с осиротевшими эльфами воздвигли памятник случившемуся. Собранных средств хватило на настоящий монумент против угнетения, возвышающийся среди многочисленных могил погибших. \n\nГоворят, вчера на открытии памятника многие сироты и местные жители исполнили Песнь Света на тех немногих словах эльфийского языка, которые знали, — так они простились с мрачной порой своей жизни. Под статуей высечены слова: «Vir Sulahn Var Revas»." 
 DATAW_building_decision.0004.opt.a: "Достойные слова, чтобы завершить эту главу нашей истории."

 cultural_acceptance_built_elven_neighbourhood: "Поддержка эльфийского квартала"
 
 DATAW_building_decision_exit.t: "Возмещение расходов"
 DATAW_building_decision_exit.desc: "Расходы на поездку возмещены"
 DATAW_building_decision.0005.t: "Галла Венасан: дивное зрелище"
 DATAW_building_decision.0005.elf: "\n\nКак бы то ни было, галлы прекрасны. Божество [ROOT.Char.GetFaith.WaterGodName] создало истинное чудо и явно обладает тонким чувством изящной красоты."
 DATAW_building_decision.0005.cynic: "\n\nПри виде этой красоты невольно задумываешься: быть может, галл и вправду создали, как утверждают $elven_paganism_religion_adherent_plural$? Если их сотворило божество $vir_evanuris_water_god_name$, оно явно обладало тонким чувством изящной красоты."
 DATAW_building_decision.0005.desc: "Вот уже час я нахожусь в Галла Венасан. Вокруг беззаботно и вольно скачут галлы. Знают ли они, что люди считают это место их колыбелью? И есть ли им до этого дело?"
 DATAW_building_decision.0005.opt.a: "Прекрасно."
 DATAW_building_decision.0005.opt.b: "Перебить их всех и забрать добычу."

 DATAW_building_decision.0006.tit: "...Которым не видно конца"
 DATAW_building_decision.0006.desc: "Немногие участники расследования получили деньги, а те, кто отказался их принять, больше никогда не заговорят. Простолюдины могут строить сколько угодно догадок — так будет лучше для них самих. \n\nНикто не должен узнать, что происходит в приюте Дюкарма для долийских детей. Раскрыв правду об обращении с сиротами, люди узнают и о моих попытках всё скрыть, поэтому эту тайну необходимо хранить любой ценой."
 DATAW_building_decision.0006.opt.a: "Крики детей никто не услышит."

 DATAW_building_decision.0007.tit: "...Теперь обузданные разумом"
 DATAW_building_decision.0007.desc: "Весь минувший месяц расследование дел приюта Дюкарма для долийских детей продолжалось. Все, кто желал детям зла, понесли наказание, а для самого заведения разработали строгие правила. Теперь благородная задача праведного воспитания долийских сирот будет исполняться разумно и достойно. Долийских детей больше не станут похищать у живых семей, а бессмысленным пыткам положен конец. \n\nОтныне приют находится под государственным управлением и получает средства из казны. Настоящих сирот здесь будут содержать с подобающим достоинством и давать им полноценное светское и религиозное образование, как и замыслил Создатель."
 DATAW_building_decision.0007.opt.a: "Наконец их кошмар окончен."
 
 DATAW_visit_the_wyvern_market_decision:0 "Посетить рынок вивернов"
 DATAW_visit_the_wyvern_market_tooltip:0 "Пришло время наведаться на рынок."
 DATAW_visit_the_wyvern_market_desc:0 "Небольшой рынок, выросший вокруг кладбища вивернов, едва ли отличается честной торговлей, но лучшего места для покупки когтя виверна — или даже целого черепа — не найти. Впрочем, можно наведаться туда и ради того, чтобы навести порядок в этом проклятом месте."
 DATAW_visit_the_wyvern_market_decision_confirm:0 "Отправиться на рынок."
 DATAW_visit_the_wyvern_market_decision_effect_tooltip:0 "Эффект-заглушка"
 DATAW_building_decision.0101.tit: "Рынок вивернов"
 DATAW_building_decision.0101.desc: "Войдя в Дарнуа, я сразу замечаю толпу крестьян на площади Кордилиуса. Среди них раскинулось множество прилавков, где продают самые разные части туш вивернов — несомненно, добытые на соседнем кладбище, куда эти звери приходят провести последние дни. Ко мне подходит человек с одного из прилавков и заводит явно не раз отрепетированную речь: «Приветствую! Не желаете приобрести коготь виверна? Быть может, чешую? Или предпочтёте главный товар — целый череп виверна?»"
 DATAW_building_decision.0101.opt.a: "Покупаю коготь виверна."
 DATAW_building_decision.0101.opt.b: "Беру чешую."
 DATAW_building_decision.0101.opt.c: "Покупаю череп."
 DATAW_building_decision.0101.opt.d: "А что, если вместо этого прикрыть вашу лавочку?"
 DATAW_wyvern_claw:0 "Коготь виверна"
 DATAW_wyvern_claw_desc:0 "Коготь с лапы могучего виверна. Говорят, он способен рассечь самую толстую броню."
 DATAW_wyvern_scale:0 "Чешуя виверна"
 DATAW_wyvern_scale_desc:0 "Чешуя из шкуры могучего виверна. Говорят, её не пробьёт даже самое прочное копьё, поэтому охотники особенно ценят такую добычу."
 DATAW_wyvern_skull:0 "Череп виверна"
 DATAW_wyvern_skull_desc:0 "Череп могучего виверна — одного из самых свирепых созданий Тедаса."
 DATAW_disrupted_wyvern_business: "Подорванная торговля частями вивернов"
 DATAW_disrupted_wyvern_business_desc: "Торговля частями вивернов подорвана."
