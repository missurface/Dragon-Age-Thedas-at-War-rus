l_russian:
 DATAW_major_decision.0001.tit: "Титул [GetTitleByKey('d_crescent_valley').GetBaseNameNoTier] покорён"
 DATAW_major_decision.0001.desc: "Свершилось. После веков непрерывной борьбы аввары наконец усмирены. Местные чиновники докладывают, что уже много месяцев край наслаждается миром и изобилием. Ни один караван не сожжён, ни один купец не убит. На землях титула [GetTitleByKey('d_crescent_valley').GetBaseNameNoTier] царит тишина.\nЗнать от Вал Руайо до Монтсиммара больше не посмеет хихикать за нашей спиной: титул [GetTitleByKey('c_jader').GetBaseNameNoTier] вновь обрёл подобающее уважение. Жители нашего великого города никогда не забудут ни роль дома [ROOT.Char.GetHouse.GetName], ни мой личный вклад.\n\nНашими руками дело завершено." # Никакой предвзятости разработчика. Утверждающих обратное публично казнят. — Typical
 DATAW_major_decision.0001.opt.a: "Мечта многих поколений сбылась"

 DATAW_major_decision.0002.tit: "Баннорн объединён"
 DATAW_major_decision.0002.desc: "Со времён наших предков-аламарри землями титула [GetTitleByKey('k_bannorn').GetBaseNameNoTier] правили сотни, если не тысячи мелких властителей, именовавших себя баннами. Ни у кого не хватало сил одолеть остальных. Так было доныне.\n\nЯ, [ROOT.Char.GetName], впервые с незапамятных времён [Select_CString(ROOT.Char.IsFemale, 'объединила', 'объединил' )] вечно разобщённые земли титула [GetTitleByKey('k_bannorn').GetBaseNameNoTier]. За это свершение меня отныне величают [ROOT.Char.GetNickname]."
 DATAW_major_decision.0002.opt.a: "Из многих — единое"

 DATAW_major_decision.0003.tit: "Племена клейнов объединены"
 DATAW_major_decision.0003.desc: "Веками племена народа [GetGlobalVariable('clayne_culture_var').Culture.GetName] оставались разобщены и грызлись между собой. Лишь при [maferath.GetShortUIName] [maferath.GetNickname] мы выступали единым народом, а с тех пор народ [GetGlobalVariable('clayne_culture_var').Culture.GetName] безуспешно пытался вновь объединиться под более законной властью.\n\nЭтот час настал.\n\nС основанием титула [GetTitleByKey('e_ferelden').GetBaseNameNoTier] народ [GetGlobalVariable('clayne_culture_var').Culture.GetName] наконец оказался под одной Короной, одним Троном, в одном Королевстве. Последствия этого объединения превзошли любые ожидания и вышли далеко за пределы политики.\n\nПлемена, прежде враждовавшие и сражавшиеся друг с другом, теперь вместе празднуют единство и готовятся дать отпор любой внешней угрозе. Их обычаи смешиваются, быстро рождая совершенно новую культуру, которая воплощает славу нового Королевства.\nМы больше не [GetGlobalVariable('clayne_culture_var').Culture.GetName] — отныне мы [GetGlobalVariable('fereldan_culture_var').Culture.GetName]."
 DATAW_major_decision.0003.opt.a: "За новое королевство и наконец единый народ! За Ферелден!"

 DATAW_major_decision.0004.tit: "Новая столица"
 DATAW_major_decision.0004.desc: "Теперь народ видит во мне [Select_CString(ROOT.Char.IsFemale, 'свою государыню', 'своего государя' )], и почти вся долина подчиняется моей власти. Но как можно править без достойной столицы? Куда вассалы станут приезжать с изъявлением почтения, а просители — за советом? К счастью, на ум приходит несколько подходящих мест…"
 DATAW_major_decision.0004.opt.a: "Титул [GetTitleByKey('c_denerim').GetBaseNameNoTier] — родина персонажа [andraste.GetName] и идеальное место для столицы."
 DATAW_major_decision.0004.opt.b: "Титул [GetTitleByKey('c_highever').GetBaseNameNoTier] — прекрасное место встречи Ферелдена и Вольной Марки."
 DATAW_major_decision.0004.opt.c: "Титул [GetTitleByKey('c_amaranthine').GetBaseNameNoTier] позволит возвести на побережье столицу-сокровище."
 DATAW_major_decision.0004.opt.d: "Титул [GetTitleByKey('c_caer_oswin').GetBaseNameNoTier] — бьющееся сердце Внутренних земель, способное стать сердцем всего Ферелдена."
 DATAW_major_decision.0004.opt.e: "Титул [GetTitleByKey('c_gwaren').GetBaseNameNoTier], Город, что процветает в одиночестве, воплотит наш независимый дух."
 DATAW_major_decision.0004.opt.f: "Титул [GetTitleByKey('c_redcliffe').GetBaseNameNoTier] — торговая столица Ферелдена — должен стать и политической столицей."
 DATAW_major_decision.0004.opt.g: "Титул [GetTitleByKey('c_portsmouth').GetBaseNameNoTier] легко превратить в крупный торговый центр, укрепляющий наше влияние за морем."
 DATAW_major_decision.0004.opt.h: "Титул [GetTitleByKey('c_ostagar').GetBaseNameNoTier] станет столицей, воплощающей стойкость нашего народа перед испытаниями истории."
 DATAW_major_decision.0004.opt.i: "Титул [GetTitleByKey('c_lothering').GetBaseNameNoTier] расположен на перекрёстке Имперского тракта и отвечает нуждам всего народа."
 DATAW_major_decision.0004.opt.j: "Титул [GetTitleByKey('c_edgehall').GetBaseNameNoTier] станет западным бастионом, защищающим наш народ."
 DATAW_major_decision.0004.opt.k: "Титул [GetTitleByKey('c_thralkeld').GetBaseNameNoTier] станет компромиссом между соперничающими силами нашего народа."





 DATAW_major_decision.0005.tit: "Рождение державы"
 DATAW_major_decision.0005.desc: "#EMP #bold Свершилось.#!#!\n\nПередо мной кровь жертв впитывается в почву нашей священной земли, стоят верные подданные и возвышается прекрасный трон из железной коры. Теперь я понимаю смысл содеянного.\nБресилианцев, прежде объединённых лишь верованиями и обычаями, отныне ведёт [Select_CString(ROOT.Char.IsFemale, 'одна правительница', 'один правитель' )]. [Select_CString(ROOT.Char.IsFemale, 'Одна мигтернес', 'Один мигтерн' )]. Защищая народ от клейнов Гварена и Денерима, защищаясь от остроухих, я [Select_CString(ROOT.Char.IsFemale, 'дала', 'дал' )] бресилианцам голос, за которым они последуют. Я [Select_CString(ROOT.Char.IsFemale, 'стала вестницей Духов', 'стал вестником Духов' )].\n\nКогда костяная корона ложится на мою голову, всё становится ясно.\n\n#italic Я — Голос Владычицы.\n\nЯ — [Select_CString(ROOT.Char.IsFemale, 'мигтернес', 'мигтерн' )] бресилианцев.\n\nПревыше всех.#!"
 DATAW_major_decision.0005.opt.a: "Я — [Select_CString(ROOT.Char.IsFemale, 'Королева духов', 'Король духов' )]."
 DATAW_major_decision.0005.opt.b: "Я — Гнев духов."
 DATAW_major_decision.0005.opt.c: "Я — Воля духов."
 DATAW_major_decision.00051.tit: "Путь народа"
 DATAW_major_decision.00051.desc: "Теперь, когда бресилианцы объединены под властью [Select_CString(ROOT.Char.IsFemale, 'мигтернес', 'мигтерна' )], вассалы ждут моих наставлений: прежде наш народ никогда не знал такого единства.\nРазумеется, люди требуют укрепить лес, чтобы защититься от чужаков, желающих захватить наш дом.\n\nНо ко мне подходит [Select_CString(brucilian_scholar.IsFemale, 'учёная', 'учёный' )] по имени [brucilian_scholar.GetNameNoTooltip] и предлагает иной путь.\n\n«Наш народ живёт в изоляции, — говорит [brucilian_scholar.GetFirstNameNoTooltip]. — Да, мы сильны, но одиноки. С каждым годом в мире появляются изобретения, которые до нас не доходят, и мы отстаём всё сильнее».\n\n«Я понимаю, что народ хочет покоя, но со временем такое отношение подпишет нам смертный приговор. Если мы желаем выжить и избежать судьбы остроухих, нам придётся открыться миру»."
 DATAW_major_decision.00051.opt.a: "Мы пойдём путём, которого требует народ."
 DATAW_major_decision.00051.opt.b: "Вы правы: пора вывести наш народ из изоляции."
 DATAW_fortifying_for_the_coming_storm: "Укрепление региона [GetGeographicalRegion('world_ferelden_brecilian_forest').GetName]"
 DATAW_opening_the_forest: "Открытие региона [GetGeographicalRegion('world_ferelden_brecilian_forest').GetName]"
 DATAW_major_decision.00052.tit: "Создатель леса"
 DATAW_major_decision.00052.desc: "Прогуливаясь по столице, я вижу, как люди торгуют всевозможными товарами, объединённые одним знаменем и властью [Select_CString(ROOT.Char.IsFemale, 'мигтернес', 'мигтерна' )]. Иногда среди них встречаются чужеземцы. Поначалу к ним относятся с подозрением, но затем позволяют торговать и беседовать в относительной безопасности. Бресилианцам понадобится время, чтобы перестать видеть в каждом чужаке захватчика, особенно учитывая рвение пришельцев в поклонении их «Создателю», но начало уже положено.\n\nДальше на площади мне встречается толпа, распевающая слова веры вокруг [Select_CString(brucilian_chantry_priestess.IsFemale, 'женщины', 'мужчины' )]. [brucilian_chantry_priestess.GetFirstNameNoTooltip] продолжает проповедь и молитвы, радуя слушателей и вызывая отвращение у наблюдающих издалека. Постепенно смысл [Select_CString(brucilian_chantry_priestess.IsFemale, 'её', 'его' )] слов становится понятен — и повергает меня в изумление. Эти молитвы обращены не к Духам, как нас учили веками, но и не к чужеземному «Создателю».\n\nМолитвы обращены к обоим как к единому целому.\n\nЗаметив меня, [brucilian_chantry_priestess.GetFirstNameNoTooltip] торопливо спускается с помоста и подходит в сопровождении паствы. В невероятном восторге [Select_CString(brucilian_chantry_priestess.IsFemale, 'проповедница объясняет', 'проповедник объясняет' )]:\n«Приветствую, [Select_CString(ROOT.Char.IsFemale, 'моя мигтернес', 'мой мигтерн' )]! Я — [Select_CString(brucilian_chantry_priestess.IsFemale, 'мать', 'отец' )] [brucilian_chantry_priestess.GetNameNoTooltip], [Select_CString(brucilian_chantry_priestess.IsFemale, 'одна из самых преданных ваших почитательниц', 'один из самых преданных ваших почитателей' )]! Когда вы открыли Лес Бресилиан чужакам, я [Select_CString(brucilian_chantry_priestess.IsFemale, 'пришла', 'пришёл' )] в восторг! Мне захотелось узнать больше об их странной религии, и я [Select_CString(brucilian_chantry_priestess.IsFemale, 'открыла', 'открыл' )] удивительную истину. Наше почитание Духов совместимо с их поклонением Создателю! Духи не творили мир по собственной воле: Создатель послал их исполнить Свой замысел! Владычица Леса, Ткачиха Мыслей — все они служат Создателю!»\n\nЗаметив моё полное изумление, [Select_CString(brucilian_chantry_priestess.IsFemale, 'она продолжает', 'он продолжает' )]:\n«Я знаю, что не все бресилианцы принимают эту новую истину с той же готовностью, что мои слушатели. Прошу лишь об одном, о [Select_CString(ROOT.Char.IsFemale, 'мигтернес, вдохновившая', 'мигтерн, вдохновивший' )] меня на эти поиски. Присоединитесь ли вы к нашим молитвам?»"
 DATAW_major_decision.00052.opt.a: "Я разделю вашу веру, [Select_CString(brucilian_chantry_priestess.IsFemale, 'матушка', 'отче' )]!"
 DATAW_major_decision.00052.opt.b: "Я не последую вашему примеру, но оставлю вас в покое."
 DATAW_major_decision.00052.opt.c: "Мы стремились выжить, а не раствориться среди чужаков! Арестовать этих глупцов!"
 DATAW_major_decision.00053.tit: "Лес и его Создатель"
 DATAW_major_decision.00053.desc: "[court_chaplain.GetFirstNameNoTooltip] врывается ко мне в панике и начинает бессвязно лепетать. Я прошу [Select_CString(court_chaplain.IsFemale, 'её', 'его' )] успокоиться и объяснить причину тревоги.\n\n"
 DATAW_major_decision.00053.desc.a: "«Дело в народе, [ROOT.Char.GetTitleTierName]. Открытое братание [Select_CString(ROOT.Char.IsFemale, 'мигтернес', 'мигтерна' )] с чужаками породило чрезвычайно опасное движение! Они называют себя „Бресилианской Церковью“ и утверждают, будто Духи не сами сотворили этот мир, а всего лишь исполняли приказ своего бога!»\n\n«Эта странная вера уже широко распространилась среди нашего народа. Её необходимо сдержать и уничтожить!»"
 DATAW_major_decision.00053.desc.b: "«Дело в правителе титула [myghtern.GetTitleTierName], [ROOT.Char.GetTitleTierName]. [Select_CString(myghtern.IsFemale, 'Она обратилась', 'Он обратился' )] в чрезвычайно опасное учение! Его последователи называют себя „Бресилианской Церковью“ и утверждают, будто Духи не сами сотворили этот мир, а всего лишь исполняли приказ своего бога!»\n\n«Эта странная вера уже широко распространилась среди нашего народа. Её необходимо сдержать и уничтожить!»"
 DATAW_major_decision.00053.opt.a: "На троне из железной коры я наверняка справлюсь лучше."
 DATAW_major_decision.00053.opt.b: "Приняв новую веру, мы приспособимся ко времени и выживем в ином облике."
 DATAW_major_decision.00053.opt.c: "Я не предам свои убеждения ради одной лишь выгоды!"

 DATAW_major_decision.0008.tit: "[Select_CString(ROOT.Char.IsFemale, 'Владычица Юга', 'Владыка Юга' )]"
 DATAW_major_decision.0008.desc.a: "Увиденное повергает меня в изумление. Перед моим троном на коленях стоят дикари, называющие себя бресилианцами. Несмотря на упрямое стремление к изоляции и независимости, они признают во мне [Select_CString(ROOT.Char.IsFemale, 'истинную правительницу', 'истинного правителя' )] Леса Бресилиан. О Тевинтере они знают лишь по далёкой памяти, ведь последний контакт с ним произошёл века назад, но теперь я стою среди покорённого народа, как во времена его подчинения Империи.\n\nВсе попытки сломить духопоклонников и перекроить их по своему желанию оказались напрасны, лишь усилив ненависть к тевинтерской власти. Несомненно, подданные деспотата останутся непокорными. Неважно. Лес принадлежит мне, и, быть может, вскоре Ферелденом вновь будет править [Select_CString(ROOT.Char.IsFemale, 'уроженка', 'уроженец' )] Тевинтера."
 DATAW_major_decision.0008.desc.b: "Увиденное повергает меня в изумление. Перед моим троном на коленях стоят дикари, называющие себя бресилианцами. Несмотря на упрямое стремление к изоляции и независимости, они признают во мне [Select_CString(ROOT.Char.IsFemale, 'истинную правительницу', 'истинного правителя' )] Леса Бресилиан. О Тевинтере они знают лишь по далёкой памяти, ведь последний контакт с ним произошёл века назад, но теперь я стою среди покорённого народа, как во времена его подчинения Империи.\n\nПопытки сломить духопоклонников и перекроить их по своему желанию принесли мало плодов, хотя теперь они считают нас не столь презренными, как прочих чужаков. Неважно. Лес принадлежит мне, и, быть может, вскоре Ферелденом вновь будет править [Select_CString(ROOT.Char.IsFemale, 'уроженка', 'уроженец' )] Тевинтера."
 DATAW_major_decision.0008.desc.c: "Увиденное повергает меня в изумление. Перед моим троном на коленях стоят дикари, называющие себя бресилианцами. Несмотря на упрямое стремление к изоляции и независимости, они признают во мне [Select_CString(ROOT.Char.IsFemale, 'истинную правительницу', 'истинного правителя' )] Леса Бресилиан. О Тевинтере они знают лишь по далёкой памяти, ведь последний контакт с ним произошёл века назад, но теперь я стою среди покорённого народа, как во времена его подчинения Империи.\n\nУсилия по преобразованию бресилианцев на тевинтерский лад всё же принесли некоторые плоды. Теперь дикари видят в нас скорее обычных чужеземцев, а не существ, достойных одной лишь ненависти. Некоторые даже переняли наши обычаи и проявляют интерес к дальнейшему обучению. Бресилианцы покорены, Лес принадлежит мне, и, быть может, вскоре Ферелденом вновь будет править [Select_CString(ROOT.Char.IsFemale, 'уроженка', 'уроженец' )] Тевинтера, а не кто-либо из дикарей."
 DATAW_major_decision.0008.desc.d: "Увиденное повергает меня в изумление. Перед моим троном на коленях стоят дикари, называющие себя бресилианцами. Несмотря на упрямое стремление к изоляции и независимости, они признают во мне [Select_CString(ROOT.Char.IsFemale, 'истинную правительницу', 'истинного правителя' )] Леса Бресилиан. О Тевинтере они знают лишь по далёкой памяти, ведь последний контакт с ним произошёл века назад, но теперь я стою среди покорённого народа, как во времена его подчинения Империи.\n\nУсилия по преобразованию бресилианских дикарей на тевинтерский лад принесли прекрасный результат. Пленённые нашей культурой, они отказались от грубого и странного наречия и заговорили на чистом тевене. Более того, теперь они как никогда открыты тевинтерским обычаям, и я могу полностью рассчитывать на их поддержку в мечте о возвращении Ферелдена во славу Тевинтера."
 DATAW_major_decision.0008.opt.a: "Я из рода Нантериев — [Select_CString(ROOT.Char.IsFemale, 'укротительница', 'укротитель' )] диких земель."

 DATAW_major_decision.0009.tit: "Безопасный путь"
 DATAW_major_decision.0009.desc: "После издания моего указа в столицу начали поступать первые донесения от путешественников, пересёкших Бресилианский перевал. Многие торговцы сообщают, что добрались без происшествий, и называют титул [GetTitleByKey('c_gwaren').GetBaseNameNoTier] прекрасным, хотя и уединённым краем. Вскоре эти слова разнесутся дальше, и наша держава на краю Тедаса станет немного ближе к остальному миру, ведь лесные варвары больше нам не угрожают."
 DATAW_major_decision.0009.opt.a: "Пусть они исчезнут из истории и никогда не вернутся в людскую память."
 gwaren_integration_road_tooltip: "Графства в регионе «[GetGeographicalRegion('world_ferelden_brecilian_forest').GetName]» навсегда получают [Concept('modifier','модификатор')|E] «[GetModifier('gwaren_safe_passage_modifier').GetNameWithTooltip]»."
 gwaren_integration_resistance_tooltip: "Каждое графство в регионе «[GetGeographicalRegion('world_ferelden_brecilian_forest').GetName]», культура которого имеет #L [GetCulturePillar('heritage_elvhen').GetName]ое#! [Concept('heritage','наследие')|E] или является бресилианской, на 20 лет получает [Concept('modifier','модификатор')|E] «[GetModifier('brecilian_barbarian_resistance_modifier').GetNameWithTooltip]»"

 DATAW_major_decision.0006.tit: "Тэйрнир и его адмирал"
 DATAW_major_decision.0006.desc: "Ещё несколько десятилетий назад люди рассмеялись бы при мысли о создании тэйрнира в Пределе Бранделя — беззаконном краю налётчиков, контрабандистов и прочих мореходов сомнительной честности. Но теперь этот час настал. Благодаря моему правлению Пределом Бранделя острова перестали считаться одним лишь пристанищем контрабандистов и превратились в достойный, растущий торговый центр, соединяющий внутренние воды Недремлющего моря с далёкими северными землями. Теперь люди, занятые как законной, так и незаконной торговлей, всё чаще называют новый тэйрнир иначе — Адмиралтейством.\n\nЭто необычное название уже снискало уважение жителей, а потому будет справедливо сделать его официальным."
 DATAW_major_decision.0006.opt.a: "Адмирал Недремлющих островов. Звучит неплохо."

 DATAW_major_decision.0012.custom: "Все [Concept('counties','графства')|E] региона «[GetGeographicalRegion('world_ferelden_brecilian_forest').GetName]»"
 DATAW_elvhen_convert_or_hybridize_tt: "Вам предложат выбрать между модификатором смены культуры в графствах и [Concept('cultural_acceptance','терпимостью культур')|E]"
 DATAW_major_decision.0012.tit: "Новый дом, старые жители"
 DATAW_major_decision.0012.start.desc: "Мы закрепили за собой земли «[GetTitleByKey('k_brecilian_forest').GetBaseNameNoTier]». Более того, мы изгнали всех правителей-людей, некогда властвовавших над этой землёй, так напоминающей Арлатан. Теперь единственные хозяева этой земли — элвены."
 DATAW_major_decision.0012.brecilians.desc: "\n\n#!Но хотя только мы властвуем над этой землёй, населяем её не только мы. Многие люди жили здесь задолго до нашего прихода. Они называют себя «[GetCultureByKey('brecilian').GetName]», сторонятся чужаков и поклоняются духам, таким как их «Владычица Леса».\n\n#!Чтобы сделать Бресилианский лес настоящим домом для нашего народа, нам так или иначе придётся определить судьбу прежних жителей."
 DATAW_major_decision.0012.no_brecilians.desc: "\n\n#!Но хотя теперь только мы властвуем над этой землёй, прежде её населяли и другие. Здесь жило множество людей, чьи имена вскоре затеряются во времени.\n\n#!Чтобы сделать Бресилианский лес настоящим домом для нашего народа, нам следует организовать заселение края, как некогда были заселены Долы после завершения Долгого похода."
 DATAW_major_decision.0012.opt.a: "#italic [Glossary('Andaran atish’an, Falon','andaran_atishan_falon_GLOSS')]."
 DATAW_major_decision.0012.opt.b: "Мы сможем сосуществовать, если они увидят наше сходство."
 DATAW_major_decision.0012.b.custom: "Все [Concept('counties','графства')|E] с [Concept('modifier','модификатором')|E] «[GetModifier('brecilian_elvhen_culture_automatic_modifier').GetNameWithTooltip]»"
 andaran_atishan_falon_GLOSS: "«Войди сюда с миром, друг» — на эльфийском."
 DATAW_elvhen_co_existance_path_brecilian: "Это направит вас на путь сосуществования с бресилианцами"


 DATAW_major_decision.0013.tit: "Третья родина"
 DATAW_major_decision.0013.desc: "Поколение за поколением [Concept('elvhen','элвены')|E] росли на преданиях о Долгом походе — медленном и опасном пути через половину Тедаса, во время которого столь многие погибли, а столь многие вновь оказались в цепях Империума. Многие выросли на историях о стойкости и основании державы [GetTitleByKey('k_the_dales').GetBaseNameNoTier] — нашей Второй родины. \n\n#!Быть может, однажды о моих свершениях будут говорить с таким же почтением. Но сегодня мы празднуем. Мы трудились и сражались, чтобы обрести здесь своё место, невзирая ни на чьё сопротивление. На этой земле мы создали Третью родину."
 DATAW_major_decision.0013.opt.a: "Во славу наших трудов на этой земле!"
 DATAW_major_decision.0013.opt.b: "Быть может, нам стоит и дальше следовать примеру Долов."
 DATAW_major_decision.0013.opt.b.custom: "Все [Concept('counties','графства')|E] региона «[GetGeographicalRegion('world_ferelden_brecilian_forest').GetName]», в которых распространена культура с #L [GetCulturePillar('heritage_elvhen').GetName]им#! [Concept('heritage','наследием')|E], с вероятностью 25% сменят культуру вместе с вами"

