 DATAW_major_decision.0010.tit: "Слава империи"
 DATAW_major_decision.0010.desc: "Покорение Ферелденской долины завершено. После смерти Кордиллуса I Андерфелс и западные Вольные Марки вышли из состава империи. Многие говорили, что Орлей миновал вершину своего могущества и нам уже никогда не достичь прежнего величия. \n\nСегодня мы доказали, что они ошибались. Мы завладели родиной Андрасте, нашей дорогой пророчицы. Теперь каждый паломник может без опаски отправиться в Ферелден: порядок по всей стране охраняют имперские армии, обеспечивая безопасность, которой собачьи лорды никогда не могли добиться. \n\nСегодня Орлей с триумфом возвращается к предназначенной ему славе. Это первый шаг к тому, чтобы стать величайшей империей Тедаса — превзойти даже Тевинтерский Империум."
 DATAW_major_decision.0010.opt.a: "Да здравствует [andraste|E]! Да здравствует Орлей!"