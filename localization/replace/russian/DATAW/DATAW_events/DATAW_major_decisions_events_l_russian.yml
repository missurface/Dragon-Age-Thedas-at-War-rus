l_russian:
 DATAW_major_decision.0001.tit: "[GetTitleByKey('d_crescent_valley').GetBaseNameNoTier] Tamed"
 DATAW_major_decision.0001.desc: "It is done. After centuries of constant struggle, the Avvar have finally been subdued. Officials in the region report they have had many months of peace and plenty. No caravans have been torched and no merchants have been killed. [GetTitleByKey('d_crescent_valley').GetBaseNameNoTier] is quiet.\nNobles from Val Royeaux to Montsimmard can no longer chuckle behind our backs, for [GetTitleByKey('c_jader').GetBaseNameNoTier] is a city to be respected once again. House [ROOT.Char.GetHouse.GetName]'s role in this, my role in this, will never be forgotten by the people of our great city.\n\nBy our hand, it is done." #0 dev bias, anyone saying otherwise will be publicly executed - Typical
 DATAW_major_decision.0001.opt.a: "The dream of generations, fulfilled"

 DATAW_major_decision.0002.tit: "Bannorn United"
 DATAW_major_decision.0002.desc: "Since the time of our Alamarri ancestors the land of [GetTitleByKey('k_bannorn').GetBaseNameNoTier] was ruled by hundreds if not thousands of petty lords styling themselves as Bann, none having enough power to stand against the other. That was a state until now.\n\nI [ROOT.Char.GetName], am the first person since the times immemorial to unite the ever disunited land of [GetTitleByKey('k_bannorn').GetBaseNameNoTier], for this achievement I'm now proclaimed as [ROOT.Char.GetNickname]"
 DATAW_major_decision.0002.opt.a: "From many, One"

 DATAW_major_decision.0003.tit: "Claynes United"
 DATAW_major_decision.0003.desc: "For centuries, the [GetGlobalVariable('clayne_culture_var').Culture.GetName] tribes were divided and squabbling among themselves. The only time we stood united was under [maferath.GetShortUIName] [maferath.GetNickname], and the [GetGlobalVariable('clayne_culture_var').Culture.GetName] have fought to unite themselves ever since, under a more legitimate rule.\n\nThe time has come.\n\nWith the Founding of [GetTitleByKey('e_ferelden').GetBaseNameNoTier], the [GetGlobalVariable('clayne_culture_var').Culture.GetName] are now finally under one Crown, one Throne, one Kingdom. This unification has shown to be more than anyone could have predicted, transcending the political field.\n\nMultiple tribes that previously squabbled and fought now celebrate their unification in unison as they prepare for any and all foreign threats. With such a union achieved by the tribes, we are seeing a blend of different customs that are quickly forming a new culture entirely, one that showcases this new Kingdom in all its glory.\nNo longer are we [GetGlobalVariable('clayne_culture_var').Culture.GetName]s, now we are [GetGlobalVariable('fereldan_culture_var').Culture.GetName]."
 DATAW_major_decision.0003.opt.a: "To a new kingdom, and a new, unified people at last! For Ferelden!"

 DATAW_major_decision.0004.tit: "New Capital"
 DATAW_major_decision.0004.desc: "The people look to me now as their sovereign, and most of the valley is under my sway. What is a monarch, however, without a suitable capital from which to rule? Where shall my vassals travel to pay me homage, and petitioners come to seek my counsel? Fortunately, there are several viable options that come to mind..."
 DATAW_major_decision.0004.opt.a: "[GetTitleByKey('c_denerim').GetBaseNameNoTier], the Birthplace of [andraste.GetName], would make the perfect capital."
 DATAW_major_decision.0004.opt.b: "[GetTitleByKey('c_highever').GetBaseNameNoTier], a perfect meeting ground between Ferelden and the Free Marches."
 DATAW_major_decision.0004.opt.c: "[GetTitleByKey('c_amaranthine').GetBaseNameNoTier], a prime location to build a Jewel of the Coastlands for a capital."
 DATAW_major_decision.0004.opt.d: "[GetTitleByKey('c_caer_oswin').GetBaseNameNoTier] is the beating heart of the Heartlands, and could become that of Ferelden."
 DATAW_major_decision.0004.opt.e: "[GetTitleByKey('c_gwaren').GetBaseNameNoTier], the City that Prospers Alone, would represent our independent spirit."
 DATAW_major_decision.0004.opt.f: "[GetTitleByKey('c_redcliffe').GetBaseNameNoTier], the trade capital of Ferelden should also be our political capital."
 DATAW_major_decision.0004.opt.g: "[GetTitleByKey('c_portsmouth').GetBaseNameNoTier] could easily become a major trade center and bolster our influence abroad."
 DATAW_major_decision.0004.opt.h: "[GetTitleByKey('c_ostagar').GetBaseNameNoTier], a capital representing our resilience, showcased through time."
 DATAW_major_decision.0004.opt.i: "[GetTitleByKey('c_lothering').GetBaseNameNoTier], situated at the crossroads of the Imperial Highway could meet the needs of all."
 DATAW_major_decision.0004.opt.j: "[GetTitleByKey('c_edgehall').GetBaseNameNoTier], a western bastion to protect our people."
 DATAW_major_decision.0004.opt.k: "[GetTitleByKey('c_thralkeld').GetBaseNameNoTier], a comprimise candidate for the competing factions of our people."





 DATAW_major_decision.0005.tit: "A nation born."
 DATAW_major_decision.0005.desc: "I have done it.\n\nAs I see the sacrifices pool blood upon the soil of our sacred land, my loyal subjects standing in front of me, and a beautiful throne crafted in Ironbark, I understand what I have done.\nThe Brecilian People, brought together only by beliefs and customs, are now united under one leader. One Myghtern. By attempting to protect the people from the Claynes of Gwaren and Denerim, by attempting to protect ourselves from the people with ears as sharp as knives, I have given the Brecilian people a voice to follow. An herald of the Spirits.\n\nAs the crown of bones rests upon my head, I finally understand.\n\nI am the Voice of the Lady.\n\nI am the Myghtern of the Brecilians.\n\nAbove all."
 DATAW_major_decision.0005.opt.a: "I am the Spirit-[ROOT.Char.Custom('GetQueenKing')|l|U]."
 DATAW_major_decision.0005.opt.b: "I am the Spirit's Wrath."
 DATAW_major_decision.0005.opt.c: "I am the Spirit's Will."
 DATAW_major_decision.00051.tit: "The people's direction"
 DATAW_major_decision.00051.desc: "Now that the brecilian people are united under a myghtern, my vassals now look to me for guidance, for it is the first time our people has ever been united in such a way.\nOf course, my people desire for a greater fortification of the forest, to stand against the outsiders that desire our home.\n\nBut, one of my courtiers, a [brucilian_scholar.GetWomanMan] named [brucilian_scholar.GetNameNoTooltip], as approached me, and called for a different approach.\n\n"Our people are isolated", [brucilian_scholar.GetSheHe] says, "We are strong, yes, but we are alone, and each passing year, an invention is made that does not come to us, leaving us further lagging behind."\n\n"I understand our people demand to be left alone, but such an attitude would sign our death in the long run. If we desire our people to survive, and avoid the fate the people with ears as sharp as knives endured before us, we need to open ourselves to the world.""
 DATAW_major_decision.00051.opt.a: "We shall follow the way my people ask."
 DATAW_major_decision.00051.opt.b: "You are right, we need to bring our people out of isolation."
 DATAW_fortifying_for_the_coming_storm: "Fortifying the [GetGeographicalRegion('f_region_brecilian_forest').GetName]"
 DATAW_opening_the_forest: "Opening the [GetGeographicalRegion('f_region_brecilian_forest').GetName]"
 DATAW_major_decision.00052.tit: "The Maker of the Forest"
 DATAW_major_decision.00052.desc: "As I was taking a stroll through my capital, I could see my people going around, trading various goods with one another, united under one banner, one Myghtern. Sometimes, I could see a stranger being met, at first with suspicion, but then cordially, allowing him or her to trade and talk with relative safety. It would take a while for the Brecilians to not see outsiders as invaders, especially because of their zeal for their “Maker”, but it was a start, at least.\n\nAs I wandered further, I noticed a group of people in a plaza, chanting words of faith as they converged on one woman. As she continued her speech and prayers, to the joy of her crowd and the disgust of others looking from further, I slowly understood what she was saying, and what I heard bewildered me. She wasn't praying to the Spirits, as we had been taught for centuries, but she wasn't praying to their “Maker” either.\n\nRather, she was praying to both as one.\n\nAs she noticed me, she rapidly went down her podium to come to me, followed by her flock. Excited beyond what I thought possible, she explained:\n“Greetings, my Myghtern! I am Mother [brucilian_chantry_priestess.GetNameNoTooltip], and I am one of your greatest admirers! When you declared the Brecilian Forest open to outsiders, I was delighted! I went to explore, learn more of that strange religion they practiced, and I discovered something. Our worshiping of the Spirits and their worship of the Maker are compatible! The Spirits aren't creators on their own, they were sent by the Maker to create the world! The Lady of the Forest, The Weaver of Thoughts, all agents of the Maker!”\n\nNoticing my complete surprise, she followed:\n“I know not all Brecilians accept this new idea as well as those who listened to me. I will only ask of one thing, oh Myghtern who inspired me in this endeavour. Will you join us in our prayers?”"
 DATAW_major_decision.00052.opt.a: "I will join you in your faith, Mother!"
 DATAW_major_decision.00052.opt.b: "Though I will not follow your example, I will leave you be."
 DATAW_major_decision.00052.opt.c: "Our goal was survival, not assimilation! Arrest those fools!"
 DATAW_major_decision.00053.tit: "The Forest and its maker"
 DATAW_major_decision.00053.desc: "My druid comes to me in panic. As [court_chaplain.GetSheHe] starts blubbering incontrolably, I ask [court_chaplain.GetFirstNameNoTooltip] to calm down and explain what is so troubling.\n\n"
 DATAW_major_decision.00053.desc.a: "“It's the people, my [ROOT.Char.GetTitleTierName]. The open fraternization of the Myghtern with the outsiders has given rise to a most dangerous movement! They call themselves “the Brecilian Chantry” and claim that the Spirits are not beings that created this world on their own, but simply agents of their god, for whom they created on command!”\n\n“That strange faith has already spread significantly among our people, and it must be contained and destroyed!”"
 DATAW_major_decision.00053.desc.b: "“It's the [myghtern.GetTitleTierName], my [ROOT.Char.GetTitleTierName]. [myghtern.GetSheHe|U] has converted to a most dangerous movement! They call themselves “the Brecilian Chantry” and claim that the Spirits are not beings that created this world on their own, but simply agents of their god, for whom they created on command!”\n\n“That strange faith has already spread significantly among our people, and it must be contained and destroyed!”"
 DATAW_major_decision.00053.opt.a: "I could do better on the Ironbark throne, surely."
 DATAW_major_decision.00053.opt.b: "By converting, we shall adapt to our times, and survive in a different form."
 DATAW_major_decision.00053.opt.c: "I will not compromise my beliefs by pure pragmatism!"

 DATAW_major_decision.0008.tit: "The Southern Despot"
 DATAW_major_decision.0008.desc.a: "I stand here, baffled by what I see before me. In front of my throne, I see the savages, those that call themselves Brecilians, kneeling in front of me. Despite their stubborn desire for isolation and independence, they recognize me as the true ruler of the Brecilian Forest. Despite their only knowledge of Tevinter being a distant memory, the last contact being centuries old, I stand now among their people, subjugated, like they once were under the Imperium.\n\nHowever, my attempts to break and mold the spirit-worshippers have resulted naught, and only increased their anger towards tevene rule. There is no doubt that the Brecilians will be unruly under the Despotate. No matter, I rule the Forest, and perhaps soon, Ferelden shall once again be ruled by one of Tevinter."
 DATAW_major_decision.0008.desc.b: "I stand here, baffled by what I see before me. In front of my throne, I see the savages, those that call themselves Brecilians, kneeling in front of me. Despite their stubborn desire for isolation and independence, they recognize me as the true ruler of the Brecilian Forest. Despite their only knowledge of Tevinter being a distant memory, the last contact being centuries old, I stand now among their people, subjugated, like they once were under the Imperium.\n\nHowever, my attempts to break and mold the spirit-worshippers have resulted in few concrete advances, other than the fact we are now seen as less despicable than other outsiders. No matter, I rule the Forest, and perhaps soon, Ferelden shall once again be ruled by one of Tevinter."
 DATAW_major_decision.0008.desc.c: "I stand here, baffled by what I see before me. In front of my throne, I see the savages, those that call themselves Brecilians, kneeling in front of me. Despite their stubborn desire for isolation and independence, they recognize me as the true ruler of the Brecilian Forest. Despite their only knowledge of Tevinter being a distant memory, the last contact being centuries old, I stand now among their people, subjugated, like they once were under the Imperium.\n\n And it seems my efforts to mold the Brecilians in Tevinter's image have bore fruit slightly, and the savages now see us more as one would see a stranger normally, rather than the way they saw us beforehand, filled with hatred. I have even seen them adopt a few of our customs, and seem somewhat interested to learn more. Now, with the Brecilians savages subjugated, I rule the Brecilian Forest, and perhaps soon, Ferelden shall once again be ruled by one of Tevinter, rather than savages."
 DATAW_major_decision.0008.desc.d: "I stand here, baffled by what I see before me. In front of my throne, I see the savages, those that call themselves Brecilians, kneeling in front of me. Despite their stubborn desire for isolation and independence, they recognize me as the true ruler of the Brecilian Forest. Despite their only knowledge of Tevinter being a distant memory, the last contact being centuries old, I stand now among their people, subjugated, like they once were under the Imperium.\n\n And my efforts to mold the brecilian savages in Tevinter's image have resulted in something beautiful. The Brecilians, captivated by our culture, have forsaken their crude and strange language to speak good tevene. Furthermore, they are more opened than ever to Tevinter culture, and I can count fully on their support in, I hope, my dream of regaining Ferelden, for the glory of Tevinter."
 DATAW_major_decision.0008.opt.a: "I am a Nanterius, tamer of the wilds."

 DATAW_major_decision.0009.tit: "A Safe Passage"
 DATAW_major_decision.0009.desc: "In my capital, I have begun to receive the first reports from travelers through the Brecilian Passage ever since my declaration. Many traders have reported a safe journey without incident, and spoke of [GetTitleByKey('c_gwaren').GetBaseNameNoTier] as a lovely, if isolated place. Soon, those words will spread, and our realm on the edge of Thedas may find itself a little more connected, now that the barbarians of the forest no longer threaten us."
 DATAW_major_decision.0009.opt.a: "Let us hope they fade in history, never to be remembered."

 DATAW_major_decision.0006.tit: "A Teyrn and its Admiral."
 DATAW_major_decision.0006.desc: "A few decades ago, people would have laughed at the idea of a Teyrn established in Brandel's Reach, this lawless land rife with raiders, smugglers and other seafarers of dubious legality. However, this time has come. Through my work as Arl of Brandel's Reach, the islands have now surpassed their image of a smuggler's haven to become a respectable and growing trading hub, connecting the inner Waking Sea with faraway lands to the North. Now, the people, be they of a legitimate trade or not, have started to talk of the newfound Teyrn by a new name: The Admiralty.\n\nAlthough a strange title, it seems to be commanding respect among the populace, and so it is only fitting that I bring this popular name in the official title."
 DATAW_major_decision.0006.opt.a: "Admiral of the Waking Isles. Has a nice ring to it."

 DATAW_major_decision.0007.tit: "Unify the Marshes"
 DATAW_major_decision.0007.desc: "PLACEHOLDER"
 DATAW_major_decision.0007.opt.a: "Yes"

