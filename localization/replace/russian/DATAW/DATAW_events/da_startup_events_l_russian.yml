l_russian:
 paragraph_separator:0 "\n\n"
 startup.0001.t:0 "Хрупкая империя"
 startup.0001.d:0 "#italic Жил однажды король в [GetTitleByKey('e_orlais').GetBaseNameNoTier]\nСтар и слаб, с каждым годом дряхлее.\nЕго батюшка — дважды король,\nА от этого проку — ноль:\n[Concept('darkspawn','Порожденья тьмы')|E] всё наглее!\n— «Драконёнок», популярная среди орлесианских бардов песня\n\n#!Я знаю, что поют обо мне барды, как горожане смеются и злословят за моей спиной. Но на моём веку столько всего случилось и кануло в прошлое. Им не понять, каково это — видеть страдания своего народа, сколько бы сил ни прилагалось. Во время Второго Мора [Select_CString(ROOT.Char.IsFemale, 'я сделала', 'я сделал' )] всё, что было в моих силах, но этого не хватило, чтобы защитить Орлей и его народ. С того дня я несу с собой память о каждой из тех смертей.\n\nЯ всего лишь человек, и мне не чужды слабости. Но недостаток отцовской силы я возмещаю прожитыми годами. У меня ещё есть время оставить след, прежде чем дни мои подойдут к концу."
 startup.0001.a:0 "Сумеет ли император Драккон II искупить свои ошибки, пока ещё не поздно?"
 startup.0002.d:0 "#italic Увы, умчалась песня наших Топей,\nНе слышен больше скорбный крик гагар,\nНе шелестят высокие травы,\nМаня людей молиться у песчаных берегов.\n\nПо нашей же земле тяжёлой поступью идёт\nДракон в блестящей чешуе, чей рёв могуч.\n— «Песнь Топей»\n#!\nИмператор Орлея обвиняет меня в измене? [Select_CString(ROOT.Char.IsFemale, 'Я законная королева', 'Я законный король' )] Топей, моё имя уже стало легендой, а народ любит меня! И всё же я продолжаю пресмыкаться перед этим трупом на [GetGlobalVariable('orlesian_culture_var').Culture.GetName] троне. Тоже мне дракон! [kordillus_ii.GetFirstName] — беззубая кляча, чья власть держится лишь на том, что вызов ещё не брошен и принадлежащее мне не востребовано. \n\nНо мой час придёт. О да — однажды, когда настанет подходящий момент, я изгоню этого Дракона с наших земель и верну клад [Concept('gold','золота')|E], на котором он спит, — клад, собранный из нашей казны. Мир и свобода вновь вернутся в Топи. Нужно лишь дождаться мига для удара." 
 startup.0002.a:0 "Когда всё закончится, династию Маршетт запомнят навеки!"
 startup.0003.t:0 "Аэрона Яга, Матерь Ветров"
 startup.0003.d:0 "#italic Кровью призваны, землёй скованы. [spirits|E] диких земель.\n#!\nОднажды Аэрона из Диких земель наткнулась на умирающего оленя с двадцатью отростками на рогах. Трусливые охотники расставили ловушки и отсекли ему рога, оставив зверя истекать кровью.\n\nОна заплакала, и когда слёзы упали, олень заговорил.\n\n#italic «Разрежь моими сломанными рогами кожу у сердца, да смешается твоя кровь с моей. Если воля твоя сильна, она вновь призовёт меня в этот мир».\n\n#!Она пронзила грудь, и её кровь смешалась с жизненной силой оленя и впиталась в землю. Олень восстал, а сама Аэрона исцелилась и вновь обрела целостность.\n\n#italic «Возьми мою кровь, добавь свою — и придут другие. Стражи и защитники. Но запомни: не связывай никого против воли, иначе защита обратится тиранией»."
 startup.0003.a:0 "Сумеет ли Аэрона защитить [GetTitleByKey('k_korcari_wilds').GetBaseNameNoTier]?"
 startup.0004.t:0 "Фенарел Суледин, Бледный Демон"
 startup.0004.d:0 "В [GetTitleByKey('k_the_dales').GetBaseNameNoTier] нашли одинокого выжившего. Он бесцельно брёл по землям; пальцы его были искривлены и покрыты шрамами, а кожа изуродована словно страшным холодом. Перед смертью он умолял нас не идти дальше и в бреду твердил о бледном [Concept('demon','демоне')|E], несущем холод и смерть.\nСреди его бессвязных речей вновь и вновь повторялись одни и те же строки.\n\n#italic «Я — ворон, ведомый полям сражений\nЯ — ветер, что плачет в ночи\nЯ — клинок, жаждущий крови\nЯ — лёд, навеки застывший\nЯ — голос; кто, кроме меня,\nСлышен в буре»\n#!\nЯ — ярость каждой утраты"
 startup.0004.a:0 "Кто же я?"
 startup.0005.t:0 "Ульстор Волчья Рука, Волк Нагорий"
 startup.0005.d:0 "#italic «Слушайте ныне о первых днях и рожденье\n#italic Бесстрашного Ульстора, буйного и дерзкого.\n#italic Бурей гонимого в битве, чью мудрость затмила кровавая ярость.\n#italic Юного, неопытного, лишь вступившего во власть,\n#italic Сердцем горячего в дружбе, но гордого и переменчивого,\n#italic Поведшего свой народ на зов волка, в дорогу,\n#italic Заслышав зов опасности, стучащийся в кровь.\n#italic К [GetTitleByKey('b_edgehall').GetBaseNameNoTier], гномьей работы, прочному,\n#italic Горами объятому — новой твердыне вождя».\n#italic — «Сага о Волчьей Руке»"
 startup.0005.a:0 "Сумеет ли Ульстор оставить наследника и вернуть земли вокруг озера Каленхад?"
 startup.0006.t:0 "Безжалостный путь вперёд"
 startup.0006.d:0 "Меч Велькорминта с тихим шорохом скользнул в ножны; тонкий звук повис в неподвижном воздухе, словно звон колокольчика. Он посмотрел на безжизненные тела, хладнокровно оценивая содеянное. \n#italic Быстрая, чистая смерть — он об этом позаботился.\n#! Куда лучше той участи, что выпадала большинству людей, и уж точно лучше пыток, которым их подвергли бы враги. Сегодня он не только ловко расстроил планы противников, но и оказал своей семье большую услугу. \n\n#italic Он был доволен.\n\n#! Направляясь к двери, Велькорминт встретился взглядом с одним из советников, стоявших на страже. Хотя взгляд задержался на мгновение дольше положенного, он не заметил испарины на лбу молодого человека. Когда Велькорминт переступил порог и звук его шагов начал стихать, советник мешком рухнул на пол и шумно выдохнул с облегчением."
 startup.0006.a:0 "Сумеет ли Велькорминт завоевать эти земли во имя богов народа [GetGlobalVariable('chasind_culture_var').Culture.GetName]?"
 startup.0007.t:0 "Возвращая прошлое"
 startup.0007.d:0 "Стоило мне пройти через [eluvian|E] и очнуться в лесу, как всё стало ясно. Деревья заговорили со мной — не в видениях, а наяву. Повсюду у них вырастали руки, ноги и рты: ничего подобного прежде видеть не доводилось. Одно из деревьев протянуло ко мне сучковатые пальцы-ветви и прогрохотало:\n\n#italic «А-а, да — твой народ мне знаком:\nОн руины оставил здесь давным-давно».\n\n#!Дерево, которое не только говорит, но ещё и рифмами? Как любопытно! И где-то в этих лесах скрываются руины моего народа? Мне непременно хотелось увидеть их собственными глазами.\n\n#italic «Коль со мною искать ты пойдёшь, своё прошлое здесь обретёшь».\n\n#!Старое сучковатое создание повело меня по тропе сквозь завесу тумана, трепетавшую от древней [Concept('dataw_magic','магии')|E]. Когда мы оказались по ту сторону, увиденное показалось почти невероятным. Глубоко в сердце леса возвышался храм, а его характерный шпиль — символ Тевинтера — устремлялся к небу. \n\n Тогда всё стало ясно: именно сюда, в этот зачарованный лес, привела меня Судьба."
 startup.0007.a:0 "Сумеет ли Нантерий покорить [GetTitleByKey('e_ferelden').GetBaseNameNoTier] во имя своей родины — Тевинтера?"
 startup.0008.t:0 "Рождение короля"
 startup.0008.d:0 "Я держу меч своего деда — первого в этих землях, кто стал тэйрном. Закрываю глаза и касаюсь клинком каждого плеча, ибо больше некому возложить на меня власть. \n\n#italic Благословенны те, кто пред порочными \nИ нечестивыми стоит, не отступая. \nБлагословенны миротворцы, поборники справедливости. \n\n#!Когда я вновь открываю глаза, [Select_CString(ROOT.Char.IsFemale, 'я уже королева', 'я уже король' )]. \n\nНарод не принимает мою власть, потому что не может постичь размаха моих устремлений. Люди видели лишь силу моих предков, но ещё не мою. Мне предстоит показать им, что сила рода Данесен живёт во мне. Что у меня есть не только сила, но и замысел, способный объединить эти земли под одним знаменем. [Select_CString(ROOT.Char.IsFemale, 'Я готова', 'Я готов' )]: и разум, и клинок отточены для грядущего дела. А когда победа будет одержана, люди станут рассказывать уже не о моих родичах, а о моём триумфе."
 startup.0008.a:0 "Сумеет ли Кэдмон пойти по стопам деда и стать королём [GetTitleByKey('e_ferelden').GetBaseNameNoTier]?"
 startup.0009.t:0 "Новый подход"
 startup.0009.d:0 "Гассандриэль упёрся руками в стол с разложенными картами и сделал размеренный вдох. Его мысли обратились к Гиланнайн, Охотнице Народа и первой из галл, матери всех величественных белых оленей, что пришли после неё. Он всегда черпал вдохновение в её сострадании и силе: они научили его вести свой народ мягкой рукой, предлагая людям следовать за собой. \n\n#italic «Галлы — наши братья и сёстры. Нельзя заставить галлу сделать что-либо против её воли».\n\n#!Многие годы он правил именно так, и в его землях царил мир. Но эти [GetGlobalVariable('orlesian_culture_var').Culture.GetName] не желали считаться с гордостью долийцев и вовсе не спрашивали разрешения. С каждым днём Гассандриэлю всё чаще докладывали о растущей напряжённости на границах. Теперь, обращаясь к Гиланнайн за наставлением, он видел лишь белый хвост, мелькавший вдали. Гассандриэль нахмурился и впился ногтями в столешницу. В её учении не осталось ничего, что могло бы помочь ему сейчас. Чтобы сохранить жизни своего народа, придётся прибегнуть к иным средствам."
 startup.0009.a:0 "Сумеет ли Гассандриэль защитить свой народ от орлесианской угрозы?"
 startup.0010.t:0 "Верный своему дому"
 startup.0010.d:0 "#italic Все знают старого мабари [andraste|E].\nВ Песни о нём ни слова.\nСпросите святых сестёр —\nСкажут: Андрасте не могла\nЗавести вонючего пса.\nНо весь [GetTitleByKey('e_ferelden').GetBaseNameNoTier] знает точно:\nНашей милой Владычице нужен был тот,\nКто ночью согреет ей ноги. \n  — «Мабари Андрасте», популярная ферелденская застольная песня \n\n#!Говорят, мабари вывели как боевых псов тевинтерские [Concept('mage','маги')|E]. Можешь поверить? Трудно представить что-нибудь более ферелденское, чем мабари, настолько преданные своим ферелденским хозяевам-псарям. Они так похожи, будто их одной сучьей сиськой вскормили. \n\nВарвары мы все — ха! Говорят даже, что однажды эрл Герин объявил войну человеку, оскорбившему одного из его боевых псов. \n\nДа ты совсем спятил. \n\nЧистая правда! Поглядел бы, как он их дрессирует, — и сомнений бы не осталось. Часами пропадает на своих землях, гоняет псов до седьмого пота — и молодых сыновей заодно, не сомневайся. \n\nХороший человек этот Герин. Своему дому он верен, как мабари — хозяину."
 startup.0010.a:0 "Сумеет ли эрл [GetTitleByKey('d_redcliffe').GetBaseNameNoTier] сделать всё необходимое, чтобы уберечь свою семью?"
 startup.0011.t:0 "Змея в траве"
 startup.0011.d:0 "#italic Змея в траве честна на вид,\nНе тронь её — и не навредит. \n\n#!«Всё сделано?» — спросил Кормак. \n«Не совсем», — ответила его жена. \n\n#italic Змея в траве безобидна вполне, \nПока не встревожишь её в тишине. \n\n#!«Как такое возможно? Наш человек ушёл две недели назад!» \n«Терпение, дорогой, — ласково произнесла она. — Не стоит волноваться». \n\n#italic Змея в траве лишь хочет лежать, \nНе вымани сам — не станет мешать. \n\n#!Он недовольно процедил сквозь зубы: «И то верно. Но если мы хотим одолеть этого пса, прежде чем он соберёт силы, надо действовать быстро». \n«Всему своё время», — улыбнулась она. \n\n#italic Змея в траве лишь притворно тиха, \nГотова ужалить — и смерть близка."
 startup.0011.a:0 "Сумеет ли Кормак воспользоваться случаем и нанести удар до того, как [caedmon.GetFirstName] завладеет всем [GetTitleByKey('e_ferelden').GetBaseNameNoTier]?"
 startup.0012.t:0 "За пределами границ"
 startup.0012.d:0 "#italic Если не бывали в [GetTitleByKey('b_gwaren').GetBaseNameNoTier], \nНе найти его следов. \nОн веками гордо высился, \nОкружённый скверным лесом. \nКоль нет лодки крепкой, вёсельной, \nНе найти его берегов. \n\nЕсли не бывали в Гварене, \nПриглядитесь — и найдёте \nСильных дровосеков с топорами \nИ за отмелью — рыбацкие сети. \nЧестный люд живёт дарами земли \nИ земле сторицей воздаёт. \n\nЕсли не бывали в Гварене, \nА лишь слышали преданья, \nЗа укреплениями спал он; \nТайны поколениями храня, \nНи один правитель не решился \nВыйти властью за его берега."
 startup.0012.a:0 "Сумеет ли Аларик расширить границы Гварена дальше прежнего?#!"
 startup.0013.t:0 "Война на два фронта"
 startup.0013.d:0 "Слухи о скорой войне между [GetTitleByKey('e_orlais').GetBaseNameNoTier] и [GetTitleByKey('k_the_dales').GetBaseNameNoTier] ходили повсюду, однако известие о том, что [roux.GetName] втайне копит силы против императора, стало настоящей неожиданностью. Выслушав донесение разведчика о всплывшем заговоре, Фредерик вспомнил детский стишок, которому его научил отец. Обманчиво простой, тот стал для него правилом, ни разу не подведшим: \n\n#italic Раз, два — первым ходи, \nТри, четыре — дверь запри. \n\n#!Он задумчиво потёр подбородок. Знал ли об этом [kordillus_ii.GetName]? Быть может, эти сведения удастся обратить себе на пользу — особенно если Кордилиус ещё не прознал, что жители Топей готовятся выступить против него. Фредерик на всякий случай дал разведчику монету и отпустил его, чтобы спокойно всё обдумать. \n\nРано или поздно император узнает о грядущем предательстве. Так или иначе, маркизу [GetTitleByKey('d_ghislain').GetBaseNameNoTier] придётся выбрать сторону — и поскорее."
 startup.0013.a:0 "Сумеет ли Фредерик благодаря таланту к интригам переиграть их всех?"
 startup.0014.t:0 "Призыв к миру"
 startup.0014.d:0 "#italic Сквозь пепел небес я чувствую солнца тепло. \nГде тот, кто сквозь ночь нас вперёд поведёт? \nНачалась война, что разделит нас всех. \nГрядут пламя и конец времён.\n — Из песни «Я продержусь», переведённой с эльфийского \n\n#!Я [Select_CString(ROOT.Char.IsFemale, 'надеялась', 'надеялся' )] уладить это небольшое дело миром. Когда я [Select_CString(ROOT.Char.IsFemale, 'прибыла', 'прибыл' )], страсти уже кипели. По словам моих людей, небольшая группа охотников преследовала в лесу лань и наткнулась на членов долийского клана с обнажёнными клинками и натянутыми луками. Как рассказывали [elves|E], мои люди в погоне за ланью вторглись на их земли, нарушив хрупкий мир, который нам удалось установить совсем недавно. \n\nГолоса становились всё громче, в суматохе с обеих сторон собирались новые люди, лишь раздувая пламя. Спор двух небольших охотничьих отрядов разросся до десяти или пятнадцати человек с каждой стороны. Даже если бы сам [kordillus_ii.GetName] потребовал от меня ответа, честью клянусь: невозможно было бы с уверенностью сказать, кто первым пролил кровь. Прискорбно — сегодня погибло куда больше людей, чем должно было. \n\nНапряжение продолжает нарастать. Прежде чем эта война пойдёт на спад, она станет ещё страшнее. Должны найтись слова, которые заставят их образумиться."
 startup.0014.a:0 "Сумеет ли маркиз словами уладить разрастающийся конфликт?"
 startup.0015.t:0 "Великая Игра"
 startup.0015.d:0 "#italic У императора — мечи и щиты, \nУ [Concept('chantry','Церкви')|E] — громкое имя, \nУ крестьян — земли, сады и поля, \nА у знати — Великая Игра. \n#!— Старинная поговорка народа [GetGlobalVariable('orlesian_culture_var').Culture.GetName] \n\nЯ хихикаю и приседаю перед герцогиней в реверансе, изобразив лучшую из своих улыбок. Какая мерзкая женщина. Я хвалю её туфли, несмотря на их кричащий цвет — #italic шартрез#! — и украшения, вышедшие из моды не меньше двух сезонов назад. Мыслить только! \n\nНо всё это неважно, если союз окажется подходящим для моей юной Джоселин. Недостаток вкуса герцогиня с лихвой возмещает золотом — а вдобавок ещё и военной мощью. Без сомнения, достойная партия для средней дочери, которая обеспечит ей прочное положение среди пэров. Пока герцогиня продолжает трещать без умолку, я молча терплю, угодливо улыбаясь из-за веера. \n\nВсё ради моих дорогих детей. Они даже не представляют, на какие жертвы я иду ради них."
 startup.0015.a:0 "Сумеет ли Фуазин обратить Великую Игру себе на пользу и заручиться поддержкой для своей семьи?"
 startup.0016.t:0 "Клинок истины"
 startup.0016.d:0 "Меч Эврама рассёк воздух и вонзился в бедро врага. Эврам вырвал клинок как раз вовремя, чтобы у бедра направить его прямиком в брюхо второму варвару, наступавшему сзади. Меч — тот самый, которым его учили владеть ещё мальчиком, — вышел из тела легко, словно нож из тёплого масла, и устремился к следующей цели. Всё это время Эврам монотонно напевал себе под нос, и низкий гул его голоса тонул в окружавшем шуме: \n\n#italic Пой мне, о меч моих юных годов, \nРукоять твоя — доблесть, клинок — правда слов. \nЛишь шепнёшь из ножен, к бою готов, \nИ беда меня больше не сыщет. \n\n#!Клинок вновь описал изящную дугу и подсек нового противника под колени. Слившись с мечом воедино, Эврам стал неуязвим. Пока звучала его песня, он не промахивался."
 startup.0016.a:0 "Сумеет ли Эврам воспользоваться каждым доступным ему оружием, чтобы его род продолжился?"
 startup.0017.t:0 "Молитвы без ответа"
 startup.0017.d:0 "Зажегши свечи на личном алтаре, маркиз Умбер преклонил колени. Он сложил руки у лба и тихо зашептал молитву. \n#italic О Создатель, взгляни: пред Тобой я на коленях, \nИбо иду лишь туда, куда Ты повелишь. \nСтою лишь там, что Тобою благословлено. \nПою лишь слова, что Ты вкладываешь в уста мои. \n\n#!Зажмурившись, он начал раскачиваться взад-вперёд. \n#italic Коснись меня пламенем, дабы очистить. \nСкажи, что песнь моя угодна Тебе. \n\n#!Капля пота скатилась с его виска. Он молился так истово, как только смел. Он не понимал: будучи одним из самых набожных и преданных, всё же нисколько не приблизился к заключению достойного брака. \n#italic Коснись меня пламенем, дабы очистить. \nСкажи, что песнь моя угодна Тебе. \n\n#!Что ещё ему оставалось? Он молился ещё усерднее и надеялся, что на сей раз [maker|E] его услышит."
 startup.0017.a:0 "Будут ли услышаны молитвы маркиза Умбера, или ему придётся прибегнуть к иным средствам?"
 startup.0101.t:0 "Гнев Дракона"
 startup.0101.d:0 "Война окружает нас. Мы — [GetGlobalVariable('orlesian_culture_var').Culture.GetName], и каждый наш враг прячет кинжал в рукаве. [nahashin_holder.GetName] уже делает первые ходы, намереваясь основать совершенно новое королевство. \n\nПока этот самозваный король тщательно обдумывает следующий шаг, живые реликты — эльфы из [GetTitleByKey('k_the_dales').GetBaseNameNoTier] — с каждым днём проявляют к нам всё большую враждебность. Их трудно усмирить, а гнев разгорается всё жарче, угрожая испепелить нас всех. \n\nПереживёт ли империя грядущие испытания? [maker|E], сохрани нас всех."
 startup.0101.a:0 "Мы — новые властители [Concept('thedas','Тедаса')|E]!"
 startup.0102.t:0 "Новый Арлатан"
 startup.0102.d:0 "Мы, эльфы, многое претерпели с тех пор, как на севере пал Арлатан. Некоторым из нас пришлось обойти полмира, чтобы обрести здесь настоящий дом для своих сородичей. С дней былой славы наш народ не знал ничего, кроме борьбы. Говорят, что мы превратились в тени самих себя и не способны оставить прошлое позади. \n\nНапряжённость в отношениях с [GetTitleByKey('e_orlais').GetBaseNameNoTier] растёт, и полномасштабная война кажется неизбежной. Моё сердце плачет о сородичах, но сделать можно немногое. Наш новый дом, [GetTitleByKey('k_the_dales').GetBaseNameNoTier], некогда дарил надежду на лучшее будущее. \n\nСтремясь улучшить собственную жизнь, мы решили не откликаться на зов тех, кто сражался с [Concept('darkspawn','порождениями тьмы')|E] во время Второго [Concept('blight','Мора')|E]. Быть может, за такое равнодушие мы заслужили грядущую участь. Не обернётся ли она новой трагедией, подобной падению Арлатана?"
 startup.0102.a:0 "Мы уже достаточно страдали. Теперь будем процветать."
 startup.0103.t:0 "Земля собак"
 startup.0103.d:0 "[GetTitleByKey('e_ferelden').GetBaseNameNoTier] — край прекрасных видов и разных народов, произошедших от предков-аламарри и создавших собственные, совершенно новые культуры. \nДважды [Concept('blight','Моры')|E] опустошали эту землю, а мы всё никак не перестанем убивать друг друга хотя бы на то время, за которое мог бы возвыситься истинный вождь и объединить страну. Но надежда ещё не потеряна: по [Concept('thedas','Тедасу')|E] ходят слухи, что вскоре из народа [GetGlobalVariable('clayne_culture_var').Culture.GetName] выйдет настоящий правитель и Ферелден наконец обретёт единство. \n\nПока неизвестно, сумеем ли мы прожить в мире достаточно долго, чтобы сравниться с соседями и заставить предков гордиться нами, но надежда остаётся."
 startup.0103.a:0 "Однажды клейнцы станут едины."
 startup.0104.t:0 "Владыки Морозных гор"
 startup.0104.d:0 "До [andraste|E] и культа [Concept('maker','Создателя')|E] мы, [GetGlobalVariable('avvar_culture_var').Culture.GetName], были не «варварами» и не «горцами», а одним из множества племён южного [Concept('thedas','Тедаса')|E]. Наши скальды воспевают честь, отвагу и силу, но отрезанность [GetTitleByKey('k_frostback_mountains').GetBaseNameNoTier] от остального мира не помогла разнести эти песни по землям. Короли и императоры сражаются за судьбу юга; [GetTitleByKey('k_the_dales').GetBaseNameNoTier] и [GetTitleByKey('e_ferelden').GetBaseNameNoTier] — лишь двое из множества врагов, ведущих войны вокруг наших владений. Победитель этих войн в низинах может счесть разобщённые племена лёгкой добычей — и, возможно, будет прав. \n\nНаши племена хранят множество обычаев, зародившихся ещё до [Concept('chantry','Церкви')|E]. Если война будет проиграна, эта преемственность оборвётся, а старых богов постигнет судьба тевинтерских. Но война в низинах ещё не окончена, и мы далеко не слабы. Быть может, теперь нашему народу, подобно нашим богам, суждено возродиться."
 startup.0104.a:0 "В конце концов воля Тирдды Яркий Топор продолжает жить в нас."
 startup.0105.t:0 "Народ Диких земель и туманов"
 startup.0105.d:0 "После того как [hafter.GetName], легендарный воин-аламарри и первый тэйрн Ферелдена, победил наших предков в Век Церкви и изгнал их в [GetTitleByKey('k_korcari_wilds').GetBaseNameNoTier], нам пришлось приспосабливаться к этой враждебной земле. Эти дикие топи и тихие леса способны поставить на колени даже сильнейшего воина — нам это известно слишком хорошо. Но, преодолев множество невзгод в этом суровом краю, мы постепенно начали процветать. \n\nПусть [GetTitleByKey('e_ferelden').GetBaseNameNoTier] забыл о нас и не обращает на нас внимания, но [GetGlobalVariable('clayne_culture_var').Culture.GetName] и [GetGlobalVariable('avvar_culture_var').Culture.GetName] скоро вспомнят, почему нас всё ещё следует бояться." 
 startup.0105.a:0 "Времена года укажут нам путь к славе."
 startup.0106.t:0 "Последователи угасающего уклада"
 startup.0106.d:0 "Эти древние леса взывают к нам, здешним обитателям, и велят защищать землю от чужаков. Те недостойны даров [Concept('spirits','духов')|E], ибо их невежество и алчность несут лишь боль и разрушение. \n\nНам уже довелось увидеть их честолюбие: желание вторгнуться в [GetTitleByKey('k_brecilian_forest').GetBaseNameNoTier] станет их погибелью. Когда они выступят в поход, [spirits|E] пробудятся в облике сильванов. С этими созданиями на нашей стороне не ведающий об опасности враг в полной мере познает ярость [Concept('spirits','духов')|E]. \n\nДаже неизбежная смерть не заставит нас дрогнуть: мы защитим свой дом и, если потребуется, с радостью погибнем за него. Но [thedas|E] меняется, и происходящее ужасает нас. Сумеем ли мы пережить грядущее?"
 startup.0106.a:0 "Лес — наш дом, и мы его не оставим."
 startup.0107.t:0 "Народ Кита"
 startup.0107.d:0 "Большой мир забыл о нас. \n\nДалеко, по другую сторону [GetGeographicalRegion('o_region_gamord_mountains').GetName], на краю, который часто забывают нанести на карты, наша маленькая империя развивалась самостоятельно. Великие дома покорились [kordillus_ii.GetName] скорее ради соблюдения формальностей, чем по необходимости. \n\nНо мы ничего не забываем. Мы никогда не забудем традиции, определяющие нашу сущность. Не забудем и того, что [GetGeographicalRegion('sea_sundered_sea').GetName] — наше море, а не то, по которому ходит и законам которого покоряется большая часть [Concept('thedas','Тедаса')|E]. \n\nМы — отдельный мир. Мы живём на краю цивилизации, но однажды она станет нам завидовать."
 startup.0107.a:0 "Малая империя Гаморда наконец докажет, чего стоит."
startup.0108.t:0 "Память о цветущей земле"
startup.0108.d:0 "Когда-то [GetTitleByKey('k_western_approach').GetBaseNameNoTier] был прекрасен. Когда-то этот край утопал в пышной зелени, напоминая рай, а нашей почве завидовал весь [thedas|E]. \n\nНо начался [blight|E], и из Глубинной щели хлынули бесконечные орды [Concept('darkspawn','порождений тьмы')|E], умертвившие землю и превратившие её в бесплодное смешение камня и песка. Нам пришлось трудиться как никогда прежде, разрабатывать недра и искать давно утраченные реликвии погибшего рая. \n\nТеперь мы приспособились к новой земле, на которой живём. И хотя мы никогда не забудем, что Западный предел когда-то был зелёным и цветущим, всё же продолжаем двигаться вперёд."
startup.0108.a:0 "Пусть наша земля мертва, но мы будем процветать."
startup.0109.t:0 "Странники холода и засухи"
startup.0109.d:0 "Мы, [GetGlobalVariable('cendrerin_culture_var').Culture.GetName], прошли долгий путь с тех пор, как нас изгнали из [GetTitleByKey('k_gamord').GetBaseNameNoTier]. Мы дрались не на жизнь, а на смерть, но всё же проиграли, и [GetGlobalVariable('nevenais_culture_var').Culture.GetName] отправили нас в сухое и безжизненное Море Пепла. Они привели нас туда и с убеждённостью, свойственной лишь самым рьяным фанатикам, стали ждать нашей гибели. \n\nНо мы доказали, что они ошибались. В Море Пепла, которое они считали безжизненным, мы нашли жизнь, пропитание и убежище. Здесь мы научились принимать каждого, кто мог помочь, — какой бы ни была эта помощь, — и давать приют изгнанникам, которых они приводили в эти земли. \n\nЗа полученные дары мы можем следовать за [Concept('maker','Создателем')|E] или чтить саму землю, но в этом ужасном изгнании обрели нечто прекрасное — нашу культуру. Благодаря врагам мы свободны от оков того, что они называют домом."
startup.0109.a:0 "Теперь мы странствуем свободно. Благословенны за это Пепел и [maker|E]."
startup.0110.t:0 "Южные почитатели коня"
startup.0110.d:0 "Среди равнин [GetTitleByKey('k_deauvin').GetBaseNameNoTier], к югу от [GetTitleByKey('c_montsimmard').GetBaseNameNoTier], лежит наша родина. Веками мы скакали здесь на конях, сражаясь среди грома копыт то стрелами, то мечами. Нашими врагами были и [GetGlobalVariable('orlesian_culture_var').Culture.GetName], и [GetGlobalVariable('borsol_culture_var').Culture.GetName]. Лишь дому Симмарду удавалось объединить нас под одной короной, пока [kordillus_ii.GetName] не подчинил её своей власти. \n\nПосле нападения на Монтсиммар во время Второго [Concept('blight','Мора')|E] мы лишились дома, способного править нами без сопротивления под взором [Concept('maker','Создателя')|E] и его солнца. Быть может, однажды всё изменится, но пока мы помним. И прежде всего — скачем и натягиваем тетиву."
startup.0110.a:0 "Пусть наши стрелы — стрелы величайших воинов [GetTitleByKey('e_orlais').GetBaseNameNoTier] — всегда бьют точно."
startup.0111.t:0 "Владыки полей"
startup.0111.d:0 "Многие изумляются при виде огромных плантаций нашей земли. Прекрасный, прекрасный [GetTitleByKey('k_ghislain').GetBaseNameNoTier], чьи поля кормят всю империю. Здесь Великая Игра ведётся иначе. В неё играют на балах в величественных поместьях, господствующих над полями втрое больше [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier], — и ставкой становятся всё новые угодья. \n\nПусть в горах вокруг наших равнин нет золота, зато им полна сама почва. Это золото не только приносит богатство, но и позволяет крепко держать [GetTitleByKey('e_orlais').GetBaseNameNoTier] за горло. Вал Руайо может править империей, но живёт она благодаря Жислену."
startup.0111.a:0 "Однажды те, кто в действительности направляет Орлей, станут править им по-настоящему."
startup.0112.t:0 "Гордая глушь"
startup.0112.d:0 "Многие надушенные вельможи из [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier], [GetTitleByKey('k_ghislain').GetBaseNameNoTier] и других мест с нескрываемым презрением смотрят на народ марешуа из [GetTitleByKey('e_nahashin').GetBaseNameNoTier]. В их глазах мы — дикари из прошлого тысячелетия, живущие среди диких топей и едва ушедшие от древнего уклада народа [GetGlobalVariable('ciriane_culture_var').Culture.GetName]. По их мнению, во всех землях народа [GetGlobalVariable('mareschois_culture_var').Culture.GetName] хоть чего-то стоят только [GetTitleByKey('d_alyons').GetBaseNameNoTier] и [GetTitleByKey('d_serault').GetBaseNameNoTier]: их жители сумели подняться над положением, которое уподобляют народу [GetGlobalVariable('chasind_culture_var').Culture.GetName], и стать хоть наполовину достойными уважения. \n\nПусть так и думают. Недооценить противника — первая ошибка, которую можно совершить в Великой Игре, а вся империя не видит в нас угрозы. Но среди топей мы проложили собственный путь. Мы сохранили верность обычаям и приспособились к земле, которую называем домом. Однажды мы докажем, что все они ошибались, и сбросим оковы их высокомерной власти."
startup.0112.a:0 "Нахашин станет свободным, и весь [thedas|E] будет ему завидовать!"
startup.0113.t:0 "Потомки Исората"
startup.0113.d:0 "Между [GetTitleByKey('e_orlais').GetBaseNameNoTier] и [GetTitleByKey('e_ferelden').GetBaseNameNoTier], двумя великими державами, где господствует [GetReligionByKey('andrastianism_religion').GetName], лежит небольшой край, зажатый между [GetTitleByKey('d_crescent_valley').GetBaseNameNoTier], [GetTitleByKey('d_jader').GetBaseNameNoTier] и [GetTitleByKey('d_salmont').GetBaseNameNoTier]. Наш дом. Когда Исорат правил Орлеем, местные аламарри всё сильнее проникались влиянием западного соседа. После объединения, совершённого Кордилиусом, Джейдер стал полноправной провинцией империи, а мы, [GetGlobalVariable('jaderian_culture_var').Culture.GetName], гордимся своей самобытностью и всегда готовы защищать дорогую землю от захватчиков. \n\nМы знаем, что именно наш любимый Джейдер — истинное место рождения [andraste|E], что бы ни утверждали глупцы из [GetTitleByKey('d_denerim').GetBaseNameNoTier]. Пусть [chantry|E] отказалась занять сторону в этом споре, но мы докажем всему [Concept('thedas','Тедасу')|E], что правда за нами."
startup.0113.a:0 "Пусть наши дарования докажут, что мы достойны жить на этом священном перекрёстке."
startup.0114.t:0 "Рыцари нагорий"
startup.0114.d:0 "Жизнь в нагорьях [GetTitleByKey('k_perendale').GetBaseNameNoTier] и [GetTitleByKey('k_blasted_hills').GetBaseNameNoTier] порой кажется странной народу [GetGlobalVariable('orlesian_culture_var').Culture.GetName] из [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier]. Здесь Великая Игра обычно ведётся не на танцполе и не за изысканным ужином, а на поле боя. Каждый ход рассчитывается так, чтобы быть как можно изящнее и дерзновеннее.\n\nТак мы живём со времён Первого [Concept('blight','Мора')|E] и распада империи [maferath.GetName]. Чтобы сохранить свой уклад, нам приходится сражаться с жителями Вольной Марки, тевинтерцами, [Concept('darkspawn','порождениями тьмы')|E] и многими другими."
startup.0114.a:0 "Теперь мы вассалы империи, но наши клинки по-прежнему разят без промаха."
