l_russian:
paragraph_separator:0 "\n\n"
startup.0001.t:0 "A Fragile Empire"
startup.0001.d:0 "#italic There once was a king in [GetTitleByKey('e_orlais').GetBaseNameNoTier]\nHe was old and feeble, so they say\nTwice the King was his father\nSo why even bother?\nThis one can't keep the [darkspawn|E] at bay!\n- 'The Dragonling,' a popular tune among bards in Orlais\n\n#!I know what the bards sing about me, that the townsfolk laugh and sneer behind my back. But so much has come and gone in my time. They know not what it is, to watch your people suffer, no matter your efforts. I did all I could during the Second Blight, yet it was not enough to protect Orlais and her people. Each day since they happened, I have carried those deaths with me.\n\nI am but a man like any other, and I have my failings. But what I lack in my father's strength, I make up for in years. There is yet time for me to leave a mark before my days come to an end."
startup.0001.a:0 "Will Emperor Drakon II redeem himself while he still has the chance?"
startup.0002.d:0 "#italic Alas, our Marsh’s song has flown away\nHer haunting call of loons we hear no more\nThat rustling of tall grasses sure to send\nA man to worship her on sandy shore\n\nFor o’er our soil and through our lands doth tread\nThe Dragon, shining scales and mighty roar\n- Song of the Marshes\n#!\nThe Emperor of Orlais proclaims treason? I am the rightful King in the Marshes, legend in my own right, beloved by my people! Yet I continue to kowtow to that corpse sitting on the [GetGlobalVariable('orlesian_culture_var').Culture.GetName] throne. Some dragon—ha! [kordillus_ii.GetFirstName] is nothing but a toothless mare, only maintaining his grip because I have yet to challenge him to what is mine. \n\nBut my time will come. Oh, yes—one day, when the moment is right, I will drive that Dragon from our lands and reclaim the hoard of [gold|E] on which it sleeps, a hoard built from our own coffers. Peace and freedom will be restored to the Marshes once more. I need only wait until the right moment to strike." 
startup.0002.a:0 "Once I am finished, the Marchette dynasty will be remembered forever!"
startup.0003.t:0 "Aerona Iaga, Mother of the Winds"
startup.0003.d:0 "#italic Blood called and earth bound. [spirits|E] of the wilds.\n#!\nAerona of the Wilds one day came across a twenty tined stag, dying. Hunters had set cowardly traps and hewed its antlers, leaving it broken and bleeding.\n\nShe wept, and as her tears fell, the stag spoke.\n\n#italic “Draw your heart's blood with my broken antlers to mingle with my own. If your will is strong enough it will call me forth again.”\n\n#!So she pierced her breast, her blood mingling with the stag's life, soaking into the earth. And it rose again, and she too was healed and whole.\n\n#italic “Take my blood, draw from your own and others will come. Guardians, and protectors. Heed my words, do not bind any unwilling, or protection will turn to tyranny.”"
startup.0003.a:0 "Will Aerona succeed in protecting the [GetTitleByKey('k_korcari_wilds').GetBaseNameNoTier]?"
startup.0004.t:0 "Fenarel Suledin, the Pale Demon"
startup.0004.d:0 "A lone survivor was found, wandering [GetTitleByKey('k_the_dales').GetBaseNameNoTier]. His fingers twisted and scarred, his skin marred as if by great cold. Before he died he begged us not to venture further, raving of a pale [demon|E], who brought cold and death.\nAmongst his ravings, he repeated this poem, over and over.\n\n#italic "I am the crow: of battlefield known\nI am the wind: that cries at night\nI am the blade: that thirsts for blood\nI am the ice: frozen fast\nI am the voice, who but I\nIs heard in the storm"\n#!\nI am the rage: of every loss"
startup.0004.a:0 "Who am I?"
startup.0005.t:0 "Ulstor Wolfhand, the Wolf of the Highlands"
startup.0005.d:0 "#italic "Hear now the start, the dawn and begetting\n#italic Of fearless Ulstor, rough natured and reckless.\n#italic Storm tossed in battle, blood fury dimmed wisdom.\n#italic young and untried, new come to his ruling,\n#italic warm hearted in friendship but fickle with pride\n#italic Takes forth his people, wolf called and seeking\n#italic The call of danger, a thrum in his blood.\n#italic To [GetTitleByKey('b_edgehall').GetBaseNameNoTier], dwarf crafted and sturdy,\n#italic encircled by mountain, new fastness for chieftain."\n#italic - The Saga of Wolfhand"
startup.0005.a:0 "Will Ulstor live to sire an heir and take back the lands around Lake Calenhad?"
startup.0006.t:0 "A Ruthless Path Forward"
startup.0006.d:0 "Velcorminth’s sword whispered back into its sheath, the thin sound hanging in the still air like a chime. He looked down at the lifeless bodies, making a shrewd assessment. \n#italic Quick, clean deaths—he had made sure of it.\n#! Far better than most folk were afforded, and certainly better than the torture they would have endured at the hands of his enemies. Not only had he craftily thwarted his adversaries, but he had also done his family a great service this day. \n\n#italic He was satisfied.\n\n#! Making his way toward the door, he caught the eye of one of the councilmen standing guard. Though his gaze lingered a moment too long, he failed to notice the sweat beading on the young man’s brow. Once he had crossed the threshold, the sound of his footsteps fading, the councilman crumpled like a sack of flour and let out a great rush of air, relieved."
startup.0006.a:0 "Will Velcorminth conquer the land in the name of the [GetGlobalVariable('chasind_culture_var').Culture.GetName] Gods?"
startup.0007.t:0 "Reclaiming the Past"
startup.0007.d:0 "When I stepped through the [eluvian|E] and awoke in the forest, that was when I knew. The trees, they spoke to me—not in visions, but in life. All around, I saw them sprouting arms and legs and mouths, unlike any creatures I had before seen. One reached down with knotted fingers made of branches and said, in a rumbling voice:\n\n#italic “Ahhh, yes—I remember your kind,\nWho long ago left a great ruin behind.”\n\n#!A tree that not only speaks, but in rhymes? How curious! And a ruin of my people somewhere in these woods? I had to see it for myself.\n\n#italic “If thou seeketh with me, then thine past thou shalt find.”\n\n#!The old, gnarled beast led me down a path, through a curtain of mist that shivered with ancient [dataw_magic|E]. Once we stepped beyond, I could scarcely believe my eyes. For deep in the heart of the forest, I beheld the temple, its signature spire climbing toward the sky, a symbol of Tevinter. \n\n That was when I knew, this was where I knew the Fates had led me to this enchanted wood."
startup.0007.a:0 "Will Nanterius succeed in conquering [GetTitleByKey('e_ferelden').GetBaseNameNoTier] in the name of his homeland, Tevinter?"
startup.0008.t:0 "A King in the Making"
startup.0008.d:0 "I hold my grandfather’s sword, first in this land to become a teyrn. I close my eyes and touch the blade to each shoulder, for there is no one left to confer my rule upon me. \n\n#italic Blessed are they who stand before \nThe corrupt and the wicked and do not falter. \nBlessed are the peacekeepers, the champions of the just. \n\n#!When next I open my eyes, I am king. \n\nThe people do not accept my rule because they cannot comprehend the scope of my ambition. They have witnessed only the strength of my forebearers and none of mine. I must show them that the strength of the Danesen line lives on in me. That I have not only the strength, but also the vision, to unite this land under one banner. I am ready, both my mind and my blade sharpened for the task. And once I succeed, they will no longer tell stories of my kin, but of my victory."
startup.0008.a:0 "Will Caedmon follow in his grandfather’s footsteps and become King of [GetTitleByKey('e_ferelden').GetBaseNameNoTier]?"
startup.0009.t:0 "A Novel Approach"
startup.0009.d:0 "Hassandriel braced himself against the table where the maps were spread and took a measured breath. His thoughts turned to Ghilan’nain, Huntress of the People and first of the halla, mother to all those majestic white stags who came after her. He had always found inspiration in her compassion and strength, which had taught him to guide his people with a gentle hand and invite them to follow. \n\n#italic “The halla are our brothers and sisters. One cannot force a halla to do something against her will.”\n\n#!For years, he had ruled as such, and there had been peace. But these [GetGlobalVariable('orlesian_culture_var').Culture.GetName]s mistook the pride of the Dalish, and they weren’t asking. With each passing day, Hassandriel received increasing reports of tensions growing along his borders. Now, when he turned to Ghilan’nain for guidance, he saw only the flash of her white tail as she bounded off into the distance. His brow furrowed, and he dug his nails into the table. There was nothing left in her teachings that could help him now. If he was going to preserve the lives of his people, then he would need to resort to other means."
startup.0009.a:0 "Will Hassandriel succeed in protecting his people from the Orlesian threat?"
startup.0010.t:0 "Loyal to His House"
startup.0010.d:0 "#italic You know [andraste|E]'s old mabari.\nHe don't show up in the Chant.\nAnd if you ask those holy sisters,\nWell, they'll say Andraste can't\nHave had some big old smelly wardog.\nBut all [GetTitleByKey('e_ferelden').GetBaseNameNoTier] knows it right:\nOur sweet Lady needed someone\nWho would warm her feet at night. \n  -  'Andraste's Mabari,' a popular Ferelden tavern song \n\n#!You know, I heard mabari were bred as warhounds by Tevinter [Concept('mage','Mages')|E]. Can you believe that? Never heard of anything more Fereldan than a mabari, loyal as they are to their Fereldan dog lords. So much alike, you'd almost think they'd been weened from the same teat. \n\nBarbarians, the lot of us—ha! I even heard Arl Guerrin once declared war on a man who insulted one of his warhounds. \n\nYou're off your rocker. \n\nIt's true! The way he trains them, you'd never dare doubt it. Spends hours out there on those lands of his, putting those dogs through their paces—and those young lads of his too, make no mistake. \n\nA good one, that Guerrin. The man's as loyal to his house as a mabari to his master."
startup.0010.a:0 "Can the Arl of [GetTitleByKey('d_redcliffe').GetBaseNameNoTier] do what must be done to ensure the safety of his family?"
startup.0011.t:0 "Snake in the Grass"
startup.0011.d:0 "#italic A snake in the grass seems honest enough,\nTroubles you naught lest you handle him rough. \n\n#!“Is it done?” Cormac asked. \n“Not precisely,” said his wife. \n\n#italic A snake in the grass seems harmless at worst, \nTroubles you naught lest you trouble him first. \n\n#!“How can that be? Our man's been gone a fortnight!” \n“Patience, my dear,” she said sweetly. “You musn’t worry.” \n\n#italic A snake in the grass only wants to lie low, \nTroubles you naught lest you bait him to show. \n\n#!He hissed through his teeth with displeasure. “True enough. Though, if we’re to take down that dog before he gathers his forces, we must act quickly.” \n“All in good time,” she said, smiling. \n\n#italic A snake in the grass playing only pretend, \nPoised to strike—and bring your untimely end."
startup.0011.a:0 "Will Cormac rise to the occasion and strike before [caedmon.GetFirstName] claims all of [GetTitleByKey('e_ferelden').GetBaseNameNoTier]?"
startup.0012.t:0 "Beyond Borders"
startup.0012.d:0 "#italic If you’ve never been to [GetTitleByKey('b_gwaren').GetBaseNameNoTier] \nIt’s because she leaves no trace. \nFor generations, proudly stood \nSurrounded by that tainted wood. \nUnless you have a boat that’s good, \nYou’ll never find the place. \n\nIf you’ve never been to Gwaren, \nThen look closer, and you’ll find \nStrong loggers bade with ax in hand \nAnd fishing nets beyond the sand. \nPlain, honest folk fed off the land \nWho pay it back in kind. \n\nIf you’ve never been to Gwaren \nBut perhaps for tales and lore– \nBehind defenses, she has slept; \nFor generations, secrets kept; \nNo ruler for the chance has leapt \nTo extend beyond her shore."
startup.0012.a:0 "Will Alaric succeed in his quest to push Gwaren’s borders to new heights?#!"
startup.0013.t:0 "A Two Front War"
startup.0013.d:0 "Word of war on the horizon between [GetTitleByKey('e_orlais').GetBaseNameNoTier] and [GetTitleByKey('k_the_dales').GetBaseNameNoTier] was widespread, but this [roux.GetName] quietly amassing power against the Emperor was news indeed. Upon hearing the scout’s report of such dissent coming to light, Frederic considered the child’s verse his father told him—deceptively simple, yet a guiding principle that had never steered him wrong: \n\n#italic One, two – make the first move \nThree, four – shut the door \n\n#!He thumbed his chin in thought. Was [kordillus_ii.GetName] aware? Perhaps he could use this information to his advantage, especially if Kordillus did not yet know of the people in the Marshes planning to move against him. Frederic gave his scout a coin for good measure and sent him away, affording himself time to think. \n\nIt was only a matter of time before the Emperor learned of this incoming betrayal. One way or another, the Marquis of [GetTitleByKey('d_ghislain').GetBaseNameNoTier] must choose a side, and quickly."
startup.0013.a:0 "Will Frederic use his powers of Intrigue to outmaneuver them all?"
startup.0014.t:0 "A Call for Peace"
startup.0014.d:0 "#italic I feel sun through the ashes in the sky \nWhere’s the one who’ll guide us into the night? \nWhat’s begun is the war that will force this divide \nWhat’s to come is fire and the end of time\n -  From the song, "I Am the One," translated from its native Elvish \n\n#!I had hoped, as this was a small matter, to settle things peacefully. When I arrived, tensions were already running high. According to my men, a small group of hunters had followed a doe through the forest only to encounter members of the Dalish clan, bows and blades drawn. The way the [elves|E] told it, my men had trespassed on their lands in pursuit of this doe, violating the fragile peace we had only recently established. \n\nVoices rose, and in the commotion, more people gathered on both sides, fanning the flames. What had started as a disagreement between two small hunting parties grew to ten or fifteen men on either side. Even if [kordillus_ii.GetName] himself asked me, on my honor, I could not say with certainty which side drew first blood. A pity—far more lives than needed to be lost this day. \n\nTensions continue to rise. I see this war growing worse before it gets better. There must be something I can say in order to make them see reason."
startup.0014.a:0 "Will the Marquis find a way to talk himself through the growing conflict?"
startup.0015.t:0 "The Grand Game"
startup.0015.d:0 "#italic The Emperor has swords and shields \nThe [chantry|E] has its fame \nThe Farmers have their lands and fields \nAnd Nobles have The Game \n#!-  An old [GetGlobalVariable('orlesian_culture_var').Culture.GetName] saying \n\nI titter and curtsey to the duchess, putting on my best smile. What a vile woman. I pay a compliment to her shoes, despite their garish hue—#italic chartreuse#!—and embellishments from at least two seasons ago. The very idea! \n\nBut no matter, if this proves a fair match for my young Jocelyn. What the duchess lacks in taste, she makes up for in gold, and military might besides. A suitable match for a middle daughter, no doubt giving her a strong foothold in the peerage. While the duchess prattles on, I suffer in silence, simpering behind my fan. \n\nAnything for my dear children. They know not the sacrifices I make for them."
startup.0015.a:0 "Will Foisine play the Grand Game to her advantage and secure support for her family?"
startup.0016.t:0 "Blade of Truth"
startup.0016.d:0 "Evram’s sword sailed through the air, then sliced into his enemy’s thigh. He wrenched the blade free just in time to drive it past his hip and straight into the guts of the second barbarian charging behind him. The sword—the same sword he had been taught to wield as a young boy—pulled free like a knife through warm butter before seeking out its next target. All the while, Evran droned under his breath, the low hum lost amidst the surrounding clamor— \n\n#italic Sing to me, O sword of my youth \nWith hilt of valor and blade of truth \nWhens whisper from mine sheath forsooth \nThen no more troubles will find me \n\n#!His blade swung around in another graceful arc, catching his new opponent behind the knees. One with his sword, Evram was untouchable. So long as he was singing, he never missed."
startup.0016.a:0 "Will Evram use all of the weapons at his disposal so his line might endure?"
startup.0017.t:0 "Prayers Unanswered"
startup.0017.d:0 "After lighting the candles on his personal altar, Marquis Umbert knelt. He clasped his hands at his forehead in supplication, murmuring under his breath. \n#italic O Creator, see me kneel: \nFor I walk only where You would bid me. \nStand only in places You have blessed. \nSing only the words You place in my throat. \n\n#!He began rocking forward and back, eyes shut tight. \n#italic Touch me with fire that I be cleansed. \nTell me I have sung to Your approval. \n\n#!A bead of sweat trickled from his temple. He was praying as hard as he dared. He didn’t understand—he was among the most pious, the most devoted, yet he was no closer to finding an eligible marriage match. \n#italic Touch me with fire that I be cleansed. \nTell me I have sung to Your approval. \n\n#!What more could he do? He prayed harder and hoped, this time, the [maker|E] would heed him."
startup.0017.a:0 "Will Marquis Umbert’s prayers be answered, or must he resort to other means?"
startup.0101.t:0 "The Dragon's Anger"
startup.0101.d:0 "War surrounds us. We are [GetGlobalVariable('orlesian_culture_var').Culture.GetName] and our enemies carry daggers under every sleeve. [nahashin_holder.GetName] is making moves, intent to rise with an entirely new kingdom. \n\nWhile this would-be king plots his next move carefully, the ancient relics that are the elves of [GetTitleByKey('k_the_dales').GetBaseNameNoTier] increase their hostility with us day-by-day. Stubborn to quell, their anger grows hotter still, threatening to burn all of us. \n\nWill this Empire survive what is to come? [maker|E], preserve us all."
startup.0101.a:0 "We are the new rulers of [thedas|E]!"
startup.0102.t:0 "The New Arlathan"
startup.0102.d:0 "As elves, we have endured much since the fall of Arlathan to the north. For some of us, we've traveled far and wide to make this a true home for our kin. Struggle has been all we've known since the days of our former glory as a people. Some say we are shadows of our former selves, unable to get beyond our past. \n\nTension with [GetTitleByKey('e_orlais').GetBaseNameNoTier] ever grows, while all out war seems inevitable. My heart weeps for my kin, but there is little to be done. Our new home, [GetTitleByKey('k_the_dales').GetBaseNameNoTier], had such hope for a better future. \n\nIn our focus to better ourselves, we had chosen to ignore the plea of those that fought against the [darkspawn|E] in the Second [blight|E]. Perhaps we deserve what is to come for such indifference. Will this be another tragedy like Arlathan had been?"
startup.0102.a:0 "We have suffered enough. Now, we shall thrive."
startup.0103.t:0 "A Land of Dogs"
startup.0103.d:0 "[GetTitleByKey('e_ferelden').GetBaseNameNoTier], a land full of beautiful sites, and a diverse people that descend from their Alamarri ancestors in the form of new cultures entirely of their own design. \n[blight|E]s have ravaged the land twice now, and we can't seem to stop killing one another long enough for a true leader to rise and unite the land. All hope is not lost, as rumors traverse [thedas|E] that soon there will be a true ruler from the [GetGlobalVariable('clayne_culture_var').Culture.GetName]. That Ferelden will finally have a unified people. \n\nIt remains to be seen if we will ever coexist long enough to rise to similar heights of our neighbors to make our ancestors proud, but hope remains."
startup.0103.a:0 "One day, the Clayne will stand as one."
startup.0104.t:0 "Masters of the Frostbacks"
startup.0104.d:0 "Before [andraste|E] and the Cult of the [maker|E], we [GetGlobalVariable('avvar_culture_var').Culture.GetName] were not “barbarians” nor “hill people” but were one of many tribes in southern [thedas|E]. Honor, bravery and strength are what our skalds sing about; But the isolating [GetTitleByKey('k_frostback_mountains').GetBaseNameNoTier] have not helped spread this image across the lands. Kings and Emperors both fight over the fate of the south, [GetTitleByKey('k_the_dales').GetBaseNameNoTier] and [GetTitleByKey('e_ferelden').GetBaseNameNoTier] are among the many enemies who battle around our lands. The victor of these wars in the lowlands may look at our divided tribes as easy targets, and they may be right. \n\nOur tribes follow many traditions developed before the [chantry|E]. If the war is lost then that line shall end and the old gods shall be slain like those in Tevinter. But that war in the lowlands is not over yet, and we are far from weak. Now, perhaps the nation, like our gods, is meant to be reborn."
startup.0104.a:0 "In the end, the Will of Tyrdda Bright-Axe lives on through us."
startup.0105.t:0 "Folks of the Wilds and Mist"
startup.0105.d:0 "After [hafter.GetName], a legendary Alamarri warrior and the first teyrn of Ferelden, defeated our ancestors during the Divine Age and drove them into the [GetTitleByKey('k_korcari_wilds').GetBaseNameNoTier], we were forced to adapt to this hostile land. These untamed bogs and quiet woods can bring even the strongest warrior to their knees, a lesson we know all too well. But through our many hardships in this unforgiving land, we have slowly begun to thrive. \n\nWe may be forgotten and ignored by the rest of [GetTitleByKey('e_ferelden').GetBaseNameNoTier], but the [GetGlobalVariable('clayne_culture_var').Culture.GetName] and the [GetGlobalVariable('avvar_culture_var').Culture.GetName] will soon remember why we should still be feared." 
startup.0105.a:0 "The Seasons will guide us to glory."
startup.0106.t:0 "Followers of the Dying Ways"
startup.0106.d:0 "These ancient woods call to us, encouraging us that dwell here to defend this land from outsiders. They are not deserving of the gifts from the [spirits|E] as their ignorance and greed bring only pain and destruction. \n\nWe have already witnessed their ambition firsthand, their desire to invade the [GetTitleByKey('k_brecilian_forest').GetBaseNameNoTier] will be their undoing. As they march, the [spirits|E] awaken in the form of Sylvans. With these creatures by our side, this unknowing foe of ours will feel the wrath of the [spirits|E] in full. \n\nA reality in which death finds us does not sway our hands, for we will protect our home, gladly dying for it if need be. [thedas|E] is changing however, to which we find ourselves horrified. Can we endure what is to come?"
startup.0106.a:0 "The Forest is our home, and we shan't forsake it."
startup.0107.t:0 "The People of the Whale"
startup.0107.d:0 "We have been forgotten by the wider world. \n\nAway on the other side of the [GetGeographicalRegion('o_region_gamord_mountains').GetName], often forgotten on maps, our little empire developed on its own, with the great houses brought under [kordillus_ii.GetName]’ heel more out of formality than necessity. \n\nYet we do not forget. We shall never forget the traditions that defines us. We shall not forget the [GetGeographicalRegion('sea_sundered_sea').GetName] is our own sea, rather than the one that most of [thedas|E] sails and obeys. \n\nWe are our own world. We are the fringe of civilization, but we shall become their envy."
startup.0107.a:0 "The little empire of Gamord will finally show its worth."
startup.0108.t:0 "A Lush and Green Memory"
startup.0108.d:0 "Once, the [GetTitleByKey('k_western_approach').GetBaseNameNoTier] was beautiful. Once, it was lush and green, akin to a paradise, and our soil was the envy of [thedas|E]. \n\nYet the [blight|E] began and from the Abyssal Rift came out endless hordes of [darkspawn|E], killing our soil until it was but a barren soil of rock and sand. We have been forced to work like never before, mining the soil and searching for long lost artifacts of our dead paradise. \n\nToday, we have adapted to the new soil we live in, and although we shall never forget the Western Approach was once lush and green, we keep moving forward still."
startup.0108.a:0 "For our land may be dead, but we shall thrive."
startup.0109.t:0 "The Cold and Dry Wanderers"
startup.0109.d:0 "We [GetGlobalVariable('cendrerin_culture_var').Culture.GetName] have come a long way ever since our exile from [GetTitleByKey('k_gamord').GetBaseNameNoTier]. We have fought, tooth and nails, and yet we lost and were led to exile by the [GetGlobalVariable('nevenais_culture_var').Culture.GetName] into the dry and lifeless Sea of Ash. They led us there, and awaited our demise with a certainty that can be seen in only the most zealous. \n\nYet we proved them wrong. In the Sea of Ash they thought lifeless, we found life, sustenance and a haven. In this land, we learned to accept any who could help, however they could help, and we learned to accept the exiles that they brought in this land. \n\nWhether we follow the [maker|E] or the land itself for the gifts we have been given, we have received something beautiful in this dreadful exile: our culture. We are now free from the shackles of what they call a home, thanks to them."
startup.0109.a:0 "Now, we wander freely, and blessed be the Ash and the Maker for this."
startup.0110.t:0 "The Southern Faithful of the Horse"
startup.0110.d:0 "Amidst the [GetTitleByKey('k_deauvin').GetBaseNameNoTier] Flats, south of [GetTitleByKey('c_montsimmard').GetBaseNameNoTier], is our homeland found. Here, we have rode on our horses for centuries, using arrows and swords alike as we fought amidst the thundering hooves, against [GetGlobalVariable('orlesian_culture_var').Culture.GetName] and [GetGlobalVariable('borsol_culture_var').Culture.GetName] alike. Only the House of Simmard has ever managed to unite us under one crown, which was then brought under the rule of [kordillus_ii.GetName]. \n\nEver since the Attack of Montsimmard during the Second [blight|E], we have lost the house who could rule us without opposition, under the [maker|E] and his sun. Perhaps this will change some day, but for now, we remember. Above all, we ride and draw."
startup.0110.a:0 "May our arrows ring true, those of the greatest warriors of [GetTitleByKey('e_orlais').GetBaseNameNoTier]."
startup.0111.t:0 "The Lords of the Fields"
startup.0111.d:0 "Many are surprised when they lay eyes upon the great plantations of our land. Beautiful, beautiful [GetTitleByKey('k_ghislain').GetBaseNameNoTier], whose fields feed the entirety of the Empire. The Great Game is not played the same here. It is played in the balls of the great manors that dominate fields three times the size of [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier], for the sake of control of evermore fields. \n\nFor there may be no gold in the mountains surrounding our plains, but our soil is full of it. A gold that not only assures our riches, but also our firm grip on [GetTitleByKey('e_orlais').GetBaseNameNoTier]’ throat. For Val Royeaux may rule the Empire, Ghislain is the reason it is alive."
startup.0111.a:0 "One day, those that truly guide Orlais will rule it in earnest."
startup.0112.t:0 "A Proud Backwater"
startup.0112.d:0 "Many of the perfumed nobles of [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier], [GetTitleByKey('k_ghislain').GetBaseNameNoTier] and elsewhere look at the Mareschois of [GetTitleByKey('e_nahashin').GetBaseNameNoTier] with open contempt. To them, we are savages from the last millenium living in a wild swamp, barely evolved from the [GetGlobalVariable('ciriane_culture_var').Culture.GetName] of old. To them, the only place of any value in [GetGlobalVariable('mareschois_culture_var').Culture.GetName] lands is [GetTitleByKey('d_alyons').GetBaseNameNoTier] and [GetTitleByKey('d_serault').GetBaseNameNoTier], who have managed to push themselves above their [GetGlobalVariable('chasind_culture_var').Culture.GetName]-like status into something halfway respectable. \n\nLet them think this way. Underestimating an opponent is the first mistake you can make in the Great Game, and the entirety of the Empire doesn’t view us as a threat. Yet we have forged our own way in the marshes. We have kept close to tradition, we have adapted to this land we call home, and one day, we shall prove them all wrong by casting away the shackles of their condescending rule."
startup.0112.a:0 "Nahashin will be free, and the envy of [thedas|E]!"
startup.0113.t:0 "Isorath's Descendants"
startup.0113.d:0 "In between [GetTitleByKey('e_orlais').GetBaseNameNoTier] and [GetTitleByKey('e_ferelden').GetBaseNameNoTier], two great bastions of [GetReligionByKey('andrastianism_religion').GetName], stands a small region, nestled between the [GetTitleByKey('d_crescent_valley').GetBaseNameNoTier], [GetTitleByKey('d_jader').GetBaseNameNoTier] and [GetTitleByKey('d_salmont').GetBaseNameNoTier]. Our home. Here, during Isorath's rule over Orlais, the region's Alamarri increasingly came under their western neighbour's influence. Today, Jader is a full-fledged province of the Empire ever since Kordillus' unification, and we [GetGlobalVariable('jaderian_culture_var').Culture.GetName]s stand proud as an unique people, always ready to defend our dear land against invaders. \n\nWe know that our beloved Jader is the legitimate place of [andraste|E]'s birth, no matter what those fools in [GetTitleByKey('d_denerim').GetBaseNameNoTier] claim. The [chantry|E] may have refused to take anyone's side in this matter, but we shall prove to all of [thedas|E] we are in the right."
startup.0113.a:0 "May our talent show our worthiness to live in this sacred crossroad."
startup.0114.t:0 "Cavaliers of the High Lands"
startup.0114.d:0 "Life in the High Lands of [GetTitleByKey('k_perendale').GetBaseNameNoTier] and the [GetTitleByKey('k_blasted_hills').GetBaseNameNoTier] can sometimes sound strange to the [GetGlobalVariable('orlesian_culture_var').Culture.GetName]s of [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier]. The Great Game here is not typically played on the dance floor or in a fancy supper, but on the battlefield. Every move is calculated to be as elegant, as daring as possible.\n\nSuch has been our life ever since the first [blight|E] and the dissolution of [maferath.GetName]'s empire, which has left us fighting free marchers, tevenes, [darkspawn|E] and so many more in order to preserve our way of life."
startup.0114.a:0 "Now, we are vassals of the Empire, but our sword still swings true."