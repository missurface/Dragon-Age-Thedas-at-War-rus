 dataw_pretender_conquest.001.tit: "Страх и зависть"
 dataw_pretender_conquest.001.desc: "В Ферелдене немногие способны противостоять мощи моей державы. \n\nДвор гордится этим — и особенно горжусь я. Но то, что вызывает у меня гордость, в других пробуждает зависть и ужас перед возможным будущим. \n\nОдин из видных придворных сообщает, что прочие правители Ферелдена тайно сговариваются, желая умерить моё могущество. Похоже, они боятся растущей силы моей державы и считают, что я намереваюсь короновать себя [Select_CString(ROOT.Char.IsFemale, 'королевой', 'королём' )] всего Ферелдена. \n\nОстаётся решить, как распорядиться этими сведениями."
 dataw_pretender_conquest.001.opt.a: "[Select_CString(ROOT.Char.IsFemale, 'Если они считают меня королевой, я ею и стану!', 'Если они считают меня королём, я им и стану!' )]"
 dataw_pretender_conquest.001.opt.a.tooltip: "Объявить себя [Select_CString(ROOT.Char.IsFemale, 'королевой', 'королём' )] всего Ферелдена и выступить против каждого, кто попытается вас остановить."
 dataw_pretender_conquest.001.opt.b: "Постараться как можно дольше унимать их страхи."
 dataw_pretender_conquest.001.opt.b.tooltip: "Возможно, это даст вам несколько лет на подготовку к неизбежному."




