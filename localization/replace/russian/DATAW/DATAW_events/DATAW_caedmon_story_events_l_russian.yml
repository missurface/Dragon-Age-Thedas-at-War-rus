l_russian:




 dataw_caedmon_normal.0001.tit: "Война непокорных"
 dataw_caedmon_normal.0001.desc: "Мы знали, что рано или поздно случится нечто подобное. Почтовые голуби один за другим приносят весть: грядёт война. \n\nПохоже, многие подданные утратили веру в мою мечту о едином Ферелдене — если вообще когда-либо её разделяли. Теперь при поддержке чужеземных подстрекателей они подняли всеобщее восстание против моей власти. \n\nНеужели честолюбивым замыслам пришёл конец? \n\nНет. Я не покорюсь и заставлю их увидеть истину."
 dataw_caedmon_normal.0001.opt.a: "Сомневающиеся и обманщики скоро узнают своё место."
 dataw_caedmon_normal.0001.opt.b: "Сейчас неподходящее время."



 DATAW_dataw_caedmon_normal.0001.opt.a.tooltip.a: "[Concept('struggle_involved','Участвующие в борьбе')|E] [Concept('rulers','правители')|E] державы [GetTitleByKey('e_ferelden').GetBaseNameNoTier] выступят против вашей [Concept('claim','претензии')|E] на престол державы [GetTitleByKey('e_ferelden').GetBaseNameNoTier] и объявят #bold «Поход против [Select_CString(loc_scope.IsFemale, 'претендентки', 'претендента' )] [loc_scope.GetFirstName]»#!."
 DATAW_dataw_caedmon_normal.0001.opt.a.tooltip.b: "[loc_scope.GetCharacterViewNameOrMe] вступит в [Concept('war','войну')|E] со всеми [Concept('struggle_involved','участвующими в борьбе')|E] [Concept('ruler','правителями')|E] державы [GetTitleByKey('e_ferelden').GetBaseNameNoTier], кроме ваших верных [Concept('vassal','вассалов')|E]. Если вы победите, #ENC правителям державы [GetTitleByKey('e_ferelden').GetBaseNameNoTier] придётся признать вашу [Concept('claim','претензию')|E] на престол державы [GetTitleByKey('e_ferelden').GetBaseNameNoTier]#!."
 DATAW_dataw_caedmon_normal.0001.opt.a.tooltip.d: "Если [loc_scope.GetCharacterViewNameOrMe] потерпит [Concept('defeat','поражение')|E] в этой [Concept('war','войне')|E], #XB персонаж [loc_scope.GetCharacterViewNameOrMe] лишится власти в результате [Concept('deposed','свержения')|E], а [Concept('realm','держава')|E] персонажа [loc_scope.GetCharacterViewNameOrMe] утратит все земли, не принадлежащие ей по праву. Останутся лишь земли [de_jure|E] столичного эрлинга#!."
 DATAW_dataw_caedmon_normal.0001.opt.a.tooltip.c: "Если [loc_scope.GetCharacterViewNameOrMe] [Concept('character_death_die','умрёт')|E], не успев полностью объединить державу [GetTitleByKey('e_ferelden').GetBaseNameNoTier], #XB возникшая после [Concept('character_death_death','смерти')|E] персонажа [loc_scope.GetCharacterViewNameOrMe] борьба за власть положит начало [Concept('war_of_the_crowns','Войне Корон')|E]#!."
 DATAW_dataw_caedmon_normal.0001.opt.b.tooltip.a: "Каждому [Concept('dog_lords','Собачьему лорду')|E] державы [GetTitleByKey('e_ferelden').GetBaseNameNoTier] станет доступно [Concept('decision','решение')|E] «Выковать корону Ферелдена», а персонаж [loc_scope.GetCharacterViewNameOrMe] сможет принять его дешевле"



 embrace_fereldan_culture_counties_custom: "Подконтрольные вам [Concept('counties','графства')|E], участвующие в [Concept('fereldan_struggle','Ферелденской борьбе')|E]"

 barbarian_ferelden_cultures: "Клейны считают вашу [Concept('culture','культуру')|E] варварской"

 alamarri_pagan_faith_in_the_struggle: "Клейны считают вашу [Concept('faith','конфессию')|E] варварской"
















################################ MAIN EVENTS #######################
### main event 1 - how to rule
 dataw_caedmon_main.001.tit: "Как править?"
 dataw_caedmon_main.001.desc: "У меня одна мечта — единый Ферелден, но прежде следует решить, как им править. Удастся ли склонить родичей-клейнов словами, или там, где речи бессильны, победит меч? \n\nДипломатия поможет сохранить спокойствие, пока королевство объединяется, но воинская сила и стратегический талант могут вернее доказать моё право на власть."
 dataw_caedmon_main.001.opt.a: "Я покажу себя [Select_CString(ROOT.Char.IsFemale, 'могучей завоевательницей', 'могучим завоевателем' )]!"
 dataw_caedmon_main.001.opt.b: "Я предстану [Select_CString(ROOT.Char.IsFemale, 'объединительницей', 'объединителем' )]!"

### main event 2 - where to begin           MAYBE CUT?
 dataw_caedmon_main.002.tit: "С чего начать?"
 dataw_caedmon_main.002.desc: "Объединение Ферелдена — великое начинание, и необходимо тщательно выбрать первый шаг. \n\nНа западе лежит раздробленный Баннорн. Было бы мудро подчинить эти плодородные земли, пока меня не опередили враги. \n\nК югу простираются Южные холмы. Завладев ими, можно надёжнее прикрыть подступы к Денериму. \n\nСевером владеет Амарантайн — обширный и могущественный эрлинг. Его покорение наверняка избавит меня от одного из опаснейших возможных соперников. \n\nНаконец, на юго-востоке находится Гварен. В прошлом столетии его разграбили бресилианские варвары, но город всё ещё остаётся важным торговым центром и, если оставить его без внимания, может стать серьёзной угрозой Денериму."
 dataw_caedmon_main.002.opt.a: "Рано или поздно покорятся все..."
 dataw_caedmon_main.002.opt.a.tooltip: "#N Следующий этап вашего пути указан среди решений!#!\n#N Берегитесь!#! Клейны ненавидят подчиняться, и сама мысль о «короле» им отвратительна..."

### main event 3 - crown of ferelden
 dataw_caedmon_main.003.tit: "Корона Ферелдена"
 dataw_caedmon_main.003.desc: "Чтобы сплотить разрозненных баннов-клейнов, нужен великий символ власти, и я возложу его на своё чело. \n\nЯ [Select_CString(ROOT.Char.IsFemale, 'созвала', 'созвал' )] лучших кузнецов Ферелдена и [Select_CString(ROOT.Char.IsFemale, 'доверила', 'доверил' )] им драгоценнейшие материалы, чтобы они выковали корону, внушающую благоговение всем моим подданным. Надеюсь, это наследие после меня увенчает многих великих правителей, и они сохранят верность моей мечте о сильном, едином Ферелдене."
 dataw_caedmon_main.003.opt.a: "Корона, достойная единого Ферелдена."
 dataw_caedmon_main.003_opt.a.tooltip: "Вести о вашей коронации достигли эрлов и баннов за пределами державы. #N Они недовольны.#!"

 caedmon_conquest_paths: "#P Вам станут доступны два решения, связанных с завоеванием Ферелдена#!"



### main event 4 - breaking brandel's reach
 dataw_caedmon_main.004.tit: "Сломить Предел Бранделя"
 dataw_caedmon_main.004.desc: "Острова к северо-востоку от Ферелдена давно стали занозой в боку наших портов. Здесь находят безопасное пристанище все подонки и негодяи страны. \n\nНо этому пришёл конец. Острова крепко зажаты в моём кулаке, и я искореню здесь всякое влияние пиратов."
 dataw_caedmon_main.004.opt.a: "Этой землёй должен править настоящий клейн."
 dataw_caedmon_main.004.opt.a.tooltip: "Людям Недремлющего моря нельзя доверять. Здесь необходимо поставить верного правителя-клейна."






### main event 5 - the future of ferelden
 dataw_caedmon_main.005.tit: "Неприступные врата"
 dataw_caedmon_main.005.desc: "Банны покорились моей воле, и теперь центральный Ферелден принадлежит мне. Пришло время обратить взор к Редклифу — самой могучей твердыне клейнов на пути в нашу долину. \n\nВладения любого, кто желает править нашим народом, непременно должны включать Редклиф. Остаётся лишь решить, как подступиться к вратам Ферелдена."
 dataw_caedmon_main.005.opt.a: "Предложить Редклифу условия."
 dataw_caedmon_main.005.opt.b: "Набрать воинов среди новых подданных."

### main event 5.1 - redcliffe response event - no
 dataw_caedmon_main.0051.tit: "Ответ Редклифа"
 dataw_caedmon_main.0051.desc: "Редклиф отверг наши мирные предложения и пренебрёг всеми попытками предотвратить полномасштабную войну. \n\nРано или поздно наши державы столкнутся. Вопрос лишь в том, когда это произойдёт."
 dataw_caedmon_main.0051.opt.a: "Скоро они пожалеют о своём решении."

### main event 5.2 - redcliffe response event - yes
 dataw_caedmon_main.0052.tit: "Ответ Редклифа"
 dataw_caedmon_main.0052.desc: "Редклиф принял наши мирные предложения, вероятно желая предотвратить полномасштабную войну. \n\nПока между нами будет мир, и они смогут исполнить своё предназначение — охранять путь в наши земли."
 dataw_caedmon_main.0052.opt.a: "Подтвердить их право на власть."

### main event 6 - What Remains?
 dataw_caedmon_main.006.tit: "Что осталось?"
 dataw_caedmon_main.006.desc: "Самозваные тэйрны и эрлы-выскочки Ферелдена один за другим падают под натиском моего войска. Осталось лишь заставить остальных преклонить колени."
 dataw_caedmon_main.006.opt.a: "Вперёд, на Портсмут и Эджхолл!"

### main event 7 - Ferelden is United
 dataw_caedmon_main.007.tit: "Ферелден объединён"
 dataw_caedmon_main.007.desc: "Мечта воплотилась в жизнь. \n\nВесь Ферелден в моих руках. Клейны объединены, и мелочные распри больше не разобщат нас. \n\n[daneancestor.GetFirstName] [Select_CString(daneancestor.IsFemale, 'изгнала', 'изгнал' )] оборотней из Ферелдена. [hafterancestor.GetFirstName] [Select_CString(hafterancestor.IsFemale, 'стала первой тэйрной', 'стал первым тэйрном' )] нашего народа. Что скажут обо мне, когда меня уже давно не будет?"
 dataw_caedmon_main.007.opt.a: "Наконец я по праву [Select_CString(ROOT.Char.IsFemale, 'королева', 'король' )]."
 dataw_caedmon_main.007.opt.a.tooltip: "Но действительно ли все ваши амбиции удовлетворены?"








##################### RELIGION EVENTS ########################
##### RELIGION EVENT 1 - FAITH OF FERELDEN
 dataw_caedmon_religion.001.tit: "Вера Ферелдена"
 dataw_caedmon_religion.001.desc: "«[Select_CString(ROOT.Char.IsFemale, 'Дорогая', 'Дорогой' )] [TITLE] Кэдмон! Я [ORLESIAN_KNIGHT]. До нас дошли вести о вашем стремлении объединить земли Ферелдена под одной короной и одной Песнью, как наш дорогой [Kordillus 1 Drakon] объединил славную империю. Для меня было бы честью служить новому воплощению Кордилиуса на этой священной земле». \n\nПосле того как я [Select_CString(ROOT.Char.IsFemale, 'провозгласила себя королевой', 'провозгласил себя королём' )] Ферелдена, я меньше всего [Select_CString(ROOT.Char.IsFemale, 'ожидала', 'ожидал' )] восторженных славословий чужеземного орлесианского рыцаря. Такое отношение может оказаться полезным, но придворные обмениваются настороженными взглядами. Многие выросли на рассказах об имперском гнёте Тевинтера, и даже помощь, которую император оказал державе [KINGDOM OF AENWALDBRIM] во время Второго Мора, не избавила их от подозрений к витиеватым речам Орлесианской империи. \n\nПод этими испытующими взглядами становится ясно: если Ферелден хочет стать державой, достойной своего имени, необходимо действовать. Ему нужна единая Церковь, которая направит подданных под властью [Select_CString(ROOT.Char.IsFemale, 'законной королевы', 'законного короля' )]. \n\nГлавный вопрос читается во всех ожидающих глазах. Следует ли уподобиться великому объединителю орлесианцев и принять помощь Орлея вместе с его религиозной властью? Или же сохранить независимость и успокоить подданных, которые ещё хорошо помнят ужасы тевинтерского владычества?"
 dataw_caedmon_religion.001.opt.a: "Я — Кордилиус нашего времени!"
 dataw_caedmon_religion.001.opt.a.tooltip: "Принять чужеземную помощь в завоеваниях. Другие клейны могут не одобрить этого, но со временем им откроется истина!"
 dataw_caedmon_religion.001.opt.b: "Это объединение совершается ради престола Ферелдена!"
 dataw_caedmon_religion.001.opt.b.tooltip: "Объединить народ будет гораздо легче, если не пытаться одновременно навязать ему новую веру."

##### RELIGION EVENT 2 - Caedmon's Temple
 dataw_caedmon_religion.002.tit: "Храм Кэдмона"
 dataw_caedmon_religion.002.desc: "Вера определяет нашу жизнь. Мы поём Песнь и готовимся разнести её во все уголки Тедаса, но меня тревожит будущее андрастианства в этой державе. После создания единого учения [YOUR_FAITH] последователи, поддержавшие мою веру и моё королевство, должны убедиться в твёрдости моих убеждений. \n\nДля этого следует воздвигнуть великий собор на родине Андрасте — в [Denerim]. Он не уступит собору Верховной Жрицы в [Val Royeaux] и заставит умолкнуть самозванцев из [Jader], которые называют родиной Андрасте свой город. \n\nДа, это необходимо сделать. Но кому посвятить храм?"
 dataw_caedmon_religion.002.opt.a: "Воздвигнуть храм во славу Андрасте!"
 dataw_caedmon_religion.002.opt.a.tooltip: ""

#### RELIGION EVENT 3 - Foreign Relations
 dataw_caedmon_religion.003.tit: "Отношения с чужеземцами"
 dataw_caedmon_religion.003.desc: "Я вижу, как на меня смотрят жители Орлея. Прибывающие в Денерим паломники ставят свечи во имя моего успеха. Певчие прославляют нашу Песнь на родине Пророчицы. Одна преподобная мать даже попросила меня написать собственную песнь — подобно тому как Кордилиус создал Песнь Возвышения. \n\nТакое обожание не продлится вечно, но сейчас его можно обратить себе на пользу. Возможно, удастся снискать личное расположение Верховной Жрицы, пригласив её на родину Андрасте. \n\nХватит ли одной дерзости, чтобы замысел удался? Согласится ли Верховная Жрица встретиться со мной, поверив слухам и народному восхищению?"
 dataw_caedmon_religion.003.opt.a: "Попытаться стоит."
 dataw_caedmon_religion.003.opt.a.tooltip: "Верховная Жрица может поддержать ваше дело..."
 dataw_caedmon_religion.003.opt.b: "Лучше укрепить отношения с Вал Руайо."
 dataw_caedmon_religion.003.opt.b.tooltip: "Император явно окажется полезнее Верховной Жрицы..."







#### Religion Event (new 1) - Faith of Ferelden
 dataw_caedmon_normal.0002.tit: "Вера Ферелдена"
 dataw_caedmon_normal.0002.desc: "Аламарри, несомненно, купаются в свете Создателя, но у нас нет единой Церкви, способной сплотить верующих. Именно поэтому все прежние попытки объединить наш народ были обречены. \n\nНа западе по-прежнему правят язычники, а Орлей и Тевинтер научились распространять Песнь Андрасте по своим империям. Моё королевство должно последовать их примеру. Но стоит ли объединиться с другими верующими или проложить собственный путь? \n\nОбращение к Орлею сулит множество явных и неожиданных выгод, однако подданным наверняка придётся не по вкусу отказ от традиций предков."
 dataw_caedmon_normal.0002.opt.a: "Наш народ лучше всех знает слово Андрасте."
 dataw_caedmon_normal.0002.opt.b: "Орлесианцы избрали верный путь."
 DATAW_allow_faith_reform_with_1_holy_site: "Позволяет реформировать [Concept('faith','конфессию')|E], имея лишь #positive_value 1#! [Concept('holy_site','святое место')|E]"
 DATAW_allow_faith_reform_with_2_holy_site: "Позволяет реформировать [Concept('faith','конфессию')|E], имея лишь #positive_value 2#! [Concept('holy_site','святых места')|E]"
 DATAW_grants_20_relation_boost_to_all_same_culture_rulers: "Все правители, чья [Concept('culture','культура')|E] — [GetTitleByKey('c_denerim').GetHolder.GetCulture.GetName], получают #positive_value +20#! к мнению о вас"
 DATAW_grants_20_relation_boost_to_all_same_faith_rulers: "Все правители, чья [Concept('faith','конфессия')|E] — [actor.GetFaith.GetName], получают #positive_value +20#! к мнению о вас" 
 DATAW_vassals_that_like_you: "Все [Concept('vassal','вассалы')|E] с положительным мнением о вас примут веру [actor.GetFaith.GetName]"
 DATAW_grants_20_relation_malus_to_all_same_culture_non_faith_rulers: "Все правители культуры [recipient.GetCulture.GetName], чья [Concept('faith','конфессия')|E] отличается от [actor.GetFaith.GetName], получают #negative_value -20#! к мнению о вас"
 DATAW_caedmon_you_and_your_family_convert: "[recipient.GetCharacterViewNameOrMe] и все ваши [Concept('close_family','ближайшие родственники')|E] принимают веру [actor.GetFaith.GetName]"
 DATAW_grants_boost_to_faith_conversion: "Ваша [Concept('dynasty','династия')|E] получает бонус к обращению в другую [Concept('faith','конфессию')|E], пока её представители исповедуют [actor.GetFaith.GetName] или любую другую [Concept('faith','конфессию')|E] с [Concept('doctrine','доктриной')|E] «[GetDoctrine('chantry_succession_orlesian_doctrine').GetBaseName]»"
 dataw_orlesian_forces: "Элитный авангард орлесианских войск присоединяется к вашей армии!"










################ Build-up to Great Defiance #################
 dataw_caedmon_warning.001.tit: "Ропот при дворе"
 dataw_caedmon_warning.001.desc: "Косые взгляды. Резкие слова. \n\nСо дня коронации я [Select_CString(ROOT.Char.IsFemale, 'привыкла', 'привык' )] к этому при своём дворе. Казалось бы, после стольких лет правления люди должны были смириться с новым порядком, но этого не произошло. \n\nПерехваченные письма говорят о растущем недовольстве моей властью. Теперь даже семья опасается за свою жизнь. \n\nНаконец мне удаётся застать двух сплетничающих придворных, считавших, что их никто не слышит. Под страхом смерти я велю им раскрыть свои тайны, но почти ничего полезного узнать не удаётся."
 dataw_caedmon_warning.001.opt.a: "Они умерли быстро, но мучительно."
 dataw_caedmon_warning.001.opt.a.tooltip: "Голоса не умолкают — они лишь звучат там, #N где вы их не слышите...#!"

 dataw_caedmon_warning.002.tit: "Открытый вызов"
 dataw_caedmon_warning.002.desc: "«У Ферелдена нет [Select_CString(ROOT.Char.IsFemale, 'королевы', 'короля' )]!» \n\nВоздух застыл, а крик всё ещё эхом разносится по длинным залам дворца. \n\nМежду ведущими к моему престолу галереями стоит одинокий седой старик и направляет меч прямо на меня. \n\nСтража скручивает его за считаные мгновения. Увы, в схватке мятежник каким-то образом получает смертельную рану и истекает кровью на глазах у придворных. С последним вздохом он произносит: \n\n«Я умираю свободным человеком. А вы?» \n\nОт человека к человеку ползут шепотки, и время от времени в мою сторону летят кинжалы. Неважно. Я — [Select_CString(ROOT.Char.IsFemale, 'их королева', 'их король' )]. Они умолкнут. \n\nТакова моя воля."
 dataw_caedmon_warning.002.opt.a: "Как они смеют оспаривать мою власть!"
 dataw_caedmon_warning.002.opt.a.tooltip: "Напряжение почти осязаемо: #N моя власть балансирует на острие ножа...#!"







####### REDCLIFFE STUFF ############
 DATAW_redcliffe_events.01.tit: "Предложение из Денерима"
 DATAW_redcliffe_events.01.desc: "Двор бурлит от новостей. [caedmonliege.GetFirstName] [Select_CString(caedmonliege.IsFemale, 'прислала', 'прислал' )] Редклифу требование покориться. \n\nМногие говорят, что время независимого Редклифа миновало и ради выживания нам следует проявить смирение перед лицом неминуемой гибели. \n\nДругие советуют показать силу. Они наперебой напоминают мне, что замок Редклиф никогда не покорялся чужеземцам — и не покорится впредь."
 DATAW_redcliffe_events.01.opt.a: "Пусть возобладает благоразумие."
 DATAW_redcliffe_events.01.opt.a.tooltip: "Сообщить [Select_CString(caedmonliege.IsFemale, 'мнимой королеве', 'мнимому королю' )], что мы поступаем к [Select_CString(caedmonliege.IsFemale, 'ней', 'нему' )] на службу."
 DATAW_redcliffe_events.01.opt.b: "Замки не трепещут от страха."
 DATAW_redcliffe_events.01.opt.b.tooltip: "Железо есть не только в этих холмах, но и в сердцах их жителей."



######### DEATH EVENTS ###########
 dataw_caedmon_death.001.tit: "Смерть завоевателя"
 dataw_caedmon_death.001.desc: "Кэдмон мёртв, а вместе с ним уходит в небытие мечта об объединении державы [GetTitleByKey('e_ferelden').GetBaseNameNoTier]. \n\nПохоже, роду Дейна не суждено было править единым народом клейнов, как все полагали. \n\nТеперь многие ждут первого удобного случая освободиться от моей власти. Надежды собственными силами объединить эти земли почти не осталось."
 dataw_caedmon_death.001.opt.a: "Горе несбывшемуся!"
 dataw_caedmon_death.001.opt.a.tooltip: "Ваша держава распадётся; у вас останутся лишь верные земли вокруг эрлинга Денерима."
 dataw_caedmon_death.001.opt.a.custom_tooltip: "Все титулы уровня королевства будут уничтожены, а вассалы за пределами эрлинга Денерима обретут независимость!"

 dataw_caedmon_death.002.tit: "Война за корону"
 dataw_caedmon_death.002.desc: "Кэдмон мёртв, и стервятники уже кружат над его престолом. \n\nЗаконность власти, завоёванная в тяжёлых войнах с непокорными, теперь ничего не значит. Вместе с последним вздохом Кэдмона исчезла и моя претензия на престол державы [GetTitleByKey('k_ferelden').GetBaseNameNoTier]. \n\nМногие вассалы сохранили верность лишь из страха перед его славой, а за пределами моих исконных земель уже ищут способ избавиться от моей власти."
 dataw_caedmon_death.002.opt.a: "Горе несбывшемуся!"
 dataw_caedmon_death.002.opt.a.tooltip: "Ваша держава распадётся; у вас останутся лишь верные земли вокруг тэйрнира Денерима."
 dataw_caedmon_death.002.opt.a.custom_tooltip: "Все титулы уровня королевства, кроме Денерима, будут уничтожены, а вассалы за пределами тэйрнира Денерима обретут независимость!"





