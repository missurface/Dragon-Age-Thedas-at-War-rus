l_russian:
  DATAW_sack_of_val_royeaux_events.0002.tit: "Разграбление провинции [county.GetProvince.GetNameNoTooltip]"
  DATAW_sack_of_val_royeaux_events.0002.desc: "Наконец стены пробиты.\nНаши войска захватили владение [barony.GetNameNoTierNoTooltip] в провинции [county.GetProvince.GetName], и солдаты уже рассеялись по всему городу.\n\nДо меня доходят путаные донесения о разграбленных винных погребах, убитых мирных жителях и бесчисленных дворцах, церквях и домах, охваченных огнём.\nТеперь армия подчиняется мне лишь на словах, всецело отдавшись разорению богатого города."
  DATAW_sack_of_val_royeaux_events.0002.a: "Они сами навлекли это на себя."
  DATAW_sack_of_val_royeaux_events.0002.a.custom_desc: "@warning_icon! #X Некому сдержать разорение города: последствия будут тяжёлыми, восстановление займёт годы, а большинство людей возненавидит вас.#!"
  DATAW_sack_of_val_royeaux_events.0002.a.custom_desc_2: "[Concept('opinion','Мнение')|E] каждого персонажа, который не сражается на вашей стороне, о #V вас#! снижается на #N 30#!"
  DATAW_sack_of_val_royeaux_events.0002.a.custom_desc_3: "[Concept('opinion','Мнение')|E] каждого персонажа со свойством [GetTrait('zealous').GetName( GetNullCharacter )] или [GetTrait('sadistic').GetName( GetNullCharacter )] о #V вас#! повышается на #P 30#!"
  DATAW_sack_of_val_royeaux_events.0002.a.custom_desc_4: "#V Вы#! [Concept('imprison','заключите в тюрьму')|E] значительную часть двора персонажа [orlesian_ruler.GetFirstNameNoTooltip]"
  DATAW_sack_of_val_royeaux_events.0002.a.custom_desc_5: "#V Вы#! [Concept('execute','казните')|E] значительную часть двора персонажа [orlesian_ruler.GetFirstNameNoTooltip]"
  DATAW_sack_of_val_royeaux_events.0002.b: "Принесите мне их головы и всё, чем они владели."
  DATAW_sack_of_val_royeaux_events.0002.b.custom_desc: "@warning_icon! #X По вашему приказу разрушения и людские потери окажутся гораздо серьёзнее, а вы получите и золото, и всеобщую ненависть.#!"
  DATAW_sack_of_val_royeaux_events.0002.b.custom_desc_2: "[Concept('opinion','Мнение')|E] каждого персонажа, который не сражается на вашей стороне, о #V вас#! снижается на #N 30#!"
  DATAW_sack_of_val_royeaux_events.0002.b.custom_desc_3: "[Concept('opinion','Мнение')|E] каждого персонажа на вашей стороне со свойством [GetTrait('zealous').GetName( GetNullCharacter )] или [GetTrait('sadistic').GetName( GetNullCharacter )] о #V вас#! повышается на #P 60#!"
  DATAW_sack_of_val_royeaux_events.0002.b.custom_desc_4: "#V Вы#! [Concept('execute','казните')|E] большую часть двора персонажа [orlesian_ruler.GetFirstNameNoTooltip]"
  DATAW_sack_of_val_royeaux_events.0002.c: "Не станем дикарями, которыми они нас называют."
  DATAW_sack_of_val_royeaux_events.0002.c.custom_desc: "Благодаря вашему вмешательству город пострадает меньше и многие жизни будут спасены, хотя люди всё равно будут вспоминать о разграблении с ужасом."
  DATAW_sack_of_val_royeaux_events.0002.c.custom_desc_2: "[Concept('opinion','Мнение')|E] каждого персонажа со свойством [GetTrait('zealous').GetName( GetNullCharacter )] или [GetTrait('sadistic').GetName( GetNullCharacter )] о #V вас#! снижается на #N 15#!"
  DATAW_sack_of_val_royeaux_events.0002.c.custom_desc_3: "[Concept('opinion','Мнение')|E] каждого участвующего в войне персонажа со свойством [GetTrait('compassionate').GetName( GetNullCharacter )] о #V вас#! повышается на #P 40#!"
  DATAW_sack_of_val_royeaux_events.0002.c.custom_desc_4: "#V Вы#! [Concept('imprison','заключите в тюрьму')|E] небольшую часть двора персонажа [orlesian_ruler.GetFirstNameNoTooltip]"
  DATAW_sack_of_val_royeaux_events.0002.c.custom_desc_5: "#V Вы#! [Concept('execute','казните')|E] небольшую часть двора персонажа [orlesian_ruler.GetFirstNameNoTooltip]"
  DATAW_sack_of_val_royeaux_events.0002.toast.tit: "Разграбление провинции [county.GetProvince.GetNameNoTooltip]"
  DATAW_sack_of_val_royeaux_events.0002.toast.desc: "Владение [barony.GetNameNoTierNoTooltip] в провинции [county.GetProvince.GetName] пало."

  DATAW_sack_of_val_royeaux_events.0003.tit: "Разграбление провинции [county.GetProvince.GetNameNoTooltip]: похищенная реликвия"
  DATAW_sack_of_val_royeaux_events.0003.desc: "Пока город продолжает гореть и умирать, вдали раздаются крики. Это голос [Select_CString(orlesian_courtier.IsFemale, 'женщины', 'мужчины' )], [Select_CString(orlesian_courtier.IsFemale, 'окружённой', 'окружённого' )] множеством людей. Повернув за угол, я вижу источник шума: [Select_CString(orlesian_courtier.IsFemale, 'императорскую придворную', 'императорского придворного' )] со всех сторон обступили наши солдаты.\n\n«Прошу!» — кричит [orlesian_courtier.GetFirstNameNoTooltip].\n\n«Я — [orlesian_courtier.GetName], и не желаю вам зла! Я хочу лишь спасти реликвию [epic.GetName] от уничтожения! Это бесценный артефакт, и [ROOT.Char.GetCulture.GetName] наверняка понимают цену истории!»"
  DATAW_sack_of_val_royeaux_events.0003.a: "За деньги я отпущу вас вместе с этим мечом."
  DATAW_sack_of_val_royeaux_events.0003.b: "Идёт война, [orlesian_courtier.GetName]. Но беречь реликвию придётся из темницы."
  DATAW_sack_of_val_royeaux_events.0003.b.success: "[orlesian_courtier.GetFirstName|U] принимает ваше предложение"
  DATAW_sack_of_val_royeaux_events.0003.b.failure: "[orlesian_courtier.GetFirstName|U] погибает в суматохе"
  DATAW_sack_of_val_royeaux_events.0003.b.desc.s: "[orlesian_courtier.GetFirstNameNoTooltip] видит в вашем предложении возможность сохранить бесценную реликвию и соглашается"
  DATAW_sack_of_val_royeaux_events.0003.b.desc.f: "В смешении страха, бегства и жажды крови ваши солдаты убивают [Select_CString(orlesian_courtier.IsFemale, 'придворную', 'придворного' )] и забирают меч себе"
  DATAW_sack_of_val_royeaux_events.0003.c: "Теперь ваша судьба только в ваших руках."
  DATAW_sack_of_val_royeaux_events.0003.c_tt: "[knight.GetFirstName] сойдётся в смертельном поединке с персонажем [orlesian_courtier.GetFirstName]"
  DATAW_sack_of_val_royeaux_events.0003.c.desc.k: "[knight.GetFirstName] одерживает победу"
  DATAW_sack_of_val_royeaux_events.0003.c.desc.o: "[orlesian_courtier.GetFirstName] одерживает победу"
  DATAW_sack_of_val_royeaux_events.0003.d: "Принесите мне этот меч. Немедленно."
  DATAW_sack_of_val_royeaux_events.0003.d.success: "Ваши солдаты возвращают меч"
  DATAW_sack_of_val_royeaux_events.0003.d.failure: "Несмотря на приказ, ваши солдаты отказываются"
  DATAW_sack_of_val_royeaux_events.0003.d.desc.s: "Солдаты повинуются приказу и отдают вам меч"
  DATAW_sack_of_val_royeaux_events.0003.d.desc.f: "Несмотря на ваш приказ, солдаты отказываются отдать меч"
  
  DATAW_sack_of_val_royeaux_events.0004.tit: "Разграбление провинции [county.GetProvince.GetNameNoTooltip]: осквернение Помазанника"
  DATAW_sack_of_val_royeaux_events.0004.desc:"Луны уже высоко в небе, но разграблению не видно конца. Мои солдаты двинулись к одному из самых священных мест города — гробнице императора [kordillus_i.GetFirstName] Помазанника, основателя Орлея и Орлесианской Церкви.\n\nЯ следую за ними и вхожу сквозь разбитые двери гробницы. Внутри стоит [random_dalish_knight_2.GetFirstName] с поднятым мечом и жадно разглядывает её богатства. Посреди заботливо обустроенного зала находится урна, хранящая [ashes.GetName], рядом на постаменте лежит [emperor_shield.GetName], а неподалёку — [scepter.GetName] и [anointed_armor.GetName], некогда принадлежавшие императору.\n\nПоднятый клинок уже занесён над прахом Помазанника. Если я не вмешаюсь, гробнице этой великой исторической личности грозит полное уничтожение."
  DATAW_sack_of_val_royeaux_events.0004.a.custom_desc_2: "[Concept('opinion','Мнение')|E] каждого персонажа, который не сражается на вашей стороне, о #V вас#! дополнительно снижается на #N 30#!"
  DATAW_sack_of_val_royeaux_events.0004.a: "Нет нужды останавливать происходящее."
  DATAW_sack_of_val_royeaux_events.0004.a.custom_desc: "[Concept('opinion','Мнение')|E] каждого персонажа со свойством [GetTrait('zealous').GetName( GetNullCharacter )] или [GetTrait('sadistic').GetName( GetNullCharacter )] о #V вас#! снижается на #N 30#!"
  DATAW_sack_of_val_royeaux_events.0004.b: "Место упокоения столь великой личности неприкосновенно!"
  DATAW_sack_of_val_royeaux_events.0004.b.desc.s: "Вдохновлённые вашими словами солдаты проявляют сдержанность и оставляют гробницу нетронутой"
  DATAW_sack_of_val_royeaux_events.0004.b.desc.f: "Приняв ваши слова за слабость, солдаты начинают крушить гробницу и хранящиеся в ней реликвии"
  DATAW_sack_of_val_royeaux_events.0004.b.success: "Ваши солдаты оставляют гробницу нетронутой"
  DATAW_sack_of_val_royeaux_events.0004.b.failure: "Ваши солдаты уничтожают гробницу и хранящиеся в ней реликвии"
  DATAW_sack_of_val_royeaux_events.0004.c: "Всё в этой комнате принадлежит мне!"
  DATAW_sack_of_val_royeaux_events.0004.c.custom_desc_2: "[Concept('opinion','Мнение')|E] каждого персонажа, который не сражается на вашей стороне, о #V вас#! дополнительно снижается на #N 50#!"

  DATAW_sack_of_val_royeaux_events.0005.tit: "Разграбление провинции [county.GetProvince.GetNameNoTooltip]: восходящее пламя"
  DATAW_sack_of_val_royeaux_events.0005.desc:"С начала разграбления минуло несколько часов. В войсках постепенно восстанавливается порядок, но пламя всё выше поднимается над городом и несёт новые разрушения. Когда восходит солнце и пожар наконец угасает, передо мной открывается картина столь полного опустошения, что никакими словами её не описать.\n\nМногие горожане уже бежали в сельские края и разносят повсюду рассказы о Палаче Вал Руайо и моей демонической армии."
  DATAW_sack_of_val_royeaux_events.0005.a: "Что бы я ни [Select_CString(ROOT.Char.IsFemale, 'сделала', 'сделал' )], это имя останется со мной."
  
  shemlen: "шемлен"
  shemlen_plural: "шемлены"