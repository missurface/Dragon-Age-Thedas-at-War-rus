l_russian:
  DATAW_sack_of_val_royeaux_events.0002.tit: "The Sack of [county.GetProvince.GetNameNoTooltip]"
  DATAW_sack_of_val_royeaux_events.0002.desc: "Finally, the walls have been breached.\nThe [barony.GetNameNoTierNoTooltip] of [county.GetProvince.GetName] has fallen to our hands, and already, our soldiers have let themselves loose all around the city.\n\nConfused reports of pillaged wine cellars, of slaughter of innocents, as well as burning of countless palaces, chantries and homes have been reported to me.\nThe army now only theoretically answers to me, as it is completely lost in the rampage of such a rich city."
  DATAW_sack_of_val_royeaux_events.0002.a: "They brought it on themselves."
  DATAW_sack_of_val_royeaux_events.0002.a.custom_desc: "@warning_icon! #X The unchecked damage to the city will be considerable, taking years to rebuild and earning you the ire of most humans.#!"
  DATAW_sack_of_val_royeaux_events.0002.a.custom_desc_2: "Every character who is not on your side loses #N 30#! [opinion|E] of #V you#!"
  DATAW_sack_of_val_royeaux_events.0002.a.custom_desc_3: "Every [GetTrait('zealous').GetName( GetNullCharacter )] or [GetTrait('sadistic').GetName( GetNullCharacter )] character gains #P 30#! [opinion|E] of #V you#!"
  DATAW_sack_of_val_royeaux_events.0002.a.custom_desc_4: "#V You#! will [imprison|E] significant portion of [orlesian_ruler.GetFirstNamePossessiveNoTooltip] court"
  DATAW_sack_of_val_royeaux_events.0002.a.custom_desc_5: "#V You#! will [execute|E] significant portion of [orlesian_ruler.GetFirstNamePossessiveNoTooltip] court"
  DATAW_sack_of_val_royeaux_events.0002.b: "Bring me their heads, and everything they own."
  DATAW_sack_of_val_royeaux_events.0002.b.custom_desc: "@warning_icon! #X With your demand, the damage and loss of life will be much more considerable, earning you gold and ire alike.#!"
  DATAW_sack_of_val_royeaux_events.0002.b.custom_desc_2: "Every character who is not on your side loses #N 30#! [opinion|E] of #V you#!"
  DATAW_sack_of_val_royeaux_events.0002.b.custom_desc_3: "Every [GetTrait('zealous').GetName( GetNullCharacter )] or [GetTrait('sadistic').GetName( GetNullCharacter )] character on your side gains #P 60#! [opinion|E] of #V you#!"
  DATAW_sack_of_val_royeaux_events.0002.b.custom_desc_4: "#V You#! will [execute|E] greater portion of [orlesian_ruler.GetFirstNamePossessiveNoTooltip] court"
  DATAW_sack_of_val_royeaux_events.0002.c: "We should not become the savages they claim we are."
  DATAW_sack_of_val_royeaux_events.0002.c.custom_desc: "Thanks to your intervention, the city will see less damage and lives will be spared, although people will still look at the sack with horror."
  DATAW_sack_of_val_royeaux_events.0002.c.custom_desc_2: "Every [GetTrait('zealous').GetName( GetNullCharacter )] or [GetTrait('sadistic').GetName( GetNullCharacter )] character loses #N 15#! [opinion|E] of #V you#!"
  DATAW_sack_of_val_royeaux_events.0002.c.custom_desc_3: "Every [GetTrait('compassionate').GetName( GetNullCharacter )] character involved in the war gains #P 40#! [opinion|E] of #V you#!"
  DATAW_sack_of_val_royeaux_events.0002.c.custom_desc_4: "#V You#! will [imprison|E] small portion of [orlesian_ruler.GetFirstNamePossessiveNoTooltip] court"
  DATAW_sack_of_val_royeaux_events.0002.c.custom_desc_5: "#V You#! will [execute|E] small portion of [orlesian_ruler.GetFirstNamePossessiveNoTooltip] court"
  DATAW_sack_of_val_royeaux_events.0002.toast.tit: "The Sack of [county.GetProvince.GetNameNoTooltip]"
  DATAW_sack_of_val_royeaux_events.0002.toast.desc: "[barony.GetNameNoTierNoTooltip] of [county.GetProvince.GetName] has fallen."

  DATAW_sack_of_val_royeaux_events.0003.tit: "The Sack of [county.GetProvince.GetNameNoTooltip]: A Stolen Relic"
  DATAW_sack_of_val_royeaux_events.0003.desc: "As the city continues to burn and die, I hear some cries in the distance. The cries of a [orlesian_courtier.GetWomanMan] surrounded by many others. As I turn around the corner and see the source of the yells, I can see an imperial courtier, surrounded by all sides by our soldiers.\n\n"Please!", [orlesian_courtier.GetSheHe] yells.\n\n"I am [orlesian_courtier.GetName], and I wish you no harm! I only desire to save the [epic.GetName] from destruction! It is an artefact of countless value, and no doubt the [ROOT.Char.GetCulture.GetName] understand the value of history!""
  DATAW_sack_of_val_royeaux_events.0003.a: "In exchange for money, I will let you go free with this sword."
  DATAW_sack_of_val_royeaux_events.0003.b: "This is war, [orlesian_courtier.GetName], you'll preserve your artifact from a cell."
  DATAW_sack_of_val_royeaux_events.0003.b.success: "[orlesian_courtier.GetFirstName|U] accepts your offer"
  DATAW_sack_of_val_royeaux_events.0003.b.failure: "[orlesian_courtier.GetFirstName|U] is slain amidst confusion"
  DATAW_sack_of_val_royeaux_events.0003.b.desc.s: "The courtier sees your offer as a way to preserve the priceless artefact, and accepts your offer"
  DATAW_sack_of_val_royeaux_events.0003.b.desc.f: "In a confused mix of fright, flight and bloodlust, your soldiers kill the courtier and take the sword for themselves"
  DATAW_sack_of_val_royeaux_events.0003.c: "Your fate is in your own hands, fool."
  DATAW_sack_of_val_royeaux_events.0003.c_tt: "[knight.GetFirstName] will enter into a duel to the death against [orlesian_courtier.GetFirstName]"
  DATAW_sack_of_val_royeaux_events.0003.c.desc.k: "[knight.GetFirstName] is victorious"
  DATAW_sack_of_val_royeaux_events.0003.c.desc.o: "[orlesian_courtier.GetFirstName] is victorious"
  DATAW_sack_of_val_royeaux_events.0003.d: "Bring this sword to me. Now."
  DATAW_sack_of_val_royeaux_events.0003.d.success: "Your soldiers give the sword back"
  DATAW_sack_of_val_royeaux_events.0003.d.failure: "Your soldiers refuse despite your command"
  DATAW_sack_of_val_royeaux_events.0003.d.desc.s: "The soldiers obey your order and give the sword back to you"
  DATAW_sack_of_val_royeaux_events.0003.d.desc.f: "Despite your command, the soldiers refuse to give you the sword"
  
  DATAW_sack_of_val_royeaux_events.0004.tit: "The Sack of [county.GetProvince.GetNameNoTooltip]: The Anointed’s Violation"
  DATAW_sack_of_val_royeaux_events.0004.desc:"The moons are now high in the sky as the sack shows no sign of stopping, and my soldiers have started advancing towards one of the most sacred places of the city: the tomb of Emperor [kordillus_i.GetFirstName] the Anointed, founder of Orlais and the Orlesian Chantry.\n\nAs I follow them and move inside the broken down doors of the tomb, I see [random_dalish_knight_2.GetFirstName], sword raised, looking at the riches of the tomb with envy. In the middle of the lovingly built room, I can see the urn containing [ashes.GetName], alongside the [emperor_shield.GetName] on a pedestal, as well as the [scepter.GetName] and the [anointed_armor.GetName], all possessions of the former Emperor.\n\nI see the sword of my knight raising itself to fall on the Anointed’s ashes, and I understand the level of destruction that is about to happen to the tomb of such an historic figure if I do not intervene."
  DATAW_sack_of_val_royeaux_events.0004.a.custom_desc_2: "Every character who is not on your side loses another #N 30#! [opinion|E] of #V you#!"
  DATAW_sack_of_val_royeaux_events.0004.a: "There is no need to stop such an act."
  DATAW_sack_of_val_royeaux_events.0004.a.custom_desc: "Every [GetTrait('zealous').GetName( GetNullCharacter )] or [GetTrait('sadistic').GetName( GetNullCharacter )] character loses #N 30#! [opinion|E] of #V you#!"
  DATAW_sack_of_val_royeaux_events.0004.b: "Such a major figure’s resting place must be respected!"
  DATAW_sack_of_val_royeaux_events.0004.b.desc.s: "Inspired by your words, the soldiers show restraint and leave the tomb untouched"
  DATAW_sack_of_val_royeaux_events.0004.b.desc.f: "Perceiving weakness in your words, your soldiers begin actively destroying the tomb and its artefacts"
  DATAW_sack_of_val_royeaux_events.0004.b.success: "Your soldiers leave the tomb untouched"
  DATAW_sack_of_val_royeaux_events.0004.b.failure: "Your soldiers destroy the tomb and its artefacts"
  DATAW_sack_of_val_royeaux_events.0004.c: "Everything in this room is mine!"
  DATAW_sack_of_val_royeaux_events.0004.c.custom_desc_2: "Every character who is not on your side loses another #N 50#! [opinion|E] of #V you#!"

  DATAW_sack_of_val_royeaux_events.0005.tit: "The Sack of [county.GetProvince.GetNameNoTooltip]: The Fire Rises"
  DATAW_sack_of_val_royeaux_events.0005.desc:"Hours have passed since the sack began, and as order has been slowly regained amongst the troops, the fire has risen throughout the city, bringing evermore destruction. As the sun rises and the fire finally dies, I see a scene of utter desolation before me, that no amount of words would be enough to describe.\n\nAlready, many of the town’s inhabitants have fled to the countryside, and spread the story of the Butcher of Val Royeaux and [ROOT.Char.GetHerHis] demonic army."
  DATAW_sack_of_val_royeaux_events.0005.a: "No matter what I do, this name will stick regardless."
  
  shemlen: "shemlen"
  shemlen_plural: "shemlens"