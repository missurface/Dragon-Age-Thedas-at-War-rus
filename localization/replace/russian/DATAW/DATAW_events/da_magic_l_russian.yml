 DATAW_secret_events.0101.positive_1.desc: "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] публично обвиняет [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] в [Concept('apostate','отступничестве')|E]!"
 DATAW_secret_events.0101.worried.desc: "\n\nМне следует сдерживать свою [Concept('dataw_magic','магию')|E], чтобы она не взяла надо мной верх. Кто знает, на кого они укажут пальцем в следующий раз..."
 DATAW_secret_events.0101.positive_2.desc: "\n\nНе понимаю, к чему весь этот шум. [Concept('dataw_magic','Магия')|E] — не какая-то противоестественная хворь..."
 DATAW_secret_events.0101.b: "[owner.GetFirstNameNoTooltip] ответит за свои преступления. Стража!"

 DATAW_secret_events.0106.likes_negative: "Не может быть... Никогда бы не подумать!"
