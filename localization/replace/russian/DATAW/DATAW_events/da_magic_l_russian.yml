# Spell modifier loc 
 dataw_spell_rock_armor_modifier: "Каменный доспех"
 dataw_spell_rock_armor_modifier_desc: "Слой камня заключает персонажа в панцирь, защищающий от урона, пока действует заклинание.\n#indent_newline:3 $BULLET$Снижает риск погибнуть или попасть в плен в [Concept('battles','битвах')|E], в которых участвуете вы оба#!#!"
 dataw_spell_inferno_modifier: "Геенна огненная"
 dataw_spell_inferno_modifier_desc: "Этот могущественный маг обрушивает на врагов разрушительные заклинания и шквал огненных шаров."
 dataw_spell_rejuvenate_modifier: "Очищение"
 dataw_spell_rejuvenate_modifier_desc: "На персонажа наложено заклинание «Очищение», временно укрепляющее здоровье."
 dataw_spell_life_warded_modifier: "Под защитой Хранителя жизни"
 dataw_spell_life_warded_modifier_desc: "Заклинание «Хранитель жизни» продлило жизнь персонажа, и теперь его нельзя применить к этой цели повторно."
 dataw_spell_regenerated_modifier: "Недавняя регенерация"
 dataw_spell_regenerated_modifier_desc: "Рану или болезнь персонажа исцелили могущественным заклинанием. Некоторое время его нельзя будет применить к этой цели повторно."
 dataw_spell_stone_fist_modifier: "Каменный кулак"
 dataw_spell_stone_fist_modifier_desc: "Этот персонаж швыряет в цель каменный кулак, сбивая её с ног и снижая доблесть."
 dataw_spell_heroic_offense_modifier: "Героическое нападение"
 dataw_spell_heroic_offense_modifier_desc: "Персонаж получает мощные усиления атаки."
 dataw_spell_haste_modifier: "Ускорение"
 dataw_spell_haste_modifier_desc: "Скорость путешествий персонажа и сопровождающей свиты временно увеличена."
 dataw_spell_heroic_defense_modifier: "Героическая оборона"
 dataw_spell_heroic_defense_modifier_desc: "Персонаж получает мощные усиления защиты."
 dataw_spell_winters_grasp_modifier: "Ледяная хватка"
 dataw_spell_winters_grasp_modifier_desc: "Ледяная хватка сковывает цель, снижая скорость путешествий, сопротивление болезням и доблесть."
 dataw_spell_fire_blast_modifier: "Пламенная вспышка"
 dataw_spell_fire_blast_modifier_desc: "Конус пламени поражает цель, снижая здоровье, доблесть и сопротивление болезням."
 dataw_spell_frost_weapons_modifier: "Ледяное оружие"
 dataw_spell_frost_weapons_modifier_desc: "Оружие свиты покрывается льдом, что повышает доблесть персонажа и эффективность рыцарей."
 dataw_spell_arcane_bolt_modifier: "Волшебная стрела"
 dataw_spell_arcane_bolt_modifier_desc: "Цель поражает сгусток бесформенной тайной энергии, нанося ей ранение."
#  dataw_spell_dispel_magic_modifier: "Dispel Magic"
#  dataw_spell_dispel_magic_modifier_desc: "Remove all magical effects from your target, including beneficial and harmful ones."
 dataw_spell_mana_drain_modifier: "Вытягивание маны"
 dataw_spell_mana_drain_modifier_desc: "Из цели вытягивается мана."
 dataw_spell_crushing_prison_modifier: "Дробящая темница"
 dataw_spell_crushing_prison_modifier_desc: "Цель заключена в постоянно сжимающуюся магическую темницу, которая значительно снижает её здоровье, доблесть и скорость путешествий."
 dataw_spell_weakness_modifier: "Слабость"
 dataw_spell_weakness_modifier_desc: "Цель ослаблена, а её доблесть и сопротивление болезням снижены."
 dataw_spell_life_ward_modifier: "Хранитель жизни"
 dataw_spell_life_ward_modifier_desc: "Защитный оберег не позволяет цели умереть ни по какой причине в течение пяти лет. Заклинание можно наложить на каждую цель только один раз."
 dataw_spell_chain_lightning_modifier: "Цепная молния"
 dataw_spell_chain_lightning_modifier_desc: "Выпущенная молния перескакивает между несколькими целями, значительно снижая их здоровье, доблесть и эффективность рыцарей."
 dataw_spell_barrier_modifier: "Барьер"
 dataw_spell_barrier_modifier_desc: "На короткое время персонаж и рыцари свиты защищены от всех источников урона, кроме болезней."
 dataw_spell_spell_wisp_modifier: "Волшебный огонёк"
 dataw_spell_spell_wisp_modifier_desc: "Призванный огонёк повышает магическое мастерство ценой маны.$dataw_spell_wisp_modifier_description_prowess_add$"
 dataw_spell_walking_bomb_modifier: "Ходячая бомба"
 dataw_spell_walking_bomb_modifier_desc: "В цель помещена магическая бомба, на короткое время снижающая её здоровье. Если цель умрёт, пока заклинание действует, бомба взорвётся и тяжело ранит находящихся рядом."
 dataw_spell_mind_blast_modifier: "Взрыв разума"
 dataw_spell_mind_blast_modifier_desc: "Волна телекинетической энергии оглушает противника."
 dataw_spell_lighting_modifier: "Молния"
 dataw_spell_lighting_modifier_desc: "Цель поражает молния, нанося ей ранение и снижая доблесть."

