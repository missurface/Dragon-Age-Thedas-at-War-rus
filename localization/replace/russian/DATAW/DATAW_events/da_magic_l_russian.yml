 trait_magical_ability_5: "Исключительные магические способности"

 trait_magical_ability_good_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] обладает благословенным даром магии"
 trait_magical_ability_bad_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] несёт на себе проклятие греховного дара магии"
 trait_magical_ability_1_desc: "Магические способности этого персонажа: $trait_magical_ability_1$."
 trait_magical_ability_2_desc: "Магические способности этого персонажа: $trait_magical_ability_2$."
