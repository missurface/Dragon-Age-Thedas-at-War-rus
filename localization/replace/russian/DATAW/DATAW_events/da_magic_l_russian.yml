 #LIFESTYLE trait
 trait_circle_mage: "[Concept('mage','Маг')|E] [Concept('circle','Круга')|E]"
 trait_circle_mage_1: "Ученик"
 trait_circle_mage_2: "Чародей"
 trait_circle_mage_desc: "Этот персонаж состоит в ордене обученных магов."
 trait_circle_mage_character_desc: "[ROOT.GetCharacter.GetFirstName] состоит в ордене обученных магов."
 trait_blood_mage: "[Concept('mage','Маг')|E] крови"
 trait_blood_mage_desc: "Этот персонаж активно изучает опасную и запретную [Concept('dataw_magic','магию крови')|E]."
 trait_blood_mage_character_desc: "[ROOT.GetCharacter.GetFirstName] активно изучает опасную и запретную [Concept('dataw_magic','магию крови')|E]."
 trait_apostate: "[Concept('mage','Маг-самоучка')|E]"
 trait_apostate_desc: "Этот персонаж не проходил обучения и владеет силами, развитыми вне признанных учений."
 trait_apostate_character_desc: "[ROOT.GetCharacter.GetFirstName] не [Select_CString(ROOT.GetCharacter.IsFemale, 'проходила', 'проходил' )] обучения и владеет силами, развитыми вне признанных учений."
 trait_elven_mage: "[Concept('mage','Эльфийский маг')|E]"
 trait_elven_mage_1: "$trait_elven_mage$"
 trait_elven_mage_good: "Первый"
 trait_elven_mage_bad: "Хранитель"
 trait_elven_mage_desc: "Этот персонаж управляет силами природы, уделяя особое внимание травничеству и исцелению."
 trait_elven_mage_character_desc: "[ROOT.GetCharacter.GetFirstName] управляет силами природы, уделяя особое внимание травничеству и исцелению."
 trait_tranquil: "Усмирённый"
 trait_tranquil_desc: "Над этим персонажем провели [Concept('rite_of_tranquility','Ритуал Усмирения')|E]."
 trait_tranquil_character_desc: "Над персонажем [ROOT.GetCharacter.GetFirstName] провели [Concept('rite_of_tranquility','Ритуал Усмирения')|E]."
 trait_lyrium_addict: "Зависимость от [Concept('lyrium','лириума')|E]"
 trait_lyrium_addict_desc: "Для этого персонажа [lyrium|E] стал не только источником силы, но и предметом первой необходимости, породив постоянную жажду вещества."
 trait_lyrium_addict_character_desc: "[lyrium|E] стал для персонажа [ROOT.GetCharacter.GetFirstName] не только источником силы, но и предметом первой необходимости, породив постоянную жажду вещества."
 trait_apostate: "Отступник"
 trait_apostate_desc: "Этот персонаж незаконно практикует [Concept('dataw_magic','магию')|E] без надзора официально признанной организации."
 trait_apostate_character_desc: "[ROOT.GetCharacter.GetFirstName] незаконно практикует [Concept('dataw_magic','магию')|E] без надзора официально признанной организации."
 trait_templar: "Храмовник"
 trait_templar_desc: "Этот персонаж состоит в [Concept('templar','Ордене храмовников')|E], владеет боевыми приёмами и умеет употреблять [Concept('lyrium','лириум')|E] для подавления магических способностей."
 trait_templar_character_desc: "[ROOT.GetCharacter.GetFirstName] состоит в [Concept('templar','Ордене храмовников')|E], владеет боевыми приёмами и умеет употреблять [Concept('lyrium','лириум')|E] для подавления магических способностей."
 trait_grey_warden: "Серый Страж"
 trait_grey_warden_desc: "Этот персонаж пережил [Concept('joining','Посвящение')|E] и теперь состоит в рядах [Concept('grey_warden','Серых Стражей')|E]."
 trait_grey_warden_character_desc: "[ROOT.GetCharacter.GetFirstName] [Select_CString(ROOT.GetCharacter.IsFemale, 'пережила', 'пережил' )] [Concept('joining','Посвящение')|E] и теперь состоит в рядах [Concept('grey_warden','Серых Стражей')|E]."
 the_call_grows_louder_message_title: "Песнь звучит всё громче..."
 trait_track_grey_warden: "Зов"
 trait_track_grey_warden_desc: "Зов"
 grey_warden_xp_gain_mult: "Прирост [Concept('trait_level_track_xp','опыта пути развития свойства')|E] «[GetTrait('grey_warden').GetName( GetNullCharacter )]»"
 trait_arcane_mage: "Тайная магия"
 trait_arcane_mage_desc: "Тайная [Concept('dataw_magic','магия')|E] черпает силу из глубочайших источников [Concept('fade','Тени')|E], защищая заклинателя и сокрушая врагов."
 trait_creation_mage: "Маг Созидания"
 trait_creation_mage_desc: "[Concept('mage','Маги')|E], обученные Созиданию, — бесценные союзники: они умеют лечить раны, укреплять товарищей и защищать их от наступающих врагов."
 trait_entropy_mage: "Маг Энтропии"
 trait_entropy_mage_desc: "Этот [Concept('mage','маг')|E] постигает хаотическую природу [Concept('fade','Тени')|E], искажает ткань вероятности и пленяет врагов ужасающими видениями."
 trait_primal_mage: "Маг стихий"
 trait_primal_mage_desc: "Этот [Concept('mage','маг')|E] повелевает землёй и небом, а также владеет стихиями огня и льда."
 trait_spirit_mage: "Маг Духа"
 trait_spirit_mage_desc: "[Concept('dataw_magic','Магия')|E] Духа потрясает врагов до глубины души, частично обходит сопротивляемость и особенно действенна против вражеских [Concept('mage','магов')|E]."
 trait_track_elven: "Эльфийские заклинания"
 trait_track_elven_desc: "В РАЗРАБОТКЕ"
 trait_track_blood: "Заклинания крови"
 trait_track_blood_desc: "Известные как «малефикары», [Concept('mage','маги крови')|E] внушают страх не только невероятной мощью своих заклинаний, но и способностью управлять разумом. [Concept('templar','Храмовники')|E] неустанно охотятся на них, однако, несмотря на все усилия Ордена, с каждым годом в Киркволле всё чаще прибегают к [Concept('dataw_magic','магии крови')|E]. Поговаривают, что беспощадная охота Ордена в отчаянии толкает благонамеренных отступников к магии крови, вынуждая их бороться за жизнь и свободу."
 trait_track_apostate: "Незарегистрированные заклинания"
 trait_track_apostate_desc: "В РАЗРАБОТКЕ"

