#  dataw_mage_court_enchanter_events.0001.fallback_reason.desc: "Мир полон опасностей, и даже [ROOT.Char.GetTitleTierName|l] и [Select_CString(ROOT.Char.IsFemale, 'её', 'его' )] [ROOT.Char.Custom('GetCourt')|l] не могут их избежать.\n\nКакое-то время ушло на расспросы, зато теперь у меня есть несколько подходящих кандидатур."
 dataw_mage_court_enchanter_events.0001.desc: "Мир полон опасностей, и даже [ROOT.Char.GetTitleTierName|l] и [Select_CString(ROOT.Char.IsFemale, 'её', 'его' )] [ROOT.Char.Custom('GetCourtierPlural')|l] не могут их избежать. По моему приказу слуги отыскали несколько подходящих кандидатур на роль придворного чародея."
#  dataw_mage_court_enchanter_events.0001.already_sick.desc: "Наконец слуги нашли несколько людей, которые вполне могут занять место придворного чародея. В любом случае привередничать сейчас не приходится."
