l_russian:
 DATAW_minor_decision.0001.tit: "Подходящая кандидатура"
 DATAW_minor_decision.0001.desc: "Похоже, мои приглашения привели на мой порог немало людей с боевым опытом. Многие откровенно лгали о своих навыках, и после их разоблачения внимания заслужили лишь три кандидатуры: [veteran01.GetFullName], [veteran02.GetFullName] и [veteran03.GetFullName]. У каждой свои особые умения, и теперь выбор за мной."
 DATAW_minor_decision.0001.opt.a: "Я возьму [Select_CString(veteran01.IsFemale, 'её', 'его' )] на службу — [veteran01.GetName]."
 DATAW_minor_decision.0001.opt.b: "[veteran02.GetName] кажется достойной кандидатурой."
 DATAW_minor_decision.0001.opt.c: "Без сомнений — [veteran03.GetName]."
 DATAW_minor_decision.0001.opt.d: "Я не выберу никого."
 # Исправление для martial_chivalry.6000
 martial_chivalry.6000.desc:0 "Леса всегда служили ценным местом для обучения. Всем известно: доблесть неизменно ищет новых приключений — злобного тирана, тайного испытания, невинного человека, которому нужна помощь.\n\nМне ещё не доводилось бывать здесь, в местности [church_province.GetTerrain.GetNameNoTooltip|l]. Быть может, поэтому внезапно открывшиеся руины кажутся испытанием отваги.\n\nПо всему видно, что [ROOT.Char.GetFaith.HouseOfWorship] забросили много десятилетий назад. Вместо стёкол окна затянула паутина. Сломанные стволы теперь служат скамьями. Когда я приближаюсь к прогнившей двери, несколько птиц вспархивают и улетают."