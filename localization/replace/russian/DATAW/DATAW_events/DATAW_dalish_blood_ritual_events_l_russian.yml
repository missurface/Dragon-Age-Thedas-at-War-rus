l_russian:
 # Event 1
 DATAW_dalish_blood_ritual_events.1.t: "Отчаянный ритуал"
 DATAW_dalish_blood_ritual_events.1.desc: "В последнее время жизнь при дворе стала невыносимой. Война складывается настолько плохо, что многие знатные эльфы уже признают: мы можем пережить то же, что много веков назад пережили наши предки из Арлатана. Мы проигрываем, и люди начинают задумываться об отчаянных мерах.\n\nПока очередной землевладелец жалуется на то, как война губит урожай, к трону уверенно приближаются четверо эльфов. Их решительность рождена тем же неотступным отчаянием, которое охватило всех нас.\n\n«Приветствую вас, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )]! — восклицает [Select_CString(ritual_cillian.IsFemale, 'та, что идёт впереди', 'тот, кто идёт впереди' )]. — Меня зовут [ritual_cillian.GetFirstName], а это мои соратники: [ritual_hedolen.GetFirstName], [ritual_bellara.GetFirstName] и [ritual_amylia.GetFirstName]. Все мы — прославленные [Concept('mage','маги')|E], и положение на войне глубоко тревожит нас. Но я знаю, как помочь».\n\nДвор умолкает, желая услышать предложение, и [ritual_cillian.GetFirstName] с новой уверенностью продолжает: «Мне известен ритуал, для которого потребуется [sulevin_blade.GetName]. С его помощью наша славная магическая знать сможет успешнее сражаться с ордой [Concept('shem','шемленов')|E]. Вы и несколько избранных будете творить заклинания с меньшими затратами сил и постоянно получать ценные знания о стратегии и военном искусстве».\n\nВокруг меня вспыхивают споры, а я думаю о том, что до сих пор осталось невысказанным: о цене ритуала. Все знают, что облегчить сотворение заклинаний можно лишь жертвоприношением, а обещанные «знания» способны прийти из крайне опасного источника. Неужели ради спасения Долов нам остаётся лишь слушать демонов и предаваться магии крови? Стоит ли ради одной родины превращаться в то самое зло, которое погубило другую?\n\n«Мы просим лишь о поддержке и вашем участии, [Select_CString(ROOT.Char.IsFemale, 'достославная', 'достославный' )] [ROOT.Char.GetTitleTierName]»."
 DATAW_dalish_blood_ritual_events.1.a: "Вы получите необходимую поддержку."
 DATAW_dalish_blood_ritual_events.1.a.desc: "Подготовка ритуала займёт около двух недель. Когда будут захвачены четыре человеческие жертвы и завершены остальные приготовления, можно будет начинать."
 DATAW_dalish_blood_ritual_events.1.a.toast: "Вы соглашаетесь провести ритуал"
 DATAW_dalish_blood_ritual_events.1.b: "Я не могу выделить средства на это предприятие."
 DATAW_dalish_blood_ritual_events.1.b.desc: "Даже без моей поддержки и участия они продолжат попытки провести ритуал."
 DATAW_dalish_blood_ritual_events.1.c: "Я не потерплю магию крови! Немедленно заключить их под стражу!"
 DATAW_dalish_blood_ritual_events.1.c.desc: "Заключение не позволит им завершить ритуал. Если они окажут сопротивление и погибнут в бою, угроза исчезнет наверняка. Такую войну нельзя выигрывать подобными средствами."
 DATAW_dalish_blood_ritual_events.1.c.submits: "Они решают сдаться на вашу милость"
 DATAW_dalish_blood_ritual_events.1.c.fights: "Они сопротивляются аресту и платят за это"

 # Event 2
 DATAW_dalish_blood_ritual_events.2.t: "Отчаянный ритуал: Украденное предназначение"
 DATAW_dalish_blood_ritual_events.2.desc: "Я с ужасом выслушиваю доклад о причинённом ущербе. Похоже, заговорщики во главе с [ritual_cillian.GetFirstName] не пожелали уходить без предмета [sulevin_blade.GetName]. Десятки Изумрудных рыцарей погибли — сожжённые, замороженные или убитые ещё более страшным образом магией [ritual_bellara.GetName] и [Select_CString(ritual_bellara.IsFemale, 'её наставника', 'его наставника' )].\n\nКак мне сообщили, [sulevin_blade_owner.GetTitledFirstName] чудом [Select_CString(sulevin_blade_owner.IsFemale, 'осталась жива', 'остался жив' )], но обмороженную ногу спасти не удалось. Во время бегства [sulevin_blade_owner.GetFirstName] [Select_CString(sulevin_blade_owner.IsFemale, 'услышала', 'услышал' )] лишь одну фразу: [ritual_bellara.GetFirstName] с болезненной ухмылкой [Select_CString(ritual_bellara.IsFemale, 'ответила', 'ответил' )] молодому воину, который умолял [Select_CString(ritual_bellara.IsFemale, 'её', 'его' )] остановиться:\n\n«Если Церковь считает нас чудовищами, кто мы такие, чтобы спорить?»"
 DATAW_dalish_blood_ritual_events.2.a: "Им это не сойдёт с рук. Найдите их!"
 DATAW_dalish_blood_ritual_events.2.a.desc: "Кража Клинка Сулевин и резня Изумрудных рыцарей побудили народ поддержать поиски заговорщиков."
 DATAW_dalish_blood_ritual_events.2.a.modifiers: "Каждое владение под вашим непосредственным контролем"
 memory_of_the_martyrs: "Память о мучениках"

 # Event 3
 DATAW_dalish_blood_ritual_events.3.t: "Отчаянный ритуал: Полный провал"
 DATAW_dalish_blood_ritual_events.3.desc: "После кражи Клинка Сулевин часть королевства охватила лихорадочная погоня за исторической реликвией. Сегодня утром мне принесли последние вести.\n\nМагов выследили до далёкой Арборской глуши, но куда именно они отправились дальше, установить невозможно. Известно лишь, что число духов и демонов в тех местах выросло, а заговорщиков и меч уже несколько дней никто не видел. Теперь люди опасаются этого края, считают его проклятым и отказываются идти дальше, боясь гнева духов."
 DATAW_dalish_blood_ritual_events.3.a: "Они исчезли так же внезапно, как появились."

 # Event 4
 DATAW_dalish_blood_ritual_events.4.t: "Отчаянный ритуал: Охотники Тени"
 DATAW_dalish_blood_ritual_events.4.desc: "«[ROOT.Char.GetFullName]! Вы арестованы за соучастие в ритуале магии крови!»\n\nОт неожиданности я резко оборачиваюсь. Передо мной с обнажённым мечом стоит [fade_hunter_solas.GetFirstName] из числа [Concept('fade_hunter','Охотников Тени')|E] — подразделения Изумрудных рыцарей, которое охотится на магов крови и демонов. Несомненно, причиной стало то, что перед всем двором я [Select_CString(ROOT.Char.IsFemale, 'приняла', 'принял' )] предложение [ritual_cillian.GetFirstName].\n\n«Пусть вы [Select_CString(ROOT.Char.IsFemale, 'правительница', 'правитель' )] Долов и пусть наше королевство переживает кризис, я исполню закон и остановлю это мерзкое деяние! У вас есть лишь миг, чтобы объясниться. В противном случае вас возьмут под стражу — силой, если потребуется!»"
 DATAW_dalish_blood_ritual_events.4.a: "Разве ты не видишь? Нам нужна любая помощь!"
 DATAW_dalish_blood_ritual_events.4.a.success: "Вам удаётся убедить Охотников Тени, и у устроителей ритуала появляется больше свободы для подготовки"
 DATAW_dalish_blood_ritual_events.4.a.failure: "Несмотря на ваши доводы, Охотники Тени продолжат преследовать заговорщиков, осложняя подготовку ритуала"
 DATAW_dalish_blood_ritual_events.4.a.toast.success: "Вы убеждаете Охотников Тени"
 DATAW_dalish_blood_ritual_events.4.a.toast.failure: "Вам не удаётся убедить Охотников Тени"
 DATAW_dalish_blood_ritual_events.4.b: "Послушай, просто возьми это и отвернись. Хорошо?"
 DATAW_dalish_blood_ritual_events.4.b.success: "С помощью золота вам удаётся купить молчание Охотников Тени — по крайней мере, до проведения ритуала"
 DATAW_dalish_blood_ritual_events.4.b.bribed: "Вы успешно подкупаете Охотников Тени"
 DATAW_dalish_blood_ritual_events.4.ritual_success_increased: "#!#bold Вероятность успеха ритуала повысится."
 DATAW_dalish_blood_ritual_events.4.ritual_success_decreased: "#!#bold Вероятность успеха ритуала снизится."
 DATAW_dalish_blood_ritual_events.4.b.failure: "Дар золота лишь разжигает рвение Охотников Тени и побуждает народ помогать им. Эта неприкрытая попытка подкупа ещё сильнее осложняет подготовку ритуала"
 DATAW_dalish_blood_ritual_events.4.b.unmoved: "Ваше золото не впечатляет Охотников Тени"
 popular_outrage: "Народное возмущение"
 DATAW_dalish_blood_ritual_events.4.c: "[Select_CString(fade_hunter_solas.IsFemale, 'Ты права', 'Ты прав' )]. Мне не следовало в это ввязываться."
 DATAW_dalish_blood_ritual_events.4.c.desc: "Признав ошибку, вы сдаётесь Охотникам Тени, к великой радости простого народа."
 DATAW_dalish_blood_ritual_events.4.c.submission: "Вы сдаётесь Охотникам Тени"
 DATAW_dalish_blood_ritual_events.4.ritual_will_fail: "#!#bold @warning_icon! Ритуал гарантированно потерпит неудачу."
 repentant_ruler: "Раскаяние правителя"
 DATAW_dalish_blood_ritual_events.4.d: "После расправы с тобой никто не посмеет считать меня лёгкой добычей."
 DATAW_dalish_blood_ritual_events.4.d.duel_warning: "#!#bold @warning_icon! Вы вступите в смертельный поединок с [fade_hunter_solas.GetFirstName]"
 DATAW_dalish_blood_ritual_events.4.d.duel_outcome: "#!#bold Победа в поединке повысит вероятность успеха ритуала. Если вы погибнете, ритуал потерпит неудачу."

 # Event 5
 DATAW_dalish_blood_ritual_events.5.t: "Отчаянный ритуал: Роковое приглашение"
 DATAW_dalish_blood_ritual_events.5.desc: "«Пришло время ритуала».\n\nЭту короткую фразу произносит [ritual_amylia.GetFirstName], [Select_CString(ritual_amylia.IsFemale, 'посланница, прибывшая', 'посланник, прибывший' )] от [ritual_cillian.GetFirstName]. Но в нескольких словах слышится множество чувств.\n\nРелигиозное рвение, гордость, отчаяние и страх перед грядущим. Ненависть и фанатизм смешиваются с ужасом потерять вторую родину и необходимостью заплатить за её спасение. В письме подробно описан ритуал. Четверых пленных человеческих воинов доставят на юг, в некогда священный храм Арборской глуши, где Завеса особенно тонка.\n\nЧас настал. Теперь уже поздно отказываться от приглашения: я слишком глубоко [Select_CString(ROOT.Char.IsFemale, 'вовлечена', 'вовлечён' )], а на кону стоят сами Долы."
 DATAW_dalish_blood_ritual_events.5.a: "Отправляемся немедленно."
 DATAW_dalish_blood_ritual_events.5.a.desc: "Вы начнёте подготовку путешествия во владение [GetTitleByKey('b_elgarnans_bastion').GetBaseNameNoTier]."

 # Event 6
 DATAW_dalish_blood_ritual_events.6.t: "Отчаянный ритуал: Колыбель Сулевин"
 DATAW_dalish_blood_ritual_events.6.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'добралась', 'добрался' )] до самой границы Долов и [Select_CString(ROOT.Char.IsFemale, 'отправилась', 'отправился' )] ещё дальше. Теперь вокруг лишь бесхозные земли и руины, а [ritual_cillian.GetFirstName] со своими последователями ведёт меня в глубины храма, который называет Колыбелью Сулевин.\n\nВ центре храма в ряд стоят четверо простых воинов — [GetCultureByKey('orlesian').GetCollectiveNoun]. Их раздели, оставив лишь набедренные повязки. Справа [ritual_bellara.GetFirstName] с болезненной ухмылкой держит предмет [sulevin_blade.GetName], а слева [ritual_amylia.GetFirstName] с мечом и верёвкой [Select_CString(ritual_amylia.IsFemale, 'готова', 'готов' )] пресечь любую попытку бегства.\n\nЗаговорщики смотрят на меня с благоговением. Для них я — символ родины, воплощение всего, за что они, по собственным словам, сражаются.\n\nЧуть поодаль стоит [ritual_hedolen.GetFirstName]. Скрестив руки, [Select_CString(ritual_hedolen.IsFemale, 'она печально смотрит', 'он печально смотрит' )] на жертв. Быть может, [ritual_hedolen.GetFirstName] понимает их чувства: на людях такие же набедренные повязки, какие носили бесчисленные эльфы, принесённые в жертву во времена Империи."
 DATAW_dalish_blood_ritual_events.6.a.compassionate: "Неужели мы стали теми, кого так ненавидели?"
 DATAW_dalish_blood_ritual_events.6.a.compassionate.desc: "Ритуал начнётся, и ради Долов прольётся кровь, как бы сильно мы ни уподобились магистрам древности. Давление Охотников Тени повлияет на вероятность успеха."
 DATAW_dalish_blood_ritual_events.6.b.cruel: "Продолжай тонуть в жалости, если хочешь. Кровь должна пролиться."
 DATAW_dalish_blood_ritual_events.6.b.cruel.desc: "Ритуал начнётся, и ради Долов прольётся кровь, сколько бы ни жаловались слабые духом. Давление Охотников Тени повлияет на вероятность успеха."
 DATAW_dalish_blood_ritual_events.6.c.zealous: "Эти язычники не заслуживают жалости."
 DATAW_dalish_blood_ritual_events.6.c.zealous.desc: "Ритуал начнётся, и ради Долов прольётся кровь, сколько бы ни оплакивали жизнь язычников. Давление Охотников Тени повлияет на вероятность успеха."
 DATAW_dalish_blood_ritual_events.6.d.cynical: "Такова цена силы, [ritual_hedolen.GetFirstName]."
 DATAW_dalish_blood_ritual_events.6.d.cynical.desc: "Ритуал начнётся, и ради нашей силы прольётся кровь. Другие заплатят цену за сохранение нашего положения. Давление Охотников Тени повлияет на вероятность успеха."
 DATAW_dalish_blood_ritual_events.6.e: "Начнём."
 DATAW_dalish_blood_ritual_events.6.e.desc: "Ритуал начнётся, и ради Долов прольётся кровь — в надежде сохранить вторую родину. Давление Охотников Тени повлияет на вероятность успеха."
 DATAW_dalish_blood_ritual_events.6.success: "Ритуал дарует вам невообразимое могущество. Но какой ценой?"
 DATAW_dalish_blood_ritual_events.6.failure: "Ритуал терпит неудачу, и всё выходит из-под контроля…"

 # Event 7
 DATAW_dalish_blood_ritual_events.7.t: "Отчаянный ритуал: Сломанный меч, разорванная Завеса"
 DATAW_dalish_blood_ritual_events.7.desc: "Кровь пролилась. Жертвы кричали от боли и умерли — точно так же умерли бы эльфы. Четверо людей истекли кровью на каменном полу, чтобы привлечь духов и помочь нам выиграть войну.\n\nДухи явились, но помощи не принесли. [ritual_bellara.GetFirstName] и [ritual_amylia.GetFirstName] сражаются с разгневанными сущностями, а [ritual_hedolen.GetFirstName] решается действовать. Со слезами на глазах [ritual_hedolen.GetFirstName] толкает [ritual_cillian.GetFirstName] в самую гущу боя и кричит:\n\n«Я лучше умру, чем позволю этому продолжаться! Мы делим себя на людей и эльфов, но на самом деле одинаковы. Мы одинаково истекаем кровью, плачем, любим и умираем!»\n\nПосле этой пламенной речи я понимаю замысел: запечатать всех нас внутри с разгневанными демонами и покарать за бессердечие. Из жажды мести и фанатизма мы попытались извратить предназначение Клинка Сулевин. Теперь за это заплатим и мы, и сам клинок, сломанный под ударами демонов."
 DATAW_dalish_blood_ritual_events.7.a: "Нужно немедленно выбираться! Все к выходу!"
 DATAW_dalish_blood_ritual_events.7.b: "Уходим, Хедолен! Остальные того не стоят!"
 DATAW_dalish_blood_ritual_events.7.c: "Спасти собственную шкуру, а остальные пусть пропадают!"
 DATAW_dalish_blood_ritual_events.7.d: "Я помогу запечатать нас здесь, Хедолен. Такое нельзя простить."
 DATAW_dalish_blood_ritual_events.7.d.desc: "#!#bold @warning_icon! Это означает неминуемую смерть, но, возможно, будет самым нравственным выбором."

 # Event 8
 DATAW_dalish_blood_ritual_events.8.t: "Отчаянный ритуал: Сокрушённые амбиции"
 DATAW_dalish_blood_ritual_events.8.desc.alone: "Позади гремит оглушительный рёв, а я бегу к двери быстрее, чем когда-либо прежде. За спиной бушует схватка с демонами.\n\nЗвуки боя не стихают. На миг обернувшись, я вижу [ritual_cillian.GetFirstName] в луже собственной крови со сломанными остатками меча предназначения в руках. Рядом лежат изломанные тела [ritual_bellara.GetFirstName] и [ritual_amylia.GetFirstName]. Одним заклинанием [ritual_hedolen.GetFirstName] вызывает порыв ветра, и двери храма с грохотом захлопываются.\n\nМы в ловушке.\n\nГрохот усиливается, трещины на потолке древнего храма расширяются, а демоны всё ближе. Я отчаянно пытаюсь спастись, но когти разрывают кожу, и падающие камни погребают меня под собой."
 DATAW_dalish_blood_ritual_events.8.desc.group: "Позади гремит оглушительный рёв, а я бегу к двери быстрее, чем когда-либо прежде. За спиной бушует схватка с демонами.\n\nЯ слышу бегущих следом спутников. На миг обернувшись, замечаю, как [ritual_hedolen.GetFirstName] вызывает порыв ветра, и двери храма с грохотом захлопываются.\n\nМы в ловушке.\n\nГрохот усиливается, трещины на потолке древнего храма расширяются, а демоны всё ближе. Я отчаянно пытаюсь спастись, но когти разрывают кожу, и падающие камни погребают меня под собой."
 DATAW_dalish_blood_ritual_events.8.desc.hedolen: "Позади гремит оглушительный рёв, а я бегу к двери быстрее, чем когда-либо прежде. За спиной бушует схватка с демонами.\n\nЗвуки боя не стихают. На миг обернувшись, я вижу: [ritual_hedolen.GetFirstName] бежит прямо за мной, а чуть поодаль [ritual_cillian.GetFirstName] стоит в луже собственной крови со сломанными остатками меча предназначения в руках. Рядом лежат изломанные тела [ritual_bellara.GetFirstName] и [ritual_amylia.GetFirstName]. В приступе ярости [ritual_cillian.GetFirstName] швыряет огромный камень в потолок над нами. Каменные глыбы обрушиваются и заваливают дверь.\n\nМы в ловушке.\n\nГрохот усиливается, трещины на потолке древнего храма расширяются, а демоны всё ближе. Я отчаянно пытаюсь спастись, но когти разрывают кожу, и падающие камни погребают меня под собой."
 DATAW_dalish_blood_ritual_events.8.a: "Аргх!.."

 # Event 9
 DATAW_dalish_blood_ritual_events.9.t: "Отчаянный ритуал: Бегство без предназначения"
 DATAW_dalish_blood_ritual_events.9.desc: "Ворота храма закрываются за спиной, когда я выбегаю из Колыбели. Побег удался — уже потому, что я [Select_CString(ROOT.Char.IsFemale, 'осталась жива', 'остался жив' )].\n\nЧетыре напрасные жертвы, сорванный ритуал и сломанная реликвия неизмеримой ценности. Как ни посмотри, это полный провал. Люди непременно спросят, что стало с Клинком Сулевин и вернётся ли к нам меч, воплощающий предназначение защищать родину.\n\nНе вернётся. И всю вину возложат на меня."
 DATAW_dalish_blood_ritual_events.9.a: "В борьбе за выживание Долам придётся полагаться лишь на собственные силы."

 # Event 10
 DATAW_dalish_blood_ritual_events.10.t: "Отчаянный ритуал: [Select_CString(ritual_hedolen.IsFemale, 'Последняя подруга', 'Последний друг' )] в запечатанной гробнице"
 DATAW_dalish_blood_ritual_events.10.desc.mage: "Хедолен бросает на меня быстрый взгляд и готовит заклинание. Ветер крепнет, а я собираюсь помочь.\n\nЯ тоже поднимаю руку, и воздушный поток становится ещё сильнее. Огромная каменная дверь понемногу закрывается перед нами, обрекая всех на смерть в проклятом храме. От напряжения по лицу струится пот, а Хедолен едва не падает от изнеможения.\n\nНаконец раздаётся крик [ritual_cillian.GetFirstName], в котором смешались гнев и боль. Дверь с оглушительным грохотом захлопывается, и мы с Хедоленом тяжело дышим, стоя на коленях после неимоверных усилий. Хедолен смотрит на меня с печалью и благодарностью, прекрасно понимая, какая смерть нас ожидает.\n\n«Спасибо, [ROOT.Char.GetFirstName]»."
 DATAW_dalish_blood_ritual_events.10.desc.nonmage: "Хедолен бросает на меня быстрый взгляд и готовит заклинание. Ветер крепнет, а я собираюсь помочь.\n\nЯ бросаюсь к двери и тяну её на себя, едва удерживаясь на ногах, пока ветер толкает меня в глубь храма и одновременно закрывает каменную створку, навеки запечатывая нас внутри.\n\nНаконец раздаётся крик [ritual_cillian.GetFirstName], в котором смешались гнев и боль. Дверь с оглушительным грохотом захлопывается, и мы с Хедоленом тяжело дышим, стоя на коленях после неимоверных усилий. Хедолен смотрит на меня с печалью и благодарностью, прекрасно понимая, какая смерть нас ожидает.\n\n«Спасибо, [ROOT.Char.GetFirstName]»."
 DATAW_dalish_blood_ritual_events.10.a: "Спасибо, [ritual_hedolen.GetFirstName]."

 # Event 11
 DATAW_dalish_blood_ritual_events.11.t: "Отчаянный ритуал: Искажённое предназначение"
 DATAW_dalish_blood_ritual_events.11.desc.mage: "Кровь жертв заливает землю под ногами. Духи и демоны приближаются, а [ritual_cillian.GetFirstName] без устали торгуется с обитателями Тени. Человеческая кровь уже начинает засыхать, когда голову пронзает внезапная боль. Я закрываю глаза и хватаюсь за виски. К счастью, мучение длится лишь мгновение.\n\n#italic Это прекрасно.\n#!\nЯ вижу отголоски духов, пересекающих храм, и вездесущие зелёные трещины с облаками, которые заполняют всё пространство и парят в воздухе, столь же нереальные, как сама Тень. Стоит сосредоточиться — и повсюду возникает вечно движущаяся масса духов, руин и облаков, чуть изменяющаяся по моей воле.\n\n#italic Неужели это Завеса?\n#!\nЗа следующую минуту глаза постепенно теряют связь с тем, что делает магию реальной. И всё же я чувствую Тень внутри себя и вокруг, чувствую, как легко теперь черпать из неё силу. [ritual_cillian.GetFirstName] подходит и произносит:\n\n«То, что вы сейчас чувствуете, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )], — плод моего ритуала. Если Гордыне можно верить, отныне мы связаны с Тенью теснее, чем когда-либо прежде, пусть и ненадолго. Черпать силу станет легче, и это непременно поможет выиграть войну».\n\nНо самое страшное последствие остаётся невысказанным. Когда действие ритуала закончится, моя связь с Тенью навсегда ослабеет — так происходит со всеми, кто использует магию крови, особенно в таком масштабе.\n\nС улыбкой [ritual_cillian.GetFirstName] достаёт предмет [sulevin_blade.GetName] и протягивает мне. Если бы не форма, меч невозможно было бы узнать: металл стал тёплым на ощупь.\n\n«Тень даровала нам и меч, ставший могущественнее прежнего. Клинок Сулевин теперь острее, смертоноснее и переполнен кровожадностью и гневом. Не знаю, поселился ли внутри демон гнева и возможно ли такое вообще, но ощущение именно таково. Отныне Клинок Сулевин будет носить имя [blade_of_vengeance.GetName]»."
 DATAW_dalish_blood_ritual_events.11.desc.nonmage: "Кровь жертв заливает землю под ногами. Духи и демоны приближаются, а [ritual_cillian.GetFirstName] без устали торгуется с обитателями Тени. Человеческая кровь уже начинает засыхать, когда голову пронзает внезапная боль. Я закрываю глаза и хватаюсь за виски. К счастью, мучение длится лишь мгновение.\n\n#italic Это прекрасно.\n#!\nЯ вижу отголоски духов, пересекающих храм, и вездесущие зелёные трещины с облаками, которые заполняют всё пространство и парят в воздухе, столь же нереальные, как сама Тень. Стоит сосредоточиться — и повсюду возникает вечно движущаяся масса духов, руин и облаков, чуть изменяющаяся по моей воле.\n\n#italic Неужели это Завеса?\n#!\nЗа следующую минуту глаза постепенно теряют связь с тем, что делает магию реальной. И всё же я чувствую Тень внутри себя и вокруг, чувствую, как легко теперь черпать из неё силу. [ritual_cillian.GetFirstName] подходит и произносит:\n\n«То, что вы сейчас чувствуете, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )], — плод моего ритуала. Если Гордыне можно верить, отныне мы связаны с Тенью теснее, чем когда-либо прежде, пусть и ненадолго. Черпать силу станет легче, и это непременно поможет выиграть войну».\n\nС улыбкой [ritual_cillian.GetFirstName] достаёт предмет [sulevin_blade.GetName] и протягивает мне. Если бы не форма, меч невозможно было бы узнать: металл стал тёплым на ощупь.\n\n«Тень даровала нам и меч, ставший могущественнее прежнего. Клинок Сулевин теперь острее, смертоноснее и переполнен кровожадностью и гневом. Не знаю, поселился ли внутри демон гнева и возможно ли такое вообще, но ощущение именно таково. Отныне Клинок Сулевин будет носить имя [blade_of_vengeance.GetName]»."
 DATAW_dalish_blood_ritual_events.11.a: "Да будет так. Остаётся надеяться, что для спасения Долов этого хватит."
 DATAW_dalish_blood_ritual_events.11.a.t: "Ритуал завершён"
 fade_blessed: "Благословение Тени"
 fade_blessed_special_desc: "[ROOT.GetCharacter.GetFirstName] вступает в сделки с демонами и духами и временно обретает более тесную связь с Тенью, получая силу, стратегическое чутьё и магическое могущество. Как прекрасна Завеса! Как изящно странствуют духи и демоны! Как колышутся и сияют неземным зелёным светом трещины и облака!"
 blood_magic_withdrawal: "Истощение от магии крови"
 blood_magic_withdrawal_special_desc: "Участие в ритуале магии крови навсегда ослабляет связь персонажа [ROOT.GetCharacter.GetFirstName] с Тенью, затрудняя применение магии без крови."
 DATAW_dalish_blood_ritual_events.11.every_ritual_participant: "Каждый участник ритуала"

 # Event 12
 DATAW_dalish_blood_ritual_events.12.t: "Отчаянный ритуал: Далёкий провал"
 DATAW_dalish_blood_ritual_events.12.desc.intro: "С тех пор как мне достался титул [ROOT.Char.GetTitleAsName], я замечаю странные вещи. На столе предшественника лежат записи о загадочном ритуале и письма четырёх магов, рассуждающих о «Колыбели Сулевин», а слуги перешёптываются, будто [dalish_blood_ritual_instigator.GetTitledFirstName] [Select_CString(dalish_blood_ritual_instigator.IsFemale, 'занималась', 'занимался' )] магией крови.\n\n"
 DATAW_dalish_blood_ritual_events.12.desc.killed: "Слухи оказались правдой: [Select_CString(fade_hunter_solas.IsFemale, 'отважная Охотница Тени', 'отважный Охотник Тени' )] [fade_hunter_solas.GetFirstName] [Select_CString(fade_hunter_solas.IsFemale, 'нарушила', 'нарушил' )] приказ и [Select_CString(fade_hunter_solas.IsFemale, 'добилась', 'добился' )] соблюдения законов страны, даже когда сама верховная власть ими пренебрегла.\n\n"
 DATAW_dalish_blood_ritual_events.12.desc.end: "Охотники Тени уже сообщили, что четверых магов, несколько дней назад появившихся при дворе, выследили до далёкой Арборской глуши. Затем они ушли дальше на юг, в неизведанные земли. Где теперь находятся заговорщики и Клинок Сулевин, установить невозможно. Известно лишь, что число духов и демонов в тех местах выросло, а люди объявили край проклятым."
