l_russian:
# EVENT 1     #THE FIRST STONE
 DATAW_ulstor_events.001.tit: "Первый камень"
 DATAW_ulstor_events.001.desc: "Эджхолл — мой собственный оплот. Гномы возвели его как наземный форпост задолго до Первого Мора, а затем покинули, когда порождения тьмы напали на их подземные тейги. \n\nВскоре эти земли захватили коренные аламарри во главе с легендарным Лутием Гномьим Сыном. Его родичи и приспешники правили здесь многие поколения, служа западным оплотом клейнской цивилизации против авварских племён Морозных гор. Но аввары помнят бесчестье, нанесённое Морриган'нан, и отвергнутую протянутую руку дружбы. Для низинников Лутий, быть может, и был героем, но для нас он оставался обманщиком, а его чертог по праву завоевания мог взять любой. \n\nТак я и [Select_CString(ROOT.Char.IsFemale, 'поступила', 'поступил' )]. Волк Нагорий никогда не чувствовал себя своим в Фар-Пике, оплоте отчима. Стигандр изо всех сил старался передать мне обычаи Мудрого Ветра, но после смерти матери я [Select_CString(ROOT.Char.IsFemale, 'осталась', 'остался' )] без клана. Достигнув зрелости, я [Select_CString(ROOT.Char.IsFemale, 'отправилась', 'отправился' )] странствовать — в ярости, без цели и понимания того, кто же я на самом деле. \n\nМне довелось многое повидать и совершить. Но сильнее всего я [Select_CString(ROOT.Char.IsFemale, 'желала', 'желал' )] обрести собственный оплот. И когда мой друг Эндре принёс весть о беззащитных восточных землях, которыми веками бездарно правили мерзкие отпрыски Лутия, я [Select_CString(ROOT.Char.IsFemale, 'поняла', 'понял' )]: час волка наконец настал!"

 DATAW_ulstor_events.001.opt.a: "И Эджхолл запылал…"
 DATAW_ulstor_events.001.opt.a.tooltip: "При завоевании Эджхолла я [Select_CString(ROOT.Char.IsFemale, 'не пощадила', 'не пощадил' )] ни единой души — и моя казна от этого лишь пополнилась. Эти богатства помогут снарядить войско перед #N войной с Редклифом.#!"
 DATAW_ulstor_events.001.opt.b: "И я [Select_CString(ROOT.Char.IsFemale, 'взошла', 'взошёл' )] на престол…"
 DATAW_ulstor_events.001.opt.b.tooltip: "При завоевании Эджхолла я [Select_CString(ROOT.Char.IsFemale, 'пощадила', 'пощадил' )] большую часть мирных жителей и тем [Select_CString(ROOT.Char.IsFemale, 'заслужила', 'заслужил' )] уважение соседей-клейнов. Это укрепит мою репутацию среди местных перед #N войной с Редклифом.#!"


# EVENT 2     #THE WHETSTONE
 DATAW_ulstor_events.002.tit: "Точильный камень"
 DATAW_ulstor_events.002.desc: "#N Час войны настал.#!          \n\nТеперь, когда у нас с союзниками есть надёжная база, я жадно взираю на земли к юго-востоку — земли, по праву принадлежащие мне… Эрлинг Редклифа уже почти столетие удерживает Уайтвелл и Рейнсфир, хотя законные права на них принадлежали родичам здешних правителей Эджхолла. \n\nНыне Эджхолл находится в руках моих ближайших друзей и соратников, а значит, пришло время предъявить древние права! Разошлите воронов. Пусть эрл в своей крепости знает: скоро люди Морозных гор окажутся у его ворот!"

 DATAW_ulstor_events.002.opt.a: "Призвать авгуров! Пусть готовятся к войне!"
 DATAW_ulstor_events.002.opt.a.tooltip: "Авгуры укажут нам путь в войне против Редклифа!"
 DATAW_ulstor_events.002.opt.b: "Оповестить кланы! Нас ждут новые оплоты!"
 DATAW_ulstor_events.002.opt.b.tooltip: "Кланы сплотятся вокруг нашего дела и помогут забрать принадлежащее нам по праву!"

############## WINNING BRANCH BELOW

### NEW BORDER ### DOWN

# EVENT 3     #A New Border
 DATAW_ulstor_events.003.tit: "Новая граница"
 DATAW_ulstor_events.003.desc: "Мы победили. Редклиф покорился нашей воле, и весь законный эрлинг Эджхолла вошёл в нашу державу. Рейнсфир и Уайтвелл ещё предстоит как следует присоединить, но сперва нужно решить, что делать дальше. Остальные земли, принадлежащие нам по праву, — бывший тэйрнир Эджхолла — всё ещё находятся в чужих руках. Как нам ими завладеть?"
 DATAW_ulstor_events.003.opt.a: "Добиться мирного объединения с местными."
 DATAW_ulstor_events.003.opt.a.tooltip: "Избрать долгий путь мирного объединения."
 DATAW_ulstor_events.003.opt.b: "Силой принудить местных к покорности."
 DATAW_ulstor_events.003.opt.b.tooltip: "Самый быстрый путь нередко оказывается лучшим."

# EVENT 3.1   #A Plan for Cooperation
 DATAW_ulstor_events.0031.tit: "План сотрудничества"
 DATAW_ulstor_events.0031.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'решила', 'решил' )] сосредоточиться на дипломатическом присоединении тех, кто всё ещё противится моей власти. Остаётся вопрос: к кому обратиться сперва — к андрастианам из Убежища или к нашим авварским сородичам из Эльмриджа?"
 DATAW_ulstor_events.0031.opt.a: "Сперва адепты, затем кланы!"
 DATAW_ulstor_events.0031.opt.a.tooltip: "Отправить послание Адептам Андрасте из Убежища!"
 DATAW_ulstor_events.0031.opt.b: "Сперва кланы, затем адепты!"
 DATAW_ulstor_events.0031.opt.b.tooltip: "Отправить послание Южному клану из Эльмриджа!"

# EVENT 3.2   #A Message to the Disciples
 DATAW_ulstor_events.0032.tit: "Послание адептам"
 DATAW_ulstor_events.0032.desc: "Адепты Андрасте называют себя наследниками первых последователей своей госпожи. Некогда они верно служили прежнему тэйрну Эджхолла, но теперь, когда мы завладели его землями, их нужно вновь подчинить. Протянуть ли им открытую ладонь и даровать особые гарантии защиты веры? Или потребовать, чтобы они без всяких условий вернулись к исполнению долга законных подданных?"
 DATAW_ulstor_events.0032.opt.a: "Предложить им особую защиту в обмен на покорность!"
 DATAW_ulstor_events.0032.opt.a.tooltip: "Особые гарантии для Убежища покажут клейнам, что мы умеем быть великодушными с покорившимися."
 DATAW_ulstor_events.0032.opt.b: "Потребовать покорности, иначе они познают наш гнев!"
 DATAW_ulstor_events.0032.opt.b.tooltip: "Адепты отрезаны от своих собратьев-андрастиан, и потому угрозы подействуют на них сильнее."

# EVENT 3.21  #Integrating the Clans - refocusing on Haven
 DATAW_ulstor_events.00321.tit: "Внимание на Убежище"
 DATAW_ulstor_events.00321.desc: "Мы уже начали разбираться с Адептами Андрасте, населяющими Убежище. Теперь следует обратить внимание на тана Эльмриджа и присоединить его земли. Будем надеяться, он не возомнит о себе слишком многого."
 DATAW_ulstor_events.00321.opt.a: "Продолжить кампанию!"
 DATAW_ulstor_events.00321.opt.a.tooltip: "Мы должны продолжить кампанию и включить Убежище в свою державу."

# EVENT 3.31  #Integrating Haven - refocusing on the Clan
 DATAW_ulstor_events.00331.tit: "Внимание на Южный клан"
 DATAW_ulstor_events.00331.desc: "Мы уже начали разбираться с кланом Длинной Бороды на юге. Теперь следует обратить внимание на банна Убежища и присоединить его земли. Будем надеяться, он не возомнит о себе слишком многого."
 DATAW_ulstor_events.00331.opt.a: "Продолжить кампанию!"
 DATAW_ulstor_events.00331.opt.a.tooltip: "Мы должны продолжить кампанию и включить Убежище в свою державу."

# EVENT 3.22   #A Message to the Disciples (after clan tree is done)
 DATAW_ulstor_events.00322.tit: "Послание адептам"
 DATAW_ulstor_events.00322.desc: "Адепты Андрасте называют себя наследниками первых последователей своей госпожи. Некогда они верно служили прежнему тэйрну Эджхолла, но теперь, когда мы завладели его землями, их нужно вновь подчинить. Протянуть ли им открытую ладонь и даровать особые гарантии защиты веры? Или потребовать, чтобы они без всяких условий вернулись к исполнению долга законных подданных?"
 DATAW_ulstor_events.00322.opt.a: "Предложить им особую защиту в обмен на покорность!"
 DATAW_ulstor_events.00322.opt.a.tooltip: "Особые гарантии для Убежища покажут клейнам, что мы умеем быть великодушными с покорившимися."
 DATAW_ulstor_events.00322.opt.b: "Потребовать покорности, иначе они познают наш гнев!"
 DATAW_ulstor_events.00322.opt.b.tooltip: "Адепты отрезаны от своих собратьев-андрастиан, и потому угрозы подействуют на них сильнее."

# EVENT 3.4   #A Response to the Konungr's Message (nice branch) haven
 DATAW_ulstor_events.0034.tit: "Предложение из Эджхолла"
 DATAW_ulstor_events.0034.desc: "Мы получили послание от нового конунга Эджхолла — Ульстора Волчьей Руки. Он предлагает нам особые хозяйственные привилегии в обмен на покорность и обещает прислать в наши земли искусных авварских ремесленников. Взамен мы должны признать его власть и отправить отряд годных к бою мужчин в его стену щитов."
 DATAW_ulstor_events.0034.opt.a: "Принять предложение Эджхолла"
 DATAW_ulstor_events.0034.opt.a.tooltip: "Принять предложенные Эджхоллом хозяйственные привилегии."
 DATAW_ulstor_events.0034.opt.b: "Отклонить предложение Эджхолла"
 DATAW_ulstor_events.0034.opt.b.tooltip: "Отвергнуть самонадеянное предложение Эджхолла."

# EVENT 3.41   #A Response to the Konungr's Message (nice branch) haven (after clan tree is done)
 DATAW_ulstor_events.00341.tit: "Предложение из Эджхолла"
 DATAW_ulstor_events.00341.desc: "Мы получили послание от нового конунга Эджхолла — Ульстора Волчьей Руки. Он предлагает нам особые хозяйственные привилегии в обмен на покорность и обещает прислать в наши земли искусных авварских ремесленников. Взамен мы должны признать его власть и отправить отряд годных к бою мужчин в его стену щитов."
 DATAW_ulstor_events.00341.opt.a: "Принять предложение Эджхолла"
 DATAW_ulstor_events.00341.opt.a.tooltip: "Принять предложенные Эджхоллом хозяйственные привилегии."
 DATAW_ulstor_events.00341.opt.b: "Отклонить предложение Эджхолла"
 DATAW_ulstor_events.00341.opt.b.tooltip: "Отвергнуть самонадеянное предложение Эджхолла."

# EVENT 3.42   #Haven says no to our (nice) offer
 DATAW_ulstor_events.00342.tit: "Предложение отвергнуто: Убежище"
 DATAW_ulstor_events.00342.desc: "Адепты из Убежища отвергли наше невероятно щедрое предложение стать вассалами! Такое нельзя стерпеть. Эти андрастиане должны понять, что наше предложение было не простой просьбой и что за нашим пером стоит топор!"
 DATAW_ulstor_events.00342.opt.a: "Тогда мы возьмём их земли силой!"
 DATAW_ulstor_events.00342.opt.a.tooltip: "Воодушевлённая вашей решимостью дружина присоединится к походу."
 DATAW_ulstor_events.00342.opt.b: "Пока смириться с их отказом…"
 DATAW_ulstor_events.00342.opt.b.tooltip: "Пока принять отказ Убежища и подготовить более продуманный план."

# EVENT 3.43   #Haven says no to our (nice) offer
 DATAW_ulstor_events.00343.tit: "Предложение отвергнуто: Убежище"
 DATAW_ulstor_events.00343.desc: "Адепты из Убежища отвергли наше невероятно щедрое предложение стать вассалами."
 DATAW_ulstor_events.00343.opt.a: "Тогда мы возьмём их земли силой!"
 DATAW_ulstor_events.00343.opt.a.tooltip: "Мы должны силой захватить земли Убежища."
 DATAW_ulstor_events.00343.opt.b: "Пока смириться с их отказом…"
 DATAW_ulstor_events.00343.opt.b.tooltip: "Пока принять отказ Убежища и подготовить более продуманный план."

# EVENT 3.5   #A Response to the Konungr's Message (mean branch) haven
 DATAW_ulstor_events.0035.tit: "Угроза из Эджхолла"
 DATAW_ulstor_events.0035.desc: "Мы получили угрозу от нового конунга Эджхолла — Ульстора Волчьей Руки. Он грозит немедленно начать войну, если мы не покоримся его власти. Кроме того, он требует, чтобы мы отреклись от своей веры и обычаев и отправили отряд годных к бою мужчин в его стену щитов."
 DATAW_ulstor_events.0035.opt.a: "Покориться угрозе Эджхолла"
 DATAW_ulstor_events.0035.opt.a.tooltip: "Уступить Эджхоллу перед угрозой войны."
 DATAW_ulstor_events.0035.opt.b: "Отвергнуть угрозу Эджхолла"
 DATAW_ulstor_events.0035.opt.b.tooltip: "Не поддаться на военную угрозу Эджхолла."

# EVENT 3.51   #A Response to the Konungr's Message (mean branch) haven
 DATAW_ulstor_events.00351.tit: "Угроза из Эджхолла"
 DATAW_ulstor_events.00351.desc: "Мы получили угрозу от нового конунга Эджхолла — Ульстора Волчьей Руки. Он грозит немедленно начать войну, если мы не покоримся его власти. Кроме того, он требует, чтобы мы отреклись от своей веры и обычаев и отправили отряд годных к бою мужчин в его стену щитов."
 DATAW_ulstor_events.00351.opt.a: "Покориться угрозе Эджхолла"
 DATAW_ulstor_events.00351.opt.a.tooltip: "Уступить Эджхоллу перед угрозой войны."
 DATAW_ulstor_events.00351.opt.b: "Отвергнуть угрозу Эджхолла"
 DATAW_ulstor_events.00351.opt.b.tooltip: "Не поддаться на военную угрозу Эджхолла."

# EVENT 3.3  #A Message to the Southron Clan
 DATAW_ulstor_events.0033.tit: "Послание Южному клану"
 DATAW_ulstor_events.0033.desc: "Пока мы завоёвывали Эджхолл, клан Длинной Бороды воспользовался смутой и захватил земли на юге. Мы не ставим им это в вину — таков естественный ход вещей в авварском мире, — но теперь должны потребовать, чтобы они покорились нам как своим законным владыкам. Обратиться ли к ним как к собратьям, детям Тирдды, и предложить почётное место рядом с нами? Или приказать низко склониться перед законным конунгом?"
 DATAW_ulstor_events.0033.opt.a: "Отнестись к ним как к собратьям, детям Морозных гор!"
 DATAW_ulstor_events.0033.opt.a.tooltip: "Южные кланы — такие же аввары, как и мы. Общее наследие и общие ценности помогут привлечь их на нашу сторону."
 DATAW_ulstor_events.0033.opt.b: "Потребовать, чтобы они преклонили колени перед конунгом!"
 DATAW_ulstor_events.0033.opt.b.tooltip: "Южные кланы слабы, поэтому в своих требованиях мы можем проявить больше напора."

# EVENT 3.31  #Integrating Haven - refocusing on the Clan
 DATAW_ulstor_events.00331.tit: "Внимание на Южный клан"
 DATAW_ulstor_events.00331.desc: "Мы уже начали разбираться с Адептами Андрасте, населяющими Убежище. Теперь следует обратить внимание на тана Эльмриджа и присоединить его земли. Будем надеяться, он не возомнит о себе слишком многого."
 DATAW_ulstor_events.00331.opt.a: "Продолжить кампанию!"
 DATAW_ulstor_events.00331.opt.a.tooltip: "Мы должны продолжить кампанию и включить Эльмридж в свою державу."

# EVENT 3.32  #A Message to the Southron Clan (after haven tree)
 DATAW_ulstor_events.00332.tit: "Послание Южному клану"
 DATAW_ulstor_events.00332.desc: "Пока мы завоёвывали Эджхолл, клан Длинной Бороды воспользовался смутой и захватил земли на юге. Мы не ставим им это в вину — таков естественный ход вещей в авварском мире, — но теперь должны потребовать, чтобы они покорились нам как своим законным владыкам. Обратиться ли к ним как к собратьям, детям Тирдды, и предложить почётное место рядом с нами? Или приказать низко склониться перед законным конунгом?"
 DATAW_ulstor_events.00332.opt.a: "Отнестись к ним как к собратьям, детям Морозных гор!"
 DATAW_ulstor_events.00332.opt.a.tooltip: "Южные кланы — такие же аввары, как и мы. Общее наследие и общие ценности помогут привлечь их на нашу сторону."
 DATAW_ulstor_events.00332.opt.b: "Потребовать, чтобы они преклонили колени перед конунгом!"
 DATAW_ulstor_events.00332.opt.b.tooltip: "Южные кланы слабы, поэтому в своих требованиях мы можем проявить больше напора."








# EVENT 3.6   #A Response to the Konungr's Message (nice branch) clans
 DATAW_ulstor_events.0036.tit: "Предложение из Эджхолла"
 DATAW_ulstor_events.0036.desc: "Наш клан получил послание от так называемого конунга Эджхолла — Ульстора Волчьей Руки. В обмен на покорность он предлагает нам почётное место в своём растущем войске. Аввары никогда прежде не объединялись под властью конунга, да и редкие ярлы обычно удерживали власть недолго. Стоит ли связать судьбу с этим юным волчонком?"
 DATAW_ulstor_events.0036.opt.a: "Принять предложение Эджхолла"
 DATAW_ulstor_events.0036.opt.a.tooltip: "Принять предложение нашего сородича из Эджхолла."
 DATAW_ulstor_events.0036.opt.b: "Отклонить предложение Эджхолла"
 DATAW_ulstor_events.0036.opt.b.tooltip: "Отвергнуть предложение эджхоллского волчонка."










# EVENT 3.61   #A Response to the Konungr's Message (nice branch) clans (after haven tree)
 DATAW_ulstor_events.00361.tit: "Предложение из Эджхолла"
 DATAW_ulstor_events.00361.desc: "Наш клан получил послание от так называемого конунга Эджхолла — Ульстора Волчьей Руки. В обмен на покорность он предлагает нам почётное место в своём растущем войске. Аввары никогда прежде не объединялись под властью конунга, да и редкие ярлы обычно удерживали власть недолго. Стоит ли связать судьбу с этим юным волчонком?"
