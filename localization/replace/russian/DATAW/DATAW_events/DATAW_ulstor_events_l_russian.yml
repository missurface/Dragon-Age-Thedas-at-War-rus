# EVENT 7     #In Far Peak?
 DATAW_ulstor_events.007.tit: "В Фар-Пике?"
 DATAW_ulstor_events.007.desc: "Кто я? В последнее время этот вопрос терзает меня каждую ночь. Несколько лет ушло на укрепление моей власти над этими землями, создание новой державы для моего народа, доказательство моей силы и утверждение авварского господства на западе Ферелденской долины. И всё же внутри по-прежнему зияет рана, не дающая ощутить себя [Select_CString(ROOT.Char.IsFemale, 'целой', 'целым' )]. Многие мои подданные — и клейны, и аввары — уже называют Эджхолл своим домом, но я на это не [Select_CString(ROOT.Char.IsFemale, 'способна', 'способен' )]. \n\nМоё детство было куда тяжелее, чем у большинства авваров. Моя мать… Скульд Тронутая Пламенем, увы, имела известную репутацию. Она старалась оградить меня от слухов, но полностью скрыть правду не могла: я [Select_CString(ROOT.Char.IsFemale, 'родилась', 'родился' )] после одной из её многочисленных интрижек. Мать делала всё, что могла, однако мне не удалось избежать пересудов о моём происхождении. Впрочем, судьба почти не оставила мне шанса: когда мне было всего шесть, мать унесла болезнь, и я [Select_CString(ROOT.Char.IsFemale, 'осталась', 'остался' )] на попечении её мужа, Стигандра Мудрого Ветра. Именно он по-настоящему меня «вырастил», хотя я очень сомневаюсь, что [Select_CString(ROOT.Char.IsFemale, 'сумела', 'сумел' )] усвоить все его уроки. \n\nОн старался растить меня как родное дитя и даже называл [Select_CString(ROOT.Char.IsFemale, 'своей дочерью', 'своим сыном' )]. Как бы искренни ни были его намерения, всё усложнилось с появлением Катлы, а затем и кровных наследников рода Мудрого Ветра. Я без труда [Select_CString(ROOT.Char.IsFemale, 'могла бы', 'мог бы' )] предъявить права на оплот — авварские обычаи наследования не так неповоротливы, как у окружающих меня низинников, — но [Select_CString(ROOT.Char.IsFemale, 'почувствовала', 'почувствовал' )], что пора двигаться дальше. И много лет назад я [Select_CString(ROOT.Char.IsFemale, 'покинула', 'покинул' )] Фар-Пик, а вместе с ним и Стигандра. Если не ради истины о своём происхождении, то ради истины о собственном будущем."

 DATAW_ulstor_events.007.opt.a: "Возможно, некоторые его уроки всё же запали мне в душу…"
 DATAW_ulstor_events.007.opt.a.tooltip: "Проникнуться учением Стигандра и позволить его мудрости направлять ваши решения."
 DATAW_ulstor_events.007.opt.b: "Его наставления никогда не были мне особенно нужны…"
 DATAW_ulstor_events.007.opt.b.tooltip: "Это ожесточит ваше сердце и не даст свернуть с пути к славе."





# EVENT 7.1     #In Highhold?
 DATAW_ulstor_events.0071.tit: "В Хайхолде?"
 DATAW_ulstor_events.0071.desc: "Покинув Фар-Пик, я [Select_CString(ROOT.Char.IsFemale, 'отправилась', 'отправился' )] на север без определённой цели, но [Select_CString(ROOT.Char.IsFemale, 'знала', 'знал' )], что однажды могу встретить кого-нибудь из мужчин, способных оказаться моим отцом. К счастью или несчастью, мне удалось узнать судьбу двоих. \n\nПервого из них — Роарра Сверкесена из клана Небесной Гончей — я [Select_CString(ROOT.Char.IsFemale, 'встретила', 'встретил' )] лишь однажды, когда в начале наёмничьей карьеры [Select_CString(ROOT.Char.IsFemale, 'заглянула', 'заглянул' )] в его оплот Хайхолд в поисках работы. Больше всего мне запомнилось его лицо: словно собственное отражение на глади озера. Он развлекал нашу дружину рассказами о набегах на земли Солнечных Волков: как вместе с кланом Вороньих Когтей из Стоунпасса устроил двустороннее нападение, увёл множество пленников из Санхолда и собственноручно убил самого грозного брата тана Котморна II — Варга Гримморнсена. \n\n«Этот наг слишком много о себе возомнил! Однажды ему даже удалось выбить у меня оружие, но прикончить меня на месте он отказался. Видите ли, благородному Солнечному Волку не пристало убивать безоружного! На его беду, второго шанса я ему не дал»."

 DATAW_ulstor_events.0071.opt.a: "Вот кого я [Select_CString(ROOT.Char.IsFemale, 'с гордостью назвала бы', 'с гордостью назвал бы' )] своим отцом!"
 DATAW_ulstor_events.0071.opt.a.tooltip: "Проникнуться мировоззрением Роарра и позволить его гневу направлять ваши решения."
 DATAW_ulstor_events.0071.opt.b: "Этот глупец позволяет ярости брать верх!"
 DATAW_ulstor_events.0071.opt.b.tooltip: "Учиться сохранять спокойствие и надеяться разглядеть порядок среди хаоса."






# EVENT 7.2     #In Sunhold?
 DATAW_ulstor_events.0072.tit: "В Санхолде?"
 DATAW_ulstor_events.0072.desc: "После встречи в Хайхолде я долго [Select_CString(ROOT.Char.IsFemale, 'не могла', 'не мог' )] прийти в себя. Неужели я наконец [Select_CString(ROOT.Char.IsFemale, 'нашла', 'нашёл' )] своего отца? Покидая оплот, я [Select_CString(ROOT.Char.IsFemale, 'чувствовала', 'чувствовал' )], как колотится сердце и внутри пробуждается нечто прежде незнакомое. Гордость? Сила? Чувство родства? Возможно, всё сразу — или ничего. \n\n«Теперь понятно, почему мать выбрала такого могучего воина, как Роарр!» — [Select_CString(ROOT.Char.IsFemale, 'подумала', 'подумал' )] я. [Select_CString(ROOT.Char.IsFemale, 'Какой же глупой я была', 'Каким же глупцом я был' )]! Наша дружина ещё не перевалила через соседний холм, когда Хунди Чистое Лицо сказал: «Знаешь, Волчья Рука… Этот Варг, может, и встретил благородную смерть, но я помню его волчонком ненамного старше тебя. Не всегда он был таким праведником. Слыхал я, разбил он сердце девчонке из Клиффхолда, оставил её с дитём и удрал обратно в Санхолд, лишь бы продолжать ту глупую вражду, о которой вечно лает его семейка». \n\nКлиффхолд? Я до сих пор помню, как [Select_CString(ROOT.Char.IsFemale, 'услышала', 'услышал' )] это название. Там находился родной оплот матери… Мне прежде не доводилось там бывать, но в детстве она часто рассказывала о нём, о деде Тронде и дяде Роальде. Что же это значило для меня? Долгие годы я [Select_CString(ROOT.Char.IsFemale, 'считала', 'считал' )], что никогда не узнаю имени отца, и [Select_CString(ROOT.Char.IsFemale, 'решила', 'решил' )] проложить собственный путь. Но, похоже, у судьбы были иные замыслы."

 DATAW_ulstor_events.0072.opt.a: "Возможно, в учении Солнечных Волков всё же есть сила…"
 DATAW_ulstor_events.0072.opt.a.tooltip: "Проникнуться мировоззрением Солнечных Волков и позволить их чести направлять ваши решения."
 DATAW_ulstor_events.0072.opt.b: "Солнечные Волки — сборище глупцов, и мне ни к чему их нравоучения!"
 DATAW_ulstor_events.0072.opt.b.tooltip: "Отвергнуть учение Солнечных Волков и продолжить прокладывать собственный путь."

# EVENT 7.3     #In Edgehall.
 DATAW_ulstor_events.0073.tit: "В Эджхолле."
 DATAW_ulstor_events.0073.desc: "Разумеется, всё это было много лет назад. Но теперь моя семья растёт, а придворные и соседние правители всё чаще ставят под сомнение моё происхождение и законность власти. Час настал. Мне предстоит решить, где лежит логово этого волка. КТО Я?"
 DATAW_ulstor_events.0073.opt.a: "Я Ульстор Волчья Рука, [Select_CString(ROOT.Char.IsFemale, 'наследница', 'наследник' )] клана Солнечного Волка и [Select_CString(ROOT.Char.IsFemale, 'дочь', 'сын' )] Варга Гримморнсена!"
 DATAW_ulstor_events.0073.opt.a.tooltip: "Этот выбор направит вас по пути объединения с родичами из Морозных гор и принесёт клану великую славу!"
 DATAW_ulstor_events.0073.opt.b: "Я Ульстор Волчья Рука, [Select_CString(ROOT.Char.IsFemale, 'наследница', 'наследник' )] клана Небесной Гончей и [Select_CString(ROOT.Char.IsFemale, 'дочь', 'сын' )] Роарра Сверкесена!"
 DATAW_ulstor_events.0073.opt.b.tooltip: "Этот выбор направит вас по пути завоеваний и разрушения. #N Берегитесь:#! поражение может погубить всё!"
 DATAW_ulstor_events.0073.opt.c: "Я Ульстор Волчья Рука, и мой отец — Стигандр. Родителем делает не кровь!"
 DATAW_ulstor_events.0073.opt.c.tooltip: "Этот выбор направит вас по пути мира и созидания, чтобы выстроить для авваров новый уклад жизни!"














############### SKY-HOUND BELOW ##############
# EVENT 9.0     #Konungr or Conqueror?
 DATAW_ulstor_events.009.tit: "Конунг или завоеватель?"
 DATAW_ulstor_events.009.desc: "Теперь, когда я [Select_CString(ROOT.Char.IsFemale, 'назвала себя представительницей', 'назвал себя представителем' )] могучего клана Небесной Гончей, мне следует решить, каким будет моё правление. Преданность нашего клана духам гор никогда не вызывала сомнений. Иные аввары могут поддаться безумию так называемых «культов Создателя», но мы непоколебимо храним древние обычаи, благодаря которым выжили в Морозных горах. Наша вера — одно из многого, что отличает нас от хилоруких низинников. \n\nБоги и предки одарили наш клан силой. Если воздать должное множеству богов нашего народа, я смогу укрепить державу и как [Select_CString(ROOT.Char.IsFemale, 'правительница', 'правитель' )] с твёрдой рукой затянуть узы, связывающие авваров. Но в сердце я слышу и боевой клич великого Гаккона Зимодыха. Он обещает мне и моим воинам великое могущество, если я посвящу себя лишь ему и разнесу по миру его лютый холод — мороз и сталь. \n\n(Дальнейший этап этой сюжетной линии находится среди решений.)"

 DATAW_ulstor_events.009.opt.a: "Своим правлением я почту богов и предков…"
 DATAW_ulstor_events.009.opt.a.tooltip: "…и принесу почёт нашему народу!"
 DATAW_ulstor_events.009.opt.b: "Челюстями Гаккона, я заставлю низины трепетать…"
 DATAW_ulstor_events.009.opt.b.tooltip: "…как и всех, кто осмелится мне противиться!"








# EVENT 9.1     #The Lone Wolf Dies
 DATAW_ulstor_events.0091.tit: "Одинокий волк погибает"
 DATAW_ulstor_events.0091.desc: "Текст-заглушка события «Одинокий волк погибает»"
