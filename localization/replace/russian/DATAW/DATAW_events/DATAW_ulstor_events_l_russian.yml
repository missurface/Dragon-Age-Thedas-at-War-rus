################## LAST EVENT BELOW

 DATAW_ulstor_events.012.tit: "Наконец-то дома"
 DATAW_ulstor_events.012wisewind.desc: "Как непривычно ощущать покой. После стольких лет сомнений и поисков своего истинного «я» я просто стою и ни о чём не думаю, чувствуя лишь ветер на лице. \n\nВ этих низинах я [Select_CString(ROOT.Char.IsFemale, 'обрела', 'обрёл' )] дом. Среди измученных земель мне удалось даровать подданным мир и процветание. Моё место в мире — не место [Select_CString(ROOT.Char.IsFemale, 'завоевательницы', 'завоевателя' )], а [Select_CString(ROOT.Char.IsFemale, 'справедливой правительницы', 'справедливого правителя' )]."
 DATAW_ulstor_events.012skyhound.desc: "Как непривычно ощущать покой. После стольких лет сомнений и поисков своего истинного «я» я просто стою и ни о чём не думаю, чувствуя лишь ветер на лице. \n\nВ этих низинах я [Select_CString(ROOT.Char.IsFemale, 'пролила', 'пролил' )] реки крови. В поисках смысла мне довелось истребить бесчисленных нечестивцев. Теперь я вижу своё место в мире: быть пустым сосудом для гнева богов, обращённого против андрастиан."
 DATAW_ulstor_events.012sunwolf.desc: "Как непривычно ощущать покой. После стольких лет сомнений и поисков своего истинного «я» я просто стою и ни о чём не думаю, чувствуя лишь ветер на лице. \n\nВ этих низинах я [Select_CString(ROOT.Char.IsFemale, 'увидела', 'увидел' )] ценность единства. Клейны стремятся объединиться не только из-за безмерного честолюбия, но и ради силы, которую обретают вместе. Так я [Select_CString(ROOT.Char.IsFemale, 'нашла', 'нашёл' )] своё место в мире — [Select_CString(ROOT.Char.IsFemale, 'объединительницы', 'объединителя' )] всех авваров под одной верой и одним престолом."
 DATAW_ulstor_events.012.opt.a: "Наконец я знаю, кто я."
 DATAW_ulstor_events.012.opt.a.tooltip: "После всех испытаний и невзгод вы обрели своё место в мире и приняли его."







