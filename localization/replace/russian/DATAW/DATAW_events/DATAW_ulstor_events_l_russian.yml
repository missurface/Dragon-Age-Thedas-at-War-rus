############### WISE-WIND BELOW ##############
# EVENT 8.0     #The Wind at my Back
 DATAW_ulstor_events.008.tit: "Ветер за спиной"
 DATAW_ulstor_events.008.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'выбрала', 'выбрал' )] родство вместо крови. Годы мучительных раздумий о своём месте и отце остались позади. Зачем тревожиться о том, кто зачал дитя с моей матерью, если этот человек ничего для меня не сделал? Зачем вечно гнаться за отсутствующим отцом, когда сильнее всех обо мне заботился тот, с кем нас вовсе не связывала кровь? \n\n[stigandrdaddy.GetName] — [Select_CString(stigandrdaddy.IsFemale, 'моя настоящая мать', 'мой настоящий отец' )], и другого родителя мне не нужно. Пришла пора проститься с годами душевных терзаний, странствий и битв и принять эти наставления. \n\n«Смотри на простолюдинов, [Select_CString(ROOT.Char.IsFemale, 'дочь', 'сын' )], и направляй их, словно ветер. Заботой, но когда потребуется — и силой. Неважно, каков их язык, кровь или положение: если ты бережёшь их жизни и трудишься ради их благополучия, они последуют за тобой к высочайшим вершинам». \n\nТеперь Эджхолл принадлежит мне, и я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] как можно лучше воплотить уроки [stigandrdaddy.GetName]."
 DATAW_ulstor_events.008.opt.a: "Эджхолл обретёт процветание и порядок!"
 DATAW_ulstor_events.008.opt.a.tooltip: "После признания нового родства и обещаний мира низинники ждут, что вы будете уважать местных клейнов и развивать свою державу!"

# EVENT 8.1     #Wise Rule, Wise Diplomacy
 DATAW_ulstor_events.0081.tit: "Мудрое правление, мудрая дипломатия"
 DATAW_ulstor_events.0081.desc: "Стараясь как можно лучше управлять державой, я обращаю взор внутрь страны, чтобы обеспечить народу благополучие. Но в мыслях по-прежнему звучат слова [stigandrdaddy.GetName]. Чтобы принести людям мир и процветание, я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] видеть в их жизнях нечто большее, чем числа, которыми можно пожертвовать на войне. К сожалению, вражда с соседними эрлами вроде [trefirwisewindevents.GetName] лишь напитает землю кровью. Мне необходимо хотя бы на время смягчить распри. \n\nПосле недавней войны Редклиф оказался в отчаянном положении. [redcliffeholderwisewind.GetName], без сомнения, не хранит меня в [redcliffeholderwisewind.GetHerHis] сердце, но если я хочу принести краю мир, а не новую войну, предложение перемирия станет важным первым шагом."
 DATAW_ulstor_events.0081.opt.a: "Я сделаю первый шаг. Немедленно отправить предложение о перемирии."
 DATAW_ulstor_events.0081.opt.a.tooltip: "Если Редклиф согласится, это станет важным шагом к налаживанию отношений с низинниками."
 DATAW_ulstor_events.0081.opt.b: "Ненависть между Эджхоллом и Редклифом не унять так быстро."
 DATAW_ulstor_events.0081.opt.b.tooltip: "Старые раны не заживают легко, и в Редклифе наверняка думают так же."





# EVENT 8.2     #The Call of Spirits
 DATAW_ulstor_events.0082.tit: "Зов духов"
 DATAW_ulstor_events.0082.desc: "Эджхолл — мой оплот. Я правлю отсюда уже больше десяти лет и стараюсь вести народ согласно заветам [stigandrdaddy.GetName]. Один из главных уроков — всегда внимать мудрости шаманов и авгуров своего клана. \n\nНо Эджхолл — многообразная держава, и каждый день духовные советники приносят мне противоречивые вести и наставления. [stigandrdaddy.GetName] и [Select_CString(stigandrdaddy.IsFemale, 'сама', 'сам' )] следует Культу Небес — авварскому течению, всецело преданному почитанию Хозяйки Небес. Большая часть жителей моей державы, однако, исповедует учение [andraste.GetName]. \n\nЯ [Select_CString(ROOT.Char.IsFemale, 'выслушала', 'выслушал' )] устами служителей голоса множества духов. Но кто из них властвует над моим сердцем?"
 DATAW_ulstor_events.0082.opt.a: "Вера гор!"
 DATAW_ulstor_events.0082.opt.a.tooltip: "Сохранить верность духам моего детства!"
 DATAW_ulstor_events.0082.opt.b: "Стигандр знал верный путь!"
 DATAW_ulstor_events.0082.opt.b.tooltip: "Обратиться к Культу Хозяйки и укрыть Эджхолл в объятиях её крыльев!"
 DATAW_ulstor_events.0082.opt.c: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] уступить Создателю!"
 DATAW_ulstor_events.0082.opt.c.tooltip: "Обратиться к Культу Создателя, умиротворив подданных, но, возможно, разгневав вассалов."




# EVENT 8.3     #Feel the Breeze
 DATAW_ulstor_events.0083.tit: "Ощутить ветер"
 DATAW_ulstor_events.0083.desc: "Ветер перемен вновь пронёсся по моему чертогу. В зале суда не умолкают разговоры о преобразованиях: налоговой политике, сводах законов и новых способах строительства. Но язык говорящих… совсем не похож на тот, что я [Select_CString(ROOT.Char.IsFemale, 'слышала', 'слышал' )] в юности в Фар-Пике. Они по-прежнему говорят по-авварски, однако теперь в речи заметно сильное клейнское влияние, вероятно принесённое многочисленными коренными подданными. \n\nС великой радостью я понимаю: именно так и должен был править мой отец. Люди самых разных путей, даже бывшие враги, объединяются ради общего дела."
 DATAW_ulstor_events.0083.opt.a: "Отныне наш народ един!"
 DATAW_ulstor_events.0083.opt.a.tooltip: "Сформировалась новая смешанная культура во главе с вами. #N Примечание:#! продолжайте развивать державу Ульстора с помощью решений."




# Event 8.01    #The Lowland Wind
 DATAW_ulstor_events.00801.tit: "Ветер низин"
 DATAW_ulstor_events.00801.desc: "С начала моего правления прошло лишь несколько лет, но перемены уже заметны по всему краю, который теперь называют Эджхоллом. Люди общались, торговали и пировали вместе, и так возникло новое основание, способное однажды стать будущим державы. \n\nПришедшие со мной аввары осели здесь и под моей мягкой рукой понемногу перенимали новые привычки. Постепенно жители Эджхолла оказались в необычном положении: они уже не похожи ни на авваров Морозных гор, ни на клейнов Ферелдена. \n\nТеперь будущее Эджхолла воплощено в его жителях — в рождении новой культуры, которая, подобно ветру, поведёт край вперёд. Но куда должен направить этих людей ветер?"
 DATAW_ulstor_events.00801.opt.a: "Обычай прощать за службу принесёт пользу всему Эджхоллу."
 DATAW_ulstor_events.00801.opt.a.tooltip: "Проявить милосердие к прежним врагам."
 DATAW_ulstor_events.00801.opt.b: "Добрые деяния [stigandrdaddy.GetName] навеки останутся в этой земле."
 DATAW_ulstor_events.00801.opt.b.tooltip: "Повести державу по пути закона и порядка."

#Event 8.4       #The Lowland Legend
 DATAW_ulstor_events.0084.tit: "Легенда низин"
 DATAW_ulstor_events.0084.desc: "Ульстор, Волк Нагорий. История о том, как я [Select_CString(ROOT.Char.IsFemale, 'отвоевала', 'отвоевал' )] Эджхолл у прежнего правящего рода [dwarfsonlastname.GetHouse.GetName], уже стала мифом и легендой. \n\nС тех дней успело смениться целое поколение, и нынешние жители державы не узнали бы королевство своих предков. \n\n«Снова расскажи нам эту историю, Волк! — слышу я почти всякий раз, когда выхожу на улицы Эджхолла. — Расскажи, как ты [Select_CString(ROOT.Char.IsFemale, 'освободила', 'освободил' )] нас от тирании потомков Лутия!» \n\nПохоже, они полностью забыли или простили все мои прежние прегрешения и теперь видят во мне героя, достойного подражания."
 DATAW_ulstor_events.0084.opt.a: "Вдохновить их рассказами о моём прошлом!"
 DATAW_ulstor_events.0084.opt.a.tooltip: "Пора признать, что времена изменились, и преподать им уроки моего прошлого."
 DATAW_ulstor_events.0084.opt.b: "Вдохновить их стать вождями будущего!"
 DATAW_ulstor_events.0084.opt.b.tooltip: "Пора признать, что времена изменились, и преподать им уроки для будущего."





############### WISE-WIND ABOVE ##################















############### SUN-WOLF BELOW ####################
#Event 11.0       #A Sun of My Own
 DATAW_ulstor_events.011.tit: "Собственное солнце"
 DATAW_ulstor_events.011.desc: "Все последние годы я [Select_CString(ROOT.Char.IsFemale, 'укрепляла', 'укреплял' )] Эджхолл, и моя власть над ним стала законной. Я [Select_CString(ROOT.Char.IsFemale, 'утвердила', 'утвердил' )] своё происхождение от Солнечных Волков и [Select_CString(ROOT.Char.IsFemale, 'сама определила', 'сам определил' )] судьбу, однако меня по-прежнему терзает последний вопрос. Какая сила питала моё могущество? Ведь топор направляет не только моя рука. Я всегда [Select_CString(ROOT.Char.IsFemale, 'шла', 'шёл' )] своим путём и [Select_CString(ROOT.Char.IsFemale, 'верила', 'верил' )] в собственные способности, но с рождением детей во мне пробудилась тяга к божественному. \n\nРазмышляя о своих триумфах, я понимаю: кто-то направлял меня. Но кто?"
 DATAW_ulstor_events.011.opt.a: "Я [Select_CString(ROOT.Char.IsFemale, 'благословлена', 'благословлён' )] Светом Создателя!"
 DATAW_ulstor_events.011.opt.a.tooltip: "Вы понимаете, что вами движут свет Создателя и любовь Андрасте."
 DATAW_ulstor_events.011.opt.b: "Мне благоволят боги наших предков!"
 DATAW_ulstor_events.011.opt.b.tooltip: "Вы понимаете, что вами движут сила Корта, Хозяйки Небес, Гаккона и духов."

#Event 11.1       #Axe of the Maker
 DATAW_ulstor_events.0111.tit: "Топор Создателя"
 DATAW_ulstor_events.0111.desc: "Теперь я вижу всё так же ясно, как в день восшествия на престол. Каждый шаг, каждый взмах топора и каждая добытая в тяжёлой борьбе победа приближали меня к священной истине Создателя. Я понимаю: когда [Select_CString(ROOT.Char.IsFemale, 'отправилась', 'отправился' )] искать себя, путь мне указывала Андрасте. В моей славе свет Создателя сияет над миром. \n\nЯ вижу, насколько непоколебима вера клейнов в своего творца. Я призываю клан разделить со мной искупление: Андрасте велела всем нам нести Песнь Света сородичам в наш дом среди гор и небес. \n\nНарод требует войны, и призыв разнести её святую Песнь эхом звучит по всей земле. Быть может, стоит обратить этот пыл себе на пользу, вторгнуться в Морозные горы и завладеть оплотом моего отца?\n\n(Дальнейший этап пути Ульстора находится среди решений.)"
 DATAW_ulstor_events.0111.opt.a: "Я стану Волей Создателя!"
 DATAW_ulstor_events.0111.opt.a.tooltip: "Вы провозглашаете себя волей Создателя и несёте Песнь Света своему народу!"
 DATAW_ulstor_events.0111.opt.b: "Я стану Гневом Создателя!"
 DATAW_ulstor_events.0111.opt.b.tooltip: "Вы провозглашаете себя гневом Создателя и становитесь силой, несущей в мир его свет!"

#Event 11.2       #Spirits of our Ancestors
 DATAW_ulstor_events.0112.tit: "Духи наших предков"
 DATAW_ulstor_events.0112.desc: "Корт, Хозяйка Небес, Гаккон, духи и предки всегда сопровождали меня, даже когда в начале странствий их образы померкли для моего взора. Их присутствие давало мне силу, а память о них стала огнём, побудившим повести мой народ обратно к Беленасу. \n\nЛишь теперь я понимаю истину. Эти земли слишком долго томились под оком Создателя. Пришла пора нашим богам вернуться и вновь воцариться в низинах. Для детей Тирдды должна начаться новая эпоха — со мной во главе. \n\nБлижайшие советники убеждают меня, что ради этой цели следует призвать мощь древних кланов Морозных гор. Вдалеке гремят барабаны войны, и по долинам разносится зов вернуть земли предков. \n\n(Дальнейший этап пути Ульстора находится среди решений.)"
 DATAW_ulstor_events.0112.opt.a: "Я стану дланью их власти!"
 DATAW_ulstor_events.0112.opt.a.tooltip: "Вы провозглашаете себя дланью божественной власти и орудием воли богов!"
 DATAW_ulstor_events.0112.opt.b: "Я стану дланью их милосердия!"
 DATAW_ulstor_events.0112.opt.b.tooltip: "Вы провозглашаете себя дланью божественного милосердия и даруете народу благоволение богов!"

#Event 11.3       #Demesne of the Wolf
 DATAW_ulstor_events.0113.tit: "Владения Волка"
 DATAW_ulstor_events.0113.desc: "Настало время вдохнуть жизнь в новые устремления. Мы с советом начали обсуждать следующий этап наследия Эджхолла. Укрепившись в новообретённой вере, мы обратили взоры на Санхолд — дом моего отца и недавнее завоевание. Я происхожу от Солнечных Волков и как [Select_CString(ROOT.Char.IsFemale, 'дочь', 'сын' )] Варга Гримморнсена понимаю: чтобы утвердить власть над Морозными горами и повести авваров в новую эпоху, мне необходимо господствовать там, где лежит волчье логово. \n\nЯ [Select_CString(ROOT.Char.IsFemale, 'вернулась', 'вернулся' )] в землю, где родилось имя Волчьей Руки. Именно здесь, у истоков моей легенды, следует заявить права на Морозные горы."
 DATAW_ulstor_events.0113.opt.a: "Мы будем править напрямую!"
 DATAW_ulstor_events.0113.opt.a.tooltip: "Править Санхолдом железной рукой, укрепив контроль над ним, но разгневав местные кланы."
 DATAW_ulstor_events.0113.opt.b: "Посадить здесь новообретённых родичей!"
 DATAW_ulstor_events.0113.opt.b.tooltip: "Поставить новых родичей из клана Солнечного Волка ярлами Санхолда. Вы приобретёте могущественных союзников, но вызовете неоднозначную реакцию местных кланов."

#Event 11.31       #A Path for our People?
 DATAW_ulstor_events.01131.tit: "Путь для нашего народа?"
 DATAW_ulstor_events.01131.desc: "Много лет аввары и клейны Эджхолла вместе жили под моей властью. На моих глазах возник новый народ, сливший две культуры в единый уклад. Обычаи и предания переходят от одних к другим, и наши судьбы переплетаются. \n\nВремя исцеляет любые раны, и теперь мы стоим не двумя народами, а единым кланом. После покорения земель Санхолда новые обычаи распространяются в Морозных горах и укрепляют там моё влияние. Но вместе с тем старые традиции всё легче проникают в низины и усиливают приверженность некоторых людей древним устоям. \n\nСледует ли мне обратиться к старым обычаям или вести народ к новому, более клейнскому укладу?"
 DATAW_ulstor_events.01131.opt.a: "Нужно обратиться к прошлому…"
 DATAW_ulstor_events.01131.opt.a.tooltip: "(Обратитесь к решениям, чтобы продолжить свой путь.)"
 DATAW_ulstor_events.01131.opt.b: "Наш путь лежит в будущее!"
 DATAW_ulstor_events.01131.opt.b.tooltip: "(Обратитесь к решениям, чтобы продолжить свой путь.)"



#Event 11.6         #Holds of Stone and Sorcery
 DATAW_ulstor_events.0116.tit: "Оплоты камня и чар"
 DATAW_ulstor_events.0116.desc: "Истекающее кровью сердце Морозных гор пало перед мощью моих войск. Издавна здесь жили кланы могущественных магов. Древняя история края, полная кровопролития и загадок, ослабила благоволение Хозяйки Небес. Теперь прежние враги стали подданными, но нам следует опасаться и других угроз. Если я хочу править этим краем, воинам придётся закалить себя не только для битв, но и для встречи с неведомой магией и таящимися во мраке опасностями. Однако мне знакомы лишь война и стратегия, а в чарах я почти ничего не смыслю…"
 DATAW_ulstor_events.0116.opt.a: "Обратиться за советом к местным авгурам!"
 DATAW_ulstor_events.0116.opt.a.tooltip: "Разве здешние традиции не смогут и дальше указывать нам путь?"
 DATAW_ulstor_events.0116.opt.b: "Поручить сильнейшим танам утвердить нашу власть!"
 DATAW_ulstor_events.0116.opt.b.tooltip: "Единственный путь к миру — сила."
 DATAW_ulstor_events.0116.opt.c: "Только прямое правление обуздает этих деревенских колдунов!"
 DATAW_ulstor_events.0116.opt.c.tooltip: "Показать местным, что мы пришли надолго и что в Морозных горах есть лишь одна власть."

#Event 11.61        #To the Edge of the World
 DATAW_ulstor_events.01161.tit: "На край света"
 DATAW_ulstor_events.01161.desc: "Западные оплоты покорились моей власти. Эти земли сильно отличаются от привычных мне. Их восточные соседи некогда поддерживали теснейшие связи с пограничной Ферелденской долиной, но здешним оплотам подобная дипломатия была чужда. Поэтому народы западной стороны Морозных гор проникнуты духом яростной независимости. Но рано или поздно этой вольности суждено было закончиться…"
 DATAW_ulstor_events.01161.opt.a: "Необходимо посоветоваться с мудрейшими танами!"
 DATAW_ulstor_events.01161.opt.a.tooltip: "Чтобы успешно управлять краем, нужно обратиться за советом к самым опытным вождям."
 DATAW_ulstor_events.01161.opt.b: "Править достойны лишь доказавшие свою доблесть!"
 DATAW_ulstor_events.01161.opt.b.tooltip: "Право управлять получат лишь самые способные вожди."
 DATAW_ulstor_events.01161.opt.c: "В Морозных горах есть лишь одна власть!"
 DATAW_ulstor_events.01161.opt.c.tooltip: "Скайхолд необходимо принудить к покорности, а его народ должен понять, что мы пришли навсегда!"





#Event 11.7         #A New Sun on the Frostbacks
 DATAW_ulstor_events.0117.tit: "Новое солнце над Морозными горами"
 DATAW_ulstor_events.0117.desc_1: "Я, Ульстор [Select_CString(ROOT.Char.IsFemale, 'Скульдсдоттен', 'Скульдсен' )], [Select_CString(ROOT.Char.IsFemale, 'объединила', 'объединил' )] авваров под своей единоличной властью. Все кланы сплотились под одним знаменем. Я [Select_CString(ROOT.Char.IsFemale, 'воплотила', 'воплотил' )] то, о чём не смел мечтать ни один тан. Когда много лет назад я [Select_CString(ROOT.Char.IsFemale, 'выступила', 'выступил' )] на Эджхолл, то [Select_CString(ROOT.Char.IsFemale, 'не могла', 'не мог' )] знать, куда приведёт меня путь и какая слава ожидает впереди. В бесчисленных битвах я [Select_CString(ROOT.Char.IsFemale, 'вела', 'вёл' )] воинов за собой, пока один оплот за другим не покорялся или не падал, а теперь скальды навеки сохранят моё имя в песнях. \n\nСвет Создателя вознёс меня к вершине величия, и горы будут купаться в его тепле. Над Морозными горами и их народом восходит новая заря. Моя легенда разнесётся по всему Тедасу, ибо я — [Select_CString(ROOT.Char.IsFemale, 'первая королева авваров, госпожа танов', 'первый король авваров, тан танов' )]. Я — Волчья Рука!"
 DATAW_ulstor_events.0117.desc_2: "Я, Ульстор [Select_CString(ROOT.Char.IsFemale, 'Скульдсдоттен', 'Скульдсен' )], [Select_CString(ROOT.Char.IsFemale, 'объединила', 'объединил' )] авваров под своей единоличной властью. Все кланы сплотились под одним знаменем. Я [Select_CString(ROOT.Char.IsFemale, 'воплотила', 'воплотил' )] то, о чём не смел мечтать ни один тан. Когда много лет назад я [Select_CString(ROOT.Char.IsFemale, 'выступила', 'выступил' )] на Эджхолл, то [Select_CString(ROOT.Char.IsFemale, 'не могла', 'не мог' )] знать, куда приведёт меня путь и какая слава ожидает впереди. В бесчисленных битвах я [Select_CString(ROOT.Char.IsFemale, 'вела', 'вёл' )] воинов за собой, пока один оплот за другим не покорялся или не падал, а теперь скальды навеки сохранят моё имя в песнях. \n\nКорт, Хозяйка Небес и Гаккон вознесли меня к вершине величия, и горы навеки сохранят их благоволение. Над Морозными горами и их народом восходит новая заря. Моя легенда разнесётся по всему Тедасу, ибо я — [Select_CString(ROOT.Char.IsFemale, 'первая королева авваров, госпожа танов', 'первый король авваров, тан танов' )]. Я — Волчья Рука!"
 DATAW_ulstor_events.0117.opt.a: "Пусть моё королевство сияет вечно!"
 DATAW_ulstor_events.0117.opt.a.tooltip: "Вы объединили авваров, и ваша легенда стала краеугольным камнем державы, которой суждено пережить века!"






