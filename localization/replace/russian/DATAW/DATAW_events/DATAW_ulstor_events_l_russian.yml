 DATAW_ulstor_events.0091.opt.b.tooltip: "Подсказка-заглушка"






# EVENT 9.2     #Leading by Example
 DATAW_ulstor_events.0092.tit: "Показать пример"
 DATAW_ulstor_events.0092.desc: "Текст-заглушка события «Показать пример»"
 DATAW_ulstor_events.0092.opt.a: "Мы поведём стаю на Портсмут!"
 DATAW_ulstor_events.0092.opt.a.tooltip: "Подсказка-заглушка"

# EVENT 9.3     #Taking Charge
 DATAW_ulstor_events.0093.tit: "Взять всё в свои руки"
 DATAW_ulstor_events.0093.desc: "Текст-заглушка события «Взять всё в свои руки»"
 DATAW_ulstor_events.0093.opt.a: "Разослать приказы: мы идём на Портсмут!"
 DATAW_ulstor_events.0093.opt.a.tooltip: "Подсказка-заглушка"





# EVENT 10.0     #With Axe and Frost
 DATAW_ulstor_events.010.tit: "Топором и морозом"
 DATAW_ulstor_events.010.desc: "Во имя Гаккона я [Select_CString(ROOT.Char.IsFemale, 'разорвала', 'разорвал' )] войска низинников. Мой топор обрушивается на врагов бога войны, словно свирепый зимний ветер. Услышав наш боевой клич, несущийся с гор, жители низин трясутся от страха. Топором и морозом мы сеем ужас Гаккона. \n\nБог войны и зимы наделяет верных воинов неземной силой и отвагой. Каждый из нас рвёт врагов, словно зверь, но я, Волчья Рука, — [Select_CString(ROOT.Char.IsFemale, 'непревзойдённая поборница', 'непревзойдённый поборник' )] Гаккона. Клейны могут проклинать моё имя, но сумеют ли они устоять перед моей мощью?"
 DATAW_ulstor_events.010.opt.a: "Разослать приказы: мы идём на Портсмут!"
 DATAW_ulstor_events.010.opt.a.tooltip: "Избрать самый решительный путь и попытаться захватить весь Портсмут одним ударом. Это может вдохновить других авваров присоединиться к вам. \n\nПримечание: чтобы продолжить, необходимо завоевать весь Портсмут."
 DATAW_ulstor_events.010.opt.b: "Точите топоры — наш час придёт!"
 DATAW_ulstor_events.010.opt.b.tooltip: "Действовать осторожнее, разделяя и поочерёдно покоряя банны и эрлинги Портсмута. Этот путь безопаснее, пусть и потребует больше времени. \n\nПримечание: чтобы продолжить, необходимо завоевать весь Портсмут."

# EVENT 10.1     #Clearing the Way
 DATAW_ulstor_events.0101.tit: "Расчистить путь"
 DATAW_ulstor_events.0101.desc: "Текст-заглушка события «Расчистить путь»"
 DATAW_ulstor_events.0101.opt.a: "Расчистить путь: зима идёт на Портсмут!"
 DATAW_ulstor_events.0101.opt.a.tooltip: "Подсказка-заглушка"

# EVENT 10.2     #Culling the Weak
 DATAW_ulstor_events.0102.tit: "Истребить слабых"
 DATAW_ulstor_events.0102.desc: "Текст-заглушка события «Истребить слабых»"
 DATAW_ulstor_events.0102.opt.a: "Разослать приказы: мы идём на Портсмут!"
 DATAW_ulstor_events.0102.opt.a.tooltip: "Подсказка-заглушка"
















# EVENT 10.3     #Quake the Wake
 DATAW_ulstor_events.0103.tit: "Уэйк содрогается"
 DATAW_ulstor_events.0103.desc: "Портсмут лежит в руинах, а слабаки, некогда называвшие его домом, рассеялись по окраинам моей державы. Вместо них в крае поселилась новая волна авварских ветеранов завоевания. \n\nНарод уже проклинает мою власть и призывает восстать против завоевателей. Советники, однако, твердят, что новая слава совсем близко — стоит лишь протянуть руку."
 DATAW_ulstor_events.0103.opt.a: "Они познают гнев Корта!"                 #only available if stayed avvar
 DATAW_ulstor_events.0103.opt.a.tooltip: "Они содрогнутся от ярости Отца Гор."
 DATAW_ulstor_events.0103.opt.b: "Они познают гнев Гаккона!"                #only available if converted to haakon
 DATAW_ulstor_events.0103.opt.b.tooltip: "Они познают холодные объятия Гаккона Зимодыха."

# EVENT 10.4     #Gate to Ferelden
 DATAW_ulstor_events.0104.tit: "Врата в Ферелден открыты"
 DATAW_ulstor_events.0104.desc: "Редклиф — дом рода Герин и последняя линия обороны против любого, кто вторгается в Ферелден с запада. Ни один завоеватель не сумел пройти через Внутренние земли, если прежде не владел Редклифом или не захватывал его. Теперь он наш. \n\nНарод ликует: перед жителями Морозных гор открывается весь мир."
 DATAW_ulstor_events.0104.opt.a: "Врата открыты…"
 DATAW_ulstor_events.0104.opt.a.tooltip: "…и ничто нас не остановит!"

# EVENT 10.5     #From upon the Mighty Hill
 DATAW_ulstor_events.0105.tit: "С вершины могучего холма"
 DATAW_ulstor_events.0105.desc: "Лотеринг взят, а вместе с ним и холмы Южного Ферелдена. Всё больше наших людей переселяются на восток и осваивают завоёванные земли, особенно у дальних рубежей."
 DATAW_ulstor_events.0105.opt.a: "Эти холмы принадлежат авварам!"
 DATAW_ulstor_events.0105.opt.a.tooltip: "Вперёд, к новой славе!"

# EVENT 10.6     #Routing the Lost Tribe
 DATAW_ulstor_events.0106.tit: "Разгромить заблудшее племя"
 DATAW_ulstor_events.0106.desc: "Многие мудрецы называли бресилианцев нашими давно утраченными родичами и утверждали, что они не дальше от нас, чем хасинды и клейны. Теперь эти мудрецы увидели свою ошибку. \n\nБресилианцы охотно якшались с демонами и породили на этой земле мерзостных тварей. Иных доказательств их порочности не требуется."
 DATAW_ulstor_events.0106.opt.a: "Лес падёт под гневом Корта!"                 #only available if stayed avvar
 DATAW_ulstor_events.0106.opt.a.tooltip: "С демонами нельзя вести игры."
 DATAW_ulstor_events.0106.opt.b: "Лес падёт под гневом Гаккона!"                #only available if converted to haakon
 DATAW_ulstor_events.0106.opt.b.tooltip: "С демонами нельзя вести игры."

# EVENT 10.7     #The Abandoned Outpost
 DATAW_ulstor_events.0107.tit: "Покинутый форпост"
 DATAW_ulstor_events.0107.desc: "Гварен покинут, его стены рушатся, а жители разбежались. Форпост медленно истлевает, свидетельствуя о постигшем край хаосе. Некогда отсюда правил могучий эрлинг, державший в страхе морское побережье и Дикие земли Коркари и опиравшийся на гномьих союзников. Но прошлое ушло. Теперь Гвареном правят аввары, и у нас на него свои планы."
 DATAW_ulstor_events.0107.opt.a: "Гварен принадлежит нам."
 DATAW_ulstor_events.0107.opt.a.tooltip: "Быть может, ещё один вход на Глубинные тропы пригодится в будущем?"

# EVENT 10.8     #A People's Hopes - Crushed
 DATAW_ulstor_events.0108.tit: "Надежды народа раздавлены"
 DATAW_ulstor_events.0108.desc: "От последнего оборванца до знатнейшего вельможи за высокими стенами Форта Драккон — все уже знают новость. Денерим наш, и вскоре его примеру последует весь остальной Ферелден, если ещё не последовал."
 DATAW_ulstor_events.0108.opt.a: "Авгуры давно предрекали этот миг."
 DATAW_ulstor_events.0108.opt.a.tooltip: ""

# EVENT 10.9     #A Long Kept Vigil
 DATAW_ulstor_events.0109.tit: "Долгое бдение"
 DATAW_ulstor_events.0109.desc: "Твердыня Тысячи Неспящих, которую клейны называют Башней Бдения, — древнейшая и самая могучая авварская крепость за пределами Морозных гор. Впервые почти за четыре века она вновь принадлежит нам. \n\nКланы уже начинают селиться в её стенах."
 DATAW_ulstor_events.0109.opt.a: "Её бдение было не напрасным."
 DATAW_ulstor_events.0109.opt.a.tooltip: "Север Ферелдена наш!"

# EVENT 10.10     #Like Sheep before the Wolf
 DATAW_ulstor_events.01010.tit: "Как овцы перед волком"
 DATAW_ulstor_events.01010.desc: "Слабые трепещут перед нашим натиском. Оплоты горят, вдовы рыдают, а клейны взывают к правосудию — но оно так и не приходит. \n\nТеперь житница Ферелдена в наших руках."
 DATAW_ulstor_events.01010.opt.a: "Показать им, что значит настоящая власть!"
 DATAW_ulstor_events.01010.opt.a.tooltip: "Выжечь трусов и слабаков."

# EVENT 10.11     #Ulstor wept
 DATAW_ulstor_events.01011.tit: "Ульстор плакал"
 DATAW_ulstor_events.01011.desc: "Мне и не верилось, что такое возможно, но вот я здесь. Когда много лет назад я [Select_CString(ROOT.Char.IsFemale, 'покинула', 'покинул' )] Фар-Пик, вряд ли кто-то из моих соклановцев предполагал, что однажды — уже скоро — весь Ферелден содрогнётся от моей поступи. \n\nНо те дни миновали. Теперь настал мой час, и начинается эпоха Волчьей Руки."
 DATAW_ulstor_events.01011.opt.a: "…ибо больше не осталось земель для завоевания."
 DATAW_ulstor_events.01011.opt.a.tooltip: "Во мне возродился Маферат!"

