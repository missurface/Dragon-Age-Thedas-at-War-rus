# EVENT 6     #Cleaning Up
 DATAW_ulstor_events.006.tit: "Навести порядок"
 DATAW_ulstor_events.006.desc: "Мы успешно упрочили власть над Эджхоллом и теперь должны заняться восстановлением и развитием края. Но не стоит забегать вперёд. Наши богатства заметно приумножились, и управляющий представил нам предложение: перестроить Эджхолл по нашему замыслу, воплотив видение будущего. Каким же должно быть это будущее?"
 DATAW_ulstor_events.006.opt.a: "Перестроить Эджхолл как традиционный авварский оплот."
 DATAW_ulstor_events.006.opt.a.tooltip: "Это сблизит нас с авварскими традиционалистами."
 DATAW_ulstor_events.006.opt.b: "Обновить Эджхолл в более современном клейнском стиле."
 DATAW_ulstor_events.006.opt.b.tooltip: "Это поможет нам легче сблизиться с остальным Ферелденом."
 DATAW_ulstor_events.006.opt.c: "Вернуть Эджхоллу первоначальный гномий облик."
 DATAW_ulstor_events.006.opt.c.tooltip: "Выбор не самый очевидный и намного более дорогой, зато такой Эджхолл будет неповторим и величествен. Все увидят, что мы не очередные пёсьи лорды."

# EVENT 6.01  #A NEW PATH
 DATAW_ulstor_events.00601.tit: "Новый путь"
 DATAW_ulstor_events.00601.desc: "Эджхолл возрождён! Народ нашей державы с надеждой смотрит в будущее. Но и мне нельзя упускать его из виду. Сосредоточиться ли нам на укреплении хозяйства или готовиться к грядущим войнам? У каждого пути есть свои достоинства, и совет не может прийти к согласию."
