l_russian:
  DATAW_sovr_events.0001.t: "The Sack of Val Royeaux"
  DATAW_sovr_events.0001.start: "The stories I have received are horrifying. [val_royeaux.GetNameNoTier] has fallen, and the soldiers led by [dalish_general.GetName] have laid waste to the city, leaving slaughtered innocent folks to rot amidst burning palaces, homes, and chantries. The University's books have been taken, torn or burned, and the whole town is now imbued in flames as the soldiers allow themselves every vice under the sun."
  DATAW_sovr_events.0001.restraint: "\n\nIt is said that the general supposedly called for restraint of [dalish_general.GetHerHisMy] forces in the massacre, yet [dalish_general.GetHerHisMy] calls were left mostly unheard as the rampaging continued."
  DATAW_sovr_events.0001.sherman: "\n\nIt is said that the general only watched with a disinterested eye as [dalish_general.GetHerHisMy] forces rampaged, killed and burned the city and its inhabitants with impunity."
  DATAW_sovr_events.0001.decapitate: "\n\nIs is said that under the general's command, hundres of civilians were decapitated and their heads brought alongside their belongings in a grotesque pile in the middle of the imperial throne room."
  DATAW_sovr_events.0001.sword_lost: "Regretfully, the [sword.GetName] of the late Divine has also been captured in the chaos by the rampaging army."
  DATAW_sovr_events.0001.sword_prison: "Regretfully, the [sword.GetName] of the late Divine has also been captured in the chaos by the rampaging army, and currently resides in the hands of a prisoner of the Dalish Army, [orlesian_courtier.GetName]"
  DATAW_sovr_events.0001.sword_spared: "Thankfully the [sword.GetName] alongside a courtier named [orlesian_courtier.GetName] were safely escored out due to the orders of [dalish_general.GetName]."
  DATAW_sovr_events.0001.mid: "\n\nAs the ultimate sacrilege, reports say that [dalish_general.GetFirstNamePossessiveNoTooltip] soldiers broke down the sacred tomb of the late Emperor [kordy1.GetName]."
  DATAW_sovr_events.0001.ashes_destroyed: "\n\nThe tomb itself was not spared, as [ashes.GetName] were scattered and the [emperor_shield.GetName], the [scepter.GetName], and the [anointed_armor.GetName] were taken."
  DATAW_sovr_events.0001.tomb_spared: "\n\nHowever, the tomb itself was spared thanks to the general's intervention, and was left mostly untouched."
  DATAW_sovr_events.0001.tomb_destroyed: "\n\nThe tomb was utterly trashed and all priceless artefacts of the Anointed were destroyed, as [ashes.GetName] were scattered to the winds, [emperor_shield.GetName] was destroyed and cast into the sea, the [scepter.GetName] was used as a makeshift execution axe until it lay in pieces, and the [anointed_armor.GetName] was struck and torn by the fire."
  DATAW_sovr_events.0001.tomb_pillaged: "\n\nIt is said that [ashes.GetName], the [scepter.GetName], the [emperor_shield.GetName], the [anointed_armor.GetName], and countless jewels were all taken by the general for [dalish_general.GetHerselfHimself]."
  DATAW_sovr_events.0001.end: "\n\nAlready, many have fled to the countryside and continue telling of the Butcher of Val Royeaux, [dalish_general.GetNameNoTooltip], and [dalish_general.GetHerHisMy] grand destruction."
  DATAW_sovr_events.0001.a: "Such tragedy…"
  DATAW_sovr_events.0001.a.custom_desc_1: "The development of [val_royeaux.GetNameNoTier] has decreased by 5"
  DATAW_sovr_events.0001.a.custom_desc_2: "The development of [val_royeaux.GetNameNoTier] has decreased by 10"
  DATAW_sovr_events.0001.a.custom_desc_3: "The development of [val_royeaux.GetNameNoTier] has decreased by 15"
  DATAW_sovr_events.0002.t: "The Restoration"
  DATAW_sovr_events.0002.desc: "#EMP And around it, a chorus of spirits sang: \n\"Whatsoever passes through the fire \nIs not lost, but made eternal; \nAs air can never be broken nor crushed, \nThe tempered soul is everlasting!\" #! \n\nAs [divine.GetFirstNameRegnal] continued singing the Canticle of Exaltations, in memory of its writer [kordy1.GetFullNameNicknamedRegnal],the artefacts of the Emperor stayed on the side of the stairs leading to his tomb, awaiting the end of the Canticle. \n\nThe last word is spoken, and so the artefacts move through the recently renovated doors of the tomb, through the golden intricated walls and the many paintings and carvings. Carefully, the artefacts are placed, one by one, on the designated pillars surrouding a carefully engraved pedestal. Only one of these artefacts is missing, the ashes of the Emperor himself, which makes the ceremonly feel oh so incomplete. In its stead is a statue of the Emperor, his sword risen towards the sun, to replace what had been lost."
  DATAW_sovr_events.0002.a: "A tomb restored at last, for the glory of the Empire."
  DATAW_sovr_events.0003.t: "The Glorious Restoration"
  DATAW_sovr_events.0003.desc: "#EMP And around it, a chorus of spirits sang: \n\"Whatsoever passes through the fire \nIs not lost, but made eternal; \nAs air can never be broken nor crushed, \nThe tempered soul is everlasting!\" #! \n\nAs [divine.GetFirstNameRegnal] continued singing the Canticle of Exaltations, in memory of its writer [kordy1.GetFullNameNicknamedRegnal],the artefacts of the Emperor stayed on the side of the stairs leading to his tomb, awaiting the end of the Canticle. \n\nThe last word is spoken, and so the artefacts move through the recently renovated doors of the tomb, through the golden intricated walls and the many paintings and carvings. Carefully, the artefacts are placed, one by one, on the designated pillars surrouding a carefully engraved pedestal. In the end, [ashes.GetName] are carefully placed in the tomb's center, exactly as it was before that fateful day when everything burned."
  DATAW_sovr_events.0003.a: "A tomb restored fully, for the glory of the Empire."
  DATAW_sovr_events.0003.a.custom_desc_1: "You receive the Restoration of the Emperor’s Tomb [legend_seed|E]"
  DATAW_sovr_events.0004.t: "The Sack of Val Royeaux: The Broken City"
  DATAW_sovr_events.0004.desc: "I have been told stories of the Sack of Val Royeaux. Stories of the atrocities committed in the heart of the Empire, of the slaughter made right on the Divine's doorstep. I came into the city expecting to see a ruin, a dead and rotting pile of rubttle with nothing else to see, but the city still stands and holds some of its beauty. \n\nIt is a strange sight to see such magnificent structures of marble, gold and bronze amidst buildings burnt to extinction, rotting planks and shattered windows. It is even stranger to see so few people wandering the city, as the only people I hadve seen were the town guard at the entrance and a few others rarely patrolling the streets. \n\nBut then, as I turn a corner, I see my first civilian. Far away in the distance, I see a homeless peasant, holding what seems to be a bone with some rotten meat attached to it, advancing towards me. [maimed_peasant.GetHerHisMy] eyes are as blank as the sea, and continue walking past me, as if I never existed. \n\nCrouching down, [maimed_peasant.GetSheHe] stops before a small rotting corpse, halfway eaten by worms already. The peasant drops the bone to the ground and sits down right next to it, as if mimicking the wait for the corpse to be finished with the meal, before crumbling in tears."
  DATAW_sovr_events.0004.a: "There is nothing we can do."
  DATAW_sovr_events.0004.b: "Some gold for a cremation is the least I can do."
  DATAW_sovr_events.0004.c: "Bring [maimed_peasant.GetHerHim] with us, I cannot see such suffering uncared for."
  DATAW_sovr_events.0005.t: "The Sack of Val Royeaux: The Butcher Captured"
  DATAW_sovr_events.0005.intro: "In my custody stands an infamous person, the person who lit Val Royeaux asunder, [butcher.GetName]. [butcher.GetSheHe|U] stands behind my bars, at my mercy of anything I could do to [butcher.GetHerHim] in revenge for the infamous sack."
  DATAW_sovr_events.0005.delivery: "\n\nThe Butcher was initially captured by [initial_captor.GetName], but [initial_captor.GetSheHe] was sent to me, claiming that no one other than me should do the ruling."
  DATAW_sovr_events.0005.compassionate: "#EMP \n\n[butcher.GetHerHisMy|U] weeping is not what I would have expected for someone so reviled.#!"
  DATAW_sovr_events.0005.callous: "#EMP \n\n[butcher.GetHerHisMy|U] blank face is exactly what I would have expected of such a cold monster. Eyes empty, unable to sympathize with those that suffered because of [butcher.GetHerHim]#!"
  DATAW_sovr_events.0005.sadistic: "#EMP \n\nWhen I ask [butcher.GetHerHim] if [butcher.GetSheHe] knows how many people suffered because of the Sack of Val Royeaux, all I see is a sick, pleased smile, the one of a monster.#!"
  DATAW_sovr_events.0005.end: "\n\nNow, the decision is mine."
  DATAW_sovr_events.0005.a: "Kill the butcher, and Val Royeaux will be avenged."
  DATAW_sovr_events.0005.b: "Ship [butcher.GetHerHim] to [emperor.GetFirstNameRegnal], [emperor.GetSheHe] deserves to do the judgement."
  DATAW_sovr_events.0005.c: "Let [butcher.GetHerHim] rot, and perhaps I will find out what to do with them."
  DATAW_sovr_events.0006.t: "The Sack of Val Royeaux: A New Exalted March"
  DATAW_sovr_events.0006.intro: "\"Are you familiar with the finer words of the Canticle of Exaltations, [ROOT.Char.GetName]?\" said [divine.GetName]. \"More specifically the tenth stanza, where Kordillus receives his destiny from the Maker's bride?"
  DATAW_sovr_events.0006.zealot: "Replying with approval, I prepare myself and sing the stanza flawlessly, from the first word to the last: \n\n#italic I covered my face, fearful, \nBut the Lady took my hands from my eyes, \nSaying, \"Remember the fire. You must pass \nThrough it alone to be forged anew. \nLook! Look upon the Light so you \nMay lead others here through the darkness, \nBlade of the Faith!\" #!"
  DATAW_sovr_events.0006.notzealot: "After subtly revealing my ignorance without explicitly acknowledging it, as expected, the Divine begins her chant of the stanza, beautifully singing: \n\n#italic I covered my face, fearful, \nBut the Lady took my hands from my eyes, \nSaying, \"Remember the fire. You must pass \nThrough it alone to be forged anew. \nLook! Look upon the Light so you \nMay lead others here through the darkness, \nBlade of the Faith!\" #!"
  DATAW_sovr_events.0006.end: "\n\n\"The hardships that we face in this war are just the beginning. The suffering, the battles we have lost against the heathen horde, those must all be avenged. Look upon the Light, oh Emperor, and follow the footsteps that the Maker’s Bride took against the Tevinter Imperium.\" \n\nThe last step is left unsaid, but clear as day. An Exalted March, a great holy war, against [GetTitleByKey('k_the_dales').GetNameNoTier]. A mobilization of every pious andrastian, every lord, every peasant, to march against those that have massacred Red Crossing and so many more of our people."
  DATAW_sovr_events.0006.a: "We shall slaughter every knife-ear on the way to Halamshiral."
  DATAW_sovr_events.0006.b: "Blade of the Faith! To war, for the Maker and his Bride!"
  DATAW_sovr_events.0006.c: "This is the only way we could win this war."
  DATAW_sovr_events.0006.d: "Never another Red Crossing!"
  DATAW_sovr_events.0006.e: "Never another sack shall be made. Vengeance, for Val Royeaux!"
  DATAW_sovr_events.0006.f: "It is what must be done. Prepare the announcement."
  DATAW_sovr_events.0007.t: "Exalted March: In the Maker’s Name!"
  DATAW_sovr_events.0007.andrastian: "Far in the distance, I hear a yell. A call to arms, sung to the commoner and noble alike. A chanter is heard yelling faraway. \n\n\"The Sun calls you and your aid! For the first time since [andraste|E] herself, the call to arms for an [exalted_march|E] has been made! Take your scythe, your sword, and let us march against the heathen knife-ears of the [dales.GetNameNoTier]! Be the Blade of the Faith, and let us avenge [red_crossing.GetNameNoTier]!\" \n\n#italic Blade of the Faith! Justice for Red Crossing!\" Yells the crowd in unison."
  DATAW_sovr_events.0007.elvhen: "Far in the distance, I hear a crier yelling. A call to alarm, sung to the commoner and noble alike. A messenger is heard yelling faraway. \n\n\"The [chantry|EU] comes for us! The [shemlen|E]s have come to slaughter us and our culture, like the Imperium did! They have come to kill our mothers, our daughters, and to plunder our homes and our temples! They will destroy everything that makes us who we are, and force us to marry humans until our race is gone! Protect your people, protect your home, and protect who we are!\" \n\n#italic Vir enasalin! Long live the second homeland!\" Yells the crowd in unison."
  DATAW_sovr_events.0007.fallbackvr: "Far in the distance, I hear a crier yelling. News sung by a faraway traveller to the commoner and noble alike. A messenger is heard yelling faraway. \n\n\"The [divine.GetName] declares an [exalted_march|E] against the Dales, transforming the conflict into the first Exalted March since Andraste! The [dales.GetNameNoTier] find themselves against the full force of the Orlesian juggernaut after the notorious attacks on the peasants of [red_crossing.GetNameNoTier] and [val_royeaux.GetNameNoTier]!"
  DATAW_sovr_events.0007.fallbackrc: "Far in the distance, I hear a crier yelling. News sung by a faraway traveller to the commoner and noble alike. A messenger is heard yelling faraway. \n\n\"The [divine.GetName] declares an [exalted_march|E] against the Dales, transforming the conflict into the first Exalted March since Andraste! The [dales.GetNameNoTier] find themselves against the full force of the Orlesian juggernaut after the notorious attacks on the peasants of [red_crossing.GetNameNoTier] and the multiple Dalish victories!"
  DATAW_sovr_events.0007.a: "I will pledge myself to the cause! #italic Blade of the Faith!#!"
  DATAW_sovr_events.0007.b: "We are walking through history."
  DATAW_sovr_events.0007.c: "Once more, the [elvhen|E] homeland is at threat."
  DATAW_sovr_events.0007.d: "Good. Let them fight."
  DATAW_sovr_events.0007.e: "This slaughter is sad, but not our affair."
  DATAW_sovr_events.0007.a.custom_desc_1: "An Exalted March is declared against [dales.GetNameNoTier]."
  DATAW_sovr_events.0007.a.custom_desc_2: "You join the Exalted March."