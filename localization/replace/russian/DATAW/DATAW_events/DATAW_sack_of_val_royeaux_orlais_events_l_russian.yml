l_russian:
  DATAW_sovr_events.0001.t: "Разграбление Вал Руайо"
  DATAW_sovr_events.0001.start: "Полученные мною вести приводят в ужас. [val_royeaux.GetNameNoTier] пал, а войска под предводительством персонажа [dalish_general.GetName] разорили город. Тела убитых мирных жителей гниют среди пылающих дворцов, домов и церквей. Книги Университета разграблены, изорваны или сожжены, весь город объят пламенем, а солдаты предаются всем мыслимым порокам."
  DATAW_sovr_events.0001.restraint: "\n\nГоворят, во время резни [dalish_general.GetNameNoTooltip] [Select_CString(dalish_general.IsFemale, 'призывала', 'призывал' )] свои войска к сдержанности, но к [Select_CString(dalish_general.IsFemale, 'её', 'его' )] словам почти никто не прислушался и бесчинства продолжились."
  DATAW_sovr_events.0001.sherman: "\n\nГоворят, [dalish_general.GetNameNoTooltip] лишь [Select_CString(dalish_general.IsFemale, 'наблюдала', 'наблюдал' )] с безразличием, как [Select_CString(dalish_general.IsFemale, 'её', 'его' )] войска безнаказанно грабят и жгут город, убивая его жителей."
  DATAW_sovr_events.0001.decapitate: "\n\nГоворят, по приказу командования сотням мирных жителей отрубили головы, а затем вместе с их пожитками свалили жуткой грудой посреди императорского тронного зала."
  DATAW_sovr_events.0001.sword_lost: "К несчастью, в разразившемся хаосе неистовствующая армия захватила и [sword.GetName], принадлежавший покойной Верховной Жрице."
  DATAW_sovr_events.0001.sword_prison: "К несчастью, в разразившемся хаосе неистовствующая армия захватила и [sword.GetName], принадлежавший покойной Верховной Жрице. Теперь реликвия находится у [Select_CString(orlesian_courtier.IsFemale, 'пленницы', 'пленника' )] долийского войска по имени [orlesian_courtier.GetName]."
  DATAW_sovr_events.0001.sword_spared: "К счастью, по приказу персонажа [dalish_general.GetName] реликвию [sword.GetName] и [Select_CString(orlesian_courtier.IsFemale, 'придворную', 'придворного' )] по имени [orlesian_courtier.GetName] благополучно вывели из города."
  DATAW_sovr_events.0001.mid: "\n\nНо самым чудовищным святотатством стало разорение священной гробницы покойного императора [kordy1.GetName] войсками, которыми командует [dalish_general.GetFirstNameNoTooltip]."
  DATAW_sovr_events.0001.ashes_destroyed: "\n\nНе пощадили и саму гробницу: [ashes.GetName] развеяли, а [emperor_shield.GetName], [scepter.GetName] и [anointed_armor.GetName] похитили."
  DATAW_sovr_events.0001.tomb_spared: "\n\nИ всё же благодаря вмешательству командования гробницу пощадили и почти не тронули."
  DATAW_sovr_events.0001.tomb_destroyed: "\n\nГробницу полностью разгромили, а все бесценные реликвии Помазанника уничтожили. [ashes.GetName] развеяли по ветру, [emperor_shield.GetName] разбили и бросили в море, [scepter.GetName] использовали вместо топора для казней, пока тот не раскололся на части, а [anointed_armor.GetName] изрубили и предали огню."
  DATAW_sovr_events.0001.tomb_pillaged: "\n\nГоворят, [dalish_general.GetNameNoTooltip] [Select_CString(dalish_general.IsFemale, 'присвоила', 'присвоил' )] [ashes.GetName], [scepter.GetName], [emperor_shield.GetName], [anointed_armor.GetName] и бесчисленные драгоценности."
  DATAW_sovr_events.0001.end: "\n\nМногие уже бежали в сельские края и повсюду рассказывают о Палаче Вал Руайо — [dalish_general.GetNameNoTooltip] — и великом разорении, которое [Select_CString(dalish_general.IsFemale, 'она принесла', 'он принёс' )]."
  DATAW_sovr_events.0001.a: "Какая трагедия…"
  DATAW_sovr_events.0001.a.custom_desc_1: "Развитие титула [val_royeaux.GetNameNoTier] снижается на 5"
  DATAW_sovr_events.0001.a.custom_desc_2: "Развитие титула [val_royeaux.GetNameNoTier] снижается на 10"
  DATAW_sovr_events.0001.a.custom_desc_3: "Развитие титула [val_royeaux.GetNameNoTier] снижается на 15"
  DATAW_sovr_events.0002.t: "Восстановление"
  DATAW_sovr_events.0002.desc: "#EMP И хор духов запел вокруг: \n«Всё, что проходит сквозь огонь, \nНе гибнет, но навеки остаётся; \nКак воздух невозможно сокрушить, \nТак закалённая душа живёт вовеки!» #! \n\nПока [divine.GetFirstNameRegnal] продолжает исполнять Песнь Возвышения в память о её авторе, [kordy1.GetFullNameNicknamedRegnal], императорские реликвии покоятся у лестницы, ведущей к гробнице, и ожидают завершения песнопения. \n\nЗвучит последнее слово. Реликвии проносят через недавно восстановленные двери гробницы, мимо затейливых золотых стен, бесчисленных картин и резных украшений. Одну за другой их бережно возлагают на предназначенные для них постаменты вокруг искусно изукрашенного пьедестала. Не хватает лишь одной святыни — праха самого императора, и оттого церемония кажется мучительно незавершённой. На месте утраченного возвышается статуя императора с мечом, поднятым к солнцу."
  DATAW_sovr_events.0002.a: "Гробница наконец восстановлена во славу Империи."
  DATAW_sovr_events.0003.t: "Славное восстановление"
  DATAW_sovr_events.0003.desc: "#EMP И хор духов запел вокруг: \n«Всё, что проходит сквозь огонь, \nНе гибнет, но навеки остаётся; \nКак воздух невозможно сокрушить, \nТак закалённая душа живёт вовеки!» #! \n\nПока [divine.GetFirstNameRegnal] продолжает исполнять Песнь Возвышения в память о её авторе, [kordy1.GetFullNameNicknamedRegnal], императорские реликвии покоятся у лестницы, ведущей к гробнице, и ожидают завершения песнопения. \n\nЗвучит последнее слово. Реликвии проносят через недавно восстановленные двери гробницы, мимо затейливых золотых стен, бесчисленных картин и резных украшений. Одну за другой их бережно возлагают на предназначенные для них постаменты вокруг искусно изукрашенного пьедестала. Наконец [ashes.GetName] помещают в самом центре гробницы — именно там, где они покоились до того рокового дня, когда всё поглотил огонь."
  DATAW_sovr_events.0003.a: "Гробница восстановлена во всём великолепии — во славу Империи."
  DATAW_sovr_events.0003.a.custom_desc_1: "Вы получаете [Concept('legend_seed','зарождающуюся легенду')|E] «Восстановление императорской гробницы»"
  DATAW_sovr_events.0004.t: "Разграбление Вал Руайо: сломленный город"
  DATAW_sovr_events.0004.desc: "Мне не раз рассказывали о разграблении Вал Руайо — о зверствах в сердце Империи и бойне у самого порога Верховной Жрицы. Входя в город, я [Select_CString(ROOT.Char.IsFemale, 'ожидала', 'ожидал' )] увидеть лишь мёртвую груду гниющих обломков, но Вал Руайо всё ещё стоит и даже сохранил крупицу былой красоты. \n\nСтранно видеть величественные сооружения из мрамора, золота и бронзы среди выгоревших зданий, гнилых досок и разбитых окон. Ещё страннее почти не встречать людей: у ворот мне попалась лишь городская стража, а на улицах изредка видны дозорные. \n\nНо за углом я наконец замечаю мирного жителя. Вдалеке ко мне бредёт [Select_CString(maimed_peasant.IsFemale, 'бездомная крестьянка', 'бездомный крестьянин' )], сжимая в руке кость с клочками гнилого мяса. В [Select_CString(maimed_peasant.IsFemale, 'её', 'его' )] глазах — пустота, безбрежная, как море. Не замечая меня, [Select_CString(maimed_peasant.IsFemale, 'женщина проходит', 'мужчина проходит' )] мимо. \n\nПрисев, [Select_CString(maimed_peasant.IsFemale, 'крестьянка останавливается', 'крестьянин останавливается' )] перед маленьким гниющим трупом, уже наполовину изъеденным червями. Кость падает на землю. [maimed_peasant.GetFirstNameNoTooltip] садится рядом, словно ожидая, пока покойник закончит трапезу, а затем разражается рыданиями."
  DATAW_sovr_events.0004.a: "Мы ничем не можем помочь."
  DATAW_sovr_events.0004.b: "Я хотя бы дам золото на кремацию."
  DATAW_sovr_events.0004.c: "Возьмите [Select_CString(maimed_peasant.IsFemale, 'её', 'его' )] с нами. Нельзя бросать человека в таком состоянии."
  DATAW_sovr_events.0005.t: "Разграбление Вал Руайо: Палач [Select_CString(butcher.IsFemale, 'схвачена', 'схвачен' )]"
  DATAW_sovr_events.0005.intro: "В моей темнице находится печально известная личность — [butcher.GetName], [Select_CString(butcher.IsFemale, 'та, кто предала', 'тот, кто предал' )] Вал Руайо огню. Теперь [Select_CString(butcher.IsFemale, 'она стоит', 'он стоит' )] за решёткой, всецело в моей власти, и я могу сполна отомстить за бесславное разграбление."
  DATAW_sovr_events.0005.delivery: "\n\nПоначалу Палача [Select_CString(initial_captor.IsFemale, 'захватила', 'захватил' )] [initial_captor.GetName], но затем [Select_CString(butcher.IsFemale, 'пленницу', 'пленника' )] передали мне, заявив, что лишь я вправе вынести приговор."
  DATAW_sovr_events.0005.compassionate: "#EMP \n\nТрудно было ожидать слёз от существа, которое ненавидит столько людей.#!"
  DATAW_sovr_events.0005.callous: "#EMP \n\nБезжизненное лицо вполне подобает столь хладнокровному чудовищу. Пустые глаза не выражают ни малейшего сочувствия к тем, кто пострадал по [Select_CString(butcher.IsFemale, 'её', 'его' )] вине.#!"
  DATAW_sovr_events.0005.sadistic: "#EMP \n\nЯ спрашиваю, понимает ли [butcher.GetNameNoTooltip], сколько людей пострадало при разграблении Вал Руайо, — и вижу лишь болезненную, довольную улыбку чудовища.#!"
  DATAW_sovr_events.0005.end: "\n\nТеперь решение за мной."
  DATAW_sovr_events.0005.a: "Казнить Палача и отомстить за Вал Руайо."
  DATAW_sovr_events.0005.b: "Отправить [Select_CString(butcher.IsFemale, 'её', 'его' )] к [emperor.GetFirstNameRegnal]. [Select_CString(emperor.IsFemale, 'Императрица заслуживает', 'Император заслуживает' )] права вынести приговор."
  DATAW_sovr_events.0005.c: "Пусть [butcher.GetNameNoTooltip] гниёт в темнице. Возможно, со временем я решу, что делать дальше."
  DATAW_sovr_events.0006.t: "Разграбление Вал Руайо: новый Священный поход"
  DATAW_sovr_events.0006.intro: "«Знакомы ли вам самые прекрасные строки Песни Возвышения, [ROOT.Char.GetName]? — спрашивает [divine.GetName]. — Точнее, десятая строфа, в которой Невеста Создателя открывает Кордиллусу его предназначение?»"
  DATAW_sovr_events.0006.zealot: "Я одобрительно киваю и без единой ошибки исполняю всю строфу, от первого слова до последнего: \n\n#italic Я в страхе лик свой [Select_CString(ROOT.Char.IsFemale, 'сокрыла', 'сокрыл' )], \nНо Владычица руки отвела от моих глаз, \nСказав: «Запомни пламя. Ты [Select_CString(ROOT.Char.IsFemale, 'должна пройти', 'должен пройти' )] \nСквозь него в одиночестве, чтобы быть [Select_CString(ROOT.Char.IsFemale, 'выкованной', 'выкованным' )] заново. \nСмотри! Взгляни на Свет, чтобы \nСквозь тьму вести к нему других, \nКлинок Веры!» #!"
  DATAW_sovr_events.0006.notzealot: "Мне удаётся осторожно выдать своё невежество, не признаваясь в нём прямо. Как и следовало ожидать, [Select_CString(divine.IsFemale, 'Верховная Жрица', 'Верховный Жрец' )] начинает прекрасным голосом исполнять строфу: \n\n#italic Я в страхе лик свой [Select_CString(divine.IsFemale, 'сокрыла', 'сокрыл' )], \nНо Владычица руки отвела от моих глаз, \nСказав: «Запомни пламя. Ты [Select_CString(divine.IsFemale, 'должна пройти', 'должен пройти' )] \nСквозь него в одиночестве, чтобы быть [Select_CString(divine.IsFemale, 'выкованной', 'выкованным' )] заново. \nСмотри! Взгляни на Свет, чтобы \nСквозь тьму вести к нему других, \nКлинок Веры!» #!"
  DATAW_sovr_events.0006.end: "\n\n«Испытания, с которыми мы столкнулись в этой войне, — лишь начало. Страдания и поражения в сражениях с языческой ордой должны быть отмщены. Взгляните на Свет, о [Select_CString(ROOT.Char.IsFemale, 'императрица', 'император' )], и последуйте путём, которым Невеста Создателя прошла в борьбе с Тевинтерской империей». \n\nПоследний шаг остаётся невысказанным, но он ясен как день: Священный поход, великая война за веру против титула [GetTitleByKey('k_the_dales').GetNameNoTier]. Каждый набожный андрастианин, каждый лорд и каждый крестьянин должен выступить против тех, кто вырезал Ред-Кроссинг и погубил множество других наших людей."
  DATAW_sovr_events.0006.a: "По пути в Халамширал мы перебьём всех остроухих."
  DATAW_sovr_events.0006.b: "Клинок Веры! В бой — за Создателя и Его Невесту!"
  DATAW_sovr_events.0006.c: "Только так мы сможем победить в этой войне."
  DATAW_sovr_events.0006.d: "Ред-Кроссинг не должен повториться!"
  DATAW_sovr_events.0006.e: "Больше ни одного разграбления. Отомстим за Вал Руайо!"
  DATAW_sovr_events.0006.f: "Это необходимо. Готовьте обращение."
  DATAW_sovr_events.0007.t: "Священный поход: во имя Создателя!"
  DATAW_sovr_events.0007.andrastian: "Издалека до меня доносится крик — призыв к оружию, обращённый и к простолюдинам, и к знати. Где-то вдали глашатай надрывает голос: \n\n«Солнце призывает вас на помощь! Впервые со времён самой [Concept('andraste','Андрасте')|E] провозглашён [Concept('exalted_march','Священный поход')|E]! Берите косы и мечи — мы выступаем против остроухих язычников из земель титула [dales.GetNameNoTier]! Станьте Клинком Веры, и отомстим за [red_crossing.GetNameNoTier]!» \n\n#italic «Клинок Веры! Правосудие для Ред-Кроссинга!» — единым голосом ревёт толпа.#!"
  DATAW_sovr_events.0007.elvhen: "Издалека до меня доносится крик — тревожный зов, обращённый и к простолюдинам, и к знати. Где-то вдали вестник надрывает голос: \n\n«За нами идёт [Concept('chantry','Церковь')|E]! [Concept('shemlen','Шемлены')|E] хотят истребить нас и нашу культуру, как некогда Империя! Они убьют наших матерей и дочерей, разграбят дома и храмы! Они уничтожат всё, что делает нас народом, и заставят смешаться с людьми, пока наш род не исчезнет! Защитите свой народ, свой дом и самих себя!» \n\n#italic «Vir enasalin! Да здравствует вторая родина!» — единым голосом ревёт толпа.#!"
  DATAW_sovr_events.0007.fallbackvr: "Издалека до меня доносится голос глашатая. Вести, принесённые дальним путником, разлетаются среди простолюдинов и знати: \n\n«[divine.GetName] объявляет [Concept('exalted_march','Священный поход')|E] на Долы — первый со времён Андрасте! После чудовищных нападений на крестьян титулов [red_crossing.GetNameNoTier] и [val_royeaux.GetNameNoTier] на державу [dales.GetNameNoTier] обрушится вся мощь орлесианской военной машины!»"
  DATAW_sovr_events.0007.fallbackrc: "Издалека до меня доносится голос глашатая. Вести, принесённые дальним путником, разлетаются среди простолюдинов и знати: \n\n«[divine.GetName] объявляет [Concept('exalted_march','Священный поход')|E] на Долы — первый со времён Андрасте! После чудовищного нападения на крестьян титула [red_crossing.GetNameNoTier] и череды долийских побед на державу [dales.GetNameNoTier] обрушится вся мощь орлесианской военной машины!»"
  DATAW_sovr_events.0007.dalish_chantry: "Где-то вдали я слышу крики глашатая. Он бьёт тревогу, обращаясь и к простолюдинам, и к знати. Издалека доносится голос гонца.\n\n«[chantry|EU] идёт на нас! [Concept('shemlen','Шемлены')|E] пришли истребить нас и нашу культуру, как некогда Империум!»\n\nОстальных слов я уже не различаю: гнев и отчаяние захлёстывают меня в равной мере, заглушая все прочие звуки. Как до этого дошло? Столько жителей Долов — в том числе и я — приняли слово Создателя именно ради того, чтобы избежать подобного исхода. Создание нашей Церкви довело королевство до грани раскола, но и этого оказалось мало. Почему нашей веры в Создателя недостаточно?\n\nГолова идёт кругом от попыток понять, почему Церковь желает нас уничтожить. Им нужны наши земли? Или дело лишь в том, что мы не похожи на них? Какими бы ни были их причины, теперь ясно: напряжённость между нами никогда не была связана с верой. Мы были глупцами, раз так считали. Но сейчас не время для сожалений. Сейчас нужно защитить нашу вторую родину — любой ценой."
  DATAW_sovr_events.0007.a: "Я посвящу себя этому делу! #italic Клинок Веры!#!"
  DATAW_sovr_events.0007.b: "На наших глазах вершится история."
  DATAW_sovr_events.0007.c: "Родине [Concept('elvhen','элвенов')|E] вновь угрожает опасность."
  DATAW_sovr_events.0007.d: "Хорошо. Пусть сражаются."
  DATAW_sovr_events.0007.e: "Эта резня прискорбна, но нас не касается."
  DATAW_sovr_events.0007.a.custom_desc_1: "Против титула [dales.GetNameNoTier] объявлен Священный поход."
  DATAW_sovr_events.0007.a.custom_desc_2: "Вы присоединяетесь к Священному походу."
