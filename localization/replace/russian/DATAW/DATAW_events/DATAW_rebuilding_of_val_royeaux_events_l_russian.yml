l_russian:
 # НАЧАЛЬНОЕ РЕШЕНИЕ
 DATAW_rebuilding_of_val_royeaux: "Начать восстановление Вал Руайо"
 DATAW_rebuilding_of_val_royeaux.desc: "Со времён ужасного разграбления Вал Руайо город остаётся лишь бледной тенью себя прежнего. Настало время, чтобы [ROOT.Char.GetTitleAsNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'профинансировала', 'профинансировал' )] его великое обновление и [Select_CString(ROOT.Char.IsFemale, 'вернула', 'вернул' )] столице былое великолепие."
 DATAW_rebuilding_of_val_royeaux_tooltip: "Вернуть Вал Руайо былое великолепие."
 DATAW_rebuilding_of_val_royeaux_confirm: "Созвать архитекторов!"

 # СОБЫТИЕ 1
 DATAW_rebuilding_of_val_royeaux.001.tit: "Восстановление Вал Руайо: первый шаг"
 DATAW_rebuilding_of_val_royeaux.001.desc: "Начались работы по восстановлению столицы Верховной Жрицы, и на помощь съехались архитекторы со всего Тедаса. Несомненно, следующие вложения определят, сумеет ли город вновь стать сияющим маяком [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip|l]ой империи. \n\nКо мне подходит архитектор и передаёт вопросы купцов. \n\n«[ROOT.Char.GetTitleAsNameNoTooltip], купцы желают знать, сколько средств корона вложит в восстановление города на первом этапе. Они спрашивают, на какую помощь могут рассчитывать, особенно после того, как почти не получили её во время разграбления»."
 DATAW_rebuilding_of_val_royeaux.001.opt.a: "Первый шаг требует любых средств. Получите всё необходимое."
 DATAW_rebuilding_of_val_royeaux.001.opt.b: "Нужно сохранить средства для будущего. Выделить значительную, но разумную сумму."
 DATAW_rebuilding_of_val_royeaux.001.opt.c: "Мы не можем позволить себе такие расходы на столь раннем этапе."
 DATAW_rebuilding_of_val_royeaux.001.opt.d: "Сейчас мы не можем приступить к этим вложениям."

 # СОБЫТИЕ 2
 DATAW_rebuilding_of_val_royeaux.002.tit: "Восстановление Вал Руайо: беды горожан"
 DATAW_rebuilding_of_val_royeaux.002.desc: "После первых вложений в город потянулись рабочие, купцы и множество других людей, желающих помочь его восстановлению. Но всем им требуется жильё, и просьбы местных жителей окончательно выдвинули эту проблему на первый план. \n\nЧтобы начавшиеся работы не замедлились из-за нарастающего жилищного кризиса, нужны новые вложения. \n\n«Как вы ответите на эти требования, [ROOT.Char.GetTitleAsNameNoTooltip]?»"
 DATAW_rebuilding_of_val_royeaux.002.opt.a: "У каждого будет свой дом!"
 DATAW_rebuilding_of_val_royeaux.002.opt.a.tt.success: "Строительная программа проходит успешно"
 DATAW_rebuilding_of_val_royeaux.002.opt.a.tt.failure: "Строительная программа оборачивается катастрофой"
 DATAW_rebuilding_of_val_royeaux.002.opt.b: "Превратить руины после разграбления в жильё."
 DATAW_rebuilding_of_val_royeaux.002.opt.c: "У меня есть замысел дешёвого здания, способного вместить многих."
 DATAW_rebuilding_of_val_royeaux.002.opt.d: "Вложить в строительство умеренную сумму."
 DATAW_rebuilding_of_val_royeaux.002.opt.d.tt.success: "Строительная программа проходит успешно"
 DATAW_rebuilding_of_val_royeaux.002.opt.d.tt.failure: "Строительная программа оборачивается катастрофой"
 DATAW_rebuilding_of_val_royeaux.002.opt.e: "Крестьяне — не главная наша забота. Выделить символическую сумму."
 DATAW_rebuilding_of_val_royeaux.002.opt.e.tt.success: "Строительная программа проходит успешно"
 DATAW_rebuilding_of_val_royeaux.002.opt.e.tt.failure: "Строительная программа оборачивается катастрофой"
 DATAW_rebuilding_of_val_royeaux.002.opt.f: "Бедняки лишь плодятся и едят, словно кролики."

 # СОБЫТИЕ 3
 DATAW_rebuilding_of_val_royeaux.003.tit: "Восстановление Вал Руайо: мольба Солнца"
 DATAW_rebuilding_of_val_royeaux.003.firstSection: "«Во имя Создателя и Его Невесты я взываю к вашей помощи!» \n\nОтвлёкшись от осмотра многочисленных начатых работ, я вижу перед собой особу чрезвычайной важности. [orlesianDivine.GetFirstName] стоит передо мной, а за [Select_CString(orlesianDivine.IsFemale, 'ней', 'ним' )] следует прекрасная свита из монахов и стражников. "
 DATAW_rebuilding_of_val_royeaux.003.secondSection: "При ближайшем рассмотрении выясняется, что за красивыми облачениями скрывается бедственное положение: монашеские рясы изношены и перешиты, а доспехи некоторых стражников собраны из разрозненных частей и дополнены старыми шлемами. Непростительная в Великой Игре оплошность красноречиво говорит о тяжёлых временах города. "
 DATAW_rebuilding_of_val_royeaux.003.thirdSection: "\n\n«Церковь, как и многие другие, жестоко пострадала. Храмы, куда люди приходят за помощью, лежат в руинах и больше не способны даровать им утешение и заботу. "
 DATAW_rebuilding_of_val_royeaux.003.fourthSection: "Я понимаю, что вы не поклоняетесь Создателю, но многие приходят в Вал Руайо ради веры и находят в звуках нашей Песни покой, предназначение и поддержку. "
 DATAW_rebuilding_of_val_royeaux.003.fifthSection: "Я прошу лишь о пожертвовании, которое поможет восстановить эти здания, столь важные для простого народа и для нас»."
 DATAW_rebuilding_of_val_royeaux.003.opt.a: "Вы получите необходимую помощь, [orlesianDivine.GetFirstName]."
 DATAW_rebuilding_of_val_royeaux.003.opt.a.tooltip: "Во всех андрастианских графствах повысится народное мнение."
 DATAW_rebuilding_of_val_royeaux.003.opt.b: "Обломки легко использовать для восстановления храмов."
 DATAW_rebuilding_of_val_royeaux.003.opt.b.tooltip: "Во всех андрастианских графствах повысится народное мнение."
 DATAW_rebuilding_of_val_royeaux.003.opt.c: "Я [Select_CString(ROOT.Char.IsFemale, 'узрела', 'узрел' )] Свет и внесу свой вклад!"
 DATAW_rebuilding_of_val_royeaux.003.opt.d: "Мы можем выделить некоторые средства."
 DATAW_rebuilding_of_val_royeaux.003.opt.e: "Мы не можем позволить себе такие расходы."

 # СОБЫТИЕ 4
 DATAW_rebuilding_of_val_royeaux.004.tit: "Восстановление Вал Руайо: зов моря"
 DATAW_rebuilding_of_val_royeaux.004.desc: "По мере восстановления города сперва общие работы, затем потребность в жилье и помощь Церкви привлекли внимание к портовому району. Теперь [quaiRoyeauxHolder.GetFirstName] [Select_CString(quaiRoyeauxHolder.IsFemale, 'пришла', 'пришёл' )] обсудить со мной этот вопрос. \n\n«[ROOT.Char.GetTitleAsNameNoTooltip], настало время вложить средства в городские доки. Это жизненно важная часть экономики Вал Руайо. Пока лавки и храмы восстанавливаются, через доки проходят бесчисленные товары, купцы и паломники. Глупо чинить телегу, оставляя дорогу разбитой». \n\nИз окна видны сгоревшие склады, где прежде хранились всевозможные товары. Огонь не пощадил даже ближайшие к воде здания."
 DATAW_rebuilding_of_val_royeaux.004.opt.a: "Я вас поддержу. Получите столько денег, сколько нужно!"
 DATAW_rebuilding_of_val_royeaux.004.opt.b: "Вы получите всю помощь, какую мы можем себе позволить."
 DATAW_rebuilding_of_val_royeaux.004.opt.c: "Попробуем договориться с портовыми купцами."
 DATAW_rebuilding_of_val_royeaux.004.opt.c.tt.success: "Вы заключаете чрезвычайно выгодную сделку."
 DATAW_rebuilding_of_val_royeaux.004.opt.c.tt.failure: "Купцы предпочитают сосредоточиться на собственных делах."
 DATAW_rebuilding_of_val_royeaux.004.opt.d: "Почему бы не обложить купцов налогом ради восстановления города?"

 # СОБЫТИЕ 5
 DATAW_rebuilding_of_val_royeaux.005.tit: "Восстановление Вал Руайо: зов знаний"
 DATAW_rebuilding_of_val_royeaux.005.desc: "«Приветствую, [ROOT.Char.GetTitleAsNameNoTooltip], если позволите». \n\n[Select_CString(universityStudent.IsFemale, 'Посланница', 'Посланник' )] по имени [universityStudent.GetFirstName] торопливо подходит ко мне, изящно вручает письмо и отступает, давая спокойно прочесть его, но оставаясь достаточно близко, чтобы ответить на вопросы, — как и подобает хорошо образованному человеку. \n\n«Совет Университета обращается к вам с просьбой о помощи, [ROOT.Char.GetTitleAsNameNoTooltip]. Эльфийское нападение не пощадило и Университет, а потому мы смиренно просим средств на столь необходимое обновление здания и возвращение студентов. Разумеется, мы понимаем, что Университет не относится к важнейшим заботам короны, и потому готовы предложить вам [Select_CString(universityStudent.IsFemale, 'нашу посланницу', 'нашего посланника' )] в качестве [Select_CString(universityStudent.IsFemale, 'придворной', 'придворного' )] или выполнить любое иное пожелание»."
 DATAW_rebuilding_of_val_royeaux.005.opt.a: "Я принимаю и [Select_CString(universityStudent.IsFemale, 'посланницу', 'посланника' )], и ваше предложение."
 DATAW_rebuilding_of_val_royeaux.005.opt.b: "Возвращайтесь с золотом, [universityStudent.GetFirstName]."
 DATAW_rebuilding_of_val_royeaux.005.opt.c: "Я могу выделить лишь небольшую сумму."
 DATAW_rebuilding_of_val_royeaux.005.opt.d: "Университет — пристанище неудачников Великой Игры."

 # СОБЫТИЕ 6
 DATAW_rebuilding_of_val_royeaux.006.tit: "Восстановление Вал Руайо: итог"
 DATAW_rebuilding_of_val_royeaux.006.desc: "В последние месяцы на землях титула [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier] развернулась невиданная прежде деятельность. Бесчисленные просьбы и огромные вложения — всё ради того, чтобы вернуть городу положение, утраченное в тот роковой день. \n\nТеперь лихорадка улеглась, но сам проект продолжается. Первые вложения открыли путь вперёд и определят темп роста на долгие годы."
 DATAW_rebuilding_of_val_royeaux.006.opt.a: "Будем надеяться, что [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier] возродится во всём великолепии."