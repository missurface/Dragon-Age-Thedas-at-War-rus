# ON UNIFYING CHASIND
	#dataw_aerona_events.999.tit: "A Dream of All Seasons"
	#dataw_aerona_events.999.desc: "My mortal toils, and my journey in the eyes of the goddesses has culminated in this moment: The [GetTitleByKey('k_korcari_wilds').GetBaseNameNoTier] forged anew, with the Chasind people brought under my banner. \n\n I am no longer the girl who could do naught but weep at the pain of a wounded beast. The spirit who I have forged a covenant with and I have become something far greater than we could have managed to alone."

	#dataw_aerona_events.999.opt.a: "If the Wolf-Queen wills it, I shall rule."
