l_russian:

#EVENT 1     #A CHANGING OF SEASONS
 dataw_aerona_events.001.tit: "Смена времён года"
 dataw_aerona_events.001.desc: "Хасинды столь же многочисленны и разнообразны, как листья великого дерева. Нет двух одинаковых, и они слишком быстро забывают ветви, что породили их всех. \n\nДавно уже я [Select_CString(ROOT.Char.IsFemale, 'мечтала', 'мечтал' )] о едином, сплочённом народе хасиндов. Уважение людей достаётся дёшево — ценой крови, постели и золота. Но только верой можно купить долговечное наследие. Чтобы воплотить мечту, мне необходимо обрести и то и другое. \n\nПри этой мысли нечто внутри меня расправляет крылья. Многорогая незваная гостья наблюдает из-за Завесы и ждёт моего решения, словно мать, присматривающая за детьми." 

 dataw_aerona_events.001.opt.a: "Непременно посоветуюсь с духовными наставниками."
 dataw_aerona_events.001.opt.a.tooltip: "Кто-нибудь сведущий в духовных вопросах, возможно, поможет мне разобраться в этих мыслях."
 dataw_aerona_events.001.opt.b: "Пожалуй, лучше ступать осторожно."
 dataw_aerona_events.001.opt.b.tooltip: "Власть редко обретают без высокой цены. Я попрошу советников внести ясность."

#EVENT 2     #THE STILL HOURS
 dataw_aerona_events.002.tit: "Безмолвные часы"
 dataw_aerona_events.002.desc: "Мои убеждения не меркнут. Я сгрызаю ногти до крови, а еда теряет вкус. Однажды вечером во сне ко мне приходит голос — далёкий, но глубоко и мощно звучащий среди пейзажа сновидений. Он одновременно знаком мне и совершенно чужд: \n\n #Italic «Лишь создания из плоти и крови считают, будто одно кровопролитие даёт право властвовать. Только с дозволения богинь ты можешь заявить заслуженное право на престол. Приди поклониться четырём ветрам, дабы твоя богиня могла оценить тебя. Тогда мы увидим, можно ли сделать из тебя [Select_CString(ROOT.Char.IsFemale, 'истинную королеву', 'истинного короля' )]»."
	
 dataw_aerona_events.002.opt.a: "Надо скорее записать всё, пока не забылось!"
 dataw_aerona_events.002.opt.a.tooltip: "При свете камышовой лучины я тщательно записываю наказ. Ни одна подробность не ускользнёт."
 dataw_aerona_events.002.opt.b: "Пожалуй, не стоит пить эль перед сном."
 dataw_aerona_events.002.opt.b.tooltip: "Проснувшись, я решаю впредь быть умереннее. Хасинды не станут слушать пьяное бормотание."
 dataw_aerona_events.002.opt.c: "При первой возможности следует обратиться к авгуру."
 dataw_aerona_events.002.opt.c.tooltip: "Столь важные откровения лучше всего толкуют авгуры. Они могут помочь мне понять замыслы богини и намерения безмолвной покровительницы."

#EVENT 3     #FOR RICHES, OR RUIN?
 dataw_aerona_events.003.tit: "К богатству или к погибели?"
 dataw_aerona_events.003.desc: "Мне ясно, что предстоит сделать: если я хочу обеспечить будущее своему народу, надо умилостивить богинь Всеобщей Войны. [Select_CString(ROOT.Char.IsFemale, 'Мудрая королева одной рукой служит', 'Мудрый король одной рукой служит' )] народу, а другую простирает к духам, моля о благословении. [Select_CString(ROOT.Char.IsFemale, 'Как волшебница, я лучше прочих способна', 'Как волшебник, я лучше прочих способен' )] стать связующим звеном между своим народом и духами, которым он обязан благоденствием. \n\nГолос в моих снах говорил о четырёх ветрах. Священную землю под моими ногами возделывают три богини, а над всеми царит Королева-Волчица. Пока слуги готовят припасы для путешествия, мне предстоит выбрать первую цель."
	
 #Wolf Queen (Premature)
 dataw_aerona_events.003.opt.a: "Зачем тратить время на младших богинь? Сразу к Королеве-Волчице!"
 dataw_aerona_events.003.opt.a.tooltip: "Я отправлюсь на юг, найду Королеву-Волчицу в Бессолнечных землях и попрошу её о заступничестве."
 #Owl Mother
 dataw_aerona_events.003.opt.b: "Я найду Матерь-Сову."
 dataw_aerona_events.003.opt.b.tooltip: "Я буду искать Матерь-Сову на священной земле Цитадели Кинлох."
 #Snake Huntress
 dataw_aerona_events.003.opt.c: "Первой должна быть Змея-Охотница."
 dataw_aerona_events.003.opt.c.tooltip: "Мне предстоит отправиться в Лес Бресилиан и поговорить со Змеёй-Охотницей, которая охраняет земли, где некогда был сотворён мир."
 #Deer Witch
 dataw_aerona_events.003.opt.d: "Оленья Ведьма, взываю к тебе!"
 dataw_aerona_events.003.opt.d.tooltip: "Первой я встречусь с Оленьей Ведьмой в окрестностях Томбигби."
	
### THIS IS WHERE IT FORKS. IT DOES NOT MATTER WHAT ORDER THESE HAPPEN IN, EXCEPT FOR WOLF QUEEN. SHE NEEDS TO GO TO ALL 3 OTHER GODDESSES BEFORE HER TO SUCCEED ###

# PREMATURE WOLF QUEEN FORK
# EVENT 4   #WITH TOOTH AND CLAW
 dataw_aerona_events.004.tit: "Зубами и когтями"
 dataw_aerona_events.004.desc: "Я прибываю в самое сердце Бессолнечных земель, чтобы заслужить благословение Королевы-Волчицы. Нос и пальцы колет хрупкий мороз, но это малая цена за одобрение богини-царицы.\n\n Снег расступается, и в замёрзшей долине я замечаю дикий алтарь Королевы-Волчицы. Я простираюсь перед ним ниц. \n\nКоролева-Волчица столь же своенравна, сколь величественна, и другого случая впечатлить её может не представиться." 

 dataw_aerona_events.004.opt.a: "Весь этот путь — и ты даже не покажешься?"
 dataw_aerona_events.004.opt.a.tooltip: "Я дразню Королеву-Волчицу, надеясь впечатлить её своей дерзостью."
 dataw_aerona_events.004.opt.b: "Пожалуй, сперва стоит обратиться к другим богиням..."
 dataw_aerona_events.004.opt.b.tooltip: "Обращаться за одобрением Королевы-Волчицы было слишком поспешным решением. Сперва следует найти других богинь."

# OWL MOTHER FORK

# EVENT 5   #NORTHERN BOUND
 dataw_aerona_events.005.tit: "На север"
 dataw_aerona_events.005.desc: "В последний раз я смотрю, как над Томбигби встаёт рассвет, покачиваясь в седле. Мой город — драгоценный самоцвет, сокровище, ради которого стоит хоть тысячу раз смириться перед богинями. \n\nВполне естественно, что первой я обращусь к Матери-Сове, ведь она возвещает приход каждой весны. Ей мы обязаны самим сотворением мира; по её замыслу приливы вытачивают каменные шпили. Она живёт в очаге каждого хасиндского дома, и лишь с её благословения мой народ сможет ставить пищу на стол, лишь по её воле наши стены продолжат стоять. \n\nЖди меня, Матерь-Сова. Я прострусь перед тобой ниц в Кинлохе, где тебя так нежно любят."

 dataw_aerona_events.005.opt.a: "Твоим творениям нет равных, Матерь!"
 dataw_aerona_events.005.opt.a.tooltip: "Я продолжу путь к Цитадели Кинлох."

# EVENT 5.1 #ON THE WINDING PATH
 dataw_aerona_events.015.tit: "Извилистой тропой"
 dataw_aerona_events.015.desc: "Не прошло и дня, а красота этих земель уже поражает меня. Говорят, Матерь-Сова — зодчая нашего смертного сада, и в зеркальных озёрах, рассыпанных до самого горизонта, невозможно не увидеть её искусную руку. \n\nКутаясь в тёплую шаль перед сном, я размышляю, какое вдохновение отсюда стоит привезти в свою крепость в Томбигби."

 dataw_aerona_events.015.opt.a: "Не могу представить ничего совершеннее Томбигби."
 dataw_aerona_events.015.opt.a.tooltip: "Я ничего не стану менять в Томбигби."
 dataw_aerona_events.015.opt.b: "Поручу мастеру запечатлеть ночное небо на гобелене!"
 dataw_aerona_events.015.opt.b.tooltip: "Я закажу искусному ткачу гобелен с этим небесным совершенством."
 dataw_aerona_events.015.opt.c: "Пусть ремесленник изготовит мне серебряное зеркало."
 dataw_aerona_events.015.opt.c.tooltip: "Ювелир создаст для меня маленькое зеркальное украшение."
 dataw_aerona_events.015.opt.d: "Прикажу советникам разработать плавучие сады!"
 dataw_aerona_events.015.opt.d.tooltip: "Аквакультура принесёт пользу жителям Томбигби."

#EVENT 5.2 #CURIOSITY
 dataw_aerona_events.025.tit: "Любопытство"
 dataw_aerona_events.025.desc: "Я просыпаюсь раньше свиты; утро безмолвно. Густой туман низко стелется над землёй, словно покрывало. \n\nНа краткий миг нечто привлекает мой взгляд. Стоит ли отправиться следом?"

 dataw_aerona_events.025.opt.a: "Ничем хорошим это не кончится."
 dataw_aerona_events.025.opt.a.tooltip: "Безрассудные преследователи долго не живут. Лучше не вмешиваться."
 dataw_aerona_events.025.opt.b: "Я могу постоять за себя. Что может случиться?"
 dataw_aerona_events.025.opt.b.tooltip: "Знатный титул не сделал вас [Select_CString(ROOT.Char.IsFemale, 'изнеженной', 'изнеженным' )], и проверить источник движения почти не опасно."
 dataw_aerona_events.025.opt.c: "Разбудить слуг — пусть выяснят, откуда движение!"
 dataw_aerona_events.025.opt.c.tooltip: "Отличная задача — для кого-нибудь другого, желательно менее важного, чем вы."

#EVENT 5.2.1 #CURIOSITY DENIED
 dataw_aerona_events.125.tit: "Любопытство отвергнуто"
 dataw_aerona_events.125.desc: "Что бы вы ни заметили, оно исчезло так же быстро, как появилось. Скорее всего, самое страшное существо в этих лесах — вы."

 dataw_aerona_events.125.opt.a: "Тогда, пожалуй, можно позавтракать."
 dataw_aerona_events.125.opt.a.tooltip: "Шорох в кустах — далеко не самая важная из ваших забот."

#EVENT 5.2.2 #CURIOSITY INDULGED
 dataw_aerona_events.225.tit: "Любопытство удовлетворено"
 dataw_aerona_events.225.desc: "Девочка не старше пяти зим смотрит на меня огромными, совиными глазами. Она с ног до головы перепачкана грязью и свежей землёй, а в крошечных ладонях мнёт тяжёлый ком глины.\n\n Когда она начинает говорить, в её голосе слышится нечто потустороннее: дева, мать и старуха одновременно. Перепачканные пальцы складывают из мокрой глины башенку.\n\n «Зачем вы пришли сюда?»"

 dataw_aerona_events.225.opt.a: "Какая нелепость! Где её родители?"
 dataw_aerona_events.225.opt.a.tooltip: "Эта нищенка — чужая забота."
 dataw_aerona_events.225.opt.b: "Идём, дитя. При моём дворе о тебе позаботятся."
 dataw_aerona_events.225.opt.b.tooltip: "Вы не позволите девочке пропасть одной на холоде."
 dataw_aerona_events.225.opt.c: "Чтобы удовлетворить своё любопытство."
 dataw_aerona_events.225.opt.c.tooltip: "Разумные вопросы заслуживают разумных ответов."
 dataw_aerona_events.225.opt.d: "Я ищу Матерь-Сову. Ты знаешь о ней?"
 dataw_aerona_events.225.opt.d.tooltip: "Эта девочка может оказаться не той, кем кажется."

#EVENT 5.2.3 #CURIOSITY INDULGED DISREGARDED CHILD
 dataw_aerona_events.325.tit: "Любопытство удовлетворено"
 dataw_aerona_events.325.desc: "Девочка с открытым ртом глядит на вас, будто вы ничего не сказали. Не веря своим глазам, вы поворачиваетесь к слугам, а когда смотрите обратно, ребёнка уже нет."

 dataw_aerona_events.325.opt.a: "Пожелаю ей доброго пути."
 dataw_aerona_events.325.opt.a.tooltip: "Девочка исчезла."

#EVENT 5.2.4 #CURIOSITY INDULGED ADOPTED CHILD
 dataw_aerona_events.425.tit: "Любопытство удовлетворено"
 dataw_aerona_events.425.desc: "Вы снимаете плащ и протягиваете его перепачканной девочке. Она благоговейно проводит пальцами по ткани, после чего не мигая смотрит на вас. \n\n«Вы дадите нам дом?»\n\n Что-то в её взгляде ломается, и вечная мудрость исчезает с лица беспризорницы, оставляя лишь дрожащую девочку. Словно плотину прорвало: она бросается к вам, плачет, уткнувшись в колени, и её голос вновь звучит юно и хрупко."

 dataw_aerona_events.425.opt.a: "Необыкновенному ребёнку нужен необыкновенный дом."
 dataw_aerona_events.425.opt.a.tooltip: "Вы примете загадочную девочку в свой дом."
 dataw_aerona_events.425.opt.b: "У тебя будет дом при моём дворе."
 dataw_aerona_events.425.opt.b.tooltip: "Вы приведёте девочку к своему двору."
 dataw_aerona_events.425.opt.c: "Если подумать..."
 dataw_aerona_events.425.opt.c.tooltip: "Вы дадите подозрительной девочке немного милостыни и отошлёте её."

#EVENT 5.2.5 #CURIOSITY INDULGED QUESTIONS
 dataw_aerona_events.525.tit: "Любопытство удовлетворено"
 dataw_aerona_events.525.desc: "Девочка понимающе улыбается; на перепачканном лице появляется странное, отрешённое выражение. \n\n «Верно, но любопытство утоляется лишь тогда, когда остаётся неутолённым. Пусть твоя чаша будет решетом, дитя, а жажда всё же угаснет».\n\n Я [Select_CString(ROOT.Char.IsFemale, 'уверена', 'уверен' )], что это не простой ребёнок, но прежде, чем удаётся потребовать ответов, мощный порыв ветра вздымает туман и листья, на время ослепляя меня. Когда я открываю глаза, девочки уже нет. На её месте стоит странный глиняный идол."

 dataw_aerona_events.525.opt.a: "Я слушаю вас, духи."
 dataw_aerona_events.525.opt.a.tooltip: "Вам остаётся размышлять о природе девочки и спрятать глиняного идола в карман. Вы уверены, что он для чего-нибудь пригодится."

#EVENT 5.2.6 #CURIOSITY INDULGED OWL MOM
 dataw_aerona_events.625.tit: "Любопытство удовлетворено"
 dataw_aerona_events.625.desc: "«Каждая вставшая волна и каждый уложенный камень знают нашу Матерь. Чего вы от неё хотите?»"

 dataw_aerona_events.625.opt.a: "Я ищу её совета в Цитадели Кинлох."
 dataw_aerona_events.625.opt.a.tooltip: "Вы подозреваете, что девочка как-то связана с богиней."

#EVENT 5.2.7 #CURIOSITY INDULGED OWL MOM
 dataw_aerona_events.725.tit: "Любопытство удовлетворено"
 dataw_aerona_events.725.desc: "«Мать сама приходит за заблудшими детьми и не требует, чтобы они отыскали к ней дорогу. Важно то, что вы вообще начали её искать», — говорит оборванка; её ангельское лицо озаряет странная ласковая улыбка. \n\n Налетает ветер, и меня осыпает листьями и окутывает туманом. Когда всё стихает, девочки уже нет, но на её месте стоит странный глиняный идол."

 dataw_aerona_events.725.opt.a: "Какая странная безделушка!"
 dataw_aerona_events.725.opt.a.tooltip: "Вам остаётся размышлять о природе девочки и спрятать глиняного идола в карман. Вы уверены, что он для чего-нибудь пригодится."

#EVENT 5.3.0 #CURIOSITY DELEGATED OWL MOM
 dataw_aerona_events.035.tit: "Любопытство поручено другим"
 dataw_aerona_events.035.desc: "Стоит вам подать знак, как несколько спутников начинают пробираться между деревьями и сквозь кусты к источнику шума. \n\nДолгое время поиски остаются безуспешными, пока один из них не вскрикивает."

 dataw_aerona_events.035.opt.a: "Вперёд! Идите помогите, няньки мне не нужны."
 dataw_aerona_events.035.opt.a.tooltip: "Вы отошлёте всю свиту на помощь, чего бы это ни стоило."
 dataw_aerona_events.035.opt.b: "Довольно. Пора двигаться дальше."
 dataw_aerona_events.035.opt.b.tooltip: "Вы потратили достаточно времени на эту глупую затею."

#EVENT 5.3.1 #CURIOSITY DELEGATED INVESTIGATION
 dataw_aerona_events.135.tit: "Любопытство поручено другим"
 dataw_aerona_events.135.desc: "Остальные спутники идут помогать ___, оставляя меня в одиночестве. Как творение Матери-Совы, я чувствую себя в лесах как дома, но голод властен надо мной, как над любым зверем. \n\nНе так давно мне ещё приходилось самостоятельно добывать пропитание. Наверняка, пока спутники исследуют моё знамение, я смогу наскрести что-нибудь на скорый завтрак?"

 dataw_aerona_events.135.opt.a: "Лучше подождать."
 dataw_aerona_events.135.opt.a.tooltip: "Я не стану утолять голод, пока жду возвращения свиты."
 dataw_aerona_events.135.opt.b: "Природа дарует, а мы благодарим."
 dataw_aerona_events.135.opt.b.tooltip: "Я поищу в лесу что-нибудь съестное."

#EVENT 5.3.2 #CURIOSITY DELEGATED FORAGE
 dataw_aerona_events.235.tit: "Любопытство поручено другим: быстрый перекус"
 dataw_aerona_events.235.desc: "Я оглядываюсь вокруг в поисках чего-нибудь съестного. В конце концов удаётся найти горсть аппетитных ягод, до краёв налитых спелым соком."

 dataw_aerona_events.235.opt.a: "Приятного аппетита!"
 dataw_aerona_events.235.opt.a.tooltip: "Я съем ягоды, пока жду возвращения слуг."

#EVENT 5.3.3 #CURIOSITY DELEGATED HUNGRY
 dataw_aerona_events.335.tit: "Любопытство поручено другим: голод"
 dataw_aerona_events.335.desc: "Вскоре скука превращается в голод, и я начинаю беспокойно мерить шагами поляну. Когда хрустит ветка, я ожидаю увидеть слугу, но вместо него замечаю грязную девочку с белозубой улыбкой. В её руках полно спелых ягод, истекающих красным соком. \n\n«Я принесла вам плодов, [Select_CString(ROOT.Char.IsFemale, 'моя госпожа', 'мой господин' )]»."

 dataw_aerona_events.335.opt.a: "Звучит убедительно..."
 dataw_aerona_events.335.opt.a.tooltip: "Я разделю дары природы."
 dataw_aerona_events.335.opt.b: "С ребёнком явно что-то не так."
 dataw_aerona_events.335.opt.b.tooltip: "Стоит сосредоточиться и понять, что именно не так с девочкой."

#EVENT 5.3.2 #CURIOSITY DELEGATED DENIED
 dataw_aerona_events.435.tit: "Любопытство отброшено"
 dataw_aerona_events.435.desc: "По сигналу рога свита возвращается ко мне, и мы начинаем подогревать дорожный хлеб к солонине и сыру. Кинлох уже близко. Пусть эта загадка останется без ответа."

 dataw_aerona_events.435.opt.a: "Только вперёд."
 dataw_aerona_events.435.opt.a.tooltip: "Подкрепившись, вы продолжаете путь."
