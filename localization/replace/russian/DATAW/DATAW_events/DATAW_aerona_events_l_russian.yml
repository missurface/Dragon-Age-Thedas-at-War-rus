	#dataw_aerona_events.999.tit: "Мечта обо всех временах года"
	#dataw_aerona_events.999.desc: "Мои смертные труды и путешествие перед взором богинь привели к этому мгновению: [GetTitleByKey('k_korcari_wilds').GetBaseNameNoTier] возродились, а хасиндский народ собрался под моим знаменем. \n\n Я больше не тот ребёнок, которому оставалось лишь плакать от боли раненого зверя. Дух, с которым заключён союз, и я стали чем-то куда большим, чем каждый из нас мог бы стать поодиночке."

	#dataw_aerona_events.999.opt.a: "Если такова воля Королевы-Волчицы, я буду править."
