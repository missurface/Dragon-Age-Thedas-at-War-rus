l_russian:
 ### Chanvalois flavor events
 dataw_chanvalois_events.0001.t: "Two Merchants, One Land"
 dataw_chanvalois_events.0001.desc: "As I called upon the next people, I saw two merchants obviously bickering in a very annoying manner. It surprised me when they explained they were local Chanvalois who were both competing to buy a construction site in [my_barony.GetName].# \n\n#italic My [ROOT.Char.GetLadyLord], my name is [chanvalois_merchant_1.GetFirstName], and as a proud Chanvalois, I humbly ask for your financial support to build a grand military facility in your humble city.#! \n\n#italic No, my [ROOT.Char.GetLadyLord], I, [chanvalois_merchant_2.GetFirstName|U], am the best architect for your lovely city. Please, I assure you, this new economic venture will prove to be a worthy investment.#!"
 dataw_chanvalois_events.0001.a: "[chanvalois_merchant_1.GetFirstName|U] has my support!" 
 dataw_chanvalois_events.0001.a.success: "Construction of a new building has begun in [my_barony.GetName]!"
 dataw_chanvalois_events.0001.a.failure: "[chanvalois_merchant_1.GetFirstName|U] ran off with the money!"
 dataw_chanvalois_events.0001.b: "[chanvalois_merchant_2.GetFirstName|U] has my support!"
 dataw_chanvalois_events.0001.b.failure: "[chanvalois_merchant_2.GetFirstName|U] ran off with the money!"
 dataw_chanvalois_events.0001.c: " Why do you not focus on agriculture, like #italic normal people?"
 dataw_chanvalois_events.0001.c.failure: "[chanvalois_merchant_1.GetFirstName|U] and [chanvalois_merchant_2.GetFirstName|U] ran off with the money!"
 dataw_chanvalois_events.0001.d: "With a greater investment, could you build something more tangible and long-lasting?"
 dataw_chanvalois_events.0001.d.success: "Construction of a new city has begun in [empty_land.GetName]!"
 dataw_chanvalois_events.0001.e: "Not interested. Do not disturb me again."
 dataw_chanvalois_events.0002.t: "An Unnamed Village's Fate"
 dataw_chanvalois_events.0002.desc: "As we continued our travels, my entourage and I encoutered a small village that wasn't on our maps. It appeared to be unnamed as well. As we reached the point where the markets usually are in villages like this, the mostly empty stands surprised us # \n\n#italic A pity, isn't it?#! said a nearby peasant who called [farmer.GetHerselfHimself] [farmer.GetFirstName].##italic We Chanvalois are proud farmers and often called people of the Fields. Despite this, our crops are failing, and the earth is still as barren as it was during the winter. I beg you, my [ROOT.Char.GetLadyLord], please help us in these trying times.#! \nSomeone from my entourage respectully interrupts to bring their input on the matter.#italic #! [ROOT.Char.GetLadyLord|U], helping them here would only benefit us in a small manner. We could invite them to our lands for a greater number of working hands in the fields.#!"
 dataw_chanvalois_events.0002.a: "Your land is the problem. Come to [capital_county.GetName] and food shall grow plentiful for your people."
 dataw_chanvalois_events.0002.b: "Take these coins, go buy tools, fertilizer, and anything else you need."
 dataw_chanvalois_events.0002.c: "You should work harder, unless you desire to be punished for your insolence."
 dataw_chanvalois_events.0002.d: "This isn't my land, and therefore not my problem."
 dataw_chanvalois_events.0003.t: "A Test From the Unexpected"
 dataw_chanvalois_events.0003.desc: "As I wandered into a market to restock our traveling supplies, a merchant with a stand full of vegetables and cereals called out to me. With a smile on [foreign_merchant.GetHerHisMy] face, [foreign_merchant.GetSheHe] puts forward some of [foreign_merchant.GetHerHisMy] cererals. \n“Greetings, my [ROOT.Char.GetLadyLord]. My name is [foreign_merchant.GetFirstName] and I can tell from your accent that you are Chanvalois. Of course, your people are masters of agriculture, and as a ruler of such folk, surely you could entertain yourself by guessing the cereals laid before you. Of course, if you prove your knowledge, I would be delighted to give you and your subjects a discount on my wares. I must admit, they are quite useful.“ \nWhile [foreign_merchant.GetHerHisMy] attitude is quite insulting, the prospects of beating the merchant at [foreign_merchant.GetHerHisMy] little game could be worthwhile."
 dataw_chanvalois_events.0003.a: "I accept your challenge!"
 dataw_chanvalois_events.0003.a.success: "Those are obviously oats!"
 dataw_chanvalois_events.0003.a.failure: "You have no idea what those are."
 dataw_chanvalois_events.0003.b: "Those are obviously oats!"
 dataw_chanvalois_events.0003.b.success: "People are impressed"
 dataw_chanvalois_events.0003.c: "You think the Chanvalois are only good at recognizing plants?"
 dataw_chanvalois_events.0003.d: "You #italic dare #! question a lord of the Fields? #italic Imprison [foreign_merchant.GetHerHim] #!"
 dataw_chanvalois_events.0004.t: "A Call Against Assimilation"
 dataw_chanvalois_events.0004.desc: "As I went about my day, one of my courtiers, [courtier.GetName], ends up going right beside me to share some news he heard while passing through [capital_county.GetName]. # \n\nMy [ROOT.Char.GetLadyLord], I am here to inform you of a town crier who calls [peasant.GetHerselfHimself] [peasant.GetName] has started calling for the Chanvalois to strike against our neighbors of different customs. [peasant.GetSheHe|U] says that the Chanvalois have ways of their own, cultivated like the fields that cover the soil of our homeland, and that we should never abandon them by accepting the ways of others. Should we respond to his words, your highness?#! \nWords can be dangerous, can easily thread gullible people down a path of destruction. Regardless, the approval that could be gained is definitely something to consider for my advancement in the Game."
 dataw_chanvalois_events.0004.a: "Tell the people we agree. The Chanvalois will thrive in their own way."
 dataw_chanvalois_events.0004.b: "By accepting those that are different, we can evolve the Chanvalois further."
 dataw_chanvalois_events.0004.c: "The public shall decide on what to think and I will follow."
 dataw_chanvalois_events.0004.c.success: "Success!"
 dataw_chanvalois_events.0004.c.failure: "Failure!"
 dataw_chanvalois_events.0004.c.mid: "Meh."
 dataw_chanvalois_events.0004.d: "Imprison that fool!"
 dataw_chanvalois_events.0005.t: "An Honest Day's Labor"
 dataw_chanvalois_events.0005.desc: "As I was teaching my ward the finer points of life, [child.GetName] interrupted my lecture to bring my attention to the door, where I saw one of my courtiers, [courtier.GetName].# \n\n #italic Your excellence,#! [courtier.GetSheHe] explained, # #italic I see your ward is growing into a fine young person. However, if you would excuse the boldness, I would say [child.GetSheHe] would benefit from a little more experience outside of theory. If you desire, I could bring [child.GetHerHim] to work in the fields among the peasants. This way, [child.GetName] would gain a greater understanding of the daily lives of the common folk of the Chanvalois while also giving [child.GetHerHim] a better taste of healthy work on the land. #! \n\nDespite the bold entrance and impromptu proposal, I see myself contemplating between the benefits of my ward seeing work as is it done in the Fields of Ghislain or greater focus on [child.GetHerHisMy] studies. Perhaps this could be a good idea."
 dataw_chanvalois_events.0005.a: "Take [child.GetHerHim] with my blessing."
 dataw_chanvalois_events.0005.b: "[child.GetName] must concentrate on [child.GetHerHisMy] studies."
 dataw_chanvalois_events.0005.c: "Get out of my court. I alone decide how [child.GetName]'s education goes."
 dataw_chanvalois_events.0006.t: "The Place of our People"
 dataw_chanvalois_events.0006.desc: "I was simply going about my day, walking thorugh the halls of the keep passing yet another unimportant letter going on about some sort of strange mabari dispute, when I passed beside two scholars, of the same blood and accent as mine, completely absorbed in heated debate. # \n\n #italic [scholar_1.GetName], you are wrong on this matter! #! says one of the scholars. # #italic The Chanvalois always were the closest to their Orlesian courisns, but they were still separate enough to not be associated with them! The Chanvalois, due to the importance put on agricutlure for generations by our cities, coupled with our urban traditions, means we can be the perfect bridge between the idfferent identities of Orlais! #! # \n\n #italic You delude yourself, [scholar_2.GetName]. By trying to be a bridge, as you say, we would only muddle our identity until we are absorbed by our neighbors. The Chanvalois need not only to differentiate themselves further from the other descendatns of the Ciriane, they also need to push forward their culture, until the Chanvalois are the main group in all of Orlais. After all, our cities once competed harshly with their Orlesian cousins for supremacy over the heartlands, and we were driven and supplanted to Ghislain. The Orlesians didn't know how to farm the land as well as we did, and so we survived. It is time to take the place that was stolen from us by the Orlesians, on the summit of Orlais! #! # \n\n #italic Suddenly, they notice me by their side and ask for my opinion."
 dataw_chanvalois_events.0006.a: "[scholar_2.GetName] is right, we must be the bridge between all descendants of the Ciriane."
 dataw_chanvalois_events.0006.b: "[scholar_1.GetName] has the right idea, the Canvalois will climb to the summit of Orlais!"
 dataw_chanvalois_events.0006.c: "This is a debate amongst you two, and as such I will not interfere."
 dataw_chanvalois_events.0006.d: "You see, that's where you are both wrong..."
 dataw_chanvalois_events.0006.d.success: "You prove them wrong in an artful debate."
 dataw_chanvalois_events.0006.d.failure: "You only embarass yourself."
 
