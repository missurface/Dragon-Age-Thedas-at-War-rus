l_russian:
 ### Chanvalois flavor events
 dataw_chanvalois_events.0001.t: "[Select_CString(chanvalois_merchant_1.IsFemale, 'Купчиха', 'Купец' )] и [Select_CString(chanvalois_merchant_2.IsFemale, 'купчиха', 'купец' )] — одна земля"
 dataw_chanvalois_events.0001.desc: "Когда я принимаю следующих просителей, моё внимание привлекает громкая и раздражающая перебранка двух людей из купеческого сословия. К моему удивлению, спор идёт между местными представителями народа шанвалуа, соперничающими за право приобрести участок под строительство во владении [my_barony.GetName].\n\n#italic — [Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )], меня зовут [chanvalois_merchant_1.GetFirstName]. Я представляю гордый народ шанвалуа и покорно прошу у вас средств на строительство величественного военного сооружения в вашем скромном городе.#!\n\n#italic — Нет, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )]. Именно я, [chanvalois_merchant_2.GetFirstName|U], лучше всего подхожу на роль [Select_CString(chanvalois_merchant_2.IsFemale, 'зодчей', 'зодчего' )] вашего прекрасного города. Уверяю, это новое торговое предприятие станет достойным вложением.#!"
 dataw_chanvalois_events.0001.a: "[chanvalois_merchant_1.GetFirstName|U] получает мою поддержку!" 
 dataw_chanvalois_events.0001.a.success: "Во владении [my_barony.GetName] началось строительство нового сооружения!"
 dataw_chanvalois_events.0001.a.failure: "[chanvalois_merchant_1.GetFirstName|U] [Select_CString(chanvalois_merchant_1.IsFemale, 'сбежала', 'сбежал' )] с деньгами!"
 dataw_chanvalois_events.0001.b: "[chanvalois_merchant_2.GetFirstName|U] получает мою поддержку!"
 dataw_chanvalois_events.0001.b.failure: "[chanvalois_merchant_2.GetFirstName|U] [Select_CString(chanvalois_merchant_2.IsFemale, 'сбежала', 'сбежал' )] с деньгами!"
 dataw_chanvalois_events.0001.c: "Почему бы вам не заняться земледелием, как #italic нормальные люди#!?"
 dataw_chanvalois_events.0001.c.failure: "[chanvalois_merchant_1.GetFirstName|U] и [chanvalois_merchant_2.GetFirstName|U] скрылись с деньгами!"
 dataw_chanvalois_events.0001.d: "Если вложить больше, сможете ли вы построить нечто более основательное и долговечное?"
 dataw_chanvalois_events.0001.d.success: "Во владении [empty_land.GetName] началось строительство нового города!"
 dataw_chanvalois_events.0001.e: "Мне это неинтересно. Больше меня не тревожьте."
 dataw_chanvalois_events.0002.t: "Судьба безымянной деревни"
 dataw_chanvalois_events.0002.desc: "Продолжая путь, мы со свитой встречаем маленькую деревню, которой нет на наших картах. Похоже, у неё даже нет названия. Добравшись до места, где в подобных поселениях обычно располагается рынок, мы с удивлением видим почти пустые прилавки.\n\n#italic — Печальное зрелище, не правда ли?#! — произносит [Select_CString(farmer.IsFemale, 'стоявшая', 'стоявший' )] неподалёку [Select_CString(farmer.IsFemale, 'крестьянка', 'крестьянин' )] по имени [farmer.GetFirstName]. #italic — Мы, шанвалуа, гордимся тем, что возделываем землю, и нас часто зовут народом Полей. И всё же урожай гибнет, а земля остаётся такой же бесплодной, как зимой. Умоляю вас, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )], помогите нам в этот тяжкий час.#!\nКто-то из моей свиты почтительно вмешивается в разговор: #italic — [Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )], помощь этой деревне принесёт нам лишь малую выгоду. Лучше пригласить жителей в наши владения — там в полях пригодятся лишние рабочие руки.#!"
 dataw_chanvalois_events.0002.a: "Ваша беда — в этой земле. Переселяйтесь во владение [capital_county.GetName], и ваш народ больше не будет знать голода."
 dataw_chanvalois_events.0002.b: "Возьмите эти монеты и купите орудия, удобрения и всё необходимое."
 dataw_chanvalois_events.0002.c: "Работайте усерднее, если не желаете понести наказание за дерзость."
 dataw_chanvalois_events.0002.d: "Это не моя земля, а значит, и не моя забота."
 dataw_chanvalois_events.0003.t: "Неожиданное испытание"
 dataw_chanvalois_events.0003.desc: "Зайдя на рынок пополнить дорожные припасы, я слышу оклик [Select_CString(foreign_merchant.IsFemale, 'торговки', 'торговца' )], чей прилавок завален овощами и злаками. Улыбаясь, [Select_CString(foreign_merchant.IsFemale, 'она', 'он' )] протягивает мне несколько колосьев.\n«Приветствую, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )]. Меня зовут [foreign_merchant.GetFirstName], и по вашему выговору сразу слышно, что вы из народа шанвалуа. Разумеется, ваши соплеменники — непревзойдённые земледельцы. [Select_CString(ROOT.Char.IsFemale, 'Правительнице', 'Правителю' )] такого народа наверняка будет занятно угадать, какие злаки лежат перед вами. Если вы блеснёте знаниями, я с удовольствием сделаю вам и вашим подданным скидку на мои товары. Признаюсь, они могут оказаться весьма полезны».\nВ таком отношении чувствуется оскорбительная насмешка, но возможность победить в этой маленькой игре выглядит заманчиво."
 dataw_chanvalois_events.0003.a: "Принимаю вызов!"
 dataw_chanvalois_events.0003.a.success: "Очевидно же, это овёс!"
 dataw_chanvalois_events.0003.a.failure: "Вы понятия не имеете, что это."
 dataw_chanvalois_events.0003.b: "Очевидно же, это овёс!"
 dataw_chanvalois_events.0003.b.success: "Люди впечатлены"
 dataw_chanvalois_events.0003.c: "Думаете, шанвалуа способны лишь распознавать растения?"
 dataw_chanvalois_events.0003.d: "Вы #italic смеете#! испытывать [Select_CString(ROOT.Char.IsFemale, 'владычицу', 'владыку' )] Полей? #italic В темницу [foreign_merchant.GetHerHis]!#!"
 dataw_chanvalois_events.0004.t: "Призыв против ассимиляции"
 dataw_chanvalois_events.0004.desc: "Посреди обычного дня ко мне подходит [Select_CString(courtier.IsFemale, 'одна из моих придворных', 'один из моих придворных' )], [courtier.GetName], чтобы поделиться новостью, услышанной по пути через владение [capital_county.GetName].\n\n#italic — [Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )], в городе [Select_CString(peasant.IsFemale, 'глашатая', 'глашатай' )] по имени [peasant.GetName] призывает шанвалуа выступить против соседей с иными обычаями. В этих речах говорится, что уклад шанвалуа, взращённый подобно полям на земле нашей родины, принадлежит лишь нам и не должен исчезнуть из-за принятия чужих обычаев. Прикажете ответить на эти речи?#!\nСлова опасны: ими легко увлечь доверчивых людей на путь разрушения. И всё же народное одобрение могло бы помочь моему возвышению в Великой Игре."
 dataw_chanvalois_events.0004.a: "Объявить народу, что мы согласны. Шанвалуа будут процветать на собственном пути."
 dataw_chanvalois_events.0004.b: "Принимая непохожих на нас людей, мы поможем культуре шанвалуа развиваться."
 dataw_chanvalois_events.0004.c: "Пусть народ решит сам, а я последую за большинством."
 dataw_chanvalois_events.0004.c.success: "Успех!"
 dataw_chanvalois_events.0004.c.failure: "Неудача!"
 dataw_chanvalois_events.0004.c.mid: "Сойдёт."
 dataw_chanvalois_events.0004.d: "Заключить [Select_CString(peasant.IsFemale, 'эту глупицу', 'этого глупца' )] в темницу!"
 dataw_chanvalois_events.0005.t: "Честный труд"
 dataw_chanvalois_events.0005.desc: "Пока я знакомлю [Select_CString(child.IsFemale, 'свою подопечную', 'своего подопечного' )] с тонкостями жизни, [child.GetName] прерывает наставления и обращает моё внимание на дверь. Там [Select_CString(courtier.IsFemale, 'стоит одна из моих придворных', 'стоит один из моих придворных' )], [courtier.GetName].\n\n#italic — Ваше превосходительство,#! — звучит объяснение, — #italic [Select_CString(child.IsFemale, 'ваша подопечная растёт прекрасной юной особой', 'ваш подопечный растёт прекрасным юношей' )]. Простите за дерзость, но одной теории мало: опыт принесёт [Select_CString(child.IsFemale, 'ей', 'ему' )] пользу. С вашего позволения [child.GetName] поработает в полях вместе с крестьянами и лучше поймёт повседневную жизнь простых шанвалуа, а заодно познает пользу здорового труда на земле.#!\n\nНесмотря на внезапное появление и дерзкое предложение, я задумываюсь: что важнее — увидеть труд на Полях Жислена собственными глазами или уделить больше внимания учёбе? Быть может, в этом есть смысл."
 dataw_chanvalois_events.0005.a: "Возьмите [child.GetHerHis] с моего благословения."
 dataw_chanvalois_events.0005.b: "[child.GetName] [Select_CString(child.IsFemale, 'должна', 'должен' )] сосредоточиться на учёбе."
 dataw_chanvalois_events.0005.c: "Вон из моего двора. Только мне решать, как будет учиться [child.GetName]."
 dataw_chanvalois_events.0006.t: "Место нашего народа"
 dataw_chanvalois_events.0006.desc: "Я иду по залам крепости, разбирая очередное незначительное письмо о каком-то странном споре из-за мабари, когда рядом разгорается жаркий спор между людьми одной со мной крови и одного выговора. Они настолько поглощены беседой, что ничего вокруг не замечают.\n\n#italic — [scholar_1.GetName], вы неправы! — звучит возражение. — Шанвалуа всегда были ближе всех к орлесианским родичам, но всё же оставались достаточно самобытны, чтобы не сливаться с ними. Наши города из поколения в поколение превыше всего ценили земледелие, не забывая при этом о городских традициях. Именно поэтому шанвалуа могут стать идеальным мостом между разными народами Орлея!#!\n\n#italic — Вы обманываете себя, [scholar_2.GetName]. Пытаясь стать мостом, как вы говорите, мы лишь размоем собственную самобытность, пока соседи не поглотят нас. Шанвалуа должны не просто ещё сильнее отличаться от других потомков цирианов, но и распространять свою культуру, пока не станут главным народом всего Орлея. Когда-то наши города жестоко соперничали с орлесианскими родичами за власть над центральными землями, но нас вытеснили в Жислен. Орлесианцы не умели возделывать эти земли так же хорошо, как мы, — и потому мы выжили. Пришло время вернуть похищенное ими место на вершине Орлея!#!\n\nНаконец спорящие замечают меня рядом и просят высказать своё мнение."
 dataw_chanvalois_events.0006.a: "[scholar_2.GetName] [Select_CString(scholar_2.IsFemale, 'права', 'прав' )]: мы должны стать мостом между всеми потомками цирианов."
 dataw_chanvalois_events.0006.b: "[scholar_1.GetName] рассуждает верно: шанвалуа поднимутся на вершину Орлея!"
 dataw_chanvalois_events.0006.c: "Это ваш спор, и я не стану вмешиваться."
 dataw_chanvalois_events.0006.d: "На самом деле вы оба неправы..."
 dataw_chanvalois_events.0006.d.success: "В искусном споре вы доказываете неправоту обоих."
 dataw_chanvalois_events.0006.d.failure: "Вы лишь выставляете себя на посмешище."
 
