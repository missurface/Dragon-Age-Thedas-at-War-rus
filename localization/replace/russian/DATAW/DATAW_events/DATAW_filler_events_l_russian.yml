l_russian:
 ### Thedas filler events
 dataw_events_thedas.0010.tit: "Случайная встреча"
 dataw_events_thedas.0010.desc: "Осушая очередную кружку эля, я слышу, как кто-то в углу таверны кричит другим посетителям:\n\n«Да говорю же вам, я [neighboring_realm_owner.Custom2('RelationToMe', SCOPE.sC('encountered_claimant'))] [neighboring_realm_owner.GetTitledFirstName]!»\n\nСлушатели пренебрежительно отмахиваются от [Select_CString(encountered_claimant.IsFemale, 'незнакомки', 'незнакомца' )] и возвращаются к выпивке.\nПьяные россказни здесь не редкость, и большинство предпочитает держаться от их рассказчиков подальше."
 dataw_events_thedas.0010.a: "«Как, говорите, вас зовут?»"
 dataw_events_thedas.0010.b: "«Ещё по кружке!»"
 dataw_events_thedas.0020.tit: "Забытое поле боя"
 dataw_events_thedas.0020.desc: "Среди пыли и обломков, поднятых расширением вашей державы, из-под земли проступает древнее поле боя. Его тайны долгие века покоились под толщей времени.\n\nЗемля усеяна реликвиями минувшей эпохи: ржавым оружием, расколотыми щитами и истлевшими знамёнами, безмолвно повествующими о великой и кровавой битве.\n\nТеперь решать вам: обратиться к прошлому, извлечь его сокровища и предания и с их помощью изменить настоящее — или сохранить неприкосновенность этого места, почтив память тех, кто сражался и пал здесь много веков назад?\n\nЭтот выбор определит не только отношение державы к собственной истории, но и путь, которым она пойдёт в будущем."
 dataw_events_thedas.0020.a: "Провести раскопки, чтобы найти ценные реликвии и узнать больше о прошлом."
 dataw_events_thedas.0020.b: "Объявить поле боя историческим памятником и оставить его нетронутым."
 dataw_events_thedas.0020.a.desc: "На поле боя найдены старинные карты и книги."
 dataw_events_thedas.0020.b.desc: "Вы вспоминаете наставления, полученные на поле боя."
 dataw_events_thedas.0030.tit: "Киркволльский торговец"
 dataw_events_thedas.0030.desc: "К вашему [Concept('court','двору')|E] прибывает именитый торговец из многолюдного Киркволла и предлагает заманчивую сделку.\n\n[Select_CString(kirkwaller_merchant.IsFemale, 'Гостья', 'Гость' )] обещает доставлять редкие и диковинные товары со всего региона [GetGeographicalRegion('world_thedas').GetName], что принесёт вашей державе богатство и славу.\n\nВзамен [Select_CString(kirkwaller_merchant.IsFemale, 'торговка', 'торговец' )] просит о стратегическом партнёрстве или значительных вложениях."
 dataw_events_thedas.0030.a: "Заключить сделку."
 dataw_events_thedas.0030.b: "Отклонить предложение."
 dataw_events_thedas.0040.tit: "Песнь Шартана"
 dataw_events_thedas.0040.desc: "Хотя Песнь Шартана неизменно привлекает исследователей [Concept('chantry','Церкви')|E], её место в [Concept('chant_of_light','Песни Света')|E] порой ставят под сомнение: автор произведения неизвестен, а его историческая достоверность не доказана. Начало войны с [Concept('elves','эльфами')|E] — к добру или к худу — вновь вывело эти вопросы на первый план. Пока гремят сражения, созывается собор андрастианского духовенства со всего Тедаса. Прибывают даже представители тевинтерской Церкви, формально не признанной остальным духовенством. После нескольких месяцев ожесточённых споров собравшиеся великие жрецы и священнослужители приходят к решению большинством голосов — небольшим, но всё же большинством. Песнь Шартана надлежит исключить из официальной Песни Света и отныне причислить к Диссонантным строфам. Пройдут десятилетия, прежде чем указ достигнет всех уголков Тедаса, однако само заявление прозвучало решительно — и вызвало немало споров."
 dataw_events_thedas.0040.a: "Эльфы отвернулись от Создателя. Теперь от этой песни мало пользы."
 dataw_events_thedas.0040.b: "Роль эльфов в истории нельзя оставлять лишь предметом учёных споров!"
 ### Orlesian filler events
 dataw_events_orlais.0010.tit: "Вечное колесо моды"
 dataw_events_orlais.0010.desc: "О Создатель.\n\nЯ вхожу в тронный зал, намереваясь обсудить по-настоящему срочные дела управления владениями, но путь мне преграждает [fashionista.GetNameNoTooltip]. В глазах [Select_CString(fashionista.IsFemale, 'придворной', 'придворного' )] горит страсть, знакомая лишь тем, кто безоглядно следует за бешено вращающимся колесом изменчивой и мимолётной моды.\n\n«[ROOT.Char.GetTitledFirstNameNoTooltip], с вашего позволения, я [Select_CString(fashionista.IsFemale, 'пришла', 'пришёл' )] сообщить о прекраснейшем новом веянии! Мы называем его „Расписной вуалью“. Вместо привычной в Орлее сплошной маски мы просто рисуем её прямо на лице! Представьте танцующих на балу гостей с масками, нанесёнными на кожу. Капли воды, которые партнёры по танцу бережно оставляют на их лицах, мало-помалу стирают краску, пока с окончанием танца все не предстают без масок! Присоединитесь ли вы к нам, [ROOT.Char.GetTitleTierName]?»\n\n[Select_CString(fashionista.IsFemale, 'Моя дорогая придворная забывает', 'Мой дорогой придворный забывает' )] лишь одно: несколько лет назад эта затея уже была чрезвычайно популярна, а теперь снова вернулась, словно Расписная вуаль решительно отказывается умирать. Как бы то ни было, [fashionista.GetNameNoTooltip] ждёт ответа, и оставить [Select_CString(fashionista.IsFemale, 'её', 'его' )] без внимания было бы невежливо."
 dataw_events_orlais.0010.a: "Разумеется! Я с радостью присоединюсь к Расписной вуали."
 dataw_events_orlais.0010.a.a: "#V #L Каждый#!#! [Concept('courtier','придворный')|E] получает #P 10#! к [Concept('opinion','мнению')|E] о #V вас#! на #V 5 лет#! #weak (Участие в Расписной вуали)#!"
 dataw_events_orlais.0010.b: "Мне как [Select_CString(ROOT.Char.IsFemale, 'правительнице', 'правителю' )] приходится заботиться о слишком многих делах."
 dataw_events_orlais.0010.c: "Прости, [Select_CString(fashionista.IsFemale, 'дорогая', 'дорогой' )], но твоя маска окажется столь же мимолётной, как и эта мода."
 dataw_events_orlais.0010.c.a: "#V #L Каждый#!#! [Concept('ruler','правитель')|E] культуры [GetGlobalVariable('orlesian_culture_var').Culture.GetName] теряет #N 5#! [Concept('opinion','мнения')|E] о #V вас#! на #V 5 лет#! #weak (Безразличие к моде)#!"
 dataw_events_orlais.0020.tit: "Капризная монета"
 dataw_events_orlais.0020.desc: "Войдя в сад при крепости, я замечаю у фонтана нескольких именитых придворных и знатных гостей. Они беседуют и обмениваются капризами — мелкими монетками почти без ценности, которые по окончании вечера принято бросать в воду.\n\n«[Select_CString(ROOT.Char.IsFemale, 'Дорогая', 'Дорогой' )], — произносит [caprice_giver.GetNameNoTooltip], — не желаете присоединиться к нам и бросить каприз, отчеканенный специально к этому дивному празднику? Возьмите один из моей коллекции»."
 dataw_events_orlais.0020.a: "Осмотреть каприз."
 dataw_events_orlais.0020.a.desc_1: "Вы замечаете, что каприз уже использовали."
 dataw_events_orlais.0020.a.desc_2: "Вы бросаете каприз."
 dataw_events_orlais.0020.a.tooltip_1: "#V #L Каждый#!#! присутствующий персонаж, кроме [caprice_giver.GetTitledFirstName], получает #P 10#! к [Concept('opinion','мнению')|E] о #V вас#! на #V 5 лет#! #weak (Замеченный использованный каприз)#!"
 dataw_events_orlais.0020.a.tooltip_2: "#V #L Каждый#!#! присутствующий персонаж теряет #N 20#! [Concept('opinion','мнения')|E] о #V вас#! на #V 5 лет#! #weak (Брошенный повторно каприз)#!"
 dataw_events_orlais.0020.b: "[caprice_giver.GetFirstNameNoTooltip], его уже бросали?"
 dataw_events_orlais.0020.b.desc_1: "Вы замечаете, что [caprice_giver.GetFirstNameNoTooltip] лжёт."
 dataw_events_orlais.0020.b.desc_2: "[ROOT.Char.GetFirstNameNoTooltip] придумывает убедительную ложь."
 dataw_events_orlais.0020.b.tooltip_1: "#V #L Каждый#!#! присутствующий персонаж:\n• получает #P 20#! к [Concept('opinion','мнению')|E] о #V вас#! на #V 5 лет#! #weak (Раскрытая правда)#!\n• теряет #N 20#! [Concept('opinion','мнения')|E] о персонаже #V [caprice_giver.GetTitledFirstName]#! на #V 5 лет#! #weak (Раскрытая правда)#!"
 dataw_events_orlais.0020.b.tooltip_2: "#V #L Каждый#!#! присутствующий персонаж:\n• теряет #N 20#! [Concept('opinion','мнения')|E] о #V вас#! на #V 5 лет#! #weak (Ложное обвинение)#!\n• получает #P 20#! к [Concept('opinion','мнению')|E] о персонаже #V [caprice_giver.GetTitledFirstName]#! на #V 5 лет#! #weak (Ложное обвинение)#!"
 dataw_events_orlais.0020.c: "Благодарю, но я попрошу слугу принести мне другую монету."
 dataw_events_orlais.0020.c.tooltip_1: "#V #L Каждый#!#! присутствующий персонаж, кроме [caprice_giver.GetTitledFirstName], получает #P 10#! к [Concept('opinion','мнению')|E] о #V вас#! на #V 5 лет#! #weak (Отказ от предложения)#!"
 dataw_events_orlais.0030.tit: "Контрабанда со вкусом"
 dataw_events_orlais.0030.desc: "Во время пути мы останавливаемся отдохнуть в портовом городе. Пока я ищу на рынке припасы, меня прерывает [travel_entourage.GetNameNoTooltip].\n\n«[Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )], я [Select_CString(travel_entourage.IsFemale, 'заметила', 'заметил' )] группу ривейнских моряков во главе с торговцем по имени [rivaini_merchant.GetNameNoTooltip]. Наверняка они затевают недоброе — должно быть, занимаются контрабандой. Предлагаю сообщить о них местным властям. [local_holder.GetTitledFirstName] будет [Select_CString(local_holder.IsFemale, 'довольна', 'доволен' )] и останется у вас в долгу».\n\nМожно последовать совету [travel_entourage.GetNameNoTooltip], но личная встреча и торг с ривейнцами позволят приобрести вещи, которых больше нигде не найти. Таковы преимущества контрабанды. Более того, [rivaini_merchant.GetNameNoTooltip] [Select_CString(rivaini_merchant.IsFemale, 'стала бы превосходной советницей', 'стал бы превосходным советником' )] по хозяйственным делам. Опасность лишь в том, что [Select_CString(rivaini_merchant.IsFemale, 'она может не знать', 'он может не знать' )] правил Игры, но этому можно научиться."
 dataw_events_orlais.0030.a: "Сообщить городской страже. Услуга за услугу."
 dataw_events_orlais.0030.b: "Встретиться с ними и посмотреть на товар."
 dataw_events_orlais.0030.c: "Такой торговец пригодился бы при моём дворе."
 dataw_events_orlais.0030.d: "Заплатить торговцу, чтобы навредить местной торговле."
 dataw_events_orlais.0030.e: "Не стоит в это вмешиваться."
 dataw_events_orlais.0030.b.desc_1: "[rivaini_merchant.GetFirstNameNoTooltip] считает вас [Select_CString(ROOT.Char.IsFemale, 'подозрительной', 'подозрительным' )] и отказывается торговать."
 dataw_events_orlais.0030.b.desc_2: "[rivaini_merchant.GetFirstNameNoTooltip] соглашается показать вам товары."
 dataw_events_orlais.0030.b.desc_3: "Цена сделки уменьшится вдвое."
 dataw_events_orlais.0030.c.desc_1: "[rivaini_merchant.GetFirstNameNoTooltip] не согласится бросить своё дело и команду ради вас."
 dataw_events_orlais.0030.c.desc_2: "[rivaini_merchant.GetFirstNameNoTooltip] присоединится к вам за небольшую плату."
 dataw_events_orlais.0030.c.desc_3: "Возможности обогатиться при вашем дворе слишком заманчивы."
 dataw_events_orlais.0030.d.desc_1: "Вам удаётся выйти сухим из воды."
 dataw_events_orlais.0030.d.desc_2: "[local_holder.GetTitledFirstName] [Select_CString(local_holder.IsFemale, 'узнала', 'узнал' )] о вашем сговоре."
 dataw_events_orlais.0040.tit: "Песнь, иссушенная голодом"
 dataw_events_orlais.0040.desc: "Наше мирное путешествие внезапно прерывает слуга, обнаруживший на дороге [Select_CString(lost_bard.IsFemale, 'обессилевшую путницу', 'обессилевшего путника' )]. С трудом поднявшись, [Select_CString(lost_bard.IsFemale, 'незнакомка представляется', 'незнакомец представляется' )]: [lost_bard.GetNameNoTooltip], [Select_CString(lost_bard.IsFemale, 'странствующая бардесса, которая заблудилась', 'странствующий бард, который заблудился' )] по пути с последнего выступления. [lost_bard.GetNameNoTooltip] просит лишь немного еды, чтобы восстановить силы.\n\nРазумеется, всё это может оказаться уловкой, а умение заблудиться не лучшим образом говорит о таланте гостя. Как бы то ни было, решение за мной."
 dataw_events_orlais.0040.a: "Согласие на просьбу позволит мне заручиться услугами и верностью [Select_CString(lost_bard.IsFemale, 'этой бардессы', 'этого барда' )]."
 dataw_events_orlais.0040.b: "Накормить [Select_CString(lost_bard.IsFemale, 'бардессу', 'барда' )] и отпустить восвояси."
 dataw_events_orlais.0040.c: "[Select_CString(lost_bard.IsFemale, 'Эта бардесса', 'Этот бард' )] может оказаться шпионом. Избавиться от угрозы."
 dataw_events_orlais.0040.d: "Так что это было за выступление?"
 dataw_events_orlais.0040.e: "[Select_CString(lost_bard.IsFemale, 'Эта бардесса', 'Этот бард' )] может оказаться шпионом. Пусть выживает своими силами."
 dataw_events_orlais.0040.f: "Еда достанется тебе за плату."
 dataw_events_orlais.0050.tit: "Окорок со вкусом отчаяния"
 dataw_events_orlais.0050.desc: "[antivan_merchant.GetNameNoTooltip], [Select_CString(antivan_merchant.IsFemale, 'известная во многих землях торговка', 'известный во многих землях торговец' )], приближается к трону и преклоняет колено, явно намереваясь заключить сделку.\n\n«[Select_CString(ROOT.Char.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.GetTitleTierName], я [Select_CString(antivan_merchant.IsFemale, 'явилась', 'явился' )] предложить вам изысканное мясо и блюда со всего континента. Их чудесный и неповторимый вкус удивит каждого гостя и обитателя вашего великолепного двора.\n\nОсобенно я люблю антиванские оливки: говорят, они сохранили вкус крови, пролитой Воронами! Весьма необычно, не правда ли? Есть у меня и несколько сортов андерского окорока, который, по слухам, отдаёт отчаянием. Вкус на любителя, зато он определённо разнообразит, позвольте заметить, довольно унылое угощение вашего двора»."
 dataw_events_orlais.0050.a: "Кому не нужно немного больше отчаяния в рационе?"
 dataw_events_orlais.0050.b: "Управляющий, займись торгом."
 dataw_events_orlais.0050.b.desc_1: "Вы платите непомерную цену."
 dataw_events_orlais.0050.b.desc_2: "Вам удаётся сторговаться о разумной цене."
 dataw_events_orlais.0050.b.desc_3: "Вам удаётся заключить выгодную сделку."
 dataw_events_orlais.0050.c: "Зачем мне окорок со вкусом отчаяния?"
 ### Mareschois filler events
 dataw_events_nahashin_marsh.0010.tit: "Орлесианский скакун"
 dataw_events_nahashin_marsh.0010.desc: "Когда мы со свитой проезжаем через владение [ROOT.Char.GetCurrentLocation.GetName], моё внимание привлекает [Select_CString(horse_breeder.IsFemale, 'нарядная женщина, держащая', 'нарядный мужчина, держащий' )] поводья великолепного скакуна. Заметив мой интерес, [horse_breeder.GetFirstName] широко улыбается. «Ах, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )]! Не желаете приобрести боевого коня благороднейшей крови? Он выведен в западных болотах и воплощает столетия мастерства коневодов». По крайней мере, о происхождении коня [horse_breeder.GetFirstName] не лжёт: я без труда узнаю породу марешуа."
 dataw_events_nahashin_marsh.0010.a: "За такого великолепного коня не жалко никаких денег!"
 dataw_events_nahashin_marsh.0010.b: "Пф! Дома я найду коня получше."
 dataw_events_nahashin_marsh.0010.c: "Может, и мне стоит заняться коневодством, как моим предкам?"
 dataw_events_nahashin_marsh.0020.tit: "Родовая вражда"
 dataw_events_nahashin_marsh.0020.desc: "[vassal_01.GetTitledFirstName] и [vassal_02.GetTitledFirstName] подходят к моему трону, бросая друг на друга ледяные взгляды. Напряжение почти осязаемо. Заметив моё недовольство, [vassal_01.GetFirstNameNoTooltip] кланяется и обращается ко мне: «Простите, [Select_CString(ROOT.Char.IsFemale, 'моя', 'мой' )] [ROOT.Char.GetTitleTierName]. Ещё со времён цирианских военных вождей дом [vassal_01.GetHouse.GetName] и дом [vassal_02.GetHouse.GetName] неизменно враждовали…»\n\n«Лишь из-за вашего вероломства! — рычит [vassal_02.GetFirstNameNoTooltip]. — [Select_CString(ROOT.Char.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.GetTitleTierName], наши дома воюют с тех пор, когда мы были всего лишь клановыми вождями, — и всё благодаря этим свиньям и их мелочной злобе!»\n\n[family_member_01.GetFirstName] мрачно хмурится. «А сколько нашей крови пролили вы? Мы вправе требовать правосудия!»\n\n«Правосудия или мести? — рявкает [family_member_02.GetFirstName], хватаясь за рукоять клинка. — Кто первым бросил камень?»\n\n«ДОВОЛЬНО!» — мой рёв заставляет спорщиков умолкнуть."
 dataw_events_nahashin_marsh.0020.a: "Решение будет в пользу [vassal_01.GetTitledFirstNameNoTooltip]. Дом [vassal_02.GetHouse.GetNameNoTooltip] выплатит возмещение."
 dataw_events_nahashin_marsh.0020.a.tooltip_1: "Все представители [Concept('house','дома')|E] [vassal_01.GetHouse.GetName|V] получают #P 20#! к [Concept('opinion','мнению')|E] о #V вас#! на #V 15 лет#! #weak (Поддержка моего дома в родовой вражде)#!"
 dataw_events_nahashin_marsh.0020.a.tooltip_2: "Все представители [Concept('house','дома')|E] [vassal_02.GetHouse.GetName|V] теряют #N 20#! [Concept('opinion','мнения')|E] о #V вас#! на #V 15 лет#! #weak (Противодействие моему дому в родовой вражде)#!"
 dataw_events_nahashin_marsh.0020.b: "Если вражду действительно начал дом [vassal_01.GetHouse.GetNameNoTooltip], пострадавшей стороной следует признать дом [vassal_02.GetHouse.GetNameNoTooltip]."
 dataw_events_nahashin_marsh.0020.b.tooltip_1: "Все представители [Concept('house','дома')|E] [vassal_01.GetHouse.GetName|V] теряют #N 20#! [Concept('opinion','мнения')|E] о #V вас#! на #V 15 лет#! #weak (Противодействие моему дому в родовой вражде)#!"
 dataw_events_nahashin_marsh.0020.b.tooltip_2: "Все представители [Concept('house','дома')|E] [vassal_02.GetHouse.GetName|V] получают #P 20#! к [Concept('opinion','мнению')|E] о #V вас#! на #V 15 лет#! #weak (Поддержка моего дома в родовой вражде)#!"
 dataw_events_nahashin_marsh.0020.c: "Прекратите эту мелочную грызню — оба! Иначе, клянусь…"
 dataw_events_nahashin_marsh.0020.c.tooltip_1: "Все представители [Concept('house','дома')|E] [vassal_01.GetHouse.GetName|V] теряют #N 20#! [Concept('opinion','мнения')|E] о #V вас#! на #V 15 лет#! #weak (Противодействие моему дому в родовой вражде)#!"
 dataw_events_nahashin_marsh.0020.c.tooltip_2: "Все представители [Concept('house','дома')|E] [vassal_02.GetHouse.GetName|V] теряют #N 20#! [Concept('opinion','мнения')|E] о #V вас#! на #V 15 лет#! #weak (Противодействие моему дому в родовой вражде)#!"
 dataw_events_nahashin_marsh.0030.tit: "Рыцарский поединок"
 dataw_events_nahashin_marsh.0030.desc: "Знать марешуа по праву славится мастерством верховой езды. Вопреки непригодной для конницы местности нашей родины — а быть может, благодаря ей — мы сохранили множество древних навыков, забытых изнеженными городскими аристократами. Поэтому, когда [Select_CString(competing_courtier.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMe', competing_courtier)] [competing_courtier.GetFirstNameNoTooltip] предлагает дружеский поединок на копьях, чтобы мы не теряли сноровки, я охотно соглашаюсь.\n\nКогда наши кони устремляются навстречу друг другу, я замечаю серьёзную ошибку в технике [competing_courtier.GetFirstNameNoTooltip]. Воспользовавшись ею, я легко выбью [Select_CString(competing_courtier.IsFemale, 'её', 'его' )] из седла и выиграю поединок… но такой удар может закончиться тяжёлой травмой. Возможно, лучше дождаться конца состязания, а затем указать [competing_courtier.GetFirstNameNoTooltip] на ошибку и помочь улучшить технику."
 dataw_events_nahashin_marsh.0030.a: "Нанести победный удар."
 dataw_events_nahashin_marsh.0030.b: "Подождать до конца и предложить наставление."
 dataw_events_nahashin_marsh.0040.tit: "Великая Игра"
 dataw_events_nahashin_marsh.0040.desc: "Со времён Джешавис мы, жители Орлея, живём и умираем по законам Великой Игры — медленных поединков за влияние между благородными домами. Это древняя традиция и неотъемлемая часть культуры всех потомков цириан. Марешуа в подобных делах часто недооценивают: нас считают простоватыми обитателями болот, слишком поглощёнными собственными бедами, чтобы участвовать в жизни всей страны. Разумеется, такую репутацию мы намеренно создаём как часть Игры.\n\nВ последнее время [grand_game_participant.GetTitledFirstNameNoTooltip] [Select_CString(grand_game_participant.IsFemale, 'взяла', 'взял' )] за правило приветствовать меня на балах и перемежать светскую болтовню упоминаниями о соседних вассалах. Неосторожно и слишком очевидно: вскоре я понимаю, что [grand_game_participant.GetTitledFirstNameNoTooltip] надеется настроить меня против одного из соседей и моими руками сделать грязную работу. Добавив к этому немного собственных интриг, можно переиграть противника, столкнуть обоих напрямую и заодно извлечь личную выгоду. Изящный ход в Игре."
 dataw_events_nahashin_marsh.0040.a: "Достойный ответный ход."
 dataw_events_nahashin_marsh.0040.b: "Нет, слишком рискованно. Лучше не обращать внимания на эти интриги."
 dataw_events_nahashin_marsh.0050.tit: "Спор"
 dataw_events_nahashin_marsh.0050.desc: "Когда мы со свитой останавливаемся в придорожном трактире, моё внимание привлекают две фигуры, горячо спорящие между собой. Здесь достаточно шумно, и обычно их перебранка затерялась бы среди прочих голосов, но их выдаёт безошибочно узнаваемый выговор марешуа.\n\n«Жители болот ничуть не меньше орлесианцы, чем остальные! — заявляет [Select_CString(quarrelsome_traveler.IsFemale, 'первая путница', 'первый путник' )]. — Разве все мы не потомки цириан? То, что мы сохранили несколько старых обычаев, ещё не делает нас совершенно иной культурой!»\n\n«Ты знаешь, что мы никогда до конца не склонялись перед Вал Руайо, — возражает второй голос. — Даже во времена Исората болота не приняли его великого объединения. А позднее разве мы помогали Драккону строить единую нацию? Остальной Орлей оставил нас позади и стал иным. Мы — последние хранители древней культуры!»\n\n«Это лишь значит, что мы не спешим перенимать новейшие веяния, — отвечает [quarrelsome_traveler.GetFirstName]. — В традициях нет ничего дурного. Дурно делать вид, будто из-за них мы стали чужими остальным собратьям. Что хорошего принесёт отказ от орлесианской самобытности?»\n\nЯ громко прочищаю горло, вмешиваясь в разговор."
 dataw_events_nahashin_marsh.0050.a: "[quarrelsome_traveler.GetFirstNameNoTooltip] [Select_CString(quarrelsome_traveler.IsFemale, 'права', 'прав' )]. Марешуа — часть богатой мозаики орлесианской культуры."
 dataw_events_nahashin_marsh.0050.a.tooltip_1: "Все [Concept('vassals','вассалы')|E] культуры [mareschois_culture.GetName] теряют #N 10#! [Concept('opinions','мнения')|E] о #V вас#! #weak (+1,20 в год) (Оскорбление)#!"
 dataw_events_nahashin_marsh.0050.a.tooltip_2: "Все [Concept('vassals','вассалы')|E] культуры [orlesian_culture.GetName] получают #P 10#! к [Concept('opinions','мнению')|E] о #V вас#! #weak (-1,20 в год) (Одобрение)#!"
 dataw_events_nahashin_marsh.0050.a_culture_acceptance_desc: "Принятие наследия"
 dataw_events_nahashin_marsh.0050.b: "Мне ближе второй довод. Марешуа — скорее цириане, чем орлесианцы."
 dataw_events_nahashin_marsh.0050.b.tooltip_1: "Все [Concept('vassals','вассалы')|E] культуры [mareschois_culture.GetName] получают #P 10#! к [Concept('opinions','мнению')|E] о #V вас#! #weak (-1,20 в год) (Одобрение)#!"
 dataw_events_nahashin_marsh.0050.b.tooltip_2: "Все [Concept('vassals','вассалы')|E] культуры [orlesian_culture.GetName] теряют #N 10#! [Concept('opinions','мнения')|E] о #V вас#! #weak (+1,20 в год) (Оскорбление)#!"
 dataw_events_nahashin_marsh.0050.b_culture_acceptance_desc: "Отказ от наследия"
 dataw_events_nahashin_marsh.0050.c: "Наверняка можно прийти к согласию."
 dataw_events_nahashin_marsh.0050.c.tooltip: "Все [Concept('vassals','вассалы')|E] культур [mareschois_culture.GetName] и [orlesian_culture.GetName] получают #P 10#! к [Concept('opinions','мнению')|E] о #V вас#! #weak (-1,20 в год) (Одобрение)#!"
 dataw_events_nahashin_marsh.0050.d: "Всё это субъективно. Орлесианцы, цириане — какая разница?"
 dataw_events_nahashin_marsh.0050.d.tooltip: "Все [Concept('vassals','вассалы')|E] культур [mareschois_culture.GetName] и [orlesian_culture.GetName] теряют #N 10#! [Concept('opinions','мнения')|E] о #V вас#! #weak (+1,20 в год) (Оскорбление)#!"
 ### Nevenais Filler Events
 dataw_events_gamord.0010.tit: "Бесплатные сульфаты"
 dataw_events_gamord.0010.desc: "Мой двор посещает [Select_CString(hobbyist_alchemist.IsFemale, 'алхимик-любительница', 'алхимик-любитель' )]. [Select_CString(hobbyist_alchemist.IsFemale, 'Она утверждает, что исследовала воды близлежащих серных озёр и обнаружила', 'Он утверждает, что исследовал воды близлежащих серных озёр и обнаружил' )] в них магические свойства. По словам алхимика, вода годится для удобрения полей, отбеливания бумаги и изготовления мыла.\n[Select_CString(hobbyist_alchemist.IsFemale, 'Гостья спрашивает', 'Гость спрашивает' )], представляют ли эти исследования для меня ценность."
 dataw_events_gamord.0010.a: "Удобрение для полей и впрямь пригодится."
 dataw_events_gamord.0010.b: "Больше бумаги — больше книг! Какая удача!"
 dataw_events_gamord.0010.c: "Зато теперь здесь странно пахнет…"
 dataw_events_gamord.0010.c.tooltip: "Каждый [Concept('courtier','придворный')|E] получает модификатор [GetModifier( 'new_soap' ).GetNameWithTooltip] на #V 5 лет#!"
 dataw_events_gamord.0010.d: "Всё это замечательно! Вам стоит написать книгу!"
 dataw_events_gamord.0010.e: "Пустая трата времени. Вон отсюда!"
 dataw_events_gamord.0020.tit: "Здесь водятся чудовища"
 dataw_events_gamord.0020.desc: "Однажды ночью в море мне не удаётся уснуть, и я поднимаюсь на палубу посмотреть на тёмные волны. Ночью работает лишь малая часть команды, и один старый моряк пренебрегает обязанностями, чтобы составить мне компанию. Он указывает на тёмные силуэты под водой и рассказывает, что умеет узнавать морских существ по одному лишь мимолётному взгляду на показавшуюся над волнами часть тела. Быть может, подобный навык ещё пригодится…"
 dataw_events_gamord.0020.a: "Скажи, тебе не нужна работа?"
 dataw_events_gamord.0020.b: "Ты можешь научить меня этому?"
 dataw_events_gamord.0020.b.tooltip: "Стоимость вашей следующей охоты на китов уменьшится на @gold_icon!#V 20#! [Concept('gold','золота')|E]"
 dataw_events_gamord.0030.tit: "Прозрачные границы"
 dataw_events_gamord.0030.desc: "Во время путешествия я встречаю [travelling_merchant.GetFirstName], [Select_CString(travelling_merchant.IsFemale, 'торговку, которая пересекает', 'торговца, который пересекает' )] границу между моей державой и землями соседа. Повозка выглядит необычно: она разделена пополам, чтобы стая гусей не стала добычей целой своры кошек. Когда я спрашиваю о странном грузе, [travelling_merchant.GetFirstName] нервно отвечает:\n\n«Видите ли, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )], в вашей державе гусь стоит вдвое дешевле, чем готовы заплатить вандаларийские торговцы. Кошки же в обеих землях ценятся одинаково. Поэтому здесь я обмениваю кошек на гусей, а затем продаю птиц вандаларийцам с хорошей прибылью. Дело выгодное — пока люди любят гусей и нуждаются в кошках»."
 dataw_events_gamord.0030.a: "Это очевидное мошенничество. Теперь ты поговоришь с моей стражей."
 dataw_events_gamord.0030.a_culture_acceptance_desc: "Пресечение торговли между нашими культурами"
 dataw_events_gamord.0030.b: "Хитро придумано. Стоит рассказать об этом другим торговцам."
 dataw_events_gamord.0030.b.tooltip_1: "Каждое [Concept('county','графство')|E] культуры [nevenais_culture.GetName] получает модификатор [GetModifier( 'exporting_goods' ).GetNameWithTooltip] на #V 5 лет#!"
 dataw_events_gamord.0030.b.tooltip_2: "Каждое [Concept('county','графство')|E] культуры [vandalarien_culture.GetName] получает модификатор [GetModifier( 'importing_goods' ).GetNameWithTooltip] на #V 5 лет#!"
 dataw_events_gamord.0030.b_culture_acceptance_desc: "Поощрение торговли между нашими культурами"
 dataw_events_gamord.0030.c: "Так ты продаёшь кошек?"
 dataw_events_gamord.0040.tit: "Четыре страсти"
 dataw_events_gamord.0040.desc: "Во время встречи с [court_chaplain.GetFirstNameNoTooltip] наш разговор от государственных дел переходит к вопросам духа.\n\n[Select_CString(court_chaplain.IsFemale, 'Моя', 'Мой' )] [court_chaplain.GetCouncilTitle] лукаво смотрит на меня и спрашивает, [Select_CString(ROOT.Char.IsFemale, 'готова ли я', 'готов ли я' )] открыть свою слабость. Я прошу уточнить вопрос.\n\n«Скажите, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )]… какова ваша величайшая страсть?»"
 dataw_events_gamord.0040.a: "Это испытание? Вон отсюда!"
 dataw_events_gamord.0040.b: "Восторг."
 dataw_events_gamord.0040.c: "Желание."
 dataw_events_gamord.0040.d: "Скорбь."
 dataw_events_gamord.0040.e: "Страх."
 dataw_events_gamord.0050.tit: "Спор с вандаларийцем"
 dataw_events_gamord.0050.desc: "Однажды вечером я застаю двух придворных за шумным спором. Запах спиртного между ними говорит сам за себя. «Да говорю же тебе, — [nevenais_courtier.GetFirstName], похоже, повторяет уже сказанное до моего появления, — невенское побережье — нетронутая золотая жила! Если Вал Руайо построит небольшую флотилию китобойных судов, вложения в амбру окупятся более чем вдвое!»\n\n[vandalarien_courtier.GetFirstName] прерывает эту тираду: «Орлею никогда не было дела до своих западных детей. На севере всё так же. Мы стоим ровно столько, сколько принесли налоги за прошлый месяц».\n\nСтоит ли мне вмешаться?"
 dataw_events_gamord.0050.a: "Оставить их в покое."
 dataw_events_gamord.0050.b: "Чепуха! Мы куда сильнее вандаларийцев!"
 dataw_events_gamord.0050.c: "Возможно, лучше оставаться незамеченными. В тени мы станем сильнее."
 dataw_events_gamord.0050.d: "Несмотря на различия, все мы — дети цириан, и Вал Руайо многим нам обязан."

 dataw_events_gamord.0060.tit: "Поиски за Пепельным морем"
 dataw_events_gamord.0060.desc: "Орлей издавна забывал о нас, жителях Гаморда. Наше герцогство считали захолустьем, которое приносит прибыль лишь благодаря китобойному промыслу и богатым рудами горам. Мало кто отправлялся сюда без ясной и важной цели.\n\nИскатель Истины, стоящий сегодня передо мной, служит лучшим доказательством важности нынешнего дела.\n\n«[Select_CString(ROOT.Char.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.GetTitleTierName], сегодня я обращаюсь к вам за помощью в важном деле.\n[Select_CString(exile_seeker.IsFemale, 'Бывшая Искательница', 'Бывший Искатель' )] по имени [exile_seeker.GetFirstNameNoTooltip], [Select_CString(exile_seeker.IsFemale, 'сосланная', 'сосланный' )] к Морю Пепла за невыполнение обязанностей, недавно [Select_CString(exile_seeker.IsFemale, 'была замечена', 'был замечен' )] в землях [GetTitleByKey('c_lisiere_cendre').GetName] среди кочевников, населяющих Пепельное море».\n\n«Это [cendrerin_culture.GetName], — отвечает [Select_CString(random_councillor.IsFemale, 'моя', 'мой' )] [random_councillor.GetCouncilTitle]. — Как и все жители Орлея, они происходят от древних племён цириан, но предпочли скитаться по дюнам Моря Пепла. Свои обычаи они хранят в тайне, хотя нередко торгуют с нами на Расколотом море»."
 dataw_events_gamord.0060.a: "Я помогу вам, Искатель Истины."
 dataw_events_gamord.0060.a.tt: "Вы направите все доступные средства на поиски [Select_CString(exile_seeker.IsFemale, 'изгнанной Искательницы', 'изгнанного Искателя' )]"
 dataw_events_gamord.0060.b: "Я разыщу это племя,\nно не обещаю исполнять приговор над [Select_CString(exile_seeker.IsFemale, 'изгнанницей', 'изгнанником' )]."
 dataw_events_gamord.0060.b.tt: "Вы направите все доступные средства на поиски племени"
 dataw_events_gamord.0060.c: "[Select_CString(exile_seeker.IsFemale, 'Изгнанница — Искательница', 'Изгнанник — Искатель' )],\nа значит, привести приговор в исполнение обязаны Искатели."

 dataw_events_gamord.0062.tit: "Племена Моря Пепла"
 dataw_events_gamord.0062.desc.opening: "Прошло несколько недель после появления Искателя, и теперь передо мной стоит [Select_CString(exile_seeker.IsFemale, 'обещанная Искателям изгнанница', 'обещанный Искателям изгнанник' )] — [exile_seeker.GetFirstName]. Одежда ничем не отличается от кочевой, но ожерелье со знаком Искателей Истины выдаёт происхождение.\n\n"
 dataw_events_gamord.0062.desc.a: "«Прошу, [ROOT.Char.GetTitleTierName], выслушайте меня! — почти умоляет [exile_seeker.GetFirstName]. — Я знаю о вашем обещании Искателям, но прошу позволить мне остаться с моим новым народом».\n\n"
 dataw_events_gamord.0062.desc.b: "«Прошу, [ROOT.Char.GetTitleTierName], выслушайте меня! — почти умоляет [exile_seeker.GetFirstName]. — Я знаю, что вы обещали разыскать моё племя, но, если позволите мне вновь присоединиться к нему, я дам вам то, чего не могут дать Искатели».\n\n"
 dataw_events_gamord.0062.desc.ending: "[exile_seeker.GetFirstName] объясняет, что сандренцы с незапамятных времён странствуют по Морю Пепла. В Лизьер-Сандр они заходят нечасто, но регулярно: торгуют с жителями Гаморда или ждут кораблей из владения [GetTitleByKey('c_mont_de_glace').GetName]. Среди вечно движущихся пепельных дюн горы олицетворяют для сандренцев постоянство, и потому кочевники решили поселиться среди местных жителей.\n\n«Я прошу лишь позволить мне и моему племени остаться в Лизьер-Сандр, — продолжает [exile_seeker.GetFirstNameNoTooltip]. — Я сделаю всё, чтобы это принесло вам пользу. Торговля с кочевниками? Поселенцы для развития хозяйства? Воины для армии? Позвольте мне вернуться к моему народу, и я постараюсь исполнить любое ваше желание»."
 dataw_events_gamord.0062.a: "Ступай и вели им торговать со мной."
 dataw_events_gamord.0062.a.tt: "#V #L Каждый#!#! последователь веры [GetFaithByKey('orlesian_chantry').GetAdherentNamePlural] теряет #N 30#! [Concept('opinion','мнения')|E] о #V вас#! #weak (+1,20 в год) (Разочарование)#!"
 dataw_events_gamord.0062.b: "Ступай и скажи, что здесь рады новым поселенцам."
 dataw_events_gamord.0062.c: "Ступай и скажи, что некоторые должны пополнить ряды моих воинов."
 dataw_events_gamord.0062.d: "Ты отправишься к Искателям, и они решат твою судьбу."
 dataw_events_gamord.0062.d.tt: "#V #L Каждый#!#! последователь веры [GetFaithByKey('orlesian_chantry').GetAdherentNamePlural] получает #P 30#! к [Concept('opinion','мнению')|E] о #V вас#! #weak (-1,20 в год) (Одобрение)#!"

 dataw_events_gamord.0064.tit: "Странники серных дюн"
 dataw_events_gamord.0064.desc.opening: "Прошло несколько месяцев с тех пор, как кочевники культуры [cendrerin_culture.GetName] поселились среди жителей Лизьер-Сандр. Несмотря на конфликты между новоприбывшим большинством и прежним населением, положение, казалось, успокоилось ко всеобщей выгоде.\n\nПо крайней мере, я так [Select_CString(ROOT.Char.IsFemale, 'считала', 'считал' )].\n\nКо двору в [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] приходит [Select_CString(lisiere_cendre_peasant.IsFemale, 'крестьянка', 'крестьянин' )] по имени [lisiere_cendre_peasant.GetFirstName] и утверждает, что сандренцы совершают гнусные деяния, а некоторые из них исповедуют вовсе не андрастианство, но совершенно иную веру.\n\n[lisiere_cendre_peasant.GetFirstName] рассказывает о призыве демонов, о сотканных из пепла призраках, которые появляются во время странных ритуалов и беседуют с кочевниками, словно родитель с ребёнком. Затем речь заходит о жертвоприношениях: люди добровольно вступают в огонь с чёрной жемчужиной во рту и позволяют пламени обратить себя в прах.\n\nХуже всего то, что вскоре принесённые в жертву возвращаются в обличье таких же призраков.\n\nЭти откровения ошеломляют мой двор, и многие цепенеют от ужаса. Уже звучат требования изгнать развращённых кочевников из Гаморда, раз и навсегда показать им свет Создателя и перебить всех, кто откажется. Никогда прежде мой народ не жаждал войны с такой силой.\n\nНо пока зал оглашают громкие призывы к битве, передо мной предстаёт посольство кочевников.\n\n«[Select_CString(ROOT.Char.IsFemale, 'Моя дорогая госпожа', 'Мой дорогой господин' )], — начинает [Select_CString(cendrerin_envoy.IsFemale, 'предводительница посольства', 'предводитель посольства' )], — меня зовут [cendrerin_envoy.GetFirstName], и я [Select_CString(cendrerin_envoy.IsFemale, 'принесла', 'принёс' )] вам предложение вождей племён Лизьер-Сандр».\n\n"
 dataw_events_gamord.0064.desc.a: "«Мы благодарны за то, что вы пощадили [Select_CString(exile_seeker.IsFemale, 'нашу новую соплеменницу', 'нашего нового соплеменника' )], [exile_seeker.GetFirstName]. Заключённая с вами сделка принесла обеим сторонам богатство и безопасность. Поэтому сегодня мы стоим перед вами».\n\n"
 dataw_events_gamord.0064.desc.b: "«Мы сожалеем, что вы не пощадили [Select_CString(exile_seeker.IsFemale, 'изгнанницу', 'изгнанника' )], но готовы забыть об этом: нынешнее соглашение важнее смерти одного из наших. Пепел научил нас, что не всякая месть стоит того, чтобы её свершать, — порой она приносит лишь всеобщую гибель».\n\n"
 dataw_events_gamord.0064.desc.ending: "«Мы пришли открыть вам истину Пепла, ибо привела нас в Лизьер-Сандр ясная цель. [Select_CString(ash_prophet.IsFemale, 'Одна из самых почитаемых среди нас', 'Один из самых почитаемых среди нас' )], [ash_prophet.GetFirstName], [Select_CString(ash_prophet.IsFemale, 'возвестила', 'возвестил' )], что настало время открыть истинную веру нашим восточным собратьям. Нам безразлично, во что верят ваши подданные: однажды они всё равно познают Пепел. Примите наши обычаи, о [ROOT.Char.GetFirstNameNoTooltip], ведь воля Пепла превыше всего — даже Андрасте, которой вы поклоняетесь. Узрите свет и присоединитесь к нам!»\n\nОт последних слов у меня по спине пробегает холодок.\n\n«Если вы отвергнете наше милостивое предложение, [Select_CString(ash_prophet.IsFemale, 'наша пророчица', 'наш пророк' )] захватит эту землю по воле Пепла»."
 dataw_events_gamord.0064.a: "Да, я присоединюсь к поклонению Пеплу."
 dataw_events_gamord.0064.a.tt_1: "Каждый [Concept('vassals','вассал')|E] веры [GetFaithByKey('orlesian_chantry').GetAdherentNamePlural], кроме представителей культуры [cendrerin_culture.GetName], теряет #N 100#! [Concept('opinions','мнения')|E] о #V вас#! #weak (+0,60 в год) (Ненависть)#!"
 dataw_events_gamord.0064.a.tt_2: "Каждое [Concept('county','графство')|E] веры [GetFaithByKey('orlesian_chantry').GetAdherentNamePlural] в вашей [Concept('realm','державе')|E] получает модификатор [GetModifier( 'betrayed_our_faith' ).GetNameWithTooltip] на #V 10 лет#!"
 dataw_events_gamord.0064.b: "Я присоединюсь к вам во всём, лишь бы избежать кровопролития."
 dataw_events_gamord.0064.b.tt_1: "Каждый [Concept('vassals','вассал')|E] веры [GetFaithByKey('orlesian_chantry').GetAdherentNamePlural], кроме представителей культуры [cendrerin_culture.GetName], теряет #N 200#! [Concept('opinions','мнения')|E] о #V вас#! #weak (+0,60 в год) (Ненависть)#!"
 dataw_events_gamord.0064.c: "Из пепла вы пришли — в пепел и вернётесь."
 dataw_events_gamord.0064.c.tt_1: "[ash_prophet.GetFirstName] поднимает народное восстание сандренского культа Пепла за королевство Гаморд."
 dataw_events_gamord.0064.c.tt_2: "#V #L Каждый#!#! [Concept('rulers','правитель')|E] веры [GetFaithByKey('orlesian_chantry').GetAdherentNamePlural] с чертой [GetTrait('zealous').GetName( GetNullCharacter )] получает #P 30#! к [Concept('opinion','мнению')|E] о #V вас#! на #V 10 лет#! #weak ([GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName] одобряет проявление религиозности)#!"

 dataw_events_gamord.0066.tit: "[Select_CString(ash_prophet.IsFemale, 'Не все следуют за пророчицей', 'Не все следуют за пророком' )]"
 dataw_events_gamord.0066.desc: "«[Select_CString(ROOT.Char.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.GetTitleTierName]! [Select_CString(andrastian_nomad.IsFemale, 'Незваная гостья', 'Незваный гость' )]!»\n\nОт крика [Select_CString(guard.IsFemale, 'моей воительницы', 'моего воина' )] [guard.GetFirstName] по спине пробегает дрожь. Война с силами [Select_CString(ash_prophet.IsFemale, 'Пепельной пророчицы', 'Пепельного пророка' )] [ash_prophet.GetFirstName] ещё продолжается, и нынешнее вторжение вполне может оказаться попыткой покушения на мою жизнь. Сердце едва не останавливается, когда передо мной появляется [Select_CString(andrastian_nomad.IsFemale, 'женщина', 'мужчина' )] в традиционной сандренской одежде.\n\nНо удивление сменяется недоумением, когда [andrastian_nomad.GetFirstName] преклоняет колено.\n\n«[ROOT.Char.GetTitleTierName] этих земель, приветствую вас и предлагаю нашу помощь! Меня зовут [andrastian_nomad.GetFirstName], я [Select_CString(andrastian_nomad.IsFemale, 'предводительница', 'предводитель' )] одного из многочисленных племён Моря Пепла — таких же, как те, что ныне сражаются против вас. На нашей родине две веры научились сосуществовать: среди Пепла выживание важнее убеждений».\n\nЗаметив мою тревогу, [andrastian_nomad.GetFirstName] продолжает:\n\n«Мы считаем, что [Select_CString(ash_prophet.IsFemale, 'Пепельная пророчица зашла', 'Пепельный пророк зашёл' )] слишком далеко. Племена, почитающие Создателя и его Невесту, готовы выступить вместе с вами, чтобы не допустить кровопролития, которым обернётся захват Гаморда».\n\nПока [andrastian_nomad.GetFirstName] [Select_CString(andrastian_nomad.IsFemale, 'ждала', 'ждал' )] моего ответа, следом [Select_CString(guard.IsFemale, 'появилась', 'появился' )] [guard.GetFirstNameNoTooltip] с обнажённым мечом, ожидая приказа."
 dataw_events_gamord.0066.a: "Я принимаю предложение. Вместе мы выстоим против неверных!"
 dataw_events_gamord.0066.a.tt: "Каждый [Concept('vassals','вассал')|E] веры [GetFaithByKey('orlesian_chantry').GetAdherentNamePlural] теряет #N 10#! [Concept('opinions','мнения')|E] о #V вас#! #weak (Сговор с врагом)#!"
 dataw_events_gamord.0066.b: "Мне не нужна твоя помощь, [Select_CString(andrastian_nomad.IsFemale, 'кочевница', 'кочевник' )]."
 dataw_events_gamord.0066.c: "[guard.GetFirstNameNoTooltip]! Казнить [Select_CString(andrastian_nomad.IsFemale, 'её', 'его' )]!"

 ### Clayne filler events
 dataw_events_ferelden.0020.tit: "Маленькая белая куропатка"
 dataw_events_ferelden.0020.desc: "Идя через внутренний двор, вы слышите позади странный глухой удар. Обернувшись, вы замечаете на земле круглую птицу — белую горную куропатку. Решив, что она мертва, вы подходите ближе, но птица внезапно открывает глаза и начинает беспомощно молотить воздух короткими лапками. Должно быть, во время полёта она врезалась в одну из окружавших двор построек. Куропатка не двигается ни при вашем приближении, ни когда вы осторожно берёте её в руки."
 dataw_events_ferelden.0020.a: "Она явно ранена. Лучше прекратить её мучения."
 dataw_events_ferelden.0020.b: "Эта птица — одно из творений богов. С ней следует обращаться почтительно!"
 dataw_events_ferelden.0021.desc: "Вы осторожно гладите птицу большим пальцем и тянетесь за кинжалом. Один быстрый удар прекращает страдания существа. Так было правильно."
 dataw_events_ferelden.0021.a: "Почему же тогда так грустно?"
 dataw_events_ferelden.0022.desc: "Прижимая круглую птицу к груди, вы относите её в свои покои. Когда вы просите о помощи, лекарь сначала встречает просьбу смехом, но, поняв, что вы говорите всерьёз, принимается за дело. Два следующих дня вы лечите куропатку травами, следите, чтобы она пила, ела и отдыхала, а в перерывах молитесь.\n\nУтром третьего дня птица внезапно оживает. Её взгляд встречается с вашим, а затем куропатка вылетает прямо в окно. Вы провожаете её глазами: она поднимается гораздо выше, чем вы могли представить, и исчезает вдали. Вы улыбаетесь, одновременно радуясь и печалясь её отлёту.\n\nС того дня вы всё чаще замечаете белых куропаток. Стоит вам оказаться в одиночестве под открытым небом, как одна из них непременно сидит где-нибудь впереди — на камне или под кустом. Всегда рядом."
 dataw_events_ferelden.0022.a: "Так и должно быть."
 dataw_events_ferelden.0030.t: "Ильва Небесная Песнь"
 dataw_events_ferelden.0030.desc: "Перед вами стоит женщина. Она представляется Ильвой Небесной Песнью и рассказывает, что странствует по свету как скальд. Услышав о ваших деяниях, Ильва пожелала сложить о них песню."
 dataw_events_ferelden.0030.a: "Принять её предложение."
 dataw_events_ferelden.0030.b: "Отказать ей."
 dataw_events_ferelden.0041.t: "Мельница"
 dataw_events_ferelden.0041.desc: "[minor_noble_1.GetName] и [minor_noble_2.GetName] приходят к вам с жалобами из-за мельницы. Они кричат и спорят, но постепенно суть дела проясняется. Мельницу построил прадед [minor_noble_1.GetName], однако недавнее изменение границы оставило её на земле [minor_noble_2.GetName]. Теперь каждая сторона считает мельницу своей. Они требуют разрешить спор, пока дело не дошло до кровопролития."
 dataw_events_ferelden.0041.a: "Эта мельница поколениями принадлежала семье [minor_noble_1.GetFirstName] и останется её собственностью."
 dataw_events_ferelden.0041.b: "Мельница стоит на земле [minor_noble_2.GetFirstName]. Закон ясен: [minor_noble_1.GetFirstName] придётся уступить."
 dataw_events_ferelden.0041.c: "Избежать кровопролития? Нет, этот спор решит только кровь!"
 dataw_events_ferelden.0041.tt: "[minor_noble_1.GetFirstName] и [minor_noble_2.GetFirstName] сразятся насмерть!"
 dataw_events_ferelden.0042.t: "Багровый танец"
 dataw_events_ferelden.0042.desc: "«Вы двое! Поднимите оружие!» — с блеском в глазах приказываете вы.\n\n«Сталь решит, кому владеть мельницей, а поражение будет оплачено кровью! Сегодня Хозяйка Небес станет вашей свидетельницей и дарует благосклонность тому, кто достоин править этой землёй!»\n\nЗал оглашают ликующие крики, а двое спорщиков с тревогой смотрят друг на друга. Но слово сюзерена прозвучало, и теперь им остаётся приготовиться к смерти.\n\nПод возбуждённый гул зала бойцы начинают медленно кружить, закованные в доспехи, со щитами и топорами в руках. «Начали!» — ваш возглас эхом разносится под сводами, и противники бросаются друг на друга.\n\nВскоре зал наполняют стук металла о дерево, крики и визг толпы, стоны и хрип бойцов. Всё заканчивается быстро: последний удар приносит победителю и мельницу, и торжество."
 dataw_events_ferelden.0042.a: "Так спор и разрешился."
 dataw_events_ferelden.0042.tt: "[sc_victor.GetName] убивает [sc_loser.GetName]!"
 dataw_events_ferelden.0050.t: "Брошенный мабари"
 dataw_events_ferelden.0050.desc: "Вы раздражённо стонете, когда повозка резко останавливается. Проклятые повозки. Вы предпочли бы ехать верхом, но стража настояла на своём. Услышав снаружи шум, вы бормочете что-то себе под нос, открываете дверцу и щуритесь от внезапного света. К вам подходит один из сопровождающих.\n\n«Там… мабари. Он перегородил дорогу».\n\nВы выходите из повозки и приближаетесь к псу. Стражник не ошибся: это мабари, судя по виду ещё молодой. Пёс громко лает и отказывается уходить с дороги, сколько бы стражники к нему ни приближались."
 dataw_events_ferelden.0050.a: "Приказать страже убить зверя."
 dataw_events_ferelden.0050.b: "Приказать страже прогнать его."
 dataw_events_ferelden.0050.c: "Подойти к испуганному животному."
 dataw_events_ferelden.0051.t_mabdead: "Где снятся сны собакам…"
 dataw_events_ferelden.0051.t_mableft: "На распутье"
 dataw_events_ferelden.0051.t_mabtame: "Лучший друг человека"
 dataw_events_ferelden.0051.t_mabfail: "Не судьба"
 dataw_events_ferelden.0051.desc_mabdead: "Самый крупный стражник быстро заканчивает дело. Зверь рычит и съёживается, но удар оказывается скорым и точным. Тело убирают с дороги, и вы продолжаете путь.\n\nГде-то за полями раздаётся резкий птичий крик, и в животе поселяется неприятное чувство."
 dataw_events_ferelden.0051.desc_mableft: "Стражники приближаются строем, кричат и бьют оружием по щитам. Поначалу пёс отказывается двигаться, но затем жалобно взвизгивает и убегает с дороги.\n\nТеперь можно продолжить путь, однако ваши взгляды с собакой встречаются. Неужели в её глазах… печаль?\n\nВы отгоняете эту мысль и возвращаетесь в повозку."
 dataw_events_ferelden.0051.desc_mabtame: "Вы подходите к животному. Оно рычит и без особого рвения бросается вперёд, а затем начинает скулить и съёживаться. Вы протягиваете руки. Немного помедлив, молодой пёс приближается, обнюхивает вас, садится и выжидающе смотрит вверх.\n\nВдалеке слышится птичья трель."
 dataw_events_ferelden.0051.desc_mabfail: "Вы приближаетесь к животному, но один неверный шаг — и на миг теряете равновесие, испугав пса. Огромная гончая рычит и бросается на вас. Вы успеваете повернуться боком, но мощные челюсти смыкаются на предплечье, и зубы глубоко впиваются в плоть. Вокруг раздаются крики, слышен звон обнажаемого оружия и удары металла по телу. Хватка слабеет, челюсти разжимаются, и тело мабари падает на землю."
 dataw_events_ferelden.0051.tt_mableft: "Пёс оставлен на волю судьбы."
 dataw_events_ferelden.0051.tt_mabdead: "Пёс погибает."
 dataw_events_ferelden.0051.a_mabdead: "Одной дворнягой меньше."
 dataw_events_ferelden.0051.a_mableft: "Интересно, пересекутся ли наши пути вновь…"
 dataw_events_ferelden.0051.a_mabtame: "За мной, мальчик!"
 dataw_events_ferelden.0051.a_mabfail: "Какая жалость."
 dataw_events_ferelden.0060.t: "Чешуя на чаше весов"
 dataw_events_ferelden.0060.desc: "Когда вы со спутниками пересекаете равнину, среди деревьев неподалёку от дороги появляется далёкая фигура. Один из стражников отправляется проверить и вскоре возвращается, таща за собой старика. Тот одет в лохмотья, лицо покрыто сажей, а от тела исходит зловоние. В руках он что-то сжимает. По вашему приказу стражник вырывает предмет.\n\nПоначалу он кажется простым камнем, но, повертев находку в руках, вы замечаете сходство с огромной и необычайно твёрдой чешуёй. Беззубое лицо старика расплывается в широкой улыбке, и он возбуждённо кивает.\n\n«Где ты это нашёл?»\n\nСтарик хихикает и указывает на лес за холмами. Он бормочет так быстро, что слова почти невозможно разобрать, но вы слышите: «дракон», «магия» и «сокровище»."
 dataw_events_ferelden.0060.tt: "Старик уходит"
 dataw_events_ferelden.0060.a: "Вернуть «камень». На подобную чепуху нет времени."
 dataw_events_ferelden.0060.b: "Забрать чешую и прогнать старика."
 dataw_events_ferelden.0060.c: "Обыскать лес в поисках этого мнимого сокровища."
 dataw_events_ferelden.0061.t_ign: "Продолжая путь"
 dataw_events_ferelden.0061.t_rob: "Новый владелец"
 dataw_events_ferelden.0061.desc_ign: "Вы со стражниками сталкиваете старика с дороги. Камень, который он сжимал в руках, падает ему на колени, и старик тут же хватает находку, прижимая к груди. Ваш отряд продолжает путь, и вскоре грязный старик вместе со своим камнем исчезает из мыслей."
 dataw_events_ferelden.0061.desc_rob: "Вы киваете стражнику, и тот оттаскивает старика с дороги.\n\nСтранный камень кажется почти тёплым в руке. Очевидно, это не просто кусок породы необычной формы. Вы прячете его и поворачиваетесь к спутникам.\n\nПозади слышится возня. Старик пытается что-то кричать, но слов не разобрать.\n\nВ последний раз взглянув назад, вы видите, как стражники удерживают его, пока он тянется к вам — к камню.\n\nВы уходите, оставляя старика страже. Камень надёжно спрятан в кармане."
 dataw_events_ferelden.0061.a_ign: "Какой странный человек."
 dataw_events_ferelden.0061.a_rob: "Простолюдины недостойны подобных вещей."
 dataw_events_ferelden.0062.t: "В поисках сокровища"
 dataw_events_ferelden.0062.desc: "Вы осматриваете холмы и замечаете среди деревьев тёмную тень. Неужели пещера? Неужели сокровище действительно существует? Вы собираете людей и направляетесь туда: время на небольшой крюк найдётся.\n\nПочти час спустя, всё это время сопровождаемые стариком, вы достигаете леса. Вскоре становится ясно, что тень, похожая издали на пещеру, на самом деле была огромным древесным стволом — больше любого дерева в округе. Кроны давно нет, толстая древесина расколота и обуглена, а сам ствол лежит на боку. Возможно, в него ударила молния? Земля вокруг тоже выжжена и покрыта сажей. Лишь кое-где сквозь чёрный слой проступают странные следы, словно по земле волокли нечто тяжёлое. В животе зарождается тревожное чувство.\n\nОдин внутренний голос велит исследовать ствол, другой заставляет остановиться.\n\nОбычный огонь не мог оставить такие следы…"
 dataw_events_ferelden.0062.a: "Повернуть назад. Лучше оставить это место в покое."
 dataw_events_ferelden.0062.b: "Подойти к обгоревшему дереву."
 dataw_events_ferelden.0063.t_nfnd: "Некоторые вещи…"
 dataw_events_ferelden.0063.t_fnd: "Некоторые вещи…"
 dataw_events_ferelden.0063.desc_fnd: "Вы медленно и осторожно приближаетесь к сгоревшему дереву. Лишь теперь становится ясно, что уже давно не слышно ни единой птицы. Как странно. Пробормотав молитву, вы протягиваете руку и касаетесь почерневшей древесины… Ничего. Она твёрдая и холодная — чего ещё можно было ожидать? Вы с облегчением вздыхаете и уже собираетесь с шуткой окликнуть воинов, когда замечаете блеск. В древесине что-то застряло. Предмет твёрдый и засел глубоко. Вы достаёте кинжал и начинаете вырезать находку. После нескольких попыток она оказывается у вас в руке: огромный зуб, слишком большой для любого виденного прежде зверя. Он гладкий, острый и словно пульсирует энергией. Только тогда вы замечаете под деревом яму, будто здесь было что-то закопано. Старика среди ваших людей больше нет. Вы тянетесь к карману и понимаете, что камень — нет, драконья чешуя — тоже исчез.\n\n«Честный обмен», — думаете вы. Кто бы ни похоронил здесь сокровище, его давно нет, но небольшое путешествие всё же оказалось не напрасным."
 dataw_events_ferelden.0063.desc_nfnd: "Вы поворачиваете назад. Старик не отводит глаз от дерева, и невозможно понять, то ли он не может сдвинуться с места, то ли не хочет. Вы прячете странный камень, оставляете дерево и старика позади и продолжаете путь."
 dataw_events_ferelden.0063.a_fnd: "…должны принадлежать достойным."
 dataw_events_ferelden.0063.a_nfnd: "…лучше оставить нетронутыми."
 dataw_events_ferelden.0064.artnam: "Странный камень"
 dataw_events_ferelden.0064.artdesc: "Странный камень — крепкий, твёрдый и тёплый на ощупь. Не знай вы истины, его легко было бы принять за чешую."
 dataw_events_ferelden.0064.artnam1: "Драконий зуб"
 dataw_events_ferelden.0064.artdesc1: "Зуб мифического зверя, давно исчезнувшего из этих земель."
 ### Avvar filler events
 dataw_events_frostback_mountains.0010.tit: "Контрабандисты лириума"
 dataw_events_frostback_mountains.0010.desc: "Стража приводит ко мне двух гномов с татуировками на лицах, задержанных за вторжение на земли моего вассала. Вместе с ними захвачена повозка, полная гномьего оружия и доспехов, но куда важнее — лириума.\n\n[Select_CString(GetPlayer.GetCouncillor( 'councillor_chancellor' ).IsFemale, 'Моя', 'Мой' )] [GetPlayer.GetCouncillorPosition( 'councillor_chancellor' ).GetPositionName] [GetPlayer.GetCouncillor( 'councillor_chancellor' ).GetFirstName] считает, что эта пара открывает дипломатические возможности: сопроводив их обратно, мы заслужим благосклонность подземных соседей. Но [Select_CString(GetPlayer.GetCouncillor( 'councillor_steward' ).IsFemale, 'моя', 'мой' )] [GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName] [GetPlayer.GetCouncillor( 'councillor_steward' ).GetFirstName] возражает и предлагает оставить добычу себе.\n\nОдин из пленников подаёт голос: «[Select_CString(ROOT.Char.IsFemale, 'Благородная', 'Благородный' )] [ROOT.Char.GetTitleTierName], дружба между нашими народами восходит к вождю Лутию Гномьему Сыну. Разве не будет лучше для всех, если вы присоединитесь к нашим торговым предприятиям?» Улыбки гномов кривы, и в них недостаёт нескольких зубов."
 dataw_events_frostback_mountains.0010.a: "Убить их в назидание остальным нарушителям."
 dataw_events_frostback_mountains.0010.b: "Бросить их в темницу, а незаконно добытый товар продать."
 dataw_events_frostback_mountains.0010.c: "[GetPlayer.GetCouncillor( 'councillor_chancellor' ).GetFirstNameNoTooltip] рассуждает верно. Вернуть их в Орзаммар."
 dataw_cultural_acceptance_dealing_with_carta: "Сделка с Хартией"
 dataw_events_frostback_mountains.0010.d: "А не хотите присоединиться ко мне?"
 dataw_events_frostback_mountains.0010.tt: "Вы решите, кто из них останется"
 dataw_events_frostback_mountains.0010.e: "Продолжай…"
 dataw_events_frostback_mountains.0011.tit: "Контрабандисты лириума"
 dataw_events_frostback_mountains.0011.desc: "Из двух пойманных контрабандистов мы можем оставить при дворе лишь одного.\n[carta_dwarf_2.GetFirstNameNoTooltip] — [Select_CString(carta_dwarf_2.IsFemale, 'опытная головорезка Хартии, отточившая', 'опытный головорез Хартии, отточивший' )] боевые навыки и силу не хуже любого авварского берсерка.\n[carta_dwarf_1.GetFirstNameNoTooltip] — [Select_CString(carta_dwarf_1.IsFemale, 'проницательная переговорщица, отправленная', 'проницательный переговорщик, отправленный' )] вместе с [carta_dwarf_2.GetFirstNameNoTooltip], чтобы Хартия непременно получила причитающуюся долю.\nКаждый пригодился бы при дворе, но Хартия потребует вернуть того, кого я не выберу."
 dataw_events_frostback_mountains.0011.a: "[carta_dwarf_2.GetFirstNameNoTooltip] присоединится к моей армии."
 dataw_events_frostback_mountains.0011.b: "[carta_dwarf_1.GetFirstNameNoTooltip] присоединится к моему двору."
 dataw_events_frostback_mountains.0020.tit: "Западные сувениры"
 dataw_events_frostback_mountains.0020.desc: "Готовясь покинуть земли империи, я не могу избавиться от мысли, что следует привезти домой какой-нибудь сувенир.\nОрлесианцам есть что предложить, но всё обходится недёшево. Несколько книг пригодятся моему скальду и тем, кто после него будет хранить историю. В горах трудно найти некоторые из здешних мехов и кож. Да и пища здесь куда вкуснее нашей.\nНо увезти домой весь Орлей невозможно — лишь малую его частицу."
 dataw_events_frostback_mountains.0020.a: "Купить книги для моего скальда."
 dataw_events_frostback_mountains.0020.a.tt: "#V Каждый#! персонаж с чертой #E [GetTrait('lifestyle_poet').GetName( GetNullCharacter )]#! получает #P 20#! к [Concept('opinion','мнению')|E] о #V вас#! #weak (-1,20 в год) (Дружелюбие)#!"
 dataw_events_frostback_mountains.0020.b: "Купить новый наряд."
 dataw_events_frostback_mountains.0020.c: "Привезти домой экзотические пряности."
 dataw_events_frostback_mountains.0020.c.tt: "Стоимость ваших #V пиров#! уменьшится на @gold_icon!#V 50#! [Concept('gold','золота')|E]\nна #V 5 лет#!"
 orlesian_gastronomie: "Орлесианская гастрономия"
 dataw_events_frostback_mountains.0020.d: "Почему нельзя забрать всё?"
 dataw_events_frostback_mountains.0020.e: "Неважно. Пора домой."
 dataw_events_frostback_mountains.0030.tit: "Сбежавший зверь оплота"
 dataw_events_frostback_mountains.0030.desc: "Странствуя по землям [location_holder.GetTitledFirstName], я встречаю великолепного зверя с нарисованным знаком дома [location_holder.GetHouse.GetNameNoTooltip].\n\nДолжно быть, это зверь их оплота!\n\nЗверь не обязан оставаться в своём оплоте, однако редко удаётся встретить его без присмотра. Несомненно, это знак, что судьбы наших оплотов связаны, хотя пока неясно каким образом…"
 dataw_events_frostback_mountains.0030.a: "Накормить зверя частью припасов."
 dataw_events_frostback_mountains.0030.b: "Поймать зверя."
 dataw_events_frostback_mountains.0040.tit: "Странствующий скальд"
 dataw_events_frostback_mountains.0040.desc: "Ко двору прибывает скальд, прежде гостивший у [neighboring_ruler.GetTitledFirstNameNoTooltip].\nНесколько дней он поёт и декламирует историю моей державы. Воин-поэт талантлив, и моим скальдам есть чему у него поучиться.\n\nНо одна странность не даёт мне покоя.\n\nСкальд рассказывает о моих предках так, словно те были верными вассалами предков [neighboring_ruler.GetFirstNameNoTooltip]. Некоторых воинов это возмущает, но, быть может, передо мной открывается новая возможность…"
 dataw_events_frostback_mountains.0040.a: "Казнить скальда за оскорбление моей власти."
 dataw_events_frostback_mountains.0040.a.tt: "#V Каждый#! персонаж с чертой #E [GetTrait('lifestyle_poet').GetName( GetNullCharacter )]#! теряет #N 20#! [Concept('opinion','мнения')|E] о #V вас#! #weak (+1,20 в год) (Жестокость)#!"
 dataw_events_frostback_mountains.0040.b: "Исправить скальда: это ваши предки правили землями [neighboring_ruler.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier],\nа не наоборот."
 dataw_events_frostback_mountains.0040.b.tt: "#V Каждый#! персонаж с чертой #E [GetTrait('lifestyle_poet').GetName( GetNullCharacter )]#! теряет #N 10#! [Concept('opinion','мнения')|E] о #V вас#! #weak (+1,20 в год) (Недовольство)#!"
 dataw_events_frostback_mountains.0040.c: "Бывали и худшие поводы для дружбы."
 dataw_events_frostback_mountains.0040.c.tt: "Вы заключили союз с [neighboring_ruler.GetName]"
 dataw_events_frostback_mountains.0050.tit: "Завязывая узел"
 dataw_events_frostback_mountains.0050.desc: "Пока моя семья и родные [spouse.GetFirstNameNoTooltip] поют гимн Хозяйке Небес, мне подают традиционную брачную верёвку.\n\nНи один авварский брак не длится вечно, а срок нового союза определит число узлов, которые мне удастся развязать.\nЕсли я хочу скорого расставания, можно действовать медленно; если долгого брака — торопиться. Но то же решение предстоит принять [spouse.GetFirstNameNoTooltip], и мне нужно предугадать ответ."
 dataw_events_frostback_mountains.0050.a: "Двигаться медленно и развязать лишь несколько узлов."
 dataw_events_frostback_mountains.0050.a.tt: "Будет создано #E значение#! от #V 1#! до #V 6#! #L включительно#!"
 dataw_events_frostback_mountains.0050.b: "Торопиться, стараясь развязать как можно больше узлов."
 dataw_events_frostback_mountains.0050.b.tt: "Будет создано #E значение#! от #V 7#! до #V 12#! #L включительно#!"
 dataw_events_frostback_mountains.0051.tit: "Завязывая узел"
 dataw_events_frostback_mountains.0051.desc: "Пока моя семья и родные [spouse.GetFirstNameNoTooltip] поют гимн Хозяйке Небес, мне подают традиционную брачную верёвку.\n\nНи один авварский брак не длится вечно, а срок нового союза определит число узлов, которые удастся развязать [spouse.GetFirstNameNoTooltip].\nЗавязать эти узлы предстоит мне. Если я хочу долгого брака, можно затянуть их слабо. Если же хочется поскорее расстаться, можно постараться затянуть их потуже. Но [spouse.GetFirstNameNoTooltip] тоже принимает решение, и мне нужно предугадать ответ."
 dataw_events_frostback_mountains.0051.a: "Затянуть лишь несколько узлов и не слишком туго."
 dataw_events_frostback_mountains.0051.b: "Торопиться, стараясь завязать как можно больше тугих узлов."
 dataw_events_frostback_mountains.0052.tit: "Завязывая узел заново"
 dataw_events_frostback_mountains.0052.desc: "Пока моя семья и родные [spouse.GetFirstNameNoTooltip] поют гимн Хозяйке Небес, мне подают традиционную брачную верёвку.\n\nНи один авварский брак не длится вечно, а срок нового союза определит число узлов, которые удастся развязать [spouse.GetFirstNameNoTooltip].\nЗавязать эти узлы предстоит мне. Если я хочу долгого брака, можно затянуть их слабо. Если же хочется поскорее расстаться, можно постараться затянуть их потуже. Но [spouse.GetFirstNameNoTooltip] тоже принимает решение, и мне нужно предугадать ответ."
 dataw_events_frostback_mountains.0052.a: "Я вновь посвящу себя [spouse.GetFirstNameNoTooltip]."
 dataw_events_frostback_mountains.0052.a.tt: "Если [Select_CString(spouse.IsFemale, 'супруга примет', 'супруг примет' )] такое же решение, вы вновь свяжете брачные узлы"
 dataw_events_frostback_mountains.0052.b: "Пришло время расстаться с [spouse.GetFirstNameNoTooltip]."

 dataw_filler_western_approach.0010.tit: "Великий шрам Тедаса"
 dataw_filler_western_approach.0010.desc: "Следующий посетитель, [adventurer.GetFullName], [Select_CString(adventurer.IsFemale, 'представляется искательницей приключений, часто спускающейся', 'представляется искателем приключений, часто спускающимся' )] на Глубинные тропы. Теперь [Select_CString(adventurer.IsFemale, 'она намерена исследовать', 'он намерен исследовать' )] опаснейшую из их глубин — Глубинную щель посреди Западного предела, древней родины вандаларийцев. Просьба проста: выделить средства на подготовку, а взамен мне достанется половина древних гномьих сокровищ.\n\n«[Select_CString(ROOT.Char.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.GetTitleTierName], неужели вы доверяете этой подозрительной личности? [Select_CString(adventurer.IsFemale, 'Она наверняка скроется', 'Он наверняка скроется' )] с вашим золотом, и больше [Select_CString(adventurer.IsFemale, 'её', 'его' )] никто не увидит!» — возражает [Select_CString(GetPlayer.GetCouncillor( 'councillor_marshal' ).IsFemale, 'моя', 'мой' )] [GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName] [GetPlayer.GetCouncillor( 'councillor_marshal' ).GetFirstName].\n\n«Не бойтесь! — отвечает [adventurer.GetFirstNameNoTooltip]. — Моя группа закалена в боях с порождениями тьмы. С нами даже несколько Серых Стражей! Обещаю, ваши вложения непременно принесут хотя бы один артефакт из этих глубин».\n\nЛичность и впрямь выглядит подозрительно, но лишь мне решать, принять ли рискованное предложение."
 dataw_filler_western_approach.0010.a: "Выдать золото и припасы. Надеюсь, ради твоего же здоровья, ты вернёшься."
 dataw_filler_western_approach.0010.tt.a.a: "Об экспедиции больше никто не услышит"
 dataw_filler_western_approach.0010.tt.a.b: "[adventurer.GetFirstNameNoTooltip] бесследно исчезает"
 dataw_filler_western_approach.0010.tt.a.c: "Экспедиция возвращается с добычей, которой не хватает даже для возмещения расходов"
 dataw_filler_western_approach.0010.tt.a.d: "Экспедиция возвращается с достаточным количеством добычи"
 dataw_filler_western_approach.0010.tt.a.e: "Экспедиция возвращается с несметными богатствами"
 dataw_filler_western_approach.0010.b: "[ward.GetFirstName], отправляйся с ними — наберёшься опыта."
 dataw_filler_western_approach.0010.tt.b.a: "[ward.GetFirstNameNoTooltip] бесследно исчезает"
 dataw_filler_western_approach.0010.tt.b.b: "Экспедиция берёт [ward.GetFirstNameNoTooltip] в заложники"
 dataw_filler_western_approach.0010.c: "[knight.GetFirstName], проследи, чтобы они не натворили глупостей."
 dataw_filler_western_approach.0010.tt.c.a: "[knight.GetFirstNameNoTooltip] бесследно исчезает"
 dataw_filler_western_approach.0010.tt.c.b: "Экспедиция берёт [knight.GetFirstNameNoTooltip] в заложники"
 dataw_filler_western_approach.0010.d: "Ты хочешь спуститься в Глубинную щель?! Ты [Select_CString(adventurer.IsFemale, 'сошла с ума', 'сошёл с ума' )]?"
 dataw_filler_western_approach.0010.tt.d.a: "[adventurer.GetFirstNameNoTooltip] переберётся ко двору владения [new_location.GetName]"
 dataw_filler_western_approach.0010.lost_crown_of_kal_repartha.tit: "С короной приходит земля"
 dataw_filler_western_approach.0010.lost_crown_of_kal_repartha.desc: "Теперь, когда Корона Кэл Репарта у вас, гномьи обычаи дают законное право объявить наземный тейг своим."
 dataw_filler_western_approach.0010.crown_of_a_forgotten_thaig.desc: "Теперь, когда Корона Забытого тейга у вас, гномьи обычаи дают законное право объявить наземный тейг своим."

 DATAW_events_brecilian_forest.0001.tit: "Переселение в земли «[title.GetBaseNameNoTier]»"
 DATAW_events_brecilian_forest.0001.desc: "После недавнего завоевания земель «[title.GetBaseName]» многие [Concept('elvhen','элвены')|E] начали переселяться в Бресилианский лес, видя в нём новый дом для нашего народа.\n\n#!Однако вместе с наплывом желающих здесь поселиться беженцев начались столкновения с местным населением — «[title.GetProvince.GetCulture.GetCollectiveNoun]». Они утверждают, что обосновались здесь намного раньше и что эльфы не вправе изгонять их из родных земель. Поскольку здесь нет местного правителя, способного защитить их права на землю, изгнание местного населения — «[title.GetProvince.GetCulture.GetCollectiveNounNoTooltip]» — руками эльфов наверняка продолжится беспрепятственно, вытесняя прежних жителей из региона в совершенно незнакомый им мир.\n\n#!Кроме того, многие обитатели леса с тревогой следят за положением в землях «[title.GetBaseNameNoTooltip]», ожидая, что при захвате нами другой области там произойдёт то же самое."
 DATAW_events_brecilian_forest.0001.opt.a: "Местным это не понравится."
 DATAW_events_brecilian_forest.0001.opt.a.tt: "Долийцы видят в Бресилианском лесу новую родину, которую могут назвать своим домом.\n\n#!Поэтому каждое завоёванное в этом регионе графство на 20 лет получит [Concept('modifier','модификатор')|E] «[GetModifier('brecilian_elvhen_culture_automatic_modifier').GetNameWithTooltip]».\n\n#!Если графство перейдёт под прямую власть человека, действие модификатора «[GetModifier('brecilian_elvhen_culture_automatic_modifier').GetNameWithTooltip]» прекратится, а местные жители позаботятся о том, чтобы подобное больше не повторилось."

