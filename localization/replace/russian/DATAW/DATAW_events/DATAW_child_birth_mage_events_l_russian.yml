# description 
 DATAW_child_birth_mage_events.0002.desc_circle: "3 years ago, I first discovered that [child.GetFirstName] is a [mage|E]. At the time, I chose to bide the time, allowing [child.GetHerHim] to grow like any other child.\n\nNow however, I am faced with the same dilemma, and the risks of the secret being exposed grows each year that passes, with more and more reports of strange occurrences taking place.\n\nAt some point, hiding my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]'s Magical powers will become impossible.. #bold is it time to make a decision about [child.GetFirstNamePossessive] future?#!"
 DATAW_child_birth_mage_events.0002.desc_unlanded_sages_or_unregulated_magic: "3 years ago, I first discovered that [child.GetFirstName] is a [mage|E]. At the time, I chose to bide the time, allowing [child.GetFirstName] to grow like any other child.\n\nNow however, I am faced with the same dilemma. Magic is a serious matter, and leaving it up to chance and hoping that no more Magical disturbances will occur as a result of proper training is dangerous.\n\n#bold Is it time to make the decision?#!\n\n"
 DATAW_child_birth_mage_events.0002.desc_unlanded_sages_or_unregulated_magic_rulermage: "I could train [child.GetFirstName] myself to ensure their understanding of Magic, or ask a [GetCourtPositionType('court_enchanter_court_position').GetName()] to do so."
 DATAW_child_birth_mage_events.0002.desc_unlanded_sages_or_unregulated_magic_spousemage: "I can ask [spouse.GetFirstName] to train [child.GetFirstName] in the ways of magic or ask a [GetCourtPositionType('court_enchanter_court_position').GetName()] to do so."
 DATAW_child_birth_mage_events.0002.desc_unlanded_sages_or_unregulated_magic_both: "Either myself or [spouse.GetFirstName] can educate [child.GetFirstName] in the ways of magic, or I can ask a [GetCourtPositionType('court_enchanter_court_position').GetName()] to do it."
 DATAW_child_birth_mage_events.0002.desc_unlanded_sages_or_unregulated_magic_neither: "I should assign [child.GetFirstName] to a [GetCourtPositionType('court_enchanter_court_position').GetName()] to train [child.GetHerHim] in the ways of Magic."
 DATAW_child_birth_mage_events.0002.desc_mage_rule: "3 years ago, [child.GetFirstName] has come into their Magical powers. I knew that at some point, I would need to see to [child.GetHerHis] Magical education, but at that point in time I believed that [child.GetSheHe] was too young for the responsibilities of being a [mage|E].\n\nNow however, with increasing chances of Magical loss of control and increasing reports of unnatural events, I am once again faced with the decision I had 3 years ago\n\n#italic What should I do regarding [child.GetFirstName]’s Magical powers?#!\n\n"
 DATAW_child_birth_mage_events.0002.desc_mage_rule_both_or_either: "It is my duty to nurture any Magical talents that my children develop, and I must decide what is the best way to do so."
 DATAW_child_birth_mage_events.0002.desc_mage_rule_neither: "We were blessed with a child that possesses magical powers, and this is [ROOT.Char.GetHouse.GetBaseName]'s option to mark its mark upon [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier]. I must seek a Mage to educate my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]."
 DATAW_child_birth_mage_events.0002.desc_tranquil_solution: "3 years ago, I first discovered that [child.GetFirstName] is a [mage|E]. At the time, I chose to bide the time, allowing [child.GetFirstName] to grow like any other child. Yet with each passing year, the chances of a Magical disaster grow.\n\nThe risks of [child.GetHerHim] turning into a potential gateway for demons also cannot be disregarded. Should I finally call for the enforcers to administer the Rite of Tranquility, or risk letting [child.GetFirstName] stay with [child.GetHerHis] family more?"
 DATAW_child_birth_mage_events.0002.desc_persecution: "3 years ago, I first discovered that [child.GetFirstName] is a [mage|E]. At the time, I chose to bide the time, allowing [child.GetFirstName] to grow like any other child. Yet with each passing year, the chances of a Magical disaster grow.\n\nThe risks of [child.GetHerHim] turning into a potential gateway for demons also cannot be disregarded. Is it time to alert the clergy about my child and have [child.GetHerHim] killed or imprisoned? I could try to give [child.GetFirstName] more time with [child.GetHerHis] family, or smuggle them out."
 DATAW_child_birth_mage_events.0002.desc_forced_conscription: "3 years ago, I first discovered that [child.GetFirstName] is a [mage|E]. At the time, I chose to bide the time, allowing [child.GetFirstName] to grow like any other child. Yet with each passing year, the chances of a Magical disaster grow.\n\nThe laws of the realm are clear: #bold [Concept('mage','Mages')|E] are not citizens, but tools to be exploited.#!"
 DATAW_child_birth_mage_events.0002.desc_forced_conscription_is_top_liege: "I will announce my child’s abilities and formally remove [child.GetHerHim] from inheritance."
 DATAW_child_birth_mage_events.0002.desc_forced_conscription_not_top_liege: "I can delay no more. I will notify my liege."
# Circle Options
 DATAW_child_birth_mage_events.0002.opt_a_circle: "It is time. I must send [child.GetFirstName] to the [circle|E]"
 DATAW_child_birth_mage_events.0002.opt_a_tranquil_solution: "I can delay no more. The enforcers must be called."
 DATAW_child_birth_mage_events.0002.opt_a_persecution: "I have no choice, keeping my family and realm safe is my top priority"
 DATAW_child_birth_mage_events.0002.opt_a_forced_conscription: "My child is a [mage|E]. [child.GetSheHe|U] must be conscripted."
 DATAW_child_birth_mage_events.0002.opt_b_circle: "[child.GetFirstName] needs more time with [child.GetHerHis] family! They’re still too young at 9"
 DATAW_child_birth_mage_events.0002.opt_b_forced_conscription: "I will take the risk and give [child.GetFirstName] more time with the family."
 DATAW_child_birth_mage_events.0002.opt_b_persecution: "I will take the risk and give [child.GetFirstName] more time before making a decision."
 DATAW_child_birth_mage_events.0002.opt_b_tranquil_solution: "I will take the risk and let [child.GetFirstName] stay some more before making a decision."
 DATAW_child_birth_mage_events.0002.opt_b_circle_tt: "You will revisit [child.GetFirstNamePossessive] Magical Abilities in a few years"
 DATAW_child_birth_mage_events.0002.opt_b_mage_accepted: "[child.GetFirstName] is too young, I shall review the situation in three years"
 DATAW_child_birth_mage_events.0002.opt_c_circle: "I don’t want to lose my child to the Templars and their mage prisons!"
 DATAW_child_birth_mage_events.0002.opt_c_persecution: "I don’t want my child imprisoned or dead- I must send [child.GetHerHim] away!"
 DATAW_child_birth_mage_events.0002.opt_c_forced_conscription: "I don’t want my child forced to serve- I must send [child.GetHerHim] away!"
 DATAW_child_birth_mage_events.0002.opt_c_tranquil_solution: "My child cannot become an emotionless [GetTrait('tranquil').GetName(ROOT.Char)]- I must send [child.GetHerHim] away."
 DATAW_child_birth_mage_events.0002.opt_d_persecution: "I can delay no more. The clergy must be alerted."
