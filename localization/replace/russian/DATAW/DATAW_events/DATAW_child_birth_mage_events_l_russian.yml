DATAW_child_birth_mage_events.0004.opt_rowdy_mage_rule: "Я выбегу на улицу и попробую поднять вон тот камень!"
DATAW_child_birth_mage_events.0004.opt_rowdy_unlanded_sages: "Это будет очень весело! Я попробую использовать свои силы прямо сейчас!"
