### Child POV, child has Magic (Age 12), discvered
DATAW_child_birth_mage_events.0004.t: "Magic Discovery"
DATAW_child_birth_mage_events.0004.desc_intro: "I am sitting in my room, glancing at the drawing book that I have been given to look at, when suddenly I hear a kindly voice. Thinking that it is one of the [ROOT.Char.Custom('GetCourtierPlural')], I glance towards the [ROOT.Char.Custom('GetDoor')] expecting to see someone, but I don’t. Finding it unusual, I look around the [ROOT.Char.Custom('GetRoom')] and I see my toys’ chest moving, but no one is touching it.\n\nI approach the chest when out of nowhere, I seem to be in a completely different place, a place in which the rules of the world don’t seem to apply.\n\n#bold Then it dawns on me... #EMP I am in the [fade|E]!#!#!\n\n"
DATAW_child_birth_mage_events.0004.desc_circle: "This means that I am a [mage|E]... I must hide my powers, as [ROOT.Char.GetFaith.HighGodName] doesn’t look kindly upon my kind."
DATAW_child_birth_mage_events.0004.desc_mage_rule: "By [ROOT.Char.GetFaith.HighGodName]! I am a [mage|E]! My destiny is assured!"
DATAW_child_birth_mage_events.0004.desc_tranquil_solution: "This means that I am a [mage|E].. I must hide my powers, as [ROOT.Char.GetFaith.HighGodName] doesn’t look kindly upon my kind."
DATAW_child_birth_mage_events.0004.desc_persecution: "This means that I am a [mage|E].. I must hide my powers, as [ROOT.Char.GetFaith.HighGodName] doesn’t look kindly upon my kind."
DATAW_child_birth_mage_events.0004.desc_forced_conscription: "This means that I am a [mage|E].. I must hide my powers, as [ROOT.Char.GetFaith.HighGodName] doesn’t look kindly upon my kind."
DATAW_child_birth_mage_events.0004.desc_unlanded_sages: "This means that I am a [mage|E].. While I’ve been blessed with powers that most others don’t possess, if my powers are discovered I will lose my right to rule over land and subjects."
DATAW_child_birth_mage_events.0004.desc_unregulated_magic: "This means I am a [mage|E]! Amazing! I have powers that others dream about!"
DATAW_child_birth_mage_events.0004.desc_outro: "\n\nI should be careful while in the [fade|E], [Concept('demon','Demons')|E] are known to try and possess untrained [Concept('mage','Mages')|E], but having those powers is incredible."

DATAW_child_birth_mage_events.0004.opt_rowdy_tranquil_solution: "I must try to use Magic #EMP now#! #italic #EMP now#!#! #italic #EMP #bold now!#!#!#!"
DATAW_child_birth_mage_events.0004.opt_rowdy_forced_conscription: "I must try to use Magic #EMP now#! #italic #EMP now#!#! #italic #EMP #bold now!#!#!#!"
DATAW_child_birth_mage_events.0004.opt_rowdy_persecution: "I must try to use Magic #EMP now#! #italic #EMP now#!#! #italic #EMP #bold now!#!#!#!"
DATAW_child_birth_mage_events.0004.opt_rowdy_circle: "I will try to cast a spell now! There are no Templars near to watch!"
DATAW_child_birth_mage_events.0004.opt_rowdy_mage_rule: "I will run outside and try to lift that rock!"
DATAW_child_birth_mage_events.0004.opt_rowdy_unlanded_sages: "This will be very fun! I will try to use my powers right now!"
DATAW_child_birth_mage_events.0004.opt_rowdy_unregulated_magic: "I will use my powers during play time! All the other kids will be impressed!"


DATAW_child_birth_mage_events.0004.opt_charming_tranquil_solution: "Maybe I could use my powers to make sure others don’t discover them!"
DATAW_child_birth_mage_events.0004.opt_charming_forced_conscription: "Maybe I could use my powers to make sure others don’t discover them!"
DATAW_child_birth_mage_events.0004.opt_charming_persecution: "Maybe I could use my powers to make sure others don’t discover them!"
DATAW_child_birth_mage_events.0004.opt_charming_circle: "Maybe there's a spell to hide me from the Templars and their Circles"
DATAW_child_birth_mage_events.0004.opt_charming_mage_rule: "I can practice being a ruler receiving an emissary!"
DATAW_child_birth_mage_events.0004.opt_charming_unlanded_sages: "If I play nice enough, maybe I can get to keep my lands!"
DATAW_child_birth_mage_events.0004.opt_charming_unregulated_magic: "I can't wait to show my friends my powers! They will love it!"


DATAW_child_birth_mage_events.0004.opt_curious_tranquil_solution: "I wonder how those powers work.. Perhaps I could try them discreetly?."
DATAW_child_birth_mage_events.0004.opt_curious_forced_conscription: "I wonder how those powers work.. Perhaps I could try them discreetly?."
DATAW_child_birth_mage_events.0004.opt_curious_persecution: "I wonder how those powers work.. Perhaps I could try them discreetly?"
DATAW_child_birth_mage_events.0004.opt_curious_circle: "Why do some people become Mages and others don't?"
DATAW_child_birth_mage_events.0004.opt_curious_mage_rule: "I wonder.. how do children that do not have those powers feel?"
DATAW_child_birth_mage_events.0004.opt_curious_unlanded_sages: "Mages cannot be ruler, I wonder why.."
DATAW_child_birth_mage_events.0004.opt_curious_unregulated_magic: "How would casting spells feel like? I wonder if I can try it out."

DATAW_child_birth_mage_events.0004.opt_pensive_tranquil_solution: "Maybe I can read a book about Magic, it will be suspicious but helpful."
DATAW_child_birth_mage_events.0004.opt_pensive_forced_conscription: "Maybe I can read a book about Magic, it will be suspicious but helpful."
DATAW_child_birth_mage_events.0004.opt_pensive_persecution: "Maybe I can read a book about Magic, it will be suspicious but helpful."
DATAW_child_birth_mage_events.0004.opt_pensive_circle: "Time to check out the library! Or I can admit my powers and go to the Circle"
DATAW_child_birth_mage_events.0004.opt_pensive_mage_rule: "I should get some books from the library about Magic!"
DATAW_child_birth_mage_events.0004.opt_pensive_unlanded_sages: "I wonder why you can't be both a Mage and a ruler, I should read a book about it"
DATAW_child_birth_mage_events.0004.opt_pensive_unregulated_magic: "Grabbing books from the library seems like a good idea."



DATAW_child_birth_mage_events.0004.opt_bossy_tranquil_solution: "Dangerous, but I can get others to do what I want with Magic!"
DATAW_child_birth_mage_events.0004.opt_bossy_forced_conscription: "Dangerous, but I can get others to do what I want with Magic!"
DATAW_child_birth_mage_events.0004.opt_bossy_persecution: "Dangerous, but I can get others to do what I want with Magic!"
DATAW_child_birth_mage_events.0004.opt_bossy_circle: "I can rule better with my Magic! Why can't people understand it!"
DATAW_child_birth_mage_events.0004.opt_bossy_mage_rule: "My future as a ruler is assured! How fun!"
DATAW_child_birth_mage_events.0004.opt_bossy_unlanded_sages: "It is unfair that I can't rule and be a Mage!"
DATAW_child_birth_mage_events.0004.opt_bossy_unregulated_magic: "I will rule the playground with my Magic!"


# coming of age
dataw_coming_of_age.1001.desc_child_unlanded_or_unregulated: "[educated_child.GetFirstName] has reached adulthood without receiving any Magical education. While [educated_child.GetSheHe] may seek education from established Circles, [educated_child.GetHerHis] formative years did not prepare [educated_child.GetHerHim] for a life as a [mage|E]."
dataw_coming_of_age.1001.desc_child_conscription_or_persecution_or_tranquil: "Against all odds, my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('educated_child'))] has made it to adulthood without [educated_child.GetHerHis] abilities being discovered. Born in a realm which persecutes people of [educated_child.GetHerHis] kind, [educated_child.GetFirstName] must now rely on a silver tongue, cunning and an abundance of common sense to keep [educated_child.GetHerHim] from being discovered, as the consequences will be immediate and dire. Perhaps [educated_child.GetFirstName] will leave [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] and head to a land which treats [educated_child.GetHerHis] kind with more compassion."
dataw_coming_of_age.1001.desc_child_circle: "The day has come. [educated_child.GetFirstName] has reached adulthood without any instruction in the ways of [dataw_magic|E]. Though the lack of attention to [educated_child.GetHerHis] Magical powers likely prevented the discovery of [educated_child.GetHerHis] powers, it also prevented [educated_child.GetFirstName] from properly learning how to use the powers that [educated_child.GetSheHe] has. My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('educated_child'))] are now a fully fledged adult, and it is up to [educated_child.GetHerHim] to figure out how to use [educated_child.GetHerHis] powers wisely to prevent detection by the Templars."
dataw_coming_of_age.1001.desc_child_mage_rule: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('educated_child'))] has reached adulthood without any preparation for [educated_child.GetHerHis] life as a [mage|E]. I must now hope that [educated_child.GetHerHis] natural magical affinity will be enough, as well as the experience of growing up in my [ROOT.Char.Custom('GetRoom')]."
# faith conversion
dataw_faith_conversion.1001.desc_persecution: "Adopting [new_faith.GetName] means also getting accustomed to new rites and practices. Among the rites of [new_faith.GetNameNoTooltip], there is also a different view about [dataw_magic|E] and how it should be used, and the treatment of Mages - for one, Mages must be either killed or imprisoned far from society, they’re too dangerous to be allowed to walk around freely."
dataw_faith_conversion.1001.desc_tranquil: "Adopting [new_faith.GetName] means also getting accustomed to new rites and practices. Among the rites of [new_faith.GetNameNoTooltip], there is also a different view about [dataw_magic|E] and how it should be used, and the treatment of Mages. Mages are dangerous, and no amount of precaution can prevent a disaster. Every single Mage must be forced to undergo the [rite_of_tranquility|E] permanently ensuring the safety of everyone."
dataw_faith_conversion.1001.desc_circle: "Adopting [new_faith.GetName] means also getting accustomed to new rites and practices. Among the rites of [new_faith.GetNameNoTooltip], there is also a different view about [dataw_magic|E] and how it should be used, and the treatment of Mages - for one, Mages must be isolated from society and safely ensconced in circles watched over by vigilant Templars. Should any of my family display signs of Magical powers, I will be compelled to send them to the [circle|E] or try to hide it, which would be a risky endeavour."
dataw_faith_conversion.1001.desc_circle_had_unregulated_magic_or_mage_rule: "Adopting [new_faith.GetName] means also getting accustomed to new rites and practices. Among the rites of [new_faith.GetNameNoTooltip], there is also a different view about [dataw_magic|E] and how it should be used, and the treatment of Mages - for one, Mages must be isolated from society and safely ensconced in circles watched over by vigilant Templars. Should any of my family display signs of Magical powers, I will be compelled to send them to the [circle|E] or try to hide it, which would be a risky endeavour. And of course, Mages may not rule at all."
dataw_faith_conversion.1001.desc_unlanded: "Adopting [new_faith.GetName] means also getting accustomed to new rites and practices. Among the rites of [new_faith.GetNameNoTooltip], there is also a different view about Magic and how it should be used, and the treatment of Mages."
dataw_faith_conversion.1001.desc_unlanded_sages_had_persecution_or_conscription_or_tranquil: "Adopting [new_faith.GetName] means also getting accustomed to new rites and practices. Among the rites of [new_faith.GetNameNoTooltip]. Mages are no longer treated like cattle or dangerous tools who must be controlled- they’re free to go on about their lives."
dataw_faith_conversion.1001.desc_unlanded_sages_had_circle: "Adopting [new_faith.GetName] means also getting accustomed to new rites and practices. Among the rites of [new_faith.GetNameNoTooltip], there is also a different view about [dataw_magic|E] and how it should be used, and the treatment of Mages. No longer will Mages be imprisoned in circles, jailed by hostile Templars and living under the threat of the Rite of Tranquility. Now, Mages may freely study Magic free of persecution."
dataw_faith_conversion.1001.desc_unlanded_sages_had_unregulated_magic_or_mage_rule: "Adopting [new_faith.GetName] means also getting accustomed to new rites and practices. Among the rites of [new_faith.GetNameNoTooltip], there is also a different view about [dataw_magic|E] and how it should be used, and the treatment of Mages. Although Mages aren’t outright imprisoned and shunned from society, they may not rule at all."
dataw_faith_conversion.1001.desc_unregulated: "Adopting [new_faith.GetName] means also getting accustomed to new rites and practices. Among the rites of [new_faith.GetNameNoTooltip], there is also a different view about [dataw_magic|E] and how it should be used, and the treatment of Mages. Under [new_faith.GetNameNoTooltip], Mages are considered capable of ruling, similar to their mundane fellow citizens."
dataw_faith_conversion.1001.desc_unregulated_had_mage_rule: "Adopting [new_faith.GetName] means also getting accustomed to new rites and practices. Among the rites of [new_faith.GetNameNoTooltip], there is also a different view about [dataw_magic|E] and how it should be used, and the treatment of Mages. Under [new_faith.GetNameNoTooltip], Mages are considered capable of ruling, similar to their mundane fellow citizens. While Mages are not the only ones who can rule, at least they’re allowed to unlike other unenlighted faiths."
dataw_faith_conversion.1001.desc_mage_rule: "Adopting [new_faith.GetName] means also getting accustomed to new rites and practices. Among the rites of [new_faith.GetNameNoTooltip], there is also a different view about [dataw_magic|E] and how it should be used, and the treatment of Mages. Under [new_faith.GetNameNoTooltip], Mages are considered capable of ruling, so if any of my family fail to develop Magical powers, they’ll be treated as a lower class, fit only to serve like the ungifted commoners."
dataw_faith_conversion.1001.desc_conscription: "Adopting [new_faith.GetName] means also getting accustomed to new rites and practices. Among the rites of [new_faith.GetNameNoTooltip], there is also a different view about [dataw_magic|E] and how it should be used, and the treatment of Mages. Under [new_faith.GetNameNoTooltip], Mages are to be treated like cattle, fit only to serve and never rule, their powers used only for the good of the realm."