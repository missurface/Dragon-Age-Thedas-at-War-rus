 DATAW_child_birth_mage_events.0003.t_unlanded_sages_or_unregulated_magic: "The Education of [child.GetFirstName]"

# description 
 DATAW_child_birth_mage_events.0003.desc_circle: "6 years ago, I first discovered that my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] is a Mage. I chose time and again to delay my decision regarding [child.GetHerHis] future in regards to [child.GetHerHis] Magical education, but I can delay no longer.\n\nI still have the option of sending [child.GetFirstName] to the [circle|E] as a proper [ROOT.Char.GetFaith.GetName] [ROOT.Char.GetFaith.DevoteeNeuter] should to receive Magical education in a safe environment.\n\nI can choose to ignore it and hope that [child.GetFirstName] will learn Magic by [child.GetHerHis] own or I can further break [ROOT.Char.GetFaith.GetName] laws and seek an Apostate Mage to educate my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]."
 DATAW_child_birth_mage_events.0003.desc_circle_ruler_mage: "The option of educating my child on my own stands, though the Chantry is always looking for signs of Apostates."
 DATAW_child_birth_mage_events.0003.desc_unlanded_sages_or_unregulated_magic: "Over 6 years ago, [child.GetFirstName] first began to display Magical powers.\n\nI chose to wait and let [child.GetHerHim] grow without the burden of studying Magic, but now I must make a final decision regarding [child.GetFirstNamePossessive] Magical education.\n\n"
 DATAW_child_birth_mage_events.0003.desc_unlanded_sages_or_unregulated_magic_rulermage: "My child can be educated by me if I wish to be more involved with [child.GetHerHis] future, or I can make [child.GetHerHim] a ward of a [GetCourtPositionType('court_enchanter_court_position').GetName()]."
 DATAW_child_birth_mage_events.0003.desc_unlanded_sages_or_unregulated_magic_spousemage: "My [spouse.GetWifeHusband] could educate our child, or I could instruct a [GetCourtPositionType('court_enchanter_court_position').GetName()] to educate [child.GetHerHim]."
 DATAW_child_birth_mage_events.0003.desc_unlanded_sages_or_unregulated_magic_both: "Either myself or [spouse.GetFirstName] can educate [child.GetFirstName] in the ways of magic, or I can ask a [GetCourtPositionType('court_enchanter_court_position').GetName()] to do it."
 DATAW_child_birth_mage_events.0003.desc_unlanded_sages_or_unregulated_magic_neither: "I could assign [child.GetFirstName] to a [GetCourtPositionType('court_enchanter_court_position').GetName()] to educate [child.GetHerHim] in the ways of Magic."
 DATAW_child_birth_mage_events.0003.desc_mage_rule: "6 years ago, [child.GetFirstName] was shown to possess Magical powers. I delayed and delayed [child.GetHerHis] training, but now I must make a decision.\n\n[child.GetFirstName] will soon join the privileged ranks of [Concept('mage','Mages')|E], and [child.GetSheHe] must be prepared to take on the challenges of properly using their powers.\n\n#bold #italic What path will [child.GetFirstName] walk?#!#!"

 DATAW_child_birth_mage_events.0003.desc_tranquil_solution: "6 years ago, I first discovered that my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] is a Mage. I chose time and again to delay my decision regarding [child.GetHerHis] future, but I can delay no longer.\n\nMy time is running out to make a decision- I can notify the enforcers to administer the Rite of Tranquiity, I can attempt to hide [child.GetHerHis] accursed capabilities and hope that [child.GetFirstName] will have the sense not to use it or be tempted by Demons. Or I can further break the laws of [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] and attempt to smuggle my child out.\n\n"
 DATAW_child_birth_mage_events.0003.desc_tranquil_solution_ruler_mage: "The option of educating my child on my own stands, it is a risky business."
 DATAW_child_birth_mage_events.0003.desc_persecution: "6 years ago, I first discovered that my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] is a Mage. I chose time and again to delay my decision regarding [child.GetHerHis] future, but I can delay no longer.\n\nI still have the option of telling the clergy about [child.GetFirstName], to be killed or imprisoned as a [ROOT.Char.GetFaith.DevoteeNeuter] should, I can choose to ignore [child.GetHerHis] accursed Magic and hope that [child.GetFirstName] will not be risk for our family. Or I can further break the laws of [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] and attempt to smuggle my child out.\n\n"
 DATAW_child_birth_mage_events.0003.desc_persecution_ruler_mage: "The option of educating my child on my own stands, it is a risky business."
 DATAW_child_birth_mage_events.0003.desc_forced_conscription: "6 years ago, I first discovered that my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] is a Mage. I chose time and again to delay my decision regarding [child.GetHerHis] future, but I can delay no longer.\n\n"
 mothered: "mothered"
