### Parent POV, child has Magic (Age 12)
# title 
 DATAW_child_birth_mage_events.0003.t_circle: "A Hidden Apostate"
 DATAW_child_birth_mage_events.0003.t_mage_rule: "The Training of [child.GetFirstName]"
