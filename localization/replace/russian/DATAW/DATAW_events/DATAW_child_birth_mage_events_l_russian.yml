l_russian:

### Parent POV, child has Magic (Age 6)

# title 
 DATAW_child_birth_mage_events.0001.t_circle: "Таинственные события: [GetPlayer.GetCapitalLocation.GetTitle.GetNameNoTier]"
 DATAW_child_birth_mage_events.0001.t_unlanded_sages: "Беспорядки: [GetPlayer.GetCapitalLocation.GetTitle.GetNameNoTier]"
 DATAW_child_birth_mage_events.0001.t_mage_rule: "Необычные происшествия: [GetPlayer.GetCapitalLocation.GetTitle.GetNameNoTier]"
 DATAW_child_birth_mage_events.0001.t_tranquil_solution: "Беспорядки: [GetPlayer.GetCapitalLocation.GetTitle.GetNameNoTier]"
 DATAW_child_birth_mage_events.0001.t_persecution: "Необъяснимые происшествия: [GetPlayer.GetCapitalLocation.GetTitle.GetNameNoTier]"
 DATAW_child_birth_mage_events.0001.t_forced_conscription: "Необъяснимые беспорядки: [GetPlayer.GetCapitalLocation.GetTitle.GetNameNoTier]"
 DATAW_child_birth_mage_events.0001.t_unregulated_magic: "Переполох: [GetPlayer.GetCapitalLocation.GetTitle.GetNameNoTier]"

# description 
 DATAW_child_birth_mage_events.0001.desc_intro: "В последнее время во владении [GetPlayer.GetCapitalLocation.GetTitle.GetNameNoTier] происходят странные события: свечи внезапно загораются зелёным пламенем, вода замерзает, несмотря на тепло в комнате, а предметы двигаются сами собой.\n\n"
 DATAW_child_birth_mage_events.0001.desc_circle: "Я [Select_CString(ROOT.Char.IsFemale, 'попросила', 'попросил' )] придворных и слуг сообщать о любых подозрительных происшествиях. И вот, зайдя в комнату, я вижу, как [child.GetFirstName] творит нечто, похожее на [Concept('dataw_magic','магию')|E], вызывая из пустоты языки пламени.\n\n[ROOT.Char.GetFaith.HighGodName]! Выходит, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] — [Concept('mage','маг')|E]!\n\nТеперь мне придётся отправить [child.GetFirstName] в [circle|E] магов, где [child.GetSheHe] сможет научиться безопасно владеть магией."
 DATAW_child_birth_mage_events.0001.desc_unlanded_sages: "Я [Select_CString(ROOT.Char.IsFemale, 'попросила', 'попросил' )] придворных и слуг сохранять бдительность. И вот, зайдя в комнату, я вижу, как [child.GetFirstName] творит нечто, похожее на [Concept('dataw_magic','магию')|E], вызывая из пустоты языки пламени.\n\n[ROOT.Char.GetFaith.HighGodName]! Выходит, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] — [Concept('mage','маг')|E]!\n\nМне следует решить, что делать с этим открытием."
 DATAW_child_birth_mage_events.0001.desc_mage_rule: "Я [Select_CString(ROOT.Char.IsFemale, 'попросила', 'попросил' )] придворных и слуг сообщать мне о подозрительных происшествиях. И вот, зайдя в комнату, я вижу, как [child.GetFirstName] творит нечто, похожее на [Concept('dataw_magic','магию')|E], заставляя предметы парить в воздухе!\n\nБлагословен [ROOT.Char.GetFaith.HighGodName]! Выходит, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] — [Concept('mage','маг')|E]!\n\n"
 DATAW_child_birth_mage_events.0001.desc_mage_rule_rulermage: "Моё наследие продолжается, и мне решать, как развить дар [child.GetFirstName]. Можно отдать [child.GetFirstName] на воспитание персонажу «[GetCourtPositionType('court_enchanter_court_position').GetName()]» или заняться обучением самостоятельно."
 DATAW_child_birth_mage_events.0001.desc_mage_rule_spousemage: "Наследие [spouse.GetFirstName] продолжается, а моё только начинается, и мне решать, как развить дар [child.GetFirstName]. Можно решить, что [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] будет учиться у [spouse.GetFirstName], или отдать [child.GetFirstName] на воспитание персонажу «[GetCourtPositionType('court_enchanter_court_position').GetName()]»."
 DATAW_child_birth_mage_events.0001.desc_mage_rule_both: "Наше наследие продолжается, и мне решать, как развить дар [child.GetFirstName]. Что до обучения, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] может учиться у меня или у [Select_CString(spouse.IsFemale, 'супруги', 'супруга' )], а наставником для [child.GetFirstName] также может стать персонаж «[GetCourtPositionType('court_enchanter_court_position').GetName()]»."
 DATAW_child_birth_mage_events.0001.desc_tranquil_solution: "Я [Select_CString(ROOT.Char.IsFemale, 'попросила', 'попросил' )] придворных и слуг сообщать о любых подозрительных происшествиях. И вот, зайдя в комнату, я вижу, как [child.GetFirstName] творит нечто, похожее на [Concept('dataw_magic','магию')|E], вызывая из пустоты языки пламени. [ROOT.Char.GetFaith.HighGodName]! Выходит, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] — [Concept('mage','маг')|E]. Нужно призвать служителей закона, чтобы они провели [rite_of_tranquility|E] и не позволили персонажу [child.GetFirstName] превратиться в угрозу."
 DATAW_child_birth_mage_events.0001.desc_persecution: "Я [Select_CString(ROOT.Char.IsFemale, 'попросила', 'попросил' )] придворных и слуг сообщать о любых подозрительных происшествиях. И вот, зайдя в комнату, я вижу, как [child.GetFirstName] творит нечто, похожее на [Concept('dataw_magic','магию')|E], вызывая из пустоты языки пламени. [ROOT.Char.GetFaith.HighGodName]! Выходит, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] — [Concept('mage','маг')|E]. Нужно предупредить духовенство: [Concept('mage','маги')|E] опасны, поэтому их следует заключать в тюрьму или убивать."
 DATAW_child_birth_mage_events.0001.desc_forced_conscription: "Я [Select_CString(ROOT.Char.IsFemale, 'попросила', 'попросил' )] придворных и слуг сообщать о любых подозрительных происшествиях. И вот, зайдя в комнату, я вижу, как [child.GetFirstName] творит нечто, похожее на [Concept('dataw_magic','магию')|E], вызывая из пустоты языки пламени. [ROOT.Char.GetFaith.HighGodName]! Выходит, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] — [Concept('mage','маг')|E]!\n\n"
 DATAW_child_birth_mage_events.0001.desc_forced_conscription_is_top_liege: "Мне придётся соблюдать правила, соблюдения которых я требую от остальных: мой ребёнок не сможет наследовать титулы, и с ним будут обращаться как со слугой."
 DATAW_child_birth_mage_events.0001.desc_forced_conscription_not_top_liege: "Мне следует сообщить об этом сюзерену: хотя [Concept('mage','маги')|E] опасны, они полезны и способны выполнять самые разные задачи."
 DATAW_child_birth_mage_events.0001.desc_unregulated_magic: "Я [Select_CString(ROOT.Char.IsFemale, 'попросила', 'попросил' )] придворных и слуг сообщать о любых подозрительных происшествиях. И вот, зайдя в комнату, я вижу, как [child.GetFirstName] творит нечто, похожее на [Concept('dataw_magic','магию')|E], вызывая из пустоты языки пламени.\n\nБлагословен [ROOT.Char.GetFaith.HighGodName]! Выходит, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] — [Concept('mage','маг')|E]! Теперь мне нужно решить судьбу ребёнка — "
 DATAW_child_birth_mage_events.0001.desc_unregulated_magic_rulermage: "Я могу самостоятельно обучить [child.GetFirstName] магии или попросить об этом персонажа «[GetCourtPositionType('court_enchanter_court_position').GetName()]»."
 DATAW_child_birth_mage_events.0001.desc_unregulated_magic_spousemage: "Я могу попросить [spouse.GetFirstName] обучить [child.GetFirstName] магии или поручить это персонажу «[GetCourtPositionType('court_enchanter_court_position').GetName()]»."
 DATAW_child_birth_mage_events.0001.desc_unregulated_magic_both: "Обучить [child.GetFirstName] магии могу я или [spouse.GetFirstName]; также можно попросить об этом персонажа «[GetCourtPositionType('court_enchanter_court_position').GetName()]»."
 DATAW_child_birth_mage_events.0001.desc_unregulated_magic_neither: "Мне следует отдать [child.GetFirstName] на обучение персонажу «[GetCourtPositionType('court_enchanter_court_position').GetName()]», чтобы тот научил [child.GetHerHim] владеть магией."


# Circle Options
 DATAW_child_birth_mage_events.0001.opt_a_circle: "Нужно призвать храмовников, чтобы они благополучно сопроводили [child.GetFirstName] в Круг."
 DATAW_child_birth_mage_events.0001.opt_a_tranquil_solution: "Нужно послать за служителями закона. Ради всеобщей безопасности Ритуал должен состояться."
 DATAW_child_birth_mage_events.0001.opt_a_persecution: "Другого выбора нет: безопасность семьи и державы превыше всего"
 DATAW_child_birth_mage_events.0001.opt_a_forced_conscription: "Мой ребёнок — [Concept('mage','маг')|E]. [child.GetSheHe|U] подлежит принудительной службе."
 DATAW_child_birth_mage_events.0001.opt_b_circle: "[child.GetFirstName] ещё слишком [Select_CString(child.IsFemale, 'юна', 'юн' )], чтобы отправляться в Круг в одиночку. Подождём несколько лет"
 DATAW_child_birth_mage_events.0001.opt_b_tranquil_solution: "[child.GetFirstName] ещё слишком [Select_CString(child.IsFemale, 'юна', 'юн' )] для Ритуала!"
 DATAW_child_birth_mage_events.0001.opt_b_circle_tt: "Через несколько лет вы вновь рассмотрите магические способности персонажа [child.GetFirstName]."
 DATAW_child_birth_mage_events.0001.opt_b_mage_accepted: "[child.GetFirstName] ещё слишком [Select_CString(child.IsFemale, 'юна', 'юн' )]: пусть [child.GetSheHe] сохранит детскую невинность"
 DATAW_child_birth_mage_events.0001.opt_c_circle: "Я не отдам ребёнка храмовникам и их тюрьмам для магов!"
 DATAW_child_birth_mage_events.0001.opt_c_tranquil_solution: "Я не отдам своего ребёнка Ритуалу!"
 DATAW_child_birth_mage_events.0001.opt_c_persecution_not_callous: "[child.GetFirstName] ещё слишком [Select_CString(child.IsFemale, 'юна', 'юн' )] для тюрьмы или смерти!"
 DATAW_child_birth_mage_events.0001.opt_c_persecution: "Я не хочу потерять своего ребёнка!"
 DATAW_child_birth_mage_events.0001.opt_d_circle_sadistic: "[Concept('mage','Маг')|E]? Нужно покончить с этим, пока дитя не начало призывать демонов!"
 DATAW_child_birth_mage_events.0001.opt_e_circle: "Я могу обучать [child.GetFirstName] самостоятельно, хотя так мы рискуем быть раскрытыми Церковью."

# Positive View on Magic (non Circle, mage persecution)
 DATAW_child_birth_mage_events.0001.opt_e_mage_ruler: "Пора мне обучить [child.GetFirstName] магии, чтобы обеспечить безопасность ребёнка"
 DATAW_child_birth_mage_events.0001.opt_e_mage_ruler_spouse: "[spouse.GetFirstName] обучит [child.GetFirstName] магии, чтобы обеспечить безопасность ребёнка"
 EVENT_WINDOW_OPTION_COURT_ENCHANTER: "Этот вариант доступен благодаря [Concept('aptitude','пригодности')|E] персонажа «[GetCourtPositionType('court_enchanter_court_position').GetName()]»"
 DATAW_child_birth_mage_events.0001.opt_f_has_court_enchanter: "Я попрошу [court_enchanter.GetFirstName] обучать [child.GetFirstName]."
 DATAW_child_birth_mage_events.0001.opt_f_no_court_enchanter: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] нуждается в наставнике! Я найду персонажа «[GetCourtPositionType('court_enchanter_court_position').GetName()]»"
 DATAW_child_birth_mage_events.0001.opt_g_ignore_melancholy: "Ну и что? Пусть ребёнок учится самостоятельно."

# Negative View on Magic (non Circle, mage persecution)
#  DATAW_child_birth_mage_events.0001.opt_h_persecution: "I have no choice, keeping my family and realm safe is my top priority"
#  DATAW_child_birth_mage_events.0001.opt_i_persecution_not_callous: "[child.GetFirstName] is too young to be imprisoned or be killed!"
#  DATAW_child_birth_mage_events.0001.opt_i_persecution: "I don’t want to lose my child!"
### Parent POV, child has Magic (Age 9)
# title 
 DATAW_child_birth_mage_events.0002.t_circle: "Ребёнок-отступник"
 DATAW_child_birth_mage_events.0002.t_unlanded_sages_or_unregulated_magic: "Маг в ожидании"
 DATAW_child_birth_mage_events.0002.t_mage_rule: "Будущий маг"
 DATAW_child_birth_mage_events.0002.t_tranquil_solution: "Будущая угроза"
 DATAW_child_birth_mage_events.0002.t_persecution: "Растущая угроза"
 DATAW_child_birth_mage_events.0002.t_forced_conscription: "Опасное орудие"

# description 
 DATAW_child_birth_mage_events.0002.desc_circle: "Три года назад я впервые [Select_CString(ROOT.Char.IsFemale, 'узнала', 'узнал' )], что [child.GetFirstName] — [Concept('mage','маг')|E]. Тогда было решено выждать и позволить ребёнку расти наравне со сверстниками.\n\nНо теперь передо мной вновь стоит та же дилемма. С каждым годом вероятность раскрытия тайны растёт, а сообщений о странных происшествиях становится всё больше.\n\nРано или поздно скрывать тот факт, что [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] обладает магическими силами, станет невозможно. #bold Пора ли решить судьбу персонажа [child.GetFirstName]?#!"
 DATAW_child_birth_mage_events.0002.desc_unlanded_sages_or_unregulated_magic: "Три года назад я впервые [Select_CString(ROOT.Char.IsFemale, 'узнала', 'узнал' )], что [child.GetFirstName] — [Concept('mage','маг')|E]. Тогда было решено выждать и позволить [child.GetFirstName] расти наравне со сверстниками.\n\nНо теперь передо мной вновь стоит та же дилемма. Магия — дело серьёзное, и опасно пускать всё на самотёк, надеясь, что без надлежащего обучения новых магических происшествий не случится.\n\n#bold Пора ли принять решение?#!\n\n"
 DATAW_child_birth_mage_events.0002.desc_unlanded_sages_or_unregulated_magic_rulermage: "Я могу самостоятельно обучить [child.GetFirstName], чтобы ребёнок постиг магию, или попросить об этом персонажа «[GetCourtPositionType('court_enchanter_court_position').GetName()]»."
 DATAW_child_birth_mage_events.0002.desc_unlanded_sages_or_unregulated_magic_spousemage: "Я могу попросить [spouse.GetFirstName] обучить [child.GetFirstName] магии или поручить это персонажу «[GetCourtPositionType('court_enchanter_court_position').GetName()]»."
 DATAW_child_birth_mage_events.0002.desc_unlanded_sages_or_unregulated_magic_both: "Обучить [child.GetFirstName] магии могу я или [spouse.GetFirstName]; также можно попросить об этом персонажа «[GetCourtPositionType('court_enchanter_court_position').GetName()]»."
 DATAW_child_birth_mage_events.0002.desc_unlanded_sages_or_unregulated_magic_neither: "Мне следует отдать [child.GetFirstName] на обучение персонажу «[GetCourtPositionType('court_enchanter_court_position').GetName()]», чтобы тот научил [child.GetHerHim] владеть магией."
 DATAW_child_birth_mage_events.0002.desc_mage_rule: "Три года назад у [child.GetFirstName] проявились магические способности. Я [Select_CString(ROOT.Char.IsFemale, 'знала', 'знал' )], что рано или поздно придётся позаботиться о магическом обучении ребёнка, но тогда [child.GetFirstName] [Select_CString(child.IsFemale, 'казалась', 'казался' )] мне слишком [Select_CString(child.IsFemale, 'юной', 'юным' )] для обязанностей [Concept('mage','мага')|E].\n\nОднако теперь риск потери контроля над магией растёт, а сообщения о сверхъестественных событиях поступают всё чаще. Передо мной вновь стоит тот же выбор, что и три года назад.\n\n#italic Что делать с магическими способностями персонажа [child.GetFirstName]?#!\n\n"
 DATAW_child_birth_mage_events.0002.desc_mage_rule_both_or_either: "Мой долг — развивать любые магические таланты моих детей, и мне предстоит решить, как лучше всего это сделать."
 DATAW_child_birth_mage_events.0002.desc_mage_rule_neither: "Нам был дарован ребёнок с магическими силами, и для дома [ROOT.Char.GetHouse.GetBaseName] это возможность оставить свой след в [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier]. Нужно найти мага: [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] пора получить надлежащее обучение."
 DATAW_child_birth_mage_events.0002.desc_tranquil_solution: "Три года назад я впервые [Select_CString(ROOT.Char.IsFemale, 'узнала', 'узнал' )], что [child.GetFirstName] — [Concept('mage','маг')|E]. Тогда было решено выждать и позволить [child.GetFirstName] расти наравне с другими детьми. Но с каждым годом вероятность магической катастрофы возрастает.\n\nНельзя забывать и о риске того, что ребёнок превратится в возможные врата для демонов. Пора ли наконец призвать служителей закона, чтобы они провели Ритуал Усмирения, или рискнуть и позволить [child.GetFirstName] ещё немного побыть с семьёй?"
 DATAW_child_birth_mage_events.0002.desc_persecution: "Три года назад я впервые [Select_CString(ROOT.Char.IsFemale, 'узнала', 'узнал' )], что [child.GetFirstName] — [Concept('mage','маг')|E]. Тогда было решено выждать и позволить [child.GetFirstName] расти наравне с другими детьми. Но с каждым годом вероятность магической катастрофы возрастает.\n\nНельзя забывать и о риске того, что ребёнок превратится в возможные врата для демонов. Пора ли сообщить духовенству о моём ребёнке, чтобы [child.GetHerHim] убили или заключили в тюрьму? Можно попытаться дать [child.GetFirstName] больше времени с семьёй или тайно вывезти ребёнка."
 DATAW_child_birth_mage_events.0002.desc_forced_conscription: "Три года назад я впервые [Select_CString(ROOT.Char.IsFemale, 'узнала', 'узнал' )], что [child.GetFirstName] — [Concept('mage','маг')|E]. Тогда было решено выждать и позволить [child.GetFirstName] расти наравне с другими детьми. Но с каждым годом вероятность магической катастрофы возрастает.\n\nЗаконы державы недвусмысленны: #bold [Concept('mage','маги')|E] — не граждане, а орудия, которыми надлежит пользоваться.#!"
 DATAW_child_birth_mage_events.0002.desc_forced_conscription_is_top_liege: "Я объявлю о способностях своего ребёнка и официально лишу [child.GetHerHim] права наследования."
 DATAW_child_birth_mage_events.0002.desc_forced_conscription_not_top_liege: "Больше медлить нельзя. Я уведомлю сюзерена."
# Circle Options
 DATAW_child_birth_mage_events.0002.opt_a_circle: "Время пришло. Нужно отправить [child.GetFirstName] в [circle|E]"
 DATAW_child_birth_mage_events.0002.opt_a_tranquil_solution: "Больше медлить нельзя. Нужно призвать служителей закона."
 DATAW_child_birth_mage_events.0002.opt_a_persecution: "Другого выбора нет: безопасность семьи и державы превыше всего"
 DATAW_child_birth_mage_events.0002.opt_a_forced_conscription: "Мой ребёнок — [Concept('mage','маг')|E]. [child.GetSheHe|U] подлежит принудительной службе."
 DATAW_child_birth_mage_events.0002.opt_b_circle: "[child.GetFirstName] нужно ещё побыть с семьёй! Девять лет — слишком мало"
 DATAW_child_birth_mage_events.0002.opt_b_forced_conscription: "Я рискну и позволю [child.GetFirstName] ещё немного побыть с семьёй."
 DATAW_child_birth_mage_events.0002.opt_b_persecution: "Я рискну и дам [child.GetFirstName] ещё немного времени, прежде чем принять решение."
 DATAW_child_birth_mage_events.0002.opt_b_tranquil_solution: "Я рискну и позволю [child.GetFirstName] ещё немного побыть здесь, прежде чем принять решение."
 DATAW_child_birth_mage_events.0002.opt_b_circle_tt: "Через несколько лет вы вновь рассмотрите магические способности персонажа [child.GetFirstName]"
 DATAW_child_birth_mage_events.0002.opt_b_mage_accepted: "[child.GetFirstName] ещё слишком [Select_CString(child.IsFemale, 'юна', 'юн' )]. Я вернусь к этому вопросу через три года"
