 DATAW_child_birth_mage_events.0002.opt_e_mage_ruler_spouse: "I’ve given [child.GetFirstName] enough time, [spouse.GetFirstName] will [child.GetFirstName] in the ways of Magic to ensure [child.GetHerHis] safety and ours"

