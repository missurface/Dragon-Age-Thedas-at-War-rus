 DATAW_child_birth_mage_events.0001.opt_e_mage_ruler_spouse: "[spouse.GetFirstName] will educate [child.GetFirstName] in the ways of Magic to ensure [child.GetHerHis] safety"
 EVENT_WINDOW_OPTION_COURT_ENCHANTER: "This option is available because of your [GetCourtPositionType('court_enchanter_court_position').GetName()]'s [aptitude|E]"
