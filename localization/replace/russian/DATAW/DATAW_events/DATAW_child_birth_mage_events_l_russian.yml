 DATAW_child_birth_mage_events.0001.opt_f_no_court_enchanter: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] needs a tutor! I will search for a [GetCourtPositionType('court_enchanter_court_position').GetName()]"
