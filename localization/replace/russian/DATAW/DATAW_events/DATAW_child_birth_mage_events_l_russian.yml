 DATAW_child_birth_mage_events.0003.desc_forced_conscription_is_top_liege: "Я могу публично объявить, что [child.Custom('GetMotheredSired')] мага, и гарантировать, что [child.GetSheHe] будет призван на службу по достижении совершеннолетия, могу попытаться скрыть [child.GetHerHis] способности в надежде, что [child.GetFirstName] благоразумно не станет их использовать. Или же я могу ещё сильнее нарушить законы #L [ROOT.Char.GetFaith.GetName|l]ой#! веры и попытаться тайно вывезти своего ребёнка.\n\n"
 DATAW_child_birth_mage_events.0003.desc_forced_conscription_not_top_liege: "У меня всё ещё есть вариант уведомить моего сюзерена о персонаже [child.GetFirstName], чтобы [child.GetHerHis] призвали на службу, как и надлежит делать добропорядочному последователю #L [ROOT.Char.GetFaith.GetName|l]ой#! веры.\n\n"
 DATAW_child_birth_mage_events.0003.desc_forced_conscription_ruler_mage: "#bold Вариант обучить моего ребёнка самостоятельно всё ещё доступен, но это рискованная затея.#!"

