DATAW_child_birth_mage_events.0003.opt_e_mage_ruler_spouse: "It is time for [spouse.GetFirstName] to educate [child.GetFirstName] in the ways of Magic."

DATAW_child_birth_mage_events.0003.opt_f_has_court_enchanter: "I can delay no longer. [child.GetFirstName] needs at the hands of my [GetCourtPositionType('court_enchanter_court_position').GetName()]."
