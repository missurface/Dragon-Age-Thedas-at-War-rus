# description 
 DATAW_child_birth_mage_events.0001.desc_intro: "Recently, odd occurrences have been reported at [GetPlayer.GetCapitalLocation.GetTitle.GetNameNoTier], with candles suddenly burning green, water freezing despite the heating in the room and objects moving around.\n\n"
 DATAW_child_birth_mage_events.0001.desc_circle: "I’ve asked my courtiers and servants to report any suspicious events, when I suddenly walk into a room and see [child.GetFirstName] casting what seems to be [dataw_magic|E], causing flames to appear out of thin air.\n\nBy [ROOT.Char.GetFaith.HighGodName]! My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] is a [mage|E]!\n\nI must now send [child.GetFirstName] to the [circle|E] of Magi, where [child.GetSheHe] can learn how to use [child.GetHerHis] Magic safely."
 DATAW_child_birth_mage_events.0001.desc_unlanded_sages: "I’ve asked my courtiers and servants to be alert, when I suddenly walk into a room and see [child.GetFirstName] casting what seems to be [dataw_magic|E], causing flames to appear out of thin air.\n\nBy [ROOT.Char.GetFaith.HighGodName]! My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] is a [mage|E]!\n\nI should decide how to proceed regarding this discovery."
 DATAW_child_birth_mage_events.0001.desc_mage_rule: "I’ve asked my courtiers and servants to alert me to those suspicious events, when I suddenly walk into a room and see [child.GetFirstName] casting what seems to be [dataw_magic|E], causing objects to levitate!\n\nBlessed be [ROOT.Char.GetFaith.HighGodName]! My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] is a [mage|E]!\n\n"
 DATAW_child_birth_mage_events.0001.desc_mage_rule_rulermage: "My legacy continues, and it is up to me to decide how to nurture [child.GetFirstName]’s potential- I could make [child.GetFirstName] a ward of the [GetCourtPositionType('court_enchanter_court_position').GetName()], or I could educate [child.GetFirstName] myself."
 DATAW_child_birth_mage_events.0001.desc_mage_rule_spousemage: "My spouse's legacy continues and mine begins, and it is up to me to decide how to nurture [child.GetFirstName]'s' potential- I should ask my spouse to educate [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))], or make [child.GetFirstName] a ward of the [GetCourtPositionType('court_enchanter_court_position').GetName()]."
 DATAW_child_birth_mage_events.0001.desc_mage_rule_both: "Our legacy continues, and it is up to me to decide how to nurture [child.GetFirstName]’s potential- I can educate my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] myself or ask my spouse to educate [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))], or make [child.GetFirstName] a ward of the [GetCourtPositionType('court_enchanter_court_position').GetName()]."  
 DATAW_child_birth_mage_events.0001.desc_tranquil_solution: "I’ve asked my courtiers and servants to report any suspicious events, when I suddenly walk into a room and see [child.GetFirstName] casting what seems to be [dataw_magic|E], casting flames to appear out of thin air. By [ROOT.Char.GetFaith.HighGodName]!  My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] is a [mage|E]- I must call the enforcers to conduct the [rite_of_tranquility|E] to prevent [child.GetHerHim] from becoming a danger." 
 DATAW_child_birth_mage_events.0001.desc_persecution: "I’ve asked my courtiers and servants to report any suspicious events, when I suddenly walk into a room and see [child.GetFirstName] casting what seems to be [dataw_magic|E], casting flames to appear out of thin air. By [ROOT.Char.GetFaith.HighGodName]!  My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] is a [mage|E]- I must alert the clergy- [mage|E] are dangerous and must be imprisoned or killed."
 DATAW_child_birth_mage_events.0001.desc_forced_conscription: "I’ve asked my courtiers and servants to report any suspicious events, when I suddenly walk into a room and see [child.GetFirstName] casting what seems to be [dataw_magic|E], casting flames to appear out of thin air. By [ROOT.Char.GetFaith.HighGodName]!  My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] is a [mage|E]!\n\n"
 DATAW_child_birth_mage_events.0001.desc_forced_conscription_is_top_liege: "I must follow the rules that I expect everyone else to- my child will not be able to inherit any titles, and must be treated as a servant."
 DATAW_child_birth_mage_events.0001.desc_forced_conscription_not_top_liege: "I should let my liege know- while [Concept('mage','Mages')|E] are dangerous, they’re useful and can perform a variety of tasks."
 DATAW_child_birth_mage_events.0001.desc_unregulated_magic: "I’ve asked my courtiers and servants to report any suspicious events, when I suddenly walk into a room and see [child.GetFirstName] casting what seems to be [dataw_magic|E], casting flames to appear out of thin air.\n\nBlessed be [ROOT.Char.GetFaith.HighGodName]! My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] is a [mage|E]! Now I must make a decision about their future- "
 DATAW_child_birth_mage_events.0001.desc_unregulated_magic_rulermage: "I can train [child.GetFirstName] myself in the ways of Magic, or ask a [GetCourtPositionType('court_enchanter_court_position').GetName()] to do so."
 DATAW_child_birth_mage_events.0001.desc_unregulated_magic_spousemage: "I can ask [spouse.GetFirstName] to train [child.GetFirstName] in the ways of magic or ask a [GetCourtPositionType('court_enchanter_court_position').GetName()] to do so."
 DATAW_child_birth_mage_events.0001.desc_unregulated_magic_both: "Either myself or [spouse.GetFirstName] can educate [child.GetFirstName] in the ways of magic, or I can ask a [GetCourtPositionType('court_enchanter_court_position').GetName()] to do it."
 DATAW_child_birth_mage_events.0001.desc_unregulated_magic_neither: "I should assign [child.GetFirstName] to a [GetCourtPositionType('court_enchanter_court_position').GetName()] to train [child.GetHerHim] in the ways of Magic."


# Circle Options
 DATAW_child_birth_mage_events.0001.opt_a_circle: "I must call the Templars to escort [child.GetFirstName] to the Circle safely."
 DATAW_child_birth_mage_events.0001.opt_a_tranquil_solution: "I must send for the enforcers, the Rite has to take place to keep everyone safe."
 DATAW_child_birth_mage_events.0001.opt_a_persecution: "I have no choice, keeping my family and realm safe is my top priority"
 DATAW_child_birth_mage_events.0001.opt_a_forced_conscription: "My child is a [mage|E]. [child.GetSheHe|U] must be conscripted."
 DATAW_child_birth_mage_events.0001.opt_b_circle: "[child.GetFirstName] is too young to be sent alone into the circle, let’s wait a few years"
 DATAW_child_birth_mage_events.0001.opt_b_tranquil_solution: "[child.GetFirstName] is too young to undergo the Rite!"
 DATAW_child_birth_mage_events.0001.opt_b_circle_tt: "You will revisit [child.GetFirstNamePossessive] Magical Abilities in a few years. "
 DATAW_child_birth_mage_events.0001.opt_b_mage_accepted: "[child.GetFirstName] is too young, let [child.GetHerHim] keep the innocent of youth"
