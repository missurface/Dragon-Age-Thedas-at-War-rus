 DATAW_child_birth_mage_events.0002.t_circle: "A Child Apostate"
 DATAW_child_birth_mage_events.0002.t_unlanded_sages_or_unregulated_magic: "A Mage In Waiting"
 DATAW_child_birth_mage_events.0002.t_mage_rule: "A Future Mage"
