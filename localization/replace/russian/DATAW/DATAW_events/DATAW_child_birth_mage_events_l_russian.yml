DATAW_child_birth_mage_events.0004.opt_rowdy_persecution: "Я хочу попробовать применить магию #EMP прямо сейчас#! #italic #EMP прямо сейчас#!#! #italic #EMP #bold прямо сейчас!#!#!#!"
