# description 
 DATAW_child_birth_mage_events.0003.desc_circle: "6 лет назад я впервые [Select_CString(ROOT.Char.IsFemale, 'обнаружила', 'обнаружил' )], что [Select_CString(child.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] — маг. Я раз за разом [Select_CString(ROOT.Char.IsFemale, 'откладывала', 'откладывал' )] решение относительно [child.GetHerHis] будущего и магического образования, но больше тянуть никак нельзя.\n\nУ меня всё ещё есть вариант отправить [child.GetHerHis] в [circle|E], как и надлежит делать добропорядочному последователю #L [ROOT.Char.GetFaith.GetName|l]ой#! веры, чтобы дать [child.GetHerHim] возможность получить магическое образование в безопасной обстановке.\n\nЯ также могу проигнорировать это и надеяться, что [child.GetFirstName] обучится магии самостоятельно. Или же я могу ещё сильнее нарушить законы моей веры и найти мага-отступника для обучения моего отпрыска."
 DATAW_child_birth_mage_events.0003.desc_circle_ruler_mage: "Вариант обучить моего ребёнка самостоятельно всё ещё доступен, хотя Церковь постоянно ищет следы отступников." 
 DATAW_child_birth_mage_events.0003.desc_unlanded_sages_or_unregulated_magic: "Более 6 лет назад [child.GetFirstName] впервые [Select_CString(child.IsFemale, 'начала', 'начал' )] демонстрировать свои магические силы.\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'решила', 'решил' )] подождать и позволить [child.GetHerHim] вырасти без бремени изучения магии, но теперь пора принять окончательное решение относительно [child.GetHerHis] магического образования.\n\n"
 DATAW_child_birth_mage_events.0003.desc_unlanded_sages_or_unregulated_magic_rulermage: "Я могу лично заняться обучением своего ребёнка, если хочу принимать более активное участие в [child.GetHerHis] будущем, или же сделать [child.GetHerHis] подопечным персонажа [GetCourtPositionType('court_enchanter_court_position').GetName()]."
 DATAW_child_birth_mage_events.0003.desc_unlanded_sages_or_unregulated_magic_spousemage: "[Select_CString(spouse.IsFemale, 'Моя', 'Мой' )] [spouse.GetWifeHusband] может обучить нашего ребёнка, либо я могу попросить персонажа [GetCourtPositionType('court_enchanter_court_position').GetName()] сделать это."
 DATAW_child_birth_mage_events.0003.desc_unlanded_sages_or_unregulated_magic_both: "Я или [spouse.GetFirstName] можем обучить нашего ребёнка магическим искусствам, либо я могу попросить персонажа [GetCourtPositionType('court_enchanter_court_position').GetName()] сделать это."
 DATAW_child_birth_mage_events.0003.desc_unlanded_sages_or_unregulated_magic_neither: "Я могу поручить персонажу [GetCourtPositionType('court_enchanter_court_position').GetName()] обучить моё дитя магическим искусствам."
 DATAW_child_birth_mage_events.0003.desc_mage_rule: "6 лет назад выяснилось, что [child.GetFirstName] обладает магическими силами. Я раз за разом [Select_CString(ROOT.Char.IsFemale, 'откладывала', 'откладывал' )] [child.GetHerHis] обучение, но теперь пора принять решение.\n\n[child.GetFirstName] скоро пополнит привилегированные ряды [Concept('mage','магов')|E], и [child.GetSheHe] [Select_CString(child.IsFemale, 'должна', 'должен' )] быть готов столкнуться с трудностями правильного освоения своих сил.\n\n#bold #italic По какому пути пойдёт моё дитя?#!#!"

 DATAW_child_birth_mage_events.0003.desc_tranquil_solution: "6 лет назад я впервые [Select_CString(ROOT.Char.IsFemale, 'обнаружила', 'обнаружил' )], что [Select_CString(child.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] — маг. Я раз за разом [Select_CString(ROOT.Char.IsFemale, 'откладывала', 'откладывал' )] решение относительно [child.GetHerHis] будущего и магического образования, но больше тянуть никак нельзя.\n\nВремя на принятие решения истекает: я могу уведомить власти, чтобы они провели Ритуал Усмирения, могу попытаться скрыть [child.GetHerHis] проклятые способности в надежде, что [child.GetFirstName] благоразумно не станет их использовать и не поддастся соблазнам демонов. Или же я могу ещё сильнее нарушить законы державы [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] и попытаться тайно вывезти своего ребёнка.\n\n"
 DATAW_child_birth_mage_events.0003.desc_tranquil_solution_ruler_mage: "Вариант обучить моего ребёнка самостоятельно всё ещё доступен, но это рискованная затея."
 DATAW_child_birth_mage_events.0003.desc_persecution: "6 лет назад я впервые [Select_CString(ROOT.Char.IsFemale, 'обнаружила', 'обнаружил' )], что [Select_CString(child.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] — маг. Я раз за разом [Select_CString(ROOT.Char.IsFemale, 'откладывала', 'откладывал' )] решение относительно [child.GetHerHis] будущего и магического образования, но больше тянуть никак нельзя.\n\nЯ, как и надлежит делать добропорядочному последователю #L [ROOT.Char.GetFaith.GetName|l]ой#! веры, могу сообщить духовенству об этой ситуации, чтобы [child.GetHerHis] казнили или заточили. Либо я могу проигнорировать [child.GetHerHis] проклятую магию и надеяться, что [child.GetFirstName] не подвергнет опасности нашу семью. Или же я могу ещё сильнее нарушить законы державы [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] и попытаться тайно вывезти своего ребёнка.\n\n"
 DATAW_child_birth_mage_events.0003.desc_persecution_ruler_mage: "Вариант обучить моего ребёнка самостоятельно всё ещё доступен, но это рискованная затея."
 DATAW_child_birth_mage_events.0003.desc_forced_conscription: "6 лет назад я впервые [Select_CString(ROOT.Char.IsFemale, 'обнаружила', 'обнаружил' )], что [Select_CString(child.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] — маг. Я раз за разом [Select_CString(ROOT.Char.IsFemale, 'откладывала', 'откладывал' )] решение относительно [child.GetHerHis] будущего и магического образования, но больше тянуть никак нельзя.\n\n"
