DATAW_child_birth_mage_events.0004.opt_charming_unlanded_sages: "Если я буду вести себя достаточно хорошо, может, мне удастся сохранить свои земли!"
DATAW_child_birth_mage_events.0004.opt_charming_unregulated_magic: "Жду не дождусь, когда покажу свои силы друзьям! Им обязательно понравится!"


DATAW_child_birth_mage_events.0004.opt_curious_tranquil_solution: "Интересно, как работают эти силы... Может, мне стоит осторожно попробовать применить их..?"
DATAW_child_birth_mage_events.0004.opt_curious_forced_conscription: "Интересно, как работают эти силы... Может, мне стоит осторожно попробовать применить их..?"
DATAW_child_birth_mage_events.0004.opt_curious_persecution: "Интересно, как работают эти силы... Может, мне стоит осторожно попробовать применить их..?"
DATAW_child_birth_mage_events.0004.opt_curious_circle: "Почему одни становятся магами, а другие — нет?"
DATAW_child_birth_mage_events.0004.opt_curious_mage_rule: "Мне вот интересно... что чувствуют дети, у которых нет таких сил?"
DATAW_child_birth_mage_events.0004.opt_curious_unlanded_sages: "Маги не могут быть правителями... Интересно, почему..."
DATAW_child_birth_mage_events.0004.opt_curious_unregulated_magic: "Каково это — произносить заклинания? Интересно, получится ли у меня..."

DATAW_child_birth_mage_events.0004.opt_pensive_tranquil_solution: "Может, мне стоит почитать книгу о магии? Это вызовет подозрения, зато будет полезно."
DATAW_child_birth_mage_events.0004.opt_pensive_forced_conscription: "Может, мне стоит почитать книгу о магии? Это вызовет подозрения, зато будет полезно."
DATAW_child_birth_mage_events.0004.opt_pensive_persecution: "Может, мне стоит почитать книгу о магии? Это вызовет подозрения, зато будет полезно."
DATAW_child_birth_mage_events.0004.opt_pensive_circle: "Пора заглянуть в библиотеку! Или я могу признаться в своих силах и отправиться в Круг."
DATAW_child_birth_mage_events.0004.opt_pensive_mage_rule: "Мне стоит взять в библиотеке пару книг о магии!"
DATAW_child_birth_mage_events.0004.opt_pensive_unlanded_sages: "Интересно, почему нельзя быть одновременно и магом, и правителем? Надо бы почитать об этом книгу."
DATAW_child_birth_mage_events.0004.opt_pensive_unregulated_magic: "Взять книги из библиотеки кажется отличной идеей."



DATAW_child_birth_mage_events.0004.opt_bossy_tranquil_solution: "Это опасно, но с помощью магии я могу заставить других делать то, что мне нужно!"
DATAW_child_birth_mage_events.0004.opt_bossy_forced_conscription: "Это опасно, но с помощью магии я могу заставить других делать то, что мне нужно!"
DATAW_child_birth_mage_events.0004.opt_bossy_persecution: "Это опасно, но с помощью магии я могу заставить других делать то, что мне нужно!"
DATAW_child_birth_mage_events.0004.opt_bossy_circle: "С магией я могу править только лучше! Почему подданные этого не понимают?!"
DATAW_child_birth_mage_events.0004.opt_bossy_mage_rule: "Моё будущее как правителя предопределено! Как же весело!"
DATAW_child_birth_mage_events.0004.opt_bossy_unlanded_sages: "Это несправедливо, что я не могу быть правителем и магом одновременно!"
DATAW_child_birth_mage_events.0004.opt_bossy_unregulated_magic: "Я буду править игровой площадкой с помощью своей магии!"


# coming of age
dataw_coming_of_age.1001.desc_child_unlanded_or_unregulated: "[educated_child.GetFirstName] [Select_CString(educated_child.IsFemale, 'достигла', 'достиг' )] совершеннолетия, так и не получив магического образования. Хотя [educated_child.GetSheHe] ещё может попытаться пройти обучение в признанных Кругах, годы взросления не подготовили [educated_child.GetHerHis] к жизни в качестве [Concept('mage','мага')|E]."
dataw_coming_of_age.1001.desc_child_conscription_or_persecution_or_tranquil: "Вопреки всему, [Select_CString(educated_child.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('educated_child'))] [Select_CString(educated_child.IsFemale, 'дожила', 'дожил' )] до совершеннолетия и [Select_CString(educated_child.IsFemale, 'сумела', 'сумел' )] сохранить свои способности в тайне. Родившись в державе, где преследуют подобных [educated_child.GetHerHim], [educated_child.GetFirstName] теперь [Select_CString(educated_child.IsFemale, 'должна', 'должен' )] полагаться на красноречие, хитрый ум и избыток здравого смысла, чтобы не попасться, ведь последствия будут скорыми и суровыми. Возможно, [educated_child.GetFirstName] покинет державу [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] и отправится в земли, где к подобным [educated_child.GetHerHim] относятся с большим состраданием."
dataw_coming_of_age.1001.desc_child_circle: "Этот день настал. [educated_child.GetFirstName] [Select_CString(educated_child.IsFemale, 'достигла', 'достиг' )] совершеннолетия без какого-либо наставничества в искусстве [Concept('dataw_magic', 'магии')|E]. Хотя отсутствие внимания к [educated_child.GetHerHis] магическим силам, вероятнее всего, предотвратило разоблачение, оно также помешало [educated_child.GetHerHim] должным образом научиться использовать имеющиеся способности. [Select_CString(educated_child.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('educated_child'))] теперь [Select_CString(educated_child.IsFemale, 'совершеннолетняя', 'совершеннолетний' )], и [educated_child.GetHerHim] предстоит самостоятельно разобраться, как использовать свои силы, чтобы избежать обнаружения храмовниками."
dataw_coming_of_age.1001.desc_child_mage_rule: "[Select_CString(educated_child.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('educated_child'))] [Select_CString(educated_child.IsFemale, 'достигла', 'достиг' )] совершеннолетия без какой-либо подготовки к жизни в качестве [Concept('mage','мага')|E]. Теперь мне остаётся лишь надеяться, что [educated_child.GetHerHis] врождённого магического таланта, как и опыта взросления в державе, где чародеи пользуются уважением, окажется достаточно."
# faith conversion
dataw_faith_conversion.1001.desc_persecution: "Принятие #L [new_faith.GetName|l]ой#! веры также означает необходимость привыкать к новым обрядам и обычаям. Ведь среди новых канонов присутствует и иной взгляд на сферу [Concept('dataw_magic', 'магии')|E] и её применение, а также на обращение с магами: их нужно либо убивать, либо заточать вдали от общества, ведь они слишком опасны, чтобы позволять подобным манкам для демонов свободно ходить среди нас."
dataw_faith_conversion.1001.desc_tranquil: "Принятие #L [new_faith.GetName|l]ой#! веры также означает необходимость привыкать к новым обрядам и обычаям. Ведь среди новых канонов присутствует и иной взгляд на сферу [Concept('dataw_magic', 'магии')|E] и её применение, а также на обращение с магами. Чародеи опасны, и никакие меры предосторожности не смогут предотвратить катастрофу. Каждый маг должен пройти [rite_of_tranquility|E], чтобы навсегда обеспечить безопасность окружающих."
dataw_faith_conversion.1001.desc_circle: "Принятие #L [new_faith.GetName|l]ой#! веры также означает необходимость привыкать к новым обрядам и обычаям. Ведь среди новых канонов присутствует и иной взгляд на сферу [Concept('dataw_magic', 'магии')|E] и её применение, а также на обращение с магами: магов необходимо изолировать от общества и надёжно укрывать в Кругах под надзором бдительных храмовников. Если кто-то из моей семьи проявит хоть малейшие признаки магических сил, я буду [Select_CString(ROOT.Char.IsFemale, 'вынуждена', 'вынужден' )] отправить их в [circle|E] или попытаться скрыть это, что станет крайне рискованной затеей."
dataw_faith_conversion.1001.desc_circle_had_unregulated_magic_or_mage_rule: "Принятие #L [new_faith.GetName|l]ой#! веры также означает необходимость привыкать к новым обрядам и обычаям. Ведь среди новых канонов присутствует и иной взгляд на сферу [Concept('dataw_magic', 'магии')|E] и её применение, а также на обращение с магами: магов необходимо изолировать от общества и надёжно укрывать в Кругах под надзором бдительных храмовников. Если кто-то из моей семьи проявит хоть малейшие признаки магических сил, я буду [Select_CString(ROOT.Char.IsFemale, 'вынуждена', 'вынужден' )] отправить их в [circle|E] или попытаться скрыть это, что станет крайне рискованной затеей. И конечно, маги не могут править ни при каких обстоятельствах."
dataw_faith_conversion.1001.desc_unlanded: "Принятие #L [new_faith.GetName|l]ой#! веры также означает необходимость привыкать к новым обрядам и обычаям. Ведь среди новых канонов присутствует и иной взгляд на сферу [Concept('dataw_magic', 'магии')|E] и её применение, а также на обращение с магами."
dataw_faith_conversion.1001.desc_unlanded_sages_had_persecution_or_conscription_or_tranquil: "Принятие #L [new_faith.GetName|l]ой#! веры также означает необходимость привыкать к новым обрядам и обычаям. К магам больше не относятся как к скоту или опасным орудиям, требующим контроля — они вольны жить своей жизнью."
dataw_faith_conversion.1001.desc_unlanded_sages_had_circle: "Принятие #L [new_faith.GetName|l]ой#! веры также означает необходимость привыкать к новым обрядам и обычаям. Ведь среди новых канонов присутствует и иной взгляд на сферу [Concept('dataw_magic', 'магии')|E] и её применение, а также на обращение с магами. Маги больше не будут заточены в Кругах под стражей враждебных храмовников и под непрестанной угрозой Ритуала Усмирения. Теперь они могут свободно изучать магию, не опасаясь преследований."
dataw_faith_conversion.1001.desc_unlanded_sages_had_unregulated_magic_or_mage_rule: "Принятие #L [new_faith.GetName|l]ой#! веры также означает необходимость привыкать к новым обрядам и обычаям. Ведь среди новых канонов присутствует и иной взгляд на сферу [Concept('dataw_magic', 'магии')|E] и её применение, а также на обращение с магами. Хотя магов не заточают и не изгоняют из общества открыто, им ни при каких обстоятельствах не позволено править."
dataw_faith_conversion.1001.desc_unregulated: "Принятие #L [new_faith.GetName|l]ой#! веры также означает необходимость привыкать к новым обрядам и обычаям. Ведь среди новых канонов присутствует и иной взгляд на сферу [Concept('dataw_magic', 'магии')|E] и её применение, а также на обращение с магами. Чародеи считаются способными править наравне с теми, кто и огонь без лучины не разведёт."
dataw_faith_conversion.1001.desc_unregulated_had_mage_rule: "Принятие #L [new_faith.GetName|l]ой#! веры также означает необходимость привыкать к новым обрядам и обычаям. Ведь среди новых канонов присутствует и иной взгляд на сферу [Concept('dataw_magic', 'магии')|E] и её применение, а также на обращение с магами. Чародеи считаются способными править наравне с теми, кто и огонь без лучины не разведёт. Хотя маги — не единственные, кто может править, им, по крайней мере, это позволено, в отличие от сторонников других, менее просвещённых религиозных взглядов."
dataw_faith_conversion.1001.desc_mage_rule: "Принятие #L [new_faith.GetName|l]ой#! веры также означает необходимость привыкать к новым обрядам и обычаям. Ведь среди новых канонов присутствует и иной взгляд на сферу [Concept('dataw_magic', 'магии')|E] и её применение, а также на обращение с магами. Лишь маги признаются способными править, поэтому если у кого-то из моей семьи не проявятся магические силы, к ним будут относиться как к низшему классу, способному лишь служить, подобно обделённому даром простонародью."
dataw_faith_conversion.1001.desc_conscription: "Принятие #L [new_faith.GetName|l]ой#! веры также означает необходимость привыкать к новым обрядам и обычаям. Ведь среди новых канонов присутствует и иной взгляд на сферу [Concept('dataw_magic', 'магии')|E] и её применение, а также на обращение с магами. К магам относятся как к скоту, способному лишь служить и беспрекословно повиноваться, а их силы используются исключительно на благо державы."