### Child POV, child has Magic (Age 12), discvered
DATAW_child_birth_mage_events.0004.t: "Я — маг?"
DATAW_child_birth_mage_events.0004.desc_intro: "Я сижу в своей комнате, разглядывая книжку с картинками, как вдруг слышу добрый голос. Подумав, что это кто-то из челяди, я поднимаю взгляд в надежде кого-то увидеть, но вокруг меня пусто. Сочтя это странным, я оглядываюсь по сторонам и замечаю, что сундук с моими игрушками движется, хотя никто к нему не прикасается.\n\nЯ приближаюсь к сундуку, когда внезапно оказываюсь в совершенно другом месте — там, где законы этого мира, похоже, не действуют.\n\n#bold И тут до меня доходит... #EMP Я в [Concept('fade','Тени')|E]!#!#!\n\n"
DATAW_child_birth_mage_events.0004.desc_circle: "Это значит, что я — [mage|El]... Мне придётся скрывать свои силы, ведь [ROOT.Char.GetFaith.HighGodName] не слишком благосклонно относится к подобным мне."
DATAW_child_birth_mage_events.0004.desc_mage_rule: "Клянусь [ROOT.Char.GetFaith.HighGodNamePossessive]! Я — [mage|El]! Меня ждёт великая судьба!"
DATAW_child_birth_mage_events.0004.desc_tranquil_solution: "Это значит, что я — [mage|El]... Мне придётся скрывать свои силы, ведь [ROOT.Char.GetFaith.HighGodNamePossessive] не слишком благосклонно относится к подобным мне."
DATAW_child_birth_mage_events.0004.desc_persecution: "Это значит, что я — [mage|El]... Мне придётся скрывать свои силы, ведь [ROOT.Char.GetFaith.HighGodNamePossessive] не слишком благосклонно относится к подобным мне."
DATAW_child_birth_mage_events.0004.desc_forced_conscription: "Это значит, что я — [mage|El]... Мне придётся скрывать свои силы, ведь [ROOT.Char.GetFaith.HighGodNamePossessive] не слишком благосклонно относится к подобным мне."
DATAW_child_birth_mage_events.0004.desc_unlanded_sages: "Это значит, что я — [mage|E]... Хотя я [Select_CString(ROOT.Char.IsFemale, 'благословлена', 'благословлён' )] силами, которых нет у большинства других, если мои способности раскроются, я потеряю право владеть землями и подданными."
DATAW_child_birth_mage_events.0004.desc_unregulated_magic: "Это значит, что я — [mage|El]! Потрясающе! Я обладаю силами, о которых другие могут только мечтать!"
DATAW_child_birth_mage_events.0004.desc_outro: "\n\nМне следует соблюдать осторожность, находясь в [Concept('fade','Тени')|E]: известно, что [Concept('demon','демоны')|E] пытаются овладеть неопытными [Concept('mage','магами')|E], но обладать такими силами — просто невероятно."

