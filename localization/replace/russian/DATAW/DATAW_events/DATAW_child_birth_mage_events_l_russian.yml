 DATAW_child_birth_mage_events.0003.desc_forced_conscription_is_top_liege: "I can publicly declare that I have [child.Custom('GetMotheredSired')] a Mage and ensure that [child.GetSheHe] will be conscripted once of age, I can attempt to hide [child.GetHerHis] abilities and hope that [child.GetFirstName] will have the sense not to use it. Or I can further break the laws of [ROOT.Char.GetFaith.GetName] and attempt to smuggle my child out.\n\n"
 DATAW_child_birth_mage_events.0003.desc_forced_conscription_not_top_liege: "I still have the option of notifying my liege about [child.GetFirstName], to conscripted as a [ROOT.Char.GetFaith.DevoteeNeuter] should.\n\n"
 DATAW_child_birth_mage_events.0003.desc_forced_conscription_ruler_mage: "#bold The option of educating my child on my own stands, it is a risky business.#!"

