l_russian:
 global_culture.3002.t:0 "Восхождение нормандцев"
 global_culture.3002.desc:1 "Богатые и плодородные земли северной Франции стали нашему народу изобильным домом и форпостом для новых завоеваний.\n\nПереняв традиции местных, мы сможем лучше приспособиться к жизни в этом регионе."
 global_culture.3002.a:0 "За новых друзей и новое начало!"

 global_culture.3003.t:0 "$global_culture.3002.t$"
 global_culture.3003.desc:0 "Мы далеко от земель, которые наши скандинавские предки называли своим домом, но именно земли на севере Франции мы считаем родными. Я [Select_CString(ROOT.Char.IsFemale, 'предводительница', 'предводитель' )] нашего народа, и на мне лежит ответственность за его процветание. И я считаю, что нам следует приспосабливаться к новому окружению. Нужно учиться у людей, предки которых обрабатывали эти плодородные земли.\n\nВот мое слово: мы изменим сам наш образ жизни — ради самих себя. Мы проложим собственный путь и станем новым народом."
 global_culture.3003.a:0 "С этого дня мы будем звать себя норманнами!"

 global_culture.3005.t:0 "$global_culture.3002.t$"
 global_culture.3005.desc:0 "Группа поселенцев из Скандинавии обосновалась на побережье Северной Франции, сделав это место своим новым домом.\n\nИх [Select_CString(fereldan_founder.IsFemale, 'предводительница', 'предводитель' )], [fereldan_founder.GetTitledFirstName], требует от своих людей принять ряд местных обычаев и традиций ради процветания на новых землях."
 global_culture.3005.a:0 "И что это означает для региона?"

 global_culture.8000.t:0 "Распространение культуры: [fereldan.GetNameNoTooltip]"
 global_culture.8000.desc:0 "Смешение народов Ферелденской долины породило самобытную культуру, вобравшую множество разных влияний.\n\nТеперь ясно, что жители владения [county_to_change.GetName] отказались от прежней культурной самоидентификации — [old_culture.GetName]. Отныне они называют себя так: [fereldan.GetCollectiveNoun]!"
 global_culture.8000.a:0 "Любопытное развитие событий..."

 global_culture.8001.a:0 "Прекрасно!"
