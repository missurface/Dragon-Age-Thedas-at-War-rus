l_russian:
# EVENT 1
 DATAW_hassandriel_events.001.tit: "Сомнения в вере"
 DATAW_hassandriel_events.001.desc: "Я откладываю свиток с вновь найденными сказаниями и мифами о [ROOT.Char.GetFaith.WaterGodName] и усаживаюсь за бесконечные государственные бумаги, размышляя об итогах своего правления. Мой долг как [ROOT.Char.GetTitleAsNameNoTooltip|l] Долов всегда состоял в сохранении нейтралитета элвенов и мира на фоне растущего напряжения между последователями Андрасте и эванурисов. Слишком часто эльфов изгоняли, а порой и убивали прежде, чем у меня появлялась возможность вмешаться. Слишком часто моих соплеменников обращали против воли или убивали за отказ принять чужую веру, а возможности облегчить их страдания не было. Десятилетиями я следую примеру [ROOT.Char.GetFaith.WaterGodName] и собственными поступками веду свой народ, орлесианцев, борсолов и авваров к сотрудничеству и дружбе, надеясь сохранить независимость и земли, обретённые таким тяжким трудом. \n\nНо андрастиане словно забыли, что на этой земле мы желали возвести второй Арлатан, и теперь считают возвращение к древней вере предательством. Несмотря на все мои старания, Тедас готовится к войне, а [fenarel.GetFirstName] [Select_CString(fenarel.IsFemale, 'едва ли могла бы радоваться больше', 'едва ли мог бы радоваться больше' )]. \n\nНеужели все наставления богов были напрасны? Неужели боги заточены столь надёжно, что даже не могут попытаться прийти на помощь элвенам — своему народу? \n\nСуществуют ли боги вообще?"
 DATAW_hassandriel_events.001.opt.a: "Что за нелепая мысль! Конечно, существуют!"
 DATAW_hassandriel_events.001.opt.a.tooltip: "Но можно ли спасти элвенов от судьбы, постигшей нас давным-давно в Арлатане?"
 DATAW_hassandriel_events.001.opt.b: "Боги не спасут ни нас, ни нашу культуру."
 DATAW_hassandriel_events.001.opt.b.tooltip: "Возможно, отказ от слепого рвения поможет сохранить культуру элвенов."


# EVENT 2
 DATAW_hassandriel_events.002.tit: "Сомнения в вере: немыслимое смешение"
 DATAW_hassandriel_events.002.desc: "Вот уже несколько месяцев я задаюсь бесчисленными вопросами о будущем Долов. В мыслях перебраны тысячи способов избежать войны с Орлеем, которая кажется неизбежной, но какой бы путь к миру ни открывался передо мной, [ROOT.Char.GetFaith.TricksterGodName] вновь направляет нас к войне.\n\n«Прошу! Меня не принуждали! [Select_CString(ROOT.Char.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.GetTitleAsNameNoTooltip|l], смилуйтесь!» \n\nОчнувшись от размышлений, я вижу перед собой [Select_CString(pleadingelf.IsFemale, 'умоляющую эльфийку, которая отчаянно взывает', 'умоляющего эльфа, который отчаянно взывает' )] к помощи. [Select_CString(pleadingelf.IsFemale, 'Рядом с ней', 'Рядом с ним' )] стоит закованная в цепи служительница Церкви, которую Изумрудный рыцарь заставил преклонить передо мной колени. [Select_CString(rajmaelEK.IsFemale, 'Моя подруга', 'Мой друг' )] [rajmaelEK.GetFirstName] подходит ближе и объясняет: \n\n«Эту шемленку поймали за проповедью слова Создателя в приграничной деревне. Сладостью речей [ROOT.Char.GetFaith.TricksterGodNamePossessive] она порочила благие слова эванурисов. [Select_CString(pleadingelf.IsFemale, 'Эту несчастную заставили', 'Этого несчастного заставили' )] принять веру шемов; вероятно, [Select_CString(pleadingelf.IsFemale, 'ей', 'ему' )] угрожала охрана жрицы, оказавшая сопротивление при задержании. С охранниками уже покончено, [Select_CString(ROOT.Char.IsFemale, 'моя', 'мой' )] [ROOT.Char.GetTitleAsNameNoTooltip|l]. Теперь мы ждём вашего суда над еретичкой». \n\n[Select_CString(pleadingelf.IsFemale, 'Эльфийка представляется', 'Эльф представляется' )] именем [pleadingelf.GetName], делает шаг вперёд и едва не плача молит о пощаде. [pleadingelf.GetName] рассказывает, что, несмотря на вечное напряжение между нашими народами, деревня поддерживает добрые отношения с соседями-людьми. Служительница Церкви поселилась там и выполняла простую работу в обмен на уроки эльфийского языка. Она рассказывала об Андрасте, Создателе и Шартане. Никто не желал ей зла — напротив, в деревне ей были рады. \n\n[pleadingelf.GetName] на эльфийском языке молит о моей милости и милости Создателя."
 DATAW_hassandriel_events.002.opt.a: "Монахиня свободна."
 DATAW_hassandriel_events.002.opt.b: "Монахиня останется в темнице до моего суда."
 DATAW_hassandriel_events.002.opt.b.custom_tooltip: "[Concept('opinion','Мнение')|E] всех придворных, которые не обладают свойствами «[GetTrait('compassionate').GetName( GetNullCharacter )]» или «[GetTrait('cynical').GetName( GetNullCharacter )]», о #high вас#! повышается на 50,"
 DATAW_hassandriel_events.002.opt.c: "Монахиня будет изгнана и никогда не вернётся."
 DATAW_hassandriel_events.002.opt.c.custom_tooltip: "[Concept('opinion','Мнение')|E] всех придворных, которые не обладают свойствами «[GetTrait('compassionate').GetName( GetNullCharacter )]» или «[GetTrait('cynical').GetName( GetNullCharacter )]», о #high вас#! повышается на 25."


# EVENT 3
 DATAW_hassandriel_events.003.tit: "Сомнения в вере: единственный выход?"
 DATAW_hassandriel_events.003.desc: "Стоит мне после суда над служительницей Церкви покинуть тронный зал, как мысли вновь обращаются к [pleadingelf.GetName] и [Select_CString(pleadingelf.IsFemale, 'её', 'его' )] андрастианской молитве на эльфийском языке. \n\nЗа всю жизнь, годы учёбы и правления мне не доводилось видеть столь немыслимого смешения обычаев. [Select_CString(pleadingelf.IsFemale, 'Эльфийка', 'Эльф' )], несомненно [Select_CString(pleadingelf.IsFemale, 'долийка по культуре и происхождению', 'долиец по культуре и происхождению' )], молится Создателю. Андрастиане всегда ненавидели нас за то, что мы отвергли Создателя ради древних богов элвенов из Арлатана. Причиной раздора были не язык и традиции, а наша вера. \n\nИ теперь маленькая деревня, где сохранилось множество долийских обычаев и живёт одинокая андрастианская жрица, подсказывает мне замысел, способный уберечь элвенов от новой утраты земли и культуры. \n\nДолийская Церковь, созданная долийцами для долийцев. Компромисс: принять Создателя и Его Невесту, но сохранить свою землю, традиции и язык. \n\nНеужели это единственный выход?"
 DATAW_hassandriel_events.003.opt.a: "Для подобной попытки слишком поздно. Безнадёжно поздно."
 DATAW_hassandriel_events.003.opt.a.tooltip: "Вы отказываетесь от поисков долговечного мирного способа защитить вторую родину элвенов и готовитесь к войне."
 DATAW_hassandriel_events.003.opt.b: "Только Долийская Церковь спасёт нашу культуру и родину."
 DATAW_hassandriel_events.003.opt.b.tooltip: "Вы попытаетесь создать Долийскую Церковь, чтобы примирить Орлей и долийцев и сохранить вторую родину элвенов."

# EVENT 4
 DATAW_hassandriel_events.004.tit: "Мучительный отказ"
 DATAW_hassandriel_events.004.desc: "Тяжело даже не попытаться воплотить замысел, способный принести Долам мир, но народ этого не желает. Я лишь служу ему и не вправе решать за него, кому следует поклоняться ради сохранения наших земель. \n\nИ всё же я не могу не задумываться о желаниях своего народа. Большинство жаждет войны, как [fenarel.GetFirstName]? Или мечтает о мире в блаженном уединении, как я? А главное — люди не замечают надвигающейся бури или же видят её и умоляют меня действовать? \n\nТеперь необходимо сделать всё возможное ради спасения [Concept('elvhen','элвенов')|E]. Можно отправить [orlesianEmperor.GetName] искреннее письмо с призывом к срочной встрече, чтобы снять напряжение и предотвратить войну, которая унесёт тысячи жизней. Возможно, лишь так удастся отвести бурю и спасти как элвенов, так и людей. Другая возможность, о которой страшно даже думать, — начать готовиться к войне. [fenarel.GetName] давно [Select_CString(fenarel.IsFemale, 'стремилась', 'стремился' )] к этому, но подобные приготовления лишь превратят войну в неизбежность. \n\nОба пути нарушат нейтралитет Долов, который сохранялся столь долго. И всё же такая жертва кажется приемлемой — одной из многих, которые народу предстоит принести в ближайшие дни."
 DATAW_hassandriel_events.004.opt.a: "Я устрою встречу с [orlesianEmperor.GetName]."
 DATAW_hassandriel_events.004.opt.a.tooltip: "Остаётся молиться, чтобы письмо достигло Вал Руайо, а Орлей прислушался: война ему нужна не больше, чем мне."
 DATAW_hassandriel_events.004.opt.b: "Нужно послушать [fenarel.GetFirstName] и готовиться к войне."
 DATAW_hassandriel_events.004.opt.b.tooltip: "Как ни больно это признавать, впереди лишь война, и мы должны быть готовы."

# EVENT 5
 DATAW_hassandriel_events.005.tit: "Мучительный отказ: оглушительная тишина"
 DATAW_hassandriel_events.005.desc: "Прошло три месяца, но мольба о помощи, отправленная в Орлей, осталась без ответа — и доброго, и дурного. Такое молчание может означать многое. Возможно, письмо потерялось в пути и так и не достигло Вал Руайо. Быть может, гонец попал в засаду или стража не позволила эльфу войти в столицу андрастианства. За последние месяцы я [Select_CString(ROOT.Char.IsFemale, 'отправила', 'отправил' )] ещё три письма в надежде, что хотя бы одно попадёт к властям Вал Руайо, но всё напрасно. \n\nКак бы то ни было, встречи не будет. Остаётся готовиться к войне."
 DATAW_hassandriel_events.005.opt.a: "#italic [Glossary('Fen′Harel Var Ghilana','FenHarelVarGhilana_GLOSS')].#!"
 FenHarelVarGhilana_GLOSS: "«Ужасный Волк ведёт нас» — распространённая эльфийская поговорка, означающая, что всё движется к худшему."

# EVENT 6
 DATAW_hassandriel_events.006.tit: "Мучительный отказ: столкновения и слёзы войны"
 DATAW_hassandriel_events.006.desc: "Прошло три месяца с тех пор, как я [Select_CString(ROOT.Char.IsFemale, 'велела', 'велел' )] [fenarel.GetFirstName] и своим вассалам вооружаться. Сегодня [fenarel.GetFirstName] [Select_CString(fenarel.IsFemale, 'пришла', 'пришёл' )] с несколькими сторонниками, чтобы в доказательство своих усилий показать мне часть армии. Следуя за [Select_CString(fenarel.IsFemale, 'ней', 'ним' )] во двор, я вижу полк [Glossary('Mi′adahlen','Miadahlen_GLOSS')], выстроившийся безупречно, словно лучи восходящего солнца. \n\n[fenarel.GetFirstName] поднимает руку и кричит воинам: \n\n#italic «[Glossary('Vir enasalin','Virenasalin_GLOSS')]!»#! \n\nПолк отвечает боевым кличем, обещая победу над теми, с кем всё могло сложиться иначе. Воины уверены в своём триумфе и клянутся мне в верности, а я могу лишь смотреть на них и плакать. \n\nВсего этого не должно было случиться. \n\nТак многие из тех, кого я вижу, и ещё больше тех, кого здесь нет, не переживут грядущих сражений. [fenarel.GetFirstName] смотрит на меня, и в [Select_CString(fenarel.IsFemale, 'её', 'его' )] глазах пылает неутолимая жажда крови, готовая вырваться наружу."
 Virenasalin_GLOSS: "Эльфийский боевой клич, означающий «Мы победим»."
 Miadahlen_GLOSS: "Ми'адален, или Клинок Леса, — многочисленная стража на службе Долов, призванная бороться с преступностью, вторжениями и иными угрозами. Требования к подготовке в её рядах сравнительно мягки, но во всех уголках Долов стражники обязаны всегда быть готовыми к бою."
 DATAW_hassandriel_events.006.opt.a: "#italic [Glossary('Vir Ghilas vir banal','VirGhilasvirbanal_GLOSS')].#!"
 VirGhilasvirbanal_GLOSS: "«То, куда мы идём, ужасно» — фраза на эльфийском языке."
# EVENT 7
 DATAW_hassandriel_events.007.tit: "Долийская Церковь: отчаянный замысел"
 DATAW_hassandriel_events.007.firstSection: "Прошёл лишь день с тех пор, как я [Select_CString(ROOT.Char.IsFemale, 'приняла', 'принял' )] это решение, но кажется, будто минуло десятилетие. Весь день мы с [chaplain.GetName] не покидаем мой кабинет и часами перебираем записи, тексты и предания долийцев и андрастиан, пытаясь создать веру, способную спасти Долы. \n\nЧтобы не навлечь гнев Орлея, мы признаем Верховную жрицу и её власть в вопросах учения Создателя и слова Андрасте. Она сможет отлучить нас от Церкви, если пожелает. Остаётся молиться, чтобы такая власть умилостивила орлесианцев и убедила долийцев искренне принять андрастианство. В то же время нельзя перенимать воинственность орлесианской Церкви — это лишь усилит напряжение. \n\nВ основу новой веры войдут предания андрастианского канона, в которых элвены сыграли важную роль: восстание Шартана и его походы бок о бок с Андрасте, а также дарование Мафератом Долов как нашей новой родины. Эти сказания станут важнейшим орудием, которое поможет Церкви укорениться среди долийцев. Будем надеяться, что почтение к эльфийской культуре убедит народ: речь идёт не об отказе от долийского наследия, а о его развитии."
 DATAW_hassandriel_events.007.firstSection.cynical: "Так мы вырвемся из добровольного застоя и ступим в будущее, где сумеем выстоять и выжить."
 DATAW_hassandriel_events.007.secondSection: "\n\nНаконец [chaplain.GetName] отрывается от книги и смотрит на меня."
 DATAW_hassandriel_events.007.secondSection.zealous: "\n\n«Мы почти закончили с этой вашей… нелепой затеей, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )]. Осталось определить лишь последний важный принцип Церкви. Выбор я оставляю за вами»."
 DATAW_hassandriel_events.007.secondSection.normal: "\n\n«[Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )], прежде чем мы закончим, осталось сформулировать лишь последний важный принцип Церкви. Выбор я оставляю за вами»."
 DATAW_hassandriel_events.007.opt.a: "Мы сохраним почитание празднеств и пиров."
 DATAW_hassandriel_events.007.opt.a.tooltip: "Последним догматом Долийской Церкви станет «[GetFaithDoctrine('tenet_ritual_celebrations').GetBaseName]»."
 DATAW_hassandriel_events.007.opt.b: "Наше почтение к природе необходимо сохранить."
 DATAW_hassandriel_events.007.opt.b.tooltip: "Последним догматом Долийской Церкви станет «[GetFaithDoctrine('tenet_sanctity_of_nature').GetBaseName]»."
 DATAW_hassandriel_events.007.opt.c: "Гибкость поможет нам выжить."
 DATAW_hassandriel_events.007.opt.c.tooltip: "Последним догматом Долийской Церкви станет «[GetFaithDoctrine('tenet_adaptive').GetBaseName]»."

# EVENT 8
 DATAW_hassandriel_events.008.tit: "Долийская Церковь: пусть она никогда не родится"
 DATAW_hassandriel_events.008.desc: "Всё готово. Учение Долийской Церкви полностью разработано и при необходимости может быть открыто для всеобщего исповедания. Пока же оно останется запечатанным и сокрытым: о замысле знаем лишь мы с [chaplain.GetName], а преждевременная огласка способна посеять в Долах небывалую смуту. \n\nСледует соблюдать осторожность. Пока я приложу все силы, чтобы сохранить мир с людьми Орлея и Морозных гор, одновременно готовя долийцев к мысли о возможном отказе от веры ради спасения культуры. Легко не будет, но, надеюсь, этот путь позволит спасти Долы."
 DATAW_hassandriel_events.008.desc.cynical: "\n\nМожно было бы молиться, чтобы к этому никогда не пришлось прибегнуть, но в глубине души я знаю: такие молитвы тщетны."
 DATAW_hassandriel_events.008.opt.a: "#italic [Glossary(' Melana en athim las enaste','Melanaenathimlasenaste_GLOSS')]#!"
 Melanaenathimlasenaste_GLOSS: "«Да принесёт смирение благосклонность» — эльфийская поговорка о том, что следует сохранять скромность."
 DATAW_hassandriel_events.008.opt.a.tooltip: "Отношения с правителем Орлея могут определить судьбу Долийской Церкви, если та когда-либо появится. #N На случай вражды стоит постараться умилостивить Орлей.#!"

# EVENT 9
 DATAW_hassandriel_events.009.tit: "Долийская Церковь: кровавое и мучительное рождение"
 DATAW_hassandriel_events.009.firstSection: "Прошёл почти час. Целый час я не свожу глаз со свитка, который может стать спасительной благодатью для моего народа — или его погибелью. Так или иначе, выбор предстоит сделать мне… И это пугает."
 DATAW_hassandriel_events.009.firstSection.notCynical: "\n\nНеужели то же самое чувствовал Эльгарнан всякий раз, когда говорил с Фен'Харелом?"
 DATAW_hassandriel_events.009.secondSection: " Я могу бросить свиток в огонь вместе с самим замыслом. Но что-то меня удерживает: мысль о Долийской Церкви и о том, как она способна нас спасти. Если Долы не одержат быстрой победы над Орлеем, мы обречены. Если Долы ничего не предпримут, мы обречены. Шансы на победу малы и не оставляют права на ошибку. Более того, победа гарантирует независимость лишь на короткое время, а вместе с ней обещает смуту, реваншизм и ещё больше смертей для всех сторон. \n\nСтоит ли она такой цены? Можно ли позволить моему народу убивать и гибнуть бессчётными тысячами лишь ради новых войн и смертей в будущем? \n\nНет. Пришло время Долийской Церкви. Время, когда элвены смогут вырваться из преследующего нас прошлого и двинуться к светлому будущему — будущему, где власть бесспорно принадлежит сильным элвенам, сохранившим свою культуру. Это риск, способный вознести эльфов к новым высотам. \n\nВремя пришло. Если будет на то воля Создателя, мы пойдём рядом с Шартаном и примем Песнь Света. \n\n«Истинно, Создатель призвал тебя так же, как Он призвал меня, чтобы быть Светом для твоего Народа», — сказала Невеста Создателя Шартану."
 DATAW_hassandriel_events.009.opt.a: "#italic [Glossary(' Ir vir Ghilana','irvirghilana_GLOSS')]#!"
 irvirghilana_GLOSS: "Эльфийская фраза, примерно означающая «Я поведу нас»."
 DATAW_hassandriel_events.009.opt.a.tooltip: "Бледный Демон наверняка возненавидит это решение, а ваше обращение не останется без последствий."

# EVENT 10
 DATAW_hassandriel_events.010.tit: "Долийская Церковь: [Select_CString(hassandriel.IsFemale, 'мнимая преемница', 'мнимый преемник' )] Шартана"
 DATAW_hassandriel_events.010.desc: "Письмо, доставленное на мой стол здесь, во владении [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], застало меня врасплох. \n\n[hassandriel.GetName], [Select_CString(hassandriel.IsFemale, 'наша княгиня', 'наш князь' )], [Select_CString(hassandriel.IsFemale, 'обратилась', 'обратился' )] в веру Церкви? Это немыслимое святотатство, безмерное предательство. \n\n[hassandriel.GetName] называет своё учение Долийской Церковью и призывает нас обратиться, чтобы перед лицом якобы непреодолимой угрозы сохранить культуру. Подобные речи лишь усугубляют оскорбление и показывают, насколько [Select_CString(hassandriel.IsFemale, 'княгиня далека', 'князь далёк' )] от народа. \n\n[Select_CString(hassandriel.IsFemale, 'Эта любительница шемов слишком долго просидела', 'Этот любитель шемов слишком долго просидел' )] за книгами и свитками, чтобы понимать желания долийцев. [Select_CString(hassandriel.IsFemale, 'Она забыла', 'Он забыл' )], что боги — такая же часть нашей культуры, как и традиции, а отказ от них едва ли умилостивит шемов. И почему мы вообще должны их умилостивлять? Разве не пора наконец дать отпор и вдоволь пролить кровь в отместку за тысячелетия страданий? \n\nДолы должны оставаться сильными. Элвены должны оставаться сильными, и эту силу придётся доказать кровью. Хассандриэль [Select_CString(hassandriel.IsFemale, 'забыла', 'забыл' )], что значит быть [Select_CString(hassandriel.IsFemale, 'эльфийкой', 'эльфом' )], и теперь предлагает протянуть руки тем, кто нас ненавидит, в глупой надежде, что они согласятся жить рядом. \n\nЭльфам пора распрямиться, сражаться и победить."
 DATAW_hassandriel_events.010.opt.a: "#italic [Glossary('Ir emah′la shal, harrelan','Iremahlashalharrelan_GLOSS')]!#!"
 Iremahlashalharrelan_GLOSS: "«Я убью тебя, предатель!» — фраза на эльфийском языке."
 DATAW_hassandriel_events.010.opt.a.tooltip: "[hassandriel.GetName] больше не заслуживает права стоять во главе Долов. Второй родиной должен править приверженец веры элвенов — например, вы. #N Вы поднимете восстание против Хассандриэля! Многие прямые вассалы могут присоединиться к вам ради защиты веры элвенов, но это не остановит наступление Орлея.#!"
 DATAW_hassandriel_events.010.opt.b: "Сейчас мой клинок нужен Долам против Орлея как никогда."
 DATAW_hassandriel_events.010.opt.b.tooltip: "Несмотря на сомнения, [hassandriel.GetName] по-прежнему сможет рассчитывать на вашу поддержку. Другие вассалы могут восстать и без вас."

# EVENT 11
 DATAW_hassandriel_events.011.tit: "Долийская Церковь: [Select_CString(hassandriel.IsFemale, 'мнимая преемница', 'мнимый преемник' )] Шартана"
 DATAW_hassandriel_events.011.firstSection: "Письмо, доставленное на мой стол здесь, во владении [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], застало меня врасплох. \n\n[hassandriel.GetName], [Select_CString(hassandriel.IsFemale, 'наша княгиня', 'наш князь' )], [Select_CString(hassandriel.IsFemale, 'обратилась', 'обратился' )] в веру Церкви?"
 DATAW_hassandriel_events.011.firstSection.zealous: "Это немыслимое святотатство, безмерное предательство."
 DATAW_hassandriel_events.011.firstSection.cynical: "Смелый шаг, способный умилостивить людей и уберечь Долы от гибели."
 DATAW_hassandriel_events.011.firstSection.andrastian: "Наконец [Select_CString(hassandriel.IsFemale, 'княгиня вняла', 'князь внял' )] голосу разума."
 DATAW_hassandriel_events.011.secondSection: "\n\nВ письме [hassandriel.GetName] называет своё учение Долийской Церковью и призывает нас обратиться, чтобы перед лицом якобы непреодолимой угрозы сохранить культуру."
 DATAW_hassandriel_events.011.secondSection.zealous: "\n\n[Select_CString(hassandriel.IsFemale, 'Эта любительница шемов слишком долго просидела', 'Этот любитель шемов слишком долго просидел' )] за книгами и свитками, чтобы понимать желания долийцев. [Select_CString(hassandriel.IsFemale, 'Она забыла', 'Он забыл' )], что боги — такая же часть нашей культуры, как и традиции, а отказ от них едва ли умилостивит шемов."
 DATAW_hassandriel_events.011.secondSection.cynical: "\n\nПосле недавних событий в Ред-Кроссинге этим шагом Хассандриэль постарается умилостивить людей. Быть может, лишь так удастся успокоить их и спасти Долы."
 DATAW_hassandriel_events.011.secondSection.andrastian: " Наконец Долы вместе с остальным Тедасом объединятся в поклонении Создателю — вере, которую мы оставили после Шартана и переселения на вторую родину. Наконец наша Песнь сольётся с голосами братьев-людей."
 DATAW_hassandriel_events.011.thirdSection.fenarelPeaceful: "\n\nТем временем приходит письмо от других вассалов, призывающих поддержать их против Хассандриэля, [Select_CString(hassandriel.IsFemale, 'которую они называют', 'которого они называют' )] Харелланом. На их сторону встали Изумрудные рыцари; вместе они намерены свергнуть Хассандриэля, как Эльгарнан низверг солнце, — но на сей раз рядом не будет Митал."
 DATAW_hassandriel_events.011.thirdSection.fenarelRebellion: "\n\nТем временем приходит письмо лично от [Select_CString(fenarel.IsFemale, 'Бледной Демоницы', 'Бледного Демона' )], [fenarel.GetFirstName], с призывом выступить против Хассандриэля, [Select_CString(hassandriel.IsFemale, 'которую', 'которого' )] [Select_CString(fenarel.IsFemale, 'она называет', 'он называет' )] Харелланом. [Select_CString(fenarel.IsFemale, 'Она утверждает, что на её стороне', 'Он утверждает, что на его стороне' )] стоят Изумрудные рыцари; вместе они намерены свергнуть Хассандриэля, как Эльгарнан низверг солнце, — но на сей раз рядом не будет Митал."
 DATAW_hassandriel_events.011.thirdSection: "\n\nТеперь, несмотря на этот мятеж, остаётся лишь продолжать переговоры с Орлеем."
 DATAW_hassandriel_events.011.opt.a: "Я присоединюсь к праведному восстанию! Смерть #italic Хареллану#!!"
 DATAW_hassandriel_events.011.opt.a.tooltip: "Хассандриэль больше не заслуживает права стоять во главе Долов. Второй родиной должен править лишь приверженец веры элвенов. #N Вы присоединитесь к восстанию против Хассандриэля! Многие прямые вассалы могут выступить вместе с вами ради защиты веры элвенов, но это не остановит наступление Орлея.#!"
 DATAW_hassandriel_events.011.opt.b: "Сейчас важнее само выживание Долов."
 DATAW_hassandriel_events.011.opt.b.tooltip: "Вы сосредоточитесь на войне с Орлеем, которая может положить конец самим Долам. Другие вассалы восстанут и без вас."
 DATAW_hassandriel_events.011.opt.c: "Я не приму эту веру, но восстание — ошибка."
 DATAW_hassandriel_events.011.opt.c.tooltip: "Несмотря на сомнения, вы останетесь на стороне Хассандриэля. Другие вассалы восстанут и без вас."
 DATAW_hassandriel_events.011.opt.d: "Я верю в Долийскую Церковь Хассандриэля!"
 DATAW_hassandriel_events.011.opt.d.tooltip: " Вы присоединитесь к славному будущему, которое Хассандриэль готовит для эльфийского народа, и, если будет на то воля Создателя, восторжествуете!"

# EVENT 12
 DATAW_hassandriel_events.012.tit: "Долийская Церковь: ожидаемый мятеж"
 DATAW_hassandriel_events.012.firstSection: "Именно этого я и [Select_CString(ROOT.Char.IsFemale, 'ожидала', 'ожидал' )]. Было ясно, что замысел встретит ожесточённое сопротивление — возможно, дойдёт даже до покушения. И всё же размах восстания удивляет даже меня, особенно после бедствия в Ред-Кроссинге."
 DATAW_hassandriel_events.012.firstSection.fenarelPeaceful: "\n\nТеперь Долы воюют с собственным народом. К мятежникам присоединились Изумрудные рыцари, и наши шансы выглядят ничтожными."
 DATAW_hassandriel_events.012.firstSection.fenarelRebellion: "\n\nКровожадность [fenarel.GetFirstName] не удалось сдержать, и после роковой резни она разрушила наше единство. К [Select_CString(fenarel.IsFemale, 'ней', 'нему' )] присоединились Изумрудные рыцари и некоторые мои прямые вассалы, восставшие против моего правления."
 DATAW_hassandriel_events.012.secondSection: "\n\nТеперь, несмотря на этот мятеж, остаётся лишь продолжать переговоры с Орлеем."
 DATAW_hassandriel_events.012.opt.a.fenarel: "#italic [Glossary('Ma banal las halamshir var vhen','Mabanallashalamshirvarvhen_GLOSS')], [fenarel.GetFirstName].#!"
 Mabanallashalamshirvarvhen_GLOSS: "«Ты ничего не делаешь ради будущего нашего народа» — фраза на эльфийском языке."
 DATAW_hassandriel_events.012.opt.a.other: "#italic [Glossary('Emma solas him var din′an','Emmasolashimvardinan_GLOSS')].#!"
 Emmasolashimvardinan_GLOSS: "«Гордыня стала нашей погибелью» — фраза на эльфийском языке."
 DATAW_hassandriel_events.012.opt.a.tooltip: "[orlesianEmperor.GetName] получит ваше письмо с просьбой помочь подавить восстание. Вероятно, Орлей выдвинет свои требования…"

# EVENT 13
 DATAW_hassandriel_events.013.tit: "Долийская Церковь: вместе до конца"
 DATAW_hassandriel_events.013.desc: "«Хассандриэль, я [Select_CString(rajmaelEK.IsFemale, 'пришла', 'пришёл' )] к тебе после странного письма». \n\n[rajmaelEK.GetShortUINameNoTooltipNoFormat|U] произносит эти слова знакомым голосом. Обернувшись, я вижу [Select_CString(rajmaelEK.IsFemale, 'свою подругу', 'своего друга' )] посреди двора. [Select_CString(rajmaelEK.IsFemale, 'Она пришла одна', 'Он пришёл один' )], и то, что в разгар мятежа при [Select_CString(rajmaelEK.IsFemale, 'ней', 'нём' )] всё ещё остаются топор и доспехи, свидетельствует об уважении моих воинов. Но в [Select_CString(rajmaelEK.IsFemale, 'её', 'его' )] глазах нет ненависти, которой можно было бы ожидать от эльфа, столь ревностного в вере. В них лишь непоколебимая решимость. [rajmaelEK.GetShortUINameNoTooltipNoFormat|U] [Select_CString(rajmaelEK.IsFemale, 'избрала', 'избрал' )] самый тяжёлый путь и не свернёт с него, даже если тот приведёт к смерти. \n\n«Ты [Select_CString(ROOT.Char.IsFemale, 'попросила', 'попросил' )] меня отказаться от веры. Меня — [Select_CString(rajmaelEK.IsFemale, 'ту, чьё почтение', 'того, чьё почтение' )] к нашим богам и пыл тебе прекрасно известны. И всё же ты [Select_CString(ROOT.Char.IsFemale, 'позвала', 'позвал' )] меня на помощь». \n\nНесколько мгновений мы смотрим друг другу в глаза — глаза старых друзей, которых терзают противоречивые мысли, чувства и долг. За мой поступок [rajmaelEK.GetShortUINameNoTooltipNoFormat|U] прямо сейчас [Select_CString(rajmaelEK.IsFemale, 'могла бы выхватить', 'мог бы выхватить' )] топор и рассечь мне грудь."
 DATAW_hassandriel_events.013.desc.negative: "\n\nНо [rajmaelEK.GetShortUINameNoTooltipNoFormat|U] лишь отступает, и по щеке медленно катится слеза… Слеза сожаления. \n\n«Надеюсь, мы не встретимся на поле боя, [Select_CString(ROOT.Char.IsFemale, 'подруга моя', 'друг мой' )]». \n\nРазвернувшись, [rajmaelEK.GetShortUINameNoTooltipNoFormat|U] уходит, а я приказываю воинам пропустить [Select_CString(rajmaelEK.IsFemale, 'её', 'его' )]."
 DATAW_hassandriel_events.013.desc.positive: "\n\nНо [rajmaelEK.GetShortUINameNoTooltipNoFormat|U] лишь отступает, и по щеке медленно катится слеза… Слеза радости, смешанной с виной. \n\n#italic «Говори лишь Слово; пой лишь Песнь. Тогда Золотой Город станет твоим, — говорила Андрасте. — Я скажу только одно: говори лишь Слово; пой лишь Песнь. Тогда Золотой Город станет твоим, а я буду рядом».#! \n\n[rajmaelEK.GetShortUINameNoTooltipNoFormat|U] рассказывает, что [Select_CString(rajmaelEK.IsFemale, 'привела', 'привёл' )] с собой нескольких верных Изумрудных рыцарей и что они будут сражаться рядом со мной. \n\n«Я последую за тобой до конца — и в новой вере, и на поле боя»."
 DATAW_hassandriel_events.013.opt.a.negative: "[Select_CString(rajmaelEK.IsFemale, 'Ради старой подруги', 'Ради старого друга' )]."
 DATAW_hassandriel_events.013.opt.a.positive: "До самого горького конца, [Select_CString(rajmaelEK.IsFemale, 'подруга моя', 'друг мой' )]."
 DATAW_hassandriel_events.013.loyalKnights: "Верные рыцари"
 DATAW_hassandriel_events.013.loyalKnights_tt: "Ваши #N верные рыцари#! пришли на помощь!"

# EVENT 14
 DATAW_hassandriel_events.014.tit: "Долийская Церковь: неожиданное предложение переговоров"
 DATAW_hassandriel_events.014.desc: "Такого письма я никак не [Select_CString(ROOT.Char.IsFemale, 'ожидала', 'ожидал' )] увидеть на своём столе, особенно после Ред-Кроссинга. [hassandriel.GetName] сообщает, что после совершенно непредвиденного события в Долах восстала группа вассалов во главе с [war_leader.GetName]. \n\n#italic Хассандриэль [Select_CString(hassandriel.IsFemale, 'обратилась', 'обратился' )] в веру Церкви.#! \n\n[hassandriel.GetName] пишет, что так называемая «Долийская Церковь» призвана вернуть эльфов на путь Андрасте, которым они следовали во времена Шартана. Но принятая [Select_CString(hassandriel.IsFemale, 'ею', 'им' )] Песнь вызвала сильнейшую смуту, и теперь Хассандриэль просит моей помощи. \n\nРазумеется, письмо составлено в ожидании встречных требований: помощь не бывает бесплатной даже между последователями Создателя."
 DATAW_hassandriel_events.014.opt.a: "Неужели [Select_CString(hassandriel.IsFemale, 'она думает', 'он думает' )], что эта мольба заставит нас забыть Ред-Кроссинг?"
 DATAW_hassandriel_events.014.opt.b: "Лишь вассалитет позволит держать их в повиновении и удостовериться в искренности."
 DATAW_hassandriel_events.014.opt.b.tooltip: "Долийская Церковь — приемлемый компромисс, способный принести Песнь эльфам. Но они должны оставаться рядом, чтобы мы могли удостовериться в искренности обращения."
 DATAW_hassandriel_events.014.opt.c: "[Select_CString(ROOT.Char.IsFemale, 'Я всегда готова', 'Я всегда готов' )] помочь [Select_CString(hassandriel.IsFemale, 'сестре-андрастианке, даже если она эльфийка', 'собрату-андрастианину, даже если он эльф' )]."
 DATAW_hassandriel_events.014.opt.c.tooltip: "Жители империи увидят в этом поддержку врага — тех, кто перебил наш народ, а теперь пытается избежать справедливого возмездия притворным обращением. Этот поступок наверняка сделает меня мишенью."

# EVENT 15
 DATAW_hassandriel_events.015.tit: "Долийская Церковь: встречное предложение"
 DATAW_hassandriel_events.015.firstSection: "Обращаясь за помощью к [orlesianEmperor.GetName], я [Select_CString(ROOT.Char.IsFemale, 'ожидала', 'ожидал' )] совершенно немыслимых требований, которые никто не смог бы принять. Однако полученное предложение хотя и сурово, но явно рассчитано на согласие. \n\nВ обмен на помощь Орлей требует вассальной присяги империи. [orlesianEmperor.GetTitleAsNameNoTooltip|l] поясняет: Долийскую Церковь разрешат исповедовать в Долах как местный культ, если Песнь Света не будет звучать со значительными искажениями, магам запретят править, а новая вера признает власть Верховной жрицы. Всё это было учтено ещё при создании учения, поэтому затруднений не возникнет. \n\nИ всё же предложение вассалитета требует тяжёлого выбора. Допустимо ли пожертвовать независимостью Долов, чтобы сохранить власть элвенов над собой? Станет ли это последней жертвой ради спасения культуры — или лишь первой из множества? \n\nТеперь я искренне верю, что принятие Создателя позволит уберечь нашу культуру и повести эльфов вперёд."
 DATAW_hassandriel_events.015.firstSection.cynical: "Это куда лучше безнадёжного застоя в погоне за собственным прошлым."
 DATAW_hassandriel_events.015.secondSection: "\n\nНо не слишком ли высока цена Орлея?"
 DATAW_hassandriel_events.015.opt.a: "Второго Арлатана нельзя допустить любой ценой."
 DATAW_hassandriel_events.015.opt.a.tooltip: "Вы принимаете предложение Орлея и получаете помощь против мятежников! Если Орлей победит, Долы станут его вассалом с договором о защите религиозных прав."
 DATAW_hassandriel_events.015.opt.b: "Этого я отдать не могу…"
 DATAW_hassandriel_events.015.opt.b.tooltip: "Ради сохранения независимости Долов вы отвергаете предложение Орлея и оказываетесь в опасном положении: вам предстоит одновременно сражаться с восстанием элвенов и Орлеем!"

# EVENT 16
 DATAW_hassandriel_events.016.tit: "Долийская Церковь: на стороне империи"
 DATAW_hassandriel_events.016.firstSection.noVassalisation: "Такого решения я никак не [Select_CString(ROOT.Char.IsFemale, 'ожидала', 'ожидал' )]. Только что из Орлея пришло письмо с обещанием безоговорочной поддержки. \n\n«Призыв [Select_CString(ROOT.Char.IsFemale, 'сестры-андрастианки', 'собрата-андрастианина' )] к борьбе против язычников будет услышан независимо от происхождения. Войска Орлея помогут истребить мятежников-язычников, виновных в событиях Ред-Кроссинга, и поддержат братьев-эльфов, следующих за Создателем»."
 DATAW_hassandriel_events.016.firstSection.yesVassalisation: "Решение принято. Я буду сражаться на стороне Орлея против эльфов ради спасения эльфов. Если мы победим, Долы станут вассалом людей ради сохранения власти элвенов над собой. Ирония заставила бы меня рассмеяться, если бы сейчас не решалась судьба моего народа."
 DATAW_hassandriel_events.016.secondSection: "\n\nЖребий брошен. На чаше весов лежит судьба Долов и долийцев на многие века. Столкнулись моё видение будущего эльфов, желание элвенов по-прежнему подражать нашему прошлому и стремление людей заставить Песнь звучать во всех уголках Тедаса. Некоторые из этих устремлений можно примирить, но одно неизбежно останется отвергнутым. \n\nСоздатель, убереги нас от гибели и не дай лишиться второй родины, как некогда мы лишились Арлатана."
 DATAW_hassandriel_events.016.opt.a: "Теперь мы двинемся вперёд — или погибнем в попытке."
 DATAW_hassandriel_events.016.opt.a.tooltip: "Вы сражаетесь на стороне Орлея, чтобы принести Песнь Света в Долы и одновременно сохранить власть эльфов над своей судьбой!"

# Event 17
 DATAW_hassandriel_events.017.tit: "Долийская Церковь: в одиночку против всего мира"
 DATAW_hassandriel_events.017.desc: "Моя ставка не сыграла. От меня отвернулись и собственный народ, и те, ради чьей благосклонности всё затевалось. Я [Select_CString(ROOT.Char.IsFemale, 'оказалась', 'оказался' )] во власти обеих сторон. Вера, призванная их примирить, возможно, лишь приблизила гибель элвенов сильнее, чем можно было предположить. \n\nТеперь моё положение опаснее, чем когда-либо. Воюя одновременно с Орлеем и собственными вассалами во главе с [war_leader.GetName], остаётся лишь ждать и пытаться отсрочить неминуемую смерть. \n\nЯ [Select_CString(ROOT.Char.IsFemale, 'обрекла', 'обрёк' )] наш народ и столько людей и эльфов на гибель. Теперь остаётся лишь беречь жизни немногих верных подданных и вести благородную борьбу, пока меня не настигнет предначертанная насильственная смерть."
 DATAW_hassandriel_events.017.opt.a: "#italic [Glossary('Ma Ghilana mir din′an','MaGhilanamirdinan_GLOSS')], Андрасте.#!"
 DATAW_hassandriel_events.017.opt.a.tooltip: "Теперь вы противостоите и Орлею, и долийским вассалам — в одиночку против всего мира. Ни восстание элвенов, ни война за Долы не прекратятся. Пусть ваша благородная борьба принесёт плоды."
 MaGhilanamirdinan_GLOSS: "«Проводи меня в смерть» — эльфийская фраза, которую часто произносят утратившие желание жить и просящие мир привести их в сладостные объятия смерти."

# Event 18
 DATAW_hassandriel_events.018.tit: "Долийская Церковь: ставка сыграла"
 DATAW_hassandriel_events.018.desc: "Вопреки всему я стою здесь [Select_CString(ROOT.Char.IsFemale, 'победительницей', 'победителем' )]. Реакционеры выступили против меня и пали, а Орлей пришёл на помощь и сражался рядом во имя Создателя. Одни назовут меня [Select_CString(ROOT.Char.IsFemale, 'предательницей, изменившей', 'предателем, изменившим' )] богам своего народа ради личной власти. Другие — [Select_CString(ROOT.Char.IsFemale, 'героиней, приведшей эльфов к Создателю в час величайшей нужды и спасшей', 'героем, приведшим эльфов к Создателю в час величайшей нужды и спасшим' )] вторую родину. \n\nДумаю, отчасти я [Select_CString(ROOT.Char.IsFemale, 'и предательница, и героиня', 'и предатель, и герой' )]. Что бы ни говорили люди, я навсегда [Select_CString(ROOT.Char.IsFemale, 'изменила', 'изменил' )] жизнь эльфов."
 DATAW_hassandriel_events.018.opt.a: "Пусть эта война станет последней угрозой нашему дому."
 DATAW_hassandriel_events.018.opt.a.custom_tooltip: "[Concept('opinion','Мнение')|E] всех последователей веры [GetReligionFamily('rf_elven_paganism').GetName] о #high вас#! снижается на 30. \n[Concept('opinion','Мнение')|E] всех последователей веры [GetReligionFamily('rf_andrastianism').GetName] о #high вас#! повышается на 30."

# Event 19
 DATAW_hassandriel_events.019.tit: "Долийская Церковь: одинокий триумф"
 DATAW_hassandriel_events.019.desc: "Вопреки всему я стою здесь [Select_CString(ROOT.Char.IsFemale, 'победительницей', 'победителем' )]. \n\nРеакционеры выступили против меня и пали. Орлей тоже выступил против меня — и тоже пал. Имя Долийской Церкви, созданной, чтобы люди и эльфы вместе пели её Песнь, отныне навеки связано с одной из самых кровавых войн в истории континента. Одни назовут меня [Select_CString(ROOT.Char.IsFemale, 'предательницей, изменившей', 'предателем, изменившим' )] богам своего народа ради личной власти. Другие — [Select_CString(ROOT.Char.IsFemale, 'героиней, приведшей эльфов к Создателю в час величайшей нужды и спасшей', 'героем, приведшим эльфов к Создателю в час величайшей нужды и спасшим' )] вторую родину. Третьи — [Select_CString(ROOT.Char.IsFemale, 'кровожадной деспоткой, без разбора убивавшей', 'кровожадным деспотом, без разбора убивавшим' )] подданных и людей в погоне за безумной мечтой. \n\nДумаю, отчасти во мне есть всё это. Что бы ни говорили люди, я навсегда [Select_CString(ROOT.Char.IsFemale, 'изменила', 'изменил' )] жизнь эльфов. Моя ставка не сыграла, но Долы выстояли — ценой, которую никогда не следовало платить."
 DATAW_hassandriel_events.019.opt.a: "Пусть никому больше не придётся платить такую цену."
 DATAW_hassandriel_events.019.opt.a.custom_tooltip: "[Concept('opinion','Мнение')|E] всех последователей верований [GetReligionFamily('rf_elven_paganism').GetName] и [GetReligionFamily('rf_andrastianism').GetName] о #high вас#! снижается на 30."

# Event 20
 DATAW_hassandriel_events.020.tit: "Долийская Церковь: ставка проиграна"
 DATAW_hassandriel_events.020.desc: "Моя история должна закончиться здесь. \n\nПытаясь избавить народ от предначертанной судьбы, я [Select_CString(ROOT.Char.IsFemale, 'обрекла', 'обрёк' )] его на гибель. Я [Select_CString(ROOT.Char.IsFemale, 'отреклась', 'отрёкся' )] от своих богов, [Select_CString(ROOT.Char.IsFemale, 'сражалась', 'сражался' )] с собственным народом и [Select_CString(ROOT.Char.IsFemale, 'не сумела', 'не сумел' )] подарить ему надежду на будущее. \n\nЭльфы останутся пленниками прошлого, бесконечно гоняясь за мнимым величием предков, пока кто-нибудь вроде меня вновь не попытается заставить нас идти вперёд."
 DATAW_hassandriel_events.020.opt.a: "Простите меня, Шартан и Андрасте. Я [Select_CString(ROOT.Char.IsFemale, 'подвела', 'подвёл' )] вас."

# Event 21
 DATAW_hassandriel_events.021.tit: "Долийская Церковь: наследие Шартана"
 DATAW_hassandriel_events.021.desc: "Несмотря на все усилия, восторжествовало учение, объявленное наследием Шартана. Безрассудная надежда требовала перекроить нашу культуру в форму, достаточно приятную угнетателям. После нашего поражения эта трагедия укоренилась во всём государстве. \n\nУже сейчас огромная часть элвенов оставила наших богов ради новой Песни — из страха или искренней надежды. Быть может, если склониться достаточно низко, уши окажутся ниже взора орлесианцев. \n\nВосстание потерпело поражение, и верующие вновь закованы в цепи, как при падении Арлатана. Только на сей раз мы держим цепь собственными руками."
 DATAW_hassandriel_events.021.opt.a: "Как глупо ради спасения отказываться от того, что делает тебя собой."

# Event 22
 DATAW_hassandriel_events.022.tit: "Долийская Церковь: восстание подавлено"
 DATAW_hassandriel_events.022.desc: "Наконец восстание подавлено. Противники будущего Долов унижены и остановлены, а их сторонники убиты или прячутся в страхе. \n\nМногие деревни по всему государству уже приняли новую веру из страха перед возмездием, но ещё больше жителей лишь с неохотой мирятся с новым порядком."
 DATAW_hassandriel_events.022.opt.a: "Традиция, сдерживавшая нас, сокрушена."