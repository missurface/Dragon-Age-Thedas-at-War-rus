l_russian:
# EVENT 1
 DATAW_hassandriel_events.001.tit: "Questioning Belief"
 DATAW_hassandriel_events.001.desc: "As I take away my scroll on the rediscovered tales and myths of [ROOT.Char.GetFaith.WaterGodName] to the side and sit myself in front of the endless paperwork of the realm, I think back on the results of my rule. My work as [ROOT.Char.GetTitleAsNameNoTooltip|l] of the Dales has always been set on preserving Elvhen neutrality and peace amidst increasing tensions between the followers of Andraste and that of the Evanuris. Too many times has a human been cast out, or even killed, days before I could do anything to stop it. Too many times has one of my people been converted against their will, or killed for their refusal to do so, without any easy way for me to help or ease their suffering. For decades now, I have done as [ROOT.Char.GetFaith.WaterGodName] would, and guided by example my people, the Orlesians, Borsols and Avvars to greater levels of cooperation and friendship, in the hope of preserving the independence and land we had worked so hard to gain. \n\nYet the Andrastians seem to have forgotten that we desired to create a second Arlathan in this land, and now they see our return to our old faith as a betrayal. As much as I try, Thedas is gearing for war, and [fenarel.GetFirstName] could not be happier. \n\nHave the gods' advice truly been all for naught? Are the gods trapped so thoroughly they cannot even attempt to come to the help of the Elvhen, their people? \n\nAre the gods even real?"
 DATAW_hassandriel_events.001.opt.a: "What a ludicrous thought, of course they are!"
 DATAW_hassandriel_events.001.opt.a.tooltip: "But is there a way to save the Elvhen from the fate that befell us so long ago in Arlathan?"
 DATAW_hassandriel_events.001.opt.b: "The Gods will not preserve us and our culture."
 DATAW_hassandriel_events.001.opt.b.tooltip: "Perhaps in the abandonment of our zealotry we can find a way to save Elvhen culture."


# EVENT 2
 DATAW_hassandriel_events.002.tit: "Questioning Belief: An Unthinkable Blend"
 DATAW_hassandriel_events.002.desc: "It has been months now since I begun asking myself countless questions on the Dales' future. I have thought of a thousand ways of avoiding the war between us and Orlais that seems inevitable, and whatever path I imagine could get to peace, [ROOT.Char.GetFaith.TricksterGodName] guides us back to the way of war.\n\n'Please! I was not forced! My [ROOT.Char.GetTitleAsNameNoTooltip|l], I ask for your mercy!' \n\nAs I emerge from my thoughts, I see a pleading elf in front of me, desperately calling for aid. Beside [pleadingelf.GetHerHim], a human chanter is in chains, forced to kneel before me by an Emerald Knight. My friend [rajmaelEK.GetFirstName] comes and explains. \n\n'This shemlen was caught preaching the word of the Maker in a village near the frontier, discrediting the good words of the Evanuris with the sweetness of [ROOT.Char.GetFaith.TricksterGodNamePossessive] tongue. This poor soul was forced to accept the shem faith, and was probably threatened by the priest's guard, who offered resistance to our arrest. We have taken care of it, my [ROOT.Char.GetTitleAsNameNoTooltip|l], and shall await your judgment of this heathen.' \n\nThe elf, presenting [pleadingelf.GetHerselfHimself] as [pleadingelf.GetName], then advances forward, and begins pleading, almost to the point of tears. [pleadingelf.GetSheHe] tells me that the village has good relations with the nearby humans, despite the ever present tension between our peoples. The priest installed herself in the village, doing simple labour in exchange for lessons in the Elvish tongue. The chanter spoke of Andraste, the Maker and Shartan. The elf tells me that none wished for harm, and that the chanter was welcome in the village. \n\n[pleadingelf.GetName] prays, in the Elvish tongue, for my mercy, along with the Maker's."
 DATAW_hassandriel_events.002.opt.a: "The monk can go free."
 DATAW_hassandriel_events.002.opt.b: "The monk will await my judgment, imprisoned."
 DATAW_hassandriel_events.002.opt.b.custom_tooltip: "All Courtiers who are not [GetTrait('compassionate').GetName( GetNullCharacter )] or [GetTrait('cynical').GetName( GetNullCharacter )] gain 50 [opinion|E] of #high you#!,"
 DATAW_hassandriel_events.002.opt.c: "The monk will be banished, never to return."
 DATAW_hassandriel_events.002.opt.c.custom_tooltip: "All Courtiers who are not [GetTrait('compassionate').GetName( GetNullCharacter )] or [GetTrait('cynical').GetName( GetNullCharacter )] gain 25 [opinion|E] of #high you#!."


# EVENT 3
 DATAW_hassandriel_events.003.tit: "Questioning Belief: The Only Way Out?"
 DATAW_hassandriel_events.003.desc: "Right as I exit the throne room after my judgment on the Chanter, my thoughts immediately turn back to [pleadingelf.GetName], and [pleadingelf.GetHerHis] Andrastian prayer in the Elvish tongue. \n\nAcross all my life, my studies and my rule, I have never seen such an unthinkable blend of customs. An elf, undeniably of Dalish culture and origin, praying to the Maker. The Andrastians have always loathed us for shunning the Maker, in favour of the old Elvhen gods of Arlathan. The problem was never with our tongue and traditions, but with who we worshipped. \n\nAnd now, with this small village of many Dalish customs and a lone Andrastian priest, I begin to form an idea that could save the Elvhen from losing their land and culture once more. \n\nA Chantry made for the Dalish, by the Dalish. A compromise, where we embrace the Maker and His Bride, and keep our soil, our traditions, and our tongue. \n\nCould this be the only way out?"
 DATAW_hassandriel_events.003.opt.a: "It is too late to attempt something like this. Much too late."
 DATAW_hassandriel_events.003.opt.a.tooltip: "You give up on finding a lasting way to peacefully secure the Elvhen's second homeland and prepare for war."
 DATAW_hassandriel_events.003.opt.b: "A Dalish Chantry is the only way to save our culture and home."
 DATAW_hassandriel_events.003.opt.b.tooltip: "You will attempt to create a Dalish Chantry to appease Orlais and the Dalish, in order to secure the Elvhen's second homeland."

# EVENT 4
 DATAW_hassandriel_events.004.tit: "A Painful Resignation"
 DATAW_hassandriel_events.004.desc: "It is a tough choice for one such as I to not even attempt an idea that might bring peace to the Dales, yet it is not the will of my people. I am but their servant, and should not make this choice in their stead, telling them what they should worship in order to secure our lands. \n\nYet, I cannot stop myself from wondering about my people's intent. Do most desire for a war like [fenarel.GetFirstName] does? Do most desire peace in blissful isolation, like I believe it to be so? Most importantly of all, do they refuse to see the coming storm over the horizon, or do they see it, and beg me to act? \n\nAt this point, I must do everything I can to secure the lives of the [elvhen|E]. I could send a heartfelt letter to the [orlesianEmperor.GetName], calling for an emergency meeting to address the tensions and avoid a war that would kill thousands. This could be the only way to avoid the coming storm, and save elvhen and human lives alike. The alternative, which I dread to consider, is to begin gearing for war. [fenarel.GetName] has sought this for a long time, and yet I know that if this is done, it will only make the war a certainty. \n\nBoth would be breaking the Dales' neutrality that has been upheld for so long, and yet I feel like this is an acceptable sacrifice, one of many my people must make in the coming days."
 DATAW_hassandriel_events.004.opt.a: "I will arrange a meeting with [orlesianEmperor.GetName]."
 DATAW_hassandriel_events.004.opt.a.tooltip: "I can only pray that the letter reaches Val Royeaux, and that Orlais listens, for they crave no more war as I."
 DATAW_hassandriel_events.004.opt.b: "I must listen to [fenarel.GetFirstName], and gear for war."
 DATAW_hassandriel_events.004.opt.b.tooltip: "Although it pains me to admit it, war is the only thing coming, and we must be prepared."

# EVENT 5
 DATAW_hassandriel_events.005.tit: "A Painful Resignation: A Deafening Silence"
 DATAW_hassandriel_events.005.desc: "It has been three months now, and despite my cry for help in my letter to Orlais, I have received no answer, be it good or bad. Such silence could mean many things. Perhaps the letter was lost during the journey, and never reached the city of Val Royeaux. Perhaps the messenger was unable to deliver it, due to an ambush or a guard refusing to let an elf enter the capital of Andrastianism. I have sent three more letters in the last few months in the hope that one reaches Val Royeaux officials, to no avail. \n\nWhatever the case, the meeting will never be. The only thing left to prepare for is war."
 DATAW_hassandriel_events.005.opt.a: "#italic [Glossary('Fen′Harel Var Ghilana','FenHarelVarGhilana_GLOSS')].#!"
 FenHarelVarGhilana_GLOSS: ""Dread Wolf guides us", a common elven saying that implies things are headed for the worst."

# EVENT 6
 DATAW_hassandriel_events.006.tit: "A Painful Resignation: The Clashes and Tears of War"
 DATAW_hassandriel_events.006.desc: "Three months have passed since I have asked [fenarel.GetFirstName] and my vassals to arm themselves for war. Today, he has come along with a few of his followers to present to me a part of his army as proof of his militarization efforts. As he leads me to the courtyard, I can see a regiment of [Glossary('Mi′adahlen','Miadahlen_GLOSS')], all arranged in a formation as perfect as the sunrise. \n\nAs he arrives, I can see [fenarel.GetFirstName] raising a hand and shouting to his soldiers. \n\n#italic “[Glossary('Vir enasalin','Virenasalin_GLOSS')]!”#! \n\nThe regiment replies back, calling for victory against an enemy that could've been so much more. They yell in confidence of their victory and claim their loyalty to me, and yet all I can do is look at them, and weep. \n\nThis never had to be. \n\nSo many of those faces I see, and so many more I can't, will not survive the oncoming battles. [fenarel.GetFirstName] looks at me, his eyes filled with an unending bloodlust that is dying to be unleashed."
 Virenasalin_GLOSS: "An elven war cry meaning "We will win"."
 Miadahlen_GLOSS: "The Mi'adahlen, or the Wood's Blade, are a numerous guard at the service of the Dales, with the explicit task of dealing with crime, incursions and more. Despite their permissive standards of training, they are expected to be battle ready at all times, all throughout the Dales."
 DATAW_hassandriel_events.006.opt.a: "#italic [Glossary('Vir Ghilas vir banal','VirGhilasvirbanal_GLOSS')].#!"
 VirGhilasvirbanal_GLOSS: ""Where we are going is terrible.", in elven."
# EVENT 7
 DATAW_hassandriel_events.007.tit: "The Dalish Chantry: A Desperate Conception"
 DATAW_hassandriel_events.007.firstSection: "It has only been a day since I have made this decision, and yet it feels like a decade. All day, I have locked myself inside my study along with [chaplain.GetName], and have toiled for hours, scouring every record, text and story on both the Dalish and Andrastians to create a faith to save the Dales. \n\nIn order to avoid the ire of Orlais, we will recognize their Divine and her authority regarding the Maker and Andraste's word. As such, the Divine will be able to excommunicate us should she wish. We must pray this power over us will appease them, and encourage the Dalish to truly embrace Andrastianism. We must also avoid taking their militaristic stance, as that would only fuel tensions further. \n\nAs for the rest, the tales of the Andrastian canon where the Elvhen played an important part, such as Shartan's rebellion and campaigns alongside Andraste, as well as Maferath giving us the Dales as our new homeland, will be included and paramount in the effort for the Chantry to take root among the Dalish. Let us pray that our valorisation of elven culture will reassure the elves that this is not an abandonment of Dalish culture, but simply an evolution."
 DATAW_hassandriel_events.007.firstSection.cynical: "This should pull us out of our self-imposed stagnation, allowing us to step toward a future where we endure and survive."
 DATAW_hassandriel_events.007.secondSection: "\n\nNow, [chaplain.GetName] pulls out [chaplain.GetHerHis] head of [chaplain.GetHerHis] book, and looks at me."
 DATAW_hassandriel_events.007.secondSection.zealous: "\n\n“We are nearly done with this… foolish idea of yours, my liege. Now, only the last major principle of the Chantry is necessary to make. I will leave this choice to you.”"
 DATAW_hassandriel_events.007.secondSection.normal: "\n\n“My liege, only the last major principle of the Chantry is necessary to conceptualize before we are done. I will leave this choice to you.”"
 DATAW_hassandriel_events.007.opt.a: "We will preserve our veneration of celebrations and feasts."
 DATAW_hassandriel_events.007.opt.a.tooltip: "The Dalish Chantry will adopt [GetFaithDoctrine('tenet_ritual_celebrations').GetBaseName] as its last tenet."
 DATAW_hassandriel_events.007.opt.b: "Our respect for nature must be preserved."
 DATAW_hassandriel_events.007.opt.b.tooltip: "The Dalish Chantry will adopt [GetFaithDoctrine('tenet_sanctity_of_nature').GetBaseName] as its last tenet."
 DATAW_hassandriel_events.007.opt.c: "Encouraging flexibility will ensure our survival."
 DATAW_hassandriel_events.007.opt.c.tooltip: "The Dalish Chantry will adopt [GetFaithDoctrine('tenet_adaptive').GetBaseName] as its last tenet."

# EVENT 8
 DATAW_hassandriel_events.008.tit: "The Dalish Chantry: May it never need be Born"
 DATAW_hassandriel_events.008.desc: "It has been done. The Dalish Chantry, in its entirety, has been conceived and created for wider worship, should we need it. For now, I will keep it sealed and hidden, as only [chaplain.GetName] and I know of this plan, which, if revealed prematurely, could fester untold unrest through the Dales. \n\nWe must be careful, and for now, I will attempt my best to promote peace with the humans of Orlais and the Frostbacks, while preparing the Dalish to embrace the idea of forsaking their faith for the sake of our culture. It will not be easy, but I hope that this way, the Dales can be saved."
 DATAW_hassandriel_events.008.desc.cynical: "\n\nI would pray that I never have to resort to it, but I know, deep inside, that those prayers would be futile."
 DATAW_hassandriel_events.008.opt.a: "#italic [Glossary(' Melana en athim las enaste','Melanaenathimlasenaste_GLOSS')]#!"
 Melanaenathimlasenaste_GLOSS: ""May humility grant favor", in the elven tongue. A saying implying that staying humble is the right way to proceed."
 DATAW_hassandriel_events.008.opt.a.tooltip: "Your relation with the ruler of Orlais could make or break the reception of the Dalish Chantry, if it ever comes to be. It would be wise to appease Orlais, in case of hostilities."

# EVENT 9
 DATAW_hassandriel_events.009.tit: "The Dalish Chantry: A Bloody and Messy Birth"
 DATAW_hassandriel_events.009.firstSection: "It has been almost an hour now. An hour in which I have stared at this scroll, that could be the saving grace of my people, or its doom. Either way, the choice is mine to make... And it terrifies me."
 DATAW_hassandriel_events.009.firstSection.notCynical: "\n\nIs that how Elgar'nan felt every time he talked to Fen'Harel?"
 DATAW_hassandriel_events.009.secondSection: "I could throw this scroll into the fire, along with this notion. Yet, something holds me back. The thought of the Dalish Chantry, and how it could save us. If the Dales do not defeat Orlais swiftly, we are doomed. If the Dales do nothing, we are doomed. Our chance of victory is slim, and does not allow for error. Furthermore, winning only guarantees our independence in the short term. It also promises unrest, revanchism, and even more death for all involved. \n\nIs it worth the price? Should I allow my people to die and kill in countless numbers, only for the promise of more slaughter and death in the future? \n\nNo. Now is the time of the Dalish Chantry. The time where the Elvhen can and will move forward and out of our past that haunts us so, and into a bright, new future. A future where the Elvhen are undeniably in power, strong, and with their culture preserved. A gamble that could raise the elves ever upwards. \n\nNow is the time, and Maker willing, we shall walk alongside Shartan, and accept the Chant of Light. \n\n“Truly, the Maker has called you, just as He called me, To be a Light for your People.” Said the Maker's Bride to Shartan."
 DATAW_hassandriel_events.009.opt.a: "#italic [Glossary(' Ir vir Ghilana','irvirghilana_GLOSS')]#!"
 irvirghilana_GLOSS: "An elven sentence which roughly translates to "I will guide us"."
 DATAW_hassandriel_events.009.opt.a.tooltip: "The Pale Demon will no doubt despise this declaration, and your conversion will have consequences."

# EVENT 10
 DATAW_hassandriel_events.010.tit: "The Dalish Chantry: Shartan's Would-Be Successor"
 DATAW_hassandriel_events.010.desc: "The letter I have received on my desk, here in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], could only have taken me by surprise. \n\n[hassandriel.GetName], our prince, converting to the Chantry? The sacrilege; the betrayal is immeasurable. \n\nThe fact he calls it a Dalish Chantry, and calls for us to convert as a way to preserve our culture in the face of what he sees as impossible odds, only adds insult to injury, and shows how disconnected he is. \n\nThis shem-lover has spent too long in his books and scrolls to understand what the Dalish want. He has forgotten that our gods are as much part of our culture as our traditions, and that giving them up will do little to appease the shems. And why should we appease them? Shouldn't we finally fight back, and slaughter as much as we desire as payback for millennia of suffering? \n\nThe Dales need to stand strong. The Elvhen need to stand strong, and blood must be shed for this strength to be shown. Hassandriel has forgotten what it means to be Elvhen, and now would have us reach for the hands of those that hate us. All in hopes that they prove willing to co-exist. A fool's hope. \n\nNow is the time for elves to stand straight, fight, and win."
 DATAW_hassandriel_events.010.opt.a: "#italic [Glossary('Ir emah′la shal, harrelan','Iremahlashalharrelan_GLOSS')]!#!"
 Iremahlashalharrelan_GLOSS: ""I will kill you, traitor!", in elven."
 DATAW_hassandriel_events.010.opt.a.tooltip: "[hassandriel.GetName] can no longer be trusted to rule the Dales, and as such only a ruler of Elvhen faith, such as you, should rule the second homeland. #N You will start a rebellion against Hassandriel! Many direct vassals could join you in defense of the Elvhen faith, but that won't stop Orlais' advance.#!"
 DATAW_hassandriel_events.010.opt.b: "The Dales need my blade against Orlais more than ever."
 DATAW_hassandriel_events.010.opt.b.tooltip: "Despite your doubts, you will keep to [hassandriel.GetName]'s side. Other vassals may revolt even without you."

# EVENT 11
 DATAW_hassandriel_events.011.tit: "The Dalish Chantry: Shartan's Would-Be Successor"
 DATAW_hassandriel_events.011.firstSection: "The letter I have received on my desk, here in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], could only have taken me by surprise. \n\n[hassandriel.GetName], our prince, converting to the Chantry?"
 DATAW_hassandriel_events.011.firstSection.zealous: "The sacrilege; the betrayal is immeasurable."
 DATAW_hassandriel_events.011.firstSection.cynical: "A bold move, one that could save the Dales from extinction by pleasing the humans."
 DATAW_hassandriel_events.011.firstSection.andrastian: "Finally, the Prince sees reason."
 DATAW_hassandriel_events.011.secondSection: "\n\nIn his letter, he calls it a Dalish Chantry, and calls for us to convert as a way to preserve our culture in the face of what he sees as impossible odds."
 DATAW_hassandriel_events.011.secondSection.zealous: "\n\nThis shem-lover has spent too long in his books and scrolls to understand what the Dalish want. He has forgotten that our gods are as much part of our culture as our traditions, and that giving them up will do little to appease the shems."
 DATAW_hassandriel_events.011.secondSection.cynical: "\n\nThrough this move, Hassandriel will do his best to appease the humans in the wake of the recent Red Crossing, and it may be the only way to please them enough to save the Dales."
 DATAW_hassandriel_events.011.secondSection.andrastian: "The Dales will at last be united along with the rest of Thedas in its worship of the Maker, a worship which was abandoned after Shartan and our arrival in our second homeland. Finally, we shall sing the Chant along with our human brethren."
 DATAW_hassandriel_events.011.thirdSection.fenarelPeaceful: "\n\nOn the side, I have received a letter from fellow vassals, calling for my support against Hassandriel, the one they call Harellan. They declare that on their side are the Emerald Knights, and that together we shall depose Hassandriel the way Elgar'nan did with the sun, only this time, no Mythal shall be present."
 DATAW_hassandriel_events.011.thirdSection.fenarelRebellion: "\n\nOn the side, I have received a letter from the Pale Demon himself, [fenarel.GetFirstName], calling for my support against Hassandriel, the one he calls Harellan. He declares that on his side are the Emerald Knights, and that together we shall depose Hassandriel the way Elgar'nan did with the sun, only this time, no Mythal shall be present."
 DATAW_hassandriel_events.011.thirdSection: "\n\nNow, I have little choice to still go forward in the negotiations with Orlais, with the added stake of this rebellion."
 DATAW_hassandriel_events.011.opt.a: "I shall join this righteous rebellion! Death to the #italic Harellan#!!"
 DATAW_hassandriel_events.011.opt.a.tooltip: "Hassandriel can no longer be trusted to rule the Dales, and as such only a ruler of Elvhen faith, should rule the second homeland. #N You will join a rebellion against Hassandriel! Many direct vassals may join you in defense of the Elvhen faith, but that won't stop Orlais' advance.#!"
 DATAW_hassandriel_events.011.opt.b: "We have greater priorities right now, like the Dales' very survival."
 DATAW_hassandriel_events.011.opt.b.tooltip: "You will focus on the war with Orlais, which could spell the end of the Dales itself. Other vassals will revolt even without you."
 DATAW_hassandriel_events.011.opt.c: "I won't convert to this, but this rebellion is a mistake."
 DATAW_hassandriel_events.011.opt.c.tooltip: "Despite your doubts, you will keep to Hassandriel's side. Other vassals will revolt even without you."
 DATAW_hassandriel_events.011.opt.d: "I trust in Hassandriel's Dalish Chantry!"
 DATAW_hassandriel_events.011.opt.d.tooltip: " You will join Hassandriel's glorious future for elvenkind, and Maker willing, you will triumph!"

# EVENT 12
 DATAW_hassandriel_events.012.tit: "The Dalish Chantry: An Expected Revolt"
 DATAW_hassandriel_events.012.firstSection: "I expected this. I expected there to be some great deal of pushback against the idea. Perhaps even a murder attempt. Yet this is a rebellion on a scale that surprises even me, considering the ordeal we face in the wake of Red Crossing."
 DATAW_hassandriel_events.012.firstSection.fenarelPeaceful: "\n\nNow the Dales is at war with its own people. The Emerald Knights have joined them, and the odds for us look dire."
 DATAW_hassandriel_events.012.firstSection.fenarelRebellion: "\n\n[fenarel.GetFirstName]'s bloodlust could not be contained, and has led him to this destruction of our unity after this fateful massacre. The Emerald Knights have joined him, as well as some of my direct vassals, in rebellion to my rule."
 DATAW_hassandriel_events.012.secondSection: "\n\nNow, I have little choice to still go forward in the negotiations with Orlais, with the added stake of this rebellion."
 DATAW_hassandriel_events.012.opt.a.fenarel: "#italic [Glossary('Ma banal las halamshir var vhen','Mabanallashalamshirvarvhen_GLOSS')], [fenarel.GetFirstName].#!"
 Mabanallashalamshirvarvhen_GLOSS: ""You do nothing to further our people." in the elven tongue."
 DATAW_hassandriel_events.012.opt.a.other: "#italic [Glossary('Emma solas him var din′an','Emmasolashimvardinan_GLOSS')].#!"
 Emmasolashimvardinan_GLOSS: ""Arrogance became our end." in elven."
 DATAW_hassandriel_events.012.opt.a.tooltip: "You will send a letter to [orlesianEmperor.GetName] in order to help deal with this revolt. It is likely that Orlais will have demands…"

# EVENT 13
 DATAW_hassandriel_events.013.tit: "The Dalish Chantry: Together until the End"
 DATAW_hassandriel_events.013.desc: "“Hassandriel, I come to you having received a strange letter.” \n\nThe voice I know comes from [rajmaelEK.GetShortUINameNoTooltipNoFormat|U]'s mouth, my friend, as I turn and see him in the middle of my courtyard. He comes alone, and the fact he still has his axe and armour in this time of rebellion is a testament to the respect my soldiers have for him. But I see no hatred in his eyes as I would have expected from someone as zealous as him. I only see the eyes of someone resolute in his decision. He has taken the hardest path he could, and will not deviate from its course, even if it kills him. \n\n“You have asked me to abandon my faith. Me, who you know worships our gods with so much reverence and zeal, yet you still called for my aid.” \n\nA moment passes as our eyes lock on to one another; the eyes of old friends, tormented by our conflicting thoughts, emotions and duties. He could draw his axe and cleave it through my chest right now for what I did."
 DATAW_hassandriel_events.013.desc.negative: "\n\nYet, he only pulls away, a tear slowly dripping from his eye… A tear of regret. \n\n“I hope I will not meet you on the battlefield, friend.” \n\nAs he turns around and leaves, I order my soldiers to let him pass."
 DATAW_hassandriel_events.013.desc.positive: "\n\nYet, he only pulls away, a tear slowly dripping from his eye… A tear of joy, mixed with guilt. \n\n#italic “Speak only the Word; sing only the Chant. Then the Golden City is thine, spoke Andraste. I will say only one thing. Speak only the Word; sing only the Chant. Then the Golden City is thine, and I shall be yours.”#! \n\nHe explains to me that he brought with him a few Emerald Knights loyal to him, and that they will fight with me. \n\n“I will follow you to the end, in this new faith, and on the battlefield.”"
 DATAW_hassandriel_events.013.opt.a.negative: "For the sake of an old friend."
 DATAW_hassandriel_events.013.opt.a.positive: "To the bitter end, my friend."
 DATAW_hassandriel_events.013.loyalKnights: "Loyal Knights"
 DATAW_hassandriel_events.013.loyalKnights_tt: "Your #N Loyal Knights#! have come to aid you!"

# EVENT 14
 DATAW_hassandriel_events.014.tit: "The Dalish Chantry: An Unexpected Offer of Negotiation"
 DATAW_hassandriel_events.014.desc: "Well, there is a letter I didn't expect to arrive on my desk, especially after Red Crossing. It is a letter from [hassandriel.GetName], where he informs me that a group of vassals, led by [war_leader.GetName], have been rebelling in the Dales after an event I couldn't have anticipated. \n\n#italic Hassandriel has converted to the Chantry.#! \n\nHe tells me that his “Dalish Chantry”, as he calls it, is his way of bringing back the elves to the ways of Andraste, as they once were when they were following Shartan. Yet, him singing the Chant has brought much unrest, and he now calls for my aid. \n\nOf course, the letter is written expecting a demand; for aid isn't free, even amongst followers of the Maker."
 DATAW_hassandriel_events.014.opt.a: "Does he think this plea will make us look past Red Crossing?"
 DATAW_hassandriel_events.014.opt.b: "Vassalization is the only way to keep them in check and assure they are sincere."
 DATAW_hassandriel_events.014.opt.b.tooltip: "The Dalish Chantry is an acceptable compromise to bring the chant to the elves, yet we must keep them close to assure that their conversion is sincere."
 DATAW_hassandriel_events.014.opt.c: "I am always ready to help a fellow Andrastian, even if they are elven."
 DATAW_hassandriel_events.014.opt.c.tooltip: "The people of the Empire will see me as supporting the enemy, supporting those who slaughtered our people and now attempt to avoid rightful retribution with this attempt at conversion. No doubt this action will paint a target on my back."

# EVENT 15
 DATAW_hassandriel_events.015.tit: "The Dalish Chantry: A Counter-Offer"
 DATAW_hassandriel_events.015.firstSection: "After my call for aid to [orlesianEmperor.GetName], I expected to have a frankly quite impossible number of demands, unacceptable to anyone. Yet the offer, while heavy, is not one made expecting refusal. \n\nIt asks for vassalization to the Empire in exchange for aid. The [orlesianEmperor.GetTitleAsNameNoTooltip|l] clarifies that the Dalish Chantry will be allowed as a regional cult of the Dales, so long as the Chant of Light is sung without any strong deviation, that the mages be not allowed to rule and that it recognizes the authority of the Divine. As all of this had already been accounted for in its conception, that will not be an issue. \n\nYet, the offer of vassalization is still a difficult choice. Is the end of Dalish independence an acceptable sacrifice in the name of protecting the Elvhen's rule over themselves? Is this the last sacrifice needed to save our culture, or one amongst many to follow? \n\nI now truly believe that embracing the Maker is the way to safeguard our culture, and push the elves forward."
 DATAW_hassandriel_events.015.firstSection.cynical: "A much better choice than to stagnate in a hopeless pursuit of our own past."
 DATAW_hassandriel_events.015.secondSection: "\n\nBut is the price that Orlais offers too high?"
 DATAW_hassandriel_events.015.opt.a: "A second Arlathan must be avoided at all costs."
 DATAW_hassandriel_events.015.opt.a.tooltip: "You accept Orlais' offer, obtaining aid against the rebels! If Orlais wins, The Dales will become a vassal of Orlais, with the religious protection contract."
 DATAW_hassandriel_events.015.opt.b: "This, I cannot give away..."
 DATAW_hassandriel_events.015.opt.b.tooltip: "You refuse Orlais' offer for the ideal of preserving Dalish independence, leaving you in the precarious position of fighting the Elvhen Rebellion and Orlais!"

# EVENT 16
 DATAW_hassandriel_events.016.tit: "The Dalish Chantry: On the Side of the Empire"
 DATAW_hassandriel_events.016.firstSection.noVassalisation: "I couldn't have expected this decision. I have just received a letter from Orlais, telling me of their unconditional support. \n\n“The call of a fellow Andrastian against heathens shall be answered, no matter their race. The forces of Orlais will help cull the heathen rebels responsible for Red Crossing, and help their elven siblings that follow the Maker.”"
 DATAW_hassandriel_events.016.firstSection.yesVassalisation: "It has been done. I will fight on Orlais' side, against the elves, for the sake of the elves. And if we succeed, The Dales shall become a vassal of the humans, for the sake of preserving our rule. The irony would make me laugh if the situation wasn't so decisive for my people's fate."
 DATAW_hassandriel_events.016.secondSection: "\n\nNow the die has been cast, and the fate of the Dales, and the Dalish for centuries to come hangs in the balance. A struggle between my vision of the elves' future, the Elvhen that still want to emulate our past, and the humans that only desire for the Chant to sing across the four corners of Thedas. Some of those views can be reconciled, but one will always be left out. \n\nMaker save us from extinction, from avoiding the loss of our second homeland, like we lost Arlathan so long ago."
 DATAW_hassandriel_events.016.opt.a: "Now, we move forward or die trying."
 DATAW_hassandriel_events.016.opt.a.tooltip: "You now fight on Orlais' side to bring the Chant of Light to the Dales, while preserving the Elves' rule over themselves!"

# Event 17
 DATAW_hassandriel_events.017.tit: "The Dalish Chantry: Alone Against the World"
 DATAW_hassandriel_events.017.desc: "My gamble failed. Abandoned by both my people and those I wished to court, I find myself at the mercy of both, with a faith that was crafted to appease both, but which may have spelled the Elvhen's downfall even quicker than I predicted. \n\nNow, I find myself in a more precarious position than ever. At war with both Orlais and my vassals led by [war_leader.GetName], I can only wait and attempt to delay the lethal fate that awaits me. \n\nI have doomed our people. I have condemned so many humans and elves to their death. Now, the only thing that I have left to do is preserve the lives of my few subjects still loyal to me, and lead the hellathen until I inevitably encounter the violent death that I am destined to meet."
 DATAW_hassandriel_events.017.opt.a: "#italic [Glossary('Ma Ghilana mir din′an','MaGhilanamirdinan_GLOSS')], Andraste.#!"
 DATAW_hassandriel_events.017.opt.a.tooltip: "You now stand against both Orlais and your Dalish vassals, alone against the world. The Elvhen Rebellion and the War of the Dales will both not relent, and may your noble struggle be a fruitful one."
 MaGhilanamirdinan_GLOSS: ""Guide me into death" in elven. A phrase often used by those who no longer crave to live, and ask the world to lead them to the sweet embrace of death."

# Event 18
 DATAW_hassandriel_events.018.tit: "The Dalish Chantry: The Gamble's Success"
 DATAW_hassandriel_events.018.desc: "Against the odds, I stand victorious. Reactionaries fought against me and fell, as Orlais came in and fought by my side, in the name of the Maker. People will claim I am a traitor, one that betrayed the gods of my people for my own power. Others will claim I am a hero, who brought the Maker to the elves in the time they needed it most, and avoided the loss of our second homeland. \n\nI believe I am both of these, at least in part. No matter what people shall believe, I have changed the lives of the elves forever."
 DATAW_hassandriel_events.018.opt.a: "May this war be the last that threatens our home."
 DATAW_hassandriel_events.018.opt.a.custom_tooltip: "All followers of [GetReligionFamily('rf_elven_paganism').GetName] lose 30 [opinion|E] of #high you#!. \nAll followers of [GetReligionFamily('rf_andrastianism').GetName] gain 30 [opinion|E] of #high you#!."

# Event 19
 DATAW_hassandriel_events.019.tit: "The Dalish Chantry: Alone and Victorious"
 DATAW_hassandriel_events.019.desc: "Against all odds, I stand victorious. \n\nReactionaries fought against me and fell. Orlais fought against me and fell as well. The name of the Dalish Chantry, which was made to be sung by humans and elves alike, will now forever be synonmyous with one of the bloodiest wars the continent has ever seen. People will claim I am a traitor, one that betrayed the gods of my people for my own power. Others will claim I am a hero, who brough the Maker to the elves in the time they needed it most, and avoided the loss of our second homeland. Some even will claim I am a bloodthirsty tyrant, who slaughtered subjects and humans indiscriminately, in the search for a foolish dream. \n\nI believe I am all of these, at least in part. No matter what people shall believe, I have changed the lives of the elves forever. My gambit failed, and yet the Dales survived, at a cost that should never have been paid."
 DATAW_hassandriel_events.019.opt.a: "May none have to pay this price ever again."
 DATAW_hassandriel_events.019.opt.a.custom_tooltip: "All followers of [GetReligionFamily('rf_elven_paganism').GetName] and [GetReligionFamily('rf_andrastianism').GetName] lose 30 [opinion|E] of #high you#!."

# Event 20
 DATAW_hassandriel_events.020.tit: "The Dalish Chantry: The Gambit's Failure"
 DATAW_hassandriel_events.020.desc: "My story should end here. \n\nIn my search for escape from the fate of my people, I have doomed them. I have forsaken my gods, fought my people, and failed in my quest to give them a future to hope for. \n\nThe Elves shall stay stuck in the past, in endless pursuit of the supposed greatness of our ancestors, until someone like me tries once again to make us move on."
 DATAW_hassandriel_events.020.opt.a: "I am sorry, Shartan, Andraste, for I have failed you."

# Event 21
 DATAW_hassandriel_events.021.tit: "The Dalish Chantry: Shartan's Successor"
 DATAW_hassandriel_events.021.desc: "Despite our efforts, Shartan's self-proclaimed successor has triumphed. This bearer of a foolish hope desired to cleave our culture into a shape pleasing enough for our oppressors. With our defeat, this tragedy is entrenched across the realm. \n\nAlready, vast swathes of the Elvhen have abandoned our gods in favour of his chant, out of fear or genuine hope. Perhaps if they bow low enough, their ears will fall below the Orlesian's gaze. \n\nOur rebellion has failed, and the faithful lie once again in chains, as it was when Arlathan fell. Only this time, the chain rests in our own hands."
 DATAW_hassandriel_events.021.opt.a: "How foolish it is to abandon what makes you to save yourself."

# Event 22
 DATAW_hassandriel_events.022.tit: "The Dalish Chantry: The Rebellion Crushed"
 DATAW_hassandriel_events.022.desc: "Finally, the rebellion has been crushed. Those who stood against the Dales' future have been humbled and stopped. Those that rose in support, dead or cowering. \n\nAlready, many villages across the realm have converted out of fear of retribution, but many more still begrudgingly accept the new status quo."
 DATAW_hassandriel_events.022.opt.a: "The tradition that held us back has been crushed."