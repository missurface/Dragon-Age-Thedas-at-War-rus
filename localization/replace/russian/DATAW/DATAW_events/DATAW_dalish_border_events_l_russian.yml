l_russian:
 dalish_border_events.001.t: "Неожиданное возвращение"
 dalish_border_events.001.dalish: "В последнее время при дворе у всех на устах одна жуткая история. Один из слуг услышал о семье долийских торговцев, которую убили по дороге домой после торговли в [GetTitleByKey('c_halamshiral').GetBaseNameNoTier]. Знавшие семью крестьяне нашли останки, но среди них не было одного из детей. Несколько недель жители деревни безуспешно искали пропавшего ребёнка, пока однажды тот сам не вернулся — раненый и едва живой. Вскоре в нападении уже винили орлесианских разбойников.\n\nЭта история и множество подобных ей будоражат воображение придворных, обрастая всё более невероятными подробностями с каждым новым пересказом. На торговцев мог напасть дикий зверь, но не менее вероятно, что орлесианские разбойники решили послать остальным жителям Долов предостережение. Если [Concept('shemlen','шемлены')|E] и вправду осмелели настолько… что тогда ждёт [Concept('elvhen','элвенов')|E]?"
 dalish_border_events.001.orlesian: "Тревожная история завладела вниманием моего двора. Ходят слухи, будто по дороге в [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier] разбойники убили семью торговцев, однако одного из детей на месте кровавой расправы не оказалось. Жители окрестной деревни несколько недель искали ребёнка, не находя ни следа, пока однажды тот не вернулся сам — потрясённый, но живой.\n\nСлух уже будоражит воображение придворных и крестьян. Последние утверждают, что разбойники, вырезавшие семью торговцев, на самом деле были [Concept('elves','эльфами')|E] из Долов. Слушая пересказ одного из слуг, я замечаю, как голос рассказчика становится всё громче и горячее при словах о причастности [Concept('elves','эльфов')|E].\n\nСлухи принимают всё новые, всё более невероятные формы, и мне предстоит решить, как поступить. С одной стороны, разбой — бедствие, от которого страдает слишком много путников на дорогах Орлея. Это могло быть обычное нападение бандитов. Но [Concept('elves','эльфы')|E] давно тяготятся нашим влиянием, и вполне возможно, что они или кто-то из их отщепенцев напали на торговцев, желая передать послание. Если они способны ударить так глубоко в сердце Орлея… что это значит для нас?"
 dalish_border_events.001.desc: "Рассказы о насилии на дорогах Орлея и Долов повергли мой двор в смятение. В одном говорится о долийской семье, убитой по пути в Халамширал, в другом — об орлесианских торговцах, погибших по дороге в [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier].\n\nРазбойники похитили детей из обеих семей, однако пленникам удалось бежать и вернуться домой.\n\nТеперь жители обеих стран обвиняют в дорожном насилии разбойников из-за границы. К несчастью, с каждым днём подобных историй становится всё больше."
 dalish_border_events.001.a: "По-моему, мы слишком торопимся с выводами."
 dalish_border_events.001.b: "Это обернётся новым кровопролитием."
 dalish_border_events.001.c: "Доказательств нет. Орлесианцы не виноваты!"
 dalish_border_events.001.d: "Доказательств нет. Эльфы не виноваты!"
 dalish_border_events.001.e: "Худшее ещё впереди."
 cultural_acceptance_lowered: "Рост культурной напряжённости"
 cultural_acceptance_raised: "Ослабление культурной напряжённости"
 dalish_border_events.002.t: "Напряжённость растёт"
 dalish_border_events.002.dalish: "Мой краткий отдых в уединённом саду прерывает слуга, который спешит ко мне с неотложными вестями и губит тихий день. #italic [Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )], [chancellor.GetName|U] [Select_CString(chancellor.IsFemale, 'привезла', 'привёз' )] вести с границы Орлея и настоятельно просит аудиенции.#! Оказавшись в зале, [chancellor.GetName] рассказывает, что орлесианский посланник дерзко потребовал встречи с мелким владетелем пограничных земель. Того обвинили в набегах на орлесианские деревни и даже в похищении человеческих детей для ритуалов магии крови.\n\nДрожащим голосом [chancellor.GetName] произносит: #italic «Растут опасения, что вскоре Орлей нанесёт ответный удар, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )]».#! По испарине на лбу видно, как сильно нервничает [chancellor.GetName]. После аудиенции эти слова продолжают звучать у меня в голове. Неужели орлесианцы и их [Concept('chantry','Церковь')|E] действительно нарушат обещание, данное [Concept('elves','эльфам')|E]?"
 dalish_border_events.002.dalish.alt: "Мой краткий отдых в уединённом саду прерывает слуга, который спешит ко мне с неотложными вестями и губит тихий день. #italic [Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )], [Select_CString(scholar.IsFemale, 'известная местная учёная', 'известный местный учёный' )] [scholar.GetName|U] [Select_CString(scholar.IsFemale, 'привезла', 'привёз' )] вести с границы Орлея и настоятельно просит аудиенции.#! Оказавшись в зале, [scholar.GetName] рассказывает, что орлесианский посланник дерзко потребовал встречи с мелким владетелем пограничных земель. Того обвинили в набегах на орлесианские деревни и даже в похищении человеческих детей для ритуалов магии крови.\n\nДрожащим голосом [scholar.GetName] произносит: #italic «Растут опасения, что вскоре Орлей нанесёт ответный удар, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )]».#! По испарине на лбу видно, как сильно нервничает [scholar.GetName]. После аудиенции эти слова продолжают звучать у меня в голове. Неужели орлесианцы и их [Concept('chantry','Церковь')|E] действительно нарушат обещание, данное [Concept('elves','эльфам')|E]?"
 dalish_border_events.002.orlesian: "Пока я отдыхаю от придворной болтовни в уединённом саду, мой покой нарушает ливрейный слуга, который подбегает и торопливо кланяется. #italic [Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )], [Select_CString(chancellor.IsFemale, 'ваша советница', 'ваш советник' )] [chancellor.GetName] [Select_CString(chancellor.IsFemale, 'привезла', 'привёз' )] вести с границы и срочно просит уделить время.#! Когда [chancellor.GetName|U] предстаёт передо мной, я слышу рассказ о посланнике Долов, который нагло потребовал встречи с мелким владетелем у долийской границы. Посланник обвинил знатного орлесианца и [Concept('chantry','Церковь')|E] в поощрении жестоких набегов на соседние долийские деревни и дошёл до обвинения в похищении детей-[Concept('elvhen','элвенов')|E]!\n\nНервным голосом [chancellor.GetName|U] произносит: #italic «Есть опасения, что [Concept('elves','эльфы')|E] нанесут ответный удар, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )]».#! Эти слова тяжёлым грузом ложатся мне на сердце, омрачая тихий день. Если эльфы уже настолько осмелели, что открыто угрожают орлесианской знати, хрупкий мир с Долами, возможно, скоро подойдёт к концу…"
 dalish_border_events.002.orlesian.alt: "Пока я отдыхаю от придворной болтовни в уединённом саду, мой покой нарушает ливрейный слуга, который подбегает и торопливо кланяется. #italic [Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )], [Select_CString(scholar.IsFemale, 'известная местная учёная', 'известный местный учёный' )] [scholar.GetName] [Select_CString(scholar.IsFemale, 'привезла', 'привёз' )] вести с границы и срочно просит уделить время.#! Когда [scholar.GetName|U] предстаёт передо мной, я слышу рассказ о посланнике Долов, который нагло потребовал встречи с мелким владетелем у долийской границы. Посланник обвинил знатного орлесианца и [Concept('chantry','Церковь')|E] в поощрении жестоких набегов на соседние долийские деревни и дошёл до обвинения в похищении детей-элвенов!\n\nНервным голосом [scholar.GetName|U] произносит: #italic «Есть опасения, что [Concept('elves','эльфы')|E] нанесут ответный удар, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )]».#! Эти слова тяжёлым грузом ложатся мне на сердце, омрачая тихий день. Если эльфы уже настолько осмелели, что открыто угрожают орлесианской знати, хрупкий мир с Долами, возможно, скоро подойдёт к концу…"
 dalish_border_events.002.fallback: "Пока я отдыхаю от придворной болтовни в уединённом саду, мой покой нарушает слуга, который спешит ко мне с неотложными вестями. #italic [Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )], [Select_CString(chancellor.IsFemale, 'ваша советница', 'ваш советник' )] [chancellor.GetName] [Select_CString(chancellor.IsFemale, 'привезла', 'привёз' )] вести с границы и срочно просит уделить время.#! Когда [chancellor.GetName|U] предстаёт передо мной, я слышу несколько историй о том, как посланники Долов и Орлея преследуют мелких владетелей с противоположной стороны долийской границы и даже винят их в исчезновении детей по всему краю.\n\nНервным голосом [chancellor.GetName|U] произносит: #italic «Есть опасения, что [Concept('elves','эльфы')|E] или орлесианцы нанесут ответный удар, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )]».#! Эти слова тяжёлым грузом ложатся мне на сердце, омрачая тихий день."
 dalish_border_events.002.fallback.alt: "Пока я отдыхаю от придворной болтовни в уединённом саду, мой покой нарушает слуга, который спешит ко мне с неотложными вестями. #italic [Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )], [Select_CString(scholar.IsFemale, 'известная местная учёная', 'известный местный учёный' )] [scholar.GetName] [Select_CString(scholar.IsFemale, 'привезла', 'привёз' )] вести с границы и срочно просит уделить время.#! Когда [scholar.GetName|U] предстаёт передо мной, я слышу несколько историй о том, как посланники Долов и Орлея преследуют мелких владетелей с противоположной стороны долийской границы и даже винят их в исчезновении детей по всему краю.\n\nНервным голосом [scholar.GetName|U] произносит: #italic «Есть опасения, что [Concept('elves','эльфы')|E] или орлесианцы нанесут ответный удар, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )]».#! Эти слова тяжёлым грузом ложатся мне на сердце, омрачая тихий день."
 dalish_border_events.002.a: "Какая наглость!"
 dalish_border_events.002.b: "Надеюсь, благоразумие возобладает."
 dalish_border_events.003.t: "Суд толпы"
 dalish_border_events.003.dalish: "До меня дошли вести о происшествии у орлесианской границы, которое привело местных жителей в ярость.\n\nДвух почтенных долийских старейшин нашли мёртвыми в собственном доме. Явные следы жестокой борьбы указывали на присутствие третьего лица, однако убийца не оставил никаких зацепок.\n\nВскоре поползли слухи, будто пару убили орлесианцы.\n\nПохоже, крестьяне решили взять правосудие в свои руки: ко двору поступают донесения о толпе, которая схватила и казнила орлесианских торговцев, слишком близко подошедших к границе."
 dalish_border_events.003.orlesian: "До меня дошли вести, что недовольные крестьяне у долийской границы взяли правосудие в свои руки, пока напряжённость между нашим народом и [Concept('elves','эльфами')|E] Долов продолжает расти.\n\nДвух мужчин нашли хладнокровно убитыми, и местная Преподобная мать открыто обвинила живущего неподалёку эльфа, который, по слухам, прежде ссорился с погибшими.\n\nОдносельчане уважали убитых, а те жертвовали [Concept('chantry','Церкви')|E]. Вскоре собралась толпа, которая схватила эльфа и без суда казнила его."
 dalish_border_events.003.fallback: "До меня дошли вести о происшествиях у границы Орлея и Долов. По обе стороны границы крестьяне находят уважаемых жителей своих общин убитыми в собственных домах.\n\nВскоре люди начали винить соседей из-за границы.\n\nК несчастью, это уже привело к гибели нескольких ни в чём не повинных людей и эльфов, которым довелось оказаться не в том месте и не в то время."
 dalish_border_events.003.a: "Так им и надо!"
 dalish_border_events.003.b: "Их следовало судить!"
 dalish_border_events.003.c: "Столько бессмысленных смертей…"
 dalish_border_events.004.t: "Назойливые проповедники"
 dalish_border_events.004.dalish: "[Select_CString(chaplain.IsFemale, 'Моя придворная духовница', 'Мой придворный духовник' )] [chaplain.GetName|U] [Select_CString(chaplain.IsFemale, 'пришла', 'пришёл' )] ко мне с мрачным выражением лица. #italic «[Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )], мне только что сообщили о происшествии на орлесианской границе, о котором вам следует знать».#! [chaplain.GetName] начинает пересказывать историю, услышанную от жрецов и жителей Долов. Андрастианские миссионеры из Орлея перешли границу, чтобы распространять свою веру. Каким-то образом им удалось миновать [Concept('emerald_knights','Изумрудных рыцарей')|E] и найти сочувствующих эльфов в соседней деревне. Поначалу они тайно обратили нескольких жителей, но вскоре их рвение взяло верх. Миссионеры принялись обращать остальных всё настойчивее, пока наконец не привлекли внимание [Concept('emerald_knights','Изумрудных рыцарей')|E]. Андрастиане не сопротивлялись изгнанию. Однако некоторые новообращённые ушли вместе с ними, не желая возвращаться к поклонению [Concept('evanuris','эванурисам')|E].\n\n[chaplain.GetName|U] произносит короткую молитву о тех, кто отвернулся от наших обычаев. #Italic «Боюсь, подобное будет случаться всё чаще… Если мы хотим возродить древние обычаи, однажды придётся принять меры».#! Возможно, [Select_CString(chaplain.IsFemale, 'она права', 'он прав' )], но это решение может подождать."
 dalish_border_events.004.dalish.alt: "[Select_CString(scholar.IsFemale, 'Известная местная учёная', 'Известный местный учёный' )] [scholar.GetName|U] [Select_CString(scholar.IsFemale, 'пришла', 'пришёл' )] ко мне с мрачным выражением лица. #italic «[Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )], простите за вторжение, но мне только что сообщили о происшествии на орлесианской границе, о котором вам следует знать».#! [scholar.GetName] начинает пересказывать историю, услышанную от жрецов и жителей Долов. Андрастианские миссионеры из Орлея перешли границу, чтобы распространять свою веру. Каким-то образом им удалось миновать [Concept('emerald_knights','Изумрудных рыцарей')|E] и найти сочувствующих эльфов в соседней деревне. Поначалу они тайно обратили нескольких жителей, но вскоре их рвение взяло верх. Миссионеры принялись обращать остальных всё настойчивее, пока наконец не привлекли внимание [Concept('emerald_knights','Изумрудных рыцарей')|E]. Андрастиане не сопротивлялись изгнанию. Однако некоторые новообращённые ушли вместе с ними, не желая возвращаться к поклонению [Concept('evanuris','эванурисам')|E].\n\n[scholar.GetName|U] произносит короткую молитву о тех, кто отвернулся от наших обычаев. #Italic «Боюсь, подобное будет случаться всё чаще… Если мы хотим возродить древние обычаи, однажды придётся принять меры».#! Возможно, [Select_CString(scholar.IsFemale, 'она права', 'он прав' )], но это решение может подождать."
 dalish_border_events.004.orlesian: "[Select_CString(chaplain.IsFemale, 'Моя Преподобная мать', 'Мой преподобный отец' )] [chaplain.GetName|U] [Select_CString(chaplain.IsFemale, 'пришла', 'пришёл' )] ко мне с тревогой на лице. #Italic «[Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )], да озарит вас Свет Создателя. Я несу страшные вести из Долов».#! [chaplain.GetName|U] пересказывает историю, услышанную от служителей [Concept('chantry','Церкви')|E]. Нескольким преданным клирикам удалось миновать [Concept('emerald_knights','Изумрудных рыцарей')|E], чтобы нести [Concept('chant_of_light','Песнь Света')|E] эльфам, готовым услышать слово Андрасте.\n\nК несчастью, один из эльфов сумел предупредить [Concept('emerald_knights','Изумрудных рыцарей')|E], и те ворвались в деревню. По словам представителей [Concept('chantry','Церкви')|E], эти ревностные воины поскакали прямо на новообращённых, которые бросились защищать клириков и выиграли для них достаточно времени, чтобы бежать в Орлей.\n\n[Select_CString(chaplain.IsFemale, 'Преподобная мать', 'Преподобный отец' )] произносит короткую молитву, благодаря Создателя за спасение миссионеров, но явно забывает об эльфах-андрастианах, якобы отдавших жизнь за их защиту. #Italic «Если бы только больше людей, исполняя волю [Concept('andraste','Андрасте')|E], несли [Concept('chant_of_light','Песнь Света')|E] другим! Но эти воины… Я боюсь за наших преданных братьев и сестёр, стоит им ступить в Долы».#!"
 dalish_border_events.004.orlesian.alt: "[Select_CString(scholar.IsFemale, 'Известная местная учёная', 'Известный местный учёный' )] [scholar.GetName|U] [Select_CString(scholar.IsFemale, 'пришла', 'пришёл' )] ко мне с тревогой на лице. #Italic «[Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )], да озарит вас Свет Создателя. Я несу страшные вести из Долов».#! [scholar.GetName|U] пересказывает историю, услышанную от служителей [Concept('chantry','Церкви')|E]. Нескольким преданным клирикам удалось миновать [Concept('emerald_knights','Изумрудных рыцарей')|E], чтобы нести [Concept('chant_of_light','Песнь Света')|E] эльфам, готовым услышать слово Андрасте. К несчастью, один из эльфов сумел предупредить [Concept('emerald_knights','Изумрудных рыцарей')|E], и те ворвались в деревню. По словам представителей [Concept('chantry','Церкви')|E], эти ревностные воины поскакали прямо на новообращённых, которые бросились защищать клириков и выиграли для них достаточно времени, чтобы бежать в Орлей.\n\n[scholar.GetName|U] произносит короткую молитву, благодаря Создателя за спасение миссионеров, но явно забывает об эльфах-андрастианах, якобы отдавших жизнь за их защиту. #Italic «Если бы только больше людей, исполняя волю [Concept('andraste','Андрасте')|E], несли [Concept('chant_of_light','Песнь Света')|E] другим! Но эти воины… Я боюсь за наших преданных братьев и сестёр, стоит им ступить в Долы».#!"
 dalish_border_events.004.fallback: "[Select_CString(chaplain.IsFemale, 'Моя придворная духовница', 'Мой придворный духовник' )] [chaplain.GetName|U] [Select_CString(chaplain.IsFemale, 'пришла', 'пришёл' )] ко мне с мрачным выражением лица. #italic «[Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )], простите за вторжение, но мне только что сообщили о происшествии на границе Орлея и Долов, о котором вам следует знать».#! [chaplain.GetName] начинает пересказывать историю, услышанную от жрецов и жителей всего края. Андрастианские миссионеры из Орлея перешли границу Долов, чтобы распространять свою веру. Каким-то образом им удалось миновать [Concept('emerald_knights','Изумрудных рыцарей')|E] и найти сочувствующих эльфов в соседней деревне. Поначалу они тайно обратили нескольких жителей, но вскоре привлекли внимание [Concept('emerald_knights','Изумрудных рыцарей')|E]. Андрастиане не сопротивлялись изгнанию. Однако некоторые новообращённые ушли вместе с ними, не желая возвращаться к поклонению [Concept('evanuris','эванурисам')|E].\n\n[chaplain.GetName|U] облегчённо вздыхает. #Italic «Хорошо, что обошлось без нового кровопролития, однако я боюсь: со временем всё станет лишь хуже».#! Возможно, [Select_CString(chaplain.IsFemale, 'она права', 'он прав' )], но этот разговор лучше отложить."
 dalish_border_events.004.fallback.alt: "[Select_CString(scholar.IsFemale, 'Известная местная учёная', 'Известный местный учёный' )] [scholar.GetName|U] [Select_CString(scholar.IsFemale, 'пришла', 'пришёл' )] ко мне с мрачным выражением лица. #italic «[Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )], простите за вторжение, но мне только что сообщили о происшествии на границе Орлея и Долов, о котором вам следует знать».#! [scholar.GetName] начинает пересказывать историю, услышанную от жрецов и жителей всего края. Андрастианские миссионеры из Орлея перешли границу Долов, чтобы распространять свою веру. Каким-то образом им удалось миновать [Concept('emerald_knights','Изумрудных рыцарей')|E] и найти сочувствующих эльфов в соседней деревне. Поначалу они тайно обратили нескольких жителей, но вскоре привлекли внимание [Concept('emerald_knights','Изумрудных рыцарей')|E]. Андрастиане не сопротивлялись изгнанию. Однако некоторые новообращённые ушли вместе с ними, не желая возвращаться к поклонению [Concept('evanuris','эванурисам')|E].\n\n[scholar.GetName|U] облегчённо вздыхает. #Italic «Хорошо, что обошлось без нового кровопролития, однако я боюсь: со временем всё станет лишь хуже».#! Возможно, [Select_CString(scholar.IsFemale, 'она права', 'он прав' )], но этот разговор лучше отложить."
 dalish_border_events.004.a: "Распространение [Concept('chant_of_light','Песни Света')|E] — всегда добрая весть!"
 dalish_border_events.004.b: "Такое достижение пойдёт замыслам Орлея лишь на пользу."
 dalish_border_events.004.c: "Неужели в этом мире совсем не осталось места для [Concept('evanuris','эванурисов')|E]?"
 dalish_border_events.004.d: "Зачем наш народ отказывается от наследия ради этих глупцов?"
 dalish_border_events.004.e: "Неужели среди [Concept('evanuris','эванурисов')|E] не найдётся места ещё для одного бога?"
 dalish_border_events.004.f: "Нужно принять меры, чтобы подобное не повторилось!"
 dalish_border_events.004.g: "Тревожное развитие событий."
 dalish_border_events.005.t: "Радость браконьеров"
 dalish_border_events.005.dalish: "Среди крестьян в [capital.GetName] разносится новый слух: якобы орлесианцы арестовали и казнили группу долийских эльфов.\n\nМестный орлесианский владетель утверждал, что эльфов застали за браконьерством в лесу возле его замка.\n\nРазумеется, никаких доказательств этим обвинениям не представили, да и установить личности пленников орлесианцы не потрудились."
 dalish_border_events.005.orlesian: "За ужином с ближайшими придворными я слышу непрестанный шёпот о шайке эльфов, которая дерзко перешла границу Орлея, чтобы охотиться в землях [GetTitleByKey('d_lydes').GetName].\n\nМестные шевалье схватили браконьеров и повесили их у долийской границы в назидание остальным."
 dalish_border_events.005.fallback: "По двору ходят слухи о группе эльфов, которых арестовали и повесили за браконьерство в Орлее.\n\nМногие эльфы считают, что казнённые лишь оказались не в том месте и не в то время. Орлесианцы же называют расправу справедливым наказанием, которое отпугнёт будущих браконьеров.\n\nКак и в большинстве подобных историй, правда погребена вместе с мёртвыми."
 dalish_border_events.005.a: "Справедливое воздаяние ворам."
 dalish_border_events.005.b: "Боюсь, с петлёй они #Italic слегка#! перестарались."
 dalish_border_events.005.c: "Типичное орлесианское правосудие."
 dalish_border_events.005.d: "Нужно предупредить наших охотников, чтобы следили за границей."
 dalish_border_events.005.e: "Узнаем ли мы когда-нибудь правду об этих историях?"
 dalish_border_events.006.t: "По стопам Шартана"
 dalish_border_events.006.dalish: "Ко двору пришли вести, что группа [Concept('elvhen','элвенов')|E] во главе с [elf_convert.GetName|U] обратилась в андрастианство. Эта новость потрясла всех придворных, а сильнее всего — [scoped_divine.GetName|U]. Мы и наши предки приложили столько усилий, чтобы вернуть утраченную историю, и никто не может понять, зачем кому-то отказываться от всего этого.\n\nТеперь каждый задаётся вопросом, станут ли эти новообращённые первыми из многих и можно ли остановить дальнейшие обращения."
 dalish_border_events.006.dalish.alt: "Ко двору пришли вести, что группа [Concept('elvhen','элвенов')|E] во главе с [elf_convert.GetName|U] обратилась в андрастианство. Эта новость потрясла всех придворных, а сильнее всего — [scoped_divine.GetName|U]. Мы и наши предки приложили столько усилий, чтобы вернуть утраченную историю, и никто не может понять, зачем кому-то отказываться от всего этого.\n\nТеперь каждый задаётся вопросом, станут ли эти новообращённые первыми из многих и можно ли остановить дальнейшие обращения."
 dalish_border_events.006.orlesian: "Жаждущий чудес двор встречает удивительные вести, а [scoped_divine.GetName|U] с восторгом рассказывает каждому желающему о том, как [elf_convert.GetName|U] [Select_CString(elf_convert.IsFemale, 'отважно явилась', 'отважно явился' )] к миссионерам Её Слова. [Select_CString(elf_convert.IsFemale, 'Озарённая', 'Озарённый' )] сиянием [Concept('chant_of_light','Песни Света')|E], [elf_convert.GetName] [Select_CString(elf_convert.IsFemale, 'осмелилась покинуть', 'осмелился покинуть' )] свой народ и [Select_CString(elf_convert.IsFemale, 'приняла', 'принял' )] [Concept('chantry','Церковь')|E] как новый дом.\n\nТеперь все при дворе гадают, станет ли это началом череды обращений или же закованные в серебрит кулаки [Concept('emerald_knights','Изумрудных рыцарей')|E] сокрушат её прежде, чем она наберёт силу."
 dalish_border_events.006.orlesian.alt: "Жаждущий чудес двор встречает удивительные вести, а [scoped_divine.GetName|U] с восторгом рассказывает каждому желающему о том, как [elf_convert.GetName|U] [Select_CString(elf_convert.IsFemale, 'отважно явилась', 'отважно явился' )] к миссионерам Её Слова. [Select_CString(elf_convert.IsFemale, 'Озарённая', 'Озарённый' )] сиянием [Concept('chant_of_light','Песни Света')|E], [elf_convert.GetName] [Select_CString(elf_convert.IsFemale, 'осмелилась покинуть', 'осмелился покинуть' )] свой народ и [Select_CString(elf_convert.IsFemale, 'приняла', 'принял' )] [Concept('chantry','Церковь')|E] как новый дом.\n\nТеперь все при дворе гадают, станет ли это началом череды обращений или же закованные в серебрит кулаки [Concept('emerald_knights','Изумрудных рыцарей')|E] сокрушат её прежде, чем она наберёт силу."
 dalish_border_events.006.fallback: "Ко двору пришли вести, что группа эльфов во главе с [elf_convert.GetName|U] обратилась в андрастианство. Объявленным изгоями на родине, в Долах, новообращённым не осталось ничего иного, кроме переселения в Орлей.\n\nМногие андрастиане восхваляют их отвагу. По слухам, [Concept('chantry','Церковь')|E] уже обсуждает, как обратить ещё больше эльфов. Приведёт ли пример этой группы к новым обращениям, покажет лишь время."
 dalish_border_events.006.a: "Цивилизованные эльфы?"
 dalish_border_events.006.b: "Возможно, мы сумеем чему-то научиться друг у друга…"
 dalish_border_events.006.c: "Каждый волен поклоняться кому пожелает."
 dalish_border_events.006.d: "Какая трагедия!"
 dalish_border_events.007.t: "Кощунственная добыча"
 dalish_border_events.007.dalish: "[marshal.GetName|U] [Select_CString(marshal.IsFemale, 'принесла', 'принёс' )] мне страшные вести: принадлежавшую соседней деревне [Concept('halla','галлу')|E] нашли мёртвой. По ранам было ясно, что её зарубили мечом. Никто в деревне не мог представить, зачем кому-то из [Concept('elvhen','элвенов')|E] убивать бедное животное. Тогда крестьяне обыскали лес и нашли лагерь орлесианских охотников. Жители деревни утверждают, что те пировали, поедая мясо галлы, и потому убили их, прежде чем они смогли причинить новый вред."
 dalish_border_events.007.dalish_hunter: "[Select_CString(hunter.IsFemale, 'Местная охотница', 'Местный охотник' )] по имени [hunter.GetName] [Select_CString(hunter.IsFemale, 'принесла', 'принёс' )] мне страшные вести: принадлежавшую соседней деревне [Concept('halla','галлу')|E] нашли мёртвой. По ранам было ясно, что её зарубили мечом. Никто в деревне не мог представить, зачем кому-то из [Concept('elvhen','элвенов')|E] убивать бедное животное. Тогда крестьяне обыскали лес и нашли лагерь орлесианских охотников. Жители деревни утверждают, что те пировали, поедая мясо галлы, и потому убили их, прежде чем они смогли причинить новый вред."
 dalish_border_events.007.orlesian: "[marshal.GetName|U] [Select_CString(marshal.IsFemale, 'доставила', 'доставил' )] страшные вести из Долов. Группа орлесианских охотников выслеживала оленей возле долийских лесов, но, похоже, совершила две роковые ошибки.\n\nНесчастные глупцы забрели на долийскую землю и, встретив белого оленя, застрелили его. Когда они поняли, что перед ними была домашняя [Concept('halla','галла')|E], оказалось слишком поздно.\n\nМестные эльфы схватили и казнили охотников, а их головы отправили обратно в родную деревню в назидание всем, кто осмелится охотиться на почитаемое животное."
 dalish_border_events.007.orlesian_hunter: "[Select_CString(hunter.IsFemale, 'Местная охотница', 'Местный охотник' )] по имени [hunter.GetName|U] [Select_CString(hunter.IsFemale, 'доставила', 'доставил' )] страшные вести из Долов. Группа орлесианских охотников выслеживала оленей возле долийских лесов, но, похоже, совершила две роковые ошибки. Несчастные глупцы забрели на долийскую землю и, встретив белого оленя, застрелили его. Когда они поняли, что перед ними была домашняя [Concept('halla','галла')|E], оказалось слишком поздно. Местные эльфы схватили и казнили охотников, а их головы отправили обратно в родную деревню в назидание всем, кто осмелится охотиться на почитаемое животное."
 dalish_border_events.007.fallback: "Ко двору приходят страшные вести, когда [marshal.GetName|U] поспешно входит в зал и сообщает, что группа орлесианских охотников перешла границу Долов и во время вылазки убила домашнюю [Concept('halla','галлу')|E]. Было ли это случайностью, мы уже никогда не узнаем: охотников перебили жители деревни, которая заботилась об этой галле."
 dalish_border_events.007.fallback.alt: "Ко двору приходят страшные вести, когда стража поспешно вводит [Select_CString(hunter.IsFemale, 'местную охотницу', 'местного охотника' )] по имени [hunter.GetName|U]. [Select_CString(hunter.IsFemale, 'Она сообщает', 'Он сообщает' )], что группа орлесианских охотников перешла границу Долов и во время вылазки убила домашнюю [Concept('halla','галлу')|E]. Было ли это случайностью, мы уже никогда не узнаем: охотников перебили жители деревни, которая заботилась об этой галле."
 dalish_border_events.007.a: "И всё это из-за #Italic оленя#!"
 dalish_border_events.007.b: "Нужно попросить [hunt_master.GetFirstName|U] пока не подпускать наших охотников к Долам."
 dalish_border_events.007.c: "Возможно, стоит больше узнать об [Concept('elves','эльфах')|E], чтобы избежать подобных недоразумений."
 dalish_border_events.007.d: "[Concept('shemlen','Шемлены')|E] получили по заслугам."
 dalish_border_events.007.e: "Какая трагическая потеря…"
 dalish_border_events.007.f: "Возможно, всё это — одно большое недоразумение."
 dalish_border_events.008.t: "Не в том лесу"
 dalish_border_events.008.dalish: "[steward.GetName|U] [Select_CString(steward.IsFemale, 'обратила', 'обратил' )] моё внимание на недавнее происшествие у орлесианской границы. По [Select_CString(steward.IsFemale, 'её', 'его' )] словам, группа лесорубов из Орлея перешла в Долы и разбила небольшой лагерь. Никто точно не знает, как долго их вырубка оставалась незамеченной, но, по всей видимости, они работали там не меньше нескольких месяцев. Когда лесорубов обнаружили, лагерь уничтожили, а [Concept('emerald_knights','Изумрудные рыцари')|E] усилили патрули в этих землях."
 dalish_border_events.008.dalish_alt: "[logger.GetName|U] [Select_CString(logger.IsFemale, 'обратила', 'обратил' )] моё внимание на недавнее происшествие у орлесианской границы. По [Select_CString(logger.IsFemale, 'её', 'его' )] словам, группа лесорубов из Орлея перешла в Долы и разбила небольшой лагерь. Никто точно не знает, как долго их вырубка оставалась незамеченной, но, по всей видимости, они работали там не меньше нескольких месяцев. Когда лесорубов обнаружили, лагерь уничтожили, а [Concept('emerald_knights','Изумрудные рыцари')|E] усилили патрули в этих землях."
 dalish_border_events.008.orlesian: "[steward.GetName|U] [Select_CString(steward.IsFemale, 'передала', 'передал' )] вести с долийской границы: группа орлесианских лесорубов случайно забрела на эльфийские земли. Усердно разыскивая качественную древесину, они по ошибке вырубили несколько гектаров леса, прежде чем [Concept('emerald_knights','Изумрудные рыцари')|E] ворвались в лагерь, схватили большинство работников и уничтожили всё вокруг. По слухам, пленных орлесианцев жестоко четвертовали прямо в том лесу. Самые суеверные придворные утверждают, будто это был ритуал магии крови во славу языческих богов."
 dalish_border_events.008.orlesian_alt: "[logger.GetName|U] [Select_CString(logger.IsFemale, 'передала', 'передал' )] вести с долийской границы: группа орлесианских лесорубов случайно забрела на эльфийские земли. Усердно разыскивая качественную древесину, они по ошибке вырубили несколько гектаров леса, прежде чем [Concept('emerald_knights','Изумрудные рыцари')|E] ворвались в лагерь, схватили большинство работников и уничтожили всё вокруг. По слухам, пленных орлесианцев жестоко четвертовали прямо в том лесу. Самые суеверные придворные утверждают, будто это был ритуал магии крови во славу языческих богов."
 dalish_border_events.008.fallback: "До моего двора дошла очередная история с долийской границы. По всей видимости, группа лесорубов перешла в Долы и разбила небольшой лагерь. Как долго он там простоял, неизвестно: [Concept('emerald_knights','Изумрудные рыцари')|E] уничтожили все его следы. Теперь, когда патрули в этом краю усилены, подобное едва ли повторится."
 dalish_border_events.008.a: "За такое преступление их казнили бы и по эту сторону границы."
 dalish_border_events.008.b: "#Italic Магия крови?#! Нужно посоветоваться с храмовниками."
 dalish_border_events.008.c: "Надеюсь, усиленные патрули не позволят этому повториться."
 dalish_border_events.008.d: "#Italic [Concept('shemlen','Шемлены')|E]#! становятся слишком дерзкими."
 dalish_border_events.008.e: "Закончится ли когда-нибудь это насилие?"
