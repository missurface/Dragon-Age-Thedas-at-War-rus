l_russian:
 DATAW_red_crossing_minor.0001.name: "Столкновение вер"
 DATAW_red_crossing_minor.0001.desc: "Среди повседневных дел ко мне подходит слуга и сообщает о весьма необычном происшествии.\nНедавно орлесианская Церковь заключила в тюрьму знаменитого учёного Этьена де Клемансо. Его застали за беседой с эльфийским учёным, почитающим Эванурисов: они обсуждали связь и возможную богословскую совместимость между Создателем и эльфийским пантеоном. Уже сама тема наверняка возмутила бы значительную часть Церкви, но, по слухам, причиной заточения Этьена стал именно дружеский характер беседы. Чтобы никто не приписал мне чужих слов, следует открыто высказать всему миру своё мнение."
 DATAW_red_crossing_minor.0001.opt.a: "Такие вопросы можно свободно обсуждать с кем угодно."
 DATAW_red_crossing_minor.0001.opt.b: "Так ему и надо за общение с теми, кто не следует за Создателем!"

 DATAW_red_crossing_major.0001.t: "Резня в Ред-Кроссинге"
 DATAW_red_crossing_major.0001.desc: "Слухи о новом столкновении между Орлеем и Долами распространяются по Тедасу, словно лесной пожар. Подробности меняются с каждым пересказом, но некоторые факты всё же известны. \n\nПо всей видимости, небольшой отряд долийских налётчиков сжёг поселение [red_crossing.GetName|U] на границе Орлея и Долов. Орлесианские войска прибыли слишком поздно, чтобы спасти деревню, но обнаружили там [Concept('emerald_knights','Изумрудных рыцарей')|E], которые якобы преследовали самовольных налётчиков. В конце концов долийцам пришлось отступить, а [elandrin.GetName|U], [Select_CString(elandrin.IsFemale, 'одна из высокопоставленных воительниц ордена Изумрудных рыцарей, погибла', 'один из высокопоставленных Изумрудных рыцарей, погиб' )] в столкновении. \n\nРазумеется, орлесианцы оспаривают официальное изложение долийцев, а те отвечают им тем же. Обе стороны винят друг друга в нападении, и мир между двумя державами кажется недостижимой мечтой."
 DATAW_red_crossing_major.0001.desc.dalish: "С границы с Орлеем ко двору прибыли ужасные вести. В донесении сказано, что небольшой отряд налётчиков под предводительством персонажа [siona.GetName|U] напал на поселение [red_crossing.GetName|U], отомстив за постоянные вторжения храмовников, желавших обратить [Concept('elvhen','элвенов')|E] в свою веру.\n\nОрлесианцы неустанно пытаются обратить всех без исключения. Рано или поздно кому-то из нас предстояло взять дело в свои руки. \n\n[elandrin.GetName|U], [Select_CString(elandrin.IsFemale, 'одна из самых известных воительниц', 'один из самых известных воинов' )] [Concept('emerald_knights','ордена Изумрудных рыцарей')|E], [Select_CString(elandrin.IsFemale, 'попыталась', 'попытался' )] остановить нападение, но [Select_CString(elandrin.IsFemale, 'прибыла', 'прибыл' )] слишком поздно. Налётчики уже перебили большинство жителей и отступили. Прежде чем [elandrin.GetFirstNameNoTooltip] [Select_CString(elandrin.IsFemale, 'смогла', 'смог' )] уйти, орлесианские солдаты схватили [Select_CString(elandrin.IsFemale, 'её', 'его' )] и казнили перед толпой разгневанных селян.\n\nДругие [Concept('emerald_knights','Изумрудные рыцари')|E], следовавшие за персонажем [elandrin.GetName|U], сумели забрать [Select_CString(elandrin.IsFemale, 'её тело', 'его тело' )], после чего были вынуждены отступить. Напряжение между нашими державами нарастало много лет, но эти события могут стать последней каплей как для Орлея, так и для Долов."
 DATAW_red_crossing_major.0001.desc.orlesian: "Страшные вести ворвались ко двору с яростью бушующего пожара. Мирное поселение [red_crossing.GetName|U] у границы с Долами подверглось нападению [Concept('elves','долийских эльфов')|E], начавших резню с убийства [Select_CString(adalene.IsFemale, 'молодой женщины', 'молодого мужчины' )] по имени [adalene.GetName|U].\n\nЖители деревни храбро дали отпор вторгшимся [Concept('emerald_knights','Изумрудным рыцарям')|E]. Отступление в лес обошлось нападавшим одной жизнью. \n\nНо даже возбуждённый гомон придворных начинает стихать: над нами нависает призрак войны. Нападение на орлесианскую деревню и смерть в рядах Изумрудных рыцарей нельзя оставить без ответа, и многие считают решающее столкновение неизбежным.\n\nОдни жаждут указать [Concept('elves','эльфам')|E] их место, другие же вполголоса выражают тревогу и надеются избежать дальнейшего кровопролития."
 DATAW_red_crossing_major.0001.opt.a: "Пусть жребий решит исход. Я готовлюсь ко всему!"
 DATAW_red_crossing_major.0001.opt.b: "Принесите мой меч! Мы преподадим этим презренным псам незабываемый урок!"
 DATAW_red_crossing_major.0001.opt.c: "Эта трагедия — лишь очередная глава долгой вражды людей и эльфов."
 DATAW_red_crossing_major.0001.opt.d: "Нельзя отвечать кровопролитием на кровопролитие!"
 DATAW_red_crossing_major.0001.opt.e: "Для отношений между Орлеем и Долами это не сулит ничего хорошего."
 DATAW_red_crossing_major.0001.opt.f: "Да проведёт [Concept('maker','Создатель')|E] наш народ сквозь эти мрачные времена."
 DATAW_red_crossing_major.0001.opt.g: "Да проведут [Concept('evanuris','Эванурисы')|E] наш народ сквозь эти мрачные времена."
 DATAW_red_crossing_major.0001.opt.h: "[Concept('thedas','Тедас')|E] ждут мрачные времена."



 DATAW_red_crossing_major.0002.t: "Война?"
 DATAW_red_crossing_major.0002.desc.intro: "Налёт на #Italic мою#! землю в #Italic моей#! империи. Пролита орлесианская кровь, а в реку брошено тело в доспехах Изумрудных рыцарей. [Concept('chantry','Церковь')|E] и знать уже готовы выломать дверь моих покоев, лишь бы высказать своё #Italic незаменимое#! мнение о дальнейших действиях. \n\n[Select_CString(ROOT.Char.IsFemale, 'Как правительнице Орлея', 'Как правителю Орлея' )], именно мне предстоит решить этот вопрос, какие бы советы ни звучали. С одной стороны, резню нельзя оставить без ответа. Нападение даже на такую незначительную деревню — нападение на всю империю. К тому же теперь, когда эльфы сами дали повод для удара, нельзя упускать возможность расширить границы Орлея…"
 DATAW_red_crossing_major.0002.opt.a.tooltip: "Созвать ополчение и призвать шевалье. Мы выступаем на войну!"
 DATAW_red_crossing_major.0002.desc.kordy: "\n\nС другой стороны, [Select_CString(kordy.IsFemale, 'моя мать', 'мой отец' )], [kordy.GetName|U], [Select_CString(kordy.IsFemale, 'была близка', 'был близок' )] с эльфами. Мне доводилось слышать рассказы о дружбе между персонажами [kordy.GetName|U] и [ameridan.GetName|U]. Быть может, из них стоит извлечь урок."
 DATAW_red_crossing_major.0002.desc.mid: "С другой стороны, [Select_CString(kordy.IsFemale, 'моя предшественница', 'мой предшественник' )] — [kordy.GetName|U] — [Select_CString(kordy.IsFemale, 'была близка', 'был близок' )] с эльфами. Мне доводилось слышать рассказы о дружбе между персонажами [kordy.GetName|U] и [ameridan.GetName|U]. Быть может, из них стоит извлечь урок."
 DATAW_red_crossing_major.0002.desc.end: "\n\nВскоре наступает новый день, и все советники собираются за столом, чтобы выслушать мои приказы и исполнить мою волю."
 DATAW_red_crossing_major.0002.desc.zealot: "Да придаст нам сил [Concept('andraste','Андрасте')|E]."
 DATAW_red_crossing_major.0002.opt.a: "Это нападение на Орлей нельзя оставить без ответа."
 DATAW_red_crossing_supporter_of_chantry: "Поддержка Церкви"
 DATAW_red_crossing_open_minded: "Широта взглядов"