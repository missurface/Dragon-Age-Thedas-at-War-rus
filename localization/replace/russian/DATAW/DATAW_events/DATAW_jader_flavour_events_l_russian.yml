l_russian:
  # Придворные события
  DATAW_jader_flavour_court.0001.tit: "Где родилась Пророчица"
  DATAW_jader_flavour_court.0001.desc: "Пока придворные дела нескончаемой чередой тянутся весь день, моё внимание привлекает [Select_CString(mad_priest.IsFemale, 'странная женщина', 'странный мужчина' )] — явно [Select_CString(mad_priest.IsFemale, 'последовательница', 'последователь' )] веры [mad_priest.GetFaith.GetName]. По [Select_CString(mad_priest.IsFemale, 'её', 'его' )] повадкам сразу видно: [Select_CString(mad_priest.IsFemale, 'новоприбывшая не вполне в себе', 'новоприбывший не вполне в себе' )].\n\nОпустившись на колени, [Select_CString(mad_priest.IsFemale, 'жрица начинает свою тираду', 'жрец начинает свою тираду' )].\n\n«[ROOT.Char.GetTitleAsName], я [Select_CString(mad_priest.IsFemale, 'пришла', 'пришёл' )] просить вас положить конец откровенно нелепым заявлениям, будто Андрасте родилась в Джейдере. Всем известно — даже отрицающим правду жителям Джейдера, — что Андрасте была аламарри. А что такое Денерим, если не сердце земель аламарри? Джейдер — всего лишь самый аламаррийский из цирианских краёв, а сказка о рождении Пророчицы в пределах империи — очевидная ложь, которую распространил Кордилиус Драккон, да будет он благословен!»\n\nНесмотря на возмущение придворных вокруг [Select_CString(mad_priest.IsFemale, 'неё', 'него' )], [Select_CString(mad_priest.IsFemale, 'безумная жрица', 'безумный жрец' )] ещё несколько минут продолжает разглагольствовать. Наконец стража уводит [Select_CString(mad_priest.IsFemale, 'её', 'его' )] из зала. Двор погружается в молчание, ожидая моего ответа на эту тираду."
  DATAW_jader_flavour_court.0001.opt.a: "Опять…"
  DATAW_jader_flavour_court.0001.opt.b: "Мы докажем, что они неправы!"
  DATAW_jader_flavour_court.0001.opt.c: "Казнить [Select_CString(mad_priest.IsFemale, 'эту безумную', 'этого безумца' )]."
  DATAW_jader_flavour_court.0001.c.tt.success: "Двор отмахивается от случившегося как от мелкой неприятности без каких-либо последствий."
  DATAW_jader_flavour_court.0001.c.tt.failure: "Двор встревожен вашим безразличием."
  DATAW_jader_andraste_festival: "Праздник Андрасте"

  # Основные события
  DATAW_jader_flavour_main.0001.tit: "Щиты империи"
  DATAW_jader_flavour_main.0001.desc: "Мы, жители Джейдера, всегда предпочитали оборону, и нынешние военные учения не стали исключением.\n\nСолдаты смыкают строй, готовясь встретить наступающую шеренгу. Подобное часто можно увидеть и на джейдерских учениях, и в настоящем бою, а сегодня этим строем командую я.\n\nСледует ли придерживаться тактики, которой мой народ достиг совершенства, или пора перейти в наступление?"
  DATAW_jader_flavour_main.0001.opt.a: "Стоять насмерть!"
  DATAW_jader_flavour_main.0001.opt.b: "Вперёд! Застанем их врасплох!" 
  DATAW_jader_flavour_main.0002.tit: "Сыны Исората"
  DATAW_jader_flavour_main.0002.desc: "Жители Джейдера всегда были необычным народом. Мы близки аламарри Ферелдена, но говорим на языке орлесианцев — словно отчуждённое дитя неудачного союза.\n\nИ всё же различия помогли нам процветать. Мы — потомки аламарри, последовавших за Исоратом. Они защищали рубежи империи и от авваров, и от клейнов, а также выступали посредниками между обоими народами и цирианами.\n\nСегодня я обращаюсь к этой памяти, зная, что именно история определила наше место в Игре.\n\nКакой стороне наследия последовать?"
  DATAW_jader_flavour_main.0002.opt.a: "Я стану несокрушимым оплотом."
  DATAW_jader_flavour_main.0002.opt.b: "Я стану мостом между народами."   
  DATAW_bridge_of_the_people_modifier: "Мост между народами"
  DATAW_defender_of_the_people_modifier: "Оплот народа"

  # События путешествий
  DATAW_jader_flavour_travel.0001.tit: "Народ, сближающий других"
  DATAW_jader_flavour_travel.0001.desc: "[GetTitleByKey('k_jader').GetBaseNameNoTier], наша родина, всегда служил связующим звеном между аламарри из [GetTitleByKey('e_ferelden').GetBaseNameNoTier] и цирианами из [GetTitleByKey('h_orlais').GetBaseNameNoTier]. Поэтому жители Джейдера научились соединять оба народа, переняв обычаи одного и язык другого. \n\nБыть может, настало время показать, что мы способны стать мостом между любыми людьми.\n\nВпереди спорят две фигуры. Присмотревшись, я понимаю: культура одного из путников — «[traveler.GetCulture.GetName]», а происхождение другого — «[traveler_2_culture.GetName]»."
  DATAW_jader_flavour_travel.0001.opt.a: "Попробуем уладить спор."
  DATAW_jader_flavour_travel.0001.opt.b: "Я помогу устранить недоразумение!"
  DATAW_jader_flavour_travel.0001.opt.c: "Разнимем их силой!"
  DATAW_jader_flavour_travel.0001.opt.d: "Пойдём дальше."
  DATAW_jader_flavour_travel.0001.c.tt.crit_failure: "Критический провал" 
  DATAW_jader_flavour_travel.0001.c.tt.failure: "Провал"
  DATAW_jader_flavour_travel.0001.c.tt.success: "Успех"
  DATAW_jader_flavour_travel.0001.c.tt.crit_success: "Критический успех"   
  DATAW_jader_flavour_travel.0001.tt.a.success_desc.a: "Вам удаётся уладить спор"
  DATAW_jader_flavour_travel.0001.tt.a.failure_desc.a: "Ваши слова не могут предотвратить драку."
  DATAW_jader_flavour_travel.0001.tt.c.success_desc.a: "Вам удаётся разнять спорящих путников"
  DATAW_jader_flavour_travel.0001.tt.c.failure_desc.a: "Все попытки разнять спорящих путников тщетны"
  DATAW_jader_flavour_travel.0001.tt.c.failure_desc.b: "Ваше вмешательство лишь объединяет обоих путников против вас"

  DATAW_jader_flavour_travel.0002.tit: "[Select_CString(raider.IsFemale, 'Морская разбойница', 'Морской разбойник' )] на мели"
  DATAW_jader_flavour_travel.0002.desc: "Странную находку вынесло на берег.\n\nПроходя неподалёку от побережья владения [raider.GetCurrentLocation.GetName], мы обнаружили обломки корабля. Судно, несомненно, прибыло из Джейдера, но остался ли кто-нибудь в живых — большой вопрос.\n\n#bold «На помощь! Кто-нибудь!»#!\n\nЗаслышав крик с корабля, мы бросаемся на помощь кому-то из своих. Однако [random_entourage_member.GetName], [Select_CString(random_entourage_member.IsFemale, 'одна из моих спутниц', 'один из моих спутников' )], замечает: несмотря на происхождение судна, выговор [Select_CString(raider.IsFemale, 'незнакомки', 'незнакомца' )] совсем не похож на речь жителей владения [GetTitleByKey('k_jader').GetBaseNameNoTier].\n\nДобравшись до источника голоса, мы убеждаемся, что подозрения были верны. Перед нами [Select_CString(raider.IsFemale, 'разбойница', 'разбойник' )], чьи шрамы и голос с головой выдают истинное происхождение. На странном наречии налётчиков Недремлющего моря, вобравшем языки со всего Тедаса, [Select_CString(raider.IsFemale, 'она взывает', 'он взывает' )] к нам о помощи.\n\n«Приветствую вас, о благородные путники! Я — [raider.GetName], [Select_CString(raider.IsFemale, 'скромная торговка, прибывшая', 'скромный торговец, прибывший' )] из владения [GetTitleByKey('k_jader').GetBaseNameNoTier] и [Select_CString(raider.IsFemale, 'оказавшаяся', 'оказавшийся' )] в этих землях. Прошу помочь отодвинуть тяжёлое бревно: под ним зажата моя нога».\n\n[Select_CString(raider.IsFemale, 'Её', 'Его' )] попытка подражать выговору моего народа откровенно жалка, однако в ней явно больше отчаяния и страха, чем настоящей злобы. За помощь наверняка удастся получить золото, но [Select_CString(raider.IsFemale, 'заслуживает ли эта пиратка', 'заслуживает ли этот пират' )] спасения? Ведь [Select_CString(raider.IsFemale, 'она вполне могла', 'он вполне мог' )] украсть корабль у кого-то из моих земляков."
  DATAW_jader_flavour_travel.0002.opt.a: "Ты плохо лжёшь, [Select_CString(raider.IsFemale, 'разбойница', 'разбойник' )], но я помогу."
  DATAW_jader_flavour_travel.0002.opt.b: "А если я спасу тебя в обмен на службу?"
  DATAW_jader_flavour_travel.0002.opt.c: "Оставим [Select_CString(raider.IsFemale, 'её', 'его' )] на волю судьбы"
  DATAW_jader_flavour_travel.0002.opt.d: "За преступления против моего народа отправишься в темницу"
  DATAW_safer_coasts_modifier: "Безопасное побережье"
  DATAW_safer_coasts_modifier_desc: "После того как кораблекрушение позволило арестовать местного налётчика, пираты стали избегать этого края, опасаясь той же участи. Жители с радостью пользуются воцарившимся на побережье спокойствием"
  