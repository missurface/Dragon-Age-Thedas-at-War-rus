 dataw_ciriane_rebellion.3806.t: "Защитники веры"
 dataw_ciriane_rebellion.3806.desc: "[augur.GetName] приближается к трону, низко кланяется и начинает говорить.\n\n #italic «[Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )], я давно служу вам [Select_CString(augur.IsFemale, 'верной воительницей', 'верным воином' )]. Но в последнее время все мои мысли заняты нашим возвращением к истинной вере. Я призываю вас основать священный орден».#!"
 dataw_ciriane_rebellion.3806.a: "Хорошо. Я обдумаю это предложение."
 dataw_ciriane_rebellion.3806.a_tt: "Решение #N «Основать священный орден»#! обойдётся на 50% дешевле."
 dataw_ciriane_rebellion.3806.b: "Стража, убрать [Select_CString(augur.IsFemale, 'эту глупицу', 'этого глупца' )] с моих глаз!"

