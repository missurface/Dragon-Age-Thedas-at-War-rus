### Ally with the Ciriane Cult Event Chain
 # COURT EVENT: The Augur
 dataw_ciriane_rebellion.3801.t: "Авгур"
 dataw_ciriane_rebellion.3801.desc: "К моему трону приближается таинственная фигура в тёмных одеждах. Это авгур — один из [Concept('mage','магов')|E]-отступников, верных [GetFaithByKey('ciriane_paganism').GetAdjective]. Предки авгуров веками изучали [Concept('dataw_magic','магию')|E] и даже после возвышения [Concept('chantry','Церкви')|E] сумели выжить в уединении на Марках.\n\nАвгур напоминает о древних клятвах, которые мои предки дали его народу, и рассказывает о преследованиях со стороны Церкви и её [Concept('templar','храмовников')|E].\n\n#N Авгур умоляет меня признать мудрость добрых [Concept('spirits','духов')|E], отвергнуть ложного [Concept('maker','Создателя')|E] и [Concept('andraste','Андрасте')|E] и защитить язычников от мечей храмовников.#!"
 dataw_ciriane_rebellion.3801.a: "Я лично передам тебя храмовникам!"
 dataw_ciriane_rebellion.3801.b: "Наши взгляды расходятся, но я защищу тебя от храмовников."
 dataw_ciriane_rebellion.3801.c: "Я с тобой, авгур. За добрых духов!"

### Ally with the Ciriane Cult Event Chain
 # The Cult Revealed
 dataw_ciriane_rebellion.3802.t: "Раскрытый культ"
 dataw_ciriane_rebellion.3802.desc: "Советники устроили тайную встречу с несколькими племенными жителями болот, обитающими в самых уединённых частях моих владений. Мои собратья из народа [GetGlobalVariable('orlesian_culture_var').Culture.GetName] пришли бы в ужас от подобного предложения, однако мне эти люди кажутся вполне разумными. Их уклад во многом похож на обычаи народа [GetGlobalVariable('mareschois_culture_var').Culture.GetName], но вместо Создателя они по-прежнему чтят древние верования предков [andraste.GetName].\n\nПлемена желают приобщиться к богатству цивилизованных земель и теснее объединиться с остальными моими подданными, но страшатся кары Церкви. Их авгуров уже преследуют [Concept('templar','храмовники')|E], называя отступниками. Они умоляют меня гарантировать им безопасность и напоминают о клятвах защиты, которыми наши предки связали себя в давние времена."
 dataw_ciriane_rebellion.3802.a: "Мы обязаны хотя бы терпеть язычников!"
 dataw_ciriane_rebellion.3802.b: "Мой долг — защищать старые обычаи, но Церковь не должна узнать."
 dataw_ciriane_rebellion.3802.b_tt: "Вы #N тайно#! примете конфессию [GetFaithByKey('ciriane_paganism').GetAdjective]"
 dataw_ciriane_rebellion.3802.c: "Как в Божественный век! Ваши боги — мои боги!"
 dataw_ciriane_rebellion.3802.d: "Стража, заточить этих еретиков."
 tolerates_pagans:0 "Терпимость к язычникам"
 tolerates_pagans_hidden:0 "Терпимость к язычникам"
### Ally with the Ciriane Cult Event Chain
 # EVENT: Vassal Conversion
 dataw_ciriane_rebellion.3803.t: "Обращение [Select_CString(vassal.IsFemale, 'вассалки', 'вассала' )]"
 dataw_ciriane_rebellion.3803.desc: "[Select_CString(vassal.IsFemale, 'Моя вассалка', 'Мой вассал' )] [vassal.GetName] с гордостью сообщает, что [Select_CString(vassal.IsFemale, 'вернулась', 'вернулся' )] к древней вере предков. [Select_CString(vassal.IsFemale, 'Она умоляет', 'Он умоляет' )] и меня прозреть, признать старых богов, отвергнуть ложные пророчества [andraste.GetName] и учение Орлесианской церкви. Под властью Орлея подобный шаг почти немыслим…\n\n#N …но [Select_CString(ROOT.Char.IsFemale, 'независимой правительнице', 'независимому правителю' )] собственная местная вера принесла бы немало пользы.#!"
 dataw_ciriane_rebellion.3803.a: "Я присоединюсь к тебе, [Select_CString(vassal.IsFemale, 'моя вассалка', 'мой вассал' )]!"
 dataw_ciriane_rebellion.3803.a_tt: "Вы примете конфессию [GetFaithByKey('ciriane_paganism').GetAdjective]"
 dataw_ciriane_rebellion.3803.t_tt: "Вы решили во всём поддерживать Орлей."
 dataw_ciriane_rebellion.3803.b: "Держава может терпеть иные религии… за определённую плату."
 dataw_ciriane_rebellion.3803.c: "Старым обычаям место в прошлом, [vassal.GetFirstName]. Покайся или познай гнев [andraste.GetName]!"

### Ally with the Ciriane Cult Event Chain
 # EVENT: Heretic Liege
 dataw_ciriane_rebellion.3804.t: "[Select_CString(nahashin.IsFemale, 'Сюзерен-еретичка', 'Сюзерен-еретик' )]"
 dataw_ciriane_rebellion.3804.desc: "Из столицы моего сюзерена приходят тревожные вести. Похоже, [nahashin.GetName] [Select_CString(nahashin.IsFemale, 'отвернулась', 'отвернулся' )] от [Concept('chant_of_light','Песни Света')|E] и [Select_CString(nahashin.IsFemale, 'вернулась', 'вернулся' )] к конфессии [GetFaithByKey('ciriane_paganism').GetAdjective].\n\nПридворные жрецы пугают меня близкой гражданской войной и предупреждают: вскоре Верховная Жрица и [orlais.GetTitleAsNameNoTooltip] обрушат гнев Создателя на всё наше герцогство,\n\n#N если я не нанесу удар [Select_CString(ROOT.Char.IsFemale, 'первой', 'первым' )].#!"
 dataw_ciriane_rebellion.3804.a: "Быть может, настало время выбрать нового правителя."
 dataw_ciriane_rebellion.3804.b: "Отправить весть Верховной Жрице и молить о помощи."
 dataw_ciriane_rebellion.3804.c: "Стража, проводить жреца Андрасте прочь."

### Ally with the Ciriane Cult Event Chain
 # EVENT: Ciriane Revival
 dataw_ciriane_rebellion.3805.t: "Возрождение цириан"
 dataw_ciriane_rebellion.3805.desc: "Получив приказ, [cp.GetName] врывается в мои покои. #italic «При всём уважении, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )]»,#! — начинает [Select_CString(cp.IsFemale, 'советница', 'советник' )].\n\n #italic «Вы ведь не думаете, что народ быстро обратится в новую веру. Более века люди следовали наставлениям Церкви. Если вы хотите при жизни увидеть возвращение Нахашина к старым обычаям, придётся вложить немалые средства».#!\n\nПохоже, это действительно правда, а не очередная попытка [Select_CString(cp.IsFemale, 'советницы', 'советника' )] вытребовать больше денег.\n\n#N Но в казне должны остаться средства и на другие нужды…#!"
 dataw_ciriane_rebellion.3805.a: "Не спеши. Это труд для нескольких поколений."
 dataw_ciriane_rebellion.3805.a_tt: "Персонаж [cp.GetName] продолжит работу #N без усиления#!"
 dataw_ciriane_rebellion.3805.b: "Я поставлю на кон свою репутацию ради этого дела"
 dataw_ciriane_rebellion.3805.b_tt: "Персонаж [cp.GetName] продолжит работу #N с небольшим усилением#!"
 dataw_ciriane_rebellion.3805.c: "Я вложу средства в это дело."
 dataw_ciriane_rebellion.3805.c_tt: "Персонаж [cp.GetName] продолжит работу #N с умеренным усилением#!"
