l_russian:
## Ciriane Rebellion Events - 1000
# 1000 - 1999 is all Roux/K_Nahashin Perspective
# 2000-2499 is all D_Serault Perspective
# 2500-2999 is all D_Alyons Perspective
# 3000-3499 is all Orlais Perspective
# 3500-3999 is all Misc
# Day After Red Crossing has happened
#### Nahashin Holder decides if he wants to rebel
 dataw_ciriane_rebellion.1000.t: "Цирианский вопрос"
 dataw_ciriane_rebellion.1000.desc: "С тех пор как при [kordillus_i.GetName] возвысилась Орлесианская империя, прежде разрозненные кланы народа [GetGlobalVariable('ciriane_culture_var').Culture.GetName] объединились в единую гордую нацию. Во всяком случае, именно такую историю рассказывают себе наши правители из державы [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier]. Здесь, в землях [GetGeographicalRegion('custom_mareschois_population').GetName], власть столицы всегда была… в лучшем случае непрочной.\n\nВ этих краях до сих пор живы отголоски и воспоминания о старых обычаях — о временах, когда жители болот были свободным народом. #italic Возможно ли, что однажды мы вновь обретём свободу?#! Мы живём на окраине империи — и географически, и культурно. [orlais.GetTitleAsNameNoTooltip] в далёком Вал Руайо не знает нас и не понимает наших обычаев. Да и как [Select_CString(kordillus_i.IsFemale, 'она могла бы', 'он мог бы' )] их понять? В последнее время подобные мысли всё чаще занимают мой разум. Странная судьба зовёт меня.\n\n#italic #N Осмелюсь ли я сделать шаг ей навстречу?#!#!"
 dataw_ciriane_rebellion.1000.a: "Не принесу ли я своему народу больше пользы как [Select_CString(ROOT.Char.IsFemale, 'независимая королева', 'независимый король' )]?"
 dataw_ciriane_rebellion.1000.b: "Нет, это безумие — измена. Империя была добра к нам."
 dataw_ciriane_rebellion.1000.c: "Этот пережиток прошлого следует сокрушить! Ради [orlais.GetTitleAsNameNoTooltip]."
 dataw_ciriane_rebellion.1000.a_tt: "Вы решаете #N со временем поднять восстание.#! Начнётся сюжетный цикл «Восстание цириан», в ходе которого вы сможете наращивать силы до событий в Ред-Кроссинге. #N Если вы победите Орлей в войне за независимость, то откроете новые события и решения, позволяющие возродить Цирианскую империю и реформировать цирианскую религию.#! Если с началом войны за Долы вы откажетесь от восстания, то столкнётесь с мятежом цириан: вы передумали в последний миг, хотя уже убедили их выступить вместе с вами."
 dataw_ciriane_rebellion.1000.b_tt: "Вы навсегда останетесь #N [Select_CString(ROOT.Char.IsFemale, 'вассалкой', 'вассалом' )]#! Орлесианской империи, будете хранить молчание и покоритесь её власти."
 dataw_ciriane_rebellion.1000.c_tt: "Вы останетесь [Select_CString(ROOT.Char.IsFemale, 'вассалкой', 'вассалом' )] и постараетесь сблизиться с [orlais.GetTitleAsNameNoTooltip]. Начнётся другая цепочка событий: вместо восстания вы будете улучшать отношения с Орлеем и укреплять оборону империи. #N Вы откроете решения и события, направленные на сближение с Орлеем и подавление мятежных цириан и долийцев.#! Вы немедленно отправитесь в столицу, принесёте клятву верности [orlais.GetTitleAsNameNoTooltip] и примете конфессию Орлесианской церкви."

# Ally with Alyons/Serault
 dataw_ciriane_rebellion.1001.t: "Предложение дружбы"
 dataw_ciriane_rebellion.1001.desc: "Готовя дипломатические предложения соседям, я никак не могу отделаться от мысли об их неизбежном ответе.\n\n#italic «А что получу я?»#! — этот вопрос погубил немало исторических союзов.\n\nЕсли я рассчитываю, что [ally_target.GetName] выступит вместе со мной против величайшей империи в [Concept('thedas','Тедасе')|E], то [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] предложить нечто стоящее.\n\n#italic #N Но что у меня есть такого, в чём нуждаются они? И как сделать так, чтобы их зависимость от меня сохранилась надолго?#!#!"
 dataw_ciriane_rebellion.1001.a: "Неужели моей репутации недостаточно? [prestige_i]"
 dataw_ciriane_rebellion.1001.b: "У меня достаточно золота, чтобы заинтересовать их… [gold_i]"
 dataw_ciriane_rebellion.1001.c: "Я предложу им часть своих лишних земель. [stewardship_i]"
 dataw_ciriane_rebellion.1001.c_tt: "У вас нет лишнего графства, граничащего с владениями [ally_target.GetName]"
 dataw_ciriane_rebellion.1001.g_tt: "У персонажа [nahashin.GetName] нет лишнего графства, граничащего с вашими владениями, либо [Select_CString(nahashin.IsFemale, 'она уже предложила', 'он уже предложил' )] вам землю"
 dataw_ciriane_rebellion.1001.j_tt: "Персонаж [nahashin.GetName] уже [Select_CString(nahashin.IsFemale, 'предложила', 'предложил' )] вам землю"

 DATAW_ciriane_rebellion.1001.a.serault_convinced: "Вам удаётся убедить державу [GetTitleByKey('d_serault').GetBaseNameNoTier] поддержать вашу независимость"
 DATAW_ciriane_rebellion.1001.a.serault_not_convinced: "Вам не удаётся убедить державу [GetTitleByKey('d_serault').GetBaseNameNoTier] поддержать вашу независимость"
 DATAW_ciriane_rebellion.1001.a.alyons_convinced: "Вам удаётся убедить державу [GetTitleByKey('d_alyons').GetBaseNameNoTier] поддержать вашу независимость"
 DATAW_ciriane_rebellion.1001.a.alyons_not_convinced: "Вам не удаётся убедить державу [GetTitleByKey('d_alyons').GetBaseNameNoTier] поддержать вашу независимость"

 DATAW_ciriane_rebellion.1001.b.serault_bribed: "Вы подкупаете державу [GetTitleByKey('d_serault').GetBaseNameNoTier], чтобы она поддержала вашу независимость"
 DATAW_ciriane_rebellion.1001.b.serault_not_bribed: "Вам не удаётся подкупить державу [GetTitleByKey('d_serault').GetBaseNameNoTier] и добиться поддержки вашей независимости"
 DATAW_ciriane_rebellion.1001.b.alyons_bribed: "Вы подкупаете державу [GetTitleByKey('d_alyons').GetBaseNameNoTier], чтобы она поддержала вашу независимость"
 DATAW_ciriane_rebellion.1001.b.alyons_not_bribed: "Вам не удаётся подкупить державу [GetTitleByKey('d_alyons').GetBaseNameNoTier] и добиться поддержки вашей независимости"

 DATAW_ciriane_rebellion.1001.a.serault_notify_roux: "Держава [GetTitleByKey('d_serault').GetBaseNameNoTier] присоединяется к державе [GetTitleByKey('e_orlais').GetBaseNameNoTier], чтобы остановить ваше восстание"
 DATAW_ciriane_rebellion.1001.a.alyons_notify_roux: "Держава [GetTitleByKey('d_alyons').GetBaseNameNoTier] присоединяется к державе [GetTitleByKey('e_orlais').GetBaseNameNoTier], чтобы остановить ваше восстание"
 DATAW_ciriane_rebellion.1001.a.serault_notify_orlais: "Держава [GetTitleByKey('d_serault').GetBaseNameNoTier] присоединяется к вам, чтобы остановить восстание державы [GetTitleByKey('k_nahashin').GetBaseNameNoTier]"
 DATAW_ciriane_rebellion.1001.a.alyons_notify_orlais: "Держава [GetTitleByKey('d_alyons').GetBaseNameNoTier] присоединяется к вам, чтобы остановить восстание державы [GetTitleByKey('k_nahashin').GetBaseNameNoTier]"

 DATAW_ciriane_rebellion.1001.a.serault_orlais_notify: "Держава [GetTitleByKey('d_serault').GetBaseNameNoTier] решает присоединиться к готовящемуся восстанию державы [GetTitleByKey('k_nahashin').GetBaseNameNoTier]"
 DATAW_ciriane_rebellion.1001.a.alyons_orlais_notify: "Держава [GetTitleByKey('d_alyons').GetBaseNameNoTier] решает присоединиться к готовящемуся восстанию державы [GetTitleByKey('k_nahashin').GetBaseNameNoTier]"

#### K Nahashin Holder Declaration of Independene
 dataw_ciriane_rebellion.1002.t: "Провозглашение независимости"
 dataw_ciriane_rebellion.1002.desc: "С каждым новым донесением вести с юга становятся всё мрачнее. Между империей и Долами разгорелась настоящая война.\n\nНо пока другие предаются отчаянию, я наконец вижу свой шанс… Имперские войска увязли в борьбе с эльфами. Быть может, настало время привести наши планы в исполнение и положить конец господству державы [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier] над этими болотами."
 dataw_ciriane_rebellion.1002.n.e.desc: "Я возвращаюсь в столицу [Select_CString(ROOT.Char.IsFemale, 'избитой и окровавленной, но живой', 'избитым и окровавленным, но живым' )]. Мне пришлось пережить тяжёлое испытание в руках псов [orlais.GetTitleAsNameNoTooltip], однако каким-то чудом удалось спастись.\n\nЗа долгие недели бегства и скитаний по стране у меня почти не было времени осознать, что я снова на свободе. Теперь, оказавшись дома, я громко смеюсь от облегчения. Стражники спешат навстречу и сопровождают меня в замок.\n\nВскоре, после горячей ванны и сытной трапезы, я сижу в тронном зале и обдумываю дальнейшие действия. Тайное стало явным: застать [orlais.GetTitleAsNameNoTooltip] врасплох уже не удастся. Страдания последних недель — лишь малая доля того, что ждёт меня и весь болотный народ, если всё пойдёт не по плану.\n\n#N Насколько далеко я действительно [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )] зайти?#!"
 dataw_ciriane_rebellion.1002.n.d.m.desc: "Я стою с каменным лицом и молчу, пока слуги облачают меня в церемониальные одежды. Теперь я — [nahashin.GetTitleAsNameNoTooltip], и мне предстоит обратиться к народу.\n\nВести, недавно достигшие болот, вызвали волну недовольства: [Select_CString(nahashin_past_holder.IsFemale, 'моя предшественница была убита', 'мой предшественник был убит' )] при попытке бежать из темниц державы [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier].\n\n#N Во всяком случае, так утверждает [orlais.GetTitleAsNameNoTooltip].#!\n\nКакой бы ни была правда, народ ропщет, едва скрывая гнев. Для многих [nahashin_past_holder.GetName] [Select_CString(nahashin_past_holder.IsFemale, 'была символом', 'был символом' )]. Теперь же [Select_CString(nahashin_past_holder.IsFemale, 'она вполне может стать мученицей', 'он вполне может стать мучеником' )].\n\n#N Нужно лишь раздуть пламя…#!"
 dataw_ciriane_rebellion.1002.n.d.f.desc: "Я стою с каменным лицом и молчу, пока служанки облачают меня в церемониальные одежды. Теперь я — [nahashin.GetTitleAsNameNoTooltip], и мне предстоит обратиться к народу.\n\nВести, недавно достигшие болот, вызвали волну недовольства: [Select_CString(nahashin_past_holder.IsFemale, 'моя предшественница была убита', 'мой предшественник был убит' )] при попытке бежать из темниц державы [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier].\n\n#N Во всяком случае, так утверждает [orlais.GetTitleAsNameNoTooltip].#!\n\nКакой бы ни была правда, народ ропщет, едва скрывая гнев. Для многих [nahashin_past_holder.GetName] [Select_CString(nahashin_past_holder.IsFemale, 'была символом', 'был символом' )]. Теперь же [Select_CString(nahashin_past_holder.IsFemale, 'она вполне может стать мученицей', 'он вполне может стать мучеником' )].\n\n#N Нужно лишь раздуть пламя…#!"
 dataw_ciriane_rebellion.1002.a: "Момент подходит как нельзя лучше! @skill_martial_icon!"
 dataw_ciriane_rebellion.1002.b: "Хотя… Быть может, стоит отказаться от этой глупой затеи. @warning_icon!"
 DATAW_ciriane_rebellion.1002.b.coward: "Вы лишитесь престижа за то, что задумали восстание, а затем отступили, словно #N трус.#!"
 DATAW_ciriane_declare_independence_tt: "Вы #N немедленно обретёте независимость от Орлея#!. Орлей сможет напасть на вас сейчас, напасть после войны за Долы или признать вашу независимость."
 dataw_ciriane_rebellion.1002.n.e.a: "Свободу невозможно завоевать без жертв. Я не отступлю! @skill_martial_icon!"
 dataw_ciriane_rebellion.1002.n.e.b: "Следует прекратить это безумие, пока всё не зашло ещё дальше. @warning_icon!"
 dataw_ciriane_rebellion.1002.n.d.a: "Позовите писца. Мы ясно объявим Вал Руайо о своих намерениях! @skill_martial_icon!"
 dataw_ciriane_rebellion.1002.n.d.b: "Всё это — одно тщеславие. Обвините смутьянов в оскорблении величества. @warning_icon!"
 DATAW_ciriane_rebellion.1002.n.e.b_tt: "Вы отказываетесь от замысла и раз и навсегда прекращаете #N Восстание цириан#!"

#### K Nahashin #Declares War# of Independence
 dataw_ciriane_rebellion.1003.t: "Ответный удар"
 dataw_ciriane_rebellion.1003.desc: "Как я и [Select_CString(ROOT.Char.IsFemale, 'опасалась', 'опасался' )], даже после ран, нанесённых эльфийским вторжением, дракон не намерен покорно принять наше отделение. Война всё же неизбежна: мощь Орлесианской империи выступит против объединённых сил моих воинов и союзников."
 dataw_ciriane_rebellion.1003.n.e.desc: "Как и следовало ожидать, [orlais.GetTitleAsNameNoTooltip] [Select_CString(orlais.IsFemale, 'не намерена', 'не намерен' )] мириться с тем, что я, невзирая ни на что, продолжаю разжигать восстание.\n\nТо, что я всё ещё [Select_CString(ROOT.Char.IsFemale, 'жива', 'жив' )], должно приводить [Select_CString(orlais.IsFemale, 'её', 'его' )] в ярость. Эта мысль хотя бы немного меня забавляет, даже когда я готовлюсь к войне против всей мощи Орлея.\n\n#N Пришло время отомстить моим тюремщикам и разорвать последние цепи, связывающие меня и болотный народ с [orlais.GetTitleAsNameNoTooltip].#!"
 dataw_ciriane_rebellion.1003.n.d.desc: "Ответ столицы приходит быстро и звучит холодно.\n\nТеперь [orlais.GetTitleAsNameNoTooltip] понимает: одного лишь заточения персонажа [nahashin_past_holder.GetName] было недостаточно, чтобы сломить мятежный дух болот. Отрубив змее голову, [Select_CString(orlais.IsFemale, 'она лишь позволила', 'он лишь позволил' )] трём новым вырасти на её месте.\n\n#N Теперь имперские войска собираются, чтобы раз и навсегда сокрушить наше восстание.#!"
 dataw_ciriane_rebellion.1003.ns.a.desc: "Сегодня утром из столицы прибыл гонец с ответом [orlais.GetTitleAsNameNoTooltip] на наше объявление войны. Читая послание, я улыбаюсь: несмотря на всю браваду [orlais.GetTitleAsNameNoTooltip], империя и впрямь не ожидала такого поворота. Теперь там спешно готовятся к войне, но преимущество на нашей стороне.\n\n#N В отличие от эльфов Долов, я знаю образ мыслей орлесианцев — в конце концов, разве я не [Select_CString(ROOT.Char.IsFemale, 'была одной', 'был одним' )] из них?#!"
 dataw_ciriane_rebellion.1003.a: "Пусть приходят. Мы встретим их во всеоружии."
 dataw_ciriane_rebellion.1003.n.e.a: "К оружию!"
 dataw_ciriane_rebellion.1003.n.e.d: "Они недооценивают нашу решимость."
 dataw_ciriane_rebellion.1003.ns.a: "Итак, всё начинается."
 DATAW_ciriane_retaliation_war_tt: "#N Официально начнётся война за независимость!#! Мы дадим отпор орлесианским захватчикам!"
 DATAW_ciriane_retaliation_war_next_steps_tt: "#N Наши завоевания увенчаются успехом! Отнимая королевство за королевством, мы ослабим Орлесианскую империю!#!"
 DATAW_ciriane_retaliation_imprisonment_freed_tt: "Попытка Орлея заточить вас вызвала возмущение: #N вам на помощь придёт войско из 10 000 жителей болот и местных племён!#!"
 DATAW_ciriane_retaliation_early_cause_tt: "В силу особых обстоятельств и из-за того, что удобный момент ускользает, вам на помощь сформировано войско жителей болот и местных племён!#!"
 DATAW_ciriane_retaliation_imprisonment_died_tt: "Ваш предшественник погиб от рук орлесианцев: #N вам на помощь придёт войско из 14 500 жителей болот и местных племён!#!"


 dataw_ciriane_rebellion.1003.nevarra: "Неваррские наёмники"
 dataw_ciriane_rebellion.1003.ciriane: "Цирианская сталь"
 dataw_ciriane_rebellion.1003.dalish: "Долийская меткость"
 dataw_ciriane_rebellion.1003.fereldan: "Ферелденская мощь"
 dataw_ciriane_rebellion.1003.nevarra_tt: "Вам на помощь придут #N неваррские наёмники#!"
 dataw_ciriane_rebellion.1003.ciriane_tt: "Вам на помощь придёт #N Цирианская сталь#!"
 dataw_ciriane_rebellion.1003.dalish_tt: "Вам на помощь придёт #N Долийская меткость#!"
 dataw_ciriane_rebellion.1003.fereldan_tt: "Вам на помощь придёт #N Ферелденская мощь#!"

 #### K Nahashin loses the rebellion war (folded)
 dataw_ciriane_rebellion.1004.t: "Война проиграна"
 dataw_ciriane_rebellion.1004.desc: "Мы сражались доблестно и упорно, но этого оказалось недостаточно. Война проиграна, а вместе с ней угасла и надежда на свободу. Стиснув зубы, я склоняю голову и подписываю грамоту с требованиями империи. Так заканчивается моё недолгое правление в качестве [Select_CString(ROOT.Char.IsFemale, 'королевы', 'короля' )].\n\n#N Последствия неизбежны: [orlais.GetName] не оставит это восстание безнаказанным. Остаётся лишь надеяться, что кара падёт на мои плечи, а не на мой народ.#!"
 dataw_ciriane_rebellion.1004.a: "Стоило ли оно того?"
 DATAW_cirianes_lost: "#N Наша борьба окончена…#!"

# Unique Desc for Roux

 dataw_ciriane_rebellion.1004.desc.r: "Мы сражались доблестно и упорно, но этого оказалось недостаточно. Война проиграна, а вместе с ней угасла и надежда на свободу. Стиснув зубы, я склоняю голову и подписываю грамоту с требованиями империи. Так заканчивается моё недолгое правление в качестве [Select_CString(ROOT.Char.IsFemale, 'королевы', 'короля' )]. Последствия неизбежны: [orlais.GetName] не оставит это восстание безнаказанным — особенно теперь, когда кровь [Select_CString(orlais.IsFemale, 'её', 'его' )] [Select_CString(cyril.IsFemale, 'сестры', 'брата' )] [cyril.GetFirstName] осталась на моём клинке."

 #### K Nahashin wins the rebellion war 
 dataw_ciriane_rebellion.1005.t: "Победа болот"
 dataw_ciriane_rebellion.1005.desc: "Свершилось. Каждая капля пролитой крови Нахашина стоила этой победы: мы отстояли независимость. Войска державы [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier] сражались упорно, но мы — ещё упорнее. Я с гордостью смотрю в лица воинов — отважных сыновей и дочерей болот.\n\nВместе мы совершили невозможное и отбросили могучего дракона. Когда я зачитываю собравшимся воинам грамоту из державы [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier], в которой [orlais.GetName] объявляет о безоговорочной капитуляции, над войском разносится торжествующий крик.\n\n#N Я [Select_CString(ROOT.Char.IsFemale, 'подарила', 'подарил' )] своему дому и подданным будущее, полное свободы и надежды.#!"
 dataw_ciriane_rebellion.1005.a: "Стоило ли оно того?"
 DATAW_cirianes_win: "Битва окончена… #N Мы победили!#!"

#### Roux POV Duel
 dataw_ciriane_rebellion.1006.t: "Явление дракона"
 dataw_ciriane_rebellion.1006.desc: "В каждой битве с народом [GetGlobalVariable('orlesian_culture_var').Culture.GetName] я сражаюсь бок о бок со своими людьми. Сравнивать поле боя с чем-либо ещё бессмысленно: ничто не похоже на прилив сил, охватывающий человека посреди этого хаоса. И нигде больше не испытываешь такого страха, видя, как легко обрывается жизнь. Храбр тот, кто не поддаётся страху, а преодолевает его и добивается своей цели. Это восстание заставило меня не раз познать страх, но оно же сделало меня лучше. Надеюсь, достаточно, чтобы стать [Select_CString(ROOT.Char.IsFemale, 'достойной правительницей', 'достойным правителем' )] своего народа.\n\nПоток мыслей прерывает клинок, мелькнувший перед глазами. Повинуясь инстинкту, я ловлю его изогнутым лезвием топора, затем подаюсь вперёд и прижимаю оружие противника к нагруднику орлесианского рыцаря. На краткий миг наши взгляды встречаются. Я заношу топор и одним стремительным ударом перерубаю рыцарю горло. Он падает наземь и тут же исчезает под копытами несущейся конницы.\n\nПридя в себя, я замечаю, как один из рыцарей спешивается. Его доспехи выглядят куда лучше тех, что мне доводилось видеть за время восстания. Он обнажает необычный меч — явно передо мной кто-то важный. И тут я понимаю: это представитель рода, который я [Select_CString(ROOT.Char.IsFemale, 'поклялась', 'поклялся' )] сокрушить. Неужели [cyril.GetFirstName] [cyril.GetDynastyHouseName], [Select_CString(cyril.IsFemale, 'одна из последних представительниц', 'один из последних представителей' )] своего дома, [Select_CString(cyril.IsFemale, 'решила', 'решил' )] лично вызвать меня на поединок? Да это ещё ребёнок, чтоб его. Но посреди этой битвы [Select_CString(cyril.IsFemale, 'её', 'его' )] уже не образумить."
 dataw_ciriane_rebellion.1006.a: "#italic #color_red Мне придётся убить этого ребёнка? Да будет так.#!#!"

#### Roux POV Duel
 dataw_ciriane_rebellion.1007.t: "Убитый дракон"
 dataw_ciriane_rebellion.1007.desc: "Клинок персонажа [cyril.GetFirstName] [cyril.GetDynastyHouseName] с лязгом встречается с моим оружием, и мы оба на мгновение отшатываемся. Юный рыцарь тут же бросается вперёд, целясь остриём меча мне в живот.\n\nСжимая рукоять топора правой рукой, я успеваю отвести удар в сторону и избежать смертельной раны. Но клинок всё же находит левое плечо и рассекает плоть.\n\nЯ вскрикиваю от боли и отвечаю собственным ударом. Раздаётся новый крик — уже не мой: лезвие топора глубоко входит в грудь персонажа [cyril.GetFirstName].\n\n#N Из раны хлещет алая кровь, и выражение [Select_CString(cyril.IsFemale, 'её', 'его' )] лица меняется.#!\n\nЭто страх — за время восстания я слишком хорошо [Select_CString(ROOT.Char.IsFemale, 'его изучила', 'его изучил' )].\n[cyril.GetFirstName] пытается вытолкнуть топор из груди. В пробитом нагруднике зияет дыра, но рыцарь уже готовится нанести новый удар.\n\nНе дав молодому дракону опомниться, я развиваю успех. Когда [Select_CString(cyril.IsFemale, 'она заносит', 'он заносит' )] руки над головой, я бросаюсь вперёд и валю противника наземь. При падении меч вылетает из [Select_CString(cyril.IsFemale, 'её', 'его' )] руки и теряется среди множества сражающихся воинов.\n\nМолодой дракон несколько раз попадает по мне, но лишь один удар латной перчаткой разбивает губу до крови. Однако прилив сил — грозное оружие, и боль меня не останавливает. Несмотря на беспорядочные удары, я отбрасываю руки противника и заношу топор над головой.\n\n#G В последние мгновения [cyril.GetFirstName] [cyril.GetDynastyHouseName] не [Select_CString(cyril.IsFemale, 'произнесла', 'произнёс' )] ни слова.#!\n\nВсё произошло слишком быстро, а вокруг кипела такая схватка, что [Select_CString(cyril.IsFemale, 'она', 'он' )] даже не [Select_CString(cyril.IsFemale, 'успела', 'успел' )] понять неизбежное. Я [Select_CString(ROOT.Char.IsFemale, 'запомнила', 'запомнил' )] лишь страх в глазах ребёнка за миг до того, как топор рассёк [Select_CString(cyril.IsFemale, 'её', 'его' )] лицо.\n\n#N Удар пришёлся точно меж глаз, забрызгав меня новой порцией крови.#!\n\nВскоре трубят рога, и я слышу, как орлесианские офицеры приказывают отступать. Мои воины устремляются следом и рубят бегущих врагов, а я поднимаюсь на ноги. Некоторое время смотрю им вслед, затем перевожу взгляд на тело персонажа [cyril.GetFirstName] [cyril.GetDynastyHouseName]."
 dataw_ciriane_rebellion.1007.a: "#N Я не [Select_CString(ROOT.Char.IsFemale, 'хотела', 'хотел' )] убивать этого ребёнка.#!"

#### Next Step
 dataw_ciriane_rebellion.1008.t: "Дальнейшие шаги"
 dataw_ciriane_rebellion.1008.desc: "Стоя на балконе своей крепости, я окидываю взглядом владения. Эти болота дики и зловещи… и наконец-то #italic свободны.#!\n\nЯ — #color_goldy_yellow [GetPlayer.GetTitleAsNameNoTooltip] Болот#!, и мой народ больше не преклонит колено перед державой [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier]. Но теперь нужно как можно скорее решить множество вопросов.\n\nНаше положение шатко: для молодой державы любая ошибка может стать роковой. Сегодня [orlais.GetTitleAsNameNoTooltip] [Select_CString(orlais.IsFemale, 'даровала', 'даровал' )] нам свободу, но что будет завтра? И что делать с эльфами на юге, которые прямо сейчас наступают на орлесианскую столицу?\n\n#N Мне предстоит принять решения, которые навсегда определят наши отношения с империей.#!"
 dataw_ciriane_rebellion.1008.a: "Ударить сейчас и ослабить империю, пока она уязвима. @skill_martial_icon!"
 dataw_ciriane_rebellion.1008.a_tt: "#N Вы заявите права на орлесианские земли и начнёте войну за завоевание всей державы [GetTitleByKey('k_blasted_hills').GetBaseNameNoTier]. Это будет завоевательная война: в случае поражения Орлей не сделает вас [Select_CString(ROOT.Char.IsFemale, 'своей вассалкой', 'своим вассалом' )].#!"
 dataw_ciriane_rebellion.1008.b: "Предложить союз против долийского вторжения. @alliance_icon!"
 dataw_ciriane_rebellion.1008.b_tt: "#N Если Орлей примет предложение, вы автоматически вступите в войну против Долов на его стороне. Союз молодой независимой державы с Орлесианской империей станет мудрым решением.#!"
 dataw_ciriane_rebellion.1008.c: "Не вмешиваться: у нас достаточно собственных забот"
 dataw_ciriane_rebellion.1008.c_tt: "#N Вы удалитесь в свои покои уже как [GetPlayer.GetTitleAsNameNoTooltip] Болот. Вы завоевали свободу для своего народа и теперь сможете ею насладиться.#!"
 dataw_ciriane_rebellion.1008.d_tt: "Восстание цириан завершилось, но их история продолжается. Вы открыли новые решения и события, позволяющие возродить Цирианское королевство."

#### War with the Dales!
 dataw_ciriane_rebellion.1009.t: "Война с Долами!"
 dataw_ciriane_rebellion.1009.desc: "Напряжение между империей и варварскими эльфами юга наконец достигло предела.\n\nЭльфы неудержимым потоком хлынули через границу, а их чёрные сердца полны ненависти ко всему доброму и чистому. Пришло время доказать, что моя клятва [orlais.GetTitleAsNameNoTooltip] была дана не напрасно.\n\n#N Сегодня мы, орлесианцы, вместе выступим против долийской орды.#!"
 dataw_ciriane_rebellion.1009.a: "За Орлей! За человечество!"

#### D_Serault Holder deciding if they want to support Roux or not (Player)
 dataw_ciriane_rebellion.2000.t: "[Select_CString(nahashin.IsFemale, 'Мятежная', 'Мятежный' )] [nahashin.GetTitleAsNameNoTooltip]"
 dataw_ciriane_rebellion.2000.desc: "Я сижу в верхней палате здания [GetBuilding('serault_castle_01').GetName] и потягиваю вино. С гордостью оглядываю свои владения: стекольные мастерские Серо прославлены по всему Орлею и далеко за его пределами. Внезапное появление гонца прерывает мои размышления. #italic «Вести с Болот, ваша светлость».#! Нахмурившись, я разворачиваю послание.\n\nПохоже, [nahashin.GetName], чьи земли лежат к востоку, готовит восстание за независимость против [orlais.GetName]… и просит моей поддержки. Послание полно сладких речей, но между строк искусно вплетены многочисленные угрозы. «Поддержите [orlais.GetTitleAsNameNoTooltip] на свой страх и риск», — словно бы гласит письмо. Я поджимаю губы, обдумывая ответ."
 dataw_ciriane_rebellion.2000.a: "Как [Select_CString(nahashin.IsFemale, 'она смеет', 'он смеет' )] мне угрожать? Так дружбы не добиваются."
 dataw_ciriane_rebellion.2000.b: "Но отказ может навлечь на нас серьёзные неприятности со стороны болот… @alliance_icon!"
 dataw_ciriane_rebellion.2000.c: "Я предложу иные условия"
# Bribery Variant
 dataw_ciriane_rebellion.2000.b.desc: "Я сижу в верхней палате здания [GetBuilding('serault_castle_01').GetName] и потягиваю вино. С гордостью оглядываю свои владения: стекольные мастерские Серо прославлены по всему Орлею и далеко за его пределами. Внезапное появление гонца прерывает мои размышления. #italic «Вести с Болот, ваша светлость».#! Нахмурившись, я разворачиваю послание.\n\nПохоже, [nahashin.GetName], чьи земли лежат к востоку, готовит восстание за независимость против [orlais.GetName]… и просит моей поддержки. К записке приложен #italic «малый знак»#! #italic «высочайшего почтения»#! со стороны [nahashin.GetTitleAsNameNoTooltip]: сундук, до краёв наполненный сверкающими роялами народа [GetGlobalVariable('orlesian_culture_var').Culture.GetName]. Неприкрытая попытка подкупа, за которой угадывается обещание новых богатств. Но осмелюсь ли я выступить против могущественной державы [GetTitleByKey('e_orlais').GetBaseName], которая наверняка постарается сокрушить [Select_CString(nahashin.IsFemale, 'мятежницу', 'мятежника' )] и всех, кто присоединится к [Select_CString(nahashin.IsFemale, 'ней', 'нему' )]? Я поджимаю губы, обдумывая ответ."
 dataw_ciriane_rebellion.2000.a.b: "Но этим деньгам найдётся применение… @alliance_icon!"
 dataw_ciriane_rebellion.2000.b.b: "Меня не так легко купить!"
 dataw_ciriane_rebellion.2000.c.b: "Я предложу иные условия"
# Land Gift Variant
 dataw_ciriane_rebellion.2000.c.desc: "Я сижу в верхней палате здания [GetBuilding('serault_castle_01').GetName] и потягиваю вино. С гордостью оглядываю свои владения: стекольные мастерские Серо прославлены по всему Орлею и далеко за его пределами. Внезапное появление гонца прерывает мои размышления. #italic «Вести с Болот, ваша светлость».#! Нахмурившись, я разворачиваю послание.\n\nПохоже, [nahashin.GetName], чьи земли лежат к востоку, готовит восстание за независимость против [orlais.GetName]… и просит моей поддержки. К письму приложена другая грамота, передающая мне землю и титул в Нахашине. [nahashin.GetTitleAsNameNoTooltip] Нахашина [Select_CString(nahashin.IsFemale, 'готова', 'готов' )] пожертвовать собственными владениями ради моей поддержки, но можем ли мы надеяться выстоять против империи даже сообща?\n\nПредложение: [spare_county.GetName]"
 dataw_ciriane_rebellion.2000.a.c: "С другой стороны, отодвинуть границу было бы неплохо… @alliance_icon!"
 dataw_ciriane_rebellion.2000.b.c: "У Серо достаточно земель и без помощи Нахашина!"
 dataw_ciriane_rebellion.2000.c.c: "Я предложу иные условия"

 DATAW_ciriane_support_roux_tt: "Вы #P поддержите#! персонажа [nahashin.GetName] в борьбе за независимость."
 DATAW_ciriane_support_roux_disrespected_tt: "Вас унизили: подаренный сундук пуст и ничего не стоит… #N Вы всё ещё желаете заключить союз?#!"
 DATAW_ciriane_dont_support_roux_tt: "Вы #N не поддержите#! персонажа [nahashin.GetName] в борьбе за независимость."
 DATAW_ciriane_something_else_tt: "#N Вы отправите дополнительные требования#! персонажу [nahashin.GetName]: нынешнего предложения недостаточно"
 DATAW_ciriane_insulted_tt: "#N Персонаж [nahashin.GetName] оскорбляет вас, предлагая 0[gold_i]#!"

#### D_Alyons Holder deciding if they want to support Roux or not (Player)
 dataw_ciriane_rebellion.2500.t: "[Select_CString(nahashin.IsFemale, 'Мятежная', 'Мятежный' )] [nahashin.GetTitleAsNameNoTooltip]"
 dataw_ciriane_rebellion.2500.desc: "В честь удачного года я откупориваю бутылку чёрного алайонского вина. Урожай выдался щедрым, а кладовые замка полны луговых грибов, дикого фенхеля и гвоздики — верный признак того, что земля хорошо оправляется от разорения Второго [Concept('blight','Мора')|E]. Междуречье плодородно как никогда, и весь маркизат процветает. Но моё хорошее настроение нарушает гонец из земель [GetGeographicalRegion('custom_mareschois_population').GetName].\n\nНахмурившись, я читаю письмо, бегло просматривая витиеватые строки. [nahashin.GetName] замышляет восстание за независимость против [Select_CString(orlais.IsFemale, 'нашей', 'нашего' )] [orlais.GetTitleAsNameNoTooltip] и просит моей поддержки. На первый взгляд просьба вполне дружелюбна, но за ней угадывается угроза насилием в случае отказа. Смело, очень смело. Если я поддамся на угрозы, то, скорее всего, навлеку на себя гнев куда более могущественной силы — [orlais.GetTitleAsNameNoTooltip] Орлея."
 dataw_ciriane_rebellion.2500.a: "Но стоит ли подвергать опасности наше недавно обретённое процветание? @alliance_icon!"
 dataw_ciriane_rebellion.2500.b: "Неужели [nahashin.GetName] принимает меня за бесхребетного труса? Дела Алайона — не [Select_CString(nahashin.IsFemale, 'её', 'его' )] забота."
 dataw_ciriane_rebellion.2500.c: "Я предложу иные условия"

# Bribery Variant
 dataw_ciriane_rebellion.2500.b.desc: "В честь удачного года я откупориваю бутылку чёрного алайонского вина. Урожай выдался щедрым, а кладовые замка полны луговых грибов, дикого фенхеля и гвоздики — верный признак того, что земля хорошо оправляется от разорения Второго [Concept('blight','Мора')|E]. Междуречье плодородно как никогда, и весь маркизат процветает. Но моё хорошее настроение нарушает гонец из земель [GetGeographicalRegion('custom_mareschois_population').GetName].\n\nНахмурившись, я читаю письмо, бегло просматривая витиеватые строки. [nahashin.GetName] замышляет восстание за независимость против [Select_CString(orlais.IsFemale, 'нашей', 'нашего' )] [orlais.GetTitleAsNameNoTooltip] и просит моей поддержки. Но, похоже, [nahashin.GetTitleAsNameNoTooltip] не полагается на одни слова: вместе с письмом [Select_CString(nahashin.IsFemale, 'она прислала', 'он прислал' )] #italic «знак своего почтения»#!. Мои глаза расширяются, когда драгоценные камни рассыпаются по столу. Грубая попытка подкупа, которая легко навлечёт на меня гнев [orlais.GetTitleAsNameNoTooltip], если мне недостанет благоразумия отвергнуть её."
 dataw_ciriane_rebellion.2500.a.b: "С другой стороны, лишние деньги не помешают… @alliance_icon!"
 dataw_ciriane_rebellion.2500.b.b: "Алайон достаточно богат, чтобы не привязывать себя к чужому кошельку."
 dataw_ciriane_rebellion.2500.c.b: "[orlais.GetTitleAsNameNoTooltip] узнает об этой измене! @alliance_icon!"

# Land Gift Variant
 dataw_ciriane_rebellion.2500.c.desc: "Я сижу в верхней палате здания [GetBuilding('serault_castle_01').GetName] и потягиваю вино. С гордостью оглядываю свои владения: стекольные мастерские Серо прославлены по всему Орлею и далеко за его пределами. Внезапное появление гонца прерывает мои размышления. #italic «Вести с Болот, ваша светлость».#! Нахмурившись, я разворачиваю послание.\n\nПохоже, [nahashin.GetName], чьи земли лежат к востоку, готовит восстание за независимость против [orlais.GetName]… и просит моей поддержки. К письму приложена другая грамота, передающая мне землю и титул в Нахашине. [nahashin.GetTitleAsNameNoTooltip] Нахашина [Select_CString(nahashin.IsFemale, 'готова', 'готов' )] пожертвовать собственными владениями ради моей поддержки, но можем ли мы надеяться выстоять против империи даже сообща?\n\nПредложение: [spare_county.GetName]"
 dataw_ciriane_rebellion.2500.a.c: "С другой стороны, отодвинуть границу было бы неплохо… @alliance_icon!"
 dataw_ciriane_rebellion.2500.b.c: "У Алайона достаточно земель и без помощи Нахашина!"
 dataw_ciriane_rebellion.2500.c.c: "Я предложу иные условия"

#### E Orlais Holder Declaration of Independene
 dataw_ciriane_rebellion.3000.t: "Провозглашение независимости"
 dataw_ciriane_rebellion.3000.desc: "Жители земель [GetGeographicalRegion('custom_mareschois_population').GetName] всегда отличались упрямой независимостью: они задирали нос перед столицей, продолжая пользоваться всеми благами империи.\nДаже при [kordillus_i.GetName] власть Вал Руайо над болотами в лучшем случае оставалась непрочной. Но, похоже, эгоистичным невежам оказалось мало и этого.\n\nТеперь, когда самое сердце империи атакуют Долы и каждый орлесианец нужен, чтобы отразить эльфийскую угрозу и защитить наш уклад, болотный народ решил воспользоваться хаосом и объявить независимость от Орлея! Они рассчитывают, что я не захочу разделять войска в такое время и не стану подавлять мятеж. Какая наглость!"
 dataw_ciriane_rebellion.3000.a: "И они правы. #N Сначала покончим с этой войной#! — час болотного народа ещё настанет."
 DATAW_ciriane_wait_till_after_dalish_war_tt: "Вы вновь решите, как поступить, после окончания войны с долийцами — #N независимо от её исхода.#! До тех пор с Болотами будет заключено перемирие."
 DATAW_ciriane_rebellion.3000.a.tt: "Орлей отложит действия до окончания войны с долийцами"
 dataw_ciriane_rebellion.3000.b: "Но именно этого они и ждут. Начать подготовку к #N нападению#! и восстановлению нашей власти! @skill_martial_icon!"
 DATAW_ciriane_rebellion.3000.b.tt: "Орлей немедленно нападёт на вас"
 DATAW_ciriane_orlais_fight_now_tt: "Сумеете ли вы вести две войны одновременно? #N Немедленно#! начнётся война за возвращение всех Болот."
 dataw_ciriane_rebellion.3000.c: "Что ж… Просто #N оставить [Select_CString(nahashin.IsFemale, 'её независимой', 'его независимым' )]#!… Какая разница… @warning_icon!"
 DATAW_ciriane_rebellion.3000.c.tt: "Орлей позволит вам сохранить независимость"
 DATAW_ciriane_let_them_remain_independent_tt: "Восстание цириан завершится #N десятилетним перемирием между вами#!. Болота освободятся от орлесианской власти."

#### E Orlais Holder Loses the Rebellion
 dataw_ciriane_rebellion.3001.t: "Война проиграна"
## todo add marshal scope/chheck
 dataw_ciriane_rebellion.3001.desc: "«Наши войска наголову разбиты, Ваше Императорское Величество», — сообщает подданный, склонившись в поклоне.\n\nВеликая Игра требует безупречного владения чувствами, но сейчас я не выдерживаю и закрываю лицо руками.\n\nЗемли [GetGeographicalRegion('custom_mareschois_population').GetName] вырвались из-под моей благосклонной опеки, и границы империи вновь отступили.\n\n#N Я снова и снова прокручиваю в памяти события войны, пытаясь понять, можно ли было этого избежать…#!"
 dataw_ciriane_rebellion.3001.a: "Я [Select_CString(ROOT.Char.IsFemale, 'потерпела', 'потерпел' )] неудачу."

#### E Orlais Holder Wins the Rebellion
 dataw_ciriane_rebellion.3002.t: "Триумф Орлея"
 dataw_ciriane_rebellion.3002.desc: "Улицы столицы полны песен и празднеств: победоносные воины с триумфом возвращаются домой.\n\nСтоя среди ликующей толпы, я смотрю на войска с [Select_CString(ROOT.Char.IsFemale, 'материнской', 'отцовской' )] гордостью. Болотный народ сражался достойно, но мы — лучше.\n\n#N В грядущие дни [Select_CString(nahashin.IsFemale, 'заблудшую вассалку', 'заблудшего вассала' )] настигнут последствия измены, но пока мы можем утешиться тем, что империя, несмотря ни на что, сохранила целостность.#!"
 dataw_ciriane_rebellion.3002.a: "Да пребудет она единой вовеки."
# Variant Desc for Kordillus
 dataw_ciriane_rebellion.3002.desc.k: "Улицы столицы полны песен и празднеств: победоносные воины с триумфом возвращаются домой.\n\nСтоя среди ликующей толпы, я смотрю на войска с [Select_CString(ROOT.Char.IsFemale, 'материнской', 'отцовской' )] гордостью. Болотный народ сражался достойно, но мы — лучше. И всё же победа оставляет горький привкус: [Select_CString(cyril.IsFemale, 'моя внучка', 'мой внук' )] [cyril.GetFirstName] [Select_CString(cyril.IsFemale, 'погибла', 'погиб' )] от руки предателя.\n\n#N В грядущие дни виновных настигнет кара, но сейчас время праздновать. Утешает то, что, несмотря ни на что, империя сохранила единство.#!"
# Variant Desc for Jeaneve
 dataw_ciriane_rebellion.3002.desc.j: "Улицы столицы полны песен и празднеств: победоносные воины с триумфом возвращаются домой.\n\nСтоя среди ликующей толпы, я смотрю на войска с [Select_CString(ROOT.Char.IsFemale, 'материнской', 'отцовской' )] гордостью. Болотный народ сражался достойно, но мы — лучше. И всё же победа оставляет горький привкус: [Select_CString(cyril.IsFemale, 'моя сестра', 'мой брат' )] [cyril.GetFirstName] [Select_CString(cyril.IsFemale, 'погибла', 'погиб' )] от руки предателя.\n\n#N В грядущие дни виновных настигнет кара, но сейчас время праздновать. Утешает то, что, несмотря ни на что, империя сохранила единство.#!"
# Variant Desc if Cyril kills Roux for Kordillus
 dataw_ciriane_rebellion.3002.desc.c.k: "Улицы столицы полны песен и празднеств: победоносные воины с триумфом возвращаются домой.\n\nВо главе колонны едет [Select_CString(cyril.IsFemale, 'моя внучка', 'мой внук' )] [cyril.GetFirstName] — [Select_CString(cyril.IsFemale, 'прославленная героиня, сразившая', 'прославленный герой, сразивший' )] предателя в поединке. Стоя среди ликующей толпы, я смотрю на войска с [Select_CString(ROOT.Char.IsFemale, 'материнской', 'отцовской' )] гордостью. Болотный народ сражался достойно, но мы — лучше.\n\n#N В грядущие дни виновных настигнут последствия измены, но пока мы можем утешиться тем, что империя, несмотря ни на что, сохранила целостность.#!"
# Variant Desc if Cyril kills Roux for Jeaneve
 dataw_ciriane_rebellion.3002.desc.c.j: "Улицы столицы полны песен и празднеств: победоносные воины с триумфом возвращаются домой.\n\nВо главе колонны едет [Select_CString(cyril.IsFemale, 'моя сестра', 'мой брат' )] [cyril.GetFirstName] — [Select_CString(cyril.IsFemale, 'прославленная героиня, сразившая', 'прославленный герой, сразивший' )] предателя в поединке. Стоя среди ликующей толпы, я смотрю на войска с [Select_CString(ROOT.Char.IsFemale, 'материнской', 'отцовской' )] гордостью. Болотный народ сражался достойно, но мы — лучше.\n\n#N В грядущие дни виновных настигнут последствия измены, но пока мы можем утешиться тем, что империя, несмотря ни на что, сохранила целостность.#!"
#### Cyril POV Duel
 dataw_ciriane_rebellion.3003.t: "[Select_CString(roux.IsFemale, 'Болотная королева', 'Болотный король' )]"
 dataw_ciriane_rebellion.3003.desc: "Восседая на верном коне прекрасной каштановой масти, я затаив дыхание наблюдаю, как мои воины сходятся с мятежниками из народа [GetGlobalVariable('ciriane_culture_var').Culture.GetName]. Несколько дней назад мне сообщили, что против меня лично выступит [roux.GetFullNameNicknamedOrMe]. Несмотря на измену державе [GetGeographicalRegion('world_orlais').GetName], [Select_CString(roux.IsFemale, 'она показала себя достойной предводительницей', 'он показал себя достойным предводителем' )] своего народа. Говорят, [roux.GetFirstName] превосходно владеет топором. Да, #italic Песнь Болот#! стала бы великолепным оружием для любого воина.\n\nВнезапно мой заместитель громко просит приказа начать атаку. Я пока не отвечаю: прежде чем [Select_CString(ROOT.Char.IsFemale, 'самой', 'самому' )] вступать в бой, хочу дождаться появления #I [Select_CString(roux.IsFemale, 'этой «Болотной королевы»', 'этого «Болотного короля»' )]#!. Подпустить врага, дать ему упереться и лишь затем нанести смертельный удар — вот как проводится настоящая кавалерийская атака. С вершины холма я вижу, как [roux.GetFirstName] вступает в сражение в окружении лучших воинов, и вскоре один из наших рыцарей преграждает [Select_CString(roux.IsFemale, 'ей', 'ему' )] путь. Силы почти равны, но [roux.GetFirstName], похоже, одолевает противника. Большего подтверждения мне не требуется: пора атаковать.\n\n#EMP «За мной! За Орлей!»#! — кричу я, пытаясь подавить подступающий страх, когда наши кони устремляются к полю боя.\n\nКогда мы достигаем воинов, сражающихся с силами персонажа [roux.GetFirstName], я уже не слышу стука собственного сердца — его заглушает лязг тысяч клинков. Крики боли и ругательства мешают сохранять мужество. Завершив кавалерийскую атаку, я спешиваюсь и обнажаю меч. Внезапно всё вокруг словно исчезает. Шум, крики и грохот битвы стихают, оставляя передо мной лишь персонажа [roux.GetFirstName]. [Select_CString(roux.IsFemale, 'Эта самозваная «королева»', 'Этот самозваный «король»' )] своей войной угрожает всему, что мне дорого, жизням моей семьи и близких. [Select_CString(roux.IsFemale, 'Она должна быть и будет повержена', 'Он должен быть и будет повержен' )] здесь и сейчас."
 dataw_ciriane_rebellion.3003.a: "#italic #color_red За Орлей!#!#!"

#### Cyril Duel against Roux wins
 dataw_ciriane_rebellion.3004.t: "Победа дракона"
 dataw_ciriane_rebellion.3004.desc: "С тяжёлым грохотом #italic [Select_CString(roux.IsFemale, '«королева»', '«король»' )]#! [roux.GetFirstName] [roux.GetDynastyHouseName] падает на землю. Мой клинок от острия до гарды покрыт [Select_CString(roux.IsFemale, 'её', 'его' )] кровью, стекающей на землю под моими сапогами. Я пытаюсь перевести дух и вновь сосредоточиться на битве, но другой рыцарь сбивает меня с ног. Этот сражается за болота, а не за Орлей.\n\nОн заносит над головой огромный топор, готовясь разрубить меня надвое. В последний миг я бью его ногой в колено. Нога подворачивается, и воин тяжело валится на землю. Топор выпадает из его рук и тонет в кровавой грязи, оставляя противника безоружным. Я бросаюсь к нему, выхватываю кинжал из ножен на поясе и вонзаю в шею.\n\nПочти не сопротивляясь, мужчина хрипит и истекает кровью, пока я прижимаю его к земле. Я задыхаюсь ещё сильнее, сердце вновь грохочет в ушах, готовое вырваться из груди. Но даже это не может отвлечь от перемены в ходе битвы.\n\nСо всех сторон трубят рога и доносятся крики — то громче, то тише, в зависимости от расстояния. Похоже, мятежники отступают. Мы победили. [roux.GetFirstName] [roux.GetDynastyHouseName] [Select_CString(roux.IsFemale, 'мертва', 'мёртв' )], а значит, война скоро закончится. Мои воины улыбаются и приветствуют меня, зная, что в любимую державу [GetGeographicalRegion('world_orlais').GetName] наконец вернётся мир. Этот удар должен сломить восстание: после гибели [Select_CString(roux.IsFemale, 'своей «королевы»', 'своего «короля»' )] мятежники остались без предводителя и надежды. Всё началось с персонажа [roux.GetFirstName], и справедливо, что вместе с [Select_CString(roux.IsFemale, 'ней', 'ним' )] всё закончится. Наконец победа и мир принадлежат нам."
 dataw_ciriane_rebellion.3004.a: "#italic #color_red Завершив эту войну, Орлей станет лишь сильнее.#!#!"

# Betrayal!
 dataw_ciriane_rebellion.3005.t: "Предательство!"
 dataw_ciriane_rebellion.3005.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'думала', 'думал' )], что дар свободы и независимости — именно то, чего [Select_CString(nahashin.IsFemale, 'требовала заблудшая вассалка', 'требовал заблудший вассал' )] с болот, — усмирит [Select_CString(nahashin.IsFemale, 'молодую госпожу', 'молодого господина' )].\n\nСтоит мне согласиться на требования персонажа [nahashin.GetName], как [Select_CString(nahashin.IsFemale, 'она вернётся', 'он вернётся' )] к тихим болотным делам, а я смогу сосредоточиться на противостоянии с Долами. Так я [Select_CString(ROOT.Char.IsFemale, 'полагала', 'полагал' )].\n\n#color_goldy_yellow Я [Select_CString(ROOT.Char.IsFemale, 'была дурой', 'был дураком' )].#!\n\nВ Орлее люди говорят одно, а подразумевают другое. Это у нас в крови, это часть Игры. Так называемый #italic [nahashin.GetTitleAsNameNoTooltip] Болот#! [Select_CString(nahashin.IsFemale, 'воспользовалась', 'воспользовался' )] новообретённой независимостью… и [Select_CString(nahashin.IsFemale, 'подняла', 'поднял' )] войска против нас.\n\n#N Похоже, ни болотному народу, ни эльфам неведома честь.#!"
 dataw_ciriane_rebellion.3005.a: "Значит, войны всё же не избежать…"

# Roux Losing Options
# Ancudor’s Offer
 dataw_ciriane_rebellion.3006.t: "Предложение Анкудора"
 dataw_ciriane_rebellion.3006.desc: "[ancudor.GetFirstName], [Select_CString(ancudor.IsFemale, 'искусная воительница', 'искусный воин' )], тайно просит о встрече со мной.\n\n#italic «Постараюсь не отнимать у вас много времени, Ваше Величество, — начинает Анкудор. — Я Анкудор Маршетт, [Select_CString(ancudor.IsFemale, 'единокровная сестра', 'единокровный брат' )] Ру Маршетта. У нас один отец, хотя об этом почти никто не знает. По праву после победы над [Select_CString(roux.IsFemale, 'мятежной герцогиней', 'мятежным герцогом' )] именно я [Select_CString(ancudor.IsFemale, 'должна стать новой герцогиней', 'должен стать новым герцогом' )] Нахашина».#!\n\nСудя по репутации, [ancudor.GetFirstName] [Select_CString(ancudor.IsFemale, 'могла бы стать верной вассалкой', 'мог бы стать верным вассалом' )], однако [Select_CString(ancudor.IsFemale, 'её способности ещё не испытаны', 'его способности ещё не испытаны' )]. Невозможно понять, станет ли [Select_CString(ancudor.IsFemale, 'она способной правительницей', 'он способным правителем' )] или всего лишь удобной марионеткой."
 dataw_ciriane_rebellion.3006.a: "Ты слишком много на себя берёшь, Анкудор. [Select_CString(roux.IsFemale, 'Твоя единокровная сестра лишила', 'Твой единокровный брат лишил' )] тебя прав по рождению."
 dataw_ciriane_rebellion.3006.a_tt: "#N После войны персонаж [ancudor.GetFirstName] не получит герцогство Нахашин.#!"
 dataw_ciriane_rebellion.3006.b: "И сколько ты [Select_CString(ancudor.IsFemale, 'готова', 'готов' )] заплатить за подобную привилегию?"
 dataw_ciriane_rebellion.3006.b_tt: "#N В случае вашей победы персонаж [ancudor.GetFirstName] будет надеяться получить герцогство Нахашин, но окончательное решение останется за вами.#!"
 dataw_ciriane_rebellion.3006.c: "С радостью исполню твою просьбу, но пока ты будешь служить мне"
 dataw_ciriane_rebellion.3006.d: "Ты [Select_CString(ancudor.IsFemale, 'права', 'прав' )]. Я [Select_CString(ROOT.Char.IsFemale, 'уверена', 'уверен' )], что ты сослужишь хорошую службу"

# Roux Losing Options
# Promise to Ancudor
 dataw_ciriane_rebellion.3007.t: "Обещание Анкудору"
 dataw_ciriane_rebellion.3007.desc: "[ancudor.GetFirstName] въезжает в мою крепость, словно полководец во главе триумфального шествия. [Select_CString(ancudor.IsFemale, 'Гордая воительница преклоняет', 'Гордый воин преклоняет' )] колено перед троном, стремясь поскорее принять новые обязанности.\n\nВсё готово к возвышению персонажа [ancudor.GetFirstName], но я медлю. [Select_CString(ancudor.IsFemale, 'Действительно ли Анкудор готова', 'Действительно ли Анкудор готов' )] привести марешуа к миру и процветанию?\n\n#N Или найдётся кто-то более достойный?#!"
 dataw_ciriane_rebellion.3007.a: "Встань, [Select_CString(ancudor.IsFemale, 'герцогиня', 'герцог' )] Анкудор"
 dataw_ciriane_rebellion.3007.b: "Прочь, [Select_CString(ancudor.IsFemale, 'негодница', 'негодяй' )]! Тебе никогда не стать [Select_CString(ancudor.IsFemale, 'герцогиней', 'герцогом' )]!"

# Roux Losing Options
# Promise to Ancudor (Ancudor Dead Version)
 dataw_ciriane_rebellion.3008.t: "Обещание Анкудору"
 dataw_ciriane_rebellion.3008.desc: "Когда пепел нашей победы над мятежниками оседает, я посылаю за [Select_CString(ancudor.IsFemale, 'новой правительницей', 'новым правителем' )] Нахашина. К своему ужасу, в списке погибших воинов нахожу имя персонажа [ancudor.GetName].\n\n#N После смерти персонажа [ancudor.GetName] вопрос о наследовании герцогства вновь остаётся открытым, и решение предстоит найти мне.#!"
 dataw_ciriane_rebellion.3008.a: "Кто теперь будет править Болотами?"
 
# Roux Losing Options
# Victory Over the Duke
 dataw_ciriane_rebellion.3009.t: "Победа над [nahashin.GetTitleAsNameNicknamed]"
 dataw_ciriane_rebellion.3009.desc: "После поражения Болот обширная часть империи осталась без правителя и управления. \n\nМне предстоит найти того, кто примет обязанности [Select_CString(nahashin.IsFemale, 'мятежной герцогини', 'мятежного герцога' )]. [Select_CString(ROOT.Char.IsFemale, 'Мудрая императрица не должна', 'Мудрый император не должен' )] принимать поражение одного врага за поражение всех. Новый кандидат не должен поднять очередной мятеж, а [nahashin.GetName] не [Select_CString(nahashin.IsFemale, 'должна позволить', 'должен позволить' )] своим вассалам искать мести.\n\n#N Нахашину нужна законная власть, способная принести мир и получить признание даже моих врагов.#!"
 dataw_ciriane_rebellion.3009.a: "[Select_CString(nahashin_ruler.IsFemale, 'Нынешняя правительница вполне подходит', 'Нынешний правитель вполне подходит' )]."
 dataw_ciriane_rebellion.3009.a_tt: "[nahashin_ruler.GetName] сохранит положение [nahashin_ruler.GetTitleAsNameNicknamed]"
 dataw_ciriane_rebellion.3009.b: "Назначать герцога ещё рано. Пока эти земли будут моими."
 dataw_ciriane_rebellion.3009.c: "Болотам [Select_CString(orlesian_ruler.IsFemale, 'нужна правительница', 'нужен правитель' )] орлесианской крови."
 dataw_ciriane_rebellion.3009.c_tt: "[orlesian_ruler.GetName] получит власть над Болотами"
# Roux Losing Options
# The New Duke
 dataw_ciriane_rebellion.3010.t: "[Select_CString(nahashin.IsFemale, 'Новая', 'Новый' )] [nahashin.GetTitleAsNameNicknamed]"
 dataw_ciriane_rebellion.3010.n.desc: "[nahashin_ruler.GetFirstName] произносит речь, принимая новые обязанности.\n\n[Select_CString(nahashin_ruler.IsFemale, 'Она почти не тратит', 'Он почти не тратит' )] времени на осуждение [Select_CString(nahashin.IsFemale, 'прежней герцогини', 'прежнего герцога' )] и вместо этого говорит о собственных достоинствах. [nahashin_ruler.GetFirstName] рассказывает двору историю своей жизни, объясняя, как и почему [Select_CString(nahashin_ruler.IsFemale, 'она заслужила', 'он заслужил' )] эту благородную роль.\n\n#N Трудно сказать, поверила ли толпа, но те, чьё мнение действительно важно, живут далеко на западе.#!"
 dataw_ciriane_rebellion.3010.o.desc: "С достоинством приняв новые обязанности, я произношу краткую речь.\n\nЯ говорю о том, что единая власть над Нахашином сделала империю сильнее. Обещаю распространить влияние Вал Руайо и нашей Церкви на болота, чтобы однажды они стали вторым домом моих потомков.\n\n#N Одни встречают эту речь громом рукоплесканий, другие — молчаливым ужасом.#!"
 dataw_ciriane_rebellion.3010.o.s.desc: "[orlesian_ruler.GetFirstName] произносит речь, принимая новые обязанности.\n\n[Select_CString(orlesian_ruler.IsFemale, 'Она осуждает', 'Он осуждает' )] наивный мятеж [Select_CString(nahashin.IsFemale, 'прежней герцогини', 'прежнего герцога' )] и обещает привести болота к орлесианскому будущему.\n\n[orlesian_ruler.GetFirstName] обещает, что всего через одно поколение болотный народ станет истинным воплощением орлесианской цивилизации.\n\n#N Одни встречают эту речь громом рукоплесканий, другие — молчаливым ужасом.#!"
 dataw_ciriane_rebellion.3010.a.n: "Посмотрим, сможет ли [nahashin_ruler.GetFirstName] удержать болота в повиновении."
 dataw_ciriane_rebellion.3010.a.o: "В конце концов, почему бы и нет? Почему бы мне не оставить эти земли себе?"
 dataw_ciriane_rebellion.3010.a.o.s: "Желаю удачи персонажу [orlesian_ruler.GetFirstName]."

# Roux Losing Options
# The Fallen Duke
 dataw_ciriane_rebellion.3011.t: "[Select_CString(nahashin.IsFemale, 'Павшая герцогиня', 'Павший герцог' )]"
 dataw_ciriane_rebellion.3011.desc: "Болота усмирены, и грязное дело войны закончено. Остаётся лишь одна незавершённая забота — [Select_CString(nahashin.IsFemale, 'сама мятежная герцогиня', 'сам мятежный герцог' )]. [nahashin.GetName] гниёт в моей темнице, но даже это кажется слишком мягкой карой за [Select_CString(nahashin.IsFemale, 'её', 'его' )] низкое предательство.\n\n#N Глубокой ночью, изрядно захмелев, мы с придворными изобретаем всё новые способы наказать [Select_CString(nahashin.IsFemale, 'мятежницу', 'мятежника' )].#!"
 dataw_ciriane_rebellion.3011.a: "Я отрублю [Select_CString(nahashin.IsFemale, 'ей', 'ему' )] голову и покончу с этим"
 dataw_ciriane_rebellion.3011.b: "Я сожгу [Select_CString(nahashin.IsFemale, 'её', 'его' )] на костре"
 dataw_ciriane_rebellion.3011.c: "Я замучаю [Select_CString(nahashin.IsFemale, 'её', 'его' )] до смерти"
 dataw_ciriane_rebellion.3011.d: "Я отпущу [Select_CString(nahashin.IsFemale, 'её', 'его' )] в дикую глушь."
 dataw_ciriane_rebellion.3011.e: "Я помилую [Select_CString(nahashin.IsFemale, 'её и сделаю своей шутихой', 'его и сделаю своим шутом' )]."

# The Chant of Light Grows Quieter
 dataw_ciriane_rebellion.3012.t: "Песнь Света звучит всё тише"
 dataw_ciriane_rebellion.3012.desc: "Нахашин всегда подчинялся державе [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier] скорее на словах, чем на деле, и особенно ярко это проявлялось в вопросах веры. Здесь сохранились старинные местные течения андрастианства, а организованная [Concept('chantry','Церковь')|E] [Select_CString(kordillus_i.IsFemale, 'нашей дорогой основательницы', 'нашего дорогого основателя' )] [kordillus_i.GetFirstName] почти не сумела пустить корни. И всё же жители поклонялись [Concept('maker','Создателю')|E], поэтому мы не вмешивались в их веру.\n\n#N До сих пор.#!\n\nДо меня дошли вести, что [nahashin.GetTitleAsNameNoTooltip] Нахашина, [nahashin.GetFirstName], [Select_CString(nahashin.IsFemale, 'вернулась', 'вернулся' )] к древним языческим верованиям нашего народа и теперь открыто поклоняется старым богам, бросая вызов нашей власти. Песнь учит, что Создатель вернётся, лишь когда его имя воспоют во всех четырёх концах [Concept('thedas','Тедаса')|E]. Наша слабая власть в вопросах веры привела к этому, но если начать действовать сейчас, народ разгневается ещё сильнее — быть может, вспыхнет величайшее восстание в истории империи.\n\n#N Одно, однако, несомненно.#!"
 dataw_ciriane_rebellion.3012.a: "На болотах Песнь звучит всё тише."

# Hiring Mercenaries
 dataw_ciriane_rebellion.3601.t: "Набор наёмников"
 dataw_ciriane_rebellion.3601.desc: "Советники подготовили для моей задачи [Select_CString(envoy.IsFemale, 'верную и осмотрительную посланницу', 'верного и осмотрительного посланника' )]. [envoy.GetName] [Select_CString(envoy.IsFemale, 'прошла', 'прошёл' )] мою личную проверку и сумеет безопасно доставить деньги наёмникам, не угодив в руки разбойников.\n\nОстаётся решить лишь одно: куда отправить [Select_CString(envoy.IsFemale, 'её', 'его' )]…"
 dataw_ciriane_rebellion.3601.a: "Отправляйся на восток, в #italic город Неварру#!. #G Легче всего#!"
 dataw_ciriane_rebellion.3601.w_tt: "#G Успех!#!"
 dataw_ciriane_rebellion.3601.l_tt: "#N Неудача!#!"
 dataw_ciriane_rebellion.3601.w_e_tt: "Наёмники соглашаются присоединиться к вам!"
 dataw_ciriane_rebellion.3601.l_e_tt: "Наёмники отказываются присоединиться к вам!"
 dataw_ciriane_rebellion.3601.b: "Отправляйся неподалёку, в #italic болота цириан#!. #G Легко#!"
 dataw_ciriane_rebellion.3601.c: "Далеко на восток, вести переговоры с #italic ферелденцами#!. #N Сложно#!"
 dataw_ciriane_rebellion.3601.d: "На юго-восток, вести переговоры с #italic долийцами#!. #N Сложнее всего#!"

 dataw_ciriane_rebellion.3601.w_i_tt: "Вы успешно нанимаете наёмников!"
 dataw_ciriane_rebellion.3601.l_i_tt: "Наёмники забирают ваши #N [gold_i]250#!!"
 dataw_ciriane_rebellion.3601.l_i_2_tt: "Наёмники забирают ваши #N [gold_i]350#!!"

# A Fine Addition
 dataw_ciriane_rebellion.3602.t: "Ценное пополнение"
 dataw_ciriane_rebellion.3602.desc: "Вести приходят раньше разведчика. Вассалы сообщают, что на подмогу их гарнизонам прибыли небольшие отряды — меньше дюжины воинов на каждую крепость. Солдаты утверждают, что служат по моему приказу, и вассалы желают знать, почему их не предупредили заранее.\n\nЯ не отвечаю, пока [envoy.GetName] не прибывает ко двору и не раскрывает замысел. Наши наёмники уже начали смешиваться с местными войсками, чтобы не вызывать подозрений.\n\nКогда прозвучит приказ о восстании, они поспешат присоединиться к основным силам. Я подтверждаю вассалам полномочия новых воинов, создавая видимость, будто это было их собственное решение. На дальнейшие просьбы всё проверить ответа не последует."
 dataw_ciriane_rebellion.3602.a: "Когда придёт время, #N мы будем готовы…#!"
 dataw_ciriane_rebellion.3602.a.n_tt: "С началом восстания будет собрано ополчение #N Неваррские наёмники#!"
 dataw_ciriane_rebellion.3602.a.c_tt: "С началом восстания будет собрано ополчение #N Цирианская сталь#!"
 dataw_ciriane_rebellion.3602.a.d_tt: "С началом восстания будет собрано ополчение #N Долийская меткость#!"
 dataw_ciriane_rebellion.3602.a.f_tt: "С началом восстания будет собрано ополчение #N Ферелденская мощь#!"

# A Failed Recruitment
 dataw_ciriane_rebellion.3603.t: "Неудачный набор"
 dataw_ciriane_rebellion.3603.desc: "[envoy.GetName] возвращается с поникшей головой. Похоже, наёмники отвергли мои условия и отказались заключать столь необычный контракт.\n\nИ всё же они охотно забрали деньги у моего посланника. #italic «В уплату за их молчание»,#! — [Select_CString(envoy.IsFemale, 'объясняет она', 'объясняет он' )]."
 dataw_ciriane_rebellion.3603.a: "Верни мои деньги! #N Сейчас же!#!"
 dataw_ciriane_rebellion.3603.b: "Ладно, переходим к следующему плану."
 dataw_ciriane_rebellion.3603.a.w_tt: "Вы вернёте то, что осталось от вашего золота"
 dataw_ciriane_rebellion.3603.a.l_tt: "[orlais.GetFirstName] узнает о вашей измене"

# Wooing Mercenaries
 dataw_ciriane_rebellion.3604.t: "Уговоры наёмников"
 dataw_ciriane_rebellion.3604.desc: "[envoy.GetName] недостаточно [Select_CString(envoy.IsFemale, 'подготовилась', 'подготовился' )] к встрече с этими наёмниками. Условия нашего договора необычны и могут раскрыть планы. Если обратиться не к той компании или сделать неверное предложение, нас выдадут [orlais.GetTitleAsNameNoTooltip] и уничтожат.\n\n#N #italic Нужно принять все возможные меры предосторожности, чтобы добиться успеха.#!#!"
 dataw_ciriane_rebellion.3604.a: "Увеличить средства персонажа [envoy.GetName]"
 dataw_ciriane_rebellion.3604.b: "[lustful.GetName] соблазнит наёмников."
 dataw_ciriane_rebellion.3604.c: "[diplomacy.GetName] проведёт переговоры с чужеземцами"
 dataw_ciriane_rebellion.3604.d: "[martial.GetName] знает, как вести за собой воинов"
 dataw_ciriane_rebellion.3604.e: "[warrior.GetName] поймёт наёмников как собрат по оружию"
 dataw_ciriane_rebellion.3604.f: "Думаю, мы уже сделали достаточно."
 dataw_ciriane_rebellion.3604.a_tt: "Вы дадите персонажу [envoy.GetName] ещё [gold_i]100 золота — шанс на #G успех#! повысится"
 dataw_ciriane_rebellion.3604.b_tt: "Вы отправите похотливого персонажа — шанс на #G успех#! повысится"
 dataw_ciriane_rebellion.3604.c_tt: "Вы отправите персонажа с высокой дипломатией — шанс на #G успех#! повысится"
 dataw_ciriane_rebellion.3604.d_tt: "Вы отправите персонажа с высоким военным делом — шанс на #G успех#! повысится"
 dataw_ciriane_rebellion.3604.e_tt: "Вы отправите воина с высокой доблестью — шанс на #G успех#! повысится"
 dataw_ciriane_rebellion.3604.f_tt: "Вы ничего не сделаете, чтобы повысить шанс на #G успех#!"

# Envoy Failure
 dataw_ciriane_rebellion.3606.t: "Провал посланников"
 dataw_ciriane_rebellion.3606.desc: "В ответ на мою просьбу наёмники присылают собственного посланника по имени [merc_envoy.GetName], который приносит великолепный сундук.\n\nКогда [merc_envoy.GetName] открывает крышку, я вижу головы моих посланников, сложенные поверх груды монет.\n\n #italic #N «Мы вынуждены почтительно отклонить вашу просьбу, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )]».#!#!\n\nПосле этих слов [merc_envoy.GetName] поспешно скрывается со двора."
 dataw_ciriane_rebellion.3606.a: "Неужели я [Select_CString(ROOT.Char.IsFemale, 'пала', 'пал' )] так низко?"
 dataw_ciriane_rebellion.3606.a_tt: "Наёмники вернут потраченные вами [gold_i]250"
 dataw_ciriane_rebellion.3606.a_2_tt: "Наёмники вернут потраченные вами [gold_i]350"
# Independence Events

# The rebellions Successor
 dataw_ciriane_rebellion.3700.t: "Преемник восстания"
 dataw_ciriane_rebellion.3700.desc: "Перебирая бумаги, оставленные моим предшественником [nahashin_past_holder.GetName], я с потрясением обнаруживаю крайне опасные документы.\n\nПохоже, прежде чем [nahashin_past_holder.GetFirstName] безвременно [Select_CString(nahashin_past_holder.IsFemale, 'покинула', 'покинул' )] герцогство, [Select_CString(nahashin_past_holder.IsFemale, 'она была глубоко вовлечена', 'он был глубоко вовлечён' )] в заговор, целью которого было отделение от империи и создание независимого королевства на болотах.\n\nЭто не мимолётная прихоть: подробные планы, целая сеть возможных связей…\n\n#N Здесь есть всё необходимое, чтобы поднять восстание невиданных масштабов.#!"
 dataw_ciriane_rebellion.3700.a: "Немедленно сжечь бумаги. Это измена!"
 dataw_ciriane_rebellion.3700.a_tt: "Вы продолжите дело предшественника и #N поднимете восстание, когда придёт время#!"
 dataw_ciriane_rebellion.3700.b: "Вся подготовительная работа уже сделана — я могу присвоить этот замысел…"
 dataw_ciriane_rebellion.3700.b_tt: "Вы отмените все планы восстания, #N признав поражение#!"

 dataw_ciriane_rebellion.3700.h.t: "[Select_CString(ROOT.Char.IsFemale, 'Наследница', 'Наследник' )] восстания"
 dataw_ciriane_rebellion.3700.h.c.desc: "После смерти родителя бразды правления герцогством переходят ко мне, [Select_CString(ROOT.Char.IsFemale, 'законной наследнице', 'законному наследнику' )] персонажа [nahashin_past_holder.GetName]. Пока другие скорбят, у [Select_CString(ROOT.Char.IsFemale, 'новой правительницы', 'нового правителя' )], [GetPlayer.GetTitleAsNameNoTooltip], нет времени на подобные чувства. Как от меня и ожидают, я молча отправляюсь в столицу, чтобы возобновить договор между моей семьёй и домом [orlais.GetDynastyHouseName].\n\nПреклонив колено перед [orlais.GetTitleAsNameNoTooltip], я повторяю слова, которые до меня произносили многие поколения дома [GetPlayer.GetDynastyHouseName]. Я — [Select_CString(ROOT.Char.IsFemale, 'вассалка', 'вассал' )]. [Select_CString(orlais.IsFemale, 'Она — моя госпожа и защитница', 'Он — мой господин и защитник' )].\n\nНо… Неужели всё должно быть именно так? [Select_CString(nahashin_past_holder.IsFemale, 'Моя мать желала', 'Мой отец желал' )] для нас большего, но [Select_CString(nahashin_past_holder.IsFemale, 'ушла', 'ушёл' )], так и не исполнив своих замыслов. Эти мысли преследуют меня всю дорогу обратно к болотам.\n\n #N К возвращению в замок решение уже принято.#!"
 dataw_ciriane_rebellion.3700.h.s.desc: "После смерти [Select_CString(nahashin_past_holder.IsFemale, 'сестры', 'брата' )] бразды правления герцогством переходят ко мне, [Select_CString(ROOT.Char.IsFemale, 'законной наследнице', 'законному наследнику' )] персонажа [nahashin_past_holder.GetName]. Пока другие скорбят, у [Select_CString(ROOT.Char.IsFemale, 'новой правительницы', 'нового правителя' )], [GetPlayer.GetTitleAsNameNoTooltip], нет времени на подобные чувства. Как от меня и ожидают, я молча отправляюсь в столицу, чтобы возобновить договор между моей семьёй и домом [orlais.GetDynastyHouseName].\n\nПреклонив колено перед [orlais.GetTitleAsNameNoTooltip], я повторяю слова, которые до меня произносили многие поколения дома [GetPlayer.GetDynastyHouseName]. Я — [Select_CString(ROOT.Char.IsFemale, 'вассалка', 'вассал' )]. [Select_CString(orlais.IsFemale, 'Она — моя госпожа и защитница', 'Он — мой господин и защитник' )].\n\nНо… Неужели всё должно быть именно так? [Select_CString(nahashin_past_holder.IsFemale, 'Сестра хотела', 'Брат хотел' )] для нас большего, но [Select_CString(nahashin_past_holder.IsFemale, 'ушла', 'ушёл' )], так и не исполнив своих замыслов. Эти мысли преследуют меня всю дорогу обратно к болотам.\n\n #N К возвращению в замок решение уже принято.#!"
 dataw_ciriane_rebellion.3700.h.a: "Я не позволю мечте умереть. #N Болота БУДУТ свободны!#!"
 dataw_ciriane_rebellion.3700.h.b: "Смириться со своим положением… Да здравствует [orlais.GetTitleAsNameNoTooltip]!"

# Roux breaking out of Orlesian Capital event
 dataw_ciriane_rebellion.3701.t: "Заточение!"
 dataw_ciriane_rebellion.3701.desc: "Сердце замирает, когда я вижу приближающуюся к замку колонну имперских солдат. Всадник во главе размахивает грамотой, которая может быть лишь приказом о моём аресте. Я мысленно проклинаю собственную неосторожность: слухи о готовящемся восстании достигли ушей [orlais.GetTitleAsNameNoTooltip]!\n\nВскоре меня в цепях увозят в столицу, бросают в темницу владения [orlais.GetCapitalLocation.GetTitle.GetNameNoTier] и оставляют дожидаться решения [orlais.GetTitleAsNameNoTooltip] о моей судьбе.\n\n #italic #N Какое унижение!#!#!"
 dataw_ciriane_rebellion.3701.a: "Я устрою дерзкий побег, и они пожалеют об этом дне! @skill_martial_icon! @warning_icon!"
 dataw_ciriane_rebellion.3701.a_tt: "Вы в одиночку вступите в бой с орлесианскими солдатами, пытаясь вырваться на свободу. Чтобы сбежать, вам придётся сразиться на дуэли с орлесианским рыцарем. #N Независимо от того, выживете вы или нет, планы обрести независимость будут продолжены!#!"
 dataw_ciriane_rebellion.3701.b: "Так я, скорее всего, лишь погибну. Это цена моей неосторожности."
 dataw_ciriane_rebellion.3701.b_tt: "Вы покоритесь власти Орлея, #N признаете измену и сдадитесь. Восстание цириан немедленно завершится.#!"

 # The Turns of Fate
 dataw_ciriane_rebellion.3703.t: "Падение Орлея"
 dataw_ciriane_rebellion.3703.g.t: "Мудрое решение"
 dataw_ciriane_rebellion.3703.desc: "Некогда могущественная империя пала так низко. С падением Орлея равновесие сил изменилось навсегда.\n\n#italic Кто возвысится на пепелище прежней империи?#!\n\nНесомненно, земли к западу от [GetGeographicalRegion('world_ferelden_frostback_mountains').GetName] погрузятся в бесконечные войны, пока кто-нибудь не добьётся успеха там, где прежний правитель Орлея потерпел неудачу.\n\n#italic Быть может, возвыситься среди их падения предстоит кому-то вроде меня?#!\n\nНовообретённая свобода заставляет о многом задуматься: вместе с ней неизбежно придут новые испытания.\n\n#N Нам больше не придётся склоняться перед чужой короной, но отныне я могу полагаться лишь на себя и своих вассалов.#!"
 dataw_ciriane_rebellion.3703.g.desc: "Я стою перед советниками и размышляю о том, стоит ли возглавить восстание, когда дверь в зал открывается. Слуга вручает мне послание, которое следует прочесть немедленно. Я поспешно пробегаю строки и обнаруживаю невероятный сюрприз.\n\n#italic «По приказу [orlais.GetTitleAsNameNoTooltip] земли [GetGeographicalRegion('custom_mareschois_population').GetName] получают независимость».#! Слова срываются с моих губ прежде, чем я успеваю осознать их смысл. Советники разражаются радостными криками и поздравляют меня, а я всё ещё не могу поверить в случившееся.\n\nНаконец оправившись от потрясения, я присоединяюсь к общему смеху и ликованию. Теперь нам не нужно готовиться к войне — пора учиться жить как независимый народ, чего мы и желали.\n\n#N Отныне народ Нахашина должен заботиться лишь о себе и вместе противостоять каждому, кто в будущем пожелает причинить нам вред.#!"
 dataw_ciriane_rebellion.3703.a: "Что ждёт нас дальше?"
 dataw_ciriane_rebellion.3703.a.g: "Нахашин ждёт светлое будущее!"
 dataw_ciriane_rebellion.3703.a_tt: "Орлей распадается: #N все планы Восстания цириан прекращены, но история народа продолжается.#! Вы открыли новые решения и события, позволяющие возродить Цирианское королевство!"
 dataw_ciriane_rebellion.3703.a.g_tt: "Орлей даровал вам независимость: #N все планы Восстания цириан прекращены, но история народа продолжается.#! Вы открыли новые решения и события, позволяющие возродить Цирианское королевство!"
 # Pre-RC Extra checks, option to declare independence or back down
 dataw_ciriane_rebellion.3704_t_early_war: "Преждевременный призыв"
 dataw_ciriane_rebellion.3704_t_early_vassalization: "Вынужденный ход"
 dataw_ciriane_rebellion.3704_t_early_dissolved: "Сорванный отвлекающий манёвр"
 dataw_ciriane_rebellion.3704_desc_early_war: "Война пришла в империю. Раньше, чем кто-либо мог предположить, Долы и Орлей собирают войска и выступают друг против друга.\n\nНастало время обрести независимость — раньше, чем я [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог' )] ожидать. Воодушевлённый этими известиями народ уже собирается под моими знамёнами.\n\n#bold Пусть подготовка ещё не завершена, я верю в наш успех.#!"
 dataw_ciriane_rebellion.3704_desc_early_vassalization: "Сегодня утром весь мой двор охватило смятение. Простолюдины возмущены, придворные потрясены… Хаос охватил столицу, а причину всеобщей паники мне раскрывает [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('messenger'))] [messenger.GetShortUIName].\n\n#bold Долы признали вассальную зависимость от Орлея. Надежды многих на то, что это отвлечёт империю, не оправдались.#!\n\nПростолюдины уже собирают ополчение во всех уголках Нахашина. Многие считают, что, если марешуанцы желают независимости, действовать необходимо сейчас. Мне остаётся лишь отдать приказ."
 dataw_ciriane_rebellion.3704_desc_early_dissolved: "#bold Долы распались.#!\n\nЭльфы, с помощью которых мы надеялись отвлечь империю, погрязли в распрях и не смогут выставить боеспособное войско против державы [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier].\n\nИз-за этого столица и весь Нахашин охвачены смятением.\n\nМногие желают независимости. Многие считают, что, если мы не начнём действовать сейчас, Орлей станет лишь сильнее — особенно теперь, когда Долов больше нет."
 dataw_ciriane_rebellion.3704_opt_a_early_war: "Пора выступить против этих надушенных глупцов"
 dataw_ciriane_rebellion.3704_opt_a_early_vassalization: "На войну! За свободу — сейчас или никогда"
 dataw_ciriane_rebellion.3704_opt_a_early_dissolved: "Собрать войска. Ради независимости мы должны действовать сейчас"
 dataw_ciriane_rebellion.3704_opt_b_early_war: "Я не [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )]. Объявить независимость сейчас — значит обречь нас на гибель"
 dataw_ciriane_rebellion.3704_opt_b_early_vassalization: "Без отвлекающего манёвра эта попытка обречена"
 dataw_ciriane_rebellion.3704_opt_b_early_dissolved: "Без отвлекающего манёвра эта попытка обречена"
### Ally with the Ciriane Cult Event Chain
 # The Old Ways
 dataw_ciriane_rebellion.3800.t: "Старые обычаи"
 dataw_ciriane_rebellion.3800.desc: "Проходя по улицам столицы, я вижу, как мой народ участвует в почти чуждом для меня действе. Стражники объясняют, что это религиозный праздник.\n\nМеньшинство наших подданных по-прежнему следует [GetFaithByKey('ciriane_paganism').GetAdjective] обычаям, существовавшим ещё до того, как [andraste.GetName] принесла им свет Создателя.\n\nЛюди танцуют в огромном кругу, надеясь выпросить хорошую погоду у #G $ciriane_paganism_high_god_name$#!"
 dataw_ciriane_rebellion.3800.a: "Хм, странно."
 dataw_ciriane_rebellion.3800.b: "Почему бы не присоединиться?"
 dataw_ciriane_rebellion.3800.c: "Стража, заточить этих еретиков!"

 ciriane_cultists_arrested:0 "Цирианские культисты арестованы"
 ciriane_warrior_arrested:0 "Цирианский воин арестован"
 ciriane_cultists_acknowledged:0 "Цирианские культисты признаны"
 ciriane_cultists_embraced:0 "Цирианские культисты приняты"
 corruption_vanquished:0 "Коррупция искоренена"
 corruption_rampant:0 "Разгул коррупции"
 curious_about_the_old_ways: "Интерес к старым обычаям"
 pleased_local_tribes: "Довольные местные племена"
