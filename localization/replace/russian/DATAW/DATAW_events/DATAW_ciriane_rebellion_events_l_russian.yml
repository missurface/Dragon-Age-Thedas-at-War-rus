 # Back With a Guest
 dataw_ciriane_rebellion.3902.t: "Возвращение с гостем"
 dataw_ciriane_rebellion.3902.desc: "[envoy.GetName] в добром расположении духа возвращается с болот в сопровождении представителя одного из племён народа [GetGlobalVariable('ciriane_culture_var').Culture.GetName]. Гость с болот передаёт дружеское приветствие и небольшие подарки от племенного вождя. Чем дольше я беседую с новым спутником, которого привёл [envoy.GetName], тем настойчивее тот переводит разговор на своего предводителя.\n\n#N Похоже, единственная цель визита — добиться моего согласия на встречу с вождём.#!"
 dataw_ciriane_rebellion.3902.a: "Расположись поудобнее. Вернёшься, когда придёт время."
 dataw_ciriane_rebellion.3902.b: "Поспеши к своему господину и пригласи его сюда."
 dataw_ciriane_rebellion.3902.c: "Было бы невежливо отпустить тебя без ответных даров."
 dataw_ciriane_rebellion.3902.d: "Подожди. Когда я буду [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )], мы вернёмся вместе."

### Seeking out the Local Tribes Event Chain
 # Heads Up
 dataw_ciriane_rebellion.3903.t: "Отрубленная голова"
 dataw_ciriane_rebellion.3903.desc: "В столицу прибывает воин народа [GetGlobalVariable('ciriane_culture_var').Culture.GetName] с искусно украшенным ларцом. Поставив его перед моим троном, варвар снимает крышку и показывает отрубленную голову персонажа [envoy.GetName] — [Select_CString(envoy.IsFemale, 'посланницы, которую', 'посланника, которого' )] я [Select_CString(ROOT.Char.IsFemale, 'отправила', 'отправил' )] к местным племенам.\n\n #italic «Болотный народ не признаёт королей и не принимает даров»,#! — рычит варвар. #italic «Вам не рады на нашей земле».#!\n\n #N Не дав мне ответить, воин поворачивается и уходит.#!"
 dataw_ciriane_rebellion.3903.a: "Стража! Не стойте столбом!"
 dataw_ciriane_rebellion.3903.b: "Возможно, я неверно их [Select_CString(ROOT.Char.IsFemale, 'оценила', 'оценил' )]."
 dataw_ciriane_rebellion.3903.c: "Передай своему господину мои извинения и желание принести их лично."
 dataw_ciriane_rebellion.3903.c.a_tt: "#G Успех!#!"
 dataw_ciriane_rebellion.3903.c.b_tt: "#N Неудача!#!"
 dataw_ciriane_rebellion.3903.c.s: "Варварский господин принимает ваши извинения."
 dataw_ciriane_rebellion.3903.c.f: "Варварский господин отвергает ваши извинения."

### Seeking out the Local Tribes Event Chain
 # Apology Accepted
 dataw_ciriane_rebellion.3904.t: "Извинения приняты"
 dataw_ciriane_rebellion.3904.desc: "Один из вождей болотных племён прибывает ко двору и требует ответа за нанесённое оскорбление. Мы спорим через переводчиков, пока он наконец не понимает моих истинных намерений.\n\nВоин, уже посещавший мой двор, объясняет, что вождь требует провести состязание в его честь.\n\n#N В обмен мне предлагают возможность встретиться с другими предводителями племён.#!"
 dataw_ciriane_rebellion.3904.a: "Едва обошлось!"
 dataw_ciriane_rebellion.3904.a_tt: "Вы отправитесь на #italic Племенной турнир#!"

### Seeking out the Local Tribes Event Chain
 # Apology Rejected
 dataw_ciriane_rebellion.3905.t: "Извинения отвергнуты"
 dataw_ciriane_rebellion.3905.desc: "К воротам прибывает один из вождей болотных племён вместе с целым войском варваров.\n\nОни требуют впустить их в столицу, чтобы я [Select_CString(ROOT.Char.IsFemale, 'ответила', 'ответил' )] за свои оскорбления.\n\n#N Начальник гарнизона спрашивает, что делать, словно и без того не ясно, что [barbarian.GetName] не [Select_CString(barbarian.IsFemale, 'должна впускать', 'должен впускать' )] в город целую армию.#!"
 dataw_ciriane_rebellion.3905.a: "Отправить им дары в знак извинения, но ворота не открывать!"
 dataw_ciriane_rebellion.3905.b: "Пусть убираются."
### Seeking out the Local Tribes Event Chain
 # Barbaric Guest
 dataw_ciriane_rebellion.3906.t: "Варварский гость"
 dataw_ciriane_rebellion.3906.desc: "[Select_CString(barbarian.IsFemale, 'Моя новая знакомая с болот', 'Мой новый знакомый с болот' )] с каждым днём ведёт себя всё необузданнее. Кажется, [barbarian.GetName] намеренно оскорбляет меня и моих рыцарей на каждом собрании.\n\nБольшинство придворных не обращают внимания, считая это простым недоразумением, но в конце концов [champion.GetName] спрашивает [Select_CString(barbarian.IsFemale, 'варварку', 'варвара' )] напрямую, в чём дело.\n\nЛишь тогда [Select_CString(barbarian.IsFemale, 'гостья раскрывает', 'гость раскрывает' )] свою уловку. [barbarian.GetName] [Select_CString(barbarian.IsFemale, 'желает доказать, что как воительница превосходит', 'желает доказать, что как воин превосходит' )] наших рыцарей.\n\n#N Похоже, [Select_CString(barbarian.IsFemale, 'она не успокоится, пока не узнает, способна ли одолеть', 'он не успокоится, пока не узнает, способен ли одолеть' )] своих хозяев.#!"
 dataw_ciriane_rebellion.3906.a: "[champion.GetName] будет моим бойцом."
 dataw_ciriane_rebellion.3906.b: "Я [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам' )] сражусь с [Select_CString(barbarian.IsFemale, 'ней', 'ним' )]!"

### Seeking out the Local Tribes Event Chain
 # Tribal Tournament
 dataw_ciriane_rebellion.3908.t: "Племенной турнир"
 dataw_ciriane_rebellion.3908.desc: "Советники придумали превосходное прикрытие для встречи с болотными вождями: мы устроим турнир.\n\nСоседи ни за что не догадаются, что мы собираем новых союзников, а соплеменники с радостью воспользуются возможностью показать себя искусными воинами.\n\nОднако следует учесть несколько дипломатических тонкостей. Болотный народ будет ждать, что я тоже приму участие, но это подвергнет меня опасности.\n\n#N Нужно также выбрать награду победителю: оскорбить болотного воина — верный способ нажить новых врагов.#!"
 dataw_ciriane_rebellion.3908.a: "Определим участников!"
 dataw_ciriane_rebellion.3908.b: "Определим награду!"

### Seeking out the Local Tribes Event Chain
 # Tribal Tournament
 dataw_ciriane_rebellion.3909.t: "Подготовка турнира: #italic Главная награда#!"
 dataw_ciriane_rebellion.3909.f.desc: "Первым делом нужно решить, что победитель турнира унесёт с собой. Моим рыцарям было бы достаточно одной лишь славы великого воина, но болотный народ может ценить её не так высоко.\n\n#N Кроме того, дорогой дар наверняка продадут или разделят между соплеменниками, и чрезмерные траты золота окажутся напрасными.#!"
 dataw_ciriane_rebellion.3909.desc: "Последним делом нужно решить, что победитель турнира унесёт с собой. Моим рыцарям было бы достаточно одной лишь славы великого воина, но болотный народ может ценить её не так высоко.\n\n#N Кроме того, дорогой дар наверняка продадут или разделят между соплеменниками, и чрезмерные траты золота окажутся напрасными.#!"
 dataw_ciriane_rebellion.3909.a: "Имя победителя прославится во всех землях [GetGeographicalRegion('custom_mareschois_population').GetName]."
 dataw_ciriane_rebellion.3909.b: "Победитель обретёт богатство и почёт."
 dataw_ciriane_rebellion.3909.c: "Победитель получит в дар превосходное оружие."

### Seeking out the Local Tribes Event Chain
 # Tournament Preparations: Forged for Greatness
 dataw_ciriane_rebellion.3910.t: "Подготовка турнира: #italic Выковано для величия#!"
 dataw_ciriane_rebellion.3910.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'решила', 'решил' )] наградить победителя турнира оружием, но совет по-прежнему спорит, сколько денег следует потратить.\n\nОкончательное решение остаётся за мной.\n\nНаши кузнецы гораздо искуснее болотных мастеров, поэтому любое изготовленное ими оружие превзойдёт местные изделия.\n\n#N Но слишком простой дар могут счесть оскорблением.#!"
 dataw_ciriane_rebellion.3910.a: "Болотный народ впечатлит даже #italic обычное оружие#!"
 dataw_ciriane_rebellion.3910.b: "Я закажу #P настоящий шедевр#!"
 dataw_ciriane_rebellion.3910.c: "Лучше подойдёт #N знаменитое оружие#!"
 dataw_ciriane_rebellion.3910.d: "Можно заказать нечто #G поистине выдающееся#!"
 dataw_ciriane_rebellion.3910.e: "Погодите… Я хочу вернуться назад."


### Seeking out the Local Tribes Event Chain
 # Tournament Preparations: Leaders & Champions
 dataw_ciriane_rebellion.3911.t: "Подготовка турнира: #italic Предводители и бойцы#!"
 dataw_ciriane_rebellion.3911.desc: "Последний шаг подготовки — составить список участников турнира. Мне сообщили, что болотные вожди лично участвуют во многих сражениях. От меня ждут того же, но многие советники предупреждают о чрезмерной опасности.\n\n#N Можно попросить каждого вождя назначить собственного бойца или заставить вождей сразиться с моим представителем, чтобы показать мою власть над ними.#!"
 dataw_ciriane_rebellion.3911.f.desc: "Первый шаг подготовки — составить список участников турнира. Мне сообщили, что болотные вожди лично участвуют во многих сражениях. От меня ждут того же, но многие советники предупреждают о чрезмерной опасности.\n\n#N Можно попросить каждого вождя назначить собственного бойца или заставить вождей сразиться с моим представителем, чтобы показать мою власть над ними.#!"
 dataw_ciriane_rebellion.3911.a: "Мы с вождями будем сражаться как равные."
 dataw_ciriane_rebellion.3911.b: "Мой боец докажет превосходство над любым вождём."
 dataw_ciriane_rebellion.3911.c: "Наши бойцы сойдутся в схватке нам на потеху."

### Seeking out the Local Tribes Event Chain
 # Tribal Tournament: Time to Start
 dataw_ciriane_rebellion.3912.t: "Подготовка племён: #italic Пора начинать#!"
 dataw_ciriane_rebellion.3912.desc: "Всё готово к встрече с племенными вождями. Осталось лишь разослать приглашения.\n\n#N Если всё составлено верно, можно начинать.#!"
 dataw_ciriane_rebellion.3912.a: "Начать турнир!"
 dataw_ciriane_rebellion.3912.b: "Нет! Подождите!"
 dataw_ciriane_rebellion.3912.b_tt: "Вы отмените турнир, #N завершив цепочку событий.#! Если вы заказывали ценное оружие, деньги будут возвращены."

### Seeking out the Local Tribes Event Chain
 # Champion of the Ciriane
 dataw_ciriane_rebellion.3914.t: "Поборник цириан"
 dataw_ciriane_rebellion.3914.desc: "[winner.GetName] получает звание победителя моего турнира и поборника всего народа [GetGlobalVariable('ciriane_culture_var').Culture.GetName].\n\nПохоже, [Select_CString(winner.IsFemale, 'она довольна', 'он доволен' )] и наградой, и соперниками. Толпа с восторгом принимает своего поборника и с удовольствием налегает на мою еду и напитки.\n\n#N Я вежливо поздравляю персонажа [winner.GetName], после чего отправляюсь на встречу с болотными вождями.#!"
 dataw_ciriane_rebellion.3914.a: "Лучше не заставлять их ждать…"

### Seeking out the Local Tribes Event Chain
 # Champion of the Ciriane
 dataw_ciriane_rebellion.3915.t: "Победа!"
 dataw_ciriane_rebellion.3915.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'победила', 'победил' )], и это ставит меня в неловкое положение. Придворный вручает мне мои же роскошные награды.\n\n#N Болотный народ впечатлён моим выступлением, но явно недоволен тем, что для него не осталось даров… Или всё же осталось?#!"
 dataw_ciriane_rebellion.3915.a: "Я дарю эту награду тебе, истинному цирианину!"
 dataw_ciriane_rebellion.3915.b: "Неважно. Я с гордостью приму собственный подарок."
 dataw_ciriane_rebellion.3915_tt: "Вы заберёте подарок себе!"
 dataw_ciriane_rebellion.3915.2_tt: "Вы отдадите подарок сопернику."
 dataw_ciriane_rebellion.3915.c: "Друзья, для вас я [Select_CString(ROOT.Char.IsFemale, 'приготовила', 'приготовил' )] лишь лучшие напитки!"
### Seeking out the Local Tribes Event Chain
 # Tribal Moot
 dataw_ciriane_rebellion.3916.t: "Племенное вече!"
 dataw_ciriane_rebellion.3916.desc: "После турнира я сажусь за стол вместе с болотными вождями. Мы едим и пьём. Во многом народ [GetGlobalVariable('ciriane_culture_var').Culture.GetName] ведёт политику совсем не так, как народ [GetGlobalVariable('orlesian_culture_var').Culture.GetName].\n\nОни грубы и в манерах, и во внешности. Едят быстро и много, пьют без меры и не пытаются скрыть заплетающуюся речь.\n\nНо в чём-то это лишь простое отражение Орлея. За столом они открыто говорят о своих амбициях и замыслах.\n\n#N Если я надеюсь заручиться их поддержкой, сейчас самое время показать, что мне по силам их разновидность Великой Игры.#!"
 dataw_ciriane_rebellion.3916.a: "Я продемонстрирую своё боевое мастерство."
 dataw_ciriane_rebellion.3916.b: "Я расскажу о плане восстания против Орлея."
 dataw_ciriane_rebellion.3916.c: "Я пообещаю им богатство в обмен на союз."
 dataw_ciriane_rebellion.3916.w_tt: "Цирианские племена убеждены."
 dataw_ciriane_rebellion.3916.l_tt: "Цирианские племена не убеждены."

### Seeking out the Local Tribes Event Chain
 # Betrayed by the Tribes
 dataw_ciriane_rebellion.3918.t: "Предательство племён"
 dataw_ciriane_rebellion.3918.desc: "Болотные племена не присылают ответа. Вместо этого ко двору одно за другим приходят письма с сообщениями о племенных налётчиках, разоряющих наши земли.\n\n#N Похоже, соплеменники выбрали войну. Столько трудов обратилось пеплом на моих губах.#!"
 dataw_ciriane_rebellion.3918.a: "Что ж. Значит, война."

### Seeking out the Local Tribes Event Chain
 # Warriors of the Ciriane
 dataw_ciriane_rebellion.3919.t: "Воины цириан"
 dataw_ciriane_rebellion.3919.desc: "Болотные племена приняли решение — я понимаю это, когда посреди ночи в столицу прибывает целое войско и у ворот складывает оружие.\n\n#N Эти варварские воины поклялись служить мне до конца жизни. Они принесут немалую пользу в грядущих войнах.#!"
 dataw_ciriane_rebellion.3919.a: "Вперёд! На войну!"
 dataw_ciriane_rebellion.3920.berserkers_tt: "Вам на помощь придут #N Цирианские берсерки#!"
 dataw_ciriane_rebellion.3920.berserkers: "Цирианские берсерки"

### Seeking out the Local Tribes Event Chain
 # Defender of the Tribes
 dataw_ciriane_rebellion.3920.t: "Защитник племён"
 dataw_ciriane_rebellion.3920.desc: "После долгих раздумий болотные племена выбирают представителя, который соглашается принести мне клятву службы.\n\nНовый придворный приводит с собой множество искусных воинов. Пусть этот человек груб и необуздан, его способности незаменимы, а отряд станет ценным подспорьем в грядущих войнах.\n\n#N На тайном совещании советники празднуют мой успех и утверждают, что мне досталось больше, чем когда-либо удалось бы купить.#!"
 dataw_ciriane_rebellion.3920.a: "Добро пожаловать к моему двору!"

### Unholy Alliance Event Chain
 # An Offer of Alliance (Roux Side)
 dataw_ciriane_rebellion.4000.t: "Предложение союза"
 dataw_ciriane_rebellion.4000.desc: "В замке, затерянном среди болот, слишком легко забыть о событиях внешнего мира — особенно теперь, когда мы отделились от державы [GetTitleByKey('e_orlais').GetBaseNameNoTier].\n\nНо… что-то не даёт мне покоя. Я встаю с постели и брожу по тёмным ночным коридорам, вновь и вновь обдумывая один вопрос. Я больше ничем не [Select_CString(ROOT.Char.IsFemale, 'обязана', 'обязан' )] [orlais.GetTitleAsNameNoTooltip] — тем более жизнями и верностью моих солдат.\n#italic Почему же продолжающееся эльфийское вторжение так меня тревожит?#!\n\nВозможно, утром я отправлю гонца в державу [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier]. Пусть вассальная клятва, принесённая некогда [Select_CString(orlais.IsFemale, 'правительнице', 'правителю' )] по имени [orlais.GetName], больше меня не связывает, но я могу заключить союз с державой, которую возглавляет [orlais.GetTitleAsNameNoTooltip], и поддержать её в этой войне.\n\n#N А быть может, с улыбкой оставлю их наедине с собственной судьбой.#!"
 dataw_ciriane_rebellion.4000.a: "Предложить союз без всяких условий."
 dataw_ciriane_rebellion.4000.b: "Проявить расчётливость: сколько моя помощь стоит для [orlais.GetTitleAsNameNoTooltip]?"
 dataw_ciriane_rebellion.4000.b_tt: "Вы потребуете [gold_i]#N 100#! за заключение союза."
 dataw_ciriane_rebellion.4000.c: "Вернуться в постель и наконец уснуть спокойно."

### Unholy Alliance Event Chain
 # An Offer of Alliance (Orlais Side)
 dataw_ciriane_rebellion.4001.t: "Предложение союза"
 dataw_ciriane_rebellion.4001.desc: "Дворец погружён в тревожные сумерки. При свете свечей я сижу в кабинете и яростно строчу одно послание за другим. [Concept('elves','Эльфы')|E] и их безжалостные рыцари холодной, неумолимой волной хлынули из лесов. За собой они оставляют лишь страдания и разорение — целые деревни преданы мечу, словно во времена [Concept('blight','Мора')|E].\n\nИ всё же среди бумаг на столе лежит одна, к которой я постоянно возвращаюсь, как ни стараюсь её забыть. Письмо из земель [GetGeographicalRegion('custom_mareschois_population').GetName] от [Select_CString(nahashin.IsFemale, 'моей… бывшей вассалки', 'моего… бывшего вассала' )].\n\nЯ больше не могу потребовать, чтобы [nahashin.GetName] [Select_CString(nahashin.IsFemale, 'отправила', 'отправил' )] войска на эту войну, и [Select_CString(nahashin.IsFemale, 'она прекрасно это знает', 'он прекрасно это знает' )]. Но передо мной добровольное предложение помощи. [nahashin.GetName] обращается ко мне на равных и предлагает союз против наших долийских врагов."
 dataw_ciriane_rebellion.4001.b.desc: "\n\n#N Это предложение сделано не из милосердия. В обмен на помощь болотного народа [nahashin.GetFirstName] требует внушительную сумму золота.#!"
 dataw_ciriane_rebellion.4001.a: "Я не могу позволить себе отвергнуть такое предложение."
 dataw_ciriane_rebellion.4001.a_tt: "[nahashin.GetName] станет [Select_CString(nahashin.IsFemale, 'вашей союзницей', 'вашим союзником' )] и автоматически вступит в войну против Долов на вашей стороне."
 dataw_ciriane_rebellion.4001.b: "Признать законность этого жалкого подобия королевства? Нет, я справлюсь без них."

### Unholy Alliance Event Chain
 # An Offer of Alliance (Orlais Side)
 dataw_ciriane_rebellion.4002.t: "Ответ"
 dataw_ciriane_rebellion.4002.o.desc: "Под облачным небом к моей крепости приближается всадник на бледном коне. Это гонец [orlais.GetTitleAsNameNoTooltip], и вскоре я узнаю, будут ли мои люди втянуты в безумие эльфов и людей.\n\nСвиток передают прямо мне в руки. Я с волнением разворачиваю его. На пергаменте написано одно-единственное слово:\n\n #italic #N «OUI»#!#!"
 dataw_ciriane_rebellion.4002.n.desc: "Под облачным небом к моей крепости приближается всадник на бледном коне. Это гонец [orlais.GetTitleAsNameNoTooltip], и вскоре я узнаю, будут ли мои люди втянуты в безумие эльфов и людей.\n\nСвиток передают прямо мне в руки. Я с волнением разворачиваю его. На пергаменте написано одно-единственное слово:\n\n #italic #N «NON»#!#!"
 dataw_ciriane_rebellion.4002.a: "Да будет так."

## Ally Serault/Alyons
# The Value of Friendship
 dataw_ciriane_rebellion.4050.t: "Цена дружбы"
 dataw_ciriane_rebellion.4050.desc: "Если я надеюсь купить союзников, следует тщательно обдумать цену.\n\nНельзя опустошать казну ради новых друзей. В будущем союзники будут ждать новых даров, а сегодняшний подарок установит меру всех последующих.\n\n#N Кроме того, получив деньги, они могут просто забрать их и сбежать.#!"
 dataw_ciriane_rebellion.4050.a: "Одного моего присутствия достаточно, чтобы их убедить"
 dataw_ciriane_rebellion.4050.a_tt: "Вы не дадите ничего. Это почти наверняка сочтут оскорблением, и ваши шансы заключить союз будут полностью уничтожены. #N Вы уверены, что хотите так поступить?#!"
 dataw_ciriane_rebellion.4050.b: "Малый дар в размере 25[gold_i]."
 dataw_ciriane_rebellion.4050.c: "Умеренный дар в размере 100[gold_i]."
 dataw_ciriane_rebellion.4050.d: "Большой дар в размере 250[gold_i]."

# It's Free Real Estate!
 dataw_ciriane_rebellion.4051.t: "Земля даром!"
 dataw_ciriane_rebellion.4051.desc: "Передав владение [spare_county.GetName] соседям, я сделаю их сильнее.\n\nЭто самое заманчивое предложение, которое я могу сделать. Последствия способны стать катастрофическими, а отказ от земли многие сочтут проявлением моей слабости.\n\nЯ сохраню часть претензий и смогу вернуть землю в случае предательства, но наши державы окажутся тесно переплетены, и любая война станет ещё разорительнее для обеих сторон.\n\n#N Быть может, именно так нам удастся сохранить мир.#!"
 dataw_ciriane_rebellion.4051.a: "Лишь бы это сработало…"

# Counteroffer
 dataw_ciriane_rebellion.4052.t: "Встречное предложение"
 dataw_ciriane_rebellion.4052.desc: "Союз с Нахашином заманчив, но предложенные условия оставляют желать лучшего. Мы с советниками снова и снова оттачиваем встречное предложение. Нужно пройти по тонкой грани: добиться заслуженной платы, не оскорбив возможных друзей.\n\n#N Мы спорим так долго, что едва не забываем решить, чего именно хотим потребовать.#!"
 dataw_ciriane_rebellion.4052.a: "Мы желаем получить обещание золота."
 dataw_ciriane_rebellion.4052.b: "Если вам нужны наши мечи, мы желаем получить землю."

# A Counteroffer of Friendship
 dataw_ciriane_rebellion.4053.t: "Встречное предложение дружбы"
 dataw_ciriane_rebellion.4053.desc: "Похоже, соседям недостаточно моего предложения дружбы. Их послы прибывают ко двору с собственными условиями.\n\n#italic «Вы должны понять, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )]»,#! — осторожно начинает дипломат. — #italic «Вы просите о долгом и прочном союзе, а связанный с ним риск несоразмерен предложенной вами цене».#!\n\nЯ спрашиваю, чего же они хотят, и дипломат отвечает…"
 dataw_ciriane_rebellion.4053.m.desc: "\n\n#italic «Скромную сумму, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )], но достаточно ценный дар, который ознаменует новую эпоху нашего сотрудничества».#! Сколько мёда в словах, скрывающих столь низменное требование. Деньги за военный союз? Насколько же велики их долги?"
 dataw_ciriane_rebellion.4053.l.desc: "\n\n#italic «Мы просим землю, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин' )]. Мой сюзерен желает передвинуть нашу границу вглубь владения [spare_county.GetName], чтобы мы могли лучше защищать друг друга».#! Вежливое название для захвата земель. Соседи, должно быть, считают меня [Select_CString(ROOT.Char.IsFemale, 'совсем отчаявшейся', 'совсем отчаявшимся' )], раз требуют подобного."
 dataw_ciriane_rebellion.4053.a: "Их просьба справедлива. Я соглашусь."
 dataw_ciriane_rebellion.4053.b: "Я отказываюсь. Вернись к сюзерену и сообщи о своей неудаче."
 dataw_ciriane_rebellion.4053.c: "Это оскорбление! К оружию!"
 dataw_ciriane_rebellion.4053_n: "[nahashin.GetName] отвергает ваши требования."
 dataw_ciriane_rebellion.4053_a: "[nahashin.GetName] принимает ваши требования."
 dataw_ciriane_rebellion.4053_w: "Ваше требование оскорбляет персонажа [nahashin.GetName], и [Select_CString(nahashin.IsFemale, 'она объявляет', 'он объявляет' )] войну."
 dataw_ciriane_rebellion.4053_tt: "#color_goldy_yellow Сверху указано их требование, а снизу — ваш дар им.#!"
# An Alliance Forged
 dataw_ciriane_rebellion.4054.t: "Союз заключён"
 dataw_ciriane_rebellion.4054.desc: "Новые союзники отправляют своего посла во главе великолепной процессии. Рыцари несут по улицам наши знамёна, а дипломат персонажа [ally_target.GetName] направляется ко двору. Я вручаю ему подписанный экземпляр нового договора и получаю взамен копию с подписью союзника.\n\n#N Наши воины смеются вместе, обсуждая будущие войны.#!"
 dataw_ciriane_rebellion.4054.a: "Всё это было не напрасно."
 dataw_ciriane_rebellion.4054.a_tt: "Вы заключили союз с персонажем [ally_target.GetName]."
# An Alliance Forged
 dataw_ciriane_rebellion.4055.t: "Потерянный союз"
 dataw_ciriane_rebellion.4055.desc: "Дипломат соседа заметно нервничает, когда [messenger.GetName] прибывает ко двору. [Select_CString(messenger.IsFemale, 'Она не решается', 'Он не решается' )] встретиться со мной взглядом, передавая ответ своего сюзерена. Союза не будет. Дипломат беспокойно переминается с ноги на ногу, страшась моей реакции…"
 dataw_ciriane_rebellion.4055.a: "Не стоит казнить гонца. Ступай своей дорогой."
 dataw_ciriane_rebellion.4055.b: "Стража! Схватить [Select_CString(messenger.IsFemale, 'её', 'его' )]!"
 dataw_ciriane_rebellion.4055.c: "Это оскорбление! К оружию!"
 dataw_ciriane_rebellion.4055.a_tt: "Вы потеряли возможность заключить союз с персонажем [ally_target.GetName]."
## Siding with Orlais: Rooting out Ciriane Rebel's
# Swear a New Oath DLC
 dataw_ciriane_rebellion.4099.t: "Новая клятва"
 dataw_ciriane_rebellion.4099.desc: "Жребий брошен. С тех пор как [orlais.GetTitleAsNameNoTooltip] [orlais.GetFirstName] [Select_CString(orlais.IsFemale, 'узнала', 'узнал' )] о планах цириан поднять восстание, напряжение лишь растёт. Такую угрозу империи нельзя оставить без ответа.\n\n[orlais.GetFirstName] [Select_CString(orlais.IsFemale, 'благодарна', 'благодарен' )] вам за прежнюю поддержку, но теперь требует принести новую клятву верности [Select_CString(orlais.IsFemale, 'ей', 'ему' )] и Орлею и, разумеется, продолжить помощь в искоренении этих негодяев.\n\n#italic «Разумеется, [Select_CString(orlais.IsFemale, 'моя госпожа', 'мой господин' )]. Я, [GetPlayer.GetName], обещаю быть [Select_CString(ROOT.Char.IsFemale, 'верной', 'верным' )] [Select_CString(orlais.IsFemale, 'законной', 'законному' )] [orlais.GetTitleAsNameNoTooltip], [orlais.GetFirstName], во всём, что касается жизни, тела и земной чести».#!"
 dataw_ciriane_rebellion.4099.a: "Я [Select_CString(ROOT.Char.IsFemale, 'принесла', 'принёс' )] клятву."
# Swear a New Oath Non DLC (Same)
 dataw_ciriane_rebellion.4100.t: "Новая клятва"
 dataw_ciriane_rebellion.4100.desc: "Жребий брошен. С тех пор как [orlais.GetTitleAsNameNoTooltip] [orlais.GetFirstName] [Select_CString(orlais.IsFemale, 'узнала', 'узнал' )] о планах цириан поднять восстание, напряжение лишь растёт. Такую угрозу империи нельзя оставить без ответа.\n\n[orlais.GetFirstName] [Select_CString(orlais.IsFemale, 'благодарна', 'благодарен' )] вам за прежнюю поддержку, но теперь требует принести новую клятву верности [Select_CString(orlais.IsFemale, 'ей', 'ему' )] и Орлею и, разумеется, продолжить помощь в искоренении этих негодяев.\n\n#italic «Разумеется, [Select_CString(orlais.IsFemale, 'моя госпожа', 'мой господин' )]. Я, [GetPlayer.GetName], обещаю быть [Select_CString(ROOT.Char.IsFemale, 'верной', 'верным' )] [Select_CString(orlais.IsFemale, 'законной', 'законному' )] [orlais.GetTitleAsNameNoTooltip], [orlais.GetFirstName], во всём, что касается жизни, тела и земной чести».#!"
 dataw_ciriane_rebellion.4100.a: "Я [Select_CString(ROOT.Char.IsFemale, 'принесла', 'принёс' )] клятву."
# The Frontiers Secuured
 dataw_ciriane_rebellion.4101.t: "Границы защищены"
 dataw_ciriane_rebellion.4101.desc: "Я улыбаюсь, вновь перечитывая грамоту о капитуляции. Свершилось. Серо и Алайону не осталось ничего иного, кроме как покориться мощи империи.\n\n#italic «Нет, —#! думаю я, #italic — покориться мне».#! Именно я [Select_CString(ROOT.Char.IsFemale, 'совершила', 'совершил' )] это. Теперь [orlais.GetTitleAsNameNoTooltip] наверняка больше никогда не усомнится в моей верности.\n\nКогда они у нас под пятой, запад вскоре будет в безопасности. Разумеется, могут появиться мелкие мятежники, но их быстро и жестоко заставят замолчать.\n\n#italic «Хвала Создателю. Скоро всё закончится».#!"
 dataw_ciriane_rebellion.4101.a: "Я хорошо [Select_CString(ROOT.Char.IsFemale, 'послужила', 'послужил' )] империи."
# The Frontiers Enraged
 dataw_ciriane_rebellion.4102.t: "Разъярённое пограничье"
 dataw_ciriane_rebellion.4102.desc: "Я вновь разглаживаю пергамент. Сколько ни перечитывай, ни сминай и ни отбрасывай его, истина не меняется.\n\n#N Поражение.#!\n\nКак мы могли проиграть кучке выскочек-мятежников с запада? Как они смогли выстоять против мощи империи?\n\n#italic «Создатель, почему ты покинул нас, когда мы лишь следовали указанному тобой пути?»#!\n\n[orlais.GetTitleAsNameNoTooltip] [orlais.GetFirstName] никогда не простит этой неудачи. Я это знаю."
 dataw_ciriane_rebellion.4102.a: "Я [Select_CString(ROOT.Char.IsFemale, 'подвела', 'подвёл' )] империю…"
# The Rebellion Begins
 dataw_ciriane_rebellion.4103.t: "Начало восстания"
 dataw_ciriane_rebellion.4103.desc: "Я снова сижу в покоях со смятым пергаментом в руке. Сколько их уже было? Послание перечитано раз за разом.\n\nВ донесении говорится о восстании среди моего собственного народа. Меня называют [Select_CString(ROOT.Char.IsFemale, 'самозванкой, тиранкой и демоницей', 'самозванцем, тираном и демоном' )] — и это ещё не худшие слова.\n\nОни больше не будут участвовать в моей войне и не признают ни меня, ни империю своими правителями. В ярости я бросаю пергамент в пылающий очаг.\n\n#N #italic «Да будет так».#!#!"
 dataw_ciriane_rebellion.4103.a: "Я и вправду [Select_CString(ROOT.Char.IsFemale, 'подвела', 'подвёл' )] империю…"
 dataw_ciriane_rebellion.4103.a_tt: "Цириане начинают войну, чтобы лишить вас законной власти над Болотами!"
 dataw_ciriane_rebellion.4103.b_tt: "Цириане подняли бы войну, чтобы лишить вас власти, но вы уже сражаетесь с одним из них, поэтому остальные сплотились вокруг этого противника."
 ciriane_revolt: "Восстание цириан"
# The Rebellion Falters
 dataw_ciriane_rebellion.4104.t: "Восстание терпит крах"
 dataw_ciriane_rebellion.4104.desc: "Предводитель мятежников стоит передо мной на коленях. Похоже, осведомитель не ошибся: среди моего народа действительно зрело восстание.\n\nК несчастью для заговорщиков, они оказались слишком жалкими, чтобы причинить настоящий вред. Без поддержки им оставалось лишь проклинать моё имя в тавернах. Большинство мятежников уже предано мечу, но как поступить с их предводителем?"
 dataw_ciriane_rebellion.4104.a: "Немедленно казнить этого глупца!"
 dataw_ciriane_rebellion.4104.b: "Уберите его с моих глаз и бросьте в самую тёмную темницу!"
# A Promising Message
 dataw_ciriane_rebellion.4105.t: "Многообещающее послание"
 dataw_ciriane_rebellion.4105.desc: "Я сияю от гордости, когда орлесианский гонец сообщает, что меня призывают в столицу: [orlais.GetTitleAsNameNoTooltip] [orlais.GetFirstName] лично вручит мне награду.\n\n#N [orlais.GetTitleAsNameNoTooltip] требует отправиться в путь немедленно.#!"
 dataw_ciriane_rebellion.4105.a: "Разумеется, какая честь. Готовьте караван!"
# The Finest Reward
 dataw_ciriane_rebellion.4106.t: "Лучшая награда"
 dataw_ciriane_rebellion.4106.desc: "Я стою на коленях на холодном твёрдом полу. Передо мной во всём своём величии возвышается [orlais.GetTitleAsNameNoTooltip]. Наконец-то пришло признание, которого я так долго [Select_CString(ROOT.Char.IsFemale, 'ждала', 'ждал' )]. Ради этой чести все труды были не напрасны.\n\n[orlais.GetTitleAsNameNoTooltip] произносит перед двором величественную речь, подробно перечисляя мои великие деяния. Когда собравшиеся слышат о моей помощи империи, по залу прокатываются восхищённые возгласы, приветственные крики и рукоплескания.\n\nНаконец [orlais.GetTitleAsNameNoTooltip] приказывает мне встать. Несмотря на затёкшие колени, мне удаётся подняться. [orlais.GetTitleAsNameNoTooltip] подаёт знак двум слугам, которые вносят большой украшенный сундук.\n\nСлуга открывает крышку, и по залу прокатывается нарастающий гул изумления. В сундуке лежит новая часть доспеха, изготовленная специально для меня.\n\n#italic «Благодарю вас. Я буду с честью носить её во имя вашего величества».#!"
 dataw_ciriane_rebellion.4106.a: "Поистине прекрасная награда."
# The War for Orlais’s West
 dataw_ciriane_rebellion.4107.t: "Война за запад Орлея"
 dataw_ciriane_rebellion.4107.desc: "Письмо отправлено.\n\n[ally_target.GetTitleAsName] державы [ally_target.GetPrimaryTitle.GetBaseNameNoTier], без сомнения, начнёт готовить войска: верный меч Орлея уже вступил на эти земли во славу империи.\n\n"
 dataw_ciriane_rebellion.4107.s.desc: "#N Что бы ни приготовили господа Стеклянного замка, победа будет за нами.#!"
 dataw_ciriane_rebellion.4107.a.desc: "#N Что бы ни приготовили господа последнего оплота цивилизации, победа будет за нами.#!"
 dataw_ciriane_rebellion.4107.a: "Мы выступаем к державе [ally_target.GetPrimaryTitle.GetBaseNameNoTier]!"
# The Empire’s March
 dataw_ciriane_rebellion.4108.t: "Марш империи"
 dataw_ciriane_rebellion.4108.desc: "Держава [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier] всегда находилась далеко от [GetPlayer.GetPrimaryTitle.GetBaseNameNoTier], но её влияние ощущается даже здесь, у самого края Тирашана. И всё же лежащее передо мной письмо сообщает совсем не то, чего я [Select_CString(ROOT.Char.IsFemale, 'ожидала', 'ожидал' )].\n\n[nahashin.GetTitleAsNameNoTooltip] Нахашина ведёт свои войска против меня, явно намереваясь вернуть [GetPlayer.GetPrimaryTitle.GetBaseNameNoTier] под власть Орлея.\n\n#N Этот поступок ясно показывает, что Нахашин намерен хранить верность империи вопреки воле собственного народа.#!"
 dataw_ciriane_rebellion.4108.a: "Значит, будет война."

# Siding with Orlais: Those Who Hide amongst the Marshes
# A Blade from the Marshes
 dataw_ciriane_rebellion.4150.t: "Клинок из болот"
 dataw_ciriane_rebellion.4150.desc: "В ту ночь мне почти не спалось. Клятва Нахашина хранить верность Орлею создала мне множество врагов среди марешуа, желавших независимости. Многие требуют моей смерти за то, что считают предательством.\n\nВ тишине покоев раздаётся единственный шаг — кто-то изо всех сил старается двигаться бесшумно.\n\n#N Здесь кто-то есть, и эта попытка не издать ни звука может означать лишь злой умысел.#!\n\nДелая вид, будто сплю, я медленно тянусь к кинжалу и сквозь едва приоткрытые глаза вижу, как приближается убийца. [assassin.GetName] ступает так тихо, насколько это возможно. Несомненно, передо мной [Select_CString(assassin.IsFemale, 'профессионалка', 'профессионал' )], но при некоторой удаче тот единственный шаг станет [Select_CString(assassin.IsFemale, 'её', 'его' )] погибелью.\n\n[assassin.GetName] приближается, занеся надо мной кинжал. Теперь я хорошо вижу убийцу и легко могу достать до [Select_CString(assassin.IsFemale, 'неё', 'него' )]. Нужно лишь ударить."
 dataw_ciriane_rebellion.4150.a: "Не сегодня, [Select_CString(assassin.IsFemale, 'глупица', 'глупец' )]!"
 dataw_ciriane_rebellion.4150.a_tt: "Вы наносите удар нападающему!"
 dataw_ciriane_rebellion.4150.b: "Быть может, моя смерть наконец утешит тех, кому кажется, что их предали."
 dataw_ciriane_rebellion.4150.b_tt: "Вы позволите убийце лишить вас жизни…"

# Siding with Orlais: Those who hide amongst the Marshes
# A Plot Amongst the Marshes
 dataw_ciriane_rebellion.4151.t: "Заговор среди болот"
 dataw_ciriane_rebellion.4151.desc: "Мой клинок входит в шею застигнутого врасплох убийцы. [assassin.GetName] едва успевает понять, что произошло, и пытается ответить, но я легко удерживаю [Select_CString(assassin.IsFemale, 'её', 'его' )], пока жизнь уходит вместе с кровью из раны.\n\nНа предсмертный хрип в комнату вбегает [Select_CString(bodyguard.IsFemale, 'телохранительница', 'телохранитель' )] [bodyguard.GetName].\n\n#italic «[Select_CString(ROOT.Char.IsFemale, 'Герцогиня', 'Герцог' )]! Простите, что [Select_CString(assassin.IsFemale, 'эта женщина сумела проскользнуть', 'этот мужчина сумел проскользнуть' )]! Как хорошо, что вы вовремя [Select_CString(assassin.IsFemale, 'её остановили', 'его остановили' )]!»#!\n\nВнимательно осмотрев тело, мы находим записку на староцирианском языке: #italic «Ночной Клинок, в час, когда свет Сомисариан во тьме достигнет высшей точки, окно будет открыто, и ты сможешь поразить [Select_CString(ROOT.Char.IsFemale, 'Предательницу Болот', 'Предателя Болот' )]. Скрывающиеся среди Болот верят, что ты исполнишь предназначенное, ибо все мы боремся против [Select_CString(ROOT.Char.IsFemale, 'Предательницы Болот', 'Предателя Болот' )]».#!\n\nПохоже, убийцу отправила группа, называющая себя «Скрывающиеся среди Болот». Тайное общество твёрдо намерено погубить меня, и неизвестно, насколько далеко простирается его влияние. Несомненно, среди придворных скрывается новый агент. Выследить такого агента было бы чрезвычайно полезно."
 dataw_ciriane_rebellion.4151.a: "Начать охоту."
 dataw_ciriane_rebellion.4151.a_tt: "Начинается охота на «Скрывающихся среди Болот». #italic Стоит присмотреться к своим вассалам и придворным, ведь #N любой из них может скрывать опасную тайну — свою причастность к заговорщикам.#!#!"

# Siding with Orlais: Those who hide amongst the Marshes
# An Offer of Vengeance
 dataw_ciriane_rebellion.4152.t: "Предложение мести"
 dataw_ciriane_rebellion.4152.desc: "Из герцогской столицы Нахашина пришли удивительные вести: на [nahashin.GetTitleAsNameNoTooltip] было совершено покушение!\n\n"
 dataw_ciriane_rebellion.4152.desc.a.y: "[nahashin.GetTitleAsNameNoTooltip] [Select_CString(nahashin.IsFemale, 'лежит мёртвая', 'лежит мёртвый' )] в луже собственной крови, а убийцы по-прежнему разгуливают на свободе.\n\n"
 dataw_ciriane_rebellion.4152.desc.a.n: "Однако убийца с удивлением [Select_CString(assassin.IsFemale, 'обнаружила', 'обнаружил' )] клинок в собственной шее, когда уже [Select_CString(assassin.IsFemale, 'готовилась', 'готовился' )] проделать то же самое со своей жертвой.\n\n"
 dataw_ciriane_rebellion.4152.desc.a: "Как бы то ни было, одно несомненно: кто-то в Нахашине желает смерти [nahashin.GetTitleAsNameNoTooltip], вероятно, из-за возобновлённой верности Вал Руайо. Это объясняет письмо, найденное сегодня утром в моих покоях.\n\n"
 dataw_ciriane_rebellion.4152.desc.b: "Письмо написано на староцирианском языке, и никто из придворных не помнит, чтобы приносил его мне. После тщательного перевода становится ясно: группа, называющая себя «Скрывающиеся среди Болот», борется против Орлея ради освобождения Нахашина от имперской власти и желает заручиться моей помощью. Они клянутся именем Сомисариан, Царицы Солнца и Луны, а значит, не питают любви и к Церкви — возможно, из-за её связи с державой [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier].\n\n#N Остаётся лишь подготовить ответ.#!"
 dataw_ciriane_rebellion.4152.a: "Я разделю вашу древнюю веру и присоединюсь к заговору. Изгоним Вал Руайо!"
 dataw_ciriane_rebellion.4152.a_tt: "Будучи игроком, вы не можете стать соучастником… но ваша помощь даст #N усиление#! проискам убийства."
 dataw_ciriane_rebellion.4152.b: "Создатель милостивый! Об этих глупцах нужно немедленно донести!"
 dataw_ciriane_rebellion.4152.b_tt: "[vassal.GetFirstName] предупреждает вас о #N Скрывающихся среди Болот#!"
 dataw_ciriane_rebellion.4152.b.r_tt: "[nahashin.GetFirstName] получает предупреждение о #N Скрывающихся среди Болот#!"
 dataw_ciriane_rebellion.4152.d.r_tt: "[nahashin.GetFirstName] раскрывает вашу измену."
 dataw_ciriane_rebellion.4152.r.d_tt: "[vassal.GetFirstName] сотрудничает со #N Скрывающимися среди Болот#!"
 dataw_ciriane_rebellion.4152.c: "[Select_CString(nahashin.IsFemale, 'Герцогине', 'Герцогу' )] будет приятно услышать эти слова и успокоиться."
 dataw_ciriane_rebellion.4152.c_tt: "Требуется ОДНО из следующего: образ жизни интригана, бессердечность или непредсказуемость."
 dataw_ciriane_rebellion.4152.w_e_tt: "Вы обманываете персонажа [nahashin.GetFirstName] и сближаетесь с [Select_CString(nahashin.IsFemale, 'ней', 'ним' )]."
 dataw_ciriane_rebellion.4152.l_e_tt: "[nahashin.GetFirstName] узнает о вашей измене."

# Misc
 dataw_ciriane_rebellion.4152.w_tt: "#G Успех!#!"
 dataw_ciriane_rebellion.4152.l_tt: "#N Неудача!#!"
 dataw_ciriane_rebellion.4152.w.c_tt: "#G Критический успех!#!"
 dataw_ciriane_rebellion.4152.l.c_tt: "#N Критическая неудача!#!"

# Siding with Orlais: Those who hide amongst the Marshes

# The Work Against Loyallty
 dataw_ciriane_rebellion.4153.t: "Подрыв верности"
 dataw_ciriane_rebellion.4153.desc: "Пришло время обратиться к союзникам среди болот, которые всегда готовы бороться за независимость Нахашина от Орлея.\n\n#N Несколько человек откликнулись на мой призыв и предложили способы поддержать наше дело.#!"
 dataw_ciriane_rebellion.4153.a: "Настроив народ против [nahashin.GetTitleAsNameNoTooltip], мы обретём поддержку."
 dataw_ciriane_rebellion.4153.a.w_tt: "Народ владения [title.GetBaseNameNoTier] поддерживает ваше правое дело."
 dataw_ciriane_rebellion.4153.a.l_tt: "Народ владения [title.GetBaseNameNoTier] ещё сильнее поддерживает персонажа [nahashin.GetFirstName]!"

 dataw_ciriane_rebellion.4153.c.c_tt: "Народ владения [title.GetBaseNameNoTier] принимает конфессию [GetFaithByKey('ciriane_paganism').GetAdjective]"
 dataw_ciriane_rebellion.4153.c.d_tt: "Народ владения [title.GetBaseNameNoTier] принимает конфессию [GetFaithByKey('orlesian_chantry').GetAdjective]"


 dataw_ciriane_rebellion.4153.b: "Лучший способ ослабить будущего врага — устроить диверсию в армии."
 dataw_ciriane_rebellion.4153.b.w_tt: "Размер случайного полка профессионалов персонажа [nahashin.GetFirstName] уменьшится на 1"
 dataw_ciriane_rebellion.4153.b.w_a_tt: "Размер полка [maa.GetName] персонажа [nahashin.GetFirstName] уменьшится на 1"
 dataw_ciriane_rebellion.4153.b.w_c_tt: "Размер полка [maa.GetName] персонажа [nahashin.GetFirstName] уменьшится на 2"
 dataw_ciriane_rebellion.4153.b.w_b_tt: "Полк [maa.GetName] персонажа [nahashin.GetFirstName] будет уничтожен"

 dataw_ciriane_rebellion.4153.r.d_tt: "«Скрывающиеся среди Болот» устраивают диверсию в полку [maa.GetName]"
 dataw_ciriane_rebellion.4153.r.1_tt: "«Скрывающиеся среди Болот» уменьшают размер полка [maa.GetName] на 1"
 dataw_ciriane_rebellion.4153.r.2_tt: "«Скрывающиеся среди Болот» уменьшают размер полка [maa.GetName] на 2"

 dataw_ciriane_rebellion.4153.b.w_o_tt: "Размер вашего полка [maa.GetName] уменьшится на 1"
 dataw_ciriane_rebellion.4153.b.w_o2_tt: "Размер вашего полка [maa.GetName] уменьшится на 2"
 dataw_ciriane_rebellion.4153.b.w_o3_tt: "Ваш полк [maa.GetName] будет уничтожен"
 dataw_ciriane_rebellion.4153.b.l_tt: "Размер одного из ваших случайных полков профессионалов уменьшится на 1"
 dataw_ciriane_rebellion.4153.b.w.c_tt: "Размер случайного полка профессионалов персонажа [nahashin.GetFirstName] уменьшится на 2"
 dataw_ciriane_rebellion.4153.b.l.c_tt: "Размер одного из ваших случайных полков профессионалов уменьшится на 2"

 dataw_ciriane_rebellion.4153.c: "Спрятать по соглядатаю в каждой стене, чтобы слышать каждое слово!"
 dataw_ciriane_rebellion.4153.c.w_tt: "[courtier.GetFirstName] присоединяется к проискам убийства персонажа [nahashin.GetFirstName]"
 dataw_ciriane_rebellion.4153.c.l_tt: "Наёмники отказываются присоединиться к вам!"
 dataw_ciriane_rebellion.4153.c.t_tt: "[courtier.GetName]"
 dataw_ciriane_rebellion.4153.d: "Разорить рынки персонажа [nahashin.GetName] и заставить [Select_CString(nahashin.IsFemale, 'любимицу', 'любимца' )] Вал Руайо страдать"
 dataw_ciriane_rebellion.4153.e: "Мы научим крестьян старым обычаям, чтобы отвратить их от Орлея."
 dataw_ciriane_rebellion.4153.e_tt: "Начинается охота на «Скрывающихся среди Болот»."
 dataw_ciriane_rebellion.4153.e.w_tt: "Наёмники соглашаются присоединиться к вам!"
 dataw_ciriane_rebellion.4153.e.l_tt: "Наёмники отказываются присоединиться к вам!"

# An Unexpected Ally
 dataw_ciriane_rebellion.4154.t: "[Select_CString(nahashin.IsFemale, 'Неожиданная союзница', 'Неожиданный союзник' )]"
 dataw_ciriane_rebellion.4154.desc: "Что ж, неловкая ситуация.\n\nПолученное сегодня утром письмо лично [Select_CString(nahashin.IsFemale, 'прислала', 'прислал' )] [nahashin.GetTitleAsNameNoTooltip] Нахашина, [nahashin.GetFirstName]. [nahashin.GetName] требует немедленно прекратить мои попытки ослабить герцогство, поскольку так я лишь наврежу «Скрывающимся среди Болот»."
 dataw_ciriane_rebellion.4154.desc.a.n.k: "Меня потрясает известие: [nahashin.GetTitleAsNameNoTooltip] Нахашина поддерживает меня. Теперь у меня остаётся лишь два пути."
 dataw_ciriane_rebellion.4154.desc.a.k: "Мне уже известно, что [nahashin.GetTitleAsNameNoTooltip] тоже участвует в заговоре, но эта странная ситуация всё равно оставляет лишь два пути."
 dataw_ciriane_rebellion.4154.desc.a: "Отказаться от любых заговоров против [nahashin.GetTitleAsNameNoTooltip], пока [Select_CString(nahashin.IsFemale, 'она остаётся', 'он остаётся' )] у власти, или продолжить, несмотря ни на что. Ослабление Нахашина ослабит и Орлей, а когда заговор наконец достигнет цели, на вершине могу оказаться я, а не [Select_CString(nahashin.IsFemale, 'она', 'он' )]."
 dataw_ciriane_rebellion.4154.a: "Немедленно прекратить планы. [nahashin.GetTitleAsNameNoTooltip] — [Select_CString(nahashin.IsFemale, 'одна из нас', 'один из нас' )]!"
 dataw_ciriane_rebellion.4154.b: "Изолировать этих агентов от остальных участников и продолжить по плану."

# Death of the Betrayer
 dataw_ciriane_rebellion.4155.t: "Смерть [Select_CString(nahashin_past_holder.IsFemale, 'Предательницы', 'Предателя' )]"
 dataw_ciriane_rebellion.4155.desc: "#N [Select_CString(nahashin_past_holder.IsFemale, 'Предательница мертва', 'Предатель мёртв' )].#!\n\n[Select_CString(nahashin_past_holder.IsFemale, 'Та, кто предала свой народ ради сохранения власти Вал Руайо, наконец ушла', 'Тот, кто предал свой народ ради сохранения власти Вал Руайо, наконец ушёл' )] в [Concept('fade','Тень')|E] и больше не вернётся.\n\n"
 dataw_ciriane_rebellion.4155.desc.a.m: "Но этот переход не был мирным: смерть была намеренно ускорена персонажем [nahashin_past_holder.GetKiller.GetName]. Одни назовут убийцу героем, другие — безумным радикалом, но восторжествует ли справедливость для персонажа [nahashin_past_holder.GetFirstName], пока неизвестно.\n\n"
 dataw_ciriane_rebellion.4155.desc.a.ms: "Но уход из мира живых окутан тайной. Многие говорят, что [nahashin_past_holder.GetName] [Select_CString(nahashin_past_holder.IsFemale, 'была убита', 'был убит' )] «Скрывающимися среди Болот» — тайной группой непримиримых сторонников независимости Нахашина от Орлея.\n\n"
 dataw_ciriane_rebellion.4155.desc.a.n: "И, вопреки ожиданиям многих, [Select_CString(nahashin_past_holder.IsFemale, 'Предательницу', 'Предателя' )] погубил не один из многочисленных врагов, а естественные обстоятельства, предначертанные Создателем.\n\n"
 dataw_ciriane_rebellion.4155.desc.a: "Теперь начинается новая эпоха — [Select_CString(nahashin_past_holder.IsFemale, 'Предательница мертва', 'Предатель мёртв' )], но Нахашин по-прежнему остаётся под сапогом Орлея."
 dataw_ciriane_rebellion.4155.a: "Нахашин наверняка прольёт ещё немало крови."
 dataw_ciriane_rebellion.4155.a.b: "Ты станешь нашим Мафератом, [Select_CString(ROOT.Char.IsFemale, 'Предательница', 'Предатель' )]."

# Follow the White Rabbit
 dataw_ciriane_rebellion.4156.t: "Следуй за белым кроликом"
 dataw_ciriane_rebellion.4156.desc: "#color_goldy_yellow #italic Добычу так легко потерять — словно замеченного на охоте кролика.#!#!\n\nЧаще всего люди либо бьют сразу, боясь упустить зверя, либо бесшумно идут следом в надежде получить не одну добычу, а сразу несколько. В моём случае оба пути могут привести к одному исходу, но выбор всё равно предстоит сделать.\n\nНедавно мне стало известно, что [scheme_agent.GetName] состоит в отвратительной шайке радикалов, называющей себя «Скрывающиеся среди Болот». Они устраивают диверсии по всему Нахашину, прикрываясь борьбой за его освобождение. Время стремительно уходит, и действовать нужно прежде, чем [scheme_agent.GetName] узнает о моём открытии. Можно немедленно схватить [Select_CString(scheme_agent.IsFemale, 'её', 'его' )] и начать допрос — нет, пытку, — чтобы выведать всё известное. Или же бесшумно проследить до места встречи и там уничтожить их всех.\n\n#N Как бы то ни было, решать мне.#!"
 dataw_ciriane_rebellion.4156.a: "Пытать [Select_CString(scheme_agent.IsFemale, 'её', 'его' )]. Я хочу узнать всё любой ценой."
 dataw_ciriane_rebellion.4156.a_a_tt: "[scheme_agent.GetFirstName] ломается под давлением."
 dataw_ciriane_rebellion.4156.a_b_tt: "[scheme_agent.GetFirstName] несправедливо погибает от пыток, не раскрыв никакой информации."
 dataw_ciriane_rebellion.4156.b_b_tt: "Вам не удаётся найти тайное убежище. [scheme_agent.GetFirstName] исчезает, а вы отпустили [Select_CString(scheme_agent.IsFemale, 'её', 'его' )], тем самым доказав [Select_CString(scheme_agent.IsFemale, 'её невиновность', 'его невиновность' )]."
 dataw_ciriane_rebellion.4156.b: "Тихо проследить за [Select_CString(scheme_agent.IsFemale, 'ней', 'ним' )], чтобы узнать место их встреч."
 dataw_ciriane_rebellion.4156.b_c_tt: "[scheme_agent.GetFirstName] освобождается, а вы теряете доказательства для ареста."
 dataw_ciriane_rebellion.4156.c: "Слишком опасно. Не стоит."
 dataw_ciriane_rebellion.4156.a_c_tt: "Вы находите тайное убежище «Скрывающихся среди Болот»."
# The Hidden Nest
 dataw_ciriane_rebellion.4157.t: "Скрытое гнездо"
 dataw_ciriane_rebellion.4157.desc: "Благодаря сведениям, добытым у нашего милого добровольно-принудительного осведомителя, мы стоим посреди болот перед древним строением, словно забытым временем. Несомненно, это логово «Скрывающихся среди Болот» — или хотя бы место, разгром которого позволит уничтожить отвратительную шайку. Чтобы не выдать себя раньше времени, я [Select_CString(ROOT.Char.IsFemale, 'взяла', 'взял' )] лишь небольшой отряд.\n\nПосле совещания с несколькими советниками остаётся два пути.\n\n#N Можно обрушиться на врага всей мощью и застать его врасплох, не дав опомниться, или медленно и методично окружить здание, а затем ворваться со всех сторон, перекрыв пути к бегству.#!"
 dataw_ciriane_rebellion.4157.a: "Ударим изо всех сил, не дав им времени организовать оборону!"
 dataw_ciriane_rebellion.4157.b: "Окружим здание и атакуем со всех сторон."
 dataw_ciriane_rebellion.4157.a.a_tt: "Будет схвачено до 5 агентов, если их окажется достаточно."
 dataw_ciriane_rebellion.4157.a.b_tt: "Все возможные агенты сбегут."
 dataw_ciriane_rebellion.4157.a.d_tt: "[agent.GetFirstName] сотрудничает со #N Скрывающимися среди Болот#!"

# Hidden No More (Nahashin)
 dataw_ciriane_rebellion.4158.t: "Больше не скрыты"
 dataw_ciriane_rebellion.4158.desc: "Свершилось.\n\nЯ вхожу в логово заговорщиков, среди груды тел. Многие арестованы, а немногим удалось бежать, но оставшихся слишком мало, чтобы продолжать прежние козни.\n\nНаконец бессмысленное кровопролитие прекратится. Участники похода уже начали называть меня [GetPlayer.GetNickname]."
 dataw_ciriane_rebellion.4158.a: "Больше им не скрыться."
 dataw_ciriane_rebellion.4158.a_tt: "#N «Скрывающиеся среди Болот» уничтожены. Вы стали на шаг ближе к сокрушению цириан и предотвращению восстания после начала войны за Долы.#!"

# Retribution Against the Hidden 
 dataw_ciriane_rebellion.4159.t: "Возмездие Скрывающимся"
 dataw_ciriane_rebellion.4159.desc: "Посреди ночи меня будит оглушительный шум. Кто бы ни ворвался в мой дом с такой жестокостью, это наверняка враг, и доносящиеся крики и лязг оружия подтверждают догадку: эти люди не поддерживают освобождение Нахашина.\n\nВыглянув из-за двери, я вижу форму, которой так [Select_CString(ROOT.Char.IsFemale, 'боялась', 'боялся' )]: это солдаты [nahashin.GetTitleAsNameNoTooltip] Нахашина. Их командир требует прорываться дальше и найти заговорщика, пока не поздно.\n\nСкоро они доберутся до меня. Осталось лишь несколько минут, прежде чем солдаты ворвутся в дом и убьют или, что ещё хуже, схватят меня.\n\n#N Нужно потратить эти минуты с пользой.#!"
 dataw_ciriane_rebellion.4159.a: "Можно выбраться через окно и бежать."
 dataw_ciriane_rebellion.4159.b: "Можно спрятаться и надеяться, что меня не найдут."
 dataw_ciriane_rebellion.4159.c: "Я погибну в бою! За свободный Нахашин!"
 dataw_ciriane_rebellion.4159.d: "[Select_CString(ROOT.Char.IsFemale, 'Живой', 'Живым' )] им меня не взять."
 dataw_ciriane_rebellion.4159.e: "Я сдаюсь! Отведите меня к [nahashin.GetTitleAsNameNoTooltip]."
 dataw_ciriane_rebellion.4159.a_tt: "#N «Скрывающиеся среди Болот» уничтожены. Вы стали на шаг ближе к сокрушению цириан и предотвращению восстания после начала войны за Долы.#!"
 dataw_ciriane_rebellion.4159.a.s_tt: "Вам удаётся сбежать."
 dataw_ciriane_rebellion.4159.a.f_tt: "Во время побега вас останавливают и берут в плен."
 dataw_ciriane_rebellion.4159.a.b_tt: "Вы погибаете в бою."
 dataw_ciriane_rebellion.4159.a.ss_tt: "До прихода солдат вы закалываете себя насмерть."
 dataw_ciriane_rebellion.4159.a.fs_tt: "Вас останавливают прежде, чем вы успеваете это сделать."
 dataw_ciriane_rebellion.4159.a.t_tt: "Вы сдаётесь персонажу [nahashin.GetFirstName]."

# Hidden No More (Plotter/vassals)
 dataw_ciriane_rebellion.4160.t: "Больше не скрыты"
 dataw_ciriane_rebellion.4160.desc: "Странно.\n\nОтветы на мои письма должны были прийти уже давно, однако никаких вестей нет. Я хожу кругами, размышляя о случившемся и перебирая сотни возможных объяснений.\n\nНаконец до меня доходит вывод, который разум миллион раз отказывался принять.\n\n#N «Скрывающиеся среди Болот больше не скрыты».#!\n\nЧто бы ни произошло, вскоре я узнаю всё благодаря щедрости персонажа [nahashin.GetName]. Но одно ясно уже сейчас."
 dataw_ciriane_rebellion.4160.a.desc: "\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'была', 'был' )] там, когда [nahashin.GetTitleAsNameNoTooltip] [Select_CString(nahashin.IsFemale, 'вошла', 'вошёл' )] со своими войсками. Я [Select_CString(ROOT.Char.IsFemale, 'видела', 'видел' )] короткую, но решающую резню, после которой меня заковали в цепи и доставили к дорогому персонажу [nahashin.GetName] как доказательство моей вины.\n\n#N Я [Select_CString(ROOT.Char.IsFemale, 'состояла', 'состоял' )] в этой группе; вместе с соратниками мы готовили диверсии и боролись за независимость от Вал Руайо.#!"
 dataw_ciriane_rebellion.4160.a: "Больше нам не скрыться."

# Cornered in the Swamp
 dataw_ciriane_rebellion.4161.t: "Загнанные в болотах"
 dataw_ciriane_rebellion.4161.desc: "В этом древнем забытом здании мы с другими заговорщиками собрались, чтобы продумать следующий удар против Орлея и его прислужников. Мы встречаемся здесь, невзирая на опасность, и ищем новый путь борьбы с сильным врагом, который всегда рядом.\n\nВнезапно снаружи раздаётся едва слышный шаг. Я успеваю лишь выглянуть и понять, насколько близко подобрался враг.\n\n"
 dataw_ciriane_rebellion.4161.a.h.desc: "Прежде чем я успеваю осознать происходящее, дверь содрогается от тяжёлого удара. Через проёмы влетают стрелы, убивая нескольких заговорщиков. Доски разлетаются в щепки, льётся кровь."
 dataw_ciriane_rebellion.4161.a.e.desc: "Я бросаю взгляд в ближайшее окно, желая лучше рассмотреть происходящее снаружи, и едва уклоняюсь от влетевшей стрелы. Но краткого взгляда достаточно: солдаты окружили здание и уже врываются внутрь."
 dataw_ciriane_rebellion.4161.b.desc: "\n\nОсталось несколько мгновений до того, как ворвутся войска [nahashin.GetTitleAsNameNoTooltip], и эти драгоценные секунды нужно потратить на решение. Моя судьба никогда ещё не была столь неопределённой, но одно несомненно.\n\n#N Сегодня наступит последний день «Скрывающихся среди Болот».#!"
 dataw_ciriane_rebellion.4161.a: "Выйти и сдаться. Мы проиграли."
 dataw_ciriane_rebellion.4161.b: "Здесь должен быть тайный ход! Быстрее!"
 dataw_ciriane_rebellion.4161.c: "Я буду сражаться до конца. Выжить не надеюсь, но не отступлю."
 dataw_ciriane_rebellion.4161.d: "Я умру с надеждой на свободный Нахашин."

# The Broken Chains of Subjugation (Nahashin)
 dataw_ciriane_rebellion.4162.t: "Разбитые цепи подчинения"
 dataw_ciriane_rebellion.4162.desc: "Вопреки желаниям державы [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier] Болота теперь свободны. Нахашин освободился от власти Орлея, и им вновь правит собственный народ без чужого сюзерена. Неоспоримое доказательство лежит передо мной на столе.\n\nВозможно, чтобы сильнее уязвить меня, письмо впервые написали не на старом языке народа [GetGlobalVariable('ciriane_culture_var').Culture.GetName], а на обычном языке народа [GetGlobalVariable('orlesian_culture_var').Culture.GetName]. В нём сказано:\n\n#italic «Скрывающиеся среди Болот приветствуют вас в последний раз, [GetPlayer.GetFirstName]. Нахашин свободен, а значит, наша вражда с вами окончена. Мы распускаем общество, ибо наша цель достигнута, и больше никогда не станем причинять вам беды.\n\nВедите свой народ мудро, а мы в эту новую эпоху наших болот поведём его прочь от Орлея».#!"
 dataw_ciriane_rebellion.4162.a: "«Полюбуйся совершенством, пока оно не исчезло», заговорщик."
 dataw_ciriane_rebellion.4162.a_tt: "#N «Скрывающиеся среди Болот» распущены.#!"

# The Broken Chains of Subjugation (Vassal/plotter)
 dataw_ciriane_rebellion.4163.t: "Разбитые цепи подчинения"
 dataw_ciriane_rebellion.4163.desc: "Вопреки желаниям державы [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier] Болота теперь свободны. Нахашин освободился от власти Орлея, и теперь нами правит собственный народ. Над нами больше нет чужого сюзерена, который указывает, что носить, кому платить и за кого умирать.\n\nЛучшим доказательством достижения служит письмо на моём столе.\n\n#italic «Приветствую вас, Скрывающиеся среди Болот.\n\nВ последний раз обращаюсь к вам этим именем: наша цель достигнута, и теперь мы можем править собой без указов Вал Руайо. Возблагодарим Сомисариан за нашу победу. Теперь, когда общество распущено, присоединитесь ли вы к нашей древней вере?»#!"
 dataw_ciriane_rebellion.4163.a: "Наконец я открою, в кого верю на самом деле! Хвала Царице Солнца и Луны!"
 dataw_ciriane_rebellion.4163.b: "Я буду почитать Царицу Солнца и Луны превыше Андрасте и её Создателя."
 dataw_ciriane_rebellion.4163.c: "Я [Select_CString(ROOT.Char.IsFemale, 'желала', 'желал' )] независимости ради народа Нахашина, но моя вера остаётся непоколебимой."

### Siding with Orlais: Destroy/Culling The Tribes
 dataw_ciriane_rebellion.4200.t: "Племена, которые предстоит сломить"
 dataw_ciriane_rebellion.4200.zero.desc: "Племена, следующие старым цирианским обычаям, ясно показали свою ненависть ко мне и моей верности Орлею. Они скрываются повсюду и понемногу настраивают подданных против меня, надеясь собрать войско против Нахашина.\n\n#N Значит, я нанесу удар [Select_CString(ROOT.Char.IsFemale, 'первой', 'первым' )].#!\n\nМои военачальники подготовили три плана. В случае успеха они позволят выследить скрытые племена и вывести их на свет. Действовать предлагается постепенно, сосредоточившись на одной области за раз, чтобы ни одно племя не ускользнуло и ни один язычник не избежал обращения. Мне останется лишь сохранять крепкую власть над областью: слабый контроль наверняка позволит последователям Сомисариан легко скрыться."
 dataw_ciriane_rebellion.4200.one.desc: "Первая операция увенчалась успехом. Похоже, племена теперь боятся возвращаться в эти земли, опасаясь доносов.\n\n#N Но работа ещё не окончена.#!\n\nСтаринные племена по-прежнему влияют на эти края и действуют против меня. Следует привести в исполнение следующий план, искоренить их влияние и уничтожить племена раз и навсегда."
 dataw_ciriane_rebellion.4200.two.desc: "Уже дважды мне удалось сокрушить племена настолько жестоко, что теперь одна мысль о возвращении на место мучений внушает им ужас.\n\nПора начать заключительную часть замысла: уничтожить неверующих и наконец принести свет Андрасте всем жителям болот.\n\n#N Пришло время довести дело до конца.#!"
 dataw_ciriane_rebellion.4200.a: "Мы ударим на севере, в землях Эйдолона."
 dataw_ciriane_rebellion.4200.b: "Мы ударим на западе, в землях Клаоз у Тирашана и Серо."
 dataw_ciriane_rebellion.4200.c: "Мы ударим на востоке, в землях Энара."
 dataw_ciriane_rebellion.4200.d: "Ударить везде одновременно! Чем скорее мы от них избавимся, тем лучше."

# The crushed remnants. (Successfully convert a county)
 dataw_ciriane_rebellion.4201.t: "Сокрушённые остатки"
 dataw_ciriane_rebellion.4201.desc: "С каждым днём солдаты арестовывают всё меньше неверующих и получают всё больше ложных доносов.\n\nКто-то может счесть это дурной вестью, но лишь глупцы не понимают истины.\n\nНарод перешёл на мою сторону и в своём рвении донёс о большем числе соплеменников, чем солдаты когда-либо сумели бы найти сами.\n\nТеперь цириане ушли на иные земли, испугавшись враждебности и фанатизма жителей. Они понесут своё учение в другие части болот.\n\n#N Мало-помалу их власть над Нахашином слабеет.#!"
 dataw_ciriane_rebellion.4201.a: "Скоро не останется ни одного."
 dataw_ciriane_rebellion.4201.a.b: "Теперь не осталось ни одного."
 dataw_ciriane_rebellion.4201_a_tt: "#G Вы успешно истребили племена во владениях [GetTitleByKey('c_eudolon').GetBaseNameNoTier], [GetTitleByKey('c_claose').GetBaseNameNoTier] и [GetTitleByKey('c_val_henar').GetBaseNameNoTier]#!."
 dataw_ciriane_rebellion.4201_b_tt: "#G Вы успешно истребили племя во владении [title.GetBaseName]#!"
# The past’s revolt.. (Successfully convert a county)
 dataw_ciriane_rebellion.4202.t: "Восстание прошлого"
 dataw_ciriane_rebellion.4202.desc: "Несмотря на все усилия, я [Select_CString(ROOT.Char.IsFemale, 'потерпела', 'потерпел' )] неудачу.\n\nСолдаты прочёсывали земли, врывались в дома, допрашивали соседей и арестовывали друзей, вызывая гнев народа. Жрецы силой обращали женщин и детей и заслужили ненависть тех, кому удалось ускользнуть. Ненависть росла, моя власть слабела, пока наконец те, кого я [Select_CString(ROOT.Char.IsFemale, 'хотела', 'хотел' )] уничтожить, не подняли восстание.\n\nСокрушить крестьянское войско будет легко, но оно стало символом моей неудачи и слабеющей власти над герцогством Нахашин.\n\n#N Если я не возобновлю замысел, вскоре случится худшее.#!"
 dataw_ciriane_rebellion.4202.a: "Будь всё проклято!"
 dataw_ciriane_rebellion.4202_a_tt: "#X Вам не удалось истребить племена во владениях [GetTitleByKey('c_eudolon').GetBaseNameNoTier], [GetTitleByKey('c_claose').GetBaseNameNoTier] и [GetTitleByKey('c_val_henar').GetBaseNameNoTier]#!."
 dataw_ciriane_rebellion.4202_b_tt: "#X Вам не удалось истребить племя во владении [title.GetBaseName]#!"
# Last of the Ciriane
 dataw_ciriane_rebellion.4203.t: "[Select_CString(leader.IsFemale, 'Последняя из цириан', 'Последний из цириан' )]"
 dataw_ciriane_rebellion.4203.desc: "Прошло уже несколько недель с тех пор, как последний донос от народа оказался полезным. Ложные сообщения о злобных болотных дикарях стали обычным делом, и теперь благодаря стоящему передо мной пленнику я понимаю почему.\n\n[Select_CString(leader.IsFemale, 'Передо мной женщина', 'Передо мной мужчина' )] по имени [leader.GetFirstName], [Select_CString(leader.IsFemale, 'которая уже много месяцев скрывается', 'который уже много месяцев скрывается' )] в лесу.\n\nВ одиночестве [leader.GetName] [Select_CString(leader.IsFemale, 'была вынуждена питаться', 'был вынужден питаться' )] всем, что удавалось найти на болотах, избегая разбойников, солдат и диких зверей. [leader.GetName] даже рассказывает, как в Тирашане [Select_CString(leader.IsFemale, 'её', 'его' )] нашли эльфы и пришлось возвращаться под градом летевших вслед стрел.\n\nВ рассказах ни разу не упоминается другой член племени персонажа [leader.GetFirstName], словно этот безумный бесконечный побег ради спасения жизни [Select_CString(leader.IsFemale, 'она совершала', 'он совершал' )] в полном одиночестве. Когда я спрашиваю об остальных соплеменниках, [leader.GetName] отвечает, что всё племя давно погибло. Несмотря на отчаянные поиски, [Select_CString(leader.IsFemale, 'она уже много лет не встречала', 'он уже много лет не встречал' )] других племён.\n\nПохоже, передо мной [Select_CString(leader.IsFemale, 'последняя представительница', 'последний представитель' )] цирианского племени."
 dataw_ciriane_rebellion.4203_tt: "#G Вы выполнили один из шагов, необходимых для ослабления Восстания цириан после начала войны за Долы. Даже если не все решения и события завершены, восстание всё равно будет слабее.#!"
 dataw_ciriane_rebellion.4203.a: "Я позабочусь об этом человеке при своём дворе."
 dataw_ciriane_rebellion.4203.b: "Отпустить [Select_CString(leader.IsFemale, 'её', 'его' )]. Цириане достаточно настрадались."
 dataw_ciriane_rebellion.4203.c: "Избавиться от последнего остатка этого проклятого народа."

## King of the Marshes/Expanding Ciriane Kingdom
# King of the Marshes/Coronation
 dataw_ciriane_rebellion.4250.t: "[nahashin.GetTitleAsNameNoTooltip|U] Болот"
 dataw_ciriane_rebellion.4250.desc: "#X Свершилось.#! Жителям болот Нахашина больше не придётся страдать под властью народа [GetGlobalVariable('orlesian_culture_var').Culture.GetName]. Впервые за долгие годы мы по-настоящему свободны и объединены под единым знаменем. Многие погибли в войне, но теперь становится ясно, что жертвы были не напрасны.\n\nМой народ собирается у крепости, ожидая моего появления на церемонии. Бесчисленные ночи прошли без сна и в сомнениях, правильно ли я поступаю. В залах гремит страстный ритм барабанов, вызывая на моём лице радостную улыбку. Столь великие дни выпадают редко, и я буду наслаждаться этим мгновением до конца жизни.\n\nНаконец я выхожу за стены владения и приветствую всех, кто пришёл стать свидетелем моей славной коронации. Пышная церемония перехода к законной власти дарит нам всем, включая меня, глубокое чувство единства. Отныне все мы братья и сёстры Нахашина, а я поведу их за собой как [Select_CString(ROOT.Char.IsFemale, 'новая королева', 'новый король' )].\n\n#N С Короной Болот на голове я поворачиваюсь к ликующей толпе.#!"
 dataw_ciriane_rebellion.4250_tt: "#G После вашей коронации Восстание цириан завершится, но история народа продолжится. Вы откроете новые решения и события, позволяющие возродить Цирианское королевство.#!"
 dataw_ciriane_rebellion.4250.a: "Наконец я [Select_CString(ROOT.Char.IsFemale, 'стала', 'стал' )] [nahashin.GetTitleAsNameNoTooltip]."

## King of the Marshes/Expanding Kingdom
# The Demands of Archambon
 dataw_ciriane_rebellion.4251.t: "Требования Аршамбона"
 dataw_ciriane_rebellion.4251.desc: "[nahashin.GetName] присылает письмо под видом предложения, но за словами легко почувствовать истинное намерение.\n\nВитиевато описав долгую историю и тесные узы между нашими народами, [nahashin.GetName] утверждает, будто мои подданные жаждут, чтобы [Select_CString(nahashin.IsFemale, 'она возглавила', 'он возглавил' )] их вместе со своим якобы единым народом [GetGlobalVariable('ciriane_culture_var').Culture.GetName]. В конце содержится предложение: принести клятву верности персонажу [nahashin.GetFirstName] и получить защиту под [Select_CString(nahashin.IsFemale, 'её', 'его' )] покровительством.\n\nПисьмо называет это выбором, но отказ явно не встретит понимания в державе [nahashin.GetPrimaryTitle.GetBaseNameNoTier], и [nahashin.GetFirstName], несомненно, тоже это знает.\n\n#N Я взвешиваю лежащие передо мной возможности. От ответа зависит очень многое.#!"
 dataw_ciriane_rebellion.4251.a: "Склонить голову перед персонажем [nahashin.GetFirstName]. Риск слишком велик…"
 dataw_ciriane_rebellion.4251.b: "Сжечь письмо. Моё молчание скажет персонажу [nahashin.GetFirstName] всё, что [Select_CString(nahashin.IsFemale, 'ей', 'ему' )] нужно знать."
 dataw_ciriane_rebellion.4251.b_tt: "Персонаж [nahashin.GetFirstName] получит обоснованную претензию на все ваши земли"

## King of the Marshes/Expanding Ciriane Kingdom
# The Marquisate Accedes
 dataw_ciriane_rebellion.4252.t: "[vassal.GetTitleAsNameNoTooltip|U] [Select_CString(vassal.IsFemale, 'согласилась', 'согласился' )]"
 dataw_ciriane_rebellion.4252.desc: "Читая лежащее передо мной письмо, я невольно улыбаюсь. [vassal.GetName] [Select_CString(vassal.IsFemale, 'приняла', 'принял' )] мои требования и [Select_CString(vassal.IsFemale, 'поклялась', 'поклялся' )] в вечной верности Нахашину.\n\nМне удалось без кровопролития объединить ещё одну часть нахашинских земель — великая победа, достойная празднования.\n\n#N А пока следует начать приготовления к принесению клятвы верности.#!"
 dataw_ciriane_rebellion.4252.a_tt: "#G [vassal.GetName] принесёт вам клятву верности#!"
 dataw_ciriane_rebellion.4252.a: "Будем надеяться, что за первой павшей костяшкой домино вскоре последуют остальные."

## King of the Marshes/Expanding Ciriane Kingdom
# The Marquisate Resists
 dataw_ciriane_rebellion.4253.t: "[vassal.GetTitleAsNameNoTooltip|U] сопротивляется"
 dataw_ciriane_rebellion.4253.desc: "Дни идут, а письмо от персонажа [vassal.GetName] так и не приходит, и моё лицо всё сильнее мрачнеет. Становится совершенно ясно: [vassal.GetFirstName] [Select_CString(vassal.IsFemale, 'решила', 'решил' )] проигнорировать и моё письмо, и мою угрозу.\n\n#X У меня почти не остаётся выбора.#!\n\nПравитель, который не исполняет обещаний, не заслуживает своего титула. Мне бросили вызов. Я [Select_CString(ROOT.Char.IsFemale, 'предпочла', 'предпочёл' )] бы объединить земли, лежащие в тени Орлея, без лишнего кровопролития, но порой иного пути нет."
 dataw_ciriane_rebellion.4253.a: "Пора исполнить обещание."

## King of the Marshes/Expanding Ciriane Kingdom
# Our Flank Secured
 dataw_ciriane_rebellion.4254.t: "Наш фланг обеспечен"
 dataw_ciriane_rebellion.4254.desc: "Наконец земли державы [GetTitleByKey('k_serault').GetBaseNameNoTier] перешли под мою власть, впервые за несколько десятилетий объединив болотный народ [GetGlobalVariable('ciriane_culture_var').Culture.GetName]. Теперь, когда мой тыл защищён, можно обратить взор к Орлею и вернуть земли, некогда принадлежавшие нам.\n\n#N Но прежде нужно восстановить порядок и веру в этих далёких краях. Иначе разве смею я называть себя [Select_CString(ROOT.Char.IsFemale, 'правительницей, заботящейся', 'правителем, заботящимся' )] о своём народе?#!"
 dataw_ciriane_rebellion.4254.a: "За единство цириан."

## Reforming the Ciriane Religion
# An Old Faith for the Modern Times
 dataw_ciriane_rebellion.4255.t: "Старая вера для новой эпохи"
 dataw_ciriane_rebellion.4255.desc: "Теперь, когда наша независимость обеспечена, пора задуматься о будущем Болот — и прежде всего о вере и религии.\n\nОрлей гордо провозгласил себя центром андрастианства, а мы отвергли его власть, обратившись к древней вере. Однако многие считают, что старые верования следует упорядочить и подготовить к испытаниям новой эпохи.\n\n#N Я правлю недавно освободившимся Нахашином как [GetPlayer.GetTitleAsNameNoTooltip|U], и мне решать, стоит ли прилагать усилия к упорядочению древней веры и удастся ли при этом избежать гнева народа, чьи верования я собираюсь преобразить.#!"
 dataw_ciriane_rebellion.4255.a: "Новой эпохе — новая вера!"
 dataw_ciriane_rebellion.4255.a_tt: "Народ будет ждать от вас наставлений, пока вы заново формируете его верования. Будьте осторожны: если ваши идеи реформы не приживутся среди населения, последствия окажутся тяжёлыми."

## The Chantry Connection
 dataw_ciriane_rebellion.4256.t: "Связь с Церковью"
 dataw_ciriane_rebellion.4256.desc: "Ступив на путь религиозной реформы, мне необходимо определить место Андрасте рядом с нашей Царицей Солнца и Луны — #X Сомисариан.#! В стародавние времена Андрасте была лишь далёкой мыслью в разуме своей матери, но теперь андрастианство обрело слишком большое влияние, чтобы игнорировать события у его истоков, потрясшие историю Тедаса и сокрушившие мощь Империи.\n\nКо двору уже съезжаются учёные со всей державы, обсуждая тонкости будущего преобразования веры. Двое особенно часто спорят о связи между нашей религией и Андрасте. [scholar_one.GetFirstName] считает, что Андрасте не следует полностью отвергать: так переходный период пройдёт легче, а будущие дипломатические отношения будет проще поддерживать. По мнению персонажа [scholar_two.GetFirstName], Андрасте следует считать всего лишь смертной женщиной, совершившей великие деяния, но никогда не связанной с божественным существом, ведь Создателя не существует.\n\n#N Как бы то ни было, оба мнения мне известны, пусть даже высказаны не напрямую, и каждое может послужить источником вдохновения.#!"
 dataw_ciriane_rebellion.4256.a: "Не стоит отвергать Андрасте и её учение — их следует включить в наши верования!"
 dataw_ciriane_rebellion.4256.a_tt: "Народ будет ждать от вас наставлений, пока вы заново формируете его верования. Будьте осторожны: если ваши идеи реформы не приживутся среди населения, последствия окажутся тяжёлыми."
 dataw_ciriane_rebellion.4256.a.a_tt: "Доступно только для конфессии [GetFaithByKey('ciriane_maker_cult').GetAdjective]"
 dataw_ciriane_rebellion.4256.a.b_tt: "Доступно только для конфессии [GetFaithByKey('ciriane_paganism').GetAdjective]"
 dataw_ciriane_rebellion.4256.b: "Андрасте — лишь историческая личность, а её связь с Создателем попросту выдумана."
 dataw_ciriane_rebellion.4256.b_tt: "Ваша верность древним обычаям радует простолюдинов."
 dataw_ciriane_rebellion.4256.c: "Нет нужды занимать столь резкую позицию. Мы можем утвердить собственные взгляды, не пороча чужие."

# The preparation for the new faith
 dataw_ciriane_rebellion.4257.t: "Подготовка новой веры"
 dataw_ciriane_rebellion.4257.desc: "Высказались и народ, и учёные. Споры были долгими: одни предлагали нелепости, другие — куда более разумные идеи, но окончательный вердикт предстоит вынести мне.\n\n#X И всё же одно совершенно ясно.#!\n\nЕсли народ не примет эту веру как свою и слишком крепко уцепится за прежние верования, мою попытку сочтут не реформой, а извращением. Но если отказаться от задуманного, люди разгневаются из-за подаренной им ложной надежды."
 dataw_ciriane_rebellion.4257.a: "Новой эпохе — новая вера!"
 dataw_ciriane_rebellion.4257.a_tt: "Вы получили скидку #P 50 %#! на реформирование конфессии [GetFaithByKey('ciriane_paganism').GetAdjective]. Если спустя 10 лет после реформы большинство знатных вассалов или графств не примет новую веру, последствия окажутся тяжёлыми…"

# The Renewed will of Somisarian
 dataw_ciriane_rebellion.4258.t: "Обновлённая воля Сомисариан"
 dataw_ciriane_rebellion.4258.desc: "Вера преобразована: теперь у неё есть упорядоченные правила, которым надлежит следовать, и боги, которым надлежит служить.\n\n"
 dataw_ciriane_rebellion.4258.a.desc: "Решение признать Андрасте истинной пророчицей мудрости наравне с древними богами, несомненно, вызвало споры, но в долгосрочной перспективе оно обязательно пойдёт на пользу нашей дипломатии."
 dataw_ciriane_rebellion.4258.b.desc: "Теперь начинается погоня за одобрением народа. Если люди станут тосковать по прежним верованиям до того, как новая вера по-настоящему укоренится на Болотах, меня сочтут [Select_CString(ROOT.Char.IsFemale, 'предательницей и осквернительницей', 'предателем и осквернителем' )] и поступят соответственно."
 dataw_ciriane_rebellion.4258.a_tt: "У вас будет #G 10 лет#!, чтобы обратить в организованную веру большинство вассалов или большинство графств. В случае неудачи жители королевства заклеймят вас как [Select_CString(ROOT.Char.IsFemale, 'предательницу', 'предателя' )] веры за попытку извратить их убеждения и поднимут восстание!"
 dataw_ciriane_rebellion.4258.a: "Будем молиться, чтобы до этого не дошло."

# The People's Faith
 dataw_ciriane_rebellion.4259.t: "Вера народа"
 dataw_ciriane_rebellion.4259.s.desc: "Несмотря на некоторое сопротивление, усилия последнего десятилетия, похоже, принесли плоды. Всё больше людей утверждают, что почитают цирианских богов согласно нашим установлениям, и всё реже звучат жалобы на то, будто мы извратили их веру.\n\nНовый религиозный порядок прочно утвердился как преемник древней веры и готов вести наш народ в новую эпоху — не связанную с Орлеем и направляемую лишь нашей волей, где мы сами выбираем союзников, войны и законы."
 dataw_ciriane_rebellion.4259.f.desc: "#X Это провал.#!\n\nНесмотря на усилия последнего десятилетия, наши слова остались неуслышанными. На каждого обращённого нашлось двое отказавшихся принять новые обычаи. Теперь настал час, когда они обвиняют нас в извращении своей веры.\n\nНарод заклеймил меня как [Select_CString(ROOT.Char.IsFemale, 'предательницу', 'предателя' )], а знать, которую я [Select_CString(ROOT.Char.IsFemale, 'считала', 'считал' )] своей союзницей, отвернулась от учения новой веры и встала на сторону простых людей. Теперь все они требуют, чтобы я [Select_CString(ROOT.Char.IsFemale, 'отреклась', 'отрёкся' )] от престола и [Select_CString(ROOT.Char.IsFemale, 'уступила', 'уступил' )] его другому."
 dataw_ciriane_rebellion.4259.a.s: "Слава богам, слава Нахашину и слава нашему народу!"
 dataw_ciriane_rebellion.4259.a.f: "Проклятье! Они отвергли будущее нашей веры!"

# The Crossroads of The Past and Future/Ciriane Question event chain
 dataw_ciriane_rebellion.4260.t: "На перекрёстке прошлого и будущего"
 dataw_ciriane_rebellion.4260.desc: "Мы, марешуа, прошли долгий путь со времени восстания против Орлея. Мы вернули себе родную землю, вернули свою веру и создали империю, способную бросить вызов державе [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier] — оплоту андрастианства.\n\nИ всё же я никогда не [Select_CString(ROOT.Char.IsFemale, 'предполагала', 'предполагал' )], что произойдёт подобное.\n\nСегодня мой двор посетил человек по имени [ciriane.GetFirstName] и сделал мне необычное предложение. От имени всех племён, незримо странствующих по моим землям, [Select_CString(ciriane.IsFemale, 'она предлагает', 'он предлагает' )] мне вернуться к древним обычаям. Мы с моей семьёй вновь и вновь доказывали, что стоим за Нахашин и народ [GetGlobalVariable('ciriane_culture_var').Culture.GetName], что мы верны Сомисариан. Поэтому теперь племена предлагают принять меня в свои ряды и открыть миру культуру, которую они сохраняли всеми силами.\n\n[mareschois.GetFirstName] возражает: #italic «Приняв обычаи цирианских племён, вы отвернётесь от будущего, которое построили для марешуа! Вы присоединитесь к племенам, которые и правда вернули нам древнюю веру. Но мы превзошли их уклад! Мы переросли прошлое, которым они так дорожат и которое никогда не оставят! Нам больше не нужно внимать их словам, ведь мы способны создать собственную легенду — не ту, что цепляется за цириан, а ту, к которой сами потянутся люди!»#!"
 dataw_ciriane_rebellion.4260.a: "[Select_CString(mareschois.IsFemale, 'Ты права', 'Ты прав' )]. Мы проложим собственный путь — путь империи будущего, а не прошлого!"
 dataw_ciriane_rebellion.4260.b: "Нет. Моей целью было возвращение к древним обычаям, и я их приму."

# An Empire for us all.
 dataw_ciriane_rebellion.4261.t: "Империя для всех нас"
 dataw_ciriane_rebellion.4261.desc: "Последние несколько дней меня терзают сомнения: правильным ли было моё решение? Стоило ли принять их предложение? Что случилось бы, отвергни я совет персонажа [mareschois.GetFirstName]? Сегодня мне предстоит посетить устроенный в мою честь праздник, но мысли всё ещё поглощены сомнениями.\n\n#N Но стоит мне выйти наружу, как все они исчезают.#!\n\nПовсюду я вижу свой народ: люди гордятся обычаями, без страха говорят на родном языке и свободно следуют Древнему Пути. Но никто не говорит о прошлом. Никто не вспоминает времена владычества народа [GetGlobalVariable('orlesian_culture_var').Culture.GetName], никто не говорит о своей вере как о давно утраченном учении, наконец обретённом вновь. Никто не называет мою империю продолжением прежнего уклада нашего народа.\n\n#G Все говорят о будущем.#!\n\nТеперь я понимаю, что выбор был правильным: наследие прошлого удалось привести в современный мир. Тоска по минувшему привела нас к этому мгновению, но среди толпы, скандирующей моё имя, я вижу: мы не позволили себе стать его рабами.\n\n#X Мы — не прошлое.#!"
 dataw_ciriane_rebellion.4261.a: "Мы — будущее Нахашина, нет, всей империи!"

# An Empire for us all.
 dataw_ciriane_rebellion.4262.t: "Возвращение древних обычаев"
 dataw_ciriane_rebellion.4262.desc: "Сразу после того, как я [Select_CString(ROOT.Char.IsFemale, 'приняла', 'принял' )] предложение, меня под неодобрительным взглядом персонажа [mareschois.GetFirstName] повели в самое сердце Нахашина, чтобы я хотя бы несколько дней [Select_CString(ROOT.Char.IsFemale, 'прожила', 'прожил' )] среди племён.\n\nВсе эти дни меня подвергали всевозможным испытаниям и не давали ни минуты покоя. История, древний уклад правления, обычаи и давно забытые боевые приёмы… Даже сон не приносил отдыха: наставники продолжали учить меня и у постели.\n\nВ конце концов я [Select_CString(ROOT.Char.IsFemale, 'села', 'сел' )] перед вождями древних племён, впервые за многие века собравшимися вместе, и [Select_CString(ROOT.Char.IsFemale, 'поведала', 'поведал' )] им всё, чему они меня научили. Я [Select_CString(ROOT.Char.IsFemale, 'описала', 'описал' )] их правление, речь и отношения друг с другом, [Select_CString(ROOT.Char.IsFemale, 'показала', 'показал' )] всё, что [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог' )], и [Select_CString(ROOT.Char.IsFemale, 'объяснила', 'объяснил' )] всё, что [Select_CString(ROOT.Char.IsFemale, 'знала', 'знал' )].\n\nНаконец один из вождей поднялся в шатре и произнёс: #italic «Мы решили, что ты знаешь всё необходимое. Отныне ты — [Select_CString(ROOT.Char.IsFemale, 'одна из нас', 'один из нас' )], ибо [Select_CString(ROOT.Char.IsFemale, 'доказала', 'доказал' )] верность нашей земле и понимание нашей культуры. Некоторые выйдут из тени и последуют за тобой, но знай: иные племена примут последователей твоей новой веры как братьев, однако не как соплеменников. Теперь ступай, ибо ты — [Select_CString(ROOT.Char.IsFemale, 'Избранная', 'Избранный' )] среди цириан и выведешь цириан на свет, где им надлежит быть».#!"
 dataw_ciriane_rebellion.4262.a: "Слава Сомисариан, Царице Солнца и Луны! Слава Цирианской империи!"
 dataw_ciriane_rebellion.4262.a.c: "Цириане"

# An Empire for us all.
 dataw_ciriane_rebellion.4263.t: "Начало строительства?"
 dataw_ciriane_rebellion.4263.desc: "Я изучаю представленные инженерами планы. Сложная система каналов, шлюзов и плотин позволит лучше управлять течением воды по всем Болотам, снизит угрозу наводнений и увеличит площадь пригодной для возделывания земли.\n\nПо оценкам инженеров, столь масштабный проект займёт пять лет. Если всё пойдёт по представленному плану, к его завершению у нас появится инфраструктура, способная ускорить развитие региона [GetGeographicalRegion('custom_mareschois_population').GetName] так, как ещё несколько лет назад мы не могли и мечтать.\n\n#N Осталось лишь скрепить печатью выделение средств. Отважусь ли я на столь грандиозное предприятие?#!"
 dataw_ciriane_rebellion.4263.a: "Да! Пусть работы начнутся."
 dataw_ciriane_rebellion.4263.b: "Если подумать… Пожалуй, пока стоит подождать."
 dataw_ciriane_rebellion.4263.b_tt: "Поскольку вы уже наняли инженеров для составления планов, вам вернут лишь #P 600[gold_i]#! из #P 750[gold_i]#!, потраченных на решение. Когда будете готовы, решение можно будет принять снова."

# Local Tribes Protest Change
 dataw_ciriane_rebellion.4265.t: "Местные племена против перемен"
 dataw_ciriane_rebellion.4265.desc: "Последние несколько недель до моего двора доходят слухи о демонстрациях и даже драках, вспыхивающих в державе [high_dev_county.GetName].\n\nНаконец чиновник с виноватым видом приносит доклад: местные племена жалуются на уничтожение их традиционных земель ради новых #italic «проектов»#!, которые они считают пустой тратой времени и средств.\n\nСдерживая вздох, я понимаю, что местные рабочие не смогли удовлетворить требования племён и переложили проблему на меня.\n\nЕсли вскоре ничего не предпринять, последствия могут оказаться непредсказуемыми. Чтобы прекратить недовольство, нужны решительные меры."
 dataw_ciriane_rebellion.4265.n.desc: "\n\nВероятно, волнения вызваны моим масштабным проектом по осушению Болот. Если проблема сохранится или усугубится, она с большой вероятностью повлияет на итог всего проекта."
 dataw_ciriane_rebellion.4265.a: "Умиротворить их золотом и красивыми словами."
 dataw_ciriane_rebellion.4265.b: "Умиротворить их обещаниями и уговорами."
 dataw_ciriane_rebellion.4265.c: "Умиротворить их ложью и пустыми обещаниями."
 dataw_ciriane_rebellion.4265.d: "Подавить их войсками."
 dataw_ciriane_rebellion.4265.e: "Не обращать внимания и надеяться, что всё уладится само."
 dataw_ciriane_rebellion.4265.w: "Племена довольны"
 dataw_ciriane_rebellion.4265.l: "Племена по-прежнему недовольны"
# The Tribes are Content
 dataw_ciriane_rebellion.4266.t: "Племена довольны"
 dataw_ciriane_rebellion.4266.desc: "Похоже, мои действия принесли плоды.\n\nДонесений о выступлениях местных племён и драках стало значительно меньше. До меня даже дошли неохотные похвалы местных вождей, вполне довольных моим предложением.\n\n#N Теперь, когда проблема решена, работы в державе [high_dev_county.GetName] могут возобновиться.#!\n\nПроекты в регионе продолжатся без страха перед вмешательством или задержками."
 dataw_ciriane_rebellion.4266.a: "Воистину великий успех!"

# The Tribes remain Displeased
 dataw_ciriane_rebellion.4267.t: "Племена по-прежнему недовольны"
 dataw_ciriane_rebellion.4267.desc: "Дни идут, а донесения из державы [high_dev_county.GetName] становятся всё тревожнее: стычки между местными племенами и рабочими вспыхивают всё чаще.\n\nВскоре у меня не остаётся выбора, кроме как послать солдат и подавить беспорядки, пока положение не ухудшилось ещё сильнее.\n\n#N Это решит проблему, но ни рабочие, ни племена не обрадуются усилению военного присутствия, что наверняка повредит запланированным в регионе проектам.#!"
 dataw_ciriane_rebellion.4267.a: "Иного пути нет!"

# The Tribes are Destroyed
 dataw_ciriane_rebellion.4268.t: "Племена уничтожены"
 dataw_ciriane_rebellion.4268.desc: "Порой, чтобы внушить подданным уважение, требуется немного крови и страха.\n\nЯ посылаю крупный отряд, и в последующие дни получаю донесения о набегах и жестоких расправах над местными племенами.\n\nОчень скоро недовольство проектом в державе [high_dev_county.GetName] сменяется для них куда более насущными бедами.\n\n#N Когда я наконец отзову войска, местным племенам потребуются долгие годы, чтобы оправиться от нанесённого ущерба. Это решение не принесло мне любви, зато устранило проблему в регионе.#!"
 dataw_ciriane_rebellion.4268.a: "Они склонятся перед моей волей."

## Corrupt Officials Steal Money
 dataw_ciriane_rebellion.4269.t: "Продажные чиновники крадут деньги"
 dataw_ciriane_rebellion.4269.desc: "Получив пятую просьбу о деньгах за столько же недель, я внимательно изучаю многочисленные ведомости и письма чиновников из державы [low_dev_county.GetName]. Вывод может быть лишь один: кто-то из них присваивает мои средства!\n\nОднако следы заметены слишком хорошо, и установить виновника не удаётся.\n\n#N Нельзя позволить вору продолжать беспрепятственно грабить казну, иначе расходы возрастут, а коррупция распространится ещё шире.#!\n\n"
 dataw_ciriane_rebellion.4269.n.desc: "Вероятно, эта суматоха вызвана моим масштабным проектом по осушению Болот. Если проблема сохранится или усугубится, она с большой вероятностью повлияет на итог всего проекта."
 dataw_ciriane_rebellion.4269.a: "Лично взять под контроль затронутую проектом область."
 dataw_ciriane_rebellion.4269.b: "Устроить ловушку для продажных чиновников."
 dataw_ciriane_rebellion.4269.c: "Казнить всех и назначить новых чиновников."
 dataw_ciriane_rebellion.4269.d: "Не обращать внимания."
 dataw_ciriane_rebellion.4269.w: "Продажные чиновники исчезают"
 dataw_ciriane_rebellion.4269.l: "Продажные чиновники выходят из-под контроля"

# Corrupt Officials Disappear
 dataw_ciriane_rebellion.4270.t: "Продажные чиновники исчезли"
 dataw_ciriane_rebellion.4270.desc: "Похоже, меры, принятые против продажных чиновников в державе [low_dev_county.GetName], оказались действенными.\n\n#N Тщательная проверка ведомостей и перечисляемых между нами средств больше не выявляет расхождений, а все работы в графстве продвигаются должными темпами.#!"
 dataw_ciriane_rebellion.4270.a: "Коррупции здесь не место."

# Corrupt Officials Worsens
 dataw_ciriane_rebellion.4271.t: "Коррупция усугубляется"
 dataw_ciriane_rebellion.4271.desc: "Меры, принятые против продажных чиновников в державе [low_dev_county.GetName], нисколько не умерили разгул коррупции.\n\n#N В ведомостях по-прежнему обнаруживаются расхождения, а пропавшие суммы с каждым месяцем лишь растут.#!"
 dataw_ciriane_rebellion.4271.a: "Какая катастрофа."

# Wyvern Event Chain
 dataw_ciriane_rebellion.4272.t: "Нападения виверны"
 dataw_ciriane_rebellion.4272.desc: "Рабочие из державы [wyvern_county.GetName] присылают письмо с ужасными вестями.\n\nГде-то в графстве устроила гнездо виверна, пожирающая всех, кого находит на местных дорогах и в поселениях.\n\nБольшинство рабочих отказывается выходить из домов, опасаясь нападения чудовища.\n\n#N Авторы письма умоляют немедленно прислать помощь, иначе работа во всём графстве может остановиться. Но какую именно помощь отправить, решать мне.#!"
 dataw_ciriane_rebellion.4272.n.desc: "\n\nЕсли проблема сохранится или усугубится, она с большой вероятностью повлияет на итог всего проекта."
 dataw_ciriane_rebellion.4272.a: "Лично возглавить отряд солдат."
 dataw_ciriane_rebellion.4272.b: "Послать персонажа [knight.GetFirstName] с отрядом солдат."
 dataw_ciriane_rebellion.4272.c: "Нанять охотника на виверн."
 dataw_ciriane_rebellion.4272.d: "Не обращать внимания."
 dataw_ciriane_rebellion.4272.w: "Виверна убита"
 dataw_ciriane_rebellion.4272.l: "Виверна остаётся неуловимой"
# Slaying the Wyvern
 dataw_ciriane_rebellion.4273.t: "Убийство виверны"
 dataw_ciriane_rebellion.4273.desc: "Подобравшись ближе, я использую краткое замешательство, которое один из солдат вызвал у виверны, и вхожу в радиус удара. Хвост рассекает воздух, всё вокруг словно замедляется, и наконец мой клинок пробивает чешую. Судорожные движения тела затихают, когда жизнь покидает чудовище.\n\nОглянувшись на своих людей, я вижу нескольких раненых и, к несчастью, погибших в схватке с виверной. В глазах тех, кто ещё стоит на ногах, сияет восхищение. Очевидно, моё мастерство на охоте произвело на них неизгладимое впечатление.\n\nТеперь, когда виверна убита, жители державы [wyvern_county.GetName] могут вернуться к обычной жизни, не боясь стать её добычей. Остаётся лишь один вопрос: что сделать с телом чудовища?"
 dataw_ciriane_rebellion.4273.a: "Провезти голову виверны по всей стране, демонстрируя мою мощь."
 dataw_ciriane_rebellion.4273.b: "Отдать тушу виверны местным жителям."
 dataw_ciriane_rebellion.4273.c: "Продать тушу тому, кто предложит наивысшую цену."
 wyvern_corpse_donated: "Труп виверны отдан жителям"
 frequent_wyvern_attacks: "Частые нападения виверн"
 recently_slain_wyvern: "Недавно убитая виверна"
 proudly_displaying_wyvern_head: "Голова виверны выставлена напоказ"
 marshes_drained: "Осушенные болота"
# The Wyvern is Slain
 dataw_ciriane_rebellion.4274.t: "Виверна убита"
 dataw_ciriane_rebellion.4274.desc: "С каждым днём во мне растёт тревога: неужели посланные на борьбу с виверной люди потерпели неудачу? Но наконец они возвращаются и предъявляют жуткую голову убитого ими огромного чудовища.\n\nВ восторге я поздравляю всех участников похода и слежу, чтобы их щедро наградили и золотом, и почестями моего двора. В конце концов, не каждый день ко двору приносят голову виверны.\n\n#N Теперь, когда виверна убита, жители державы [wyvern_county.GetName] могут вернуться к обычной жизни, не боясь стать её добычей.#!"
 dataw_ciriane_rebellion.4274.a: "Эту победу будут праздновать ещё много дней."

# The Wyvern Remains Elusive
 dataw_ciriane_rebellion.4275.t: "Виверна остаётся неуловимой"
 dataw_ciriane_rebellion.4275.a.desc: "С каждым днём приходит всё больше донесений о нападениях виверны на караваны, деревни и путников. Чудовище становится смелее, а мольбы о помощи звучат всё громче.\n\n"
 dataw_ciriane_rebellion.4275.b.desc: "Похоже, посланные мной люди не справились: до меня не дошло ни вестей об их успехе, ни известий о возвращении.\n\n"
 dataw_ciriane_rebellion.4275.c.desc: "Единственное утешение — рано или поздно виверна наверняка улетит, оставив после себя разорённую, но пригодную для восстановления землю. Впрочем, жители державы [wyvern_county.GetName] едва ли посмотрят на это так же."
 dataw_ciriane_rebellion.4275.a: "Остаётся надеяться, что виверна исчезнет как можно скорее."

# A Dream Becomes Reality
 dataw_ciriane_rebellion.4276.t: "Мечта становится явью"
 dataw_ciriane_rebellion.4276.desc: "Прошли месяцы с тех пор, как было решено осушить эти болота. Мечта, некогда представленная мне подробными чертежами и расчётными книгами, стала явью. По всей земле установлены огромные шлюзы, позволяющие сдерживать и даже направлять постоянные разливы. Благодаря им рост урожая и объёмы производства достигли прежде немыслимого уровня.\n\nИнженеры празднуют достижение, и — что, пожалуй, ещё удивительнее — к ним присоединились управляющие моего королевства. Проект остался в рамках сметы, во многом благодаря тому, что возникавшие при строительстве проблемы решались быстро.\n\n#N Сегодня мы празднуем, ведь будущее народа Нахашина ещё никогда не казалось столь светлым. Это лишь один из шагов, которые предстоит сделать, чтобы превратить край, считающийся захолустьем, в империю моей мечты.#!"
 dataw_ciriane_rebellion.4276.a: "За воплощённую мечту!"
 dataw_ciriane_rebellion.4276.s.c_tt: "Доступно только для державы [GetTitleByKey('d_claose').GetBaseNameNoTier]"
 dataw_ciriane_rebellion.4276.s.h_tt: "Доступно только для державы [GetTitleByKey('d_henar').GetBaseNameNoTier]"
 dataw_ciriane_rebellion.4276.n.a_tt: "Доступно только для державы [GetTitleByKey('d_archambon').GetBaseNameNoTier]"
 dataw_ciriane_rebellion.4276.n.e_tt: "Доступно только для державы [GetTitleByKey('d_eudolon').GetBaseNameNoTier]"

# The Cost of a Dream
 dataw_ciriane_rebellion.4277.t: "Цена мечты"
 dataw_ciriane_rebellion.4277.desc: "Прошли месяцы с тех пор, как было решено осушить эти болота. Мечта, некогда представленная мне подробными чертежами и расчётными книгами, стала явью. По всей земле установлены огромные шлюзы, позволяющие сдерживать и даже направлять постоянные разливы. Благодаря им рост урожая и объёмы производства достигли прежде немыслимого уровня.\n\nОднако при всей внушительности достижения и долговечности проекта его стоимость значительно превысила выделенную сумму. Инженеры оправдываются и пытаются переложить вину, но это лишь видимость: молчаливыми взглядами они обвиняют меня. «Если бы вы лучше справлялись с возникавшими трудностями, мы не оказались бы в таком положении!» — говорят их глаза, пока с уст слетают пустые любезности.\n\nСчёт придётся оплатить: иного выхода нет, если я не хочу прослыть [Select_CString(ROOT.Char.IsFemale, 'правительницей, которая не возвращает долги', 'правителем, который не возвращает долги' )]. И всё же мы можем отпраздновать развитие Нахашина. Это лишь один из шагов, необходимых, чтобы превратить край, считающийся захолустьем, в империю моей мечты.\n\n#N Жаль только, что мечты так дорого обходятся.#!"
 dataw_ciriane_rebellion.4277.a: "Счёт будет оплачен, и этот фарс наконец закончится."

# The Wetlands Revitalised
 dataw_ciriane_rebellion.4278.t: "Возрождённые болотные земли"
 dataw_ciriane_rebellion.4278.desc: "Наконец задуманный много лет назад проект охватил весь Нахашин!\n\nЖители всего королевства восхваляют принесённые переменами блага. В будущем ещё останется место для усовершенствований, но уже сейчас это одно из величайших предприятий нашего народа за всю письменную историю, и его следует достойно отпраздновать.\n\nПосле завершения проекта моё имя и мой дом почти наверняка войдут в историю как одни из основателей будущего Нахашина и грядущей империи.\n\n#N А пока мне позволено наслаждаться славой, которую принёс этот успех.#!"
 dataw_ciriane_rebellion.4278.a: "За новые шаги вперёд!"

 dataw_ciriane_rebellion.4280.t: "Империя для моего народа"
 dataw_ciriane_rebellion.4280.desc: "Наконец мечта об империи на западе воплотилась. Об империи, где звучит не орлесианская речь, а язык западных цириан. Об империи, способной соперничать с Орлеем и преподнесённой в дар народу [GetGlobalVariable('mareschois_culture_var').Culture.GetName] из Нахашина — моим людям, чьи кровь и пот позволили воплотить эту мечту."
 dataw_ciriane_rebellion.4280.a: "Да здравствует империя [GetTitleByKey('e_nahashin').GetBaseNameNoTier]!"
