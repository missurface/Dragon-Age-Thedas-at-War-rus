 dataw_ciriane_rebellion.3900.t: "Посланник в болота"
 dataw_ciriane_rebellion.3900.desc: "Следует отправить в болота доверенного человека, который установит связь с нашими сородичами из народа [GetGlobalVariable('ciriane_culture_var').Culture.GetName]. Лучше всего подойдёт осмотрительный и красноречивый человек.\n\n#N Но чтобы впечатлить варваров, посланнику также понадобятся сила и отвага.#!"
