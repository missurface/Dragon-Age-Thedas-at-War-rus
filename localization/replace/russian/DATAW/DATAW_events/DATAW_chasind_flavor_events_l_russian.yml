l_russian:
# Chasind Travel Events
 DATAW_chasind_flavor_travel.1.t: "Спор"
 DATAW_chasind_flavor_travel.1.desc: "Остановившись со свитой в придорожной таверне, я замечаю двух людей, которые о чём-то горячо спорят. Здесь достаточно шумно, и обычно их перебранка не привлекла бы моего внимания, но их происхождение выдаёт безошибочно узнаваемый акцент: [GetCultureByKey('mareschois').GetName].\n\nСлово берёт [angry_mareschois_man.GetFirstName]: «Жители топей принадлежат к той же культуре, что и все остальные жители Орлея, — [GetCultureByKey('orlesian').GetName]! Разве наше общее происхождение не восходит к народу, известному как [GetCultureByKey('ciriane').GetCollectiveNoun]? То, что мы сохранили несколько старых обычаев, ещё не делает нас совершенно иной культурой!»\n\n«Ты прекрасно знаешь, что мы никогда до конца не склонялись перед [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier], — вступает в разговор [angry_mareschois_man_1.GetFirstName]. — Даже во времена Исората жители топей не поддержали его великого объединения. А позднее разве мы помогали Драккону строить единую державу? Остальной Орлей оставил нас позади и стал иным. Мы — последние хранители древней культуры!»\n\n«Это лишь значит, что мы не спешим перенимать последние веяния, — возражает [angry_mareschois_man.GetFirstName]. — В верности традициям нет ничего дурного. Дурно делать вид, будто из-за неё мы стали чужими остальным орлесианцам. Что хорошего принесёт отказ от орлесианской самобытности?»\n\nЯ громко прочищаю горло, прерывая спор."
 DATAW_chasind_flavor_travel.1.a: "[angry_mareschois_man.GetFirstNameNoTooltip] [Select_CString(angry_mareschois_man.IsFemale, 'права', 'прав' )]. Народ марешуа — часть богатой мозаики орлесианской культуры."
 DATAW_chasind_flavor_travel.1.b: "[angry_mareschois_man_1.GetFirstNameNoTooltip] [Select_CString(angry_mareschois_man_1.IsFemale, 'права', 'прав' )]. Народ марешуа ближе к цирианам, чем к орлесианцам."
 DATAW_chasind_flavor_travel.1.c: "Компромисс наверняка найдётся."
 DATAW_chasind_flavor_travel.1.d: "Всё это субъективно. Какая разница?"
 DATAW_chasind_flavor_travel.1.orlesian_vassals: "Все [Concept('vassal','вассалы-орлесианцы')|E]"
 DATAW_chasind_flavor_travel.1.mareschois_vassals: "Все [Concept('vassal','вассалы из народа марешуа')|E]"
 DATAW_chasind_flavor_travel.1.orlesian_and_mareschois_vassals: "Все [Concept('vassal','вассалы-орлесианцы и вассалы из народа марешуа')|E]"
 DATAW_chasind_flavor_travel.1.c.good: "Мои доводы убедительны"
 DATAW_chasind_flavor_travel.1.c.bad: "Мои доводы неубедительны"
 DATAW_chasind_flavor_travel.1.bad.toast: "Вам не удаётся убедить обоих спорщиков"
