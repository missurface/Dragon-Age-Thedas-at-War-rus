l_russian:
 # EVENT 0100
 DATAW_magic_events.0100.tit: "Начертано кровью"
 DATAW_magic_events.0100.desc.firstSection: "Я пребываю где-то в сумеречном пограничье между сном и явью, когда слышу его. \n\nГолос — шёпот громче крика. Знакомый и чужой одновременно, он меняется каждое мгновение. Сперва звучит голос матери. Затем — "
 DATAW_magic_events.0100.desc.asexual: "восторженная похвала того, кто наставлял меня в детстве."
 DATAW_magic_events.0100.desc.notAsexual: "счастливое воркование моей первой любви."
 DATAW_magic_events.0100.desc.secondSection: "\n\nГолос говорит, что для мага Тень и лириум — лишь два источника магии. Почему бы не припасть к алому роднику, текущему в моих жилах и жилах других? \n\nС тех пор как во мне пробудилась магия, меня предостерегали от магии крови. Даже великие тевинтерские магистры публично отрицают, что прибегают к ней. Раз это искусство окружено таким позором, оно наверняка таит страшную опасность. \n\nГолос чувствует моё сомнение и баюкает меня, словно младенца. \n\nНеважно, как обретена сила. Лишь то, как смертные распоряжаются ею, определяет их наследие. \n\nВ этот миг письменные принадлежности соскальзывают со стола, и я окончательно пробуждаюсь. Голос исчез, но его предложение всё ещё звучит в мыслях… В конце концов, причинять кому-либо вред необязательно. Сила исходит изнутри. Остаток вечера проходит в размышлениях: хватит ли мне отваги протянуть к ней руку?"
 DATAW_magic_events.0100.opt.a: "Какие чудеса можно сотворить всего одной каплей?"
 DATAW_magic_events.0100.opt.b: "Цена слишком высока."

 # EVENT 0101
 DATAW_magic_events.0101.tit: "Начертано кровью"
 DATAW_magic_events.0101.desc: "Я беру из письменного набора нож для очинки перьев и несколько мгновений разглядываю блестящее лезвие, а затем осторожно прокалываю подушечку большого пальца. \n\nНа ранке набухает тёмный рубин моей крови. Я с порочным удовлетворением наблюдаю, как он растёт. Вдоволь насытившись зрелищем, я закрываю глаза. \n\nЯ взываю к голосу, обитающему где-то за пределами сознания. Подобно лани, впервые помогающей оленёнку подняться на раздвоенные копытца, безмолвный наставник учит меня вплетать алое подношение в магию."
 DATAW_magic_events.0101.opt.a: "Свершилось."

 # EVENT 0102
 DATAW_magic_events.0102.tit: "Начертано кровью"
 DATAW_magic_events.0102.desc: "Одна лишь мысль об этом — непростительная глупость! \n\nКакой маг не знает об опасностях магии крови? Прибегнуть к ней — значит протянуть руку помощи демонам! \n\nДаже люди с благими намерениями поддаются этому искушению, мня себя сильнее тех, кто пал прежде. Стоит однажды добровольно пролить кровь, и голод будет лишь расти. \n\nСперва капля, затем потоп. Крови потребуется больше, чем есть в моём смертном теле. Если я уступлю, сколько жизней придётся отнять? \n\nНет. Моя решимость тверда. Когда голос явится во сне, я прогоню его ни с чем. Истинная сила заключена не в крови, а в воле."
 DATAW_magic_events.0102.opt.a: "Злу меня не искусить."

 # EVENT 0200
 DATAW_magic_events.0200.tit: "Эмоциональные вспышки"
 DATAW_magic_events.0200.desc: "За поздним ужином мы с [familyMember.GetShortUIName|U] вновь вступаем в жаркий спор — в последнее время это происходит всё чаще. Как можно так дорожить человеком, с которым почти никогда не удаётся найти общий язык? \n\nНа сей раз обида переливается через край, словно забытое на огне варево. Я ещё не успеваю понять, что происходит, а [Select_CString(familyMember.IsFemale, 'её', 'его' )] льняная салфетка уже вспыхивает пламенем — пламенем, которое породило моё праздное раздражение."
 DATAW_magic_events.0200.opt.a: "[ROOT.Char.GetFaith.HighGodName], что же я [Select_CString(ROOT.Char.IsFemale, 'натворила', 'натворил' )]?"