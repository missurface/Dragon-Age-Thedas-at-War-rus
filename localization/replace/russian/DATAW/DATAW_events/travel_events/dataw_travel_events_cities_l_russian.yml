l_russian:

# Халамширал — особые события
 travel_city_halamshiral_intro:0 "#italic Конец пути#!. Таким стало это место для эльфов, совершивших Долгий путь: увидев эти земли, они решили заложить здесь новый дом для своего народа. Теперь передо мной лежит [city_province.GetNameNoTooltip] — таково его эльфийское имя. Каменные стены города возведены в подражание Арлатану, навеки утраченному во тьме веков.\n\n"
 travel_city_halamshiral_winding_streets_title: "[city_province.GetBaronyNameExplicitlyNoTooltip]: Извилистые улицы"
 travel_city_halamshiral_high_quarter_title: "[city_province.GetBaronyNameExplicitlyNoTooltip]: Верхний квартал"
 travel_city_halamshiral_ancient_walls_title: "[city_province.GetBaronyNameExplicitlyNoTooltip]: Древние стены"

 travel_city_halamshiral_winding_streets: "Извилистые улицы города [city_province.GetBaronyNameExplicitlyNoTooltip] окружают меня со всех сторон, словно густая лесная чаща. По ним без конца снуют бесчисленные прохожие, то появляясь, то исчезая, — ни одного лица не удаётся запомнить. [Select_CString(ROOT.Char.IsFemale, 'Я знала', 'Я знал' )], что Халамширал построили как сердце новой эльфийской родины, но кажется, будто этот город должен был вместить весь народ до последнего эльфа."
 travel_city_halamshiral_high_quarter: "Вдали виднеются улицы верхнего квартала — обители городской знати, укрытой за высокими стенами. По-видимому, именно отсюда эльфы начали возводить город. В этом месте дивная красота и древность соседствуют с каким-то отчаянием — пожалуй, вполне в духе эльфийской истории."
 travel_city_halamshiral_ancient_walls: "Я оборачиваюсь и вновь смотрю на старые городские стены; по высоте с ними могут сравниться лишь укрепления верхнего квартала. Их возвели, когда город разросся настолько, чтобы по праву называться столицей. В них чувствуется и надежда на возрождение, и одержимость прошлым.\n\n Пытались ли строители в точности воссоздать древние стены Арлатана или лишь вдохновлялись ими? Трудно сказать: вероятно, ответ навеки затерялся во тьме веков."

 travel_city_halamshiral_winding_streets_companion_reflection:0 "\n[Select_CString(sightseeing_companion.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMe', sightseeing_companion)|U] [sightseeing_companion.GetName] добавляет, что стоит воспользоваться случаем и побольше узнать о городе."
 travel_city_halamshiral_high_quarter_companion_reflection:0 "\n[Select_CString(sightseeing_companion.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMe', sightseeing_companion)|U] [sightseeing_companion.GetName] добавляет, что стоит воспользоваться случаем и побольше узнать о городе."
 travel_city_halamshiral_ancient_walls_companion_reflection:0 "\n[Select_CString(sightseeing_companion.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMe', sightseeing_companion)|U] [sightseeing_companion.GetName] добавляет, что стоит воспользоваться случаем и побольше узнать о древних стенах."

 travel_city_halamshiral_alone_reflection:0 "\nЯ невольно задумываюсь о том, сколь древен этот город."
# Вал Руайо — особые события
# Вал Руайо — особые события
 travel_city_val_royeaux_grand_cathedral_title: "[city_province.GetBaronyNameExplicitlyNoTooltip]: Великий Собор"
 travel_city_val_royeaux_university_of_orlais_title: "[city_province.GetBaronyNameExplicitlyNoTooltip]: Университет Орлея"
 travel_city_val_royeaux_imperial_palace_title: "[city_province.GetBaronyNameExplicitlyNoTooltip]: Императорский дворец"
 PROSPHORION_GLOSS: "Северная торговая гавань города [GetTitleByKey('b_val_royeaux').GetNameNoTier]. В городе также было несколько других военных, торговых и имперских гаваней."
 travel_city_val_royeaux_intro: "Миновав великолепные поместья, я вижу [city_province.GetBaronyNameExplicitlyNoTooltip], столицу Орлесианской империи Кордилиуса. Трудно не восхититься этим дивным городом: золота и украшений здесь столько, что он кажется подобием самого Золотого Города.\n\n"

 travel_city_val_royeaux_grand_cathedral: "Войдя в город через Солнечные Врата, я замечаю вдалеке [Glossary( 'Великий Собор', 'grand_cathedral_GLOSS')], резиденцию Верховной Жрицы. Отсюда виден и Солнечный трон. Даже величие круглой площади отступает перед тихим пением Песни Света, которое, кажется, доносится отовсюду."
 travel_city_grand_cathedral_reflection: "\n\nВ окружении монументальных зданий трудно не преклониться перед всем этим великолепием. Внезапно собственное существование кажется куда менее значительным."
 travel_city_companion_grand_cathedral_reflection:0 "\n\n«[ROOT.Char.Custom2('RelationToMeAddress', sightseeing_companion)|U], ты ещё не [Select_CString(ROOT.Char.IsFemale, 'бывала', 'бывал' )] в подобных местах. Перед нами — более тысячи лет истории»."
 travel_city_companion_university_of_orlais_reflection:0 "\n\n«[ROOT.Char.Custom2('RelationToMeAddress', sightseeing_companion)|U], ты ещё не [Select_CString(ROOT.Char.IsFemale, 'бывала', 'бывал' )] в подобных местах. Перед нами — более тысячи лет истории»."

 grand_cathedral_GLOSS: "Задуманный Кордилиусом Дракконом I Великий Собор Вал Руайо на протяжении всей своей истории служил резиденцией Верховной Жрицы орлесианской Церкви. Это единственное место, где Песнь Света исполняется целиком, что занимает около двух недель. Строительство завершилось лишь в 2:99 Славы открытием двух башен — более чем через двести лет после начала работ. Именно они дали имя следующей эре — Веку Башен."
 travel_city_val_royeaux_university_of_orlais: "Движимые любопытством, мы направляемся к [Glossary( 'огромному университету', 'AQUEDUCT_OF_VALENS_GLOSS' )].\n"
 travel_city_option_study_university_of_orlais: "Мы должны составить карту этих библиотек и подробно их описать."
 travel_city_val_royeaux_imperial_palace: "Войдя в город через Солнечные Врата, я вижу возвышающийся надо всем вокруг Императорский дворец. Это символ распутства и пороков, которые в этих стенах столь охотно принимают, которым предаются и которые прощают."
 AQUEDUCT_OF_VALENS_GLOSS: "Войдя в сам город через Ночные ворота, я вижу справа Университет: над городом возвышаются два бронзовых купола его часовни. Говорят, здесь издают труды на самые разные темы — о культуре, животном мире, истории и многом другом, хотя выбор тем и ограничен вкусами тех, кто ныне стоит у власти."
 FALLBACK_COIN: "монеты"
 travel_city_well_supplied: "Хорошее снабжение"
 travel_city_well_supplied_desc: "Персонаж недавно запасся всем необходимым для путешествия."
