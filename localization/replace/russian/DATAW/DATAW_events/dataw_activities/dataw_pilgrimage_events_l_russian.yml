l_russian:
 #Jader
 dataw_pilgrimage.1000.t: "Джейдер"
 dataw_pilgrimage.1000.desc: "Джейдер. Наконец-то я [Select_CString(ROOT.Char.IsFemale, 'добралась', 'добрался' )] сюда и вижу его собственными глазами. Ему далеко до великолепия больших городов, но для меня он — настоящее чудо, и при виде его сердце переполняется восторгом. Меня привели сюда не шумный рынок Джейдера и не его купцы, не просторная гавань и не длинное каменистое побережье.\n\nНет, я спешу к своей цели. Я ощущаю её прежде, чем она предстаёт перед глазами: церковь Джейдера. Это самое большое здание в городе, и вечное пламя сияет в ней особенно ярко — во всяком случае, так кажется мне.\n\nЯ кладу ладонь на каменную стену и стараюсь прочувствовать этот миг. Истинная родина Андрасте. Наконец-то. Я чувствую, как вокруг разливается её тепло, словно она стоит рядом со мной."
 dataw_pilgrimage.1000.a: "Воистину дивное зрелище."
 #Montsimmard
 dataw_pilgrimage.1001.t: "Монтсиммар"
 dataw_pilgrimage.1001.desc.beginning: "Нет в мире городов, чья история походила бы на историю Иерусалима. В городе немало святых мест, и среди них "
 dataw_pilgrimage.1001.desc.christian: "храм Гроба Господня, построенный над местами, где Иисус был распят, погребен и воскрес."
 dataw_pilgrimage.1001.desc.muslim: "Харам аш-Шариф, где Мухаммед по окончании земной жизни вознесся на небеса."
 dataw_pilgrimage.1001.desc.jewish: "Храмовая гора — Святая святых и место, где, согласно пророчеству, будет построен Третий храм."
 dataw_pilgrimage.1001.desc.end: "\n\nЯ стою перед Храмовой горой, положив руку на Западную стену, и думаю обо всем, что случилось со мной на пути в легендарный город."

