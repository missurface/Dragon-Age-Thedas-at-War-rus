l_russian:
 trait_anointed: "[Select_CString(ROOT.Char.IsFemale, 'Помазанница', 'Помазанник' )]"
 trait_anointed_desc: "Считается, что [Select_CString(ROOT.Char.IsFemale, 'Помазанницей', 'Помазанником' )] руководит сам Создатель; для верующих нет большей чести, чем получить это звание."
 trait_anointed_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'считается Помазанницей, направляемой', 'считается Помазанником, направляемым' )] самим Создателем; для верующих нет большей чести, чем получить это звание."

 trait_vallaslin: "[Select_CString(ROOT.Char.IsFemale, 'Носительница', 'Носитель' )] [Concept('vallaslin', 'валласлина')|E]"
 trait_vallaslin_desc: "После обряда посвящения во взрослую жизнь этот персонаж по обычаю носит [Concept('vallaslin', 'валласлин')|E] избранного божества."
 trait_vallaslin_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'прошла', 'прошёл' )] обряд посвящения во взрослую жизнь и теперь по обычаю носит [Concept('vallaslin', 'валласлин')|E] избранного божества."

 trait_qunari: "[Concept('qunari', 'Кунари')|E]"
 trait_qunari_desc: "[ROOT.Char.GetFirstNameNoTooltip] следует куну."
 trait_qunari_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] следует куну."

 trait_human: "[Concept('human', 'Человек')|E]"
 trait_human_desc: "Этот персонаж принадлежит к человеческой расе, чьи многочисленные племена переселились в Тедас с далёкого севера."
 trait_human_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] принадлежит к человеческой расе, чьи многочисленные племена переселились в Тедас с далёкого севера."

 trait_elvhen: "[Select_CString(ROOT.Char.IsFemale, 'Эльфийка', 'Эльф' )]"
 trait_elvhen_desc: "Этот персонаж принадлежит к расе [Concept('elvhen', 'эльфов')|E], происходящей из лесов Арлатана."
 trait_elvhen_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] принадлежит к расе [Concept('elvhen', 'эльфов')|E], происходящей из лесов Арлатана."



 trait_witchofthewilds: "Ведьма Диких земель"
 trait_witchofthewilds_desc: "Этот персонаж — представительница древней и замкнутой традиции, Ведьма Диких земель."
 trait_witchofthewilds_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] — представительница древней и замкнутой традиции, Ведьма Диких земель."
 I_HAVE_WITCHOFTHEWILDS_TRAIT: "[GetTrait('witchofthewilds').GetName(GetPlayer)]: $VALUE|=+0$"
 trait_conscripted_mage: "Завербованный маг"
 trait_conscripted_mage_desc: "Этот персонаж — маг, официально призванный на службу и ставший [Concept('knight','рыцарем')|E] независимо от своего желания. Он — лишь орудие войны, не более."
 trait_conscripted_mage_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — маг, официально [Select_CString(ROOT.Char.IsFemale, 'призванная на службу и ставшая', 'призванный на службу и ставший' )] [Concept('knight','рыцарем')|E] независимо от своего желания. [ROOT.GetCharacter.GetSheHe|U] — лишь орудие войны, не более."

