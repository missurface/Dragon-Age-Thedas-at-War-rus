 # Crusader King names
 trait_crusader_king_andrastianism_male: "Возвышенный король"
 trait_crusader_king_andrastianism_female: "Возвышенная королева"
 
 trait_education_magic_1: "[Select_CString(ROOT.Char.IsFemale, 'Неумелая', 'Неумелый' )] маг"
 trait_education_magic_1_desc: "Природная связь с [Concept('fade', 'Тенью')|E] уже пробудилась, но без обучения этот персонаж не сможет владеть своими силами."
 trait_education_magic_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] ощущает природную связь с [Concept('fade', 'Тенью')|E], но нуждается в обучении, чтобы владеть [ROOT.GetCharacter.GetHerHis] силами."
 trait_education_magic_2: "[Select_CString(ROOT.Char.IsFemale, 'Ученица магии', 'Ученик магии' )]"
 trait_education_magic_2_desc: "[Select_CString(ROOT.Char.IsFemale, 'Ученица магии способна', 'Ученик магии способен' )] творить простые чары, способные развлечь или напугать, но для безопасного владения магией требуется дальнейшее обучение."
 trait_education_magic_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] умеет творить простые чары, способные развлечь или напугать, но [Select_CString(ROOT.GetCharacter.IsFemale, 'ей', 'ему' )] ещё предстоит учиться, прежде чем [Select_CString(ROOT.GetCharacter.IsFemale, 'она сможет', 'он сможет' )] безопасно владеть [ROOT.GetCharacter.GetHerHis] магией."
 trait_education_magic_3: "[Select_CString(ROOT.Char.IsFemale, 'Маг, прошедшая Истязание', 'Маг, прошедший Истязание' )]"
 trait_education_magic_3_desc: "После Истязания связь с [Concept('fade', 'Тенью')|E] и заключённые в ней силы оказываются под полным контролем."
 trait_education_magic_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'овладела', 'овладел' )] [ROOT.GetCharacter.GetHerHis] связью с [Concept('fade', 'Тенью')|E] и заключёнными в ней силами."
 trait_education_magic_4: "[Select_CString(ROOT.Char.IsFemale, 'Старшая чародейка', 'Старший чародей' )]"
 trait_education_magic_4_desc: "Годы обучения даровали полный контроль над магическими силами и умение в совершенстве применять их в нужный момент."
 trait_education_magic_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] внушает страх и уважение: за годы обучения [Select_CString(ROOT.GetCharacter.IsFemale, 'она научилась', 'он научился' )] полностью управлять [ROOT.GetCharacter.GetHerHis] силами и в совершенстве применять их в нужный момент."
 trait_education_magic_5: "[Select_CString(ROOT.Char.IsFemale, 'Архимаг, отмеченная Тенью', 'Архимаг, отмеченный Тенью' )]"
 trait_education_magic_5_desc: "Столь тесная связь с [Concept('fade', 'Тенью')|E] — редкость даже среди самых опытных магов; она позволяет архимагу творить чары почти без усилий, так же естественно, как дышать."
 trait_education_magic_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — редкость даже среди самых опытных магов: [ROOT.GetCharacter.GetHerHis|U] тесная связь с [Concept('fade', 'Тенью')|E] позволяет творить чары почти без усилий, так же естественно, как дышать."