l_russian:
 keeper_of_halla_court_position: "Хранитель галл"
 keeper_of_halla_court_position_desc:1 "$keeper_of_halla_court_position$ заботится о священных галлах нашего клана. Эта роль чрезвычайно важна для духовного благополучия нашей общины: галлы несут наши тяготы со времён падения Элвенана и всех последовавших испытаний."
 culture_allows_master_assassin: "Их [culture|E]:\n$BULLET$Имеет [Concept('tradition','традицию')|E] «[GetCultureTradition('tradition_vir_tanadahl').GetName]»"
 court_enchanter_court_position: "Придворный чародей"
 court_enchanter_court_position_desc:1 "$court_enchanter_court_position$ консультирует своего [Concept('liege','сюзерена')|E] по вопросам магии, а также применяет чары на службе у [Concept('liege','сюзерена')|E] — ради развлечения или в более... практических целях."

 recruit_court_enchanter_decision: "Искать придворного чародея"
 recruit_court_enchanter_decision_desc: "В [ROOT.Char.GetCulture.GetCollectiveNoun]ой культуре найдётся множество магов, которых можно нанять. TODO"
 recruit_court_enchanter_decision_tt: "К вашему [Concept('court','двору')|E] присоединится [Concept('courtier','придворный')|E] с высоким [Concept('dataw_magical_prowess','магическим мастерством')|E] и [Concept('trait','свойством')|E] «[Concept('mage','Маг')|E]»"
 recruit_court_enchanter_decision_tooltip: "$recruit_court_enchanter_decision_tt$"
 recruit_court_enchanter_decision_confirm: "Призвать этих магов!"
 court_enchanter_recruited.t: "Придворный чародей нанят"
 recruit_court_enchanter_cooldown_tt: "[GetCourtPositionType('court_enchanter_court_position').GetName] не может быть нанят повторно (осталось [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'recruit_court_enchanter_cooldown' ))])"
 recruit_court_enchanter_decision_effect_tooltip: "Вам представят несколько кандидатов на должность «[GetCourtPositionType('court_enchanter_court_position').GetName()]», готовых предложить свои услуги за плату."
