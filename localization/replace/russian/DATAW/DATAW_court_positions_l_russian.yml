l_russian:
 keeper_of_halla_court_position: "Keeper of the Halla"
 keeper_of_halla_court_position_desc:1 "The $keeper_of_halla_court_position$ is responsible for maintaining the sacred Halla of our Clan. The role is incredibly important for the spiritual health of our community, as our Halla have bourne our burdens since the fall of Elvhenan and all the struggles thereafter."
 court_enchanter_court_position: "Court Enchanter"
 court_enchanter_court_position_desc:1 "The $court_enchanter_court_position$ advises their [liege|E] on matters pertaining to the arcane. They can also employ their spellcraft in service to their [liege|E], whether for entertainment or for more... practical purposes."

