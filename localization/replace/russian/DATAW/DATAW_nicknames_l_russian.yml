 nick_of_the_marshes:0 "of the Marshes"
 nick_of_the_marshes_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] led the Marshes into a Rebellion against the Orlesian Empire and returned victorious."
 nick_of_the_marshes_2:0 "of the Marshes"
 nick_of_the_marshes_2_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] planned to rebel against the Orlesian Empire but the Empire collapsed."
 nick_of_the_marshes_3:0 "of the Marshes"
 nick_of_the_marshes_3_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] planned to rebel against the Orlesian Empire but the Empire granted [CharYouHerHim(CHARACTER)] independence."
 nick_valley_shepard:0 "Valley Shepherd"
 nick_bann_of_banns:0 "Bann of Banns"
 nick_shem_lover:0 "the Shem-Lover"
 nick_the_goliath_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] an enormous warrior, similar to the rare and feared Ogres."
 nick_wolf_friend:0 "Wolf Friend"
 nick_wolf_friend_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] rumoured to break bread with friends of Fen'harel."
 nick_red_hammer:0 "Red-Hammer"
 nick_red_hammer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] once defeated two Thanes single-handedly, crushing both their skulls with his war hammer, leaving it bathed in blood."
 nick_great_fang:0 "Great-Fang"
 nick_great_fang_desc:0 "According to the clan's stories told by the elders, the mighty Torric once battled against the [archdemon|E] Dumat of the First [blight|E], bravely slaying the Beast, forcing it to find a new body. This heroic act earned him the legend-mark of Great-Fang."
 nick_the_hunchback_of_val_royeaux:0 "The Hunchback of Val Royeaux"
 nick_the_hunchback_of_val_royeaux_desc:0 "While his hideous appearance may have earned the disgust of many, Gérard is still a romantic at heart, always in the search of true love."
 nick_spirit_king_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] united the Brecilian tribes, long divided, into one people. Granting [CharYouHerHim(CHARACTER)] the eternal blessing of the spirits on [CharYourHerHis(CHARACTER)] rule."
 nick_spirits_will_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] united the Brecilian tribes, long divided, into one people. Through [CharYourHerHis(CHARACTER)] relentless worship of the spirits and their ways, [CharYouSheHe(CHARACTER)] has been blessed by the Lady of the Forest herself."
 nick_spirits_wrath_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] united the Brecilian tribes, long divided, into one people. Due to [CharYourHerHis(CHARACTER)] ruthless means that the tribes long favored, [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] been marked as the bringer of justice for the Spirits."
 nick_thane_of_thanes:0 "Thane-of-Thanes"
 nick_thane_of_thanes_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has erected themselves above all other clans, all other Thanes, and now rules solely over Tyrdda's children."
 nick_king_of_wilds:0 "King of the Wilds"
 nick_king_of_wilds_desc:1 "Blessed by the goddesses of All-War and beloved of the Chasind people."
 nick_queen_of_wilds:0 "Queen of the Wilds"
 nick_queen_of_wilds_desc:1 "Blessed by the goddesses of All-War and beloved of the Chasind people."
 nick_blood_breaker:0 "Blood-Breaker"
 nick_blood_breaker_desc:0 "Once a Sun-Wolf, Reidar aspired for power. He tried to overthrow his kin and failed. Undeterred, Reidar then led the remaining traitors to Highhold and founded the Sky-Hound clan."
 nick_master_of_the_waves:0 "Master of the Waves"
 nick_master_of_the_waves_desc:1 "Being the founder of the Admiralty of the Waking Isles, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] renowned as a master of the waves and trade of the Waking Sea with the rest of Thedas."
 nick_king_of_the_marshes: "King of the Marshes"
 nick_king_of_the_marshes_desc: "PLACEHOLDER"
 nick_butcher_of_valroyeaux: "Butcher of Val Royeaux"
 nick_butcher_of_valroyeaux_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is renowned as the general that led the army through the infamous Sack of Val Royeaux, which brought unimaginable destruction to the city."
 nick_betrayer_of_the_marshes: "Betrayer of the Marshes"
 nick_betrayer_of_the_marshes_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ignored the popular demand of [CharYourHerHis(CHARACTER)] people and renewed loyalty to Orlais, earning the anger of [CharYourHerHis(CHARACTER)] subjects."
 nick_father_mother_of_the_marshes: "[CHARACTER.GetMotherFather|U] of the Marshes"
 nick_father_mother_of_the_marshes_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] brought the Mareschois to lead their own Empire, and have shackled away the chains of the past to lead them into the future, never to be forgotten."
 nick_chosen_amongst_ciriane: "the Chosen amongst All Ciriane"
 nick_chosen_amongst_ciriane_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] bested the Empire of Orlais, before restoring the old religion and culture of [CharYourHerHis(CHARACTER)] people, earning [CharYouHerHim(CHARACTER)] the title of Chosen among the Ciriane, for [CharYouSheHe(CHARACTER)] led them to glory."
 nick_the_crusted:0 "the Crusted"
 nick_the_crusted_desc:1 "No one remembers what encrusted this poor soul, or how it became a moniker. Junior Wardens who ask are often sent on less than desirable patrols."
 nick_loyal_blade_of_orlais: "the Loyal Blade of Orlais"
 nick_loyal_blade_of_orlais_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] managed to eradicate "Those who hide amongst the Marshes", a radical independentist group who practiced multiple acts of sabotage, therefore proving [CharYourHerHimself(CHARACTER)] as one of Orlais' most loyal servants."
 nick_laventurier: "L'aventurier"
 nick_laventurier_desc:0 "Thierry's legendary adventures are well-known throughout Orlais. He spent his life collecting artifacts, exploring ruins, rescuing damsels, and slaying beasts, all while neglecting his duties as the heir to his House. After their father's passing, these responsibilities fell to his younger brother, Marc."
 nick_goldsnake:0 "Goldsnake"
 nick_goldsnake_desc:0 "Andecarus has always been driven by a desire to be overwhelmingly rich, and there's nothing he wouldn't do to increase his wealth. His greed and cold heart have earned him a venomous legacy."
 nick_the_she_bear:0 "the She-Bear"
 nick_the_she_bear_desc:0 "Maeve was born with an unnatural skill as a warrior and is as tough as they come, besting boys twice her size as a child. Now, as a young woman, she is worthy of the battlefield and is ready to live up to her name."
 nick_the_silver_helm:0 "the Silver Helm"
 nick_the_silver_helm_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharWereWas(CHARACTER)] famed for his bright silver helm and chain."
 nick_tamer_of_wilds:0 "Tamer of the Wilds"
 nick_tamer_of_wilds_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], through luck and skill, managed to subjugate the Brecilian Forest and its people long enough to be declared its rightful ruler, effectively taming the wild forest, its spirits and its people."
 nick_spirit_binder:0 "Spirit-Binder"
 nick_grim_face:0 "Grim-Face"
 nick_the_painter:0 "the Painter"
 nick_the_painter_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is a famous painter known for his work representing [andraste|E] alongside her [elvhen|E] friend Shartan and her other disciples, which would later be reproduced above the doors at the University of Orlais' Chantry."
 nick_the_ash_prophet:0 "the Ash Prophet"
 nick_the_ash_prophet_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] as united the Cendrerin in venturing outside the Sea of Ash, for all must see the wisdom contained within its holy soil."
 nick_the_strange:0 "the Strange"
 nick_the_strange_desc:0 "When Yevven went out of the keep to meet his beloved people for the first time, he was declared a strange-looking creature by the populace due to his appearence, much to his sadness."
 nick_the_mountain:0 "The Mountain"
 nick_mother_of_knives:0 "Mother of Knives"
 nick_mother_of_knives_desc:0 "Arianni's ominous reputation and talent for intrigue is truly something unique, as it has led her far and with no equal. It was no surprise, then, when her two eldest children went down the same murderous path."
 nick_the_magnificent_desc:0 "Tales of [CharYourHerHis(CHARACTER)] splendid deeds are told from Ferelden to Par Ladi."
 nick_harellan:0 "Harellan"
 nick_harellan_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has been declared traitor to [CharYourHerHis(CHARACTER)] own [elvhen|E] kin because of [CharYourHerHis(CHARACTER)] actions. Nothing good awaits [CharYouHerHim(CHARACTER)], in life or in death."
 nick_flat_ear:0 "Flat-Ear" #elves only
 nick_the_wolf_of_the_lowlands:0 "the Wolf of the Lowlands"
 nick_flat_ear_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] unfortunately known as an adorator of human customs."
 nick_maker_of_silence:0 "The Maker of Silence"
 nick_maker_of_silence_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] been the source of many popular rumours among the populace due to the many people in [CharYourHerHis(CHARACTER)] surroundings that have either mysteriously become a lot more quiet, or disappeared entirely following the botched Ducarme Orphanage investigation."
 nick_ir_mi_din_an:0 "Ir Mi'din'an"
 nick_wild_one:0 "Wild-One" #placeholder
 nick_battle_roar:0 "Battle-Roar" #placeholder
 nick_storm_maiden:0 "Storm-Maiden" #placeholder
 nick_bolt_arrow:0 "Bolt-Arrow" #placeholder
 nick_iron_mane:0 "Iron-Mane" #placeholder
 nick_snow_favored:0 "Snow-Favored"
 nick_snow_favored_desc:0 "Guided by Korth, Ivar led his people away from war and hardship, forging a new beginning. The Stone-Bear clan was founded to honor the vision that saved their lives." #placeholder desc
 nick_brave_axe:0 "Brave-Axe" #placeholder
 nick_cold_whisper:0 "Cold-Whisper" #placeholder
 nick_regalia_restorer:0 "The Regalia's Restorer"
 nick_regalia_restorer_desc:0 "[ROOT.GetShortUINameNoTooltipNoFormat|U] is renowned for having regained the artefacts dispersed during the Sack of Val Royeaux, and it is thanks to [ROOT.GetHerHisMy] that the Tomb of the Anointed is now restored, resplendent as it was."
