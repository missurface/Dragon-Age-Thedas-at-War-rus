 nick_wolfhand:0 "Волчья Рука"
 nick_the_virile:0 "[Select_CString(CHARACTER.IsFemale, 'Плодовитая', 'Плодовитый' )]"
 nick_violet_eyes:0 "Лиловые Глаза"
 nick_the_warrior_priest:0 "[Select_CString(CHARACTER.IsFemale, 'Воительница-жрица', 'Воин-жрец' )]"
 nick_the_nevarran:0 "[Select_CString(CHARACTER.IsFemale, 'Неварранка', 'Неварранец' )]"
 nick_elf_lover:0 "[Select_CString(CHARACTER.IsFemale, 'Любительница эльфов', 'Любитель эльфов' )]"
 nick_of_the_marshes:0 "из Топей"
 nick_of_the_marshes_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'подняла', 'поднял' )] Топи на восстание против Орлесианской империи и [Select_CString(CHARACTER.IsFemale, 'вернулась', 'вернулся' )] с победой."
 nick_of_the_marshes_2:0 "из Топей"
 nick_of_the_marshes_2_desc:0 "В планы [CHARACTER.GetShortUINameNoTooltipNoFormat] входило восстание против Орлесианской империи, но Империя рухнула."
 nick_of_the_marshes_3:0 "из Топей"
 nick_of_the_marshes_3_desc:0 "В планы [CHARACTER.GetShortUINameNoTooltipNoFormat] входило восстание против Орлесианской империи, но Империя сама даровала [Select_CString(CHARACTER.IsLocalPlayer, 'вам', Select_CString(CHARACTER.IsFemale, 'ей', 'ему' ))] независимость."
 nick_valley_shepard:0 "[Select_CString(CHARACTER.IsFemale, 'Пастушка Долины', 'Пастух Долины' )]"
 nick_bann_of_banns:0 "Банн баннов"
 nick_shem_lover:0 "[Select_CString(CHARACTER.IsFemale, 'Любительница шемов', 'Любитель шемов' )]"
 nick_the_goliath_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] — [Select_CString(CHARACTER.IsFemale, 'воительница', 'воитель' )] огромных размеров, словно редкий и внушающий ужас огр."
 nick_wolf_friend:0 "[Select_CString(CHARACTER.IsFemale, 'Подруга Волка', 'Друг Волка' )]"
 nick_wolf_friend_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], по слухам, преломляет хлеб с друзьями Фен'Харела."
 nick_red_hammer:0 "Красный Молот"
 nick_red_hammer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] однажды в одиночку [Select_CString(CHARACTER.IsFemale, 'одолела', 'одолел' )] двух танов, сокрушив им черепа своим боевым молотом и окрасив его кровью."
 nick_great_fang:0 "Великий Клык"
 nick_great_fang_desc:0 "Согласно преданиям старейшин клана, могучий Торрик однажды сразился с [Concept('archdemon','архидемоном')|E] Думатом времён Первого [Concept('blight','Мора')|E], храбро поверг Зверя и вынудил его искать новое тело. Этот подвиг принёс ему легендарное прозвище Великий Клык."
 nick_the_hunchback_of_val_royeaux:0 "[Select_CString(CHARACTER.IsFemale, 'Горбунья из Вал Руайо', 'Горбун из Вал Руайо' )]"
 nick_the_hunchback_of_val_royeaux_desc:0 "Хотя отвратительная внешность Жерара вызывает у многих отвращение, в душе он остаётся романтиком и всегда ищет истинную любовь."
 nick_spirit_king_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'объединила', 'объединил' )] долгое время разобщённые бресилианские племена в единый народ и тем [Select_CString(CHARACTER.IsFemale, 'заслужила', 'заслужил' )] вечное благословение духов на всё своё правление."
 nick_spirits_will_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'объединила', 'объединил' )] долгое время разобщённые бресилианские племена в единый народ. За неустанное почитание духов и их заветов сама Хозяйка Леса благословила [Select_CString(CHARACTER.IsLocalPlayer, 'вас', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))]."
 nick_spirits_wrath_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'объединила', 'объединил' )] долгое время разобщённые бресилианские племена в единый народ. За беспощадность, которую племена издавна считали добродетелью, [CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsFemale, 'наречена', 'наречён' )] орудием правосудия духов."
 nick_thane_of_thanes:0 "Тан танов"
 nick_thane_of_thanes_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'возвысилась', 'возвысился' )] над всеми прочими кланами и танами и теперь единолично правит детьми Тирдды."
 nick_king_of_wilds:0 "Король Диких земель"
 nick_king_of_wilds_desc:1 "Благословлён богинями Всеобщей Войны и любим хасиндским народом."
 nick_queen_of_wilds:0 "Королева Диких земель"
 nick_queen_of_wilds_desc:1 "Благословлена богинями Всеобщей Войны и любима хасиндским народом."
 nick_blood_breaker:0 "[Select_CString(CHARACTER.IsFemale, 'Крушительница Крови', 'Крушитель Крови' )]"
 nick_blood_breaker_desc:0 "Некогда [Select_CString(CHARACTER.IsFemale, 'принадлежавшая', 'принадлежавший' )] к Солнечным Волкам, Рейдар [Select_CString(CHARACTER.IsFemale, 'жаждала', 'жаждал' )] власти. [Select_CString(CHARACTER.IsFemale, 'Она попыталась', 'Он попытался' )] свергнуть родича, но потерпел поражение. Не отступив, Рейдар повёл оставшихся предателей в Хайхолд и основал клан Небесной Гончей."
 nick_master_of_the_waves:0 "[Select_CString(CHARACTER.IsFemale, 'Владычица волн', 'Владыка волн' )]"
 nick_master_of_the_waves_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [Select_CString(CHARACTER.IsFemale, 'основательница', 'основатель' )] Адмиралтейства Недремлющих островов, [Select_CString(CHARACTER.IsFemale, 'прославилась', 'прославился' )] как [Select_CString(CHARACTER.IsFemale, 'владычица', 'владыка' )] волн и торговли на Недремлющем море, связывающей острова с остальным Тедасом."
 nick_king_of_the_marshes: "Король Топей"
 nick_king_of_the_marshes_desc: "placeholder"
 nick_butcher_of_valroyeaux: "Мясник Вал Руайо"
 nick_butcher_of_valroyeaux_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'прославилась как военачальница, возглавившая', 'прославился как военачальник, возглавивший' )] армию во время печально знаменитого разграбления Вал Руайо, принёсшего городу немыслимые разрушения."
 nick_betrayer_of_the_marshes: "[Select_CString(CHARACTER.IsFemale, 'Предательница Топей', 'Предатель Топей' )]"
 nick_betrayer_of_the_marshes_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'пренебрегла', 'пренебрёг' )] волей своего народа и вновь [Select_CString(CHARACTER.IsFemale, 'присягнула', 'присягнул' )] Орлею, чем [Select_CString(CHARACTER.IsFemale, 'навлекла', 'навлёк' )] на себя гнев подданных."
 nick_father_mother_of_the_marshes: "[Select_CString(CHARACTER.IsFemale, 'Мать', 'Отец' )|U] Топей"
 nick_father_mother_of_the_marshes_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'возвела', 'возвёл' )] марешуа к власти над собственной империей, [Select_CString(CHARACTER.IsFemale, 'сбросила', 'сбросил' )] оковы прошлого и [Select_CString(CHARACTER.IsFemale, 'повела', 'повёл' )] их в будущее, навеки оставшись в памяти народа."
 nick_chosen_amongst_ciriane: "[Select_CString(CHARACTER.IsFemale, 'Избранница всех цириан', 'Избранник всех цириан' )]"
 nick_chosen_amongst_ciriane_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'победила', 'победил' )] Орлесианскую империю, а затем [Select_CString(CHARACTER.IsFemale, 'возродила', 'возродил' )] древнюю веру и культуру своего народа. За то, что [Select_CString(CHARACTER.IsFemale, 'привела', 'привёл' )] цириан к славе, [CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsFemale, 'провозглашена Избранницей', 'провозглашён Избранником' )] цириан."
 nick_the_crusted:0 "[Select_CString(CHARACTER.IsFemale, 'Покрытая Коркой', 'Покрытый Коркой' )]"
 nick_the_crusted_desc:1 "Никто не помнит, что именно покрыло коркой эту бедную душу и как это стало прозвищем. Младших Стражей, задающих такой вопрос, обычно отправляют в не самые приятные дозоры."
 nick_loyal_blade_of_orlais: "Верный Клинок Орлея"
 nick_loyal_blade_of_orlais_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'сумела', 'сумел' )] искоренить «Скрывающихся среди болот» — радикальную сепаратистскую группировку, совершившую множество диверсий, — и тем самым [Select_CString(CHARACTER.IsFemale, 'стала одной из вернейших служительниц', 'стал одним из вернейших служителей' )] Орлея."
 nick_laventurier: "[Select_CString(CHARACTER.IsFemale, 'Авантюристка', 'Авантюрист' )]"
 nick_laventurier_desc:0 "Легендарные приключения Тьерри известны по всему Орлею. Всю жизнь он собирал артефакты, исследовал руины, спасал девиц и убивал чудовищ, пренебрегая обязанностями наследника дома. После смерти отца эти обязанности легли на его младшего брата Марка."
 nick_goldsnake:0 "[Select_CString(CHARACTER.IsFemale, 'Золотая Змея', 'Золотой Змей' )]"
 nick_goldsnake_desc:0 "Андекарусом всегда двигало желание несметно разбогатеть, и ради увеличения состояния он готов на всё. Алчность и холодное сердце оставили после него ядовитое наследие."
 nick_the_she_bear:0 "Медведица"
 nick_the_she_bear_desc:0 "Мейв от рождения обладала сверхъестественным талантом к воинскому делу и невероятной стойкостью: ещё ребёнком она одолевала мальчиков вдвое крупнее себя. Теперь она выросла, достойна выйти на поле боя и готова оправдать своё прозвище."
 nick_the_silver_helm:0 "Серебряный Шлем"
 nick_the_silver_helm_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'прославилась', 'прославился' )] своим сияющим серебряным шлемом и кольчугой."
 nick_tamer_of_wilds:0 "[Select_CString(CHARACTER.IsFemale, 'Укротительница Диких земель', 'Укротитель Диких земель' )]"
 nick_tamer_of_wilds_desc:0 "Благодаря удаче и мастерству [CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsFemale, 'сумела', 'сумел' )] подчинить Лес Бресилиан и его народ настолько надолго, что [Select_CString(CHARACTER.IsLocalPlayer, 'вас', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] признали [Select_CString(CHARACTER.IsFemale, 'законной правительницей', 'законным правителем' )]. Так были укрощены и дикий лес, и его духи, и его обитатели."
 nick_spirit_binder:0 "[Select_CString(CHARACTER.IsFemale, 'Связующая Духов', 'Связующий Духов' )]"
 nick_grim_face:0 "Мрачный Лик"
 nick_the_painter:0 "[Select_CString(CHARACTER.IsFemale, 'Художница', 'Художник' )]"
 nick_the_painter_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] — [Select_CString(CHARACTER.IsFemale, 'знаменитая художница', 'знаменитый художник' )]. [Select_CString(CHARACTER.IsFemale, 'Она известна', 'Он известен' )] картиной, на которой [andraste|E] изображена рядом со своим другом-[Concept('elvhen','элвеном')|E] Шартаном и другими учениками; впоследствии это изображение воспроизвели над дверями церкви при Университете Орлея."
 nick_the_ash_prophet:0 "[Select_CString(CHARACTER.IsFemale, 'Пророчица Пепла', 'Пророк Пепла' )]"
 nick_the_ash_prophet_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'объединила', 'объединил' )] сандренцев и [Select_CString(CHARACTER.IsFemale, 'повела', 'повёл' )] их за пределы Моря Пепла, ибо все должны узреть мудрость, сокрытую в его священной земле."
 nick_the_strange:0 "[Select_CString(CHARACTER.IsFemale, 'Странная', 'Странный' )]"
 nick_the_strange_desc:0 "Когда Йеввен впервые покинул крепость, чтобы встретиться с любимым народом, подданные сочли его диковинным существом из-за необычной внешности, чем глубоко его опечалили."
 nick_the_mountain:0 "Гора"
 nick_mother_of_knives:0 "Мать Ножей"
 nick_mother_of_knives_desc:0 "Зловещая репутация Арианни и её непревзойдённый талант к интригам не раз помогали ей добиться своего. Поэтому никто не удивился, когда двое её старших детей пошли тем же кровавым путём."
 nick_the_magnificent_desc:0 "О [Select_CString( CHARACTER.IsLocalPlayer, 'ваших', CHARACTER.GetHerHis)] великолепных деяниях рассказывают от Ферелдена до Пар-Лади."
 nick_harellan:0 "Хареллан"
 nick_harellan_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'объявлена предательницей', 'объявлен предателем' )] своих [Concept('elvhen','сородичей-элвенов')|E] за свои поступки. Ни при жизни, ни после смерти [Select_CString(CHARACTER.IsLocalPlayer, 'вас', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] не ждёт ничего хорошего."
 nick_flat_ear:0 "[Select_CString(CHARACTER.IsFemale, 'Плоскоухая', 'Плоскоухий' )]" #elves only
 nick_the_wolf_of_the_lowlands:0 "[Select_CString(CHARACTER.IsFemale, 'Волчица Низин', 'Волк Низин' )]"
 nick_flat_ear_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], к несчастью, [Select_CString(CHARACTER.IsFemale, 'известна', 'известен' )] своей любовью к человеческим обычаям."
 nick_maker_of_silence:0 "[Select_CString(CHARACTER.IsFemale, 'Создательница Тишины', 'Создатель Тишины' )]"
 nick_maker_of_silence_desc:0 "В народе ходит множество слухов о [CHARACTER.GetShortUINameNoTooltipNoFormat]: после провалившегося расследования в приюте Дюкарма многие люди из [Select_CString(CHARACTER.IsLocalPlayer, 'вашего', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] окружения либо загадочно притихли, либо вовсе исчезли."
 nick_ir_mi_din_an:0 "Ir Mi'din'an"
 nick_wild_one:0 "[Select_CString(CHARACTER.IsFemale, 'Дикарка', 'Дикарь' )]" #placeholder
 nick_battle_roar:0 "Боевой Клич" #placeholder
 nick_storm_maiden:0 "Дева Бури" #placeholder
 nick_bolt_arrow:0 "Стрела-Молния" #placeholder
 nick_iron_mane:0 "Железная Грива" #placeholder
 nick_snow_favored:0 "[Select_CString(CHARACTER.IsFemale, 'Любимица Снега', 'Любимец Снега' )]"
 nick_snow_favored_desc:0 "Ведомый Кортом, Ивар увёл свой народ от войны и лишений и положил начало новой жизни. В честь видения, спасшего их, был основан клан Каменного Медведя." #placeholder desc
 nick_brave_axe:0 "Храбрая Секира" #placeholder
 nick_cold_whisper:0 "Холодный Шёпот" #placeholder
 nick_regalia_restorer:0 "[Select_CString(CHARACTER.IsFemale, 'Восстановительница Регалий', 'Восстановитель Регалий' )]"
 nick_regalia_restorer_desc:0 "[ROOT.GetShortUINameNoTooltipNoFormat|U] [Select_CString(ROOT.Char.IsFemale, 'прославилась', 'прославился' )] тем, что [Select_CString(ROOT.Char.IsFemale, 'вернула', 'вернул' )] артефакты, рассеянные во время разграбления Вал Руайо. Благодаря этому гробница Помазанника восстановлена и вновь сияет прежним великолепием."
# CREDIT TO EK2 FOR LETTING US USE THEIR LINE_OF_X!! THANK YOU GUYS
 nick_line_of:0 "Род"
 nick_line_of_desc:0 "Этот персонаж олицетворяет долгую череду правителей, ведущих свой род от [CHARACTER.GetShortUINameNoTooltipNoFormat]."