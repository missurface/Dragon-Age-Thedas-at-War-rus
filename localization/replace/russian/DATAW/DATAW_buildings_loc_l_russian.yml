 ### Southern_Monastery
 building_type_southern_monastery_01: "Великий южный монастырь"
 building_southern_monastery_01: "Монастырь Южного рубежа"
 building_southern_monastery_01_desc: "Этот монастырь возвели во славу [Concept('maker','Создателя')|E] на самом дальнем рубеже [Concept('thedas','Тедаса')|E]. Несмотря на уединённость, церковь глубоко уважают и любят во всём регионе. Для многих местных жителей она служит истоком веры: они клянутся ей в верности и осуждают всякого, кому недостаёт благочестия."
 southern_monastery_desc_01: "Сопротивление обращению: +15%"
 building_southern_monastery_02: "Священное хранилище писаний Верховных Жриц"
 building_southern_monastery_02_desc: "Некогда скромный и неприметный монастырь обрёл более высокое предназначение: хранить писания Верховных Жриц Вал Руайо. Здесь бережно собирают и изучают их труды — от Джустинии I до нынешней Верховной Жрицы. Монастырь стал уважаемым и редким центром богословских споров, а работающие в нём учёные способствуют техническому и общественному прогрессу."
 southern_monastery_desc_02: "Сопротивление обращению: +25%"
 STEWARD_PROMOTE_RELIGION_BUILDING_PENALTY: "Сопротивление обращению от здания"

 ### White Deer Mountain
 building_type_deer_mountain_01: "Гора Белого Оленя"
 building_deer_mountain_01: "Гора Белого Оленя"
 building_deer_mountain_01_desc: "Гора Белого Оленя получила название благодаря древней легенде неизвестного происхождения. Она повествует о белом олене, который пришёл к заблудившемуся в горах ребёнку и вывел его к племени. Но когда олень приблизился, люди пронзили его сердце, возжелав мяса. Разгневанный такой жестокостью, он отказался умирать и убежал с зияющей раной в груди. Был ли это один из потерянных галл эльфов или, как утверждают некоторые, авварский бог — неизвестно. Несомненно одно: охота здесь богата, и порой охотники встречают одинокого белого оленя с огромным шрамом у самого сердца. Сколько бы раз его ни сражали, он неизменно возвращается."
 deer_mountain_desc_01: "Бонусы к охоте в этом баронстве.\nПовышена вероятность обнаружить белого оленя."
 activity_hunt_province_desc_deer_mountain: "#P ++ $building_type_deer_mountain_01$#! ([building|E])\n"

 ### Halla Vhenasan
 building_type_halla_vhenasan_01: "Галла Венасан"
 building_type_halla_vhenasan_01_desc: "Святилище для галл в Долах."
 building_halla_vhenasan_01: "Галла Венасан"
 building_halla_vhenasan_01_desc: "Последователи эванурисов верят, что именно в этом святилище Гиланнайн создала галл — прекрасных существ, столь полезных в повседневной жизни. Каждый день прохожие с радостью наблюдают за многочисленными стадами галл, бродящими по небольшой поляне."
 building_halla_vhenasan_02: "Храм Галла Венасан"
 building_halla_vhenasan_02_desc: "Часть леса расчистили, и теперь на краю поляны Галла Венасан возвышается пышно украшенный небольшой храм, возведённый в характерном долийском стиле по образцу Арлатана. Он посвящён Гиланнайн, Матери галл. Несколько человек поселились рядом с храмом, чтобы ухаживать за галлами, к великой радости местных жителей."
 ### Aeonar
 building_type_aeonar_01: "Руины Эонара"
 building_type_aeonar_01_desc: "Эонар, расположенный у северной оконечности Имперского тракта, был одной из двух башен, построенных Тевинтерской империей до Первого Мора для магических опытов и исследований. Когда Империю облетела весть о гибели пророчицы Андрасте, её последователи захватили башню и перебили находившихся внутри магов. Из-за экспериментов и резни Завеса здесь опасно истончилась."
 building_aeonar_01: "Руины Эонара"
 building_aeonar_01_desc: "Эонар, расположенный у северной оконечности Имперского тракта, был одной из двух башен, построенных Тевинтерской империей до Первого Мора для магических опытов и исследований. Когда Империю облетела весть о гибели пророчицы Андрасте, её последователи захватили башню и перебили находившихся внутри магов. Из-за экспериментов и резни Завеса здесь опасно истончилась."
 building_aeonar_02: "Башня Эонар"
 building_aeonar_02_desc: "Эонар, расположенный у северной оконечности Имперского тракта, был одной из двух башен, построенных Тевинтерской империей до Первого Мора для магических опытов и исследований. Теперь башня находится под твёрдым контролем Церкви, а её местоположение известно лишь немногим иерархам Церкви и ордена храмовников. Храмовники используют Эонар как тюрьму для обвинённых в магии крови, отступников и даже помогавших им простых людей. Из-за истончённой Завесы башня служит «испытанием огнём», призванным установить вину магов."