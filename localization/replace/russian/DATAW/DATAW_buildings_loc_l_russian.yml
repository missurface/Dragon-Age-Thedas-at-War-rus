l_russian:
 NOT_holy_site_andrastian_trigger: "Владелец должен быть андрастианином или считать это [holy_site|E]"
 
 ### Adamant Fortress
 building_type_adamant_fortress_01: "Крепость Адамант"
 building_type_adamant_fortress_01_desc: "$building_adamant_fortress_01_desc$"
 building_adamant_fortress_01: "Крепость Адамант"
 building_adamant_fortress_01_desc: "Построенная [Concept('dwarves','гномами')|E], чтобы охранять Бездонную пропасть в самом сердце Западного предела, эта крепость сыграла важнейшую роль в обороне [Concept('grey_warden','Серых Стражей')|E] от [Concept('darkspawn','порождений тьмы')|E] во время Второго [Concept('blight','Мора')|E]. Возведенные на века вопреки суровым пескам, ее стены выглядят скорей прочными, чем высокими, но они гарантируют, что цитадель была и останется великим оборонительным рубежом."
 building_adamant_fortress_02: "Обновленная крепость Адамант"
 building_adamant_fortress_02_desc: "Ныне обновленные с использованием новых технологий, стены стали куда выше и крепче прежнего, укрепленные как традиционными материалами, так и [Concept('dataw_magic','магией')|E]. Вдвое больше и вдвое надежнее, крепость Адамант теперь возвышается как величайший бастион над Бездонной пропастью, готовый защитить весь Западный предел и земли за его пределами от [Concept('darkspawn','порождений тьмы')|E]."
 ### Andoral's Reach
 building_type_andorals_reach_01: "Предел Андорала"
 building_type_andorals_reach_01_desc: "Предел Андорала был могучей тевинтерской крепостью, построенной для охраны северного тракта, ведущего в Империю из Орлея. Разрушенная Священным походом Андрасте века назад, она находится на стратегическом перекрестке между северным и южным Тедасом."
 building_andorals_reach_01: "Предел Андорала (руины)"
 building_andorals_reach_01_desc: "Осыпающиеся камни этой некогда величественной тевинтерской крепости ныне служат памятником прошлому, разбитым свидетельством давних времен. Купольный шпиль сброшен вниз, двойной донжон оплетен лозами, а в темноте устраивают логова волки. И все же, несмотря на разрушения, причиненные аламарри, стены остаются упрямым препятствием для любого захватчика и желанным бастионом для защитников. Приложив немало трудов и монет, эту твердыню можно восстановить."
 building_andorals_reach_02: "Предел Андорала (восстановленный)"
 building_andorals_reach_02_desc: "То, что было разрушено, обрело новую жизнь. Каменная кладка восстановлена, внутренний двор перестроен и заново вымощен. Донжоны отремонтированы и снабжены стрелами, клинками замковой ковки и хорошей броней. Внушительные тевинтерские проекты все еще держат удар, и теперь эта крепость стоит как почти неприступный страж севера. Имеющий тяжелый гарнизон и богатые припасы, Предел Андорала снова служит щитом северного Орлея — грозный, суровый и готовый не пасть никогда."
 building_andorals_reach_03: "Предел Андорала (великолепный)"
 building_andorals_reach_03_desc: "Прежде этот бастион был лишь щитом. Где раньше волки выходили на охоту, теперь воины этой внушительной цитадели совершают вылазки, чтобы господствовать над окрестными землями. Каждый коридор и залу наполняет жизнь: солдаты приходят и уходят, вестовые скачут во весь опор от ворот. Современные проекты дополняют и без того внушительную оборону: барбаканы и дополнительные башни превращают расстрельное пространство за стенами в край смерти и агонии. Трудами и золотом многих поколений Предел Андорала превратился в одну из самых впечатляющих крепостей Тедаса — Башню Орлея."
 ### Brasiers of Val Montaigne
 building_type_brasiers_val_montaigne_01: "Жаровни Валь Монтен"
 building_type_brasiers_val_montaigne_01_desc: "Построенный давным-давно основателем рода Бланшар, замок Валь Монтен стоит как памятник старинной сирианской архитектуры, а его ухоженные стены все еще способны с легкостью выдержать осаду. Однако привлекают внимание три жаровни, горящие в любое время суток, чтобы направлять корабли озера Селестина к Валь Монтену и охранять устье реки. Ныне ассоциируемые с [Concept('maker','Создателем')|E], эти огни, как говорят, должны погаснуть только в самый темный час Монтена — традиция, сохраняющаяся со времен снятия осады Валь Монтена в разгар Второго [Concept('blight','Мора')|E]."
 building_brasiers_val_montaigne_01: "Три жаровни Валь Монтен"
 building_brasiers_val_montaigne_01_desc: "Построенный давным-давно основателем рода Бланшар, замок Валь Монтен стоит как памятник старинной сирианской архитектуры, а его ухоженные стены все еще способны с легкостью выдержать осаду. Однако привлекают внимание три жаровни, горящие в любое время суток, чтобы направлять корабли озера Селестина к Валь Монтену и охранять устье реки. Ныне ассоциируемые с [Concept('maker','Создателем')|E], эти огни, как говорят, должны погаснуть только в самый темный час Монтена — традиция, сохраняющаяся со времен снятия осады Валь Монтена в разгар Второго [Concept('blight','Мора')|E]."
 building_brasiers_val_montaigne_02: "Пламенеющая крепость Валь Монтен"
 building_brasiers_val_montaigne_02_desc: "Древние стены, перестроенные под требования нового века, стали прочнее, чем когда-либо, однако внимание людей по-прежнему приковано к жаровням. Перестроенные и приспособленные гореть ярче, дольше и во всех направлениях, они стали монументом Андрастианизму, о котором древние сириане могли только мечтать, а также благословением для мореплавателей."
 ### Brecilian Ruins
 building_type_brecilian_ruins_01: "Бресилианские руины"
 building_type_brecilian_ruins_01_desc: "Древние руины, оставленные Тевинтерской Империей во времена ее былого величия — остатки великой крепости, заложенной для лучшего контроля над бурлящим Лесом. Сегодня от крепости мало что осталось, а ценность ее заключается исключительно в магических свойствах, оборонительных позициях и утраченных знаниях, которые местное население переоткрывает шаг за шагом."
 building_brecilian_ruins_01: "Тевинтерские руины"
 building_brecilian_ruins_01_desc: "Древние руины, оставленные Тевинтерской Империей во времена ее былого величия — остатки великой крепости, заложенной для лучшего контроля над бурлящим Лесом. Сегодня от крепости мало что осталось, а ценность ее заключается исключительно в магических свойствах, оборонительных позициях и утраченных знаниях, которые местное население переоткрывает шаг за шагом."
 building_brecilian_ruins_02: "Перестроенные тевинтерские руины"
 building_brecilian_ruins_02_desc: "Древние руины, оставленные Тевинтерской Империей во времена ее былого величия — это остатки великой крепости, заложенной для контроля над бурлящим Лесом. Сегодня, хотя они и были восстановлены до функционального состояния, им далеко до чуда, которым они были когда-то. Тем не менее их система обороны, магическая энергия и древние знания делают это место стратегической крепостью региона."
 building_brecilian_ruins_03: "Восстановленные тевинтерские руины"
 building_brecilian_ruins_03_desc: "Бывшие древние руины, оставленные Тевинтерской Империей во времена ее былого величия, Бресилианская крепость представляет собой мощное fortification-сооружение, заложенное для контроля над бурлящим лесом. Ныне восстановленная во всем блеске, крепость величественно возвышается над окружающими дебрями, бросая вызов региону, который так долго поглощал ее. Ее оборона, магическая энергия и забытые знания делают ее стратегической цитаделью, а масштабы и грандиозная архитектура превращают крепость в обитель, достойную могущественнейших королей."
 ### Castle Redcliffe
 building_type_castle_redcliffe: "Замок Редклифф"
 building_type_castle_redcliffe_desc: "Замок Редклифф — первая и последняя линия обороны на единственном сухопутном пути в Ферелден. Эта страна никогда не падала перед силой, которая предварительно не захватила бы Редклифф. Защищаемая им деревня удачно расположена возле горного перевала, ведущего к Орзаммару и орлесианской границе, а потому служит центром внешней торговли."
 building_castle_redcliffe: "$building_type_castle_redcliffe$"
 building_castle_redcliffe_desc: "$building_type_castle_redcliffe_desc$"
 ### Cendrerin Trading market
 building_type_cendrein_market_01: "Торговый рынок сандрене"
 building_cendrein_opinion: "Мнение [cendrein|E]"
 building_cendrein_market_01: "Торговый рынок сандрене"
 building_cendrein_market_01_desc: "Благодаря постоянным контактам с сандрене Пепельного моря в регионе образовался небольшой рынок. Кочевники продают здесь всё: от знаменитого рыбного соуса сандрене до самых редких металлов и минералов, добытых в горах, чтобы купить ценные товары, недоступные в других местах. Некоторые сандрене даже покидают свои племена, чтобы осесть в Орлее."
 building_cendrein_market_02: "Базар сандрене"
 building_cendrein_market_02_desc: "Благодаря притоку средств маленький рынок превратился в крупный базар, куда приходят множество племен для торговли товарами со всего [thedas|E]. Они продают серу, рыбу и множество других продуктов из удивительно богатого Пепельного моря. Некоторые сандрене окончательно осели в регионе ради торговли."
 building_cendrein_market_03: "Квартал сандрене"
 building_cendrein_market_03_desc: "С ростом присутствия сандрене благодаря торговле и расселению, для этих кочевников был выделен отдельный квартал. Это невероятно помогает в торговле с племенами Пепельного моря, а также дает кров значимому меньшинству жителей-сандрене. Впрочем, некоторые сандрене скучают по кочевой жизни и отправляются странствовать по всему [Concept('thedas','Тедасу')|E]."
 cendrein_market_01: "Время от времени будут прибывать гости-сандрене."
 cendrein_market_02: "Время от времени будут прибывать придворные-сандрене."
 cendrein_market_03: "Время от времени будут прибывать придворные и искатели приключений из числа сандрене."
 dataw_events_gamord.0072.t: "Торговец-сандрене добивается влияния в Лисьер-де-Сандр."
 dataw_events_gamord.0072.desc: "[cendrerin_merchant.GetHerHis|U] присоединяется к вашему двору."
 dataw_events_gamord.0073.t: "Искатель приключений сандрене отправляется в путь."
 dataw_events_gamord.0073.desc: "[cendrerin_merchant.GetShortUIName|U] собирает отряд искателей приключений."
 ### Chantry of Montsimmard
 building_type_olessa_chantry_01: "Церковь Монтсиммара"
 building_type_olessa_chantry_01_desc: "Эта церковь была построена вскоре после основания Орлесианской Церкви Кордилиусом Драконом. Местоположение церкви считается точным местом рождения Олессы из Монтсиммара, позже ставшей самой первой [Concept('divine','Верховной Жрицей')|E] под именем Джустиния. Каждый кирпич и каждая статуя здесь посвящены Первой [Concept('divine','Верховной Жрицей')|E], а само здание повествует о Жрице-Воительнице и привлекает паломников со всего [Concept('thedas','Тедаса')|E]."
 building_olessa_chantry_01: "Церковь Олессы из Монтсиммара"
 building_olessa_chantry_01_desc: "Эта церковь была построена вскоре после основания Орлесианской Церкви Кордилиусом Драконом. Местоположение церкви считается точным местом рождения Олессы из Монтсиммара, позже ставшей самой первой [Concept('divine','Верховной Жрицей')|E] под именем Джустиния. Каждый кирпич и каждая статуя здесь посвящены Первой [Concept('divine','Верховной Жрицей')|E], а само здание повествует о Жрице-Воительнице и привлекает паломников со всего [Concept('thedas','Тедаса')|E]."
 ### Château Klay
 building_type_klay_castle_01: "Шато Клей"
 building_type_klay_castle_01_desc: "$building_klay_castle_01_desc$"
 building_klay_castle_01: "Шато Клей"
 building_klay_castle_01_desc: "Шато Клей славится по всему Орлею своей архитектурой. Построенное из великолепного белого мрамора, лучшего стекла, произведенного в Серо, и чудесной древесины из Тирашана, шато считается последним оплотом настоящей и честной цивилизации на западном рубеже Орлея, повышая престиж своих владельцев."
 building_type_klay_castle_02: "$building_type_klay_castle_01$"
 building_type_klay_castle_02_desc: "$building_klay_castle_02_desc$"
 building_klay_castle_02: "Конюшни Шато Клей"
 building_klay_castle_02_desc: "Шато Клей славится по всему Орлею своей архитектурой, созданной из лучших материалов со всех уголков страны. Как само шато, так и его конюшни, выведение и разведение породистых серых верховых лошадей принесли этому месту славу благодаря прекрасным коням, поддерживая репутацию «островка настоящей цивилизации к западу от варварских болот»."
 building_type_klay_castle_03: "$building_type_klay_castle_01$"
 building_type_klay_castle_03_desc: "$building_klay_castle_03_desc$"
 building_klay_castle_03: "Великие конюшни Шато Клей"
 building_klay_castle_03_desc: "Шато Клей славится по всему Орлею своей архитектурой и конюшнями, построенными из лучшего мрамора и дерева, какие только можно купить за деньги. Серые верховые лошади, выращенные в Великих конюшнях Шато Клей, известны во всем Орлее и используются видными шевалье. Каждый, кто посетил Альон, поет хвалу красоте Шато Клей, из-за чего оно кажется затерянным раем среди диких земель Запада."
 ### Château of Serault
 building_type_serault_castle_01: "Шато Серо"
 building_type_serault_castle_01_desc: "Во всем Орлее нет ничего похожего на Шато Серо! В замке триста двадцать семь окон (хотя молва преувеличивает их число до тысячи) и достаточно изысканного стекла, чтобы выкупить целый вольный город. Это удаленное, но укрепленное место. Шато стоит на острове посреди реки. Мост Масок — единственный путь на восток к городу Серо, а Зеленый мост ведет на запад, к лесу."
 building_serault_castle_01: "$building_type_serault_castle_01$"
 building_serault_castle_01_desc: "$building_type_serault_castle_01_desc$"
 building_type_serault_castle_02: "$building_type_serault_castle_01$"
 building_type_serault_castle_02_desc: "«Плата стеклом» всегда была девизом дома де Серо, и еще никогда он не был так уместен. Стеклодувов Серо теперь держат в золотой клетке, ограничивая их передвижения, ведь они — жизненная сила экономики Серо и его великолепных новых стеклодувных мастерских. Доходы от их труда позволили еще сильнее укрепить шато от угроз — как от людей, так и от тех, что таятся в лесной чаще."
 building_serault_castle_02: "$building_type_serault_castle_01$"
 building_serault_castle_02_desc: "$building_type_serault_castle_02_desc$"
 building_type_serault_castle_03: "$building_type_serault_castle_01$"
 building_type_serault_castle_03_desc: "Город Серо процветает! Богатства, приносимые стеклодувными мастерскими, привели к новому росту пограничного поселения, а также к созданию торгового порта на реке."
 building_serault_castle_03: "$building_type_serault_castle_01$"
 building_serault_castle_03_desc: "$building_type_serault_castle_03_desc$"
 ### Ciriane Frontier Outpost
 building_type_ciriane_frontier_outpost_01: "Аванпосты"
 building_type_ciriane_frontier_outpost_01_desc: "$building_ciriane_frontier_outpost_01_desc$"
 building_ciriane_frontier_outpost_01: "Наблюдательный аванпост"
 building_ciriane_frontier_outpost_01_desc: "Наблюдательный аванпост, построенный на опушке леса Тирашан. Этот военный объект используется разведчиками как для оттачивания навыков маскировки, так и для наблюдения за коварным и таинственным лесом."
 building_type_ciriane_frontier_outpost_02: "$building_type_ciriane_frontier_outpost_01$"
 building_type_ciriane_frontier_outpost_02_desc: "$building_ciriane_frontier_outpost_02_desc$"
 building_ciriane_frontier_outpost_02: "Сеть усадеб-аванпостов Тирашана"
 building_ciriane_frontier_outpost_02_desc: "Бывший простой наблюдательный аванпост для подготовки разведчиков на краю Тирашана превратился в сеть усадеб, расположенных на опушке и даже в глубине коварного леса. Здесь обрабатывают землю, занимаются деревообработкой и фермерством на пользу землевладельцев. Эта сеть, где время от времени кто-то загадочно исчезает, стала отличной базой для подготовки умелых разведчиков благодаря действующему старому аванпосту."
 ### Town of Gwaren
 building_type_gwaren_special_building_02: "$building_gwaren_special_building_02$"
 building_type_gwaren_special_building_02_desc: "$building_gwaren_special_building_02_desc$"
 building_gwaren_special_building_02: "Городок Гварен"
 building_gwaren_special_building_02_desc: "Благодаря возобновлению торговли с клейн, Гварен, став скромным городком, начинает медленное возвращение к былому величию. Вновь построенные палисады снова защищают город, и с каждым днем в гавани швартуется все больше кораблей. Тем не менее руины все еще окружают окраины, а полуразрушенные остатки зданий усеивают город — ему все еще далеко до Гварена былых времен."
 ### City of Gwaren
 building_type_gwaren_special_building_03: "$building_gwaren_special_building_03$"
 building_type_gwaren_special_building_03_desc: "$building_gwaren_special_building_03_desc$"
 building_gwaren_special_building_03: "Город Гварен"
 building_gwaren_special_building_03_desc: "С постройкой полноценных оборонительных сооружений и расширением торговых путей этот растущий экономический центр вновь превратился в настоящий город. Сюда прибывает больше суден, людей и товаров, чем когда-либо прежде. Поговаривают, что некоторые гномы даже вернулись в город для торговли, к огромной радости местных жителей."
 ### City of Seas
 building_city_of_seas_01: "Великий порт Адмиралтейства"
 building_city_of_seas_01_desc: "Великий порт Адмиралтейства — символ возрождения архипелага с его оживленными доками, рынками и чудесной архитектурой, вдохновленной миром за его пределами, что выделяет его на фоне остальной части острова. В этом порту можно найти товары даже из Пар Воллена, а их разнообразие станет еще шире, если заглянуть на огромный черный рынок, доминирующий в экономике порта — наследие прошлого Предела Бранделя."
 building_type_city_of_seas_01: "$building_city_of_seas_01$"
 building_type_city_of_seas_01_desc: "$building_city_of_seas_01_desc$"
 ### Cliffbreaker Waterfall
 building_type_hrimwudu_waterfall_01: "Водопад Скалолом"
 building_type_hrimwudu_waterfall_01_desc: "Названный «Скалоломом» древними кланами авваров, впервые заселившими эту долину, этот водопад берет начало на вершине великого утеса высоко в Морозных горах и устремляется в долину, снабжая водой цивилизацию и местную фауну. Из-за этого местные всегда считали его символом и причиной успеха своих поселений."
 building_hrimwudu_waterfall_01: "Водопад Скалолом"
 building_hrimwudu_waterfall_01_desc: "Названный «Скалоломом» древними кланами авваров, впервые заселившими эту долину, этот водопад берет начало на вершине великого утеса высоко в Морозных горах и устремляется в долину, снабжая водой цивилизацию и местную фауну. Из-за этого местные всегда считали его символом и причиной успеха своих поселений."
 ### Dragon Hunting Guild
 building_type_dragon_hunters_01: "Гильдия охотников на драконов"
 building_type_dragon_hunters_01_desc: "$building_dragon_hunters_01$"
 building_dragon_hunters_01: "Малая гильдия охотников на драконов"
 building_dragon_hunters_01_desc: "Построенная в конце Древнего века во время всплеска активности [Concept('dragon','драконов')|E], знаменитая Гильдия охотников на драконов местно известна в Орлее и близлежащей Неварре, несмотря на скромные размеры, своими многочисленными прославленными охотниками на [Concept('dragon','драконов')|E], состоящими в основном из неварранцев и жителей Перендейла. В перерывах между охотой на драконов эти мастера развлекают местных жителей историями и охотятся на обычных, но все же опасных зверей."
 dragon_hunters_01_cheaper_hunt_cost_desc: "$building_dragon_hunters_01$"
 building_dragon_hunters_02: "Великая гильдия охотников на драконов в Перендейле"
 building_dragon_hunters_02_desc: "Получив надлежащее снаряжение и место для работы, Гильдия охотников на драконов теперь славится от Мон-де-Глас до Эйсли за счет своих мастеров, убивающих драконов, порождений тьмы и виверн. Один из главных трюков гильдии против агрессивных зверей — использование чертовых местных козлов в качестве приманки, к огромной радости местных жителей, терпеть не могущих этих проклятых тварей."
 dragon_hunters_02_cheaper_hunt_cost_desc: "$building_dragon_hunters_02$"
 dragon_hunters_activity_desc: "Значительно повышает шанс появления опасных животных и снижает стоимость проведения [Concept('activity', 'занятий')|E] «[GetActivityType('activity_hunt').GetName]» в этом [Concept('holding','владении')|E], а [Concept('characters','персонажи')|E] чаще получают [Concept('traits','свойства')|E] «[GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]»"
 ### Dubuef Vineyards
 building_type_dubuef_vineyards_01: "Виноградники Дюбёфа"
 building_type_dubuef_vineyards_01_desc: "Дюбёф славится разведением быков — до такой степени, что это занятие дало 'бычьи' названия соседним регионам, таким как соседний город Валь Торо. Однако скотоводство — лишь часть того, что дает Дюбёфу богатство и престиж: главное — это его вино. На почве, неустанно обрабатываемой быками, вино приобретает глубокий красный цвет и насыщенный терпкий вкус с нотками корицы, из-за чего оно горячо любимо знатью как особое лакомство."
 building_dubuef_vineyards_01: "Виноградники Дюбёфа"
 building_dubuef_vineyards_01_desc: "Дюбёф славится разведением быков — до такой степени, что это занятие дало 'бычьи' названия соседним регионам, таким как соседний город Валь Торо. Однако скотоводство — лишь часть того, что дает Дюбёфу богатство и престиж: главное — это его вино. На почве, неустанно обрабатываемой быками, вино приобретает глубокий красный цвет и насыщенный терпкий вкус с нотками корицы, из-за чего оно горячо любимо знатью как особое лакомство."
 building_dubuef_vineyards_02: "Вечные виноградники Дюбёфа"
 building_dubuef_vineyards_02_desc: "Переход на севооборот, расширение площадей и новое оборудование позволили быкам работать эффективнее, чем когда-либо. Производство вина выросло десятикратно на радость восхищенной знати, которая теперь бесперебойно снабжается прекрасным терпким «Бычьим вином»."
 building_dubuef_vineyards_03: "Крытые виноградники Дюбёфа"
 building_dubuef_vineyards_03_desc: "Выполнив гигантскую задачу по накрытию полей стеклянным потолком, который можно открывать для дождя, в Дюбёфе совершили невозможное: научились выращивать виноград зимой. Это «морозное вино», как его стала называть знать, теперь регулярно появляется на столах Валь Руайо и других великих столиц. Даже крестьяне начали копить заработанные деньги, чтобы достать бутылку этого сорта, выросшего вопреки стихиям благодаря стеклянному куполу."
 ### Ducarme Orphanage
 building_type_ducarme_orphanage: "Приют Дюкарма"
 building_type_ducarme_orphanage_desc: "Официально известный как «Приют Дюкарма для долийских детей», этот институт был основан в 1:97 века Век Священных фанатичным архитектором по имени Робер Дюкарм, провозгласившим себя «Слугой воли Верховной Жрицы» (хотя ни одна [Concept('divine','Верховной Жрицей')|E] никогда не комментировала существование приюта).\n\nНоминально находясь под властью Орлесианской Церкви, члены приюта поставили своей целью воспитывать сирот-долийцев в веру в [maker|E] и обычаи Орлея, вдали от их языческих богов. Однако о заведении ходят мрачные слухи, подогреваемые нежеланием администрации давать информацию о своей работе.\n\nНесмотря на слухи и призывы к расследованию, руководство молчит, и достоверно известно лишь одно: [elves|E], достигшие возраста выхода из приюта, никогда не покидали этот регион."
 building_ducarme_orphanage: "Приют Дюкарма"
 building_ducarme_orphanage_desc: "Официально известный как «Приют Дюкарма для долийских детей», этот институт был основан в 1:97 века Век Священных фанатичным архитектором по имени Робер Дюкарм, провозгласившим себя «Слугой воли Верховной Жрицы» (хотя ни одна [Concept('divine','Верховной Жрицей')|E] никогда не комментировала существование приюта).\n\nНоминально находясь под властью Орлесианской Церкви, члены приюта поставили своей целью воспитывать сирот-долийцев в веру в [maker|E] и обычаи Орлея, вдали от их языческих богов. Однако о заведении ходят мрачные слухи, подогреваемые нежеланием администрации давать информацию о своей работе.\n\nНесмотря на слухи и призывы к расследованию, руководство молчит, и достоверно известно лишь одно: [elves|E], достигшие возраста выхода из приюта, никогда не покидали этот регион."
 building_type_verchiel_orphanage: "Приют Вершиэля"
 building_type_verchiel_orphanage_desc: "Ранее известный как Приют Дюкарма для долийских детей, этот институт был основан в 1:97 века Священных архитектором Робером Дюкармом. С тех пор как чудовищные слухи о методах приюта подтвердились, заведение перешло под официальный контроль и было переименовано в «Приют Вершиэля для долийских детей»."
 building_verchiel_orphanage: "Приют Вершиэля"
 building_verchiel_orphanage_desc: "Ранее известный как Приют Дюкарма для долийских детей, этот институт был основан в 1:97 века Священных архитектором Робером Дюкармом. С тех пор как чудовищные слухи о методах приюта подтвердились, заведение перешло под официальный контроль и было переименовано в «Приют Вершиэля для долийских детей»."
 building_type_destroyed_ducarme_orphanage: "Разрушенный приют Дюкарма"
 building_type_destroyed_ducarme_orphanage_desc: "То малое, что осталось от Приюта Дюкарма для долийских детей, уничтоженного, когда правда о методах заведения выплыла наружу. Хотя люди рады, что это клеймо было стерто с лица земли, оно оставило шрам, который еще предстоит залечить. Возможно, со временем и инвестициями новая постройка затмит то, что приносил запятнанный приют."
 building_destroyed_ducarme_orphanage: "Разрушенный приют Дюкарма"
 building_destroyed_ducarme_orphanage_desc: "То малое, что осталось от Приюта Дюкарма для долийских детей, уничтоженного, когда правда о методах заведения выплыла наружу. Хотя люди рады, что это клеймо было стерто с лица земли, оно оставило шрам, который еще предстоит залечить. Возможно, со временем и инвестициями новая постройка затмит то, что приносил запятнанный приют."
 building_type_ducarme_elf_neighbourhood: "Эльфийский квартал Дюкарма"
 building_type_ducarme_elf_neighbourhood_desc: "Рожденный на месте зверств Приюта Дюкарма и благодаря его эльфийским воспитанникам, этот квартал стал одним из редких мест, где между расами установилось хотя бы частичное равенство. Работа, праздники и даже молебны проходят при совместном участии людей и эльфов — к удивлению и часто презрению со стороны большей части [thedas|E]."
 building_ducarme_elf_neighbourhood: "Эльфийский квартал Дюкарма"
 building_ducarme_elf_neighbourhood_desc: "Рожденный на месте зверств Приюта Дюкарма и благодаря его эльфийским воспитанникам, этот квартал стал одним из редких мест, где между расами установилось хотя бы частичное равенство. Работа, праздники и даже молебны проходят при совместном участии людей и эльфов — к удивлению и часто презрению со стороны большей части [thedas|E]."
 building_type_ducarme_massacre_memorial: "Мемориал резни в приюте Дюкарма"
 building_type_ducarme_massacre_memorial_desc: "Эльфийская статуя, найденная среди великого андрастианского кладбища, может вызвать замешательство, но эта история — о памяти. Статуя, изображающая эльфийского воина, разрывающего цепи сироты, символизирует освобождение детей из приюта Дюкарма, который был разрушен за свои преступления против потомков Арлатана. Под статуей высечена надпись: «Vir Sulahn Var Revas» — «Мы поем о нашей свободе»."
 building_ducarme_massacre_memorial: "Мемориал резни в приюте Дюкарма"
 building_ducarme_massacre_memorial_desc: "Эльфийская статуя, найденная среди великого андрастианского кладбища, может вызвать замешательство, но эта история — о памяти. Статуя, изображающая эльфийского воина, разрывающего цепи сироты, символизирует освобождение детей из приюта Дюкарма, который был разрушен за свои преступления против потомков Арлатана. Под статуей высечена надпись: «Vir Sulahn Var Revas» — «Мы поем о нашей свободе»."
 ### Edgehall
 building_type_edgehall_01: "Эджхолл"
 building_type_edgehall_01_desc: "Первоначально этот аванпост принадлежал наземным гномам, но был заброшен после того, как Орзаммар перекрыл Глубинные тропы. Всё, что осталось от древнего поселения — это внушительные стены и заблокированный вход в подземные глубины. Заметив его стратегическое положение против авваров, клейны заселили забытые руины и превратили их в поселение Эджхолл — крепость в предгорьях Морозных гор, возвышающуюся над низинами и побережьем на востоке."
 building_edgehall_01: "$building_type_edgehall_01$"
 building_edgehall_01_desc: "$building_type_edgehall_01_desc$"
 ### Emerald Graves
 building_type_emerald_graves_01: "Динан Ханин"
 building_type_emerald_graves_01_desc: "Непреклонная крепость и священный склеп, Динан Ханин служит как штаб-квартирой, так и последним приютом Изумрудных рыцарей Долов. Здесь новое поколение защитников эльфийского народа оттачивает свои навыки под боком у призраков почтенных мертвецов, ушедших до них."
 building_emerald_graves_01: "Динан Ханин"
 building_emerald_graves_01_desc: "Непреклонная крепость и священный склеп, Динан Ханин служит как штаб-квартирой, так и последним приютом Изумрудных рыцарей Долов. Здесь новое поколение защитников эльфийского народа оттачивает свои навыки под боком у призраков почтенных мертвецов, ушедших до них."
 building_type_emerald_graves_02: "Фен де Глоар"
 building_type_emerald_graves_02_desc: "Изумрудные рыцари для одних были героями, а для других — безжалостными мясниками. Скорее всего, в обоих утверждениях есть доля правды. Последние из них похоронены здесь, в «месте, где кончается слава», а вместе с ними — надежды и устремления эльфийского народа."
 building_emerald_graves_02: "Фен де Глоар"
 building_emerald_graves_02_desc: "Изумрудные рыцари для одних были героями, а для других — безжалостными мясниками. Скорее всего, в обоих утверждениях есть доля правды. Последние из них похоронены здесь, в «месте, где кончается слава», а вместе с ними — надежды и устремления эльфийского народа."
 ### Farm of the Pellantaise
 building_type_farm_of_the_pellantaise_01: "Ферма Пеллантесов"
 building_type_farm_of_the_pellantaise_01_desc: "$building_farm_of_the_pellantaise_01_desc$"
 building_farm_of_the_pellantaise_01: "Заброшенная ферма Пеллантесов"
 building_farm_of_the_pellantaise_01_desc: "Когда-то одна из величайших ферм Гислена несколько веков назад, эта престижная усадьба ныне заброшена. Согласно местным легендам, внебрачный сын главы дома Пеллантес жаждал признания и владения землей. Поняв, что никогда не получит ни того, ни другого, он собрал своего отца, мать и всех сводных братьев и сестёр, после чего сжёг усадьбу вместе с ними. Правдива эта история или нет, но особняк действительно сгорел, а духи и демоны, населяющие ферму, рассказывают о великом кровопролитии, истончившем Тень."
 building_farm_of_the_pellantaise_02: "Перезаселённая ферма Пеллантесов"
 building_farm_of_the_pellantaise_02_desc: "Хотя ферма снова была заселена крестьянами, работающими в полях, эти земли далеко не так плодородны, как раньше. Демоны, бесчинствующие и убивающие крестьян, поселили страх в сердцах людей, которые с ужасом воспринимают приказ работать на проклятой ферме, из-за чего боятся выполнять свою работу, что приводит к гибели урожая."
 building_farm_of_the_pellantaise_03: "Восстановленная ферма Пеллантесов"
 building_farm_of_the_pellantaise_03_desc: "Теперь, когда демоны были повержены доблестным отрядом храмовников, работники фермы могут наконец трудиться без страха, а урожай собирается в полном объёме. Эти фермы в полной мере используют богатую и fertile почву, принося много богатства местному правителю и всему окружающему региону."
 ### Fields of Ghislain
 building_type_fields_of_ghislain_01: "Поля Гислена"
 building_type_fields_of_ghislain_01_desc: "$building_fields_of_ghislain_01_desc$"
 building_fields_of_ghislain_01: "Поля Гислена"
 building_fields_of_ghislain_01_desc: "Хотя термин «Поля Гислена» в основном используется для обозначения всего герцогства, на местном уровне им обозначают непосредственно поля вокруг самого Гислена. Они заслужили репутацию места богатейшего урожая и обширных ферм, несмотря на то что из-за схожести названий часто возникает путаница."
 building_fields_of_ghislain_02: "Невероятно богатые поля Гислена"
 building_fields_of_ghislain_02_desc: "Теперь, когда здесь обустроена эффективная система ирригации, Поля Гислена стали как никогда плодородными. Изобилие урожая кормит бесчисленное множество ртов по всему югу, делая местных землевладельцев невероятно богатыми и могущественными. Никогда прежде Поля Гислена не приносили такого богатства, и, без сомнения, так будет продолжаться еще долгие годы."
 ### Ghislain Circle
 building_type_ghislain_circle: "Круг Гислена"
 building_ghislain_circle: "Круг Гислена"
 building_ghislain_circle_desc: "Круг Гислена уникален среди прочих из-за своей своеобразной архитектуры, нарушающей привычные нормы высокой башни. Здесь маги размещены в бывшем величественном поместье богатой и набожной дамы из дома Гилен. Окруженные бесконечными полями и фермами, маги привыкли помогать местным жителям в их сельскохозяйственных трудах — к великой радости лорда, надзирающего за сбором урожая."





 ### Fort Against the Marches
 building_type_fort_against_the_marches_01: "Форт против Марки"
 building_type_fort_against_the_marches_01_desc: "$building_fort_against_the_marches_01_desc$"
 building_fort_against_the_marches_01: "Разрушенный форт против Марки"
 building_fort_against_the_marches_01_desc: "Построенная Кордиллиусом Драконом во время его кампаний в Орлее, эта крепость стоит как оплот против восточных вторжений из Неварры, Камберленда и сопредельных земель, даровав региону его современное название — Формарш. Хотя время подорвало её стены и структуру, она и по сей день способна стойко выдержать напор любого захватчика Гислена."
 building_fort_against_the_marches_02: "Восстановленный форт против Марки"
 building_fort_against_the_marches_02_desc: "Ныне восстановленная до состояния времён великого Кордиллиуса, крепость получила обновлённые толстые стены, способные с лёгкостью выдержать долгую осаду и укрыть на своей территории ещё тысячу солдат."
 building_fort_against_the_marches_03: "Несокрушимый форт против Марки"
 building_fort_against_the_marches_03_desc: "Перестроенная с применением древних гномьих техник, крепость стоит как несокрушимый бастион. Она вмещает больше солдат, чем когда-либо прежде, имеет самые прочные стены в регионе и, по слухам, тайные ходы внутри стен, дающие решающее преимущество защитникам. Хотя ходят сплетни, что убийцы используют эти лазы для быстрого и незаметного бегства."
 ### Fort Drakon/Dane
 building_type_fort_drakon_01: "Деревня Денерим"
 building_type_fort_drakon_01_desc: "Давным-давно Тевинтерская Империя построила великую крепость, рассчитывая укрепить свою власть над Ферелденом. Вокруг её внушительной архитектуры, алебастровых стен и многоуровневых башен постепенно объединились местные жители, образовав деревню Денерим."
 building_fort_drakon_01: "$building_type_fort_drakon_01$"
 building_fort_drakon_01_desc: "$building_type_fort_drakon_01_desc$"
 building_fort_drakon_02: "Городок Денерим"
 building_fort_drakon_02_desc: "С течением времени, благодаря инвестициям и притоку поселенцев, поселение Денерим разрослось. Ремесленники теперь работают в домах там, где раньше росли трава и деревья. Город стал настолько велик, что корабли теперь швартуются в его расширяющихся портах, не требуя сухопутных маршрутов."
 building_fort_drakon_03: "Город Денерим"
 building_fort_drakon_03_desc: "Денерим стал ещё больше, привлекая множество людей со всего Ферелдена. Он настолько разросся, что пришлось возвести мосты, дабы жители северного берега могли легко передвигаться по остальной части города. С основанием денеримского рынка и развитием торговли город заслуженно признан крупнейшим во всем Ферелдене."
 ### Landsmeet
 building_type_landsmeet_01: "Собрание земель"
 building_type_landsmeet_01_desc: "Обитель власти любого, кто дерзнет воссесть на трон в Денериме, Собрание земель — это больше чем тронный зал, это древняя традиция. Традиция тех, кто правил этой землёй поколениями — дебатировать и голосовать за того, кто будет править ими дальше. Соблюдение этого старого обычая на самой земле Собрания для любого правителя является доказательством уважения к традициям. Однако, независимо от их поддержки, легитимность любого правителя в Денериме воспринимается очень чутко и готова в любой момент качнуться от обожания до ненависти."
 building_landsmeet_01: "Собрание земель"
 building_landsmeet_01_desc: "$building_type_landsmeet_01_desc$"
 building_type_landsmeet_01_effect: "#flavor Эффекты для держателя графства:#!\n[GetLaw('saxon_elective_succession_law').GetName] Стоимость ([succession|E] / [prestige|E]) снижена на: #P +50%#!"
 special_building_cheaper_landsmeet_cost: "Особое здание Собрания земель"
 ### Flat Stables
 building_type_flat_stables_01: "Конюшни Равнины"
 building_type_flat_stables_01_desc: "Равнины Довен — одна из территорий, наиболее приспособленных для кавалерии, поэтому неудивительно, что именно здесь находятся одни из самых известных конюшен Орлея. Конюшни Равнины представляют собой огромный комплекс, занимающий мили пространства. Они используются как в военных целях, так и для турниров, предоставляя лошадям необходимый простор для отдыха, корма и выездки."
 building_flat_stables_01: "Конюшни Равнины"
 building_flat_stables_01_desc: "Равнины Довен — одна из территорий, наиболее приспособленных для кавалерии, поэтому неудивительно, что именно здесь находятся одни из самых известных конюшен Орлея. Конюшни Равнины представляют собой огромный комплекс, занимающий мили пространства. Они используются как в военных целях, так и для турниров, предоставляя лошадям необходимый простор для отдыха, корма и выездки."
 building_flat_stables_02: "Великие конюшни Герцогской Равнины"
 building_flat_stables_02_desc: "После реконструкции, проведенной герцогством Довен, Великие конюшни Герцогской Равнины стали крупнейшим (или одним из крупнейших) конюшенным комплексом во всем Орлее. Мили пастбищ используются для выгула, дрессировки и свободного галопа лошадей, а также для рыцарских турниров на радость публике. Сам комплекс превратился в настоящий небольшой город, богато украшенный и полностью посвящённый лошадям."
 ### Fort Garrote
 building_type_fort_garrote_01: "Форт Гаррота"
 building_type_fort_garrote_01_desc: "$building_fort_garrote_01_desc$"
 building_fort_garrote_01: "Форт Гаррота"
 building_fort_garrote_01_desc: "Молодой аванпост на окраине Орлея, построенный для слежения за вражескими вторжениями. Форт пока едва пригоден для полноценного использования — упор сделан на практичность, а не на комфорт. Тем не менее, во внутреннем дворе достаточно места для размещения до сотни солдат одновременно."
 building_type_fort_garrote_02: "$building_type_fort_garrote_01$"
 building_type_fort_garrote_02_desc: "$building_fort_garrote_02_desc$"
 building_fort_garrote_02: "Крепость Гаррота"
 building_fort_garrote_02_desc: "Более укреплённое сооружение, дополненное большой башней у ворот. Хотя это повышает защитные качества форта, ему всё ещё далеко до роскоши — даже зелень во внутреннем дворе выглядит чахлой и узловатой."
 ### Forteresse du Chagrin
 building_type_forteresse_du_chagrin_01: "Форт Печали"
 building_type_forteresse_du_chagrin_01_desc: "Замок, изначально построенный тевинтерскими магистрами, укреплявшими его стены магией крови. Позже Маферат разграбил замок и оставил его в руинах во время [exalted_march|E] Андрасте. Замок оставался в таком состоянии, пока Серые Стражи не восстановили его во время Второго [Concept('blight','Мора')|E], дабы занять выгодную позицию для фланговых атак на [darkspawn|E] порождений тьмы, хлынувших из Морозных гор. Ныне он служит Джадеру в качестве оборонительного пункта на границе с землями клейнов."
 building_forteresse_du_chagrin_01: "Форт Печали"
 building_forteresse_du_chagrin_01_desc: "Замок, изначально построенный тевинтерскими магистрами, укреплявшими его стены магией крови. Позже Маферат разграбил замок и оставил его в руинах во время [exalted_march|E] Андрасте. Замок оставался в таком состоянии, пока Серые Стражи не восстановили его во время Второго [Concept('blight','Мора')|E] Морa, дабы занять выгодную позицию для фланговых атак на [darkspawn|E] порождений тьмы, хлынувших из Морозных гор. Ныне он служит Джадеру в качестве оборонительного пункта на границе с землями клейнов."
 building_forteresse_du_chagrin_02: "Великий Форт Печали"
 building_forteresse_du_chagrin_02_desc: "Древняя крепость была отремонтирована, как только необходимость в реставрации стала очевидной. Прошли те времена, когда новобранцы Стражей забредали в обвалившиеся сторожевые башни. Маги также укрепили старые руны и добавили новые для помощи в обороне."
 ### Goldsnake Estate
 building_type_goldsnake_estate_01: "Дворец"
 building_type_goldsnake_estate_01_desc: "$building_goldsnake_estate_01_desc$"
 building_goldsnake_estate_01: "Поместье Златозмея"
 building_goldsnake_estate_01_desc: "Здесь располагается бывшее поместье пресловутого Андекаруса «Златозмея», который построил эти роскошные палаты как для надежного хранения своих богатств, так и для централизации сбора налогов с подданных, что вызвало немалое недовольство местного населения."
 building_type_goldsnake_estate_02: "$building_type_goldsnake_estate_01$"
 building_type_goldsnake_estate_02_desc: "$building_goldsnake_estate_02_desc$"
 building_goldsnake_estate_02: "Экстравагантно-роскошное поместье Златозмея"
 building_goldsnake_estate_02_desc: "Поместье «Златозмея» отреставрировано в настолько пышном стиле, что его сочли бы экстравагантным даже по стандартам Вал Руайо. Однако, по правде говоря, это прекрасное здание, выполненное в любимом местными жителями стиле, все еще выполняет свою первоначальную функцию — служит жестоко эффективной и хорошо укрепленной налоговой конторой. И до сих пор идут споры, висят ли здесь роскошные люстры для того, чтобы скрыть или, наоборот, подчеркнуть алчность, присущую этому месту."
 ### Grand Cathedral of Val Royeaux
 building_type_grand_cathedral_of_val_royeaux_01: "Великий собор Вал Руайо"
 building_type_grand_cathedral_of_val_royeaux_01_desc: "Построенный на руинах печально известной крепости королевы Ешавис, грандиозный храм императора Кордиллиуса I посвящён славе Андрасте. Он также служебным образом возведён как престол власти для [Concept('divine','Верховной Жрицей')|E] Верховной Владычицы, духовного лидера орлесианской [chantry|E] Церкви."
 building_grand_cathedral_of_val_royeaux_01: "$building_type_grand_cathedral_of_val_royeaux_01$"
 building_grand_cathedral_of_val_royeaux_01_desc: "$building_type_grand_cathedral_of_val_royeaux_01_desc$"
 building_grand_cathedral_of_val_royeaux_02: "Великий собор Вал Royeaux"
 building_grand_cathedral_of_val_royeaux_02_desc: "Определяющий целую эпоху, этот храм, посвящённый [andraste|E] Андрасте, не имеет равных по красоте и величию. Великий собор возвышается как высшее проявление благочестия верующих, а две его массивные башни возвышаются над горизонтом на много миль вокруг."
 ### Great Wall of Deauvin
 building_type_deauvin_wall_01: "Великая стена Довена"
 building_type_deauvin_wall_01_desc: "Эта оборонительная стена была построена вскоре после основания Орлея Кордиллиусом Первым. Когда местная знать поняла, что их земли рассматриваются как менее значимые в военных действиях из-за расположения на окраине Империи (единственная граница которой проходила с Долами), была возведена великая стена для защиты от язычников-[elves|E] эльфов."
 building_deauvin_wall_01: "Запущенная Великая стена Довена"
 building_deauvin_wall_01_desc: "Эта оборонительная стена была построена вскоре после основания Орлея Кордиллиусом Первым. Когда местная знать поняла, что их земли рассматриваются как менее значимые в военных действиях из-за расположения на окраине Империи (единственная граница которой проходила с Долами), была возведена великая стена для защиты от язычников-[elves|E] эльфов. Тем самым местные лорды подарили миру грандиозное сооружение, которое мог бы построить Вал Руайо, но так и не вложил в него средств. Однако в наши дни этот участок стены пришёл в упадок и уже не так эффективен, как прежде."
 building_deauvin_wall_02: "Престижная и прославленная Великая стена Довена"
 building_deauvin_wall_02_desc: "Этот участок старой оборонительной стены был отреставрирован и теперь служит мощным защитным оплотом рубежей Довена против любых врагов. Довен не стоял на пути вторгшихся армий к сердцу Империи, и поэтому Престижная и прославленная Великая стена Довена строилась не для защиты Орлея в целом, а для защиты местных жителей от захватчиков. Сегодня стена, несмотря на свою дороговизну, стоит как шедевр архитектуры и инженерии, а также как превосходная оборонительная позиция."
