 building_deauvin_wall_04: "Престижная и прославленная Великая стена Довена"
 building_deauvin_wall_04_desc: "Этот участок старой оборонительной стены восстановили, и теперь он надёжно защищает рубежи Довена от любого врага. Довен не лежал на пути армий, вторгавшихся к сердцу Империи, поэтому Престижная и прославленная Великая стена строилась не для защиты всего Орлея, а ради безопасности местных жителей. Сегодня, несмотря на огромные расходы, стена остаётся шедевром архитектуры и инженерного искусства, а также превосходной оборонительной позицией."
