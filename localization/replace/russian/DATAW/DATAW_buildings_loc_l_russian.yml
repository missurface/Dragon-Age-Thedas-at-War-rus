l_russian:
 NOT_holy_site_andrastian_trigger: "Владелец должен исповедовать андрастианство или считать это [Concept('holy_site','священным местом')|E]"
 
 ### Adamant Fortress
 building_type_adamant_fortress_01: "Крепость Адамант"
 building_type_adamant_fortress_01_desc: "$building_adamant_fortress_01_desc$"
 building_adamant_fortress_01: "Крепость Адамант"
 building_adamant_fortress_01_desc: "Построенная [Concept('dwarves','гномами')|E] для охраны Бездонной пропасти в самом сердце Западного предела, эта крепость сыграла важнейшую роль в обороне [Concept('grey_warden','Серых Стражей')|E] от [Concept('darkspawn','порождений тьмы')|E] во время Второго [Concept('blight','Мора')|E]. Её стены, возведённые на века и способные выдержать суровые песчаные бури, выглядят не столько высокими, сколько прочными. Благодаря им цитадель и поныне остаётся великим оборонительным рубежом."
 building_adamant_fortress_02: "Обновлённая крепость Адамант"
 building_adamant_fortress_02_desc: "После обновления с применением новых технологий стены стали гораздо выше и крепче прежнего: их укрепили как обычными материалами, так и [Concept('dataw_magic','магией')|E]. Став вдвое больше и надёжнее, крепость Адамант теперь возвышается величайшим бастионом над Бездонной пропастью, готовым защищать весь Западный предел и лежащие за ним земли от [Concept('darkspawn','порождений тьмы')|E]."
 ### Andoral's Reach
 building_type_andorals_reach_01: "Предел Андорала"
 building_type_andorals_reach_01_desc: "Предел Андорала был могучей тевинтерской крепостью, построенной для охраны северного тракта, ведущего из Орлея в Тевинтерскую империю. Разрушенная Священным походом Андрасте несколько веков назад, она стоит на стратегическом перекрёстке между северным и южным Тедасом."
 building_andorals_reach_01: "Предел Андорала (руины)"
 building_andorals_reach_01_desc: "Осыпающиеся камни этой некогда величественной тевинтерской крепости ныне служат памятником прошлому, разбитым свидетельством давно ушедших времён. Купольный шпиль обрушен, сдвоенный донжон оплетён лозами, а во тьме устраивают логова волки. И всё же, несмотря на разрушения, причинённые аламарри, стены остаются серьёзным препятствием для любого захватчика и желанным бастионом для защитников. Приложив немало труда и средств, эту твердыню можно восстановить."
 building_andorals_reach_02: "Предел Андорала (восстановленный)"
 building_andorals_reach_02_desc: "То, что было разрушено, обрело новую жизнь. Каменная кладка восстановлена, внутренний двор перестроен и заново вымощен. Донжоны отремонтированы и снабжены стрелами, клинками замковой ковки и добротными доспехами. Внушительные тевинтерские укрепления по-прежнему надёжны, и теперь крепость стоит почти неприступным стражем севера. Предел Андорала, хорошо снабжённый и защищённый многочисленным гарнизоном, вновь служит щитом северного Орлея — грозным, суровым и готовым никогда больше не пасть."
 building_andorals_reach_03: "Предел Андорала (великолепный)"
 building_andorals_reach_03_desc: "Прежде этот бастион был лишь щитом. Там, где некогда волки выходили на охоту, теперь воины внушительной цитадели совершают вылазки, подчиняя окрестные земли. Каждый коридор и зал полон жизни: солдаты приходят и уходят, вестовые вылетают из ворот во весь опор. Современные решения дополняют и без того внушительную оборону: барбаканы и дополнительные башни превращают поле перед стенами в гибельную ловушку. Трудами и золотом многих поколений Предел Андорала стал одной из самых впечатляющих крепостей Тедаса — Башней Орлея."
 ### Brasiers of Val Montaigne
 building_type_brasiers_val_montaigne_01: "Жаровни Валь-Монтеня"
 building_type_brasiers_val_montaigne_01_desc: "Замок Валь-Монтень, давным-давно построенный основателем рода Бланшар, служит памятником старинной цирианской архитектуре, а его ухоженные стены всё ещё способны с лёгкостью выдержать осаду. Однако больше всего внимания привлекают три жаровни, которые горят круглые сутки, указывая путь к Валь-Монтеню кораблям на озере Селестина и охраняя устье реки. Ныне эти огни связывают с [Concept('maker','Создателем')|E]. Говорят, они должны погаснуть лишь в самый тёмный час Монтеня — эта традиция сохраняется со времён снятия осады Валь-Монтеня в разгар Второго [Concept('blight','Мора')|E]."
 building_brasiers_val_montaigne_01: "Три жаровни Валь-Монтеня"
 building_brasiers_val_montaigne_01_desc: "Замок Валь-Монтень, давным-давно построенный основателем рода Бланшар, служит памятником старинной цирианской архитектуре, а его ухоженные стены всё ещё способны с лёгкостью выдержать осаду. Однако больше всего внимания привлекают три жаровни, которые горят круглые сутки, указывая путь к Валь-Монтеню кораблям на озере Селестина и охраняя устье реки. Ныне эти огни связывают с [Concept('maker','Создателем')|E]. Говорят, они должны погаснуть лишь в самый тёмный час Монтеня — эта традиция сохраняется со времён снятия осады Валь-Монтеня в разгар Второго [Concept('blight','Мора')|E]."
 building_brasiers_val_montaigne_02: "Пламенеющая крепость Валь-Монтень"
 building_brasiers_val_montaigne_02_desc: "Древние стены замка Валь-Монтень перестроили по требованиям нового века, и теперь они прочнее, чем когда-либо. И всё же внимание людей по-прежнему приковано к жаровням. Их переделали так, чтобы они горели ярче, дольше и были видны со всех сторон. Теперь они служат памятником андрастианской вере, о каком древние цириане могли лишь мечтать, и благословением для мореплавателей."
 ### Brecilian Ruins
 building_type_brecilian_ruins_01: "Бресилианские руины"
 building_type_brecilian_ruins_01_desc: "Эти древние руины, оставленные Тевинтерской империей во времена её былого величия, — остатки великой крепости, возведённой для контроля над беспокойным лесом. Сегодня от неё мало что осталось, но магические свойства, выгодное оборонительное положение и забытые знания, которые местные жители понемногу открывают заново, по-прежнему придают этому месту большое значение."
 building_brecilian_ruins_01: "Тевинтерские руины"
 building_brecilian_ruins_01_desc: "Эти древние руины, оставленные Тевинтерской империей во времена её былого величия, — остатки великой крепости, возведённой для контроля над беспокойным лесом. Сегодня от неё мало что осталось, но магические свойства, выгодное оборонительное положение и забытые знания, которые местные жители понемногу открывают заново, по-прежнему придают этому месту большое значение."
 building_brecilian_ruins_02: "Перестроенные тевинтерские руины"
 building_brecilian_ruins_02_desc: "Эти древние руины, оставленные Тевинтерской империей во времена её былого величия, — остатки великой крепости, возведённой для контроля над беспокойным лесом. Хотя её удалось привести в пригодное состояние, до былого великолепия ещё далеко. Тем не менее укрепления, магическая энергия и древние знания делают это место важной цитаделью региона."
 building_brecilian_ruins_03: "Восстановленные тевинтерские руины"
 building_brecilian_ruins_03_desc: "Бресилианская крепость, некогда оставленная Тевинтерской империей в руинах, вновь стала могучим укреплением, возвышающимся над беспокойным лесом. Восстановленная во всём блеске, она величественно господствует над окрестными дебрями, которые так долго поглощали её. Мощная оборона, магическая энергия и забытые знания делают крепость важной цитаделью, а её размах и грандиозная архитектура — обителью, достойной могущественнейших королей."
 ### Castle Redcliffe
 building_type_castle_redcliffe: "Замок Редклифф"
 building_type_castle_redcliffe_desc: "Замок Редклифф — первая и последняя линия обороны на единственном сухопутном пути в Ферелден. Эта страна никогда не падала перед силой, которая предварительно не захватила бы Редклифф. Защищаемая им деревня удачно расположена возле горного перевала, ведущего к Орзаммару и орлесианской границе, а потому служит центром внешней торговли."
 building_castle_redcliffe: "$building_type_castle_redcliffe$"
 building_castle_redcliffe_desc: "$building_type_castle_redcliffe_desc$"
 ### Cendrerin Trading market
 building_type_cendrein_market_01: "Рынок сандренцев"
 building_cendrein_opinion: "$cendrerin_collective_noun$ое мнение"
 building_cendrein_market_01: "Торговый рынок сандренцев"
 building_cendrein_market_01_desc: "Благодаря постоянным контактам с сандренцами Моря Пепла в регионе появился небольшой рынок. Кочевники продают здесь всё: от знаменитого рыбного соуса до редких металлов и минералов, добытых в горах, — чтобы приобрести ценные товары, недоступные в пустыне. Некоторые сандренцы даже покидают свои племена и оседают в Орлее."
 building_cendrein_market_02: "Базар сандренцев"
 building_cendrein_market_02_desc: "Благодаря притоку средств скромный рынок превратился в крупный базар, куда многочисленные племена приходят торговать товарами со всего [Concept('thedas','Тедаса')|E]. Они предлагают серу, рыбу и множество других богатств Моря Пепла. Некоторые сандренцы окончательно оседают в регионе ради торговли."
 building_cendrein_market_03: "Квартал сандренцев"
 building_cendrein_market_03_desc: "По мере развития торговли и роста числа сандренцев для этих кочевников выделили отдельный квартал. Он значительно облегчает торговлю с племенами Моря Пепла и даёт кров многочисленной сандренской общине. Впрочем, некоторые сандренцы скучают по кочевой жизни и отправляются странствовать по всему [Concept('thedas','Тедасу')|E]."
 cendrein_market_01: "Время от времени будут прибывать гости-сандренцы."
 cendrein_market_02: "Время от времени будут прибывать придворные-сандренцы."
 cendrein_market_03: "Время от времени будут прибывать придворные и искатели приключений из числа сандренцев."
 dataw_events_gamord.0072.t: "[Select_CString(cendrerin_merchant.IsFemale, 'Сандренская торговка добивается', 'Сандренский торговец добивается' )] влияния в Лизьер-Сандре."
 dataw_events_gamord.0072.desc: "[Select_CString(cendrerin_merchant.IsFemale, 'Она присоединилась', 'Он присоединился' )] к вашему двору."
 dataw_events_gamord.0073.t: "[Select_CString(cendrerin_merchant.IsFemale, 'Сандренская искательница приключений отправляется', 'Сандренский искатель приключений отправляется' )] в путь."
 dataw_events_gamord.0073.desc: "[cendrerin_merchant.GetShortUIName|U] собирает отряд искателей приключений."
 ### Chantry of Montsimmard
 building_type_olessa_chantry_01: "Церковь Монтсиммара"
 building_type_olessa_chantry_01_desc: "Эту церковь построили вскоре после того, как Кордилиус Драккон основал Орлесианскую Церковь. Считается, что именно здесь родилась Олесса из Монтсиммара, впоследствии ставшая первой [Concept('divine','Верховной Жрицей')|E] под именем Джустиния. Каждый кирпич и каждая статуя посвящены первой [Concept('divine','Верховной Жрице')|E], а само здание хранит предания о жрице-воительнице и привлекает паломников со всего [Concept('thedas','Тедаса')|E]."
 building_olessa_chantry_01: "Церковь Олессы из Монтсиммара"
 building_olessa_chantry_01_desc: "Эту церковь построили вскоре после того, как Кордилиус Драккон основал Орлесианскую Церковь. Считается, что именно здесь родилась Олесса из Монтсиммара, впоследствии ставшая первой [Concept('divine','Верховной Жрицей')|E] под именем Джустиния. Каждый кирпич и каждая статуя посвящены первой [Concept('divine','Верховной Жрице')|E], а само здание хранит предания о жрице-воительнице и привлекает паломников со всего [Concept('thedas','Тедаса')|E]."
 ### Château Klay
 building_type_klay_castle_01: "Шато Клей"
 building_type_klay_castle_01_desc: "$building_klay_castle_01_desc$"
 building_klay_castle_01: "Шато Клей"
 building_klay_castle_01_desc: "Шато Клей славится по всему Орлею своей архитектурой. Построенное из великолепного белого мрамора, лучшего стекла, произведённого в Серо, и чудесной древесины из Тирашана, оно считается последним оплотом истинной цивилизации на западном рубеже Орлея и приумножает престиж своих владельцев."
 building_type_klay_castle_02: "$building_type_klay_castle_01$"
 building_type_klay_castle_02_desc: "$building_klay_castle_02_desc$"
 building_klay_castle_02: "Конюшни Шато Клей"
 building_klay_castle_02_desc: "Шато Клей славится по всему Орлею своей архитектурой и лучшими материалами, привезёнными из разных уголков страны. Не меньшую известность ему принесли конюшни, где выводят породистых серых иноходцев. Благодаря великолепным коням шато сохраняет репутацию «островка истинной цивилизации к западу от варварских болот»."
 building_type_klay_castle_03: "$building_type_klay_castle_01$"
 building_type_klay_castle_03_desc: "$building_klay_castle_03_desc$"
 building_klay_castle_03: "Великие конюшни Шато Клей"
 building_klay_castle_03_desc: "Шато Клей славится по всему Орлею своей архитектурой и конюшнями, построенными из лучшего мрамора и дерева, какие только можно купить за деньги. Серые иноходцы, выращенные в Великих конюшнях Шато Клей, известны во всём Орлее и служат прославленным шевалье. Каждый, кто побывал в Альоне, поёт хвалу красоте Шато Клей, и потому оно кажется затерянным раем среди диких земель Запада."
 ### Château of Serault
 building_type_serault_castle_01: "Шато Серо"
 building_type_serault_castle_01_desc: "Во всём Орлее нет ничего похожего на Шато Серо! В замке триста двадцать семь окон, хотя молва преувеличивает их число до тысячи, и столько изысканного стекла, что за него можно было бы выкупить целый вольный город. Место удалённое, но хорошо укреплённое: шато стоит на острове посреди реки. Мост Масок — единственный путь на восток, к городу Серо, а Зелёный мост ведёт на запад, к лесу."
 building_serault_castle_01: "$building_type_serault_castle_01$"
 building_serault_castle_01_desc: "$building_type_serault_castle_01_desc$"
 building_type_serault_castle_02: "$building_type_serault_castle_01$"
 building_type_serault_castle_02_desc: "«Плата стеклом» всегда была девизом дома де Серо, и ещё никогда он не был так уместен. Стеклодувов Серо теперь держат в позолоченной клетке, ограничивая их передвижения, ведь они — основа экономики Серо и его великолепных новых мастерских. Доходы от их труда позволили ещё сильнее укрепить шато против любых угроз — как человеческих, так и таящихся в лесной чаще."
 building_serault_castle_02: "$building_type_serault_castle_01$"
 building_serault_castle_02_desc: "$building_type_serault_castle_02_desc$"
 building_type_serault_castle_03: "$building_type_serault_castle_01$"
 building_type_serault_castle_03_desc: "Город Серо процветает! Богатства, приносимые стеклодувными мастерскими, привели к новому росту пограничного поселения, а также к созданию торгового порта на реке."
 building_serault_castle_03: "$building_type_serault_castle_01$"
 building_serault_castle_03_desc: "$building_type_serault_castle_03_desc$"
 ### Ciriane Frontier Outpost
 building_type_ciriane_frontier_outpost_01: "Аванпосты"
 building_type_ciriane_frontier_outpost_01_desc: "$building_ciriane_frontier_outpost_01_desc$"
 building_ciriane_frontier_outpost_01: "Наблюдательный аванпост"
 building_ciriane_frontier_outpost_01_desc: "Этот наблюдательный аванпост построен на опушке леса Тирашан. Разведчики используют его как для оттачивания навыков маскировки, так и для наблюдения за коварным и таинственным лесом."
 building_type_ciriane_frontier_outpost_02: "$building_type_ciriane_frontier_outpost_01$"
 building_type_ciriane_frontier_outpost_02_desc: "$building_ciriane_frontier_outpost_02_desc$"
 building_ciriane_frontier_outpost_02: "Сеть усадеб-аванпостов Тирашана"
 building_ciriane_frontier_outpost_02_desc: "Простой наблюдательный аванпост для подготовки разведчиков на краю Тирашана превратился в сеть усадеб, расположенных на опушке и даже в глубине коварного леса. Здесь обрабатывают землю и заготавливают древесину на пользу землевладельцам. Эта сеть, где время от времени кто-нибудь таинственно исчезает, стала отличной школой умелых разведчиков благодаря по-прежнему действующему старому аванпосту."
 ### Town of Gwaren
 building_type_gwaren_special_building_02: "$building_gwaren_special_building_02$"
 building_type_gwaren_special_building_02_desc: "$building_gwaren_special_building_02_desc$"
 building_gwaren_special_building_02: "Городок Гварен"
 building_gwaren_special_building_02_desc: "Благодаря возобновлению торговли с клейнами Гварен, ставший скромным городком, начинает медленно возвращаться к былому величию. Новые палисады снова защищают поселение, и с каждым днём в гавани швартуется всё больше кораблей. Тем не менее окраины по-прежнему окружают руины, а среди домов встречаются полуразрушенные постройки — до Гварена былых времён ещё далеко."
 ### City of Gwaren
 building_type_gwaren_special_building_03: "$building_gwaren_special_building_03$"
 building_type_gwaren_special_building_03_desc: "$building_gwaren_special_building_03_desc$"
 building_gwaren_special_building_03: "Город Гварен"
 building_gwaren_special_building_03_desc: "С постройкой полноценных оборонительных сооружений и расширением торговых путей этот растущий экономический центр вновь превратился в настоящий город. Сюда прибывает больше судов, людей и товаров, чем когда-либо прежде. Поговаривают, что некоторые гномы даже вернулись сюда торговать, к огромной радости местных жителей."
 ### City of Seas
 building_city_of_seas_01: "Великий порт Адмиралтейства"
 building_city_of_seas_01_desc: "Великий порт Адмиралтейства — символ возрождения архипелага. Оживлённые доки, рынки и чудесная архитектура, вдохновлённая дальними краями, заметно выделяют его на фоне остального острова. Здесь можно найти товары даже из Пар Воллена, а ещё больше редкостей предлагает огромный чёрный рынок, господствующий в экономике порта, — наследие прошлого Предела Бранделя."
 building_type_city_of_seas_01: "$building_city_of_seas_01$"
 building_type_city_of_seas_01_desc: "$building_city_of_seas_01_desc$"
 ### Cliffbreaker Waterfall
 building_type_hrimwudu_waterfall_01: "Водопад Скалолом"
 building_type_hrimwudu_waterfall_01_desc: "Этот водопад, названный «Скалоломом» древними кланами авваров, впервые заселившими долину, берёт начало на вершине великого утёса высоко в Морозных горах и устремляется вниз, снабжая водой поселения людей и местную фауну. Поэтому жители всегда считали его символом и залогом процветания своих селений."
 building_hrimwudu_waterfall_01: "Водопад Скалолом"
 building_hrimwudu_waterfall_01_desc: "Этот водопад, названный «Скалоломом» древними кланами авваров, впервые заселившими долину, берёт начало на вершине великого утёса высоко в Морозных горах и устремляется вниз, снабжая водой поселения людей и местную фауну. Поэтому жители всегда считали его символом и залогом процветания своих селений."
 ### Dragon Hunting Guild
 building_type_dragon_hunters_01: "Гильдия охотников на драконов"
 building_type_dragon_hunters_01_desc: "$building_dragon_hunters_01$"
 building_dragon_hunters_01: "Малая гильдия охотников на драконов"
 building_dragon_hunters_01_desc: "Основанная в конце Древнего века во время одного из всплесков активности [Concept('dragon','драконов')|E], знаменитая Гильдия охотников на драконов, несмотря на скромные размеры, широко известна в Орлее и соседней Неварре. В её рядах состоит множество прославленных охотников на [Concept('dragon','драконов')|E], преимущественно неваррцев и жителей Перендейла. В затишье между охотами на [Concept('dragon','драконов')|E] эти мастера развлекают местных жителей рассказами и выслеживают более привычных, но всё же опасных зверей."
 dragon_hunters_01_cheaper_hunt_cost_desc: "$building_dragon_hunters_01$"
 building_dragon_hunters_02: "Великая гильдия охотников на драконов в Перендейле"
 building_dragon_hunters_02_desc: "Получив надлежащее снаряжение и просторное помещение, Гильдия охотников на драконов прославилась от Мон-де-Гляса до Айсли благодаря рассказам о мастерах, убивающих драконов, порождений тьмы и виверн. Один из главных приёмов гильдии против свирепых зверей — использовать проклятых местных коз в качестве приманки, к великой радости жителей, которые терпеть не могут этих тварей."
 dragon_hunters_02_cheaper_hunt_cost_desc: "$building_dragon_hunters_02$"
 dragon_hunters_activity_desc: "Значительно повышает вероятность обнаружения опасных животных и снижает стоимость проведения [Concept('activities','занятий')|E] категории «[GetActivityType('activity_hunt').GetName]» в этом [Concept('holding','владении')|E]. [Concept('characters','Персонажи')|E] чаще получают [Concept('traits','свойства')|E] «[GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]»"
 ### Dubuef Vineyards
 building_type_dubuef_vineyards_01: "Виноградники Дюбёфа"
 building_type_dubuef_vineyards_01_desc: "Дюбёф славится разведением быков — считается даже, что именно это занятие дало «бычьи» названия соседним землям, в том числе городу Валь-Торо. Однако скотоводство — лишь часть того, что даёт Дюбёфу богатство и престиж: главное его достояние — вино. Благодаря почве, которую неустанно пашут быки, оно приобретает глубокий красный цвет и насыщенный терпкий вкус с нотками корицы, за что знать ценит его как необычное лакомство."
 building_dubuef_vineyards_01: "Виноградники Дюбёфа"
 building_dubuef_vineyards_01_desc: "Дюбёф славится разведением быков — считается даже, что именно это занятие дало «бычьи» названия соседним землям, в том числе городу Валь-Торо. Однако скотоводство — лишь часть того, что даёт Дюбёфу богатство и престиж: главное его достояние — вино. Благодаря почве, которую неустанно пашут быки, оно приобретает глубокий красный цвет и насыщенный терпкий вкус с нотками корицы, за что знать ценит его как необычное лакомство."
 building_dubuef_vineyards_02: "Вечные виноградники Дюбёфа"
 building_dubuef_vineyards_02_desc: "Переход на севооборот, расширение виноградников и новое оборудование позволили быкам работать эффективнее, чем когда-либо. Производство вина выросло в десять раз на радость восхищённой знати, которую теперь бесперебойно снабжают превосходным терпким «Бычьим вином»."
 building_dubuef_vineyards_03: "Крытые виноградники Дюбёфа"
 building_dubuef_vineyards_03_desc: "Выполнив гигантскую задачу по накрытию полей стеклянным потолком, который можно открывать для дождя, в Дюбёфе совершили невозможное: научились выращивать виноград зимой. Это «морозное вино», как его стала называть знать, теперь регулярно появляется на столах Валь Руайо и других великих столиц. Даже крестьяне начали копить заработанные деньги, чтобы достать бутылку этого сорта, выросшего вопреки стихиям благодаря стеклянному куполу."
 ### Ducarme Orphanage
 building_type_ducarme_orphanage: "Приют Дюкарма"
 building_type_ducarme_orphanage_desc: "Официально известное как «Приют Дюкарма для долийских детей», это заведение было основано в 1:97 Божественного века фанатичным архитектором Робером Дюкармом, провозгласившим себя «слугой воли Верховной Жрицы», хотя ни одна [Concept('divine','Верховная Жрица')|E] никогда не упоминала о существовании приюта. \n\nНоминально подчиняясь Орлесианской Церкви, служители приюта поставили своей целью давать кров осиротевшим долийским детям и воспитывать их в вере в [Concept('maker','Создателя')|E] и обычаях Орлея, вдали от языческих богов. Однако о заведении ходят мрачные слухи, подогреваемые нежеланием администрации рассказывать о своей работе. \n\nНесмотря на слухи и призывы к расследованию, руководство хранит молчание, и достоверно известно лишь одно: [Concept('elves','эльфы')|E], достигшие выпускного возраста, никогда не покидали этот регион."
 building_ducarme_orphanage: "Приют Дюкарма"
 building_ducarme_orphanage_desc: "Официально известное как «Приют Дюкарма для долийских детей», это заведение было основано в 1:97 Божественного века фанатичным архитектором Робером Дюкармом, провозгласившим себя «слугой воли Верховной Жрицы», хотя ни одна [Concept('divine','Верховная Жрица')|E] никогда не упоминала о существовании приюта. \n\nНоминально подчиняясь Орлесианской Церкви, служители приюта поставили своей целью давать кров осиротевшим долийским детям и воспитывать их в вере в [Concept('maker','Создателя')|E] и обычаях Орлея, вдали от языческих богов. Однако о заведении ходят мрачные слухи, подогреваемые нежеланием администрации рассказывать о своей работе. \n\nНесмотря на слухи и призывы к расследованию, руководство хранит молчание, и достоверно известно лишь одно: [Concept('elves','эльфы')|E], достигшие выпускного возраста, никогда не покидали этот регион."
 building_type_verchiel_orphanage: "Приют Вершиэля"
 building_type_verchiel_orphanage_desc: "Это заведение, прежде известное как «Приют Дюкарма для долийских детей», было основано в 1:97 Божественного века фанатичным архитектором Робером Дюкармом, провозгласившим себя «слугой воли Верховной Жрицы», хотя ни одна Верховная Жрица никогда не упоминала о существовании приюта. Номинально подчиняясь Орлесианской Церкви, его служители давали кров осиротевшим долийским детям и воспитывали их в вере в Создателя и обычаях Орлея, вдали от языческих богов. После того как чудовищные слухи о методах приюта подтвердились, заведение перешло под официальный надзор и получило новое название — «Приют Вершиэля для долийских детей»."
 building_verchiel_orphanage: "Приют Вершиэля"
 building_verchiel_orphanage_desc: "Это заведение, прежде известное как «Приют Дюкарма для долийских детей», было основано в 1:97 Божественного века фанатичным архитектором Робером Дюкармом, провозгласившим себя «слугой воли Верховной Жрицы», хотя ни одна Верховная Жрица никогда не упоминала о существовании приюта. Номинально подчиняясь Орлесианской Церкви, его служители давали кров осиротевшим долийским детям и воспитывали их в вере в Создателя и обычаях Орлея, вдали от языческих богов. После того как чудовищные слухи о методах приюта подтвердились, заведение перешло под официальный надзор и получило новое название — «Приют Вершиэля для долийских детей»."
 building_type_destroyed_ducarme_orphanage: "Разрушенный приют Дюкарма"
 building_type_destroyed_ducarme_orphanage_desc: "Это всё, что осталось от Приюта Дюкарма для долийских детей, уничтоженного после того, как правда о методах заведения вскрылась. Люди рады, что это позорное пятно стёрто с лица земли, но оставленный им шрам ещё предстоит залечить. Возможно, со временем и при должных вложениях новая постройка затмит всё то немногое хорошее, что некогда приносил приют."
 building_destroyed_ducarme_orphanage: "Разрушенный приют Дюкарма"
 building_destroyed_ducarme_orphanage_desc: "Это всё, что осталось от Приюта Дюкарма для долийских детей, уничтоженного после того, как правда о методах заведения вскрылась. Люди рады, что это позорное пятно стёрто с лица земли, но оставленный им шрам ещё предстоит залечить. Возможно, со временем и при должных вложениях новая постройка затмит всё то немногое хорошее, что некогда приносил приют."
 building_type_ducarme_elf_neighbourhood: "Эльфийский квартал Дюкарма"
 building_type_ducarme_elf_neighbourhood_desc: "Возникший на месте зверств Приюта Дюкарма благодаря его бывшим воспитанникам, этот квартал стал одним из редких мест, где между народами установилось хотя бы частичное равенство. Люди и эльфы вместе трудятся, празднуют и даже молятся — к удивлению, а нередко и презрению большей части [Concept('thedas','Тедаса')|E]."
 building_ducarme_elf_neighbourhood: "Эльфийский квартал Дюкарма"
 building_ducarme_elf_neighbourhood_desc: "Возникший на месте зверств Приюта Дюкарма благодаря его бывшим воспитанникам, этот квартал стал одним из редких мест, где между народами установилось хотя бы частичное равенство. Люди и эльфы вместе трудятся, празднуют и даже молятся — к удивлению, а нередко и презрению большей части [Concept('thedas','Тедаса')|E]."
 building_type_ducarme_massacre_memorial: "Мемориал резни в приюте Дюкарма"
 building_type_ducarme_massacre_memorial_desc: "Эльфийская статуя посреди большого андрастианского кладбища может вызвать недоумение, но она хранит память о прошлом. Эльфийский воин, разрывающий цепи сироты, символизирует освобождение детей из приюта Дюкарма, разрушенного за преступления против потомков Арлатана. Под статуей высечена надпись: «Vir Sulahn Var Revas» — «Мы поём о нашей свободе»."
 building_ducarme_massacre_memorial: "Мемориал резни в приюте Дюкарма"
 building_ducarme_massacre_memorial_desc: "Эльфийская статуя посреди большого андрастианского кладбища может вызвать недоумение, но она хранит память о прошлом. Эльфийский воин, разрывающий цепи сироты, символизирует освобождение детей из приюта Дюкарма, разрушенного за преступления против потомков Арлатана. Под статуей высечена надпись: «Vir Sulahn Var Revas» — «Мы поём о нашей свободе»."
 ### Dustytop Fort
 building_type_dustytop_fort_01: "Форт Пыльной вершины"
 building_type_dustytop_fort_01_desc: "Эта ничем не примечательная крепость известна лишь тем, что здесь очень пыльно."
 building_dustytop_fort_01: "$building_type_dustytop_fort_01$"
 building_dustytop_fort_01_desc: "$building_type_dustytop_fort_01_desc$"
 ### Edgehall
 building_type_edgehall_01: "Эджхолл"
 building_type_edgehall_01_desc: "Изначально этот аванпост принадлежал наземным гномам, но был заброшен после того, как Орзаммар перекрыл Глубинные тропы. Всё, что осталось от древнего поселения, — внушительные стены и заваленный вход в подземные глубины. Оценив его выгодное положение для защиты от авваров, клейны заселили забытые руины и превратили их в Эджхолл — крепость в предгорьях Морозных гор, возвышающуюся над восточными низинами и побережьем."
 building_edgehall_01: "$building_type_edgehall_01$"
 building_edgehall_01_desc: "$building_type_edgehall_01_desc$"
 ### Emerald Graves
 building_type_emerald_graves_01: "Дин'ан Ханин"
 building_type_emerald_graves_01_desc: "Дин'ан Ханин — неприступная крепость и священная усыпальница, которая служит одновременно штабом и местом последнего упокоения Изумрудных рыцарей Долов. Здесь новое поколение защитников эльфийского народа оттачивает навыки среди призраков чтимых предшественников."
 building_emerald_graves_01: "Дин'ан Ханин"
 building_emerald_graves_01_desc: "Дин'ан Ханин — неприступная крепость и священная усыпальница, которая служит одновременно штабом и местом последнего упокоения Изумрудных рыцарей Долов. Здесь новое поколение защитников эльфийского народа оттачивает навыки среди призраков чтимых предшественников."
 building_type_emerald_graves_02: "Фен де Глоар"
 building_type_emerald_graves_02_desc: "Изумрудные рыцари для одних были героями, а для других — безжалостными мясниками. Скорее всего, в обоих утверждениях есть доля правды. Последние из них похоронены здесь, в «месте, где кончается слава», а вместе с ними — надежды и устремления эльфийского народа."
 building_emerald_graves_02: "Фен де Глоар"
 building_emerald_graves_02_desc: "Изумрудные рыцари для одних были героями, а для других — безжалостными мясниками. Скорее всего, в обоих утверждениях есть доля правды. Последние из них похоронены здесь, в «месте, где кончается слава», а вместе с ними — надежды и устремления эльфийского народа."
 ### Farm of the Pellantaise
 building_type_farm_of_the_pellantaise_01: "Ферма Пеллантесов"
 building_type_farm_of_the_pellantaise_01_desc: "$building_farm_of_the_pellantaise_01_desc$"
 building_farm_of_the_pellantaise_01: "Проклятая ферма Пеллантесов"
 building_farm_of_the_pellantaise_01_desc: "Несколько веков назад эта престижная усадьба считалась одной из величайших ферм Гислена, но ныне она заброшена. Согласно местным легендам, внебрачный сын главы дома Пеллантес жаждал признания и права владеть землёй. Поняв, что не получит ни того ни другого, он заманил отца, мать и всех единокровных братьев и сестёр в усадьбу и сжёг её вместе с ними. Правдива эта история или нет, особняк действительно сгорел, а духи и демоны, обитающие на ферме, свидетельствуют о великом кровопролитии, истончившем Завесу."
 building_farm_of_the_pellantaise_02: "Перезаселённая ферма Пеллантесов"
 building_farm_of_the_pellantaise_02_desc: "Ферму вновь заселили крестьянами, но земля уже далеко не так плодородна, как прежде. Демоны бесчинствуют и убивают работников, вселяя ужас в сердца людей. Приказ трудиться на проклятой ферме встречают со страхом, и потому многие поля остаются без ухода, а урожай гибнет."
 building_farm_of_the_pellantaise_03: "Восстановленная ферма Пеллантесов"
 building_farm_of_the_pellantaise_03_desc: "Теперь, когда доблестный отряд храмовников уничтожил демонов, работники могут наконец трудиться без страха, а урожай снова собирают полностью. Ферма в полной мере использует богатую и плодородную почву, принося большие доходы местному правителю и всему региону."
 ### Fields of Ghislain
 building_type_fields_of_ghislain_01: "Поля Гислена"
 building_type_fields_of_ghislain_01_desc: "$building_fields_of_ghislain_01_desc$"
 building_fields_of_ghislain_01: "Поля Гислена"
 building_fields_of_ghislain_01_desc: "Название «Поля Гислена» обычно относится ко всему герцогству, но местные жители называют так и поля вокруг самого Гислена. Они снискали собственную славу благодаря богатейшим урожаям и обширным плодородным угодьям, хотя одинаковые названия нередко вызывают путаницу."
 building_fields_of_ghislain_02: "Невероятно богатые поля Гислена"
 building_fields_of_ghislain_02_desc: "Благодаря эффективной системе орошения Поля Гислена стали плодороднее, чем когда-либо. Обильный урожай кормит бесчисленное множество людей по всему югу, а местных землевладельцев делает невероятно богатыми и могущественными. Никогда прежде Поля Гислена не приносили такого богатства, и, без сомнения, так будет продолжаться ещё долгие годы."
 ### Ghislain Circle
 building_type_ghislain_circle: "Круг Гислена"
 building_ghislain_circle: "Круг Гислена"
 building_ghislain_circle_desc: "Круг Гислена выделяется среди прочих необычной архитектурой, нарушающей привычный образ высокой башни. Маги размещаются в бывшем величественном поместье богатой и набожной леди из дома Гислен. Окружённые бескрайними полями и фермами, они привыкли помогать местным жителям в земледелии и других прибыльных начинаниях — к великой радости лорда, надзирающего за урожаем."





 ### Fort Against the Marches
 building_type_fort_against_the_marches_01: "Форт против Вольной Марки"
 building_type_fort_against_the_marches_01_desc: "$building_fort_against_the_marches_01_desc$"
 building_fort_against_the_marches_01: "Разрушенный форт против Вольной Марки"
 building_fort_against_the_marches_01_desc: "Построенная Кордилиусом Дракконом во время его походов по Орлею, эта крепость служит оплотом против вторжений с востока — из Неварры, Камберленда и других земель. Именно ей регион обязан своим нынешним названием, Формарш. Хотя время ослабило стены и другие укрепления, крепость и поныне способна выдержать натиск любого захватчика, посягнувшего на Жилен."
 building_fort_against_the_marches_02: "Восстановленный форт против Вольной Марки"
 building_fort_against_the_marches_02_desc: "Теперь крепость восстановлена в том виде, какой имела во времена великого Кордилиуса. Её новые толстые стены способны с лёгкостью выдержать долгую осаду, а внутри достаточно места ещё для тысячи солдат."
 building_fort_against_the_marches_03: "Несокрушимый форт против Вольной Марки"
 building_fort_against_the_marches_03_desc: "Перестроенная с применением древних гномьих технологий, крепость стала несокрушимым бастионом. Она вмещает больше солдат, чем когда-либо прежде, обладает самыми прочными стенами в регионе и, по слухам, скрывает внутри них тайные ходы, дающие защитникам решающее преимущество. Впрочем, поговаривают, что убийцы используют эти лазы для быстрого и незаметного бегства."
 ### Fort Drakon/Dane
 building_type_fort_drakon_01: "Деревня Денерим"
 building_type_fort_drakon_01_desc: "Давным-давно Тевинтерская империя построила великую крепость, рассчитывая укрепить свою власть над Ферелденом. Вокруг её внушительных алебастровых стен и многоярусных башен постепенно поселились местные жители, основав деревню Денерим."
 building_fort_drakon_01: "$building_type_fort_drakon_01$"
 building_fort_drakon_01_desc: "$building_type_fort_drakon_01_desc$"
 building_fort_drakon_02: "Городок Денерим"
 building_fort_drakon_02_desc: "С течением времени, благодаря инвестициям и притоку поселенцев, поселение Денерим разрослось. Ремесленники теперь работают в домах там, где раньше росли трава и деревья. Город стал настолько велик, что корабли теперь швартуются в его расширяющихся портах, позволяя добраться сюда без долгого пути по суше."
 building_fort_drakon_03: "Город Денерим"
 building_fort_drakon_03_desc: "Денерим стал ещё больше, привлекая множество людей со всего Ферелдена. Он настолько разросся, что пришлось возвести мосты, дабы жители северного берега могли легко передвигаться по остальной части города. С основанием денеримского рынка и развитием торговли город заслуженно признан крупнейшим во всём Ферелдене."
 ### Landsmeet
 building_type_landsmeet_01: "Собрание земель"
 building_type_landsmeet_01_desc: "Средоточие власти любого, кто осмелится воссесть на трон Денерима, Собрание земель — не просто тронный зал, а древняя традиция. Из поколения в поколение правители этих земель собирались здесь, чтобы спорить и голосовать за того, кто будет править ими дальше. Для любого монарха соблюдение старого обычая на месте самого Собрания служит доказательством уважения к традициям. Однако вне зависимости от того, поддерживает правитель Собрание или нет, в Денериме его законность оценивают особенно строго: отношение народа в любой миг может качнуться от обожания к ненависти — во благо или во зло."
 building_landsmeet_01: "Собрание земель"
 building_landsmeet_01_desc: "$building_type_landsmeet_01_desc$"
 building_type_landsmeet_01_effect: "#flavor Эффекты для владельца графства:#!\nЗатраты [Concept('prestige','престижа')|E] на введение [Concept('succession','порядка наследования')|E] «[GetLaw('saxon_elective_succession_law').GetName]» снижены на: #P +50%#!"
 special_building_cheaper_landsmeet_cost: "Особое здание Собрания земель"
 ### Flat Stables
 building_type_flat_stables_01: "Конюшни Равнины"
 building_type_flat_stables_01_desc: "Равнины Довен — одна из территорий, наиболее приспособленных для кавалерии, поэтому неудивительно, что именно здесь находятся одни из самых известных конюшен Орлея. Конюшни Равнины представляют собой огромный комплекс, занимающий мили пространства. Они используются как в военных целях, так и для турниров, предоставляя лошадям необходимый простор для отдыха, корма и выездки."
 building_flat_stables_01: "Конюшни Равнины"
 building_flat_stables_01_desc: "Равнины Довен — одна из территорий, наиболее приспособленных для кавалерии, поэтому неудивительно, что именно здесь находятся одни из самых известных конюшен Орлея. Конюшни Равнины представляют собой огромный комплекс, занимающий мили пространства. Они используются как в военных целях, так и для турниров, предоставляя лошадям необходимый простор для отдыха, корма и выездки."
 building_flat_stables_02: "Великие конюшни Герцогской Равнины"
 building_flat_stables_02_desc: "После реконструкции, проведённой герцогством Довен, Великие конюшни Герцогской Равнины стали одним из крупнейших, если не крупнейшим, конюшенным комплексом во всём Орлее. Мили пастбищ отведены для отдыха, выездки и свободного бега лошадей, а также для рыцарских турниров на радость публике. Сам комплекс превратился в богато украшенный город, целиком посвящённый лошадям."
 ### Fort Garrote
 building_type_fort_garrote_01: "Форт Гаррота"
 building_type_fort_garrote_01_desc: "$building_fort_garrote_01_desc$"
 building_fort_garrote_01: "Форт Гаррота"
 building_fort_garrote_01_desc: "Этот недавно основанный аванпост на окраине Орлея построен для наблюдения за вражескими вторжениями. Пока форт едва пригоден для полноценного использования: всё подчинено практической пользе, а не удобству. Тем не менее во внутреннем дворе можно одновременно разместить до сотни солдат."
 building_type_fort_garrote_02: "$building_type_fort_garrote_01$"
 building_type_fort_garrote_02_desc: "$building_fort_garrote_02_desc$"
 building_fort_garrote_02: "Крепость Гаррота"
 building_fort_garrote_02_desc: "Форт укрепили и дополнили большой башней у ворот. Хотя это повысило его защитные качества, ему всё ещё далеко до роскоши — даже зелень во внутреннем дворе выглядит чахлой и узловатой."
 ### Forteresse du Chagrin
 building_type_forteresse_du_chagrin_01: "Форт Печали"
 building_type_forteresse_du_chagrin_01_desc: "Этот замок построили тевинтерские магистры, укрепившие его стены магией крови. Позднее Маферат разграбил его и оставил в руинах во время [Concept('exalted_march','Священного похода')|E] Андрасте. Так продолжалось, пока Серые Стражи не восстановили замок во время Второго [Concept('blight','Мора')|E], чтобы занять выгодную позицию для ударов во фланг [Concept('darkspawn','порождениям тьмы')|E], хлынувшим из Морозных гор. Ныне он служит Джейдеру оборонительным пунктом у земель клейнов."
 building_forteresse_du_chagrin_01: "Форт Печали"
 building_forteresse_du_chagrin_01_desc: "Этот замок построили тевинтерские магистры, укрепившие его стены магией крови. Позднее Маферат разграбил его и оставил в руинах во время [Concept('exalted_march','Священного похода')|E] Андрасте. Так продолжалось, пока Серые Стражи не восстановили замок во время Второго [Concept('blight','Мора')|E], чтобы занять выгодную позицию для ударов во фланг [Concept('darkspawn','порождениям тьмы')|E], хлынувшим из Морозных гор. Ныне он служит Джейдеру оборонительным пунктом у земель клейнов."
 building_forteresse_du_chagrin_02: "Великий Форт Печали"
 building_forteresse_du_chagrin_02_desc: "Древнюю крепость отремонтировали, как только необходимость в восстановлении стала очевидной. Прошли те времена, когда новобранцы Стражей забредали в обвалившиеся сторожевые башни. Маги укрепили старые руны и добавили новые, чтобы усилить оборону."
 ### Goldsnake Estate
 building_type_goldsnake_estate_01: "Дворец"
 building_type_goldsnake_estate_01_desc: "$building_goldsnake_estate_01_desc$"
 building_goldsnake_estate_01: "Поместье Златозмея"
 building_goldsnake_estate_01_desc: "Здесь находится бывшее поместье печально известного Андекаруса Златозмея. Он возвёл эти роскошные палаты, чтобы надёжно хранить богатства и с наибольшей эффективностью собирать налоги с подданных, к немалому недовольству местных жителей."
 building_type_goldsnake_estate_02: "$building_type_goldsnake_estate_01$"
 building_type_goldsnake_estate_02_desc: "$building_goldsnake_estate_02_desc$"
 building_goldsnake_estate_02: "Неслыханно роскошное поместье Златозмея"
 building_goldsnake_estate_02_desc: "Поместье Златозмея отреставрировали с такой пышностью, что его сочли бы чрезмерным даже по меркам Вал Руайо. Однако прекрасное здание, стиль которого полюбился местным жителям, по-прежнему выполняет первоначальную функцию — служит беспощадно эффективной и хорошо укреплённой налоговой конторой. До сих пор спорят, призваны ли роскошные люстры скрывать алчность, присущую этому месту, или, напротив, выставлять её напоказ."
 ### Grand Cathedral of Val Royeaux
 building_type_grand_cathedral_of_val_royeaux_01: "Великий собор Вал Руайо"
 building_type_grand_cathedral_of_val_royeaux_01_desc: "На руинах крепости печально известной королевы Джешевис император Кордилиус I возвёл грандиозный храм во славу Андрасте. Великий Собор также стал престолом [Concept('divine','Верховной Жрицы')|E], духовной главы Орлесианской [Concept('chantry','Церкви')|E]."
 building_grand_cathedral_of_val_royeaux_01: "$building_type_grand_cathedral_of_val_royeaux_01$"
 building_grand_cathedral_of_val_royeaux_01_desc: "$building_type_grand_cathedral_of_val_royeaux_01_desc$"
 building_grand_cathedral_of_val_royeaux_02: "Великий Собор Вал Руайо"
 building_grand_cathedral_of_val_royeaux_02_desc: "Этот храм, посвящённый [Concept('andraste','Андрасте')|E], определил облик целой эпохи и не имеет равных по красоте и величию. Великий Собор служит высшим воплощением благочестия верующих, а две его исполинские башни господствуют над горизонтом на много миль вокруг."
 ### Great Wall of Deauvin
 building_type_deauvin_wall_01: "Великая стена Довена"
 building_type_deauvin_wall_01_desc: "Эту оборонительную стену возвели вскоре после основания Орлея Кордилиусом I. Местная знать понимала, что из-за окраинного положения её земли считались малозначимыми с военной точки зрения: здесь Империя граничила только с Долами. Поэтому для защиты от языческих [Concept('elves','эльфов')|E] была построена великая стена."
 building_deauvin_wall_01: "Запущенная Великая стена Довена"
 building_deauvin_wall_01_desc: "Эту оборонительную стену возвели вскоре после основания Орлея Кордилиусом I. Местная знать понимала, что из-за окраинного положения её земли считались малозначимыми с военной точки зрения: здесь Империя граничила только с Долами. Поэтому для защиты от языческих [Concept('elves','эльфов')|E] была построена великая стена. Так местные лорды подарили миру грандиозное сооружение, которое мог бы возвести Вал Руайо, но на которое столица так и не выделила средств. В наши дни этот участок стены пришёл в упадок и уже не так эффективен, как прежде."
 building_deauvin_wall_02: "Престижная и прославленная Великая стена Довена"
 building_deauvin_wall_02_desc: "Этот участок старой оборонительной стены восстановили, и теперь он надёжно защищает рубежи Довена от любого врага. Довен не лежал на пути армий, вторгавшихся к сердцу Империи, поэтому Престижная и прославленная Великая стена строилась не для защиты всего Орлея, а ради безопасности местных жителей. Сегодня, несмотря на огромные расходы, стена остаётся шедевром архитектуры и инженерного искусства, а также превосходной оборонительной позицией."
 building_type_deauvin_wall_03: "Великая стена Довена"
 building_type_deauvin_wall_03_desc: "Эту оборонительную стену возвели вскоре после основания Орлея Кордилиусом I. Местная знать понимала, что из-за окраинного положения её земли считались малозначимыми с военной точки зрения: здесь Империя граничила только с Долами. Поэтому для защиты от языческих [Concept('elves','эльфов')|E] была построена великая стена."
