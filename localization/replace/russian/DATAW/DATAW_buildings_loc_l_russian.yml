 building_type_deauvin_wall_07_desc: "Эту оборонительную стену возвели вскоре после основания Орлея Кордилиусом I. Местная знать понимала, что из-за окраинного положения её земли считались малозначимыми с военной точки зрения: здесь Империя граничила только с Долами. Поэтому для защиты от языческих [Concept('elves','эльфов')|E] была построена великая стена."
 building_deauvin_wall_07: "Запущенная Великая стена Довена"
 building_deauvin_wall_07_desc: "Эту оборонительную стену возвели вскоре после основания Орлея Кордилиусом I. Местная знать понимала, что из-за окраинного положения её земли считались малозначимыми с военной точки зрения: здесь Империя граничила только с Долами. Поэтому для защиты от языческих [Concept('elves','эльфов')|E] была построена великая стена. Так местные лорды подарили миру грандиозное сооружение, которое мог бы возвести Вал Руайо, но на которое столица так и не выделила средств. В наши дни этот участок стены пришёл в упадок и уже не так эффективен, как прежде."
 building_deauvin_wall_08: "Престижная и прославленная Великая стена Довена"
 building_deauvin_wall_08_desc: "Этот участок старой оборонительной стены восстановили, и теперь он надёжно защищает рубежи Довена от любого врага. Довен не лежал на пути армий, вторгавшихся к сердцу Империи, поэтому Престижная и прославленная Великая стена строилась не для защиты всего Орлея, а ради безопасности местных жителей. Сегодня, несмотря на огромные расходы, стена остаётся шедевром архитектуры и инженерного искусства, а также превосходной оборонительной позицией."
 building_type_deauvin_wall_09: "Великая стена Довена"
