 ### Halamshiral 
 building_type_halamshiral_01: "Город Халамширал"
 building_type_halamshiral_01_desc: "Лесной город Халамширал (что в переводе с эльфийского означает «конец пути») — первый в своем роде со времен легендарного Арлатана. Немногие [human|E] люди созерцали его, ибо [elves|E] эльфы ревностно охраняют свои границы."
 building_halamshiral_01: "$building_type_halamshiral_01$"
 building_halamshiral_01_desc: "$building_type_halamshiral_01_desc$"
 ### Halla Vhenasan
 building_type_halla_vhenasan_01: "Галла Венасан"
 building_halla_vhenasan_01: "Галла Венасан"
 building_halla_vhenasan_01_desc: "Здесь, в этом святилище, последователи Эванурисов верят, что Гиланайон создала галл — этих великолепных существ, так полезных в повседневной жизни. Каждый день прохожие замечают многочисленные стада галл, бродящие по небольшой поляне, к их великой радости."
 building_halla_vhenasan_02: "Храм Галла Венасан"
 building_halla_vhenasan_02_desc: "Часть леса расчистили, и теперь на краю поляны, составляющей Галла Венасан, возвышается пышно украшенный небольшой храм в характерном долийском стиле, подражающем Арлатану — в знак почитания Гиланайон, Матери галл. Несколько человек также поселились подле храма, чтобы ухаживать за галлами — к огромной радости местных жителей."
 ### Imperial Palace of Orlais
 building_type_imperial_palace_orlais: "Императорский дворец Орлея"
 building_type_imperial_palace_orlais_desc: "Сияющая жемчужина Орлесианской империи, Императорский дворец Орлея величественно возвышается над городом Вал Руайо, а перед ним простирается Неспящее море. Три его купола ослепляют и завораживают, и весь Тедас восторгается элегантностью и красотой его архитектуры.\n\nСегодня Императорский дворец стоит как оплот Империи Орлей, основанной Драконом, соперничая по престижу с великим дворцом Архонта в Минратосе."
 building_imperial_palace_orlais: "$building_type_imperial_palace_orlais$"
 building_imperial_palace_orlais_desc: "$building_type_imperial_palace_orlais_desc$"
 ### Jeshavis' Digue
 building_type_jeshavis_dyke_01: "Дамба Ешавис"
 building_type_jeshavis_dyke_01_desc: "Когда Ешавис объединила племена сириан, она создала систему дамб на западной границе Джадера для защиты своих земель от аламарри, чтобы налётчики и захватчики больше никогда не смогли разорять владения сириан."
 building_jeshavis_dyke_01: "Дамба Ешавис"
 building_jeshavis_dyke_01_desc: "Когда Ешавис объединила племена сириан, она создала систему дамб на западной границе Джадера для защиты своих земель от аламарри, чтобы налётчики и захватчики больше никогда не смогли разорять владения сириан."
 ### Kal Repartha
 building_type_kal_repartha_01: "Кэл Репарта"
 building_type_kal_repartha_01_desc: "$building_kal_repartha_01_desc$"
 building_kal_repartha_01: "Кэл Репарта"
 building_kal_repartha_01_desc: "Руины древнего гномьего тэйга усеивают ландшафт этого региона. Хотя присутствие тэйга на поверхности сбивает с толку многих учёных, название Кэл Репарта — одно из редких сведений, известных об этом сооружении. Сказания о его грандиозных постройках, процветании и мастерских ремесленниках вдохновляют местных жителей и по сей день."
 building_type_kal_repartha_02: "$building_type_kal_repartha_01$"
 building_type_kal_repartha_02_desc: "$building_kal_repartha_02_desc$"
 building_kal_repartha_02: "Восстановленный Кэл Репарта"
 building_kal_repartha_02_desc: "Теперь, когда пески и дюны вытеснены из тэйга, великие чертоги и здания Кэл Репарта стойко возвышаются среди Священной равнины. Они стоят как памятник виртуозному гномьему инженерному искусству совершенного Файреля, который, по заверению реставраторов, и построил этот наземный тэйг — пусть даже Совет Хранителей Орзаммара утверждает, будто он никогда не покидал [deep_roads|E] Глубинные тропы живым. Тем не менее, предания о шедеврах ремесла, процветании и уникальном месте этого тэйга в истории гномов делают Кэл Репарта достойным высочайшего уважения."
 building_type_kal_repartha_03: "$building_type_kal_repartha_01$"
 building_type_kal_repartha_03_desc: "$building_kal_repartha_03_desc$"
 building_kal_repartha_03: "Великолепный Кэл Репарта"
 building_kal_repartha_03_desc: "С помощью редких представителей касты кузнецов и ремесленников, решивших уйти на поверхность, Кэл Репарта ныне восстановлен во всем своем величии — так, чтобы выдержать и изнурительную осаду, и век процветания. Разнообразные великие залы, отражающие богатую историю тэйга и пышные пейзажи Западного предела до Второго [[Concept('blight','Мора')|E]|E] Morа, придают этому месту еще больше красоты. Кто бы ни взглянул на этот шедевр — город, перестроенный среди дюн, — никто, даже сами [dwarves|E] гномы Орзаммара, не сможет отрицать его величия."
 ### Kinloch Hold
 building_type_kinloch_hold_01: "Кинлох"
 building_type_kinloch_hold_01_desc: "Сторожевая башня и крепость, построенная авварами при помощи гномов, считавшаяся практически неприступной. Аввары говорят, что озеро вокруг башни когда-то было местом Беленаса — горы, стоявшей в центре мира, с которой Корт, Отец Гор, обозревал землю и небо."
 building_kinloch_hold_01: "$building_type_kinloch_hold_01$"
 building_kinloch_hold_01_desc: "$building_type_kinloch_hold_01_desc$"
 building_kinloch_hold_02: "Башня магов Кинлоха"
 building_kinloch_hold_02_desc: "Тевинтерцы верят, что воды озера Каленхад благословлены Разикаль, богиней тайн, и каждый, кто пьет из них, обретает особое прозрение. Именно поэтому они построили великую башню на острове посреди озера, надеясь, что силы вод помогут их магическим изысканиям."
 building_kinloch_hold_03: "Проклятая башня Кинлоха"
 building_kinloch_hold_03_desc: "Когда первоначальная сторожевая башня была захвачена Империей, тевинтерцы перебили авваров с такой жестокостью, что теперь заброшенная башня магов, построенная на этом месте, считается проклятой и населенной призраками."
 building_kinloch_hold_04: "Башня Круга Кинлоха"
 building_kinloch_hold_04_desc: "Раскол с тевинтерской [chantry|E] Церковью вызвал сильное неприятие [dataw_magic|E] магии на всех южных землях. [circle|E] Круг магов Денерима был вынужден покинуть свою башню в городе (которая впоследствии была снесена) и взять под контроль старую тевинтерскую башню, где они могли бы спокойно практиковать свое искусство."
 ### Korcari Gold Pools
 building_type_korcari_gold_mine_01: "Золотые купели Коркари"
 building_type_korcari_gold_mine_01_desc: "Местные жители часто говорили, что эти купели благословлены из-за изобилия золота, плавающего в воде и заставляющего ее переливаться на солнце. Многие промывают его для использования в ювелирных украшениях и безделушках, которыми торгуют по всем Диким землям."
 building_korcari_gold_mine_01: "$building_type_korcari_gold_mine_01$"
 building_korcari_gold_mine_01_desc: "$building_type_korcari_gold_mine_01_desc$"
 building_korcari_gold_mine_02: "Золотые рудники Коркари"
 building_korcari_gold_mine_02_desc: "После долгих усилий купели были осушены, а для поиска источника золота на глубине были вырыты новые карьеры. Эти новые рудники приносят в регион огромное богатство благодаря высокому количеству добываемого золота, идущего на украшения, продаваемые даже за пределами Диких земель."
 ### Marquis Hunting Grounds
 building_type_marquis_hunting_grounds_01: "Охотничьи угодья маркиза"
 building_type_marquis_hunting_grounds_01_desc: "Вал Форе известен как прекрасное место для охоты, привлекающее людей со всего Орлея. Густой лес полон великолепных зверей, таких как бурые медведи Вал Форе. Крестьяне и дворяне охотятся в этом живописном лесу и приносят богатую добычу на радость тем, кто ищет мясо и шкуры."
 building_marquis_hunting_grounds_01: "Охотничьи угодья маркиза"
 building_marquis_hunting_grounds_01_desc: "Вал Форе известен как прекрасное место для охоты, привлекающее людей со всего Орлея. Густой лес полон великолепных зверей, таких как бурые медведи Вал Форе. Крестьяне и дворяне охотятся в этом живописном лесу и приносят богатую добычу на радость тем, кто ищет мясо и шкуры."
 building_marquis_hunting_grounds_02: "Охотничье бюро Вал Форе"
 building_marquis_hunting_grounds_02_desc: "Из-за размаха браконьерства среди крестьян в окрестных лесах пришло время открыть охотничье бюро. В сотрудничестве с местной стражей бюро обязывает всех охотников покупать лицензию на охоту в угодьях Вал Форе под угрозой наказания. Хотя это принесло порядок и доход местным властям, охота среди крестьян из-за этого пошла на спад."
 marquis_hunting_grounds_desc: "Значительно повышает вероятность появления опасных животных и $unlocks_building_desc$Увеличивает шанс [hunt_sighting|E] обнаружения добычи и [hunt_success_chance|E] успеха для[GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName] [activities|E] охоты, устраиваемой в этом [holding|E] владении."
 activity_hunt_province_desc_marquis_hunting_grounds_minor: "#P ++ $building_type_marquis_hunting_grounds_01$#! ([building|E])\n"
 activity_hunt_province_desc_marquis_hunting_grounds_major: "#P +++ $building_type_marquis_hunting_grounds_01$#! ([building|E])\n"
 ### Mesa of Deavuin
 building_type_deauvin_mesa_01: "Плато Довена"
 building_type_deauvin_mesa_01_desc: "Это природное образование — крупнейшее плато Южного Орлея. Его особенности не раз использовались для решающих сражений, особенно Вал Фалезом в их оборонительных войнах в бурные времена до объединения Орлея Кордиллиусом. По сей день плато остается одним из главных украшений Довена, поражая своими размерами и величественностью, и доминирует над пейзажем Равнин Довен на много миль вокруг."
 building_deauvin_mesa_01: "Великое плато Довена"
 building_deauvin_mesa_01_desc: "Это природное образование — крупнейшее плато Южного Орлея. Его особенности не раз использовались для решающих сражений, особенно Вал Фалезом в их оборонительных войнах в бурные времена до объединения Орлея Кордиллиусом. По сей день плато остается одним из главных украшений Довена, поражая своими размерами и величественностью, и доминирует над пейзажем Равнин Довен на много миль вокруг."
 ### Mont Laures Hermitage
 building_type_mont_laures_01: "Обитель Мон-Лор"
 building_type_mont_laures_01_desc: "Никто не знает, когда именно пещеры стали использовать как обитель. Сменяя поколения, она просуществовала века и дала горе её нынешнее название. Развиваясь с моментов основания Орлесианской Церкви и создания самого Орлея, обитель остаётся известным памятником, любимым местным населением."
 building_mont_laures_01: "$building_type_mont_laures_01$"
 building_mont_laures_01_desc: "$building_type_mont_laures_01_desc$"
 ### Montsimmard Circle
 building_type_montsimmard_circle_01: "Круг Монсиммара"
 building_type_montsimmard_circle_01_desc: "[circle|E] Круг Монсиммара с самого основания был известен как великий оплот науки. Говорят, что обучавшиеся здесь маги часами штудировали бесконечные книги великой библиотеки, изучая языки, теологию, математику и многое другое."
 building_montsimmard_circle_01: "Руины Круга Монсиммара"
 building_montsimmard_circle_01_desc: "[circle|E] Круг Монсиммара с самого основания был известен как великий оплот науки. Говорят, что обучавшиеся здесь маги часами штудировали бесконечные книги великой библиотеки, изучая языки, теологию, математику и многое другое. Однако Второй [[Concept('blight','Мора')|E]|E] Мор оставил [circle|E] Круг в плачевном состоянии, и этот дом науки держится из последних сил, проклиная [elves|E] эльфов, которые бездействовали, пока гибли невинные и утрачивались бесценные знания."
 building_montsimmard_circle_02: "Восстановленный Круг Монсиммара"
 building_montsimmard_circle_02_desc: "Ныне перестроенный до того величия, которым он обладал до рокового нападения в 1:25 Века Священности, [circle|E] Круг Монсиммара вновь хранит крупнейшую библиотеку магической истории. Многие сравнивают её с великими магическими библиотеками Империи как с равными себе. Маги снова могут погрузиться в бесконечные книги по истории и традициям, а этот Круг вновь взращивает величайших учёных [thedas|E] Тедаса."
 ### Montsimmard Estate
 building_type_montsimmard_estate_01: "Великое поместье Монсиммара"
 building_type_montsimmard_estate_01_desc: "Великое поместье Монсиммара, дом великих родов Южного Орлея, восходящий к временам, когда город находился в числе крупнейших городов-государств."
 building_montsimmard_estate_01: "Разрушенное поместье Монсиммара"
 building_montsimmard_estate_01_desc: "Здесь находятся руины некогда Великого поместья Монсиммара, дома великих родов Южного Орлея. Нашествие [darkspawn|E] порождений тьмы, как и везде в городе, сильно повредило этот пережиток былой славы, и то, что поместье всё ещё стоит — настоящее чудо."
 building_montsimmard_estate_02: "Восстановленное великое поместье"
 building_montsimmard_estate_02_desc: "Вместе с реставрацией Великого поместья вернулось и чувство гордости. Монсиммару не только удалось отбить нападение [darkspawn|E] порождений тьмы, но и перестроить родовой замок с еще большим пылом и пышностью. И сегодня Монсиммар известен как столица Юга и родина первой [Concept('divine','Верховной Жрицей')|E] Верховной Владычицы, и местные жители никому не дадут об этом забыть. Особенно [elves|E] эльфам."
 ### Montsimmard Keep
 building_type_montsimmard_keep_01: "Крепость Монсиммара"
 building_type_montsimmard_keep_01_desc: "Великая крепость Юга. Она выстояла против всех порождений, что [maker|E] Создатель обрушил на неё."
 building_montsimmard_keep_01: "Разрушенная крепость Монсиммара"
 building_montsimmard_keep_01_desc: "Когда [darkspawn|E] порождения тьмы хлынули в сам город, многие горожане укрылись в цитадели. Но не все успели вовремя, и монстры пошли на штурм, карабкаясь по стенам и разрушая их. Хотя враг в итоге был отброшен благодаря дерзкому маневру, использованию горящей смолы и магии огня, на крепости Монсиммара все еще видны глубокие шрамы десятилетий войны и катастрофической нехватки средств."
 building_montsimmard_keep_02: "Отреставрированная крепость Монсиммара"
 building_montsimmard_keep_02_desc: "Шрамы былых битв больше не уродуют стены крепости. Она больше не выглядит как нечто среднее между руинами и фортом. Крепость Монсиммара перестроена во всем своем величии вопреки всему и стоит столь же могучей и прекрасной, украшенная фресками с изображением подвигов, спасших город от уничтожения. Монсиммар никогда не забудет [elves|E] эльфов, бросивших людей на гибель, но никогда не забудет и то, что спас себя сам, вновь став гордой столицей Юга."
 ### Nahashin Palace
 building_type_nahashin_palace_01: "Дворец"
 building_type_nahashin_palace_01_desc: "$building_nahashin_palace_01_desc$"
 building_nahashin_palace_01: "Королевский дворец на болотах"
 building_nahashin_palace_01_desc: "Дворец в центре Нахашина, служащий объединяющим центром для всего региона. Построен как крепость легендарным Мартелем, основателем династии Маршетов."
 building_type_nahashin_palace_02: "$building_type_nahashin_palace_01$"
 building_type_nahashin_palace_02_desc: "$building_nahashin_palace_02_desc$"
 building_nahashin_palace_02: "Королевский престол Нахашина"
 building_nahashin_palace_02_desc: "Укрепленный и пышно отреставрированный дворец стал Королевским престолом Нахашина — великолепной обителью, достойной монарха. Он возвышается над болотами благодаря монументальным стенам, являясь как величественным, так и практичным сооружением. Ибо престол — это не просто роскошные палаты, откуда надлежит править Болотами, но и непреступная цитадель, способная при необходимости выдержать долгую и тяжелую осаду."
 ### Naissance d'Andraste
 building_type_naissance_d_andraste_01: "Рождение Андрасте"
 building_type_naissance_d_andraste_01_desc: "Возведён в начале истории Церкви на месте перестроенного храма Древних Богов в честь места рождения Андрасте. Благодаря стратегическому положению Джадера, местная Церковь с момента постройки используется для мирных переговоров. В её стенах принимали ферелденских варваров, орлесианских мятежников и даже эльфийских еретиков — и всё ради сохранения мира на восточных рубежах Орлея."
 building_naissance_d_andraste_01: "Рождение Андрасте"
 building_naissance_d_andraste_01_desc: "Возведён в начале истории Церкви на месте перестроенного храма Древних Богов в честь места рождения Андрасте. Благодаря стратегическому положению Джадера, местная Церковь с момента постройки используется для мирных переговоров. В её стенах принимали ферелденских варваров, орлесианских мятежников и даже эльфийских еретиков — и всё ради сохранения мира на восточных рубежах Орлея."
 ### Orzammar Entrance
 building_type_orzammar_entrance: "Вход в Орзаммар"
 building_type_orzammar_entrance_desc: "[dwarves|E] Гномы славятся своим мастерством, и город Орзаммар — одно из лучших их творений. Один из двух сохранившихся тэйгов, составлявших их былую империю; его жители — гордый народ, привыкший к невзгодам и строго чтящий традиции."
 building_orzammar_entrance: "$building_type_orzammar_entrance$"
 building_orzammar_entrance_desc: "$building_type_orzammar_entrance_desc$"
 ### Ostagar
 building_type_ostagar_01: "Остагар"
 building_type_ostagar_01_desc: "Когда-то одна из важнейших оборонительных крепостей к югу от Неспящего моря, эта цитадель была заброшена после падения Тевинтера и успешно разграблена дикарями, в итоге окончательно превратившись в руины. То, что большинство стен стоит и по сей день — свидетельство невероятной магии построившей её Империи."
 building_ostagar_01: "Остагар (разрушенный)"
 building_ostagar_01_desc: "Когда-то одна из важнейших оборонительных крепостей к югу от Неспящего моря, эта цитадель была заброшена после падения Тевинтера и успешно разграблена дикарями, в итоге окончательно превратившись в руины. То, что большинство стен стоит и по сей день — свидетельство невероятной магии построившей её Империи."
 building_ostagar_02: "Остагар (восстановленный)"
 building_ostagar_02_desc: "Перекрывая узкий проход в холмах, эта перестроенная крепость вынуждает врагов искать обходные пути, чтобы добраться до плодородных низин на севере. Её чрезвычайно трудно штурмовать из-за естественно защищенного положения."
 building_ostagar_03: "Остагар (великолепный)"
 building_ostagar_03_desc: "Некогда заброшенная и лежавшая в руинах, эта историческая крепость снова во всем блеске демонстрирует величие древнего Тевинтера."
 ### Perendale Circle
 building_type_perendale_circle: "Круг Перендейла"
 building_type_perendale_circle_desc: "Эта башня, построенная Тевинтером для защиты магистров от атак сириан и ингиршей, ныне переоборудована под Круг магов. Сложная система укреплений, возведённая для защиты их роскошных покоев, отлично сохранилась: она превращает круг не только в хорошую позицию для обороны от демонических сил и внешних налётчиков, но и в надежное место для баррикадирования самих магов."
 building_perendale_circle: "$building_type_perendale_circle$"
 building_perendale_circle_desc: "$building_type_perendale_circle_desc$"
 ### Sacred Hunting Grounds
 building_type_sacred_hunting_ground_01: "Священные охотничьи угодья"
 building_type_sacred_hunting_ground_01_desc: "$building_sacred_hunting_ground_01_desc$"
 building_sacred_hunting_ground_01: "Священные леса Андрасте"
 building_sacred_hunting_ground_01_desc: "Эти леса почитались местными жителями из поколения в поколение, а охота в них считалась священным актом — способом прославить [maker|E] Создателя в этих глухих краях. Таким образом, эти леса считаются священными, а регулярная охота наделила местных жителей высоким мастерством стрельбы из лука."
 building_type_sacred_hunting_ground_02: "$building_type_sacred_hunting_ground_01$"
 building_type_ciriane_frontier_outpost_02_desc: "$building_sacred_hunting_ground_02_desc$"
 building_sacred_hunting_ground_02: "Церковь Священной Охоты"
 building_sacred_hunting_ground_02_desc: "С постройкой храма на священных землях местная [chantry|E] Церковь теперь поощряет охоту не просто как обычай региона, а как священнодействие, сопровождаемое пением Песней во время разделки зверя. Мясо раздаётся верным последователям, разящим добычу из лука во славу [maker|E] Создателя."
 sacred_hunting_ground_desc: "$unlocks_building_desc$Увеличивает шанс [hunt_sighting|E] обнаружения добычи и [hunt_success_chance|E] успеха для[GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName] [activities|E] охоты, устраиваемой в этом [holding|E] владении.\n\nПо завершении [GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName] [activities|E] охоты, устраиваемой в этом [county|E] графстве, будет получен бонус к [piety|E] благочестию."
 ### Salmont River
 building_type_salmont_special_building_01: "Река Салмонт"
 building_type_salmont_special_building_01_desc: "Через центр городка Салмонт протекает небольшая река, берущая начало далеко в Морозных горах. Хотя она слишком мала для судоходства и торговли, изобилие лосося и свежей воды побудило многих поселиться по её берегам, сформировав нынешнюю планировку города, разделенного на два берега."
 building_salmont_special_building_01: "Река Салмонт"
 building_salmont_special_building_01_desc: "Через центр городка Салмонт протекает небольшая река, берущая начало далеко в Морозных горах. Хотя она слишком мала для судоходства и торговли, изобилие лосося и свежей воды побудило многих поселиться по её берегам, сформировав нынешнюю планировку города, разделенного на два берега."
 building_salmont_special_building_02: "Великая животворящая мельница Салмонта"
 building_salmont_special_building_02_desc: "Постройка водяной мельницы подстегнула экономический рост, пусть и в ущерб ловле лосося, которая постепенно угасла. Тем не менее, теперь товары перерабатываются на месте по гораздо более низкой цене, что идет на пользу местному делу и развитию."
 ### Silver Mine
 building_type_silver_mine_01: "Серебряные рудники Перендейла"
 building_type_silver_mine_01_desc: "$building_silver_mine_01_desc$"
 building_silver_mine_01: "Серебряные рудники Перендейла"
 building_silver_mine_01_desc: "Перендейл и его окрестности известны тремя вещами: драконами, этими будь они прокляты козами и серебром. Неудивительно, что серебряные рудники составляют основу богатства города и дают простолюдинам работу. Хотя в тоннелях [deep_roads|E] Глубинных троп есть потенциал для расширения, работы там не ведутся из страха привлечь [darkspawn|E] порождений тьмы."
 building_silver_mine_02: "Сеть серебряных шахт Перендейла"
 building_silver_mine_02_desc: "Страх перед атаками [darkspawn|E] порождений тьмы не остановил жажду выгоды: огромные тоннели соединили рудники с [deep_roads|E] Глубинными тропами, а для защиты от скверны был установлен подъемник. Хотя эта сеть принесла Перендейлу огромное богатство, она принесла и смерть — некоторые шахтеры возвращаются зараженными, если вообще возвращаются."
 ### Solasan Temple
 building_type_solasan_temple_01: "Храм Соласан"
 building_type_solasan_temple_01_desc: "$building_solasan_temple_01_desc$"
 building_solasan_temple_01: "Храм Соласан"
 building_solasan_temple_01_desc: "Отравленная вода, странные твари, историй о пропадающих или сходящих с ума людях... Множество слухов окружает странный оазис и древний эльфийский храм. Многие проклинают это место за творящиеся в округе странности. Некоторые маги из Маркхемского Круга рассказывали, что в оазисе можно найти особые осколки для открытия дверей внутри Соласана, хотя сами они так и не были найдены, словно скрытые от взора какой-то магией. Негодуя перед опасностью, люди тянутся к затерянному оазису — ради природной красоты, охоты на опасных тварей, добычи ресурсов или таинственной двери, ведущей вглубь запретного храма."
 ### Soldier's Peak
 building_type_soldiers_peak_01: "Вершина Солдат"
 building_type_soldiers_peak_01_desc: "Создана как штаб-квартира Серых Стражей в Ферелдене, чтобы они могли продолжать работу по предотвращению опустошений, приносимых порождениями тьмы и Морами."
 building_soldiers_peak_01: "$building_type_soldiers_peak_01$"
 building_soldiers_peak_01_desc: "$building_type_soldiers_peak_01_desc$"
 ### Southern_Monastery
 building_type_southern_monastery_01: "Великий южный монастырь"
 building_southern_monastery_01: "Монастырь Южного рубежа"
 building_southern_monastery_01_desc: "Монастырь, возведенный во славу [maker|E] Создателя на самом далеком рубеже [thedas|E] Тедаса. Хотя этот храм изолирован, его глубоко уважают и любят в регионе. Он служит истоком веры для множества местных жителей, что поклялись в верности Церкви и осуждают всех, кто лишен благочестия."
 southern_monastery_desc_01: "Сопротивление обращению в другую веру: +15%"
 building_southern_monastery_02: "Святая сокровищница писаний Верховных Владычиц"
 building_southern_monastery_02_desc: "Скромный монастырь был отстроен ради более великой цели: сохранения писаний Верховных Владычиц Вал Руайо. Здесь хранятся, сберегаются и изучаются труды от Джустинии Первой до последних Владычиц. Это место стало уважаемым и уникальным центром теологических дискуссий, а многие ученые отсюда взращивают технологический и социальный прогресс."
 southern_monastery_desc_02: "Сопротивление обращению в другую веру: +25%"
 STEWARD_PROMOTE_RELIGION_BUILDING_PENALTY: "Сопротивление здания обращению"
 ### Suledin Keep
 building_type_suledin_keep_01: "Крепость Суледин"
 building_type_suledin_keep_01_desc: "Среди скалистых высокогорий Долов возвышается мрачная цитадель. Эта исполинская крепость служит резиденцией долийскому лорду, чья тень длиннее стен самой цитадели... В этих отдаленных холмах хозяин крепости Суледин обладает абсолютной властью."
 building_suledin_keep_01: "$building_type_suledin_keep_01$"
 building_suledin_keep_01_desc: "$building_type_suledin_keep_01_desc$"
 ### Summer Bazaar
 building_type_the_summer_bazaar_01: "Летний базар"
 building_type_the_summer_bazaar_01_desc: "Биение сердца Вал Руайо, где на шумных прилавках торгуют товарами со всего Тедаса. Расположенный на пересечении Имперских трактов древнего Тевинтера, он является крупнейшим торговым узлом континента."
 building_the_summer_bazaar_01: "$building_type_the_summer_bazaar_01$"
 building_the_summer_bazaar_01_desc: "$building_type_the_summer_bazaar_01_desc$"
 building_the_summer_bazaar_02: "В разработке"
 building_the_summer_bazaar_02_desc: "В разработке"
 ### Sunstop Mountains
 building_type_sunstop_mountains_01: "Горы Заходящего Солнца"
 building_type_sunstop_mountains_01_desc: "$building_sunstop_mountains_01_desc$"
 building_sunstop_mountains_01: "Горы Заходящего Солнца"
 building_sunstop_mountains_01_desc: "Горы Заходящего Солнца возвышаются над дюнами Шипящих пустырей. Свое название они получили от зрелища, когда солнце выплывает из-за гряды и достигает зенита прямо над пиками, восторгая приезжих дворян. Впрочем, истинную известность горам принесли извилистые тропы — идеальное место как для обороны, так и для бандитских засад."
 ### Skyhold
 building_type_skyhold_01: "Скайхолд"
 building_type_skyhold_01_desc: "О бьющей из поднебесья горе слагают столько же легенд, сколько кланов под небом. И никто не скажет, есть ли среди них хоть капля правды."
 building_skyhold_01: "Химмельтопп"
 building_skyhold_01_desc: "$building_type_skyhold_01_desc$"
 building_skyhold_02: "Тарасил'ан Те'лас"
 building_skyhold_02_desc: "Тарасил'ан те'лас. «Место, где удержали небо» на эльфийском — но [elves|E] эльфы многое забыли, и даже они не помнят истинного значения этих слов."
 building_skyhold_03: "Скайхолд"
 building_skyhold_03_desc: "Крепость в традициях клейнов, Скайхолд внушительно и властно возвышается среди заснеженных пиков. Суровые стены, неприступный донжон и уникальный альпийский сад, укрытый в его стенах, делают цитадель практически неприступной. Это горное укрепление в Морозных горах внушает трепет каждому углядевшему его путешественнику."
 ### Tombigbee
 building_type_tombigbee_01: "$building_tombigbee_01$"
 building_type_tombigbee_01_desc: "$building_tombigbee_01_desc$"
 building_tombigbee_01: "Свайный город Томбигби"
 building_tombigbee_01_desc: "Единственный город в Диких землях Коркари, Томбигби известен тем, что целиком возведен на сваях посреди озера."
 ### Village of Gwaren
 building_type_gwaren_special_building_01: "$building_gwaren_special_building_01$"
 building_type_gwaren_special_building_01_desc: "$building_gwaren_special_building_01_desc$"
 building_gwaren_special_building_01: "Деревня Гварен"
 building_gwaren_special_building_01_desc: "С тех пор как гномы покинули свой аванпост, а богатства Гварена были разграблены, поселение изменилось навсегда. Превратившись в тень былого величия, деревня тем не менее остается важным экономическим узлом побережья благодаря торговле рыбой и лесом."
 ### University of Orlais
 building_type_university_of_orlais: "Университет Орлея"
 building_type_university_of_orlais_desc: "Университет Орлея служит чем-то вроде пристанища для младших детей мелкой знати — тех, у кого мало политических перспектив и чьим семьям надоело развлекать их вереницей учителей."
 building_university_of_orlais: "$building_type_university_of_orlais$"
 building_university_of_orlais_desc: "$building_type_university_of_orlais_desc$"
 ### Vigil's Keep
 building_type_vigils_keep: "Крепость Стражей"
 building_type_vigils_keep_desc: "Крепость Стражей — одно из древнейших поселений Ферелдена, старше Денерима и Гварена. Она видела битвы каждого крупного вторжения. Для авваров, построивших её, Башня Бдения была одновременно и цитаделью, и святыней. Подвалы хранят памятники их богам, героям и редким военным победам."
 building_vigils_keep: "$building_type_vigils_keep$"
 building_vigils_keep_desc: "$building_type_vigils_keep_desc$"
 ### Vir'Abelasan (it is the Altar of Mythal now, the Temple is off-map) (Altar is canon, it's where you fight the dragon)
 building_type_vir_abelasan_01: "Алтарь Митал"
 building_type_vir_abelasan_01_desc: "$building_virelay_ruins_01_desc$"
 building_vir_abelasan_01: "Алтарь Митал"
 building_vir_abelasan_01_desc: "Согласно долийским легендам, далеко на юге, в неисследованных и опасных Арборских диких землях, есть храм, воздвигнутый древними эльфами в честь Митал. Храм считается одним из самых священных мест древнего Эльвенена, яростно охраняемым эльфами, не тронутыми смертностью людей.\n\nПравда это или нет, местный городок, считающийся последней остановкой перед Дикими землями, стал заметным местом для паломников, приходящих почтить героическую борьбу последних истинных эльфов. Впрочем, местные предупреждают: паломники должны ограничивать свой путь Алтарем Митал, ибо каждый, кто углублялся в Арборские земли в поисках легендарного храма, так и не вернулся."
 # building_vir_abelasan_01_desc: "A large temple in the thick of the arbor wilds. The high walls camouflaged under the canopy, decorated in draconic iconography as well as depictions of Mythal herself.\n\nIt is said to have been a place of not just worship, but of justice and knowledge. Now its large doors remain closed, the temple guarded and Mythals pilgrims take their worship to the smaller shrine outside."
 ### Virelay Ruins
 building_type_virelay_ruins_01: "Руины Вирле"
 building_type_virelay_ruins_01_desc: "$building_virelay_ruins_01_desc$"
 building_virelay_ruins_01: "Руины Вирле"
 building_virelay_ruins_01_desc: "Когда-то на месте культа «Дочерей песни», Вирле был домом для множества празднеств. Связь Андрасте с [maker|E] Создателем давала повод для поразительных и регулярных проявлений гедонизма — от поэзии до разгула плотских утех и прочего, что их более ханжеские соседи считали скандальным. Город и культ были уничтожены императором Кордиллиусом Драконом во время его объединительных походов, оставив лишь руины как напоминание."
 building_virelay_ruins_02: "Старый город Вирле"
 building_virelay_ruins_02_desc: "Теперь, когда старый город восстановлен до своего вида перед походaми Дракона, Вирле снова стал домом для поэтов, музыкантов и кутил, вдохновленных историей города. Старый город по сей день служит пристанищем для молодежи и идеалистов, наслаждающихся радостями жизни с молчаливого одобрения местных властей из-за огромной популярности этих утех среди жителей."
 ### Whaling Station
 building_type_whaling_station_01: "Китобойная станция"
 building_whaling_station_01: "Малая китобойная станция"
 building_whaling_station_01_desc: "Традиция невенской охоты на китов древняя, и эта станция в сердце города Мон-де-Гляс — отличный тому пример. Здесь арендуют и продают лодки, а туши китов разделывают на мясо и жир. Станция скромная, но имеет огромное значение для местных жителей."
 building_whaling_station_02: "Большая китобойная станция"
 building_whaling_station_02_desc: "Прежде малая станция, Мон-де-Гляс теперь вмещает огромную китобойную станцию, где количество разделываемых китов велико как никогда. Мясо, китовый жир, кости... Все, что связано с китобойным промыслом, от провианта до судов, можно найти здесь на радость местным."
 building_whaling_station_03: "Великая китобойная верфь Расколотого моря"
 building_whaling_station_03_desc: "То, что раньше было лишь станцией, превратилось в великую верфь — гордость этого уединенного уголка мира. Множество судов строится для прибыльного китобойного промысла на Расколотом море, а чертежи местных кораблей продаются по всему [thedas|E] Тедасу, отправляясь на верфи вплоть до Антивы. Впрочем, во что бы вы ни верили и откуда бы ни пришли, над верфью возвышается величественная статуя [andraste|E] Андрасте с ножом в брюхе кита, которую видно за много миль."
 whaling_station_desc: "Снижает стоимость организации китовой охоты на 20%."
 whaling_station_2_desc: "Снижает стоимость организации китовой охоты на 30%."
 ### White Deer Mountain
 building_type_deer_mountain_01: "Гора Белого Оленя"
 building_deer_mountain_01: "Гора Белого Оленя"
 building_deer_mountain_01_desc: "Гора Белого Оленя обязана своим названием древней легенде неизвестного происхождения. Она повествует о белом олене, который пришел к заблудившемуся в горах ребенку и вывел его к племени. Но когда олень приблизился, люди пронзили его сердце, желая получить мясо. Охваченный гневом из-за подобной жестокости, олень отказался умирать и сбежал прочь с пробитой грудью. Был ли это один из затерянных галл эльфов или бог авваров — одно остается несомненным: охота здесь богатая, а охотникам иногда встречается одинокий белый олень с огромным шрамом у самого сердца, который возвращается снова, сколько бы его ни разили."
 deer_mountain_desc_01: "Бонусы к охоте в этом баронстве.\nПовышенный шанс встретить белого оленя."
 activity_hunt_province_desc_deer_mountain: "#P ++ $building_type_deer_mountain_01$#! ([building|E])\n"
 ### White Spire Fortress
 building_type_the_white_spire_fortress: "Белая Башня"
 building_type_the_white_spire_fortress_desc: "Дом для Круга магов Вал Руайо, бывшая цитадель императора Дракона — одно из немногих сооружений, помимо самого дворца, которое видно из любой точки столицы. Ночью [dataw_magic|E] магия подсвечивает её, превращая в сияющий белый клинок, рассекающий тьму."
 building_the_white_spire_fortress: "$building_type_the_white_spire_fortress$"
 building_the_white_spire_fortress_desc: "$building_type_the_white_spire_fortress_desc$"
 ### Wine Makers Chantry
 building_type_wine_chantry_01: "Винодельческая Церковь"
 building_type_wine_chantry_01_desc: "Во всем регионе местная церковь Модовина acquired особую репутацию благодаря необычной деятельности: виноделию. Знаменитое «Селестинское черное» производится прямо на винограднике за церковью на радость дворянам и простолюдинам. Поговаривают, будто сама [Concept('divine','Верховной Жрицей')|E] Верховная Владычица наслаждалась этим напитком куда сильнее дозволенного, и споры о том, кто именно это был, не утихают в Модовине по сей день."
 building_wine_chantry_01: "Церковь Вина"
 building_wine_chantry_01_desc: "Во всем регионе местная церковь Модовина acquired особую репутацию благодаря необычной деятельности: виноделию. Знаменитое «Селестинское черное» производится прямо на винограднике за церковью на радость дворянам и простолюдинам. Поговаривают, будто сама [Concept('divine','Верховной Жрицей')|E] Верховная Владычица наслаждалась этим напитком куда сильнее дозволенного, и споры о том, кто именно это был, не утихают в Модовине по сей день."
 building_wine_chantry_02: "Церковь Виноделов"
 building_wine_chantry_02_desc: "Из-за скандалов с пьяными песнопевцами виноделие и обитель были разделены. Винодельней теперь управляют бывшие братья, именующие себя «Церковью виноделов» в память о своем духовном прошлом. Новая Церковь и виноградники тесно сотрудничают, обеспечивая как трезвые молитвы, так и хмельные пиры благодаря выборочной продаже «Селестинского черного»."
 feast_cost_discount_wine_chantry: "В локации есть $building_type_wine_chantry_01$"
 activity_feast_province_desc_wine_chantry: "#P +++ $building_type_wine_chantry_01$#! ([building|E])\n"
 feast_cost_discount_wine_desc: "$feast_cost_discount_effect_desc$[EmptyScope.ScriptValue('feast_activity_cost_discount_wine_value')|P0%]"
 ### Wyvern Grave
 building_type_wyvern_grave_01: "Кладбище выверн"
 building_type_wyvern_grave_01_desc: "$building_wyvern_grave_01_desc$"
 building_wyvern_grave_01: "Кладбище выверн"
 building_wyvern_grave_01_desc: "В Дарнуа находится одно из самых странных мест во всем [thedas|E] Тедасе — Кладбище выверн. Сколь помнят хроники, старые выверны всегда прилетали сюда, чтобы провести свои последние дни в покое. Сотни погибающих здесь тварей привлекают охотников за шкурами и костями, что дает городку доход, если закрыть глаза на происхождение этих товаров."

 ### Cendrerin Trading market
 building_type_cendrein_market_01: "Рынок сандреренов"
 building_cendrein_opinion: "Мнение сандреренов ($cendrein$)"
 building_cendrein_market_01: "Торговый рынок сандреренов"
 building_cendrein_market_01_desc: "Благодаря постоянным контактам с сандреренами Пепельного моря в регионе образовался небольшой рынок. От знаменитого рыбного соуса до редких металлов и минералов — кочевники продают всё, чтобы купить товары, недоступные в пустыне. Некоторые из них даже оседают здесь, покидая племена ради городской жизни в Орлеи."
 building_cendrein_market_02: "Базар сандреренов"
 building_cendrein_market_02_desc: "Благодаря вложениям скромный рынок превратился в крупный базар, куда племена приходят торговать товарами со всего [thedas|E] Тедаса, предлагая серу, рыбу и богатства Пепельного моря. Многие сандререны оседают здесь насовсем."
 building_cendrein_market_03: "Квартал сандреренов"
 building_cendrein_market_03_desc: "С ростом присутствия сандреренов в городе появился их собственный квартал. Это упрощает торговлю с кочевниками Пепельного моря и даёт дом значительному общинному меньшинству. Впрочем, некоторые сандререны скучают по странствиям и отправляются искать приключений по всему [thedas|E] Тедасу."
 cendrein_market_01: "Периодически будут прибывать гости-сандререны."
 cendrein_market_02: "Периодически будут прибывать придворные-сандререны."
 cendrein_market_03: "Периодически будут прибывать придворные и искатели приключений сандререны."
 dataw_events_gamord.0072.t: "Торговец-сандререн завоевывает влияние в Лизьер-де-Сандр."
 dataw_events_gamord.0072.desc: "[cendrerin_merchant.GetHerHis] присоединяется к вашему двору."
 dataw_events_gamord.0073.t: "Сандререн-искатель приключений отправляется в путь."
 dataw_events_gamord.0073.desc: "[cendrerin_merchant.GetShortUIName|U] собирает отряд искателей приключений."

 ### Whaling Station
 building_type_whaling_station_01: "Whaling Station"
 building_whaling_station_01: "Small whaling station"
 building_whaling_station_01_desc: "The tradition of Névenais whale hunting is old, and this whale hunting station, in the heart of the city of Mont-de-Glace is a good example of this. Here, boats are rented or sold, and whales are brought back to be skinned for their meat and oil. The station may be small, but it is of great significance to the locals."
 building_whaling_station_02: "Great Whaling Station"
 building_whaling_station_02_desc: "Previously a small station, Mont-de-Glace now houses a great whaling station, where the amount of whales skinned for their meat is greater than ever before. Meat, Whale oil, bones… Everything relating to Whale hunting, from meat to boats, can be found here, to the delight of the local population."
 building_whaling_station_03: "Great Whaling Shipyard of the Sundered Sea"
 building_whaling_station_03_desc: "What was once only a whaling station has now become a great shipyard, the pride of this recluse corner of the world. Plenty of boats are made for the lucrative whaling business on the Sundered Sea, and many types of ships are conceived in plans sold and sent all across [thedas|E], destined to be built in shipyards as far as Antiva. However, no matter who you believe in, whether you come from the Sea of Ash or the heartland of Orlais, the towering statue of [andraste|E], knife in hand deep in a whale’s belly, dominates the shipyard, and can be seen from miles away."
 whaling_station_desc: "Lower cost to sponsor a whale hunt by 20%."
 whaling_station_2_desc: "Lower cost to sponsor a whale hunt by 30%."

 ### Southern_Monastery
 building_type_southern_monastery_01: "Grand Southern Monastery"
 building_southern_monastery_01: "Monastery of the Southern Frontier"
 building_southern_monastery_01_desc: "A monastery built to honour the [maker|E] even on the very last frontier of [thedas|E], this chantry, while isolated, is quite respected and cherished in the region, and is the source of the faith of many locals, who swear by it and condemn the ones without piety."
 southern_monastery_desc_01: "+15% conversion resistance."
 building_southern_monastery_02: "Holy Reserve of the Divines’s Scriptures"
 building_southern_monastery_02_desc: "The small and insignificant monastery has now been erected for a greater purpose: the safekeeping of the scriptures of the Divines of Val Royeaux. From Justinia the First to the last, their writings are kept, preserved and studied, forming a respected and quite unique center of theological debate, all the while giving multiple intellectuals contributing to technological and social advancements."
 southern_monastery_desc_02: "+25% conversion resistance."
 STEWARD_PROMOTE_RELIGION_BUILDING_PENALTY: "Building conversion resistance."

 ### White Deer Mountain
 building_type_deer_mountain_01: "Mountain of the White Deer"
 building_deer_mountain_01: "Mountain of the White Deer"
 building_deer_mountain_01_desc: "The Mountain of the White Deer owes its name to an old legend of unknown origin, which tells of a white deer that came to a child lost in the mountain, and brought him safely back to his tribe. Yet when the deer approached, the tribe pierced its heart, eager for its meat. Full of fury for the violence with which it was repaid, the deer simply refused to die, and fled away, a hole pierced in its heart. Whether this was one of the lost halla of the elves, one of the gods of the Avvar as some pretend or other, one thing remains true and certain. The hunt here is bountiful, and, sometimes, hunters see a lone white deer with a great scar right next to its heart, returning always, no matter how many times it is slain."
 deer_mountain_desc_01: "Bonuses to hunting in this barony.\nIncreased chance of spotting a white deer."
 activity_hunt_province_desc_deer_mountain: "#P ++ $building_type_deer_mountain_01$#! ([building|E])\n"

 ### Halla Vhenasan
 building_type_halla_vhenasan_01: "Галла Венасан"
 building_type_halla_vhenasan_01_desc: "Святилище для галл в Долах."
 building_halla_vhenasan_01: "Галла Венасан"
 building_halla_vhenasan_01_desc: "Последователи Эванурисов верят, что именно здесь Гиланайон создала галл — прекрасных созданий, так полезных в быту. Прохожие каждый день с радостью наблюдают за стадами галл, бродящими по поляне."
 building_halla_vhenasan_02: "Храм Галла Венасан"
 building_halla_vhenasan_02_desc: "Часть леса расчистили, и теперь на краю поляны возвышается небольшой храм в долийском стиле, подражающем Арлатану — в знак почитания Матери галл, Гиланайон. Несколько человек поселились рядом, чтобы ухаживать за галлами на радость местным жителям."
 ### Aeonar
 building_type_aeonar_01: "Руины Эонара"
 building_type_aeonar_01_desc: "Расположенная на северном краю Имперского тракта, башня Эонар была одной из двух башен Тевинтера, построенных до Первого Мора для магических экспериментов. Когда пришли вести о гибели пророчицы Андрасте, ее последователи захватили башню и перебили магов. Из-за экспериментов и резни Завеса здесь стала истонченной до предела."
 building_aeonar_01: "Руины Эонара"
 building_aeonar_01_desc: "Расположенная на северном краю Имперского тракта, башня Эонар была одной из двух башен Тевинтера, построенных до Первого Мора для магических экспериментов. Когда пришли вести о гибели пророчицы Андрасте, ее последователи захватили башню и перебили магов. Из-за экспериментов и резни Завеса здесь стала истонченной до предела."
 building_aeonar_02: "Башня Эонар"
 building_aeonar_02_desc: "Расположенная на северном краю Имперского тракта, башня Эонар ныне под контролем Церкви, а ее местоположение хранят в тайне. Храмовники используют Эонар как тюрьму для магов крови, отступников и их пособников. Из-за истонченной Завесы башня служит «испытанием огнем» для установления вины магов."