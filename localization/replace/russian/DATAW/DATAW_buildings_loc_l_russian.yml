 ### Halamshiral 
 building_type_halamshiral_01: "Город Халамширал"
 building_type_halamshiral_01_desc: "Лесной город Халамширал, название которого переводится с эльфийского как «конец пути», — первый в своём роде со времён легендарного Арлатана. Немногие [Concept('human','люди')|E] видели его собственными глазами, ведь [Concept('elves','эльфы')|E] ревностно охраняют свои границы."
 building_halamshiral_01: "$building_type_halamshiral_01$"
 building_halamshiral_01_desc: "$building_type_halamshiral_01_desc$"
 ### Halla Vhenasan
 building_type_halla_vhenasan_01: "Галла Венасан"
 building_halla_vhenasan_01: "Галла Венасан"
 building_halla_vhenasan_01_desc: "Последователи эванурисов верят, что именно в этом святилище Гиланнайн создала галл — прекрасных существ, столь полезных в повседневной жизни. Каждый день прохожие с радостью наблюдают за многочисленными стадами галл, бродящими по небольшой поляне."
 building_halla_vhenasan_02: "Храм Галла Венасан"
 building_halla_vhenasan_02_desc: "Часть леса расчистили, и теперь на краю поляны Галла Венасан возвышается пышно украшенный небольшой храм, возведённый в характерном долийском стиле по образцу Арлатана. Он посвящён Гиланнайн, Матери галл. Несколько человек поселились рядом с храмом, чтобы ухаживать за галлами, к великой радости местных жителей."
 ### Imperial Palace of Orlais
 building_type_imperial_palace_orlais: "Императорский дворец Орлея"
 building_type_imperial_palace_orlais_desc: "Сияющая жемчужина Орлесианской империи, Императорский дворец Орлея величественно возвышается над Вал Руайо, а перед ним простирается Недремлющее море. Три его купола ослепляют и завораживают, и весь Тедас восхищается изяществом и красотой их архитектуры.\n\nСегодня Императорский дворец служит оплотом Орлесианской империи, основанной Дракконом, и соперничает по престижу с великим дворцом Архонта в Минратосе."
 building_imperial_palace_orlais: "$building_type_imperial_palace_orlais$"
 building_imperial_palace_orlais_desc: "$building_type_imperial_palace_orlais_desc$"
 ### Jeshavis' Digue
 building_type_jeshavis_dyke_01: "Ров Джешевис"
 building_type_jeshavis_dyke_01_desc: "Объединив племена цириан, Джешевис приказала создать на западной границе Джейдера систему рвов, чтобы защитить свои земли от аламарри и больше не позволять их налётчикам и захватчикам разорять владения цириан."
 building_jeshavis_dyke_01: "Ров Джешевис"
 building_jeshavis_dyke_01_desc: "Объединив племена цириан, Джешевис приказала создать на западной границе Джейдера систему рвов, чтобы защитить свои земли от аламарри и больше не позволять их налётчикам и захватчикам разорять владения цириан."
 ### Kal Repartha
 building_type_kal_repartha_01: "Кэл Репарта"
 building_type_kal_repartha_01_desc: "$building_kal_repartha_01_desc$"
 building_kal_repartha_01: "Кэл Репарта"
 building_kal_repartha_01_desc: "Руины древнего гномьего тейга усеивают этот край. Хотя существование тейга на поверхности озадачивает многих учёных, само название «Кэл Репарта» — одно из немногих достоверных сведений об этом сооружении. Сказания о его грандиозных постройках, процветании и искусных ремесленниках вдохновляют местных жителей и по сей день."
 building_type_kal_repartha_02: "$building_type_kal_repartha_01$"
 building_type_kal_repartha_02_desc: "$building_kal_repartha_02_desc$"
 building_kal_repartha_02: "Восстановленная Кэл Репарта"
 building_kal_repartha_02_desc: "Теперь, когда тейг очистили от песка и дюн, великие чертоги и здания Кэл Репарты гордо возвышаются среди Свистящих пустошей. Они служат памятником непревзойдённому инженерному искусству Совершенного Файреля. По мнению реставраторов, именно он построил этот наземный тейг, хотя Хранители Орзаммара утверждают, что Файрель не покидал [Concept('deep_roads','Глубинных троп')|E] живым. Как бы то ни было, предания о шедеврах ремесла, былом процветании и уникальном месте тейга в истории гномов делают Кэл Репарту достойной глубочайшего уважения."
 building_type_kal_repartha_03: "$building_type_kal_repartha_01$"
 building_type_kal_repartha_03_desc: "$building_kal_repartha_03_desc$"
 building_kal_repartha_03: "Великолепная Кэл Репарта"
 building_kal_repartha_03_desc: "С помощью немногочисленных представителей каст кузнецов и ремесленников, решивших уйти на поверхность, Кэл Репарту восстановили во всём величии — так, чтобы она выдержала и изнурительную осаду, и целый век процветания. Великие залы, украшенные изображениями богатой истории тейга и цветущих земель Западного предела до Второго [Concept('blight','Мора')|E], придают этому месту ещё больше красоты. Никто, даже сами [Concept('dwarves','гномы')|E] Орзаммара, не сможет отрицать великолепия этого города, возрождённого среди дюн."
 ### Kinloch Hold
 building_type_kinloch_hold_01: "Кинлох"
 building_type_kinloch_hold_01_desc: "Эта сторожевая башня и крепость, построенная авварами при помощи гномов, считалась практически неприступной. Аввары говорят, что на месте озера когда-то возвышалась гора Беленас — центр мира, с вершины которой Корт Отец Гор обозревал землю и небо."
 building_kinloch_hold_01: "$building_type_kinloch_hold_01$"
 building_kinloch_hold_01_desc: "$building_type_kinloch_hold_01_desc$"
 building_kinloch_hold_02: "Башня магов Кинлоха"
 building_kinloch_hold_02_desc: "Тевинтерцы верят, что воды озера Каленхад благословил Разикаль, бог тайн, и каждый, кто пьёт из них, обретает особое прозрение. Именно поэтому они построили великую башню на острове посреди озера, надеясь, что силы вод помогут их магическим изысканиям."
 building_kinloch_hold_03: "Проклятая башня Кинлоха"
 building_kinloch_hold_03_desc: "Когда первоначальную сторожевую башню захватила Империя, тевинтерцы перебили авваров с такой жестокостью, что теперь заброшенная башня магов, построенная на этом месте, считается проклятой и населённой призраками."
 building_kinloch_hold_04: "Башня Круга Кинлоха"
 building_kinloch_hold_04_desc: "Раскол с тевинтерской [Concept('chantry','церковью')|E] вызвал во всех южных землях сильное неприятие [Concept('dataw_magic','магии')|E]. Денеримский [Concept('circle','Круг')|E] магов был вынужден покинуть свою городскую башню, которую впоследствии снесли, и занять старую тевинтерскую башню, где маги могли спокойно практиковать своё искусство."
 ### Korcari Gold Pools
 building_type_korcari_gold_mine_01: "Золотые купели Коркари"
 building_type_korcari_gold_mine_01_desc: "Местные жители часто говорят, что эти купели благословлены, ведь изобилие золота в воде заставляет её переливаться на солнце. Многие промывают здесь песок, добывая металл для украшений и безделушек, которыми торгуют по всем Диким землям."
 building_korcari_gold_mine_01: "$building_type_korcari_gold_mine_01$"
 building_korcari_gold_mine_01_desc: "$building_type_korcari_gold_mine_01_desc$"
 building_korcari_gold_mine_02: "Золотые рудники Коркари"
 building_korcari_gold_mine_02_desc: "После долгих трудов купели осушили и вырыли новые карьеры, чтобы отыскать источник золота в глубине. Благодаря большому количеству добываемого металла новые рудники приносят региону огромное богатство. Из него делают украшения, которые продают даже за пределами Диких земель."
 ### Marquis Hunting Grounds
 building_type_marquis_hunting_grounds_01: "Охотничьи угодья маркиза"
 building_type_marquis_hunting_grounds_01_desc: "Вал Форе славится прекрасными охотничьими угодьями, привлекающими людей со всего Орлея. Густой лес полон великолепных зверей, в том числе красно-бурых медведей Вал Форе. И крестьяне, и дворяне охотятся в живописной чаще и возвращаются с богатой добычей на радость тем, кто желает купить мясо или шкуры."
 building_marquis_hunting_grounds_01: "Охотничьи угодья маркиза"
 building_marquis_hunting_grounds_01_desc: "Вал Форе славится прекрасными охотничьими угодьями, привлекающими людей со всего Орлея. Густой лес полон великолепных зверей, в том числе красно-бурых медведей Вал Форе. И крестьяне, и дворяне охотятся в живописной чаще и возвращаются с богатой добычей на радость тем, кто желает купить мясо или шкуры."
 building_marquis_hunting_grounds_02: "Охотничье бюро Вал Форе"
 building_marquis_hunting_grounds_02_desc: "Из-за размаха незаконной охоты среди крестьян в окрестных лесах пришлось открыть охотничье бюро. При поддержке местной стражи оно обязывает каждого охотника покупать лицензию на промысел в угодьях Вал Форе под угрозой наказания. Это принесло местным властям порядок и доход, но охота среди крестьян пошла на спад."
 marquis_hunting_grounds_desc: "$unlocks_building_desc$Значительно повышена вероятность появления опасных животных. Увеличены вероятность [Concept('hunt_sighting','обнаружения дичи')|E] и [Concept('hunt_success_chance','шанс успеха охоты')|E] во время [Concept('activities','занятий')|E] категории «[GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName]» в этом [Concept('holding','владении')|E]"
 activity_hunt_province_desc_marquis_hunting_grounds_minor: "#P ++ $building_type_marquis_hunting_grounds_01$#! ([building|E])\n"
 activity_hunt_province_desc_marquis_hunting_grounds_major: "#P +++ $building_type_marquis_hunting_grounds_01$#! ([building|E])\n"
 ### Mesa of Deavuin
 building_type_deauvin_mesa_01: "Плато Довена"
 building_type_deauvin_mesa_01_desc: "Это природное образование — крупнейшее плато Южного Орлея. Его особенности не раз помогали одерживать победы в решающих сражениях, особенно защитникам Валь-Фалеза во время бурных войн до объединения Орлея Кордилиусом. По сей день плато остаётся одной из главных достопримечательностей Довена, поражает размерами и красотой и господствует над Равнинами Довена на много миль вокруг."
 building_deauvin_mesa_01: "Великое плато Довена"
 building_deauvin_mesa_01_desc: "Это природное образование — крупнейшее плато Южного Орлея. Его особенности не раз помогали одерживать победы в решающих сражениях, особенно защитникам Валь-Фалеза во время бурных войн до объединения Орлея Кордилиусом. По сей день плато остаётся одной из главных достопримечательностей Довена, поражает размерами и красотой и господствует над Равнинами Довена на много миль вокруг."
 ### Mont Laures Hermitage
 building_type_mont_laures_01: "Обитель Мон-Лор"
 building_type_mont_laures_01_desc: "Никто не знает, когда именно в этих пещерах появилась обитель. Она пережила бесчисленные поколения и дала горе нынешнее название. Меняясь со времён основания Орлесианской Церкви и возникновения самого Орлея, обитель остаётся известной достопримечательностью, любимой местными жителями."
 building_mont_laures_01: "$building_type_mont_laures_01$"
 building_mont_laures_01_desc: "$building_type_mont_laures_01_desc$"
 ### Montsimmard Circle
 building_type_montsimmard_circle_01: "Круг Монсиммара"
 building_type_montsimmard_circle_01_desc: "[Concept('circle','Круг')|E] Монсиммара с самого основания был известен как великий оплот науки. Говорят, что обучавшиеся здесь маги часами штудировали бесчисленные книги великой библиотеки, изучая языки, теологию, математику и многое другое."
 building_montsimmard_circle_01: "Руины Круга Монсиммара"
 building_montsimmard_circle_01_desc: "[Concept('circle','Круг')|E] Монсиммара с самого основания был известен как великий оплот науки. Говорят, что обучавшиеся здесь маги часами штудировали бесчисленные книги великой библиотеки, изучая языки, теологию, математику и многое другое. Однако Второй [Concept('blight','Мор')|E] оставил [Concept('circle','Круг')|E] в плачевном состоянии. Этот дом науки держится из последних сил, а его обитатели проклинают [Concept('elves','эльфов')|E], которые бездействовали, пока гибли невинные и утрачивались бесценные знания."
 building_montsimmard_circle_02: "Восстановленный Круг Монсиммара"
 building_montsimmard_circle_02_desc: "Восстановленный в том величии, каким обладал до рокового нападения в 1:25 Божественного века, [Concept('circle','Круг')|E] Монсиммара вновь хранит величайшую библиотеку истории магии. Многие считают, что сравниться с ней могут лишь великие магические библиотеки Тевинтерской империи. Маги снова погружаются в бесчисленные книги по истории, традициям и магии, и Круг вновь воспитывает величайших учёных [Concept('thedas','Тедаса')|E]."
 ### Montsimmard Estate
 building_type_montsimmard_estate_01: "Великое поместье Монсиммара"
 building_type_montsimmard_estate_01_desc: "Великое поместье Монсиммара — дом великих родов Южного Орлея, существующий с тех времён, когда Монсиммар был одним из крупнейших городов-государств."
 building_montsimmard_estate_01: "Разрушенное поместье Монсиммара"
 building_montsimmard_estate_01_desc: "Здесь лежат руины некогда Великого поместья Монсиммара, дома великих родов Южного Орлея. Как и многие здания города, этот памятник былой славе сильно пострадал от нападения [Concept('darkspawn','порождений тьмы')|E], и то, что поместье всё ещё стоит, — настоящее чудо."
 building_montsimmard_estate_02: "Восстановленное великое поместье"
 building_montsimmard_estate_02_desc: "Вместе с восстановлением Великого поместья вернулось и чувство гордости. Монсиммар не только сумел отбить нападение [Concept('darkspawn','порождений тьмы')|E], но и с ещё большей пышностью перестроил родовую резиденцию. По сей день город известен как столица Юга и родина первой [Concept('divine','Верховной Жрицы')|E], и местные жители никому не дадут об этом забыть. Особенно [Concept('elves','эльфам')|E]."
 ### Montsimmard Keep
 building_type_montsimmard_keep_01: "Крепость Монсиммара"
 building_type_montsimmard_keep_01_desc: "Великая крепость Юга. Она выстояла против всех тварей, которых [Concept('maker','Создатель')|E] обрушил на неё."
 building_montsimmard_keep_01: "Разрушенная крепость Монсиммара"
 building_montsimmard_keep_01_desc: "Когда [Concept('darkspawn','порождения тьмы')|E] ворвались в город, многие жители укрылись в цитадели. Но не все успели добраться до неё вовремя, а [Concept('darkspawn','порождения тьмы')|E] перешли в наступление, карабкаясь по стенам и разрушая их в поисках пути внутрь. В конце концов [Concept('darkspawn','порождений тьмы')|E] отбросили благодаря дерзкому манёвру и искусному применению горящей смолы и огня магов. И всё же на крепости Монсиммара по-прежнему видны глубокие шрамы, оставленные десятилетиями войны с ордами [Concept('darkspawn','порождений тьмы')|E] и катастрофической нехваткой средств."
 building_montsimmard_keep_02: "Отреставрированная крепость Монсиммара"
 building_montsimmard_keep_02_desc: "Шрамы былых сражений больше не уродуют стены, и крепость уже не выглядит чем-то средним между фортом и руинами. Вопреки всему её восстановили в былом величии: могучую и прекрасную цитадель украсили фресками, изображающими подвиги тех, кто спас город от уничтожения. Монсиммар никогда не забудет [Concept('elves','эльфов')|E], бросивших его жителей на гибель, но не забудет и того, что спас себя сам и вновь стал гордой столицей Юга."
 ### Nahashin Palace
 building_type_nahashin_palace_01: "Дворец"
 building_type_nahashin_palace_01_desc: "$building_nahashin_palace_01_desc$"
 building_nahashin_palace_01: "Королевский дворец на болотах"
 building_nahashin_palace_01_desc: "Дворец в центре Нахашина служит местом сбора для всего региона. Легендарный Мартель, основатель династии Маршетов, построил его как крепость."
 building_type_nahashin_palace_02: "$building_type_nahashin_palace_01$"
 building_type_nahashin_palace_02_desc: "$building_nahashin_palace_02_desc$"
 building_nahashin_palace_02: "Королевский престол Нахашина"
 building_nahashin_palace_02_desc: "Укреплённый и пышно отреставрированный дворец стал Королевским престолом Нахашина — великолепной обителью, достойной монарха. Благодаря монументальным стенам он возвышается над болотами, сочетая величие с практичностью. Королевский престол — не просто роскошные палаты, откуда надлежит править Болотами, но и неприступная цитадель, способная при необходимости выдержать долгую и тяжёлую осаду."
 ### Naissance d'Andraste
 building_type_naissance_d_andraste_01: "Рождение Андрасте"
 building_type_naissance_d_andraste_01_desc: "Этот храм возвели в начале истории Церкви, перестроив святилище Древних Богов на месте рождения Андрасте. Благодаря стратегическому положению Джейдера местная церковь с самого основания используется для мирных переговоров. В её стенах принимали ферелденских варваров, орлесианских мятежников и даже эльфийских еретиков — всё ради сохранения мира на восточной границе Орлея."
 building_naissance_d_andraste_01: "Рождение Андрасте"
 building_naissance_d_andraste_01_desc: "Этот храм возвели в начале истории Церкви, перестроив святилище Древних Богов на месте рождения Андрасте. Благодаря стратегическому положению Джейдера местная церковь с самого основания используется для мирных переговоров. В её стенах принимали ферелденских варваров, орлесианских мятежников и даже эльфийских еретиков — всё ради сохранения мира на восточной границе Орлея."
 ### Orzammar Entrance
 building_type_orzammar_entrance: "Вход в Орзаммар"
 building_type_orzammar_entrance_desc: "[Concept('dwarves','Гномы')|E] славятся своим мастерством, и Орзаммар — одно из величайших их творений. Это один из двух сохранившихся тейгов некогда великой империи. Его жители — гордый народ, привыкший к невзгодам и строго следующий традициям."
 building_orzammar_entrance: "$building_type_orzammar_entrance$"
 building_orzammar_entrance_desc: "$building_type_orzammar_entrance_desc$"
 ### Ostagar
 building_type_ostagar_01: "Остагар"
 building_type_ostagar_01_desc: "Некогда эта цитадель была одной из важнейших крепостей к югу от Недремлющего моря, но после падения Тевинтера её забросили и разграбили дикари, и со временем она окончательно превратилась в руины. То, что большинство стен стоит по сей день, свидетельствует о невероятной магии построившей их Империи."
 building_ostagar_01: "Остагар (разрушенный)"
 building_ostagar_01_desc: "Некогда эта цитадель была одной из важнейших крепостей к югу от Недремлющего моря, но после падения Тевинтера её забросили и разграбили дикари, и со временем она окончательно превратилась в руины. То, что большинство стен стоит по сей день, свидетельствует о невероятной магии построившей их Империи."
 building_ostagar_02: "Остагар (восстановленный)"
 building_ostagar_02_desc: "Перекрывая узкий проход в холмах, эта перестроенная крепость вынуждает врагов искать обходные пути, чтобы добраться до плодородных низин на севере. Благодаря выгодному природному положению её чрезвычайно трудно штурмовать."
 building_ostagar_03: "Остагар (великолепный)"
 building_ostagar_03_desc: "Некогда заброшенная и лежавшая в руинах, эта историческая крепость вновь во всём блеске демонстрирует величие древнего Тевинтера."
 ### Perendale Circle
 building_type_perendale_circle: "Круг Перендейла"
 building_type_perendale_circle_desc: "Эта башня, построенная Тевинтером для защиты магистров от атак цириан и ингиршей, ныне переоборудована под Круг магов. Сложная система укреплений, возведённая для защиты их роскошных покоев, отлично сохранилась: она превращает Круг не только в хорошую позицию для обороны от демонических сил и внешних налётчиков, но и в надёжное убежище для самих магов."
 building_perendale_circle: "$building_type_perendale_circle$"
 building_perendale_circle_desc: "$building_type_perendale_circle_desc$"
 ### Sacred Hunting Grounds
 building_type_sacred_hunting_ground_01: "Священные охотничьи угодья"
 building_type_sacred_hunting_ground_01_desc: "$building_sacred_hunting_ground_01_desc$"
 building_sacred_hunting_ground_01: "Священные леса Андрасте"
 building_sacred_hunting_ground_01_desc: "Местные жители почитают эти леса из поколения в поколение, а охоту в них считают священным деянием — способом прославить [Concept('maker','Создателя')|E] в этих глухих краях. Постоянная охота на священной земле сделала здешних лучников непревзойдёнными мастерами."
 building_type_sacred_hunting_ground_02: "$building_type_sacred_hunting_ground_01$"
 building_type_ciriane_frontier_outpost_02_desc: "$building_sacred_hunting_ground_02_desc$"
 building_sacred_hunting_ground_02: "Церковь Священной Охоты"
 building_sacred_hunting_ground_02_desc: "С появлением храма на священной земле местная [Concept('chantry','Церковь')|E] стала поощрять охоту не как простой обычай, а как священнодействие. Во время разделки зверя верующие поют строфы Песни Света, а мясо раздают преданным последователям, которые поражают добычу стрелами во славу [Concept('maker','Создателя')|E]."
 sacred_hunting_ground_desc: "$unlocks_building_desc$Увеличены вероятность [Concept('hunt_sighting','обнаружения дичи')|E] и [Concept('hunt_success_chance','шанс успеха охоты')|E] во время [Concept('activities','занятий')|E] категории «[GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName]» в этом [Concept('holding','владении')|E]\n\nПо завершении [Concept('activities','занятия')|E] категории «[GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName]», проведённого в этом [Concept('county','графстве')|E], будет получен бонус к [Concept('piety','благочестию')|E]."
 ### Salmont River
 building_type_salmont_special_building_01: "Река Салмонт"
 building_type_salmont_special_building_01_desc: "Через центр городка Салмонт протекает небольшая река, берущая начало далеко в Морозных горах. Хотя она слишком мала для оживлённого судоходства и торговли, изобилие лосося и пресной воды побудило многих поселиться на её берегах, сформировав нынешнюю планировку города, разделённого рекой надвое."
 building_salmont_special_building_01: "Река Салмонт"
 building_salmont_special_building_01_desc: "Через центр городка Салмонт протекает небольшая река, берущая начало далеко в Морозных горах. Хотя она слишком мала для оживлённого судоходства и торговли, изобилие лосося и пресной воды побудило многих поселиться на её берегах, сформировав нынешнюю планировку города, разделённого рекой надвое."
 building_salmont_special_building_02: "Великая животворящая мельница Салмонта"
 building_salmont_special_building_02_desc: "Постройка большой водяной мельницы ускорила экономический рост, пусть и в ущерб промыслу лосося, который постепенно пришёл в упадок. Теперь товары можно гораздо дешевле перерабатывать на месте, что способствует развитию местной торговли."
 ### Silver Mine
 building_type_silver_mine_01: "Серебряные рудники Перендейла"
 building_type_silver_mine_01_desc: "$building_silver_mine_01_desc$"
 building_silver_mine_01: "Серебряные рудники Перендейла"
 building_silver_mine_01_desc: "Перендейл и его окрестности известны тремя вещами: драконами, проклятыми Создателем козами и серебром. Неудивительно, что серебряные рудники служат основой городского богатства и обеспечивают простолюдинов работой. В туннелях [Concept('deep_roads','Глубинных троп')|E] можно расширить добычу, однако никто не решается начинать работы из страха привлечь [Concept('darkspawn','порождения тьмы')|E]."
 building_silver_mine_02: "Сеть серебряных шахт Перендейла"
 building_silver_mine_02_desc: "Страх перед нападениями [Concept('darkspawn','порождений тьмы')|E] не одолел жажду выгоды: огромные туннели соединили рудники с [Concept('deep_roads','Глубинными тропами')|E], а шахты от заражённых скверной глубин отделил подъёмник. Новая сеть принесла Перендейлу огромное богатство, но вместе с ним и смерть: некоторые шахтёры возвращаются заражёнными, если вообще возвращаются."
 ### Solasan Temple
 building_type_solasan_temple_01: "Храм Соласан"
 building_type_solasan_temple_01_desc: "$building_solasan_temple_01_desc$"
 building_solasan_temple_01: "Храм Соласан"
 building_solasan_temple_01_desc: "Отравленная вода, странные твари, истории об исчезающих или сходящих с ума людях… Древний эльфийский храм и окружающий его оазис окутаны множеством слухов, а многие проклинают это место за творящиеся поблизости странности. Маги из Маркхемского Круга рассказывали, что в оазисе можно найти особые осколки, открывающие дверь Соласана. Однако никто их так и не обнаружил, словно они скрыты от глаз [Concept('dataw_magic','магией')|E]. Несмотря на опасность, людей тянет к запретному оазису — ради его природной красоты, охоты на свирепых тварей, богатых ресурсов или таинственной двери, ведущей в глубины храма."
 ### Soldier's Peak
 building_type_soldiers_peak_01: "Пик Солдата"
 building_type_soldiers_peak_01_desc: "Эту крепость возвели как штаб Серых Стражей в Ферелдене, откуда они могли продолжать борьбу с опустошениями, которые несут порождения тьмы и Моры."
 building_soldiers_peak_01: "$building_type_soldiers_peak_01$"
 building_soldiers_peak_01_desc: "$building_type_soldiers_peak_01_desc$"
 ### Southern_Monastery
 building_type_southern_monastery_01: "Великий южный монастырь"
 building_southern_monastery_01: "Монастырь Южного рубежа"
 building_southern_monastery_01_desc: "Этот монастырь возвели во славу [Concept('maker','Создателя')|E] на самом дальнем рубеже [Concept('thedas','Тедаса')|E]. Несмотря на уединённость, церковь глубоко уважают и любят во всём регионе. Для многих местных жителей она служит истоком веры: они клянутся ей в верности и осуждают всякого, кому недостаёт благочестия."
 southern_monastery_desc_01: "Сопротивление обращению: +15%"
 building_southern_monastery_02: "Священное хранилище писаний Верховных Жриц"
 building_southern_monastery_02_desc: "Некогда скромный и неприметный монастырь обрёл более высокое предназначение: хранить писания Верховных Жриц Вал Руайо. Здесь бережно собирают и изучают их труды — от Джустинии I до нынешней Верховной Жрицы. Монастырь стал уважаемым и редким центром богословских споров, а работающие в нём учёные способствуют техническому и общественному прогрессу."
 southern_monastery_desc_02: "Сопротивление обращению: +25%"
 STEWARD_PROMOTE_RELIGION_BUILDING_PENALTY: "Сопротивление обращению от здания"
 ### Suledin Keep
 building_type_suledin_keep_01: "Крепость Суледин"
 building_type_suledin_keep_01_desc: "Среди скалистых нагорий Долов возвышается мрачная цитадель. Эта исполинская крепость служит резиденцией долийского лорда, чья тень длиннее стен самой цитадели… В этих отдалённых холмах хозяин крепости Суледин обладает абсолютной властью."
 building_suledin_keep_01: "$building_type_suledin_keep_01$"
 building_suledin_keep_01_desc: "$building_type_suledin_keep_01_desc$"
 ### Summer Bazaar
 building_type_the_summer_bazaar_01: "Летний базар"
 building_type_the_summer_bazaar_01_desc: "Летний базар — бьющееся сердце Вал Руайо, на шумных прилавках которого торгуют товарами со всего Тедаса. Расположенный на перекрёстке Имперских трактов древнего Тевинтера, он служит крупнейшим торговым узлом континента."
 building_the_summer_bazaar_01: "$building_type_the_summer_bazaar_01$"
 building_the_summer_bazaar_01_desc: "$building_type_the_summer_bazaar_01_desc$"
 building_the_summer_bazaar_02: "В разработке"
 building_the_summer_bazaar_02_desc: "В разработке"
 ### Sunstop Mountains
 building_type_sunstop_mountains_01: "Гнездо солнца"
 building_type_sunstop_mountains_01_desc: "$building_sunstop_mountains_01_desc$"
 building_sunstop_mountains_01: "Гнездо солнца"
 building_sunstop_mountains_01_desc: "Гнездо солнца господствует над дюнами Свистящих пустошей. Своё название оно получили благодаря зрелищу восходящего из-за гряды солнца, которое достигает зенита прямо над вершинами и восхищает приезжих дворян. Однако истинную известность горам принесли извилистые тропы — идеальные как для обороны, так и для бандитских засад."
 ### Skyhold
 building_type_skyhold_01: "Скайхолд"
 building_type_skyhold_01_desc: "Об этой горе сложено столько легенд, сколько кланов живёт под небом. Какие из них правдивы — если правдива хоть одна, — сказать невозможно."
 building_skyhold_01: "Химмельтопп"
 building_skyhold_01_desc: "$building_type_skyhold_01_desc$"
 building_skyhold_02: "Тарасил'ан те'лас"
 building_skyhold_02_desc: "Тарасил'ан те'лас — «Там, где хранится небо» на эльфийском. Но [Concept('elves','эльфы')|E] многое забыли, и даже они не помнят истинного смысла этих слов."
 building_skyhold_03: "Скайхолд"
 building_skyhold_03_desc: "Возведённый в традициях клейнов, Скайхолд грозно и властно возвышается среди заснеженных вершин. Суровые стены, неприступный донжон и редкий альпийский сад, укрытый внутри цитадели, делают её почти неуязвимой. Это высокогорное укрепление в Морозных горах внушает трепет каждому увидевшему его путешественнику."
 ### Tombigbee
 building_type_tombigbee_01: "$building_tombigbee_01$"
 building_type_tombigbee_01_desc: "$building_tombigbee_01_desc$"
 building_tombigbee_01: "Свайный город Томбигби"
 building_tombigbee_01_desc: "Томбигби — единственный город в Диких землях Коркари. Он знаменит тем, что целиком возведён на сваях посреди озера."
 ### Village of Gwaren
 building_type_gwaren_special_building_01: "$building_gwaren_special_building_01$"
 building_type_gwaren_special_building_01_desc: "$building_gwaren_special_building_01_desc$"
 building_gwaren_special_building_01: "Деревня Гварен"
 building_gwaren_special_building_01_desc: "С тех пор как гномы покинули свой аванпост, а богатства Гварена были разграблены, поселение изменилось навсегда. Превратившись в тень былого величия, деревня тем не менее остаётся важным экономическим узлом побережья благодаря торговле рыбой и древесиной."
 ### University of Orlais
 building_type_university_of_orlais: "Университет Орлея"
 building_type_university_of_orlais_desc: "Университет Орлея служит чем-то вроде пристанища для младших детей мелкой знати — тех, у кого мало политических перспектив и чьим семьям надоело развлекать их вереницей учителей."
 building_university_of_orlais: "$building_type_university_of_orlais$"
 building_university_of_orlais_desc: "$building_type_university_of_orlais_desc$"
 ### Vigil's Keep
 building_type_vigils_keep: "Башня Бдения"
 building_type_vigils_keep_desc: "Башня Бдения — одно из древнейших поселений Ферелдена, старше Денерима и Гварена. Она становилась полем боя во время каждого крупного вторжения в страну. Для построивших её авваров Башня Бдения была одновременно крепостью и святыней. В её подвалах сохранились памятники их богам, героям и редким военным победам."
 building_vigils_keep: "$building_type_vigils_keep$"
 building_vigils_keep_desc: "$building_type_vigils_keep_desc$"
 ### Vir'Abelasan (it is the Altar of Mythal now, the Temple is off-map) (Altar is canon, it's where you fight the dragon)
 building_type_vir_abelasan_01: "Алтарь Митал"
 building_type_vir_abelasan_01_desc: "$building_virelay_ruins_01_desc$"
 building_vir_abelasan_01: "Алтарь Митал"
 building_vir_abelasan_01_desc: "Согласно долийским легендам, далеко на юге, в неисследованной и опасной Арборской глуши, стоит храм, воздвигнутый древними эльфами в честь Митал. Его считают одним из самых священных мест древнего Элвенана, которое яростно охраняют эльфы, не затронутые человеческой смертностью. \n\nПравда это или нет, местный городок, считающийся последней остановкой перед Арборской глушью, стал известным местом паломничества. Паломники приходят сюда почтить героическую борьбу последних истинных эльфов. Однако местные предупреждают: путь паломников должен заканчиваться перед Алтарём Митал, ведь никто из углубившихся в Арборскую глушь в поисках легендарного храма не вернулся."
 # building_vir_abelasan_01_desc: "A large temple in the thick of the arbor wilds. The high walls camouflaged under the canopy, decorated in draconic iconography as well as depictions of Mythal herself.\n\nIt is said to have been a place of not just worship, but of justice and knowledge. Now its large doors remain closed, the temple guarded and Mythals pilgrims take their worship to the smaller shrine outside."
 ### Virelay Ruins
 building_type_virelay_ruins_01: "Руины Вирле"
 building_type_virelay_ruins_01_desc: "$building_virelay_ruins_01_desc$"
 building_virelay_ruins_01: "Руины Вирле"
 building_virelay_ruins_01_desc: "Некогда Вирле был средоточием культа «Дочерей песни» и местом бесчисленных празднеств. Единение Андрасте с [Concept('maker','Создателем')|E] служило поводом для поразительных и весьма регулярных проявлений гедонизма — от поэзии до разгула плотских утех и других забав, которые более ханжеские соседи считали скандальными. Император Кордилиус Драккон уничтожил город вместе с культом во время объединительных походов, оставив от старого Вирле лишь руины."
 building_virelay_ruins_02: "Старый город Вирле"
 building_virelay_ruins_02_desc: "Теперь, когда старый город восстановили таким, каким он был до походов Кордилиуса, Вирле вновь стал домом для поэтов, музыкантов и гуляк, вдохновлённых его историей. Старый город по сей день служит пристанищем молодёжи и идеалистов, которые наслаждаются радостями жизни с молчаливого одобрения властей: эти развлечения пользуются огромной популярностью у жителей."
 ### Whaling Station
 building_type_whaling_station_01: "Китобойная станция"
 building_whaling_station_01: "Малая китобойная станция"
 building_whaling_station_01_desc: "Невенская традиция охоты на китов уходит корнями в глубокую древность, и китобойная станция в самом сердце Мон-де-Гляса — прекрасный тому пример. Здесь продают и сдают внаём лодки, а доставленные туши китов разделывают ради мяса и жира. Станция невелика, но имеет огромное значение для местных жителей."
 building_whaling_station_02: "Большая китобойная станция"
 building_whaling_station_02_desc: "Некогда малая станция Мон-де-Гляса превратилась в крупный промысловый центр, где разделывают больше китов, чем когда-либо прежде. Мясо, жир, кости… Здесь можно найти всё, что связано с китобойным промыслом, — от провианта до судов, к великой радости местных жителей."
 building_whaling_station_03: "Великая китобойная верфь Расколотого моря"
 building_whaling_station_03_desc: "Некогда простая китобойная станция превратилась в великую верфь — гордость этого уединённого уголка мира. Здесь строят множество судов для прибыльного промысла в Расколотом море, а чертежи новых кораблей продают по всему [Concept('thedas','Тедасу')|E] и отправляют на верфи вплоть до Антивы. Но во что бы вы ни верили и откуда бы ни пришли — из Моря Пепла или самого сердца Орлея, — над верфью возвышается видимая за много миль статуя [Concept('andraste','Андрасте')|E], вонзающей нож в брюхо кита."
 whaling_station_desc: "Снижает стоимость организации охоты на китов на 20%."
 whaling_station_2_desc: "Снижает стоимость организации охоты на китов на 30%."
 ### White Deer Mountain
 building_type_deer_mountain_01: "Гора Белого Оленя"
 building_deer_mountain_01: "Гора Белого Оленя"
 building_deer_mountain_01_desc: "Гора Белого Оленя получила название благодаря древней легенде неизвестного происхождения. Она повествует о белом олене, который пришёл к заблудившемуся в горах ребёнку и вывел его к племени. Но когда олень приблизился, люди пронзили его сердце, возжелав мяса. Разгневанный такой жестокостью, он отказался умирать и убежал с зияющей раной в груди. Был ли это один из потерянных галл эльфов или, как утверждают некоторые, авварский бог — неизвестно. Несомненно одно: охота здесь богата, и порой охотники встречают одинокого белого оленя с огромным шрамом у самого сердца. Сколько бы раз его ни сражали, он неизменно возвращается."
 deer_mountain_desc_01: "Бонусы к охоте в этом баронстве.\nПовышена вероятность обнаружить белого оленя."
 activity_hunt_province_desc_deer_mountain: "#P ++ $building_type_deer_mountain_01$#! ([building|E])\n"
 ### White Spire Fortress
 building_type_the_white_spire_fortress: "Белый Шпиль"
 building_type_the_white_spire_fortress_desc: "Здесь располагается [Concept('circle','Круг')|E] магов Вал Руайо. Бывшая цитадель императора Драккона — одно из немногих сооружений, помимо самого дворца, которое видно из любой точки столицы. Ночью [Concept('dataw_magic','магия')|E] озаряет Шпиль, превращая его в сияющий белый клинок, рассекающий тьму."
 building_the_white_spire_fortress: "$building_type_the_white_spire_fortress$"
 building_the_white_spire_fortress_desc: "$building_type_the_white_spire_fortress_desc$"
 ### Wine Makers Chantry
 building_type_wine_chantry_01: "Винодельческая церковь"
 building_type_wine_chantry_01_desc: "Во всём регионе церковь Модовини снискала необычную славу благодаря виноделию. Знаменитое «Селестинское чёрное» делают из винограда, выращенного прямо за церковью, на радость и дворянам, и простолюдинам. Поговаривают, будто одна [Concept('divine','Верховная Жрица')|E] наслаждалась этим напитком куда больше, чем следовало. Споры о том, кто именно это был, уже давно не утихают в Модовини."
 building_wine_chantry_01: "Церковь вина"
 building_wine_chantry_01_desc: "Во всём регионе церковь Модовини снискала необычную славу благодаря виноделию. Знаменитое «Селестинское чёрное» делают из винограда, выращенного прямо за церковью, на радость и дворянам, и простолюдинам. Поговаривают, будто одна [Concept('divine','Верховная Жрица')|E] наслаждалась этим напитком куда больше, чем следовало. Споры о том, кто именно это был, уже давно не утихают в Модовини."
 building_wine_chantry_02: "Церковь виноделов"
 building_wine_chantry_02_desc: "После скандалов с пьяными песнопевцами винодельню отделили от церкви. Теперь ею управляют бывшие братья, называющие себя «Церковью виноделов» в память о прежнем духовном служении и работе в старом храме. Новая церковь и виноградник тесно сотрудничают в местных делах, обеспечивая и трезвые молитвы, и хмельные пиры благодаря выборочной продаже «Селестинского чёрного»."
 feast_cost_discount_wine_chantry: "В локации есть $building_type_wine_chantry_01$"
 activity_feast_province_desc_wine_chantry: "#P +++ $building_type_wine_chantry_01$#! ([building|E])\n"
 feast_cost_discount_wine_desc: "$feast_cost_discount_effect_desc$[EmptyScope.ScriptValue('feast_activity_cost_discount_wine_value')|P0%]"
 ### Wyvern Grave
 building_type_wyvern_grave_01: "Кладбище вивернов"
 building_type_wyvern_grave_01_desc: "$building_wyvern_grave_01_desc$"
 building_wyvern_grave_01: "Кладбище вивернов"
 building_wyvern_grave_01_desc: "В Дарнуа находится одно из самых странных мест во всём [Concept('thedas','Тедасе')|E] — Кладбище вивернов. Согласно старейшим хроникам, старые виверны всегда прилетали сюда, чтобы спокойно провести последние дни. Сотни погибающих здесь тварей привлекают желающих поживиться и продать их шкуры и кости. Так в городе возник небольшой промысел — если не задаваться вопросом о происхождении товара."

 ### Cendrerin Trading market
 building_type_cendrein_market_01: "Рынок сандренцев"
 building_cendrein_opinion: "$cendrerin_collective_noun$ое мнение"
 building_cendrein_market_01: "Торговый рынок сандренцев"
 building_cendrein_market_01_desc: "Благодаря постоянным контактам с сандренцами Моря Пепла в регионе появился небольшой рынок. Кочевники продают здесь всё: от знаменитого рыбного соуса до редких металлов и минералов, добытых в горах, — чтобы приобрести ценные товары, недоступные в пустыне. Некоторые сандренцы даже покидают свои племена и оседают в Орлее."
 building_cendrein_market_02: "Базар сандренцев"
 building_cendrein_market_02_desc: "Благодаря притоку средств скромный рынок превратился в крупный базар, куда многочисленные племена приходят торговать товарами со всего [Concept('thedas','Тедаса')|E]. Они предлагают серу, рыбу и множество других богатств Моря Пепла. Некоторые сандренцы окончательно оседают в регионе ради торговли."
 building_cendrein_market_03: "Квартал сандренцев"
 building_cendrein_market_03_desc: "По мере развития торговли и роста числа сандренцев для этих кочевников выделили отдельный квартал. Он значительно облегчает торговлю с племенами Моря Пепла и даёт кров многочисленной сандренской общине. Впрочем, некоторые сандренцы скучают по кочевой жизни и отправляются странствовать по всему [Concept('thedas','Тедасу')|E]."
 cendrein_market_01: "Время от времени будут прибывать гости-сандренцы."
 cendrein_market_02: "Время от времени будут прибывать придворные-сандренцы."
 cendrein_market_03: "Время от времени будут прибывать придворные и искатели приключений из числа сандренцев."
 dataw_events_gamord.0072.t: "[Select_CString(cendrerin_merchant.IsFemale, 'Сандренская торговка добивается', 'Сандренский торговец добивается' )] влияния в Лизьер-Сандре."
 dataw_events_gamord.0072.desc: "[Select_CString(cendrerin_merchant.IsFemale, 'Она присоединилась', 'Он присоединился' )] к вашему двору."
 dataw_events_gamord.0073.t: "[Select_CString(cendrerin_merchant.IsFemale, 'Сандренская искательница приключений отправляется', 'Сандренский искатель приключений отправляется' )] в путь."
 dataw_events_gamord.0073.desc: "[cendrerin_merchant.GetShortUIName|U] собирает отряд искателей приключений."

 ### Whaling Station
 building_type_whaling_station_01: "Китобойная станция"
 building_whaling_station_01: "Малая китобойная станция"
 building_whaling_station_01_desc: "Невенская традиция охоты на китов уходит корнями в глубокую древность, и китобойная станция в самом сердце Мон-де-Гляса — прекрасный тому пример. Здесь продают и сдают внаём лодки, а доставленные туши китов разделывают ради мяса и жира. Станция невелика, но имеет огромное значение для местных жителей."
 building_whaling_station_02: "Большая китобойная станция"
