 building_deauvin_wall_08_desc: "Этот участок старой оборонительной стены был отреставрирован и теперь служит мощным защитным оплотом рубежей Довена против любых врагов. Довен не стоял на пути вторгшихся армий к сердцу Империи, и поэтому Престижная и прославленная Великая стена Довена строилась не для защиты Орлея в целом, а для защиты местных жителей от захватчиков. Сегодня стена, несмотря на свою дороговизну, стоит как шедевр архитектуры и инженерии, а также как превосходная оборонительная позиция."
 building_type_deauvin_wall_09: "Великая стена Довена"
 building_type_deauvin_wall_09_desc: "Эта оборонительная стена была построена вскоре после основания Орлея Кордиллиусом Первым. Когда местная знать поняла, что их земли рассматриваются как менее значимые в военных действиях из-за расположения на окраине Империи (единственная граница которой проходила с Долами), была возведена великая стена для защиты от язычников-[elves|E] эльфов."
 building_deauvin_wall_09: "Запущенная Великая стена Довена"
 building_deauvin_wall_09_desc: "Эта оборонительная стена была построена вскоре после основания Орлея Кордиллиусом Первым. Когда местная знать поняла, что их земли рассматриваются как менее значимые в военных действиях из-за расположения на окраине Империи (единственная граница которой проходила с Долами), была возведена великая стена для защиты от язычников-[elves|E] эльфов. Тем самым местные лорды подарили миру грандиозное сооружение, которое мог бы построить Вал Руайо, но так и не вложил в него средств. Однако в наши дни этот участок стены пришёл в упадок и уже не так эффективен, как прежде."
 building_deauvin_wall_10: "Престижная и прославленная Великая стена Довена"
 building_deauvin_wall_10_desc: "Этот участок старой оборонительной стены был отреставрирован и теперь служит мощным защитным оплотом рубежей Довена против любых врагов. Довен не стоял на пути вторгшихся армий к сердцу Империи, и поэтому Престижная и прославленная Великая стена Довена строилась не для защиты Орлея в целом, а для защиты местных жителей от захватчиков. Сегодня стена, несмотря на свою дороговизну, стоит как шедевр архитектуры и инженерии, а также как превосходная оборонительная позиция."
