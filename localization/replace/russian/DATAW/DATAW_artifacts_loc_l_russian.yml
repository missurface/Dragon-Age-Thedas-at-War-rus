l_russian:
 yavanalis_name: "Яваналис"
 yavanalis_desc: "Холодный посох [Concept('elvhen','элвенского')|E] происхождения, обладающий огромной силой. Его точный возраст неизвестен, но хранители клана Суледин владели им со времён Долгого пути. В умелых руках Яваналис является страшным оружием, способным замораживать врагов, превращая их в глыбы льда."
 fadeshear_name: "Тенерез"
 fadeshear_desc: "Лезвие у этого меча древнее. Древнее, как самые первые кузнецы, искавшие способ сражаться с кошмарами из другого мира. Он побывал в бессчетных битвах с одержимыми демонами. Порой его вздымали вверх во время побед. А бывало, он лежал сломанный подле мёртвого хозяина. Но после каждого поражения его всегда забирали, перековывали и укрепляли. Тенерез прошёл через множество рук. Теперь ваш черёд взимать плату с [Concept('demon','демонов')|E] Тени за проход через [Concept('veil','Завесу')|E] в наш мир." #Placeholder
 song_of_the_marshes_name: "Песня топей"
 song_of_the_marshes_desc: "Одноручный топор, выкованный из сильверита в качестве символа цирианского народа. «Песня топей» была выкована лично лордом Ру Маршеттом при подготовке к его будущему правлению. Народ называет монарха истинным королём в болотах, пусть он пока и не стал таковым.\n«Король» Ру понимает, что не станет королём, а его народ не обретает свободу до тех пор, пока они не вырвутся из стальной хватки драконьей пасти. С топором в руке Ру готовится к войне с могущественной Орлесианской империей."
 bane_of_red_crossing_name: "Погибель Ред-Кроссинга"
 bane_of_red_crossing_desc: "placeholder TODO"
 farslayer_name: "Дальнострел"
 farslayer_desc: "Звук тетивы этого лука подобен шёпоту в голове — не то на [Concept('elvhen','элвенском')|E] не то на ещё более древнем языке. Его сила продержалась тысячелетия, хоть и скромна в сравнении с изначальной." #Placeholder
 helm_of_the_drasca_name: "Шлем Драски"
 helm_of_the_drasca_desc: "Драской назывался воинский орден, созданный в древнем Андерфелсе для противостояния повторной оккупации со стороны Тевинтера в -535 году Древней Эры. Члены ордена, знаменитые своим фехтовальным и лучным мастерством, жестоко истреблялись Империей, пока последние из них не бежали в Проклятые холмы на юге. Слухи утверждают, что после этого Драска не распалась, а продолжила существовать и позднее сыграла важную роль в андерском восстании против орлесианского ига после Второго [Concept('blight','Мора')|E], но если даже это и верно, после этого они снова канули в безвестность." #Placeholder
 arrowwood_name: "Калинов лук"
 arrowwood_desc: "В старинной цирианской легенде рассказывается о лучнике по имени Калина, выменявшем у духа дубовой рощи свою душу на способности лучшего лучника в мире. Он завоевал сотни крепостей и сразил западный ветер своими стрелами, для которых не было преград. В конце концов Калина сбил с неба солнце, и настала ночь вместо дня, и тогда годи отправил посланника на поиски Ведьмы из Арборских пустошей. Далее версии легенды разнятся: посланник либо не нашёл ведьму и вместо этого договорился с демоном, либо согласился работать с ведьмой и её дочерями год и один день, либо заключил соглашение с Небесной Хозяйкой. Легенда сходится на том, что посланник получил моток тонкого шёлка, пробрался в крепость Калины и заменил тетиву в его луке на нить [Concept('dataw_magic','волшебного')|E] шёлка. При попытке Калины натянуть лук сердце последнего разорвалось, а сам он обратился в пыль. Годи заковал лук в стальной сундук и закопал его в Нахашинских топях, чтобы больше никто и никогда не смог им воспользоваться.." #Placeholder
 the_dragons_toe_name: "Палец дракона"
 the_dragons_toe_desc: "Странный предмет, похожий на коготь, который крестьяне нашли во время сбора грибов на краю Тирашана. Его описывают как\n«чёрный, словно грех, длиной с ваше предплечье, острый, как зимний солнечный свет, и покрытый непонятными рунами». С тех пор как предмет выставили на обозрение, он стал известен как\n«Палец дракона». Некоторые полагают, что это реликвия Второго [Concept('blight','Мора')|E], возможно, связанная с [Concept('archdemon','Архидемоном')|E] Зазикелем."
 mask_of_serault_name: "Родовая маска Серо со стеклянными рогами"
 mask_of_serault_desc: "Часовня [Concept('chantry','Церкви')|E] в Серо была закрыта с тех пор, как на город пал позор. Более того, родовая маска правящей семьи — символ дворянства в Орлее — была отобрана у них одной из [Concept('divine','Верховных жриц')|E] в наказание за бесчинства «Позора Серо». На протяжении целого века маска Серо со стеклянными рогами находилась во владении [Concept('chantry','Церкви')|E], пока в итоге не перешла к Верховной жрице Джустинии V." #Placeholder
 misfortunes_bite_name: "Печать невезения"
 misfortunes_bite_desc: "Несмотря на древность, этот топор так остр, что разрезает брошенный на него шёлковый платок. Имя изготовившего его кузнеца-аламарри затерялось в веках. Топор сменил не один десяток хозяев, неизменно погибавших при трагических и нелепых обстоятельствах." #Placeholder
 axe_of_green_edges_name: "Зеленокрайский топор"
 axe_of_green_edges_desc: "Топор искусной работы, созданный для знаменитых [Concept('emerald_knights','Изумрудных рыцарей')|E] вскоре после основания ордена. Красота этого оружия, высеченного из грозового сердца и доведённого до абсолютной смертоносности, сравнима лишь с неугасаемой любовью его обладателя к своему народу и культуре."
 mhemets_war_hammer_name: "Боевой молот Мхемета"
 mhemets_war_hammer_desc: "Этот боевой молот принадлежит печально известному Мхемету — [Concept('templar','храмовнику')|E], о котором говорят, что он рыскал по землям, выслеживая эльфов-[GetTrait('apostate').GetName( GetNullCharacter )]ов. Однако сказания о его деяниях повествуют скорее о неизбирательной резне [Concept('elves','эльфов')|E], независимо от того, владели ли они магией или нет. Эльфийский череп на навершии его излюбленного оружия лишь подтверждает истинную цель охоты Мхемета."
 sword_of_warrior_priest_name: "Меч жрицы-воительницы"
 sword_of_warrior_priest_desc: "Легендарный меч Олессы де Монсиммар, позже известной как [justinia.GetTitledFirstNameNicknamed], использовался в бесчисленных битвах во время объединения Орлея под началом [kordillus.GetTitledFirstNamePossessive]. Позже его не раз обнажали в сражениях плечом к плечу с Избранными, когда первая [divine|E] сражалась против [Concept('darkspawn','порождений тьмы')|E] Второго [Concept('blight','Мора')|E].\nПо сей день этот меч символизирует жрицу-воительницу и множественные битвы, в которых сражались, чтобы принести всем [chant_of_light|E], дабы [maker|E] наконец смог вернуться."
 shield_of_the_emperor_name: "Щит императора"
 shield_of_the_emperor_desc: "Вырезанный во славу первого императора Орлея, щит императора прошёл сквозь множество битв и не раз спасал жизнь Кордиллуса в его войнах, сплотивших Империю. Использовавшийся против противников объединения, а затем и против порождений тьмы во время Второго [Concept('blight','Мора')|E], этот щит, когда-то служивший для защиты правителя, стал символом его славы, храбрости и веры."
 scepter_of_redemption_name: "Скипетр искупления"
 scepter_of_redemption_desc: "Священный скипетр, выкованный по повелению императора Орлея Кордиллуса I, по преданиям был создан на основе воспоминаний императора, дабы максимально точно воспроизвести скипетр Андрасте, упоминаемый в Песни Возвышения. Предмет изготовлен с явной любовью, а вдоль всего скипетра начертаны строки из самой Песни. Говорят, что каждый раз, когда человек с непоколебимой верой в [Concept('maker','Создателя')|E] берёт этот посох, духи веры тотчас приходят, дабы утешить его разум и помочь в священных делах."
 anointeds_armor_name: "Доспехи Избранного"
 anointeds_armor_desc: "Эти доспехи, выкованные для императора Кордиллуса «Избранника Орлея» после начала Второго [Concept('blight','Мора')|E], Избранный надевал раз за разом, сражаясь по всему Тедасу для защиты его жителей от орд порождений тьмы. Своими подвигами в этих доспехах Кордиллус завоевал любовь многих людей в Орлее, Ферелдене, Андерфелсе, Вольных Марках и за их пределами. По сей день широкое почитание Песни Света в том виде, в каком он её задумал, остаётся заслугой его трудов."
 kordillus_i_ashes_name: "Прах императора Кордиллуса I"
 kordillus_i_ashes_desc: "Прах знаменитого первого правителя Орлея, императора Кордиллуса, хранится в искусно изготовленной урне, на которой изображено множество его достижений."
#  shield_of_the_emperor_name: "Shield of the Emperor"
#  shield_of_the_emperor_desc: "Carved for the glory of the First Emperor of Orlais, the Shield of the Emperor has seen many battles and saved Kordillus' life countless times in his wars that created the Empire. Used against opponents to the unification, followed by darkspawn in the Second [blight|E], what was once a shield to protect the Emperor has become a symbol of his glory, bravery, and faith."
 pearl_of_the_anointed_name: "Жемчужина избранного"
 pearl_of_the_anointed_desc: "Этот амулет был сорван с шеи Кордиллуса Драккона «Избранного", императора Орлея, во время одной из многих битв, в которых он участвовал, распространяя [chant_of_light|E] по всему [Concept('thedas','Тедасу')|E]." #placeholder
 #bow_of_the_golden_sun_name: "Bow of the Golden Sun"
 #bow_of_the_golden_sun_desc: "A wedding gift from Kordillus I, to his Empress Area Montlaures. The limbs of this bow have a beautiful sheen to them, and are decorated with polished brass pieces that glint with reflected light." #placeholder
 the_veshialle_name: "Вешиалле"
 the_veshialle_desc: "Топор из драгоценной драконьей кости, созданный для военачальника Ражмаэля, славившегося по всем Долам своим мастерством. Топор искусно выкован, но всё же представляет собой скорее боевое, чем декоративное оружие."
 var_boranehn_name: "Вар Боранехн"
 var_boranehn_desc: "Название этой скорбной хроники переводится как «Наша утраченная радость». Она повествует об истории элвенского народа. Труд начинается с падения Старого Элвенана и разрушения Арлатана, после чего авторы оставляют читателям послание надежды перед тем, как отправиться в Долгий поход к Долам. Это издание «Вар Боранехн» может похвастаться позолоченным переплётом и изысканными иллюстрациями, что отсылают к былому величию Арлатана."
 collection_of_heads_name: "Коллекция голов"
 collection_of_heads_desc: "Эта сумка, по слухам, полно черепов горожан, убитых военачальником по имени [ROOT.Char.GetFirstName] во время печально известного разграбления местечка [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTier].\nЛишь немногие осмелились заглянуть внутрь, чтобы удостовериться в этом."
 sulevin_blade_name: "Клинок Сулевин"
 sulevin_blade_desc: "Клинок Сулевин, чьё название означает «меч, имеющий предназначение», — это оружие, снискавшее легендарную славу за годы защиты Долов. Многие [elves|El] даже говорят, что он был выкован исключительно ради этого. Многие обнажали этот прекрасный меч в бою, и ещё многим только предстоит сразиться им — будь они [Concept('elves','эльфами')|E] или нет."
 blade_of_vengeance_name: "Клинок мести"
 blade_of_vengeance_desc: "Ранее известный как клинок Сулевин, этот меч более не является оружием, имеющим предназначение: после ритуала с использованием магии крови он полностью посвятил себя мести. Клинок чувствуется тёплый при прикосновении, стал ещё острее, и некоторые даже полагают, что в него вселился демон гнева, что придаёт достоверности сказаниям о массовых смертоубийствах, совершённых с помощью этого оружия."
 elgarnan_enaste_name: "Эльгарнан энасте"
 elgarnan_enaste_desc: "Этот прекрасный лук, по преданию зачарованный самим Эльгарнаном во времена древнего Элвенана, таит в себе древнюю [Concept('dataw_magic','магию')|E], благодаря которой стрелы взрываются при попадании, поражая врагов силой солнца, поверженного самим божеством."
 evanura_name: "Эванура"
 evanura_desc: "Клинок, выкованный Верховным хранителем бога ремесла для первого Изумрудного рыцаря Маталина. Надпись, начертанная на обратной стороне лезвия, гласит:\n«Выкованный посланником Джуна, Эванура устоит перед врагами Долов. Переданная от Маталина к его сыну-по-мечу, Эванура погубит тех, кто выступит против них — помяните моё слово»."
 the_winter_blade_name: "Меч Зимы"
 the_winter_blade_desc: "Хотя во время охоты за драконом Феншалем герой Дейн использовал много разного оружия, большинство мечей, приписываемых ему, — фальшивки. Этот может быть исключением." #placeholder
 aodh_name: "Аод"
 aodh_desc: "Боевой топор Аод хорошо известен в легендах клейнов, некоторые из которых утверждают, будто он горит кровью первого убитого им [Concept('demon','демона')|E]. Другие полагают, что огненная природа обусловлена вулканическим аурумом, использованным при его создании. Как бы то ни было, этот простой топор очень горячий на ощупь, как будто его оставили рядом с костром. Однако стоит сжать его, как воздух поблизости начнёт обжигать холодом." #placeholder
 yusaris_name: "Юсарис"
 yusaris_desc: "Легенда о мече Юсарисе существовала ещё до [andraste|E]. Меч, который Дейн нашел в сокровищнице дракона и с помощью которого убил как Феншаля, так и оборотня, перешел к его сыну Хафтеру. Нельзя сказать, сколько лет этому мечу, однако его лезвие по-прежнему сияет лунным светом. На одной стороне написаны слова:\n«Ты зеркало», а на другой — \n«Отражай». Говорят, что после многих лет мирного правления Хафтер покинул Ферелден, отплыв с тем самым мечом на заокраинный восток через океан Амарантайн, и с тех пор его не видели. Является ли этот двуручный меч из сильверита тем самым легендарным клинком — вопрос спорный, но каково бы ни было происхождение, сила его неоспорима." #placeholder
 tyrddas_staff_name: "Посох Тирдды"
 tyrddas_staff_desc: "Тирдда Яркая Секира, духа друг из гор горнила,\nПлемя верное взрастила, телом твёрдо, полно пыла,\nМудро мыслью, ликом хладно, духом сильно, хлебосольно,\nИз-за завеси ведомо, вековало племя вольно.\nИ была ярка секира: жар жерла, хрусталь холодный,\nДар любимой листоухой, поднебесья первородной.\nС брачным долгом временила,\nХоть мужчин вилось довольно,\nСоглядатай снов свободный,\nМатерь авваров земная."
 sundering_name: "Разлука"
 sundering_desc: "Легенда гласит, что булаву сделали не руками, а высидели из яйца в горах. Затем птицы принесли её Лутию  Гномьему Сыну в качестве свадебного подарка от Хозяйки Небес. Когда Лутий умер, прибыли [Concept('dwarves','гномы')|E], чтобы унести его в Орзаммар и похоронить как своего, дабы он воссоединился с Камнем. Разлуку должны были положить в могилу, но не смогли найти. Рассказывают, что её забрали птицы. В свое время они принесут булаву другому герою." #placeholder
 talon_of_the_skies_name: "Коготь Небес"
 talon_of_the_skies_desc: "Этот клинок украшен символами Хозяйки небес." #placeholder
 tooth_mountain_father_name: "Клык Отца гор"
 tooth_mountain_father_desc: "Этот клинок украшен символами Корта, Отца Горы." #placeholder
 dogs_of_war_name: "Псы войны"
 dogs_of_war_desc: "" #placeholder
 tacitus_name: "Молот Тацита"
 tacitus_desc: "Тацит Валерий был императором легионов Тевинтера все кровавые годы правления архонта Тидариона. Поговаривали, что его молот сокрушил столько жрецов [Concept('old_god','Древних Богов')|E], что стал через их кровь навечно связан с их злостью и пожеланием, чтобы никто иной не выстоял против оружия, погубившего их." #placeholder
 fistmagister_name: "Кулак магистра"
 fistmagister_desc: "Это оружие гудит от тёмной силы. Металл, из которого оно выковано, не использовали со времён древней империи Тевинтер: кузнецы при работе с ним теряли сознание, а мер защиты от этого никто не знал." #placeholder
 blade_of_tidarion_name: "Клинок Тидариона"
 blade_of_tidarion_desc: "Когда Тидарион унаследовал престол, магистры объявили его — солдатского сына без капли крови сновидцев — неподходящей персоной для правления. В последующей за этим гражданской войне Тидарион сам выходил на поля битв, сражаясь клинком как простолюдин и творя заклинания, доступные лишь архонту. Он прорубил и прожёг себе дорогу на землях Тевинтера, прежде чем умер на поле брани с мечом в руке." #placeholder
 magisterlord_name: "Посох лорда-магистра"
 magisterlord_desc: "Среди последних лордов-магистров, вторгшихся в Ферелден в славный период истории Тевинтерской империи, был и знаменитый Тлаксиус. Его посох - один из шедевров заклинательного ремесла того времени." #placeholder
 spellfury_name: "Ярость заклятий"
 spellfury_desc: "Этот посох покрыт древнетевинтерскими письменами. Надпись гласит:\n«Твоя сила — это ярость стихий»." #placeholder
 maetashear_name: "Меташирская секира"
 maetashear_desc: "Это непомерных размеров оружие было перековано из двух сильверитовых алебард и происхождением своим восходит к эпохе основных завоеваний Тевинтерской империи. Рунные надписи излагают первобытный миф о том, как были разобщены земли богов и людей." #placeholder
 dawnring_name: "Кольцо восхода"
 dawnring_desc: "Архонт Дариний Тевинтерский, спустившись глубоко в не знающие света [Concept('dwarves','гномьи')|E] владения, заключил соглашение с Эндрином Кувалдой, правителем империи гномов. В знак подтверждения договора Эндрин подарил архонту пару колец — одно светило, как вечерняя звезда, а сияние другого было подобно заре. Это кольцо цвета меда, вырезанное из прекрасного цельного топаза, теплое, словно нагрето солнцем." #placeholder
 duskring_name: "Кольцо заката"
 duskring_desc: "Архонт Дариний Тевинтерский, спустившись глубоко в не знающие света [Concept('dwarves','гномьи')|E] владения, заключил соглашение с Эндрином Кувалдой, правителем империи гномов. В знак подтверждения договора Эндрин подарил архонту пару колец — одно светило, как вечерняя звезда, а сияние другого было подобно заре. Это кольцо имеет очевидные признаки гномьей работы. Оно вырезано из цельного куска аметиста, тяжёлое и прохладное на ощупь." #placeholder
 havards_aegis_name: "Щит Хаварда"
 havards_aegis_desc: "Хавард не смог спасти [andraste|E] из огня, но сумел извлечь её прах и вернуть его на земли аламарри, где она могла непрестанно взирать в небо своего [Concept('maker','Создателя')|E]. Этот простой деревянный щит треснул от жуткого удара много лет назад, однако наполнен таинственной силой, и кажется, что светится собственным светом." #placeholder
 far_song_name: "Далёкая песня"
 far_song_desc: "Этот чуть ли не звенит от таинственной силы. Его история, вне всякого сомнения, длинна и разнообразна, но, к сожалению, была утеряна в бездне веков." #placeholder
 lucky_stone_name: "The Lucky Stone"
 lucky_stone_desc: "This old stone, set in a golden ring, has been an aid and companion to dozens of adventurers across innumerable years. Its trips across [thedas|E] were long and convoluted, some say it has a life of its own." #placeholder
 wintersbreath_name: "Wintersbreath"
 wintersbreath_desc: "Egon Wintersbreath, one of history's greatest dwarven warriors, achieved Paragon status in his own lifetime, leading the defense of the Kingdom of Hormak during the First [blight|E] until it fell in -35 Ancient. When word came that Orzammar would seal its passages from the other kingdoms, he dropped his hammer and left for the surface, grieving, n\"I would rather die under an alien sky than be buried in the Stone that betrayed us."" #placeholder
 tome_of_justinia_name: "Tome of [justinia_i.GetTitledFirstNameNicknamed]"
 tome_of_justinia_desc: "An old tome claimed to have been written by the first [divine|E] herself, the book is filled with insightful thoughts on Andrastian theology, as well as wonderfully explained fighting maneuvers, fitting for the Warrior-Priest. It seems very old, the pages having long since turned yellow and dusty, yet the text is as strong as it as ever been."
 opponent_sword_name: "[opponent.GetCulture.GetName] officer's sword of [battle_location.GetName]"
 opponent_sword_desc: "A sword found on the former grounds of the battle of [battle_location.GetName], fought in [memory.GetCreationDate.GetString], this sword is a relic of its time, an old and prized memory of a day where blood and steel reigned supreme."
 hobbyist_alchemist_book_name: "101 Uses for Sulfur"
 hobbyist_alchemist_book_desc: "An alchemical treatise outlining different uses for the waters of the Sulfur Lakes. Some of its ideas are even useful."
 cendrerin_fish_sauce_name: "Cendrerin fish sauce"
 cendrerin_fish_sauce_desc: "This amphora beautifully ornamented with lazurite and nevarrite, with carvings all around its exterior showing the landscapes of the Sea of Ash. Inside is an exotic fish sauce, made from the various fishes catched in the Sundered Sea that composes most of the Cendrerin's diet."

 common_gems_name: "Common Gems"
 common_gems_desc: "A small packet of gems found deep inside the Deep Roads. Despite their beauty, they are fairly common in the depths of the old dwarven empire, and only inspire awe to those unfamiliar with them."
 old_axe_of_the_thaigs_name: "Old Axe of the Thaigs"
 old_axe_of_the_thaigs_desc: "This axe, found in the forgotten depths of the Deep Roads, is a mastercraft of the ancient dwarves of the smith caste, in the times of the Dwarven empire of old. Despite the time it has been left unused, the edge of the blade is still sharp enough to cleanly cut a Genlock's head."
 lost_crown_of_kal_repartha_name: "Lost Crown of Kal-Repartha"
 lost_crown_of_kal_repartha_desc: "The long lost crown of the enigmatic surface Thaig of Kal Repartha, this magnificent crown of dwarven craft is a gift given from the Stone to the rest of Thedas, for any dwarf that wears this crown may be called the rightful master of Kal Repartha and its surrounding lands, and any other would see his or her prestige be gained due to the sheer beauty of the old crown."
 crown_of_a_forgotten_thaig_name: "Crown of a Forgotten Thaig"
 crown_of_a_forgotten_thaig_desc: "The name of the Thaig that this crown represents has long been lost to the annals of history, yet the majesty of the regal crown remains. With the intricate crafting of the old smith caste and the glorious metals all carved within, the crown can only command respect and authority."

 caedmons_crown_name: "[ROOT.Char.GetFirstName]'s Crown"
 caedmons_crown_desc: "A crown forged in honor of [ROOT.Char.GetFirstName]'s claim to the throne of all of Ferelden."

 #Aerona
 mirror_of_placid_lakes_name: "Mirror of Placid Lakes"
 mirror_of_placid_lakes_desc: "A hand mirror of polished silver, made in the likeness of a great lake."
 tapestry_of_open_skies_name: "Tapestry of Open Skies"
 tapestry_of_open_skies_desc: "A tapestry, depicting the stars and celestial bodies as they appear in all four seasons."