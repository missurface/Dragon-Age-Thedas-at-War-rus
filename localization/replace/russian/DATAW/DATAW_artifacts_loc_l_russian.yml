l_russian:
 yavanalis_name: "Yavanalis"
 yavanalis_desc: "A cold staff of [elvhen|E] origin that possesses immense power. Its exact age is unknown, but it has been wielded by the keepers of the Suledin Clan since the Long Walk. In the right hands, Yavanalis is a terrifying weapon, capable of entirely freezing its foes in ice." 
 fadeshear_name: "Fadeshear"
 fadeshear_desc: "The core of this blade is old. As old as the first smiths who sought a way to battle the nightmares from the land beyond. It has fought the demonic hosts in countless battles. Sometimes it has been held high in triumphant victory. Other times, it has lain broken besides its dying owner. But after every defeat it has always been reclaimed, reforged, and made stronger. Fadeshear has passed through many hands before yours. Now it is your turn to make the [demon|E]s of the Fade pay for crossing the [veil|E] into the waking world." #Placeholder
 song_of_the_marshes_name: "Song of the Marshes"
 song_of_the_marshes_desc: "A single-handed axe crafted with silverite as a symbol for the Ciriane people, the Song of the Marshes was forged by Lord Roux Marchette himself in preparation for his future reign. His people refer to him as the true king in the marshes, but he is not a king yet.\n"King" Roux understands that he won't be a king, nor that his people will be free until they have escaped the vice-grip of the dragon's maw. Axe in hand, Roux prepares himself for war with the mighty Orlesian Empire."
 bane_of_red_crossing_name: "Bane of Red Crossing"
 bane_of_red_crossing_desc: "placeholder TODO"
 farslayer_name: "Farslayer"
 farslayer_desc: "The thrum of this bow's string is like a whisper in the mind—in [elvhen|E] or an even older tongue. Its power has lasted the millennia, but it has faded far from the marvel it once was." #Placeholder
 helm_of_the_drasca_name: "Helm of the Drasca"
 helm_of_the_drasca_desc: "The Drasca were an order of warriors formed in the ancient Anderfels to resist the Tevinter Imperium reconquest in -535 Ancient. Renowned for their whirling blades and skill with the bow, they were brutally hunted by the Imperium until the last members fled into the Blasted Hills of the south. Rumors persisted that the Drasca continued on and played a part in the Anders rebellion against Orlesian rule following the Second [blight|E], but if that is true, they subsequently drifted into obscurity once again." #Placeholder
 arrowwood_name: "Arrowwood"
 arrowwood_desc: "An old Ciriane tale speaks of an archer named Arrowwood who traded his heart to the spirit of an oak grove to become the greatest archer in the world. He conquered a hundred keeps and slew the west wind with arrows that, once loosed, could never be stopped. Finally, Arrowwood shot the sun from the sky, turning day to night, and the gothi sent a messenger to seek out the Witch of the Arbor Wilds. Depending on the story's version, the messenger never found the witch and dealt with a demon instead, worked for the witch and her daughters for a year and a day, or made a bargain with the Lady of the Skies. In all tellings, the messenger received a coil of fine silk, traveled to Arrowwood's keep, and secretly replaced the archer's bowstring with the [dataw_magic|E] silk. When Arrowwod tried to draw the bow, his heart shattered, and he crumbled into dust. The gothi bound his bow in an iron case and buried it in the Nahashin Marshes so that no one could ever use it again." #Placeholder
 the_dragons_toe_name: "The Dragon's Toe"
 the_dragons_toe_desc: "A strange claw-like object found by peasants as they were picking mushrooms on the edge of the Tirashan. It's described to be \n"black as sin, as long as your forearm, sharp as winter sunlight, and engraved with unidentifiable runes." Since being displayed it has come to be known as \n"The Dragon's Toe". Some speculate it to be a relic from the Second [blight|E], possibly linking it to the [archdemon|E] Zazikel."
 mask_of_serault_name: "The Ancestral Glass-Antlered Mask of Serault"
 mask_of_serault_desc: "The [chantry|E] chapel in Serault has been closed since shame was brought upon the town. Furthermore, the ruling family's ancestral mask, the symbol of the nobility in Orlais, was stripped from them by one of the [divine|E]'s, in retaliation for the Shame of Serault's excesses. For over a century, the Glass-Antlered Mask of Serault has been in the possession of the [chantry|E] eventually passing to Divine Justinia V." #Placeholder
 misfortunes_bite_name: "Misfortune's Bite"
 misfortunes_bite_desc: "Ancient, yet still so sharp it could slice through a silk handkerchief tossed lightly upon its blade. Crafted by an Alamarri smith whose name is lost to time, the axe was wielded by dozens of men and women, all who met their downfall while in possession of it." #Placeholder
 axe_of_green_edges_name: "Axe of Green Edges"
 axe_of_green_edges_desc: "An axe of fine craftsmanship made for the renowned [emerald_knights|E] shortly after the order was founded. The beauty of the weapon, made from stormheart perfectly crafted into its deadly shape, is only matched by the undying love its holder has for their people and culture."
 mhemets_war_hammer_name: "Mhemet's War Hammer"
 mhemets_war_hammer_desc: "This war hammer belongs to the infamous Mhemet, a [templar|E] said to scour the land hunting down elf [GetTrait('apostate').GetName( GetNullCharacter )]'s. However, the tales of his deeds tell more of a general massacre of [elves|E], magical or not, and the elven skull at the end of his signature weapon only confirms his real target."
 sword_of_warrior_priest_name: "Sword of the Warrior-Priest"
 sword_of_warrior_priest_desc: "The legendary sword of Olessa de Montsimmard, later known as [justinia.GetTitledFirstNameNicknamed], was used in countless battles during [kordillus.GetTitledFirstNamePossessive] unification of Orlais, and was later used in many battles alongside the Anointed as the First [divine|E] fought against the [darkspawn|E] of the Second [blight|E].\nTo this day, the sword represents the Warrior-Priest and the many battles that were fought to bring to all the [chant_of_light|E] so that the [maker|E] can finally return."
 shield_of_the_emperor_name: "Shield of the Emperor"
 shield_of_the_emperor_desc: "Carved for the glory of the First Emperor of Orlais, the Shield of the Emperor has seen many battles and saved Kordillus' life countless times in his wars that created the Empire. Used against opponents to the unification, followed by darkspawn in the Second [blight|E], what was once a shield to protect the Emperor has become a symbol of his glory, bravery, and faith."
 scepter_of_redemption_name: "Scepter of Redemption"
 scepter_of_redemption_desc: "Forged at the request of Emperor Kordillus I of Orlais and claimed to be made from the Emperor’s memory to imitate Andraste’s scepter mentioned in the Canticle of Exaltations, the holy regalia is lovingly sculpted, with parts of the Canticle itself written all along the scepter. It is said that whenever someone of firm belief in the [maker|E] holds the staff, spirits of faith come to soothe the holder’s mind and to aid in sacred activities."
 anointeds_armor_name: "Anointed's Armor"
 anointeds_armor_desc: "Forged for Emperor Kordillus 'the Anointed of Orlais' after the beginning of the Second [blight|E], this armour was worn time and time again by the Anointed as he fought all across Thedas to defend the populace against the Darkspawn hordes. With this armour, Kordillus earned the adoration of many people in Orlais, Ferelden, the Anderfels, the Free Marches and more. To this day, the widespread adoration of the Chant of Light as he conceived it is thanks to his efforts."
 kordillus_i_ashes_name: "Emperor Kordillus I' Ashes"
 kordillus_i_ashes_desc: "The ashes of the famed first Emperor of Orlais, Emperor Kordillus’ Ashes are kept in a lovingly crafted urn representing Kordillus’ many accomplishments."
#  shield_of_the_emperor_name: "Shield of the Emperor"
#  shield_of_the_emperor_desc: "Carved for the glory of the First Emperor of Orlais, the Shield of the Emperor has seen many battles and saved Kordillus' life countless times in his wars that created the Empire. Used against opponents to the unification, followed by darkspawn in the Second [blight|E], what was once a shield to protect the Emperor has become a symbol of his glory, bravery, and faith."
 pearl_of_the_anointed_name: "Pearl of the Anointed"
 pearl_of_the_anointed_desc: "This amulet once belonged to Emperor Kordillus Drakon of Orlais. The amulet was torn from Drakon's neck in one of the many battles he fought in order to spread the [chant_of_light|E] throughout [thedas|E]." #placeholder
 #bow_of_the_golden_sun_name: "Bow of the Golden Sun"
 #bow_of_the_golden_sun_desc: "A wedding gift from Kordillus I, to his Empress Area Montlaures. The limbs of this bow have a beautiful sheen to them, and are decorated with polished brass pieces that glint with reflected light." #placeholder
 the_veshialle_name: "The Veshialle"
 the_veshialle_desc: "An axe made from prized Dragonbone for the general Rajmael, renowned throughout the Dales for his skill. The axe is finely crafted, yet is more of a practical weapon than a decorative one."
 var_boranehn_name: "Var Boranehn"
 var_boranehn_desc: "Translated as “Our Lost Joy,” this mournful chronicle recounts the tale of the elvhen people, beginning with the collapse of Old Elvhenan and the destruction of Arlathan before its authors leave their readers with a message of hope as they depart on the Long Walk to the Dales. This edition of the Var Boranehn boasts a gilded cover and illuminated pages depicting scenes that harken back to the glory of Arlathan."
 collection_of_heads_name: "Collection of Heads"
 collection_of_heads_desc: "This bag is supposedly filled with the cleaned heads of multiple civilians killed by the general [ROOT.Char.GetFirstName] in the infamous Sack of [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTier].\nVery few have dared look inside to verify."
 sulevin_blade_name: "Sulevin Blade"
 sulevin_blade_desc: "The Sulevin blade, meaning a sword with purpose, is a sword that gained legendary renown throughout the years defending the Dales. Many [elves|E] even say that it was forged for that sole reason. Many have wielded this beautiful sword in battle, and many more will wield it still, whether they are [elves|E] or not."
 blade_of_vengeance_name: "Blade of Vengeance"
 blade_of_vengeance_desc: "Formerly known as the Sulevin Blade, this sword is no longer a sword of purpose, and has devoted itself solely to vengeance after being used in a blood magic ritual. The sword is warm to the touch, sharper, and some even speculate that the sword is inhabited by a rage demon, adding to the told stories of massacres made in its name."
 elgarnan_enaste_name: "Elgar'nan Enaste"
 elgarnan_enaste_desc: "This beautiful bow, said to have been enchanted by Elgar'nan himself in the Elvhenan of old, holds old [dataw_magic|E] that makes arrows explode on contact, killing them with the strength of the sun he overthrew."
 evanura_name: "Evanura"
 evanura_desc: "Forged by the High keeper of the god of Craft for the first Emerald Knight Mathalin, an inscription written on the rear end of the blade reads \n"Forged by June's Emissary, Evanura shall stand against the Dales' enemies, Once passed from Mathalin to his son of the sword, Evanura shall slay those who oppose it, mark my word.""
 the_winter_blade_name: "The Winter Blade"
 the_winter_blade_desc: "Although the hero Dane wielded many weapons during his hunt for the dragon Fenshal, most swords now attributed to him are fakes. This may be an exception." #placeholder
 aodh_name: "Aodh"
 aodh_desc: "The battle axe, Aodh is well known in Clayne legends, some of which claim it burns with the blood of the first [demon|E] it slew. Others purport that its fiery nature is due to the volcanic aurum used in its construction. Whatever the reason, this axe is very hot to the touch, as if it's been left near a fire. But holding it seems to make the air around you grow bitterly cold." #placeholder
 yusaris_name: "Yusaris"
 yusaris_desc: "The legend of the blade Yusaris predates [andraste|E]. The sword that Dane found in the dragon's treasure hoard, which he used to slay both Fenshal and the werewolf, was passed on to his son Hafter. There is no telling how old this sword is, and yet the edge is still as bright as moonlight. Written on one side of the blade are the words, \n"You are the mirror." On the other is written, \n"Reflect." It is said that Hafter left Ferelden, sailing into the unknown east of the Amaranthine Ocean with the blade still in hand, never to be seen again. Whether this silverite greatsword is the blade of legend is debatable, but whatever its origin, its power is unmistakable." #placeholder
 tyrddas_staff_name: "Tyrdda's Staff"
 tyrddas_staff_desc: "Tell the tale of Tyrdda Bright-Axe, mountain maker, spirit's bride: Free, her people, forged in fastness, made in mountains, hardy hide. Wise in wisdom, calm in counsel, great in gifts her grateful guests, sacrificed she did to spirits, took their teachings, followed quests. Bright her axe, unbreaking crystal, stirred to flame when temper flies, gifted from her leaf-eared lover, laughing lady of the skies. Bested blades of all who tried, maiden, spurning all requests, Tyrdda Bright-Axe, Dreamer's Eyes. Avvar-Mother, of her making."
 sundering_name: "Sundering"
 sundering_desc: "Legend says this mace was not crafted by hand, but instead hatched from an egg high in the mountains and then carried by birds to Luthias Dwarfson as a wedding gift from the Lady of the Skies. When Luthias died, [dwarves|E] arrived to carry him to Orzammar to be buried as one of their own with the Stone. Sundering was to lie at his side, but the maul could not be found. Stories say the birds reclaimed it and will deliver it to another hero in time." #placeholder
 talon_of_the_skies_name: "Talon of the Skies"
 talon_of_the_skies_desc: "Symbols of the Lady of the Skies, adorn this blade." #placeholder
 tooth_mountain_father_name: "Tooth of the Mountain-Father"
 tooth_mountain_father_desc: "Symbols of Korth the Mountain-Father, adorn this blade." #placeholder
 dogs_of_war_name: "The Dogs of War"
 dogs_of_war_desc: "" #placeholder
 tacitus_name: "Maul of Tacitus"
 tacitus_desc: "Tacitus Valerius served as Imperator of the Tevinter Legions for all of the blood-soaked reign of Archon Tidarion. It was rumored that the maul he carried had broken so many priests of the [old_god|E]s that their blood forever fused it with their spite so that no one should ever stand before the weapon that had felled them." #placeholder
 fistmagister_name: "Fist of the Magister"
 fistmagister_desc: "Humming with a dark power, this weapon was forged from a metal unused since the old Tevinter Imperium; primarily because it renders smiths unconscious unless they know how to properly handle it, and none do" #placeholder
 blade_of_tidarion_name: "Blade of Tidarion"
 blade_of_tidarion_desc: "When Tidarion inherited the throne, the Magisters declared him unfit to rule: a soldier's son, with no Dreamer blood to speak of. In the civil war that followed, Tidarion took to the field with a blade like a commoner and casting spells as only an Archon could. He carved and burned a brutal path across Tevinter before he died on the battlefield, sword in hand." #placeholder
 magisterlord_name: "Staff of the Magister Lord"
 magisterlord_desc: "Among the last magister lords to invade Ferelden in the glory days of the Tevinter Empire was the infamous Tlaxius. His staff was one of the masterpieces of enchantment of that age." #placeholder
 spellfury_name: "Spellfury"
 spellfury_desc: "This staff is covered in old Tevinter script. It reads: n\"Yours is the fury of the elements."" #placeholder
 maetashear_name: "Maetashear War Axe"
 maetashear_desc: "A truly enormous weapon, this two-handed axe was forged from two silverite polearms. Its blades are covered in ancient Tevinter runes that tell the myth of how the Fade was cut apart from the world of men." #placeholder
 dawnring_name: "Dawn Ring"
 dawnring_desc: "Archon Darinius of Tevinter journeyed deep into the lightless realm of [dwarves|E] and there forged a covenant with Endrin Stonehammer, lord of the dwarven empire. As a symbol of their pact, Endrin gave the archon a pair of rings-one that shone like the evening star, and one as luminous as the dawn. Carved from a single, perfect topaz, this ring is the color of honey, and is warm, as if it has been left in the sun." #placeholder
 duskring_name: "Dusk Ring"
 duskring_desc: "Archon Darinius of Tevinter journeyed deep into the lightless realm of [dwarves|E] and there forged a covenant with Endrin Stonehammer, lord of the dwarven empire. As a symbol of their pact, Endrin gave the archon a pair of rings-one that shone like the evening star, and one as luminous as the dawn. The signs of dwarven craftsmanship on this ring are clear. Carved from a single, flawless piece of amethyst, it is heavy and cool to the touch." #placeholder
 havards_aegis_name: "Havard's Aegis"
 havards_aegis_desc: "Havard was unable to save [andraste|E] from the fires, but managed to retrieve her ashes and bring them back to the Alamarri lands. Where she could gaze ever into her [maker|E]'s sky. A terrible blow scarred the face of this plain wooden shield long ago. But there is a strength and presence to the shield, and it seems almost to glow with a light of its own." #placeholder
 far_song_name: "Far Song"
 far_song_desc: "This bow almost hums with a mysterious power. Its history is no doubt long and varied, but sadly that tale has been lost to the ravages of time." #placeholder
 lucky_stone_name: "The Lucky Stone"
 lucky_stone_desc: "This old stone, set in a golden ring, has been an aid and companion to dozens of adventurers across innumerable years. Its trips across [thedas|E] were long and convoluted, some say it has a life of its own." #placeholder
 wintersbreath_name: "Wintersbreath"
 wintersbreath_desc: "Egon Wintersbreath, one of history's greatest dwarven warriors, achieved Paragon status in his own lifetime, leading the defense of the Kingdom of Hormak during the First [blight|E] until it fell in -35 Ancient. When word came that Orzammar would seal its passages from the other kingdoms, he dropped his hammer and left for the surface, grieving, n\"I would rather die under an alien sky than be buried in the Stone that betrayed us."" #placeholder
 tome_of_justinia_name: "Tome of [justinia_i.GetTitledFirstNameNicknamed]"
 tome_of_justinia_desc: "An old tome claimed to have been written by the first [divine|E] herself, the book is filled with insightful thoughts on Andrastian theology, as well as wonderfully explained fighting maneuvers, fitting for the Warrior-Priest. It seems very old, the pages having long since turned yellow and dusty, yet the text is as strong as it as ever been."
 opponent_sword_name: "[opponent.GetCulture.GetName] officer's sword of [battle_location.GetName]"
 opponent_sword_desc: "A sword found on the former grounds of the battle of [battle_location.GetName], fought in [memory.GetCreationDate.GetString], this sword is a relic of its time, an old and prized memory of a day where blood and steel reigned supreme."
 hobbyist_alchemist_book_name: "101 Uses for Sulfur"
 hobbyist_alchemist_book_desc: "An alchemical treatise outlining different uses for the waters of the Sulfur Lakes. Some of its ideas are even useful."
 cendrerin_fish_sauce_name: "Cendrerin fish sauce"
 cendrerin_fish_sauce_desc: "This amphora beautifully ornamented with lazurite and nevarrite, with carvings all around its exterior showing the landscapes of the Sea of Ash. Inside is an exotic fish sauce, made from the various fishes catched in the Sundered Sea that composes most of the Cendrerin's diet."

 common_gems_name: "Common Gems"
 common_gems_desc: "A small packet of gems found deep inside the Deep Roads. Despite their beauty, they are fairly common in the depths of the old dwarven empire, and only inspire awe to those unfamiliar with them."
 old_axe_of_the_thaigs_name: "Old Axe of the Thaigs"
 old_axe_of_the_thaigs_desc: "This axe, found in the forgotten depths of the Deep Roads, is a mastercraft of the ancient dwarves of the smith caste, in the times of the Dwarven empire of old. Despite the time it has been left unused, the edge of the blade is still sharp enough to cleanly cut a Genlock's head."
 lost_crown_of_kal_repartha_name: "Lost Crown of Kal-Repartha"
 lost_crown_of_kal_repartha_desc: "The long lost crown of the enigmatic surface Thaig of Kal Repartha, this magnificent crown of dwarven craft is a gift given from the Stone to the rest of Thedas, for any dwarf that wears this crown may be called the rightful master of Kal Repartha and its surrounding lands, and any other would see his or her prestige be gained due to the sheer beauty of the old crown."
 crown_of_a_forgotten_thaig_name: "Crown of a Forgotten Thaig"
 crown_of_a_forgotten_thaig_desc: "The name of the Thaig that this crown represents has long been lost to the annals of history, yet the majesty of the regal crown remains. With the intricate crafting of the old smith caste and the glorious metals all carved within, the crown can only command respect and authority."

 caedmons_crown_name: "[ROOT.Char.GetFirstName]'s Crown"
 caedmons_crown_desc: "A crown forged in honor of [ROOT.Char.GetFirstName]'s claim to the throne of all of Ferelden."

 #Aerona
 mirror_of_placid_lakes_name: "Mirror of Placid Lakes"
 mirror_of_placid_lakes_desc: "A hand mirror of polished silver, made in the likeness of a great lake."
 tapestry_of_open_skies_name: "Tapestry of Open Skies"
 tapestry_of_open_skies_desc: "A tapestry, depicting the stars and celestial bodies as they appear in all four seasons."