l_russian:

# Whale Hunt decision 
 RICE_north_atlantic_whale_hunt:0 "Профинансировать охоту на китов"
 RICE_north_atlantic_whale_hunt_desc:0 "В [ROOT.Char.GetCulture.GetCollectiveNoun|l]ой культуре на китов охотятся уже много поколений. Туша кита приносит немалую прибыль: мясо можно продать, а ворвань — переработать в ценное масло. Поэтому я хочу профинансировать охоту на китов, которая пройдёт от моего имени."
 RICE_north_atlantic_whale_hunt_tooltip:1 "«Нет такого безумия у зверей земных, которое безумие людей не превзошло бы бесконечно»."
 RICE_north_atlantic_whale_hunt_effect_tooltip_1:1 "Ваш шанс на успех составляет #V [GetPlayer.MakeScope.ScriptValue('RICE_north_atlantic_whaling_success_chance')|0]%#!. На него влияют ваши [Concept('traits','свойства')|E] и [Concept('skills','навыки')|E], особенно [Concept('stewardship','управление')|E], а также [Concept('martial','военное дело')|E] и [Concept('learning','учёность')|E]"
 RICE_north_atlantic_whale_hunt_effect_tooltip_2:1 "В случае успеха вы получите [Concept('prestige','престиж')|E] и случайную сумму [Concept('gold','золота')|E] — от #V [gold_i|E] 1#! до #bold максимальной суммы#! в #V [gold_i|E] [GetPlayer.MakeScope.ScriptValue('RICE_north_atlantic_whaling_max_gold_display_value')|0]#!"
 north_atlantic.0180.t:0 "Китобои отправляются в путь"
 RICE_north_atlantic_whale_hunt_confirm:0 "Начать поиски опытных китобоев!"
 north_atlantic.0180.desc:0 "В [ROOT.Char.GetCulture.GetCollectiveNoun|l]ой культуре на китов охотятся столько, сколько помнит себя наш народ. Эти создания — точнее, их туши — служат ценным источником мяса и ворвани, из которой вытапливают масло.\n\nДаже я, [Select_CString(ROOT.Char.IsFemale, 'такая великая', 'такой великий' )] [ROOT.Char.GetTitleAsNameNoTooltip|l], понимаю, что китобойный промысел сулит прибыль, хотя и сопряжён с риском. Поэтому я [Select_CString(ROOT.Char.IsFemale, 'решила', 'решил' )] нанять нескольких китобоев, чтобы они нашли и добыли этих величественных созданий; немалая доля выручки от их добычи достанется мне. Одни китобои предпочитают выходить за китами в открытое море, другие заманивают их к берегу, где тех можно загнать в ловушку.\n\nРазумеется, ожидания следует умерить: не каждая охота заканчивается удачно. И всё же я не сомневаюсь, что нанятые мной китобои справятся более чем достойно."
 north_atlantic.0180.a:0 "Удачи!"
 north_atlantic.0181.t:0 "Китобои возвращаются"
 north_atlantic.0181.desc:0 "Китобои, которых я недавно [Select_CString(ROOT.Char.IsFemale, 'отправила', 'отправил' )] на промысел, вернулись. Все они — [ROOT.Char.GetCulture.GetName|l].\n\n"
 north_atlantic.0181.desc.fail:0 "Увы, китобои потерпели неудачу и не сумели добыть ни одного кита! Я крайне [Select_CString(ROOT.Char.IsFemale, 'разочарована', 'разочарован' )] этим результатом, хотя подобные исходы не редкость. Остаётся надеяться, что в следующий раз нанятые мной китобои окажутся удачливее… или умелее."
 north_atlantic.0181.desc.success:0 "К счастью, китобоям удалось добыть нескольких китов. Когда мы свяжемся с ближайшими торговцами, то сможем продать мясо и ворвань, из которой вытапливают масло, а затем отправить товары в другие порты. Поздравляя китобоев с отличной работой, я прикидываю, какую прибыль принесёт их добыча.\n\n"
 north_atlantic.0181.desc.low:0 "К сожалению, китобои добыли лишь пару китов — не самый впечатляющий результат. Этого хватило, чтобы покрыть часть расходов на экспедицию, однако солидной прибыли такая добыча не принесла.\n\nИ всё же могло быть хуже! По крайней мере, мы не остались с пустыми руками."
 north_atlantic.0181.desc.medium:0 "Китобои добыли немало китов. Этого оказалось достаточно не только для покрытия расходов на экспедицию, но и для получения неплохой прибыли!\n\nНа результат жаловаться не приходится, и я [Select_CString(ROOT.Char.IsFemale, 'рада', 'рад' )], что [Select_CString(ROOT.Char.IsFemale, 'нашла', 'нашёл' )] команду умелых китобоев."
 north_atlantic.0181.desc.high:0 "Китобои добыли множество китов; более того, это была одна из самых удачных китобойных экспедиций в этих краях за долгое время. Мы не только покрыли все расходы, но и получили огромную прибыль!\n\nКоманда китобоев произвела на меня сильнейшее впечатление, и я надеюсь ещё поработать с ними в будущем."
 north_atlantic.0181.a.failure:0 "Возможно, в следующий раз нам повезёт больше…"
 north_atlantic.0181.a.low:0 "Придётся довольствоваться тем, что удалось добыть."
 north_atlantic.0181.a.medium:0 "Китобои отлично потрудились."
 north_atlantic.0181.a.high:0 "Весьма достойный результат!"
