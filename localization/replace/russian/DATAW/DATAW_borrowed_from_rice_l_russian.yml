 culture_parameter_unlock_rice_whaling:0 "Открывает [Concept('decision','решение')|E] «$RICE_north_atlantic_whale_hunt$»"
 culture_parameter_unlock_rice_whaling_stations:0 "Открывает [Concept('decisions','решения')|E] «$RICE_north_atlantic_whale_exempt_tax$» и «$RICE_north_atlantic_whale_levy_extra_tax$» для [Concept('rulers','правителей')|E] [Concept('counties','графств')|E] этой [Concept('culture','культуры')|E]"
# Misc
 RICE_capital_coastal_county:0 "Ваша столица находится в прибрежном [Concept('county','графстве')|E]"