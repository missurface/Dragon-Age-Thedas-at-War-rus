## Fall of the Dales
 bm_fall_of_the_dales:0 "Падение Долов"
 bm_fall_of_the_dales_desc:0 "Десять лет прошло с момента окончания Второго Мора, и Тедас всё так же движется вперёд. Ферелден остаётся без правителя, погрязнув в мелких ссорах между неопытными тэйрнами и баннами. Один человек провозгласил себя королём Ферелдена и намерен объединить все эти земли любой ценой. Вражда между Орлеем и Долами продолжается, а слухи твердят о близящемся конфликте. Но и этого Орлею мало: на болотах разгорается восстание, где новый «король» болот стремится к независимости от империи.\n\n#!#bold Сколько народов и держав сгинет иль возвысится в борьбе за власть и величие после Второго Мора?"

 bookmark_hassandriel:0 "Принц Хассандриэль"
 bookmark_hassandriel_desc:0 "[Concept( 'story_content_hassandriel', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hassandriel', '$bm_story_content_available_copy|q$' )|E]\n#!Сохраняя нейтралитет во время Второго [Concept('blight','Мора')|E], Долы продолжали оставаться независимыми от своих человеческих соседей из Орлея. Однако, как показывает история, нейтралитет лишь до поры до времени может защищать народ. Даже лучшие из лидеров со временем оказываются втянуты в конфликт — будь то в пределах собственных границ... или за их пределами.\n\nХассандриэль — нынешний принц Долов, и он прекрасно знает о растущей враждебности между его народом и Орлеем. Несмотря на его личное отношение к этой ситуации, маловероятно, что можно сделать хоть что-то для улучшения отношений с [Concept('human','людьми')|E], хотя он и намеревается положиться на Фенареля Суледина, если до этого всё же дойдёт.\n\n#!#bold Смогут ли усилия Хассандриэля как принца Долов сохранить жизни его народа? Ждёт ли [Concept('elves','эльфов')|E] ужасная судьба в ближайшие годы, или же им хватит ума и ресурсов, чтобы переждать надвигающуюся бурю?"
 bookmark_hassandriel_subheading: "Владыка Халамширала"

 game_concept_story_content_hassandriel: "$game_concept_story_generic_prefix$ $bm_fall_of_the_dales$"
 game_concept_story_content_hassandriel_desc: "#tooltip_heading Стиль истории: обширный#!\n\nИграя за Хассандриэля Ралаферина, вы столкнётесь со множеством дилемм, если хотите избежать участи стать последним принцем Долов. Чем вы готовы пожертвовать, чтобы сохранить державу эльфов? Готовы ли вы переступить через свои моральные принципы и прибегнуть к магии крови? А пожертвовать своей верой или даже независимостью ради спасения Долов? В какой момент уступки превращаются в капитуляцию? Но что бы вы ни решили, эльфов Долов ждут тяжёлые времена.\n\n$game_concept_story_generic_desc_boilerplate$"

 bookmark_pale_demon:0 "Лорд Фенарель"
 bookmark_pale_demon_desc:0 "Фенарель — известный [mage|El], испытывающий лютую ненависть к орлесианцам. Он готов любой ценой защищать культуру и веру своего народа от любых угроз, даже от них самих. С ростом враждебности между его сородичами и Орлесианской империей Фенарель слишком хорошо понимает, что неизбежно должно произойти. Когда придёт время действий, вряд ли он останется в стороне. Орлесианцы знают Фенареля как «Бледного демона» за то, насколько искусно он владеет своей [Concept('dataw_magic','магией')|E] в бою и как легко он внушает страх своим врагам.\n\n#!#bold Сможет ли Бледный демон гарантировать, что его народ переживёт грядущую бурю?"
 bookmark_pale_demon_subheading: "Бледный демон"
 
 bookmark_ulstor_wolfhand:0 "Конунг Ульстор"
 bookmark_ulstor_wolfhand_desc:0 "[Concept( 'story_content_ulstor', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_ulstor', '$bm_story_content_available_copy|q$' )|E]\n#!Мало кто способен противостоять мощи Ульстора Волчьей Лапы, правящего землями Эджхолла. Настоящее чудовище в [Concept( 'battle', 'битве' )|El], он внушает страх любому, кому не повезёт сойтись с этим гигантом на поле боя. До Ульстора дошли слухи, что Каэдмон из Денерима провозгласил себя первым «королём Ферелдена» — шаг, который сам Волчья Лапа считает смехотворным. Теперь, когда кто-то открыто заявил о намерении объединить весь Ферелден, Ульстор убеждён, что возглавить такое объединение должен именно он. Да, могучий авварский воитель решил, что именно он объединит весь Ферелден под своей властью.\n\n#!#bold Сможет ли Волчья Лапа стать истинным королём, объединив весь Ферелден, или же Каэдмону улыбнётся удача и он одолеет могучего воина?"
 bookmark_ulstor_wolfhand_subheading: "Волк нагорий"

 game_concept_story_content_ulstor: "$game_concept_story_generic_prefix$ $bm_fall_of_the_dales$"
 game_concept_story_content_ulstor_desc: "#tooltip_heading Стиль истории: обширный#!\n\nИграя за Ульстора, вы измените судьбу авваров в западных землях. Каждый клан — Солнечного Волка, Небесной Гончей и Мудрого Ветра — по-своему повлиял на молодого человека, и вам предстоит выбрать, какой из них вам ближе всего. Примете ли вы клан Солнечного Волка как родню и устремитесь к завоеванию всех авварских земель под единой короной? Присоединитесь ли вы к Небесной Гончей, чтобы опустошать низины андрастианцев? Или же внемлите слову Мудрого Ветра и выкуете стойкую и уникальную идентичность для авваров Эджхолла?\n\n$game_concept_story_generic_desc_boilerplate$"
 
 bookmark_aerona:0 "Риайн Аэрона"
 bookmark_aerona_desc:0 "Слишком долго хасинды были раздроблены и лишены единого лидера — Аэрона видела это своими глазами. Молодая и способная на великие дела женщина решила взять на себя бремя объединения хасиндов в единую силу, которой стоит опасаться всему миру. Но прежде чем воплотить свою мечту в жизнь, ей предстоит справиться с теми, кто попытается её остановить. И хотя лишь один из её сородичей способен по-настоящему сорвать её планы, ей всё равно придётся иметь с ним дело, ведь он проявил себя как жестокий и беспощадный вождь.\n\n#!#bold Аэрона возложила на себя монументальную ношу, но сможет ли она претворить эту мечту в реальность?"
 bookmark_aerona_subheading: "Мать ветров"

 bookmark_drakon_ii:0 "Император Кордиллус II"
 bookmark_drakon_ii_desc:0 "[Concept( 'story_content_kordillus', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_kordillus', '$bm_story_content_available_copy|q$' )|E]\n#!В отличие от своего отца, Кордиллус II не сумел предотвратить уничтожение целых деревень ордами [Concept('darkspawn','порождений тьмы')|E] во время Второго [Concept('blight','Мора')|E]. Из-за этого было утеряно множество жизней, а страна отчаянно нуждается в восстановлении.\n\nМногие утверждают, что сыну никогда не добиться успехов отца, а некоторые и вовсе желают лишить императора власти из-за его промахов. Несмотря на свои неудачи, престарелый монарх вынужден как-то справляться с растущей враждебностью между его народом и [Concept('elves','эльфами')|E] Долов.\n#!\n#bold Сможет ли Кордиллус Дракон II заявить о себе как о достойном правителе? Или же продолжит оставаться главным разочарованием для своей династии?"
 bookmark_drakon_ii_subheading: "Император Орлея"

 game_concept_story_content_kordillus: "$game_concept_story_generic_prefix$ $bm_fall_of_the_dales$"
 game_concept_story_content_kordillus_desc: "#tooltip_heading Стиль истории: умеренный#!\n\nХотя ваше время и подходит к концу, Орлесианская Империя всё ещё молода. Ей суждено стать новой доминирующей державой [Concept('thedas','Тедаса')|E], сменив находящийся в упадке Тевинтер в качестве главной силы континента. Однако молодость несёт с собой и неопределённость, а последнее испытание перед истинным величием уже не за горами. Растёт напряжённость в отношениях как с остроухими язычниками Долов, так и с марешуанскими сепаратистами запада, а вы стоите во главе Империи, построенной вашим отцом Кордиллусом — основателем Орлесианской Церкви и самого Орлея, а также великим победителем Второго [Concept('blight','Мора')|E]. Выстоит ли его империя перед грядущей бурей, чтобы вознестись над всеми остальными, или падёт? Решать только вам.\n\n$game_concept_story_generic_desc_boilerplate$"

 bookmark_roux:0 "Герцог Ру"
 bookmark_roux_desc:0 "[Concept( 'story_content_roux', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_roux', '$bm_story_content_available_copy|q$' )|E]\nМногие устали страдать под пятой орлесианцев, и потому в регионе разгорелось восстание. Провозглашение лорда Маршетта Королём Болот было дерзким шагом — тем самым, что вылился в обвинение в государственной измене со стороны императора Орлея.\n\nКонфликт кажется неизбежным, и свежеизбранный король болот столкнётся с испытаниями, о которых прежде даже не задумывался. Однако начали ходить слухи, что Долы также создают проблемы для Орлея — достаточные для того, чтобы в итоге вспыхнула [Concept('war','война')|E]. Если новый король умело воспользуется моментом, у его народа вполне может появиться шанс на успех восстания.\n\n#!#bold Поднять мятеж — опасный выбор, ведь здесь нет права на ошибку. Одержит ли Король Болот победу в своей борьбе за независимость или же окажется побеждён могущественной Орлесианской Империей?"
 bookmark_roux_subheading: "Король\nболот"

 game_concept_story_content_roux: "$game_concept_story_generic_prefix$ $bm_fall_of_the_dales$"
 game_concept_story_content_roux_desc: "#tooltip_heading Стиль истории: обширный#!\n\nИграя за Ру Маршетта, вы столкнётесь со множеством сложных дилемм: попытаетесь ли вы наконец добиться независимости от Вал Руайо или же останетесь верны и нарастите своё влияние в качестве вассала Империи? Вернётесь ли вы к древним цирианским путям, адаптировав их для новой эры, или же попытаетесь выковать собственную легенду, обособленную от свершений прошлого? Что бы вы ни выбрали, марешуанцы Нахашина жаждут свободы посреди этой смуты и ждут, чью сторону вы займёте.\n\n$game_concept_story_generic_desc_boilerplate$"

 bookmark_caedmon:0 "Тейрн Каэдмон"
 bookmark_caedmon_desc:0 "[Concept( 'story_content_caedmon', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_caedmon', '$bm_story_content_available_copy|q$' )|E]\n#!Ферелден мало изменился после Второго [Concept('blight','Мора')|E]: каждое из племён местных эрлов и тэйрнов следовало по стопам своих предков, продолжая кровавые завоевания. Каэдмон взрослел, слушая сказания о своём деде — первом человеке, ставшем тэйрном, — и это лишь разжигало амбиции в его сердце. После смерти отца сын поклялся объединить эти земли и начал с того, что провозгласил себя королём.\n\nНа самом же деле Каэдмон не мог стать королём с помощью одних лишь слов. Никто не воспринял бы его заявление всерьёз, ведь в Ферелдене признавали лишь язык силы, который чётко указывал новоявленному монарху путь... развязать [Concept('war','войну')|E], подобно своим предкам, и объединить весь Ферелден мечом и огнём.\n\n#!#bold Амбиции Каэдмона велики, но хватит ли ему полководческого ума и мастерства, чтобы воплотить их в жизнь? Или будущему королю так и не удастся сплотить свой народ?"
 bookmark_caedmon_subheading: "Будущий король"

 game_concept_story_content_caedmon: "$game_concept_story_generic_prefix$ $bm_fall_of_the_dales$"
 game_concept_story_content_caedmon_desc: "#tooltip_heading Стиль истории: умеренный:#!\n\nИграя за Каэдмона, вы окажетесь в самом центре неукротимых амбиций — мечты о Ферелдене, объединённом под властью одного короля и одной веры. Как вы поступите с поддержкой Орлея на западе, заставляющей вас принять их Песнь? Как справитесь со множеством правителей, выступивших против ваших мечтаний о королевском венце?\n\n$game_concept_story_generic_desc_boilerplate$"

## [war|E] of the Dog Lords
 bm_war_of_the_dog_lords: "[war|E] пёсьих лордов"
 bm_war_of_the_dog_lords_desc: "Тэйрн Каэдмон провозгласил себя королём, и весть об этом подобно лесному пожару разнеслась по всему Ферелдену. Никому не удастся избежать грядущего конфликта, и лишь обладающие достаточной волей получат шанс выжить. Те же, кто стремится к большей власти, должны быть готовы рисковать и жертвовать всем, что им дорого. Подобно своим предкам, пёсьи лорды развяжут [Concept('war','войну')|E], чтобы подняться на новые высоты. И вновь земли Ферелдена окропятся кровью.\n\n#!#bold Храбрость и сила — обычное дело для Ферелдена, но хватит ли их, чтобы сплотить эти земли? Придётся ли использовать обман и удары в спину, чтобы возвести на престол первого короля?"

 bookmark_myrddin:0 "Эрл Мирддин из Амарантайна"
 bookmark_myrddin_desc:0 "Весть о самопровозглашённом короле Ферелдена разнеслась подобно лесному пожару, и всем ясно, что вскоре на этих землях прольётся кровь. Таков путь Ферелдена: кровь течёт рекой, сильные выживают, а слабые погибают. Мирддин уже давно правит своим эрлством и повидал немало взлётов и падений всяких выскочек. Несмотря ни на что, он остаётся непреклонен в своём контроле над эрлством. Так почему бы и ему не попытаться завоевать ещё большую славу и власть? Почему бы роду Кормаков не принять участие в борьбе за Ферелден?\n\n#!#bold Возвысятся ли Мирддин и его род из эрлов в тэйрны? Суждено ли роду Кормаков лишить Каэдмона притязаний на весь Ферелден?"

 bookmark_trefir:0 "Эрл Трефир из Редклиффа"
 bookmark_trefir_desc:0 "С ранних лет Трефир понимал, что Ферелден живёт конфликтами. Чтобы выжить, нужно быть сильным телом, однако правитель также обязан быть мудрым. Тэйрн Каэдмон объявил о намерении стать первым королём Ферелдена, а Волчья Лапа из Эджхолла рыщет подле западных границ, так что эрл должен действовать быстро. Потребуется осторожный подход, чтобы процветать посреди хаоса ближайших недель и месяцев, не говоря уже о том, чтобы просто сохранить род Герринов. Имея двух молодых сыновей, Трефир сражается уже не ради личных амбиций, а ради светлого будущего для своих любимых детей и жены.\n\n#!#bold Сможет ли эрл Редклиффа выжить в кровавых распрях, что неизбежно последуют за тэйрном Каэдмоном, и обеспечить процветание своей семьи на долгие годы? Или же Трефир поддастся зову амбиций, рискнув всем ради власти?"

 bookmark_arryn:0 "Комес Аррин из западного леса Бресилиан"
 bookmark_arryn_desc:0 "С самого детства Аррин был заворожён историей своего народа. Мысль о том, что могущественный Тевинтерский Империум когда-то властвовал над всем [Concept('thedas','Тедасом')|E], и по сей день вдохновляет юношу. Он надеется, что когда-нибудь вернёт Тевинтеру былое величие, отвоевав обратно земли Ферелдена и Орлея. Аррин прекрасно понимает, что мечта покорить весь [thedas|E] может и не исполниться при его жизни, однако, оказавшись в Бресилианском лесу после перехода через [Concept('eluvian','элувиан')|E] в попытке сбежать с родины, он убедил себя в том, что завоевать Ферелден от имени Тевинтерского Империума — это действительно его судьба.\n\n#!#bold Аррин — само воплощение амбициозности, и он не позволит ничему встать на пути к своим целям. Хватит ли этому ничтожному тевинтерскому отступнику сил, чтобы претворить свои планы в жизнь?"

 bookmark_velcorminth:0 "Аргилвид Велкорминт из Нотнака"
 bookmark_velcorminth_desc:0 "Велкорминт родился на окраине Диких земель Коркари, и жизнь его была тяжела. Потеряв родителей в юном возрасте, он слишком рано осознал всю жестокость этого мира. Взрослея, молодой воин узнал, что значит быть сильным лидером, способным на многое на поле боя. К несчастью, этот путь привёл и к тому, что Велкорминт с трудом понимал базовые человеческие эмоции, став слишком холодным и беспощадным. Убийство собственной семьи стало для него лишь способом избавиться от возможных осложнений.\n\n#!#bold Велкорминт не намеревается безучастно наблюдать за грядущими конфликтами. Увенчаются ли успехом его завоевания, и объединится ли Ферелден под началом хасиндов?"

 bookmark_alaric:0 "Эрл Аларик из Гварена"
 bookmark_alaric_desc:0 "После известия о недавней кончине своего отца эрл Аларик взошёл на престол эрлства Гварен. Многие банны тэйрнира замерли в ожидании, желая увидеть, каким же государём проявит себя Аларик. Принимая управление землями отца, Аларик намеревается сделать так, чтобы его семью боялись и уважали в землях Гварена... а возможно, и за их пределами.\n\n#!#bold Недавно ставший правителем Аларик оказался на распутье. Примет ли он вызов и покорит ли Ферелден? Или же поддастся тем же глупостям, что и его покойный отец, и останется в истории всего лишь ещё одним пёсьим лордом?"

### Waning of the Sun

 bm_waning_of_the_sun: "Waning of the Sun"
 bm_waning_of_the_sun_desc: "Much continues to occur within [thedas|E] in the wake of the Second [blight|E], especially for the Orlesian Empire. Orlais continues to see increasing hostility with the Dales, and now a King in the Marshes reveals himself in a declaration of independence with many supporters. Were that not enough drama, the Grand Game continues to prove a dangerous one indeed. From the grandest of Dukes to the lowliest of Comtes, political schemes run rampant within the Empire, and everyone has something to gain.\n\n#!#bold Orlais stands on the brink of destruction if they cannot rally together to deal with emerging threats. Will this prestigious Empire survive the events to come?"

 bookmark_umbert:0 "Marquis Umbert of Chevin"
 bookmark_umbert_desc:0 "Like his father, and his father before him, Umbert has held the lands of Chevin in honor of his house. Unfortunately, the [maker|E] has yet to bless this Marquis with a spouse. As a result of such a lack of companionship at his age, the line of house Montlaures could be in jeopardy should tragedy occur for either of the Montlaures brothers. Perhaps the [maker|E] will choose to grace Umbert with a partner that can preserve his line. Even should the [maker|E] not bless him, there is plenty more to do within the Grand Game.\n\n#!#bold Will an heir be born for house Montlaures, or will the line die with the two brothers?"

 bookmark_evram:0 "Marquis Evram of Jader"
 bookmark_evram_desc:0 "House Doucy has held Jader for as long as it has stood between Ferelden and the rest of Orlais. Aside from keeping his eyes open for a potential spouse to ensure his bloodline endures, the Marquis must also be ready for the potential [war|E] with the Dales, as well as the Grand Game encouraging political scheming between his peers. Due to Jader being on the Orlesian border, little is to be feared when it comes to the Grand Game itself, but should Orlais become weakened by the Dales or the King in the Marshes, Evram may not be able to rely on the Empire’s aid should the barbarians of Ferelden come knocking.\n\n#!#bold Jader will be a prime target of the barbarians of Ferelden should Orlais by the coming troubles. Can Evram ensure that his lands are ready for whatever is to come?"

 bookmark_foisine:0 "Marquise Foisine of Chalons"
 bookmark_foisine_desc:0 "Having survived the Great Game for this long, and living long enough to be middle aged, Foisine and her husband have provided a strong bloodline to ensure that House Chalons thrives after they both part from this world. With her lands bordering the Dales, and with known hostility emerging, the Marquise must prepare her people for what could be a future [war|E] with the Dales. She is not particularly fond of [elves|E], but if [war|E] should arise, then her family will be far too close to the frontline for her liking. Regardless of what happens with the Dales, it is unlikely that House Chalons can avoid being involved.\n\n#!#bold Can House Chalons survive potential warfare with the Dales? Can [war|E] be avoided altogether?"

 bookmark_frederic:0 "Marquis Frederic of Ghislain"
 bookmark_frederic_desc:0 "A prominent noble in the Great Game, Frederic knows the ins and outs of how to handle all matters of diplomacy and intrigue, making him a considerable threat or ally in any court. As a reward for his skills, he was chosen over his older brother to succeed his father due to the political incompetence of his eldest sibling. Having had two children with his lovely wife, the Marquis has much to gain in his current position, but even more to lose should the King in the Marshes be successful. Being on the outskirts of the marshes makes Frederic nervous, especially as news of a potential [war|E] with the Dales passes through the imperial court.\n\n#!#bold Can the Marquis sabotage the King in the Marshes declaration of independence? Would he consider aligning himself with Roux against the Emperor of Orlais?"

 bookmark_vincent:0 "Marquis Vincent of Lydes"
 bookmark_vincent_desc:0 "Growing up with several siblings tends to leave one challenged in their household at an early age. Vincent was no exception, but such a competitive upbringing served the man well. After taking over the lands of his ancestors, it has become apparent that the Marquis tends to favor diplomacy and the blade in equal measure. As a [knight|E] of the Orlesian Empire, it is his duty to protect his beloved homeland from any and all threats, be that with word or blade. While he recalls the pleading from his courtiers and advisors to seek a spouse in the back of his mind, he must also contend with the possibility of [war|E] with the Dales. A [war|E] that would see his lands covered in both elvish and human blood.\n\n#!#bold Will the words of a diplomat serve the Orlesian Empire better than the protection of a [knight|E]?"

 bookmark_cyril:0 "Comte Cyril of Vauton"
 bookmark_cyril_desc:0 "[Concept( 'story_content_cyril', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_cyril', '$bm_story_content_available_copy|q$' )|E]\nGrandson to the current Emperor of Orlais, much is expected from Cyril of house Drakon, despite not being the heir. Ever since he was just a boy, Cyril has been trained by the finest Orlesian knights, and has taken well to becoming quite the military leader. Yet [war|E] looms on the horizon, with two vastly different foes to speak of. On one side, the Dales, who's neutrality grows thinner every day. On the other side, Roux Marchette, who seems intent on leading his fellow marsh-dwellers against the Orlesian empire to secure independence.\n\n#!#bold Eager to prove himself, Cyril takes up his sword for the Empire. Will he be able to lead the armies of Orlais to victory?"

 game_concept_story_content_cyril: "$game_concept_story_generic_prefix$ $bm_fall_of_the_dales$"
 game_concept_story_content_cyril_desc: "#tooltip_heading Story Style: Light#!\n\nAs Cyril, grandson of the Emperor and brother to the future Empress Jeaneve, you will stand as the loyal sword of the Empire against both heathen [elves|E] and rebelling Nahashin. Destined to die in a duel against the King of the Marshes for a chance, once and for all, to end the rebellion right then and there, will you manage to defy fate and claim your due glory?\n\n$game_concept_story_generic_desc_boilerplate$"

 bookmark_hedinelle:0 "Comtesse Hedinelle of Morreau"
 bookmark_hedinelle_desc:0 "The blood of the otherwise extinct House Simmard lives on in the veins of the Morreau. While Marquis Percivale Aurelien may now reign over Montsimmard through marriage ties to the old House, the Morreau consider themselves, a cadet branch of the dynasty, the rightful heirs. Montsimmard has been beset by a great many ills: Darkspawn predation, Elven neglect, and now the undue reign of Percivale. Hedinelle will create a world where the Morreau may gain their rightful stewardship of Montsimmard, even if she does not live to see it, through her grandson, Jean.\n\n#!#bold Can the Morreau restore House Simmard? Will Montsimmard reclaim its grandeur and its rulers?"

 bookmark_ronan:0 "Yurl Ronan of Logerswold"
 bookmark_ronan_desc:0 "With the death of his father Judoc, Ronan was thrown into the role of Yurl at only eighteen. Despite his lack of magic, Ronan has grown throughout his rule into a valorous warrior and strategist. Yet many dangers come to the Brecilians, threatening their blissful isolation. Gwaren and Stenhold covet the Passage. One of the old tevinter oppressors has taken over one of the tribes, and rumours tell of a great war to the west, with a strange people similar to the one of old legends. Ronan understands that the Brecilians will not survive the coming days divided. Someone needs to unite them all, and by the Lady of the Forest, Ronan will. \n\n#!#bold Historically, the Brecilians were confused with the Claynes by the Dalish, and were massacred and forgotten by Thedas. Can Ronan save his people from extinction?"



















 bm_group_blessed:0 "Blessed Age"
 start_year_1299_01_01_desc:0 "The start of the Glory Age is filled with impactful events and great character that shaped the History of [thedas|E] for Ages to come.\nThe infamous [exalted_march|E] on the Dales that sent the elves into their never ending exile, the Rebellion of the king of the Marshes, as well as the Campaigns of the King of Starkhaven… Multiple events await you in the Glory Age, be they to be followed, changed, or accompanied by an event of your own making."
