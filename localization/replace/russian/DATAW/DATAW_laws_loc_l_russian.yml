 council_elective_succession_law_effects: "[ruler|E] и все [de_jure|E] [Concept('vassals','вассалы')|E] могут предложить кандидатуру [Concept('title_heir','наследника титула')|E] из числа членов [Concept('dynasty','династии')|E] правителя и любых доступных [Concept('claimants','претендентов')|E]. При этом [Concept('succession_law','законе наследования')|E] [Concept('voting_power','сила голоса')|E] зависит от размера [Concept('domain','домена')|E] [Concept('elector','выборщика')|E]. Кроме того, на неё влияют [county_development|E] и [county_opinion|E] в [Concept('capital','столице')|E]. Вассалы обычно предпочитают более старых кандидатов молодым."
 council_elective_candidates: "Претенденты и члены династии"
 council_elective_candidates_tooltip: "Следующие персонажи имеют законное право на участие в выборах советом:\n$EFFECT_LIST_BULLET$Члены правящей [Concept('dynasty','династии')|E], не претендующие на наследование [Concept('theocracy','теократии')|E] или [Concept('republic','республики')|E]\n$EFFECT_LIST_BULLET$[Concept('claimant','Претенденты')|E] на титул, не претендующие на наследование [Concept('theocracy','теократии')|E] или [Concept('republic','республики')|E]."
 council_elective_electors: "Все де-юре вассалы"
 council_elective_electors_tooltip: "Право называться [Concept('elector','выборщиком')|E] на выборах советом имеет вассал, отвечающий всем следующим критериям:\n$EFFECT_LIST_BULLET$Быть [de_jure|E] вассалом титула\n$EFFECT_LIST_BULLET$Быть прямым вассалом титула\n$EFFECT_LIST_BULLET$Достичь совершеннолетия\n$EFFECT_LIST_BULLET$Не быть недееспособным"
