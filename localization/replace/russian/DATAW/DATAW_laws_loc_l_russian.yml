 DATAW_orlesian_elective_candidates: "Претенденты, близкие родственники и члены династии"
 DATAW_orlesian_elective_candidates_tooltip: "Следующие [Concept('character','персонажи')|E] имеют законное право на участие в орлесианских выборах:\n$EFFECT_LIST_BULLET$[Concept('legitimate','Законнорождённые')|E] [Concept('close_family','близкие родственники')|E] текущего [Concept('ruler','правителя')|E], не претендующие на наследование [Concept('theocracy','теократии')|E] или [Concept('republic','республики')|E]. [Concept('children','Дети')|E] кандидата не могут участвовать в выборах в качестве кандидатов.\n$EFFECT_LIST_BULLET$[Concept('claimant','Претенденты')|E] на титул, не претендующие на наследование [Concept('theocracy','теократии')|E] или [Concept('republic','республики')|E]\n$EFFECT_LIST_BULLET$[Concept('legitimate','Законнорождённые')|E] члены [Concept('dynasty','династии')|E] [Concept('ruler','правителя')|E], не претендующие на наследование [Concept('theocracy','теократии')|E] или [Concept('republic','республики')|E]"
 DATAW_orlesian_elective_electors: "Император, влиятельные вассалы и землевладельцы из семьи"
 DATAW_orlesian_elective_electors_tooltip: "Право называться [Concept('elector','выборщиком')|E] на орлесианских выборах имеет вассал, отвечающий всем следующим критериям:\n$EFFECT_LIST_BULLET$Быть [de_jure|E] вассалом [Concept('title','титула')|E]\n$EFFECT_LIST_BULLET$Быть [Concept('powerful_vassal','влиятельным вассалом')|E] [Concept('title','титула')|E]\n$EFFECT_LIST_BULLET$Быть лишь на один или два [Concept('rank','ранга')|E] ниже [Concept('title','титула')|E]\n$EFFECT_LIST_BULLET$Либо быть [Concept('landed','землевладельцем')|E] из [Concept('family','семьи')|E] [Concept('ruler','правителя')|E]\n$EFFECT_LIST_BULLET$Либо, если создан Совет герольдов, владеть одним из наследственных [Concept('titles','титулов')|E] его членов "

