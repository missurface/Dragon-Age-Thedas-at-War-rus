 gwaren_trade_influx_county_modifier: "Приток торговцев"
 gwaren_trade_influx_county_modifier_desc: "По мере того как распространяются слухи о безопасном проходе в Гварен, в город устремляются торговцы, принося долгожданное процветание после стольких десятилетий лишений."
 gwaren_safe_passage_modifier: "Безопасный проход"
 gwaren_safe_passage_modifier_desc: "После покорения Бресилианского прохода иноземными силами была проведена значительная работа, чтобы сделать этот ранее опасный путь приемлемым для путешественников."
 brecilian_barbarian_resistance_modifier: "Сопротивление варваров"
 brecilian_barbarian_resistance_modifier_desc: "Хотя многие теперь считают Бресилианский лес укрощённым и входящим в состав Гварена, местные жители отвергают эти притязания как совершенно незаконные и при любой возможности нападают на солдат Гварена, отправленных на их усмирение."

