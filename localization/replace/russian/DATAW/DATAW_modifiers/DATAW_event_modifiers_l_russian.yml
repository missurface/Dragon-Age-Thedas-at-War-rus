 ### Rebuilding Val Royeaux Events
 #DECISION MODIFIERS
 DATAW_val_royeaux_being_rebuilt_modifier: "Восстановление Вал Руайо"
 DATAW_val_royeaux_being_rebuilt_modifier_desc: "В будущее Вал Руайо вложены значительные средства, призванные вернуть сожжённому городу былую славу."
 
 # EVENT 1 MODIFIERS
 DATAW_large_investment_in_val_royeaux_modifier: "Крупные вложения в восстановление"
 DATAW_large_investment_in_val_royeaux_modifier_desc: "Крупные вложения в городские строительные проекты и производство привлекли в Вал Руайо рабочих и дали начало новым начинаниям, оживив город после разрушительного разграбления.\n\n"
 DATAW_modest_investment_in_val_royeaux_modifier: "Умеренные вложения в восстановление"
 DATAW_modest_investment_in_val_royeaux_modifier_desc: "Умеренные вложения в городские строительные проекты и производство привлекли в Вал Руайо рабочих и дали начало новым начинаниям, оживив город после разрушительного разграбления.\n\n"
 DATAW_small_investment_in_val_royeaux_modifier: "Небольшие вложения в восстановление"
 DATAW_small_investment_in_val_royeaux_modifier_desc: "Небольшие вложения в городские строительные проекты и производство привлекли в Вал Руайо рабочих и дали начало новым начинаниям, оживив город после разрушительного разграбления.\n\n"

 # EVENT 2 MODIFIERS
 DATAW_successful_large_house_building_program_county_modifier: "Масштабная жилищная программа"
 DATAW_successful_large_house_building_program_county_modifier_desc: "Благодаря весьма щедрому пожертвованию сюзерена началось масштабное строительство жилья, радующее жителей и прибывающих работников.\n\n"
 DATAW_successful_large_house_building_program_character_modifier: "Масштабная жилищная программа"
 DATAW_successful_large_house_building_program_character_modifier_desc: "Благодаря весьма щедрому пожертвованию сюзерена началось масштабное строительство жилья, радующее жителей и прибывающих работников.\n\n"
 DATAW_unsuccessful_large_house_building_program_county_modifier: "Масштабная коррупция в жилищном строительстве"
 DATAW_unsuccessful_large_house_building_program_county_modifier_desc: "Щедрые средства, выделенные короной на жильё, растрачены на множество фиктивных проектов. Вкладчики присвоили деньги, а простой народ по-прежнему не может обрести крышу над головой, что вызывает всё больше недовольства.\n\n"
 DATAW_unsuccessful_large_house_building_program_character_modifier: "Масштабная коррупция в жилищном строительстве"
 DATAW_unsuccessful_large_house_building_program_character_modifier_desc: "Щедрые средства, выделенные короной на жильё, растрачены на множество фиктивных проектов. Вкладчики присвоили деньги, а простой народ по-прежнему не может обрести крышу над головой, что вызывает всё больше недовольства.\n\n"
 DATAW_successful_modest_house_building_program_county_modifier: "Умеренная жилищная программа"
 DATAW_successful_modest_house_building_program_county_modifier_desc: "Благодаря пожертвованию сюзерена началось строительство значительного количества жилья, радующее жителей и прибывающих работников.\n\n"
 DATAW_successful_modest_house_building_program_character_modifier: "Умеренная жилищная программа"
 DATAW_successful_modest_house_building_program_character_modifier_desc: "Благодаря пожертвованию сюзерена началось строительство значительного количества жилья, радующее жителей и прибывающих работников.\n\n"
 DATAW_unsuccessful_modest_house_building_program_county_modifier: "Умеренная коррупция в жилищном строительстве"
 DATAW_unsuccessful_modest_house_building_program_county_modifier_desc: "Умеренные средства, выделенные короной на жильё, растрачены на несколько фиктивных проектов. Вкладчики присвоили деньги, а простой народ по-прежнему не может обрести крышу над головой, что вызывает недовольство.\n\n"
 DATAW_unsuccessful_modest_house_building_program_character_modifier: "Умеренная коррупция в жилищном строительстве"
 DATAW_unsuccessful_modest_house_building_program_character_modifier_desc: "Умеренные средства, выделенные короной на жильё, растрачены на несколько фиктивных проектов. Вкладчики присвоили деньги, а простой народ по-прежнему не может обрести крышу над головой, что вызывает недовольство.\n\n"
 DATAW_successful_token_house_building_program_county_modifier: "Символическая жилищная программа"
 DATAW_successful_token_house_building_program_county_modifier_desc: "Благодаря небольшому пожертвованию короны началось строительство нескольких домов, радующее жителей и прибывающих работников.\n\n"
 DATAW_successful_token_house_building_program_character_modifier: "Символическая жилищная программа"
 DATAW_successful_token_house_building_program_character_modifier_desc: "Благодаря небольшому пожертвованию короны началось строительство нескольких домов, радующее жителей и прибывающих работников.\n\n"
 DATAW_unsuccessful_token_house_building_program_county_modifier: "Мелкая коррупция в жилищном строительстве"
 DATAW_unsuccessful_token_house_building_program_county_modifier_desc: "Скудные средства, выделенные короной на жильё, растрачены на фиктивные проекты. Вкладчики присвоили деньги, а простой народ по-прежнему не может обрести крышу над головой, что вызывает недовольство.\n\n"
 DATAW_unsuccessful_token_house_building_program_character_modifier: "Мелкая коррупция в жилищном строительстве"
 DATAW_unsuccessful_token_house_building_program_character_modifier_desc: "Скудные средства, выделенные короной на жильё, растрачены на фиктивные проекты. Вкладчики присвоили деньги, а простой народ по-прежнему не может обрести крышу над головой, что вызывает недовольство.\n\n"
 DATAW_disregard_for_peasants_modifier: "Пренебрежение крестьянами"
 DATAW_disregard_for_peasants_modifier_desc: "Вопиющее пренебрежение знати к простому народу в сочетании с изнурительными налогами заставило людей разочароваться в восстановлении города.\n\n"

 # EVENT 3 MODIFIERS
 DATAW_patron_of_the_most_holy_modifier: "Покровительство Верховной Жрице"
 DATAW_vocal_chantry_support_county_modifier: "Решительная поддержка Церкви"
 DATAW_vocal_chantry_support_county_modifier_desc: "Поддержка андрастианского духовенства и её Высокопреосвященства вновь пробудила в городе рвение к восстановлению.\n\n"
 DATAW_vocal_chantry_support_character_modifier: "Решительная поддержка Церкви"
 DATAW_vocal_chantry_support_character_modifier_desc: "Поддержка андрастианского духовенства и её Высокопреосвященства вновь пробудила в городе рвение к восстановлению.\n\n"
 DATAW_moderate_chantry_support_county_modifier: "Умеренная поддержка Церкви"
 DATAW_moderate_chantry_support_county_modifier_desc: "После умеренных вложений короны в восстановление Церкви андрастианское духовенство провозгласило поддержку восстановления города, воодушевив самых ревностных верующих.\n\n"
 DATAW_moderate_chantry_support_character_modifier: "Умеренная поддержка Церкви"
 DATAW_moderate_chantry_support_character_modifier_desc: "После умеренных вложений короны в восстановление Церкви андрастианское духовенство провозгласило поддержку восстановления города, воодушевив самых ревностных верующих.\n\n"
 DATAW_chantry_opposition_modifier: "Противодействие Церкви"
 DATAW_chantry_opposition_modifier_desc: "Отказ финансировать Церковь во время восстановления Вал Руайо заставил духовенство препятствовать этому персонажу на каждом шагу.\n\n"
 DATAW_convert_quidam_ruler_county_modifier: "Обращение правителя-иноверца"
 DATAW_convert_quidam_ruler_county_modifier_desc: "Обращение правителя-язычника заметно подняло дух простого народа.\n\n"
 DATAW_convert_quidam_ruler_character_modifier: "Обращение правителя-иноверца"
 DATAW_convert_quidam_ruler_character_modifier_desc: "Обращение правителя-язычника заметно подняло дух простого народа.\n\n"

 # EVENT 4 MODIFIERS
 DATAW_reinvigorated_docks_modifier: "Оживлённые доки"
 DATAW_reinvigorated_docks_modifier_desc: "Имперские деньги возродили квартал Ке-Руайо, вернули в город торговлю и строительство и вновь полноценно связали его с остальным Тедасом.\n\n"
 DATAW_slow_rebuilding_of_docks_modifier: "Медленное восстановление доков"
 DATAW_slow_rebuilding_of_docks_modifier_desc: "Небольшие вложения имперской казны позволили постепенно восстановить квартал Ке-Руайо, вернули в город торговлю и строительство и вновь связали его с остальным Тедасом.\n\n"
 DATAW_val_royeaux_docks_smugglers_modifier: "Процветающая контрабанда"
 DATAW_val_royeaux_docks_smugglers_modifier_desc: "Новые налоги на купечество, введённые ради восстановления города, привели к расцвету контрабанды среди тех, кто пытается уклониться от выплат.\n\n"

