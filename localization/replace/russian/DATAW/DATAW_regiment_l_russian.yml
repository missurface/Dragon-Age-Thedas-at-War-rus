 #MaA Descriptions
 orlesian_lancers_flavor:0 "#F Unrivalled across all Thedas, these noble cavalry are the vanguard of Orlesian military dominance. Before their thunderous charge, foes scatter and armies shatter.#!"
 miadahlen_flavor:0 "The Mi'adahlen, or the Wood's Blade to the non-elvhen, were formed in the Dales' early days as a numerous guard to protect the nation from crime, incursions and more. Despite a permissive standard of training, they are expected to be battle ready at all times."
 chevaliers_flavor:0 "#F With their recognizable yellow feathers on top of their helms, the Chevaliers are both the pride of Orlais’ military and great players of the Game. Their lavish lifestyle is always lessened somewhat when war comes, for they always know the importance of honour and duty.#!"
 emerald_knights_flavor:0 "#F Accompanied by their loyal wolves, these highly trained warriors are prepared to give their lives defending the borders of the Dales.#!"
 reterai_flavor:0 "#F Born to ride amidst the highlands of the Blasted Hills, the Reterai have been trained to ride and fight, using the uneven terrain of the Hauterin homeland to devastating effect.#"
 fleches_de_deauvin_flavor:0 "#F The Flèches de Deauvin, masters of the bow and the horse, to the point they can master both at the same time. They follow in Marquis Étienne’s footsteps, and rain hellfire on their foes with grace."
 borassan_harillen_flavor:0 "#F The Bor'assan Harillen are the most devoted to Andruil, and out of the three ways of the hunter, they follow the Vir Bor'assan the most, finding strength and resilience in their flexibility."
 herthweru_flavor:0 "#F Deep in the fertile plains of the Bannorn, Banns and Freeholders alike maintain these steady spearmen to protect hearth and home. Their spears kill wolves, bandits, and even the occasional Darkspawn.#!"
 hobelar_flavor:0 "#F Fast and agile, Chasind Hobelars can easily raid the forest and hills other cavalry avoid."
 huscarl_flavor:0 "#F Alamarri Huscarls are masters of using shield walls to block incoming volleys of arrows."
 longbowmen_flavor:0 "#F Though they require a lifetime to properly master, the longbows of the Dalish are powerful enough to pierce plate and can loose at an almost-unequaled rate."
 warrior_skalds_flavor:0 "#F For these prized fighters, storytelling and history-keeping are just as important as the actual bloody business of slaying one's foe.#!"
 heliwr_flavor:0 "#F Lightly armoured and loosely organized, the Chasind are often underestimated. This delusion has led many a foolish warlord to enter the vast Korcari Wilds, never to be seen again.#!"
 war_mabari_flavor:0 "#F A Mabari, imprinted to his master and painted in protective Kaddis, is a terrifying opponent. When massed, pulling men from horseback and breaking lines of pike, they are awe-inspiring.#!"
 brecilian_hunters_flavor:0 "#F Through their long and arduous training to properly master their techniques, the hunters of the Brecilians are powerful enough to pierce plate and can loose at an almost-unequaled rate."
 sylvan_flavor:0 "#F They hide amongst their brethren. As immobile as the forest, they stalk their prey. Some call them monsters, others, demons, but one thing is true. If the sylvans reveal themselves, pray."
 marshlander_flavor:0 "#F Violent and efficient, if the marshes don't kill the enemy then the marshlanders will. While others slip and falter in the swamps, these folk know how to use the land to their advantage."
 field_cavaliers_flavor:0 "#F Taken from the finest of the finest, the Field Cavaliers are the most skilled of Ghislain. With their glorious armor, well-bred horses and unwavering honour, those forces represent the pride of the Chanvalois."
 children_of_jader_flavor:0 "#F Heavily armored units that have mastered the act of defending the harsh frontiers of the Orlesian empire. They are the strange love child of Orlesian and Fereldan practices, combined with the harsh lands of the Frostbacks."
 tribesmen_flavor:0 "#F When push comes to shove, the tribesmen of the Ciriane will fight to their last breath for every clod of mud they call home, and make sure a fleeing enemy knows never to return again."
 silent_walkers_flavor:0 "#F Stalking the hills and wastelands of northern Thedas during the Second Blight, these hidden warriors learnt the art of ambuscade from the Darkspawn, and turned it back against them. They remember it still."
 western_watchmen_flavor:0 "#F Once the masters of paradise, the Second Blight brought their home to ruin. Heavy clad and hard of heart, they turn vengeful hatred into martial mettle against any who stand in their way."
 southern_masters_flavor:0 "#F Wyverns in the Gamordan Peaks, Whales in the Sundered Sea, and mere survival between the Sulphur Lakes. These hunters have conquered them all with naught but a bow and a thick fur coat. Nothing mortal can scare them now."
 nomadic_warriors_flavor:0 "Trained in the ways of the Cendrerin, built by centuries of wandering and tribe skirmishes on the Sea of Ash, those nomadic warriors have learned to hide amongst the environment, slowly placing themselves until it is far too late to stop their offensive."


 game_concept_war_mabari:0 "War Mabari"
 game_concept_war_mabari_desc:0 "Dogs are an essential part of Fereldan culture, and no dog is more prized than the mabari. The breed is as old as myth, said to have been bred from the wolves who served Dane. Prized for their intelligence and loyalty, these dogs are more than mere weapons or status symbols: The hounds choose their masters, and pair with them for life. To be the master of a mabari anywhere in Ferelden is to be recognized instantly as a person of worth.\n\nThe mabari are an essential part of Fereldan military strategy. Trained hounds can easily pull knights from horseback or break lines of pikemen, and the sight and sound of a wave of war dogs, howling and snarling, has been known to cause panic among even the most hardened infantry soldiers."