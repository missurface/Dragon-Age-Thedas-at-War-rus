 #MaA Descriptions
 orlesian_lancers_flavor:0 "#F Непревзойдённая во всём Тедасе, эта благородная конница служит передовым отрядом орлесианского военного могущества. Перед её громовой атакой враги обращаются в бегство, а армии рушатся.#!"
 miadahlen_flavor:0 "Ми'адален, или Клинок Леса, — многочисленная стража, созданная на заре Долов для защиты страны от преступников, захватчиков и иных угроз. Несмотря на сравнительно мягкие требования к подготовке, её бойцы должны всегда быть готовы к сражению."
 chevaliers_flavor:0 "#F Шевалье с узнаваемыми жёлтыми перьями на шлемах — одновременно гордость орлесианской армии и искусные участники Великой игры. С началом войны их роскошная жизнь становится скромнее, ведь они никогда не забывают о чести и долге.#!"
 emerald_knights_flavor:0 "#F Эти прекрасно обученные воины в сопровождении верных волков готовы отдать жизнь за защиту рубежей Долов.#!"
 reterai_flavor:0 "#F Ретерай рождены для седла среди нагорий Выжженных холмов. Они учатся сражаться верхом и обращают неровный рельеф родных земель отеренов в смертоносное оружие.#"
 fleches_de_deauvin_flavor:0 "#F Стрелы Довина в равной мере владеют луком и седлом, а потому способны без труда соединять оба искусства. Следуя по стопам маркиза Этьена, они с изяществом обрушивают на врагов огненный дождь."
 borassan_harillen_flavor:0 "#F Бор'ассан хариллен преданы Андруил сильнее прочих и из трёх путей охотника прежде всего следуют Вир Бор'ассан, черпая силу и стойкость в своей гибкости."
 herthweru_flavor:0 "#F В глубине плодородных равнин Баннорна банны и свободные землевладельцы содержат этих стойких копейщиков для защиты очага и дома. Их копья разят волков, разбойников и даже редких порождений тьмы.#!"
 hobelar_flavor:0 "#F Леса и холмы — не помеха для быстрых и проворных хасиндских хобиларов, которые чувствуют себя свободно там, где большинство верховых не может ступить и шагу."
 huscarl_flavor:0 "#F Мастерски владея щитами, аламаррийские хускарлы способны укрыться даже от залпа вражеских стрел."
 longbowmen_flavor:0 "#F Чтобы научиться стрелять из долийских длинных луков, требуется целая вечность, но они столь мощны, что пробивают даже тяжёлую броню, и обладают практически непревзойдённой скорострельностью."
 warrior_skalds_flavor:0 "#F Для этих прославленных бойцов искусство сказителя и хранение истории не менее важны, чем кровавое ремесло убийства врагов.#!"
 heliwr_flavor:0 "#F Хасиндов с их лёгкими доспехами и свободным строем часто недооценивают. Из-за этого заблуждения немало глупых военачальников вошли в бескрайние Дикие земли Коркари — и больше их никто не видел.#!"
 war_mabari_flavor:0 "#F Мабари, выбравший хозяина и покрытый защитным каддисом, — грозный противник. А целая свора, стаскивающая всадников с коней и разрывающая строй пикинеров, внушает благоговейный ужас.#!"
 brecilian_hunters_flavor:0 "#F Долгое и тяжёлое обучение позволяет бресилианским охотникам в совершенстве овладеть своими приёмами: их стрелы пробивают латы, а скорострельность почти не знает равных."
 sylvan_flavor:0 "#F Они скрываются среди своих собратьев. Недвижные, как сам лес, они выслеживают добычу. Одни называют их чудовищами, другие — демонами, но одно известно точно: если сильваны показались, молитесь."
 marshlander_flavor:0 "#F Жестокие и умелые болотники довершат дело, если топи не убьют врага сами. Там, где остальные скользят и оступаются, эти люди обращают землю себе на пользу."
 field_cavaliers_flavor:0 "#F Всадников полей отбирают среди лучших из лучших — это самые искусные воины Жислена. Великолепные доспехи, породистые кони и непоколебимая честь делают их гордостью шанвалуа."
 children_of_jader_flavor:0 "#F Эти тяжеловооружённые отряды достигли совершенства в защите суровых рубежей Орлесианской империи. В них необычным образом соединились орлесианские и ферелденские обычаи, закалённые беспощадными землями Морозных гор."
 tribesmen_flavor:0 "#F Когда приходит беда, племенные воины цириан до последнего вздоха сражаются за каждый комок грязи, который называют домом, и навсегда отбивают у бегущего врага желание вернуться."
 silent_walkers_flavor:0 "#F Во время Второго Мора эти скрытные воины рыскали по холмам и пустошам северного Тедаса. Они переняли искусство засад у порождений тьмы, обратили его против учителей и помнят по сей день."
 western_watchmen_flavor:0 "#F Некогда они владели райским краем, но Второй Мор обратил родину в руины. Закованные в тяжёлые доспехи и суровые сердцем, они превращают жажду мести в боевую доблесть против любого, кто встанет на пути."
 southern_masters_flavor:0 "#F Виверны Гаморданских пиков, киты Расколотого моря и сама жизнь среди Серных озёр — эти охотники одолели всё одним лишь луком да толстой меховой шубой. Теперь ничто смертное не способно их испугать."
 nomadic_warriors_flavor:0 "Обученные обычаям сандренцев и закалённые веками странствий и племенных стычек у Моря Пепла, эти кочевые воины умеют сливаться с местностью и незаметно занимать позиции, пока останавливать их наступление не станет слишком поздно."


 game_concept_war_mabari:0 "Боевые мабари"
 game_concept_war_mabari_desc:0 "Собаки — неотъемлемая часть ферелденской культуры, и ни одна порода не ценится выше мабари. Она столь же древняя, как сами мифы: говорят, её вывели из волков, служивших Дейну. Благодаря уму и преданности эти собаки — не просто оружие или символ статуса: гончая сама выбирает хозяина и остаётся с ним на всю жизнь. В любом уголке Ферелдена хозяина мабари сразу признают достойным человеком.\n\nМабари — существенная часть ферелденской военной тактики. Обученные псы без труда могут стащить рыцаря с коня или прорвать строй пикинеров, а вид и грохот волны боевых псов, несущихся с воем и рычанием, способен вызвать панику даже у самых закалённых пехотинцев."