l_russian:
 DATAW_invite_free_marches_veterans_decision: "Пригласить ветеранов Вольной Марки"
 DATAW_invite_free_marches_veterans_decision_tooltip: "Пригласить ветеранов Вольной Марки"
 DATAW_invite_free_marches_veterans_decision_desc: "Пока по всему Ферелдену полыхают войны, нам постоянно требуются опытные военачальники, способные обеспечить должный порядок на поле боя.\nК счастью, к северу от Ферелдена лежит край, который десятилетиями служит настоящей кузницей талантливых полководцев, — Вольная Марка. Старкхэвен, Киркволл, Герциния... Там бесчисленные города-государства и малые королевства воюют друг с другом, а закалённых в этих конфликтах ветеранов ещё больше. За известную цену можно нанять нескольких умелых военачальников из тех земель. Их опыт окажется бесценным."
 DATAW_invite_free_marches_veterans_decision_confirm: "Отправить герольда"
 DATAW_invite_free_marches_veterans_decision_effect_tooltip: "#P 3#! ветерана из Вольной Марки прибудут к вашему #V двору#! в качестве [Concept('guests','гостей')|E]"
 DATAW_invite_free_marches_veterans_decision_valid_tooltip: "Для найма #V ветерана#! требуется не менее @gold_icon!#V 75#! ед. [Concept('gold','золота')|E]"
 
 consult_elders: "Советоваться со старейшинами"
 DATAW_consult_elders_desc: "Мудрый правитель во всех делах — привычных и неясных — прислушивается к самым опытным советникам. Следует собрать придворных старейшин в моём зале на закрытый совет, чтобы услышать их мудрые наставления обо всём: от маршрутов дозоров до налоговых уложений."
 consult_elders_tooltip:"Обратиться к старейшинам за советом"
 consult_elders_confirm: "Созвать совет!"
 DATAW_consult_elders_valid_tooltip: "При вашем дворе есть хотя бы один человек старше 50 лет."

 DATAW_minor_decisions.0624.t:0 "Совет старейшины"
 DATAW_minor_decision.0624.desc: "После долгих часов обстоятельного обсуждения почти всех сторон жизни моих владений собрание завершилось. Весомее всего звучал голос [elder.GetName], и, покидая зал, я всё ещё размышляю над [elder.GetHerHis] словами."
 DATAW_minor_decision.0624.opt.a: "Мудрый совет, [elder.GetName]."
 DATAW_minor_decision.0624.opt.b: "К сожалению, [elder.GetSheHe] [Select_CString(elder.IsFemale, 'права', 'прав' )]."
 DATAW_minor_decision.0624.opt.c: "Моя любовь мудра."

 investigate_ducarme_orphanage: "Расследовать дела приюта Дюкарма"
 DATAW_investigate_ducarme_orphanage_desc: "Имя Роберта Дюкарма, «Слуги воли Верховной Жрицы», часто всплывает в разговорах о приюте Дюкарма для долийских детей. Об этом заведении ходит множество слухов, а люди без конца гадают, что же в действительности скрывается за его дверями. Приют окружает слишком много тайн, и происходит там слишком много странного. Расследование следует начать немедленно."
 investigate_ducarme_orphanage_confirm: "Тайны Дюкарма будут раскрыты."
 investigate_ducarme_orphanage_tooltip: "Раскрыть тайны здания: [GetBuilding('ducarme_orphanage').GetName]"

