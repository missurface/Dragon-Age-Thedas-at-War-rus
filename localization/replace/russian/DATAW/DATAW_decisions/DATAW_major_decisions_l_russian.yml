 storm_of_the_wolf_decision:0 "Буря Волка"
 storm_of_the_wolf_decision_desc:0 "Мы утвердились в роли новых властителей восточной части Морозных гор. Теперь необходимо привести эти земли к покорности."
 storm_of_the_wolf_decision_confirm:0 "Разделить добычу!"
 storm_of_the_wolf_decision_tooltip:0 "С помощью совета решить, как править новыми землями."



