 # unify_marshes: "Все ваши вассалы должны иметь о вас не менее #P 80#! ед. [Concept('opinion','мнения')|E]."
 # Summon sylvans to fight!

 summon_spirits_decision:0 "Призвать лес на помощь"
 summon_spirits_decision_confirm:0 "Хозяйка леса, услышь мою мольбу…"
 summon_spirits_decision_desc:0 "Десятилетиями духи леса были добры к нам. Белая Госпожа внимала нашим просьбам и выводила заблудившихся из ночной тьмы, а Сеятель помогал лекарствам принести плоды…\n\nНо когда на нас нападали чужаки, мы взывали к духам ради более… осязаемой помощи.\n\nВеликие деревья, казавшиеся недвижимыми, внезапно оживали с яростью тысячи воинов, готовые обрушить невероятную мощь на защиту своих почитателей.\n\nБольшинство из них дики и враждебны любому живому существу, но те немногие, что отдают нам свою силу, становятся бесценными союзниками, достойными величайших почестей и жертв.\n\nПришло время вновь призвать таких духов на помощь. Будем молиться, чтобы они ответили благосклонно."
 summon_spirits_decision_tooltip:0 "Призвать духов леса"
 summon_spirits_decision_effect.tt:0 "Подготовить жертву, чтобы призвать духов на помощь."
 sylvan_army:0 "Войско духов"

# Hiring Mercenaries
# Ciriane Rebellion
# By Stocky Kruegar, written by Denvar

 DATAW_ciriane_rebellion_hiring_mercenaries:0 "Нанять наёмников"
 DATAW_ciriane_rebellion_hiring_mercenaries_confirm:0 "Нанять их!"
 DATAW_ciriane_rebellion_hiring_mercenaries_desc:0 "Войско региона [GetGeographicalRegion('custom_mareschois_population').GetName] никогда не сравнится с мощью империи [GetTitleByKey('e_orlais').GetBaseNameNoTier]. Нам придётся собрать всех союзников, каких только удастся найти, и при этом не вызвать подозрений Империи. Поэтому советники предлагают тайно договориться с несколькими наёмными отрядами.\n\n#N До начала восстания договор должен оставаться в тайне, а значит, потребуются особые меры предосторожности…#!"
 DATAW_ciriane_rebellion_hiring_mercenaries_tooltip:0 "Особый договор с наёмниками обеспечит вам подкрепление во время восстания"
 DATAW_ciriane_rebellion_hiring_mercenaries_tt:0 "Начнётся событие, в котором вы сможете выбрать несколько договоров с наёмниками! Эти отряды появятся после начала восстания! Действуйте осторожно: деньги на вербовку могут перехватить разбойники. Нанять наёмников повторно не удастся — это решение можно принять лишь однажды."

# United in Faith
# Ciriane Rebellion
# By Stocky Kruegar, written by Denvar

 DATAW_ciriane_rebellion_united_in_faith:0 "Единство в вере"
 DATAW_ciriane_rebellion_united_in_faith_confirm:0 "Навстречу славе!"
 DATAW_ciriane_rebellion_united_in_faith_desc:0 "Церковь подвела нас. Возвращение к старым обычаям обеспечит нам независимость и безопасность. Воины стекаются в мою столицу и крепости моих вассалов, моля о возможности защитить веру.\n\n#N Они её получат!#!"
 DATAW_ciriane_rebellion_united_in_faith_tooltip:0 "Вы получите особых воинов"
 DATAW_ciriane_rebellion_united_in_faith_tt:0 "Вы получите особых воинов — #N защитников Цирианы#!"
 DATAW_ciriane_rebellion_united_in_faith.m: "Защитники Цирианы"

# Seek out Local Tribes
# Ciriane Rebellion
# By Stocky Kruegar, written by Denvar

 DATAW_ciriane_rebellion_seek_out_the_local_tribes:0 "Разыскать местные племена"
 DATAW_ciriane_rebellion_seek_out_the_local_tribes_confirm:0 "Обратимся к ним!"
 DATAW_ciriane_rebellion_seek_out_the_local_tribes_desc:0 "Знать народа [GetGlobalVariable('mareschois_culture_var').Culture.GetName] рассказывает о своих предках из народа [GetGlobalVariable('ciriane_culture_var').Culture.GetName], а бывавшие в топях путники утверждают, что на наших землях до сих пор живут настоящие племена. Никому не известно, какова их численность и сила.\n\n#N Для большинства людей они существуют лишь в народных сказках и историях у костра.#!"
 DATAW_ciriane_rebellion_seek_out_the_local_tribes_tooltip:0 "Попытаться заслужить уважение местных племён цирианов"
 DATAW_ciriane_rebellion_seek_out_the_local_tribes_tt:0 "Вам предстоит пройти через испытания и невзгоды, которыми местные племена проверят ваше достоинство."

# Ally with Serault/Alyons
# Ciriane Rebellion
# By Stocky Kruegar, written by Denvar

 DATAW_ciriane_rebellion_ally_with_serault:0 "Заключить союз с Серо"
 DATAW_ciriane_rebellion_ally_with_serault_confirm:0 "Заключим союз!"
 DATAW_ciriane_rebellion_ally_with_serault_desc:0 "Наш западный сосед — один из двух последних независимых правителей народа марешуа. Хотя нас разделяет граница Империи, жители Серо гораздо ближе нам, чем любая знать Вал Руайо. Нет причин не поддержать друг друга.\n\nИз двух наших соседей Серо отличается большей набожностью. Там гордятся цирианским наследием прежде всего потому, что желают подчеркнуть связь с Андрасте.\n\n#N Такой союзник привнесёт в наше дело праведную ярость.#!"
 DATAW_ciriane_rebellion_ally_with_serault_tooltip:0 "Отправить гонца в Замок Двух тысяч Окон"
 DATAW_ciriane_rebellion_ally_with_serault_tt:0 "Вы начнёте переговоры об особом союзе с герцогством Серо. Убедить его правителя можно с помощью престижа, золота или даже предложения графства. В случае отказа вы сможете сохранить мир и отступиться либо с помощью цепочки событий начать войну за все земли Серо."

 DATAW_ciriane_rebellion_ally_with_alyons:0 "Заключить союз с Альоном"
 DATAW_ciriane_rebellion_ally_with_alyons_confirm:0 "Заключим союз!"
 DATAW_ciriane_rebellion_ally_with_alyons_desc:0 "Наш северо-западный сосед — один из двух последних независимых правителей народа марешуа. Хотя нас разделяет граница Империи, жители Альона гораздо ближе нам, чем любая знать Вал Руайо. Нет причин не поддержать друг друга.\n\nИз двух наших соседей Альон пользуется большим почётом. Его жители имеют превосходную репутацию при дворе [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier].\n\n#N Они станут ценным подспорьем в Великой игре.#!"
 DATAW_ciriane_rebellion_ally_with_alyons_tooltip:0 "Отправить гонца в замок Альон"
 DATAW_ciriane_rebellion_ally_with_alyons_tt:0 "Вы начнёте переговоры об особом союзе с герцогством Альон. Убедить его правителя можно с помощью престижа, золота или даже предложения графства. В случае отказа вы сможете сохранить мир и отступиться либо с помощью цепочки событий начать войну за все земли Альона."

# Rooting out Ciriane Rebels
# Ciriane Rebellion
# By Stocky Kruegar, written by Mel

 DATAW_ciriane_rebellion_cleansing_frontiers_serault:0 "Завоевать Серо"
 DATAW_ciriane_rebellion_cleansing_frontiers_serault_confirm:0 "Серо угрожает самому нашему существованию."
 DATAW_ciriane_rebellion_cleansing_frontiers_serault_desc:0 "Западная мразь всё ещё преграждает нам путь к победе. Мы не можем допустить ни единой ошибки и не позволим никому причинить нам вред. Империя должна процветать любой ценой. Истребить этих паразитов и повести остальных за собой предстоит мне: для этой задачи [Select_CString(ROOT.Char.IsFemale, 'избрана', 'избран' )] именно я, и только мне дано одержать победу."
 DATAW_ciriane_rebellion_cleansing_frontiers_serault_tooltip:0 "Обезопасить границу, завоевав [GetTitleByKey('d_serault').GetBaseNameNoTier]."
 DATAW_ciriane_rebellion_cleansing_frontiers_serault_tt:0 "Вы #N немедленно#! начнёте войну за завоевание всего Серо и подчините его #N во имя Орлея.#! Тем самым вы докажете исключительную верность Империи и получите награду. Учтите: если до начала Священного похода на Долы вы не успеете #N выполнить все эти решения#!, вам придётся столкнуться с восстаниями цирианов."

 DATAW_ciriane_rebellion_cleansing_frontiers_alyons:0 "Завоевать Альон"
 DATAW_ciriane_rebellion_cleansing_frontiers_alyons_confirm:0 "Альон представляет непосредственную угрозу."
 DATAW_ciriane_rebellion_cleansing_frontiers_alyons_desc:0 "Западная мразь всё ещё преграждает нам путь к победе. Мы не можем допустить ни единой ошибки и не позволим никому причинить нам вред. Империя должна процветать любой ценой. Истребить этих паразитов и повести остальных за собой предстоит мне: для этой задачи [Select_CString(ROOT.Char.IsFemale, 'избрана', 'избран' )] именно я, и только мне дано одержать победу."
 DATAW_ciriane_rebellion_cleansing_frontiers_alyons_tooltip:0 "Обезопасить границу, завоевав [GetTitleByKey('d_alyons').GetBaseNameNoTier]."
 DATAW_ciriane_rebellion_cleansing_frontiers_alyons_tt:0 "Вы #N немедленно#! начнёте войну за завоевание всего Альона и подчините его #N во имя Орлея.#! Тем самым вы докажете исключительную верность Империи и получите награду. Учтите: если до начала Священного похода на Долы вы не успеете #N выполнить все эти решения#!, вам придётся столкнуться с восстаниями цирианов."

# The Faith Secured
# Ciriane Rebellion
# By Stocky Kruegar, written by Ser Pounce

 DATAW_ciriane_rebellion_the_faith_secured:0 "Вера в безопасности"
 DATAW_ciriane_rebellion_the_faith_secured_confirm:0 "Пусть наши голоса сольются воедино, воспевая Песнь Света!"
 DATAW_ciriane_rebellion_the_faith_secured_desc:0 "Наконец завершено дело, начатое императором Кордилиусом Дракконом I. Разрозненные остатки отдельных культов Создателя объединились под покровительством Церкви и Верховной Жрицы в Вал Руайо. Сама Андрасте наверняка улыбнулась бы, увидев, как прежнюю разобщённость сменило согласие."
 DATAW_ciriane_rebellion_the_faith_secured_tooltip:0 "Вы получите особых воинов"
 DATAW_ciriane_rebellion_the_faith_secured_tt:0 "Вы получите особых воинов — #N защитников Церкви#!"
 DATAW_ciriane_rebellion_the_faith_secured_tt_2:0 "Это решение ещё на шаг приблизит вас к предотвращению восстания цирианов после начала Священного похода на Долы. Чем больше решений вы выполните, тем меньше воинов поднимется против вас. #Z Чтобы полностью предотвратить восстание, успешно выполните их все.#!"
 DATAW_ciriane_rebellion_the_faith_secured.m: "Защитники Церкви"

# The Faith Secured
# Ciriane Rebellion
# By Stocky Kruegar, written by Reside

 DATAW_ciriane_rebellion_plan_sabotage_against_nahashin:0 "Спланировать диверсии против Нахашина"
 DATAW_ciriane_rebellion_plan_sabotage_against_nahashin_confirm:0 "Я отвечу на зов служителя Сомисариан…"
 DATAW_ciriane_rebellion_plan_sabotage_against_nahashin_desc:0 "Нахашин всё ещё верен Орлею, но Те, кто скрывается среди Топей, не знают покоя: Сомисариан желает освободить земли Нахашина от забывших её людей.\n\nМножество агентов прислали мне зашифрованные послания. В них изложены планы диверсий против герцога и возлюбленных им надушенных крыс с Востока, для которых требуется моя помощь.\n\n#N Мне остаётся лишь ответить.#!"
 DATAW_ciriane_rebellion_plan_sabotage_against_nahashin_tooltip:0 "Устроить диверсии в Нахашине"
 DATAW_ciriane_rebellion_plan_sabotage_against_nahashin_tt:0 "Вы сможете навредить Нахашину несколькими способами: сократить численность его войска и контроль над графствами, повысить расходы, снизить народное мнение и не только."

# Culling the Tribes
# Ciriane Rebellion
# By Stocky Kruegar, written by Reside

 DATAW_ciriane_rebellion_culling_the_tribes:0 "Истребить племена"
 DATAW_ciriane_rebellion_culling_the_tribes_confirm:0 "Созвать моих полководцев!"
 DATAW_ciriane_rebellion_culling_the_tribes_desc:0 "В Нахашине всегда ходили слухи о племенах, сохранивших древнюю веру народа [GetGlobalVariable('ciriane_culture_var').Culture.GetName]. Говорят, некоторые из них и поныне следуют воле старых богов во главе с Сомисариан, царицей солнца и луны.\n\nТеперь слухи подтвердились: древние кочевые племена, упрямо цепляющиеся за обычаи прошлого, вышли из укрытий, чтобы поддержать стремление народа [GetGlobalVariable('mareschois_culture_var').Culture.GetName] вернуть власть над родными землями.\n\n#N Этого больше нельзя терпеть. Если позволить племенам действовать и дальше, под угрозой окажутся и безопасность Империи, и спасение наших душ.#!"
 DATAW_ciriane_rebellion_culling_the_tribes_tooltip:0 "Истребить племена"
 DATAW_ciriane_rebellion_culling_the_tribes_tt:0 "Начнётся событие, позволяющее постепенно ослабить племена народа [GetGlobalVariable('ciriane_culture_var').Culture.GetName]. На протяжении года контроль над выбранным в событии регионом будет снижаться. Чтобы успешно истребить племя в графстве, удерживайте контроль выше порога в 50%. #X Если во всех трёх графствах контроль останется выше 50%, восстание, которое начнётся во время Священного похода на Долы, ослабеет, и вы приблизитесь к его полному предотвращению.#! Это решение доступно ТОЛЬКО в 2:5 году Века Славы, поскольку его выполнение требует много времени!"

# Expanding the Kingdom of Nahashin
# Ciriane Rebellion
# By Stocky Kruegar, written by Korin & Reside

 DATAW_ciriane_rebellion_expanding_the_kingdom_of_nahashin:0 "Расширить королевство Нахашин"
 DATAW_ciriane_rebellion_expanding_the_kingdom_of_nahashin_confirm:0 "Послать воинов в поход."
 DATAW_ciriane_rebellion_expanding_the_kingdom_of_nahashin_desc:0 "Десятилетиями наш народ находился под властью Орлея, утрачивая земли и могущество. Теперь мы свободны от этого змеиного двора, и настало время превратить возрождённое королевство Нахашин в империю, которая затмит державу со столицей в Вал Руайо."
 DATAW_ciriane_rebellion_expanding_the_kingdom_of_nahashin_tooltip:0 "Расширить королевство Нахашин"
 DATAW_ciriane_rebellion_expanding_the_kingdom_of_nahashin_tt:0 "Это решение откроет все решения, позволяющие расширить королевство."

# Demand Subjugation of the Duchies
# Ciriane Rebellion
# By Stocky Kruegar, written by Korin & Reside

 DATAW_ciriane_rebellion_demand_subjugation_of_the_duchies:0 "Потребовать подчинения герцогств"
 DATAW_ciriane_rebellion_demand_subjugation_of_the_duchies_confirm:0 "За единый Нахашин!"
 DATAW_ciriane_rebellion_demand_subjugation_of_the_duchies_desc:0 "Захолустные герцогства Серо и Альон, давно забытые Орлеем, по праву должны входить в королевство Нахашин: нас связывает родство, восходящее к древним цирианским предкам. Теперь, когда мы освободились от Орлея, многие жители этих далёких герцогств наверняка захотят присоединиться к нам!"
 DATAW_ciriane_rebellion_demand_subjugation_of_the_duchies_tooltip:0 "Потребовать подчинения герцогств"
 DATAW_ciriane_rebellion_demand_subjugation_of_the_duchies_tt:0 "Все независимые правители королевства Серо получат выбор: присоединиться к вам или отказать, дав вам притязания на их владения. Установив власть над титулом [GetTitleByKey('k_serault').GetBaseNameNoTier], вы получите притязания, позволяющие расшириться в земли [GetTitleByKey('k_blasted_hills').GetBaseNameNoTier] и [GetTitleByKey('k_western_approach').GetBaseNameNoTier]."

# Claim the Northern Lands
# Ciriane Rebellion
# By Stocky Kruegar, written by Korin & Reside

 DATAW_ciriane_rebellion_claim_the_northern_lands:0 "Заявить права на северные земли"
 DATAW_ciriane_rebellion_claim_the_northern_lands_confirm:0 "Холмы вновь станут нашими."
 DATAW_ciriane_rebellion_claim_the_northern_lands_desc:0 "Выжженные холмы, некогда бывшие северным рубежом цирианских земель, хранят множество богатых шахт и пещер, которые принадлежат нам по праву. Их возвращение ещё на шаг приблизит создание империи народа [GetPlayer.GetCulture.GetName]."
 DATAW_ciriane_rebellion_claim_the_northern_lands_tooltip:0 "Заявить права на северные земли"
 DATAW_ciriane_rebellion_claim_the_northern_lands_tt:0 "После принятия этого решения вас официально признают законным правителем этих земель. Это поможет создать империю народа [GetPlayer.GetCulture.GetName], а каждое графство региона на 25 лет получит ускорение обращения."

# Claim the Southern Lands
# Ciriane Rebellion
# By Stocky Kruegar, written by Korin & Reside

 DATAW_ciriane_rebellion_claim_the_southern_lands:0 "Заявить права на южные земли"
 DATAW_ciriane_rebellion_claim_the_southern_lands_confirm:0 "Западный предел подчинится Нахашину."
 DATAW_ciriane_rebellion_claim_the_southern_lands_desc:0 "Западный предел, некогда плодородный край, утратил былое великолепие из-за мерзкой скверны порождений тьмы. Но когда-то эти земли принадлежали нам и должны вернуться к нашему народу вместе с оставленными там памятниками прошлого и местами погребений."
 DATAW_ciriane_rebellion_claim_the_southern_lands_tooltip:0 "Заявить права на южные земли"
 DATAW_ciriane_rebellion_claim_the_southern_lands_tt:0 "После принятия этого решения вас официально признают законным правителем этих земель. Это поможет создать империю народа [GetPlayer.GetCulture.GetName], а каждое графство региона на 25 лет получит ускорение обращения."

# Form the Empire of Ciriane
# Ciriane Rebellion
# By Stocky Kruegar, written by Korin & Reside

 DATAW_ciriane_rebellion_form_the_empire_of_ciriane:0 "Создать империю народа [GetPlayer.GetCulture.GetName]"
 DATAW_ciriane_rebellion_form_the_empire_of_ciriane_confirm:0 "Народ [GetPlayer.GetCulture.GetName] объединён."
 DATAW_ciriane_rebellion_form_the_empire_of_ciriane_desc:0 "Империя народа [GetPlayer.GetCulture.GetName] — ещё недавно это оставалось лишь несбыточной мечтой, но теперь она почти в моих руках. Если мне удастся объединить древние земли цирианов, равновесие сил в Орлее, а возможно, и во всём Тедасе изменится навсегда."
 DATAW_ciriane_rebellion_form_the_empire_of_ciriane_tooltip:0 "Создать империю народа [GetPlayer.GetCulture.GetName]"
 claimed_southern_lands_decision_tooltip:0 "Если вы заявили права на южные земли и владеете титулом [GetTitleByKey('k_western_approach').GetBaseNameNoTier] либо полностью контролируете его земли де-юре, он станет частью де-юре владений [GetTitleByKey('e_nahashin').GetBaseNameNoTier]"
 claimed_northern_lands_decision_tooltip:0 "Если вы заявили права на северные земли и владеете титулом [GetTitleByKey('k_blasted_hills').GetBaseNameNoTier] либо полностью контролируете его земли де-юре, он станет частью де-юре владений [GetTitleByKey('e_nahashin').GetBaseNameNoTier]"

# Reforming the Ciriane Religion
# Ciriane Rebellion
# By Stocky Kruegar, written by Korin & Reside

 DATAW_ciriane_rebellion_reforming_the_ciriane_religion:0 "Реформировать цирианскую религию"
 DATAW_ciriane_rebellion_reforming_the_ciriane_religion_desc:0 "Нахашин обрёл независимость, и древняя вера вновь вышла на свет: нам больше не приходится скрывать почитателей Сомисариан.\n\nНо за минувшие века вера распалась на множество течений: племена по-разному понимали учение и пересказывали легенды. Если мы хотим, чтобы наша вера выдержала испытание временем и вновь привлекла народ, эти расхождения необходимо искоренить.\n\n#N Люди вполне могут объявить меня [Select_CString(ROOT.Char.IsFemale, 'исказительницей', 'исказителем' )] веры за изменение их убеждений, но ради выживания нашей религии стоит пойти на такой риск.#!"
 DATAW_ciriane_rebellion_reforming_the_ciriane_religion_confirm:0 "Пришло время преобразить нашу веру!"
 DATAW_ciriane_rebellion_reforming_the_ciriane_religion_tt:0 "Начнётся цепочка событий о реформировании цирианской религии, в которой вы сможете связать её с Андрасте или отказаться от этой связи."
 DATAW_ciriane_rebellion_reforming_the_ciriane_religion_tooltip:0 "Реформировать цирианскую религию"
 faith_conversion_unreformed_tt:0 "Ваша [Concept('faith','конфессия')|E] имеет доктрину [GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName] (НЕ является [Concept('organized','организованной конфессией')|E])"

#  Drain the Northern Marshes
# Ciriane Rebellion
# By Stocky Kruegar, written by Korin & Reside

 DATAW_ciriane_rebellion_drain_the_northern_marshes:0 "Осушить северные топи"
 DATAW_ciriane_rebellion_drain_the_northern_marshes_desc:0 "На фоне великолепных провинций Орлея Нахашинские топи издавна считались захолустьем. Но огромный труд и лучшие инженеры, которых можно купить за деньги, позволят превратить значительную часть болот в пахотные земли, готовые принять недавно освободившийся народ [GetPlayer.GetCulture.GetName]!\n\n#N Работа предстоит тяжёлая, но при умелом управлении этот проект будет ускорять развитие края на протяжении многих поколений.#!"
 DATAW_ciriane_rebellion_drain_the_northern_marshes_confirm:0 "Начать работы!"
 DATAW_ciriane_rebellion_drain_the_northern_marshes_tt:0 "Начнётся пятилетняя цепочка событий об осушении северных топей, затрагивающая герцогства [GetTitleByKey('d_archambon').GetBaseNameNoTier] и [GetTitleByKey('d_eudolon').GetBaseNameNoTier]. После её завершения они получат ускорение развития. Раз в два года будет происходить событие с новым препятствием."
 DATAW_ciriane_rebellion_drain_the_northern_marshes_c_tt:0 "Вы НЕ участвуете в другой цепочке событий об осушении топей."
 DATAW_ciriane_rebellion_drain_the_northern_marshes_tooltip:0 "Осушить северные топи"

 # Drain the Southern Marshes
# Ciriane Rebellion
# By Stocky Kruegar, written by Korin & Reside

 DATAW_ciriane_rebellion_drain_the_southern_marshes:0 "Осушить южные топи"
 DATAW_ciriane_rebellion_drain_the_southern_marshes_desc:0 "На фоне великолепных провинций Орлея Нахашинские топи издавна считались захолустьем. Но огромный труд и лучшие инженеры, которых можно купить за деньги, позволят превратить значительную часть болот в пахотные земли, готовые принять недавно освободившийся народ Нахашина!\n\n#N Работа предстоит тяжёлая, но при умелом управлении этот проект будет ускорять развитие края на протяжении многих поколений.#!"
 DATAW_ciriane_rebellion_drain_the_southern_marshes_confirm:0 "Подготовить планы!"
 DATAW_ciriane_rebellion_drain_the_southern_marshes_tt:0 "Начнётся пятилетняя цепочка событий об осушении южных топей, затрагивающая герцогства [GetTitleByKey('d_claose').GetBaseNameNoTier] и [GetTitleByKey('d_henar').GetBaseNameNoTier]. После её завершения они получат ускорение развития. Раз в два года будет происходить событие с новым препятствием."
 DATAW_ciriane_rebellion_drain_the_southern_marshes_tooltip:0 "Осушить южные топи"


###################################
# Reclaim the Simmard Lineage
# Morreau restoration path
# By Rislav, written by Reside
###################################

 DATAW_reclaim_simmard_lineage_decision:0 "Вернуть наследие Симмара"
 DATAW_reclaim_simmard_lineage_decision_desc:0 "Со времён роковой резни, превратившей Монтсиммар в жалкую тень былого величия, династия [ROOT.Char.GetDynasty.GetName] лежала в руинах и продолжала жить лишь в моей ветви — доме [ROOT.Char.GetHouse.GetName]. Мы пережили удары порождений тьмы и страдания, причинённые бездействием эльфов, и вопреки всему одержали верх. Теперь наследники дома Симмар вновь правят Столицей Юга, сбросив власть незаконных Орельенов! Пришло время вернуть нашему славному имени достойное место."
 DATAW_reclaim_simmard_lineage_decision_confirm:0 "Дом Симмар вновь жив и правит!"
 DATAW_reclaim_simmard_lineage_decision_tooltip:0 "Вернуть славу наших предков!"
 DATAW_reclaim_simmard_lineage_tt:0 "Заявить права на наследие Симмаров!"






