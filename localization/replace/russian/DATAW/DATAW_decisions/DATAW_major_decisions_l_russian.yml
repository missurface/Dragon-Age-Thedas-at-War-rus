 a_lowland_realm_decision:0 "Держава низин"
 a_lowland_realm_decision_desc:0 "Чтобы принести Эджхоллу мир, нужна стабильность. Общество, дипломатия, границы и хозяйство — во всех отношениях Эджхолл должен обрести покой и процветание. Лишь когда все эти вопросы будут решены, край окажется в безопасности и родится подлинная держава."
 a_lowland_realm_decision_confirm:0 "Подтверждение-заглушка"
