# Howls over the Mountains
# By Varren / Rislav
###########################

 howls_over_the_mountains_decision:0 "Вой над горами"
 howls_over_the_mountains_decision_desc:0 "От северных вершин до южной котловины гремит имя Волчьей Руки, и каждый оплот ощущает тяжесть моей славы. Словом и топором я [Select_CString(ROOT.Char.IsFemale, 'шла', 'шёл' )] вперёд, пока горы не склонились передо мной. Теперь я исполню своё предназначение, объединю авваров и поведу их к светлому будущему. Конец пути близок: мы с советом должны собраться и решить нашу окончательную судьбу."
 howls_over_the_mountains_decision_confirm:0 "Волчья Рука — [Select_CString(ROOT.Char.IsFemale, 'истинная королева', 'истинный король' )] Морозных гор!"
 howls_over_the_mountains_decision_tooltip:0 "Упрочить власть над Морозными горами!"


##########################
# Burning the Bannorn
# By Rislav
##########################

 burning_the_bannorn_decision:0 "Сжечь Баннорн"
 burning_the_bannorn_decision_desc:0 "Ничтожные банны Баннорна пали. Там, где прежде грызлись сотни кланов, теперь правят избранные мною таны и ярлы. Моё могучее войско вновь растёт, а вместе с ним крепнет жажда новых земель."
 burning_the_bannorn_decision_confirm:0 "Пусть пламя пожрёт их непокорность!"
 burning_the_bannorn_decision_tooltip:0 "Решить судьбу мятежного Баннорна."

##########################
# Harrying the Hills
# By Rislav
##########################

 harrying_the_hills_decision:0 "Разорить Южные холмы"
 harrying_the_hills_decision_desc:0 "Стратегическим сердцем Ферелдена всегда были Южные холмы, раз за разом оказывавшиеся меж жерновами бесчисленных войн. Теперь они в наших руках."
 harrying_the_hills_decision_confirm:0 "Пусть пламя пожрёт их непокорность!"
 harrying_the_hills_decision_tooltip:0 "Решить судьбу непокорных Южных холмов."

##########################
# An Ancient Territory
# By Rislav
##########################

 an_ancient_territory_decision:0 "Древние владения"
 an_ancient_territory_decision_desc:0 "В давние времена аввары не знали границ Морозных гор и свободно странствовали по землям Ферелдена. Теперь мы вернулись в давно утраченный край, и настало время вновь сделать его своим."
 an_ancient_territory_decision_confirm:0 "Сохранили ли здесь старые обеты?"
 an_ancient_territory_decision_tooltip:0 "Помнит ли народ древние обычаи?"

##########################
# Into the Hinterlands
# By Rislav
##########################

 into_the_hinterlands_decision:0 "Во Внутренние земли"
 into_the_hinterlands_decision_desc:0 "Редклиф издавна считался вратами в остальной Ферелден. Теперь он наш, а значит, низины созрели для завоевания."
 into_the_hinterlands_decision_confirm:0 "Ферелден наш."
 into_the_hinterlands_decision_tooltip:0 "Старого врага больше нет."

##########################
# Breaking the Brecilian
# By Rislav
##########################

 breaking_the_brecilian_decision:0 "Покорить Бресилиан"
 breaking_the_brecilian_decision_desc:0 "Лес Бресилиан долго был занозой в нашем боку — пристанищем дикарей, приносящих кровавые жертвы деревьям. Но этому пришёл конец."
 breaking_the_brecilian_decision_confirm:0 "Выкурить их огнём."
 breaking_the_brecilian_decision_tooltip:0 "Лес падёт перед нами."

##########################
# Gutting Gwaren
# By Rislav
##########################

 gutting_gwaren_decision:0 "Выпотрошить Гварен"
 gutting_gwaren_decision_desc:0 "История Гварена во многом напоминает историю Эджхолла: это поселение аламарри, на которое сильно повлияли подземные соседи. Однако ныне от былого города остались лишь рыбацкие хижины да семейные фермы."
 gutting_gwaren_decision_confirm:0 "Что ждёт Гварен?"
 gutting_gwaren_decision_tooltip:0 "О, услышать бы зов моря…"

##########################
# Winter Falls on Denerim
# By Rislav
##########################

 winter_falls_on_denerim_decision:0 "Зима приходит в Денерим"
 winter_falls_on_denerim_decision_desc:0 "Великий Денерим, некогда бывший жемчужиной Ферелдена, попал в нашу ледяную хватку."
 winter_falls_on_denerim_decision_confirm:0 "Драккон или Данесен — теперь это неважно."
 winter_falls_on_denerim_decision_tooltip:0 "Давний соперник повержен."

##########################
# Bloodlust Sated
# By Rislav
##########################

 bloodlust_sated_decision:0 "Утолённая жажда крови"
 bloodlust_sated_decision_desc:0 "Весь Ферелден принадлежит мне, а клейны трепещут от страха. Осталось лишь решить, что делать с пеплом."
 bloodlust_sated_decision_confirm:0 "Волчья Рука — [Select_CString(ROOT.Char.IsFemale, 'истинная королева', 'истинный король' )] Ферелдена!"
 bloodlust_sated_decision_tooltip:0 "Начало новой эпохи."



