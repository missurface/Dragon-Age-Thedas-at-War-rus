 where_the_wolf_den_lies_decision:0 "Где находится волчье логово…"
 where_the_wolf_den_lies_decision_desc:0 "Дом там, где сердце, но этот волк никогда не знал дома. Теперь моя власть достаточно окрепла, чтобы стать опорой будущего похода, однако прежде нужно разрешить внутренние противоречия и лишь затем без остатка посвятить себя цели."
 where_the_wolf_den_lies_decision_confirm:0 "Где мой настоящий дом?"
 where_the_wolf_den_lies_decision_tooltip:0 "Обратиться к прошлому и понять, кто вы."

