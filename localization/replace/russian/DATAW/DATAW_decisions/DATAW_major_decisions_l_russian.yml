l_russian:
 DATAW_integrate_crescent_valley: "Интегрировать Долину Полумесяца"
 DATAW_integrate_crescent_valley_tooltip: "Интегрировать Долину Полумесяца"
 DATAW_integrate_crescent_valley_desc: "С самого основания Орлесианской империи Джейдер по праву, дарованному самим Кордилиусом Дракконом I, владеет землями титула [GetTitleByKey('d_crescent_valley').GetBaseNameNoTier]. Однако местные авварские кланы никогда не признавали нашу власть и брались за оружие всякий раз, когда мы пытались утвердить её.\n\nПервые попытки усмирить долину потерпели крах на исходе Второго Мора: тан Альденон Орлиный Глаз изгнал наших наместников, подняв вооружённое восстание. С тех пор наша власть в этих землях остаётся шаткой. Исправить положение можно лишь решительными мерами."
 DATAW_integrate_crescent_valley_confirm: "Покончить с этим безобразием"
 DATAW_land_easier_to_convert_crescent: "В течение следующих 25 лет в графствах титула [GetTitleByKey('d_crescent_valley').GetName] будет проще обращать население в другую [Concept('faith','конфессию')|E] и [Concept('culture','культуру')|E]"
 DATAW_jader_turn_tribes_into_castle: "Все [Concept('tribe','племенные')|E] [Concept('holdings','владения')|E] титула [GetTitleByKey('d_crescent_valley').GetBaseNameNoTier] станут [Concept('castle','замковыми')|E] [Concept('holdings','владениями')|E]"
 DATAW_jader_reset_development: "Во всех [Concept('county','графствах')|E] титула [GetTitleByKey('d_crescent_valley').GetName] обнулятся [Concept('development','развитие')|E] и [Concept('control','контроль')|E]"

 DATAW_unite_the_bannorn: "Объединить Баннорн"
 DATAW_unite_the_bannorn_tooltip: "Объединить земли баннов"
 DATAW_unite_the_bannorn_desc: "Бесчисленные банны центрального Ферелдена долго оставались разобщены и погрязли в мелочных распрях. До сих пор ни один правитель не обладал достаточной силой, чтобы объединить их под одним знаменем.\n\nМожно лишь представить, какие власть и влияние принесёт господство над единым Баннорном…"
 DATAW_unite_the_bannorn_confirm: "Объединить земли баннов"
 DATAW_unite_the_bannorn_tooltip_1: "Земли титулов [GetTitleByKey('k_w_bannorn').GetBaseNameNoTier] и [GetTitleByKey('k_e_bannorn').GetBaseNameNoTier] объединятся в составе державы [GetTitleByKey('k_bannorn').GetName]"
 DATAW_unite_the_bannorn_tooltip_2: ""

 DATAW_unite_clayne_tribes: "Объединить племена клейнов"
 DATAW_unite_clayne_tribes_tooltip: "Объединить племена клейнов"
 DATAW_unite_clayne_tribes_desc: "Если среди враждующих [Concept('tribes','племён')|E] народа [GetGlobalVariable('clayne_culture_var').Culture.GetName] появится достаточно сильный вождь, из хаоса можно будет выковать единую [Concept('realm','державу')|E], способную противостоять прихотям соседей."
 DATAW_unite_clayne_tribes_confirm: "Покончить с тысячелетиями раздора"
 DATAW_unite_clayne_tribes_conquest_tooltip_trig: "Вы должны владеть не менее #I 70%#! #I ([SCOPE.ScriptValue('70_percent_of_clayne_land')])#! [Concept('counties','графств')|E] державы [GetTitleByKey('e_ferelden').GetBaseNameNoTier], где господствует [GetGlobalVariable('clayne_culture_var').Culture.GetName] или одна из её дочерних [Concept('cultures','культур')|E].\nСейчас вы владеете #I [SCOPE.ScriptValue('ruler_owned_clayne_land')]#!/#X [SCOPE.ScriptValue('all_clayne_land')]#! [Concept('counties','графствами')|E]"
 DATAW_unite_clayne_tribes_mixed_tooltip_trig: "Вы и ваши [Concept('allies','союзники')|E] должны владеть не менее #I 70%#! #I ([SCOPE.ScriptValue('70_percent_of_clayne_land')])#! [Concept('counties','графств')|E] державы [GetTitleByKey('e_ferelden').GetBaseNameNoTier], где господствует [GetGlobalVariable('clayne_culture_var').Culture.GetName] или одна из её дочерних [Concept('cultures','культур')|E]. Кроме того, лично вы должны владеть более чем #I 40%#! #I ([SCOPE.ScriptValue('40_percent_of_clayne_land')])#!, но менее чем #X 70%#! #X ([SCOPE.ScriptValue('70_percent_of_clayne_land')])#! [Concept('counties','графств')|E], где господствует [GetGlobalVariable('clayne_culture_var').Culture.GetName].\nСейчас вы владеете #I [SCOPE.ScriptValue('ruler_owned_clayne_land')]#!/#X [SCOPE.ScriptValue('all_clayne_land')]#! [Concept('counties','графствами')|E], а вместе с [Concept('allies','союзниками')|E] — #I [SCOPE.ScriptValue('all_ally_land_and_ruler_combined')]#!/#X [SCOPE.ScriptValue('all_clayne_land')]#! [Concept('counties','графствами')|E]"
 DATAW_unite_clayne_tribes_peace_tooltip_trig: "Вы и ваши [Concept('allies','союзники')|E] должны владеть не менее #I 70%#! #I ([SCOPE.ScriptValue('70_percent_of_clayne_land')])#! [Concept('counties','графств')|E] державы [GetTitleByKey('e_ferelden').GetBaseNameNoTier], где господствует [GetGlobalVariable('clayne_culture_var').Culture.GetName] или одна из её дочерних [Concept('cultures','культур')|E]. При этом лично вы не можете владеть более чем #X 40%#! #X ([SCOPE.ScriptValue('40_percent_of_clayne_land')])#! [Concept('counties','графств')|E], где господствует [GetGlobalVariable('clayne_culture_var').Culture.GetName].\nСейчас вы владеете #I [SCOPE.ScriptValue('ruler_owned_clayne_land')]#!/#X [SCOPE.ScriptValue('all_clayne_land')]#! [Concept('counties','графствами')|E], а вместе с [Concept('allies','союзниками')|E] — #I [SCOPE.ScriptValue('all_ally_land_and_ruler_combined')]#!/#X [SCOPE.ScriptValue('all_clayne_land')]#! [Concept('counties','графствами')|E]"
 DATAW_unite_clayne_tribes_conquest_tooltip: "Ваши [Concept('vassals','вассалы')|E] будут чаще плести [Concept('scheme','происки')|E] и вступать в направленные против вас [Concept('factions','фракции')|E]\nВы получите значительный штраф к [Concept('opinion','мнению')|E] всех [Concept('vassals','вассалов')|E]\nУровень [Concept('vassal_contract','вассального договора')|E] каждого [Concept('vassal','вассала')|E] повысится на один, если это возможно\nВысокий [Concept('dread','ужас')|E] увеличит [Concept('feudal','феодальные')|E] [Concept('taxes','налоги')|E] и [Concept('levies','ополчение')|E]"
 DATAW_unite_clayne_tribes_mixed_tooltip: "Все ваши [Concept('allies','союзники')|E] станут [Concept('vassals','вассалами')|E] в вашей [Concept('realm','державе')|E]\nВы получите небольшой бонус к [Concept('opinion','мнению')|E] всех [Concept('vassals','вассалов')|E]\nКаждый [Concept('powerful_vassal','могущественный вассал')|E] или [Concept('vassal','вассал')|E], чей [Concept('title_tier','уровень титула')|E] — [Concept('kingdom','королевство')|E], сможет потребовать место в вашем [Concept('council','совете')|E]"
 DATAW_unite_clayne_tribes_peace_tooltip: "Все ваши [Concept('allies','союзники')|E] станут [Concept('vassals','вассалами')|E] в вашей [Concept('realm','державе')|E]\nБудет введено особое [Concept('diarchy','наделение полномочиями')|E], при котором сильнейший [Concept('vassal','вассал')|E] станет [Concept('diarch','диархом')|E]\nВаши [Concept('vassals','вассалы')|E] будут реже плести [Concept('scheme','происки')|E] и вступать в направленные против вас [Concept('factions','фракции')|E]\nВы получите значительный бонус к [Concept('opinion','мнению')|E] всех [Concept('vassals','вассалов')|E]\nКаждый [Concept('powerful_vassal','могущественный вассал')|E] или [Concept('vassal','вассал')|E], чей [Concept('title_tier','уровень титула')|E] — [Concept('kingdom','королевство')|E], кроме [Concept('diarch','диарха')|E], сможет потребовать место в вашем [Concept('council','совете')|E]"
 DATAW_unite_clayne_tribes_before_req_tooltip: "Дополнительные последствия этого [Concept('decision','решения')|E] появятся после выполнения одного из его требований"

 DATAW_unite_brecilian_forest: "Вернуть Бресилианские земли"
 DATAW_unite_brecilian_forest_tooltip: "Вернуть Бресилианские земли"
 DATAW_unite_brecilian_forest_desc: "Сколько существует людская память, бресилианцы живут разобщённо и обособленно. Так продолжается веками, и мы гордимся обычаями, рождёнными нашей жизнью среди духов.\nНо в наши земли вторгаются чужаки: одни поклоняются некоему «Создателю», единственному творцу всего сущего, а другие принадлежат к народу с острыми, словно ножи, ушами. Все они угрожают нашему укладу. Пришло время объединиться, чтобы сохранить его. Отныне бресилианцы и Бруцилис Култас станут единым целым!"
 DATAW_unite_brecilian_forest_confirm: "Духи благоволят нам!"
 DATAW_unite_brecilian_forest_faith_tt: "Ваша [Concept('faith','конфессия')|E] — [GetFaithByKey('brucilis_cultas').GetName] либо создана на её основе"

 DATAW_subjugate_brecilian_forest: "Укрощение варваров"
 DATAW_subjugate_brecilian_forest_tooltip: "Подчинить бресилианцев власти Тевинтера"
 DATAW_subjugate_brecilian_forest_desc: "Когда наш род поселился в этих далёких землях, населённых жестокими варварами-духопоклонниками, будущее казалось безрадостным. Одно из племён оценило наши магические дарования и призвало Нантериев править им, но всё же казалось, что нашему роду суждено исчезнуть, растворившись среди дикарей Юга, именующих себя «бресилианцами». Однако мы не просто выжили — мы достигли процветания и теперь властвуем над духопоклонниками, некогда грозившими нам гибелью. Лес Бресилиан принадлежит нам уже достаточно долго, чтобы никто не мог оспорить это право. Отныне бресилианцев усмирит деспотат, сколь бы далёк он ни был от Империи, а покорными подданными или мятежниками сделает их лишь собственное отношение к нам."
 DATAW_subjugate_brecilian_forest_confirm: "Противящиеся тебе познают гнев небес."
 DATAW_imperial_subjugate_brecilian_forest_tt: "Ваша [Concept('faith','конфессия')|E] — [GetFaithByKey('imperial_chantry').GetName] либо создана на её основе"

 DATAW_a_teyrn_of_the_seas_decision: "Тэйрн морей"
 DATAW_a_teyrn_of_the_seas_decision_tooltip: "Тэйрн морей"
 DATAW_a_teyrn_of_the_seas_decision_desc: "Благодаря выгодному положению у Недремлющего моря Предел Бранделя всегда служил пристанищем для налётчиков, контрабандистов и прочих сомнительных мореходов, бежавших от обременительных законов материка. Теперь местному эрлу удалось объединить Предел Бранделя, и настало время создать здесь особый тэйрнир — державу, обращённую к морю и его возможностям."
 DATAW_a_teyrn_of_the_seas_decision_confirm: "Отныне мы владыки волн и собственной судьбы!"
 DATAW_a_teyrn_of_the_seas_amaranthine: "Если не существует ни тэйрнира [GetTitleByKey('k_highever').GetBaseNameNoTier], ни королевства [GetTitleByKey('e_ferelden').GetBaseNameNoTier], владелец эрлинга [GetTitleByKey('d_amaranthine').GetBaseNameNoTier] должен иметь о вас не менее #P 80#! ед. [Concept('opinion','мнения')|E]."
 DATAW_a_teyrn_of_the_seas_highever: "Если королевства [GetTitleByKey('e_ferelden').GetBaseNameNoTier] не существует, а тэйрнир [GetTitleByKey('k_highever').GetBaseNameNoTier] существует, владелец тэйрнира [GetTitleByKey('k_highever').GetBaseNameNoTier] должен иметь о вас не менее #P 80#! ед. [Concept('opinion','мнения')|E]."
 DATAW_a_teyrn_of_the_seas_ferelden: "Если королевство [GetTitleByKey('e_ferelden').GetBaseNameNoTier] существует, владелец королевства [GetTitleByKey('e_ferelden').GetBaseNameNoTier] должен иметь о вас не менее #P 80#! ед. [Concept('opinion','мнения')|E]."

 steward_promote_culture_DATAW_conversion_boost: "Ускорение смены культуры графства"
 DATAW_only_able_to_create_via_decision: "Этот [Concept('title','титул')|E] можно создать только с помощью особого [Concept('decision','решения')|E]"

 # Unifying the Avvar, by Terra Game

 DATAW_unify_avvar_kingdom_decision:0 "Объединить детей Тирдды Яркой Секиры"
 DATAW_unify_avvar_kingdom_decision_confirm:0 "Пусть земли авваров вновь простираются до Беленаса."
 DATAW_unify_avvar_kingdom_decision_desc:0 "Веками мы следуем пути первой из старейшин — Матери авваров. Подобно ей, мы сражаемся с изнеженными восточными родичами, принявшими чужую веру, тогда как сами остаёмся верны своим корням. Но из-за раздоров между кланами мы редко могли выступить единым фронтом против клейнов. Пришло время показать всему Тедасу, что аввары едины и сильны, объединённые своей и только своей верой! Отныне Эджхолл и Морозные горы станут единым целым. Землёй кланов. Землёй авваров."
 DATAW_unify_avvar_kingdom_decision_tooltip:0 "Аввары объединятся."
 DATAW_unify_avvar_kingdom_decision_effect_tooltip:0 "Аввары объединятся"

 major_decisions.2441.t:0 "Тан танов"
 major_decisions.2441.desc:0 "Впервые последнее слово остаётся не за отдельным таном.\n\nВеками тан был высшей властью во всех делах каждого клана, видевшего Морозные горы и земли за ними.\n\nСегодня эта незыблемая истина пала.\n\nЯ, [ROOT.Char.GetName], [Select_CString(ROOT.Char.IsFemale, 'возвысилась', 'возвысился' )] над всеми прочими кланами и танами. Отныне последнее слово во всех делах принадлежит мне, ибо я — тан танов.\n\nВо имя Корта Отца Гор, Хозяйки Небес и Гаккона Зимодыха я объединяю их владения. Пусть ничто не вечно, но сказание о тане танов старейшины будут пересказывать многие века."
 major_decisions.2441.a:0 "Да здравствуют единые кланы! Да здравствуют аввары!"

 # Unifying the Avvar as a maker follower, by Terra Game

 DATAW_unify_avvar_kingdom_maker_decision:0 "Объединить детей Тирдды Яркой Секиры"
 DATAW_unify_avvar_kingdom_maker_decision_confirm:0 "Благословенны хранители мира, защитники справедливости."
 DATAW_unify_avvar_kingdom_maker_decision_desc:0 "Веками мы следуем пути первой из старейшин — Матери авваров. Подобно ей, мы сражаемся с изнеженными восточными родичами, оставшимися в низинах, пока сами процветаем в горах. Но раздоры между кланами и наша особая вера мешали нам выступить единым фронтом против клейнов и обрекли нас на оторванность от остального Тедаса. Если мы хотим пережить грядущие века и не оказаться под властью чужеземцев, некоторые стороны нашей культуры придётся изменить, чтобы сохранить всё остальное. Во имя Создателя и Андрасте мы объединим Морозные горы и Эджхолл. Андрасте, Маферат и её божественный Супруг явили свет всему Тедасу, и мы последуем их воле."
 DATAW_unify_avvar_kingdom_maker_decision_tooltip:0 "Аввары объединятся."
 DATAW_unify_avvar_kingdom_maker_decision_effect_tooltip:0 "Аввары объединятся"

 major_decisions.2442.t:0 "Горы Создателя"
 major_decisions.2442.desc:0 "Для авваров вера и культура всегда были единым целым.\n\nСказания о Тирдде Яркой Секире, уведшей свой клан в горы; сказания об орле, отыскавшем сердце Корта среди коварных Морозных гор. Истории богов и авварского народа всегда звучали рядом, переплетаясь, пока не стали неразделимы.\n\nСегодня это должно измениться.\n\nПоклонение богам обрекло нас на полное одиночество и сделало мишенью для ненависти всех прочих народов. Чтобы выжить, нам придётся измениться и повторить путь одного из наших сородичей — Маферата, последовав за Создателем и Его Невестой.\n\nСегодня аввары едины. Земля наших предков объединена не во славу Хозяйки Небес или Гаккона Зимодыха, но во имя Создателя и Его Невесты.\n\n«Не отчаивайся, — сказала Она, — ибо твоё предательство было благословлено Создателем и вернуло меня к Нему»."
 major_decisions.2442.a:0 "Я [Select_CString(ROOT.Char.IsFemale, 'прощена', 'прощён' )]."

 # Unifying the Chasind, by Terra Game

 DATAW_unify_chasind_kingdom_decision:0 "Объединить хасиндов"
 DATAW_unify_chasind_kingdom_decision_confirm:0 "Объединить Дикие земли!"
 DATAW_unify_chasind_kingdom_decision_desc:0 "Племена хасиндов редко объединялись под властью одного вождя, но всякий раз становились силой, с которой приходилось считаться.\n\nЕсли найдётся вождь, способный на более прочное объединение, хасинды наконец оставят свой след в истории."
 DATAW_unify_chasind_kingdom_decision_tooltip:0 "Хасинды объединятся."
 DATAW_unify_chasind_kingdom_decision_effect_tooltip:0 "Хасинды объединятся"

# Unify Chasind Event Loc
 major_decisions.2443.t:0 "Земля наших предков"
 major_decisions.2443.desc:0 "С незапамятных времён мой народ странствует по Диким землям.\n\nНашим родичам из холмов и центральной долины родной край кажется коварным и почти непроходимым. Но для народа [GetGlobalVariable('chasind_culture_var').Culture.GetName] он обладает собственной дикой красотой: леса и топи добры к нам и щедро делятся своими дарами. Так зачем же нам жить порознь — каждому племени со своим шаманом, деревней или оплотом, — если история уже показала, сколь многого мы способны достичь вместе?\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'искала', 'искал' )] ответ на этот вопрос, и теперь перед лицом богов им станет мой титул: [GetPlayer.GetTitleAsNameNicknamedNoTooltip]."
 major_decisions.2443.a:0 "Отныне хасинды стоят плечом к плечу!"

 # Unifying the Chasind as a maker follower, by Terra Game

 DATAW_unify_chasind_kingdom_maker_decision:0 "Объединить хасиндов"
 DATAW_unify_chasind_kingdom_maker_decision_confirm:0 "Объединить Дикие земли!"
 DATAW_unify_chasind_kingdom_maker_decision_desc:0 "Племена хасиндов редко объединялись под властью одного вождя, но всякий раз становились силой, с которой приходилось считаться.\n\nЕсли найдётся вождь, способный на более прочное объединение, хасинды наконец оставят свой след в истории."
 DATAW_unify_chasind_kingdom_maker_decision_tooltip:0 "Хасинды объединятся."
 DATAW_unify_chasind_kingdom_maker_decision_effect_tooltip:0 "Хасинды объединятся"

 major_decisions.2444.t:0 "Земля наших предков"
 major_decisions.2444.desc:0 "С незапамятных времён мой народ странствует по Диким землям.\n\nНашим родичам из холмов и центральной долины родной край кажется коварным и почти непроходимым. Но для народа [GetGlobalVariable('chasind_culture_var').Culture.GetName] он обладает собственной дикой красотой: леса и топи добры к нам и щедро делятся своими дарами. Так зачем же нам жить порознь — каждому племени со своим шаманом, деревней или оплотом, — если история уже показала, сколь многого мы способны достичь вместе?\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'искала', 'искал' )] ответ на этот вопрос, и теперь перед Создателем им станет мой титул: [GetPlayer.GetTitleAsNameNicknamedNoTooltip]."
 major_decisions.2444.a:0 "Отныне хасинды стоят плечом к плечу!"

# Unify the Marshes, by Stocky Kruegar
# TODO MAP EXPANSION
 # DATAW_unify_the_marshes_decision: "Объединить топи"
 # DATAW_unify_the_marshes_decision_tooltip: "Заглушка"
 # DATAW_unify_the_marshes_decision_desc: "Текст-заглушка!"
 # DATAW_unify_the_marshes_decision_confirm: "Топи объединятся"
 # DATAW_unify_the_marshes_decision_faith_tt: "Ваша [Concept('faith','конфессия')|E] — [GetFaithByKey('brucilis_cultas').GetName] либо создана на её основе"
 # DATAW_unify_the_marshes_decision_without_orlais: "Вы должны обладать #P независимостью#!"
