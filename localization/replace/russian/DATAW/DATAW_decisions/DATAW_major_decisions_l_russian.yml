 consolidating_edgehall_decision:0 "Упрочить власть над Эджхоллом"
 consolidating_edgehall_decision_desc:0 "После недавнего присоединения Эджхолла нам предстоит немало потрудиться, чтобы закрепить власть над краем. Жители верны новому сюзерену, но многие оплоты и замки ещё необходимо подчинить. Следует разослать по ним воронов и объявить, что отныне они находятся под нашей защитой и должны принести нам присягу как своему новому сюзерену."
 consolidating_edgehall_decision_confirm:0 "Упрочить власть над Эджхоллом!"
 consolidating_edgehall_decision_tooltip:0 "Упрочить власть над Эджхоллом!"

