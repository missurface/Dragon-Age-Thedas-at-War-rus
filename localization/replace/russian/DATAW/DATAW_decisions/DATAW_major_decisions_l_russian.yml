 to_touch_the_sky_decision:0 "Коснуться неба"
 to_touch_the_sky_decision_desc:0 "Мы утвердились в роли новых властителей западной части Морозных гор. Теперь необходимо привести эти земли к покорности."
 to_touch_the_sky_decision_confirm:0 "Разделить добычу!"
 to_touch_the_sky_decision_tooltip:0 "С помощью совета решить, как править новыми землями."


