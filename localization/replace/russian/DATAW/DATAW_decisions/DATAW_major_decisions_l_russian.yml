 they_shall_fear_my_name_decision:0 "Они устрашатся моего имени!"
 they_shall_fear_my_name_decision_desc:0 "Портсмут пал перед Волком Низин, и народ увидел силу моего имени. Теперь предстоит решить, как обратить новообретённое уважение на пользу моим замыслам."
 they_shall_fear_my_name_decision_confirm:0 "Запечатлеть моё имя на этой земле!"
