l_russian:
 investigate_ducarme_orphanage_andrastian: "Расследовать дела приюта Дюкарма"
 DATAW_investigate_ducarme_orphanage_andrastian_desc: "Имя Роберта Дюкарма, «Слуги воли Верховной Жрицы», часто всплывает в разговорах о приюте Дюкарма для долийских детей. Об этом заведении ходит множество слухов, а люди без конца гадают, что же в действительности скрывается за его дверями. Приют окружает слишком много тайн, и происходит там слишком много странного. Расследование следует начать немедленно."
 investigate_ducarme_orphanage_andrastian_confirm: "Тайны Дюкарма будут раскрыты."
 investigate_ducarme_orphanage_andrastian_tooltip: "Раскрыть тайны здания: [GetBuilding('ducarme_orphanage').GetName]"

 investigate_ducarme_orphanage_elvish: "Расследовать дела приюта Дюкарма"
 DATAW_investigate_ducarme_orphanage_elvish_desc: "Наш народ часто проклинает приют Дюкарма. Это ненавистное название и имя его основателя Роберта Дюкарма известны всем — от самых преданных последователей Фен'Харела до верховных хранителей. Пусть [ROOT.Char.GetFaith.HighGodName] направит нас: наконец пришло время разрушить это порочное заведение."
 investigate_ducarme_orphanage_elvish_confirm: "Пятно Дюкарма будет стёрто."
 investigate_ducarme_orphanage_elvish_tooltip: "Раскрыть тайны здания: [GetBuilding('ducarme_orphanage').GetName]"

 visit_halla_vhenasan: "Посетить Галла Венасан"
 DATAW_visit_halla_vhenasan_desc: "Галла Венасан — знаменитая поляна, где галлы собираются в месте, которое считают их колыбелью. Говорят, посещение этой поляны успокаивает разум. Отдых в столь дивном месте наверняка доставит удовольствие."
 visit_halla_vhenasan_confirm: "В Галла Венасан!"
 visit_halla_vhenasan_tooltip: "Исследовать знаменитое место: [GetBuilding('halla_vhenasan_01').GetName]"
