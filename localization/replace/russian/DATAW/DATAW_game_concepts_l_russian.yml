l_russian:
 game_concept_thedas: "Thedas"
 game_concept_thedas_desc: "The name of the continent. The word originates from the Tevinter Imperium."
 game_concept_archdemon: "Archdemon"
 game_concept_archdemon_desc: "An enormous, [blight|E]-corrupted [dragon|E]. They are thought to be the [old_god|E]s, which number seven in total. When [darkspawn|E] find one of these ancient [dragon|E]s, it awakens twisted and corrupted, and leads the [darkspawn|E] in a full-scale invasion of the land: a [blight|E]."
 game_concept_fade: "Fade"
 game_concept_fade_desc: "The realm of [dataw_magic|E], dreams, and [spirits|E], separated from the mortal world by the [veil|E]. The Fade is ever-changing, but one thing remains constant: An unreachable [black_city|E] at its center."
 game_concept_darkspawn: "Darkspawn"
 game_concept_darkspawn_desc: "Monsters created by the [blight|E] as a twisted mockery of the sentient races, hostile to all life. They can be fairly intelligent and use various kinds of war equipment and tactics."
 game_concept_veil: "Veil"
 game_concept_veil_desc: "An invisible mystical barrier that separates the [fade|E] from the mortal world. It prevents [spirits|E] and [demon|E]s from freely traveling to the latter."
 game_concept_chantry: "Chantry"
 game_concept_chantry_desc: "The dominant religion on [thedas|E], mostly practiced by [human|E]s. The Prophet [andraste|E] preached that the [maker|E] created the world and all races, yet abandoned us when mortals started to follow false idols such as the [old_god|E]s. Only when the the [chant_of_light|E] - the sacred scripture of the [religion|E] - is sung from all corners of the world will the [maker|E] return to us."
 game_concept_spirits: "Spirits"
 game_concept_spirits_desc: "[dataw_magic|E]al inhabitants of the [fade|E]. They embody emotions of the mortal mind, such as faith or rage, and lack creative impulses beyond mere mimicry. They can also transform into [demon|E]s and are capable of [demonic_possession|E]."
 game_concept_dwarves: "Dwarves"
 game_concept_dwarves_desc: "A people of short stature who once had a great empire in the [deep_roads|E]. Dwarves are naturally resistant to [lyrium|E] and [dataw_magic|E], but cannot practice [dataw_magic|E] themselves - nor can they dream, as they are not connected to the [fade|E]."
 game_concept_elves: "Elves"
 game_concept_elves_desc: "Descendants of an old empire said to span the entire continent, before its destruction by the Tevinter Imperium. The subsequent enslavement of the elves resulted in the loss of much of their culture over time. The elves were given a new homeland in the Dales for helping [andraste|E] in her fight against the Imperium."
 game_concept_human: "Human"
 game_concept_human_desc: "The dominant race of [thedas|E], humans are extremely divided culturally and politically. They compose most of the nations of the continent."
 game_concept_qunari: "Qunari"
 game_concept_qunari_desc: "A tall horned race typically with gray skin, who come from another unknown continent across the sea. The race consists mostly of followers of the Qun: A very draconian ideology that organizes society like a single, collective organism, with individuals representing mere parts of this body."
 game_concept_dragon: "Dragon"
 game_concept_dragon_desc: "Great flying reptiles, known as fearsome predators. They come in various sizes depending on their age. Depending on the species, Dragons can breathe fire, ice, or even lightning. Many take pride in hunting the beasts."
 game_concept_deep_roads: "Deep Roads"
 game_concept_deep_roads_desc: "A vast network of underground roads built by the ancient dwarven empire, connecting their various buildings, residences, and cities (known as #italic thaigs#!). There are many surface entrances to the Deep Roads, but the system has been overrun by [darkspawn|E] since the time of the First [blight|E]."
 game_concept_vallaslin: "Vallaslin"
 game_concept_vallaslin_desc: "Face tattoos applied by the Dalish [elves|E] to show their allegiance to their chosen god. Each god of the pantheon has a different, associated design, one of which is carved into the elf's face once they reach adulthood. The name roughly translates to #italic blood writing#!."
 game_concept_abomination: "Abomination"
 game_concept_abomination_desc: "[Concept('mage','Mages')|E] possessed by a [demon|E], twisted in both body and mind into an unholy creature. They are known to be extremely powerful, and rampage indiscriminately in their frenzied madness."
 game_concept_mage: "Mage"
 game_concept_mage_desc: "People that are born with the ability to shape [dataw_magic|E]. Mages must train to use their powers and to protect themselves from [demonic_possession|E]."
 game_concept_templar: "Templar"
 game_concept_templar_desc: "Templars are [chantry|E] [knight|E]s trained to use [lyrium|E] to negate [dataw_magic|E]. Since the schism, [mage|E]-controlled Tevinter has begun to deny its templars pure [lyrium|E] - the source of their talents - instead arming them with less potent [lyrium|E]-infused equipment."
 game_concept_grey_warden: "Grey Warden"
 game_concept_grey_warden_desc: "An ancient military order sworn to battle [darkspawn|E] and other monsters, the Wardens undergo secret, unbreakable rites that grant them supernatural powers against the [blight|E]."
 game_concept_divine: "Divine"
 game_concept_divine_desc: "The Divine is the revered head of the [chantry|E], which she oversees from her throne at the Grand Cathedral in Val Royeaux. She is traditionally elected for life by the [grand_cleric|E]s. The first Divine took the throne shortly after the founding of the [chantry|E]."
 game_concept_first_enchanter: "First Enchanter"
 game_concept_first_enchanter_desc: "At the head of each local [circle|E] is a First Enchanter, implicitly the leader of all [Concept('mage','Mages')|E] in that [circle|E]'s jurisdiction. He or she assumes this position for life and retains the right to choose a successor. The First Enchanter determines the course the [circle|E] will take, and chooses which apprentices may be tested and made full [Concept('mage','Mages')|E]. The [knight_commander|E] works most closely with the First Enchanter."
 game_concept_senior_enchanter: "Senior Enchanter"
 game_concept_senior_enchanter_desc: "Assisting the [first_enchanter|E] are the Senior Enchanters, a small council of the most trusted and experienced [Concept('mage','Mages')|E] in the tower. From this group, the next [first_enchanter|E] is always chosen."
 game_concept_wyvern: "Wyvern"
 game_concept_wyvern_desc: "A cousin of the [dragon|E], the wyvern uses its wings to glide rather than fly. It is capable of spitting a lethal venom, and is deemed by many to be a dangerous but worthy hunt."
 game_concept_war_beasts: "War Beasts"
 game_concept_war_beast: "War Beast"
 game_concept_war_beasts_desc: "War Beasts are [men_at_arms|E] typically composed of animals trained for war. While every beasts is unique, they typically excel at countering [skirmishers|E], while they are typically countered by [spearmen|E], capable of holding them at bay."

# TODO
 game_concept_lyrium: "Lyrium"
 game_concept_lyrium_desc: "A substance akin to a blue crystal, found and mined within the earth. In its pure form, it is lethal to most races, with the exception of the naturally resistant [dwarves|E]. Once refined, it can be used by both [Concept('mage','Mages')|E] and [templar|E]s to fuel their abilities. Lyrium is also extremely volatile and is sometimes used for explosives." 
 game_concept_demonic_possession: "Possession"
 game_concept_demonic_possession_desc: "The result of [spirits|E] or [demon|E]s crossing the [veil|E] and bonding with a (living or dead) organism connected to the [fade|E]. [demon|E]s are in the majority of cases drawn to [Concept('mage','Mages')|E], though it is not unheard of for other creatures - with the notable exception of [dwarves|E] - to fall prey as well. A [mage|E], once possessed, typically turns into an [abomination|E]. Trees, animals, and especially corpses are also frequent victims of possession (leading to the majority of the societies of [thedas|E] practicing cremation)."
 game_concept_blight: "Blight" 
 game_concept_blight_desc: "A corrupting disease that kills all lifeforms and spreads throughout the land, creating dangerous creatures known as [darkspawn|E]. The Blight is also a term used when an [archdemon|E] is awakened, regrouping the [darkspawn|E] into an organized horde under its command and leading them in an attack on all life."
 game_concept_old_god: "Old God" 
 game_concept_old_god_desc: "A pantheon of seven ancient [dragon|E]s revered as gods by the Tevinter Imperium, prior to its adoption of the [chantry|E]. The Old Gods rising as [archdemon|E]s during the [blight|E]s has led to a severe decline in the religion's popularity."
 game_concept_warden_commander: "Warden-Commander" 
 game_concept_warden_commander_desc: "The local leader of the [grey_warden|E]s in a designated [region|E]. They nominally answer to the [first_warden|E], although in practice they benefit from a great deal of autonomy."
 game_concept_exalted_march: "Exalted March" 
 game_concept_exalted_march_desc: "A [holy_war|E], called by the [divine|E] against the enemies of the [chantry|E]. The first was called by the Prophet [andraste|E] against the Tevinter Imperium."
 game_concept_right_of_conscription: "Right of Conscription" 
 game_concept_right_of_conscription_desc: "According to old treaties solidified after the First [blight|e], the [grey_warden|E]s may conscript whomever they choose into their order - whether or not they're willing to join. If the recruit is under the authority of another body, that authority is nullified. The [grey_warden|E]s may even recruit someone sentenced to death."
 game_concept_rite_of_tranquility: "Rite of Tranquility" 
 game_concept_rite_of_tranquility_desc: "A measure used as a last resort (typically at the request of the [chantry|E]), the Rite of Tranquility effectively severs a [mage|E]'s ability to perform [dataw_magic|E]. This makes them much less prone to [demonic_possession|E], although very rare cases of possessed [GetTrait('tranquil').GetName( GetNullCharacter )] mages still occur. However, the rite also makes the [mage|E] unable to dream, and renders them completely emotionless."
 game_concept_ogres: "Ogres" 
 game_concept_ogres_desc: "A type of [darkspawn|E] born from a [qunari|E] [broodmother|E]. They typically serve as shock troops due to their size and strength, and are feared throughout [thedas|E]."
 game_concept_broodmother: "Broodmother" 
 game_concept_broodmother_desc: "[darkspawn|E] are born to broodmothers: females of a given race ravaged and [blight|E]ed by the [darkspawn|E] to become horrid creatures. A broodmother will birth thousands of [darkspawn|E] in her lifetime, all variants of her former race."
 game_concept_genlock: "Genlocks" 
 game_concept_genlock_desc: "A type of [darkspawn|E] born from a dwarven [broodmother|E]. The most numerous of the [darkspawn|E], genlocks can typically be found in the [deep_roads|E], although like all [darkspawn|E] they will attack the surface during a [blight|E]. Unlike [dwarves|E], Genlock [emissary|E]s can practice [dataw_magic|E] derived from the [blight|E]." 
 game_concept_hurlock: "Hurlocks"
 game_concept_hurlock_desc: "A type of [darkspawn|E] born from female [human|E]s that were transformed into a [broodmother|E]. Despite not being the most numerous, they are the type typically encountered on the surface."
 game_concept_grand_cleric: "Grand Cleric" 
 game_concept_grand_cleric_desc: "Grand Clerics are powerful representatives of the [divine|E] in regional matters. Each Grand Cleric oversees multiple [temple|E]s in a [region|E] or [city|E], and enjoys the power and influence reserved for their jurisdiction's highest nobility. Together they make up the College of Clerics, which elects the next [divine|E]."
 game_concept_emissary: "Emissary"
 game_concept_emissary_desc: "A type of [darkspawn|E] that usually only appears during a [blight|E]. Emissaries are the only [darkspawn|E] recorded as being capable of speech and employing the use of [dataw_magic|E], albeit powered by the [blight|E] rather than the [fade|E]."
 game_concept_shrieks: "Shrieks"
 game_concept_shrieks_desc: "A type of [darkspawn|E] born from an elven [broodmother|E]. Scholars call them the sharlock, though they are more popularly known as shrieks because of the ear-splitting cries they emit in battle. Renowned as stealthy, fast, and dexterous opponents, these darkspawn assassins use poisoned blades attached to their arms to attack deep behind enemy lines."
 game_concept_joining: "The Joining"
 game_concept_joining_desc: "A ritual a recruit must undergo to become a [grey_warden|E], giving them supernatural abilities to help fight [darkspawn|E]. The ritual's details are kept a secret by the Order."
 game_concept_seekers_of_truth: "Seekers of Truth"
 game_concept_seekers_of_truth_desc: "A small order within the [chantry|E] that traditionally oversees [templar|E] conduct and leads investigations into the most serious matters."
 game_concept_inquisition: "Inquisition"
 game_concept_inquisition_desc: "A now-defunct order that hunted [Concept('mage','Mages')|E] and heretics in the name of the [maker|E]. The Inquisition was a precursor to the [seekers_of_truth|E]."
 game_concept_black_city: "#color_dark_gray Black City#!"
 game_concept_black_city_desc: "An unreachable city at the center of the [fade|E], said to have once been golden, and the seat of either the [maker|E] or the [old_god|E]s (depending on the religious perspective). Once [human|E]s set foot into the #color_goldy_yellow [gold_city|E]#!, it turned black, and the [blight|E] was brought upon the world."
 game_concept_gold_city: "#color_goldy_yellow Golden City#!"
 game_concept_gold_city_desc: "According to the [chant_of_light|E], the #color_dark_gray [black_city|E]#! was once entirely made of gold. At the time, it was the seat of the [maker|E], from which he ruled the [fade|E] and overlooked his creation. However, after the [magister_sidereal|E] managed to force their way into the city, it was tainted black. The sheer arrogance of their presence corrupted the city whole, and the Golden City was gold no longer."
 game_concept_magister_sidereal: "Magister Sidereal"
 game_concept_magister_sidereal_desc: "This group of [Concept('mage','Mages')|E] from Tevinter composed of the high priests of the [old_god|E]s managed to breach the [fade|E] and enter the #color_goldy_yellow [gold_city|E]#!, unknowinly unleashing the [blight|E] upon [thedas|E]."


 game_concept_demon: "Demon"
 game_concept_demon_desc: "Malevolent [spirits|E] embodying negative emotions. To feed on the emotions that created them, demons sow discord and sometimes even attempt [demonic_possession|E]."
 game_concept_maker: "Maker"
 game_concept_maker_desc: "The god worshiped by the [chantry|E], said to have created the [fade|E] and the mortal world, as well as the [spirits|E] and mortals inhabiting them. The Maker first abandoned the world when mankind began worshipping false idols and [demon|E]s such as the [old_god|E]s. Though persuaded to give mortals a second chance, the betrayal and execution of his bride - the prophet [andraste|E] - led him to turn his gaze away once more. It is hoped that if the [chant_of_light|E] is sung from all corners of the world, the Maker will bestow his forgiveness and bring about paradise."
 game_concept_andraste: "Andraste"
 game_concept_andraste_desc: "The prophet whose teachings of the [maker|E] led to the creation of the [chantry|E]. She is also called the Maker's Bride, and led an [exalted_march|E] against the Tevinter Imperium."
 game_concept_chant_of_light: "Chant of Light" 
 game_concept_chant_of_light_desc: "The [chantry|E]'s holy book. It was written by the followers of [andraste|E], with portions said to be penned by the prophet herself."
 game_concept_knight_commander: "Knight-Commander" 
 game_concept_knight_commander_desc: "The leader of the [templar|E]s stationed at a given [circle|E] tower. The Knight-Commander can dispatch templars to watch over [GetTrait('circle_mage').GetName( GetNullCharacter )]s, deal with [GetTrait('apostate').GetName( GetNullCharacter )]s, or even help the local chantries. He or she can also recommend the Right of Annulment, calling for the execution of all [Concept('mage','Mages')|E] in a Circle should it be threatened beyond recovery."
 game_concept_eluvian: "Eluvian" 
 game_concept_eluvian_desc: "An ancient elven mirror of mysterious purpose."
 game_concept_first_warden: "First Warden" 
 game_concept_first_warden_desc: "The official head of the [grey_warden|E]s, the First Warden commands Wardens across [thedas|E] from Weisshaupt Fortress in the [GetGeographicalRegion('world_anderfels').GetName]. He or she maintains the right to summon any or all [warden_commander|E]s to Weisshaupt when necessary. The First Warden has traditionally acted as the Ander king's adviser."
 game_concept_dataw_magic: "Magic"
 game_concept_dataw_magic_desc: "Magic is the term used for the extraordinary acts a [mage|E] can do by drawing power from the [fade|E] to influence the world around them. Due to the way [Concept('mage','Mages')|E] interact with the [fade|E], Magic makes them a prime target for [demonic_possession|E]."
 game_concept_dataw_magical_prowess: "Magical Prowess"
 game_concept_dataw_magical_prowess_desc: "Magical Prowess indicates how good a character is at utilizing [dataw_magic|E] in its different forms, be it in combat or else. A high Magical Prowess is important for all types of [Concept('mage','Mages')|E], since it increases their ability of casting various spells, regenerating [dataw_mana|E], and the speed it takes to learn new spells."
 game_concept_dataw_magical_resistance: "Magical Resistance"
 game_concept_dataw_magical_resistance_desc: "Magical Resistance is the chance of hostile spells to fail, preventing their effects altogether, be it combat related or general spell casting. The higher a character's magical resistance is, the more protected they are from the dangers of hostile spells. A very important stat for characters who plan to combat mages or have mages as rivals."
 game_concept_dataw_mana: "Mana"
 game_concept_dataw_mana_desc: "Mana is a nebulous concept used to refer to the magical reserves a [mage|E] possesses to cast spells. The more mana a [mage|E] has, the more spells the [mage|E] will be able to cast. #N Blood magic#! also allows blood to act as a substitute to mana."
 game_concept_dog_lords: "Dog Lords"
 game_concept_dog_lord: "Dog Lord"
 game_concept_dog_lord_desc: "Dataw placeholder - Lords in ferelden"
 game_concept_war_of_the_crowns: "War of Crowns"
 game_concept_war_of_the_crowns_desc: "DATAW Placeholder - Era after caedmon demise lasting until Calehad Theirin united Ferelden GAMEPLAY wise, grants claims to titles to clayne rulers in random time intervals and makes ai more agressive"
 game_concept_elvhen: "Elvhen"
 game_concept_elvhen_desc: "An ancient word from Arlathan meaning of the people. Amongst the Dalish, this word is how they refer to themselves collectively."
 game_concept_emerald_knights: "Emerald Knights"
 game_concept_emerald_knights_desc: "A holy order of [elves|E] who patrol the border of the Dales. They are sworn to protect the realm from any who would threaten the Dalish way of life. Whether those threats are soldiers or priests, they turn away all who are not [elvhen|E]."
 game_concept_fade_hunter: "Fade Hunter"
 game_concept_fade_hunter_desc: "A branch of the [emerald_knights|E] dedicated to the task of stopping possessed mages and illegal [dataw_magic|E]. They have often been compared to the [templar|E]s due to their similar role."
 game_concept_shem: "Shem"
 game_concept_shem_desc: "Short for [shemlen|E], it is a derogatory Elven term used to describe [human|E]s. Literally means "quick"."
 game_concept_shemlen: "Shemlen"
 game_concept_shemlen_desc: "A derogatory term used by [elves|E] to describe [human|E]s."
 game_concept_halla: "Halla"
 game_concept_halla_desc: "An animal that closely resembles a deer which many [elvhen|E] believe was created by the [evanuris|E]. This holy animal, while often used as a beast of labor, is considered holy and fiercely protected. To harm a halla is to bring the wrath of the gods upon oneself."
 game_concept_evanuris: "Evanuris"
 game_concept_evanuris_desc: "The term used to describe the pantheon of [elvhen|E] gods."
 game_concept_battle_of_valarian_fields: "Battle of Valarian Fields"
 game_concept_battle_of_valarian_fields_desc: "The Battle of Valarian Fields took place in -171 Ancient, where the Alamarri army, led by [andraste|E] and Maferath, joined forces with [elves|E] formerly slaves led by Shartan to advance further into the heart of the Imperium. This battle marked their first major challenge against Tevinter, as it rapidly shifted from siege to open combat. Ultimately, the Alamarri and elven forces emerged victorious, defeating Tevinter's greatest army; all Andrastians believe the [maker|E] smiled upon his children that day." #wip
 game_concept_battle_of_starkhaven: "Battle of Starkhaven"
 game_concept_battle_of_starkhaven_desc: "In 1:95 Divine, the final battle of the Second [blight|E] occurred in Starkhaven, where [grey_warden|E]s led an army against the [darkspawn|E]. They set a trap for the [archdemon|E] Zazikel, who was aware of their plan and surrounded them on all sides. After heavy casualties, [grey_warden|E] Corin defeated Zazikel, with his [mage|E] lover, Neriah, sacrificing herself to save him from a deadly attack. Corin was then able to fight his way to Zazkiel, striking a final blow, killing both himself and the [old_god|E], ending the Second [blight|E]." #wip




 game_concept_religion_desc: "A $game_concept_religion$ can consist of many different denominations, called [faiths|E]. Religions, in turn, belong to one of four larger [religious_families|E]; [GetReligionFamily('rf_alamarri_paganism').GetName], [GetReligionFamily('rf_ciriane_paganism').GetName], [GetReligionFamily('rf_andrastianism').GetName] or [GetReligionFamily('rf_elven_paganism').GetName]."

