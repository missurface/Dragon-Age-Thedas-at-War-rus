l_russian:
 game_concept_thedas: "Тедас"
 game_concept_thedas_desc: "Так называется континент. Само слово берёт начало в Тевинтерской империи."
 game_concept_archdemon: "Архидемон"
 game_concept_archdemon_desc: "Огромный [Concept('dragon','дракон')|E], осквернённый [Concept('blight','скверной')|E]. Считается, что архидемоны — это [Concept('old_god','Древние Боги')|E], которых всего семь. Когда [Concept('darkspawn','порождения тьмы')|E] находят одного из этих древних [Concept('dragon','драконов')|E], тот пробуждается искажённым и осквернённым и ведёт [Concept('darkspawn','порождения тьмы')|E] в полномасштабное вторжение на поверхность — [Concept('blight','Мор')|E]."
 game_concept_fade: "Тень"
 game_concept_fade_desc: "Царство [Concept('dataw_magic','магии')|E], снов и [Concept('spirits','духов')|E], отделённое от мира смертных [Concept('veil','Завесой')|E]. Тень непрестанно меняется, однако одно остаётся неизменным: в самом её центре находится недостижимый [black_city|E]."
 game_concept_darkspawn: "Порождения тьмы"
 game_concept_darkspawn_desc: "Чудовища, созданные [Concept('blight','скверной')|E] как извращённая насмешка над разумными расами и враждебные всему живому. Они могут быть весьма разумны и применять разнообразное военное снаряжение и тактику."
 game_concept_veil: "Завеса"
 game_concept_veil_desc: "Невидимый мистический барьер, отделяющий [Concept('fade','Тень')|E] от мира смертных. Он не позволяет [Concept('spirits','духам')|E] и [Concept('demon','демонам')|E] свободно проникать в мир смертных."
 game_concept_chantry: "Церковь"
 game_concept_chantry_desc: "Главенствующая религия [Concept('thedas','Тедаса')|E], которую исповедует большинство [Concept('human','людей')|E]. Пророчица [andraste|E] учила, что [maker|E] сотворил мир и все расы, но покинул нас, когда смертные начали поклоняться ложным идолам, таким как [Concept('old_god','Древние Боги')|E]. Лишь когда [chant_of_light|E] — священное писание [Concept('religion','религии')|E] — прозвучит во всех уголках мира, [maker|E] вернётся к нам."
 game_concept_spirits: "Духи"
 game_concept_spirits_desc: "[Concept('dataw_magic','Магические')|E] обитатели [Concept('fade','Тени')|E]. Они воплощают чувства смертных, такие как вера или ярость, и не способны творить сами, а лишь подражают. Духи также могут превращаться в [Concept('demon','демонов')|E] и способны к [Concept('demonic_possession','одержимости')|E]."
 game_concept_dwarves: "Гномы"
 game_concept_dwarves_desc: "Низкорослый народ, некогда владевший великой империей на [Concept('deep_roads','Глубинных тропах')|E]. Гномы от природы устойчивы к [Concept('lyrium','лириуму')|E] и [Concept('dataw_magic','магии')|E], но сами не способны практиковать [Concept('dataw_magic','магию')|E] и не видят снов, поскольку не связаны с [Concept('fade','Тенью')|E]."
 game_concept_elves: "Эльфы"
 game_concept_elves_desc: "Потомки древней империи, которая, по преданиям, простиралась на весь континент, пока её не уничтожила Тевинтерская империя. Последовавшее за этим порабощение эльфов со временем привело к утрате значительной части их культуры. За помощь [andraste|E] в борьбе против Империи эльфам была дарована новая родина в Долах."
 game_concept_human: "Человек"
 game_concept_human_desc: "Господствующая раса [Concept('thedas','Тедаса')|E]. Люди крайне разобщены культурно и политически и составляют большинство населения государств континента."
 game_concept_qunari: "Кунари"
 game_concept_qunari_desc: "Высокая рогатая раса, обычно с серой кожей, прибывшая с другого, неизвестного континента за морем. Большинство её представителей следует Куну — крайне суровой идеологии, организующей общество подобно единому коллективному организму, где каждая личность является лишь частью общего тела."
 game_concept_dragon: "Дракон"
 game_concept_dragon_desc: "Огромные летающие рептилии, известные как грозные хищники. Их размеры зависят от возраста. В зависимости от вида драконы способны извергать огонь, лёд или даже молнии. Многие гордятся охотой на этих зверей."
 game_concept_deep_roads: "Глубинные тропы"
 game_concept_deep_roads_desc: "Огромная сеть подземных дорог, построенная древней гномьей империей и соединявшая её многочисленные строения, поселения и города, известные как #italic тейги#!. На Глубинные тропы ведёт множество входов с поверхности, однако со времён Первого [Concept('blight','Мора')|E] их захватили [Concept('darkspawn','порождения тьмы')|E]."
 game_concept_vallaslin: "Валласлин"
 game_concept_vallaslin_desc: "Лицевые татуировки, которые долийские [Concept('elves','эльфы')|E] наносят в знак верности избранному божеству. Каждому богу пантеона соответствует свой узор, вырезаемый на лице эльфа после достижения совершеннолетия. Название приблизительно переводится как #italic письмо на крови#!."
 game_concept_abomination: "Одержимый"
 game_concept_abomination_desc: "Одержимый — [Concept('mage','маг')|E], которым завладел [Concept('demon','демон')|E], исказивший его тело и разум и превративший в нечестивое создание. Одержимые чрезвычайно могущественны и в безумной ярости убивают всех без разбора."
 game_concept_mage: "Маг"
 game_concept_mage_desc: "Люди, от рождения способные управлять [Concept('dataw_magic','магией')|E]. Маги должны учиться владеть своими силами и защищать себя от [Concept('demonic_possession','одержимости')|E]."
 game_concept_templar: "Храмовник"
 game_concept_templar_desc: "Храмовники — [Concept('knight','рыцари')|E] [Concept('chantry','Церкви')|E], обученные с помощью [Concept('lyrium','лириума')|E] нейтрализовать [Concept('dataw_magic','магию')|E]. После раскола управляемый [Concept('mage','магами')|E] Тевинтер начал отказывать своим храмовникам в чистом [Concept('lyrium','лириуме')|E] — источнике их способностей, — вместо этого вооружая их менее действенным снаряжением, пропитанным [Concept('lyrium','лириумом')|E]."
 game_concept_grey_warden: "Серый Страж"
 game_concept_grey_warden_desc: "Члены древнего воинского ордена, поклявшегося сражаться с [Concept('darkspawn','порождениями тьмы')|E] и другими чудовищами. Стражи проходят тайные необратимые обряды, дарующие им сверхъестественные силы для борьбы с [Concept('blight','Мором')|E]."
 game_concept_divine: "Верховная Жрица"
 game_concept_divine_desc: "Верховная Жрица — почитаемая глава [Concept('chantry','Церкви')|E], управляющая ею из Великого Собора в Вал Руайо. Её пожизненно избирают [Concept('grand_cleric','Владычицы Церкви')|E]. Первая Верховная Жрица взошла на престол вскоре после основания [Concept('chantry','Церкви')|E]."
 game_concept_first_enchanter: "Первый чародей"
 game_concept_first_enchanter_desc: "Во главе каждого местного [Concept('circle','Круга')|E] стоит Первый чародей — фактический предводитель всех [Concept('mage','магов')|E], находящихся в ведении этого [Concept('circle','Круга')|E]. Назначение является пожизненным, и Первый чародей сохраняет право выбрать преемника. Первый чародей определяет путь [Concept('circle','Круга')|E] и решает, какие ученики могут пройти испытание и стать полноправными [Concept('mage','магами')|E]. Теснее всего с Первым чародеем сотрудничает [knight_commander|E]."
 game_concept_senior_enchanter: "Старший чародей"
 game_concept_senior_enchanter_desc: "[Concept('first_enchanter','Первому чародею')|E] помогают Старшие чародеи — небольшой совет самых доверенных и опытных [Concept('mage','магов')|E] башни. Следующего [Concept('first_enchanter','Первого чародея')|E] неизменно выбирают из их числа."
 game_concept_wyvern: "Виверн"
 game_concept_wyvern_desc: "Родич [Concept('dragon','дракона')|E], использующий крылья для парения, а не для настоящего полёта. Виверн способен плеваться смертельным ядом и считается опасной, но достойной добычей."
 game_concept_war_beasts: "Боевые звери"
 game_concept_war_beast: "Боевой зверь"
 game_concept_war_beasts_desc: "Боевые звери — это [Concept('men_at_arms','профессиональные войска')|E], обычно состоящие из животных, обученных для войны. Каждый такой зверь по-своему уникален, однако обычно они особенно эффективны против [Concept('skirmishers','застрельщиков')|E], а сдерживать их лучше всего умеют [Concept('spearmen','копейщики')|E]."

# TODO
 game_concept_lyrium: "Лириум"
 game_concept_lyrium_desc: "Вещество, похожее на синий кристалл, которое находят и добывают под землёй. В чистом виде оно смертельно для большинства рас, за исключением обладающих природной устойчивостью [Concept('dwarves','гномов')|E]. После обработки [Concept('mage','маги')|E] и [Concept('templar','храмовники')|E] могут использовать его как источник своих способностей. Лириум также крайне нестабилен и порой применяется во взрывчатых веществах." 
 game_concept_demonic_possession: "Одержимость"
 game_concept_demonic_possession_desc: "Результат перехода [Concept('spirits','духов')|E] или [Concept('demon','демонов')|E] через [Concept('veil','Завесу')|E] и их слияния с живым либо мёртвым организмом, связанным с [Concept('fade','Тенью')|E]. В подавляющем большинстве случаев [Concept('demon','демонов')|E] привлекают [Concept('mage','маги')|E], хотя их жертвами могут стать и другие существа — за примечательным исключением [Concept('dwarves','гномов')|E]. Одержимый [Concept('mage','маг')|E] обычно превращается в [Concept('abomination','одержимого')|E]. Частыми жертвами одержимости также становятся деревья, животные и особенно трупы, поэтому в большинстве обществ [Concept('thedas','Тедаса')|E] принято кремировать умерших."
 game_concept_blight: "Мор" 
 game_concept_blight_desc: "Скверна — губительная зараза, которая убивает всё живое, распространяется по земле и порождает опасных существ, известных как [Concept('darkspawn','порождения тьмы')|E]. Мором также называют нашествие, которое начинается, когда пробуждается [Concept('archdemon','Архидемон')|E]: тот объединяет [Concept('darkspawn','порождения тьмы')|E] в организованную орду, подчиняет её себе и ведёт в поход против всего живого."
 game_concept_old_god: "Древний Бог" 
 game_concept_old_god_desc: "Пантеон семи древних [Concept('dragon','драконов')|E], которым Тевинтерская империя поклонялась как богам до принятия [Concept('chantry','Церкви')|E]. Пробуждение Древних Богов в облике [Concept('archdemon','Архидемонов')|E] во время [Concept('blight','Моров')|E] привело к резкому упадку популярности этой религии."
 game_concept_warden_commander: "Страж-командор" 
 game_concept_warden_commander_desc: "Местный глава [Concept('grey_warden','Серых Стражей')|E] в определённом [Concept('region','регионе')|E]. Формально Стражи-командоры подчиняются [Concept('first_warden','Первому Стражу')|E], но на деле обладают значительной автономией."
 game_concept_exalted_march: "Священный поход" 
 game_concept_exalted_march_desc: "[Concept('holy_war','Священная война')|E], объявляемая [Concept('divine','Верховной Жрицей')|E] против врагов [Concept('chantry','Церкви')|E]. Первый такой поход пророчица [andraste|E] объявила против Тевинтерской империи."
 game_concept_right_of_conscription: "Право Призыва" 
 game_concept_right_of_conscription_desc: "Согласно древним договорам, заключённым после Первого [Concept('blight','Мора')|E], [Concept('grey_warden','Серые Стражи')|E] вправе призвать в орден любого по своему выбору — независимо от желания новобранца. Если тот подчинён иной власти, её полномочия отменяются. [Concept('grey_warden','Серые Стражи')|E] могут призвать даже приговорённого к смерти."
 game_concept_rite_of_tranquility: "Ритуал Усмирения" 
 game_concept_rite_of_tranquility_desc: "Крайняя мера, обычно применяемая по требованию [Concept('chantry','Церкви')|E]: Ритуал Усмирения полностью лишает [Concept('mage','мага')|E] способности пользоваться [Concept('dataw_magic','магией')|E]. Это значительно снижает риск [Concept('demonic_possession','одержимости')|E], хотя в редчайших случаях одержимость встречается даже среди обладателей черты «[GetTrait('tranquil').GetName( GetNullCharacter )]». Однако ритуал также лишает [Concept('mage','мага')|E] способности видеть сны и полностью подавляет эмоции."
 game_concept_ogres: "Огры" 
 game_concept_ogres_desc: "Разновидность [Concept('darkspawn','порождений тьмы')|E], рождаемая [Concept('broodmother','маткой')|E]-[Concept('qunari','кунари')|E]. Благодаря размерам и силе огры обычно служат ударными войсками, и их боятся по всему [Concept('thedas','Тедасу')|E]."
 game_concept_broodmother: "Матка" 
 game_concept_broodmother_desc: "[Concept('darkspawn','Порождения тьмы')|E] рождаются от маток — женщин разных рас, истерзанных [Concept('darkspawn','порождениями тьмы')|E] и заражённых [Concept('blight','скверной')|E], которая превращает их в чудовищ. За свою жизнь матка рождает тысячи [Concept('darkspawn','порождений тьмы')|E], и все они принадлежат к разновидности, соответствующей её прежней расе."
 game_concept_genlock: "Генлоки" 
 game_concept_genlock_desc: "Разновидность [Concept('darkspawn','порождений тьмы')|E], рождаемая гномьей [Concept('broodmother','маткой')|E]. Генлоки — самые многочисленные среди [Concept('darkspawn','порождений тьмы')|E]; обычно они встречаются на [Concept('deep_roads','Глубинных тропах')|E], хотя, как и все [Concept('darkspawn','порождения тьмы')|E], во время [Concept('blight','Мора')|E] выходят на поверхность. В отличие от [Concept('dwarves','гномов')|E], [Concept('emissary','генлоки-эмиссары')|E] способны владеть [Concept('dataw_magic','магией')|E], питаемой [Concept('blight','скверной')|E]." 
 game_concept_hurlock: "Гарлоки"
 game_concept_hurlock_desc: "Разновидность [Concept('darkspawn','порождений тьмы')|E], рождаемая [Concept('broodmother','матками')|E], в которых превратили женщин [Concept('human','человеческой расы')|E]. Гарлоки не самые многочисленные, но именно с ними чаще всего сталкиваются на поверхности."
 game_concept_grand_cleric: "Владычица Церкви" 
 game_concept_grand_cleric_desc: "Владычицы Церкви — влиятельные представительницы [Concept('divine','Верховной Жрицы')|E] в делах регионов. Каждая Владычица надзирает за несколькими [Concept('temple','храмами')|E] в [Concept('region','регионе')|E] или [Concept('city','городе')|E] и обладает властью и влиянием, подобающими высшей знати своей юрисдикции. Вместе они образуют Коллегию клириков, избирающую следующую [Concept('divine','Верховную Жрицу')|E]."
 game_concept_emissary: "Эмиссар"
 game_concept_emissary_desc: "Разновидность [Concept('darkspawn','порождений тьмы')|E], обычно появляющаяся лишь во время [Concept('blight','Мора')|E]. Эмиссары — единственные [Concept('darkspawn','порождения тьмы')|E], которые, согласно свидетельствам, способны говорить и пользоваться [Concept('dataw_magic','магией')|E], хотя её источником служит [Concept('blight','скверна')|E], а не [Concept('fade','Тень')|E]."
 game_concept_shrieks: "Крикуны"
 game_concept_shrieks_desc: "Разновидность [Concept('darkspawn','порождений тьмы')|E], рождаемая эльфийской [Concept('broodmother','маткой')|E]. Учёные называют их шарлоками, но шире они известны как крикуны из-за оглушительных воплей, издаваемых в бою. Прославившиеся скрытностью, быстротой и ловкостью убийцы используют закреплённые на руках отравленные клинки, чтобы наносить удары глубоко в тылу врага."
 game_concept_joining: "Посвящение"
 game_concept_joining_desc: "Ритуал, который должен пройти рекрут, чтобы стать [Concept('grey_warden','Серым Стражем')|E] и обрести сверхъестественные способности, помогающие сражаться с [Concept('darkspawn','порождениями тьмы')|E]. Подробности ритуала Орден хранит в тайне."
 game_concept_seekers_of_truth: "Искатели Истины"
 game_concept_seekers_of_truth_desc: "Небольшой орден в составе [Concept('chantry','Церкви')|E], который традиционно надзирает за поведением [Concept('templar','храмовников')|E] и расследует наиболее серьёзные дела."
 game_concept_inquisition: "Инквизиция"
 game_concept_inquisition_desc: "Ныне распущенный орден, охотившийся на [Concept('mage','магов')|E] и еретиков во имя [Concept('maker','Создателя')|E]. Инквизиция была предшественницей [Concept('seekers_of_truth','Искателей Истины')|E]."
 game_concept_black_city: "#color_dark_gray Чёрный Город#!"
 game_concept_black_city_desc: "Недостижимый город в центре [Concept('fade','Тени')|E], который, как считается, некогда был золотым и служил престолом либо [Concept('maker','Создателя')|E], либо [Concept('old_god','Древних Богов')|E] — в зависимости от религиозных воззрений. Когда [Concept('human','люди')|E] ступили в #color_goldy_yellow [Concept('gold_city','Золотой Город')|E]#!, он почернел, а на мир обрушился [Concept('blight','Мор')|E]."
 game_concept_gold_city: "#color_goldy_yellow Золотой Город#!"
 game_concept_gold_city_desc: "Согласно [Concept('chant_of_light','Песни Света')|E], #color_dark_gray [Concept('black_city','Чёрный Город')|E]#! некогда целиком состоял из золота. Тогда он был престолом [Concept('maker','Создателя')|E], откуда Тот правил [Concept('fade','Тенью')|E] и взирал на Своё творение. Однако после того как [Concept('magister_sidereal','Магистры Звёздного Синода')|E] силой проникли в город, тот почернел от скверны. Чудовищная гордыня пришельцев осквернила его целиком, и Золотой Город навсегда утратил своё золото."
 game_concept_magister_sidereal: "Магистры Звёздного Синода"
 game_concept_magister_sidereal_desc: "Эта группа [Concept('mage','тевинтерских магов')|E], состоявшая из верховных жрецов [Concept('old_god','Древних Богов')|E], сумела прорваться в [Concept('fade','Тень')|E] и проникнуть в #color_goldy_yellow [Concept('gold_city','Золотой Город')|E]#!, невольно выпустив [Concept('blight','скверну')|E] в [Concept('thedas','Тедас')|E]."


 game_concept_demon: "Демон"
 game_concept_demon_desc: "Злобные [Concept('spirits','духи')|E], воплощающие отрицательные эмоции. Чтобы питаться породившими их чувствами, демоны сеют раздор и порой пытаются вызвать [Concept('demonic_possession','одержимость')|E]."
 game_concept_maker: "Создатель"
 game_concept_maker_desc: "Бог, почитаемый [Concept('chantry','Церковью')|E]. Считается, что Он сотворил [Concept('fade','Тень')|E] и мир смертных, а также обитающих в них [Concept('spirits','духов')|E] и смертных. Впервые Создатель отвернулся от мира, когда человечество стало поклоняться ложным идолам и [Concept('demon','демонам')|E], таким как [Concept('old_god','Древние Боги')|E]. Его убедили дать смертным второй шанс, но предательство и казнь Его невесты, пророчицы [andraste|E], заставили Его вновь отвести взор. Верующие надеются, что, когда [chant_of_light|E] прозвучит во всех уголках мира, Создатель дарует смертным прощение и воцарит рай."
 game_concept_andraste: "Андрасте"
 game_concept_andraste_desc: "Пророчица, чьё учение о [Concept('maker','Создателе')|E] привело к созданию [Concept('chantry','Церкви')|E]. Её также называют Невестой Создателя; она возглавила [Concept('exalted_march','Священный поход')|E] против Тевинтерской империи."
 game_concept_chant_of_light: "Песнь Света" 
 game_concept_chant_of_light_desc: "Священная книга [Concept('chantry','Церкви')|E]. Она была написана последователями [andraste|E]; некоторые её части, как считается, принадлежат перу самой пророчицы."
 game_concept_knight_commander: "Рыцарь-командор" 
 game_concept_knight_commander_desc: "Глава [Concept('templar','храмовников')|E], размещённых в башне определённого [Concept('circle','Круга')|E]. Рыцарь-командор может направлять подчинённых надзирать за обладателями статуса «[GetTrait('circle_mage').GetName( GetNullCharacter )]», разыскивать обладателей статуса «[GetTrait('apostate').GetName( GetNullCharacter )]» или даже помогать местным церквям. Рыцарь-командор также может ходатайствовать о применении Права Уничтожения, то есть о казни всех [Concept('mage','магов')|E] Круга, если угрозу уже невозможно устранить иначе."
 game_concept_eluvian: "Элувиан" 
 game_concept_eluvian_desc: "Древнее эльфийское зеркало таинственного назначения."
 game_concept_first_warden: "Первый Страж" 
 game_concept_first_warden_desc: "Официальный глава [Concept('grey_warden','Серых Стражей')|E], Первый Страж руководит Стражами по всему [Concept('thedas','Тедасу')|E] из крепости Вейсхаупт в землях, известных как [GetGeographicalRegion('world_anderfels').GetName]. При необходимости Первый Страж вправе созвать в Вейсхаупт кого угодно из [Concept('warden_commander','Стражей-командоров')|E] — вплоть до всех сразу. По традиции Первый Страж также служит советником короля Андерфелса."
 game_concept_dataw_magic: "Магия"
 game_concept_dataw_magic_desc: "Магией называют необычайные деяния, которые [Concept('mage','маг')|E] совершает, черпая силу из [Concept('fade','Тени')|E] и воздействуя на окружающий мир. Из-за того, как [Concept('mage','маги')|E] взаимодействуют с [Concept('fade','Тенью')|E], они становятся главными целями для [Concept('demonic_possession','одержимости')|E]."
 game_concept_dataw_magical_prowess: "Магическое мастерство"
 game_concept_dataw_magical_prowess_desc: "Магическое мастерство показывает, насколько хорошо персонаж владеет различными формами [Concept('dataw_magic','магии')|E] — как в бою, так и за его пределами. Высокое Магическое мастерство важно для всех [Concept('mage','магов')|E], поскольку позволяет им успешнее творить различные заклинания, восстанавливать [Concept('dataw_mana','ману')|E] и быстрее осваивать новые заклинания."
 game_concept_dataw_magical_resistance: "Сопротивление магии"
 game_concept_dataw_magical_resistance_desc: "Сопротивление магии — вероятность того, что враждебное заклинание не сработает и его эффект будет полностью предотвращён, будь то боевое или иное колдовство. Чем выше сопротивление персонажа, тем надёжнее защита от опасности вражеских заклинаний. Этот показатель крайне важен для тех, кто намерен сражаться с магами или враждует с ними."
 game_concept_dataw_mana: "Мана"
 game_concept_dataw_mana_desc: "Мана — условное понятие, обозначающее запас магической энергии, которым [Concept('mage','маг')|E] располагает для сотворения заклинаний. Чем больше маны у [Concept('mage','мага')|E], тем больше заклинаний этот [Concept('mage','маг')|E] сможет сотворить. #N Магия крови#! также позволяет использовать кровь вместо маны."
 game_concept_dog_lords: "Собачьи лорды"
 game_concept_dog_lord: "Собачий лорд"
 game_concept_dog_lord_desc: "Заглушка DATAW — лорды Ферелдена."
 game_concept_war_of_the_crowns: "Война Корон"
 game_concept_war_of_the_crowns_desc: "Заглушка DATAW — эпоха после смерти Каэдмона, продолжавшаяся до объединения Ферелдена Каленхадом Тейрином. В игровом отношении в этот период правители-клейны через случайные промежутки времени получают притязания на титулы, а ИИ действует агрессивнее."
 game_concept_elvhen: "Элвен"
 game_concept_elvhen_desc: "Древнее слово из Арлатана, означающее «народ». Долийцы используют его как собирательное самоназвание."
 game_concept_emerald_knights: "Изумрудные рыцари"
 game_concept_emerald_knights_desc: "Священный орден [Concept('elves','эльфов')|E], патрулирующий границы Долов. Его члены поклялись защищать королевство от всех, кто угрожает долийскому укладу. Кем бы ни были нарушители — солдатами или жрецами, — рыцари не пропускают никого, кто не принадлежит к [Concept('elvhen','элвенам')|E]."
 game_concept_fade_hunter: "Охотник Тени"
 game_concept_fade_hunter_desc: "Ответвление [Concept('emerald_knights','Изумрудных рыцарей')|E], посвятившее себя борьбе с одержимыми магами и незаконным применением [Concept('dataw_magic','магии')|E]. Из-за схожести обязанностей Охотников Тени часто сравнивают с [Concept('templar','храмовниками')|E]."
 game_concept_shem: "Шем"
 game_concept_shem_desc: "Сокращение от слова [Concept('shemlen','шемлен')|E]. Уничижительное эльфийское название [Concept('human','людей')|E], буквально означающее «быстрый»."
 game_concept_shemlen: "Шемлен"
 game_concept_shemlen_desc: "Уничижительное слово, которым [Concept('elves','эльфы')|E] называют [Concept('human','людей')|E]."
 game_concept_halla: "Галла"
 game_concept_halla_desc: "Галла — животное, очень похожее на оленя, которое, по вере многих [Concept('elvhen','элвенов')|E], было создано [Concept('evanuris','эванурисами')|E]. Хотя галл часто используют как тягловых животных, их почитают как священных и яростно защищают. Навредить галле — значит навлечь на себя гнев богов."
 game_concept_evanuris: "Эванурисы"
 game_concept_evanuris_desc: "Так называют пантеон богов [Concept('elvhen','элвенов')|E]."
 game_concept_battle_of_valarian_fields: "Битва на Валарианских полях"
 game_concept_battle_of_valarian_fields_desc: "Битва на Валарианских полях произошла в -171 году Древней эры. Армия аламарри под предводительством [andraste|E] и Маферата объединилась с войском бывших рабов-[Concept('elves','эльфов')|E] во главе с Шартаном, чтобы продвинуться в самое сердце Империи. В этой битве они впервые столкнулись с серьёзным сопротивлением Тевинтера: осада быстро переросла в открытое сражение. В конечном счёте аламарри и эльфы одержали победу, разгромив величайшую армию Тевинтера; все андрастиане верят, что в тот день [maker|E] улыбнулся Своим детям." #wip
 game_concept_battle_of_starkhaven: "Сражение за Старкхэвен"
 game_concept_battle_of_starkhaven_desc: "В 1:95 году Божественного века под Старкхэвеном состоялась последняя битва Второго [Concept('blight','Мора')|E], в которой [Concept('grey_warden','Серые Стражи')|E] повели войско против [Concept('darkspawn','порождений тьмы')|E]. Они подготовили ловушку для [Concept('archdemon','Архидемона')|E] Зазикеля, но тот узнал об их замысле и окружил войско со всех сторон. После тяжёлых потерь [Concept('grey_warden','Серый Страж')|E] Корин сразил Зазикеля; его возлюбленная, [Concept('mage','маг')|E] Нерия, пожертвовала собой, заслонив Корина от смертельной атаки. Благодаря этому Корин пробился к Зазикелю и нанёс решающий удар, который убил и его самого, и [Concept('old_god','Древнего Бога')|E], положив конец Второму [Concept('blight','Мору')|E]." #wip




 game_concept_religion_desc: "Одна $game_concept_religion$ может объединять множество различных конфессий, называемых [Concept('faiths','конфессиями')|E]. Сами религии, в свою очередь, относятся к одной из четырёх [Concept('religious_families','религиозных концепций')|E]: [GetReligionFamily('rf_alamarri_paganism').GetName], [GetReligionFamily('rf_ciriane_paganism').GetName], [GetReligionFamily('rf_andrastianism').GetName] или [GetReligionFamily('rf_elven_paganism').GetName]."

