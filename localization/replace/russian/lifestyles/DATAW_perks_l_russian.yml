l_russian:
 # Martial: Strategy Tree
 ciriane_tactics_perk_name: "Цирианская тактика"
#Magic: Primal Tree
 primal_apprentice_perk_name: "Ученик стихийной магии" # I think that this should be commented out?
 primal_apprentice_perk_effect: "Это заклинание ещё не реализовано! В будущем оно появится, а пока присоединяйтесь к команде, чтобы ускорить работу!"
 flame_blast_perk_name: "Пламенная вспышка"
 flame_blast_perk_effect: "Направьте на цель конус пламени, снижая её здоровье, доблесть и сопротивление болезням."
 lightning_shock_perk_name: "Молния"
 lightning_shock_perk_effect: "Поразите цель молнией, раня её и снижая доблесть."
 inferno_perk_name: "Геенна огненная"
 inferno_perk_effect: "Обрушьте на вражеское войско огненные шары, испепеляя неприятельских солдат."
 rock_armor_perk_name: "Каменный доспех"
 rock_armor_perk_effect: "Окутайте цель защитным доспехом, уменьшающим риск её гибели или пленения в бою."
 stone_fist_perk_name: "Каменный кулак"
 stone_fist_perk_effect: "Метните в цель каменный кулак, сбивая её с ног и снижая доблесть."
 winters_grasp_perk_name: "Ледяная хватка"
 winters_grasp_perk_effect: "Закуйте цель в ледяные объятия, снижая скорость путешествий, сопротивление болезням и доблесть."
 frost_weapons_perk_name: "Ледяное оружие"
 frost_weapons_perk_effect: "Покройте оружие своей свиты льдом, повышая доблесть и эффективность рыцарей."
 chain_lightning_perk_name: "Цепная молния"
 chain_lightning_perk_effect: "Выпустите молнию, перескакивающую между несколькими целями и значительно снижающую их здоровье, доблесть и эффективность рыцарей."
 primal_mage_perk_name: "Маг стихий"
 primal_mage_perk_effect: "Освоение стихийной магии повышает магическое мастерство и учёность."
 # magic_primal_p10_t1_perk_name: "Lightning Shock"
 # magic_primal_p11_t1_perk_name: "Lightning"
 #Magic: Creation Tree
 heal_perk_name: "Лечение"
 heal_perk_effect: "Устраните наиболее распространённые болезни и недуги, обычно вызываемые заклинанием «Слабость»."
 rejuvenate_perk_name: "Очищение"
 rejuvenate_perk_effect: "Наделите цель временным модификатором, максимально повышающим её сопротивление болезням."
 regeneration_perk_name: "Восстановление"
 regeneration_perk_effect: "Снимите с цели одну обычную или заражённую рану."
 heroic_defense_perk_name: "Героическая оборона"
 heroic_defense_perk_effect: "Наделите цель модификатором, снижающим смертельные потери союзников."
 heroic_offense_perk_name: "Героическое нападение"
 heroic_offense_perk_effect: "Наделите цель модификатором, повышающим смертельные потери противника."
 haste_perk_name: "Ускорение"
 haste_perk_effect: "Увеличьте скорость передвижения и путешествий цели."
 debug_testttt: "[spell_caster.GetFirstName] [Select_CString(spell_caster.IsFemale, 'наложила', 'наложил' )] заклинание «[spell_caster.Char.MakeScope.Var( 'spell_selected' ).GetFlagName]» на [spell_target.GetFirstName]"
#  mass_heal_perk_name: "Mass Heal"
#  mass_heal_perk_effect: "Grant everyone in your target's court or entourage temporarily healing"
 life_ward_perk_name: "Хранитель жизни"
 life_ward_perk_effect: "Наложите на цель защитный оберег, не позволяющий ей умереть ни по какой причине в течение пяти лет. Это заклинание можно наложить на каждую цель только один раз."
 spell_wisp_perk_name: "Волшебный огонёк"
 spell_wisp_perk_effect: "Призовите огонёк, повышающий ваше магическое мастерство ценой маны."
 creation_mage_perk_name: "Маг Созидания"
 creation_mage_perk_effect: "Освоение магии Созидания повышает здоровье и учёность."
 #Magic: Spirit Tree
 arcane_bolt_perk_name: "Волшебная стрела"
 arcane_bolt_perk_effect: "Поразите цель сгустком бесформенной тайной энергии, нанося ей ранение."
#  spell_shield_perk_name: "Spell Shield" #should probably not exist at all
#  spell_shield_perk_effect: "This spell has not been implemented yet! Eventually it will be, join the team to hasten the process!"
 dispel_magic_perk_name: "Рассеивание магии"
 dispel_magic_perk_effect: "Снимите с цели все магические эффекты, как благотворные, так и вредоносные."
 mana_cleanse_perk_name: "Выжигание маны" 
 mana_cleanse_perk_effect: "Потратьте свою ману, чтобы полностью истощить запас маны другого мага."
 walking_bomb_perk_name: "Ходячая бомба" 
 walking_bomb_perk_effect: "Поместите в цель магическую бомбу, которая на короткое время снизит её здоровье. Если цель умрёт, пока действует бомба, та взорвётся и тяжело ранит находящихся рядом персонажей."
 mana_drain_perk_name: "Вытягивание маны"
 mana_drain_perk_effect: "Вытяните ману из цели."
 barrier_perk_name: "Барьер"
 barrier_perk_effect: "На короткое время защитите себя и рыцарей своей свиты от любого урона, кроме болезней."
 crushing_prison_perk_name: "Дробящая темница"
 crushing_prison_perk_effect: "Заключите цель в неумолимо сжимающуюся магическую темницу, значительно снижая её здоровье, доблесть и скорость путешествий."
 spirit_mage_perk_name: "Маг Духа"
 spirit_mage_perk_effect: "Освоение магии Духа повышает запас маны и учёность."
 mind_blast_perk_name: "Взрыв разума"
 mind_blast_perk_effect: "Высвободите волну телекинетической энергии, оглушая противника."
 #Magic: Entropy tree 
 weakness_perk_name: "Слабость"
 weakness_perk_effect: "Ослабьте цель, снижая её доблесть и сопротивление болезням."