l_russian:
 #DATAW Traditions
 tradition_chasind_wilders_name: "Хасинды Диких земель"
 tradition_chasind_wilders_desc: "Давным-давно отделившись от северных сородичей, хасинды Диких земель Коркари замкнулись в себе и оказались отрезаны от остального мира. За их пределами их считают каннибалами и ведьмами, хотя на деле это глубоко духовный народ, для которого умение выживать превыше всего."

 tradition_guerrier_de_hauterin_name: "Guerre à la Hauterin"
 tradition_guerrier_de_hauterin_desc: "Отерены всегда были ближе к своему цирианскому наследию, подобно родственным им марешуа. Однако их историю определила совсем иная сила — война. Бесчисленные столкновения с порождениями тьмы, опустошавшими Проклятые холмы и земли за ними, пограничные войны с Тевинтером и Неваррой и многие другие бедствия превратили отеренов в народ, добывающий славу не при дворе, а на поле боя. Битва для них — то же, что бал для орлесианца, а потерпеть поражение считается величайшим позором. Поэтому военному искусству здесь обучают с малых лет — и обучают превосходно."

 tradition_suns_edge_name: "Край Солнца"
 tradition_suns_edge_desc: "Борсолы — верующие на краю солнца, империи и самого Тедаса. Живя на Дованских равнинах, они всегда охотнее считали своей столицей Монтсиммар, а не Вал Руайо, но по-прежнему видят себя частью великой орлесианской семьи, объединённой Кордилиусом и прежде всего первой Верховной жрицей — Олессой Монсиммарской, родившейся в столице Юга. Равнины породили любовь и благоговение перед лошадьми, каких не встретить более нигде в Тедасе, и потому борсолы выработали необычный способ боя — конную стрельбу из лука. Поначалу этот приём был лишь демонстрацией мастерства, но оказался удивительно действенным и теперь безошибочно выдаёт борсолов на поле боя."


 tradition_fereldan_pride_name: "Ферелденская гордость"
 tradition_fereldan_pride_desc: "Ферелден стал плавильным котлом для гордых вождей и народов, но превыше всего здесь ставят свободу. Клейны Ферелденской долины могут казаться более «цивилизованными», чем их сородичи с холмов и болот, однако они столь же неуступчивы и так же дорожат независимостью."
 tradition_last_of_the_elvhenan_name: "Последние из элвен"
 tradition_last_of_the_elvhenan_desc: "Во второй раз за всю известную историю элвен обрели дом. За столетия, прошедшие после Долгого пути, эти долийские [Concept('elves','эльфы')|E] построили новую родину, заново изучили собственную историю и встали на защиту её границ."

 tradition_orlesian_opulence_name: "Орлесианская роскошь"
 tradition_orlesian_opulence_desc: "В Орлее внешность решает всё. От повседневного наряда до величественного жеста на публике — обо всём судят по первому впечатлению. Положение в обществе превыше всего, и орлесианцы готовы на что угодно, лишь бы подняться на вершину и удержаться там."

 tradition_elegance_empire_name: "Имперское изящество"
 tradition_elegance_empire_desc: "Когда-то Империя считала потомков цириан разобщёнными варварами, но Кордилиус объединил их, и они не просто обрели утончённость — они превратили Орлей в новый центр цивилизации во всём [Concept('thedas','Тедасе')|E]. Теперь их рыцари прекраснее всех, их дворы изысканнее прочих, а речи и обычаи империи вызывают всеобщую зависть."

 tradition_tyrddas_children_name: "Дети Тирдды"
 tradition_tyrddas_children_desc: "Постоянство чуждо авварам. В мире, где дом и брак существуют лишь некоторое время, они поручают скальдам хранить историю, превращая сумбурную действительность в красивые и поучительные песни для грядущих поколений."

 tradition_walkers_of_the_lonely_path_name: "Идущие одиноким путём"
 tradition_walkers_of_the_lonely_path_desc: "После падения Долов [Concept('elves','эльфы')|E], решившие сохранить свободу, ведут кочевую жизнь. Маленькими обособленными кланами они странствуют по окраинам [Concept('thedas','Тедаса')|E], бережно храня своё наследие и не позволяя мечте о Долах угаснуть."

 tradition_vir_tanadahl_name: "Вир Танадал"
 tradition_vir_tanadahl_desc: "Вир Танадал — учение долийских охотников, воплощающее дух Андруил, эльфийской богини охоты. Три его пути призваны воспитать в последователях глубокое уважение к природе. Путь Стрелы требует от охотника быть быстрым и бесшумным, бить без промаха и никогда не колебаться. Путь Лука учит гнуться, но не ломаться. Путь Леса призывает принимать дары охоты осознанно и с благодарностью."


 tradition_whale_hunters_name: "Охотники на китов"
 tradition_whale_hunters_desc: "Море у самого порога их дома изобилует добычей, и этот народ научился охотиться на одних из крупнейших известных смертным морских животных — могучих китов. Китобойный промысел служит для них предметом гордости и радости, а также источником пищи и богатства."

 tradition_best_friends_worst_enemies_name: "Лучшие друзья, злейшие враги"
 tradition_best_friends_worst_enemies_desc: "Цириане показывают миру две маски. Одна предназначена для друзей: верность, непоколебимая преданность и глубокая привязанность. Другая — для врагов: месть, непримиримое соперничество и коварные заговоры. Истинный цирианин должен за одну жизнь в совершенстве овладеть обоими искусствами."

 tradition_elder_council_name: "Совет старейшин"
 tradition_elder_council_desc: "Этот народ решает свои дела по древним обычаям первых человеческих племён, существовавшим задолго до [andraste|E]. Каждый свободный землевладелец державы может высказаться о наследовании, а старейшин предпочитают видеть и наследниками, и почитаемыми советниками. Здесь корона скорее надзирает, чем правит, и мало кто пожелал бы иного."

 tradition_wanderers_of_the_dry_sea_name: "Скитальцы Пепельного моря"
 tradition_wanderers_of_the_dry_sea_desc: "Давным-давно невенцы изгнали нас, сандренцев, в Море Пепла, но мы полюбили уготованные нам бесконечные странствия. Каждая новая дюна, каждая следующая статуя, высеченная прямо в скале, дарят нам радость и учат пересекать эту землю, сражаться на ней и постигать её бесчисленные тайны. Отказаться от титула ради странствий для нас почётно: так человек познаёт землю в её первозданном виде и вспоминает, как некогда жили все мы."

 tradition_ancient_marshes_name: "Древние болота"
 tradition_ancient_marshes_desc: "Марешуа всегда были ближе всех к древним цирианам — настолько, что некоторые жители Вал Руайо, начитавшись исторических книг, объявляют их болотным народом, совершенно не изменившимся за века. Это далеко от истины. Марешуа действительно дорожат цирианскими обычаями, но при этом лучше всех приспособились к сырому северо-западу. Они научились путешествовать налегке, сражаться среди топей и поддерживать здоровье с помощью местных растений. Они совершенно не похожи на остальной Орлей — почти варвары, или по крайней мере хотят, чтобы все так думали. Марешуа понимают: подобная репутация заставляет соперников недооценивать их, а в Игре это бесценно."


 tradition_lords_of_the_field_name: "Владыки полей"
 tradition_lords_of_the_field_desc: "Рождённые среди плодородных полей Гислейна шанвалуа всегда владели и земледелием, и дипломатией. Каждый, кто посещал державу Владык полей, рассказывает об огромных плантациях, по площади почти втрое превосходящих Вал Руайо, изысканных пирах, прекрасных нарядах и многом другом. Шанвалуа гордятся своей славой народа необычайной красоты, богатства и культуры, а плантационная знать научилась обращать эту славу и состояние себе на пользу."


 tradition_hunters_of_the_forgotten_sea_name: "Охотники Забытого моря"
 tradition_hunters_of_the_forgotten_sea_desc: "О невенцах, живущих к западу от гор Гаморд, часто забывают и в Орлее, и за его пределами. Отрезанные горами и торгующие главным образом с кочевниками-сандренцами на западе, они всё ревностнее оберегают свою самобытность, ярче всего выраженную в почтении к охоте — и в горах, и среди морских волн. Из-за этой репутации о них нередко забывают и недооценивают их. Но никогда не следует недооценивать тех, кто так часто охотится на китов Расколотого моря."

 tradition_devoted_prospectors_name: "Преданные старатели"
 tradition_devoted_prospectors_desc: "Мор отнял у вандаларийцев дорогой им Западный предел. Некогда пышная зелёная земля высохла и умерла, а процветавший многолюдный край опустел. Но вандаларийцы живы. Они продолжат жить и охотиться, а главное — никогда не забудут прошлого. Они будут хранить память о нём, проникать в самые глубокие недра и открывать утраченные тайны, находить артефакты, оставленные пылиться и ржаветь. Вопреки всему вандаларийцы отыщут древние сокровища и станут брать их за образец, ведь именно в этом они черпают силу."

 tradition_forest_children_name: "Дети леса"
 tradition_forest_children_desc: "Наш народ родился в Бресилианском лесу и был создан им. Мы, бресилианцы, научились жить среди деревьев и вездесущей магии, которой наделены многие наши дети, чтобы сражаться с чужаками, угрожающими нашему дому. Мы охотимся, живём и воюем в прекрасном лесу и не покоримся никому, кто нам угрожает. Благословен бресилианский народ, ибо мы научились внимать мудрости духов. Благословен бресилианский народ, ибо мы сделали прекраснейший из лесов своей родиной. Благословен бресилианский народ, ибо мы пребудем вовеки."

 tradition_DATAW_a_way_of_our_own_name: "Собственный путь"
 tradition_DATAW_a_way_of_our_own_desc: "Аламарри пришли в Ферелденскую долину и сделали её своим домом. Другие их племена поселились в Морозных горах и Диких землях Коркари. Среди них родилась Андрасте — воительница и пророчица, за несколько столетий изменившая веру всего Тедаса. Со временем аламарри разделились на множество народов, но все их потомки сохранили независимый дух, преданность своим верованиям, гордость и доблесть в бою."

 
