 tradition_DATAW_gates_of_the_empire_name: "Врата империи"
 tradition_DATAW_gates_of_the_empire_desc: "В горных проходах, ведущих в Орлей, клейны под мудрым руководством своего вождя Исората возвели поселения и крепости для защиты молодой Орлесианской империи. Их джейдерские потомки закрепились на горной границе Орлея и прославились как стойкие и смертоносные хранители рубежей, обратив клинки и щиты против бывших сородичей-клейнов. Лишь глупцы и самонадеянные военные отряды осмеливаются прорывать оборону Джейдера, охраняющую сердце Орлея."
