 #DATAW Traditions
 innovation_war_mabari:0 "[war_mabari|E]"
 innovation_war_mabari_desc:0 "Некоторые культуры сочли бы немыслимым отправлять верных спутников на войну, но для гордых хозяев мабари нет большей чести, которую можно оказать своим четвероногим друзьям. Обычно они идут в первой волне атаки, превосходно проявляют себя в авангарде и преданно следуют за хозяевами даже на смерть — а быть может, и дальше."

#DATAW Traditions
 innovation_orlesian_sunrise:0 "Орлесианский рассвет"
 innovation_orlesian_sunrise_desc:0 "В Орлее неприкрытое лицо считается дурным тоном, особенно в присутствии чужеземца или, упаси Создатель, простолюдина. Орлесианская знать любит появляться на людях в искусно изготовленных масках. Эти маски передаются по наследству и позволяют узнать род владельца почти так же безошибочно, как герб на щите."
 
 innovation_catapult:0 "Тараны"
 innovation_catapult_desc:0 "Когда во время войны нет возможности позволить себе услуги мага, для разрушения вражеских ворот используются тараны. Они раз за разом наносят сокрушительные удары огромным бревном, пока дверь не сломается."
 

