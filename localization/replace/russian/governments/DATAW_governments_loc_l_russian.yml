  nomadic_clan_gov: "Кочевой клан"
  nomadic_clan_gov_desc: "Эти гордые потомки эльфов Долов живут небольшими кочевыми кланами. Их редко встречают с радушием, поэтому они держатся у границ человеческой цивилизации, сохраняя замкнутый и общинный уклад."
  clan_government: "Оседлый клан"
  clan_government_desc: "После долгих странствий [elves|E] обрели новый дом. Кланы со всего [Concept('thedas','Тедаса')|E] объединяются, чтобы в новой эре основать новый Элвенан."
  gov_increases_hostile_scheme_power: "[Concept('government','Тип правительства')|E] повышает [Concept('success_chance','шанс успеха')|E] [Concept('hostile_scheme','агрессивных происков')|E]"
  jizya_special_rights_tax_collector: "Десятина Саласан"
  jizya_special_rights_tax_collector_flavor_desc: "Хотя «Право песнопевца» редко действовало долго и часто отменялось, оно создало прецедент, позволяющий исповедовать на землях элвен верования, не связанные с эванурисами, прежде всего учение [Concept('chant_of_light','Песни Света')|E]. За немалую плату подобное можно потерпеть. Пока что."
  iqta_special_rights_tax_collector: "Дар Марамас"
  iqta_special_rights_tax_collector_flavor_desc: "Указ «Ваша добыча» позволяет вассалам вводить в собственных владениях систему откупа налогов. Взамен они обязаны предоставлять рекрутов и золото для пополнения Изумрудных рыцарей и других войск, которые сюзерен созывает для защиты державы элвен."
  ghazi_special_rights_tax_collector: "Носитель Дар'Энасте"
  ghazi_special_rights_tax_collector_flavor_desc: "Набеги и захваты, к которым пограничным владыкам приходится прибегать ради защиты рубежей, официально обычно не одобряются. Однако посланник может тайно вручить такому правителю «Клинок благоволения» с выгравированной Клятвой Долов, давая понять, что на подобные действия могут… закрыть глаза или даже одобрить их."
  deqhan_special_rights_tax_collector: "Право Ре'вирелан"
  deqhan_special_rights_tax_collector_flavor_desc: "Ещё до появления Изумрудных рыцарей добровольческому ополчению даровали право пройти «Маршем свободных» через Халамширал. Возродив этот обычай, мы позволим вассалам с помпой шествовать через нашу столицу и, возможно, даже затмевать наши профессиональные полки — а взамен получим немало клинков и [Concept('gold','золота')|E]."
  maguh_special_rights_tax_collector: "Дань Хахаур"
  maguh_special_rights_tax_collector_flavor_desc: "Согласно другому старинному указу, некоторые из богатейших кланов Долов десятилетиями платили дань «Золото старейшин», помогая оплачивать строительство лесной столицы Халамширала. Если народу элвен когда-нибудь понадобится ещё один великий город, сбор дани Хахаур, вероятно, возобновят."
  muqata_special_rights_tax_collector: "Клятва Маретан"
  muqata_special_rights_tax_collector_flavor_desc: "Этот указ, популярный в первые годы существования Долов, отводит сбор средств на благо сюзерена на второй план и провозглашает главным «Ваш оплот». Благодаря этому вассалы в неразвитых и отдалённых областях могут сосредоточиться на развитии своих общин."
  strict_taxation_tax_collector: "Ла'солас введён"
  strict_taxation_tax_collector_flavor_desc: "Формально обязательный для всех элвен «Дар гордости» обязывает богатейшую знать Долов отдавать часть состояния беднейшим членам общества элвен. Благочестиво следя за соблюдением этой традиции, мы снимаем с государства часть бремени благотворительности и творим добро."
  iqta_special_rights: "Дар Марамас"
  iqta_special_rights_granted: "Дар Марамас распространён"
  iqta_special_rights_granted_short: "Распространён"
