  nomadic_clan_gov: "Nomadic Clan"
  nomadic_clan_gov_desc: "These proud descendants of the Dales live in small nomad clans. Oft unwelcome, they skirt the edges of human civilization, remaining insular and communal."
  clan_government: "Settled Clan"
  clan_government_desc: "After a long march, the [elves|E] have found a new home. Clans gather from all across [thedas|E], banding together to found a new Elvhenan in a new Age."
  gov_increases_hostile_scheme_power: "[government|E] type increases [hostile_scheme|E] [success_chance|E]"
  jizya_special_rights_tax_collector: "Salasahn Tithe"
  jizya_special_rights_tax_collector_flavor_desc: "Though rarely sustained and often revoked, the 'Chanter's Right' is a precedent which allows for non-Evanuris faiths to be practised inside Elvhen lands, namedly the [chant_of_light|E]. For a significant price, such things may be tolerated. For now."
  iqta_special_rights_tax_collector: "Maramas Boon"
  iqta_special_rights_tax_collector_flavor_desc: "A declaration that taxes are 'Yours for the Taking' permits vassals to administer tax farming in their own holdings. In return they are expected to provide recruits and gold for the Emerald Knights, along with other forces assembled by their liege for the defence of the Elvhen realm."
  ghazi_special_rights_tax_collector: "Dar'Enaste Bearer"
  ghazi_special_rights_tax_collector_flavor_desc: "For the frontier lord, the sorts of raids and expansions required to defend the borders are often officially discouraged. However an envoy may quietly deliver a 'Favored Blade', imprinted with the Oath of the Dales, informing them that such actions may be... quietly overlooked, or even approved."
  deqhan_special_rights_tax_collector: "Re'virelan Right"
  deqhan_special_rights_tax_collector_flavor_desc: "Before the Emerald Knights, volunteer militias would be granted the right to conduct a 'March of the Free' though Halamshiral. By reviving it, we'd allow vassals to swan through our capital and perhaps outshine our own men-at-arms, in exchange for tidy sums of sword and [gold|E]."
  maguh_special_rights_tax_collector: "Hahaur Tribute"
  maguh_special_rights_tax_collector_flavor_desc: "Another older decree, the 'Elder's Gold' tribute was paid for decades by some of the richest clans of The Dales to help fund the construction of the forest capital of Halamshiral. Should another great city of the Elvhen people ever be needed, the return of the Hahuar seems likely."
  muqata_special_rights_tax_collector: "Marethan Vow"
  muqata_special_rights_tax_collector_flavor_desc: "Popular during the early years of the Dales, this decree shifts the emphasis away from collecting for the benefit of the liege, and instead places the focus on 'Your Keep'. Vassals in underdeveloped or distant regions are therefore free to focus on the growth of their local communities."
  strict_taxation_tax_collector: "La'solas Enforced"
  strict_taxation_tax_collector_flavor_desc: "Technically mandatory for all Elvhen folk, this 'Gift of Pride' is intended as a means for the wealthiest nobles of the Dales to give a proportion of their riches to the poorest members of Elvhen society. By piously enforcing this tradition, we lessen the burden of charity on the state and do some good."
  iqta_special_rights: "Maramas Boon"
  iqta_special_rights_granted: "Maramas Boon Extended"
  iqta_special_rights_granted_short: "Extended"
