l_russian:

 building_type_watermills_01:0 "Водяные мельницы"
 building_type_watermills_01_desc:0 "Водяные мельницы преобразуют любое движение воды, от приливов до водопадов, во вращение, используемое для помола, пиления, дробления и валки. Разрешения на эксплуатацию водяной мельницы — простой и надежный источник дополнительного налога для владельца владения."
 building_watermills_01:0 "Подливные водяные колеса"
 building_watermills_01_desc:0 "Простое колесо, помещенное в быструю реку, может сделать гораздо больше, чем мельница с человеческим или конным приводом, а главное — оно никогда не устанет и не потребует платы."
 building_watermills_02:0 "Кривошипы и шатуны"
 building_watermills_02_desc:0 "С помощью простой системы деревянных шестерен скорость вращения жерновов больше не зависит напрямую от капризов погоды."
 building_watermills_03:0 "Наливные водяные колеса"
 building_watermills_03_desc:0 "Использование перепада уровней воды, созданного naturally или достигнутого с помощью человеческой находчивости, является гораздо более эффективным и надежным способом генерации крутящего момента."
 building_watermills_04:0 "Промышленные мельницы"
 building_watermills_04_desc:0 "То, что начиналось как простая солодовня, перерабатывающая преимущественно сельскохозяйственные товары, теперь привлекает и другие ремесла. Гильдейские носильщики ждут своей очереди, пока мельницы мелют им горчицу, валяют сукно или дробят руду."
 building_watermills_05:0 "Организованные дороги"
 building_watermills_05_desc:0 "Нанятые стражники, укрытия, дорожные пропуски и даже постоялые дворы, расположенные вдоль дорог к мельницам, организуют и обслуживают тех, кто ждет своей очереди. Повозки на конной и людской тяге, полные товаров для помола — таких как древесина, пенька или звериные шкуры — выстраиваются в очереди днем и ночью."
 building_watermills_06:0 "Мельницы на кораблях"
 building_watermills_06_desc:0 "Баржи, постоянно стоящие на якоре посреди рек, используют самые сильные течения. На извилистых реках баржи можно без особых усилий перешвартовать к внешним излучинам."
 building_watermills_07:0 "Дамбы и плотины"
 building_watermills_07_desc:0 "Комплекс дамб, плотин и искусственных каналов как для подливных, так и для наливных водяных колес удовлетворяет растущие потребности в помоле. Поскольку почти все подходящие природные места уже заняты, вновь прорытые водные пути прорезают сельскую местность."
 building_watermills_08:0 "Пороховые мельницы"
 building_watermills_08_desc:0 "Отдельная мельница, расположенная вдали от других производств, целиком предназначена для эффективного и #EMP в какой-то мере#! безопасного помола древесного угля и серы."
 
 building_type_caravanserai_01:0 "Караван-сарай"
 building_type_caravanserai_01_desc:0 "Убежище в суровой местности, принимающее усталых путников и старающееся не впускать сомнительных личностей."
 building_caravanserai_01:0 "Небольшой караван-сарай"
 building_caravanserai_01_desc:0 "Простое прямоугольное здание, предоставляющее базовые удобства путешественникам и купцам, чтобы они могли отдохнуть и восстановить силы во время долгих странствий."
 building_caravanserai_02:0 "Торговые лавки"
 building_caravanserai_02_desc:0 "Небольшие купеческие лавки, торгующие базовыми припасами для дороги. Имея гарантированную точку пополнения запасов, караваны могут перевозить больше ценных товаров."
 building_caravanserai_03:0 "Казармы стражи"
 building_caravanserai_03_desc:0 "Добавление постоянных казарм стражи и комплекса сторожевых башен с бдительными часовыми активно защищает от опасностей, таящихся в ночной тьме."
 building_caravanserai_04:0 "Купеческие палаты"
 building_caravanserai_04_desc:0 "В этих залах купцы со всех концов света обмениваются товарами и делятся историями о землях, по которым они путешествовали."
 building_caravanserai_05:0 "Таможня"
 building_caravanserai_05_desc:0 "Под палящим солнцем суровые чиновники взвешивают, регистрируют и облагают надлежащим налогом все товары, проходящие через этот караван-сарай. В тени же приветливые люди предлагают способы провезти груз за еще более... #EMP надлежащую#! плату."
 building_caravanserai_06:0 "Ремесленные мастерские"
 building_caravanserai_06_desc:0 "Благодаря изобилию сырья и богатым покровителям ремесленники могут создавать и продавать великолепные артефакты."
 building_caravanserai_07:0 "Бани"
 building_caravanserai_07_desc:0 "Просторные бани ублажат даже самые изысканные прихоти. А для тех, кто путешествует с более скромным кошельком, они предоставят простое, но долгожданное освежение."
 building_caravanserai_08:0 "Королевские покои"
 building_caravanserai_08_desc:0 "Добавление подобающих покоев позволит с комфортом размещать часто наносящих визиты важных и знатных персон — как из этого владения, так и из дальних стран."
 

