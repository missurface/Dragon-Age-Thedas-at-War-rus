 picchieri_flavor:0 "#F Подвижное построение антиванских пикьери делает их куда опаснее традиционных пикинеров.#!"
 praetorian_flavor:1 "#F Палатины — лучшие из лучших, элитные тевинтерские воины, подчиняющиеся лично Архонту.#!"
 caballero_flavor:0 "#F В отличие от большинства кавалеристов, ривейнские кабальеро чувствуют себя как дома и на равнинах, и на холмистой местности.#!"
 cataphract_flavor:0 "#F Закованные в железо тевинтерские катафракты способны снести своим таранящим ударом практически любую линию обороны.#!"
#  monaspa_flavor:0 "#F Formed from the core of the bodyguards of the Georgian kings the Monaspa are a fearsome heavy cavalry force that is well at home in the undulating terrain of the Caucasus.#!"
 hobelar_flavor:0 "#F Быстрые и проворные хасиндские хобилары легко совершают набеги через леса и холмы, недоступные для другой кавалерии.#!"
 schiltron_flavor:0 "#F Невероятная дисциплина старкхавенских пикинеров позволяет им легко отражать вражеские атаки даже на открытых равнинах.#!"
#  metsanvartija_flavor:0 "#F Uralic Metsänvartija can ambush invaders with a hail of arrows before melting back into the trees.#!"

 hussar_flavor:1 "#F Превосходные налетчики, печально известные хасмальские гусары быстро расправляются с бегущим вражеским войском.#!"
#  horn_warrior_flavor:0 "#F Practiced in mountainous warfare, warriors from the Horn of Africa are not to be underestimated.#!"
#  bush_hunter_flavor:0 "#F These West African archers turn the difficult terrain of the bush to their advantage.#!"
 shomer_flavor:0 "#F Преданные защите своего народа, хасмальские шомеры успешно прикрывают соратников в бою.#!"
 ayrudzi_flavor: "#F Быстрые и хитрые в использовании рельефа, но при этом закованные в прочную броню, эти свирепые дворяне служат как для изнуряющих набегов, так и в качестве грозного авангарда.#!"
 akritai_flavor: "#F Опытные ополченцы из провинции, защитники скалистых перевалов, использующие знание местности, чтобы изматывать даже самые могущественные армии.#!"
 skoutatoi_flavor: "#F Высокие щиты-#EMP скутоны#!, за которыми укрываются эти пехотинцы, дали им имя. Но главное их достоинство — дисциплина, сохраняющая строй как при наступлении, так и при отступлении.#!"
 onager_flavor: "#F Эти тараны служат самым разным владыкам. Множество солдат с их помощью пытаются пробить ворота великих крепостей и иных, менее крупных построек. Эти осадные машины относительно дешёвые, но сильно уступают магии.#!"