 huscarl_flavor:1 "#F Авварские хускарлы — мастера построения стены щитов, способной укрыть от любого залпа стрел.#!"
 landsknecht_flavor:1 "#F Андерские ландскнехты используют огромные цвайхендеры, чтобы прорубать стройные ряды вражеских копьеносцев.#!"
 longbowmen_flavor:2 "#F Хоть на освоение долийских длинных луков уходит вся жизнь, они достаточно мощны, чтобы пробивать доспехи, и обладают непревзойденной скорострельностью.#!"
 goedendag_flavor:0 "#F Ансбургский годендаг — шипастая палица, которую можно упереть в землю для отражения кавалерийских атак.#!"
#  gendarme_flavor:0 "#F French Gendarmes are the shining pinnacle of heavy cavalry, inspiring awe around the world.#!"
