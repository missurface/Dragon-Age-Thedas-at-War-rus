 game_concept_lifestyle_desc:2 "[Concept( 'adult', 'Взрослый' )|E] [Concept('rulers', 'правитель')|E] может выбрать для себя жизненный путь, а затем выбрать [Concept('focus', 'фокус')|E] и начать получать [Concept('perks', 'достоинства')|E].\n\nНакапливая [Concept( 'experience', 'опыт' )|E] определенного [Concept( 'lifestyle', 'пути' )|E], правитель приобретает его [Concept( 'perks', 'достоинства' )|E]. Например, к [Concept( 'perks', 'достоинствам' )|E] [Concept('intrigue_lifestyle', 'пути интриг')|E] относятся «[GetPerk( 'dreadful_perk' ).GetName( GetNullCharacter )]» и «[GetPerk( 'like_weed_in_a_garden_perk' ).GetName( GetNullCharacter )]».\n\nДоступные пути:\n$BULLET_WITH_TAB$ [diplomacy_lifestyle|E]\n$BULLET_WITH_TAB$ [stewardship_lifestyle|E]\n$BULLET_WITH_TAB$ [martial_lifestyle|E]\n$BULLET_WITH_TAB$ [intrigue_lifestyle|E]\n$BULLET_WITH_TAB$ [learning_lifestyle|E]\n$BULLET_WITH_TAB$ [wanderer_lifestyle|E]\n$BULLET_WITH_TAB$ [magic_lifestyle|E]"