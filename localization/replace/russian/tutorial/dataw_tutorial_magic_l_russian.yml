l_russian:
 ra_magic_intro: "Обучение магии"
 ra_magic_intro_desc: "Мод «Dragon Age: Thedas at War» использует систему магии. Откройте окно персонажа, чтобы пройти короткое обучение и узнать, как работает [dataw_magic|El] в этой модификации."
 ra_magic_lore: "Знания о магии"
 ra_magic_lore_desc: "[Concept('mage','Магами')|E] рождаются, а не становятся. Чтобы быть магом, персонаж должен обладать [Concept('dataw_magic','магическим даром')|E]. Например, свойством $trait_magical_ability_good$#!, которое может передаваться его детям. Кроме того, маг может родиться и у родителей, не обладающих никакими способностями к магии."
 ra_magic_mana: "Мана"
 ra_magic_mana_desc: "[Concept('mage','Маги')|E] используют [Concept('dataw_mana', 'ману' )|E] для наложения заклинаний. Мана — это ресурс, который восполняется каждый месяц, однако её восстановление прекращается при достижении предела до тех пор, пока она не будет израсходована на заклинания или враждебные эффекты. Врождённое свойство мага оказывает ключевое влияние на прирост маны, хотя его можно повысить и с помощью артефактов."
 ra_magic_lifestyle: "Образ жизни «Магия»"
 ra_magic_lifestyle_desc: "Чтобы читать заклинания, маг должен сначала выбрать магический [lifestyle|El].\n\nНажмите на образ жизни «Магия», чтобы просмотреть фокусы и получить достоинства.\n\nДоступные достоинства разделены по различным школам магии. Каждое достоинство представляет собой заклинание, которое может наложить маг. Некоторые из них применяются только в бою, например #S цепная молния#!, другие — во время событий или прочих занятий, например #S взрыв разума#!, а третьи, такие как #S лечение#!, можно читать свободно. Заклинания имеют ограниченную дальность применения, которая не зависит от дипломатической дальности."
 ra_magic_lifestyle_no_GUI_highlight: "Магический образ жизни"
 ra_magic_cast_spell: "Наложение заклинаний"
 ra_magic_cast_spell_desc: "Чтобы наложить заклинание на цель, откройте меню взаимодействия и найдите пункт «Наложить заклинание» в разделе магических взаимодействий.\n\nНажмите «Наложить заклинание» в появившемся меню.\n\nВыберите нужную школу магии, чтобы открыть список связанных с ней заклинаний. К примеру, «Лечение» относится к школе созидания, а «Цепная молния» — к школе стихий."
 ra_magic_prowess: "Магическая доблесть"
 ra_magic_prowess_desc: "[dataw_magical_prowess|EU] отражает то, насколько сильна [Concept('dataw_magic', 'магия')|E] чародея. Когда [mage|El] применяет заклинание на другого мага, происходит проверка навыка магической доблести, аналогично тому, как проверяются дипломатия или другие навыки. Это влияет на шанс обнаружения заклинания: чем выше ваша магическая доблесть, тем ниже вероятность того, что ваше заклинание раскроют. Магическая доблесть также увеличивает скорость восстановления маны.\n\nПроверки навыка магической доблести применяются только к враждебным заклинаниям. Враждебным заклинаниям противостоит [dataw_magical_resistance|El]."
 ra_magic_spell_cooldown: "Восстановление заклинания"
 ra_magic_spell_cooldown_desc: "Каждое заклинание можно наложить повторно только по прошествии определённого времени. Все заклинания имеют период восстановления, определяемый модификатором персонажа.\n\nК примеру, наложение заклинания #S лечение#! накладывает на заклинателя модификатор #S недавнее исцеление#!. Подобные эффекты могут длиться от одного дня до нескольких лет или даже всю жизнь — в последнем случае заклинатель никогда больше не сможет применить это заклинание.\n\nКак только срок действия модификатора истечёт, заклинание можно наложить снова."
 ra_magic_religion: "Магия и религия"
 ra_magic_religion_desc: "У каждой религии свой взгляд на то, как следует использовать магию! Нажмите на значок вашей [Concept('faith','конфессии')|E], чтобы просмотреть магическую доктрину вашей конфессии.\n\nВ целом андрастианские религии не приветствуют, когда маги колдуют в своё удовольствие, в то время как другие, такие как Вир'Эванурис, ничего не имеют против. Разумеется, враждебные заклинания заставят цель крайне негативно относиться к магу-злодею!"
 ra_magic_lore_open_UI_prompt: "Откройте окно персонажа (подсвечено)"
 ra_magic_focus_open_UI_prompt: "Выберите фокус"
 ra_magic_focus_open_spellbook_prompt: "Откройте книгу заклинаний"
 ra_magic_focus_spell_target_prompt: "Выберите цель для заклинания"
 ra_magic_focus_spell_caster_prompt: "Выберите заклинателя"