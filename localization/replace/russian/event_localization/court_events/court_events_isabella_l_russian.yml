l_russian:
 court.4750.t:0 "Мне нужен герой"
 court.4750.desc:0 "Я замечаю, как [Select_CString(poet.IsFemale, 'моя поэтесса', 'мой поэт' )] меряет шагами тронный зал. [poet.GetSheHe|U] кричит на всякого, кто осмеливается пересечь избранный путь.\n\nКогда я подхожу, на меня обрушивается литературная ярость: «Не вставайте на моём пути, если только вы не спустившаяся с небес муза! О...» Лицо поэта озаряется восторгом. «Быть может, вы подарите мне столь желанное вдохновение. [Select_CString(ROOT.Char.IsFemale, 'Моя госпожа', 'Мой господин' )], я ищу тему для своего следующего произведения».\n\n«Не скажете ли вы, кто ваш любимый герой?»"
 court.4750.a:0 "Сочините историю о временах Верховного жреца Иоанна!"
 court.4750.b:0 "Андрасте! Балладу о её путешествии верхом!"
 court.4750.c:0 "Веренас — такой отважный герой!"
 court.4750.d:0 "Архонт Тевинтера — человек мне по душе."
 court.4750.e:0 "Истории о Филиппе всегда вызывают у меня улыбку."
 court.4750.f:0 "Расскажите мне о Тариусе, маге-поэте!"
 court.4750.g:0 "Что за вопрос, конечно же, это я!"
 court.4750.h:0 "Зачем мы вам платим, если вы не способны сочинять по заказу?"

 court.4751.intro:0 "По моему заказу [Select_CString(poet.IsFemale, 'моя поэтесса приносит', 'мой поэт приносит' )] мне произведение, источником вдохновения для которого является"
 court.4751.topic.pope_joan:0 "Верховный жрец Иоанн,"
 court.4751.topic.lady_godiva:0 "Андрасте,"
 court.4751.topic.sinbad:0 "Веренас,"
 court.4751.topic.caligula:0 "Архонт Тевинтера,"
 court.4751.topic.nasreddin:0 "Филипп,"
 court.4751.topic.valmiki:0 "Тариус,"
 court.4751.topic.ruler_hero:0 "моя героическая жизнь,"
 court.4751.topic.unexpected:0 "но это совсем не то, чего мне хотелось."
 court.4751.ruler_character:0 "\n\nБыстро пролистав украшенный манускрипт, я замечаю, что тоже являюсь действующим лицом!\n\n"
 court.4701.pope_joan_desc:0 "При взгляде на иллюстрации я понимаю, что художник наделил Иоанна чертами моего лица! [Select_CString(poet.IsFemale, 'Моя поэтесса наклоняется', 'Мой поэт наклоняется' )] ко мне. «Вы намного привлекательнее нашего Верховного жреца. Любовница Иоанна убедила его переодеться в женскую одежду и отправиться на учёбу в Вал Руайо; я же дарю вам этот текст, мечтая, чтобы вы были на месте того, кого мне положено почитать»."
 court.4701.ruler_hero_desc:0 "Поэма рассказывает о том, как великолепно я выгляжу, сидя на троне и не делая ровным счётом ничего. В конце концов, если монарший зад слишком удалится, куда же направляться всем желающим его поцеловать?"
 court.4751.topic.lady_godiva_desc:0 "В этой поэме вы скачете рядом с Андрасте. Столь же [Select_CString(ROOT.Char.IsFemale, 'прекрасная', 'прекрасный' )] — и столь же [Select_CString(ROOT.Char.IsFemale, 'обнажённая', 'обнажённый' )]!"
 court.4751.topic.sinbad_desc:0 "Я таинственная личность, которую Веренас раз за разом встречает в своих приключениях. Я существо, вылупляющееся из исполинского осквернённого яйца. Я Старый Друг Борейского океана, годами цепляющийся за плечи Веренаса. Я оказываюсь в плену у великана-людоеда."
 court.4751.topic.caligula_desc:0 "Я тоже участвую в повествовании: пользуюсь доверием Архонта Тевинтера и состою с ним в близкой дружбе. Он мучает меня плетью, а непристойные описания того, какое удовольствие я от этого получаю, ведут сюжет в весьма... дерзком направлении."
 court.4751.topic.nasreddin_desc:0 "В этих историях Филипп едет за мной верхом на осле, пока я исполняю свои придворные обязанности, и ехидно комментирует каждое моё действие. На пиру я произношу речь, полную банальностей, а он кричит: «Этот оратор лишь сотрясает воздух, изрекая очевидное!» — и следом высмеивает бессмысленное обжорство."
 court.4751.topic.valmiki_desc:0 "Как в ставшей легендой тевинтерской народной сказке, охотник стреляет в прекрасную птицу, а я не могу удержаться от двустишия. Я спотыкаюсь о камень и выкрикиваю рифму, прежде чем рухнуть наземь. Подобно магу-поэту, случайно сочинившему первую поэму, я всякий раз разражаюсь стихами, когда меня застают врасплох."
 court.4751.b:0 "Пожалуй, стоит нацелиться на Солнечный трон..."
 court.4751.c:0 "Мне бы стоило разозлиться, но поклонники мне обеспечены..."
 court.4751.c.tt:0 "Это не укроется от внимания симпатизирующих вам..."
 court.4751.d:0 "От этого в моей голове возникают нечестивые мысли."
 court.4751.e:0 "За его ужимками всегда кроется смысл."
 court.4751.f:0 "Забавная история, наверняка двор оценит ее."
 court.4751.g:0 "[Select_CString(poet.IsFemale, 'Неблагодарная!', 'Неблагодарный!' )]"
 court.4751.h:0 "Это творчество отлично пойдет для растопки."


