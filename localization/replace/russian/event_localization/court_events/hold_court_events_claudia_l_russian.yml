l_russian:


 #A Massive Problem
 hold_court.6230.t:0 "#EMP Огромная#! проблема"
 hold_court.6230.desc:0 "«[Select_CString(ROOT.Char.IsFemale, 'Моя госпожа', 'Мой господин' )], уделите мне толику вашего внимания, пожалуйста... — начинает [6230_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U]. — В последние недели [6230_province.GetName] испытывает весьма #EMP тягостные#! трудности...\n\nВидите ли, стая #EMP совершенно обезумевших#! волков носится по графству, оставляя за собой разруху, а порой и мёртвые тела! День и ночь их устрашающий вой звучит у нас в ушах — я слышу его даже сейчас!» [6230_vassal.GetSheHe] самым неподобающим образом начинает #EMP выть#!. «Умоляю, [Select_CString(ROOT.Char.IsFemale, 'моя госпожа', 'мой господин' )], пришлите подмогу!»"
 hold_court.6230.a:0 "Возьмите золото для ремонта."
 hold_court.6230.b:0 "Я отправлю кого-нибудь усмирить животных."
 hold_court.6230.b.success:0 "Ваши охотники отлавливают диких волков"
 hold_court.6230.b.success.tt:0 "Волки приручены"
 hold_court.6230.b.failure:0 "Волки продолжают бесчинствовать"
 hold_court.6230.b.failure.tt:0 "Обезумевшие волки"
 hold_court.6230.c:0 "Волки, лошади — никакой разницы... [m_horse.GetFirstNameNoTooltip], разберись!"
 hold_court.6230.c.success:0 "Ваш $master_of_horse_court_position$ [Select_CString(m_horse.IsFemale, 'переловила', 'переловил' )] всех волков"
 hold_court.6230.d:0 "Их направляет $hinduism_good_god_ganesh$."
 hold_court.6230.e:0 "У меня нет времени на эту чепуху."
 hold_court.6230.f:0 "Перебить эту мерзость."
