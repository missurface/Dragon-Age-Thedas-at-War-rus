l_russian:

 yearly.9020.t:0 "Могучая мабари"
 yearly.9020.desc:1 "[marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] подходит ко мне с улыбкой, провозглашает, что меня ждёт поистине впечатляющий подарок от смотрителя земли [county.GetNameNoTooltip], и приглашает следовать за собой.\n\nПодарок и вправду впечатляет! Снаружи меня встречает великолепная молодая #emphasis боевая мабари#!. «Она ещё не выбрала себе хозяина, — говорит мой [marshal.GetCouncilTitle]. — Если её обучить, мы сможем подобрать ей идеального спутника»."
 yearly.9020.a:0 "Я [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам' )] налажу связь с этой могучей мабари и поведу её в бой. Лично."
 yearly.9020.b:1 "[marshal.GetCouncilTitle]. Забирай её себе."
 yearly.9020.c:2 "$knight_culture_player_no_tooltip_lowercase$ [knight.GetTitledFirstNameNoTooltip] наверняка станет для неё достойным хозяином."
 yearly.9020.d1:1 "Славься [ROOT.Char.GetFaith.KnowledgeGodName]! Давайте вознесем молитвы и отпустим животное."
 yearly.9020.d2:0 "Такое животное должно само выбирать себе хозяина. Я не стану вмешиваться."
 yearly_9020_personal_war_mabari:0 "Личный [war_mabari|E]"


