l_russian:
 #Generic Lines
 historical_commander_trait.reject.tt:1 "#F Вы будете искать вдохновение в другом месте #!"

 #Hannibal
 historical_commander_trait.0001.t:0 "«Щит Орзаммара»"
 historical_commander_trait.0001.desc:1 "Изучая тактику древних полководцев, я с изумлением узнаю о подвигах Совершенного Эдукана во время Первого Мора:\n\n#F Известный как «Щит Орзаммара», Эдукан добился величайшего успеха при обороне города. Его армия численностью около 50 000 воинов перехитрила и окружила орду из 86 000 порождений тьмы. Лишённые путей к отступлению, они были перебиты — из всей орды уцелело лишь 3000 порождений.#!"
 historical_commander_trait.0001.a:0 "Подобно Эдукану, я сокрушу своих врагов!"
 historical_commander_trait.0001.b:0 "Эдукан был истинным мастером войны на истощение."
 historical_commander_trait.0001.c:0 "Главной силой Эдукана была его разносторонность."
 historical_commander_trait.0001.d:0 "Пф! Ему так и не удалось спасти внешние тейги."
 historical_commander_trait.0001.d.good:0 "Жестокость не то качество, которому стоит завидовать, — даже на войне."
 #Caesar
 historical_commander_trait.0002.t:0 "Триумф Анторидуса"
 historical_commander_trait.0002.desc:0 "Изучая тактику древних полководцев, я с интересом узнаю о подвигах короля Анторидуса во время покорения ингхёршей.\n\n#F При осаде Алезии Анторидус решил, что прямой штурм хорошо укреплённого города обойдётся слишком дорого. Вместо этого он приказал своей армии воздвигнуть крепость, окружавшую весь город. Вражеский гарнизон оказался заперт внутри и обречён на голод, а подкрепления лишились возможности прийти защитникам на помощь.#!"
 historical_commander_trait.0002.a:0 "Небольшая хитрость может переломить ход осады."
 historical_commander_trait.0002.b:0 "Пусть враги сами приходят к тебе! Мне нравится!"
 historical_commander_trait.0002.c:0 "Анторидус рисковал, воплощая этот план, но всё получилось!"
 historical_commander_trait.0002.d:0 "В наши дни войны ведутся иначе..."
 #Alexander
 historical_commander_trait.0003.t:0 "Неудержимая Изабела"
 historical_commander_trait.0003.desc:0 "Когда я изучаю тактику древних полководцев, меня повергают в [ROOT.Char.Custom('surprised_reaction')] подвиги Изабелы Марии Арвале во время отделения Ривейна от Тевинтера.\n\n#F Во время битвы при Темерине королева Изабела взяла штурмом островную крепость, разрушив соседний город и выстроив из его обломков дамбу от материка до городских стен. Это позволило её кабальеро напрямую атаковать вражескую крепость, хотя пролом в стене в конечном счёте создал флот.#!"
 historical_commander_trait.0003.a:0 "Никакой воде не остановить мои войска!"
 historical_commander_trait.0003.b:0 "Эта хитрость — свидетельство великой изобретательности Изабелы."
 historical_commander_trait.0003.c:0 "Использовать ресурсы врага против него самого? Блестяще!"
 historical_commander_trait.0003.d:0 "Зачем тратить время на изучение тактики, которая не сработала?"

 #Constantine
 historical_commander_trait.0004.t:0 "Видение Солнца"
 historical_commander_trait.0004.desc:0 "Изучая тактику исторических полководцев, я черпаю вдохновение в рассказе о победе Драккона I в битве при Камберленде.\n\n#F В ночь перед сражением Драккону приснилось, что победа будет дарована ему, если он изобразит на щитах своих солдат сияющее солнце — символ Создателя. Так он и поступил, а на следующий день сокрушил силы порождений тьмы, которые упали в реку Камбер и утонули.#!"
 historical_commander_trait.0004.a:0 "Нечестивцам не устоять перед воинством Создателя!"
 historical_commander_trait.0004.b:0 "Река не задержала Драккона, не задержит и меня!"
 historical_commander_trait.0004.c:0 "Если рассуждать логически, битву удалось выиграть за счет гибкой тактики."
 historical_commander_trait.0004.d:0 "Трюков, повышающих боевой дух, недостаточно, чтобы выиграть войну!"

 #Khalid ibn al-Walid
 historical_commander_trait.0005.t:0 "Меч Создателя"
 historical_commander_trait.0005.desc:0 "Изучая тактику древних полководцев, я задумываюсь о последней битве Маферата перед предательством Андрасте.\n\n#F В битве на Валарианских полях силы Тевинтера превосходили войско Маферата более чем втрое, но он сплотил дрогнувших солдат и удержал строй. Эта стойкая оборона позволила ему собрать эльфийское подкрепление и спасти своих людей от неминуемой гибели. Маферат и его армия завоевали южные пределы Тевинтера во имя Создателя!#!"
 historical_commander_trait.0005.a:0 "Сражающиеся во имя Создателя придут к победе!"
 historical_commander_trait.0005.b:0 "Самоотверженность дает нам силы перед лицом многочисленного врага."
 historical_commander_trait.0005.c:0 "Знать, #EMP когда#! сражаться, не менее важно, чем знать, #EMP как#! сражаться."
 historical_commander_trait.0005.d:0 "Зачем славить победу предателя?"
