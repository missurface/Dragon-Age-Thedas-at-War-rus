l_russian:
 #Generic Lines
 historical_commander_trait.reject.tt:1 "#F You will look elsewhere for inspiration #!"

 #Hannibal
 historical_commander_trait.0001.t:0 ""The Shield of Orzammar""
 historical_commander_trait.0001.desc:1 "While studying the tactics of ancient generals I was astonished to learn about the exploits of Paragon Aeducan during the First Blight:\n\n#F Known as "The Shield of Orzammar", Aeducan's crowning achievement was the defense of the city, where his army of roughly 50,000 outmaneuvered and encircled the larger 86,000 darkspawn horde. Surrounded and unable to retreat, only 3,000 darkspawn survived the massacre.#!"
 historical_commander_trait.0001.a:0 "Like Aeducan, I will annihilate my enemies! "
 historical_commander_trait.0001.b:0 "Aeducan was a true master of Attritional Warfare."
 historical_commander_trait.0001.c:0 "Versatility was Aeducan's greatest strength."
 historical_commander_trait.0001.d:0 "Bah! He didn't manage to save the outlying thaigs."
 historical_commander_trait.0001.d.good:0 "Brutality is not a trait to be envied, even in war."
 #Caesar
 historical_commander_trait.0002.t:0 "Antoridus' Triumph"
 historical_commander_trait.0002.desc:0 "While studying the tactics of ancient generals I was amused to learn about King Antoridus' exploits during his conquest of the Inghirsh.\n\n#F During his siege of Alesia, Antoridus determined that direct assault on the well-fortified city would be too costly. He instead ordered his army build his own fortress which surrounded the entire city, trapping the enemy garrison inside to starve while simultaneously preventing reinforcements from relieving the defenders.#!"
 historical_commander_trait.0002.a:0 "A little ingenuity goes a long way in a siege."
 historical_commander_trait.0002.b:0 "Make the enemy come to you! I like it!"
 historical_commander_trait.0002.c:0 "Antoridus took a risk with that plan, but it paid off!"
 historical_commander_trait.0002.d:0 "Wars just aren't fought like that these days..."
 #Alexander
 historical_commander_trait.0003.t:0 "The Unstoppable Isabela"
 historical_commander_trait.0003.desc:0 "While studying the tactics of ancient generals I was [ROOT.Char.Custom('surprised_reaction')] to learn about the exploits of Isabela Maria Arvale during Rivain's secession from Tevinter.\n\n#F During the Battle of Temerin, Queen Isabela assaulted an island fortress by demolishing a nearby town and then using the rubble to build a causeway stretching from the mainland to the city's walls. This allowed her caballeros to attack the enemy fortress directly, though it was her navy which ultimately created a breach#!"
 historical_commander_trait.0003.a:0 "No amount of water will stop my armies!"
 historical_commander_trait.0003.b:0 "That causeway was a feat of great ingenuity."
 historical_commander_trait.0003.c:0 "Turning my foe's resources against them? Brilliant!"
 historical_commander_trait.0003.d:0 "Why waste time studying tactics which didn't work?"

 #Constantine
 historical_commander_trait.0004.t:0 "The Vision of the Sun"
 historical_commander_trait.0004.desc:0 "While studying the tactics of historical generals I was inspired when I learned about Drakon I's victory at the Battle of Cumberland.\n\n#F The night before the battle, Drakon dreamed that victory would be granted if he painted a sunburst, a symbol of the Maker, on his soldiers' shields. He did exactly that, and the next day he overran the forces of the darkspawn, who fell into the Cumber River and drowned.#!"
 historical_commander_trait.0004.a:0 "The wicked are no match for the Maker's armies!"
 historical_commander_trait.0004.b:0 "Like Drakon, no river can delay my victory!"
 historical_commander_trait.0004.c:0 "Logically speaking, flexible tactics won that battle."
 historical_commander_trait.0004.d:0 "Tricks to bolster morale aren't enough to win wars!"

 #Khalid ibn al-Walid
 historical_commander_trait.0005.t:0 "The Sword of the Maker"
 historical_commander_trait.0005.desc:0 "While studying the tactics of ancient generals I became contemplative upon learning about Maferath's last battle before his betrayal of Andraste.\n\n#F Outnumbered more than 3 to 1 by the Tevinter during the Battle of Valarian Fields, Maferath rallied his wavering soldiers to hold the line. This defiant stand allowed him to organize elven reinforcements, saving his men from certain death. Maferath and his army had now conquered the southern reaches of Tevinter in the Maker's name!#!"
 historical_commander_trait.0005.a:0 "Those who fight in the Maker's name will be victorious!"
 historical_commander_trait.0005.b:0 "Devotion keeps us strong when outnumbered."
 historical_commander_trait.0005.c:0 "Knowing #EMP when#! to fight is as important as knowing #EMP how#!."
 historical_commander_trait.0005.d:0 "Why celebrate a betrayer's victory?"
