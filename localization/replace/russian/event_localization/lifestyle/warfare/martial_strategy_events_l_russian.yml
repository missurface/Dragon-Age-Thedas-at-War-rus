l_russian:
 #Well-known commander, by Sean Hughes
 martial_strategy.1051.t:0 "Расхожие слухи"
 martial_strategy.1051.desc:0 "[ROOT.Char.Custom('GetCourt')] без умолку обсуждает то одно, то другое, и в последнее время у всех на устах мои выдающиеся командирские навыки и секрет моей успешности.\n\nЯ могу использовать этот интерес, чтобы упрочить свою репутацию, но для начала нужно решить, чем объяснить мой успех..."
 martial_strategy.1051.a:0 "Мои природные способности ставят меня выше других."
 martial_strategy.1051.a.humble:0 "Я знаю пределы своих возможностей и умею обходить их."
 martial_strategy.1051.b.brave:0 "Моя отвага вдохновляет солдат на бой."
 martial_strategy.1051.b.stalwart:0 "Моя решимость такова, что я никогда не мешкаю!"
 martial_strategy.1051.c.wrathful:0 "Никто не выстоит против моей ярости!"
 martial_strategy.1051.c.feareater:0 "Одно мое присутствие вселяет страх в сердца врагов!"
 martial_strategy.1051.d.zealous:0 "Мои набожность и вера в [ROOT.GetCharacter.GetFaith.HighGodNamePossessive] приносят мне победу."
 martial_strategy.1051.d.sadistic:0 "Я всегда наношу удар в самое уязвимое место."
 martial_strategy.1051.d.zealoussadistic:0 "Ничто не остановит мою священную войну против нечестивцев!"
 martial_strategy.1051.e.patient:0 "Я всегда наготове и никогда не упускаю шанса нанести удар."
 martial_strategy.1051.f.ambitious:0 "Я сделаю #EMP что угодно#! ради победы!"

 
 #Translate old texts (Learning skill challenge), Mathilda Bjarnehed
 martial_strategy.2000.t:0 "Уроки прошлого"
 martial_strategy.2000.start.desc:0 "Хотя до встречи с Создателем меня, без сомнения, ждёт ещё немало битв, в моей библиотеке хранятся военные истории, которых хватит на сотню жизней.\n\nНедавно мне удалось приобрести книгу, повествующую о"

 martial_strategy.2000.hastings.desc:1 "битве на Безмолвных равнинах, " #dataw changed
 martial_strategy.2000.tours.desc:1 "битве при Монтсиммаре, " #dataw changed
 martial_strategy.2000.palaceofthemartyrs.desc:1 "битве при Темерине, " #dataw changed
 martial_strategy.2000.catalaunianplains.desc:1 "битве при Камберленде, " #dataw changed
 martial_strategy.2000.constantinople.desc:1 "падении Эстуотча, " #dataw changed
 martial_strategy.2000.vapati.desc:1 "осаде Вейсхаупта, " #dataw changed

 martial_strategy.2000.end.desc:1 "а также старинный свиток, написанный на каком-то древнем языке. Кто знает, какие забытые тайны он скрывает..."
 martial_strategy.2000.a:0 "Прочесть новую книгу."
 martial_strategy.2000.b:0 "Попытаться перевести старый свиток."
 martial_strategy.2000.b.success:0 "Мне удалось открыть крупицу древнего знания"
 martial_strategy.2000.b.success.tt:1 "Вы повышаете навык «[martial|El]» на #P 1#!, «[learning|El]» на #P 1#! и как [commander|El] получаете бонус сроком на #V 20 лет#!"
 martial_strategy.2000.b.failure:0 "Мне не удалось расшифровать свиток"
 martial_strategy.2000.b.failure.tt:1 "Повысьте уровень [Concept( 'stress', 'стресса' )|E] или сдайтесь"





 martial_strategy.2001.start.desc:0 "Даже с помощью пыльного словаря свиток не раскрывает своих тайн, но я не сдаюсь. Постепенно передо мной разворачивается невероятная история...\n\n"
 #DATAW CHANGED
 martial_strategy.2001.red_falls.desc:0 "#F Последний поединок легендарных Морриган'нан и Лутиаса Дварфсона стал кульминацией романтической драмы, принёсшей всем немало боли и страданий. Говорят, в одном из предыдущих сражений Лутиас встретился в поединке с сыном, рождённым от его связи с предводительницей враждебного племени. Бой был краток, но смертелен: Лутиас, не ведая того, убил собственного сына. Вскоре Морриган'нан открыла ему содеянное и прокляла тяжело раненного воина-аламарри, который в конце концов пал.#!"
 martial_strategy.2001.the_emerius_slave_revolt.desc:0 "#F В -25 году Древней эры смерть влиятельного раба-аламарри Радуна разожгла пламя восстания среди рабов города. Он добивался улучшения условий их жизни, поэтому в его гибели обвинили городских магистров. Рабы штурмовали Казематы, но были перебиты.\n\nНа протяжении целого года внутри города и за его стенами шли кровопролитные бои между рабами и солдатами. Рабы часто подавляли противника огромным численным превосходством, а солдаты удерживали ключевые узкие проходы, защищая Верхний город. Но в конце концов Верхний город был разграблен, весь город сгорел, а Эмериус переименовали в Киркволл.#!"
 martial_strategy.2001.valarian_fields.desc:1 "#F Битва на Валарианских полях произошла у Минратоса и стала самым тяжёлым сражением Андрасте за весь её Священный поход против Тевинтерской империи. Силы Минратоса совершили вылазку с городского моста против войска Невесты Создателя, превратив осаду в открытое сражение. Согласно преданиям, Андрасте сражалась бок о бок с эльфами Шартана и своим мужем Мафератом и сумела разгромить воинов слуг Древних богов. Часто говорят, что в тот день Создатель улыбнулся им, ибо предательство было уже близко.#!"
 martial_strategy.2001.pnemoix.desc:0 "#F В Погребальных песнях рассказывается, как во время битвы у реки Пнемуа король Неромениана Анторидус поджёг поля планасен. Однако планасены оросили землю водой почитаемой ими Пнемуа, и огонь не занялся. Встретив вражеское войско в поле, Анторидус обрушил на него тысячи стрел и копий. Стрелы сеяли смерть в рядах армии короля Дамертеса, но копья разбивались о щиты Сынов Пнемуа. И всё же силы Анторидуса погубило отречение Дамертеса от Создателя: когда тот отвернулся от Него, армию поразила болезнь и нероменианам пришлось отступить.#!"
 martial_strategy.2001.a:0 "Изучить сражение."
 martial_strategy.2001.b:0 "Сосредоточиться на самом переводе."

 martial_strategy.2002.desc:0 "Наступает ночь, и одинокая свеча, озаряющая лежащий передо мной свиток, становится все короче. Вот она трещит в последний раз, оставляя меня в темноте. Тайна свитка остается нераскрытой."
 martial_strategy.2002.a:0 "Продолжать работу."
 martial_strategy.2002.b:0 "Сдаться."


