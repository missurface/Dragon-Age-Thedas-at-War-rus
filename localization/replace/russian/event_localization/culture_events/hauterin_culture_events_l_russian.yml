l_russian:
hauterin_culture_event.0003.t:0 "Голоса Пустошей"
hauterin_culture_event.0003.desc:0 "Разбив лагерь в пустыне, я незаметно ухожу прогуляться в одиночестве. Уединение — величайшая роскошь правителя, особенно в путешествии со свитой. Под звёздами, наедине с пустошами, я забираюсь так далеко, что уже не слышу шума лагеря. И всё же рядом звучит чей-то голос. Слов мне не разобрать, но сомнений быть не может: кажется, со мной говорят сами пески."
hauterin_culture_event.0003.a:0 "Даже творение [Concept('maker', 'Создателя')|E] звучит [Concept('chant_of_light', 'Песнью Света')|E]."
hauterin_culture_event.0003.b:0 "Возможно, [Concept('dwarves', 'гномы')|E] не так уж неправы насчёт Камня."
hauterin_culture_event.0003.c:0 "Пустые мысли праздного разума. Пора возвращаться в лагерь."
hauterin_cultural_acceptance_gain:0 "Понимание Камня."
hauterin_culture_event.0005.t:0 "Склоняя чашу весов"
hauterin_culture_event.0005.desc:0 "Отладочное описание: правитель марешуа — [mare.GetTitledFirstName], правитель шанвалуа — [chan.GetTitledFirstName]."