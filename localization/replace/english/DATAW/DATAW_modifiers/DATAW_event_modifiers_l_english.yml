 DATAW_successful_token_house_building_program_county_modifier: "Token Housebuilding Program"
 DATAW_successful_token_house_building_program_county_modifier_desc: "With the small donation given by the crown, small quantities of housing have begun being built, to the pleasure of the population and the newly arriving workforce.\n\n"
