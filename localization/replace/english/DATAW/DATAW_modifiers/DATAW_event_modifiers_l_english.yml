 DATAW_disregard_for_peasants_modifier: "Disregard for Peasants"
 DATAW_disregard_for_peasants_modifier_desc: "The flagrant disregard for the common folk by the nobility combined with grueling taxes has led to disillusion regarding the renovation of the town.\n\n"

 # EVENT 3 MODIFIERS
 DATAW_patron_of_the_most_holy_modifier: "Patron of the Most Holy"
 DATAW_vocal_chantry_support_county_modifier: "Vocal Chantry support"
 DATAW_vocal_chantry_support_county_modifier_desc: "With the support of the andrastian clergy and Her Eminence, the city has seen a renewed fervour regarding its reconstruction.\n\n"
 DATAW_vocal_chantry_support_character_modifier: "Vocal Chantry Support"
 DATAW_vocal_chantry_support_character_modifier_desc: "With the support of the andrastian clergy and Her Eminence, the city has seen a renewed fervour regarding its reconstruction.\n\n"
 DATAW_moderate_chantry_support_county_modifier: "Moderate Chantry Support"
 DATAW_moderate_chantry_support_county_modifier_desc: "With a moderate investment of the crown in the Chantry's reconstruction, the andrastian clergy has proclaimed its support for the reconstruction of the city, giving some fervour to the most zealous.\n\n"
 DATAW_moderate_chantry_support_character_modifier: "Moderate Chantry Support"
 DATAW_moderate_chantry_support_character_modifier_desc: "With a moderate investment of the crown in the Chantry's reconstruction, the andrastian clergy has proclaimed its support for the reconstruction of the city, giving some fervour to the most zealous.\n\n"
 DATAW_chantry_opposition_modifier: "Chantry Opposition"
 DATAW_chantry_opposition_modifier_desc: " With the refusal to finance the Chantry during Val Royeaux's reconstruction, this character has seen opposition at every step from the clergy.\n\n"
 DATAW_convert_quidam_ruler_county_modifier: "Converted Quidam Ruler"
 DATAW_convert_quidam_ruler_county_modifier_desc: "With the conversion of the heathen ruler, the common populace has been invigorated with morale.\n\n"
 DATAW_convert_quidam_ruler_character_modifier: "Converted Quidam Ruler"
 DATAW_convert_quidam_ruler_character_modifier_desc: "With the conversion of the heathen ruler, the common populace has been invigorated with morale.\n\n"

 # EVENT 4 MODIFIERS
 DATAW_reinvigorated_docks_modifier: "Reinvigorated Docks"
 DATAW_reinvigorated_docks_modifier_desc: "Through imperial coin, the neighbourhood of Quai Royeaux has seen a renaissance, bringing trade and rebuilding to the city, reconnecting it fully to wider Thedas.\n\n"
 DATAW_slow_rebuilding_of_docks_modifier: "Slow Rebuilding of Docks"
 DATAW_slow_rebuilding_of_docks_modifier_desc: "Through some imperial coin, the neighbourhood of Quai Royeaux has seen a gradual rebuilding, bringing trade and rebuilding to the city, reconnecting it fully to wider Thedas.\n\n"
 DATAW_val_royeaux_docks_smugglers_modifier: "Thriving Smuggler Business"
 DATAW_val_royeaux_docks_smugglers_modifier_desc: "The installation of new taxes on the merchant class to pay for the city's reconstruction has led to a thriving smuggling business for those who have attempted to avoid the new taxes.\n\n"

 # EVENT 5 MODIFIERS
 DATAW_full_university_support_in_reconstruction_county_modifier: "Full University Support in Reconstruction"
 DATAW_full_university_support_in_reconstruction_county_modifier_desc: "With the full support of the University and their knowledge, the city has seen its reconstruction grow faster.\n\n"
 DATAW_full_university_support_in_reconstruction_character_modifier: "Full University Support in Reconstruction"
 DATAW_full_university_support_in_reconstruction_county_modifier_desc: "With the full support of the University and their knowledge, the city has seen its reconstruction grow faster.\n\n"
 DATAW_moderate_university_support_in_reconstruction_county_modifier: "Moderate University Support in Reconstruction"
 DATAW_moderate_university_support_in_reconstruction_county_modifier_desc: "With the small support of the University and their knowledge, the city has seen its reconstruction grow faster.\n\n"
