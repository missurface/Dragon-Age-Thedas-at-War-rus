 ### Rebuilding Val Royeaux Events
 #DECISION MODIFIERS
 DATAW_val_royeaux_being_rebuilt_modifier: "Rebuilding Val Royeaux"
 DATAW_val_royeaux_being_rebuilt_modifier_desc: "A large investment has been made into the future of Val Royeaux. With the goal being to return this burnt city to its former glory."
 
 # EVENT 1 MODIFIERS
 DATAW_large_investment_in_val_royeaux_modifier: "Large Investment in Reconstruction"
 DATAW_large_investment_in_val_royeaux_modifier_desc: "After a large investment into the city's construction projects and industry, Val Royeaux has seen an influx of workers and projects, rejuvenating the town after the destruction laid by the sack.\n\n"
 DATAW_modest_investment_in_val_royeaux_modifier: "Modest Investment in Reconstruction"
 DATAW_modest_investment_in_val_royeaux_modifier_desc: "After a modest investment into the city's construction projects and industry, Val Royeaux has seen an influx of workers and projects, rejuvenating the town after the destruction laid by the sack.\n\n"
 DATAW_small_investment_in_val_royeaux_modifier: "Small Investment in Reconstruction"
 DATAW_small_investment_in_val_royeaux_modifier_desc: "After a small investment into the city's construction projects and industry, Val Royeaux has seen an influx of workers and projects, rejuvenating the town after the destruction laid by the sack.\n\n"

 # EVENT 2 MODIFIERS
 DATAW_successful_large_house_building_program_county_modifier: "Large Housebuilding Program"
 DATAW_successful_large_house_building_program_county_modifier_desc: "With the liege's very generous donation, large quantities of housing have begun being built, to the pleasure of the population and the newly arriving workforce.\n\n"
 DATAW_successful_large_house_building_program_character_modifier: "Large Housebuilding Program"
 DATAW_successful_large_house_building_program_character_modifier_desc: "With the liege's very generous donation, large quantities of housing have begun being built, to the pleasure of the population and the newly arriving workforce.\n\n"
 DATAW_unsuccessful_large_house_building_program_county_modifier: "Large Housing Corruption"
 DATAW_unsuccessful_large_house_building_program_county_modifier_desc: "The generous funding given by the crown for housing as been used in multiple sham projects, leading to frustrations as project investors cash in the money and the common populace is left struggling for a roof.\n\n"
 DATAW_unsuccessful_large_house_building_program_character_modifier: "Large Housing Corruption"
 DATAW_unsuccessful_large_house_building_program_character_modifier_desc: "The generous funding given by the crown for housing as been used in multiple sham projects, leading to frustrations as project investors cash in the money and the common populace is left struggling for a roof.\n\n"
 DATAW_successful_modest_house_building_program_county_modifier: "Modest Housebuilding Program"
 DATAW_successful_modest_house_building_program_county_modifier_desc: "With the liege's donation, significant quantities of housing have begun being built, to the pleasure of the population and the newly arriving workforce.\n\n"
 DATAW_successful_modest_house_building_program_character_modifier: "Modest Housebuilding Program"
 DATAW_successful_modest_house_building_program_character_modifier_desc: "With the liege's donation, significant quantities of housing have begun being built, to the pleasure of the population and the newly arriving workforce.\n\n"
 DATAW_unsuccessful_modest_house_building_program_county_modifier: "Modest Housing Corruption"
