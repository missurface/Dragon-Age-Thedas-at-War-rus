### Halla Vhenasan
 building_type_halla_vhenasan_01: "Halla Vhenasan"
 building_type_halla_vhenasan_01_desc: "A sanctuary for the Halla of the Dales."
 building_halla_vhenasan_01: "Halla Vhenasan"
 building_halla_vhenasan_01_desc: "Here in this sanctuary, it is believed by the followers of the Evanuris that Ghilan'nain created the Halla, this magnificent creature so useful to everyday life. Everyday, passersby notice the numerous groups of Halla wandering the little clearing, much to their glee."
 building_halla_vhenasan_02: "Halla Vhenasan Temple"
 building_halla_vhenasan_02_desc: "With part of the woods cleared out, there is now a magnificent little temple at the edge of the clearing that constitutes the Halla Vhenasan, ornately built in the distinctly Dalish style emulating Arlathan, in reverence to the Mother of the Halla, Ghilan'nain. A few have also begun to live alongside the temple, taking care of the Halla, to the delight of the locals."
 ### Aeonar
 building_type_aeonar_01: "Ruins of Aeonar"
 building_type_aeonar_01_desc: "Situated at the northern edge of the Imperial Highway, Aeonar was one of two towers constructed by the Tevinter Imperium prior to the First Blight used for magical experimentation and studies. After news that the prophetess Andraste has died in the Imperium, her disciples overran the tower and massacred the mages inside it. As a result of the experiments and the massacre, the Veil was left dangerously thin."
 building_aeonar_01: "Ruins of Aeonar"
 building_aeonar_01_desc: "Situated at the northern edge of the Imperial Highway, Aeonar was one of two towers constructed by the Tevinter Imperium prior to the First Blight used for magical experimentation and studies. After news that the prophetess Andraste has died in the Imperium, her disciples overran the tower and massacred the mages inside it. As a result of the experiments and the massacre, the Veil was left dangerously thin."
 building_aeonar_02: "Aeonar Tower"
 building_aeonar_02_desc: "Situated at the northern edge of the Imperial Highway, Aeonar was one of two towers constructed by the Tevinter Imperium prior to the First Blight used for magical experimentation and studies. Now under the firm control of the Chantry, its location is a secret known to select few in the Chantry and Templar hierachies. Aeonar is used by the Templars as a prison for accused maleficarum, apostates and even non mages who assisted them. With the Veil being so thin, Aeonar serves as trial by fire to determine the guilt of the mages."
