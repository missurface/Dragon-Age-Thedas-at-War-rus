 ### Halamshiral 
 building_type_halamshiral_01: "City of Halamshiral"
 building_type_halamshiral_01_desc: "The forest city of Halamshiral - translating to \"end of the journey\" in elvish - is the first of its kind since the fabled city of Arlathan. Few [human|E]s have laid eyes on it, for the [elves|E] guard their borders jealously."
 building_halamshiral_01: "$building_type_halamshiral_01$"
 building_halamshiral_01_desc: "$building_type_halamshiral_01_desc$"
 ### Halla Vhenasan
 building_type_halla_vhenasan_01: "Halla Vhenasan"
 building_halla_vhenasan_01: "Halla Vhenasan"
 building_halla_vhenasan_01_desc: "Here in this sanctuary, it is believed by the followers of the Evanuris that Ghilan'nain created the Halla, this magnificent creature so useful to everyday life. Everyday, passersby notice the numerous groups of Halla wandering the little clearing, much to their glee."
 building_halla_vhenasan_02: "Halla Vhenasan Temple"
 building_halla_vhenasan_02_desc: "With part of the woods cleared out, there is now a magnificent little temple at the edge of the clearing that constitutes the Halla Vhenasan, ornately built in the distinctly Dalish style emulating Arlathan, in reverence to the Mother of the Halla, Ghilan'nain. A few have also begun to live alongside the temple, taking care of the Halla, to the delight of the locals."
 ### Imperial Palace of Orlais
 building_type_imperial_palace_orlais: "Imperial Palace of Orlais"
 building_type_imperial_palace_orlais_desc: "The shining jewel of the Orlesian Empire, the Imperial Palace of Orlais glitters high above the city of Val Royeaux, with the Waking Sea stretching out before it. The three domes dazzle and entrance, with all of Thedas marvelling at the elegance and beauty of its design. \n\nToday, the Imperial Palace stands as a beacon of the Empire of Orlais founded by the Drakon, rivalling in prestige the great palace of the Archon in Minrathous."
 building_imperial_palace_orlais: "$building_type_imperial_palace_orlais$"
 building_imperial_palace_orlais_desc: "$building_type_imperial_palace_orlais_desc$"
 ### Jeshavis' Digue
 building_type_jeshavis_dyke_01: "Jeshavis' Digue"
 building_type_jeshavis_dyke_01_desc: "When Jeshavis united the Ciriane tribes, to protect her lands from the Alamarri she created a series of dykes on the western border of Jader to ensure that Alamarri raiders and invaders wouldn't be able to trample over the lands of the Ciriane ever again."
 building_jeshavis_dyke_01: "Jeshavis' Digue"
 building_jeshavis_dyke_01_desc: "When Jeshavis united the Ciriane tribes, to protect her lands from the Alamarri she created a series of dykes on the western border of Jader to ensure that Alamarri raiders and invaders wouldn't be able to trample over the lands of the Ciriane ever again."
 ### Kal Repartha
 building_type_kal_repartha_01: "Kal Repartha"
 building_type_kal_repartha_01_desc: "$building_kal_repartha_01_desc$"
 building_kal_repartha_01: "Kal Repartha"
 building_kal_repartha_01_desc: "Ruins of an ancient dwarven thaig litter the landscape of this region. Although the presence of a thaig on the surface confuses many scholars, the name of Kal Repartha is one of the rare things we know of the structure, and its tales of grand constructions and prosperity as well as its crafts of masterworks influence the locals to this day."
 building_type_kal_repartha_02: "$building_type_kal_repartha_01$"
 building_type_kal_repartha_02_desc: "$building_kal_repartha_02_desc$"
 building_kal_repartha_02: "Kal Repartha the Rebuilt"
 building_kal_repartha_02_desc: "Now that the sand and dunes have been driven out of the thaig, the great halls and buildings of Kal Repartha stand strong amongst the Hissing Wastes, a monument of the masterful dwarven engineering of Paragon Fairel, who, according to the teams during the renovations, built the above ground Thaig, even though the Shaperate of Orzammar says he never left the [deep_roads|E] alive. Nevertheless, its tales of masterworks, prosperity, as well as the thaig's place as a unique oddity in dwarven history makes Kal Repartha a place worthy of respect."
 building_type_kal_repartha_03: "$building_type_kal_repartha_01$"
 building_type_kal_repartha_03_desc: "$building_kal_repartha_03_desc$"
 building_kal_repartha_03: "Kal Repartha the Magnificent"
 building_kal_repartha_03_desc: "With the help from the rare members of the smith and artisan caste that chose to leave for the surface, Kal Repartha is now rebuilt in all its glory, made to last both a grueling siege and a century of glory. The various great halls, depicting the thaig's rich history and the lush landscapes of the Western Approach before the Second [blight|E] bring evermore beauty to the area. No matter who looks at this masterwork of a city rebuilt amongst the dunes, none, not even the [dwarves|E] of Orzammar themselves, can deny its beauty."
 ### Kinloch Hold
 building_type_kinloch_hold_01: "Kinloch Hold"
 building_type_kinloch_hold_01_desc: "A watchtower and fortress built by the Avvars with dwarven assistance, thought to be virtually impregnable. The Avvars say the lake surrounding the tower was once the site of Belenas, the mountain which stood at the center of the world, from which Korth the Mountain Father surveyed the earth and sky."
 building_kinloch_hold_01: "$building_type_kinloch_hold_01$"
 building_kinloch_hold_01_desc: "$building_type_kinloch_hold_01_desc$"
 building_kinloch_hold_02: "Kinloch Mage Tower"
 building_kinloch_hold_02_desc: "The Tevinter believe that the waters of Lake Calenhad are blessed by Razikale, god of mysteries, and that those who drink from them are granted special insights. This is why they built the great tower on an island in the middle of the lake, hoping the powers of the lake would aid their magical research."
 building_kinloch_hold_03: "Kinloch Haunted Tower"
 building_kinloch_hold_03_desc: "When the original watchtower was conquered by the Imperium, the Tevinter slew the Avvars there with such savagery that now the deserted mage tower built on the site is thought to be cursed and even haunted."
 building_kinloch_hold_04: "Kinloch Circle Tower"
 building_kinloch_hold_04_desc: "The schism with the [chantry|E] in Tevinter has caused great resentment against [dataw_magic|E] throughout the southern lands. The [circle|E] of Magi in Denerim was forced to abandon its tower within the city (which was subsequently razed), assuming control instead over the old Tevinter tower, where they may practice their arts in peace."
 ### Korcari Gold Pools
 building_type_korcari_gold_mine_01: "Korcari Gold Pools"
 building_type_korcari_gold_mine_01_desc: "The locals have often talked about these pools being blessed due to the abundance of gold that seems to float in the waters causing them to shimmer in the sunlight. Many pan for it to be used in jewelry as well as other trinkets that can be bartered across the Wilds."
 building_korcari_gold_mine_01: "$building_type_korcari_gold_mine_01$"
 building_korcari_gold_mine_01_desc: "$building_type_korcari_gold_mine_01_desc$"
 building_korcari_gold_mine_02: "Korcari Gold Mines"
 building_korcari_gold_mine_02_desc: "After much effort the pools have been drained and new pits dug to find the source of the gold below. These new mining pits bring great wealth to the region with the high quantity of gold excavated from them and used in jewelry that are then sold even outside of the Wilds."
 ### Marquis Hunting Grounds
 building_type_marquis_hunting_grounds_01: "Marquis Hunting Grounds"
 building_type_marquis_hunting_grounds_01_desc: "Val Foret is known for being a beautiful hunting ground for many all around Orlais. The forest is dense, full of beautiful beasts like the bears of Val Foret, who wear a red-brown coat on their skin. Peasants and nobles alike hunt in this beautiful forest and bring much fruit from it, to the pleasures of those searching to buy meat and fur alike."
 building_marquis_hunting_grounds_01: "Hunting grounds of the Marquis"
 building_marquis_hunting_grounds_01_desc: "Val Foret is known for being a beautiful hunting ground for many all around Orlais. The forest is dense, full of beautiful beasts like the bears of Val Foret, who wear a red-brown coat on their skin. Peasants and nobles alike hunt in this beautiful forest and bring much fruit from it, to the pleasures of those searching to buy meat and fur alike."
 building_marquis_hunting_grounds_02: "Hunting Bureau of Val Foret"
 building_marquis_hunting_grounds_02_desc: "With the amount of unregistered hunting that was done by peasants in the neighbouring forest, it was time to install a hunting bureau. Cooperating with the local guard to assure their will is respected, all hunters now need to buy a hunting license to hunt in the beautiful hunting grounds of Val Foret, lest they be punished. While this has brought some more safety and wealth to the locals, hunting has declined among the peasants as a result."
 marquis_hunting_grounds_desc: "Significantly more likely to generate Dangerous Animal sightings and $unlocks_building_desc$Increases [hunt_sighting|E] Chance and [hunt_success_chance|E] for[GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName] [activities|E] Hosted in this [holding|E]"
 activity_hunt_province_desc_marquis_hunting_grounds_minor: "#P ++ $building_type_marquis_hunting_grounds_01$#! ([building|E])\n"
