 ### Southern_Monastery
 building_type_southern_monastery_01: "Grand Southern Monastery"
 building_southern_monastery_01: "Monastery of the Southern Frontier"
 building_southern_monastery_01_desc: "A monastery built to honour the [maker|E] even on the very last frontier of [thedas|E], this chantry, while isolated, is quite respected and cherished in the region, and is the source of the faith of many locals, who swear by it and condemn the ones without piety."
 southern_monastery_desc_01: "+15% conversion resistance."
 building_southern_monastery_02: "Holy Reserve of the Divines’s Scriptures"
 building_southern_monastery_02_desc: "The small and insignificant monastery has now been erected for a greater purpose: the safekeeping of the scriptures of the Divines of Val Royeaux. From Justinia the First to the last, their writings are kept, preserved and studied, forming a respected and quite unique center of theological debate, all the while giving multiple intellectuals contributing to technological and social advancements."
 southern_monastery_desc_02: "+25% conversion resistance."
 STEWARD_PROMOTE_RELIGION_BUILDING_PENALTY: "Building conversion resistance."

