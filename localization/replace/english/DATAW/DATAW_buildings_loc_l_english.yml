l_english:
 NOT_holy_site_andrastian_trigger: "The holder must be Andrastian or consider this a [holy_site|E]"
 
 ### Adamant Fortress
 building_type_adamant_fortress_01: "Adamant Fortress"
 building_type_adamant_fortress_01_desc: "$building_adamant_fortress_01_desc$"
 building_adamant_fortress_01: "Adamant Fortress"
 building_adamant_fortress_01_desc: "Built by the [dwarves|E] to guard the Abyssal Rift, in the heart of the Western Approach, the fortress was instrumental in the [grey_warden|E] defense against the [darkspawn|E] in the Second [blight|E]. Built to last through the ages even through the harsh sand, the walls appear more sturdy than large, and their tall walls assure that the fortress is still, and will be through the ages a great defensive position."
 building_adamant_fortress_02: "Renovated Adamant Fortress"
 building_adamant_fortress_02_desc: "Now renovated with new techniques, the walls are much more larger and sturdier than before, reinforced by both material and [dataw_magic|E]. Twice as large and twice as solid, the Adamant Fortress now stands as the greatest bastion of defense above the Abyssal Rift, ready to defend the whole of the Western Approach and beyond against the [darkspawn|E]."
 ### Andoral's Reach
 building_type_andorals_reach_01: "Andoral's Reach"
 building_type_andorals_reach_01_desc: "Andoral's Reach was a mighty Tevinter fortress, constructed to guard the northern road into the Imperium from Orlais. Destroyed by Andraste's Exalted March centuries ago, it sits at a strategic crossroads between northern and southern Thedas."
 building_andorals_reach_01: "Andoral's Reach (Ruined)"
 building_andorals_reach_01_desc: "The crumbling stones of this once majestic Tevinter fortress now lie as a monument to the past, a shattered testament to times long gone. The domed spire is torn down, the twinned keep threaded with vines, and wolves make their lair in the darkness. Yet, even amidst the devastation wrought by the Alamarri, the walls provide a stubborn obstacle for any invader, and a welcome bastion for any defender. With much labour and coin, this holdfast could be restored."
 building_andorals_reach_02: "Andoral's Reach (Restored)"
 building_andorals_reach_02_desc: "What was once broken is now renewed. Masonry restored, the courtyard rebuilt and repaved. The keeps have been refurnished and stocked with arrows, castle-forged blades, and good armour sitting ready. The formidable Tevinter designs still hold their own, and now this fortress stands as a nigh-impenetrable guardian to the north. Heavily garrisoned and supplied, Andoral's Reach once more serves as the shield of northern Orlais; daunting, unforgiving, and determined never to fall again."
 building_andorals_reach_03: "Andoral's Reach (Resplendant)"
 building_andorals_reach_03_desc: "Before, this bastion was the shield. Where once wolves ventured out to hunt and maim, now the warriors of this imposing citadel sally out to dominate the surrounding countryside. Every corridor and chamber thrums with life, as soldiers come and go, messengers canter from the gates. Modern designs aid the already imposing defences, with barbicans and additional towers turning the killing space outside the walls into a land of death and agony. Through generations of effort and coin, Andoral's Reach has been forged into one of the most awe-inspiring fortresses in Thedas - the Tower of Orlais."
 ### Brasiers of Val Montaigne
 building_type_brasiers_val_montaigne_01: "Brasiers of Val Montaigne"
 building_type_brasiers_val_montaigne_01_desc: "Built a long time ago by the founder of the Blanchard, the castle of Val Montaigne stands as a monument of old Ciriane architecture, and its carefully maintained walls are still able to last a siege with ease. Yet what attracts attention are the three brasiers, lit at all hours of the day to guide the various ships of Lake Celestine to Val Montaigne, guarding the river's entrance. Today associated with the [maker|E], it is said that the fires should die out only in Montaigne's darkest hour, a tradition that stands ever since the breaking of Val Montaigne's siege at the height of the Second [blight|E]."
 building_brasiers_val_montaigne_01: "Three Brasiers of Val Montaigne"
 building_brasiers_val_montaigne_01_desc: "Built a long time ago by the founder of the Blanchard, the castle of Val Montaigne stands as a monument of old Ciriane architecture, and its carefully maintained walls are still able to last a siege with ease. Yet what attracts attention are the three brasiers, lit at all hours of the day to guide the various ships of Lake Celestine to Val Montaigne, guarding the river's entrance. Today associated with the [maker|E], it is said that the fires should die out only in Montaigne's darkest hour, a tradition that stands ever since the breaking of Val Montaigne's siege at the height of the Second [blight|E]."
 building_brasiers_val_montaigne_02: "Blazing Fortress of Val Montaigne"
 building_brasiers_val_montaigne_02_desc: "With the old walls rebuilt for the modern age, the Castle of Val Montaigne now has sturdier walls than ever before, yet the real thing catching the people's attention are and have always been the brasiers. Now rebuilt and accommodated to burn brighter, longer and in all directions, they are a monument to Andrastianism the old Ciriane could only dream of, as well as a blessing to the sailors."
 ### Brecilian Ruins
 building_type_brecilian_ruins_01: "Brecilian Ruins"
 building_type_brecilian_ruins_01_desc: "An ancient ruin left by the Tevinter Imperium in its glory days of old, relics of a great fortress established to better hold control of the tumultuous Forest. Today, only remnants of the fortress remain, solely having importance for its magical properties, defensive positions, and leftover knowledge rediscovered little by little by the locals."
 building_brecilian_ruins_01: "Tevinter Ruins"
 building_brecilian_ruins_01_desc: "An ancient ruin left by the Tevinter Imperium in its glory days of old, relics of a great fortress established to better hold control of the tumultuous Forest. Today, only remnants of the fortress remain, solely having importance for its magical properties, defensive positions, and leftover knowledge rediscovered little by little by the locals."
 building_brecilian_ruins_02: "Rebuilt Tevinter Ruins"
 building_brecilian_ruins_02_desc: "An ancient ruin left by the Tevinter Imperium in its glory days of old, these ruins are the remnants of a great fortress established to better hold control of the tumultuous Forest. Today, although it has been rebuilt to a functional level, it is far from the marvel it once was. Regardless, its defences, magical energy as well as its lost knowledge make it a strategic fortress of the region."
 building_brecilian_ruins_03: "Restored Tevinter Ruins"
 building_brecilian_ruins_03_desc: "Once an ancient ruin left by the Tevinter Imperium in its glory days of old, the Brecilian Fortress is a great fortification that was established to better hold control of the tumultuous forest. Now rebuilt in all its glory, the fortress now towers majestically over the surrounding forest, defying the region that reclaimed it for so long through sheer majesty. Its defences, magical energy as well as its lost knowledge make it a strategic fortress of the region, and its size and grandiose architecture make the fortress a place worthy of the mightiest of kings."
 ### Castle Redcliffe
 building_type_castle_redcliffe: "Castle Redcliffe"
 building_type_castle_redcliffe_desc: "Castle Redcliffe is the first and last defense for the sole land route into Ferelden, and the country has never fallen to any force that did not first capture Redcliffe. The village it guards is well situated near the mountain pass to Orzammar and the Orlesian border, and so serves as a center of foreign trade."
 building_castle_redcliffe: "$building_type_castle_redcliffe$"
 building_castle_redcliffe_desc: "$building_type_castle_redcliffe_desc$"
 ### Cendrerin Trading market
 building_type_cendrein_market_01: "Cendrerin Trading market"
 building_cendrein_opinion: "$cendrein$ Opinion"
 building_cendrein_market_01: "Cendrerin Trading market"
 building_cendrein_market_01_desc: "Due to repeated contacts with the Cendrerin of the Sea of Ash, a small market has set itself up in the region. Everything from the famous fish sauce of the Cendrerin to the most obscure metal or mineral dug up from the mountains is sold by the nomads to buy precious commodities they wouldn't find elsewhere, while some few settle in the region, forsaking their tribes to join the settled life in Orlais."
 building_cendrein_market_02: "Cendrerin bazaar"
 building_cendrein_market_02_desc: "Thanks to funding, the little market has now transformed into a greater market, where multiple tribes come to trade for multiple commodities from all over [thedas|E], while selling sulphur, fish and plenty of other products from the surprisingly rich Sea of Ash. Some Cendrerin have now settled more permanently in the region for the benefit of trade."
 building_cendrein_market_03: "Cendrerin quarter"
 building_cendrein_market_03_desc: "With the increased presence of the Cendrerin thanks to trade and settling, a neighbourhood as now been established for the Cendrerin nomad, which immensely helps in the matter of trade with the nomads of the Sea of Ash, as well as housing a significant minority of Cendrerin inhabitants. Some Cendrerin, however, tend to miss the life of wandering, and leave to adventure in the rest of [thedas|E]."
 cendrein_market_01: "Cendrerin guests will periodically arrive."
 cendrein_market_02: "Cendrerin courtiers will periodically arrive."
 cendrein_market_03: "Cendrerin courtiers and adventurers will periodically arrive."
 dataw_events_gamord.0072.t: "A Cendrerin trader gains prominence in Lisière-de-Cendre."
 dataw_events_gamord.0072.desc: "[cendrerin_merchant.GetHerHis] joined your court."
 dataw_events_gamord.0073.t: "An adventuring Cendrerin sets out into the world."
 dataw_events_gamord.0073.desc: "[cendrerin_merchant.GetShortUIName|U] formed an adventuring band."
 ### Chantry of Montsimmard
 building_type_olessa_chantry_01: "Chantry of Montsimmard"
 building_type_olessa_chantry_01_desc: "This chantry was built shortly after the founding of the Orlesian Chantry by Kordillus Drakon. The Chantry's location is apparently the exact place of birth of Olessa of Montsimmard, later known as the very first [divine|E] under the name Justinia. Every brick, every statue is dedicated to the First [divine|E], and every part of the building tell the tales of the Warrior-Priest, and attracts pilgrims from all over [thedas|E]."
 building_olessa_chantry_01: "Chantry of Olessa of Montsimmard"
 building_olessa_chantry_01_desc: "This chantry was built shortly after the founding of the Orlesian Chantry by Kordillus Drakon. The Chantry's location is apparently the exact place of birth of Olessa of Montsimmard, later known as the very first [divine|E] under the name Justinia. Every brick, every statue is dedicated to the First [divine|E], and every part of the building tell the tales of the Warrior-Priest, and attracts pilgrims from all over [thedas|E]."
 ### Château Klay
 building_type_klay_castle_01: "Château Klay"
 building_type_klay_castle_01_desc: "$building_klay_castle_01_desc$"
 building_klay_castle_01: "Château Klay"
 building_klay_castle_01_desc: "Château Klay is renowned throughout the entirety of Orlais for its architecture. Made from beautiful white marble, glass from among the finests Serault has produced, as well as wonderful wood from the Tirashan, the Château is seen as the last bastion of real and honest civilization on the western edge of Orlais, to the benefit of the standing of their holders."
 building_type_klay_castle_02: "$building_type_klay_castle_01$"
 building_type_klay_castle_02_desc: "$building_klay_castle_02_desc$"
 building_klay_castle_02: "Stables of Château Klay"
 building_klay_castle_02_desc: "Château Klay is renowned throughout the entirety of Orlais for its architecture, made from among the most beautiful of materials from all over Orlais. The Château, as well as his stables, housing and creating fine breeds of gray palfrey, make the place renowned for its well-bred horses,  and maintains a reputation as “an island of real civilization west of the barbarous swamp”."
 building_type_klay_castle_03: "$building_type_klay_castle_01$"
 building_type_klay_castle_03_desc: "$building_klay_castle_03_desc$"
 building_klay_castle_03: "Great Stables of Château Klay"
 building_klay_castle_03_desc: "Château Klay is renowned throughout the entirety of Orlais for its architecture and stables, made both from the finest marble and wood money can buy. The Gray Palfreys bred in the Great Stables of Château Klay are renowned and used throughout the entirety of Orlais by prominent chevaliers, and all of them have come out of their trip to Alyons signing virtues of the beauties of Château Klay, making it seem like a paradise lost among the wilds of the West."
 ### Château of Serault
 building_type_serault_castle_01: "Chateau of Serault"
 building_type_serault_castle_01_desc: "There's nothing else in Orlais like the Chateau Serault! There are three hundred and twenty-seven windows in the castle (exaggerations claim a thousand), and enough fine glass to buy a marcher city outright. A remote place, but strong. The Château stands on an island in mid-river. The Bridge of Masks is the only way east to Serault Town; the Green Bridge is the only way west, to the forest."
 building_serault_castle_01: "$building_type_serault_castle_01$"
 building_serault_castle_01_desc: "$building_type_serault_castle_01_desc$"
 building_type_serault_castle_02: "$building_type_serault_castle_01$"
 building_type_serault_castle_02_desc: "\"Payment in Glass\" has always been the motto of the de Serault family, and never has it been more fitting. The glassworkers of Serault are now kept in a gilded cage, their movements restricted, for they are the lifeblood of Serault's economy and its magnificent new glassworks. The profits derived from their labors have allowed for further fortification of the chateau against threats - both human and those that lurk in the forest."
 building_serault_castle_02: "$building_type_serault_castle_01$"
 building_serault_castle_02_desc: "$building_type_serault_castle_02_desc$"
 building_type_serault_castle_03: "$building_type_serault_castle_01$"
 building_type_serault_castle_03_desc: "Serault Town prospers! The wealth generated from the glassworks has resulted in newfound growth for the frontier settlement, as well as the establishment of a trade port on the river."
 building_serault_castle_03: "$building_type_serault_castle_01$"
 building_serault_castle_03_desc: "$building_type_serault_castle_03_desc$"
 ### Ciriane Frontier Outpost
 building_type_ciriane_frontier_outpost_01: "Outposts"
 building_type_ciriane_frontier_outpost_01_desc: "$building_ciriane_frontier_outpost_01_desc$"
 building_ciriane_frontier_outpost_01: "Surveillance Outpost"
 building_ciriane_frontier_outpost_01_desc: "A surveillance outpost built on the edge of the Tirashan Forest, this military facility is used by various scouts as both a way to train their skills of camouflage, and as a way to survey the treacherous and mysterious forest."
 building_type_ciriane_frontier_outpost_02: "$building_type_ciriane_frontier_outpost_01$"
 building_type_ciriane_frontier_outpost_02_desc: "$building_ciriane_frontier_outpost_02_desc$"
 building_ciriane_frontier_outpost_02: "Homestead Outposts of the Tirashan"
 building_ciriane_frontier_outpost_02_desc: "What was a simple surveillance outpost used for scout training on the edge of the Tirashan has become a network of homesteads, lying on the edge and even inside the treacherous forest, laying the land and using woodworking and farming soil to the profit of the landowners. This network, which sometimes see one of theirs disappear mysteriously, has been a fertile ground for competent scouts ever since its conception, due to the nearby and still active old outpost."
 ### Town of Gwaren
 building_type_gwaren_special_building_02: "$building_gwaren_special_building_02$"
 building_type_gwaren_special_building_02_desc: "$building_gwaren_special_building_02_desc$"
 building_gwaren_special_building_02: "Town of Gwaren"
 building_gwaren_special_building_02_desc: "Thanks to a renewal of trade with the Clayne, Gwaren, now a modest town, begins a slow return to its former grandeur. Newly constructed palisades once more protect the city and more ships dock at the harbor daily. Nevertheless, ruins still encircle the outskirts and half-destroyed remnants of buildings litter the town; it yet pales in comparison to the Gwaren of old."
 ### City of Gwaren
 building_type_gwaren_special_building_03: "$building_gwaren_special_building_03$"
 building_type_gwaren_special_building_03_desc: "$building_gwaren_special_building_03_desc$"
 building_gwaren_special_building_03: "City of Gwaren"
 building_gwaren_special_building_03_desc: "With the construction of proper defences and the expansion of Gwaren's trade routes, the fledgling economic hub has grown into a full-fledged city once again, with more vessels, people and trade coming in than ever before. It is said that some dwarves even made their return to the city to trade once more, to the delight of the local populace."
 ### City of Seas
 building_city_of_seas_01: "Admiralty's Grand Port"
 building_city_of_seas_01_desc: "The Admiralty's Grand Port is a symbol of the renewal of the archipelago, with its bustling docks, markets and wonderful architecture inspired from the world over, making it contrast with the rest of the Island. Goods from as far as Par Vollen can be found in this port, and the diversity of these goods only enhances further if we look at the massive black market dominating the port's economy, a remnant of Brandel's Reach's past."
 building_type_city_of_seas_01: "$building_city_of_seas_01$"
 building_type_city_of_seas_01_desc: "$building_city_of_seas_01_desc$"
 ### Cliffbreaker Waterfall
 building_type_hrimwudu_waterfall_01: "Cliffbreaker Waterfall"
 building_type_hrimwudu_waterfall_01_desc: "Named \"The Cliffbreaker\" by the old avvar clans that first settled the valley, this waterfall, starting from the top of a great cliff high in the Frostbacks, flows down into the valley, bringing a great source of water to both civilization and fauna. As such, it has always been seen by the locals as a symbol and cause of their successful settlements."
 building_hrimwudu_waterfall_01: "Cliffbreaker Waterfall"
 building_hrimwudu_waterfall_01_desc: "Named \"The Cliffbreaker\" by the old avvar clans that first settled the valley, this waterfall, starting from the top of a great cliff high in the Frostbacks, flows down into the valley, bringing a great source of water to both civilization and fauna. As such, it has always been seen by the locals as a symbol and cause of their successful settlements."
 ### Dragon Hunting Guild
 building_type_dragon_hunters_01: "Dragon Hunting Guild"
 building_type_dragon_hunters_01_desc: "$building_dragon_hunters_01$"
 building_dragon_hunters_01: "Small Dragon Hunting Guild"
 building_dragon_hunters_01_desc: "Built during the late Ancient Age at one of the highs of [dragon|E] activity, the famed Dragon Hunting Guild is renowned locally in Orlais and nearby Nevarra, despite its relatively small size, for its many famed [dragon|E] hunters, mostly composed from Nevarran hunters and Perendale locals. During the lulls of [dragon|E] hunting, those hunters regale the local folk of stories and hunt more regular, but still dangerous animals."
 dragon_hunters_01_cheaper_hunt_cost_desc: "$building_dragon_hunters_01$"
 building_dragon_hunters_02: "Great Dragon Hunting Guild of Perendale"
 building_dragon_hunters_02_desc: "Now funded with proper equipment and space for their hobby, the Dragon Hunting Guild is now renowned from Mont-de-Glace to Ayesleigh for its renowned hunters, with tales of slaying dragons, darkspawn and wyverns alike. One of the great tricks of the guild, used against many aggressive animals, is to use one of the damned indigenous goats of the region as bait, to the pleasure of the locals, who can't stand the damn beast."
 dragon_hunters_02_cheaper_hunt_cost_desc: "$building_dragon_hunters_02$"
 dragon_hunters_activity_desc: "Significantly more likely to generate Dangerous Animal sightings and lower cost of [GetActivityType('activity_hunt').GetName] [activities|E] Hosted in this [holding|E] and [characters|E] gain [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [traits|E] more often"
 ### Dubuef Vineyards
 building_type_dubuef_vineyards_01: "Dubuef Vineyards"
 building_type_dubuef_vineyards_01_desc: "Dubuef is known for its bull herding, to the point where the activity may have given the many bull-oriented names of the neighbouring regions, like the neighbouring sister city of Val Taureau. Yet the herding is but one part of what gives Dubuef its true wealth and prestige: its wine. With the soil endlessly laboured from the tireless beasts, the wine has gained a deep red colour, with a strong coarse taste tainted with a touch of cinnamon that makes it beloved by the nobility as a peculiar delicacy."
 building_dubuef_vineyards_01: "Vineyards of Dubuef"
 building_dubuef_vineyards_01_desc: "Dubuef is known for its bull herding, to the point where the activity may have given the many bull-oriented names of the neighbouring regions, like the neighbouring sister city of Val Taureau. Yet the herding is but one part of what gives Dubuef its true wealth and prestige: its wine. With the soil endlessly laboured from the tireless beasts, the wine has gained a deep red colour, with a strong coarse taste tainted with a touch of cinnamon that makes it beloved by the nobility as a peculiar delicacy."
 building_dubuef_vineyards_02: "Eternal Vineyards of Dubuef"
 building_dubuef_vineyards_02_desc: "Now using a technique of field rotation, and expansion of the vineyard's soil as well as new equipment, the bulls have been labouring more efficiently than ever, allowing the production of wine to grow tenfold, to the pleasure of the delighted nobility, who are now supplied with the delightfully coarse Wine of the Bull."
 building_dubuef_vineyards_03: "Covered Vineyards of Dubuef"
 building_dubuef_vineyards_03_desc: "With the gargantuan task of covering the entirety of the fields with a glass ceiling, capable of being opened to let the rain and other beneficial ailments inside, Dubuef has achieved the impossible: growing grapes in winter. This \"wine of the frost\", as nobles have begun to call it, is now a regular occurrence on the tables of Val Royeaux and other grand capitals, and even peasants have begun saving their hard-earned money to procure themselves a bottle of the variant who grew, despite the elements thanks to its cage of glass."
 ### Ducarme Orphanage
 building_type_ducarme_orphanage: "Ducarme Orphanage"
 building_type_ducarme_orphanage_desc: "Formally known as the Ducarme Orphanage for Dalish Children, this institution was founded in 1:97 Divine by a zealous architect named Robert Ducarme, self-proclaimed \"Servant of the Divine's Will\", despite no [divine|E] ever commenting on the orphanage's existence. \n\nNominally under the Orlesian Chantry's authority, the members of the institution have made it their mission to house and educate orphaned Dalish children into the ways of the [maker|E] and Orlais, away from their heathen gods. However, rumours abound regarding the residence, fuelled by the institution's reticence to give information regarding its functioning. \n\nDespite these rumours and calls for investigation, the administration has kept their lips sealed, and only one thing is sure. The [elves|E] that reached the age to leave the orphanage have never left the region."
 building_ducarme_orphanage: "Ducarme Orphanage"
 building_ducarme_orphanage_desc: "Formally known as the Ducarme Orphanage for Dalish Children, this institution was founded in 1:97 Divine by a zealous architect named Robert Ducarme, self-proclaimed \"Servant of the Divine's Will\", despite no [divine|E] ever commenting on the orphanage's existence. \n\nNominally under the Orlesian Chantry's authority, the members of the institution have made it their mission to house and educate orphaned Dalish children into the ways of the [maker|E] and Orlais, away from their heathen gods. However, rumours abound regarding the residence, fuelled by the institution's reticence to give information regarding its functioning. \n\nDespite these rumours and calls for investigation, the administration has kept their lips sealed, and only one thing is sure. The [elves|E] that reached the age to leave the orphanage have never left the region."
 building_type_verchiel_orphanage: "Verchiel Orphanage"
 building_type_verchiel_orphanage_desc: "Formerly known as the Ducarme Orphanage for Dalish Children, this institution was founded in 1:97 Divine by a zealous architect named Robert Ducarme, self-proclaimed \"Servant of the Divine’s Will\", despite no Divine ever commenting on the orphanage’s existence. Nominally under the Orlesian Chantry’s authority, the members of the institution have made it their mission to house and educate orphaned Dalish children into the ways of the Maker and Orlais, away from their heathen gods. Ever since the atrocious rumours regarding the residence were confirmed, the institution has been under official regulation, under the new name of the Verchiel Orphanage for Dalish Children."
 building_verchiel_orphanage: "Verchiel Orphanage"
 building_verchiel_orphanage_desc: "Formerly known as the Ducarme Orphanage for Dalish Children, this institution was founded in 1:97 Divine by a zealous architect named Robert Ducarme, self-proclaimed \"Servant of the Divine’s Will\", despite no Divine ever commenting on the orphanage’s existence. Nominally under the Orlesian Chantry’s authority, the members of the institution have made it their mission to house and educate orphaned Dalish children into the ways of the Maker and Orlais, away from their heathen gods. Ever since the atrocious rumours regarding the residence were confirmed, the institution has been under official regulation, under the new name of the Verchiel Orphanage for Dalish Children."
 building_type_destroyed_ducarme_orphanage: "Destroyed Ducarme Orphanage"
 building_type_destroyed_ducarme_orphanage_desc: "What little remains of the Ducarme Orphanage for Dalish Children, destroyed when the truth about the institution's methods were discovered. While the people are happy the stain that was the Orphanage has been removed from the land, it has left behind a scar that needs to be healed. Perhaps with time, and some investment, a new development here would eclipse whatever benefits the Ducarme Orphanage brought to the land."
 building_destroyed_ducarme_orphanage: "Destroyed Ducarme Orphanage"
 building_destroyed_ducarme_orphanage_desc: "What little remains of the Ducarme Orphanage for Dalish Children, destroyed when the truth about the institution's methods were discovered. While the people are happy the stain that was the Orphanage has been removed from the land, it has left behind a scar that needs to be healed. Perhaps with time, and some investment, a new development here would eclipse whatever benefits the Ducarme Orphanage brought to the land."
 building_type_ducarme_elf_neighbourhood: "Ducarme Elf Neighbourhood"
 building_type_ducarme_elf_neighbourhood_desc: "Born of the atrocities of the Ducarme Orphanage and its elven residents, this neighborhood is one of the rare regions where equality amongst races has, at least in part, been achieved. Jobs, festivals, as well as worship are done with humans and elves intermingling. To the surprise and often disdain of much of [thedas|E]."
 building_ducarme_elf_neighbourhood: "Ducarme Elf Neighbourhood"
 building_ducarme_elf_neighbourhood_desc: "Born of the atrocities of the Ducarme Orphanage and its elven residents, this neighborhood is one of the rare regions where equality amongst races has, at least in part, been achieved. Jobs, festivals, as well as worship are done with humans and elves intermingling. To the surprise and often disdain of much of [thedas|E]."
 building_type_ducarme_massacre_memorial: "Ducarme Massacre Memorial"
 building_type_ducarme_massacre_memorial_desc: "An elven statue found amidst a great andrastian cemetery could lead many to confusion, yet this story is one of remembrance. The statue, representing an elven soldier tearing down the chains of an orphan, shows the elven liberation of the children of Ducarme Orphanage, which was torn down for its crimes against Arlathan's descendants. Under the statue, writing can be found - « Vir Sulahn Var Revas », « We sing our freedom »"
 building_ducarme_massacre_memorial: "Ducarme Massacre Memorial"
 building_ducarme_massacre_memorial_desc: "An elven statue found amidst a great andrastian cemetery could lead many to confusion, yet this story is one of remembrance. The statue, representing an elven soldier tearing down the chains of an orphan, shows the elven liberation of the children of Ducarme Orphanage, which was torn down for its crimes against Arlathan's descendants. Under the statue, writing can be found - « Vir Sulahn Var Revas », « We sing our freedom »"
 ### Edgehall
 building_type_edgehall_01: "Edgehall"
 building_type_edgehall_01_desc: "Originally an outpost of the surface dwarves, now abandoned since Orzammar cut off the Deep Roads, all that remains of that original settlement is the imposing walls and blocked off entrance to the depths. Taking note of its strategic position against the Avvar, the Clayne settled the forgotten ruins and built it up into the settlement of Edgehall, a fortress in the foothills of the Frostbacks looking over the lowlands and shorelines to the East."
 building_edgehall_01: "$building_type_edgehall_01$"
 building_edgehall_01_desc: "$building_type_edgehall_01_desc$"
 ### Emerald Graves
 building_type_emerald_graves_01: "Din'an Hanin"
 building_type_emerald_graves_01_desc: "A resolute fortress and reverent tomb, Din’an Hanin serves both as the headquarters and as the final resting place of the Emerald Knights of the Dales. Here, the next generation of the elvhen’s protectors hone their skills at the side of the ghosts of the honored dead that preceded them."
 building_emerald_graves_01: "Din'an Hanin"
 building_emerald_graves_01_desc: "A resolute fortress and reverent tomb, Din’an Hanin serves both as the headquarters and as the final resting place of the Emerald Knights of the Dales. Here, the next generation of the elvhen’s protectors hone their skills at the side of the ghosts of the honored dead that preceded them."
 building_type_emerald_graves_02: "Fin de Gloire"
 building_type_emerald_graves_02_desc: "The Emerald Knights were heroes to some, ruthless butchers to others. Both sides likely had some element of truth. The last of them are interred here, in \"the place where glory ends\", and with them the hopes and aspirations of the elven people."
 building_emerald_graves_02: "Fin de Gloire"
 building_emerald_graves_02_desc: "The Emerald Knights were heroes to some, ruthless butchers to others. Both sides likely had some element of truth. The last of them are interred here, in \"the place where glory ends\", and with them the hopes and aspirations of the elven people."
 ### Farm of the Pellantaise
 building_type_farm_of_the_pellantaise_01: "Farm of the Pellantaise"
 building_type_farm_of_the_pellantaise_01_desc: "$building_farm_of_the_pellantaise_01_desc$"
 building_farm_of_the_pellantaise_01: "Haunted farm of the Pellantaise"
 building_farm_of_the_pellantaise_01_desc: "Once one of the greatest farms of Ghislain centuries before, this prestigious farm lies now abandoned. According to local stories, a bastard son of the Pellantaise's house head desired recognition and ownership of the land, and when he understood he would never receive either, he brought his father, mother, and all of his half-brothers and sisters, killing them all by setting the manor house on fire. Whether this story is true or not, the manor house did burn down, and the spirits and demons that haunt the farm tell of a great massacre that weakened the Fade."
 building_farm_of_the_pellantaise_02: "Resettled farm of the Pellantaise"
 building_farm_of_the_pellantaise_02_desc: "While the farm has been resettled with peasants working the fields once more, the land is nowhere near as productive as it once was. Demons rampaging and killing peasants have struck fear into the heart of the populace, who see the order to work on the haunted farm with dread, making them scared to do their job, leading to many ruined crops."
 building_farm_of_the_pellantaise_03: "Renovated farm of the Pellantaise"
 building_farm_of_the_pellantaise_03_desc: "Now that the demons have been struck down by a valiant group of templars, the workers of the farm can finally work without fear, and the crops are now harvested in full. These farms take full advantage of the rich and fertile soil, bringing much wealth to the local ruler and the surrounding region."
 ### Fields of Ghislain
 building_type_fields_of_ghislain_01: "Fields of Ghislain"
 building_type_fields_of_ghislain_01_desc: "$building_fields_of_ghislain_01_desc$"
 building_fields_of_ghislain_01: "Fields of Ghislain"
 building_fields_of_ghislain_01_desc: "While the Fields of Ghislain is a term mostly used to refer to the Duchy, it is also a term used more locally to refer to the fields of Ghislain proper, which gained a unique reputation in their own right as a place of bountiful harvest and vast and rich farms, despite the confusion of many due to the name."
 building_fields_of_ghislain_02: "The Incomprehensibly Rich Fields of Ghislain"
 building_fields_of_ghislain_02_desc: "Now irrigated thanks to an efficient system of water transportation all over, the Fields of Ghislain have never been more productive. Its products now feed an immeasurable number of mouths in the south, making its landowners plenty rich and powerful. Never before has the Fields of Ghislain given such a large amount of riches, and no doubt will it continue for years to come."
 ### Ghislain Circle
 building_type_ghislain_circle: "Ghislain Circle"
 building_ghislain_circle: "Ghislain Circle"
 building_ghislain_circle_desc: "The Ghislain circle stands unique amongst its peers due to its peculiar architecture, breaking the typical norm of a great tower. Here, the mages are housed in the former grand estate of a rich and devout lady of house Ghislain. Surrounded by endless fields and many farms, the mages have taken the habit to aid the locals in their endeavours of profit and agriculture, to the joy of the lord overseeing the harvest."





 ### Fort Against the Marches
 building_type_fort_against_the_marches_01: "Fort Against the Marches"
 building_type_fort_against_the_marches_01_desc: "$building_fort_against_the_marches_01_desc$"
 building_fort_against_the_marches_01: "Ruined Fort Against the Marches"
 building_fort_against_the_marches_01_desc: "Built by Kordillus Drakon during his campaigns in Orlais, this fortress stands as a bastion against eastern incursions from Nevarra, Cumberland and beyond, giving the region its modern name of Formarches. While time has taken a toll on its walls and structure, it still, to this day, can stand strong against any invader of Ghislain."
 building_fort_against_the_marches_02: "Restored Fort Against the Marches"
 building_fort_against_the_marches_02_desc: "Now restored to how it was in the time of great Kordillus, the fortress' walls have been rebuilt with efficiency, making sure that the stone would be thick enough to withstand a long siege easily, and cover an area large enough to house a thousand soldiers more."
 building_fort_against_the_marches_03: "Unbreakable Fort Against the Marches"
 building_fort_against_the_marches_03_desc: "Now rebuilt thanks to ancient dwarven techniques, the fortress stands as an unbreakable bastion. Housing more soldiers than ever before, having the sturdiest walls in the region, and, apparently, secret passages hidden inside the walls to deliver a decisive advantage for the fort's defender. Although rumours tell of assassins using those passages for a quick and efficient escape."
 ### Fort Drakon/Dane
 building_type_fort_drakon_01: "Village of Denerim"
 building_type_fort_drakon_01_desc: "Long ago, the Tevinter Imperium built a great fortress, expecting to strengthen their hold over Ferelden. With its imposing architecture, alabaster walls and multiple levels, the locals have coalesced around the fortress, creating the village of Denerim."
 building_fort_drakon_01: "$building_type_fort_drakon_01$"
 building_fort_drakon_01_desc: "$building_type_fort_drakon_01_desc$"
 building_fort_drakon_02: "Town of Denerim"
 building_fort_drakon_02_desc: "With the passage of time, investments and further settlement, the town of Denerim has grown larger. Artisans now work in houses where grass and trees once stood. Above all, the city has grown so large that the ships now dock in its expanding ports, with no need of a land route."
 building_fort_drakon_03: "City of Denerim"
 building_fort_drakon_03_desc: "Denerim has grown larger still, with many coming to the biggest city in Ferelden. So big, in fact, that bridges had to be erected so that the inhabitants of the northern bank could more easily travel the rest of the city. With the foundation of the Denerim market and many more, the city can no doubt be recognized as the largest in Ferelden."
  ### Landsmeet
 building_type_landsmeet_01: "Landsmeet"
 building_type_landsmeet_01_desc: "The seat of power of anyone who dares sit on a throne in Denerim, the Landsmeet is more than a throneroom: it is a tradition. A tradition of those who have ruled this land for generation, to debate and vote over the one who will rule them next. Implementing the old practice while on the very ground of the Landsmeet is for any ruler proof of their respect of tradition. However, whether or not they uphold the Landsmeet, every ruler’s legitimacy is viewed more harshly in Denerim, ready to swing from adoration to hatred at any moment, for good or ill."
 building_landsmeet_01: "Landsmeet"
 building_landsmeet_01_desc: "$building_type_landsmeet_01_desc$"
 building_type_landsmeet_01_effect: "#flavor Effects on County Holder:#!\n[GetLaw('saxon_elective_succession_law').GetName] [succession|E] [prestige|E] Cost reduced by: #P +50%#!"
 special_building_cheaper_landsmeet_cost: "Landsmeet Special Building"
 ### Flat Stables
 building_type_flat_stables_01: "Stables of the Flats"
 building_type_flat_stables_01_desc: "The Deauvin Flats are one of the territories most suited for cavalry, and as such, it is no surprise that one of the most renowned stables of Orlais is present in the region. The Stables of the Flats is a grand and vast complex occupying miles of terrain, used in war as well as tourneys, and allow the horses of the soldiers some much needed ground to rest, feed and practice."
 building_flat_stables_01: "Stables of the Flats"
 building_flat_stables_01_desc: "The Deauvin Flats are one of the territories most suited for cavalry, and as such, it is no surprise that one of the most renowned stables of Orlais is present in the region. The Stables of the Flats is a grand and vast complex occupying miles of terrain, used in war as well as tourneys, and allow the horses of the soldiers some much needed ground to rest, feed and practice."
 building_flat_stables_02: "Grand Stables of the Duchy's Flats"
 building_flat_stables_02_desc: "Now renovated by the Duchy of Deauvin, the Grand Stables of the Duchy's Flats, as this is its new name, is now one, if not the largest complex of stables in all of Orlais. Miles of pasture are used for the horses so they can rest, train, gallop freely and even joust to the joy of the population, nestled amidst the complex that is now a city of its own, richly decorated and entirely devoted to the joys of the horse."
 ### Fort Garrote
 building_type_fort_garrote_01: "Fort Garrote"
 building_type_fort_garrote_01_desc: "$building_fort_garrote_01_desc$"
 building_fort_garrote_01: "Fort Garrote"
 building_fort_garrote_01_desc: "A fledgling outpost on the fringes of Orlais, built to watch for incursions. The fort is barely usable at this stage, with a focus on practical utility over comfort; nevertheless, the courtyard has room for up to a hundred troops at a time."
 building_type_fort_garrote_02: "$building_type_fort_garrote_01$"
 building_type_fort_garrote_02_desc: "$building_fort_garrote_02_desc$"
 building_fort_garrote_02: "Garrote Fortress"
 building_fort_garrote_02_desc: "A somewhat more entrenched fortification, now with the addition of a large tower by the gate. While this improves the fort's defensibility, it is still far from opulent - Even the foliage in the courtyard seems sad and gnarled."
 ### Forteresse du Chagrin
 building_type_forteresse_du_chagrin_01: "Forteresse du Chagrin"
 building_type_forteresse_du_chagrin_01_desc: "A castle originally built by Tevinter magisters who reinforced its walls through blood magic. Maferath later sacked the castle and left it in ruins during Andraste's [exalted_march|E]. The castle stayed as such until the Grey Wardens restored it during the Second [blight|E], with the intention of holding a prime location to flank [darkspawn|E] pouring out of the Frostbacks. It now serves Jader as a defensive position located near the lands of the Clayne."
 building_forteresse_du_chagrin_01: "Forteresse du Chagrin"
 building_forteresse_du_chagrin_01_desc: "A castle originally built by Tevinter magisters who reinforced its walls through blood magic. Maferath later sacked the castle and left it in ruins during Andraste's [exalted_march|E]. The castle stayed as such until the Grey Wardens restored it during the Second [blight|E], with the intention of holding a prime location to flank [darkspawn|E] pouring out of the Frostbacks. It now serves Jader as a defensive position located near the lands of the Clayne."
 building_forteresse_du_chagrin_02: "Grande Forteresse du Chagrin"
 building_forteresse_du_chagrin_02_desc: "The ancient fortress has been repaired after the need for renovation became evident. Gone are the days of new wardens wandering into caved-in watchtowers. Mages have also reinforced old runes & added new ones to aid in its defense."
 ### Goldsnake Estate
 building_type_goldsnake_estate_01: "Palace"
 building_type_goldsnake_estate_01_desc: "$building_goldsnake_estate_01_desc$"
 building_goldsnake_estate_01: "Goldsnake Estate"
 building_goldsnake_estate_01_desc: "Here resides the former estate of the infamous Andecarus “Goldsnake”, who built this grand estate both to store his wealth into a secure location, but also to centralize the taxing of his subjects for maximum efficiency, to the distaste of the local population."
 building_type_goldsnake_estate_02: "$building_type_goldsnake_estate_01$"
 building_type_goldsnake_estate_02_desc: "$building_goldsnake_estate_02_desc$"
 building_goldsnake_estate_02: "Goldsnake's Extravagantly Luxurious Estate"
 building_goldsnake_estate_02_desc: "The “Goldsnake” estate is now renovated in such a luxurious style it would be seen as extravagant, even by the standards of Val Royeaux. But, in truth, this beautiful building, with a style well loved by the local population, still serves its original function as a ruthlessly efficient and well fortified taxing office, and it is debated if the beautiful chandeliers are truly present to hide or showcase the greed inherent to this estate."
 ### Grand Cathedral of Val Royeaux
 building_type_grand_cathedral_of_val_royeaux_01: "Grand Cathedral of Val Royeaux"
 building_type_grand_cathedral_of_val_royeaux_01_desc: "Built atop the ruins of the infamous Queen Jeshavis' fortress, Emperor Kordillus I has constructed a grandiose temple devoted to Andraste's glory. It was also built to serve as the seat of power for the [divine|E], the spiritual leader of his Orlesian [chantry|E]."
 building_grand_cathedral_of_val_royeaux_01: "$building_type_grand_cathedral_of_val_royeaux_01$"
 building_grand_cathedral_of_val_royeaux_01_desc: "$building_type_grand_cathedral_of_val_royeaux_01_desc$"
 building_grand_cathedral_of_val_royeaux_02: "Grand Cathedral of Val Royeaux"
 building_grand_cathedral_of_val_royeaux_02_desc: "Defining an entire age, there is no rival to the beauty and magnificence of this chantry devoted to [andraste|E]. The Grand Cathedral stands as the ultimate demonstration of devotion by the faithful as its two massive towers dominate the skyline for miles."
 ### Great Wall of Deauvin
 building_type_deauvin_wall_01: "Great Wall of Deauvin"
 building_type_deauvin_wall_01_desc: "This defensive wall was built not long after the founding of Orlais by Kordillus the First. When the local nobles understood that they were seen as a territory of lesser importance in war due to being on the edge of the Empire, with its only border being the one with the Dales, a great wall was built in order to gain a better defensive position against the heathen [elves|E]."
 building_deauvin_wall_01: "Unmaintained Great Wall of Deauvin"
 building_deauvin_wall_01_desc: "This defensive wall was built not long after the founding of Orlais by Kordillus the First. When the local nobles understood that they were seen as a territory of lesser importance in war due to being on the edge of the Empire, with its only border being the one with the Dales, a great wall was built in order to gain a better defensive position against the heathen [elves|E]. In doing so, the local lords gave a formidable construction to the world that Val Royeaux could have built, but never took the time to invest in. These days, however, this portion of the wall has fallen into disrepair, and is not as effective as it was before."
 building_deauvin_wall_02: "Prestigious and Illustrious Great Wall of Deauvin"
 building_deauvin_wall_02_desc: "This section of the old defensive wall has now been renovated, and it now stands as a great defensive bastion of the Deauvin frontier against all opponents. Deauvin was on no path of any invading army to get to the heart of the Empire, and as such, the Prestigious and Illustrious Great Wall of Deauvin was not built to defend Orlais as a whole, but rather the locals of the region against any oppressor or invader. Today, the wall stands, despite being quite expensive, as a marvel of architecture and engineering, as well as a great defensive position."
 building_type_deauvin_wall_03: "Great Wall of Deauvin"
 building_type_deauvin_wall_03_desc: "This defensive wall was built not long after the founding of Orlais by Kordillus the First. When the local nobles understood that they were seen as a territory of lesser importance in war due to being on the edge of the Empire, with its only border being the one with the Dales, a great wall was built in order to gain a better defensive position against the heathen [elves|E]."
