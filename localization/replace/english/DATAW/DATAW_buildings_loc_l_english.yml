 ### Mesa of Deavuin
 building_type_deauvin_mesa_01: "Mesa of Deauvin"
 building_type_deauvin_mesa_01_desc: "This natural formation is the greatest plateau of Southern Orlais. Multiple times was its natural features used for a decisive engagement, particularly by Val Falaise in their defensive wars during the tumultuous times before Kordillus' unification of Orlais. To this day, the mesa is one of the greatest beauties of Deauvin, in size as much as in beauty, and dominates the landscape of the Deauvin Flats for miles on end."
 building_deauvin_mesa_01: "Great Mesa of Deauvin"
 building_deauvin_mesa_01_desc: "This natural formation is the greatest plateau of Southern Orlais. Multiple times was its natural features used for a decisive engagement, particularly by Val Falaise in their defensive wars during the tumultuous times before Kordillus' unification of Orlais. To this day, the mesa is one of the greatest beauties of Deauvin, in size as much as in beauty, and dominates the landscape of the Deauvin Flats for miles on end."
 ### Mont Laures Hermitage
 building_type_mont_laures_01: "Hermitage of Mont Laures"
 building_type_mont_laures_01_desc: "No one knows when the caves were used to create the hermitage. It has persisted through countless generations, giving the mountain its current name. Evolving through the Orlesian Chantry's foundation and Orlais' creation, the hermitage is a renowned local monument, beloved by the local populace."
 building_mont_laures_01: "$building_type_mont_laures_01$"
 building_mont_laures_01_desc: "$building_type_mont_laures_01_desc$"
 ### Montsimmard Circle
 building_type_montsimmard_circle_01: "Montsimmard Circle"
 building_type_montsimmard_circle_01_desc: "The [circle|E] of Montsimmard has been known since its conception as a great bastion of learning. It is said that the mages taught here scoured the endless books of the great library for hours on end, learning languages, theology, mathematics and more."
 building_montsimmard_circle_01: "Remnants of Montsimmard Circle"
 building_montsimmard_circle_01_desc: "The [circle|E] of Montsimmard has been known since its conception as a great bastion of learning. It is said that the mages taught here scoured the endless books of the great library for hours on end, learning languages, theology, mathematics and more. Yet the Second [blight|E] has left the [circle|E] in a dire state, and this house of learning is holding onto its last remnants, cursing the [elves|E] that stood still while innocents died and countless amount of knowledge was lost."
 building_montsimmard_circle_02: "Rebuilt Circle of Montsimmard"
 building_montsimmard_circle_02_desc: "Now rebuilt up to the height it was before this faithful assault in 1:25 Divine, the [circle|E] of Montsimmard now houses the greatest library of magical history once more. Many compare it to the great magical libraries of the Imperium as their only equal. Mages can once again indulge in the endless books of history, tradition and magical history of the great library, making of many a part of the greatest scholars of [thedas|E]."
 ### Montsimmard Estate
 building_type_montsimmard_estate_01: "Grand Estate of Montsimmard"
 building_type_montsimmard_estate_01_desc: "Grand Estate of Montsimmard, home of the great houses of Orlais' South, dating back to the time where the city stood amongst the greatest of the city-states."
 building_montsimmard_estate_01: "Ruined Grand Estate of Montsimmard"
 building_montsimmard_estate_01_desc: "Here lies the formerly Grand Estate of Montsimmard, home of the great houses of Orlais' South, dating back to the time where the city stood amongst the greatest of the city-states. The [darkspawn|E] assault, like everywhere else in the city, have greatly damaged this remnant of past glory, and it is a miracle the Estate still stands today."
 building_montsimmard_estate_02: "Restored and Everlasting Grand Estate"
 building_montsimmard_estate_02_desc: "With the restoration of the Grand Estate came a renewed sense of pride. Not only did Montsimmard succeed at repelling the [darkspawn|E], the Grand Estate of the houses was rebuilt with evermore splendour. Even today, Montsimmard is known as the capital of the South and birthplace of the First [divine|E], and the locals will make sure no one forgets. Especially the [elves|E]."
 ### Montsimmard Keep
 building_type_montsimmard_keep_01: "Montsimmard Keep"
 building_type_montsimmard_keep_01_desc: "The Great Keep of the South. It has held against all manner of creations that the [maker|E] has thrown against it."
 building_montsimmard_keep_01: "Destroyed Montsimmard Keep"
 building_montsimmard_keep_01_desc: "When the [darkspawn|E] poured inside the city itself, many of the citizens fled to the Keep for protection, yet not all could come in time, and [darkspawn|E] started going on the offensive, climbing and destroying the walls to find a way inside. While the [darkspawn|E] were eventually pushed back due to a daring maneuver and an ingenious usage of oil and the mages' fire, the Montsimmard Keep still shows the deep scars of battle, left by decades of conflict against the [darkspawn|E] horde and a severe lack of funding."
 building_montsimmard_keep_02: "Renovated Montsimmard Keep"
 building_montsimmard_keep_02_desc: "No longer are the scars of battle littering the Keep's walls. No longer will there be what looks like at the same time a ruin and a fort. The Montsimmard Keep has been rebuilt in all its glory, despite the odds, and stands as mighty and beautiful as ever, now ornate with fresquas of the heroic actions that saved the city from outright annihilation. Never will Montsimmard forget the [elves|E] leaving them to die, but never will Montsimmard forget that they saved themselves, and built themselves back to be, once again, the capital of the South."
 ### Nahashin Palace
 building_type_nahashin_palace_01: "Palace"
 building_type_nahashin_palace_01_desc: "$building_nahashin_palace_01_desc$"
 building_nahashin_palace_01: "King's Palace in the Marshes"
 building_nahashin_palace_01_desc: "A palace in the middle of Nahashin that stands as a rallying point for the region. Built like a fortress by the legendary Martel, founder of the Marchette Dynasty."
 building_type_nahashin_palace_02: "$building_type_nahashin_palace_01$"
 building_type_nahashin_palace_02_desc: "$building_nahashin_palace_02_desc$"
 building_nahashin_palace_02: "Royal Seat of Nahashin"
 building_nahashin_palace_02_desc: "Fortified and renovated ornately, the palace has now paved its way as the Royal Seat of Nahashin, a wonderful home worthy of a king, standing high above the swamp thanks to its great walls, as regal as practical. For the Royal Seat isn't only the great palace from where the Marshes deserve to be ruled, it is also a great fortress who can withstand a long and heavy siege if need be."
 ### Naissance d'Andraste
 building_type_naissance_d_andraste_01: "Naissance d'Andraste"
 building_type_naissance_d_andraste_01_desc: "Constructed from a repurposed Old Gods temple early in the Chantry's history, in celebration of the location of Andraste's birth. Due to Jader's strategic location, its Chantry has been used for peace talks since it was constructed. The Chantry has hosted Fereldan barbarians, Orlesian rebels, and even Elvhen heretics. All in the name of preserving peace on Orlais' eastern border."
 building_naissance_d_andraste_01: "Naissance d'Andraste"
 building_naissance_d_andraste_01_desc: "Constructed from a repurposed Old Gods temple early in the Chantry's history, in celebration of the location of Andraste's birth. Due to Jader's strategic location, its Chantry has been used for peace talks since it was constructed. The Chantry has hosted Fereldan barbarians, Orlesian rebels, and even Elvhen heretics. All in the name of preserving peace on Orlais' eastern border."
 ### Orzammar Entrance
 building_type_orzammar_entrance: "Entrance to Orzammar"
 building_type_orzammar_entrance_desc: "The [dwarves|E] are lauded for their craftsmanship, and the city of Orzammar is one of their finest works. One of two remaining thaigs that once made up their empire, its citizens are a proud people who are accustomed to hardship and lean heavily on tradition."
 building_orzammar_entrance: "$building_type_orzammar_entrance$"
 building_orzammar_entrance_desc: "$building_type_orzammar_entrance_desc$"
 ### Ostagar
 building_type_ostagar_01: "Ostagar"
 building_type_ostagar_01_desc: "Once one of the most important defensive holdings south of the Waking Sea, this fortress was abandoned after Tevinter's collapse and successfully sacked by the wilders, eventually falling to ruin completely. That most of the walls still stand even now is testament to the magical power of the Imperium that created it."
 building_ostagar_01: "Ostagar (Ruined)"
 building_ostagar_01_desc: "Once one of the most important defensive holdings south of the Waking Sea, this fortress was abandoned after Tevinter's collapse and successfully sacked by the wilders, eventually falling to ruin completely. That most of the walls still stand even now is testament to the magical power of the Imperium that created it."
 building_ostagar_02: "Ostagar (Restored)"
 building_ostagar_02_desc: "Straddling a narrow pass in the hills, this rebuilt fortress needs to be bypassed to reach the fertile lowlands to the north. It is exceedingly difficult to attack because of its naturally defensible position."
 building_ostagar_03: "Ostagar (Resplendant)"
 building_ostagar_03_desc: "Once abandoned and fallen to ruin, the glory of old Tevinter is once more on full display in this historic fortress."
 ### Perendale Circle
 building_type_perendale_circle: "Perendale Circle"
 building_type_perendale_circle_desc: "This tower built by Tevinter to guard magisters against Ciriane and Inghirsh attacks has now been repurposed as a Circle of Magi. The complex defenses set up to defend their luxurious lodgings still hold up, making the circle a good location to defend against demonic forces and outside raiders, but also a great place for mages to barricade themselves in."
 building_perendale_circle: "$building_type_perendale_circle$"
 building_perendale_circle_desc: "$building_type_perendale_circle_desc$"
 ### Sacred Hunting Grounds
 building_type_sacred_hunting_ground_01: "Sacred Hunting Grounds"
 building_type_sacred_hunting_ground_01_desc: "$building_sacred_hunting_ground_01_desc$"
 building_sacred_hunting_ground_01: "Sacred Woods of Andraste"
 building_sacred_hunting_ground_01_desc: "These woods have been venerated for generations by the locals, and the act of hunting in these woods have been considered a sacred act, a way to venerate the [maker|E] in these remote regions. As such, these woods are considered sacred, and the hunting has given the locals a great deal of skill in archery."
 building_type_sacred_hunting_ground_02: "$building_type_sacred_hunting_ground_01$"
 building_type_ciriane_frontier_outpost_02_desc: "$building_sacred_hunting_ground_02_desc$"
 building_sacred_hunting_ground_02: "Chantry of the Sacred Hunt"
 building_sacred_hunting_ground_02_desc: "With a chantry now built among the sacred grounds, the local [chantry|E] now encourages hunting not simply as a simple informal practice of the region, but has a sacred act accompanied by the chanting of the Canticles as the animal is skinned, giving his meat to the loyal followers, who hunted with their bow for the glory of the [maker|E]."
 sacred_hunting_ground_desc: "$unlocks_building_desc$Increases [hunt_sighting|E] Chance and [hunt_success_chance|E] for[GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName] [activities|E] Hosted in this [holding|E]\n\nA [piety|E] bonus will be received upon completion of[GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName] [activities|E] Hosted in this [county|E]"
 ### Salmont River
 building_type_salmont_special_building_01: "Salmont River"
 building_type_salmont_special_building_01_desc: "Through the middle of the town of Salmont runs a small river, said to originate from far in the Frostbacks. Although too small to permit efficient trade through navigation, an abundance of salmon and fresh water has encouraged many to settle around the edges of the river, giving the city its current layout, divided on both banks."
 building_salmont_special_building_01: "Salmont River"
 building_salmont_special_building_01_desc: "Through the middle of the town of Salmont runs a small river, said to originate from far in the Frostbacks. Although too small to permit efficient trade through navigation, an abundance of salmon and fresh water has encouraged many to settle around the edges of the river, giving the city its current layout, divided on both banks."
 building_salmont_special_building_02: "Great and Life-Giving Watermill of Salmont"
 building_salmont_special_building_02_desc: "With the construction of a great watermill came further economic growth at the cost of the salmon industry, which slowly faded due to the new watermill. Nevertheless, now goods can be processed locally at a much cheaper rate, to the good of local business and development."
 ### Silver Mine
 building_type_silver_mine_01: "Perendale Silver Mines"
 building_type_silver_mine_01_desc: "$building_silver_mine_01_desc$"
 building_silver_mine_01: "Silver Mines of Perendale"
 building_silver_mine_01_desc: "Perendale and its surroundings are known for three things: dragons, those maker-damned goats, and silver. It is then no surprise that the silver mines form the backbone of the city's wealth, and give enough work to the commoners to make them thrive somewhat. While potential for expansion is there among the tunnels of the [deep_roads|E] below, work has not been done by fear of attracting [darkspawn|E]."
 building_silver_mine_02: "Silver Network of Perendale"
 building_silver_mine_02_desc: "Fear of [darkspawn|E] attacks have not been enough to deter the search for profit, and as such, great tunnels connecting the mines to the [deep_roads|E] below have been dug, with a lift separating the mines from the possibilities of infection. While this new network has brought much wealth to Perendale, it has also brought death with some unfortunate miners returning blighted, if they returned at all."
 ### Solasan Temple
 building_type_solasan_temple_01: "Solasan Temple"
 building_type_solasan_temple_01_desc: "$building_solasan_temple_01_desc$"
 building_solasan_temple_01: "Solasan temple"
 building_solasan_temple_01_desc: "Poisonous water, strange creatures, tales of people disappearing or succumbing to madness… Many tales surround the strange oasis and its ancient elven temple, and many curse it for the strange occurrences happening around the region. Some mages in the Markham Circle once said that strange shards could be found to open the door leading inside the temple called Solasan, although those shards have never been found, seemingly hidden from view by some strange [dataw_magic|E]. No matter the danger present in the region, multiple people are drawn to this forbidden oasis, whether it is due to the natural beauty, the dangerous fauna, plenty of resources ready to be extracted, or even the strange door that leads further in the forbidden temple."
 ### Soldier's Peak
 building_type_soldiers_peak_01: "Soldier's Peak"
 building_type_soldiers_peak_01_desc: "Made to give the Grey Wardens a headquarters in Ferelden so that they could continue their work in preventing further devastation by the Darkspawn and Blights."
 building_soldiers_peak_01: "$building_type_soldiers_peak_01$"
 building_soldiers_peak_01_desc: "$building_type_soldiers_peak_01_desc$"
 ### Southern_Monastery
 building_type_southern_monastery_01: "Grand Southern Monastery"
 building_southern_monastery_01: "Monastery of the Southern Frontier"
 building_southern_monastery_01_desc: "A monastery built to honour the [maker|E] even on the very last frontier of [thedas|E], this chantry, while isolated, is quite respected and cherished in the region, and is the source of the faith of many locals, who swear by it and condemn the ones without piety."
 southern_monastery_desc_01: "+15% conversion resistance."
 building_southern_monastery_02: "Holy Reserve of the Divines' Scriptures"
 building_southern_monastery_02_desc: "The small and insignificant monastery has now been erected for a greater purpose: the safekeeping of the scriptures of the Divines of Val Royeaux. From Justinia the First to the last, their writings are kept, preserved and studied, forming a respected and quite unique center of theological debate, all the while giving multiple intellectuals contributing to technological and social advancements."
 southern_monastery_desc_02: "+25% conversion resistance."
 STEWARD_PROMOTE_RELIGION_BUILDING_PENALTY: "Building conversion resistance."
 ### Suledin Keep
 building_type_suledin_keep_01: "Suledin Keep"
 building_type_suledin_keep_01_desc: "Nestled among the craggy highlands of the Dales stands a sinister fortress. This towering fortification serves as the seat of a Dalish lord, one who casts a shadow longer than that of the keep itself... In these remote hills, the master of Suledin Keep holds absolute sway."
 building_suledin_keep_01: "$building_type_suledin_keep_01$"
 building_suledin_keep_01_desc: "$building_type_suledin_keep_01_desc$"
 ### Summer Bazaar
 building_type_the_summer_bazaar_01: "The Summer Bazaar"
 building_type_the_summer_bazaar_01_desc: "The beating heart of Val Royeaux, where goods from all over Thedas are traded and sold in bustling market stalls. Situated at the center of the Imperial Highways of the Old Tevinter Imperium, it serves as the largest trading hub on the continent."
 building_the_summer_bazaar_01: "$building_type_the_summer_bazaar_01$"
 building_the_summer_bazaar_01_desc: "$building_type_the_summer_bazaar_01_desc$"
 building_the_summer_bazaar_02: "WIP"
 building_the_summer_bazaar_02_desc: "WIP"
 ### Sunstop Mountains
 building_type_sunstop_mountains_01: "Sunstop Mountains"
 building_type_sunstop_mountains_01_desc: "$building_sunstop_mountains_01_desc$"
 building_sunstop_mountains_01: "Sunstop Mountains"
 building_sunstop_mountains_01_desc: "Dominating the dunes of the Hissing Wastes, the Sunstop Mountains gain their name from the sun emerging from behind the mountains and emerging to reach its zenith above the mountain range, a spectacle which brings joy to many visiting nobles. However, the reason why the Sunstop mountains are known is because of its winding paths, perfect for a defensive battle and for bandits to set up ambushes."
 ### Skyhold
 building_type_skyhold_01: "Skyhold"
 building_type_skyhold_01_desc: "As many legends are told of this mountain as there are clans under the sky. Which if any are true, you cannot say."
 building_skyhold_01: "Himmeltopp"
 building_skyhold_01_desc: "$building_type_skyhold_01_desc$"
 building_skyhold_02: "Tarasyl'an Te'las"
 building_skyhold_02_desc: "Tarasyl'an te'las. \"Where the sky is held back\", in elvish - but the [elves|E] have forgotten much, and even they do not remember the true meaning of these words."
 building_skyhold_03: "Skyhold"
 building_skyhold_03_desc: "A fortress in the Clayne tradition, Skyhold stands imposing and imperious in the snow-covered peaks, near-on impenetrable with daunting walls, a formidable keep, and a near unique alpine garden hidden amidst its grasp. Nestled high amidst the Frostback mountains, this bastion's impressive construction strikes awe into all who bear witness to it."
 ### Tombigbee
 building_type_tombigbee_01: "$building_tombigbee_01$"
 building_type_tombigbee_01_desc: "$building_tombigbee_01_desc$"
 building_tombigbee_01: "The Stilt City of Tombigbee"
 building_tombigbee_01_desc: "The only city in the Korcari Wilds, Tombigbee is famous for being a stilted city built on a lake."
 ### Village of Gwaren
 building_type_gwaren_special_building_01: "$building_gwaren_special_building_01$"
 building_type_gwaren_special_building_01_desc: "$building_gwaren_special_building_01_desc$"
 building_gwaren_special_building_01: "Village of Gwaren"
 building_gwaren_special_building_01_desc: "Ever since the dwarves retreated from their outpost and Gwaren's wealth was sacked, the village has not been the same. Left as a shell of its former self, the village still represents a valuable economic hub for the coast thanks to its position as a trade center for fish and timber."
 ### University of Orlais
 building_type_university_of_orlais: "University of Orlais"
 building_type_university_of_orlais_desc: "The University of Orlais serves as something of a dumping ground for the younger children of the lesser nobility, those with few political prospects whose families tire of entertaining them with a multitude of tutors."
 building_university_of_orlais: "$building_type_university_of_orlais$"
 building_university_of_orlais_desc: "$building_type_university_of_orlais_desc$"
 ### Vigil's Keep
 building_type_vigils_keep: "Vigil's Keep"
 building_type_vigils_keep_desc: "Vigil's Keep is one of the oldest settlements in Ferelden, older than Denerim and Gwaren. It has seen battle in every major invasion of Ferelden. To the Avvars who built it, the Vigil was both a fortress and a holy site. The cellars bear monuments to their gods, heroes, and their rare military victories."
 building_vigils_keep: "$building_type_vigils_keep$"
 building_vigils_keep_desc: "$building_type_vigils_keep_desc$"
 ### Vir'Abelasan (it is the Altar of Mythal now, the Temple is off-map) (Altar is canon, it's where you fight the dragon)
 building_type_vir_abelasan_01: "Altar of Mythal"
 building_type_vir_abelasan_01_desc: "$building_virelay_ruins_01_desc$"
 building_vir_abelasan_01: "Altar of Mythal"
 building_vir_abelasan_01_desc: "According to Dalish legends, there is a temple, far south in the uncharted and dangerous Arbor Wilds, built by the ancient elves in dedication to Mythal. The temple would be considered one of the most sacred sites of Old Elvhenan, guarded fiercely by elves untouched by the mortality of humans. \n\n No matter how true, the local town, seen as the last stop before the Arbor Wilds, has become a notable destination for pilgrims coming to venerate the heroic struggle of those last true elves. However, it is said by every local that pilgrims must keep their travel to the Altar of Mythal, for everyone that delved in the Arbor Wilds in search of this famed Temple has never returned."
 # building_vir_abelasan_01_desc: "A large temple in the thick of the arbor wilds. The high walls camouflaged under the canopy, decorated in draconic iconography as well as depictions of Mythal herself.\n\nIt is said to have been a place of not just worship, but of justice and knowledge. Now its large doors remain closed, the temple guarded and Mythals pilgrims take their worship to the smaller shrine outside."
 ### Virelay Ruins
 building_type_virelay_ruins_01: "Virelay Ruins"
 building_type_virelay_ruins_01_desc: "$building_virelay_ruins_01_desc$"
 building_virelay_ruins_01: "Virelay Ruins"
 building_virelay_ruins_01_desc: "Once the site of the cult known as the Daughters of Song, Virelay was home to plenty of revelries. Andraste's union with the [maker|E] was reason for an astonishing and quite regular display of hedonism, ranging from poetry, rampant carnal satisfaction and other things considered scandalous by their more prude neighbours. The town, and the cult with it, were destroyed by Emperor Kordillus Drakon during his unification campaigns, leaving only ruins of the old town as a souvenir of the hedonist cult."
 building_virelay_ruins_02: "Virelay Old Town"
 building_virelay_ruins_02_desc: "With the old town now restored to what it was before Kordillus' campaign, the old town of Virelay is now home once again to many poets, musicians and revelers, inspired by the town's history to bring a sense of hedonistic pleasure. The Old Town is, to this day, a home for the young and idealists, who enjoy the pleasures of life with the implicit approval of the local government, due to the activities' popularity with the citizens."
 ### Whaling Station
 building_type_whaling_station_01: "Whaling Station"
 building_whaling_station_01: "Small whaling station"
 building_whaling_station_01_desc: "The tradition of Névenais whale hunting is old, and this whale hunting station, in the heart of the city of Mont-de-Glace is a good example of this. Here, boats are rented or sold, and whales are brought back to be skinned for their meat and oil. The station may be small, but it is of great significance to the locals."
 building_whaling_station_02: "Great Whaling Station"
 building_whaling_station_02_desc: "Previously a small station, Mont-de-Glace now houses a great whaling station, where the amount of whales skinned for their meat is greater than ever before. Meat, Whale oil, bones… Everything relating to Whale hunting, from meat to boats, can be found here, to the delight of the local population."
 building_whaling_station_03: "Great Whaling Shipyard of the Sundered Sea"
 building_whaling_station_03_desc: "What was once only a whaling station has now become a great shipyard, the pride of this recluse corner of the world. Plenty of boats are made for the lucrative whaling business on the Sundered Sea, and many types of ships are conceived in plans sold and sent all across [thedas|E], destined to be built in shipyards as far as Antiva. However, no matter who you believe in, whether you come from the Sea of Ash or the heartland of Orlais, the towering statue of [andraste|E], knife in hand deep in a whale's belly, dominates the shipyard, and can be seen from miles away."
 whaling_station_desc: "Lower cost to sponsor a whale hunt by 20%."
 whaling_station_2_desc: "Lower cost to sponsor a whale hunt by 30%."
 ### White Deer Mountain
 building_type_deer_mountain_01: "Mountain of the White Deer"
 building_deer_mountain_01: "Mountain of the White Deer"
 building_deer_mountain_01_desc: "The Mountain of the White Deer owes its name to an old legend of unknown origin, which tells of a white deer that came to a child lost in the mountain, and brought him safely back to his tribe. Yet when the deer approached, the tribe pierced its heart, eager for its meat. Full of fury for the violence with which it was repaid, the deer simply refused to die, and fled away, a hole pierced in its heart. Whether this was one of the lost halla of the elves, one of the gods of the Avvar as some pretend or other, one thing remains true and certain. The hunt here is bountiful, and, sometimes, hunters see a lone white deer with a great scar right next to its heart, returning always, no matter how many times it is slain."
 deer_mountain_desc_01: "Bonuses to hunting in this barony.\nIncreased chance of spotting a white deer."
 activity_hunt_province_desc_deer_mountain: "#P ++ $building_type_deer_mountain_01$#! ([building|E])\n"
 ### White Spire Fortress
 building_type_the_white_spire_fortress: "White Spire"
 building_type_the_white_spire_fortress_desc: "Home to Val Royeaux's [circle|E] of Magi, the former ruling fortress of Emperor Drakon is one of the few structures besides the palace itself which can be seen from anywhere in the capital city. At night it is lit by [dataw_magic|E] to make it appear a brilliant sliver of white cutting across the dark."
 building_the_white_spire_fortress: "$building_type_the_white_spire_fortress$"
 building_the_white_spire_fortress_desc: "$building_type_the_white_spire_fortress_desc$"
 ### Wine Makers Chantry
 building_type_wine_chantry_01: "Wine Makers Chantry"
 building_type_wine_chantry_01_desc: "Throughout the local region, the local chantry of Maudovigne has gained a peculiar reputation thanks to a strange activity made on its soil: winemaking. The renowned Celestine black is made directly from the vineyard behind the Chantry, to the pleasure of many nobles and commoners alike. Some even say a [divine|E] herself enjoyed the drink far more than she should have, and the theories on which is the culprit have been a common topic of discussion for a long time in Maudovigne."
 building_wine_chantry_01: "Chantry of the Wine"
 building_wine_chantry_01_desc: "Throughout the local region, the local chantry of Maudovigne has gained a peculiar reputation thanks to a strange activity made on its soil: winemaking. The renowned Celestine black is made directly from the vineyard behind the Chantry, to the pleasure of many nobles and commoners alike. Some even say a [divine|E] herself enjoyed the drink far more than she should have, and the theories on which is the culprit have been a common topic of discussion for a long time in Maudovigne."
 building_wine_chantry_02: "Chantry of the Winemakers"
 building_wine_chantry_02_desc: "Due to some level of controversy with some drunk chanters, the Winemaking and the Chantry have now been separated into two separate buildings, with the winemaking being run by some former brothers now labelling themselves as « the Chantry of the Winemakers », due to their former ecclesiastical position, as well as working in the former Chantry. The newly built Chantry, as well as the Vineyard now cooperate closely on multiple local affairs which has assured both sober prayers and drunk revelry thanks to selective selling of Celestine black."
 feast_cost_discount_wine_chantry: "Location has $building_type_wine_chantry_01$"
 activity_feast_province_desc_wine_chantry: "#P +++ $building_type_wine_chantry_01$#! ([building|E])\n"
 feast_cost_discount_wine_desc: "$feast_cost_discount_effect_desc$[EmptyScope.ScriptValue('feast_activity_cost_discount_wine_value')|P0%]"
 ### Wyvern Grave
 building_type_wyvern_grave_01: "Wyvern Graveyard"
 building_type_wyvern_grave_01_desc: "$building_wyvern_grave_01_desc$"
 building_wyvern_grave_01: "Wyvern Graveyard"
 building_wyvern_grave_01_desc: "In Darnois, there exists one of the strangest things found across [thedas|E], what is now called the Wyvern Graveyard. As far as written records go, old wyverns have always arrived here to live their final moments in peace. The hundreds of wyverns that die here attract many people willing to plunder and sell the skins and bones of the wyverns, which has given the town a small commerce, if one can disregard the provenance of those pieces."

 ### Cendrerin Trading market
 building_type_cendrein_market_01: "Cendrerin Trading market"
 building_cendrein_opinion: "$cendrein$ Opinion"
 building_cendrein_market_01: "Cendrerin Trading market"
 building_cendrein_market_01_desc: "Due to repeated contacts with the Cendrerin of the Sea of Ash, a small market has set itself up in the region. Everything from the famous fish sauce of the Cendrerin to the most obscure metal or mineral dug up from the mountains is sold by the nomads to buy precious commodities they wouldn’t find elsewhere, while some few settle in the region, forsaking their tribes to join the settled life in Orlais."
 building_cendrein_market_02: "Cendrerin bazaar"
 building_cendrein_market_02_desc: "Thanks to funding, the little market has now transformed into a greater market, where multiple tribes come to trade for multiple commodities from all over [thedas|E], while selling sulphur, fish and plenty of other products from the surprisingly rich Sea of Ash. Some Cendrerin have now settled more permanently in the region for the benefit of trade."
 building_cendrein_market_03: "Cendrerin quarter"
 building_cendrein_market_03_desc: "With the increased presence of the Cendrerin thanks to trade and settling, a neighbourhood as now been established for the Cendrerin nomad, which immensely helps in the matter of trade with the nomads of the Sea of Ash, as well as housing a significant minority of Cendrerin inhabitants. Some Cendrerin, however, tend to miss the life of wandering, and leave to adventure in the rest of [thedas|E]."
 cendrein_market_01: "Cendrerin guests will periodically arrive."
 cendrein_market_02: "Cendrerin courtiers will periodically arrive."
 cendrein_market_03: "Cendrerin courtiers and adventurers will periodically arrive."
 dataw_events_gamord.0072.t: "A Cendrerin trader gains prominence in Lisière-de-Cendre."
 dataw_events_gamord.0072.desc: "[cendrerin_merchant.GetHerHis] joined your court."
 dataw_events_gamord.0073.t: "An adventuring Cendrerin sets out into the world."
 dataw_events_gamord.0073.desc: "[cendrerin_merchant.GetShortUIName|U] formed an adventuring band."

