 trait_elven_mage_desc: "This character manipulates earthly forces with a heavy emphasis on herbalism and healing."
 trait_elven_mage_character_desc: "[ROOT.GetCharacter.GetFirstName] manipulates earthly forces with a heavy emphasis on herbalism and healing."
 trait_tranquil: "Tranquil"
 trait_tranquil_desc: "This character has undergone the [rite_of_tranquility|E]"
 trait_tranquil_character_desc: "[ROOT.GetCharacter.GetFirstName] has undergone the [rite_of_tranquility|E]"
 trait_lyrium_addict: "[lyrium|E] Addict"
 trait_lyrium_addict_desc: "This character has started to see [lyrium|E] not only as a source of power, but of basic sustenance, and now has a constant craving for the substance."
 trait_lyrium_addict_character_desc: "[ROOT.GetCharacter.GetFirstName] has started to see [lyrium|E] not only as a source of power, but of basic sustenance, and now has a constant craving for the substance."
 trait_apostate: "Apostate"
 trait_apostate_desc: "This character illegally practices [dataw_magic|E] without oversight from a sanctioned body."
 trait_apostate_character_desc: "[ROOT.GetCharacter.GetFirstName] illegally practices [dataw_magic|E] without oversight from a sanctioned body."
 trait_templar: "Templar"
 trait_templar_desc: "This character is a member of the [templar|E] Order, and as such has been trained in martial techniques as well as how to consume [lyrium|E] to nullify magical abilities."
 trait_templar_character_desc: "[ROOT.GetCharacter.GetFirstName] is a member of the [templar|E] Order, and as such has been trained in martial techniques as well as how to consume [lyrium|E] to nullify magical abilities."
 trait_grey_warden: "Grey Warden"
 trait_grey_warden_desc: "This character has survived the [joining|E], and is now a member of the [grey_warden|E]s."
 trait_grey_warden_character_desc: "[ROOT.GetCharacter.GetFirstName] has survived the [joining|E], and is now a member of the [grey_warden|E]s."

 trait_arcane_mage: "Arcane spells"
 trait_arcane_mage_desc: "Arcane [dataw_magic|E] taps into the deepest wells of the [fade|E], protecting the caster and crushing the arcanist's foes."
 trait_creation_mage: "Creation Mage"
 trait_creation_mage_desc: "[Concept('mage','Mages')|E] schooled in creation are invaluable allies who can heal wounds, strengthen party members, and ward against oncoming foes."
 trait_entropy_mage: "Entropy Mage"
 trait_entropy_mage_desc: "This [mage|E] delves into the chaotic nature of the [fade|E], twisting the fabric of probability and ensnaring foes with horrifying visions."
 trait_primal_mage: "Primal Mage"
 trait_primal_mage_desc: "This [mage|E] is able to command earth and sky, they also mastered the elements of fire and ice."
 trait_spirit_mage: "Spirit Mage"
 trait_spirit_mage_desc: "Spirit [dataw_magic|E] shakes foes to the core, partially bypassing resistances and effectively countering enemy [Concept('mage','Mages')|E]."
 trait_track_elven: "Elven spells"
 trait_track_elven_desc: "WIP"
 trait_track_blood: "Blood spells"
 trait_track_blood_desc: "Known as "maleficarum," blood [Concept('mage','Mages')|E] are feared not only for the incredible power of their spells, but also their ability to control minds. [templar|E]s hunt blood mages relentlessly, yet despite their efforts, Kirkwall sees more instances of blood [dataw_magic|E] with each passing year. Some whisper that the Order's relentless hunt has driven good intentioned apostates to blood magic in their desperation to survive and keep their freedom."
 trait_track_apostate: "Unregistered spells"
 trait_track_apostate_desc: "WIP"

