 dataw_spell_regenerated_modifier_desc: "This character had a wound or disease treated by a powerful healing spell, this spell cannot be used on this person again for some time"
 dataw_spell_stone_fist_modifier: "Stone Fist"
 dataw_spell_stone_fist_modifier_desc: "This character hurls a fist of stone at their target, knocking them down and decreasing their prowess."
