 dataw_spell_rejuvenate_modifier: "Rejuvenate"
 dataw_spell_rejuvenate_modifier_desc: "A Mage has casted this Rejuvenation spell, granting them better health for the time being."
 dataw_spell_life_warded_modifier: "Had Life Ward Casted"
 dataw_spell_life_warded_modifier_desc: "This character's life has been extended with the usage of Life Ward, they are unable to have this spell casted on them again."
