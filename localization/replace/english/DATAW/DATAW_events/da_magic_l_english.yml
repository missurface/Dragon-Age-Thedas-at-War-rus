 dataw_spell_walking_bomb_modifier_desc: "Inject your target with a magical bomb that will decrease their health for a short period of time. Should the target die while the bomb is active, it will explode, severely injurying nearby targets."
 dataw_spell_mind_blast_modifier: "Mind Blast"
 dataw_spell_mind_blast_modifier_desc: "Project a wave of telekinetic energy, stunning your opponent."
 dataw_spell_lighting_modifier: "Lightning"
