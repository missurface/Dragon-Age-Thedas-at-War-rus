 dataw_spell_winters_grasp_modifier_desc: "Envelop your target in a freezing grip, slowing their travel speed, resistance to disease and prowess."
 dataw_spell_fire_blast_modifier: "Flame Blast"
 dataw_spell_fire_blast_modifier_desc: "Aim a cone of fire at your target, decreasing their health, lowering their prowess and resistance to diseases."
 dataw_spell_frost_weapons_modifier: "Frost Weapons"
 dataw_spell_frost_weapons_modifier_desc: "Encase your retinue's weapons in ice, increasing their prowess and knight effectiveness."
 dataw_spell_arcane_bolt_modifier: "Arcane Bolt"
