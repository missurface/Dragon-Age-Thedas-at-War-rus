 dataw_spell_life_ward_modifier_desc: "Cast a protective ward on your target, preventing them from dying to any cause for 5 years. This spell can only be cast once per target."
 dataw_spell_chain_lightning_modifier: "Chain Lightning"
 dataw_spell_chain_lightning_modifier_desc: "Emit of a bolt of lightning that will jump to multiple targets, decreasing their health and prowess significantly, as well as knight effectiveness."
 dataw_spell_barrier_modifier: "Barrier"
