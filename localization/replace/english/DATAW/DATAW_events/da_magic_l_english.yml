 DATAW_secret_events.0001.t: "My Secret Exposed!"
 DATAW_secret_events.0001.desc: "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] has revealed my secret for the world to see!\n\nMy [dataw_magic|E] and spellcasting ways are now widely known, and accepted as fact!"
 DATAW_secret_events.0001.a: "How will I ever live as an [apostate|E]?"

 DATAW_secret_events.0101.negative.desc: "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] has accused [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] of being an [apostate|E]! The details of his recount are shockingly vile!"
 DATAW_secret_events.0101.positive_1.desc: "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] has publicly accused [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] of being an [apostate|E]!"
 DATAW_secret_events.0101.worried.desc: "\n\nI must restrain my [dataw_magic|E] so they do not get the better of me. Who know where they will point their fingers next..."
 DATAW_secret_events.0101.positive_2.desc: "\n\nI do not see what the fuss is about. It is not as if [dataw_magic|E] is an unnatural affliction..."
 DATAW_secret_events.0101.b: "[owner.GetFirstNameNoTooltip] will answer for [owner.GetHerHis] crimes. Guards!"

