 dataw_spell_heroic_offense_modifier_desc: "Grant your target powerful offensive buffs."
 dataw_spell_haste_modifier: "Haste"
 dataw_spell_haste_modifier_desc: "This character and their respective entourage have their travel speed temporarily enhanced."
 dataw_spell_heroic_defense_modifier: "Heroic Defense"
 dataw_spell_heroic_defense_modifier_desc: "Grant your target powerful defensive buffs."
