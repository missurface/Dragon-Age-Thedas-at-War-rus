 dataw_mage_court_enchanter_events.0001.desc: "This world is full of dangers, even to a [ROOT.Char.GetTitleTierName] and [ROOT.Char.GetHerHis] [ROOT.Char.Custom('GetCourtierPlural')|l]. As my behest, my servants have inquired after recommendations. Now they have assembled a few options to chose from."
