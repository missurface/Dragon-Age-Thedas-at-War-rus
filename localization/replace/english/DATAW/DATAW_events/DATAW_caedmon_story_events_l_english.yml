###### GET FUCKED EVENT FOR SLOW CONQUERORS
 dataw_pretender_conquest.001.tit: "Fear and Envy"
 dataw_pretender_conquest.001.desc: "In Ferelden, few have the ability to stand against the strength of my realm. \n\nThis serves as quite the source of pride for my court - and especially - me. However, what serves as my source of pride, for others serves as a source of envy and terror; terror at what could be. \n\nA leading courtier of mine has brought word that my fellow rulers of Ferelden have been collaborating in secret, plotting to cut me down to size. It seems they fear my growing power and believe that I intend to crown myself [ROOT.Char.Custom('GetQueenKing')|l] of all Ferelden. \n\nNow all that remains is how I handle this information."
 dataw_pretender_conquest.001.opt.a: "If they think me [ROOT.Char.Custom('GetQueenKing')|l], then I shall be [ROOT.Char.Custom('GetQueenKing')|l]!"
 dataw_pretender_conquest.001.opt.a.tooltip: "Declare yourself [ROOT.Char.Custom('GetQueenKing')|l] of all Ferelden and face any who might try to stop you."
 dataw_pretender_conquest.001.opt.b: "Try to assauge their fears for as long as I can."
 dataw_pretender_conquest.001.opt.b.tooltip: "This might buy you a few years of time to prepare for the inevitable."




 ####### notification event for new pretender
 dataw_pretender_response.001.tit: "A New Pretender for the Throne"
 dataw_pretender_response.001.desc: "[pretender_ruler.GetFirstName] has declared [pretender_ruler.GetHerselfHimself] [pretender_ruler.Custom('GetQueenKing')|l] of all Ferelden. Such statements will surely only lead to conflict for our people. \n\nAlready I hear my neighboring arls and banns clammoring to cut this would-be [pretender_ruler.Custom('GetQueenKing')|l] down to size. \n\nHow this will arise, time will tell."
 dataw_pretender_response.001.opt.a: "A war is sure to come..."
 dataw_pretender_response.001.opt.a.tooltip: "I must prepare myself"