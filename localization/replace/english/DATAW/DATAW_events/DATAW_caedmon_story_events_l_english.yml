l_english:




 dataw_caedmon_normal.0001.tit: "The War of Defiance"
 dataw_caedmon_normal.0001.desc: "We've known something like this would come sooner or later. Courier pigeons are flying in with word, there will be war. \n\nIt seems many of my subjects have lost faith in my vision of a unified Ferelden - if they ever believed in it to begin with. Now they've organized a mass revolt against my reign aided by outside agitators. \n\nIs this the end of my ambition? \n\nNo, I refuse to submit, they shall be shown the truth."
 dataw_caedmon_normal.0001.opt.a: "The doubters and deceivers will soon know their place."
 dataw_caedmon_normal.0001.opt.b: "Now is not the right time."



 DATAW_dataw_caedmon_normal.0001.opt.a.tooltip.a: "[struggle_involved|E] [rulers|e] in [GetTitleByKey('e_ferelden').GetBaseNameNoTier] will oppose your [claim|e] to the throne of [GetTitleByKey('e_ferelden').GetBaseNameNoTier], declaring the #bold The Campaign Against Pretender [loc_scope.GetFirstName]#!."
 DATAW_dataw_caedmon_normal.0001.opt.a.tooltip.b: "[loc_scope.GetCharacterViewNameOrMe] will be pulled into [war|e] against every [struggle_involved|e] [ruler|e] of [GetTitleByKey('e_ferelden').GetBaseNameNoTier] that is not your loyal [vassal|e]. Should you succeed, the #ENC rulers of [GetTitleByKey('e_ferelden').GetBaseNameNoTier] will be forced to accept your [claim|e] to the throne of [GetTitleByKey('e_ferelden').GetBaseNameNoTier]#!."
 DATAW_dataw_caedmon_normal.0001.opt.a.tooltip.d: " Should [loc_scope.GetCharacterViewNameOrMe] be [defeat|e]ed in this [war|e], #XB [loc_scope.GetCharacterViewNameOrMe] will be [deposed|e], and [loc_scope.GetCharacterViewNameOrMe]r [realm|e] will be stripped of all lands not rightfully part of it, leaving only the [de_jure|E] lands of your capital arling#!."
 DATAW_dataw_caedmon_normal.0001.opt.a.tooltip.c: "Should [loc_scope.GetCharacterViewNameOrMe] [character_death_die|E] before fully unifying [GetTitleByKey('e_ferelden').GetBaseNameNoTier], #XB the void caused by [loc_scope.GetCharacterViewNameOrMe]r [character_death_death|E] will trigger the [war_of_the_crowns|E]#!."
 DATAW_dataw_caedmon_normal.0001.opt.b.tooltip.a: "Unlocks Forge The Crown of Ferelden [decision|E] for every [dog_lords|E] of [GetTitleByKey('e_ferelden').GetBaseNameNoTier], with discount towards the cost given to [loc_scope.GetCharacterViewNameOrMe]"



