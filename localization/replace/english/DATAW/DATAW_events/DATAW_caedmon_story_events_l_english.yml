 dataw_orlesian_forces: "An elite vanguard of Orlesian troops joins your forces!"










################ Build-up to Great Defiance #################
 dataw_caedmon_warning.001.tit: "A Murmur at Court"
 dataw_caedmon_warning.001.desc: "Curt glances. Terse words. \n\nI've grown accustomed to these in my courtroom since my coronation. After so many years of my rule, one would think the people would adjust themselves to the new state of affairs. They have not. \n\nIntercepted communications suggest a growing discontent with my rule. Now, even my family fears for their safety. \n\nI eventually catch a pair of gossiping courtiers who believed they were out of earshot, and ordered them under pain of death to reveal their secrets. Little was of use."
 dataw_caedmon_warning.001.opt.a: "Their deaths were swift - but painful."
 dataw_caedmon_warning.001.opt.a.tooltip: "The voices don't stop, they just move somewhere #N you can't hear...#!"

 dataw_caedmon_warning.002.tit: "A Direct Confrontation"
 dataw_caedmon_warning.002.desc: "'Ferelden has no king!' \n\nThe air is still, the shout still reverborating through the long halls of my courtroom. \n\nBetween the balconies leading up to my throne stands a lone man, easily in his twilight years pointing a sword - at me. \n\nWithin seconds he is detained by my guards. Alas, somehow during the struggle he was mortally wounded, and bled out in front of my courtiers - a last gasp slipping from his lips. \n\n'I die a free man, will you all do the same?' \n\nWhispers pass from person to person, with the occasional dagger thrown my way. No matter, I am their king. They will be silent. \n\n I command it."
 dataw_caedmon_warning.002.opt.a: "How dare they question my rule!"
 dataw_caedmon_warning.002.opt.a.tooltip: "The tension is palpable, #N my rule lies on a knife's edge...#!"







####### REDCLIFFE STUFF ############
 DATAW_redcliffe_events.01.tit: "An Offer from Denerim"
 DATAW_redcliffe_events.01.desc: "My court swirls with the news. [caedmonliege.GetFirstName] has sent his demands for submission to Redcliffe. \n\nMany say the time of an independent Redcliffe has passed, and that if we want to continue in our existence we must be willing to show humility in the face of certain destruction. \n\nOthers though, advise strength. Castle Redcliffe has never fallen to an outside force - and it never shall - they are quick to tell me."
 DATAW_redcliffe_events.01.opt.a: "Wiser heads must prevail."
 DATAW_redcliffe_events.01.opt.a.tooltip: "Send word to the would-be king, we are his men."
 DATAW_redcliffe_events.01.opt.b: "Castles do not cower."
 DATAW_redcliffe_events.01.opt.b.tooltip: "There is iron in the hills, as there is in the people."



######### DEATH EVENTS ###########
 dataw_caedmon_death.001.tit: "Death of a Conqueror"
 dataw_caedmon_death.001.desc: "Caedmon is dead, and with him the dream for a unified [GetTitleByKey('e_ferelden').GetBaseNameNoTier] passes into the fade. \n\nIt seems that Dane's legacy was not meant to rule a unified Clayne people, as had been thought. \n\nNow, many look for the earliest chance to declare themselves free from my rule. For certain, any chance on my end of unifying the land is low."
 dataw_caedmon_death.001.opt.a: "Woe to what could have been!"
 dataw_caedmon_death.001.opt.a.tooltip: "Your realm will shatter to just the lands loyal to you around the Arling of Denerim."
 dataw_caedmon_death.001.opt.a.custom_tooltip: "All kingdom level titles are destroyed and vassals outside the Arling of Denerim break free!"

 dataw_caedmon_death.002.tit: "War for the Crown"
 dataw_caedmon_death.002.desc: "Caedmon is dead, and already the vultures circle for his throne. \n\nIt seems that the legitimacy earned through the hardfought wars of defiance mean nought now, and my claim to the throne of [GetTitleByKey('k_ferelden').GetBaseNameNoTier] passes with his last breath. \n\nWhilst many of my vassals have stayed loyal out of fear of his reputation, others outside my core lands are already looking for a way out from under my authority."
 dataw_caedmon_death.002.opt.a: "Woe to what could have been!"
 dataw_caedmon_death.002.opt.a.tooltip: "Your realm will shatter to just the lands loyal to you around the Teyrnir of Denerim."
 dataw_caedmon_death.002.opt.a.custom_tooltip: "All kingdom level titles except Denerim are destroyed and vassals outside the Teyrnir of Denerim break free!"





