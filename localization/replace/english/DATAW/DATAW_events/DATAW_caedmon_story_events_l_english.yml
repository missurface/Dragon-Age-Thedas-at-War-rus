 secure_fereldan_foothold_decision_desc: "Ever since the collapse of the region after the end of Maferath's rule, Ferelden has been an unstable neighbour at best and a hostile one at worst. Kordillus I did his best to bring aid to the common folk against the [darkspawn|E] during the Second [blight|E], but turmoil and conflict still plagues the land of the dog lords to this day. \n\nThis is an unacceptable state for [andraste|E]'s homeland to be in. By bringing it under the rule of Val Royeaux, we could stabilize the region and making it safer for pilgrims and locals alike, while also bolstering our own prestige."
 subdue_the_dog_lords_decision_title: "Subdue the Dog Lords"

################################ MAIN EVENTS #######################
### main event 1 - how to rule
 dataw_caedmon_main.001.tit: "How to Rule?"
 dataw_caedmon_main.001.desc: "I have but one vision, a unified Ferelden, but I must ask myself how I will reign. Shall I win over my Clayne brethren with words, or will the sword prevail where my speech might falter? \n\nA diplomatic approach may foster stability as I consolidate the kingdom, but my strength of arm and strategic acumen may be the surer way to prove my worthiness to rule."
 dataw_caedmon_main.001.opt.a: "I will prove myself as a mighty conqueror!"
 dataw_caedmon_main.001.opt.b: "I will present myself as a unifier!"

### main event 2 - where to begin           MAYBE CUT?
 dataw_caedmon_main.002.tit: "Where to Begin?"
 dataw_caedmon_main.002.desc: "The unification of Ferelden is a great undertaking, and I must carefully consider where to begin. \n\nTo my west lies the divided Bannorn; consolidating these farmlands before my foes have the opportunity would be wise. \n\nTo my south are the Southron Hills; securing these could serve to better defend Denerim's backdoor. \n\nAmaranthine to my north is a large and powerful arling, and neutering them would be a surefire way to get rid of one of my greatest potential rivals. \n\nLastly is Gwaren to my southeast; though sacked last century by Brecilian barbarians, it remains an important center of trade, and if left unchecked, could prove a formidable threat to Denerim."
 dataw_caedmon_main.002.opt.a: "Eventually, all shall submit..."
 dataw_caedmon_main.002.opt.a.tooltip: "#N Check your decisions for the next step in your journey!#!\n#N Be warned#! - the Clayne loathe being ruled, the idea of a 'king' is not a pleasent thought to them..."

### main event 3 - crown of ferelden
 dataw_caedmon_main.003.tit: "The Crown of Ferelden"
 dataw_caedmon_main.003.desc: "A great authority is needed to rally the disparate Clayne banns, and I shall have that symbol placed upon my brow. \n\nI have gathered Ferelden's finest smiths and entrusted them with the finest of materials to forge a crown that will inspire awe in all my subjects. It is my hope that this crown, my legacy, will rest on the heads of many great kings to come after me, and that they will stay true to my vision of a strong, united Ferelden."
 dataw_caedmon_main.003.opt.a: "A crown worthy of a united Ferelden."
 dataw_caedmon_main.003_opt.a.tooltip: "Word has reached the Arls and Banns outside your realm of your coronation. #N They are not pleased.#!"

 caedmon_conquest_paths: "#P You unlock two decisions related to conquering Ferelden #!"



### main event 4 - breaking brandel's reach
 dataw_caedmon_main.004.tit: "Breaking Brandel's Reach"
 dataw_caedmon_main.004.desc: "The islands to the northeast of Ferelden have long been a thorn in the side of our ports. They serve as safehavens for the scum and villainy of Ferelden. \n\nBut no longer. The Islands are under my firm grasp, and they shall be routed of any privateering influences."
 dataw_caedmon_main.004.opt.a: "A proper Clayne must rule in this land."
 dataw_caedmon_main.004.opt.a.tooltip: "The Wake are not to be trusted, a loyal Clayne ruler must be installed."






### main event 5 - the future of ferelden
 dataw_caedmon_main.005.tit: "The Gate that Holds"
 dataw_caedmon_main.005.desc: "The Banns have submitted to my will, central Ferelden is mine to rule. Now, my eyes look to Redcliffe, the Clayne's strongest bastian leading into our valley. \n\nAny would-be ruler of our people must naturally include Redcliffe in their domain. The question remains though, how will I approach the gate of Ferelden?"
 dataw_caedmon_main.005.opt.a: "Approach Redcliffe with terms."
 dataw_caedmon_main.005.opt.b: "Conscript from our new subjects."

### main event 5.1 - redcliffe response event - no
 dataw_caedmon_main.0051.tit: "A Response from Redcliffe"
 dataw_caedmon_main.0051.desc: "Redcliffe has rejected our offers of peace, shunning attempts we've made at preventing all-out war between us. \n\nThere will be conflict in the future between our realms, the only question that remains - is when."
 dataw_caedmon_main.0051.opt.a: "They shall soon regret this decision."

### main event 5.2 - redcliffe response event - yes
 dataw_caedmon_main.0052.tit: "A Response from Redcliffe"
 dataw_caedmon_main.0052.desc: "Redcliffe has accepted our offers of peace, likely in an attempt at preventing all-out war between us. \n\nThere will be peace for now, they may serve their purpose guarding the path into our lands."
 dataw_caedmon_main.0052.opt.a: "Confirm them in their rights to rule."

### main event 6 - What Remains?
 dataw_caedmon_main.006.tit: "What Remains?"
 dataw_caedmon_main.006.desc: "Ferelden is falling one by one to my forces, the would-be teyrns and upstart arls. Now all that remains is for the rest to bend the knee."
 dataw_caedmon_main.006.opt.a: "Onwards, to Portsmouth and Edgehall!"

### main event 7 - Ferelden is United
 dataw_caedmon_main.007.tit: "Ferelden is United"
 dataw_caedmon_main.007.desc: "The dream has been realized. \n\nAll of Ferelden is in my grasp. The Clayne have been united and no longer will their petty squabbles divide us. \n\n[daneancestor.GetFirstName] drove the werewovles from Ferelden. [hafterancestor.GetFirstName] was declared the first teyrn of our people. What will they say of me, long after I am gone?"
 dataw_caedmon_main.007.opt.a: "I am finally and truly, King."
 dataw_caedmon_main.007.opt.a.tooltip: "But have your ambitions truly been satisfied?"








##################### RELIGION EVENTS ########################
##### RELIGION EVENT 1 - FAITH OF FERELDEN
 dataw_caedmon_religion.001.tit: "The Faith of Ferelden"
 dataw_caedmon_religion.001.desc: "'Dear [TITLE] Caedmon! I am [ORLESIAN_KNIGHT], and we have heard of your ambitions of uniting the lands of Ferelden under a single crown and chant, just like our dear [Kordillus 1 Drakon] did for our glorious empire. Please, it would be a pleasure to serve the Kordillus of our generation on such a holy soil.' \n\nIdolized praise from a foreign Orlesian knight was the last thing I expected to come from my declaration as King of Ferelden. While this attitude could be useful, I can still notice the careful looks of my courtiers. Many have been raised on tales of Tevinter's imperial oppression, and despite the support the Emperor has given [KINGDOM OF AENWALDBRIM] in the Second Blight, many look at the multi-layered speeches of the Empire of Orlais with suspicion. \n\nWith all those eyes looking at me, I realise that something needs to be done if we desire for Ferelden to be a realm worthy of its name. Ferelden needs an organized Chantry, to guide my subjects under their rightful king. \n\nYet the ultimate question rests in all those expecting eyes. Should I lean into the parallel with their unifying figure, accepting the support of Orlais and its religious authority? Or should I commit to autonomy to calm the worries of my subjects, who remember strongly the imperial horrors of Tevinter?"
 dataw_caedmon_religion.001.opt.a: "I am the Kordillus of our time!"
 dataw_caedmon_religion.001.opt.a.tooltip: "Accept foregin aid in your conquests. Your fellow Claynes may not approve, but in time they shall be shown the truth!"
 dataw_caedmon_religion.001.opt.b: "This unification is for the throne of Ferelden!"
 dataw_caedmon_religion.001.opt.b.tooltip: "Uniting your people will be much easier without trying to force a new faith upon them as well."

##### RELIGION EVENT 2 - Caedmon's Temple
 dataw_caedmon_religion.002.tit: "Caedmon's Temple"
 dataw_caedmon_religion.002.desc: "Faith shapes our lives. As we sing the Chant and prepare ourselves to bring it to the four corners of Thedas, I wonder about the safety of andrastianism in this realm. With my organization of the [YOUR_FAITH], those who followed me in this faith for a realm need reassurance that I follow it with confidence. \n\nFor that, I should build a great cathedral in Andraste's birthplace, [Denerim]. A cathedral equal to that of the Divine in [Val Royeaux], great enough to silence those pretenders to Andraste's birthplace in [Jader]. \n\nYes, this must be done. But who should I dedicate it to?"
 dataw_caedmon_religion.002.opt.a: "I shall build my temple for the glory of Andraste!"
 dataw_caedmon_religion.002.opt.a.tooltip: ""

#### RELIGION EVENT 3 - Foreign Relations
 dataw_caedmon_religion.003.tit: "Foreign Relations"
 dataw_caedmon_religion.003.desc: "I have seen the way the people of Orlais look at me. The pilgrims coming in Denerim now leave candles to my success. Chanters come, signing for the glory of our Chant over the Prophet's homeland. A revered mother has even come to ask of me to write a canticle, like how Kordillus wrote the Canticle of Exaltations. \n\nSuch adoration will not last forever, but I could use it in the present moment to my advantage. I could use this to gain the Divine's personal favour, perhaps by inviting her to Andraste's birthplace. \n\nWould this be bold enough to work? Would the Divine base herself on rumours and popular adoration to meet me?"
 dataw_caedmon_religion.003.opt.a: "It's worth a try."
 dataw_caedmon_religion.003.opt.a.tooltip: "The Divine might be swayed to favor your cause..."
 dataw_caedmon_religion.003.opt.b: "I'd rather better relations with Val Royeaux."
 dataw_caedmon_religion.003.opt.b.tooltip: "The Emperor will clearly be of more use than the Divine..."







#### Religion Event (new 1) - Faith of Ferelden
 dataw_caedmon_normal.0002.tit: "The Faith of Ferelden"
 dataw_caedmon_normal.0002.desc: "While the Alamarri surely bask in the light of the maker, we lack a central church to organize the faithful. This has limited any would-be unifier of our people. \n\nPagans still rule to the west, while Orlais and Tevinter have found a way to spread Andraste's chant throughout their empires. My kingdom must do the same. But should we unite with the other faithful? Or forge our own path? \n\nReaching out to Orlais could have many positives benefits, both obvious and unforseen - but turning my back on the traditions of my ancestors may taste sour to the people I rule."
 dataw_caedmon_normal.0002.opt.a: "Our people know her word best."
 dataw_caedmon_normal.0002.opt.b: "The Orlesians have the right of it."
 DATAW_allow_faith_reform_with_1_holy_site: "Allows [faith|e] reform using only #positive_value 1#! [holy_site|e]"
 DATAW_allow_faith_reform_with_2_holy_site: "Allows [faith|e] reform using only #positive_value 2#! [holy_site|e]"
