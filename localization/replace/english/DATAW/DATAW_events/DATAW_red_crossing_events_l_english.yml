l_english:
 DATAW_red_crossing_minor.0001.name: "The Faiths Collide"
 DATAW_red_crossing_minor.0001.desc: "As I go about my day, I notice one of my servants approaching me to inform me of a most peculiar affair.\nThe Orlesian Chantry has recently imprisoned a famous scholar, Étienne de Clémenceau, who was caught discussing the relationship and possible theological compatibility between the Maker and the Elven pantheon with an elven scholar, follower of the Evanuris. Even though the subject of the discussion would probably enrage a large part of the Chantry on its own, it is the friendly nature of the discussion that, supposedly, led to Étienne's imprisonment. In order to avoid that someone puts words in my mouth, it would be wise to clarify my opinion to the wider world on the situation."
 DATAW_red_crossing_minor.0001.opt.a: "We should be free to discuss those subjects, no matter with whom."
 DATAW_red_crossing_minor.0001.opt.b: "This is what he gets for mingling with those who do not follow The Maker!"

 DATAW_red_crossing_major.0001.t: "Massacre at Red Crossing"
 DATAW_red_crossing_major.0001.desc: "Rumors of a new conflict between Orlais and the Dales have been spreading like wildfire throughout Thedas. While the details change with each telling of the tale, a few facts are known. \n\nApparently a small Dalish raiding party razed the [red_crossing.GetName|U], which sat along the border between Orlais and the Dales. Orlesian forces arrived too late to save the village, but they did find [emerald_knights|E] in the village, supposedtly in pursuit of the rogue raiding party. In the end, the Dalish were forced to retreat and [elandrin.GetName|U], a high ranking Emerald Knight, was killed in the conflict. \n\nOf course, the Orlesians dispute the official Dalish account and vice versa. As both sides blame the other for the attack, the possibility of peace between the two nations seems like a distant dream."
 DATAW_red_crossing_major.0001.desc.dalish: "Terrible news has arrived in my court from the border with Orlais. The report says that a small raiding party led by [siona.GetName|U] attacked the [red_crossing.GetName|U] in retaliation for repeated incursions by templars seeking to convert the [elvhen|El].\n\nThe Orlesians have been relentless in their attempts to convert anyone and everyone. It was only a matter of time before one of us took matters into their own hands. \n\n[elandrin.GetName|U], one of the most well known [emerald_knights|E], attempted to stop the raid, but arrived too late. The raiders had already slaughtered most of the villagers and retreated. Before he could leave, Orlesian soldiers captured [elandrin.GetName|U] and executed him in front of a crowd of angry villagers.\n\nOther [emerald_knights|E] that were following [elandrin.GetName|U] managed to recover his body before being forced to retreat. Tensions between our nations have been rising for many years, but this might finally be the tipping point for both Orlais and the Dales."
 DATAW_red_crossing_major.0001.desc.orlesian: "Dreadful news has swept into my court with the fury of a raging inferno. The quaint [red_crossing.GetName|U], nestled near the border with the Dales, was subjected to sword and arrow by the Dalish [elves|El], who began the slaughter with the murder of a young woman named [adalene.GetName|U].\n\nThe villagers bravely fought against the [emerald_knights|E] that invaded their home, slaying one of them as his companions retreated back into the forest. \n\nBut even now, the excited chatter among my courtiers begins to wane as the specter of war looms over us. The attack on an Orlesian village and the death of an Emerald Knight cannot be overlooked, and many believe a final confrontation is unavoidable.\n\nSome yearn to put the [elves|El] in their place, others in more hushed voices murmur concern and desire to avoid further bloodshed."
 DATAW_red_crossing_major.0001.opt.a: "Let the dice fall where they may, I am ready for whatever happens!"
 DATAW_red_crossing_major.0001.opt.b: "Fetch my sword! We'll teach those detestable curs a lesson they will not soon forget!"
 DATAW_red_crossing_major.0001.opt.c: "This tragedy is just the latest in the long conflict between humans and elves."
 DATAW_red_crossing_major.0001.opt.d: "To answer bloodshed with bloodshed is not the answer!"
 DATAW_red_crossing_major.0001.opt.e: "This does not bode well for relations between Orlais and the Dales."
 DATAW_red_crossing_major.0001.opt.f: "May the [maker|E] guide our people through these dark times."
 DATAW_red_crossing_major.0001.opt.g: "May the [evanuris|E] guide our people through these dark times."
 DATAW_red_crossing_major.0001.opt.h: "Dark times are ahead for [thedas|E]."



 DATAW_red_crossing_major.0002.t: "To War?"
 DATAW_red_crossing_major.0002.desc.intro: "A raid on #Italic my#! land in #Italic my#! empire. Orlesian blood spilled, an Emerald Knight of the Dales dead and discarded in the river. Even now, I have the [chantry|EU] and the nobles all but bashing down the door to my private apartments to give me their #Italic indispensable#! opinion on what my next steps should be. \n\nAs the ruler of Orlais, it will ultimately fall to me on how to address this matter, regardless of the counsel I am given. On the one hand, we cannot let this massacre go unanswered. Even an assault on this inconsequential village is an assault on the empire. And I cannot overlook the opportunity to expand the border of Orlais now that the elves have given me the reason to strike..."
 DATAW_red_crossing_major.0002.opt.a.tooltip: "Call up our levies, summon the chevaliers. We march to war!"
 DATAW_red_crossing_major.0002.desc.kordy: "\n\nOn the other hand, my father, [kordy.GetName|U], was a close friend with the elves. I remember hearing tales of [kordy.GetName|U] and his companionship with [ameridan.GetName|U], and perhaps there is a lesson to be learned from those tales."
 DATAW_red_crossing_major.0002.desc.mid: "On the other hand, my predecessor, [kordy.GetName|U], was a close friend to the elves. I have heard tales of [kordy.GetName|U] and his companionship with [ameridan.GetName|U], and perhaps there is a lesson to be learned from those tales."
 DATAW_red_crossing_major.0002.desc.end: "\n\nBefore long, a new day dawns, and my advisors all gather around the council table to hear my orders and carry out my will."
 DATAW_red_crossing_major.0002.desc.zealot: "May [andraste|E] give us strength."
 DATAW_red_crossing_major.0002.opt.a: "This onslaught against Orlais cannot be ignored."
 DATAW_red_crossing_supporter_of_chantry: "Supporter of the Chantry"
 DATAW_red_crossing_open_minded: "Open Minded"