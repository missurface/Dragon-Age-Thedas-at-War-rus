### Ally with the Ciriane Cult Event Chain
 # Defenders of the Faith
 dataw_ciriane_rebellion.3806.t: "Defenders of the Faith"
 dataw_ciriane_rebellion.3806.desc: "[augur.GetName] approaches my throne and bows deeply before beginning.\n\n #italic "My Lord, I have served as your leal warrior for some time. But lately, I find my mind fixed on our return to the true faith. I urge you to found a holy order."#!"
 dataw_ciriane_rebellion.3806.a: "Very well. I will take it into consideration."
 dataw_ciriane_rebellion.3806.a_tt: "The #N Found Holy Order#! decision will be 50% cheaper."
 dataw_ciriane_rebellion.3806.b: "Guards, get this fool out of my sight!"

