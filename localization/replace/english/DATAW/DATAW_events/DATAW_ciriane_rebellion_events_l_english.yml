 DATAW_ciriane_rebellion.1001.a.alyons_not_convinced: "You fail to convince [GetTitleByKey('d_alyons').GetBaseNameNoTier] to support your independence"

 DATAW_ciriane_rebellion.1001.b.serault_bribed: "You bribe [GetTitleByKey('d_serault').GetBaseNameNoTier] to support your independence"
 DATAW_ciriane_rebellion.1001.b.serault_not_bribed: "You fail to bribe [GetTitleByKey('d_serault').GetBaseNameNoTier] to support your independence"
 DATAW_ciriane_rebellion.1001.b.alyons_bribed: "You bribe [GetTitleByKey('d_alyons').GetBaseNameNoTier] to support your independence"
 DATAW_ciriane_rebellion.1001.b.alyons_not_bribed: "You fail to bribe [GetTitleByKey('d_alyons').GetBaseNameNoTier] to support your independence"

 DATAW_ciriane_rebellion.1001.a.serault_notify_roux: "[GetTitleByKey('d_serault').GetBaseNameNoTier] decides to join [GetTitleByKey('e_orlais').GetBaseNameNoTier] to stop your rebellion"
 DATAW_ciriane_rebellion.1001.a.alyons_notify_roux: "[GetTitleByKey('d_alyons').GetBaseNameNoTier] decides to join [GetTitleByKey('e_orlais').GetBaseNameNoTier] to stop your rebellion"
 DATAW_ciriane_rebellion.1001.a.serault_notify_orlais: "[GetTitleByKey('d_serault').GetBaseNameNoTier] decides to join you to stop [GetTitleByKey('k_nahashin').GetBaseNameNoTier] rebellion"
 DATAW_ciriane_rebellion.1001.a.alyons_notify_orlais: "[GetTitleByKey('d_alyons').GetBaseNameNoTier] decides to join you to stop [GetTitleByKey('k_nahashin').GetBaseNameNoTier] rebellion"

 DATAW_ciriane_rebellion.1001.a.serault_orlais_notify: "[GetTitleByKey('d_serault').GetBaseNameNoTier] decides to join [GetTitleByKey('k_nahashin').GetBaseNameNoTier]'s planned rebellion"
 DATAW_ciriane_rebellion.1001.a.alyons_orlais_notify: "[GetTitleByKey('d_alyons').GetBaseNameNoTier] decides to join [GetTitleByKey('k_nahashin').GetBaseNameNoTier]'s planned rebellion"

#### K Nahashin Holder Declaration of Independene
 dataw_ciriane_rebellion.1002.t: "The Declaration of Independence"
 dataw_ciriane_rebellion.1002.desc: "The news from the south grows more grim with each report. War has well and truly erupted between the Empire and the Dales.\n\nYet while some despair, I see my opportunity at long last... With imperial forces steeped in conflict with the elves, perhaps the time has finally come to put our plans into motion and end [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier]'s rule over these marshes."
 dataw_ciriane_rebellion.1002.n.e.desc: "I arrive at my capital bruised and bloodied, but alive. I have undergone an ordeal at the hands of the [orlais.GetTitleAsNameNoTooltip]’s dogs, but by some miracle, I have managed to escape with my life intact.\n\nDuring these long weeks of running and hiding across the countryside, I had little time to appreciate my freedom. Now that I am home free, I let out a hearty laugh of relief. My guards rush to meet me and escort me back to my castle.\n\nSoon, after a hot bath and a good meal, I sit in my throne room contemplating my next course of action. The cat is out of the bag now; we can no longer catch the [orlais.GetTitleAsNameNoTooltip] off guard with our rebellion. The hardship I have suffered these past weeks is but a fraction of what I and all the people of the marshes might experience if this goes poorly.\n\n#N How committed am I really to this path?#!"
 dataw_ciriane_rebellion.1002.n.d.m.desc: "I stand stone-faced and silent as my valet’s dress me in my ceremonial garb. I am the [nahashin.GetTitleAsNameNoTooltip] now, and I must address the people.\n\nA ripple of discontent has been spreading across the marshes in response to the recent news: My predecessor was slain attempting to escape from the dungeons of [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier].\n\n#N Or so the [orlais.GetTitleAsNameNoTooltip] says.#!\n\nWhatever the truth, the people grumble with barely-disguised anger. [nahashin_past_holder.GetName] was, to many, a symbol. Now [nahashin_past_holder.GetSheHe] may well become a martyr.\n\n#N I need only fan the flames...#!"
 dataw_ciriane_rebellion.1002.n.d.f.desc: "I stand stone-faced and silent as my lady's maids dress me in my ceremonial garb. I am the [nahashin.GetTitleAsNameNoTooltip] now, and I must address the people.\n\nA ripple of discontent has been spreading across the marshes in response to the recent news: My predecessor was slain attempting to escape from the dungeons of [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier].\n\n#N Or so the [orlais.GetTitleAsNameNoTooltip] says.#!\n\nWhatever the truth, the people grumble with barely-disguised anger. [nahashin_past_holder.GetName] was, to many, a symbol. Now [nahashin_past_holder.GetSheHe] may well become a martyr.\n\n#N I need only fan the flames...#!"
 dataw_ciriane_rebellion.1002.a: "The timing could not be more perfect! @skill_martial_icon!"
 dataw_ciriane_rebellion.1002.b: "On second thought... Maybe I should abandon this foolish notion. @warning_icon!"
 DATAW_ciriane_rebellion.1002.b.coward: "Your prestige will be stripped for planning to rebel then backing out like a #N coward.#!"
 DATAW_ciriane_declare_independence_tt: "This will make you #N independent from Orlais immediately#! and give Orlais Options to: attack you now, attack after Dalish War, or let you remain independent."
 dataw_ciriane_rebellion.1002.n.e.a: "No liberty was ever won without sacrifice. I will not yield! @skill_martial_icon!"
 dataw_ciriane_rebellion.1002.n.e.b: "I must end this madness now, before things get any more out of hand @warning_icon!"
 dataw_ciriane_rebellion.1002.n.d.a: "Fetch my scribe. We will make our intent clear to Val Royeaux! @skill_martial_icon!"
 dataw_ciriane_rebellion.1002.n.d.b: "This is nothing but vanity. Charge the dissenters with lese-majesty. @warning_icon!"
 DATAW_ciriane_rebellion.1002.n.e.b_tt: "You end your plans of Rebellion, ending the #N Ciriane Rebellion#! once and for all"

#### K Nahashin #Declares War# of Independence
 dataw_ciriane_rebellion.1003.t: "Retaliation"
 dataw_ciriane_rebellion.1003.desc: "As I feared, despite the wounds inflicted by the elven invasion, the dragon is unwilling to simply lay down and accept our secession. It is to come to war after all – the might of the Orlesian Empire against my massed forces and those of my allies."
 dataw_ciriane_rebellion.1003.n.e.desc: "As anticipated, the [orlais.GetTitleAsNameNoTooltip] did not take kindly to my insistence on inciting a rebellion in spite of everything.\n\nThat I still live must fill [orlais.GetHerHim] with fury; I take amusement from that thought, at least, even as I must steel myself for war against the massed forces of Orlais.\n\n#N It is time to avenge myself upon my captors, and break the remaining chains that bind the marshfolk and I to the [orlais.GetTitleAsNameNoTooltip].#!"
 dataw_ciriane_rebellion.1003.n.d.desc: "The response from the capital is swift, the words icy.\n\nIt is now clear to the [orlais.GetTitleAsNameNoTooltip] that imprisoning [nahashin_past_holder.GetName] alone was not sufficient to quell the rebellious spirit of the marshes - In cutting off the head of the snake, [orlais.GetSheHe] has only enabled three more to spring up in its place.\n\n#N Now imperial troops mass with the intent of crushing our rebellion once and for all.#!"
 dataw_ciriane_rebellion.1003.ns.a.desc: "A courier arrived from the capital this morning, bearing the [orlais.GetTitleAsNameNoTooltip]’s response to our declaration of war. I smile as I read over the parchment - Despite the [orlais.GetTitleAsNameNoTooltip]’s bluster, the empire truly did not see this coming. Now they hurry to prepare for war, but we have the upper hand.\n\n#N Unlike the elves of the Dales, I know how the Orlesians think - after all, was I not one of them?#!"
 dataw_ciriane_rebellion.1003.a: "Let them come. They will not find us wanting."
 dataw_ciriane_rebellion.1003.n.e.a: "To war!"
 dataw_ciriane_rebellion.1003.n.e.d: "They underestimate our resolve."
 dataw_ciriane_rebellion.1003.ns.a: "So it begins."
 DATAW_ciriane_retaliation_war_tt: "#N This will officially begin the War of Independence!#! We will resist Orlesian Occupation!"
 DATAW_ciriane_retaliation_war_next_steps_tt: "#N We will be victorious in our conquests! One Kingdom at a time we shall weaken the Orlesian Empire!#!"
 DATAW_ciriane_retaliation_imprisonment_freed_tt: "Due to the attempted imprisonment by Orlais, #N an army of 10,000 marshmen and local tribes has been spawned to aid you!#!"
 DATAW_ciriane_retaliation_imprisonment_died_tt: "Due to your predecessor dying at the hands of the Orlesians, #N an army of 14,500 marshmen and local tribes has been spawned to aid you!#!"


 dataw_ciriane_rebellion.1003.nevarra: "Nevarran Sellswords"
 dataw_ciriane_rebellion.1003.ciriane: "Ciriane Steel"
