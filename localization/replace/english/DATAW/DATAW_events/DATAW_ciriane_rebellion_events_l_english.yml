### Ally with the Ciriane Cult Event Chain
 # COURT EVENT: The Augur
 dataw_ciriane_rebellion.3801.t: "The Augur"
 dataw_ciriane_rebellion.3801.desc: "A mysterious figure in dark robes approaches my throne. They are an Augur, one of the apostate [Concept('mage','Mages')|E] loyal to the [GetFaithByKey('ciriane_paganism').GetAdjective]. Their ancestors have studied [dataw_magic|E] for centuries, and have survived isolated in the Marches even after the rise of the [chantry|E].\n\nThe Augur invokes ancient oaths my ancestors swore to them. They tell me of their persecution under the chantry and their [templar|E]s.\n\n#N They beg me to see the wisdom of the good [spirits|E], to cast aside the false [maker|E] of [andraste|E] and defend them from the Templars’ swords.#!"
 dataw_ciriane_rebellion.3801.a: "I will deliver you to the Templars myself!"
 dataw_ciriane_rebellion.3801.b: "We may not see eye to eye, but I will keep you safe from the Templars."
 dataw_ciriane_rebellion.3801.c: "I'm with you Augur, for the good spirits!"

### Ally with the Ciriane Cult Event Chain
 # The Cult Revealed
 dataw_ciriane_rebellion.3802.t: "The Cult Revealed"
 dataw_ciriane_rebellion.3802.desc: "My advisors have arranged a clandestine meeting with several of the marshland tribesmen who live in the more isolated part of my lands. Though my [GetGlobalVariable('orlesian_culture_var').Culture.GetName] peers would balk at this suggestion, I actually find them to be quite reasonable fellows. Their ways are much the same as the [GetGlobalVariable('mareschois_culture_var').Culture.GetName], though they still follow the ways of [andraste.GetName] ancestors, rather than the Maker.\n\nThe tribes wish to share in the wealth of civilized lands, and to better integrate with the rest of my people. But they fear reprisals from the Chantry. Already, their Augurs are hunted by [templar|E]s as apostates. They beg my guarantee for their safety, invoking the pledges of protection my ancestors pledged to theirs."
 dataw_ciriane_rebellion.3802.a: "We must tolerate the pagans, at least!"
 dataw_ciriane_rebellion.3802.b: "It is my duty to defend the old ways, but the Chantry cannot know."
 dataw_ciriane_rebellion.3802.b_tt: "You convert to the [GetFaithByKey('ciriane_paganism').GetAdjective] #N in secret#!"
 dataw_ciriane_rebellion.3802.c: "As it was in the Divine Age! Your gods are my gods!"
 dataw_ciriane_rebellion.3802.d: "Guards, jail these heretics."
 tolerates_pagans:0 "Tolerates Pagans"
 tolerates_pagans_hidden:0 "Tolerates Pagans"
### Ally with the Ciriane Cult Event Chain
 # EVENT: Vassal Conversion
 dataw_ciriane_rebellion.3803.t: "Vassal Conversion"
 dataw_ciriane_rebellion.3803.desc: "Word arrives from my vassal [vassal.GetName], proudly declaring that they have returned to our ancestral forms of worship. They beg me too to see the light of the old gods, to reject [andraste.GetName]'s false prophecies and reject the ways of Orlais’ chantry. The move is almost unthinkable for a vassal of Orlais...\n\n#N ...but for an independent leader, our own local faith would be a boon.#!"
 dataw_ciriane_rebellion.3803.a: "I will join you, my vassal!!"
 dataw_ciriane_rebellion.3803.a_tt: "You convert to the [GetFaithByKey('ciriane_paganism').GetAdjective]"
 dataw_ciriane_rebellion.3803.t_tt: "You have chosen to Side with Orlais in all matters."
 dataw_ciriane_rebellion.3803.b: "The realm can tolerate other religions...for a price."
 dataw_ciriane_rebellion.3803.c: "The old ways are in the past, [vassal.GetFirstName]. Repent or face [andraste.GetName]'s wrath!"

### Ally with the Ciriane Cult Event Chain
 # EVENT: Heretic Liege
 dataw_ciriane_rebellion.3804.t: "Heretic Liege"
 dataw_ciriane_rebellion.3804.desc: "Troubling news comes from my liege’s capital. It seems [nahashin.GetSheHe] has turned his back on the [chant_of_light|E] and returned to the [GetFaithByKey('ciriane_paganism').GetAdjective].\n\nMy court priests spins tales of an impending civil war for me, warning that soon, the Divine & the [orlais.GetTitleAsNameNoTooltip] will bring the Maker’s wrath down on our whole duchy,\n\n#N unless I act first.#!"
 dataw_ciriane_rebellion.3804.a: "Perhaps it is time for a new Duke."
 dataw_ciriane_rebellion.3804.b: "Send word to the Divine, and beg for aid."
 dataw_ciriane_rebellion.3804.c: "Guards, see Andraste’s priest away."

### Ally with the Ciriane Cult Event Chain
 # EVENT: Ciriane Revival
 dataw_ciriane_rebellion.3805.t: "Ciriane Revival"
 dataw_ciriane_rebellion.3805.desc: "Upon receiving their orders, [cp.GetName] charges into my chambers. #italic “With respect, my lord”#! they begin.\n\n #italic “You cannot possibly think the people will convert quickly. They have followed the Chantry’s guidance for more than a century. If you hope to see Nahashin return to the old ways in your lifetime, it will take serious investment.”#!\n\nIt seems like this is the truth, and not just my councilor demanding more money.\n\n#N But still, there are other concerns we must budget for...#!"
 dataw_ciriane_rebellion.3805.a: "Take your time, this is a multi-generational project."
 dataw_ciriane_rebellion.3805.a_tt: "[cp.GetSheHe|U] will continue [cp.GetHerHis] task #N without a boost#!"
 dataw_ciriane_rebellion.3805.b: "I will stake my reputation on the project"
 dataw_ciriane_rebellion.3805.b_tt: "[cp.GetSheHe|U] will continue [cp.GetHerHis] task #N with a small boost#!"
 dataw_ciriane_rebellion.3805.c: "I will invest in the project."
 dataw_ciriane_rebellion.3805.c_tt: "[cp.GetSheHe|U] will continue [cp.GetHerHis] task #N with a moderate boost#!"
 dataw_ciriane_rebellion.3805.d: "If you can’t do it, I’ll find someone who will!"

