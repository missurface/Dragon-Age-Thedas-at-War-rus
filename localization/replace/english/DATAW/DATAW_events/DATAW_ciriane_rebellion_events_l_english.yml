 dataw_ciriane_rebellion.1003.ciriane_tt: "Your #N Ciriane Steel#! have been spawned to aid you!"
 dataw_ciriane_rebellion.1003.dalish_tt: "Your #N Dalish Precision#! have been spawned to aid you!"
