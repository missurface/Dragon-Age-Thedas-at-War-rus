## Ciriane Rebellion Events - 1000
# 1000 - 1999 is all Roux/K_Nahashin Perspective
# 2000-2499 is all D_Serault Perspective
# 2500-2999 is all D_Alyons Perspective
# 3000-3499 is all Orlais Perspective
# 3500-3999 is all Misc
# Day After Red Crossing has happened
#### Nahashin Holder decides if he wants to rebel
 dataw_ciriane_rebellion.1000.t: "The Ciriane Situation"
 dataw_ciriane_rebellion.1000.desc: "Since the rise of the Orlesian Empire under [kordillus_i.GetName], the once-fractious clans of the [GetGlobalVariable('ciriane_culture_var').Culture.GetName] have been united as a single proud nation. That, at least, is the story our rulers in [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier] tell themselves. Here in the [GetGeographicalRegion('custom_mareschois_population').GetName], the control exerted by the capital has always been... tenuous, at best.\n\nIn these lands, echoes remain, memories of the old ways - of the time when the marshfolk were a free people. #italic Is there a chance that we might be so once again?#! We exist at the fringes of the empire, both geographically and culturally. The [orlais.GetTitleAsNameNoTooltip] in distant Val Royeaux does not truly know us, does not truly understand our ways. How could [kordillus_i.GetSheHe], after all? My thoughts are increasingly preoccupied of late with notions like these. A strange destiny beckons.\n\n#italic #N Dare I step towards it?#!#!"
 dataw_ciriane_rebellion.1000.a: "Could I better serve my people as an independent king?"
 dataw_ciriane_rebellion.1000.b: "No, this is madness - Treason. The empire has been good to us."
 dataw_ciriane_rebellion.1000.c: "This remnant must be crushed! For the [orlais.GetTitleAsNameNoTooltip]'s sake."
 dataw_ciriane_rebellion.1000.a_tt: "You decide to #N eventually rebel.#! This will begin the Ciriane Rebellion story cycle, giving you events to build up your forces by the time Red Crossing occurs. #N If you do win the war of independence against Orlais, you will unlock new events and decisions to reform the Ciriane Empire with options to reform the Ciriane Religion.#! If you back out when the War of the Dales begins and decide not to rebel there, you will face a Ciriane uprising as you've changed your mind last second after convincing them to rebel with you."
 dataw_ciriane_rebellion.1000.b_tt: "You remain a #N Vassal#!, forever holding your peace and submitting under the Orlesian Empire's rule. "
 dataw_ciriane_rebellion.1000.c_tt: "You remain a vassal, seeking to align yourself with [orlais.GetTitleAsNameNoTooltip]. This will begin a different event chain, where instead of rebelling you aim to improve relations with Orlais and better defend the Empire. #N You will unlock decisions & events to align yourself with Orlais and will focus on crushing the rebellious Ciriane & Dalish.#! You will immediately travel to the capital to swear your oath to the [orlais.GetTitleAsNameNoTooltip], and convert to the Orlesian Chantry faith."

# Ally with Alyons/Serault
 dataw_ciriane_rebellion.1001.t: "An Offer of Friendship"
 dataw_ciriane_rebellion.1001.desc: "As I prepare my diplomatic overtures to my neighbors, I am haunted by their inevitable reply.\n\n#italic “What’s in it for me?”#! has been the death of many historic alliances.\n\nIf I expect [ally_target.GetName] to ride with me against the greatest empire in [thedas|E], I must make it worth their while.\n\n#italic #N But what do I have that they need? And how do I ensure that their dependence on me lasts?#!#!"
 dataw_ciriane_rebellion.1001.a: "Is my reputation not enough? [prestige_i]"
 dataw_ciriane_rebellion.1001.b: "I have the coin to make it worth their while... [gold_i]"
 dataw_ciriane_rebellion.1001.c: "I will offer them some of my excess lands [stewardship_i]"
 dataw_ciriane_rebellion.1001.c_tt: "You do not have a spare county that borders [ally_target.GetName]"
 dataw_ciriane_rebellion.1001.g_tt: "[nahashin.GetName] does not have a spare county that borders you, or [nahashin.GetSheHe] has already offered you land"
 dataw_ciriane_rebellion.1001.j_tt: "[nahashin.GetName] has already offered you land"

