 #### K Nahashin loses the rebellion war (folded)
 dataw_ciriane_rebellion.1004.t: "The War is Lost"
 dataw_ciriane_rebellion.1004.desc: "We fought with determination and valor, but in the end, it was not enough. The war is lost, and with it, any hope for our freedom. With gritted teeth, I bow my head and sign the parchment outlining the empire’s demands. So ends my short-lived [ROOT.Char.Custom('GetQueenKing')|l]ship.\n\n#N Doubtless there will be consequences - [orlais.GetName] will not allow this rebellion to go unpunished. I can only hope that the penalties fall upon my shoulders alone, rather than upon my people.#!"
 dataw_ciriane_rebellion.1004.a: "Was it worth it in the end?"
 DATAW_cirianes_lost: "#N Our battle is over...#!"

# Unique Desc for Roux

 dataw_ciriane_rebellion.1004.desc.r: "We fought with determination and valor, but in the end, it was not enough. The war is lost, and with it, any hope for our freedom. With gritted teeth, I bow my head and sign the parchment outlining the empire’s demands. So ends my short-lived [ROOT.Char.Custom('GetQueenKing')|l]ship. Doubtless there will be consequences - [orlais.GetName] will not allow this rebellion to go unpunished, especially as the blood of her brother [cyril.GetFirstName] stains my blade."

 #### K Nahashin wins the rebellion war 
 dataw_ciriane_rebellion.1005.t: "Victory of the Marshes"
 dataw_ciriane_rebellion.1005.desc: "It is done. Every drop of Nahashin blood spilt was worth it, for it helped secure our independence. The forces of [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier] fought hard, but we fought harder. I look with pride upon the faces of my soldiers – courageous sons and daughters of the marshes, every one.\n\nTogether, we accomplished the unthinkable and beat back the mighty dragon. A cheer goes out among the assembled troops as I read aloud the declaration from [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier]: [orlais.GetName]’ unconditional surrender.\n\n#N I have secured a future full of freedom and promise for my house and for my subjects.#!"
 dataw_ciriane_rebellion.1005.a: "Was it worth it in the end?"
 DATAW_cirianes_win: "The battle is over... #N We have won!#!"

#### Roux POV Duel
 dataw_ciriane_rebellion.1006.t: "A Dragon Emerges"
 dataw_ciriane_rebellion.1006.desc: "For every battle with the [GetGlobalVariable('orlesian_culture_var').Culture.GetName]s, I choose to fight alongside my people every step of the way. To compare a battlefield to anything else is ridiculous, for nothing compares to the rush of adrenaline one feels as they find themselves surrounded by such chaos. Neither does one feel such fear when witnessing how quickly a life can be taken. A man is brave when he fights through such fear, to rise above it and see his goals realized. This rebellion has filled me with plenty of fear, but it has also made me into a better man. Hopefully one worthy of ruling his people.\n\nA surge of adrenaline courses through me as these thoughts are interrupted by the swinging of a blade. Through instinct alone I catch the blade with the curved head of my axe, to then push my arms forward to pin the blade against the Orlesian knight’s breastplate. An older knight’s eyes meet my own for just a moment before my axe is raised overhead. With a swift swing, the axe cuts through the throat of the knight before he slumps to the ground, only to then get trampled by a cavalry charge.\n\nBy the time I was able to recollect myself, I was able to notice that one of the knights was dismounting his horse. His armor looked to be in a far better condition than the other knights I have seen throughout this rebellion. A unique sword was unsheathed by this knight, which signified he was someone of importance. It then dawned on me that this was a member of the bloodline in which I’ve sworn to defeat. [cyril.GetFirstName] [cyril.GetDynastyHouseName], one of the last remaining members of his house, has chosen to engage me personally in a duel? He is just a boy, dammit. Augh, there is no talking him out of this, not in the midst of all this fighting."
 dataw_ciriane_rebellion.1006.a: "#italic #color_red Must I kill this boy? So be it.#!"

#### Roux POV Duel
 dataw_ciriane_rebellion.1007.t: "The Slain Dragon"
 dataw_ciriane_rebellion.1007.desc: "[cyril.GetFirstName] [cyril.GetDynastyHouseName]'s steel meets my own with heavy swings, causing us both to stumble backward for just a moment. Quickly, the youthful knight rushes me with the intent to pierce my abdomen with the tip of his sword.\n\nWith my right hand gripping the handle of my axe, I manage to deflect the incoming blow just enough to prevent a fatal wound. Despite my best attempt to avoid a wound, his blade still manages to find my left shoulder as it slices through my flesh.\n\nA cry of pain escapes me before I follow up the young dragon’s strike with one of my own. Another cry is heard, but not my own as the head of the axe is buried into [cyril.GetFirstName]'s chest.\n\n#N Crimson begins to pour from the wound and I notice a change in his demeanor.#!\n\nThat is a look of fear, as I have come to know it well since the start of this rebellion.\n[cyril.GetFirstName] brings a hand up to push the axe free from his chest, the break in his breastplate easily seen now as he prepares for another strike.\n\nBefore the young knight can attempt another strike upon me, I pursue my advantage. When both of his arms raise above his head, I tackle him to the ground. His sword is sent flying after we both hit the ground, lost in the sea of fighting soldiers.\n\nA few blows from the young dragon find purchase, but only one draws blood as he busts my lip with a gauntleted fist. Adrenaline is a deadly weapon, as the strike did not impede my efforts. Despite his swinging fists in the struggle, I manage to shove each arm out of the way just enough to bring my axe down in an overhead swing.\n\n#G Not a word was uttered from [cyril.GetFirstName] [cyril.GetDynastyHouseName] in his final moments.#!\n\nIt was too quick, too much of a struggle was ongoing for him to even have a reaction. All I saw was the look of fear in this boy's eyes seconds before my axe cleaved into his face.\n\n#N Right between the eyes the blow had struck, covering me in even more gore.#!\n\nHorns are quickly being blown, and I can hear the Orlesian officers commanding their men to retreat. My men begin to run them down, to which I manage to stand. I watch them strike down some of the retreating foes, before my gaze falls to the corpse of [cyril.GetFirstName] [cyril.GetDynastyHouseName]."
 dataw_ciriane_rebellion.1007.a: "#N I did not wish to kill this boy.#!"

#### Next Step
 dataw_ciriane_rebellion.1008.t: "Next Steps"
 dataw_ciriane_rebellion.1008.desc: "I stand upon the balcony of my keep, looking over my demesne. These marshes are wild, foreboding... and at long last, #italic free.#!\n\nI am the #color_goldy_yellow [GetPlayer.GetTitleAsNameNoTooltip] in the Marshes#!, and no longer will my people bend the knee to [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier]. Yet there is much to consider now, and quickly.\n\nOur position is a precarious one - for a new realm, any missteps could be fatal. The [orlais.GetTitleAsNameNoTooltip] may have given us our freedom today, but what of tomorrow? And what of the elves in the south, who march upon the Orlesian capital as we speak?\n\n#N There are decisions to be made, ones that will forever shape our relationship with the empire going forward.#!"
 dataw_ciriane_rebellion.1008.a: "Strike now and weaken the empire while they are vulnerable @skill_martial_icon!"
 dataw_ciriane_rebellion.1008.a_tt: "#N You will lay claim to Orlesian lands and launch a war to conquer all of the [GetTitleByKey('k_blasted_hills').GetBaseNameNoTier]. This will be a conquest war, you won't be vassalized by Orlais if defeated.#!"
 dataw_ciriane_rebellion.1008.b: "Offer an alliance against the Dalish invasion @alliance_icon!"
 dataw_ciriane_rebellion.1008.b_tt: "#N If Orlais accepts the alliance, you will automatically join the war on Orlais' side against the Dales. Aligning yourself, a new independent nation with the Empire of Orlais by your side is a wise move.#!"
 dataw_ciriane_rebellion.1008.c:  "Stay out of it - we have affairs of our own to tend to"
 dataw_ciriane_rebellion.1008.c_tt: "#N You retire to your bedchamber alas, as the [GetPlayer.GetTitleAsNameNoTooltip] in the Marshes. You have secured a new freedom for your people, and now you will enjoy it.#!"
 dataw_ciriane_rebellion.1008.d_tt: "The Ciriane Rebellion has ended, but not the story of the Ciriane. You have unlocked new decisions & events to Reform the Ciriane Kingdom."

#### War with the Dales!
 dataw_ciriane_rebellion.1009.t: "War with the Dales!"
 dataw_ciriane_rebellion.1009.desc: "Tensions between the empire and the barbarous elves of the south have finally reached a breaking point.\n\nThe elves swarm across our borders like an unrelenting tide, their black hearts filled with hatred for all that is good and pure. It is time to show that my oath to the [orlais.GetTitleAsNameNoTooltip] was not in vain.\n\n#N Today, we stand together as Orlesians against the Dalish horde.#!"
 dataw_ciriane_rebellion.1009.a: "For Orlais! For humanity!"

#### D_Serault Holder deciding if they want to support Roux or not (Player)
 dataw_ciriane_rebellion.2000.t: "The Rebel [nahashin.GetTitleAsNameNoTooltip]"
 dataw_ciriane_rebellion.2000.desc: "I sit in the high chamber of the [GetBuilding('serault_castle_01').GetName], sipping my wine. I survey my domain with pride: The glassworks of Serault are legendary throughout Orlais and beyond. The sudden arrival of a messenger breaks my reverie. #italic “Word from the Marshes, Your Grace.”#! I unfurl the message with a frown.\n\nIt seems [nahashin.GetName], to our east, is plotting an independence revolt against [orlais.GetName]... and [nahashin.GetSheHe] seeks my support. The message is laden with honeyed words, but there are a myriad of subtle threats woven in. “Support the [orlais.GetTitleAsNameNoTooltip] at your peril”, the letter seems to be saying. I purse my lips as I consider the matter."
 dataw_ciriane_rebellion.2000.a: "How dare [nahashin.GetSheHe] threaten me? That is no way to win my friendship."
 dataw_ciriane_rebellion.2000.b: "But the marshes could well cause us serious trouble if I refuse... @alliance_icon!"
 dataw_ciriane_rebellion.2000.c: "I had something else in mind"
# Bribery Variant
 dataw_ciriane_rebellion.2000.b.desc: "I sit in the high chamber of the [GetBuilding('serault_castle_01').GetName], sipping my wine. I survey my domain with pride: The glassworks of Serault are legendary throughout Orlais and beyond. The sudden arrival of a messenger breaks my reverie. #italic “Word from the Marshes, Your Grace.”#! I unfurl the message with a frown.\n\nIt seems [nahashin.GetName], to our east, is plotting an independence revolt against [orlais.GetName]... and [nahashin.GetSheHe] seeks my support. Accompanying the note is a #italic “small token”#! of the [nahashin.GetTitleAsNameNoTooltip]'s #italic “highest regard”#! for me - a chest brimming with glittering [GetGlobalVariable('orlesian_culture_var').Culture.GetName] royals. A transparent attempt at bribery, with the implied promise of more to come. Yet do I dare position myself against the mighty [GetTitleByKey('e_orlais').GetBaseName], which will surely seek to crush this rebel and all who ally with [nahashin.GetHerHim]? I purse my lips as I consider the matter."
 dataw_ciriane_rebellion.2000.a.b: "But these funds could be of use... @alliance_icon!"
 dataw_ciriane_rebellion.2000.b.b: "I cannot be bought so easily!"
 dataw_ciriane_rebellion.2000.c.b: "I had something else in mind"
# Land Gift Variant
 dataw_ciriane_rebellion.2000.c.desc: "I sit in the high chamber of the [GetBuilding('serault_castle_01').GetName], sipping my wine. I survey my domain with pride: The glassworks of Serault are legendary throughout Orlais and beyond. The sudden arrival of a messenger breaks my reverie. #italic “Word from the Marshes, Your Grace.”#! I unfurl the message with a frown.\n\nIt seems [nahashin.GetName], to our east, is plotting an independence revolt against [orlais.GetName]... and [nahashin.GetSheHe] seeks my support. Accompanying the letter is another writ, signing land and title in the Nahashin Lands over to my name. The [nahashin.GetTitleAsNameNoTooltip] of Nahashin would trade away his own lands to earn my support, but can we truly hope to stand against the empire? Even together?\n\n(Offer: [spare_county.GetName])"
 dataw_ciriane_rebellion.2000.a.c: "On the other hand, it would be nice to move that border... @alliance_icon!"
 dataw_ciriane_rebellion.2000.b.c: "Serault has land enough without Nahashin’s help!"
 dataw_ciriane_rebellion.2000.c.c: "I had something else in mind"

 DATAW_ciriane_support_roux_tt: "You will #P support#! [nahashin.GetName] in their bid for independence."
 DATAW_ciriane_support_roux_disrespected_tt: "You have been disrespected, the gifts are an empty box worth nothing...#N Do you still want to ally?#!"
 DATAW_ciriane_dont_support_roux_tt: "You will #N not support#! [nahashin.GetName] in their bid for independence."
