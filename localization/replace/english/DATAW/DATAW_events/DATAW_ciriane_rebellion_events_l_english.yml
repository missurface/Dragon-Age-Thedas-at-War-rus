 DATAW_ciriane_insulted_tt: "#N [nahashin.GetName] insults you by offering you 0[gold_i]"

#### D_Alyons Holder deciding if they want to support Roux or not (Player)
 dataw_ciriane_rebellion.2500.t: "The Rebel [nahashin.GetTitleAsNameNoTooltip]"
 dataw_ciriane_rebellion.2500.desc: "I uncork a bottle of Alyons black in celebration. The harvest has been generous this year, and the castle larders are well-stocked with field mushrooms, wild fennel, and cloves - A sure sign the land is recovering well from the ravages of the Second [blight|E]. The Lands Between the Rivers are as fertile as they have ever been, and the marquisate as a whole is thriving. Yet my good mood is interrupted by a messenger from the [GetGeographicalRegion('custom_mareschois_population').GetName].\n\nI read through the letter with a scowl, my eyes flitting over the looping handwriting. [nahashin.GetName] plans an independence revolt against our [orlais.GetTitleAsNameNoTooltip], and solicits my support. On the surface, the request is amiable enough, but there is an undercurrent of implied violence if I should refuse. Bold, very bold. If I bend to his threats, of course, I will likely incur the wrath of a far greater power: The [orlais.GetTitleAsNameNoTooltip] of Orlais"
 dataw_ciriane_rebellion.2500.a: "But then, should I really jeopardize our newfound prosperity? @alliance_icon!"
 dataw_ciriane_rebellion.2500.b: "Does [nahashin.GetSheHe] take me for a spineless craven? The affairs of Alyons are [nahashin.GetHerHis] own."
 dataw_ciriane_rebellion.2500.c: "I had something else in mind"

# Bribery Variant
 dataw_ciriane_rebellion.2500.b.desc: "I uncork a bottle of Alyons black in celebration. The harvest has been generous this year, and the castle larders are well-stocked with field mushrooms, wild fennel, and cloves - A sure sign the land is recovering well from the ravages of the Second [blight|E]. The Lands Between the Rivers are as fertile as they have ever been, and the marquisate as a whole is thriving. Yet my good mood is interrupted by a messenger from the [GetGeographicalRegion('custom_mareschois_population').GetName].\n\nI read through the letter with a scowl, my eyes flitting over the looping handwriting. [nahashin.GetName] plans an independence revolt against our [orlais.GetTitleAsNameNoTooltip], and solicits my support. Yet it seems the [nahashin.GetTitleAsNameNoTooltip] does not trust in words alone to convey his point - for alongside the letter [nahashin.GetSheHe] has sent a #italic “token of his regard”#!. My eyes widen as the precious gemstones spill out onto the table. A crude attempt at bribery, and one that could easily incur the wrath of the [orlais.GetTitleAsNameNoTooltip]s should I be imprudent enough to be swayed by it."
 dataw_ciriane_rebellion.2500.a.b: "On the other hand, some extra coin couldn’t hurt... @alliance_icon!"
 dataw_ciriane_rebellion.2500.b.b: "Alyons has wealth enough without tying myself to the pursestrings of another."
 dataw_ciriane_rebellion.2500.c.b: "The [orlais.GetTitleAsNameNoTooltip] will hear of this treason! @alliance_icon!"

# Land Gift Variant
 dataw_ciriane_rebellion.2500.c.desc: "I sit in the high chamber of the [GetBuilding('serault_castle_01').GetName], sipping my wine. I survey my domain with pride: The glassworks of Serault are legendary throughout Orlais and beyond. The sudden arrival of a messenger breaks my reverie. #italic “Word from the Marshes, Your Grace.”#! I unfurl the message with a frown.\n\nIt seems [nahashin.GetName], to our east, is plotting an independence revolt against [orlais.GetName]... and [nahashin.GetSheHe] seeks my support. Accompanying the letter is another writ, signing land and title in the Nahashin Lands over to my name. The [nahashin.GetTitleAsNameNoTooltip] of Nahashin would trade away his own lands to earn my support, but can we truly hope to stand against the empire? Even together?\n\n(Offer: [spare_county.GetName])"
 dataw_ciriane_rebellion.2500.a.c: "On the other hand, it would be nice to move that border... @alliance_icon!"
 dataw_ciriane_rebellion.2500.b.c: "Alyons has land enough without Nahashin’s help!"
 dataw_ciriane_rebellion.2500.c.c: "I had something else in mind"

#### E Orlais Holder Declaration of Independene
 dataw_ciriane_rebellion.3000.t: "The Declaration of Independence"
 dataw_ciriane_rebellion.3000.desc: "The inhabitants of the [GetGeographicalRegion('custom_mareschois_population').GetName] have always had a stubbornly independent streak, thumbing their noses at the capital while continuing to reap the benefits of empire.\nEven during the reign of [kordillus_i.GetName], Val Royeaux’s control over the marshes was tentative at best. Yet it seems even this state of affairs was not enough for the selfish louts.\n\nIn a time when the very heart of our empire is under assault by The Dales, when every Orlesian is needed to drive back the elven menace and protect our way of life, it seems the marshfolk have decided instead to take advantage of the chaos and declare their independence from the rest of Orlais! They count on my reluctance to divide my forces at a time like this to put down their rebellion. The gall!"
 dataw_ciriane_rebellion.3000.a: "And they’re right. #N Conclude this war first#! – The marshfolk’s time will come."
 DATAW_ciriane_wait_till_after_dalish_war_tt: "You will decide what to do again once the Dalish War ends, #N win or lose.#! This will give you a truce with the Marshes till the Dalish war ends. "
 DATAW_ciriane_rebellion.3000.a.tt: "Orlais holds off till Dalish War ends"
 dataw_ciriane_rebellion.3000.b: "But that’s what they expect. Begin preparations to #N attack #!and reassert control! @skill_martial_icon!"
 DATAW_ciriane_rebellion.3000.b.tt: "Orlais attacks you immediately"
 DATAW_ciriane_orlais_fight_now_tt: "Can you really fight both at the same time? This will #N immediately #!begin a war to reconquer all of the Marshes."
 dataw_ciriane_rebellion.3000.c: "Eh... Just #N let [nahashin.GetHerHim] remain independent#!... who cares... @warning_icon!"
 DATAW_ciriane_rebellion.3000.c.tt: "Orlais lets you remain independent"
 DATAW_ciriane_let_them_remain_independent_tt: "The Ciriane Rebellion will end with a #N 10 year truce between you both#!. The Marshes will be freed from Orlesian rule."

#### E Orlais Holder Loses the Rebellion
 dataw_ciriane_rebellion.3001.t: "The War is Lost"
## todo add marshal scope/chheck
 dataw_ciriane_rebellion.3001.desc: "“Our forces have been utterly routed, Your Imperial Majesty,” one subject says with a bow.\n\nTo play the Great Game demands mastery over one’s emotions, but in this moment, I cannot help but bury my face in my hands.\n\nThe [GetGeographicalRegion('custom_mareschois_population').GetName] have broken free of my benevolent oversight – and so, the borders of the empire continue to recede.\n\n#N I replay the events of the war over and over again in my mind, wondering if there was some way this could have been avoided...#!"
 dataw_ciriane_rebellion.3001.a: "I have failed."

#### E Orlais Holder Wins the Rebellion
 dataw_ciriane_rebellion.3002.t: "Orlais Triumphant"
 dataw_ciriane_rebellion.3002.desc: "Song and celebration ring through the streets of the capital as the victorious soldiers make their triumphant return.\n\nI stand among the crowd, looking with [orlais.GetMotherFather]ly pride upon my troops. The marshfolk fought well, but we fought better.\n\n#N In the days to come, there will be consequences for my errant vassal’s treason, but for now we may take comfort in the fact that the empire has remained intact despite everything.#!"
 dataw_ciriane_rebellion.3002.a: "Long may it remain so."
 # Variant Desc for Kordillus
 dataw_ciriane_rebellion.3002.desc.k: "Song and celebration ring through the streets of the capital as the victorious soldiers make their triumphant return.\n\nI stand among the crowd, looking with [orlais.GetMotherFather]ly pride upon my troops. The marshfolk fought well, but we fought better. Yet the victory is a bittersweet one; my grandson [cyril.GetFirstName] lies dead, slain by the traitor's own hand.\n\n#N In the days to come, there will be consequences for this, but for now.#!"
# Variant Desc for Jeaneve
 dataw_ciriane_rebellion.3002.desc.j: "Song and celebration ring through the streets of the capital as the victorious soldiers make their triumphant return.\n\nI stand among the crowd, looking with [orlais.GetMotherFather]ly pride upon my troops. The marshfolk fought well, but we fought better. Yet the victory is a bittersweet one; my brother [cyril.GetFirstName] lies dead, slain by the traitor's own hand.\n\n#N In the days to come, there will be consequences for this, but for now.##!"
# Variant Desc if Cyril kills Roux for Kordillus
 dataw_ciriane_rebellion.3002.desc.c.k: "Song and celebration ring through the streets of the capital as the victorious soldiers make their triumphant return.\n\nRiding at the head of the column is my grandson [cyril.GetFirstName], the vaunted hero who slew the traitor in single combat. I stand among the crowd, looking with [orlais.GetMotherFather]ly pride upon my troops. The marshfolk fought well, but we fought better.\n\n#N In the days to come, there will be consequences for their treason, but for now we may take comfort in the fact that the empire has remained intact despite everything.#!"
# Variant Desc if Cyril kills Roux for Jeaneve
 dataw_ciriane_rebellion.3002.desc.c.j: "Song and celebration ring through the streets of the capital as the victorious soldiers make their triumphant return.\n\nRiding at the head of the column is my brother [cyril.GetFirstName], the vaunted hero who slew the traitor in single combat. I stand among the crowd, looking with [orlais.GetMotherFather]ly pride upon my troops. The marshfolk fought well, but we fought better.\n\n#N In the days to come, there will be consequences for their treason, but for now we may take comfort in the fact that the empire has remained intact despite everything.#!"
#### Cyril POV Duel
 dataw_ciriane_rebellion.3003.t: "The Marsh-King"
 dataw_ciriane_rebellion.3003.desc: "Seated upon my trustworthy steed of a lovely chestnut coloration, I watch with bated breath as my men collide in battle with the [GetGlobalVariable('ciriane_culture_var').Culture.GetName] rebels. Word had reached me several days ago, informing me that [roux.GetFullNameNicknamedOrMe] himself would be in command against me. He has proven to be a worthy leader to his people, despite being a traitor to [GetGeographicalRegion('world_orlais').GetName]. Supposedly, he is quite skilled with that axe of his. Yes, #italic the Song of the Marshes#! would be quite the boon for any warrior.\n\nSuddenly, I hear shouting as my second-in-command asks for me to give the order to charge. For the time being, I ignore his inquiry as I intend to wait for this #I “King of the Marshes”#! to show himself before I enter the field. Draw them in, wait for them to dig their heels in, then go in for the kill. That is how a proper cavalry charge is executed. Atop this hill, I watch [roux.GetFirstName] enter the fray flanked by his best warriors before shortly becoming threatened by one of our knights. They’re fairly even in this match, but [roux.GetFirstName] seems to overpower his foe. This is all I need to confirm that now is the time to strike.\n\n#EMP “Ride with me! For Orlais!”#! I say, trying to quell the fear rising within me as our horses race toward the battlefield.\n\nBy the time we’ve reached the rest of the army engaged with [roux.GetFirstName] forces, I no longer hear my own heart beating out of my chest, but instead can only hear the thousands of weapons slamming into one another. Cries of pain and obscenities make it even more difficult to remain brave. After the cavalry charge reached its end, I dismount and unsheathe my sword. Suddenly, it’s as if everything else seemed to fade. All the noise, the cries and sounds of battle, gone as I solely focus on [roux.GetFirstName] before me. This would-be “king” threatens every aspect of my life with this war, the lives of my family and other loved ones. He must be, will be, defeated here and now. "
 dataw_ciriane_rebellion.3003.a: "#italic #color_red For Orlais!#!"

#### Cyril Duel against Roux wins
 dataw_ciriane_rebellion.3004.t: "A Dragon’s Victory"
 dataw_ciriane_rebellion.3004.desc: "With a heavy thud, I watch as #italic “King”#! [roux.GetFirstName] [roux.GetDynastyHouseName] drops to the ground. My blade is covered from tip to hilt in his blood, which trickles down until it reaches the earth beneath my boots. I try to catch my breath, to focus on the rest of the battle as I am knocked to the ground by another knight, but this one had been fighting for the marshes, not Orlais.\n\nA large axe is raised over the man’s head, ready to cleave me in two. Within the blink of an eye, I kick toward the man’s knee, causing him to hit the ground hard as his leg flies out from under him. After hitting the ground, my foe’s axe falls into the bloody battlefield, leaving him disarmed temporarily. Scrambling over to him, I reach for my dagger, sheathed along my hip, unsheathing and thrusting it into his neck.\n\nWith minimal resistance, the man gurgles and bleeds out as I hold him firmly against the earth. Panting even more so than before, my heart once again pounds in my ears, threatening to burst from my chest. It is not enough to distract me from what is changing within this battle, however.\n\nHorns are blown and shouting is heard in various volumes due to how far or close they might be to us. It would seem the forces of the rebels are in retreat. We are victorious. [roux.GetFirstName] [roux.GetDynastyHouseName] is dead, ensuring that this war will come to an end soon. My men smile at me and cheer, knowing that we can all expect peace to return to our beloved [GetGeographicalRegion('world_orlais').GetName]. This blow to the rebellion should be the tipping point, leaving them leaderless and broken as a result of their “king” being slain. It all began with [roux.GetFirstName], so it is fitting that it all should end with him too. Victory, peace, both at last ours."
 dataw_ciriane_rebellion.3004.a: "#italic #color_red Orlais will be all the stronger as this conflict reaches its end.#!"

# Betrayal!
 dataw_ciriane_rebellion.3005.t: "Betrayal!"
 dataw_ciriane_rebellion.3005.desc: "I had thought the gift of freedom and independence - exactly as my errant vassal in the marshes had demanded - would be enough to placate the young [nahashin.GetLadyLord].\n\nOnce I acceded to [nahashin.GetHerHis] demands, I supposed, [nahashin.GetSheHe] would return to the quaint business of the marshes, leaving me breathing room to focus upon the clash with the Dales.\n\n#color_goldy_yellow I was a fool.#!\n\nIn Orlais, men say one thing and mean another. It is in our blood, the games we all play. The so-called #italic [nahashin.GetTitleAsNameNoTooltip] in the Marshes#! has taken [nahashin.GetHerHis] newfound independence... and rallied to attack us.\n\n#N There is no honor among marshfolk nor among elves, it seems.#!" 
 dataw_ciriane_rebellion.3005.a: "So it is to be war after all..." 

# Roux Losing Options
# Ancudor’s Offer
 dataw_ciriane_rebellion.3006.t: "Ancudor’s Offer"
 dataw_ciriane_rebellion.3006.desc: "A skilled warrior named [ancudor.GetFirstName] presents himself in a secret meeting between him and I.\n\n#italic "I will try not to take up too much of your time, your majesty,” Ancudor begins. “I am Ancudor Marchette, half-brother to Roux Marchette. We share the same father, though few know it. By right, when you defeat the Rebel Duke, I should be the newest Duke of Nahashin."#!\n\nThe man's reputation makes him seem like he would make for a loyal vassal, but his skills are untested. There is no way to tell if he will make a capable ruler, or just a useful puppet." 
 dataw_ciriane_rebellion.3006.a: "You presume too much, Ancudor, your half-brother has nullified your birthright." 
 dataw_ciriane_rebellion.3006.a_tt: "#N [ancudor.GetFirstName] will not be granted the Duchy of Nahashin once the war ends.#!" 
 dataw_ciriane_rebellion.3006.b: "Would you be willing to pay for such privileges?" 
 dataw_ciriane_rebellion.3006.b_tt: "#N [ancudor.GetFirstName] will hope to be given the Duchy of Nahashin if you win the war, though the final decision is yours.#!" 
 dataw_ciriane_rebellion.3006.c: "I would be happy to oblige, but in the meantime, you must come work for me" 
 dataw_ciriane_rebellion.3006.d: "You’re right, I’m sure you will serve capably" 

# Roux Losing Options
# Promise to Ancudor
 dataw_ciriane_rebellion.3007.t: "Promise to Ancudor"
 dataw_ciriane_rebellion.3007.desc: "[ancudor.GetFirstName] rides into my keep as if he were a general leading a triumph. The proud warrior kneels before my throne, eager to take on his new responsibilities.\n\nEverything is ready for his ascension, and yet I feel myself hesitate. Is Ancudor truly ready to lead the Mareschois to peace & prosperity?\n\n#N Or is there someone better for the job?#!" 
 dataw_ciriane_rebellion.3007.a: "Arise, Duke Ancudor"  
 dataw_ciriane_rebellion.3007.b: "Begone, Knave! You could never be a Duke!" 

# Roux Losing Options
# Promise to Ancudor (Ancudor Dead Version)
 dataw_ciriane_rebellion.3008.t: "Promise to Ancudor"
 dataw_ciriane_rebellion.3008.desc: "As the ashes settle on our victory over the Rebel Duke, I send for my new Duke of Nahashin. To my horror, I find [ancudor.GetName]'s name amongst the roll of our slain soldiers.\n\n#N Without [ancudor.GetName], who should inherit the Duchy is now a matter of dispute, and it falls to me to find a solution.#!" 
 dataw_ciriane_rebellion.3008.a: "Who will rule the Marshes now?"  
 
# Roux Losing Options
# Victory Over the Duke
 dataw_ciriane_rebellion.3009.t: "Victory Over the [nahashin.GetTitleAsNameNicknamed]"
 dataw_ciriane_rebellion.3009.desc: "With the Marshes defeated, a large piece of the empire has become unruled and unmanaged. \n\nI have to find someone to take on the rebel duke’s responsibilities. A wise emperor must not mistake one enemy’s defeat for the defeat of all enemies. My new duke cannot become a new rebel, nor can [nahashin.GetSheHe] allow his vassals to seek vengeance.\n\n#N They must be a peacemaker, and one that my enemies will see as legitimate.#!" 
 dataw_ciriane_rebellion.3009.a: "The current ruler is fine."  
 dataw_ciriane_rebellion.3009.a_tt: "[nahashin_ruler.GetName] remains as the [nahashin_ruler.GetTitleAsNameNicknamed]"  
 dataw_ciriane_rebellion.3009.b: "It's too recent to name a duke just yet. For now, it is mine."  
 dataw_ciriane_rebellion.3009.c: "The Marshes need a ruler of Orlesian stock."  
 dataw_ciriane_rebellion.3009.c_tt: "[orlesian_ruler.GetName] will take over the Marshes"  
# Roux Losing Options
# The New Duke
 dataw_ciriane_rebellion.3010.t: "The New [nahashin.GetTitleAsNameNicknamed]"
 dataw_ciriane_rebellion.3010.n.desc: "[nahashin_ruler.GetFirstName] makes a speech accepting their new responsibilities\n\nThey spend little time denouncing the old Duke, instead focusing on their own qualifications. [nahashin_ruler.GetFirstName] provides the court with a history of their life, hoping to illustrate why and how they’ve come to deserve this noble role.\n\n#N It is hard for me to tell whether the crowd is convinced, but those whose opinions matter lie further west.#!" 
 dataw_ciriane_rebellion.3010.o.desc: "I accept my new responsibilities with grace & dignity, and make a brief speech.\n\nI speak about how the Empire is stronger now that there is central control over Nahashin. I promise to expand the influence of Val Royeaux and our chantry into the marshland, and promise it will become a second home to my descendants.\n\n#N Some in the crowd greet this speech with thunderous applause, others with quiet dread.#!"
 dataw_ciriane_rebellion.3010.o.s.desc: "[orlesian_ruler.GetFirstName] makes a speech accepting their new responsibilities.\n\nThey denounce the Rebel Duke’s naive rebellion, and promise to lead the marshes into an Orlesian future.\n\nThey promise that within a generation, the marshfolk will be the spitting image of Orlesian civilization.\n\n#N Some in the crowd greet this speech with thunderous applause, others with quiet dread.#!"
 dataw_ciriane_rebellion.3010.a.n: "Let us see if [nahashin_ruler.GetFirstName] can keep the marshes in check."  
 dataw_ciriane_rebellion.3010.a.o: "After all, why not? Why shouldn’t I keep it?"  
 dataw_ciriane_rebellion.3010.a.o.s: "I wish [orlesian_ruler.GetFirstName] luck."  

# Roux Losing Options
# The Fallen Duke
 dataw_ciriane_rebellion.3011.t: "The Fallen Duke"
 dataw_ciriane_rebellion.3011.desc: "With the Marsh secure, the dirty business of war is over. There is one last loose thread remaining, the rebel Duke himself. [nahashin.GetName] rots in my dungeon, but even that seems too kind for his base behavior.\n\n#N Deep in our cups, late at night, my courtiers & I devise creative ways to punish him.#!" 
 dataw_ciriane_rebellion.3011.a: "I will cut off his head and be rid of him"  
 dataw_ciriane_rebellion.3011.b: "I will burn him at the stake"  
 dataw_ciriane_rebellion.3011.c: "I will torture him to death"  
 dataw_ciriane_rebellion.3011.d: "I will let him loose in the wilderness."  
 dataw_ciriane_rebellion.3011.e: "I will pardon him, and make him my Fool."  

# The Chant of Light Grows Quieter
 dataw_ciriane_rebellion.3012.t: "The Chant of Light Grows Quieter"
 dataw_ciriane_rebellion.3012.desc: "Nahashin was always a region more nominally under [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier]’s control than in factuality, and that truth could especially be seen in the religious aspect. There, the old regional variants of andrastianism survived, and the organised [chantry|E] of our dear founder [kordillus_i.GetFirstName] has only minimally implanted itself. Still, they worshipped the [maker|E], and for this, we left their faith alone.\n\n#N Until now.#!\n\nNews tell me that the [nahashin.GetTitleAsNameNoTooltip] of Nahashin, [nahashin.GetFirstName], has converted back to the ancient pagan beliefs of our people, and is now worshipping those old gods in flagrant defiance to our rule. While the Chant tells us that the Maker will only return once his name is sung to all four corners of [thedas|E], our lax authority on faith has led to this, and taking action now will only fuel the anger of the people, perhaps even to the greatest rebellion the Empire has ever seen.\n\n#N Nevertheless, one thing is sure.#!" 
 dataw_ciriane_rebellion.3012.a: "The Chant is more and more quiet in the marshes."  

# Hiring Mercenaries
 dataw_ciriane_rebellion.3601.t: "Mercenary Recruitment"
 dataw_ciriane_rebellion.3601.desc: "My councillors has prepared a loyal and discrete envoy for my task. [envoy.GetSheHe|U] has passed my own inspection, and should be able to safely transport my money to the sellswords without being taken by bandits.\n\nThe only decision left is where to send [envoy.GetHerHim]..."
 dataw_ciriane_rebellion.3601.a: "Head east, to #italic Nevarra City#! #G (Easiest)#!"
 dataw_ciriane_rebellion.3601.w_tt: "#G (Success!)#!"
 dataw_ciriane_rebellion.3601.l_tt: "#N (Failure!)#!"
 dataw_ciriane_rebellion.3601.w_e_tt: "The Mercenaries agree to join you!"
 dataw_ciriane_rebellion.3601.l_e_tt: "The Mercenaries refuse to join you!"
 dataw_ciriane_rebellion.3601.b: "You'll be going nearby, to #italic the marshes of the Ciriane#! #G (Easy)#!"
 dataw_ciriane_rebellion.3601.c: "To the far east, to treat with #italic the Fereldans#! #N (Hard)#!"
 dataw_ciriane_rebellion.3601.d: "To the near east, to treat with #italic the Dalish#! #N (Hardest)#!"

 dataw_ciriane_rebellion.3601.w_i_tt: "You successfully hire the Mercenaries!"
 dataw_ciriane_rebellion.3601.l_i_tt: "The Mercenaries take your #N [gold_i]250#!!"
 dataw_ciriane_rebellion.3601.l_i_2_tt: "The Mercenaries take your #N [gold_i]350#!!"

# A Fine Addition
 dataw_ciriane_rebellion.3602.t: "A Fine Addition"
 dataw_ciriane_rebellion.3602.desc: "Word arrives ahead of my scout. My vassals report that small numbers of soldiers, less than a dozen in each keep, have arrived to reinforce their garrisons. The soldiers claim to be serving on my behalf, and my vassals are asking why they weren’t informed ahead of time.\n\nI don’t provide any reply until [envoy.GetName] makes their way to court to explain the ruse. Our mercenaries have already begun embedding themselves in the local forces to avoid suspicion.\n\nWhen the order for rebellion comes, they’ll make haste to join with my main force. I send word to my vassals approving the new troops, acting as if it were their idea in the first place. Their requests for verification get no further reply."
 dataw_ciriane_rebellion.3602.a: "When the time comes, #N we'll be ready...#!"
 dataw_ciriane_rebellion.3602.a.n_tt: "#N Nevarran Sellswords#! will be raised once the Rebellion begins"
 dataw_ciriane_rebellion.3602.a.c_tt: "#N Ciriane Steel#! will be raised once the Rebellion begins"
 dataw_ciriane_rebellion.3602.a.d_tt: "#N Dalish Precision#! will be raised once the Rebellion begins"
 dataw_ciriane_rebellion.3602.a.f_tt: "#N Fereldan's Might#! will be raised once the Rebellion begins"

# A Failed Recruitment
 dataw_ciriane_rebellion.3603.t: "Failed Recruitment"
 dataw_ciriane_rebellion.3603.desc: "[envoy.GetName] returns with their head held low. It seems the mercenaries have refused my terms, unwilling to go along with a non-standard mercenary contract.\n\nDespite this, the mercenaries were more than happy to take my money from my envoy. #italic “As the cost for their silence”#! my envoy explains."
 dataw_ciriane_rebellion.3603.a: "Go get my money back! #N Now!#!"
 dataw_ciriane_rebellion.3603.b: "Fine, onto the next plan."
 dataw_ciriane_rebellion.3603.a.w_tt: "You get what remains of your gold"
 dataw_ciriane_rebellion.3603.a.l_tt: "[orlais.GetFirstName] finds out about your treason"

# Wooing Mercenaries
 dataw_ciriane_rebellion.3604.t: "Wooing Mercenaries"
 dataw_ciriane_rebellion.3604.desc: "[envoy.GetName] has not done enough work to meet with these mercenaries. The terms of our contract are strange and expose our plans. If the wrong company were approached with the wrong offer, they could expose us to the [orlais.GetTitleAsNameNoTooltip] and have us crushed.\n\n#N #italic We must take every possible precaution to ensure this is successful.#!#!"
 dataw_ciriane_rebellion.3604.a: "Increase [envoy.GetName]'s' budget"
 dataw_ciriane_rebellion.3604.b: "[lustful.GetName] will seduce the mercenaries."
 dataw_ciriane_rebellion.3604.c: "[diplomacy.GetName] will treat with the foreigners"
 dataw_ciriane_rebellion.3604.d: "[martial.GetName] knows how to lead soldiers"
 dataw_ciriane_rebellion.3604.e: "[warrior.GetName] shares a warrior's perspective"
 dataw_ciriane_rebellion.3604.f: "I think we've done enough already."
 dataw_ciriane_rebellion.3604.a_tt: "You will give [envoy.GetName] an extra [gold_i]100 gold - increases chance of #G success#!"
 dataw_ciriane_rebellion.3604.b_tt: "You send a Lustful character - increases chance of #G success#!"
 dataw_ciriane_rebellion.3604.c_tt: "You send a High Diplomacy character - increases chance of #G success#!"
 dataw_ciriane_rebellion.3604.d_tt: "You send a High Martial character - increases chance of #G success#!"
 dataw_ciriane_rebellion.3604.e_tt: "You send a High Prowess warrior - increases chance of #G success#!"
 dataw_ciriane_rebellion.3604.f_tt: "You don't do anything to increase your chances of #G success#!"

# Envoy Failure
 dataw_ciriane_rebellion.3606.t: "Envoy Failure"
 dataw_ciriane_rebellion.3606.desc: "The mercenaries send their own envoy named [merc_envoy.GetName] to answer my request, bearing a magnificent chest.\n\nWhen [merc_envoy.GetSheHe] opens the chest, I find the decapitated heads of my envoys piled upon a stack of coins.\n\n #italic #N “We humbly refuse your request, my lord”#!#!\n\n[merc_envoy.GetName] says, before quickly absconding from my court."
 dataw_ciriane_rebellion.3606.a: "Have I really sunk so low?"
 dataw_ciriane_rebellion.3606.a_tt: "The Mercenaries return the [gold_i]250 you spent"
 dataw_ciriane_rebellion.3606.a_2_tt: "The Mercenaries return the [gold_i]350 you spent"
# Independence Events

# The rebellions Successor
 dataw_ciriane_rebellion.3700.t: "The Rebellion's Successor"
 dataw_ciriane_rebellion.3700.desc: "As I sift through the papers left by my predecessor, [nahashin_past_holder.GetName], I am shocked to find documents of the most incriminating nature.\n\nIt seems that prior to [nahashin_past_holder.GetHerHim] untimely vacating of the dukedom, [nahashin_past_holder.GetFirstName] was deeply embroiled in a plot to break away from the empire and form an independent kingdom out of the marshlands.\n\nThis was no mere passing fancy - detailed plans, webs of potential contacts...\n\n#N The material is all here to launch a revolt of an unprecedented scale.#!"
 dataw_ciriane_rebellion.3700.a: "Burn the papers at once. This is treason!"
 dataw_ciriane_rebellion.3700.a_tt: "You will continue the plans of your predecessor, #N and will rebel when the time comes#!"
 dataw_ciriane_rebellion.3700.b: "All the groundwork is here to make this plan my own..."
 dataw_ciriane_rebellion.3700.b_tt: "You will cancel all plans of the Rebellion, #N acknowledging defeat#!"

 dataw_ciriane_rebellion.3700.h.t: "The Rebellion's Heir"
 dataw_ciriane_rebellion.3700.h.c.desc: "With the passing of my father, the reins of the duchy fall to me, as [nahashin_past_holder.GetHerHis] rightful heir. While some mourn, a newly-minted [GetPlayer.GetTitleAsNameNoTooltip] has little time for such considerations. As is expected of me, I travel to the capital in silence in order to renew the compact between my family and the House of [orlais.GetDynastyHouseName].\n\nKneeling before the [orlais.GetTitleAsNameNoTooltip], I repeat the words that generations of [GetPlayer.GetDynastyHouseName] before me have uttered. I, the vassal. [orlais.GetSheHe|U], my liege and protector.\n\nBut... Is that really how it must be? My father wanted something more for us. Then [nahashin_past_holder.GetSheHe] left us, his ambitions unfulfilled. These thoughts haunt me as I make the trip back to the marshes.\n\n #N By the time I return to my castle, I have made my decision.#!"
 dataw_ciriane_rebellion.3700.h.s.desc: "With the passing of my sibling, the reins of the duchy fall to me, as [nahashin_past_holder.GetHerHis] rightful heir. While some mourn, a newly-minted [GetPlayer.GetTitleAsNameNoTooltip] has little time for such considerations. As is expected of me, I travel to the capital in silence in order to renew the compact between my family and the House of [orlais.GetDynastyHouseName].\n\nKneeling before the [orlais.GetTitleAsNameNoTooltip], I repeat the words that generations of [GetPlayer.GetDynastyHouseName] before me have uttered. I, the vassal. [orlais.GetSheHe|U], my liege and protector.\n\nBut... Is that really how it must be? My sibling wanted something more for us. Then [nahashin_past_holder.GetSheHe] left us, his ambitions unfulfilled. These thoughts haunt me as I make the trip back to the marshes.\n\n #N By the time I return to my castle, I have made my decision.#!"
 dataw_ciriane_rebellion.3700.h.a: "I will not let the dream die here. #N The marshes WILL be free!#!"
 dataw_ciriane_rebellion.3700.h.b: "Resign myself to my current station... Long live the [orlais.GetTitleAsNameNoTooltip]!"

# Roux breaking out of Orlesian Capital event
 dataw_ciriane_rebellion.3701.t: "Imprisonment!"
 dataw_ciriane_rebellion.3701.desc: "My heart sinks as I see the column of imperial soldiers approaching my castle, the rider at their head brandishing what can only be a warrant for my arrest. I curse myself inwardly for my lack of discretion - word of my planned rebellion has reached the ears of the [orlais.GetTitleAsNameNoTooltip]!\n\nBefore long I find myself hauled to the capital in chains, sequestered in the dungeons of the [orlais.GetCapitalLocation.GetTitle.GetNameNoTier], and left to await the [orlais.GetTitleAsNameNoTooltip]’s decision as to my fate.\n\n #italic #N The humiliation of it all!#!#!"
 dataw_ciriane_rebellion.3701.a: "I shall stage a daring escape, and they will rue the day! @skill_martial_icon! @warning_icon!"
 dataw_ciriane_rebellion.3701.a_tt: "You will engage the Orlesian troops, trying to free yourself singlehandedly. You will duel an Orlesian Knight to break yourself out. #N Survive or not, you will go ahead with the Independence plan afterwards!#!"
 dataw_ciriane_rebellion.3701.b: "That would likely just get me killed. This is the price for my carelessness."
 dataw_ciriane_rebellion.3701.b_tt: "You will submit to Orlesian rule, #N acknowledging your treachery and handing yourself in. The Ciriane Rebellion will end immediately.#!"

 # The Turns of Fate
 dataw_ciriane_rebellion.3703.t: "The Fall of Orlais"
 dataw_ciriane_rebellion.3703.g.t: "A Wise Choice"
 dataw_ciriane_rebellion.3703.desc: "A once mighty empire, now brought so low. With the fall of Orlais upon us, the balance of power has changed forever.\n\n#italic Who shall rise in the ashes of the previous empire?#!\n\nSurely the lands west of the [GetGeographicalRegion('f_region_frostback_mountains').GetName] will see nothing but conflict until someone else comes along to succeed where the previous ruler of Orlais failed.\n\n#italic Perhaps, that someone to rise amidst their fall should be one such as I?#!\n\nI now have much to consider with this newfound freedom, as challenges are sure to come as a result.\n\n#N We no longer must bow to another with a crown, but now I can only rely on myself and my vassals.#!"
 dataw_ciriane_rebellion.3703.g.desc: "As I stand before my councilors, considering my options before potentially leading a rebellion, I hear the door to the chamber open. One of my servants delivers a message to me, to which they claim I should read it right away. Quickly, I begin to read this message, only to find the greatest of surprises awaiting me.\n\n#italic "The [GetGeographicalRegion('custom_mareschois_population').GetName] have been granted independence by order of the [orlais.GetTitleAsNameNoTooltip]"#!. My words leave my lips before I’m able to truly process what this news means. Each of my councilors explode in jubilation as they congratulate me, but I can’t even fathom this development.\n\nOnce I recover from the mind boggling information given to me, I too cheer and laugh along with those next to me. Now we need not prepare for war, but to prepare to act as an independent people as intended.\n\n#N Finally, the people of Nahashin need only worry for themselves, united against anyone else that may wish us harm in the future.#!"
 dataw_ciriane_rebellion.3703.a: "What comes next?"
 dataw_ciriane_rebellion.3703.a.g: "Nahashin’s future is a bright one!"
 dataw_ciriane_rebellion.3703.a_tt: "With Orlais dissolving - #N all plans of the Ciriane Rebellion has ended, but not the story of the Ciriane.#! You have unlocked new decisions & events to Reform the Ciriane Kingdom!"
 dataw_ciriane_rebellion.3703.a.g_tt: "With Orlais granting you independence - #N all plans of the Ciriane Rebellion has ended, but not the story of the Ciriane.#! You have unlocked new decisions & events to Reform the Ciriane Kingdom!"
### Ally with the Ciriane Cult Event Chain
 # The Old Ways
 dataw_ciriane_rebellion.3800.t: "The Old Ways"
 dataw_ciriane_rebellion.3800.desc: "As I walk through the streets of my capital, I see my people participating in an almost alien affair. When I ask my guards what is going on, they explain it is a religious festival.\n\nA minority of our people still follow the [GetFaithByKey('ciriane_paganism').GetAdjective] ways from before [andraste.GetName] brought them the light of the maker.\n\nThe people dance in a large circle, hoping they can demand better weather from #G $ciriane_paganism_high_god_name$#!"
 dataw_ciriane_rebellion.3800.a: "Hmm, odd."
 dataw_ciriane_rebellion.3800.b: "Why not join in?"
 dataw_ciriane_rebellion.3800.c: "Guards, jail these heretics!"

