l_english:
 # Event 1
 DATAW_dalish_blood_ritual_events.1.t: "A Desperate Ritual"
 DATAW_dalish_blood_ritual_events.1.desc: "Time in the court has recently been unbearable, as the state of the war has been going so badly many nobles have begun facing the fact we may be living what our ancestors of Arlathan have experienced so long ago. We are currently losing, and people are beginning to think of desperate measures.\n\nAs I see one more noble complaining about the war's effect on their land's crops, I see a group of four elves advancing, with an air of confidence born from the ever present desperation that we all face.\n\n"Greetings, my liege!", exclaims the one that entered first, "I am [ritual_cillian.GetFirstName], and those are my compatriots [ritual_hedolen.GetFirstName], [ritual_bellara.GetFirstName] and [ritual_amylia.GetFirstName]. We are all renowned [Concept('mage','Mages')|E], and we have grown concerned with the state of the war. However, I know how to help."\n\nAs the court quiets to hear the proposition, Cillian continues with a regained confidence."I know of a ritual, one that needs the [sulevin_blade.GetName], that could help our glorious magic nobility in their work against the [shem|E] horde. You and a chosen few would be able to cast spells at a lesser cost, and obtain constant valuable insight into the arts of strategy and fighting."\n\nAs the crowd begins discussing and debating around me, I think about the one point that has been left unsaid up to now; the price of said ritual. For everyone knows that a ritual meant to cast spells at a lesser cost implies the use of sacrifice, and those "insights" could have a very dangerous origin. Is listening to demons and indulging in blood magic truly the only way to save the Dales? Is it worth becoming the very thing that destroyed our homeland in the name of saving another?\n\n"Now, we only ask for your support and participation, my glorious liege.""
 DATAW_dalish_blood_ritual_events.1.a: "You will get the support you need."
 DATAW_dalish_blood_ritual_events.1.a.desc: "The ritual's preparation will take time, about two weeks. Once the four human sacrifices are captured and the preparations over, the ritual will be ready to begin."
 DATAW_dalish_blood_ritual_events.1.a.toast: "You agree to perform the ritual"
 DATAW_dalish_blood_ritual_events.1.b: "I cannot spare the resources to help you in this endeavour."
 DATAW_dalish_blood_ritual_events.1.b.desc: "Although I cannot support this action or get involved, they will continue with their attempt regardless."
 DATAW_dalish_blood_ritual_events.1.c: "I will not indulge in blood magic! Imprison them at once!"
 DATAW_dalish_blood_ritual_events.1.c.desc: "By imprisoning them, we will make sure they cannot go through with their ritual. If they resist capture and die fighting, their inability to do the ritual will be assured. The war shall not be won with these kinds of acts."
 DATAW_dalish_blood_ritual_events.1.c.submits: "They decide to surrender to your mercy"
 DATAW_dalish_blood_ritual_events.1.c.fights: "They choose to resist arrest and pay the price"

 # Event 2
 DATAW_dalish_blood_ritual_events.2.t: "A Desperate Ritual: A Stolen Purpose"
 DATAW_dalish_blood_ritual_events.2.desc: "I can only look in horror as I am told the extent of the damage. It seems like [ritual_cillian.GetFirstName] and his conspirators couldn't leave without the [sulevin_blade.GetName]. Dozens of Emerald Knights are now dead, scorched, iced or worse by the work of [ritual_bellara.GetName] and her master.\n\n[sulevin_blade_owner.GetTitledFirstName], I was told, barely made it out alive, at the price of a frozen leg that unfortunately could not be saved. Apparently, a single sentence was heard by the poor escapee as [sulevin_blade_owner.GetSheHe] made [sulevin_blade_owner.GetHerHis] escape, ushered by Bellara with a sick grin as she answered to a pleading young soldier.\n\n"If the Chantry thinks us monsters, then who are we to argue?""
 DATAW_dalish_blood_ritual_events.2.a: "They will not get away with this. Find them!"
 DATAW_dalish_blood_ritual_events.2.a.desc: "With the theft of the Sulevin Blade and the massacre of Emerald Knights, the populace has rallied behind you in the search of the conspirators."
 DATAW_dalish_blood_ritual_events.2.a.modifiers: "Every directly owned holding"
 memory_of_the_martyrs: "Memory of the Martyrs"
 
 # Event 3
 DATAW_dalish_blood_ritual_events.3.t: "A Desperate Ritual: A Grand Failure"
 DATAW_dalish_blood_ritual_events.3.desc: "Ever since the theft of the Sulevin Blade, part of the kingdom has been in a frenzy to find back this historical artefact. This morning, a message came to inform me of the situation.\n\nThe mages have been tracked down to the faraway Arbor Wilds, although where exactly they went after this is impossible to know. The only thing we know is that spirits and demons seem to have increased in numbers, and none of the conspirators have been seen for days, as well as the sword. Now the people have grown weary of the region, deeming it cursed and refusing to move further to avoid the spirit's wrath."
 DATAW_dalish_blood_ritual_events.3.a: "Just as quickly as they came, they are gone."

 # Event 4
 DATAW_dalish_blood_ritual_events.4.t: "A Desperate Ritual: The Fade Hunters"
 DATAW_dalish_blood_ritual_events.4.desc: ""[ROOT.Char.GetFullName]! You are under arrest for complicity in a blood magic ritual!"\n\nThe phrase strikes me by surprise as I turn around, seeing one of the [fade_hunter|E]s, a division of the Emerald Knights specialized in the hunting of blood mages and demons, with his sword drawn before me. No doubt he is here because of my acceptance of [ritual_cillian.GetFirstName]'s offer in front of the court.\n\n"You may be the ruler of the Dales, and we may be in crisis, but that will not stop me from upholding the laws that rule our kingdom, and stop this foul act! You have one moment to explain yourself, otherwise you will be taken into custody, by force if necessary!""
 DATAW_dalish_blood_ritual_events.4.a: "Can't you see that we need all we can on our side?"
 DATAW_dalish_blood_ritual_events.4.a.success: "You successfully managed to convince the Fade Hunters, giving more breathing room for the ritual's organization"
 DATAW_dalish_blood_ritual_events.4.a.failure: "Despite your plea, the Fade Hunters will continue to pressure the conspirators, which will make the ritual harder"
 DATAW_dalish_blood_ritual_events.4.a.toast.success: "You convince the Fade Hunters"
 DATAW_dalish_blood_ritual_events.4.a.toast.failure: "You fail to convince the Fade Hunters"
 DATAW_dalish_blood_ritual_events.4.b: "Listen, just take this and look the other way, alright?"
 DATAW_dalish_blood_ritual_events.4.b.success: "With this gold, you have managed to buy the Fade Hunter's silence, at least long enough for the ritual to take place"
 DATAW_dalish_blood_ritual_events.4.b.bribed: "You successfully bribe the Fade Hunters"
 DATAW_dalish_blood_ritual_events.4.ritual_success_increased: "#!#bold The ritual will have more chance of succeeding."
 DATAW_dalish_blood_ritual_events.4.ritual_success_decreased: "#!#bold The ritual will have less chance of succeeding."
 DATAW_dalish_blood_ritual_events.4.b.failure: "Your gift of gold has only fueled the Fade Hunter's zeal and secured the populace's cooperation. With this blatant attempt at corruption, the ritual's preparation has only become more difficult"
 DATAW_dalish_blood_ritual_events.4.b.unmoved: "Your gold fails to move the Fade Hunters"
 popular_outrage: "Popular Outrage"
 DATAW_dalish_blood_ritual_events.4.c: "You are right. I should never have indulged in this."
 DATAW_dalish_blood_ritual_events.4.c.desc: "Recognizing your mistake, you surrender to the Fade Hunters, to the delight of the common populace."
 DATAW_dalish_blood_ritual_events.4.c.submission: "You surrender to the Fade Hunters"
 DATAW_dalish_blood_ritual_events.4.ritual_will_fail: "#!#bold @warning_icon! The ritual will be guaranteed to fail."
 repentant_ruler: "Repentant Ruler"
 DATAW_dalish_blood_ritual_events.4.d: "After you, all will tell I am someone not to be messed with."
 DATAW_dalish_blood_ritual_events.4.d.duel_warning: "#!#bold @warning_icon! You will enter a lethal duel with [fade_hunter_solas.GetFirstName]"
 DATAW_dalish_blood_ritual_events.4.d.duel_outcome: "#!#bold If you win the duel, the ritual will have a greater chance of succeeding. But if you fall, then the ritual will fail."

 # Event 5
 DATAW_dalish_blood_ritual_events.5.t: "A Desperate Ritual: A Fateful Invitation"
 DATAW_dalish_blood_ritual_events.5.desc: ""It is time for the ritual."\n\nThe sentence, spoken by [ritual_cillian.GetFirstNamePossessive] envoy [ritual_amylia.GetFirstName], is short and concise. Yet multiple emotions echo through those six words.\n\nZealousness, pride, desperation, and fear of what may come. Hatred and radicalism mixes with the fear of losing our second homeland, and the price that must be paid to preserve it. The letter goes into more details in how the ritual will go. Four captured human soldiers will be brought south, into a once sacred temple of the Arbor Wilds, where the Veil is thin.\n\nThe time has come, and at this point, I cannot refuse this invitation, for I am in too deep, and the Dales themselves are at stake."
 DATAW_dalish_blood_ritual_events.5.a: "Let us depart at once."
 DATAW_dalish_blood_ritual_events.5.a.desc: "You will begin a travel planning to [GetTitleByKey('b_elgarnans_bastion').GetBaseNameNoTier]."

 # Event 6
 DATAW_dalish_blood_ritual_events.6.t: "A Desperate Ritual: The Cradle of Sulevin"
 DATAW_dalish_blood_ritual_events.6.desc: "I have arrived at the edge of the Dalish realm, and went even further beyond. Now, we are in a land unclaimed by anyone save for ruins, and [ritual_cillian.GetFirstName] and his flock lead me further into the temple, the one he calls « the Cradle of Sulevin ».\n\nInside the temple, I see four common [GetCultureByKey('orlesian').GetCollectiveNoun] soldiers, who have been stripped naked safe for a loincloth and placed in a line, in the middle of the temple. On the right side can be seen [ritual_bellara.GetFirstName] and her sick grin, holding the [sulevin_blade.GetName], while [ritual_amylia.GetFirstName] is on the left side of the line with a sword and rope, ready to stop any escape.\n\nThe conspirators look at me with reverence, harbouring a respect for me as a symbol of our homeland, of everything they claim they fight for.\n\nA little further back, I can see [ritual_hedolen.GetFirstName], his hands crossed, looking at the sacrifices with an air of sadness. Perhaps a look of understanding, seeing them wear a loincloth similar to the elves that were sacrificed oh so often under the Imperium."
 DATAW_dalish_blood_ritual_events.6.a.compassionate: "Have we become what we despised so much?"
 DATAW_dalish_blood_ritual_events.6.a.compassionate.desc: "The ritual will begin, and blood shall be shed for the sake of the Dales, no matter how much we resemble the Magisters of old. The pressure of the Fade Hunters will have an impact on the success of the ritual."
 DATAW_dalish_blood_ritual_events.6.b.cruel: "Rot in your own pity if you want. Blood must flow."
 DATAW_dalish_blood_ritual_events.6.b.cruel.desc: "The ritual will begin, and blood should be shed for the sake of the Dales, no matter how much the faint of heart complain. The pressure of the Fade Hunters will have an impact on the success of the ritual."
 DATAW_dalish_blood_ritual_events.6.c.zealous: "Those heathens do not deserve pity."
 DATAW_dalish_blood_ritual_events.6.c.zealous.desc: "The ritual will begin, and blood will be shed for the sake of the Dales, no matter how much some weep for a heathen's life. The pressure of the Fade Hunters will have an impact on the success of the ritual."
 DATAW_dalish_blood_ritual_events.6.d.cynical: "Such is the price of power, [ritual_hedolen.GetFirstName]."
 DATAW_dalish_blood_ritual_events.6.d.cynical.desc: "The ritual will begin, and blood will be shed for the sake of our power, for another shall pay the price to preserve our own position. The pressure of the Fade Hunters will have an impact on the success of the ritual."
 DATAW_dalish_blood_ritual_events.6.e: "Let us begin."
 DATAW_dalish_blood_ritual_events.6.e.desc: "The ritual will begin, and blood will be shed for the sake of the Dales, in the hope of preserving the second homeland. The pressure of the Fade Hunters will have an impact on the success of the ritual."
 DATAW_dalish_blood_ritual_events.6.success: "The ritual succeeds, giving you untold power, but at what cost?"
 DATAW_dalish_blood_ritual_events.6.failure: "The ritual fails, and everything goes wrong..."

 # Event 7
 DATAW_dalish_blood_ritual_events.7.t: "A Desperate Ritual: Broken Sword, Broken Veil"
 DATAW_dalish_blood_ritual_events.7.desc: "Blood has been shed. The sacrifices cried in pain and died, same as an elf would have. Four humans bled on the floor to attract the spirits and help our war effort.\n\nThe spirits came, but the aid did not. [ritual_bellara.GetFirstName] and [ritual_amylia.GetFirstName] now fight angered spirits, and [ritual_hedolen.GetFirstName] has made his move. His eyes full of tears, he pushes [ritual_cillian.GetFirstName] into the fray, and yells.\n\n« I'd rather be dead than to allow this to continue! We may divide ourselves as humans or elves, but we are the same. We bleed, cry, love and die all the same! »\n\nWith his fiery speech, I understand what he desires to do: to seal us all inside with those angered demons for our callousness. With our desire of vengeance, of zeal, we attempted to twist the Sulevin Blade's purpose, and now, we shall pay for this, just as the blade itself paid for this by breaking under the demons' attacks."
 DATAW_dalish_blood_ritual_events.7.a: "We must escape at once! Everyone, let's move!"
 DATAW_dalish_blood_ritual_events.7.b: "Let us leave, Hedolen! The others aren't worth it!"
 DATAW_dalish_blood_ritual_events.7.c: "I must save my skin, others be damned!"
 DATAW_dalish_blood_ritual_events.7.d: "I will help you seal us all, Hedolen. This cannot be forgiven."
 DATAW_dalish_blood_ritual_events.7.d.desc: "#!#bold @warning_icon! This means certain death, but perhaps the most ethical thing to do."

 # Event 8
 DATAW_dalish_blood_ritual_events.8.t: "A Desperate Ritual: Crushed Ambition"
 DATAW_dalish_blood_ritual_events.8.desc.alone: "Thunderous roars echo from behind me as I run faster than I ever did in my life. Fight against demons rage behind me as I continue running towards the door.\n\nThe sounds of fighting continue behind me as I run, without stopping. I turn back briefly and see [ritual_cillian.GetFirstName], holding the broken remnants of the sword of purpose in a pool of his own blood, alongside the broken bodies of [ritual_bellara.GetFirstName] and [ritual_amylia.GetFirstName]. [ritual_hedolen.GetFirstName], with a cast of his own magic, seals the temple's door with a gust of wind and a loud crash.\n\nWe are trapped.\n\nThe loud noise and the cracks in the ceiling of the old temple jump in intensity, as the demons now approach me. As I desperately try to save myself, I can feel the demonic claws eating through my skin as rocks fall and crush me."
 DATAW_dalish_blood_ritual_events.8.desc.group: "Thunderous roars echo from behind me as I run faster than I ever did in my life. Fight against demons rage behind me as I continue running towards the door.\n\nThe sounds of the others following me continue behind me as I run, without stopping. I turn back briefly and see [ritual_hedolen.GetFirstName], who throws a gust of wind, sealing the temple's door with a loud crash.\n\nWe are trapped.\n\nThe loud noise and the cracks in the ceiling of the old temple jump in intensity, as the demons now approach me. As I desperately try to save myself, I can feel the demonic claws eating through my skin as rocks fall and crush me."
 DATAW_dalish_blood_ritual_events.8.desc.hedolen: "Thunderous roars echo from behind me as I run faster than I ever did in my life. Fight against demons rage behind me as I continue running towards the door.\n\nThe sounds of fighting continue behind me as I run, without stopping. I turn back briefly and see [ritual_hedolen.GetFirstName] running right behind me. [ritual_cillian.GetFirstName], a little further back, holds the broken remnants of the sword of purpose in a pool of his own blood, alongside the broken bodies of [ritual_bellara.GetFirstName] and [ritual_amylia.GetFirstName]. In a fit of rage, I see Cillian throwing a great rock in the ceiling right above us, and sealing the door with the fall of great rocks.\n\nWe are trapped.\n\nThe loud noise and the cracks in the ceiling of the old temple jump in intensity, as the demons now approach me. As I desperately try to save myself, I can feel the demonic claws eating through my skin as rocks fall and crush me."
 DATAW_dalish_blood_ritual_events.8.a: "Urgh!…"

 # Event 9
 DATAW_dalish_blood_ritual_events.9.t: "A Desperate Ritual: Escape without Purpose"
 DATAW_dalish_blood_ritual_events.9.desc: "The gate of the temple closes behind me as I run forward, and out of the Cradle. My escape was successful, if only because of the fact I am alive.\n\nFour pointless sacrifices, a botched ritual, and a broken artefact of immeasurable value. No matter how we look at it, this was a failure. No doubt people will ask questions about what happened to the Sulevin Blade, and if the sword that represents our purpose of defending our realm will come back to us.\n\nIt will not, and people will blame me for it."
 DATAW_dalish_blood_ritual_events.9.a: "The Dales will have to rely on themselves for their survival."

 # Event 10
 DATAW_dalish_blood_ritual_events.10.t: "A Desperate Ritual: A Last Friend in a Sealed Death"
 DATAW_dalish_blood_ritual_events.10.desc.mage: "Hedolen gives me a quick look as he prepares his magic, and I feel the wind pick up as I prepare myself to aid him.\n\nI raise my hand as well, and the wind picks up even further, stronger and the massive stone door begins closing in front of us, little by little, dooming us all to die inside the dreaded temple, sweat runs down on my face from the strain, just as I see Hedolen stumble from the effort as well.\n\nFinally, as I hear [ritual_cillian.GetFirstName] scream in a yell which mixes anger and pain, the door seals and closes with a large sound, and I am left panting alongside Hedolen, both on our knees from the effort. He looks at me with a saddened, yet grateful look, aware of the certain death that awaits us.\n\n« Thank you, [ROOT.Char.GetFirstName]. »" 
 DATAW_dalish_blood_ritual_events.10.desc.nonmage: "Hedolen gives me a quick look as he prepares his magic, and I feel the wind pick up as I prepare myself to aid him.\n\nI rush towards the door and begin pulling on the door, barely holding on as the wind pushes me back inside along with the door, sealing us forever.\n\nFinally, as I hear [ritual_cillian.GetFirstName] scream in a yell which mixes anger and pain, the door seals and closes with a large sound, and I am left panting alongside Hedolen, both on our knees from the effort. He looks at me with a saddened, yet grateful look, aware of the certain death that awaits us.\n\n« Thank you, [ROOT.Char.GetFirstName]. »"
 DATAW_dalish_blood_ritual_events.10.a: "Thank you, [ritual_hedolen.GetFirstName]."

 # Event 11
 DATAW_dalish_blood_ritual_events.11.t: "A Desperate Ritual: Changed Purpose"
 DATAW_dalish_blood_ritual_events.11.desc.mage: "The blood of the sacrifices sheds the ground below us. Spirits and demons approach us, and [ritual_cillian.GetFirstName] bargains without rest with the Fade's inhabitants. In the end, the blood of the humans has already begun drying when I feel a sudden sting in my head. I close my eyes and hold my head through this intense pain that, thankfully, only lasts an instant, before opening my eyes once more.\n\n#italic It is beautiful.\n#!\nI can see echoes of spirits traversing the temple, as well as ever-present green cracks and clouds that seem to occupy the entirety of the space, floating in the air, as unreal as the Fade itself. If I focus, I can see, everywhere I look, an ever moving mass of spirits, ruins and clouds, that seems to modify itself slightly to my wishes.\n\n#italic Is this the Veil?\n#!\nGradually over the next minute, my eyes lose that connection with what makes magic real, but I still feel the Fade within me and all around me, and how easy it would be to pull from it. Cillian approaches me and speaks.\n\n"What you are feeling right now, milord, is the result of my ritual. If Pride is to be trusted, we are now more closely linked to the Fade than ever, if only for a time. Pulling from it will be easier, and no doubt this will help us win the war."\n\nOf course, the most dire consequence stays unsaid. Once the effect wears off, my connection to the Fade will have permanently lessened, as happens with all who do blood magic, especially of this scale.\n\nCillian then pulls out the [sulevin_blade.GetName], with a smile on his face, and hands it to me. If not for the shape, the sword would feel unrecognizable, as it is warm to the touch.\n\n"The Fade has also granted us with a sword stronger than ever before. The Sulevin Blade has been made sharper, deadlier, and full of bloodlust and anger. I do not know if a Rage demon now inhabits the sword itself, or if that is even possible, but it feels that way. From now on, the Sulevin Blade shall be the [blade_of_vengeance.GetName].""
 DATAW_dalish_blood_ritual_events.11.desc.nonmage: "The blood of the sacrifices sheds the ground below us. Spirits and demons approach us, and [ritual_cillian.GetFirstName] bargains without rest with the Fade's inhabitants. In the end, the blood of the humans has already begun drying when I feel a sudden sting in my head. I close my eyes and hold my head through this intense pain that, thankfully, only lasts an instant, before opening my eyes once more.\n\n#italic It is beautiful.\n#!\nI can see echoes of spirits traversing the temple, as well as ever-present green cracks and clouds that seem to occupy the entirety of the space, floating in the air, as unreal as the Fade itself. If I focus, I can see, everywhere I look, an ever moving mass of spirits, ruins and clouds, that seems to modify itself slightly to my wishes.\n\n#italic Is this the Veil?\n#!\nGradually over the next minute, my eyes lose that connection with what makes magic real, but I still feel the Fade within me and all around me, and how easy it would be to pull from it. Cillian approaches me and speaks.\n\n"What you are feeling right now, milord, is the result of my ritual. If Pride is to be trusted, we are now more closely linked to the Fade than ever, if only for a time. Pulling from it will be easier, and no doubt this will help us win the war."\n\nCillian then pulls out the [sulevin_blade.GetName], with a smile on his face, and hands it to me. If not for the shape, the sword would feel unrecognizable, as it is warm to the touch.\n\n"The Fade has also granted us with a sword stronger than ever before. The Sulevin Blade has been made sharper, deadlier, and full of bloodlust and anger. I do not know if a Rage demon now inhabits the sword itself, or if that is even possible, but it feels that way. From now on, the Sulevin Blade shall be the [blade_of_vengeance.GetName].""
 DATAW_dalish_blood_ritual_events.11.a: "Let it be so, and let's hope it is enough for the Dales."
 DATAW_dalish_blood_ritual_events.11.a.t: "The ritual was completed"
 fade_blessed: "Fade-Blessed"
 fade_blessed_special_desc: "[ROOT.GetCharacter.GetFirstName] has delved with demons and spirits, and has gained a temporary, closer connection to the Fade, giving [ROOT.GetCharacter.GetHerHim] strength, strategic insight and magical power. How the Veil is beautiful! How elegant the spirits and demons wander! And of course, how the cracks and clouds wave and shine in their ethereal green light!"
 blood_magic_withdrawal: "Blood Magic Withdrawal"
 blood_magic_withdrawal_special_desc: "[ROOT.GetCharacter.GetFirstName], by participating in a blood magic ritual, has permanently lessened [ROOT.GetCharacter.GetHerHis] connection to the Fade, making the act of magic without blood more difficult."
 DATAW_dalish_blood_ritual_events.11.every_ritual_participant: "Every Ritual Participant"

 # Event 12
 DATAW_dalish_blood_ritual_events.12.t: "A Desperate Ritual : A Faraway Failure"
 DATAW_dalish_blood_ritual_events.12.desc.intro: "I have noticed strange things ever since taking my place as [ROOT.Char.GetTitleAsName]. Notes on my predecessor's desk about a strange ritual, letters of four mages talking about a "Cradle of Sulevin", and rumours of various servants that [dalish_blood_ritual_instigator.GetTitledFirstName] was dabbling in blood magic.\n\n"
 DATAW_dalish_blood_ritual_events.12.desc.killed: "Those rumours were confirmed true, as a brave Fade Hunter [fade_hunter_solas.GetFirstName] defied orders and made sure that the laws of the land were respected, even if the highest autority didn't.\n\n"
 DATAW_dalish_blood_ritual_events.12.desc.end: "Fade Hunters have already reported that the four mages seen a few days ago at the court were tracked to the faraway Arbor Wilds, before disappearing further south into uncharted lands. Where they and the Sulevin Blade are now is impossible to know. The only thing we know is that spirits and demons have increased in the region, pushing people to claim the land as cursed." 