l_english:
 dalish_border_events.001.t: "An Unexpected Return"
 dalish_border_events.001.dalish: "A harrowing tale has been on the lips of everyone in court as of late. One of the servants heard about a Dalish merchant family that was killed on their way home from selling their wares in [GetTitleByKey('c_halamshiral').GetBaseNameNoTier]. Villagers who knew the family found their remains, but saw no sign of one of the children. Villagers searched for weeks, but couldn't find a sign of the child until one day they came wandering back into town, wounded and barely alive. It didn't take long for the villagers to start blaming the attack on bandits from Orlais. \n\nThis story, and many like it, have gripped the imaginations of my courtiers, with each telling of the story becoming more exaggerated than the last. While it is possible that the merchant family was attacked by some wild animal, it is just as likely that bandits from Orlais attacked the family as a warning to the rest of the Dales. If the [shemlen|E] really are becoming so bold... what does that mean for the [elvhen|E]?"
 dalish_border_events.001.orlesian: "An unnerving tale has begun to seize the attention of my court. Rumors swirl of how a merchant family was killed by bandits on the road to [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier], but one of their children was missing from the bloody scene. Local villagers searched for the child for weeks, finding no trace of the child until one day they returned to the village, shaken but alive.\n\nRumor has begun to grip the imagination of my courtiers and the villagers, with the villagers claiming that the bandits who slaughtered the merchants'family were, in fact, [elves|E] from the Dales. As I hear one of my servants recount the story to me, they tell me how they think the [elves|E] were involved, the fervor in their voice rising as they become more animated. \n\nAs the rumors begin to take on new forms, each more exaggerated than the last, it falls to me on how to approach the situation. On the one hand, banditry is a plague that afflicts too many on the roads around Orlais. It could have been a random bandit attack. But the [elves|E] have long bristled at our influence, and it is also likely that they, or some rogue amonth them, could have struck the merchants to send a message. And if they can strike so deeply into Orlais... what does this mean for us?"
 dalish_border_events.001.desc: "Tales of violence along the roads of Orlais and the Dales have sent my court into a frenzy. One tale is of a Dalish family who was killed on the way to Halamshiral and another about an Orlesian merchant family killed on the way to [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier].\n\nBoth families had children who were captured by bandits, but the children managed to escape and find their way home.\n\nNow citizens from both nations are blaming bandits from accross the border for the violence along their roads. Unfortunately, these tales are becoming more common by the day."
 dalish_border_events.001.a: "I think we're being a little hasty here."
 dalish_border_events.001.b: "This can only mean more bloodshed."
 dalish_border_events.001.c: "There is no proof. The Orlesians are not to blame!"
 dalish_border_events.001.d: "There is no proof. The Elves are not to blame!"
 dalish_border_events.001.e: "The worst has yet to come."
 cultural_acceptance_lowered: "Increased cultural tensions"
 cultural_acceptance_raised: "Eased cultural tensions"
 dalish_border_events.002.t: "Tensions Rising"
 dalish_border_events.002.dalish: "As I am enjoying a brief rest in my secluded garden, one of my servants rushes to my side with urgent news and ruins what should have been a quiet afternoon. #italic My [ROOT.Char.GetLadyLord], [chancellor.GetName|U] brings word from the border with Orlais. [chancellor.GetSheHe|U] urgently requests an audience with you.#! Once inside, [chancellor.GetName] tells me that an Orlesian emissary boldly demanded an audience with a minor lord along the Orlesian border, accusing him of raiding Orlesian villages, going so far as to accuse him of kidnapping human children for blood magic rituals. \n\nWith a shaky voice, [chancellor.GetName] says, #italic there is growing concern that the Orlesian may retaliate soon, my [ROOT.Char.GetLadyLord].#! From the sweat on [chancellor.GetHerHisMy] brow, I can tell how nervous [chancellor.GetSheHe] is. After [chancellor.GetSheHe] leaves, their words keep repeating in my head. Would the Orlesians and their [chantry|E] really break their promise with the [elves|E]?"
 dalish_border_events.002.dalish.alt: "As I am enjoying a brief rest in my secluded garden, one of my servants rushes to my side with urgent news and ruins what should have been a quiet afternoon. #italic My [ROOT.Char.GetLadyLord], a well-known local scholar, [scholar.GetName|U], brings word from the border with Orlais. [scholar.GetSheHe|U] urgently requests an audience with you.#! Once inside, [scholar.GetName] tells me that an Orlesian emissary boldly demanded an audience with a minor lord along the Orlesian border, accusing him of raiding Orlesian villages, going so far as to accuse him of kidnapping human children for blood magic rituals. \n\nWith a shaky voice, [scholar.GetName] says, #italic There is growing concern that the Orlesian may retaliate soon, my [ROOT.Char.GetLadyLord].#! From the sweat on [scholar.GetHerHisMy] brow, I can tell how nervous [scholar.GetSheHe] is. After [scholar.GetSheHe] leaves, their words keep repeating in my head. Would the Orlesians and their [chantry|E] really break their promise with the [elves|E]?"
 dalish_border_events.002.orlesian: "As I am enjoying a brief respite from the chittering of my courtiers in my secluded courtyard, my peace is shattered as a liveried servant rushes to my side with a hurried bow. #italic My [ROOT.Char.GetLadyLord], your Chancellor brings word from the border and [chancellor.GetSheHe] urgently request a moment of your time.#! Once [chancellor.GetName|U] is brought to me, [chancellor.GetSheHe] recounts the tale of how an emissary from the Dales audaciously demanded an audience with a minor lord along the Dalish border, accusing the noble and the [chantry|EU] of encouraging violent raids on nearby Dalish villages, going so far as to accuse them of kidnapping [elvhen|E] children! \n\nIn a nervous tone, [chancellor.GetName|U] says, #italic There is a concern that the [elves|E] may retaliate, my [ROOT.Char.GetLadyLord].#! [chancellor.GetHerHisMy|U] words hang over me as [chancellor.GetSheHe] departs with a bow, bringing a somber mood to my otherwise quiet afternoon. If the elves are getting so bold as to behave belligerently in the face of an Orlesian noble, perhaps the fragile peace with the Dales my soon come to an end..."
 dalish_border_events.002.orlesian.alt: "As I am enjoying a brief respite from the chittering of my courtiers in my secluded courtyard, my peace is shattered as a liveried servant rushes to my side with a hurried bow. #italic My [ROOT.Char.GetLadyLord], a well-known local scholar brings word from the border and [scholar.GetHerHisMy] urgently request a moment of your time.#! Once [scholar.GetName|U] is brought to me, [scholar.GetSheHe] recount the tale of how an emissary from the Dales audaciously demanded an audience with a minor lord along the Dalish border, accusing the noble and the [chantry|EU] of encouraging violent raids on nearby Dalish villages, going so far as to accuse them of kidnapping elvhen children! \n\nIn a nervous tone, [scholar.GetName|U] says,#italic there is a concern that the [elves|E] may retaliate, my [ROOT.Char.GetLadyLord].#! [scholar.GetHerHisMy|U] words hang over me as [scholar.GetSheHe] departs with a bow, bringing a somber mood to my otherwise quiet afternoon. If the elves are getting so bold as to behave belligerently in the face of an Orlesian noble, perhaps the fragile peace with the Dales my soon come to an end..."
 dalish_border_events.002.fallback: "As I am enjoying a brief respite from the chittering of my courtiers in my secluded courtyard, my peace is shattered as a servant rushes to my side with urgent news. #italic My [ROOT.Char.GetLadyLord], your Chancellor brings word from the border and [chancellor.GetSheHe] urgently request a moment of your time.#! Once [chancellor.GetName|U] is brought to me, [chancellor.GetSheHe] recounts several tales of emissaries from both the Dales and Orlais have been harassing minor nobles on the opposing side of the dalish border, even going so far as to blame these minor nobles for the disappearance of chidlren throughout the region. \n\nIn a nervous tone, [chancellor.GetName|U] says, #italic There is a concern that the [elves|E] or Orlesians may retaliate, my [ROOT.Char.GetLadyLord].#! [chancellor.GetHerHisMy|U] words hang over me as [chancellor.GetSheHe] departs with a bow, bringing a somber mood to my otherwise quiet afternoon."
 dalish_border_events.002.fallback.alt: "As I am enjoying a brief respite from the chittering of my courtiers in my secluded courtyard, my peace is shattered as a servant rushes to my side with urgent news. #italic My [ROOT.Char.GetLadyLord], a well-known local scholar brings word from the border and [scholar.GetHerHisMy] urgently request a moment of your time.#! Once [scholar.GetName|U] is brought to me, [scholar.GetSheHe] recounts several tales of emissaries from both the Dales and Orlais have been harassing minor nobles on the opposing side of the dalish border, even going so far as to blame these minor nobles for the disappearance of chidlren throughout the region. \n\nIn a nervous tone, [scholar.GetName|U] says, #italic There is a concern that the [elves|E] or Orlesians may retaliate, my [ROOT.Char.GetLadyLord].#! [scholar.GetHerHisMy|U] words hang over me as [scholar.GetSheHe] departs with a bow, bringing a somber mood to my otherwise quiet afternoon."
 dalish_border_events.002.a: "The insolence!"
 dalish_border_events.002.b: "I hope cooler heads prevail."
 dalish_border_events.003.t: "Mob Justice"
 dalish_border_events.003.dalish: "Word has reached me that an incident near the Orlesian border has sparked the rage of the villagers.\n\nTwo well-respected Dalish elders were found dead in their home, and there were clear signs of a violent struggle with a third party. However, there were no leads on who the killer was.\n\nIt didn't take long for rumors to start of Orlesians killing the pair.\n\nIt would seem that villagers have taken matters into their own hands as reports arrive in my court of a mob that captured and executed some Orlesian merchants who wandered too close to the border."
 dalish_border_events.003.orlesian: "Word has reached me that disgruntled villagers near the Dalish border have taken matters into their own hands, as tensions between our people and the [elves|E] of the Dales continue to flare.\n\nTwo men were found dead, killed in cold blood, and the local Revered Mother publicly laid blame at the feet of an elf living nearby that had allegedly been involved in a quarrel with the two men.\n\nThe dead villagers were respected by their neighbors and had contributed to the [chantry|EU], which led to the formation of a mob that captured and summarily executed the elf."
 dalish_border_events.003.fallback: "Word has reached me that of incidents near the border between Orlais and the Dales. Villagers on either side of the border have found well-respected memebers of their community killed in their homes.\n\nIt didn't take long for villagers to begin blaming their neighbors across the border.\n\nUnfortunately, this has led to the deaths of several innocent humans and elves who just so happened to be in the wrong place at the wrong time."
 dalish_border_events.003.a: "Serves them right!"
 dalish_border_events.003.b: "There should have been a trial!"
 dalish_border_events.003.c: "So much senseless death…"
 dalish_border_events.004.t: "Probing Proselytizers"
 dalish_border_events.004.dalish: "My court chaplain, [chaplain.GetName|U], has approached me with a dire look on their face. #italicMy [ROOT.Char.GetLadyLord], I have just been informed of an incident at the Orlesian border that you should be aware of.#! [chaplain.GetSheHe] begins to regale me with a tale heard from various priests and villagers throughout the Dales. Andrastian missionaries from Orlais crossed the border to spread their faith. Somehow they managed to slip past the [emerald_knights|E] and found sympathetic Elves in a nearby village. At first they quietly converted a few villagers, but it didn't take long for their zealotry to take over. They began converting the townsfolk more aggressively, until it finally drew the attention of the [emerald_knights|E]. The Andrastians didn't resist when they were expelled. However, some of their converts went with them as they were unwilling to convert back to Evanuris. \n\n[chaplain.GetName|U] utters a quick prayer for those who abandoned our ways. #ItalicI worry that this will become more and more common... something will have to be done eventually if we are ever to restore the old ways.#! [chaplain.GetSheHe|U] may have a point, but that is a decision for another day."
 dalish_border_events.004.dalish.alt: "A local scholar, [scholar.GetName|U], has approached me with a dire look on [scholar.GetHerHisMy] face. #italicMy [ROOT.Char.GetLadyLord], pardon my intrusion, but I have just been informed of an incident at the Orlesian border that you should be aware of.#! [scholar.GetSheHe] begins to regale me with a tale heard from various priests and villagers throughout the Dales. Andrastian missionaries from Orlais crossed the border to spread their faith. Somehow they managed to slip past the [emerald_knights|E] and found sympathetic Elves in a nearby village. At first they quietly converted a few villagers, but it didn't take long for their zealotry to take over. They began converting the townsfolk more aggressively, until it finally drew the attention of the [emerald_knights|E]. The Andrastians didn't resist when they were expelled. However, some of their converts went with them as they were unwilling to convert back to Evanuris. \n\n[scholar.GetName|U] utters a quick prayer for those who abandoned our ways. #ItalicI worry that this will become more and more common... something will have to be done eventually if we are ever to restore the old ways.#! [scholar.GetSheHe|U] may have a point, but that is a decision for another day."
 dalish_border_events.004.orlesian: "My Revered Mother, [chaplain.GetName|U], has approached me with concern etched across her features. #Italic My [ROOT.Char.GetLadyLord], may the Light of the Maker shine on you. I bear frightful news from the Dales.#! [chaplain.GetName|U] proceeded to regale me of a tale she heard from a network of [chantry|EU] officials. A few dedicated clerics had managed to sneak past the [emerald_knights|E] to spread the Chant of Light to those elves willing to hear the word of Andraste. \n\nUnfortunately, one of the elves had managed to get word to the [emerald_knights|E], who proceeded to charge into the village. According to the [chantry|EU] mission, these zealous warriors charged down the recently converted who leapt to the defense of the clerics, buying them enough time to flee back into Orlais. \n\nThe Revered Mother utters a quick prayer thanking the Maker for the safety of the missionairies, notably overlooking the Andrastian elves who allegedly gave their lives in defense. #Italic If only there were more people like those clerics to spread the Chant of Light as [andraste|E] willed, but those warriors... I fear for our devoted brothers and sisters should they step foot into the Dales.#!"
 dalish_border_events.004.orlesian.alt: "A local scholar, [scholar.GetName|U], has approached me with concern etched across her features. #Italic My [ROOT.Char.GetLadyLord], may the Light of the Maker shine on you. I bear frightful news from the Dales.#! [scholar.GetName|U] proceeded to regale me of a tale she heard from a network of [chantry|EU] officials. A few dedicated clerics had managed to sneak past the [emerald_knights|E] to spread the Chant of Light to those elves willing to hear the word of Andraste. Unfortunately, one of the elves had managed to get word to the [emerald_knights|E], who proceeded to charge into the village. According to the [chantry|EU] mission, these zealous warriors charged down the recently converted who leapt to the defense of the clerics, buying them enough time to flee back into Orlais. \n\n[scholar.GetName|U] utters a quick prayer thanking the Maker for the safety of the missionairies, notably overlooking the Andrastian elves who allegedly gave their lives in defense. #Italic If only there were more people like those clerics to spread the Chant of Light as [andraste|E] willed, but those warriors... I fear for our devoted brothers and sisters should they step foot into the Dales.#!"
 dalish_border_events.004.fallback: "My court chaplain, [chaplain.GetName|U], has approached me with a dire look on [chaplain.GetHerHisMy] face. #italicMy [ROOT.Char.GetLadyLord], pardon my intrusion, but I have just been informed of an incident at the border between Orlais and the Dales that you should be aware of.#! [chaplain.GetSheHe] begins to regale me with a tale heard from various priests and villagers throughout the region. Andrastian missionaries from Orlais crossed the border to the Dales to spread their faith. Somehow they managed to slip past the [emerald_knights|E] and found sympathetic Elves in a nearby village. At first they quietly converted a few villagers, but it didn't take long for them to attract the attention of the [emerald_knights|E]. The Andrastians didn't resist when they were expelled. However, some of their converts went with them as they were unwilling to convert back to Evanuris. \n\n[chaplain.GetName|U] utters a quick sigh of relief. #ItalicI am glad that this didn't lead to further violence, but I worry that things will only get worse as time goes on.#! [chaplain.GetSheHe|U] may have a point, but that is a discussion best saved for another day."
 dalish_border_events.004.fallback.alt: "A local scholar, [scholar.GetName|U], has approached me with a dire look on [scholar.GetHerHisMy] face. #italicMy [ROOT.Char.GetLadyLord], pardon my intrusion, but I have just been informed of an incident at the border between Orlais and the Dales that you should be aware of.#! [scholar.GetSheHe] begins to regale me with a tale heard from various priests and villagers throughout the region. Andrastian missionaries from Orlais crossed the border to the Dales to spread their faith. Somehow they managed to slip past the [emerald_knights|E] and found sympathetic Elves in a nearby village. At first they quietly converted a few villagers, but it didn't take long for them to attract the attention of the [emerald_knights|E]. The Andrastians didn't resist when they were expelled. However, some of their converts went with them as they were unwilling to convert back to Evanuris. \n\n[scholar.GetName|U] utters a quick sigh of relief. #ItalicI am glad that this didn't lead to further violence, but I worry that things will only get worse as time goes on.#! [scholar.GetSheHe|U] may have a point, but that is a discussion best saved for another day."
 dalish_border_events.004.a: "It's always good news when the Chant of Light spreads!"
 dalish_border_events.004.b: "Such an accomplishment can only help the designs of Orlais."
 dalish_border_events.004.c: "Is there truly no room in this world for the Evanuris?"
 dalish_border_events.004.d: "Why would our people abandon their heritage for these fools?"
 dalish_border_events.004.e: "Surely there is room for one more god among the Evanuris?"
 dalish_border_events.004.f: "Something must be done to prevent this from happening again!"
 dalish_border_events.004.g: "A worrying development."
 dalish_border_events.005.t: "Poachers Delight"
 dalish_border_events.005.dalish: "A new rumor has been spreading among the peasants in [capital.GetName]. This rumor claims that a group of Dalish elves were arrested and executed by Orlesians.\n\nThe local Orlesian lord claimed that the elves were caught poaching in the woods near the lords castle.\n\nOf course, no evidence was provided for these claims, nor did the Orlesians bother to verify the identities of the detainees."
 dalish_border_events.005.orlesian: "While seated around the dinner table with some of my closest courtiers, I hear the nonstop buzzing of whispers among my courtiers of a supposed gang of elves that brazenly crossed over into Orlais to hunt game in [GetTitleByKey('d_lydes').GetName].\n\nThe local chevaliers managed to apprehend the poachers and hanged them near the Dalish border, as a warning to others."
 dalish_border_events.005.fallback: "Rumors are circulalting throughout my court of a group of elves that were arrested and hanged for poaching in Orlais.\n\nMany elves believe that they were simply in the wrong place at the wrong time, but the Orlesians believe that this was a just response to the crime that should serve to deter any future would-be poachers.\n\nAs with most stories like this, the truth remains buried with the dead."
 dalish_border_events.005.a: "A just response to those thieves."
 dalish_border_events.005.b: "A little #Italic too#! heavy on the noose, I fear."
 dalish_border_events.005.c: "Typical of Orlesian justice."
 dalish_border_events.005.d: "We should warn our hunters to mind the borders."
 dalish_border_events.005.e: "Will we ever find the truth behind these stories?"
 dalish_border_events.006.t: "In the Footsteps of Shartan"
 dalish_border_events.006.dalish: "Tidings have reached my court that a group of [elvhen|E] led by [elf_convert.GetName|U] have converted to Andrastianism. This news has been devastating for everyone at court, especially [scoped_divine.GetName|U]. After all the hard work that we and our ancestors have done to recover our lost history, none can fathom why someone would throw all of that away. \n\nNow everyone is wondering if this group of converts will be the first of many, and if there is anything that can be done to prevent these conversions."
 dalish_border_events.006.dalish.alt: "Tidings have reached my court that a group of [elvhen|E] led by [elf_convert.GetName|U] have converted to Andrastianism. This news has been devastating for everyone at court, especially [scoped_divine.GetName|U]. After all the hard work that we and our ancestors have done to recover our lost history, none can fathom why someone would throw all of that away. \n\nNow everyone is wondering if this group of converts will be the first of many, and if there is anything that can be done to prevent these conversions."
 dalish_border_events.006.orlesian: "Tidings of a miracle have reached the hungry ears of my court, with [scoped_divine.GetName|U] enthusiastically telling anyone who will listen about the tale of [elf_convert.GetName|U], who bravely approached missionaries of Her Word. Upon taking in the radiance of the [chant_of_light|E], [elf_convert.GetSheHe] braved the unknown and left behind their people, accepting the [chantry|EU] as their new home. \n\nNow everyone at court is wondering if this is the first of many new converts, or if the silverite fists of the [emerald_knights|E] will silence this wave of conversion before they begin."
 dalish_border_events.006.orlesian.alt: "Tidings of a miracle have reached the hungry ears of my court, with [scoped_divine.GetName|U] enthusiastically telling anyone who will listen about the tale of [elf_convert.GetName|U], who bravely approached missionaries of Her Word. Upon taking in the radiance of the [chant_of_light|E], [elf_convert.GetSheHe] braved the unknown and left behind their people, accepting the [chantry|EU] as their new home. \n\nNow everyone at court is wondering if this is the first of many new converts, or if the silverite fists of the [emerald_knights|E] will silence this wave of conversion before they begin."
 dalish_border_events.006.fallback: "Tidings have reached my court that a group of elves led by [elf_convert.GetName|U] have converted to Andrastianism. Labeled as pariahs in their homeland of The Dales, the group had no choice but to emigrate to Orlais. \n\nMany Andrastians have praised the group for their bravery. The chantry is rumored to be in talks of how to convert more elves. Whether or not this group will lead to more conversions remains to be seen."
 dalish_border_events.006.a: "Civilized elves?"
 dalish_border_events.006.b: "Perhaps we can learn from each other..."
 dalish_border_events.006.c: "People are entitled to worship whomever they wish."
 dalish_border_events.006.d: "This is a tragedy!"
 dalish_border_events.007.t: "Sacrilegious Bounty"
 dalish_border_events.007.dalish: "[marshal.GetName|U] has brought grave news to me that a [halla|E] belonging to a nearby village has been found dead. From the wounds on its body it was clear that is was killed by a sword. None in the village could think of a reason that any [elvhen|E] would have to kill the poor creature. So, they searched the woods until they found a camp of Orlesian hunters. The villagers claim that the Orlesians were feasting on halla meat, so they killed them before they could do anymore harm."
 dalish_border_events.007.dalish_hunter: "A local hunter by the name of [hunter.GetName] has brought grave news to me that a [halla|E] belonging to a nearby village has been found dead. From the wounds on its body it was clear that is was killed by a sword. None in the village could think of a reason that any [elvhen|E] would have to kill the poor creature. So, they searched the woods until they found a camp of Orlesian hunters. The villagers claim that the Orlesians were feasting on halla meat, so they killed them before they could do anymore harm."
 dalish_border_events.007.orlesian: "[marshal.GetName|U] has delivered dire news from the Dales. A group of Orlesian hunters has been hunting for deer near the Dalish forests, but it seems they made two fatal errors.\n\nThe poor fools managed to cross into Dalish territory and, upon coming across a white stag, shot it down. By the time they realized that the stag was, in fact, a domesticated [halla|E], it was too late.\n\nThe local elves captured them and executed them, sending their heads back to their village as a warning against all others who would hunt their revered animal."
 dalish_border_events.007.orlesian_hunter: "A local hunter by the name of [hunter.GetName|U] has delivered dire news from the Dales. A group of Orlesian hunters has been hunting for deer near the Dalish forests, but it seems they made two fatal errors. The poor fools managed to cross into Dalish territory and, upon coming across a white stag, shot it down. By the time they realized that the stag was, in fact, a domesticated [halla|E], it was too late. The local elves captured them and executed them, sending their heads back to their village as a warning against all others who would hunt their revered animal."
 dalish_border_events.007.fallback: "Grave news has arrived in my court when [marshal.GetName|U] rushes in. [marshal.GetSheHe|U] tells me that a group of Orlesian hunters crossed into the Dales and murdered a domesticated [halla|E] during their excursion. Unfortunately, we will never know if this was an accident or not as the group was killed by the villagers who took care of that halla."
 dalish_border_events.007.fallback.alt: "Grave news has arrived in my court when a local hunter by the name of [hunter.GetName|U] is rushed in by my guards. [hunter.GetSheHe|U] tells me that a group of Orlesian hunters crossed into the Dales and murdered a domesticated [halla|E] during their excursion. Unfortunately, we will never know if this was an accident or not as the group was killed by the villagers who took care of that halla."
 dalish_border_events.007.a: "All this over a #Italic deer#!"
 dalish_border_events.007.b: "I should ask [hunt_master.GetFirstName|U] to keep our hunters away from the Dales for now."
 dalish_border_events.007.c: "Perhaps we should learn more about [elves|E] to avoid misunderstandings like this."
 dalish_border_events.007.d: "The [shemlen|E] got what they deserved."
 dalish_border_events.007.e: "Such a tragic loss..."
 dalish_border_events.007.f: "Perhaps this was all a big misunderstanding."
 dalish_border_events.008.t: "Wrong Neck of the Woods"
 dalish_border_events.008.dalish: "[steward.GetName|U] has brought a recent matters from the Orlesian broder to my attention. According to [steward.GetSheHe], a group of loggers from Orlais crossed over into the Dales and set up a small logging camp. None are certain how long their logging efforts went undetected, but it appeasr they were operating in the area for at least a few months. Once they were discovered, the logging camp was destroyed and the [emerald_knights|E] increased their patrols in the area."
 dalish_border_events.008.dalish_alt: "[logger.GetName|U] has brought a recent matters from the Orlesian broder to my attention. According to [logger.GetSheHe], a group of loggers from Orlais crossed over into the Dales and set up a small logging camp. None are certain how long their logging efforts went undetected, but it appeasr they were operating in the area for at least a few months. Once they were discovered, the logging camp was destroyed and the [emerald_knights|E] increased their patrols in the area."
 dalish_border_events.008.orlesian: "[steward.GetName|U] has passed along word from the Dalish border that a group of Orlesian loggers accidentally crossed into the elvish lands. In their diligent pursuit of quality timber, they mistakenly cut down a few hectares of trees before the [emerald_knights|E] charged in and apprehended most of the group, destroying their logging camp in the process. It is rumored that the captured Orlesians were brutally drawn and quartered in those very woods, with the more supersitious among my court suggesting that it was done as a blood magic ritual to appease their heathen gods."
 dalish_border_events.008.orlesian_alt: "[logger.GetName|U] has passed along word from the Dalish border that a group of Orlesian loggers accidentally crossed into the elvish lands. In their diligent pursuit of quality timber, they mistakenly cut down a few hectares of trees before the [emerald_knights|E] charged in and apprehended most of the group, destroying their logging camp in the process. It is rumored that the captured Orlesians were brutally drawn and quartered in those very woods, with the more supersitious among my court suggesting that it was done as a blood magic ritual to appease their heathen gods."
 dalish_border_events.008.fallback: "Another tale from the Dalish border has reached my court. Apparently a group of loggers crossed into the Dales and set up a small logging camp. How long that camp was there is unknown as all traces of it were destroyed by the [emerald_knights|E]. With increased patrols in the area, it is unlikely that this situation will happen again."
 dalish_border_events.008.a: "They would have suffered execution on this side of the border for their crime."
 dalish_border_events.008.b: "#Italic Blood magic?#! We should confer with the Templars."
 dalish_border_events.008.c: "Hopefully increased patrols will prevent this from happening again."
 dalish_border_events.008.d: "The #Italic [shemlen|E]#! are growing too bold."
 dalish_border_events.008.e: "Will this violence ever end?"