l_english:
 ### Thedas filler events
 dataw_events_thedas.0010.tit: "A Chance Encounter"
 dataw_events_thedas.0010.desc: "As I down another flagon of ale I can hear someone from the corner of the tavern yelling at other patrons,\n\n“I am the [neighboring_realm_owner.Custom2('RelationToMe', SCOPE.sC('encountered_claimant'))] of [neighboring_realm_owner.GetTitledFirstName], I'm telling you!”\n\nThey wave [encountered_claimant.GetHerHim] off dismissively and return to their drinks.\nThe ramblings of a drunken sod is not uncommon and many often just keep their distance."
 dataw_events_thedas.0010.a: "“What did you say your name was?”"
 dataw_events_thedas.0010.b: "“Another round!”"
 dataw_events_thedas.0020.tit: "The Forgotten Battlefield"
 dataw_events_thedas.0020.desc: "Amidst the dust and debris of your realm's expansion, an ancient battlefield emerges from the earth, its secrets long buried beneath layers of time.\n\nThe ground is littered with the relics of a bygone era—rusted weapons, shattered shields, and tattered banners that whisper of a grand and bloody conflict.\n\nThe decision now lies with you: will you delve into the past, unearthing its treasures and stories to shape your present, or will you honor the sanctity of this site, preserving its solemnity as a tribute to those who fought and fell so long ago?\n\nThe choice will define not only how your realm interacts with its history but also how it charts its course for the future."
 dataw_events_thedas.0020.a: "Excavate the site to recover valuable artifacts and gain historical insights."
 dataw_events_thedas.0020.b: "Protect the battlefield as a historical monument, leaving it undisturbed."
 dataw_events_thedas.0020.a.desc: "Old maps and books were found on the battlefield."
 dataw_events_thedas.0020.b.desc: "You recall the instructions given on the battlefield."
 dataw_events_thedas.0030.tit: "The Kirkwall Merchant"
 dataw_events_thedas.0030.desc: "A distinguished merchant from the vibrant city of Kirkwall graces your [court|E] with an enticing proposal.\n\n[kirkwaller_merchant.GetSheHe|U] offers access to rare and exotic goods from [GetGeographicalRegion('world_thedas').GetName], promising a boost to your realm's economy and prestige.\n\nIn exchange, [kirkwaller_merchant.GetSheHe] seeks a strategic partnership or significant investment."
 dataw_events_thedas.0030.a: "Strike the deal."
 dataw_events_thedas.0030.b: "Decline the offer."
 dataw_events_thedas.0040.tit: "The Canticle of Shartan"
 dataw_events_thedas.0040.desc: "Despite the fascination it holds for [chantry|E] scholars, the Canticle of Shartan's place in the [chant_of_light|E] has occasionally come into question, due to its unknown authorship and uncertain historical veracity. The outbreak of hostilities with the [elves|E] has, for better or worse, pushed these questions to the forefront. Even as the war rages, a council is called, gathering together Andrastian clergy from across Thedas - even those of the Tevinter Clergy, who nominally lack official recognition. After months of fierce debate, the assembled grand clerics and priests reach a majority opinion - a slim majority, but a majority nonetheless. The Canticle of Shartan is to be stricken from the official Chant, henceforth to be counted among the Dissonant Verses. In actual practice, it may take many decades for this decree to impact all corners of Thedas. Nevertheless, the declaration is a strong - albeit controversial - one."
 dataw_events_thedas.0040.a: "The elves have turned from the Maker. This canticle offers us little now."
 dataw_events_thedas.0040.b: "The elves' part in things should not be relegated to the desks of scholars!"
 ### Orlesian filler events
 dataw_events_orlais.0010.tit: "The Turning Wheel of Fashion"
 dataw_events_orlais.0010.desc: "Oh dear.\n\nAs I enter my throne room, ready to discuss the admittedly quite urgent details of my land's administration, I am accosted by one of my courtiers, [fashionista.GetNameNoTooltip]. [fashionista.GetSheHe|U] immediately starts speaking to me with a glimmer of passion in [fashionista.GetHerHis] eyes, only found in those who follow the frenzied ever-turning wheel of fashion, always changing and fleeting.\n\n« [ROOT.Char.GetTitledFirstNameNoTooltip], if I may, I have come here to inform you of a most beautiful advancement for fashion! We call it « the Painted Veil ». Rather than wearing a solid mask, as is the norm here in Orlais, we simply paint our faces as if it were there! Imagine the dancers at a ball, all with masks imprinted onto their skin, slowly fading away thanks to droplets delicately placed on the face by their dancing partners, erasing them little by little until everyone is unmasked, bringing the dance to a close! Will you join us, my dear [ROOT.Char.GetTitleTierName]?\n\nWhat my dear courtier forgets is that this concept was very popular a few years before, and seems to have resurfaced yet again, as if the Painted Veil simply refused to die. Regardless of this fact, [fashionista.GetNameNoTooltip] awaits my answer, and it would be impolite to leave [fashionista.GetHerHim] without one.»"
 dataw_events_orlais.0010.a: "Of course! I will join you in the Painted Veil, my dear."
 dataw_events_orlais.0010.a.a: "#V #L Every#!#! [courtier|E] gains #P 10#! [opinion|E] of #V you#! for #V 5 years#! #weak (Participant of the Painted Veil)#!"
 dataw_events_orlais.0010.b: "I am sorry for this, but a ruler such as I has many things to worry about."
 dataw_events_orlais.0010.c: "I am sorry my dear, but your mask is as fleeting as this trend will be."
 dataw_events_orlais.0010.c.a: "#V #L Every#!#! [GetGlobalVariable('orlesian_culture_var').Culture.GetName] [ruler|E] loses #N 5#! [opinion|E] of #V you#! for #V 5 years#! #weak (Unconcerned with Fashion)#!"
 dataw_events_orlais.0020.tit: "A Capricious Sort"
 dataw_events_orlais.0020.desc: "As I enter the Garden inside the Keep, I notice a group of my more distinguished courtiers, along with some high-profile guests, discussing various things around the fountain, while exchanging caprices, little throwing coins of very little value thrown into the fountain at the end of an evening.\n\n“My dear”, said [caprice_giver.GetNameNoTooltip], “would you like to join us by throwing this caprice, made specially for this beautiful feast? Here's one, from my collection.”"
 dataw_events_orlais.0020.a: "Inspect the Caprice."
 dataw_events_orlais.0020.a.desc_1: "You notice the Caprice has been used."
 dataw_events_orlais.0020.a.desc_2: "You throw the Caprice."
 dataw_events_orlais.0020.a.tooltip_1: "#V #L Every#!#! Attending Character apart [caprice_giver.GetTitledFirstName] Gains #P 10#! [opinion|E] of #V you#! for #V 5 years#! #weak (Noticed the Caprice has been used)#!"
 dataw_events_orlais.0020.a.tooltip_2: "#V #L Every#!#! Attending Character Loses #N 20#! [opinion|E] of #V you#! for #V 5 years#! #weak (Threw an already Thrown Caprice)#!"
 dataw_events_orlais.0020.b: "Is it already used, [caprice_giver.GetFirstNameNoTooltip]?"
 dataw_events_orlais.0020.b.desc_1: "You notice [caprice_giver.GetFirstNameNoTooltip] is lying."
 dataw_events_orlais.0020.b.desc_2: "[ROOT.Char.GetFirstNameNoTooltip] comes up with a lie."
 dataw_events_orlais.0020.b.tooltip_1: "#V #L Every#!#! Attending Character:\n• Gains #P 20#! [opinion|E] of #V you#! for #V 5 years#! #weak (Uncovered the Thruth)#!\n• Loses #N 20#! [opinion|E] of #V [caprice_giver.GetTitledFirstName]#! for #V 5 years#! #weak (Uncovered the Thruth)#!"
 dataw_events_orlais.0020.b.tooltip_2: "#V #L Every#!#! Attending Character:\n• Loses #N 20#! [opinion|E] of #V you#! for #V 5 years#! #weak (Wrongly Accused Someone)#!\n• Gains #P 20#! [opinion|E] of #V [caprice_giver.GetTitledFirstName]#! for #V 5 years#! #weak (Wrongly Accused Someone)#!"
 dataw_events_orlais.0020.c: "Thank you, but I'll ask one of my servants to bring me one."
 dataw_events_orlais.0020.c.tooltip_1: "#V #L Every#!#! Attending Character apart [caprice_giver.GetTitledFirstName] Gains #P 10#! [opinion|E] of #V you#! for #V 5 years#! #weak (Refused the Offer)#!"
 dataw_events_orlais.0030.tit: "A Smuggling of Good Taste."
 dataw_events_orlais.0030.desc: "As we traveled on the road, we ended up arriving at a port town to rest. Scouring the market for supplies during the journey, [travel_entourage.GetNameNoTooltip] ends up interrupting me.\n\n« My liege, I have noticed a group of Rivaini sailors, led by a merchant called [rivaini_merchant.GetNameNoTooltip]. Up to nothing good, perhaps smuggling, I'm sure. May I suggest relaying their location to the local authorities? Surely, [local_holder.GetTitledFirstName] would be pleased, as well as in your debt. »\n\nOf course, I could follow what [travel_entourage.GetNameNoTooltip] said, but I am sure that, if I were to meet with them and negotiate, I could obtain objects not found anywhere else. The advantages of smuggling, I suppose. Even more tantalizing, a rivaini merchant would make a great advisor for economic matters, the only danger would come from a possible ignorance of how the Game works, but I suppose that can be thought."
 dataw_events_orlais.0030.a: "We should tip the local guard to their activities. After all, a favor for a favor."
 dataw_events_orlais.0030.b: "We should meet with them, see what they have."
 dataw_events_orlais.0030.c: "Such a merchant could be useful for economic matters in my court."
 dataw_events_orlais.0030.d: "Pay him to make this town's business suffer."
 dataw_events_orlais.0030.e: "We shouldn't get involved in this."
 dataw_events_orlais.0030.b.desc_1: "[rivaini_merchant.GetFirstNameNoTooltip] finds you suspicious and refuses to trade with you."
 dataw_events_orlais.0030.b.desc_2: "[rivaini_merchant.GetSheHe|U] accept to show you [rivaini_merchant.GetHerHis] goods."
 dataw_events_orlais.0030.b.desc_3: "The price of the deal will be divided by half."
 dataw_events_orlais.0030.c.desc_1: "[rivaini_merchant.GetFirstNameNoTooltip] won't leave her buisness and her crew for you."
 dataw_events_orlais.0030.c.desc_2: "[rivaini_merchant.GetSheHe|U] will join you in exchange for a bit of your purse."
 dataw_events_orlais.0030.c.desc_3: "Potential wealth that can be gained around you is too tempting."
 dataw_events_orlais.0030.d.desc_1: "You manage to get out of this smoothly."
 dataw_events_orlais.0030.d.desc_2: "[local_holder.GetTitledFirstName] learned about your arrangement."
 dataw_events_orlais.0040.tit: "A Song Withered by Hunger"
 dataw_events_orlais.0040.desc: "Our travel on the road, seemingly quiet, is suddenly interrupted by one of my servants who found a collapsed traveller on the road. Struggling, the interrupter introduced [lost_bard.GetHerselfHimself] as [lost_bard.GetNameNoTooltip], a bard of profession, who happened to get lost on [lost_bard.GetHerHis] last contract. [lost_bard.GetSheHe|U] asked only for a meal to regain [lost_bard.GetHerHis] strength.\n\nOf course, this could be a trick of some kind, and the fact [lost_bard.GetSheHe] got lost doesn't exactly give a good show of [lost_bard.GetHerHis] skills. Regardless, the decision is mine."
 dataw_events_orlais.0040.a: "I could secure [lost_bard.GetHerHis] services and loyalty by agreeing to [lost_bard.GetHerHis] demands."
 dataw_events_orlais.0040.b: "I will give [lost_bard.GetHerHim] a meal and let [lost_bard.GetHerHim] be on [lost_bard.GetHerHis] way."
 dataw_events_orlais.0040.c: "[lost_bard.GetSheHe|U] could be a spy for all we know. Dispose of [lost_bard.GetHerHim]."
 dataw_events_orlais.0040.d: "So, what was that contract you were on?"
 dataw_events_orlais.0040.e: "[lost_bard.GetSheHe|U] could be a spy for all we know. [lost_bard.GetSheHe] shall fend for [lost_bard.GetHerselfHimself]."
 dataw_events_orlais.0040.f: "For a price, the meal is yours."
 dataw_events_orlais.0050.tit: "A Ham with a Taste of Despair"
 dataw_events_orlais.0050.desc: "[antivan_merchant.GetNameNoTooltip], a merchant that seems to be fairly renowned across the land, approaches me and kneels before my throne, clearly in the mind for business.\n\n“My [ROOT.Char.GetTitleTierName], I have come before you to present to you various lavish meats and meals from all over the continent, ready to surprise all guests and residents of your magnificent court with their wonderful and unique tastes.”\n\n“A favourite of mine are the Antivan Olives, which are said to have retained the taste of the blood spilt by the Crows! Quite peculiar, if you ask me. Of course, there is also a variety of Ander ham, which is said to taste of despair. An acquired taste, but one that will definitely shake up the, I must admit, quite dull offering your court currently has, if you don't mind the criticism.”"
 dataw_events_orlais.0050.a: "I mean, who doesn't need more despair in their diet?"
 dataw_events_orlais.0050.b: "Steward, could you handle the bargaining?"
 dataw_events_orlais.0050.b.desc_1: "You pay an exorbitant price."
 dataw_events_orlais.0050.b.desc_2: "You manage to bargain a reasonable price."
 dataw_events_orlais.0050.b.desc_3: "You manage to strike a bargain."
 dataw_events_orlais.0050.c: "Why would I want ham that tastes of despair?"
 ### Mareschois filler events
 dataw_events_nahashin_marsh.0010.tit: "The Orlesian Courser"
 dataw_events_nahashin_marsh.0010.desc: "As my entourage and I pass through [ROOT.Char.GetCurrentLocation.GetName], my attention is drawn to a well-dressed [horse_breeder.GetWomanMan] holding the reins of a magnificent courser. Noticing my interest, [horse_breeder.GetSheHe] breaks into a wide smile. “Ah, my [ROOT.Char.GetLadyLord|U]! Would you be interested in purchasing a warhorse of the finest lineage? Bred in the western marshes, the culmination of centuries of equestrian expertise.” [horse_breeder.GetSheHe|U] is not lying about the horse's origins, at least - I can tell the animal is of Mareschois stock."
 dataw_events_nahashin_marsh.0010.a: "No price is too high for such a magnificent steed!"
 dataw_events_nahashin_marsh.0010.b: "Bah, I can find a much better horse at home."
 dataw_events_nahashin_marsh.0010.c: "Perhaps I should take up horse breeding like my ancestors…?"
 dataw_events_nahashin_marsh.0020.tit: "The Feud"
 dataw_events_nahashin_marsh.0020.desc: "My vassals [vassal_01.GetTitledFirstName] and [vassal_02.GetTitledFirstName] approach the throne, shooting icy glares at each other as they do so. The tension in the air is palpable. Noticing my frown, [vassal_01.GetFirstNameNoTooltip] bows and addresses me. “Forgive me, my [ROOT.Char.GetTitleTierName]. Since the time of the Ciriane war-chiefs, the House of [vassal_01.GetHouse.GetName] and the House of [vassal_02.GetHouse.GetName] have been ever at odds-”\n\n“Only due to your treacherous ways!” growls [vassal_02.GetFirstNameNoTooltip]. “My [ROOT.Char.GetTitleTierName], the conflict between our houses has raged since we were but clan leaders - Little thanks to these swine and their petty grudges!”\n\n[family_member_01.GetFirstName] scowls darkly. “And how much blood of ours have you spilled? It is only right that we exact justice!”\n\n“Justice, or vengeance?” barks [family_member_02.GetFirstName], reaching for the hilt of [family_member_02.GetHerHis] blade. “Who was it that cast the first stone?”\n\n“ENOUGH!” I roar, cowing both vassals into silence."
 dataw_events_nahashin_marsh.0020.a: "I decide in favor of [vassal_01.GetTitledFirstNameNoTooltip]. House [vassal_02.GetHouse.GetNameNoTooltip] will pay compensation."
 dataw_events_nahashin_marsh.0020.a.tooltip_1: "Every [house|E] [vassal_01.GetHouse.GetName|V] members gains #P 20#! [opinion|E] of #V you#! for #V 15 years#! #weak (Support my House in our Feud)#!"
 dataw_events_nahashin_marsh.0020.a.tooltip_2: "Every [house|E] [vassal_02.GetHouse.GetName|V] members loses #N 20#! [opinion|E] of #V you#! for #V 15 years#! #weak (Oppose my House in our Feud)#!"
 dataw_events_nahashin_marsh.0020.b: " If it is true [vassal_01.GetFirstNameNoTooltip]'s house started this feud, then House [vassal_02.GetHouse.GetNameNoTooltip] is the injured party."
 dataw_events_nahashin_marsh.0020.b.tooltip_1: "Every [house|E] [vassal_01.GetHouse.GetName|V] members loses #N 20#! [opinion|E] of #V you#! for #V 15 years#! #weak (Oppose my House in our Feud)#!"
 dataw_events_nahashin_marsh.0020.b.tooltip_2: "Every [house|E] [vassal_02.GetHouse.GetName|V] members gains #P 20#! [opinion|E] of #V you#! for #V 15 years#! #weak (Support my House in our Feud)#!"
 dataw_events_nahashin_marsh.0020.c: "End this petty squabbling, both of you, or so help me…!"
 dataw_events_nahashin_marsh.0020.c.tooltip_1: "Every [house|E] [vassal_01.GetHouse.GetName|V] members loses #N 20#! [opinion|E] of #V you#! for #V 15 years#! #weak (Oppose my House in our Feud)#!"
 dataw_events_nahashin_marsh.0020.c.tooltip_2: "Every [house|E] [vassal_02.GetHouse.GetName|V] members loses #N 20#! [opinion|E] of #V you#! for #V 15 years#! #weak (Oppose my House in our Feud)#!"
 dataw_events_nahashin_marsh.0030.tit: "The Joust"
 dataw_events_nahashin_marsh.0030.desc: "The Mareschois nobility have a well-deserved reputation for equestrian prowess. Despite the unsuitable terrain of our homeland - or perhaps because of it - we have retained many of the old skills forgotten by the pampered nobles of the cities. Thus when my [ROOT.Char.Custom2('RelationToMe', competing_courtier)] [competing_courtier.GetFirstNameNoTooltip] suggests a friendly joust to keep our skills sharp, I am only too happy to oblige.\n\nAs our horses thunder towards each other, I note a critical weakness in [competing_courtier.GetFirstNameNoTooltip]'s form, one I could easily exploit to unhorse [competing_courtier.GetHerHim] and win the joust… Yet I would risk severely injuring [competing_courtier.GetHerHim] in the process. Perhaps I should wait until the conclusion of the joust to point out the weakness instead, teaching [competing_courtier.GetFirstNameNoTooltip] how to improve upon [competing_courtier.GetHerHis] technique."
 dataw_events_nahashin_marsh.0030.a: "Go for the winning blow."
 dataw_events_nahashin_marsh.0030.b: "Wait until afterwards and offer instruction."
 dataw_events_nahashin_marsh.0040.tit: "The Game"
 dataw_events_nahashin_marsh.0040.desc: "Since the time of Jeshavis, we of Orlais have lived and died by the Great Game: the slow duels of influence between the noble houses. It is an ancient tradition, and an intrinsic part of the culture of all who share the blood of the Ciriane. The Mareschois are often underestimated in such matters; we are seen as quaint marsh-dwellers, too absorbed in our own troubles to participate in the wider life of the nation. That, of course, is a reputation we deliberately cultivate as part of the Game.\n\nRecently, the preening [grand_game_participant.GetTitledFirstNameNoTooltip] has been making a point of greeting me at balls, peppering [grand_game_participant.GetHerHis] small talk with occasional mentions of [grand_game_participant.GetHerHis] neighboring vassals. Careless and transparent - It does not take many of these interactions for me to deduce that [grand_game_participant.GetSheHe] hopes to turn me against one of these neighbors in particular, using me as a proxy to avoid dirtying [grand_game_participant.GetHerHis] own hands. Perhaps, with a healthy dose of intrigue of my own, I could turn the tables on [grand_game_participant.GetHerHim] and pit the two directly against each other… and receive some personal advantage in the process. An elegant move in the Game."
 dataw_events_nahashin_marsh.0040.a: "A suitable counterplay, I think."
 dataw_events_nahashin_marsh.0040.b: "No, too risky. Better to ignore [grand_game_participant.GetHerHis] scheming."
 dataw_events_nahashin_marsh.0050.tit: "An Argument"
 dataw_events_nahashin_marsh.0050.desc: "As my entourage and I stop at a roadside inn, I notice a pair of travelers who seem to be arguing animatedly. The inn is lively enough that their bickering would not ordinarily stand out to me, were it not for the fact that their accents are unmistakably Mareschois.\n\n“The marshfolk are as much Orlesian as anyone else!” the first [quarrelsome_traveler.GetWomanMan] says. “Are we not all of the lineage of the Ciriane? Simply because we've preserved a few of the old ways doesn't make us an entirely different culture!”\n\n“You know we have never fully bent the knee to Val Royeaux,” insists [quarrelsome_traveler.GetHerHis] companion. “Even in the time of Isorath, the marshes never truly bought into his grand unification. And later on, did we commit ourselves to Drakon's nation-building? The rest of Orlais has left us behind and become something different - We are the last keepers of the old culture!”\n\n“It simply means we are slow to adopt the newest trends,” rebuts the first [quarrelsome_traveler.GetWomanMan]. “There is nothing wrong with tradition - what is wrong is pretending that this makes us somehow foreign to the rest of our peers. What good can come of distancing ourselves from Orlesian identity?”\n\nI clear my throat loudly to interject."
 dataw_events_nahashin_marsh.0050.a: "The first man is right. The Mareschois are part of the rich tapestry of Orlesian culture."
 dataw_events_nahashin_marsh.0050.a.tooltip_1: "Every [mareschois_culture.GetName] [vassals|E] loses #N 10#! [opinions|E] of #V you#! #weak (+1.20/year) (Insulted)"
 dataw_events_nahashin_marsh.0050.a.tooltip_2: "Every [orlesian_culture.GetName] [vassals|E] gains #P 10#! [opinions|E] of #V you#! #weak (-1.20/year) (Pleased)"
 dataw_events_nahashin_marsh.0050.a_culture_acceptance_desc: "Embracing heritage"
 dataw_events_nahashin_marsh.0050.b: "I agree with the second man. The Mareschois are more Ciriane than Orlesian."
 dataw_events_nahashin_marsh.0050.b.tooltip_1: "Every [mareschois_culture.GetName] [vassals|E] gains #P 10#! [opinions|E] of #V you#! #weak (-1.20/year) (Pleased)"
 dataw_events_nahashin_marsh.0050.b.tooltip_2: "Every [orlesian_culture.GetName] [vassals|E] loses #N 10#! [opinions|E] of #V you#! #weak (+1.20/year) (Insulted)"
 dataw_events_nahashin_marsh.0050.b_culture_acceptance_desc: "Rejecting heritage"
 dataw_events_nahashin_marsh.0050.c: "Surely an agreement can be broached."
 dataw_events_nahashin_marsh.0050.c.tooltip: "Every [mareschois_culture.GetName] and [orlesian_culture.GetName] [vassals|E] gains #P 10#! [opinions|E] of #V you#! #weak (-1.20/year) (Pleased)"
 dataw_events_nahashin_marsh.0050.d: "This is all subjective. Orlesian, Ciriane - what's the difference?"
 dataw_events_nahashin_marsh.0050.d.tooltip: "Every [mareschois_culture.GetName] and [orlesian_culture.GetName] [vassals|E] loses #N 10#! [opinions|E] of #V you#! #weak (+1.20/year) (Insulted)"
 ### Nevenais Filler Events
 dataw_events_gamord.0010.tit: "Sulfates for Free"
 dataw_events_gamord.0010.desc: "A hobbyist alchemist comes to visit my court. They claim that they've been testing the waters of the nearby sulfur lakes, and found that the waters have magical properties. The alchemist claims [hobbyist_alchemist.GetSheHe]'s used the waters to fertilize crops, bleach paper, and make soap.\n[hobbyist_alchemist.GetSheHe|U] asks if my research would be of any value."
 dataw_events_gamord.0010.a: "Fertilizing crops does sound helpful."
 dataw_events_gamord.0010.b: "More paper means more books! What a deal!"
 dataw_events_gamord.0010.c: "It does smell funky around here…"
 dataw_events_gamord.0010.c.tooltip: "Every [courtier|E] gains [GetModifier( 'new_soap' ).GetNameWithTooltip] for #V 5 years#!"
 dataw_events_gamord.0010.d: "These all sound great! You should write a book!"
 dataw_events_gamord.0010.e: "This is a waste of time, get out of here!"
 dataw_events_gamord.0020.tit: "Here There be Monsters"
 dataw_events_gamord.0020.desc: "I find myself unable to sleep at sea one night, and go above deck to watch the dark waves. Only a small crew works at night, and one old sailor ignores his duties to indulge my nighttime stroll. He points to dark shapes beneath the waves and explains how he can identify creatures beneath the waves with only a brief glimpse at the body parts beneath the waves. I wonder if this skill could come in handy…"
 dataw_events_gamord.0020.a: "Say, are you looking for a job?"
 dataw_events_gamord.0020.b: "Can you teach me this skill?"
 dataw_events_gamord.0020.b.tooltip: "The cost of you next Whale Hunt will be reduced by @gold_icon!#V 20#! [gold|E]"
 dataw_events_gamord.0030.tit: "Porous Borders"
 dataw_events_gamord.0030.desc: "On my travels I cross paths with a trader, [travelling_merchant.GetHerselfHimself] moving between the border of my realm & my neighbor's. [travelling_merchant.GetHerHis|U] cart is a strange sight, divided in half to keep a gaggle of geese from being attacked by a cluster of cats. When I question [travelling_merchant.GetHerHim] about the cart's contents, [travelling_merchant.GetSheHe] nervously replies.\n\n“You see m'[ROOT.Char.GetLadyLord], in your realm a goose is valued at half the value that Vandalarien merchants will pay for them. Since cats are valued the same in both lands, I trade the cats for geese in your lands, before selling them for a tidy profit to the Vandalariens. It earns me a tidy profit, assuming everyone keeps their appetite for geese and the use of cats.”"
 dataw_events_gamord.0030.a: "This is an obvious scam. You'll have a word with my guards."
 dataw_events_gamord.0030.a_culture_acceptance_desc: "Deter trade between our cultures"
 dataw_events_gamord.0030.b: "A clever scheme, perhaps I should share it with other merchants."
 dataw_events_gamord.0030.b.tooltip_1: "Every [nevenais_culture.GetName] [county|E] gains [GetModifier( 'exporting_goods' ).GetNameWithTooltip] for #V 5 years#!"
 dataw_events_gamord.0030.b.tooltip_2: "Every [vandalarien_culture.GetName] [county|E] gains [GetModifier( 'importing_goods' ).GetNameWithTooltip] for #V 5 years#!"
 dataw_events_gamord.0030.b_culture_acceptance_desc: "Encourage trade between our cultures"
 dataw_events_gamord.0030.c: "So you're telling me you're selling cats?"
 dataw_events_gamord.0040.tit: "Four passions"
 dataw_events_gamord.0040.desc: "In a meeting with [court_chaplain.GetFirstNameNoTooltip] our conversation wanders from matters of state to matters of the spirit.\n\nMy [court_chaplain.GetCouncilTitle] looks at me coyly, before asking if I am comfortable divulging a weakness. I ask [court_chaplain.GetHerHis] to be more specific.\n\n“Tell me, my [ROOT.Char.GetLadyLord]... what is your greatest passion?”"
 dataw_events_gamord.0040.a: "Are you testing me? Get out!"
 dataw_events_gamord.0040.b: "Delight."
 dataw_events_gamord.0040.c: "Desire."
 dataw_events_gamord.0040.d: "Distress."
 dataw_events_gamord.0040.e: "Dread."
 dataw_events_gamord.0050.tit: "Vandalarien Conflict"
 dataw_events_gamord.0050.desc: "I catch two of my courtiers in a boisterous argument one night. One need only smell the air between them to tell that they are drunk. “I'm telling you” [nevenais_courtier.GetFirstName] seems to be repeating [nevenais_courtier.GetHerselfHimself] from before I entered “the Nevenais coast is an untapped gold mine! If Val Royeaux could build a small fleet of whaling ships, we could more than double their investment in ambergris!”\n\n[vandalarien_courtier.GetFirstName] interrupts the rant, stating “Orlais will never care for its Western children. It is the same up north. We are only worth as much as last month's taxes.”\n\nShould I interject?"
 dataw_events_gamord.0050.a: "Let them alone."
 dataw_events_gamord.0050.b: "Nonsense! We're much stronger than the Vandalarien!"
 dataw_events_gamord.0050.c: "Perhaps it is better to be ignored. We can grow stronger in the shadows."
 dataw_events_gamord.0050.d: "Despite our differences, we are all children of the Ciriane, and Val Royeaux owes us much."

 dataw_events_gamord.0060.tit: "Seeking across the Ash"
 dataw_events_gamord.0060.desc: "Historically, we have often been forgotten here in Gamord by Orlais. Seen as a backwater duchy, only profitable thanks to its whale hunts and resource-rich mountains, we have often been ignored by many, and few have ventured in here without a clear and important intent.\n\nThe fact I have a Seeker of Truth in front of me today is only proof of that importance.\n\n“My [ROOT.Char.GetTitleTierName], I came in front of you today for help with an important task.\nA former Seeker by the name of [exile_seeker.GetFirstNameNoTooltip], previously exiled in the Sea of Ash for failing in [exile_seeker.GetHerHis] duties, as recently been spotted in [GetTitleByKey('c_lisiere_cendre').GetName] among a few nomads that apparently inhabits the Sea of Ash.”\n\n“The [cendrerin_culture.GetName]”, answers my [random_councillor.GetCouncilTitle], “they descend from the old Ciriane tribes like all in Orlais, yet they chose to wander the dunes of the Sea of Ash. They keep their ways as a secret, but trade is often made with them on the Sundered Sea.”"
 dataw_events_gamord.0060.a: "I will aid you, Seeker of Truth."
 dataw_events_gamord.0060.a.tt: "You'll dedicate all your resources to find the exiled Seeker"
 dataw_events_gamord.0060.b: "I will search for this tribe,\nbut I make no promises on enforcing this exile's punishment."
 dataw_events_gamord.0060.b.tt: "You'll devote all of your resources to locate the tribe"
 dataw_events_gamord.0060.c: "Your exile is a Seeker, therefore,\nit is the Seeker's duty to enforce such punishment."

 dataw_events_gamord.0062.tit: "The tribes of the Sea of Cinders"
 dataw_events_gamord.0062.desc.opening: "It has been a few weeks since the Seeker came, and yet in front of me stands the exile that was promised to [exile_seeker.GetHerHim], [exile_seeker.GetFirstName]. I am informed that [exile_seeker.GetHerHis] clothes may be the same as those of the nomads, but [exile_seeker.GetHerHis] necklace with the symbol of the Seekers of Truth betrays [exile_seeker.GetHerHis] origin.\n\n"
 dataw_events_gamord.0062.desc.a: "“Please, [ROOT.Char.GetTitleTierName], heed my words!” [exile_seeker.GetSheHe] says, almost begging. “I am aware of your promise to the Seekers, yet I ask that you let me join my new people.”\n\n"
 dataw_events_gamord.0062.desc.b: "“Please, [ROOT.Char.GetTitleTierName], heed my words!” [exile_seeker.GetSheHe] says, almost begging. “I am aware you promised to search for my tribe, but I can give you something the Seekers can't, if you let me join them once again.”\n\n"
 dataw_events_gamord.0062.desc.ending: "[exile_seeker.GetSheHe|U] then explains to me that the Cendrerin have always traveled through the Sea of Ash since time immemorial, and that, for them, passing through Lisière-Cendre is an occasional, but regular thing to trade with the people of Gamord, when they don't wait for the boats of [GetTitleByKey('c_mont_de_glace').GetName]. Yet the Cendrerin see the mountains as a land of certainty among the ever-shifting dunes of Ash, and they have chosen to settle among the locals.\n\n“I ask only that you let me and my tribe stay in Lisière-Cendre”, [exile_seeker.GetFirstNameNoTooltip] continues, “and I will do my best to make sure it works to your benefit. Trade with the nomads? Settlers for the economy? Soldiers for your army? Whatever you want, I will do my best to assure you will get, if you let me join my people.”"
 dataw_events_gamord.0062.a: "Go, and tell them to bring me trade."
 dataw_events_gamord.0062.a.tt: "#V #L Every#!#! [GetFaithByKey('orlesian_chantry').GetAdherentNamePlural] loses #N 30#! [opinion|E] of #V you#! #weak (+1.20/year) (Disappointed)#!"
 dataw_events_gamord.0062.b: "Go, and tell them more are welcome to settle."
 dataw_events_gamord.0062.c: "Go, and tell them some will have to take arms among my soldiers."
 dataw_events_gamord.0062.d: "You're going to the Seekers, and they will decide your fate."
 dataw_events_gamord.0062.d.tt: "#V #L Every#!#! [GetFaithByKey('orlesian_chantry').GetAdherentNamePlural] gains #P 30#! [opinion|E] of #V you#! #weak (-1.20/year) (Disappointed)#!"

 dataw_events_gamord.0064.tit: "Those who walk among the Sulphuric Dunes"
 dataw_events_gamord.0064.desc.opening: "It has been a few months ever since the settling of the [cendrerin_culture.GetName] nomads among the population of Lisière-Cendre and, despite some conflicts between the new majority and the already present inhabitants, it seems like the situation had calmed for the benefit of all.\n\nAt least that's what I believed.\n\nA peasant by the name of [lisiere_cendre_peasant.GetFirstName] has come in [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier], and claimed that the Cendrerin are doing despicable things, and that some are not andrastian, but something else entirely.\n\n[lisiere_cendre_peasant.GetSheHe|U] speaks of demon summoning, with wraiths made of ash appearing in strange rituals, conversing with the nomads as though the conversation was between a father and a son. [lisiere_cendre_peasant.GetSheHe|U] speaks of sacrifices, of people willingly stepping into a fire, with a black pearl in their mouth, letting themselves be consumed until they were dust.\n\nAnd, worst of all, the sacrifices soon reappeared, looking just like the wraiths.\n\nMy court is dumbfounded at these revelations, many frozen in horror. Already, many are asking to kick those depraved nomads out of Gamord, to make them see the light of the Maker once and for all, and slaughter all who refuse. I have never seen my people this eager for a war.\n\nYet, as my court erupts in loud claims for battle, an envoy of nomads present themselves in front of me.\n\n“My dear liege”, begins the leader of the envoy, “I am [cendrerin_envoy.GetFirstName], and I come to you to deliver you an offer from the leaders of the tribes of Lisière-Cendre.”\n\n"
 dataw_events_gamord.0064.desc.a: "“We are grateful that you spared our newest tribe member, [exile_seeker.GetFirstName], and the deal we have done with you has brought us both wealth and safety. It is for this reason that we are in front of you today.”\n\n"
 dataw_events_gamord.0064.desc.b: "“We are sorry that you have not spared your exile, but we will let it slide, for this accord is more important than the death of one of ours. After all, the Ash has made us learn that not all vengeances are worth pursuing, for they will only bring death to all.”\n\n"
 dataw_events_gamord.0064.desc.ending: "“We are here to show you the truth of the Ash, for we have come to Lisière-Cendre with a clear reason. One of our most respected figures, [ash_prophet.GetFirstName], has told us that now is the time to show our brethren to the east the true faith. We do not care for the faith your subjects follow, for they will see the Ash eventually. Join us in our customs, oh [ROOT.Char.GetFirstNameNoTooltip], for the will of the Ash is second to none, not even the Andraste you follow. See the light, and join our customs!”\n\nThe last sentence sends a chill down my spine.\n\n“Should you refuse this graceful offer, our prophet shall take this land and claim it, as it is the will of the Ash. »"
 dataw_events_gamord.0064.a: "Yes, I join you in your worship of the Ash."
 dataw_events_gamord.0064.a.tt_1: "Every [GetFaithByKey('orlesian_chantry').GetAdherentNamePlural] [vassals|E] apart from [cendrerin_culture.GetName] loses #N 100#! [opinions|E] of #V you#! #weak (+0.60/year) (Hatred)"
 dataw_events_gamord.0064.a.tt_2: "Every [GetFaithByKey('orlesian_chantry').GetAdherentNamePlural] [county|E] in your [realm|E] gains [GetModifier( 'betrayed_our_faith' ).GetNameWithTooltip] for #V 10 years#!"
 dataw_events_gamord.0064.b: "I will join you, in all ways possible, to avoid this bloodshed."
 dataw_events_gamord.0064.b.tt_1: "Every [GetFaithByKey('orlesian_chantry').GetAdherentNamePlural] [vassals|E] apart from [cendrerin_culture.GetName] loses #N 200#! [opinions|E] of #V you#! #weak (+0.60/year) (Hatred)"
 dataw_events_gamord.0064.c: "You came from the ashes, and to the ashes you shall return."
 dataw_events_gamord.0064.c.tt_1: "[ash_prophet.GetFirstName] starts a Cendrerin Ash Cult populist uprising for the Kingdom of Gamord."
 dataw_events_gamord.0064.c.tt_2: "#V #L Every#!#! [GetTrait('zealous').GetName( GetNullCharacter )] [GetFaithByKey('orlesian_chantry').GetAdherentNamePlural] [rulers|E] gains #P 30#! [opinion|E] of #V you#! for #V 10 years#! #weak ([GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName] Approves of Religious Displays)#!"

 dataw_events_gamord.0066.tit: "Not all follow the prophet"
 dataw_events_gamord.0066.desc: "« My [ROOT.Char.GetTitleTierName]! Intruder! »\n\nThis call from my [GetPlayer.Custom('KnightCulture')] [guard.GetFirstName] sends shivers down my spine, for the war against the forces of the Ash Prophet [ash_prophet.GetFirstName] still rages on, and any intruder could be one attempting to take my life. My heart nearly stops once I see a [andrastian_nomad.GetWomanMan], typically dressed in Cendrerin clothing in front of me.\n\nYet my surprise only turns to confusion once the intruder kneels before me.\n\n« [ROOT.Char.GetTitleTierName] of this land, I salute you, for I offer our aid! I am [andrastian_nomad.GetFirstName], leader of one of the many tribes of the Sea of Ash like the ones currently fighting against you. In our land, our two faiths have learned to coexist along one another, for survival is more important than beliefs in the Sea of Ash. »\n\nSeeing my uneasiness, the nomad continues.\n\n« Yet we believe the Ash Prophet has gone too far in [ash_prophet.GetHerHis] deeds, and us tribes that follow the Maker and her Bride are ready to stand with you, to avoid the bloodshed our takeover of Gamord would bring. »\n\nWhile [andrastian_nomad.GetSheHe] was waiting my answer, my [GetPlayer.Custom('KnightCulture')] [guard.GetFirstNameNoTooltip] soon followed, with [guard.GetHerHis] sword, awaiting my command."
 dataw_events_gamord.0066.a: "I accept your offer. Together, we shall stand against the unfaithful!"
 dataw_events_gamord.0066.a.tt: "Every [GetFaithByKey('orlesian_chantry').GetAdherentNamePlural] [vassals|E] loses #N 10#! [opinions|E] of #V you#! #weak (Communed with the enemy)"
 dataw_events_gamord.0066.b: "I don't need your help, nomad."
 dataw_events_gamord.0066.c: "[guard.GetFirstNameNoTooltip]! Execute [andrastian_nomad.GetHerHim]!" 

 ### Clayne filler events
 dataw_events_ferelden.0020.tit: "The Little Ptarmigan"
 dataw_events_ferelden.0020.desc: "As you walk across the courtyard you hear a strange thud behind you. You turn around to look when you see it, a round bird laying on the ground. It's a mountain bird, a ptarmigan. You approach, thinking it's dead when it suddenly opens its eyes and start kicking with its small legs up in the air. You realise it must have accidentally hit part of the surrounding buildings in its flight. It doesn't move as you approach, nor as you reach for it and scoop it up into your hands."
 dataw_events_ferelden.0020.a: "Its clearly injured, better to put it out of its misery."
 dataw_events_ferelden.0020.b: "This bird is one of the gods chosen creatures. It must be treated with respect!"
 dataw_events_ferelden.0021.desc: "You stroke the bird gently with your thumb as you reach for your dagger. With one quick strike you end the creatures suffering. It was the right thing to do."
 dataw_events_ferelden.0021.a: "So why do you feel so sad?"
 dataw_events_ferelden.0022.desc: "You cradle the round bird and take it to your chambers. Your physician laughs at first when you ask for their help but when they realise you are serious they get to work. For the next two days you treat the bird with herbs, you make sure it drinks, eats and rests. And in between you pray. \n\nAnd on the morning of the third day the bird suddenly perks up. Its eyes meets yours before it takes flight straight through the window. Your gaze follow it as it reaches a height you would not have guessed it could before it is gone. You smile, both happy and sad to see it go. \n\nFrom this day forward you start noticing more ptarmigans. Whenever you are alone outside you seem to see one just ahead of you. Sitting on a rock or underneath a bush Always near."
 dataw_events_ferelden.0022.a: "This feel right."
 dataw_events_ferelden.0030.t: "Ylva Sky-Song"
 dataw_events_ferelden.0030.desc: "A woman stands before you. She presents herself as Ylva Sky-Song and explains that she is a travelling skald. She has heard of you and wishes to write a song of your endeavours"
 dataw_events_ferelden.0030.a: "Accept her request."
 dataw_events_ferelden.0030.b: "Deny her request."
 dataw_events_ferelden.0041.t: "The Mill"
 dataw_events_ferelden.0041.desc: "Two minor lords have come to you with complaints about a mill. They are shouting and arguing and after a while you understand the problem. It was built by [minor_noble_1.GetName]'s great grandfather but a recent border change, places the mill on [minor_noble_2.GetName]'s land and now both of them feel that they have the right to the mill. They want you to handle the dispute before it leads to bloodshed."
 dataw_events_ferelden.0041.a: "This mill has belonged to [minor_noble_1.GetFirstName]'s family for generations now and it will remains so."
 dataw_events_ferelden.0041.b: "The mill is on [minor_noble_2.GetFirstName]'s land, the rules are clear, [minor_noble_1.GetFirstName] will give it up."
 dataw_events_ferelden.0041.c: "Avoid bloodshed? No, this can only be decided by bloodshed!"
 dataw_events_ferelden.0041.tt: "[minor_noble_1.GetFirstName] duels [minor_noble_2.GetFirstName] to the death!"
 dataw_events_ferelden.0042.t: "Crimson Dance"
 dataw_events_ferelden.0042.desc: "'You two! Pick up your weapons' You shout with a spark in your eyes.\n\n'Steel will decide who owns the mill and failure will be paid by blood! Tonight The Lady of the Skies will be your witness and she will grant her favour to the one worthy of ruling the land!'\n\nCheers roar across the room as the two nobles look at eachother with unease, nontheless their liege has spoken and they brace for death.\n\nThe hall thrums with excitement as the two move almost as one in a small circle, both armoured and both with axe and shield in hand. “Begin!” Your shout echoes in the hall and the two fighters launch at each other.\n\nThe hall is soon filled with the sounds of metal on wood, cheers and shrieks from the crowd and moans and grunts from the fighters. It doesn't take long and with one final blow both victory and the mill are claimed."
 dataw_events_ferelden.0042.a: "And so it is decided."
 dataw_events_ferelden.0042.tt: "[sc_victor.GetName] has slain [sc_loser.GetName]!"
 dataw_events_ferelden.0050.t: "The Abandoned Mabari"
 dataw_events_ferelden.0050.desc: "You groan as you the cart halts to a sudden stop, these damn carts. You'd much prefer to be on horseback but your guards had told you no. Now what you mutter to yourself as you hear commotion outside. You open the door and lean outside, blinking at the sudden light. One of your retinue guards approach.\n\n“It's…a mabari, it's blocking the road.”\n\nYou step out of the cart and approach the dog. True to your guards words it's a mabari, young from the looks of it. It's barking loudly and refusing to move off the road despite your guards approaching."
 dataw_events_ferelden.0050.a: "Order your guards to strike the beast down."
 dataw_events_ferelden.0050.b: "Order your guards to chase it away."
 dataw_events_ferelden.0050.c: "Approach the frightened animal."
 dataw_events_ferelden.0051.t_mabdead: "Where the dogs dream..."
 dataw_events_ferelden.0051.t_mableft: "Where the roads split"
 dataw_events_ferelden.0051.t_mabtame: "Man's Best Friend"
 dataw_events_ferelden.0051.t_mabfail: "Not meant to be"
 dataw_events_ferelden.0051.desc_mabdead: "Your largest guard makes it quick. The beast growls and winces but the strike comes swift and true. He then moves the body off the road and you can continue on your journey.\n\nSomewhere across the fields you hear a sharp shriek of a bird and an unsettling feeling sets in your gut."
 dataw_events_ferelden.0051.desc_mableft: "Your guards approach in a line formation, shouting and banging on their shields. At first the dog refuses to move but then it yelps and scurries off the road.\n\nYou can finally continue the journey, but your eyes lock with the dog and is that..sadness you notice?\n\nYou shake off the feeling and sit back in the cart."
 dataw_events_ferelden.0051.desc_mabtame: "You approach the animal. It growls and lounge half heartedly at you before it starts to wine and wince. You hold out your hands and after a moment the young dog approaches, it sniffs you before sitting down and staring up at you expectantly.\n\nIn the distance you hear the trill of a bird."
 dataw_events_ferelden.0051.desc_mabfail: "You approach the animal but you take one wrong step and lose your balance for a moment, frightening the dog.  The large hound growls and lunges at you. You regain your balance enough to turn to the side but you feel its strong jaws clasp around your forearm and it's teeth sink deep. There is shouting around you, you hear the sounds of unsheated weapons and metal hitting flesh. You feel its grip loosen and then let go of your arm before the mabari's body slumps to the ground."
 dataw_events_ferelden.0051.tt_mableft: "The dog is left to its fate."
 dataw_events_ferelden.0051.tt_mabdead: "The dog dies."
 dataw_events_ferelden.0051.a_mabdead: "One less mutt to worry about."
 dataw_events_ferelden.0051.a_mableft: "I wonder if our paths will cross again..."
 dataw_events_ferelden.0051.a_mabtame: "Come along boy!"
 dataw_events_ferelden.0051.a_mabfail: "A pity."
 dataw_events_ferelden.0060.t: "Tipping The Scales"
 dataw_events_ferelden.0060.desc: "As you and you party traverse the plains you spot something in the distance, a figure among the trees just off the road.  One of your guards goes to investigate and returns swiftly dragging an elderly man. The man is dressed in rags, his face is covered in soot and he reeks, in his hands he clasps something. On your order your guard wrenches if from him.\n\nAt first you think it's a piece of rock but as you turn it in your hands you realise it looks a large and very hard scale. The old man's face splits into a large toothless grin and he nods excitedly.\n\n“Where did you find this?”\n\nThe man cackles and points to a forest across the hills. He mumbles quickly, almost to quickly to catch but you hear the words “dragon”, “magic” and “treasure”."
 dataw_events_ferelden.0060.tt: "The old man leaves"
 dataw_events_ferelden.0060.a: "Return the “rock”. You don't have time for such nonsense."
 dataw_events_ferelden.0060.b: "Pocket the scale and send the man on his way."
 dataw_events_ferelden.0060.c: "Search the woods for this supposed treasure."
 dataw_events_ferelden.0061.t_ign: "On your way"
 dataw_events_ferelden.0061.t_rob: "Under new management"
 dataw_events_ferelden.0061.desc_ign: "You and your guards shove the man of the road. You drop the rock he was clasping into his lap and he grabs it, holding it tightly against his chest. You and your traveling party continue your journey and the dirty old man and his rock soon vanishes from your thoughts."
 dataw_events_ferelden.0061.desc_rob: "You nod to your guard, who pulls the man with him off the road.\n\nYou look at the strange rock, it feels almost warm in your hand. Clearly there is something to this than it just being an oddly shaped rock. You pocket it and turn towards your traveling party.\n\nBehind you there are sounds of a scuffle and the old man is trying to shout something at you but you can't make out the words.\n\nYour gaze turns towards him a final time and you see your guards hold him back as he reaches towards you, towards the rock.\n\nYou walk away, let your guards handle him, the rock safely tucked away in your pocket."
 dataw_events_ferelden.0061.a_ign: "What an odd man."
 dataw_events_ferelden.0061.a_rob: "Commoners don't deserve such items."
 dataw_events_ferelden.0062.t: "Treasure Hunt"
 dataw_events_ferelden.0062.desc: "You look across the hills, there among the trees you see a dark shadow, could it be a cave? Could there truly be treasure?  You gather your people and you move towards it, you have time for a small detour.\n\nAfter nearly an hour of walking, the old man following closely behind the entire time, you reach the woods and it doesn't take you long to see that the dark shadow you thought looked like a cave was in fact a giant tree trunk. Larger than any tree in the area. It's crown of leaves long gone, the thick wood cracked and burnt, laying on it's side - a lightning strike perhaps? The ground around the tree also looked burnt and everything was covered in soot except for a few places on the ground where you spot strange marks through the soot, as if something heavy had been dragged across the ground. There is an eerie feeling in the pit of your stomach.\n\nSomething tells you to investigate the tree trunk. But something else holds you back.\n\nNo normal fire could have caused this…"
 dataw_events_ferelden.0062.a: "Turn back. Best to leave this place."
 dataw_events_ferelden.0062.b: "Approach the burnt tree."
 dataw_events_ferelden.0063.t_nfnd: "Some things..."
 dataw_events_ferelden.0063.t_fnd: "Some things..."
 dataw_events_ferelden.0063.desc_fnd: "Slowly and carefully you approach the burnt tree. Only now you realise that you haven't heard a single bird in a long time. How strange. You mumble a prayer under your breath before slowly reaching out to touch the blackened wood…and nothing. The wood is hard and cold, what were you expecting? You sigh with relief and are about to call out to your soldiers in jest when a gleam catches your eye. Something is embedded in the wood. You reach for it, it's hard and really stuck. You take your dagger and start carving and digging into the wood and after a few tries you are able to get the item out. In your hand lies a large tooth, far too large for any animal you've ever seen. It's smooth and sharp and it almost thrums with energy in your hand.  It's only then that you notice the hole under the tree, as if something had been buried there. You look towards your men you notice that the old man is no longer among them. Reaching toward your pocket you realise that the rock, no, the dragon scale, is also missing.\n\n“A fair exchange” you muse to yourself. Whatever or whoever had buried something here was long gone but at least you got something out of this little detour."
 dataw_events_ferelden.0063.desc_nfnd: "You turn back. The old man is staring at the tree, you are not sure if he can't move or if he doesn't want to. You pocket the strange looking rock and leave the tree, and the man, and return on your journey."
 dataw_events_ferelden.0063.a_fnd: "...belong to the worthy."
 dataw_events_ferelden.0063.a_nfnd: "...are best left untouched."
 dataw_events_ferelden.0064.artnam: "Strange Rock."
 dataw_events_ferelden.0064.artdesc: "A strange rock, sturdy, tough and warm to touch, if you didn't know better you'd think it was a scale"
 dataw_events_ferelden.0064.artnam1: "Dragon's tooth."
 dataw_events_ferelden.0064.artdesc1: "The tooth of a mythical beast long gone from the realm"
 ### Avvar filler events
 dataw_events_frostback_mountains.0010.tit: "Lyrium Smugglers"
 dataw_events_frostback_mountains.0010.desc: "My guards produce two dwarves with face tattoos, found trespassing on my vassal's lands. The dwarves were seized alongside a cart full of dwarven arms & armor, but more importantly, lyrium.\n\nMy [GetPlayer.GetCouncillorPosition( 'councillor_chancellor' ).GetPositionName] [GetPlayer.GetCouncillor( 'councillor_chancellor' ).GetFirstName] argues that the pair represent a diplomatic opportunity. We could win favors with our neighbors below by escorting them back. But my [GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName] [GetPlayer.GetCouncillor( 'councillor_steward' ).GetFirstName] disagrees, saying that we ought to keep their loot for ourselves.\n\nOne of my prisoners speaks up “Noble [ROOT.Char.GetTitleTierName], the friendship between our peoples dates back to chieftain Luthias Dwarfson. Would it not be better for the both of us if you joined in our business ventures?” The dwarves' smiles are crooked, and missing a few teeth."
 dataw_events_frostback_mountains.0010.a: "Kill them, as a warning to any other trespassers."
 dataw_events_frostback_mountains.0010.b: "Throw them in my dungeon & sell their ill gotten goods."
 dataw_events_frostback_mountains.0010.c: "[GetPlayer.GetCouncillor( 'councillor_chancellor' ).GetFirstNameNoTooltip] has the right of it, return them to Orzammar."
 dataw_cultural_acceptance_dealing_with_carta: "Dealing with the Carta"
 dataw_events_frostback_mountains.0010.d: "What about joining me?"
 dataw_events_frostback_mountains.0010.tt: "You'll choose which one will stay"
 dataw_events_frostback_mountains.0010.e: "Go on, dwarf…"
 dataw_events_frostback_mountains.0011.tit: "Lyrium Smugglers"
 dataw_events_frostback_mountains.0011.desc: "Of the two smugglers my men have caught, we only have room to retain one's services.\n[carta_dwarf_2.GetFirstNameNoTooltip] is a trained Carta muscle, [carta_dwarf_2.GetSheHe]'s honed [carta_dwarf_2.GetHerHis] combat skills and muscle as well as any Avvar berserker.\nWhile [carta_dwarf_1.GetFirstNameNoTooltip] is a shrewd negotiator, sent alongside [carta_dwarf_2.GetFirstNameNoTooltip] to ensure the Carta gets their due.\nBoth would be useful additions to my court, but the Carta will expect me to send the other back."
 dataw_events_frostback_mountains.0011.a: "[carta_dwarf_2.GetFirstNameNoTooltip] will join my army."
 dataw_events_frostback_mountains.0011.b: "[carta_dwarf_1.GetFirstNameNoTooltip] will join my court."
 dataw_events_frostback_mountains.0020.tit: "Western Souvenirs"
 dataw_events_frostback_mountains.0020.desc: "As I prepare to leave the lands of the empire behind, I cannot help but feel that I should bring something back with me.\nThe Orlesians have much to offer, but it all comes at a steep price. A few books would be valuable to my Skald, as well as those who will tell history after them. Some of the furs & leathers available here aren't easily accessible in the mountains. Their food is much tastier than our own.\nBut I cannot bring all of Orlais home, only a small part of it."
 dataw_events_frostback_mountains.0020.a: "I will buy Books for my Skald."
 dataw_events_frostback_mountains.0020.a.tt: "#V Every#! #E [GetTrait('lifestyle_poet').GetName( GetNullCharacter )]#! gains #P 20#! [opinion|E] of #V you#! #weak (-1.20/year) (Friendly)#!"
 dataw_events_frostback_mountains.0020.b: "I will buy a new outfit."
 dataw_events_frostback_mountains.0020.c: "I will bring home exotic spices."
 dataw_events_frostback_mountains.0020.c.tt: "The cost of your #V Feasts#! will be reduced by @gold_icon!#V 50#! [gold|E]\nfor #V 5 years#!"
 orlesian_gastronomie: "Orlesian Gastronomie"
 dataw_events_frostback_mountains.0020.d: "Why can't I take it all home?"
 dataw_events_frostback_mountains.0020.e: "Nevermind, let's head home."
 dataw_events_frostback_mountains.0030.tit: "Escaped Hold-Beast"
 dataw_events_frostback_mountains.0030.desc: "While wandering through [location_holder.GetTitledFirstName]'s territory I come upon a magnificent beast, painted with the mark [location_holder.GetHouse.GetNameNoTooltip].\n\nThis must be their hold-beast!\n\nWhile the beast has no obligation to stay with its hold, it is still rare to catch one alone and unsupervised. This is surely a sign that the destiny of our holds are linked, though how I cannot say..."
 dataw_events_frostback_mountains.0030.a: "Feed the beast some of our provisions."
 dataw_events_frostback_mountains.0030.b: "Capture the beast."
 dataw_events_frostback_mountains.0040.tit: "Visiting Skald"
 dataw_events_frostback_mountains.0040.desc: "A Skald arrives at court, traveling from [neighboring_ruler.GetTitledFirstNameNoTooltip]'s court.\nThe Skald spends days singing & reciting the history of my realm. The warrior-lifestyle_poet is talented, and my own Skalds could stand to learn from their example.\n\nBut one curiosity nags me.\n\nThe Skald speaks my ancestors as if they were loyal vassals to [neighboring_ruler.GetFirstNameNoTooltip]'s own ancestors. Some of my warriors balk at this, but perhaps it reflects an opportunity…"
 dataw_events_frostback_mountains.0040.a: "Kill the Skald, he insults my rule."
 dataw_events_frostback_mountains.0040.a.tt: "#V Every#! #E [GetTrait('lifestyle_poet').GetName( GetNullCharacter )]#! loses #N 20#! [opinion|E] of #V you#! #weak (+1.20/year) (Cruel)#!"
 dataw_events_frostback_mountains.0040.b: "Correct the Skald, your ancestors ruled [neighboring_ruler.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]'s,\nnot the other way around."
 dataw_events_frostback_mountains.0040.b.tt: "#V Every#! #E [GetTrait('lifestyle_poet').GetName( GetNullCharacter )]#! loses #N 10#! [opinion|E] of #V you#! #weak (+1.20/year) (Upset)#!"
 dataw_events_frostback_mountains.0040.c: "There have been worse excuses for friendship."
 dataw_events_frostback_mountains.0040.c.tt: "You have gained an alliance with [neighboring_ruler.GetName]"
 dataw_events_frostback_mountains.0050.tit: "Tying the Knot"
 dataw_events_frostback_mountains.0050.desc: "As mine and [spouse.GetFirstNameNoTooltip]'s families begin singing the Lady of the Skies' song, I am presented with the traditional marriage rope.\n\nNo Avvar marriage is permanent, and how many knots I can untie will determine the length of my new union.\nI may go slow if I wish our marriage to be quick, or rush if I wish it to be longer. However, the same is true of my new spouse, and I must anticipate their response."
 dataw_events_frostback_mountains.0050.a: "Move slowly, only unwrapping a few knots."
 dataw_events_frostback_mountains.0050.a.tt: "Generate a #E value#! between #V 1#! and #V 6#! #L included#!"
 dataw_events_frostback_mountains.0050.b: "Move quickly, aiming to undo as many knots as possible."
 dataw_events_frostback_mountains.0050.b.tt: "Generate a #E value#! between #V 7#! and #V 12#! #L included#!"
 dataw_events_frostback_mountains.0051.tit: "Tying the Knot"
 dataw_events_frostback_mountains.0051.desc: "As mine and [spouse.GetFirstNameNoTooltip]'s families begin singing the Lady of the Skies' song, I am presented with the traditional marriage rope.\n\nNo Avvar marriage is permanent, and how many knots my spouse can untie will determine the length of my new union.\nIt is to me to tie those knots. I could tie them loosely, if I wanted our marriage to last a long time. Or, if I want to be rid of my spouse soon, I could try and time them tightly. However, the same is true of my new spouse, and I must anticipate their response."
 dataw_events_frostback_mountains.0051.a: "Move slowly, only unwrapping a few knots."
 dataw_events_frostback_mountains.0051.b: "Move quickly, aiming to undo as many knots as possible."
 dataw_events_frostback_mountains.0052.tit: "Re-Tying the Knot"
 dataw_events_frostback_mountains.0052.desc: "As mine and [spouse.GetFirstNameNoTooltip]'s families begin singing the Lady of the Skies' song, I am presented with the traditional marriage rope.\n\nNo Avvar marriage is permanent, and how many knots my spouse can untie will determine the length of my new union.\nIt is to me to tie those knots. I could tie them loosely, if I wanted our marriage to last a long time. Or, if I want to be rid of my spouse soon, I could try and time them tightly. However, the same is true of my new spouse, and I must anticipate their response."
 dataw_events_frostback_mountains.0052.a: "I will re-dedicate myself to [spouse.GetFirstNameNoTooltip]."
 dataw_events_frostback_mountains.0052.a.tt: "If your spouse decides the same, you will re-tie the knots"
 dataw_events_frostback_mountains.0052.b: "It is time to set [spouse.GetFirstNameNoTooltip] aside."

 dataw_filler_western_approach.0010.tit: "The Great Scar of Thedas"
 dataw_filler_western_approach.0010.desc: "The next person approaching me presents [adventurer.GetHerselfHimself] as [adventurer.GetFullName] a frequent delver of the Deep Roads, and which seem to delve into the most dangerous of its depths, the Abyssal Rift, in the middle of the ancestral home of the Vandalarien, the Western Approach. What they ask is only some preliminary funding, and they will share half of the ancient dwarven spoils with me.\n\n« My [ROOT.Char.GetTitleTierName], surely you don't trust this shady character? [adventurer.GetSheHe|U] will surely leave with your gold, never to be seen again! », objects my [GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName] [GetPlayer.GetCouncillor( 'councillor_marshal' ).GetFirstName].\n\n« Fear not! » responds [adventurer.GetFirstNameNoTooltip]. « For my group is hardened in battle against the Darkspawn. We even got a few Grey Wardens! I can guarantee that your funding will at least bring one artifact out of these depths. »\n\nDespite the admittedly shady side of this character, the choice of whether I accept the gamble of his offer is mine."
 dataw_filler_western_approach.0010.a: "Bring him gold and supplies, and I hope for your health that I see you again."
 dataw_filler_western_approach.0010.tt.a.a: "The crew is never seen again"
 dataw_filler_western_approach.0010.tt.a.b: "[adventurer.GetFirstNameNoTooltip] vanishes without a trace"
 dataw_filler_western_approach.0010.tt.a.c: "The crew comes back with too little loot to cover expenses"
 dataw_filler_western_approach.0010.tt.a.d: "The crew comes back with a reasonable amount of loot"
 dataw_filler_western_approach.0010.tt.a.e: "The crew comes back with riches beyond counting"
 dataw_filler_western_approach.0010.b: "[ward.GetFirstName], go with them, it will give you a degree of experience."
 dataw_filler_western_approach.0010.tt.b.a: "[ward.GetFirstNameNoTooltip] vanishes without a trace"
 dataw_filler_western_approach.0010.tt.b.b: "The crew holds [ward.GetFirstNameNoTooltip] hostage"
 dataw_filler_western_approach.0010.c: "[knight.GetFirstName], make sure they behave."
 dataw_filler_western_approach.0010.tt.c.a: "[knight.GetFirstNameNoTooltip] vanishes without a trace"
 dataw_filler_western_approach.0010.tt.c.b: "The crew holds [knight.GetFirstNameNoTooltip] hostage"
 dataw_filler_western_approach.0010.d: "You want to delve into the Abyssal Rift!? Are you mad?"
 dataw_filler_western_approach.0010.tt.d.a: "[adventurer.GetFirstNameNoTooltip] move to [new_location.GetName]'s court"
 dataw_filler_western_approach.0010.lost_crown_of_kal_repartha.tit: "With the crown comes the land"
 dataw_filler_western_approach.0010.lost_crown_of_kal_repartha.desc: "With the Crown of Kal-Repartha now in your hands, dwarven customs allows you to rightfully claim the surface thaig as your own."
 dataw_filler_western_approach.0010.crown_of_a_forgotten_thaig.desc: "With the Crown of a Forgotten Thaig now in your hands, dwarven customs allows you to rightfully claim the surface thaig as your own."

 DATAW_events_brecilian_forest.0001.tit: "The Migration into [title.GetBaseNameNoTier]"
 DATAW_events_brecilian_forest.0001.desc: "With our recent conquest of the [title.GetBaseName], many of the [elvhen|E] have started to move in the Brecilian Forest, seeing it as a new home for our people.\n\n#!Yet with this influx of refugees coming to settle has also arrived conflict with the local [title.GetProvince.GetCulture.GetCollectiveNoun]. They claim they were already settled here for far longer, and that the elves have no right to root them out of their ancestral homes. Without a local ruler in charge to preserve their land rights, the expulsion of local [title.GetProvince.GetCulture.GetCollectiveNounNoTooltip] at the hand of the elves will no doubt continue unimpeded, pushing the locals out of the region and into a world they do not know.\n\n#!Furthermore, many across the forest see the situation in the [title.GetBaseNameNoTooltip] with worry, as it can be expected that a similar situation would occur should we take over another region."
 DATAW_events_brecilian_forest.0001.opt.a: "This will not endear us to the locals."
 DATAW_events_brecilian_forest.0001.opt.a.tt: "The Dalish see the Brecilian Forest as a new homeland they can call home.\n\n#!As such, every county conquered in the region will gain the [GetModifier('brecilian_elvhen_culture_automatic_modifier').GetNameWithTooltip] [modifier|E] for 20 years.\n\n#!If a human takes over the county directly, the [GetModifier('brecilian_elvhen_culture_automatic_modifier').GetNameWithTooltip] will stop, and the locals will ensure they never happen again."
 
 
