# EVENT 1     #THE FIRST STONE
 DATAW_ulstor_events.001.tit: "The First Stone"
 DATAW_ulstor_events.001.desc: "Edgehall, a hall of my own. Built by the dwarves long before the first Blight as a surface outpost, and abandoned when the darkspawn attacked their underground thaigs. \n\nSoon after, the land would be claimed by the native Alamarri, led by the mythical Luthias Dwarfson. His kin and ilk ruled this land for generations - a western bulwark of civilization for the Clayne against the Avvar tribes of the Frostbacks. But the Avvar remember the dishonor inflicted on Morrighan'nan, the hand of friendship pushed aside and spurned. Luthias may have been a hero to the lowlanders, but to us, he was a fraud, and his hall free for the taking by right of conquest. \n\nAnd so I did. The Wolf of the Highlands never quite felt at home in his step-father's hold Far Peak. Stigandr tried his best to impart the ways of the Wise-Wind upon me, but after my mother's passing I was clanless. Upon reaching manhood I wandered, full of rage, unsure of my purpose or who I really was. \n\nI've seen and done much. But what I desired most of all was a hall of my own, so when my friend Endre brought word of the defenseless lands to our east, mismanaged for centuries by Luthias' vile spawn, I knew the hour of the wolf had finally come!"

 DATAW_ulstor_events.001.opt.a: "And so Edgehall did burn..."
 DATAW_ulstor_events.001.opt.a.tooltip: "During my conquest of Edgehall, I spared not a soul from my wrath, and my coffers benefited all the more for it. This should serve as material to equip my army with before #N making war with Redcliffe.#!"
 DATAW_ulstor_events.001.opt.b: "And so I sat the throne..."
 DATAW_ulstor_events.001.opt.b.tooltip: "During my conquest of Edgehall, I spared a majority of the civilian population, earning me much respect from my Clayne neighbors. This should serve to strengthen my reputation with the locals before #N making war with Redcliffe.#!"


# EVENT 2     #THE WHETSTONE
 DATAW_ulstor_events.002.tit: "The Whetstone"
 DATAW_ulstor_events.002.desc: "#N The time for war has come.#!          \n\nNow that I've established a base of operations for myself and my allies, I peer voraciously at the lands to my south-east. Lands that fall rightfully under my domain... The Arling of Redcliffe holds the territories of Whitewell and Rainesfere, and has done so for nigh a century, even though these lands rightfully fell under the claim of their kinsman in Edgehall. \n\nWith Edgehall now under the control of myself and my closest friends and confidants - now is the time to enforce these ancient claims!  Send out the ravens, let the Arl in his keep know that soon - the men of the Frostbacks will be at his doors!"

 DATAW_ulstor_events.002.opt.a: "Call on the augurs! Ready them for war!"
 DATAW_ulstor_events.002.opt.a.tooltip: "The Augurs shall guide us in our war against Redcliffe!"
 DATAW_ulstor_events.002.opt.b: "Send word to the clans! There are holdfasts to claim!"
 DATAW_ulstor_events.002.opt.b.tooltip: "The clans will rally to our cause and help us take what is rightfully ours!"

############## WINNING BRANCH BELOW

### NEW BORDER ### DOWN

# EVENT 3     #A New Border
 DATAW_ulstor_events.003.tit: "A New Border"
 DATAW_ulstor_events.003.desc: "We have won. Redcliffe has submitted to our will, all of the proper Arling of Edgehall falls within our domain. Rainesfere and Whitewell will need to be integrated properly, but for now we need to decide on our next course of action. The rest of our rightful territory - the former Teyrnir of Edgehall - is still held by those outside our domain. How should we approach taking these lands?"
 DATAW_ulstor_events.003.opt.a: "Seek peaceful integration with the locals."
 DATAW_ulstor_events.003.opt.a.tooltip: "Take the long path towards peaceful integration."
 DATAW_ulstor_events.003.opt.b: "Force the locals to submit."
 DATAW_ulstor_events.003.opt.b.tooltip: "The quicker route is often the better route."

# EVENT 3.1   #A Plan for Cooperation
 DATAW_ulstor_events.0031.tit: "A Plan for Cooperation"
 DATAW_ulstor_events.0031.desc: "I've decided to focus my efforts on integrating those holdouts to my rule through more diplomatic routes. The question remains though, who should I approach first? The Andrastians in Haven, or our Avvar kin in Elmridge?"
 DATAW_ulstor_events.0031.opt.a: "First the disciples, then the clans!"
 DATAW_ulstor_events.0031.opt.a.tooltip: "Send a message to the Disciples in Haven!"
 DATAW_ulstor_events.0031.opt.b: "First the clans, then the disciples!"
 DATAW_ulstor_events.0031.opt.b.tooltip: "Send a message to the Southron Clan in Elmridge!"

# EVENT 3.2   #A Message to the Disciples
 DATAW_ulstor_events.0032.tit: "A Message to the Disciples"
 DATAW_ulstor_events.0032.desc: "The Disciples of Andraste claim to be the holdovers of their lady's original followers and their descendants. They used to be leal subjects of the former teyrn of Edgehall, before we claimed it for ourselves, now we must bring them back under our control. Should we approach them with an open hand, allowing them special privelages of religious protection? Or should we demand they fall back in line as our rightful subject with no special terms?"
 DATAW_ulstor_events.0032.opt.a: "Offer them special protections as an incentive to submit!"
 DATAW_ulstor_events.0032.opt.a.tooltip: "Haven should be granted special protections to show the Clayne we are willing to be generous with those that submit."
 DATAW_ulstor_events.0032.opt.b: "Demand their submission lest they face our wrath!"
 DATAW_ulstor_events.0032.opt.b.tooltip: "The Disciples are seperated from their Andrastian kin, so they will be more easily swayed by force."

# EVENT 3.21  #Integrating the Clans - refocusing on Haven
 DATAW_ulstor_events.00321.tit: "Focusing on Haven"
 DATAW_ulstor_events.00321.desc: "We've started the process of dealing with the Disciples inhabiting Haven. We must now turn our focus on adding the Thane of Elmridge to our territories. Hopefully they won't get too many delusions of granduer."
 DATAW_ulstor_events.00321.opt.a: "Continue the campaign!"
 DATAW_ulstor_events.00321.opt.a.tooltip: "We must continue our campaign and add Haven into our realm."

# EVENT 3.31  #Integrating Haven - refocusing on the Clan
 DATAW_ulstor_events.00331.tit: "Focusing on the Southron Clan"
 DATAW_ulstor_events.00331.desc: "We've started the process of dealing with the Long-Beard clan to our south. We must now turn our focus on adding the Bann of Haven to our territories. Hopefully they won't get too many delusions of granduer."
 DATAW_ulstor_events.00331.opt.a: "Continue the campaign!"
 DATAW_ulstor_events.00331.opt.a.tooltip: "We must continue our campaign and add Haven into our realm."

