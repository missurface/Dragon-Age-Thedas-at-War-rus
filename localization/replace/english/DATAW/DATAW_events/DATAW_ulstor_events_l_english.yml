# EVENT 3.42   #Haven says no to our (nice) offer
 DATAW_ulstor_events.00342.tit: "An Offer Rejected - Haven"
 DATAW_ulstor_events.00342.desc: "The Disciples of Haven have rejected our incredibly generous offer of vassalage! This cannot stand, these andrastians must be shown that our offer was not merely a suggestion, and that our pens are back by the axe!"
 DATAW_ulstor_events.00342.opt.a: "Then we shall take the lands by force!"
 DATAW_ulstor_events.00342.opt.a.tooltip: "A warband is inspired by your resolve, joining the cause."
 DATAW_ulstor_events.00342.opt.b: "Accept their refusal, for now..."
 DATAW_ulstor_events.00342.opt.b.tooltip: "Accept the refusal of Haven for now, and plan a more strategic approach."

