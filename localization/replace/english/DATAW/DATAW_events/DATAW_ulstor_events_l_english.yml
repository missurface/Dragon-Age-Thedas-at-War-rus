 DATAW_ulstor_events.0038.desc: "The holdouts to my rule mock Edgehall's authority through their continued existence. We must see to it that we rectify this situation as soon as possible. The question remains, how best should we accomplish our goals? \n\n(check decisions for the next step in your questline)"
 DATAW_ulstor_events.0038.opt.a: "Let the clans prepare for war!"
