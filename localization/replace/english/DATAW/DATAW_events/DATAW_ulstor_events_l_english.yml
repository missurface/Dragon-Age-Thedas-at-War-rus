# EVENT 3.3  #A Message to the Southron Clan
 DATAW_ulstor_events.0033.tit: "A Message to the Southron Clan"
 DATAW_ulstor_events.0033.desc: "During our conquest of Edgehall, the Long-Beard clan took advantage of the chaos and grabbed land for themselves in the south. While we hold them at no fault for this - as it is the natural way of things in the Avvar world - we must now demand they submit to us as their natural overlords. Should we treat with them as fellow kin of Tyrdda, offering them a special place of honor, or demand they bow low to their rightful konungr?"
 DATAW_ulstor_events.0033.opt.a: "Treat them as fellow children of the Frostbacks!"
 DATAW_ulstor_events.0033.opt.a.tooltip: "The clans to our south are Avvar like us, rely on our shared heritage and values to bring them into the fold."
 DATAW_ulstor_events.0033.opt.b: "Demand they kneel before their konungr!"
 DATAW_ulstor_events.0033.opt.b.tooltip: "The clans to our south are weak, we can afford to be more forceful in our demands."

