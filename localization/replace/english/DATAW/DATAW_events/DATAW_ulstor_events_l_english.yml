# EVENT 6.5   #Baby Steps
 DATAW_ulstor_events.0065.tit: "Baby Steps"
 DATAW_ulstor_events.0065.desc: "With our decision to focus on our economic development, our advisors have asked us where the bulk of our efforts should be directed. Should we focus on further developing our newly rebuilt Edgehall, or should we invest our resources into our outer lands?"
 DATAW_ulstor_events.0065.opt.a: "The core around Edgehall must be strengthened!"
 DATAW_ulstor_events.0065.opt.a.tooltip: "This will grant our capital holdings a powerful economic modifier."
 DATAW_ulstor_events.0065.opt.b: "The outlying territories must be developed!"
 DATAW_ulstor_events.0065.opt.b.tooltip: "This will aid in the speed at which we can develop our outer lands." 

# EVENT 6.6   #A Focus for Our People
 DATAW_ulstor_events.0066.tit: "A Focus for Our People"
 DATAW_ulstor_events.0066.desc: "Our people prosper, they now look to the future with hope and determination. We could take advantage of this situation if we so desire. Should we double down on our economic efforts?, or instead focus on investing in making our rule more permenant?"
 DATAW_ulstor_events.0066.opt.a: "Focus on maintaining stability."
 DATAW_ulstor_events.0066.opt.a.tooltip: "We will gain immense sway over our subjects and our lands."
 DATAW_ulstor_events.0066.opt.b: "Focus on growing prosperity."
 DATAW_ulstor_events.0066.opt.b.tooltip: "We will gain significant economic benefits from this approach." 



# EVENT 6.7   #A Clan Beast: Eagle or Ram?
 DATAW_ulstor_events.0067.tit: "A Clan Beast for Edgehall"
 DATAW_ulstor_events.0067.desc: "Our rule is stable. Avvar and Clayne within our borders look to each other with respect and admiration - not fear. Now, like any good hold of the Frostbacks, we must decide on a hold-beast to represent us."
 DATAW_ulstor_events.0067.opt.a: "The all-seeing eagle shall lead us!"
 DATAW_ulstor_events.0067.opt.a.tooltip: "The eagle sees all, but can it see what lies within Ulstor's past? (check decisions)"
 DATAW_ulstor_events.0067.opt.b: "The stout-hearted ram shall lead us!"
 DATAW_ulstor_events.0067.opt.b.tooltip: "The ram's heart may be stout, but can Ulstor live up to its expectations? (check decisions)"
 DATAW_ulstor_events.0067.opt.c: "The brave wolf shall lead us!"
 DATAW_ulstor_events.0067.opt.c.tooltip: "The wolf is brave, but can it brave the challenges ahead of Ulstor? (check decisions)"
 DATAW_ulstor_events.0067.opt.d: "The stalwart bear shall lead us!"
 DATAW_ulstor_events.0067.opt.d.tooltip: "The bear is stalwart, but can it stand against the forces that threaten Ulstor? (check decisions)"
