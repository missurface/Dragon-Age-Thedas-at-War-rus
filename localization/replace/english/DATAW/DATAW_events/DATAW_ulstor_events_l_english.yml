# EVENT 4     #Licking Wounds
 DATAW_ulstor_events.004.tit: "Licking Wounds"
 DATAW_ulstor_events.004.desc: "We lost. The Wolf of The Highlands lost. With this loss comes not only the destruction of any momentum we had gathered thus far, but the authority we had as Konungr of Edgehall. Now are former thanes claim independence, and we no longer find ourselves able to project any authority over the greater realm of Edgehall. The road to recovery from this tragedy will be arduous"
 DATAW_ulstor_events.004.opt.a: "Woe to the people of Edgehall!"
 DATAW_ulstor_events.004.opt.a.tooltip: "We shall be fighting a long uphill battle to recover from this catastrophe."










