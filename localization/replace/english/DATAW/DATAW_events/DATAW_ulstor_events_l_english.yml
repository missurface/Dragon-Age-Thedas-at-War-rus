# EVENT 9.0     #Konungr or Conqueror?
 DATAW_ulstor_events.009.tit: "Konungr or Conqueror?"
 DATAW_ulstor_events.009.desc: "As a newly declared member of the mighty Sky-Hound clan, I must consider the direction in which I will take my reign. Our clan's devotion to the spirits of the mountains has never been in question. Where other Avvar might dare entertain the folly of the so called 'Maker Cults,' we stand resolute in the old ways that forged our survival in the Frostbacks. Our faith is one of the many things that distinguish us from limp-armed lowlanders. \n\nOur gods and ancestors have bestowed our clan with strength. Should I give due reverence to the many gods of my people, I could strengthen my realm and reinforce the ties that bind the Avvar as a firm-handed konungr. However, I also hear the war cry of the great Hakkon Wintersbreath in my heart. He promises great power to myself and my warriors should I devote myself solely to him and spread his bitter colds of frost and steel. \n\n(check decisions to continue quests)"

 DATAW_ulstor_events.009.opt.a: "I will honor the gods and ancestors with my rule..."
 DATAW_ulstor_events.009.opt.a.tooltip: "and see our people honored!"
 DATAW_ulstor_events.009.opt.b: "By Hakkon's Jaws, I will terrorize the lowlands..."
 DATAW_ulstor_events.009.opt.b.tooltip: "and all who dare oppose me!"








