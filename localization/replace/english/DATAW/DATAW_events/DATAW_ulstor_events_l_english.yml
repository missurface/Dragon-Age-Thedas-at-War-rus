# EVENT 10.0     #With Axe and Frost
 DATAW_ulstor_events.010.tit: "With Axe and Frost"
 DATAW_ulstor_events.010.desc: "I have savaged lowlander armies in Hakkon's name. My axe bears down on the war god's foes like a ferocious winter wind. Those below us quake in fear on hearing our battle cry come down the mountains. With axe and frost, we spread Hakkon's dread. \n\nThe god of war and winter gifts his loyal warriors with otherworldly strength and courage. Every one of us tears through our enemies like beasts, but I, the Wolfhand, stand as Hakkon's peerless champion. The Clayne may curse my name, but can they withstand my might?"
 DATAW_ulstor_events.010.opt.a: "Send the orders, we march for Portsmouth!"
 DATAW_ulstor_events.010.opt.a.tooltip: "Take the more aggressive approach, hoping to take all of Portsmouth at once. This may inspire fellow Avvar to your cause. \n\nNote - you must conquer all of Portsmouth to continue."
 DATAW_ulstor_events.010.opt.b: "Sharpen the axes, our time will come!"
 DATAW_ulstor_events.010.opt.b.tooltip: "Take a more cautious approach, dividing and conquering the banns and arls of Portsmouth one by one. This is safer if a bit slower. \n\nNote - you must conquer all of Portsmouth to continue."

# EVENT 10.1     #Clearing the Way
 DATAW_ulstor_events.0101.tit: "Clearing the Way"
 DATAW_ulstor_events.0101.desc: "filler loc for clearing the way event"
 DATAW_ulstor_events.0101.opt.a: "Clear the way, winter is headed for Portsmouth!"
 DATAW_ulstor_events.0101.opt.a.tooltip: "filler tooltip"

# EVENT 10.2     #Culling the Weak
 DATAW_ulstor_events.0102.tit: "Culling the Weak"
 DATAW_ulstor_events.0102.desc: "filler loc for culling the weak event"
