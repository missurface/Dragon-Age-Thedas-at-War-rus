# EVENT 7     #In Far Peak?
 DATAW_ulstor_events.007.tit: "In Far Peak?"
 DATAW_ulstor_events.007.desc: "Who am I? That's the question that racks my mind every night these days. I've spent a handful of years solidifying my rule over these lands, crafting a new realm for my people, proving my power, and establishing Avvar dominance in the western Ferelden Valley. But somehow, I still don't feel anymore complete within. There is still a gaping wound in my core. Many of my subjects - both Clayne and Avvar alike, have grown to call Edgehall their home; I however, cannot. \n\nMy youth was far more troubled than the average Avvar's. My mother… Skuld Flame-Touched, unfortunately, had a reputation. Whilst she tried to shield me from it, she never could fully - for I was a result of one of her many dalliances. Mother tried the best she could, but I never could escape the rumors surrounding my origins. Either way, I never stood much of a chance - a bout of sickness took her from me when I was only six, leaving me in the care of her husband Stigandr Wise-Wind. This is the man who truly 'raised' me, though whether the lessons he tried to give me truly made it through, I highly doubt. \n\nHe tried to raise me as his own, even going so far as to dub me 'his son.' But as genuine as he may have been, such matters became complicated when Katla arrived, and with her, genuine blood heirs to the Wise-Wind family. Though I could have easily laid claim to the hold - Avvar rights of leadership are not as sedentary as the lowlanders' I now surround myself with - I felt that the time to move on had come. So I left Far Peak - and Stigandr with it, years ago. If not to discover the truth of my origin, than the truth of my future instead."

 DATAW_ulstor_events.007.opt.a: "Maybe some of his lessons did stick after all..."
 DATAW_ulstor_events.007.opt.a.tooltip: "Become more in-tune with the teachings of Stigandr, and let his wisdom guide you in your decisions."
 DATAW_ulstor_events.007.opt.b: "I never had much need for his teachings..."
 DATAW_ulstor_events.007.opt.b.tooltip: "This will harden your heart, and keep you on track for glory."





# EVENT 7.1     #In Highhold?
 DATAW_ulstor_events.0071.tit: "In Highhold?"
 DATAW_ulstor_events.0071.desc: "When I left Far Peak, I set out North, having no particular destination in mind. But I knew that I may one day eventually cross paths with one of the men that might be my father. And I've had the fortune, or perhaps, the misfortune, of learning the fates of two such individuals. \n\nThe first of these - Roarr Sverkesen of the Sky-Hound clan - I met for the first and only time when stopping by his hall of Highhold looking for contracts early in my career as a mercenary. I remember seeing his face most of all… it was almost as if I had seen my reflection on the surface of a lake. He regaled me and my band with stories of his raids into Sun-Wolf lands. How he had orchestrated two-pronged assaults alongside the Crow-Talons of Stonepass, taken numerous captives from Sunhold, and personally slew Thane Kothmorn II's most fearsome brother - Warg Grimmornsen. \n\n'The nug got too full of himself! He actually managed to disarm me at one point, but he refused to strike me down on the spot! Apparently it would have been beneath an upstanding Sun-Wolf like him to kill an unarmed opponent, unfortunately for him - I never gave him another chance at my life.'"

 DATAW_ulstor_events.0071.opt.a: "Now this is a man I'd be proud to call my father!"
 DATAW_ulstor_events.0071.opt.a.tooltip: "Become more in-tune with the philosophy of Roarr, and let his anger guide you in your decisions."
 DATAW_ulstor_events.0071.opt.b: "This man lets his wrath get the best of him, the fool!"
 DATAW_ulstor_events.0071.opt.b.tooltip: "You will train to be more calm, hopefully seeing the order in the chaos."






# EVENT 7.2     #In Sunhold?
 DATAW_ulstor_events.0072.tit: "In Sunhold?"
 DATAW_ulstor_events.0072.desc: "My experience in Highhold left me reeling. Had I finally found my sire? My heart was pounding, I felt something within me I'd never felt before as I left the hall. Pride? Strength? Belonging? Maybe all or none of these things. \n\n'I can see why mother would choose such a powerful warrior as Roarr!' -  I thought to myself. How foolish I was! For my band had not even crested the next hilltop when Hundi Clean-Face said to me 'You know Wolfhand… that Warg may have died a noble death, but I remember when he was a pup not too much older than you. He weren't always so righteous. I heard he broke some lass' heart out in Cliffhold, left her with child then scampered back to Sunhold just to keep fighting in that stupid feud his family's always barking about.' \n\nCliffhold? I still remember hearing that name. That was mother's hold… I had never been there before, but I'd heard her speak of it all the time as a youth, when she'd tell me stories of grandpa Trond and uncle Roald. But what did this mean for me? For years I had written off the possibility of knowing who my father was, and had set out to make my own path. But it seemed destiny had other plans for me."

 DATAW_ulstor_events.0072.opt.a: "Maybe there is strength in the teachings of the Sun-Wolves after all..."
 DATAW_ulstor_events.0072.opt.a.tooltip: "Become more in-tune with the philosophy of the Sun-Wolves, and let their honor guide you in your decisions."
 DATAW_ulstor_events.0072.opt.b: "The Sun-Wolves are a bunch of fools, I don't need their moralizing!"
 DATAW_ulstor_events.0072.opt.b.tooltip: "Refute the teachings of the Sun-Wolves, and continue to forge your own path."

# EVENT 7.3     #In Edgehall.
 DATAW_ulstor_events.0073.tit: "In Edgehall."
 DATAW_ulstor_events.0073.desc: "Of course, all of this was years ago now. But with my own family growing and questions of heritage and legitimacy being posed to me by courtiers and neighboring rulers alike I know the time has finally come. I must decide - where does this wolf's den lie?  WHO AM I?"
 DATAW_ulstor_events.0073.opt.a: "I am Ulstor 'Wolfhand,' scion of Clan Sun-Wolf and son of Warg Grimmornsen!"
 DATAW_ulstor_events.0073.opt.a.tooltip: "This will put you on a path of unification with your kin in the Frostbacks and greater honor for your clan!"
 DATAW_ulstor_events.0073.opt.b: "I am Ulstor 'Wolfhand,' scion of Clan Sky-Hound and son of Roarr Sverkesen!"
 DATAW_ulstor_events.0073.opt.b.tooltip: "This will put you on a path of conquest and destruction -#N  be warned #!- all may be lost should you fail!"
 DATAW_ulstor_events.0073.opt.c: "I am Ulstor 'Wolfhand,' Stigandr is my father - a man's blood does not make him!"
 DATAW_ulstor_events.0073.opt.c.tooltip: "This will put you on a path of peacekeeping and stewardship, building and growing a new way of life for the Avvar!"














