################## LAST EVENT BELOW

 DATAW_ulstor_events.012.tit: "Home at Last"
 DATAW_ulstor_events.012wisewind.desc: "It feels so strange to feel at peace. After so many years of doubt - of searching for who I am - I just stand here with nothing to think about but the wind rushing against my face. \n\nIn these lowlands, I have found my home. I have offered my subjects prosperity and peace in a land of torment. My place in the world is not one of a conqueror, but of a just ruler."
 DATAW_ulstor_events.012skyhound.desc: "It feels so strange to feel at peace. After so many years of doubt - of searching for who I am - I just stand here with nothing to think about but the wind rushing against my face. \n\nIn these lowlands, I have spilt blood. So many heathens I have slaughtered in my quest for meaning. Now, I see my place in the world, as an empty vehicle for the gods' wrath against the Andrastians."
 DATAW_ulstor_events.012sunwolf.desc: "It feels so strange to feel at peace. After so many years of doubt - of searching for who I am - I just stand here with nothing to think about but the wind rushing against my face. \n\nIn these lowlands, I have seen the value of unity. The Claynes desire their unification not only because of their rampant ambition, but also because of the strength they gain together. As such, I have found my place in the world, as the unifier of all Avvars, under one faith and one throne."
 DATAW_ulstor_events.012.opt.a: "Finally, I know who I am."       
 DATAW_ulstor_events.012.opt.a.tooltip: "After all the trials and tribulations, I have found my place in the world, and I am at peace with it."







