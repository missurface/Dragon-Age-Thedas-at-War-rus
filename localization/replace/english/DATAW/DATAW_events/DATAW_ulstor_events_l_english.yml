# EVENT 10.3     #Quake the Wake
 DATAW_ulstor_events.0103.tit: "Quake the Wake"
 DATAW_ulstor_events.0103.desc: "Portsmouth lays in ruins, the weaklings who once called it home scattered to the outskirts of my domain. In their place, a fresh wave of Avvar veterans form the conquest have settled in the region. \n\nAlready the populace lament my rule, crying out for revolt against my conquest. Yet my advisors urge me that further glory is just within reach, I need only grasp it.  "
 DATAW_ulstor_events.0103.opt.a: "They shall feel the Wrath of Korth!"                 #only available if stayed avvar
 DATAW_ulstor_events.0103.opt.a.tooltip: "They shall quake from the Mountain Father's fury."
 DATAW_ulstor_events.0103.opt.b: "They shall feel the Wrath of Haakon!"                #only available if converted to haakon
 DATAW_ulstor_events.0103.opt.b.tooltip: "They shall feel the cold embrace of Hakkon Wintersbreath."

# EVENT 10.4     #Gate to Ferelden
 DATAW_ulstor_events.0104.tit: "The Gate to Ferelden is Open"
 DATAW_ulstor_events.0104.desc: "Redcliffe, home of the Guerrins and the last line of defense for any would-be invaders of Ferelden from the west. No conqueror has ever suceeded in crossing the Hinterlands who did not already have or take Redcliffe first. Now, it is ours. \n\nThe people rejoice as the world opens to the people of the Frostbacks."
 DATAW_ulstor_events.0104.opt.a: "The gates are open..."
 DATAW_ulstor_events.0104.opt.a.tooltip: "...and nothing can stop us!"

# EVENT 10.5     #From upon the Mighty Hill
 DATAW_ulstor_events.0105.tit: "From upon the Mighty Hill"
 DATAW_ulstor_events.0105.desc: "Lothering is taken, and with it the hills of southern Ferelden. Already more and more of my people are migrating eastwards and settling into the newly taken lands, especially those in the outlying borders."
 DATAW_ulstor_events.0105.opt.a: "These hills belong to the Avvar!"              
 DATAW_ulstor_events.0105.opt.a.tooltip: "Onwards, to new glory!"

# EVENT 10.6     #Routing the Lost Tribe
 DATAW_ulstor_events.0106.tit: "Routing the Lost Tribe"
 DATAW_ulstor_events.0106.desc: "Many wisemen say the Brecilians are our long lost kin, that they are no different from us than our Chasind and Clayne cousins. These wisemen have seen the errors of their ways. \n\nThe willingness of which the Brecilians covorted with demons, bringing about abominations upon the land needs no further remarks."
 DATAW_ulstor_events.0106.opt.a: "The forest shall be brought down with Korth's wroth!"                 #only available if stayed avvar
 DATAW_ulstor_events.0106.opt.a.tooltip: "Demons are not to be trifled with."
 DATAW_ulstor_events.0106.opt.b: "The forest shall be brought down with Haakon's wroth!"                #only available if converted to haakon
 DATAW_ulstor_events.0106.opt.b.tooltip: "Demons are not to be trifled with."

# EVENT 10.7     #The Abandoned Outpost
 DATAW_ulstor_events.0107.tit: "The Abandoned Outpost"
 DATAW_ulstor_events.0107.desc: "Gwaren lies abandoned, its walls crumbling and its people scattered. The outpost has been left to decay, a testament to the chaos that has befallen the region. A once mighty arling once ruled from here, projecting power across the sea and deep into the Korcari Wilds, bolstered with by Dwarven allies. But no more, it is the Avvars that rule Gwaren now, and we have plans of our own."
 DATAW_ulstor_events.0107.opt.a: "Gwaren is ours."                
 DATAW_ulstor_events.0107.opt.a.tooltip: "Perhaps another entrance to the Deep Roads will be useful in the future?"

# EVENT 10.8     #A People's Hopes - Crushed
 DATAW_ulstor_events.0108.tit: "A People's Hopes - Crushed"
 DATAW_ulstor_events.0108.desc: "From the lowest urchin to the highest lording contained within the high walls of Fort Drakon, all know the news by now. Denerim is ours - and if it isn't already, the rest of Ferelden will soon follow its lead."
 DATAW_ulstor_events.0108.opt.a: "The augurs have long heralded this moment."
 DATAW_ulstor_events.0108.opt.a.tooltip: ""
  
# EVENT 10.9     #A Long Kept Vigil
 DATAW_ulstor_events.0109.tit: "A Long Kept Vigil"
 DATAW_ulstor_events.0109.desc: "The Fort of a Thousand Vigils - or as the Clayne call it, Vigil's Keep - is the oldest and strongest Avvar fortress still standing outside the Frostbacks. Now, for the first time in nearly four ages, it is once again ours. \n\nAlready the clans have begun to settle within its walls."
 DATAW_ulstor_events.0109.opt.a: "Its vigil was not in vain."             
 DATAW_ulstor_events.0109.opt.a.tooltip: "The north of Ferelden is ours!"

# EVENT 10.10     #Like Sheep before the Wolf
 DATAW_ulstor_events.01010.tit: "Like Sheep before the Wolf"
 DATAW_ulstor_events.01010.desc: "The weak cower before the onslaught. Holdfasts burn, widows wail, and the Clayne call out for justice. But none ever arrives. \n\nNow, the breadbasket of Ferelden is in our hands."
 DATAW_ulstor_events.01010.opt.a: "Show them what real authority looks like!"
 DATAW_ulstor_events.01010.opt.a.tooltip: "Burn out the cowards and weaklings."

# EVENT 10.11     #Ulstor wept
 DATAW_ulstor_events.01011.tit: "Ulstor Wept"
 DATAW_ulstor_events.01011.desc: "I never believed it possible, yet here I am. When I first wandered out of Far Peak all those years ago, I doubt many of my clan mates would have assumed that one day - soon - all of Ferelden would tremble in my wake. \n\nBut those days are gone, and my time is now, the age of the Wolf-Hand is upon us."
 DATAW_ulstor_events.01011.opt.a: "...for there were no more lands to conquer."                 
 DATAW_ulstor_events.01011.opt.a.tooltip: "I am Maferath come again!"

