### CONSOLIDATING EDGEHALL ### DOWN

# EVENT 6     #Cleaning Up
 DATAW_ulstor_events.006.tit: "Cleaning Up"
 DATAW_ulstor_events.006.desc: "We have successfully consolidated our control over Edgehall and must now focus on rebuilding and developing the region. But before we rush too far ahead, our hoard has begun to grow quite large, and our steward has presented us with a proposal. A new Edgehall designed by us, to reflect our vision for the future. The question remains though, what are our plans for the future?"
 DATAW_ulstor_events.006.opt.a: "Rebuild Edgehall like a traditional Avvar Hall."
 DATAW_ulstor_events.006.opt.a.tooltip: "This will align us more with Avvar traditionalists."
 DATAW_ulstor_events.006.opt.b: "Renovate Edgehall to fit a more modern Clayne style."
 DATAW_ulstor_events.006.opt.b.tooltip: "This will allow us to integrate with the rest of Ferelden more easily." 
 DATAW_ulstor_events.006.opt.c: "Restore Edgehall to its original Dwarven construction."
 DATAW_ulstor_events.006.opt.c.tooltip: "While not the most obvious choice - and by far the most expensive - this will be the most unique and impressive option, and will show that we are not just another Dog Lord." 

# EVENT 6.01  #A NEW PATH
 DATAW_ulstor_events.00601.tit: "A New Path"
 DATAW_ulstor_events.00601.desc: "Edgehall is reborn! The people of my realm look to the future with hope. But I must always remain with my eye to the future. Should we focus on strengthening our economy, or preparing for future conflicts? Both options have their merits, and my council is divided."
 DATAW_ulstor_events.00601.opt.a: "We must prepare for conflict!"
 DATAW_ulstor_events.00601.opt.a.tooltip: "This will take us down a path of growing our military apparatus and leadership capabilities."
 DATAW_ulstor_events.00601.opt.b: "We must expand our economic base!"
 DATAW_ulstor_events.00601.opt.b.tooltip: "This will take us down a path of developing our trade and commerce." 

