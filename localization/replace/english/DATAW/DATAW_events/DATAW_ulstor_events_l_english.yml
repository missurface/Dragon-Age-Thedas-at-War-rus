############### WISE-WIND BELOW ##############
# EVENT 8.0     #The Wind at my Back
 DATAW_ulstor_events.008.tit: "The Wind at my Back"
 DATAW_ulstor_events.008.desc: "I have chosen kin over blood. Years of torment over my place, my father, are over. Why should I worry about who left my mother with son, when they never did anything for me? Why chase forevermore after an absentee father, when the one that cared for me most was not linked by blood at all? \n\n[stigandrdaddy.GetName] is the father I had, and I need no other. Now is the time for me to say goodbye to years of soul-searching, years of wandering and fighting, and it is time to take in the lessons he taught me. \n\n'Look at the commoners, son, and guide them like the wind. Through care, yet capable of strength when necessary. No matter their tongue, their blood or station, if you care for their lives and act for their prosperity, they will follow you to the highest of peaks.' \n\nNow, Edgehall is mine to rule, and I should do my best to apply the lessons of [stigandrdaddy.GetName]."
 DATAW_ulstor_events.008.opt.a: "Prosperity and stability shall come to Edgehall!"        
 DATAW_ulstor_events.008.opt.a.tooltip: "With your new lineage and your promises of peace, the lowlands expect you to rule with respect to the local Claynes, as well as developing your realm!"

# EVENT 8.1     #Wise Rule, Wise Diplomacy
 DATAW_ulstor_events.0081.tit: "Wise Rule, Wise Diplomacy"
 DATAW_ulstor_events.0081.desc: "As I manage my realm as best I can, I have begun looking inward to secure the prosperity of my people. But the words of [stigandrdaddy.GetName] still ring through my head. In order to offer my people peace and prosperity, I need to see more in their lives than a simple number to throw away in war. Unfortunately, hostilities with neighbouring Arls such as [trefirwisewindevents.GetName] will only fuel the soil with blood, and so I must find a way to appease things, at least for a while. \n\nRedcliffe, after our previous war, has been left in a rather dire state. While [redcliffeholderwisewind.GetName] no doubt doesn't hold me in [redcliffeholderwisewind.GetHerHis] heart, if I desire to offer peace to the region rather than war, proposing a truce could be a great step to take."
 DATAW_ulstor_events.0081.opt.a: "I will make the first step. Send the offer to a truce at once."        
 DATAW_ulstor_events.0081.opt.a.tooltip: "If Redcliffe accepts the offer, this could be a great step towards normalizing relations with the lowlanders."
 DATAW_ulstor_events.0081.opt.b: "Hatred between Edgehall and Redcliffe will not heal so quickly."        
 DATAW_ulstor_events.0081.opt.b.tooltip: "Old wounds do not close so easily, Redcliffe likely feels the same."





# EVENT 8.2     #The Call of Spirits
 DATAW_ulstor_events.0082.tit: "The Call of Spirits"
 DATAW_ulstor_events.0082.desc: "Edgehall - my hold. I've ruled from here for over a decade. Trying to guide my people along the principles my father [stigandrdaddy.GetName] tried to teach me. One of these lessons was to always heed the words of wisdom given to me by the wisemen and augurs of my clan. \n\nHowever, Edgehall is a diverse realm, and everyday I recieve conflicting information and advice from my spiritual advisors. [stigandrdaddy.GetName] [stigandrdaddy.GetHerselfHimself] follows the Cult of the Sky, a subset of Avvar that have dedicated themselves to the worship of the Lady of the Skies. Most of the populace of my realm however, are followers of the teachings of [andraste.GetName]. \n\nI've heard from the mouthpieces of various spirits, the question is, who has sway over my heart?" 
 DATAW_ulstor_events.0082.opt.a: "The faith of the mountains!"        
 DATAW_ulstor_events.0082.opt.a.tooltip: "Keep true to the spirits of my childhood!"
 DATAW_ulstor_events.0082.opt.b: "Stigandr had the right idea!"        
 DATAW_ulstor_events.0082.opt.b.tooltip: "Convert to the Lady's Cult, and spread her wings in an embrace over Edgehall!"
 DATAW_ulstor_events.0082.opt.c: "I must give way to the Maker!"        
 DATAW_ulstor_events.0082.opt.c.tooltip: "Convert to the Cult of the Maker, appeasing your subjects, but perhaps upsetting your vassals."




# EVENT 8.3     #Feel the Breeze
 DATAW_ulstor_events.0083.tit: "Feel the Breeze"
 DATAW_ulstor_events.0083.desc: "The breeze of change has once again swept through my hall. The courtroom is alive with talks of my reform efforts. Chitterings of tax policy, legal codes, and architectural reforms. The tongue they speak though... is quite different than the one from my youth in Far Peak. They still speak Avvarsk, but with a notable Clayne influence - perhaps brought in by the many native subjects I now rule. \n\nWith great joy I realize, this is what it means to lead as my father intended. People of all paths - former enemies even - coming together as one for a common cause."
 DATAW_ulstor_events.0083.opt.a: "Our people are now one and the same!"        
 DATAW_ulstor_events.0083.opt.a.tooltip: "A new hybrid culture has formed, with you as its head. #N Note #! - continue Ulstor's development of the realm through decisions."




# Event 8.01    #The Lowland Wind
 DATAW_ulstor_events.00801.tit: "The Lowland Wind"
 DATAW_ulstor_events.00801.desc: "It has been a few years since the start of my rule, and already changes can be seen in the region now known as Edgehall. People have mingled, traded and feasted in my realm, and now, a new base has been created, one that may end up as the future of my realm. \n\nThe Avvar that have accompanied me have settled and slowly adopted new habits under my gentle hand, and little by little, the people of Edgehall find themselves in a unique situation, separate from the Avvar of the Frostbacks and from the Clayne of Ferelden. \n\nNow, Edgehall sees its future in its people. The creation of a new culture, guiding the region like the wind. But most of all, where should the wind guide these new folks?"
 DATAW_ulstor_events.00801.opt.a: "Customs of forgiveness through service will benefit Edgehall as a whole."
 DATAW_ulstor_events.00801.opt.a.tooltip: "Grant clemency to our former foes."
 DATAW_ulstor_events.00801.opt.b: "The good deeds of [stigandrdaddy.GetName] will live on in this land."
 DATAW_ulstor_events.00801.opt.b.tooltip: "Lead our realm in a path of law and order."

#Event 8.4       #The Lowland Legend
 DATAW_ulstor_events.0084.tit: "The Lowland Legend"
 DATAW_ulstor_events.0084.desc: "Ulstor, the Wolf of the Highlands. By now, the story of my conquest of Edgehall from its former ruling family - the [dwarfsonlastname.GetHouse.GetName] - is little more than myth and legend. \n\nA full generation has come and gone since those days, and the people of the realm would no longer recognize the kingdom of their forefathers. \n\n'Tell us the story again Wolf!' - I hear nearly everytime I'm in the streets of Edgehall - 'tell us how you freed us from the tyranny of Luthias' spawn! \n\nThey seen to have competely forgotten or perhaps forgiven all my pasts transgressions, instead seeing me as a hero to aspire to."
 DATAW_ulstor_events.0084.opt.a: "Inspire them with tales from my past!"        
 DATAW_ulstor_events.0084.opt.a.tooltip: "It's time I recognized the change in times - teach them the lessons of my past."
 DATAW_ulstor_events.0084.opt.b: "Inspire them to be the leaders of the future!"        
 DATAW_ulstor_events.0084.opt.b.tooltip: "It's time I recognized the change in times - teach them lessons for the future."





############### WISE-WIND ABOVE ##################















############### SUN-WOLF BELOW ####################
#Event 11.0       #A Sun of My Own
 DATAW_ulstor_events.011.tit: "A Sun of My Own"
 DATAW_ulstor_events.011.desc: "Throughout these last years, I have consolidated Edgehall, and my rule over it has become right. I have asserted my lineage as a Sun-Wolf and shaped my destiny, but there is still one last thing that weighs heavily on my mind. What force has fueled my strength, for it is not only my hand that guides my axe. I've always followed my own path and believed in my own ability, but with the birth of my children, I feel a longing for the divine. \n\nAs I reflect on my triumphs, I see now that I've been guided, but by whom?"
 DATAW_ulstor_events.011.opt.a: "I am blessed by the Maker's Light!"        
 DATAW_ulstor_events.011.opt.a.tooltip: "You realize what guides you, the light of the Maker and the love of Andraste."
 DATAW_ulstor_events.011.opt.b: "I am favored by the gods of our ancestors!"        
 DATAW_ulstor_events.011.opt.b.tooltip: "You realize what guides you, the power of Korth, the Lady, Hakkon, and the spirits."

#Event 11.1       #Axe of the Maker
 DATAW_ulstor_events.0111.tit: "Axe of the Maker"
 DATAW_ulstor_events.0111.desc: "I see now as clearly as the day I sat my throne. Each stride, each arc of my axe, every hard-won victory has drawn me nearer to the Maker's sacred truth. I realize that when I set out to find myself, it was Andraste who guided me. For in my glory, the Maker's light shines upon this world. \n\nI see the conviction the Clayne carry for their creator, and know it is resolute. I urge my clan to join me in my absolution, Andraste has called upon us all to spread the chant of light to our kindred, to our home of mountain and sky. \n\nThe people clamor for war, and the call to spread her holy chant echoes through the land. Perhaps we could use this fervor to our advantage and press into the Frostbacks and claim my father's hold?\n\n(Check Decisions for the next step of Ulstor's journey)."
 DATAW_ulstor_events.0111.opt.a: "I will be the Maker's Will!"       
 DATAW_ulstor_events.0111.opt.a.tooltip: "You declare yourself the will of the Maker, spreading the chant of light to your people!"
 DATAW_ulstor_events.0111.opt.b: "I will be the Maker's Wrath!"        
 DATAW_ulstor_events.0111.opt.b.tooltip: "You declare yourself the wrath of the Maker, becoming the force that spreads his light!"

#Event 11.2       #Spirits of our Ancestors
 DATAW_ulstor_events.0112.tit: "Spirits of our Ancestors"
 DATAW_ulstor_events.0112.desc: "Korth, the Lady, Hakkon, the spirits, and my ancestors have always accompanied me, even when I lost sight of them early in my wandering. Their presence has been my strength, their memory, the fire that drove me to lead my people back to Belanas. \n\nOnly now do I truly understand. This land has lingered too long beneath the eye of the Maker. It's time for our gods to return and once again hold dominion over these lowlands. A new era must begin for Tyrdda's children, with me at its head. \n\nMy closest advisors have counseled me that the best course of action to achieve these aims is to bring in the might of the old clans of the Frostbacks. The drums of war beat in the distance, and the call to reclaim our ancestral lands echoes through the valleys. \n\n(Check Decisions for the next step of Ulstor's journey)."
 DATAW_ulstor_events.0112.opt.a: "I will be the hand of their dominance!"       
 DATAW_ulstor_events.0112.opt.a.tooltip: "You declare yourself the hand of the gods' dominance, becoming the force of their will!"
 DATAW_ulstor_events.0112.opt.b: "I will be the hand of their benevolence!"        
 DATAW_ulstor_events.0112.opt.b.tooltip: "You declare yourself the hand of the gods' benevolence, spreading their favor to your people!"

#Event 11.3       #Demesne of the Wolf
 DATAW_ulstor_events.0113.tit: "Demesne of the Wolf"
 DATAW_ulstor_events.0113.desc: "The hour has come to breathe life into my ensuing ambitions. My council and I have begun deliberating the next phase of Edgehall's legacy. With newfound credence of faith, we have marked Sunhold, the home of my father and my recent conquest. I descend from the Sun-Wolf, and as the son of Warg Grimmornsen, I recognize that to establish rule over the Frostbacks and lead the Avvar into a new era, I must dominate where the wolf den lies. \n\nI have returned to the land that forged my mark, Wolf-Hand. It is only right that I begin here, where my legend was born, to stake my claim over the Frostbacks."
 DATAW_ulstor_events.0113.opt.a: "We shall rule directly!"       
 DATAW_ulstor_events.0113.opt.a.tooltip: "Rule Sunhold with an iron grip, increasing your control over it but upsetting the local clans."
 DATAW_ulstor_events.0113.opt.b: "Install my newfound kin!"        
 DATAW_ulstor_events.0113.opt.b.tooltip: "Install your new kin the Sun-Wolf as jarls over Sunhold, gaining powerful allies but causing differing reactions from the local clans."

#Event 11.31       #A Path for our People?
 DATAW_ulstor_events.01131.tit: "A Path for our People?"
 DATAW_ulstor_events.01131.desc: "For years, the Avvar and Clayne of Edgehall have shared my rule and their lives. I have seen firsthand a new people take shape, who meld the two into a new way of life. Traditions and tales flow between us, and our lives become woven together. \n\nTime heals all wounds, and now we stand not as two peoples, but as one united clan. With the lands of Sunhold secured, our new customs are spreading into the Frostbacks, strengthening my influence over it. At the same time however, old traditions are finding it easier to make their way into the lowlands strengthening some people's convictions in the old ways. \n\nShould I lean into these old ways, or try to guide my people towards a new more Clayne way of life?"
 DATAW_ulstor_events.01131.opt.a: "We must look to the past..."       
 DATAW_ulstor_events.01131.opt.a.tooltip: "(look to decisions to continue your journey)"
 DATAW_ulstor_events.01131.opt.b: "The future is where our path is headed!"        
 DATAW_ulstor_events.01131.opt.b.tooltip: "(look to decisions to continue your journey)"



#Event 11.6         #Holds of Stone and Sorcery
 DATAW_ulstor_events.0116.tit: "Holds of Stone and Sorcery"
 DATAW_ulstor_events.0116.desc: "The bleeding heart of the Frostbacks has fallen to the might of my armies. Here, the land has long been inhabited by clans of powerful mages. Its ancient history, marked by bloodshed and enigma, has diminished the Lady's favor in the region. We must be vigilant against threats beyond our most recent enemies - now subjects. My warriors must steel themselves not only for battle, but for the unknown magic and lurking threats that haunt the shadows if I am to reign over the region. However, my expertise lies in combat and strategy; I know little of sorcery..."
 DATAW_ulstor_events.0116.opt.a: "Look to the local augurs for guidance!"       
 DATAW_ulstor_events.0116.opt.a.tooltip: "Surely the traditions of this region can continue to guide us?"
 DATAW_ulstor_events.0116.opt.b: "Ask our strongest thanes to establish our authority!"        
 DATAW_ulstor_events.0116.opt.b.tooltip: "The only way to peace is strength."
 DATAW_ulstor_events.0116.opt.c: "Direct rule is the only way to impart order on these hedge mages!"        
 DATAW_ulstor_events.0116.opt.c.tooltip: "Show these locals that we are here to stay, and that there is only one authority in the Frostbacks."

#Event 11.61        #To the Edge of the World
 DATAW_ulstor_events.01161.tit: "To the Edge of the World"
 DATAW_ulstor_events.01161.desc: "The western holds have given way to my rule. These lands are quite different from what I am accustomed to. Where their eastern counterparts were once highly interconnected with the Ferelden Valley that bordered it, these holds knew no such diplomacy. As a result, a strong sense of fierce independence has taken root in the peoples living on this side of the Frostbacks. However, such independence was surely meant to end sooner or later..."
 DATAW_ulstor_events.01161.opt.a: "The wisest thanes must be consulted!"       
 DATAW_ulstor_events.01161.opt.a.tooltip: "To manage this region effectively, we must seek the counsel of its most experienced leaders."
 DATAW_ulstor_events.01161.opt.b: "Only those that prove their worth can lead!"        
 DATAW_ulstor_events.01161.opt.b.tooltip: "Only the most capable leaders should be given the chance to govern."
 DATAW_ulstor_events.01161.opt.c: "There is but one authority in the Frostbacks!"        
 DATAW_ulstor_events.01161.opt.c.tooltip: "Skyhold must be brought to heel, and the people must understand that we are here to stay!"





#Event 11.7         #A New Sun on the Frostbacks
 DATAW_ulstor_events.0117.tit: "A New Sun on the Frostbacks"
 DATAW_ulstor_events.0117.desc_1: "I, Ulstor Skuldsen, have united the Avvar under my rule alone. All clans now rallied beneath a single banner. What no thane dared to dream, I have made real. When I marched on Edgehall all those years ago, I could not foresee where my path would take me or the glory that awaited. Through countless battles, I led my warriors as hold after hold yielded or fell, and now the skalds will immortalize my name in song. \n\nThe Maker's light has lifted me to the summit of greatness, and the mountains will bask in his warmth. A new dawn rises over the Frostbacks and its people. My legend will spread throughout all of Thedas, for I am the first King of the Avvar, the Thane of Thanes. I am Wolf-Hand!"
 DATAW_ulstor_events.0117.desc_2: "I, Ulstor Skuldsen, have united the Avvar under my rule alone. All clans now rallied beneath a single banner. What no thane dared to dream, I have made real. When I marched on Edgehall all those years ago, I could not foresee where my path would take me or the glory that awaited. Through countless battles, I led my warriors as hold after hold yielded or fell, and now the skalds will immortalize my name in song. \n\nKorth, the Lady, and Hakkon have lifted me to the summit of greatness, and the mountains will forever have their favor. A new dawn rises over the Frostbacks and its people. My legend will spread throughout all of Thedas, for I am the first King of the Avvar, the Thane of Thanes. I am Wolf-Hand!"
 DATAW_ulstor_events.0117.opt.a: "May my kingdom shine forever!"       
 DATAW_ulstor_events.0117.opt.a.tooltip: "You have brought the Avvar together and declared your legend as the cornerstone for a realm that will endure through the ages!"






