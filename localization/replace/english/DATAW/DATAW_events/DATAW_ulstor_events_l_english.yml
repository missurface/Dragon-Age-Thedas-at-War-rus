# EVENT 3.4   #A Response to the Konungr's Message (nice branch) haven
 DATAW_ulstor_events.0034.tit: "An Offer from Edgehall"
 DATAW_ulstor_events.0034.desc: "We have recieved a message from the new Konungr of Edgehall - Ulstor Wolfhand. The message offers us special economic grants in exchange for our submission. He promises to send respected Avvar craftsman to our lands. In exchange we are to submit to his authority, and send a contingent of our able-bodied men to serve in his shieldwall."
 DATAW_ulstor_events.0034.opt.a: "Accept Edgehall's Offer"
 DATAW_ulstor_events.0034.opt.a.tooltip: "Accept the offer of economic grants from Edgehall."
 DATAW_ulstor_events.0034.opt.b: "Reject Edgehall's Offer"
 DATAW_ulstor_events.0034.opt.b.tooltip: "Reject the presumptive offers of Edgehall."

