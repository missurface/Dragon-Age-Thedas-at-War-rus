#Council Elective Succession
 council_elective_succession_law: "Council Elective"
 council_elective_succession_law_subname: "Council"
 council_elective_succession_law_effects: "The [ruler|E] and all [de_jure|E] [vassals|E] can nominate a [title_heir|E] amongst the ruler's [dynasty|E] and any available [claimants|E]. [voting_power|E] in this [succession_law|E] is influenced by the [elector|E]'s total [domain|E] [county_development|E] and [capital|E] [county_opinion|E]. Vassals will tend to favor older candidates over the young."
 council_elective_candidates: "Claimants, Dynasty"
 council_elective_candidates_tooltip: "In order to be a valid Candidate for the Council, a character must fulfill one of the following conditions:\n$EFFECT_LIST_BULLET$Be a member of the ruling dynasty, who is not in line to inherit a Theocracy or Republic\n$EFFECT_LIST_BULLET$Be a [claimant|E] to the title, who is not in line to inherit a Theocracy or Republic."
 council_elective_electors: "All De Jure Vassals"
 council_elective_electors_tooltip: "In order to be a valid [elector|E] for the Council, a vassal must fulfill all the following conditions:\n$EFFECT_LIST_BULLET$Be a [de_jure|E] vassal of the title\n$EFFECT_LIST_BULLET$Be a direct vassal of the title\n$EFFECT_LIST_BULLET$Be Adult\n$EFFECT_LIST_BULLET$NOT be Incapable"
