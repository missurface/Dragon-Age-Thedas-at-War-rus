l_english:
 DATAW_orlesian_elective_candidates: "Claimants, Close Family, Dynasty"
 DATAW_orlesian_elective_candidates_tooltip: "In order to be a valid Candidate under Orlesian Elective, a [character|E] must fulfill one of the following conditions:\n$EFFECT_LIST_BULLET$Be a [legitimate|E] [close_family|E] member of the current [ruler|E], who is not in line to inherit a [theocracy|E] or [republic|E]. [children|E] of a candidate cannot be nominated\n$EFFECT_LIST_BULLET$Be a [claimant|E] to the title, who is not in line to inherit a [theocracy|E] or [republic|E]\n$EFFECT_LIST_BULLET$Be a valid [legitimate|E] member of the [ruler|E] [dynasty|E], who is not in line to inherit a [theocracy|E] or [republic|E]"
 DATAW_orlesian_elective_electors: "Emperor, Powerful Vassals, Landed Family"
 DATAW_orlesian_elective_electors_tooltip: "In order to be a valid [elector|E] under Orlesian Elective, a vassal must fulfill all the following conditions:\n$EFFECT_LIST_BULLET$Be a [de_jure|E] vassal of the [title|E]\n$EFFECT_LIST_BULLET$Be a [powerful_vassal|E] of the [title|E]\n$EFFECT_LIST_BULLET$Be only one or two [ranks|E] below the [title|E]\n$EFFECT_LIST_BULLET$Or be [landed|E] member of the [ruler|E] [family|E]\n$EFFECT_LIST_BULLET$Or if Council of Heralds was created hold one of the hereditary member [titles|E] "

