 trait_education_magic_1: "Inept Mage"
 trait_education_magic_1_desc: "The Inept Mage has a natural connection to the Fade but needs training to use their powers."
 trait_education_magic_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] has a natural connection to the Fade but needs training to use [ROOT.GetCharacter.GetHerHis] powers."
 trait_education_magic_2: "Apprentice Magician"
 trait_education_magic_2_desc: "The Apprentice Magician can conjure simple magic, enough to entertain or frighten, but more education is needed before they can wield their magic safely."
 trait_education_magic_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] can conjure simple magic, enough to entertain or frighten, but more education is needed before [ROOT.GetCharacter.GetSheHe] can wield [ROOT.GetCharacter.GetHerHis] magic safely."
 trait_education_magic_3: "Harrowed Mage"
 trait_education_magic_3_desc: "The Harrowed Mage has mastered their connection to the Fade and their control over the powers within."
 trait_education_magic_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] has mastered [ROOT.GetCharacter.GetHerHis] connection to the Fade and [ROOT.GetCharacter.GetHerHis] control over the powers within."
 trait_education_magic_4: "Senior Enchanter"
 trait_education_magic_4_desc: "The Senior Enchanter is a force to be reckoned with; they have trained for years to be in full control of their powers and a master at wielding them when needed."
 trait_education_magic_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a force to be reckoned with; [ROOT.GetCharacter.GetSheHe] has trained for years to be in full control of [ROOT.GetCharacter.GetHerHis] powers and is a master at wielding them when needed."
 trait_education_magic_5: "Fade-Touched Archmage"
 trait_education_magic_5_desc: "The Fade-Touched Archmage is a rarity even amongst the most senior of mages, their strong connection to the Fade allows them to cast magic without much effort, almost as natural as breathing."
 trait_education_magic_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a rarity even amongst the most senior of mages, [ROOT.GetCharacter.GetHerHis] strong connection to the Fade allows them to cast magic without much effort, almost as natural as breathing."