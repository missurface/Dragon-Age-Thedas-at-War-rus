# To Touch the Sky
# By Rislav
##########################

 to_touch_the_sky_decision:0 "To Touch the Sky"
 to_touch_the_sky_decision_desc:0 "We've established ourselves as the new overlord of the western Frostbacks. We must bring them in line with our rule."
 to_touch_the_sky_decision_confirm:0 "Divy up the spoils!"
 to_touch_the_sky_decision_tooltip:0 "Decide how to rule your new lands with the help of your council."


###########################
# Howls over the Mountains
# By Varren / Rislav
###########################

 howls_over_the_mountains_decision:0 "Howls over the Mountains"
 howls_over_the_mountains_decision_desc:0 "From the northern peaks to the southern basin, the name Wolf-Hand echoes; every hold feels the impact of my glory. Through word and axe I have pressed on until the mountains bowed to me alone. Now, I will fulfill my destiny and unite the Avvar and lead them into a bright future. The end is within reach; my council and I must gather and determine our ultimate fate."
 howls_over_the_mountains_decision_confirm:0 "The Wolf-Hand is the true King of the Frostbacks!"
 howls_over_the_mountains_decision_tooltip:0 "Consolidate your hold on the Frostbacks!"


##########################
# Burning the Bannorn
# By Rislav
##########################

 burning_the_bannorn_decision:0 "Burning the Bannorn"
 burning_the_bannorn_decision_desc:0 "The petty banns of the Bannorn have fallen. Where once were hundreds of squabbling clans, now lie my handpicked thanes and jarls. Once again, my mighty host grows, and the hunger for new lands grows with it."
 burning_the_bannorn_decision_confirm:0 "Let the flames consume their defiance!"
 burning_the_bannorn_decision_tooltip:0 "Decide how to deal with the rebellious Bannorn."

##########################
# Harrying the Hills
# By Rislav
##########################

 harrying_the_hills_decision:0 "Harrying the Hills"
 harrying_the_hills_decision_desc:0 "Ferelden's strategic heart has always been the its Southron Hills, caught between the numorous conflicts of the region. Now, it lies in our hands."
 harrying_the_hills_decision_confirm:0 "Let the flames consume their defiance!"
 harrying_the_hills_decision_tooltip:0 "Decide how to deal with the rebellious Bannorn."

##########################
# An Ancient Territory
# By Rislav
##########################

 an_ancient_territory_decision:0 "An Ancient Territory"
 an_ancient_territory_decision_desc:0 "Long ago, the Avvar were not constrained to the Frostbacks, but roamed the lands of Ferelden freely. Now, we have returned to long lost lands of ours, and it is time we reclaim them."
 an_ancient_territory_decision_confirm:0 "Has the vigil been kept?"
 an_ancient_territory_decision_tooltip:0 "Do the people still remember the old ways?"

##########################
# Into the Hinterlands
# By Rislav
##########################

 into_the_hinterlands_decision:0 "Into the Hinterlands"
 into_the_hinterlands_decision_desc:0 "Redcliffe has long been considered the gateway to the rest of Ferelden, now that we have taken it, the rest of the lowlands is ripe for the taking."
 into_the_hinterlands_decision_confirm:0 "Ferelden is ours."
 into_the_hinterlands_decision_tooltip:0 "The old enemy is no more."

##########################
# Breaking the Brecilian
# By Rislav
##########################

 breaking_the_brecilian_decision:0 "Breaking the Brecilian"
 breaking_the_brecilian_decision_desc:0 "The Brecilian Forest has long been a thorn in our side - home of wildmen making blood sacrifices to trees. No longer."
 breaking_the_brecilian_decision_confirm:0 "Burn them out."
 breaking_the_brecilian_decision_tooltip:0 "The forest falls before us."

##########################
# Gutting Gwaren
# By Rislav
##########################

 gutting_gwaren_decision:0 "Gutting Gwaren"
 gutting_gwaren_decision_desc:0 "The city of Gwaren has a similar history to that of Edgehall, an alamarri town heavily influenced by that of its underground neighbors. Nowadays though, it is little more a collection of fishing huts and family farms."
 gutting_gwaren_decision_confirm:0 "What now of Gwaren?"
 gutting_gwaren_decision_tooltip:0 "Oh - to hear the sea call..."

##########################
# Winter Falls on Denerim
# By Rislav
##########################

 winter_falls_on_denerim_decision:0 "Winter Falls on Denerim"
 winter_falls_on_denerim_decision_desc:0 "The great city of Denerim, once the pearl of Ferelden, has been subsumed by the our cold grasp."
 winter_falls_on_denerim_decision_confirm:0 "Drakon or Danesen, it makes no difference now."
 winter_falls_on_denerim_decision_tooltip:0 "An old rival falls."

##########################
# Bloodlust Sated
# By Rislav
##########################

 bloodlust_sated_decision:0 "Bloodlust Sated"
 bloodlust_sated_decision_desc:0 "All of Ferelden is mine, the Clayne cower in fear. All that remains now is what to do with the ashes."
 bloodlust_sated_decision_confirm:0 "The Wolf-Hand is the true King of Ferelden!"
 bloodlust_sated_decision_tooltip:0 "The beginning of a new era."



#Caedmon Stuff
##########################
# The Crown of Ferelden
# By Rislav / Rei
##########################

 crown_of_ferelden_decision:0 "The Crown of Ferelden - Caedmon's Path"
 crown_of_ferelden_decision_desc:0 "Ferelden is mine to claim, and none of my rivals have the strength to contest me. It is time to forge a crown worthy of the true King of Ferelden and be recognized as such."
 crown_of_ferelden_decision_confirm:0 "I am the true King of Ferelden!"
 crown_of_ferelden_decision_tooltip:0 "Take the crown and crown yourself as the true King of Ferelden."
 crown_of_ferelden_custom_tooltip:0 "You will crown yourself 'king' of Ferelden."
 crown_of_ferelden_custom_tooltip_2:0 "Your neighbors may start to plan your downfall."
 fereldennotheldtooltip:0 "The Kingdom of Ferelden must not be held by anyone else to take this decision."
 crown_of_ferelden_decision_generic:0 "The Crown of Ferelden"
 crown_of_ferelden_decision_generic_desc:0 "Ferelden is mine to claim, and none of my rivals have the strength to contest me. It is time to forge a crown worthy of the true [ROOT.Char.Custom('GetQueenKing')] of Ferelden and be recognized as such."
 crown_of_ferelden_decision_generic_confirm:0 "I am the true [ROOT.Char.Custom('GetQueenKing')] of Ferelden!"
 crown_of_ferelden_decision_generic_tooltip:0 "Take the crown and crown yourself as the true [ROOT.Char.Custom('GetQueenKing')] of Ferelden."
 crown_of_ferelden_custom_tooltip:0 "You will crown yourself ruler of Ferelden."
 crown_of_ferelden_custom_tooltip_2:0 "Your neighbors may start to plan your downfall."

##########################
# Westward March
# Rislav / Rei
##########################

the_westward_march_decision:0 "The Westward March"
the_westward_march_decision_desc:0 "A unified Ferelden would be incomplete without the Bannorn, its breadbasket. These lands will provide much to our army in way of supplies and hearty soldiers, both needed for our advance further southward and westward."
the_westward_march_decision_confirm:0 "Now on to Redcliffe!"
the_westward_march_decision_tooltip:0 "With Ferelden's heartland secured, we can now venture into the wilder parts of the land."


##########################
# The Fate of Ferelden
# Rislav / Rei
##########################

the_fate_of_ferelden_decision:0 "The Fate of Ferelden"
the_fate_of_ferelden_decision_desc:0 "Castle Redcliffe stands tall, guarding the lowlands from threats to its west and south. The Hinterlands, which it protects, is the sole land route into Ferelden, making it vital for both defense and trade. With the majority of the Clayne now united under my banner. We stand strong and prepared to face whatever befalls us next."
the_fate_of_ferelden_decision_confirm:0 "The fate of Redcliffe is the fate of all Ferelden."
the_fate_of_ferelden_decision_tooltip:0 "If we are to defend the center, we must hold the edge."

##########################
# A Unified Ferelden
# Rislav / Rei
##########################

a_unified_ferelden_decision:0 "The End of the Road"
a_unified_ferelden_decision_desc:0 "Almost all of Ferelden has given way to my will. All that remains now is what lies to the west of Lake Calenhad. Edgehall has fallen to Avvar warlords, and Portsmouth lies ripe for the taking."
a_unified_ferelden_decision_confirm:0 "They too, shall bend the knee."
a_unified_ferelden_decision_tooltip:0 "Ferelden will be mine."

##########################
# Ancestral Amaranthine
# Rislav / Rei
##########################

ancestral_amaranthine_decision:0 "Ancestral Amaranthine"
ancestral_amaranthine_decision_desc:0 "Amaranthine is a place of import for all Alamarri. It was here blessed Andraste first revealed the Chant and the faithful assembled to march on the Imperium - any king must have it as the jewel of his kingdom."
ancestral_amaranthine_decision_confirm:0 "The North belongs to me."
ancestral_amaranthine_decision_tooltip:0 "Lay claim to your 'birthright' in Amaranthine, however tenous it may be."

###############################################
# Restore the Imperial Treasures to the Court
# Valo Toran / Reside
###############################################

restore_imperial_treasures_decision:0 "Restore the Imperial Treasures to the Court"
restore_imperial_treasures_decision_desc:0 "Ever since the Sack of Val Royeaux, the artefacts left by the First Emperor and the First Divine have been left in an uncertain state. Now that the capital and its artifacts have been reclaimed in times of peace, it is time for the Empire of Orlais to restore those priceless objects to their rightful place beside the Sunburst Throne."
restore_imperial_treasures_decision_confirm:0 "All hail the Empire!"
restore_imperial_treasures_decision_tooltip:0 "The stolen treasures will be restored!"
restore_imperial_treasures_decision_custom_desc:0 "Place all the relics within the tomb to earn a new nickname, as well as large amounts of prestige and legitimacy. If you have Kordillus' Ashes, you will earn a new legend seed in addition to the other rewards."

##########################################
# Integrate Brecilian Forest into Gwaren
# Cairo/
###########################################
DATAW_integrate_brecilian_forest_decision:0 "Bring the Forest to Heel"
DATAW_integrate_brecilian_forest_decision_desc:0 "For as long as can be remembered, our traders have faced constant harrassment by forest savages as they made the journey through the pass from Gwaren to the rest of Ferelden. Now, with the complete subjugation of the forests, we have an opportunity to integrate these lands into our realm forevermore by giving [GetTitleByKey('k_gwaren').GetBaseNameNoTier] stewardship over the area."
DATAW_integrate_brecilian_forest_decision_confirm:0 "The forest falls silent"
DATAW_integrate_brecilian_forest_decision_tooltip:0 "Lands of [GetTitleByKey('k_brecilian_forest').GetBaseNameNoTier] become a [de_jure|E] part of the [GetTitleByKey('k_gwaren').GetName]"

################################################
# Integrate Hinterlands into Korcari Wilds     #
################################################
DATAW_korcari_conquest_of_hinterlands_decision:0 "Beyond the Wilds"
DATAW_korcari_conquest_of_hinterlands_decision_desc:0 "In times long past, our people moved freely between the Wilds and the Hinterlands. But the construction of Ostagar unnaturally cut our people off from this fertile land and the dreaded [GetScriptedCharacterByHistoryID('alamarri0202').GetFirstName] rebuffed our attempt to reclaim our ancestral lands during the Second Blight. With our realm's current gains in the region, we stand in position to right an ancient wrong and finally refute the Clayne claim once and for all."
DATAW_korcari_conquest_of_hinterlands_decision_confirm:0 "The Hinterlands have a new master!"
DATAW_korcari_conquest_of_hinterlands_decision_tooltip:0 "Lands of [GetTitleByKey('k_hinterlands').GetBaseNameNoTier] become a [de_jure|E] part of the [GetTitleByKey('k_korcari_wilds').GetBaseNameNoTier]"

#################################################
# Elven Brecilian Forest Decision 1 CAIRO
###################################################
DATAW_unite_brecilian_forest_elvhen_decision:0 "A New Home for the Elvhen"
DATAW_unite_brecilian_forest_elvhen_decision_desc:0 "We elves have always been in a precarious state, ever since the fall of Arlathan and our subsequent enslavement at the hand of the Magisters. We lost our tongue, our culture and belief, and it is only through Shartan’s revolt and subsequent participation in Andraste's Exalted March that we received the Dales. Yet our situation is still precarious. \n\n#!In the [GetTitleByKey('k_brecilian_forest').GetBaseNameNoTier], the veil is thin, and the trees are wild, just like Arlathan. If it was rid of the native barbarians, we could claim it as our own to shore up our precarious position."
DATAW_unite_brecilian_forest_elvhen_decision_confirm:0 "Here, a new realm of the elves shall emerge"
DATAW_unite_brecilian_forest_elvhen_decision_tooltip:0 "Form a new home for the [GetCulturePillar('heritage_elvhen').GetName] in the [GetTitleByKey('k_brecilian_forest').GetBaseNameNoTier]"
elvhen_brecilian_ruler_tt:0 "All rulers in [GetTitleByKey('k_brecilian_forest').GetBaseNameNoTier] have a culture with [GetCulturePillar('heritage_elvhen').GetName] [heritage|E]"

#########################################################
# Elven Brecilian Forest Decision 2
#########################################################
DATAW_consolidate_brecilian_forest_elvhen:0 "In the Image of Our Forefathers"
DATAW_consolidate_brecilian_forest_elvhen_desc:0 "We may have created a new home in the land of the [GetTitleByKey('k_brecilian_forest').GetBaseNameNoTier], but our dreams of reclaiming what has been lost remains unfulfilled. The forest remains wild and untamed. Meanwhile, our cultural dominance over the forest has not yet been fully realized. If we wish to lay claim to our ancestors' mantle in truth, we must ensure our new endeavor is established on a solid foundation. Only then can the work of reclaiming what was lost at Arlathan commence."
DATAW_consolidate_brecilian_forest_elvhen_confirm:0 "Consolidate the new elven kingdom"
DATAW_consolidate_brecilian_forest_elvhen_tooltip:0 "The Resting Wood is now our home"
DATAW_consolidate_elvhen_county_culture_tt:0 "All [counties|E] in the [GetGeographicalRegion('world_ferelden_brecilian_forest').GetName] have a culture with a [GetCulturePillar('heritage_elvhen').GetName] [heritage|E]"
DATAW_consolidate_elvhen_county_religion_tt:0 "All [counties|E] in the [GetGeographicalRegion('world_ferelden_brecilian_forest').GetName] follow a [GetReligionByKey('elven_paganism_religion').GetAdjective] faith or are [GetFaithByKey('dalish_chantry').GetName]"
DATAW_consolidate_elvhen_county_religion_partial_tt:0 "At least 60% of [counties|E] in the [GetGeographicalRegion('world_ferelden_brecilian_forest').GetName] follow a [GetReligionByKey('elven_paganism_religion').GetAdjective] faith or are [GetFaithByKey('dalish_chantry').GetName]"
DATAW_consolidate_elvhen_county_culture_partial_tt:0 "At least 70% of [counties|E] in the [GetGeographicalRegion('world_ferelden_brecilian_forest').GetName] have a culture with a [GetCulturePillar('heritage_elvhen').GetName] [heritage|E]"
DATAW_co_existance_brecilian_elvhen_tt:0 "You have chosen to coexist with the Brecilians"