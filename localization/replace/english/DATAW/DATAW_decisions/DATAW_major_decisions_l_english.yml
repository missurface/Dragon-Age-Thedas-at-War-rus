 where_the_wolf_den_lies_decision:0 "Where the Wolf Den Lies..."
 where_the_wolf_den_lies_decision_desc:0 "Home is where the heart is, but this wolf has known no such thing. Now that my rule shows promise upon which I could launch a future campaign, I must resolve inner conflicts before I can fully commit myself to the cause."
 where_the_wolf_den_lies_decision_confirm:0 "Where is my true home?"
 where_the_wolf_den_lies_decision_tooltip:0 "Delve into your past and find out who you are."

