 consolidating_edgehall_decision:0 "Consolidating Edgehall"
 consolidating_edgehall_decision_desc:0 "With the recent acquisition of Edgehall, there is much work to be done to consolidate our hold on the region. The people of Edgehall are loyal to their new liege, but there are still many holdfasts and castles in the region that need to be brought under our control. We must send out ravens to the various holdfasts in the region, and let them know that they are now under our protection, and that they should swear fealty to us as their new liege."
 consolidating_edgehall_decision_confirm:0 "Consolidate your hold on Edgehall!"
 consolidating_edgehall_decision_tooltip:0 "Consolidate your hold on Edgehall!"

