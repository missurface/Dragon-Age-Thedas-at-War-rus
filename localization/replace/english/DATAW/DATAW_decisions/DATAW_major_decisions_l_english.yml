# They Shall Fear my Name!
# By Rislav
#########################

 they_shall_fear_my_name_decision:0 "They Shall Fear my Name!"
 they_shall_fear_my_name_decision_desc:0 "Portsmouth has fallen to the Wolf of the Lowlands, and the people have seen the power of my name. Now, I must decide how to use this newfound respect to further my goals."
 they_shall_fear_my_name_decision_confirm:0 "Stamp my name into the land!"
 they_shall_fear_my_name_decision_tooltip:0 "Portsmouth shall be the first of many to fall under the shadow of your name."

