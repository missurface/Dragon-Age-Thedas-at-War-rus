 # Unifying the Avvar, by Terra Game

 DATAW_unify_avvar_kingdom_decision:0 "Unite the Children of Tyrdda Bright-Axe"
 DATAW_unify_avvar_kingdom_decision_confirm:0 "Once again, the lands of the Avvar reach Belenas."
 DATAW_unify_avvar_kingdom_decision_desc:0 "For centuries, we have followed the path of the eldest of Elders, the Avvar-Mother. Like her, we fight against our soft cousins of the east who accepted a foreign faith, while we stayed true to our roots. However, the divisions among the various clans meant that we rarely could bring about a united front against the Claynes. Now, it is time to show to Thedas that the Avvars are united and strong, united under a faith that is theirs and theirs alone! Edgehall and the Frostbacks, starting now, will now only be seen as one. The lands of the Clans. The lands of the Avvars."
 DATAW_unify_avvar_kingdom_decision_tooltip:0 "The Avvar are united as one."
 DATAW_unify_avvar_kingdom_decision_effect_tooltip:0 "The Avvar are united as one"

 major_decisions.2441.t:0 " A Thane of Thanes"
 major_decisions.2441.desc:0 "For once, the final word does not come from a Thane.\n\nFor centuries, the Thane as been the final authority on everything, in every clan that has ever seen the Frostbacks and beyond. \n\nToday, this universal truth is broken.\n\nFor I, [ROOT.Char.GetName], have erected myself above all other clans, all other Thanes, and I am now the one that has the final word on everything, for I am a Thane of Thanes.\n\nIn the name of Korth the Mountain-Father, the Lady of the Skies and Hakkon Wintersbreath, I have now united their domain and although nothing is permanent, the tale of the Thane-of-Thanes shall be counted by the Elders for ages to come."
 major_decisions.2441.a:0 "Long may live the united clans! Long live the Avvars!"

 # Unifying the Avvar as a maker follower, by Terra Game

 DATAW_unify_avvar_kingdom_maker_decision:0 "Unite the Children of Tyrdda Bright-Axe"
 DATAW_unify_avvar_kingdom_maker_decision_confirm:0 "Blessed are the peacekeepers, the champions of the just."
 DATAW_unify_avvar_kingdom_maker_decision_desc:0 "For centuries, we have followed the path of the eldest of Elders, the Avvar-Mother. Like her, we fight against our soft cousins of the east who stayed in the lowlands, while we thrived in the mountains. However, the divisions among the various clans and our unique faith meant that we rarely could bring about a united front against the Claynes, and it led to our isolation from the rest of Thedas. If we are to survive in the coming centuries without becoming subjects of a foreigner, it is a necessity that some parts of our culture change so that the rest survives. and so we shall unite the Frostbacks and Edgehall into one, for The Maker and Andraste. For she, Maferath and her Divine Husband showed the light to all Thedas, and we shall follow their will."
 DATAW_unify_avvar_kingdom_maker_decision_tooltip:0 "The Avvar are united as one."
 DATAW_unify_avvar_kingdom_maker_decision_effect_tooltip:0 "The Avvar are united as one"

 major_decisions.2442.t:0 "The Maker's Mountains"
 major_decisions.2442.desc:0 "Faith and culture always meant the same thing among the Avvars.\n\n Tales of Tyrdda Bright-Axe leading her clan into the mountains, tales of the eagle finding Korth's heart in the treacherous Frostbacks. The tales of the gods and the Avvar people have always been told side by side, mingling with each other until they were one and the same. \n\n Today, this fact must change.\n\n Our worship of the gods have left us completely isolated, a target hated by all but ourselves. If we are to survive, we have to change, and we must follow what one of our own, Maferath, once did, and follow The Maker and his Bride. \n\n Today, the Avvars are united as one, Hen Wlad Fy Nhadau not for the glory of the Lady of the Skies, not for Hakkon Wintersbreath, but for The Maker and His bride.\n\n "Despair not, said She, for your betrayal was Maker-blessed and returned me to His side.""
 major_decisions.2442.a:0 "I am forgiven."

 # Unifying the Chasind, by Terra Game

 DATAW_unify_chasind_kingdom_decision:0 "Unify the Chasind"
 DATAW_unify_chasind_kingdom_decision_confirm:0 "Unite the Wilds!"
 DATAW_unify_chasind_kingdom_decision_desc:0 "Seldom have the Chasind tribes united under a single leader, but when they have, they have been a force to be reckoned with.\n\nA more permanent unification - should there be someone with the mettle to accomplish it - would allow the Chasind to finally make their mark on history."
 DATAW_unify_chasind_kingdom_decision_tooltip:0 "The Chasind are united as one."
 DATAW_unify_chasind_kingdom_decision_effect_tooltip:0 "The Chasind are united as one"

# Unify Chasind Event Loc
 major_decisions.2443.t:0 "Hen Wlad Fy Nhadau"
 major_decisions.2443.desc:0 "My people have ranged the wilds since time immemorial.\n\nTo our kinsmen in the hills and the central valley, our homeland seems treacherous and all but unnavigable. Yet to we of the [GetGlobalVariable('chasind_culture_var').Culture.GetName], it has a savage beauty of its own; the forest and the wetlands are good to us and share their bounty freely. Why, then, should we live apart - each tribe with its own shaman, its own village or hold - when history has shown we can achieve so much together?\n\nI have sought to answer that question, and here before the gods, let my [GetPlayer.GetTitleAsNameNicknamedNoTooltip]-ship be the reply."
 major_decisions.2443.a:0 "Henceforth, the Chasind stand together!"

