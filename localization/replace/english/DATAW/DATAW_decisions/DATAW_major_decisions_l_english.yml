 # Summon sylvans to fight!

 summon_spirits_decision:0 "Summon the Aid of the Forest"
 summon_spirits_decision_confirm:0 "Lady of the Forest, hear my plea…"
 summon_spirits_decision_desc:0 "As the decades passed, the Spirits of the forest have been good to us. The White Lady hearing us to guide those lost in the night, the Bringer of Seeds helping a treatment come to fruition…\n\n However, when we see ourselves attacked by outside forces, we have called upon the spirits for a more… tangible help. \n\n Great trees thought to be immovable suddenly moving with the rage of a thousand warriors, ready to lend their incredible strength and power to protect those that worship them. \n\n  While most of them are wild and hostile to any creature, the few that lend their strength to us are invaluable allies worthy of the greatest of praise and the greatest of sacrifices.\n\n The time has come once again to call for the aid of such spirits. Let us pray that the answer we receive is favourable."
 summon_spirits_decision_tooltip:0 "Summon spirits of the forest"
 summon_spirits_decision_effect.tt:0 "Prepare a sacrifice to call upon the help of the spirits."
 sylvan_army:0 "Spirit Army"

# Hiring Mercenaries
# Ciriane Rebellion
# By Stocky Kruegar, written by Denvar

 DATAW_ciriane_rebellion_hiring_mercenaries:0 "Recruit Mercenaries"
 DATAW_ciriane_rebellion_hiring_mercenaries_confirm:0 "Hire them!"
 DATAW_ciriane_rebellion_hiring_mercenaries_desc:0 "The army of the [GetGeographicalRegion('custom_mareschois_population').GetName] can simply never match the scale of the Empire of [GetTitleByKey('e_orlais').GetBaseNameNoTier]. We must scrape together any allies we can. We must also do so without raising the Empire’s suspicions. To do so, my advisors recommend entering into a secret pact with some mercenaries.\n\n#N Our contract cannot be public until the rebellion begins, so special precautions must be taken...#!"
 DATAW_ciriane_rebellion_hiring_mercenaries_tooltip:0 "Grants special mercenary contract to reinforce the player during rebellion"
 DATAW_ciriane_rebellion_hiring_mercenaries_tt:0 "This will trigger an event - allowing you to choose certain mercenary contracts to take! These Mercenaries will be spawned when you begin the rebellion! Proceed with caution - your recruitment money may be intercepted by Bandits. You will not be able to hire Mercenaries a second time, this Decision is One-Time use."

# United in Faith
# Ciriane Rebellion
# By Stocky Kruegar, written by Denvar

 DATAW_ciriane_rebellion_united_in_faith:0 "United in Faith"
 DATAW_ciriane_rebellion_united_in_faith_confirm:0 "To glory!"
 DATAW_ciriane_rebellion_united_in_faith_desc:0 "The Chantry has failed us. By returning to the old ways, we secure our independence and safety. Warriors flood to my capital, and to the strongholds of my vassals, begging for their chance to defend the faith.\n\n#N They will have it!#!"
 DATAW_ciriane_rebellion_united_in_faith_tooltip:0 "Grants you special soldiers"
 DATAW_ciriane_rebellion_united_in_faith_tt:0 "You gain the special soldiers #N Defenders of Ciriane#!"
 DATAW_ciriane_rebellion_united_in_faith.m: "Defenders of the Ciriane"

# Seek out Local Tribes
# Ciriane Rebellion
# By Stocky Kruegar, written by Denvar

 DATAW_ciriane_rebellion_seek_out_the_local_tribes:0 "Seek Out the Local Tribes"
 DATAW_ciriane_rebellion_seek_out_the_local_tribes_confirm:0 "We shall ask them!"
 DATAW_ciriane_rebellion_seek_out_the_local_tribes_desc:0 "While the [GetGlobalVariable('mareschois_culture_var').Culture.GetName] nobles tell stories of their [GetGlobalVariable('ciriane_culture_var').Culture.GetName] ancestry, those who’ve traveled the marshlands say there are still true tribesmen living in our lands. No one has ever been able to tell their true number or power.\n\n#N For most, they exist only as folk tales and campfire stories.#!"
 DATAW_ciriane_rebellion_seek_out_the_local_tribes_tooltip:0 "You will seek to gain the respect of the local Ciriane tribes"
 DATAW_ciriane_rebellion_seek_out_the_local_tribes_tt:0 "You will undergo a number of trials and tribulations, the local tribes will test your worthiness."

# Ally with Serault/Alyons
# Ciriane Rebellion
# By Stocky Kruegar, written by Denvar

 DATAW_ciriane_rebellion_ally_with_serault:0 "Ally with Serault"
 DATAW_ciriane_rebellion_ally_with_serault_confirm:0 "To an alliance!"
 DATAW_ciriane_rebellion_ally_with_serault_desc:0 "Our neighbors to the west are one of two independent Mareschois rulers left standing. While separated from us by the border of the empire, the Seraudais are more like us than any noble in Val Royeaux. There is no reason why we should not stick up for one another.\n\nSerault is the more devout of our two neighbors. They are proud of their Ciriane heritage largely because they want to be tied to Andraste.\n\n#N As ally’s they would add righteous fury to our cause.#!"
 DATAW_ciriane_rebellion_ally_with_serault_tooltip:0 "Send a Courier to The Thousand-Windowed Castle"
 DATAW_ciriane_rebellion_ally_with_serault_tt:0 "You will negotiate a special alliance with the Duchy of Serault, with options to use your prestige as a method of convincing, gold, or even offer a county. If they refuse, you may accept the peace and move on, or begin a war for their entire land via the event chain."

 DATAW_ciriane_rebellion_ally_with_alyons:0 "Ally with Alyons"
 DATAW_ciriane_rebellion_ally_with_alyons_confirm:0 "To an alliance!"
 DATAW_ciriane_rebellion_ally_with_alyons_desc:0 "Our neighbors to the northwest are one of two independent Mareschois rulers left standing. While separated from us by the border of the empire, the Alyonnais are more like us than any noble in Val Royeaux. There is no reason why we should not stick up for one another.\n\nAlyons is the more prestigious of our two neighbors. They are well regarded in [GetTitleByKey('c_val_royeaux').GetBaseNameNoTier].\n\n#N They would be a welcome asset while playing the great game.#!"
 DATAW_ciriane_rebellion_ally_with_alyons_tooltip:0 "Send a Courier to Chateau Alyons"
 DATAW_ciriane_rebellion_ally_with_alyons_tt:0 "You will negotiate a special alliance with the Duchy of Alyons, with options to use your prestige as a method of convincing, gold, or even offer a county. If they refuse, you may accept the peace and move on, or begin a war for their entire land via the event chain."

# Rooting out Ciriane Rebels
# Ciriane Rebellion
# By Stocky Kruegar, written by Mel

 DATAW_ciriane_rebellion_cleansing_frontiers_serault:0 "Conquer Serault"
 DATAW_ciriane_rebellion_cleansing_frontiers_serault_confirm:0 "Serault is an existential threat."
 DATAW_ciriane_rebellion_cleansing_frontiers_serault_desc:0 "The vermin to the west are still standing in our way to victory. We cannot risk anything to go wrong, or anyone to wrong us. The empire must prosper at all cost. It’s up to me to root these vermin out and lead the way – I have been chosen for this task and only I can prevail."
 DATAW_ciriane_rebellion_cleansing_frontiers_serault_tooltip:0 "Secure the frontiers by conquering [GetTitleByKey('d_serault').GetBaseNameNoTier]."
 DATAW_ciriane_rebellion_cleansing_frontiers_serault_tt:0 "You #N immediately#! begin a war to conquer all of Serault and bring it down to heel #N for Orlais.#! You will prove your outstanding loyalty to the Empire by doing so. You will get a reward for this. Do note that if you fail to #N complete all these decisions#! by the time the War of the Dales begins, you will suffer from rebellions led by the Ciriane people."

 DATAW_ciriane_rebellion_cleansing_frontiers_alyons:0 "Conquer Alyons"
 DATAW_ciriane_rebellion_cleansing_frontiers_alyons_confirm:0 "Alyons is an immediate threat."
 DATAW_ciriane_rebellion_cleansing_frontiers_alyons_desc:0 "The vermin to the west are still standing in our way to victory. We cannot risk anything to go wrong, or anyone to wrong us. The empire must prosper at all cost. It’s up to me to root these vermin out and lead the way – I have been chosen for this task and only I can prevail."
 DATAW_ciriane_rebellion_cleansing_frontiers_alyons_tooltip:0 "Secure the frontiers by conquering [GetTitleByKey('d_alyons').GetBaseNameNoTier]."
 DATAW_ciriane_rebellion_cleansing_frontiers_alyons_tt:0 "You #N immediately#! begin a war to conquer all of Alyons and bring it down to heel #N for Orlais.#! You will prove your outstanding loyalty to the Empire by doing so. You may will a reward for this. Do note that if you fail to #N complete all these decisions#! by the time the War of the Dales begins, you will suffer from rebellions led by the Ciriane people."

# The Faith Secured
# Ciriane Rebellion
# By Stocky Kruegar, written by Ser Pounce

 DATAW_ciriane_rebellion_the_faith_secured:0 "The Faith Secured"
 DATAW_ciriane_rebellion_the_faith_secured_confirm:0 "Let our voices join as one in singing the Chant!"
 DATAW_ciriane_rebellion_the_faith_secured_desc:0 "At last, I have completed the work that Emperor Drakon I started. The disorganized vestiges of individual Maker cults have been brought together as one, under the auspices of the Chantry and the Divine in Val Royeaux. Andraste herself would surely smile to see this - where once there was disunity, there is now harmonious concord."
 DATAW_ciriane_rebellion_the_faith_secured_tooltip:0 "Grants you special soldiers"
 DATAW_ciriane_rebellion_the_faith_secured_tt:0 "You gain the special soldiers #N Defenders of the Chantry#!"
 DATAW_ciriane_rebellion_the_faith_secured_tt_2:0 "With this decision, you are a step closer towards preventing a Ciriane revolt when the War of the Dales breaks out. The more decisions you complete, the fewer soldiers will rise against you. #Z Complete all of them successfully, in order to entirely prevent an uprising.#!"
 DATAW_ciriane_rebellion_the_faith_secured.m: "Defenders of the Chantry"

# The Faith Secured
# Ciriane Rebellion
# By Stocky Kruegar, written by Reside

 DATAW_ciriane_rebellion_plan_sabotage_against_nahashin:0 "Plan Sabotage Against Nahashin"
 DATAW_ciriane_rebellion_plan_sabotage_against_nahashin_confirm:0 "I answer your call, servant of Somisarian..."
 DATAW_ciriane_rebellion_plan_sabotage_against_nahashin_desc:0 "Nahashin is still loyal to Orlais, but Those who hide amongst the Marshes never rest, for the will of Somisarian is to see the land of Nahashin free from those who forgot her.\n\nMany agents sent me encrypted messages, informing me of a few plans they would like my help with to sabotage the duke and his love of those perfumed rats of the East.\n\n#N The only thing I need to do is answer.#!"
 DATAW_ciriane_rebellion_plan_sabotage_against_nahashin_tooltip:0 "Sabotage Nahashin"
 DATAW_ciriane_rebellion_plan_sabotage_against_nahashin_tt:0 "You will have options to sabotage Nahashin in several different ways, such as: reducing their army size & county control, increasing upkeep, lowering their popular opinion, etc."

# Culling the Tribes
# Ciriane Rebellion
# By Stocky Kruegar, written by Reside

 DATAW_ciriane_rebellion_culling_the_tribes:0 "Culling the Tribes"
 DATAW_ciriane_rebellion_culling_the_tribes_confirm:0 "Summon my generals!"
 DATAW_ciriane_rebellion_culling_the_tribes_desc:0 "There has always been rumours of tribes following the old faith of the [GetGlobalVariable('ciriane_culture_var').Culture.GetName] here in Nahashin. Some that, to this day, follow the will of the old gods of our past, led by Somisarian, queen of the sun and moon.\n\nHowever, the rumours have proven to be reality, as the old nomadic tribes, stubbornly clinging to the ways of the past, have surfaced to aid the nativist sentiment among the [GetGlobalVariable('mareschois_culture_var').Culture.GetName].\n\n#N This must not be tolerated any further, for the safety of both the Empire and our salvation is at stake if we let those tribes act any longer.#!"
 DATAW_ciriane_rebellion_culling_the_tribes_tooltip:0 "Culling the Tribes"
 DATAW_ciriane_rebellion_culling_the_tribes_tt:0 "You will fire an event to weaken the [GetGlobalVariable('ciriane_culture_var').Culture.GetName] tribes overtime. This will reduce the county control of the region you select in the event over the span of a year. You must keep it raised above a certain threshold (50%), to successfully cull the tribe in that county. #X Successfully keeping county control above the threshold (50%) for all three will weaken the rebellion that spawns upon the War of the Dales, and is a step towards avoiding it entirely.# This decision is ONLY available in 2:5 Glory, as how long it can take!"

# Expanding the Kingdom of Nahashin
# Ciriane Rebellion
# By Stocky Kruegar, written by Korin & Reside

 DATAW_ciriane_rebellion_expanding_the_kingdom_of_nahashin:0 "Expanding the Kingdom of Nahashin"
 DATAW_ciriane_rebellion_expanding_the_kingdom_of_nahashin_confirm:0 "Send forth my soldiers."
 DATAW_ciriane_rebellion_expanding_the_kingdom_of_nahashin_desc:0 "For decades, our people have been under the rule of Orlais, losing much of their territory and power. Now that we are free from this court of vipers, the time has come to restore the Kingdom of Nahashin to an empire eclipsing the one with its seat in Val Royeaux."
 DATAW_ciriane_rebellion_expanding_the_kingdom_of_nahashin_tooltip:0 "Expanding the Kingdom of Nahashin"
 DATAW_ciriane_rebellion_expanding_the_kingdom_of_nahashin_tt:0 "After taking this decision, you will unlock all of the decisions to expand the Kingdom."

# Demand Subjugation of the Duchies
# Ciriane Rebellion
# By Stocky Kruegar, written by Korin & Reside

 DATAW_ciriane_rebellion_demand_subjugation_of_the_duchies:0 "Demand Subjugation of the Duchies"
 DATAW_ciriane_rebellion_demand_subjugation_of_the_duchies_confirm:0 "For a United Nahashin!"
 DATAW_ciriane_rebellion_demand_subjugation_of_the_duchies_desc:0 "The backwater Duchies of Serault and Alyons, long forgotten by Orlais, are rightfully part of the Kingdom of Nahasin as the shared kinship between us can be traced back to our Ciriane ancestors of old. Now we are free from Orlais, many of those in these distant Duchies would surely join us!"
 DATAW_ciriane_rebellion_demand_subjugation_of_the_duchies_tooltip:0 "Demand Subjugation of the Duchies"
 DATAW_ciriane_rebellion_demand_subjugation_of_the_duchies_tt:0 "After taking this decision, all independent Rulers in the Kingdom of Serault are given an option to join you or refuse which gives you a claim on them. Once you rule over [GetTitleByKey('k_serault').GetBaseNameNoTier], you will get claims to expand to the [GetTitleByKey('k_blasted_hills').GetBaseNameNoTier] and [GetTitleByKey('k_western_approach').GetBaseNameNoTier]"

# Claim the Northern Lands
# Ciriane Rebellion
# By Stocky Kruegar, written by Korin & Reside

 DATAW_ciriane_rebellion_claim_the_northern_lands:0 "Claim the Northern Lands"
 DATAW_ciriane_rebellion_claim_the_northern_lands_confirm:0 "The Hills will be Ours Again."
 DATAW_ciriane_rebellion_claim_the_northern_lands_desc:0 "The Blasted Hills, once the Northern reaches of the Ciriane lands, hold many rich mines and caves that rightfully belong to us. If we are able to retake these lands, we would be one step closer to a [GetPlayer.GetCulture.GetName] Empire."
 DATAW_ciriane_rebellion_claim_the_northern_lands_tooltip:0 "Claim the Northern Lands"
 DATAW_ciriane_rebellion_claim_the_northern_lands_tt:0 "By taking this decision, you officially are recognised as the rightful ruler over these lands. This will assist in your making of a [GetPlayer.GetCulture.GetName] Empire, and also give every county in this region a 25 year conversion boost."

# Claim the Southern Lands
# Ciriane Rebellion
# By Stocky Kruegar, written by Korin & Reside

 DATAW_ciriane_rebellion_claim_the_southern_lands:0 "Claim the Southern Lands"
 DATAW_ciriane_rebellion_claim_the_southern_lands_confirm:0 "The Approach will be under Nahashin."
 DATAW_ciriane_rebellion_claim_the_southern_lands_desc:0 "The Western Approach, once a land of plenty, has lost much of its luster thanks to the vile taint of the Darkspawn. However it was once our land and should return to us, as the history and burial grounds left behind there should be reclaimed for our people."
 DATAW_ciriane_rebellion_claim_the_southern_lands_tooltip:0 "Claim the Southern Lands"
 DATAW_ciriane_rebellion_claim_the_southern_lands_tt:0 "By taking this decision, you officially are recognised as the rightful ruler over these lands. This will assist in your making of a [GetPlayer.GetCulture.GetName] Empire, and also give every county in this region a 25 year conversion boost."

# Form the Empire of Ciriane
# Ciriane Rebellion
# By Stocky Kruegar, written by Korin & Reside

 DATAW_ciriane_rebellion_form_the_empire_of_ciriane:0 "Form the Empire of the [GetPlayer.GetCulture.GetName]"
 DATAW_ciriane_rebellion_form_the_empire_of_ciriane_confirm:0 "The [GetPlayer.GetCulture.GetName] are united."
 DATAW_ciriane_rebellion_form_the_empire_of_ciriane_desc:0 "A [GetPlayer.GetCulture.GetName] Empire, a dream that until recently would have remained that. However now I can almost grasp it. If I manage to bring together the ancient lands of the Ciriane people, the balance of power in Orlais, nay maybe even all of Thedas, will remain forever shifted."
 DATAW_ciriane_rebellion_form_the_empire_of_ciriane_tooltip:0 "Form the Empire of the [GetPlayer.GetCulture.GetName]"
 claimed_southern_lands_decision_tooltip:0 "If you have claimed the Southern Lands, and hold the title of [GetTitleByKey('k_western_approach').GetBaseNameNoTier] or fully control its de jure land, it will become de jure [GetTitleByKey('e_nahashin').GetBaseNameNoTier]"
 claimed_northern_lands_decision_tooltip:0 "If you have claimed the Northern Lands, and hold the title of [GetTitleByKey('k_blasted_hills').GetBaseNameNoTier] or fully control its de jure land, it will become de jure [GetTitleByKey('e_nahashin').GetBaseNameNoTier]"

# Reforming the Ciriane Religion
# Ciriane Rebellion
# By Stocky Kruegar, written by Korin & Reside

 DATAW_ciriane_rebellion_reforming_the_ciriane_religion:0 "Reforming the Ciriane Religion"
 DATAW_ciriane_rebellion_reforming_the_ciriane_religion_desc:0 "Nahashin is independent now, and the old faith has been revealed anew, for we no longer need to hide the practitioners of Somisarian.\n\nYet the faith has diverged plenty throughout the ages, as tribes understood the teachings differently and told legends in different ways. If we desire for our faith to truly stand the test of time and return to our people, we need to stamp out those divergences.\n\n#N While the people could very well brand me as a corruptor for changing their beliefs, it is a risk worth taking if we desire our religion to survive.#!"
 DATAW_ciriane_rebellion_reforming_the_ciriane_religion_confirm:0 "It is time to reinvent our faith!"
 DATAW_ciriane_rebellion_reforming_the_ciriane_religion_tt:0 "You will begin a event chain to Reform the Ciriane Religion, with options to tie it to Andraste or not."
 DATAW_ciriane_rebellion_reforming_the_ciriane_religion_tooltip:0 "Reforming the Ciriane Religion"
 faith_conversion_unreformed_tt:0 "Your [faith|E] is [GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName] (NOT [organized|E])"

#  Drain the Northern Marshes
# Ciriane Rebellion
# By Stocky Kruegar, written by Korin & Reside

 DATAW_ciriane_rebellion_drain_the_northern_marshes:0 "Drain the Northern Marshes"
 DATAW_ciriane_rebellion_drain_the_northern_marshes_desc:0 "The Nahasin Marshes have long been seen as a backwater province compared to some of the jewels of Orlais. However, with a lot of work and some of the finest engineers' money can buy, we can turn large parts of these wetlands into areas of arable land, ready to be developed by the newly freed [GetPlayer.GetCulture.GetName] people!\n\n#N The work will be arduous but if managed well, the benefits of such a project could be seen developmentally for generations to come.#!"
 DATAW_ciriane_rebellion_drain_the_northern_marshes_confirm:0 "Begin the work!"
 DATAW_ciriane_rebellion_drain_the_northern_marshes_tt:0 "Begins event chain for Draining the North Marshes. This affects the Duchies of [GetTitleByKey('d_archambon').GetBaseNameNoTier] and [GetTitleByKey('d_eudolon').GetBaseNameNoTier] and gives them a development boost at the end of the event chain. This will take place over five years with an obstacle event every two years."
 DATAW_ciriane_rebellion_drain_the_northern_marshes_c_tt:0 "You are NOT in another event chain for Draining the Marshes."
 DATAW_ciriane_rebellion_drain_the_northern_marshes_tooltip:0 "Drain the Northern Marshes"

 # Drain the Southern Marshes
# Ciriane Rebellion
# By Stocky Kruegar, written by Korin & Reside

 DATAW_ciriane_rebellion_drain_the_southern_marshes:0 "Drain the Southern Marshes"
 DATAW_ciriane_rebellion_drain_the_southern_marshes_desc:0 "The Nahasin Marshes have long been seen as a backwater province compared to some of the jewels of Orlais. However, with a lot of work and some of the finest engineers' money can buy, we can turn large parts of these wetlands into areas of arable land, ready to be developed by the newly freed people of Nahashin!\n\n#N The work will be arduous but if managed well, the benefits of such a project could be seen developmentally for generations to come.#!"
 DATAW_ciriane_rebellion_drain_the_southern_marshes_confirm:0 "Draw up the plans!"
 DATAW_ciriane_rebellion_drain_the_southern_marshes_tt:0 "Begins event chain for Draining the North Marshes. This affects the Duchies of [GetTitleByKey('d_claose').GetBaseNameNoTier] and [GetTitleByKey('d_henar').GetBaseNameNoTier] and gives them a development boost at the end of the event chain. This will take place over five years with an obstacle event every two years."
 DATAW_ciriane_rebellion_drain_the_southern_marshes_tooltip:0 "Drain the Southern Marshes"


###################################
# Reclaim the Simmard Lineage
# Morreau restoration path
# By Rislav, written by Reside
###################################

 DATAW_reclaim_simmard_lineage_decision:0 "Reclaim the Simmard Lineage"
 DATAW_reclaim_simmard_lineage_decision_desc:0 "Ever since the fateful massacre that left Montsimmard a shell of its former self, the [ROOT.Char.GetDynasty.GetName] dynasty has laid in ruins, only alive through my branch, the [ROOT.Char.GetHouse.GetName]. We have struggled with the hand the darkspawn dealt us through their attack and the suffering that the elves inflicted through their inaction - and have prevailed in spite of it all. Now, a successor to House Simmard rules in the Capital of the South once more, no longer ruled by the illegitimate Aureliens! It is time for our glorious name to be used once again."
 DATAW_reclaim_simmard_lineage_decision_confirm:0 "House Simmard rules and lives once more!"
 DATAW_reclaim_simmard_lineage_decision_tooltip:0 "Reclaim our ancestors' glory!"
 DATAW_reclaim_simmard_lineage_tt:0 "Lay Claim to your Simmard Ancestry!"






