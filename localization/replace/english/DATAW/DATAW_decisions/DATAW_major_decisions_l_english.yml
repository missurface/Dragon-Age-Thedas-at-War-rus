 DATAW_integrate_crescent_valley: "Integrate the Crescent Valley"
 DATAW_integrate_crescent_valley_tooltip: "Integrate the Crescent Valley"
 DATAW_integrate_crescent_valley_desc: "Since the founding of the Orlesian Empire it has been Jader's legal right, granted by Kordillus I himself, to hold dominion over the [GetTitleByKey('d_crescent_valley').GetBaseNameNoTier]. The local Avvar clans, however, have always resented our authority, raising arms whenever we step in to claim dominion.\n\nOur initial attempts to pacify the valley faltered during the final stages of the Second Blight, when Thane Aldenon Eagle-Eyed evicted our administrators through armed rebellion. Our hold on the region ever since has been precarious. We must take drastic action to rectify this state of affairs."
 DATAW_integrate_crescent_valley_confirm: "End this Travesty"
 DATAW_land_easier_to_convert_crescent: "Counties within [GetTitleByKey('d_crescent_valley').GetName] are easier to convert ([faith|E] and [culture|e]) for next 25 years"
 DATAW_jader_turn_tribes_into_castle: "[tribe|E] [holdings|E] within [GetTitleByKey('d_crescent_valley').GetBaseNameNoTier] are turned into [castle|E] [holdings|E]"
 DATAW_jader_reset_development: "Any [development|E] and [county|E] [control|E] within [GetTitleByKey('d_crescent_valley').GetName] is removed"

 DATAW_unite_the_bannorn: "Unite the Bannorn"
 DATAW_unite_the_bannorn_tooltip: "Unite Land of Banns"
 DATAW_unite_the_bannorn_desc: "Long have the myriad Banns of central Ferelden remained divided, squabbling over petty disputes, and as of yet there has been no Teyrn strong enough to unite the lot of them under one banner.\n\nOne could imagine the power and influence such a lord might wield, with all of the Bannorn unified under their command…"
 DATAW_unite_the_bannorn_confirm: "Unite Land of Banns"
 DATAW_unite_the_bannorn_tooltip_1: "Lands of [GetTitleByKey('k_w_bannorn').GetBaseNameNoTier] and [GetTitleByKey('k_e_bannorn').GetBaseNameNoTier] are united under [GetTitleByKey('k_bannorn').GetName]"
 DATAW_unite_the_bannorn_tooltip_2: ""

 DATAW_unite_clayne_tribes: "Unite Clayne Tribes"
 DATAW_unite_clayne_tribes_tooltip: "Unite Clayne Tribes"
 DATAW_unite_clayne_tribes_desc: "If a sufficiently strong leader were to arise from among the warring [GetGlobalVariable('clayne_culture_var').Culture.GetName] [tribes|E], a united [realm|E] might be forged from the chaos, capable of standing up to the caprice of our neighbors."
 DATAW_unite_clayne_tribes_confirm: "End millenias of Disunion"
 DATAW_unite_clayne_tribes_conquest_tooltip_trig: "You need to own at least #I 70%#! #I ([SCOPE.ScriptValue('70_percent_of_clayne_land')])#! of [GetGlobalVariable('clayne_culture_var').Culture.GetName] (and its children [cultures|E]) controled [counties|E] of [GetTitleByKey('e_ferelden').GetBaseNameNoTier].\nCurrently you own #I [SCOPE.ScriptValue('ruler_owned_clayne_land')]#!/#X [SCOPE.ScriptValue('all_clayne_land')]#! [counties|E]"
 DATAW_unite_clayne_tribes_mixed_tooltip_trig: "You and your [allies|E] need to own at least #I 70%#! #I ([SCOPE.ScriptValue('70_percent_of_clayne_land')])#! of [GetGlobalVariable('clayne_culture_var').Culture.GetName] (and its children [cultures|E]) controled [counties|E] of [GetTitleByKey('e_ferelden').GetBaseNameNoTier] additionally you also must own more than #I 40%#! #I ([SCOPE.ScriptValue('40_percent_of_clayne_land')])#! but less that #X 70%#! #X ([SCOPE.ScriptValue('70_percent_of_clayne_land')])#! of [GetGlobalVariable('clayne_culture_var').Culture.GetName] owned [counties|E].\nCurrently you own #I [SCOPE.ScriptValue('ruler_owned_clayne_land')]#!/#X [SCOPE.ScriptValue('all_clayne_land')]#! [counties|E] and you combined with your [allies|E] own #I [SCOPE.ScriptValue('all_ally_land_and_ruler_combined')]#!/#X [SCOPE.ScriptValue('all_clayne_land')]#! [counties|E]"
 DATAW_unite_clayne_tribes_peace_tooltip_trig: "You and your [allies|E] need to own at least #I 70%#! #I ([SCOPE.ScriptValue('70_percent_of_clayne_land')])#! of [GetGlobalVariable('clayne_culture_var').Culture.GetName] (and its children [cultures|E]) controled [counties|E] of [GetTitleByKey('e_ferelden').GetBaseNameNoTier] additionally you also cant own more than #X 40%#! #X ([SCOPE.ScriptValue('40_percent_of_clayne_land')])#! of [GetGlobalVariable('clayne_culture_var').Culture.GetName] owned [counties|E].\nCurrently you own #I [SCOPE.ScriptValue('ruler_owned_clayne_land')]#!/#X [SCOPE.ScriptValue('all_clayne_land')]#! [counties|E] and you combined with your [allies|E] own #I [SCOPE.ScriptValue('all_ally_land_and_ruler_combined')]#!/#X [SCOPE.ScriptValue('all_clayne_land')]#! [counties|E]"
 DATAW_unite_clayne_tribes_conquest_tooltip: "Your [vassals|E] will be more inclied to [scheme|e] or join [factions|E] against you\nYou get a major [opinion|E] malus with all your [vassals|E]\nEvery [vassal|E] [vassal_contract|E] (when appliable) is increased by one level\nHigh [dread|E] increases [feudal|E] [taxes|E] and [levies|E]"
 DATAW_unite_clayne_tribes_mixed_tooltip: "All your [allies|E] will become [vassals|E] under your [realm|E]\nYou get a minor [opinion|E] bonus with all your [vassals|E]\nEvery [powerful_vassal|E] or [kingdom|E] [title_tier|E] [vassal|E] can demand to be put on your [council|E]"
 DATAW_unite_clayne_tribes_peace_tooltip: "All your [allies|E] will become [vassals|E] under your [realm|E]\nYou will be placed under special [diarchy|E] in which strongest [vassal|E] shall become [diarch|E]\nYour [vassals|E] will be less inclied to [scheme|e] or join [factions|E] against you\nYou get a major [opinion|E] bonus with all your [vassals|E]\nEvery [powerful_vassal|E] or [kingdom|E] [title_tier|E] [vassal|E] can demand to be put on your [council|E], [diarch|E] excluded."
 DATAW_unite_clayne_tribes_before_req_tooltip: "Additional Effects of this [decision|E] will be shown upon meeting one of its requirements"

 DATAW_unite_brecilian_forest: "Reclaim the Brecilian Lands"
 DATAW_unite_brecilian_forest_tooltip: "Reclaim the Brecilian Lands"
 DATAW_unite_brecilian_forest_desc: "For as long as anyone can remember, the Brecilian people have been divided, isolated. For centuries, it has been this way, and we are proud of the traditions we have developed from our lives among the spirits.\nHowever, the encroachment of foreign people on our lands, some that say to follow a “Maker”, singular creator of everything, are threatening our way of life, along with a race of people with ears as sharp as knives. Now, the time has come to unite to preserve our way of life. Now, the Brecilians, and the Brùcilis Cultas, shall be united as one!"
 DATAW_unite_brecilian_forest_confirm: "The Spirits favour us!"
 DATAW_unite_brecilian_forest_faith_tt: "Your [faith|E] is [GetFaithByKey('brucilis_cultas').GetName], or was created from it"

 DATAW_subjugate_brecilian_forest: "The Barbarians Tamed"
 DATAW_subjugate_brecilian_forest_tooltip: "Subjugate the Brecilians under Tevinter rule"
 DATAW_subjugate_brecilian_forest_desc: "As our family settled in these faraway lands, inhabited by violent barbarians worshiping spirits, our future seemed grim. One of these tribes saw our magical talents and brought the Nanterius forward to lead them, but our family seemed doomed to fade into obscurity, fading, absorbed by the Savages of the South that call themselves "Brecilians". But we have not only survived, but thrived, and we now rule over the spirit-worshippers that plotted our doom. The Brecilian Forest is ours, and has been for long enough that no one can refute that claim. Now, the Brecilians will be tamed under a Despotate, no matter how far away from the Imperium, and only the barbarian's view of us will end up deciding if they are unruly subjects or not."
 DATAW_subjugate_brecilian_forest_confirm: "Those who oppose thee, Shall know the wrath of heaven."
 DATAW_imperial_subjugate_brecilian_forest_tt: "Your [faith|E] is [GetFaithByKey('imperial_chantry').GetName], or was created from it"

 DATAW_a_teyrn_of_the_seas_decision: "A Teyrn of the Seas"
 DATAW_a_teyrn_of_the_seas_decision_tooltip: "A Teyrn of the Seas"
 DATAW_a_teyrn_of_the_seas_decision_desc: "Brandel's Reach, due to its prime location on the edge of the Waking Sea, has always been a haven for raiders, smugglers and other unsavory types of seafarers, searching to escape the encumbering rules of the mainland. Now that Brandel's Reach is united via the reign of a local Arl, it is time for the creation of a unique type of Teyrn on Brandel's Reach. A Teyrn centered upon the sea and its prospects."
 DATAW_a_teyrn_of_the_seas_decision_confirm: "We are now Masters of the Waves and our own destiny!"
 DATAW_a_teyrn_of_the_seas_amaranthine: "If neither the Teyrnir of [GetTitleByKey('k_highever').GetBaseNameNoTier] nor the Kingdom of [GetTitleByKey('e_ferelden').GetBaseNameNoTier] exist, then the Arling of [GetTitleByKey('d_amaranthine').GetBaseNameNoTier] Holder must have at least #P 80#! [opinion|E] of you."
 DATAW_a_teyrn_of_the_seas_highever: "If the Kingdom of [GetTitleByKey('e_ferelden').GetBaseNameNoTier] doesn't exist but the Teyrnir of [GetTitleByKey('k_highever').GetBaseNameNoTier] does, then the Teyrnir of [GetTitleByKey('k_highever').GetBaseNameNoTier] Holder must have at least #P 80#! [opinion|E] of you."
 DATAW_a_teyrn_of_the_seas_ferelden: "If the Kingdom of [GetTitleByKey('e_ferelden').GetBaseNameNoTier] exists, then the Kingdom of [GetTitleByKey('e_ferelden').GetBaseNameNoTier] Holder must have at least #P 80#! [opinion|E] of you."

