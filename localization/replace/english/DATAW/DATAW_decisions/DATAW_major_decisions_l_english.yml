# Storm of the Wolf
# By Varren / Rislav
###########################

 storm_of_the_wolf_decision:0 "Storm of the Wolf"
 storm_of_the_wolf_decision_desc:0 "We've established ourselves as the new overlord of the eastern Frostbacks. We must bring them in line with our rule."
 storm_of_the_wolf_decision_confirm:0 "Divy up the spoils!"
 storm_of_the_wolf_decision_tooltip:0 "Decide how to rule your new lands with the help of your council."



