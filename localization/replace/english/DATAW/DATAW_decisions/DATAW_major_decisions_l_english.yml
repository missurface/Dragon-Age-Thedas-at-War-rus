 a_lowland_realm_decision:0 "A Lowland Realm"
 a_lowland_realm_decision_desc:0 "In order to offer peace to Edgehall, the need for stability is necessary. On all levels, be it social, diplomatic, territorial and economic, Edgehall needs to be at peace and prosper. Only when those matters are all resolved will Edgehall be secure, and a true realm will be born."
 a_lowland_realm_decision_confirm:0 "filler confirm"
