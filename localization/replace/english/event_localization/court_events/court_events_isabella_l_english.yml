l_english:
 court.4750.t:0 "I Need a Hero"
 court.4750.desc:0 "I notice my poet pacing up and down my throne room. [poet.GetSheHe|U] has been yelling at anyone who crosses the line [poet.GetSheHe] treads.\n\nAs I approach, I am met with literary fury: "Cross not my path unless you are a descending muse! Oh-" the poet's face lights up in elation. "You may have the inspiration I crave. My [ROOT.GetCharacter.GetLadyLord], I am seeking a theme for my next work."\n\n"Could you tell me who your favorite hero is?""
 court.4750.a:0 "Make up a story from the reign of Divine John!"
 court.4750.b:0 "Andraste! A ballad about her ride!"
 court.4750.c:0 "Verenas is such a daring figure!"
 court.4750.d:0 "The Archon of Tevinter was a man after my own heart."
 court.4750.e:0 "Philippe stories always bring a smile to my lips."
 court.4750.f:0 "Tell me of Tarius, the mage-poet!"
 court.4750.g:0 "Why, that would be myself, of course!"
 court.4750.h:0 "Why do we pay you if you cannot compose on demand?"

 court.4751.intro:0 "As per my request, my poet brings me a work inspired by"
 court.4751.topic.pope_joan:0 "Divine John,"
 court.4751.topic.lady_godiva:0 "Andraste,"
 court.4751.topic.sinbad:0 "Verenas,"
 court.4751.topic.caligula:0 "Archon of Tevinter,"
 court.4751.topic.nasreddin:0 "Philippe,"
 court.4751.topic.valmiki:0 "Tarius,"
 court.4751.topic.ruler_hero:0 "my heroic life,"
 court.4751.topic.unexpected:0 "but it is not as I expected."
 court.4751.ruler_character:0 "\n\nA brief flick through the illuminated manuscripts shows that I am featured alongside the hero as a character!\n\n"
 court.4701.pope_joan_desc:0 "As I glance at the illustrations, I realize the illuminations of John use my features for his face, as if it were my own! Your Poet leans towards me. "Your charms far exceed that of our Divine. As John's lover convinced him to dress as a woman and undertake study in Val Royaux, I grant you this text wishing the figure I am supposed to worship were you.""
 court.4701.ruler_hero_desc:0 "The poem is about how glorious I am while I sit in my throne and do absolutely nothing. After all, if the Royal rear moves too far afield, where shall we direct all those wishing to kiss it?"
 court.4751.topic.lady_godiva_desc:0 "You are riding alongside Andraste in this poem. Just as beautiful - but just as naked!"
 court.4751.topic.sinbad_desc:0 "I am a mysterious character Verenas encounters time and time again in his adventures. I am the creature hatching from the colossal Tainted egg. I am the Old Friend of the Boeric Ocean who clings to Verenas' shoulders for years. I am a captive of the man-eating giant."
 court.4751.topic.caligula_desc:0 "I am a character in the text, but I seem to take the role of a trusted magister of Tevinter, and a dear friend of the Archon. He seems to torments me with a whip, and unsavoury descriptions of my enjoyment seems to lead into a rather… audacious development of the narrative."
 court.4751.topic.nasreddin_desc:0 "The tales show Philippe riding behind me as I go about my courtly duties, making snide remarks at my every action from atop his donkey. I made a speech full of platitudes at a feast, and he yells 'the interlocutor is but breaking wind as he states the obvious!', then jokes at the futility of gorging oneself on food."
 court.4751.topic.valmiki_desc:0 "Like the folk tale from Tevinter that became legend, a hunter shoots a beautiful bird and I cannot help but spout out a couplet. I trip over a rock and exclaim a rhyme before hitting the ground. As the mage-poet composed the first poem by accident, it shows me composing spontaneous verses whenever I am caught off-guard."
 court.4751.b:0 "Perhaps I should set my sights on the Sunburst Throne..."
 court.4751.c:0 "I would be angry, but this is sure to win me admirers..."
 court.4751.c.tt:0 "Those attracted to you are sure to notice..."
 court.4751.d:0 "This is planting some impure thoughts in my mind."
 court.4751.e:0 "There is always something to be learned behind his jests."
 court.4751.f:0 "This is amusing, I'm sure the court will enjoy it."
 court.4751.g:0 "Ingrate!"
 court.4751.h:0 "This looks like prime tinder for my next fire."


