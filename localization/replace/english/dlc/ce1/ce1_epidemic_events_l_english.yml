 epidemic_events.5010.denerim: "The gentle tides of the Drakon River carry more than just silt and traders now. Bloated, sun-bleached corpses are deposited downriver, their agonized faces set in a silent rictus grin, popped buboes livid against the pale skin.\n\nThe old walls, so many times a guardian against incursion from the living, are now buttressed with the dead. The twisting, narrow streets have become a maze of stacked corpses, rats using the piles as both refuge and sustenance."
 epidemic_events.5010.minrathous: "Minrathous! Glorious Minrathous. The Capital of the World. Countless souls have walked these venerable roads, but the ranks of the dead swell more swiftly day by day. The scourge sweeps the streets, blighting every pretty plaza and glorious archway. The old marbles stand silently, helpless against the torture of the living. The dying rattle their last, on their lips the words scarcely dared thought of in better times:\n\n\"Just how perpetual is the Eternal City?\""
 epidemic_events.5010.val_royeaux: "Val Royeaux: The beautiful capital of Kordillus, founder of Orlais stands before me, and the beautiful and twisting buildings, laden with gold, marble and so many beauties as to make every stone feel unique are ever present and ever so beautiful to look at.\n\nThe only thing tainting the scene would be the piles of bodies, which seems to never run out of people as the carts constantly drive them out of the golden city to bury them in mass pires, where the bodies are burned, in a desperate plea to slow the deadly spreading."
 epidemic_events.5010.halamshiral: "When this great city was founded, it was named \"The end of the Journey\", for the elves believed it to be a new homeland after the Long Walk. Yet it is clear that disease will not follow this idea, as people can be seen all around in death's sweet embrace.\n\nThis may have been the end of the journey for the elves, but it is clear that it has greater ambitions than simply resting in those narrow streets.\n\n\nNestled within the Frostback Mountains, Edgehall was an outpost of the surface dwarves before the ravages of the First Blight violently disconnected the settlement from the Deep Roads. Alas, desolation has found its way even to this remote corner of the Frostbacks. As the [epidemic_scope.GetName|U] leaves its mark upon the denizens of Edgehall, I can find that there is no place, no matter how far removed from society, that can escape the clutches of disease."
 epidemic_events.5010.tombigbee: "Hidden away in the Korcari Wilds, the city of Tombigbee is the only major settlement nestled within the swamps and was originally founded by the Chasind. For years, its location was only known to the men and women of the Wilds, though for all their efforts, the gnarled hands of the [epidemic_scope.GetName|U] have found its grip around the throat of this secluded settlement"
 epidemic_events.5010.redcliffe: "Death has come to Redcliffe. The trade routes, once the source of the village's prosperity, now serve to deliver a terrible pestilence unto the inhabitants. Pyres burn ceaselessly along the shores of Lake Calenhad, yet there seems to be no end to the dead and dying. The stout walls of [capital.GetNameNoTierNoTooltip], so capable at repelling the blades and arrows of men, offer little defense against the sickness that now writhes its way through the [capital_region.GetDeJureLiege.GetTierAsNameNoTooltip|l]. Soon, there may not even be enough survivors to sustain this place. Has Redcliffe's final hour truly come?"
 epidemic_events.5010.nevarra_city: "The wails of the sick and dying carry through the air, from the Castrum Draconis down to the banks of the Minanter River. [capital.GetNameNoTierNoTooltip], ordinarily so full of life and color, has become a sepulcher. The statues of heroes long-dead look impassively upon the suffering of their descendants, their chiseled features seeming almost mocking to those who reach out to them with pleading, outstretched hands. The Mourn Watchers are a macabre sight, processing silently through the streets in their dark robes and skeletal masks, ferrying the corpses of the dead to their final resting place. The sight of them inspires dread rather than reassurance, as though they were some profane specters of death. Their destination - the Grand Necropolis - is overflowing, its tombs unprepared for the influx of bodies. How long until there is no one left to bury them?"
 epidemic_events.5010.montsimmard: "The place where the First Divine was born. The great Olessa of Montsimmard was born here, and as such, this city was built ever upward for the glory of the [orlesian_chantry.GetName]. Tales of its great Chantry, of the endless statues of the First Divine kneeling in front of the Maker's Bride and more run rampant across Thedas. Yet it was not glory that awaited me, but desolation. Above a city filled with the sick flew the banner of the [capital_region.GetHolder.GetDynasty.GetName] Dynasty, carried by the mountains' winds that failed so miserably to carry with them the stench of death. To have a city this holy be filled with disease is a travesty"
 epidemic_events.5010.andorals_reach_ruined: "This Tevinter fortress, named for the Tevene Old God of Unity, has lain in ruins ever since Andraste and her Alamarri followers embarked on their Exalted March against the Imperium. Its once daunting, spiked crenellations are in various states of disrepair, a shadow of the Tevinter Imperium's unchallenged glory days. The howls of the dying and those grieving their departed friends and loved ones hang in the air as they shelter within the ruins' dilapidated walls. They join the ancient dead who fought for their beliefs, a thought that brings little comfort to the living."
 epidemic_events.5010.andorals_reach_restored: "This fortress, named for the Tevene Old God of Unity, was sacked when Andraste and her Alamarri followers embarked on their Exalted March against the Imperium. Its daunting crenellations, once a ruined shade of the Tevinter Imperium, now hosts hundreds behind its restored walls. The howls of the dying and those grieving their departed friends and loved ones hang in the air as their hope for safety turns to ash in their mouths. The victims of the [epidemic_scope.GetName|U] join the ancient dead who fought for their beliefs, a thought that brings little comfort to the living left behind."
 epidemic_events.5010.ghislain: "Here I stand in the very heart of the breadbasket of the [capital_region.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetTierAsName]. [capital.GetNameNoTierNoTooltip|U]. All around me, I see endless decorations in glory to the plentiful fields of the region, bringing it wealth from beyond the imagination. The city is less a city than a collection of beautiful manors worthy of kings, accompanied by small houses used by the commoners.\nYet all I see are the diseased, some hiding in their homes in shame, others with no such luxury. The glory of [capital.GetNameNoTierNoTooltip|U] is tarnished by death's embrace."
 epidemic_events.5010.adamant: "The stout walls of Adamant Fortress soar in front of me, much like the griffons the Grey Wardens had emblazoned on their banners and carved into statues along these proud battlements. It is an impressive bastion built for one purpose: to repel Darkspawn.\n\nThe thick gates and dwarven-built walls can repel most assailants, though even these great walls cannot keep out disease. “In death, sacrifice.” The words ring hollow as the dead pile up, waiting to be cremated. Men and women from all walks of life stare back at me with eyes ringed by fatigue and tears. Only spirits roam its halls now, alongside the memories of those who gave their lives to protect us all from darkness."
 epidemic_events.5010.serault: "It is truly great desolation that struck [capital_region.GetNameNoTierNoTooltip|U]. The city, renowned for its glass, is one of the rare bits of civilization along its wonderful counterpart of Alyons on the Tirashan's border. Yet, it seems like disease has arrived, leading to death everywhere I can look. The glass is still made, and the corpses and sick are led away from the houses and streets, as if this continuation of life was an act of defiance against nature itself. Perhaps nature sees [capital_region.GetNameNoTierNoTooltip|U] as an abomination, and time will only tell if civilization will win over the dreaded forest."
 epidemic_events.5010.skyhold: "Few dare to ride the cable lift to the keep's high perch. And those who do stay well away from each other, shooting suspicious glances back & forth. The keep's courtyard is eerily silent, the usual spots for trading stalls replaced by burn pits for the dead. Most of the keep's residents refuse to stray far from their rooms, for fear the disease will meet them in some far off hallway."
 epidemic_events.5010.amaranthine.base: "The stone walls of [capital.GetNameNoTierNoTooltip|U] once again hold back an army, but this time one made of the sick & infirm. The keep's guards have become upset, seeing the sick peasants beg for shelter and dying outside the keep's gate. The caves below the keep have become catacombs, piling up with the plague's victims."
 epidemic_events.5010.amaranthine.non_avvar: "$epidemic_events.5010.amaranthine.base$\n\nSome swear that corpses are being pulled deeper into the caverns, but certainly they're only disappearing to rot and carrion."
 epidemic_events.5010.amaranthine.avvar: "$epidemic_events.5010.amaranthine.base$\n\nSlowly, corpses are disappearing, returning to Father Korth through the endless catacombs he dug beneath the Keep."

 epidemic_events.5900.t: "The Black Death"

 epidemic_events.5900.t: "The Blight Sickness"

 epidemic_events.5900.desc: "Pestilence stalks the land.\n\nGrisly, bubbling buboes grow upon the victims, whose pitiful calls for help are slowly stifled as they gutter and drown in their own pus-filled throats.\n\nFrom the lowliest urchin to the most fêted emperor, all dread the indiscriminate scythe of the merciless plague. Those that survive must watch helplessly as all around them perish.\n\nThe devoted look to the divine for a savior, and the powerful their riches, but none can truly be safe. Dreadful tendrils spread across the land, constricting it until it no longer breathes.\n\nThe Black Death is upon us. [ROOT.Char.GetFaith.HighGodName] save us all."
 epidemic_events.5900.christian: ""Our Father, who art in heaven, hallowed be thy name...""
 epidemic_events.5900.fallback: "May we persevere in these grim times."

