l_english:
 ra_magic_intro: "Magic Tutorial"
 ra_magic_intro_desc: "Dragon Age: Thedas at War uses a Magic system. Open the character window to receive a short tutorial on how [dataw_magic|EU] works in this mod."
 ra_magic_lore: "Magic Lore"
 ra_magic_lore_desc: "[Concept('mage','Mages')|E] are born, not made. To be a Mage, a character must have a [dataw_magic|EU] trait, such as $trait_magical_ability_good$#!, that can be passed on to their children. It is also possible to be born as a Mage to parents without any Magical traits."
 ra_magic_mana: "Mana"
 ra_magic_mana_desc: "[Concept('mage','Mages')|E] use [dataw_mana|EU] to cast spells. Mana is a resource that replenishes monthly, but will stop as it reaches the cap until it is depleted by spell casting or hostile effects. A Mage’s congenital trait will be the main influence on Mana regeneration, though it can be boosted by artifacts."
 ra_magic_lifestyle: "Magic Lifestyle"
 ra_magic_lifestyle_desc: "To cast spells, a Mage must first select the Magic [lifestyle|EU]. \n\nClick on the Magic Lifestyle to view the focuses and acquire perks. \n\nPerks are divided into the different Schools of Magic. Each perk represents a spell that a Mage can cast- some of them may be cast only in combat such as #S Chain Lighting#!, some of them may be during events or activities such as #S Mind Blast#!, and others like #S Heal#! may be cast freely. Spells have a limited range for casting that is not dependent on diplomatic range."
 ra_magic_lifestyle_no_GUI_highlight: "Magic Lifestyle"
 ra_magic_cast_spell: "Spell Casting"
 ra_magic_cast_spell_desc: "To cast a spell on a target, open up the interactions menu and find “Cast Spell” under Magic interactions. \n\nClick Cast Spell in the menu that opens. \n\nPress on the correct School of Magic to choose from the spells associated with it. For example, Heal belongs to the Creation School, while Chain Lighting belongs to the Primal School."
 ra_magic_prowess: "Magical Prowess"
 ra_magic_prowess_desc: "[dataw_magical_prowess|EU] represents how strong a [dataw_magic|EU] user is. When a [mage|EU] casts a spell upon another Mage, it is a Magical Prowess skill check, similar to how Diplomacy or other skill checks are performed. This affects spell discovery odds, the higher your Magical Prowess, the fewer odds of your spell being detected. Magical Prowess also increases the rate of Mana you regenerate. \n\nMagical Prowess skill checks only apply to hostile spells. Hostile spells are countered by [dataw_magical_resistance|EU]"
 ra_magic_spell_cooldown: "Spell Cooldown"
 ra_magic_spell_cooldown_desc: "Each spell can only be cast after a certain duration of time has passed. All spells have a cooldown which is defined by a character modifier. \n\nFor example, casting the #S Heal#! spell will give the Spell Caster a character modifier called #S Had Heal Cast#!; these can last from a day up to several years or even an entire lifetime, in which case they can never be cast again by the Spell Caster. \n\nOnce this modifier has expired, the spell can be cast again."
 ra_magic_religion: "Magic & Religion"
 ra_magic_religion_desc: "Each religion has a different view of how Magic should be used! Click on your [faith|E] icon to view your faith's magic doctrine. \n\nIn general, Andrastian religions will not take it kindly for Mages to cast spells to their hearts’ content, while others like the Vir’Evanuris do not mind. Of course, hostile spells will cause the target to greatly dislike the Mage that targeted them!"
 ra_magic_lore_open_UI_prompt: "Open the Character Window (highlighted)"
 ra_magic_focus_open_UI_prompt: "Select a focus"
 ra_magic_focus_open_spellbook_prompt: "Open the Spellbook"
 ra_magic_focus_spell_target_prompt: "Have a Spell Target Selected"
 ra_magic_focus_spell_caster_prompt: "Have a Spell Caster Selected"