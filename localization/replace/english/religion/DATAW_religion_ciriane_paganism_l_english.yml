 reformed_ciriane_paganism_adherent:0 "Ciriane Follower"
 reformed_ciriane_paganism_adherent_plural:0 "Ciriane Followers"
 reformed_ciriane_paganism_desc:0 "In a bid to be more accepted by neighboring rulers, some Ciriane pagans have begun extolling the masked hunter Andraste as one of their many gods. While these barbarians have yet to accept the light of the Maker into their faith, their ways are inoffensive enough to be ignored as a minor heresy by the Chantry."

