 way_of_cinders_desc:0 "With the harsh conditions on the Sea of Ash came a new faith, borne from the mind of the exiled and desperate Cendrerin. Their worship is of the Ash itself, a sacred ground in which everyone must come forward in help of each other, no matter the cost to them, even if the cost is death, so that knowledge be preserved amidst the Ash for the survival of a future generation."
