l_english:
 tenet_alamarri_paganism_religion_syncretic_name: "Alamarri Syncretism"
 tenet_alamarri_paganism_religion_syncretic_desc: "There is still much wisdom and virtue in following the old ways, for they carry the knowledge and traditions of our past. As such, these practices should be respected"
 doctrine_parameter_alamarri_paganism_religion_syncretic_actor_opinion_active: "Mutual [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] [opinion|E] bonus with Alamarri [faiths|E]"
 doctrine_parameter_is_alamarri_paganism_religion_faith_bilateral_loc_override: "Considers Alamarri [faiths|E], and is considered by Alamarri $game_concept_faiths$, to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] instead of $hostility_evil_tooltippable$"
 doctrine_parameter_hostility_override_alamarri_paganism_hostility_doctrine: ""
 doctrine_parameter_opinion_of_alamarri_paganism_religion_syncretic_recipient_opinion_active: ""
 doctrine_parameter_hostility_override_alamarri_hostility_doctrine: ""
 
