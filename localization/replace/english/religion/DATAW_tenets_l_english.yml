 tenet_andrastianism_religion_syncretic_name: "Andrastian Syncretism"
 tenet_andrastianism_religion_syncretic_desc: "Although we do not agree about its claim of the Maker being the sole creator of the World, the Chant of Light is still a text that brings much wisdom to Thedas, and as such, shouldn’t be disgraced"
