 doctrine_parameter_andrastianism_religion_syncretic_recipient_opinion_active:1 "Mutual [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] [opinion|E] bonus with [faiths|E] that have the $tenet_andrastianism_religion_syncretic_name$ [core_tenet|E]"
 doctrine_parameter_opinion_of_andrastianism_religion_syncretic_actor_opinion_active: ""

 tenet_elven_paganism_religion_syncretic_name: "Elven Paganism Syncretism"
 tenet_elven_paganism_religion_syncretic_desc: "The gods of Elvhenkind, although strange and many, tell of great virtues and wisdom that should be acknowledged as such, no matter our doubts on other matters."
 doctrine_parameter_hostility_override_special_doctrine_is_elven_paganism_faith:2 "Considers Elven Paganism [faiths|E], and is considered by Elven Paganism $game_concept_faiths$, to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] instead of $hostility_evil_tooltippable$"
