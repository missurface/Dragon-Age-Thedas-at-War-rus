 tenet_way_of_cinders_name: "Ash sacrifice"
 tenet_way_of_cinders_desc: "We believe that when one grows too old and weak to be a worthy asset to the community, it is accepted, and even encouraged, to enact a ritual suicide so that we may become a spirit of cinder, an Ash Wraith.\nWith a flawless black pearl in mouth to retain the Spirit on this side of the Veil, the body is prepared in prayer and abstinence for weeks, before being burned.\nWith the ashes of all our forefathers travelling the mountains and dunes of Thedas we call home, their wisdom still available to guide us."