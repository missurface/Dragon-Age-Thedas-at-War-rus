 tenet_alamarri_paganism_religion_syncretic_name: "Alamarri Syncretism"
 tenet_alamarri_paganism_religion_syncretic_desc: "There is still much wisdom and virtue in following the old ways, for they carry the knowledge and traditions of our past. As such, these practices should be respected."
 doctrine_parameter_hostility_override_special_doctrine_is_alamarri_faith:2 "Considers Alamarri [faiths|E], and is considered by Alamarri $game_concept_faiths$, to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] instead of $hostility_evil_tooltippable$"
 doctrine_parameter_alamarri_paganism_religion_syncretic_actor_opinion_active:1 "Mutual [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] [opinion|E] bonus with Alamarri [faiths|E]"
 doctrine_parameter_opinion_of_alamarri_syncretic_recipient_opinion_active: ""
 doctrine_parameter_alamarri_syncretic_recipient_opinion_active:1 "Mutual [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] [opinion|E] bonus with [faiths|E] that have the $tenet_alamarri_paganism_religion_syncretic_name$ [core_tenet|E]"
 doctrine_parameter_opinion_of_alamarri_paganism_religion_syncretic_actor_opinion_active: ""

 tenet_andrastianism_religion_syncretic_name: "Andrastian Syncretism"
 tenet_andrastianism_religion_syncretic_desc: "Although we do not agree about its claim of the [maker|E] being the sole creator of the World, the [chant_of_light|E] is still a text that brings much wisdom to [thedas|E], and as such, shouldn't be disgraced."
 doctrine_parameter_hostility_override_special_doctrine_is_andrastian_faith:2 "Considers Andrastian [faiths|E], and is considered by Andrastian $game_concept_faiths$, to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] instead of $hostility_evil_tooltippable$"
