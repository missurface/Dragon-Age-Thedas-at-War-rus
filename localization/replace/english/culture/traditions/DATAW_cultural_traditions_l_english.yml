 tradition_DATAW_gates_of_the_empire_name: "Gates of the Empire"
 tradition_DATAW_gates_of_the_empire_desc: "Within the mountain passes leading to Orlais, the Clayne built a series of settlements and forts to protect the fledgling Orlesian Empire under the prudent guidance of their leader, Isorath. Their Jaderian descendants, entrenched along the mountainous border of Orlais, became renowned as stalwart and deadly stewards by turning their blades and shields against their former Clayne kin. Only fools and arrogant warbands dare to attempt to pry open Jader's defenses that guard the heartlands of Orlais."
