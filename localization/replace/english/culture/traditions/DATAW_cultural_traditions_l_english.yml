l_english:
 #DATAW Traditions
 tradition_chasind_wilders_name: "Chasind Wilders"
 tradition_chasind_wilders_desc: "Long since diverged from their northern kin, the Chasind of the Korcari Wilds have become insular and isolated. Demonized abroad as cannibals and witches, they are in fact a deeply spiritual people who value survivalist skills above all other matters."

 tradition_guerrier_de_hauterin_name: "Guerre à la Hauterin"
 tradition_guerrier_de_hauterin_desc: "The Hauterin have always been closer to their Ciriane heritage, like their Mareschois cousins. Yet they have seen a very different history - War. Countless conflicts with darkspawn ravaging the Blasted Hills and beyond, border conflicts with Tevinter and Nevarra, and more, have forged the Hauterin into a culture which earns its glory not in the court, but on the battlefield. A battle for them is akin to a ball to an Orlesian, and falling in battle is the greatest shame. As such, the art of war is taught young, and well."

 tradition_suns_edge_name: "The Sun's Edge"
 tradition_suns_edge_desc: "The Borsol; The faithful on the edge of the sun, the edge of the empire, and Thedas itself. With their lives on the Deauvin Flats, the people have always seen Montsimmard as their capital of choice more than Val Royeaux, yet they still see themselves as part of the greater family of Orlais, united by Kordillus, and above all, the First Divine, Olessa of Montsimmard, born in the Capital of the South. Yet with the Flats came a love and reverence for the horse not seen anywhere else in Thedas, and have such developed a strange way of fighting - mounted archery. This technique, developed partly as a show of skill and discovered to be of surprising efficiency, is the signature way of recognizing the Borsol on the battlefield."


 tradition_fereldan_pride_name: "Fereldan Pride"
 tradition_fereldan_pride_desc: "The region of Ferelden is a melting pot of proud leaders and people; however, the one thing that stands above all is freedom. The Clayne of the Ferelden valley may be more "civilized" than their cousins in the hills and the wetlands, but they share their fractious nature and love of independence."
 tradition_last_of_the_elvhenan_name: "Last of the Elvhen"
 tradition_last_of_the_elvhenan_desc: "For the second time in recorded history, the Elvhen have a home. In the centuries since the Long March, these Dalish [elves|E] have busied themselves building a new home, learning their histories anew, and patrolling their borders."

 tradition_orlesian_opulence_name: "Orlesian Opulence"
 tradition_orlesian_opulence_desc: "In Orlais, appearances are everything. From simple outfits to grand gestures in public, everything is weighted based on first impressions. Social status is paramount, and Orlesians will do whatever they can to ensure that they get to the top and stay on top."

 tradition_elegance_empire_name: "Elegance of Empire"
 tradition_elegance_empire_desc: "Once seen as divided barbarians by the Imperium, the descendants of the Ciriane were united under Kordillus and not only rose to elegance, but went above and beyond to position Orlais as the new center of civilization in [thedas|E]. Now, their knights are the fairest, their courts the most elegant, and the words and ways of the Empire are the envy of all."

 tradition_tyrddas_children_name: "Tyrdda's Children"
 tradition_tyrddas_children_desc: "Permanence is an alien concept for the Avvar. In a world where home or marriage are merely temporary, they entrust their Skalds with the duty of cultivating history, transforming messy reality into pleasing and informative songs for future generations."

 tradition_walkers_of_the_lonely_path_name: "Walkers of the Lonely Path"
 tradition_walkers_of_the_lonely_path_desc: "Ever since the fall of the Dales, those [elves|E] who chose to remain free have been living a nomadic life. Isolated in small clans, roving the frontiers of [thedas|E], they nonetheless remain committed to remembering their heritage, and keeping the dream of the Dales alive."

 tradition_vir_tanadahl_name: "Vir Tanadahl"
 tradition_vir_tanadahl_desc: "The Vir Tanadhal is a philosophy often embraced by Dalish hunters to reflect the spirit of Andruil, the Elvhen goddess of the hunt. The three tenets of the Vir Tanadhal aim to instill in its adherents a deep respect for nature. The Way of the Arrow commands a hunter to be swift and silent, to strike true, and to never waver. The Way of the Bow reminds one to bend, but never break. And the Way of the Forest encourages all to receive the gifts of the hunt with mindfulness."


 tradition_whale_hunters_name: "Whale Hunters"
 tradition_whale_hunters_desc: "With the inviting sea right beside their home, rich with plenty of creatures ready to be hunted, this culture learned to hunt one of the biggest sea animals known to mortalkind, the mighty whales. Whale hunting, for this culture, is a pride and joy, as well as a source of sustenance and wealth."

 tradition_best_friends_worst_enemies_name: "Best Friends, Worst Enemies"
 tradition_best_friends_worst_enemies_desc: "The Ciriane present two masks to the world. One is for friends; loyalty, steadfast allegiance, and deep affection. The other is for foes; vengeance, fierce rivalry, and malicious plotting. A good Ciriane is one who can master both worlds in one lifetime."

 tradition_elder_council_name: "Elder Council"
 tradition_elder_council_desc: "This culture manages their affairs in the ancient style of the early human tribes, of a time long before [andraste|E]. Every free landholder of the realm has their say in the succession, and elders are both favoured heirs and heavily consulted advisors. In this realm, the Crown oversees more than it rules, and few would have it otherwise."

 tradition_wanderers_of_the_dry_sea_name: "Wanderers of the Dry Sea"
 tradition_wanderers_of_the_dry_sea_desc: "We Cendrerin have been exiled in the Sea of Ash long ago by the Névenais, yet we have learned to love the endless wandering that came with it. The next dune, the next statue carved into the rock of the soil itself, all are seen and enjoyed by us, and gave us much wisdom on how to traverse the land, how to fight across it, and so much more. To us, relinquishing our titles to wander the land is a prestigious act, for one enjoys the land in its purest form, and remembers how we once all lived."

 tradition_ancient_marshes_name: "Ancient Marshes"
 tradition_ancient_marshes_desc: "The Mareschois have always been closest to the Ciriane of old, to the point that some of Val Royeaux have read history books and claimed they have been left untouched in the marshes. Yet this is far from the truth. The Mareschois hold the Ciriane ways dear in their hearts, yes, but they have learned to live among the humid landscape of the northwest like no one else. They have learned to keep light, fight and use certain plants to preserve their health. They are a far cry from the rest of Orlais, almost barbaric, or at least that’s what most would like you to believe. For the Mareschois understand that preserving this reputation leads to them being underestimated, which can be invaluable in the Game."


 tradition_lords_of_the_field_name: "Lords of the Fields"
 tradition_lords_of_the_field_desc: "The Chanvalois, born from the fruitful fields of Ghislain, have always been masters of both agriculture and diplomacy. Every person that came to the realm of the Lords of the Fields tell tales of large plantations, nearing triple the size of Val Royeaux, and of sophisticated grand feasts, beautiful dresses and more. This reputation of extravagant beauty, riches and culture is the pride of the Chanvalois, and the plantation nobility have learned to use this reputation and wealth to their advantage."


 tradition_hunters_of_the_forgotten_sea_name: "Hunters of the Forgotten Sea"
 tradition_hunters_of_the_forgotten_sea_desc: "The people on the western side of the Gamord Mountains, the Névenais, are often forgotten by the people of Orlais and beyond. Isolated by the mountains and mostly trading with the Cendrerin nomads to their west, they have become increasingly protective of their regional identity, which can best be shown in their reverence for hunting, both in the mountains and among the waves. This reputation leaves them often forgotten and underestimated. Yet never underestimate the ones that hunt so frequently the whales of the Sundered Sea."

 tradition_devoted_prospectors_name: "Devoted Prospectors"
 tradition_devoted_prospectors_desc: "The Vandalarien have lost their dear Western Approach to the blight. What was once lush and green turned dry and dead. This once thriving and populated land died. Yet the Vandalarien live on. They will keep living, hunting, and above all, never will they forget the past. They will always remember it, delve into its deepest bowels and uncover secrets lost, artifacts left to dust and rust. Against all odds, the Vandalarien will find those ancient beauties, and emulate on them, for this is how they find their strength."

 tradition_forest_children_name: "The Forest’s Children"
 tradition_forest_children_desc: "Our people were born in the Brecilian forest, created by it. We Brecilians have learned to live among the trees, alongside the ever present magic that inhabits so many of our children, in order to fight those outsiders who threaten our home. We hunt, live and fight inside our beautiful forest, and we shall not submit to any that threatens us. Blessed be the Brecilian people, for we have learned to listen to the spirits’ wisdom. Blessed be the Brecilian people, for we have learned to make the most beautiful forests our homeland. Blessed be the Brecilian people, for we shall endure for all eternity."

 tradition_DATAW_a_way_of_our_own_name: "A Way of Our Own"
 tradition_DATAW_a_way_of_our_own_desc: "In the Ferelden Valley, the Alamarri arrived and made it their home. In the Frostbacks and the Korcari Wilds did the Alamarri settle as well. From them came Andraste, the warrior prophet that changed the religious landscape of the entirety of Thedas in a few centuries. Despite the fact that the Alamarri slowly diverged into a multitude of people, their independent spirit, attachment to their beliefs and pride remains, as well as their valour in battle, in all of their descendants."

 
