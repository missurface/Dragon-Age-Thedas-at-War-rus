 #DATAW Traditions
 innovation_war_mabari:0 "[war_mabari|E]"
 innovation_war_mabari_desc:0 "While some cultures would find the idea of enlisting their trusted companions into warfare, for the proud owners of mabari, there is no greater honor for their short-legged friends. Typically used as the first wave of their respective armies, they make for excellent companions in the vanguard and will faithfully follow their masters into death and possibly beyond."

#DATAW Traditions
 innovation_orlesian_sunrise:0 "Orlesian Sunrise"
 innovation_orlesian_sunrise_desc:0 "A bare face in Orlais is considered gauche, especially in the presence of a foreigner or, Maker forbid, a commoner. The Orlesian nobility is prone to wearing very elaborate masks in public. These masks are hereditary and identify one's family almost as uniquely as the heraldry on a crest."
 

