l_english:
 LOADING_TIP_0:0 "'Look at you. Like fat Dathrasi you feed and feed and complain only when your meal is interrupted. You do not look up. You do not see that the grass is bare. All you leave in your wake is misery. You are blind. I will make you see.' - The Arishok."
 LOADING_TIP_1:0 "'Beg that I succeed, for I have seen the throne of the gods, and it was empty.' - Corypheus"
 LOADING_TIP_2:0 "'There is nothing I would not do for my homeland.' - Loghain Mac Tir"
 LOADING_TIP_3:0 "'Yes, swooping is bad.' - Alistair Theirin"
 LOADING_TIP_4:0 "'War breeds fear. Fear breeds a desire for simplicity. Good and evil. Right or wrong. Chains of command.' - Solas"
 LOADING_TIP_5:0 "'No real god need prove himself. Anyone who tries is mad or lying.' - Solas"
 LOADING_TIP_6:0 "'I'd hoped for a war like in the tales! A king riding with the fabled Grey Wardens against a tainted god!' - Cailan Theirin"
 LOADING_TIP_7:0 "'Nobility does not exist without obligation. We owe everything we have, even our lives, to our land and people.' - Eamon Guerrin"
 LOADING_TIP_8:0 "'They will learn to fear what dwells in the marshes.' - Roux Marchette"
 LOADING_TIP_9:0 "'Men and women from every race, warriors and mages, barbarians and kings... the Grey Wardens sacrificed everything to stem the tide of darkness...and prevailed.' - Duncan"
 LOADING_TIP_10:0 "'Everyone loves Ninette! Sometimes twice a night.' - Jethann"
 LOADING_TIP_11:0 "'Men's hearts hold shadows darker than any tainted creature.' - Flemeth"
 LOADING_TIP_12:0 "'Believe in whatever you like; absent creators or whimsical gods. Follow prophets or ashkaari, or omens in the earth and sky. You will find wisdom only if you seek it.' - Sten"
 LOADING_TIP_13:0 "'In peace, vigilance. In war, victory. In death, sacrifice.' - Grey Wardens"
 LOADING_TIP_14:0 "'A good story, you don't really write. It was always there. You just uncover it.' - Varric Tethras"
 LOADING_TIP_15:0 "'We are the Dalish; keepers of the lost lore, walkers of the lonely path. We are the last of the Elvhenan, and never again shall we submit.' - Oath of the Dales"
 LOADING_TIP_16:0 "'The mages had sought to usurp Heaven, but instead they destroyed it. They were cast out, twisted and cursed by their own corruption. They returned as monsters, the first of the darkspawn.' - Duncan"
 LOADING_TIP_17:0 "'Enchantment?' - Sandal"
 LOADING_TIP_18:0 "'The Imperium is a land built upon secrets built upon falsehoods.' - Dorian Pavus"
 LOADING_TIP_19:0 "'I tell you truly, nothing but the integrity of our hearts will win the love of the Maker back to us. It is all the power we shall ever possess to change this world for good or for ill.' - Divine Renata I"
 LOADING_TIP_20:0 "'And so I have done as all mortals must, and looked to the words of His prophet for answers.' - Divine Justinia I"
 LOADING_TIP_21:0 "'I never wanted this job. Hunting demons was so much simpler than politics.' - Inquisitor Ameridan"
 LOADING_TIP_22:0 "'With each passing age, heroes like Shartan become more of a fable, but some of us will always know the truth.' - Sister Petrine"
 LOADING_TIP_23:0 "'Who would believe that these same banns, now trying so hard to kill one another, just last year united to give me the crown?' - Fionne Theirin"
 LOADING_TIP_24:0 "'Heaven by violence destroyed it. What was Golden and pure turned black.' - Threnodies 12:1"