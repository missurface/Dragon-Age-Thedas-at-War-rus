l_russian:
 LOADING_TIP_0:0 "«Посмотрите на себя. Подобно жирным датраси, вы всё едите и едите, а жалуетесь лишь тогда, когда вам мешают. Вы не поднимаете глаз. Не замечаете, что трава объедена дочиста. За вами остаются одни страдания. Вы слепы. Я заставлю вас увидеть». — Аришок"
 LOADING_TIP_1:0 "«Возжелай моего успеха, ибо видел я трон богов, и он был пуст». — Корифей"
 LOADING_TIP_2:0 "«Нет ничего, чего я не сделал бы ради родины». — Логэйн Мак-Тир"
 LOADING_TIP_3:0 "«Да, пикировать — это плохо». — Алистер Тейрин"
 LOADING_TIP_4:0 "«Война порождает страх. Страх рождает стремление к простоте. Добро и зло. Правда и ложь. Субординация». — Солас"
 LOADING_TIP_5:0 "«Истинному богу незачем доказывать свою божественность. Тот, кто пытается, — безумец или лжец». — Солас"
 LOADING_TIP_6:0 "«Я думал, это будет такая война, как в старинных сказках! Король, скачущий с отважными Серыми Стражами в битву против мерзкого бога тьмы!» — Кайлан Тейрин"
 LOADING_TIP_7:0 "«Благородство немыслимо без ответственности. Мы обязаны всем, что имеем, включая саму жизнь, нашей земле и нашему народу». — Эамон Геррин"
 LOADING_TIP_8:0 "«Они научатся бояться того, что обитает в болотах». — Ру Маршетт"
 LOADING_TIP_9:0 "«Мужчины и женщины всех рас, воины и маги, варвары и короли... Серые Стражи пожертвовали всем, чтобы остановить натиск тьмы... И одержали победу». — Дункан"
 LOADING_TIP_10:0 "«Все любят Нинетт! Иногда и дважды за ночь». — Джитанн"
 LOADING_TIP_11:0 "«В людских сердцах таятся тени темнее любого существа, поражённого скверной». — Флемет"
 LOADING_TIP_12:0 "«Верьте во что пожелаете: в отсутствующих творцов или прихотливых богов. Следуйте за пророками и ашкаари, ищите знамения в земле и небе. Мудрость откроется лишь тому, кто её ищет». — Стэн"
 LOADING_TIP_13:0 "«Победа в войне. Бдительность в мире. Жертвенность в смерти». — Серые Стражи"
 LOADING_TIP_14:0 "«Хорошую историю на самом деле не пишут. Она существовала всегда. Вы лишь раскрываете её». — Варрик Тетрас"
 LOADING_TIP_15:0 "«Мы Долийцы: хранители утраченных преданий, идущие одиноким путём. Мы последние из Элвенан, и никогда больше мы не склоним головы». — Клятва долийцев"
 LOADING_TIP_16:0 "«Маги попытались захватить Небеса, но вместо этого разрушили их. Они были изгнаны, искажённые и проклятые собственной скверной. Они вернулись чудовищами — первыми порождениями тьмы». — Дункан"
 LOADING_TIP_17:0 "«Колдовство?» — Сэндал"
 LOADING_TIP_18:0 "«Империя — земля, построенная на тайнах, возведённых на лжи». — Дориан Павус"
 LOADING_TIP_19:0 "«Истинно говорю вам: лишь чистота наших сердец способна вернуть нам любовь Создателя. Только этой силой мы можем изменить мир — к добру или ко злу». — Верховная жрица Рената I"
 LOADING_TIP_20:0 "«И потому я поступила так, как должны поступать все смертные: обратилась к словам Его пророчицы в поисках ответов». — Верховная жрица Джустиния I"
 LOADING_TIP_21:0 "«Я никогда не хотел этой должности. Охотиться на демонов было куда проще, чем заниматься политикой». — Инквизитор Америдан"
 LOADING_TIP_22:0 "«С каждым новым веком такие герои, как Шартан, становятся чем-то вроде сказки. Но некоторые из нас всегда будут знать правду». — Сестра Петрина"
 LOADING_TIP_23:0 "«И кто поверит, что те самые банны, которые так старательно режут друг другу глотки, лишь в прошлом году объединились, чтобы надеть на меня корону?» — Фионна Тейрин"
 LOADING_TIP_24:0 "«Те, кто хотели занять силою Небо, разрушили его. Что было златым и святым, стало чёрным». — Погребальные песни 12:1"